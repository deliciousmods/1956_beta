###---> The Roadへようこそ！ <><> <><> <><>
 r56.startup.event.01.title: "The Roadへようこそ！"
 r56.startup.event.01.description: "56チームからご挨拶！\n\n2つ以上の国がプレイヤーに操作されている場合、Modは自動的にマルチプレイヤーモードに切り替わります。このモードでは、いくつかの不均衡な要素が無効化され、AIのパフォーマンスが調整されます。\n\n§R--- 重要 ---\n§!このModは毎月7日/8日前後に公式アップデートされます。アップデートによってセーブデータが破損する場合があるため、その前にゲームやキャンペーンを終えることをお勧めします。ご理解ありがとうございます。さらに、新しい拡張/アップデートがリリースされると、私たちの更新が遅れることも覚えておいてください。\n\nまた、バグや問題が発生した場合は、他のModとの競合がないか確認してください。競合がない場合は、詳細をDiscordにてご報告ください。"
 r56.startup.event.01.option_auto: "続ける"
 r56.startup.event.01.option_tt: "私たちのModをプレイしていただきありがとうございます。素敵な一日を！"

###---> ...ちょっと待って！ <><> <><> <><>
 r56.startup.event.02.title: "...ちょっと待って！"
 r56.startup.event.02.description: "無料のDLC "Poland: United and Ready" が有効になっていないようです。これはModが正しく動作するための§R必須条件§!です。これらのDLCを有効にしてゲームを再起動してください。そうしないと重大な不具合が発生します。"
 r56.startup.event.02.option: "ゲームを終了して、言われた通りにします。"
 r56.startup.event.02.option_tt: "その方がいいぞ…"

###---> #3 >> ...AIが1941年にゲームを重くする要素を弱体化する発想を得る <><> <><> <><> 
 r56.startup.event.03.title: "これは見ちゃいけないものだ"
