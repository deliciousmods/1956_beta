l_spanish:
 PRU_ballot_poll:0 "Convocar las elecciones presidenciales"
 PRU_ballot_poll_desc:0 "Elige cómo llegar a las provincias. Los comités locales pueden llevar al APRA a las urnas y los prefectos pueden reunir una mayoría para Flores. Con cualquiera de las dos campañas puedes reconocer a Eguiguren o prorrogar el mandato de Benavides."
 PRU_ballot_apra_government_tt:0 "Víctor Raúl Haya de la Torre asume la presidencia. El PAP gobierna como comunista y suspende las elecciones."
 PRU_ballot_party_apra:0 "PAP"
 PRU_ballot_party_apra_long:0 "Partido Aprista Peruano"
 PRU_ballot_apra:0 "Admitir al APRA en las urnas"
 PRU_ballot_apra_desc:0 "Levanta la proscripción antes del escrutinio y permite que Haya de la Torre forme un gobierno aprista con apoyo sindical."
 PRU_ballot_eguiguren_government_tt:0 "Luis Antonio Eguiguren asume la presidencia. Su Partido Social Demócrata gobierna como democrático, con elecciones."
 PRU_ballot_party_eguiguren:0 "PSD"
 PRU_ballot_party_eguiguren_long:0 "Partido Social Demócrata"
 PRU_ballot_eguiguren:0 "Reconocer la victoria de Eguiguren"
 PRU_ballot_eguiguren_desc:0 "Cuenta los votos de los simpatizantes apristas. Benavides acepta el resultado y entrega el palacio a Luis Antonio Eguiguren."
 PRU_ballot_benavides_government_tt:0 "Óscar R. Benavides continúa al frente del gobierno no alineado. Las elecciones siguen suspendidas."
 PRU_ballot_party_benavides:0 "GB"
 PRU_ballot_party_benavides_long:0 "Gobierno de Benavides"
 PRU_ballot_benavides:0 "Anular el escrutinio y ratificar a Benavides"
 PRU_ballot_benavides_desc:0 "El Congreso anula el escrutinio y prorroga el mandato de Benavides. Esta vía sigue la sucesión histórica de Prado, Bustamante y Odría."
 PRU_ballot_flores_government_tt:0 "Luis Alberto Flores asume la presidencia. La Unión Revolucionaria gobierna como fascista y suspende las elecciones siguientes."
 PRU_ballot_party_flores:0 "UR"
 PRU_ballot_party_flores_long:0 "Unión Revolucionaria"
 PRU_ballot_flores:0 "Elegir a Luis Alberto Flores"
 PRU_ballot_flores_desc:0 "La Unión Revolucionaria obtiene la mayoría. Flores llega al palacio por las urnas y concentra el poder en el partido."
 PRU_ballot_apra_press:0 "Reabrir la prensa aprista"
 PRU_ballot_apra_press_desc:0 "Saca los periódicos de la clandestinidad y permite que los comités locales publiquen abiertamente."
 PRU_ballot_workers:0 "Instalar las juntas provinciales de trabajo"
 PRU_ballot_workers_desc:0 "Crea juntas provinciales donde obreros textiles y trabajadores de las haciendas puedan presentar sus reclamos salariales. Tanto Haya como Eguiguren pueden gobernar con ellas."
 PRU_ballot_apra_land:0 "Un pacto agrario"
 PRU_ballot_apra_land_desc:0 "Extiende el acuerdo provincial al campo. Las juntas agrarias atenderán los litigios entre comunidades y haciendas."
 PRU_ballot_civil_register:0 "Proteger los padrones electorales"
 PRU_ballot_civil_register_desc:0 "Entrega los padrones a funcionarios civiles y garantiza que un voto no pueda anularse por las simpatías que se le atribuyan."
 PRU_ballot_municipal:0 "Restituir la representación municipal"
 PRU_ballot_municipal_desc:0 "Permite que los concejos electos presenten en Lima sus presupuestos y peticiones. Tanto Haya como Eguiguren pueden dar ese papel a los municipios."
 PRU_ballot_civil_charter:0 "Una presidencia constitucional"
 PRU_ballot_civil_charter_desc:0 "Somete el gabinete al control del Congreso y garantiza la sucesión entre gobiernos civiles."
 PRU_ballot_extended_mandate:0 "Orden, paz y trabajo"
 PRU_ballot_extended_mandate_desc:0 "Benavides obtiene respaldo congresal hasta los siguientes comicios a cambio de un programa limitado de obras públicas."
 PRU_ballot_prado_government_tt:0 "Manuel Prado Ugarteche sucede a Benavides. Su gobierno civil es no alineado y restablece las elecciones."
 PRU_ballot_party_prado:0 "CC"
 PRU_ballot_party_prado_long:0 "Concentración Conservadora"
 PRU_ballot_prado:0 "Negociar una sucesión civil"
 PRU_ballot_prado_desc:0 "La sucesión de 1939 lleva a Manuel Prado al poder. Su administración civil debe abastecer a la industria mientras se interrumpe el comercio exterior."
 PRU_ballot_front_government_tt:0 "José Luis Bustamante y Rivero sucede a Prado. El FDN gobierna como no alineado, con elecciones."
 PRU_ballot_party_front:0 "FDN"
 PRU_ballot_party_front_long:0 "Frente Democrático Nacional"
 PRU_ballot_front:0 "Reunir al Frente Democrático"
 PRU_ballot_front_desc:0 "La coalición de 1945 lleva a José Luis Bustamante y Rivero al palacio. Le toca gobernar junto a los partidos que hicieron posible su victoria."
 PRU_ballot_odria_government_tt:0 "Manuel A. Odría depone a Bustamante. Su junta militar no alineada suspende las elecciones."
 PRU_ballot_party_odria:0 "JMG"
 PRU_ballot_party_odria_long:0 "Junta Militar de Gobierno"
 PRU_ballot_odria:0 "Entregar el mando a los jefes de guarnición"
 PRU_ballot_odria_desc:0 "La guarnición de Arequipa se pronuncia contra Bustamante. Odría asume el mando de la junta tras el golpe de octubre."
 PRU_ballot_ochonio:0 "Llevar las obras públicas a los barrios"
 PRU_ballot_ochonio_desc:0 "Tras los comicios de 1950, Odría impulsa escuelas, carreteras y edificios públicos. Las obras imponen nuevos gastos al Tesoro."
 PRU_ballot_convivencia_government_tt:0 "Manuel Prado Ugarteche vuelve para un segundo mandato. Su gobierno civil no alineado restablece las elecciones."
 PRU_ballot_party_convivencia:0 "MDP"
 PRU_ballot_party_convivencia_long:0 "Movimiento Democrático Pradista"
 PRU_ballot_convivencia:0 "Pactar la convivencia con los apristas"
 PRU_ballot_convivencia_desc:0 "La sucesión civil de 1956 devuelve a Prado al poder. Un entendimiento con los apristas reabre la vida parlamentaria."
 PRU_ballot_ur_branches:0 "Organizar los comités urristas"
 PRU_ballot_ur_branches_desc:0 "Encarga a los comités provinciales de la Unión Revolucionaria la movilización en favor de la presidencia."
 PRU_ballot_ur_accord:0 "Pactar con los industriales"
 PRU_ballot_ur_accord_desc:0 "Reúne a los industriales en torno a un acuerdo de producción nacional. Su respaldo puede servir tanto a Benavides como a Flores."
 PRU_ballot_ur_state:0 "El Estado corporativo"
 PRU_ballot_ur_state_desc:0 "Sustituye el pacto industrial por cámaras permanentes mediante las cuales la presidencia dirige a los grupos organizados."
 PRU_ballot_poll_patrons_tt:0 "Candidatos a caudillo: Flores, Haya, Villarán y Jorge Prado."
 PRU_ballot_apra_press_patrons_tt:0 "Candidatos a caudillo: Ravines y Churata."
 PRU_ballot_apra_land_patrons_tt:0 "Candidatos a caudillo: Huillca."
 PRU_ballot_civil_register_patrons_tt:0 "Candidatos a caudillo: Manuel Prado y Belaúnde."
 PRU_ballot_extended_mandate_patrons_tt:0 "Candidatos a caudillo: Ureta y Saldías."
 PRU_ballot_prado_patrons_tt:0 "Lavalle puede integrar el gabinete. Manuel Prado será elegible cuando deje la presidencia."
 PRU_ballot_front_patrons_tt:0 "Candidatos a caudillo: Odría y Belaúnde."
 PRU_ballot_ur_branches_patrons_tt:0 "Candidatos a caudillo: Ureta y Lavalle."
 PRU_ballot_shortcut:0 "Elecciones presidenciales"
 PRU_apra_revolution:0 "Agitación aprista"
 PRU_union_press:0 "Prensa sindical"
 PRU_labor_boards:0 "Juntas provinciales de trabajo"
 PRU_land_boards:0 "Juntas agrarias comunales"
 PRU_registers:0 "Padrones electorales"
 PRU_municipal_compacts:0 "Acuerdos municipales"
 PRU_constitutional_republic:0 "Gobierno constitucional"
 PRU_corporate_chambers:0 "Cámaras corporativas"
 PRU_industrial_accord:0 "Acuerdo industrial"
 PRU_corporatist_state:0 "Estado corporativo"
 PRU_program_extended_mandate:0 "Mandato prorrogado"
 PRU_program_wartime_presidency:0 "Presidencia en tiempos de guerra"
 PRU_program_front_government:0 "Gobierno del Frente Democrático"
 PRU_program_restoration_junta:0 "Junta Militar de Gobierno"
 PRU_program_public_works_state:0 "Obras públicas del Ochenio"
 PRU_program_return_to_congress:0 "Política de convivencia"
 PRU_ballot_candidate_eligible_tt:0 "El candidato está en el Perú, en activo y en libertad para asumir el cargo."
 PRU_ballot_vacate_popular_tt:0 "El nuevo presidente deja el puesto de caudillo popular y cesan sus modificadores."
 PRU_ballot_vacate_civil_tt:0 "El nuevo presidente deja el puesto de caudillo civil y cesan sus modificadores."
 PRU_ballot_vacate_military_tt:0 "El nuevo presidente deja el puesto de caudillo militar y cesan sus modificadores."
 PRU_ballot_committees:0 "Organizar los comités provinciales"
 PRU_ballot_committees_desc:0 "Imprime padrones en los locales sindicales y reúne personeros para el escrutinio. Estos comités abren a Haya una vía para competir en las urnas."
 PRU_ballot_prefects:0 "Movilizar a las prefecturas"
 PRU_ballot_prefects_desc:0 "Pide a cada prefecto que reúna a los notables de su provincia en torno a una lista. Flores puede aprovechar ese respaldo para llevar a la Unión Revolucionaria a las urnas."
 PRU_ballot_provincial_funds:0 "Financiar a las juntas departamentales"
 PRU_ballot_provincial_funds_desc:0 "Deja que las juntas departamentales preparen sus presupuestos. Pueden reunir respaldo provincial tanto para Benavides como para Flores."
