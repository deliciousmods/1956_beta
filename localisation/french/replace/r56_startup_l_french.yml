 ###---> ...hang on, there! <><> <><> <><>
 r56.startup.event.02.title: "...Attendez une minute!"
 r56.startup.event.02.description: "Il semble que vous n'ayez pas activé les DLC gratuits "Poland: United and Ready". C'est une §Rexigence§! pour que le mod fonctionne correctement. Veuillez redémarrer le jeu avec ces DLC activés ; sinon, de graves bugs apparaîtront."
 r56.startup.event.02.option: "Je vais retenir ces instructions, couper le jeu et les suivre."
 r56.startup.event.02.option_tt: "Bon, d'accord..."
 
