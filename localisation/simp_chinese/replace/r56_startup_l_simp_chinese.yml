 r56.startup.event.01.description: "来自56团队的问候！\n\n如果至少有两个国家由玩家控制，模组会自动切换到多人模式。该模式会禁用一些不平衡的内容，并包含一些AI性能优化。\n\n§R--- 重要 ---\n§!本模组会在每月7日/8日左右进行官方更新。我们建议您在此日期前完成游戏和战役，因为更新可能会导致存档损坏。感谢您的理解。此外，请注意，新扩展包/更新的发布通常会延迟我们的更新。\n\n另外，如果您遇到任何错误或问题，请确保没有模组冲突；如果没有，请在我们的Discord上详细报告。"
 r56.startup.event.01.option_auto: "继续"
 r56.startup.event.01.option_tt: "感谢您游玩我们的模组，祝您有美好的一天！"

