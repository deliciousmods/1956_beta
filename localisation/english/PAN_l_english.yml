###Ideas###
 PAN_the_protectorate_clause:0 "The Protectorate Clause"
 PAN_the_protectorate_clause_desc:0 "Under the Hay-Bunau-Varilla Treaty the United States guarantees our independence, and Article 136 of our 1904 Constitution lets it intervene in any part of the republic to restore public order. As recently as October 1925, American troops marched out of the Zone to break the renters' strike in Panama City. While that right stands, no Panamanian government is fully master in its own house."

###Dynamic Modifiers###
 PAN_canal_economy_dm:0 "Canal Economy"
 PAN_canal_economy_dm_desc:0 "The canal is both Panama's fortune and its frustration. Washington pays an annuity of 250,000 dollars for the Zone, but since the dollar was devalued in 1934 even that has been caught up in a dispute over payment in gold. Construction in the Zone brings work to Panama City and Colón, while the Zone's duty-free commissaries undercut our merchants on everything from cigarettes to beer."

###Focuses###
 PAN_the_policia_nacional:0 "The Policía Nacional"
 PAN_the_policia_nacional_desc:0 "Panama has had no army since 1904, when General Esteban Huertas's failed attempt to overthrow President Amador led the government, with American encouragement, to disband it. The national police corps founded that December has been the republic's only armed force ever since. Whatever Panama asks of its defenders, it will have to ask of these men."
 PAN_the_canal_question:0 "The Canal Question"
 PAN_the_canal_question_desc:0 "The Hay-Bunau-Varilla Treaty of 1903 gave the United States the Canal Zone in perpetuity, with all the powers it would have if it were sovereign, and the right to intervene in Panama itself. On March 2, 1936, our negotiators in Washington signed a new General Treaty that would end the protectorate and raise the canal annuity to 430,000 balboas, but the American Senate has yet to ratify it. Every Panamanian government is judged by how it answers the canal question."
 PAN_the_arosemena_administration:0 "The Arosemena Administration"
 PAN_the_arosemena_administration_desc:0 "Juan Demóstenes Arosemena, Harmodio Arias's foreign minister, won the presidency in an election the opposition denounced as a fraud. An old Liberal, he promises public works, schools and steady administration, and hopes results will quiet the doubts about how he came to power."
 PAN_arosemena_in_office_tt:0 "§YJuan Demóstenes Arosemena§! is president"
 PAN_the_escuela_normal_de_santiago:0 "The Escuela Normal de Santiago"
 PAN_the_escuela_normal_de_santiago_desc:0 "The schools of the interior can only grow as fast as the supply of teachers. A normal school at Santiago de Veraguas, begun in January 1937 and opened in June 1938, trains elementary teachers in the provinces rather than in the capital."
 PAN_the_university_of_panama:0 "The University of Panama"
 PAN_the_university_of_panama_desc:0 "Harmodio Arias founded the University of Panama in October 1935, and it still shares a wing of the Instituto Nacional. Funding new chairs in physics and mathematics, political economy and statistics, and new courses in legal medicine and criminal law, will make it a national university in more than name."
 PAN_the_central_american_games:0 "The Central American and Caribbean Games"
 PAN_the_central_american_games_desc:0 "In February 1938, Panama City hosts the fourth Central American and Caribbean Games. A national stadium and an Olympic pool are being built for the occasion, and the president himself will open the Games. For a few weeks, the region will look at Panama for something other than its canal."
 PAN_the_comarca_de_san_blas:0 "The Comarca de San Blas"
 PAN_the_comarca_de_san_blas_desc:0 "In February 1925 the Kuna of the San Blas coast rose against the national police, and the revolt ended only with American mediation. A law creating the Comarca de San Blas, like the one passed on September 16, 1938, gives the Kuna a recognized territory of their own within the republic and settles the question on Panama's terms rather than Washington's."

###Events###
 panama.1.t:0 "Arosemena \"Elected\""
 panama.1.d:0 "Democracy isn't worth preserving. \n\n After abandoning the party that got him elected in first place, Harmodio Arias Madrid decided to keep the power in his small circle of loyal followers and threw all of his support behind his foreign minister Juan Demóstenes Arosemena Barreati. Of course, winning an election against both the party you used to lead and the regular opposition would be quite of a challenge, but Madrid and Barreati were well prepared for the occasion - instead of relying on lazy and unreliable voters, Madrid just did it himself and manufactured his own votes. A few uppity citizens got upset about that and voiced their displeasure, but the detention of the most influential ones quickly shut them up. \n\nThe international community has been mute so far. Claiming that you support grand concepts like "democracy" or "freedom of expression" is easy, organizing embargoes or even military interventions is hard. Besides that, most foreign leaders are content with Barreati - a stable authoritarian regime is much more predictable than a democracy with constantly shifting leaders and values."
 panama.1.a:0 "¡Viva Barreati!"
 PAN_arosemena_takes_office_tt:0 "§YJuan Demóstenes Arosemena§! will take office as president on §YOctober 1, 1936§!."
 panama.2.t:0 "President Arosemena Takes Office"
 panama.2.d:0 "On October 1, 1936, Juan Demóstenes Arosemena was sworn in as President of the Republic, succeeding Harmodio Arias. The opposition has not forgotten how the June election was won, but the new president means to answer it with results: schools for the interior, hospitals for the cities and an orderly administration. In Washington, the General Treaty signed in March still waits for the Senate, and the canal will hang over his term as it has over every term before it."
 panama.2.a:0 "Order, schools and public works."
 panama.3.t:0 "Death of President Arosemena"
 panama.3.d:0 "President Juan Demóstenes Arosemena died in office in Penonomé on December 16, 1939, with less than a year left in his term. The Second Designate, Ezequiel Fernández Jaén, held the executive for two days until the First Designate, Augusto Samuel Boyd, took charge on December 18. A physician who founded the National Academy of Medicine and once presided over the National Assembly, Boyd will serve out the term until October 1940, while every faction prepares for the election that will choose Arosemena's true successor."
 panama.3.a:0 "The republic goes on."