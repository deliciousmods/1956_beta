l_english:
###Parties###
 PAN_fascism_party:0 "PNR"
 PAN_fascism_party_long:0 "Partido Nacional Revolucionario"

###Cosmetic Tags###
 PAN_ARIAS:0 "Republic of Panama"
 PAN_ARIAS_DEF:0 "the Republic of Panama"
 PAN_ARIAS_ADJ:0 "Panamanian"

###Characters###
 PAN_carlos_l_lopez:0 "Carlos L. López"
 PAN_tomas_gabriel_duque:0 "Tomás Gabriel Duque"
 PAN_jose_daniel_crespo:0 "José Daniel Crespo"
 PAN_narciso_garay:0 "Narciso Garay"
 PAN_jose_guillermo_batalla:0 "José Guillermo Batalla"
 PAN_domingo_diaz_arosemena:0 "Domingo Díaz Arosemena"
 PAN_nicolas_alejo_solano:0 "Nicolás Alejo Solano"
 PAN_chara_gonzalez:0 "Clara González"
 PAN_ricardo_j_alfaro:0 "Ricardo J. Alfaro"

###Ideas###
 PAN_the_protectorate_clause:0 "The Protectorate Clause"
 PAN_the_protectorate_clause_desc:0 "Under the Hay-Bunau-Varilla Treaty the United States guarantees our independence, and Article 136 of our 1904 Constitution lets it intervene in any part of the republic to restore public order. As recently as October 1925, American troops marched out of the Zone to break the renters' strike in Panama City. While that right stands, no Panamanian government is fully master in its own house."
 PAN_the_nationalized_retail_trade:0 "Nationalized Retail Trade"
 PAN_the_nationalized_retail_trade_desc:0 "Only Panamanian citizens may run a retail business. Panamanian owners are taking over most of the country's small shops, but Chinese, Indian and other foreign-born merchants are being forced out of the trade, and many are leaving the country altogether. Our trading partners have taken note."

###Dynamic Modifiers###
 PAN_canal_economy_dm:0 "Canal Economy"
 PAN_canal_economy_dm_desc:0 "The canal is both Panama's fortune and its frustration. Washington pays an annuity of 250,000 dollars for the Zone, but since the dollar was devalued in 1934 even that has been caught up in a dispute over payment in gold. Construction in the Zone brings work to Panama City and Colón, while the Zone's duty-free commissaries undercut our merchants on everything from cigarettes to beer."

###Focuses###
 PAN_the_policia_nacional:0 "The Policía Nacional"
 PAN_the_policia_nacional_desc:0 "Panama has had no army since 1904, when General Esteban Huertas's failed attempt to overthrow President Amador led the government, with American encouragement, to disband it. The national police corps founded that December has been the republic's only armed force ever since. Whatever Panama asks of its defenders, it will have to ask of these men."
 PAN_professionalize_the_police:0 "Professionalize the Police"
 PAN_professionalize_the_police_desc:0 "The National Police is the republic's only armed force, but it was built to keep order in the streets, not to fight. Regular pay, promotion by merit and proper training for its officers would turn it into a disciplined corps worthy of the name."
 PAN_the_maritime_police:0 "The Maritime Police"
 PAN_the_maritime_police_desc:0 "Panama has two long coastlines and almost nothing to patrol them with, and smugglers move goods past our customs houses on both oceans. A maritime section of the police, with launches of its own and a yard to build and repair them, would protect the republic's revenue and its shores."
 PAN_training_in_the_canal_zone:0 "Training in the Canal Zone"
 PAN_training_in_the_canal_zone_desc:0 "A large American garrison sits in the Canal Zone, a few miles from our police barracks. If our officers could train alongside the Americans, the National Police would learn more in a year than it has in decades."
 PAN_the_darien_jungle_companies:0 "The Darién Jungle Companies"
 PAN_the_darien_jungle_companies_desc:0 "Beyond the end of the road lies the Darién, a roadless wilderness of jungle, swamp and river that runs all the way to the Colombian border. Police companies trained to live and move in the jungle would give the republic a real hold on its own frontier."
 PAN_the_police_in_politics:0 "The Police in Politics"
 PAN_the_police_in_politics_desc:0 "No government in Panama can stand without the National Police behind it, and its commanders know it. A police chief who can choose presidents may one day decide to become one."
 PAN_the_guardia_nacional:0 "The Guardia Nacional"
 PAN_the_guardia_nacional_desc:0 "The National Police has become an army in all but name. Renaming it the Guardia Nacional and giving it a military organization would make that official, and make its commander the master of the republic's only armed force."
 PAN_the_remon_eisenhower_treaty:0 "The Remón-Eisenhower Treaty"
 PAN_the_remon_eisenhower_treaty_desc:0 "Remón took his demand to Washington: neither millions nor alms, but justice. The new treaty would raise the canal annuity to 1,930,000 dollars and set a single wage scale for Panamanian and American workers in the Zone. In return, the Americans would be allowed to use Río Hato for military maneuvers for fifteen years."
 PAN_the_question_of_sovereignty:0 "The Question of Sovereignty"
 PAN_the_question_of_sovereignty_desc:0 "Egypt has nationalized the Suez Canal, and the maritime powers met in London to decide its future without inviting Panama, though a great merchant fleet sails under our flag. Our government has declared that the republic is not bound by anything they decide. The canal runs through Panamanian soil, and the question of who is sovereign in the Zone can no longer be put off."
 PAN_the_remon_administration:0 "The Remón Administration"
 PAN_the_remon_administration_desc:0 "José Antonio Remón, the police commander who has made and unmade presidents, now holds the office himself. He promises order, development and a new bargain with Washington, and the National Police stands behind every word."
 PAN_the_remon_administration_trigger_tt:0 "Completes on its own when §YJosé Antonio Remón Cantera§! takes office."
 PAN_the_instituto_de_fomento_economico:0 "The Instituto de Fomento Económico"
 PAN_the_instituto_de_fomento_economico_desc:0 "A state development institute could lend to farmers and manufacturers, build silos for the countryside and work alongside the Banco Agropecuario to develop the interior. Remón means to show that a strong government can also be a productive one."
 PAN_tax_rich_and_poor_alike:0 "Tax Rich and Poor Alike"
 PAN_tax_rich_and_poor_alike_desc:0 "For decades the great families of Panama have paid as little tax as they pleased. Collecting what is owed from rich and poor alike would fill the treasury, though the oligarchy that once ran the republic will not forgive it."
 PAN_remon_in_office_tt:0 "§YJosé Antonio Remón Cantera§! is president"
 PAN_the_canal_question:0 "The Canal Question"
 PAN_the_canal_question_desc:0 "The Hay-Bunau-Varilla Treaty of 1903 gave the United States the Canal Zone in perpetuity and the right to intervene in Panama itself. A new General Treaty, negotiated in Washington, would end the protectorate and raise the canal annuity to 430,000 balboas, if the American Senate ratifies it. Every Panamanian government is judged by its answer to the canal question."
 PAN_the_arosemena_administration:0 "The Arosemena Administration"
 PAN_the_arosemena_administration_desc:0 "Juan Demóstenes Arosemena, Harmodio Arias's foreign minister, won the presidency in an election the opposition denounced as a fraud. An old Liberal, he promises public works, schools and steady administration, and hopes results will quiet the doubts about how he came to power."
 PAN_the_arosemena_administration_trigger_tt:0 "Completes on its own when §YJuan Demóstenes Arosemena§! takes office."
 PAN_arosemena_in_office_tt:0 "§YJuan Demóstenes Arosemena§! is president"
 PAN_the_escuela_normal_de_santiago:0 "The Escuela Normal de Santiago"
 PAN_the_escuela_normal_de_santiago_desc:0 "The schools of the interior can only grow as fast as the supply of teachers. A normal school at Santiago de Veraguas will train elementary teachers in the provinces rather than in the capital."
 PAN_the_university_of_panama:0 "The University of Panama"
 PAN_the_university_of_panama_desc:0 "Harmodio Arias founded the University of Panama in October 1935, and it still shares a wing of the Instituto Nacional. Funding new chairs in physics and mathematics, political economy and statistics, and new courses in legal medicine and criminal law, will make it a national university in more than name."
 PAN_the_central_american_games:0 "The Central American and Caribbean Games"
 PAN_the_central_american_games_desc:0 "Panama City is to host the fourth Central American and Caribbean Games. A national stadium and an Olympic pool must be built for the occasion, and the president himself will open the Games. For a few weeks, the region will look at Panama for something other than its canal."
 PAN_the_comarca_de_san_blas:0 "The Comarca de San Blas"
 PAN_the_comarca_de_san_blas_desc:0 "In February 1925 the Kuna of the San Blas coast rose against the national police, and the revolt ended only with American mediation. A law creating the Comarca de San Blas would give the Kuna a recognized territory of their own within the republic and settle the question on Panama's terms rather than Washington's."
 PAN_ratify_the_hull_alfaro_treaty:0 "Ratify the Hull-Alfaro Treaty"
 PAN_ratify_the_hull_alfaro_treaty_desc:0 "The General Treaty signed in Washington on March 2, 1936 would end the American guarantee of our independence and the right of intervention that comes with it, restrict the Zone's commissaries and raise the canal annuity to 430,000 balboas. For three years it has waited on the United States Senate. Once our National Assembly ratifies it, Washington will have to give its answer."
 PAN_limit_the_commissaries:0 "Limit the Commissaries"
 PAN_limit_the_commissaries_desc:0 "The General Treaty restricts sales at the Zone's commissaries to the employees of the canal and the Panama Railroad and their families, and bars new private businesses in the Zone that have nothing to do with the canal. Holding Washington to every word of it will return the Zone's trade to the merchants of Panama City and Colón."
 PAN_the_silver_roll_question:0 "The Silver Roll Question"
 PAN_the_silver_roll_question_desc:0 "The Zone pays its workers on two rolls: the gold roll, with higher wages, paid vacations and pensions, and the silver roll, with none of them. In 1935, of more than three thousand men on the gold roll, only 37 were Panamanians. The General Treaty commits Washington to equal opportunity for our citizens in the Zone, and we must make it honor that commitment."
 PAN_if_the_senate_ratifies_tt:0 "If the §YUnited States§! ratifies the treaty:"
 PAN_modify_canal_economy_tt:0 "Modify §YCanal Economy§! by:"
 PAN_general_treaty_in_force_tt:0 "The §YGeneral Treaty§! of 1936 is in force"
 PAN_the_arias_administration:0 "The Arias Administration"
 PAN_the_arias_administration_desc:0 "Arnulfo Arias Madrid, the Harvard-trained physician who helped overthrow the government in the coup of 1931, has won the presidency almost unopposed. He governs with the Partido Nacional Revolucionario behind him and a creed of his own, Panameñismo, and he means to remake the republic around it."
 PAN_the_arias_administration_trigger_tt:0 "Completes on its own when §YArnulfo Arias Madrid§! takes office."
 PAN_panamenismo:0 "Panameñismo"
 PAN_panamenismo_desc:0 "Panama for the Panamanians. Arias's doctrine asks that the republic be governed by and for its own people, with its own culture, its own language and its own economy, free of dependence on Washington or on the foreigners within its borders. Its admirers see a nation finally finding itself; its critics see something far uglier."
 PAN_a_new_constitution:0 "A New Constitution"
 PAN_a_new_constitution_desc:0 "The Constitution of 1904 was written in the shadow of the canal treaty, and its Article 136 still invites American intervention. Arias wants a new charter with a longer presidential term, a state able to direct the economy, and a narrower definition of citizenship. Rather than amend the old constitution slowly, he will put the new one straight to the people in a plebiscite."
 PAN_the_caja_de_seguro_social:0 "The Caja de Seguro Social"
 PAN_the_caja_de_seguro_social_desc:0 "Panama's workers have no public protection against sickness, old age or the loss of a breadwinner. A national social security fund would give them that protection, and give the republic its first system of social insurance."
 PAN_nationalize_the_retail_trade:0 "Nationalize the Retail Trade"
 PAN_nationalize_the_retail_trade_desc:0 "Much of the retail trade in Panama City and Colón is run by Chinese, Indian and other foreign-born merchants, and Arias's nationalists want it in Panamanian hands. Reserving retail commerce for citizens would please Panamanian shopkeepers, but it would drive out families who have traded here for decades and sour our name with our trading partners."
 PAN_the_banco_central_de_emision:0 "The Banco Central de Emisión"
 PAN_the_banco_central_de_emision_desc:0 "Since 1904 Panama has used the American dollar as its paper money, and the balboa exists only as a unit of account and a handful of silver coins. A central bank of issue would give the republic banknotes of its own and a measure of control over its own money, whatever Washington thinks of it."
 PAN_arias_in_office_tt:0 "§YArnulfo Arias Madrid§! is president"
 PAN_the_panamanian_registry:0 "The Panamanian Registry"
 PAN_the_panamanian_registry_desc:0 "Our shipping law lets foreign owners sail under the Panamanian flag at little cost. Since the American Neutrality Act of 1939 barred American ships from the war zones, American lines have moved scores of freighters onto our registry so they can keep carrying cargo to Britain. Every one of them pays its fees to Panama, and every one of them carries our flag into waters where the U-boats hunt."
 PAN_keep_our_ships_unarmed:0 "Keep Our Ships Unarmed"
 PAN_keep_our_ships_unarmed_desc:0 "Washington wants the ships under our flag armed against the U-boats. But a Panamanian flag on an armed ship would drag the republic into a war that is not ours. President Arias will forbid the arming of any merchant ship registered in Panama, whatever the Americans say."
 PAN_the_defense_sites_agreement:0 "The Defense Sites Agreement"
 PAN_the_defense_sites_agreement_desc:0 "The Americans want more than the Zone to defend the canal: airfields, gun emplacements and lookout posts across the republic, from the plains of Río Hato to the jungle. Leasing them for the duration of the war would bring American money and work to Panama, but every site is another patch of our soil under a foreign flag, and Washington will have to be held to its promise to leave once the fighting is over."
 PAN_the_de_la_guardia_government:0 "The De la Guardia Government"
 PAN_the_de_la_guardia_government_desc:0 "Ricardo Adolfo de la Guardia came to power without an election, and he knows it. He has ended Arias's quarrel with Washington and means to see the republic through the war at the side of the United States, with the National Police keeping order at home."
 PAN_the_de_la_guardia_government_trigger_tt:0 "Completes on its own when §YRicardo Adolfo de la Guardia§! takes power."
 PAN_arm_the_merchant_fleet:0 "Arm the Merchant Fleet"
 PAN_arm_the_merchant_fleet_desc:0 "Arias's decree left the ships under our flag defenseless against the U-boats. The new government will let their owners arm them at their own expense, and Washington will remember who stood with it."
 PAN_join_the_war_against_the_axis:0 "Join the War Against the Axis"
 PAN_join_the_war_against_the_axis_desc:0 "The United States has joined the Allies, and the canal it defends runs through the middle of our country. Panama cannot stand aside. We will take our place among the Allied nations and fight at their side."
 PAN_withdraw_the_arias_notes:0 "Withdraw the Arias Notes"
 PAN_withdraw_the_arias_notes_desc:0 "The banknotes of the Banco Central de Emisión were issued only days before Arias fell, and almost no one trusts them. Calling them in and closing the bank will put the republic back on the dollar and calm the markets."
 PAN_de_la_guardia_in_office_tt:0 "§YRicardo Adolfo de la Guardia§! is president"
 PAN_usa_in_the_allies_tt:0 "The §YUnited States§! is in the §YAllies§!"
 PAN_arias_notes_in_circulation_tt:0 "The §YArias banknotes§! are in circulation"
 PAN_the_filos_hines_agreement:0 "The Filós-Hines Agreement"
 PAN_the_filos_hines_agreement_desc:0 "The wartime defense sites agreement has run its course, but the Americans have not left, and Washington wants to keep Río Hato and a dozen other sites for years to come. Foreign Minister Francisco Filós has negotiated an agreement with Ambassador Frank T. Hines that would let them stay, on terms many Panamanians already call a new surrender of sovereignty. The National Assembly must still approve it."
 PAN_the_jimenez_administration:0 "The Jiménez Administration"
 PAN_the_jimenez_administration_desc:0 "Enrique A. Jiménez owes his office to the constituent convention, not to the voters, and he governs as a provisional president. His task is to give the republic a new constitution, return it to normal politics, and settle with Washington the question of the wartime bases."
 PAN_the_jimenez_administration_trigger_tt:0 "Completes on its own when §YEnrique A. Jiménez§! takes office."
 PAN_the_third_constitution:0 "The Third Constitution"
 PAN_the_third_constitution_desc:0 "The convention is writing the republic's third constitution, to replace the charter Arias imposed. It promises broad social rights and guarantees for every citizen, and the women who voted for the convention will help shape it. If it holds, it may be the most progressive constitution Panama has ever had."
 PAN_the_colon_free_zone:0 "The Colón Free Zone"
 PAN_the_colon_free_zone_desc:0 "Colón sits at the Atlantic mouth of the canal, where the world's shipping already passes. A free trade zone there, run by an autonomous agency of the state, where goods can be stored, repackaged and shipped on without paying our customs duties, would turn passing ships into business for Panama."
 PAN_jimenez_in_office_tt:0 "§YEnrique A. Jiménez§! is president"
 PAN_the_assembly_will_vote_tt:0 "The §YNational Assembly§! will vote on the agreement."
 PAN_the_diaz_arosemena_administration:0 "The Díaz Arosemena Administration"
 PAN_the_diaz_arosemena_administration_desc:0 "Domingo Díaz Arosemena, the elderly leader of the Liberals, has taken office after an election Arnulfo Arias still insists he won. His coalition owes much to the National Police, and its chief, José Antonio Remón, has become the man every government must reckon with."
 PAN_the_diaz_arosemena_administration_trigger_tt:0 "Completes on its own when §YDomingo Díaz Arosemena§! takes office."
 PAN_the_aviation_agreement:0 "The Aviation Agreement"
 PAN_the_aviation_agreement_desc:0 "Tocumen, our new national airport, could put Panama at the crossroads of the hemisphere's air routes, but it cannot yet handle international traffic. An aviation agreement with the United States would open Tocumen to American and Panamanian airlines, bring an American mission to train our people, and give the republic a civil aeronautics service of its own."
 PAN_the_second_arias_administration:0 "The Second Arias Administration"
 PAN_the_second_arias_administration_desc:0 "Remón has given Arias back the presidency he says was stolen from him in 1948. This time Arias promises to work closely with Washington, but he owes his office to the police, and his enemies have not forgotten 1941."
 PAN_the_second_arias_administration_trigger_tt:0 "Completes on its own when §YArnulfo Arias Madrid§! returns to office."
 PAN_seek_american_recognition:0 "Seek American Recognition"
 PAN_seek_american_recognition_desc:0 "Washington has refused to recognize a government installed by the chief of police. Only firm assurances of cooperation, on the canal above all, will persuade the Americans to restore normal relations with the republic."
 PAN_the_alcibiades_arosemena_administration:0 "The Alcibíades Arosemena Administration"
 PAN_the_alcibiades_arosemena_administration_desc:0 "The National Assembly has made Vice President Alcibíades Arosemena president in place of Arias, and he took the oath with the commanders of the National Police standing beside him. Years of plots, coups and recounts have left the economy in decline, and the new government must restore order, bring down the cost of living and find work for the unemployed before the next election."
 PAN_the_alcibiades_arosemena_administration_trigger_tt:0 "Completes on its own when §YAlcibíades Arosemena§! takes office."
 PAN_restore_the_constitution_of_1946:0 "Restore the Constitution of 1946"
 PAN_restore_the_constitution_of_1946_desc:0 "The National Assembly removed Arias in the name of the Constitution of 1946, which he had tried to set aside. President Alcibíades Arosemena must restore it in full, govern within its limits, and carry the republic through to an honest election."
 PAN_diaz_in_office_tt:0 "§YDomingo Díaz Arosemena§! is president"
 PAN_alcibiades_in_office_tt:0 "§YAlcibíades Arosemena§! is president"

###Events###
 panama.1.t:0 "Arosemena \"Elected\""
 panama.1.d:0 "Democracy isn't worth preserving. \n\n After abandoning the party that got him elected in first place, Harmodio Arias Madrid decided to keep the power in his small circle of loyal followers and threw all of his support behind his foreign minister Juan Demóstenes Arosemena Barreati. Of course, winning an election against both the party you used to lead and the regular opposition would be quite of a challenge, but Madrid and Barreati were well prepared for the occasion - instead of relying on lazy and unreliable voters, Madrid just did it himself and manufactured his own votes. A few uppity citizens got upset about that and voiced their displeasure, but the detention of the most influential ones quickly shut them up. \n\nThe international community has been mute so far. Claiming that you support grand concepts like "democracy" or "freedom of expression" is easy, organizing embargoes or even military interventions is hard. Besides that, most foreign leaders are content with Barreati - a stable authoritarian regime is much more predictable than a democracy with constantly shifting leaders and values."
 panama.1.a:0 "¡Viva Barreati!"
 PAN_arosemena_takes_office_tt:0 "§YJuan Demóstenes Arosemena§! will take office as president on §YOctober 1, 1936§!."
 panama.2.t:0 "President Arosemena Takes Office"
 panama.2.d:0 "On October 1, 1936, Juan Demóstenes Arosemena was sworn in as President of the Republic, succeeding Harmodio Arias. The opposition has not forgotten how the June election was won, but the new president means to answer it with results: schools for the interior, hospitals for the cities and an orderly administration. In Washington, the General Treaty signed in March still waits for the Senate, and the canal will hang over his term as it has over every term before it."
 panama.2.a:0 "Order, schools and public works."
 panama.3.t:0 "Death of President Arosemena"
 panama.3.d:0 "President Juan Demóstenes Arosemena died in office in Penonomé on December 16, 1939, with less than a year left in his term. The Second Designate, Ezequiel Fernández Jaén, held the executive for two days until the First Designate, Augusto Samuel Boyd, took charge on December 18. A physician who founded the National Academy of Medicine and once presided over the National Assembly, Boyd will serve out the term until October 1940, while every faction prepares for the election that will choose Arosemena's true successor."
 panama.3.a:0 "The republic goes on."
 panama.4.t:0 "The General Treaty with Panama"
 panama.4.d:0 "Panama's National Assembly has ratified the General Treaty that Secretary Hull and Ricardo J. Alfaro signed in March 1936, and it now awaits the consent of the Senate. The treaty would end our guarantee of Panama's independence and the right to intervene in its affairs, restrict the commissaries of the Canal Zone and raise the canal annuity to 430,000 balboas, while leaving the Zone itself in American hands. Ratifying it would show the Good Neighbor policy at work."
 panama.4.a:0 "Give the Senate's consent."
 panama.4.b:0 "Leave it in committee for another year."
 panama.5.t_ratified:0 "The Senate Ratifies the General Treaty"
 panama.5.t_delayed:0 "The Senate Delays the General Treaty"
 panama.5.d_ratified:0 "The United States Senate has consented to the General Treaty, and with the exchange of ratifications the protectorate is over. Washington no longer guarantees our independence or claims the right to intervene in our affairs, and the canal annuity rises to 430,000 balboas. The Zone remains in American hands, but for the first time since 1903 the republic deals with the United States as a sovereign nation."
 panama.5.d_delayed:0 "Once again the General Treaty has been left to wait in the United States Senate. Until Washington gives its answer, the protectorate clause stands."
 panama.5.a:0 "A victory for Panama."
 panama.5.b:0 "We will wait. For now."
 PAN_the_senate_tries_again_tt:0 "The §YUnited States§! will take up the treaty again in a year."
 panama.6.t:0 "President Arias Takes Office"
 panama.6.d:0 "On October 1, 1940, Arnulfo Arias Madrid received the presidential sash from Augusto Samuel Boyd. His victory was never in doubt. His rival, Ricardo J. Alfaro, took refuge in the Canal Zone two days before the vote, his supporters stayed away from the polls, and Arias was elected with more than 107,000 votes to Alfaro's 3,022. The new president promises Panameñismo, a Panama for the Panamanians, and few doubt that he means to change the republic to fit it."
 panama.6.a:0 "¡Panamá para los panameños!"
 panama.7.t:0 "Panama Forbids Armed Ships"
 panama.7.d:0 "President Arias has decreed that no merchant ship flying the flag of Panama may be armed. Scores of American-owned freighters sail under that flag, many of them carrying supplies to Britain, and without guns they are easy prey for the U-boats. Arias calls it neutrality. In Washington, it looks a great deal like doing Germany's work for it."
 panama.7.a:0 "Panama can no longer be counted on."
 panama.7.b:0 "It is Panama's flag to decide."
 panama.8.t:0 "Arias Overthrown"
 panama.8.d:0 "President Arias left for Havana in civilian clothes, telling almost no one, and his ministers did not wait for him to return. On October 9, 1941, with the National Police behind them, they moved to replace him, and Ricardo Adolfo de la Guardia, the Minister of Government and Justice, took charge of the government. Not a shot was fired. Arias, stranded in Cuba, could do nothing to stop it, and few in Washington, whose patience with him had run out over the ships, regret his fall."
 panama.8.a:0 "Order is restored."
 PAN_unarmed_ships_decree:0 "Forbade arming its ships"
 panama.9.t:0 "The Constituent Assembly"
 panama.9.d:0 "Last December, President de la Guardia dissolved the National Assembly and suspended the Constitution of 1941. In February, under pressure from every side, he called elections for a constituent convention, and the delegates chosen on May 6 met on June 15, 1945. De la Guardia had hoped to stay in power until 1947. Instead, the convention chose Enrique A. Jiménez as provisional president, to govern while it writes the republic a new constitution."
 panama.9.a:0 "A new beginning for the republic."
 panama.10.t:0 "The Streets Against the Bases"
 panama.10.d:0 "Within days of the signing, students marched against the Filós-Hines Agreement, and the protests spread from the capital to Río Hato itself. Some ten thousand women marched through Panama City. Now the National Assembly must decide whether to approve the agreement, with the crowds waiting outside."
 panama.10.a:0 "The Assembly rejects the agreement."
 panama.10.b:0 "Force it through the Assembly."
 panama.11.t:0 "Panama Rejects the Bases Agreement"
 panama.11.d:0 "Panama's National Assembly has voted unanimously to reject the agreement that would have let us keep the defense sites, while crowds celebrated in the streets of Panama City. With no agreement in force, our forces will have to leave Río Hato and the other sites outside the Canal Zone."
 panama.11.a:0 "Withdraw from the sites."
 PAN_rejected_the_bases_agreement:0 "Rejected the bases agreement"
 panama.12.t:0 "The Disputed Election"
 panama.12.d:0 "Arnulfo Arias led the early count in the May election, but the National Elections Jury declared Domingo Díaz Arosemena the winner by some 2,400 votes. Arias cried fraud, and the streets of Panama City saw violence, but the National Police stood by the government. On October 1, 1948, Díaz Arosemena took the oath of office."
 panama.12.a:0 "The jury has spoken."
 panama.13.t:0 "The President Falls Ill"
 panama.13.d:0 "President Díaz Arosemena has suffered a heart attack and taken leave from the presidency. On July 28, 1949, First Vice President Daniel Chanis Pinzón was sworn in to govern in his place."
 panama.13.a:0 "We wish the president a swift recovery."
 panama.14.t:0 "Remón Makes a President"
 panama.14.d:0 "When President Chanis tried to remove José Antonio Remón as chief of the National Police, Remón's men forced him to resign. The second vice president, Roberto Chiari, took office, but the Supreme Court ruled four to one that Chanis was still the lawful president. Remón settled the matter his own way: the National Elections Jury recounted the votes of 1948, found that Arnulfo Arias had won after all, by 74,080 votes to 71,536, and on November 24, 1949, Remón installed Arias in the presidency."
 panama.14.a:0 "Arias is legality!"
 panama.15.t:0 "Arias Overthrown Again"
 panama.15.d:0 "On May 7, 1951, President Arias suspended the Constitution of 1946 by decree, restored his own charter of 1941, suspended individual guarantees and arrested his opponents. The National Assembly answered on May 9 by impeaching him and electing First Vice President Alcibíades Arosemena in his place. The next day, after a brief gun battle at the Presidencia, the National Police under Remón took Arias into custody."
 panama.15.a:0 "The constitution stands."
 panama.16.t:0 "Remón Elected President"
 panama.16.d:0 "José Antonio Remón has traded his police commander's uniform for the presidential sash. At the head of the Coalición Patriótica Nacional he won the May election with 133,215 votes to 78,094 for his cousin Roberto Chiari, amid many charges of fraud and coercion. On October 1, 1952, he took office."
 panama.16.a:0 "Order and progress."
 panama.17.t:0 "Remón Assassinated"
 panama.17.d:0 "On January 2, 1955, gunmen armed with submachine guns ambushed President Remón at the racetrack, and he did not survive. First Vice President José Ramón Guizado has taken the oath of office, and the republic is left to ask who wanted its strongman dead."
 panama.17.a:0 "Find his killers."
 panama.18.t:0 "Guizado Removed"
 panama.18.d:0 "The investigation into Remón's murder has led to his own successor. Accused of taking part in the plot, President Guizado has been removed from office by the National Assembly and put on trial. On March 29, 1955, Second Vice President Ricardo Arias Espinosa took office to serve out the term."
 panama.18.a:0 "Justice must be done."
 panama.19.t:0 "President de la Guardia"
 panama.19.d:0 "Ernesto de la Guardia Navarro, the candidate of the Coalición Patriótica Nacional, won the presidency in the election of May 13, 1956, and took office on October 1, 1956. He inherits a new canal treaty, a Guardia Nacional that has made and unmade presidents, and a republic weary of upheaval."
 panama.19.a:0 "A civilian in the Presidencia."