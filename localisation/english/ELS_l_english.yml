###Industrial Concerns###
 ELS_cel:0 "Comisión Ejecutiva Hidroeléctrica del Río Lempa"
 ELS_cel_desc:0 "The CEL was created to harness the Río Lempa for the electrification of the nation. Its first great project, the 5 de Noviembre dam, would bring reliable power to San Salvador and the factories growing around it."
 ELS_cessa:0 "Cemento de El Salvador"
 ELS_cessa_desc:0 "Cemento de El Salvador quarries the limestone around Metapán, a town once famous for its colonial ironworks. Its cement builds the roads, bridges and factories of a modernizing country."

###Coffee Republic Modifier###
 ELS_coffee_republic_dm:0 "Coffee Republic"
 ELS_coffee_republic_dm_desc:0 "Coffee was first cultivated in El Salvador for domestic use in the early 19th century. By mid-century its commercial promise was evident, and the seeds for today's 'Coffee Republic' that El Salvador was to become were first sown. Coffee trade was monopolized in the late 19th century, leading to increasing inequalities between the working class and the elites, the so-called 'Fourteen Families', which at one point held almost 90% of all land within El Salvador, thus putting a lot of pressure on both the internal and external politics of the country. Just four years ago, it seemed as if things had reached a breaking point, the peasants were unsatisfied with their low pay, and decreasing quality of life, for which they blamed the land-owning elites. Thus, in January of 1932, the peasants launched a revolt that will come to be known as 'La Matanza'. Although this revolt was brutally crushed by the military regime, the spirit of rebellion against the elites lives on in the hearts and minds of many Salvadorans..."

 EST_coffee_republic_name:0 "Coffee Republic"

###Central American Economy Modifier###
 ELS_central_american_economy_dm:0 "The Central American Economy"
 ELS_central_american_economy_dm_desc:0 "The coffee estates of El Salvador are now only one part of a much larger economy. The banana plantations of Honduras, the oil of Guatemala and the farms of Nicaragua and Costa Rica must be bound together into a single Central American economy, strong enough to stand on its own."
 ELS_central_american_economy_name:0 "The Central American Economy"
 ELS_central_american_economy_tt:0 "The §YCoffee Republic§! becomes §YThe Central American Economy§!, keeping all of its current effects."
 ELS_modify_central_american_economy_tt:0 "Modify §YThe Central American Economy§! by:"
 ELS_trans_isthmian_railway_tt:0 "A level §Y2§! §YRailway§! will be built from §YGuatemala§! to §YCosta Rica§!."
 ELS_purchase_belize_tt:0 "[ENG.GetFlag] §YThe United Kingdom§! will be offered to sell us §YBelize§!. The higher their opinion of us, the more likely they are to accept. If we are §Ydemocratic§! and their opinion of us is above §Y30§!, they will always accept.\nIf they accept, they will receive §Y1§! offsite §Ycivilian factory§!, and we will gain §YPayment for Belize§! (Consumer Goods: §R+15%§!) for §Y180§! days."
 ELS_invite_panama_tt:0 "[PAN.GetFlag] §YPanama§! will be invited to join the union. The higher their opinion of us, the more likely they are to accept, and they are §Gtwice as likely§! to accept if they share our §Yideology§!."
 ELS_revolution_in_panama_tt:0 "[PAN.GetFlag] §YPanama§! can be targeted by the §YFund Communist Cells§! and §YStage a Communist Coup§! decisions. A successful coup brings it straight into the union."

 ELS_modify_coffee_tt:0 "Modify §Y[GetELSCurrentCoffeeName]§! by:"
