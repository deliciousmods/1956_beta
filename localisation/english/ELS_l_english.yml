###Decisions - Central American Federation###
 ELS_central_american_federation:0 "Central American Federation"
 ELS_central_american_federation_desc:0 "Not every nation of Central America has answered the call of the federal constitution. Where our authority already reaches, we can bring their people into the federation."
 ELS_integrate_guatemala:0 "Integrate Guatemala"
 ELS_integrate_guatemala_desc:0 "With Guatemala under our control, its people can finally take their place in the federation."
 ELS_integrate_honduras:0 "Integrate Honduras"
 ELS_integrate_honduras_desc:0 "With Honduras under our control, its people can finally take their place in the federation."
 ELS_integrate_nicaragua:0 "Integrate Nicaragua"
 ELS_integrate_nicaragua_desc:0 "With Nicaragua under our control, its people can finally take their place in the federation."
 ELS_integrate_costa_rica:0 "Integrate Costa Rica"
 ELS_integrate_costa_rica_desc:0 "With Costa Rica under our control, its people can finally take their place in the federation."
 ELS_integrate_panama:0 "Integrate Panama"
 ELS_integrate_panama_desc:0 "Panama refused our invitation, but with its lands under our control, its people can still take their place in the union."

###Central American Offers - Reports###
 el_salvador.10.t:0 "[FROM.GetName] Accepts: [GetELSOfferName]"
 el_salvador.10.d1:0 "[FROM.GetNameDefCap] has accepted our invitation to take part in joint military exercises. Their officers will train alongside ours, and both armies will learn from the experience."
 el_salvador.10.d2:0 "[FROM.GetNameDefCap] has agreed to join the Central American Customs Union. Trade between our nations will flow more freely than ever before."
 el_salvador.10.d3:0 "[FROM.GetNameDefCap] has joined the Central American Defense Pact. An attack on one of us is now an attack on all of us."
 el_salvador.10.d4:0 "[FROM.GetNameDefCap] has agreed to a shared foreign policy and is now our §YProtectorate§!. They will keep control of their internal affairs while we speak for them abroad."
 el_salvador.10.d5:0 "[FROM.GetNameDefCap] has ratified the federal constitution and joined the §YUnited States of Central America§!. The dream of a united Central America draws ever closer."
 el_salvador.10.d6:0 "[FROM.GetNameDefCap] has agreed to sell us §YBelize§!. The colony and its people now belong to the union, and the payment will be made over the coming months."
 el_salvador.10.d7:0 "[FROM.GetNameDefCap] has accepted our invitation and joined the union. Central America now stretches from Guatemala to the Panama Canal."
 el_salvador.10.a:0 "Excellent"
 el_salvador.11.t:0 "[FROM.GetName] Declines: [GetELSOfferName]"
 el_salvador.11.d1:0 "[FROM.GetNameDefCap] has declined our invitation to take part in joint military exercises."
 el_salvador.11.d2:0 "[FROM.GetNameDefCap] has refused to join the Central American Customs Union and will keep its own trade policy."
 el_salvador.11.d3:0 "[FROM.GetNameDefCap] has refused to join the Central American Defense Pact, believing it is not in their best interests."
 el_salvador.11.d4:0 "[FROM.GetNameDefCap] has rejected our proposal for a shared foreign policy and will not give up control of its foreign affairs."
 el_salvador.11.d5:0 "[FROM.GetNameDefCap] has rejected the federal constitution and will remain a separate nation, outside the United States of Central America."
 el_salvador.11.d6:0 "[FROM.GetNameDefCap] has refused to sell us §YBelize§!, and will keep the colony for itself."
 el_salvador.11.d7:0 "[FROM.GetNameDefCap] has refused our invitation and will remain a separate nation."
 el_salvador.11.a:0 "Unfortunate"

###Events - Communist###
 el_salvador.20.t:0 "The Man Who Survived the Firing Squad"
 el_salvador.20.d:0 "In January 1932, as the army crushed the uprising, Miguel Mármol was captured and lined up before a firing squad with his comrades. The soldiers fired, and he fell among the dead. Hours later, wounded but alive, he crawled away from the execution ground and disappeared.\n\nFor years the shoemaker from Ilopango has lived in hiding, moving from house to house and keeping what remained of the party alive. Now he has returned to lead it openly, and to the workers and peasants of El Salvador his survival is proof that the regime can be defied."
 el_salvador.20.a:0 "They could not kill him then, they will not stop him now"
 el_salvador.21.t:0 "Huelga de Brazos Caídos"
 el_salvador.21.d:0 "This morning the country stopped. The coffee pickers stayed away from the fincas, the railwaymen left the trains in their yards, and the shops of San Salvador kept their shutters down. Students and clerks joined them, and by afternoon not even the Guardia Nacional could find anyone to arrest.\n\nWithout a shot fired, the regime has collapsed and the party has taken power. But the officers of the old army and the Fourteen Families are still in place, waiting for the revolution to falter."
 el_salvador.21.a:0 "The workers have spoken"
 el_salvador.22.t:0 "Revolutionary Tribunals"
 el_salvador.22.d:0 "With the Guardia Nacional disbanded, its officers and the men responsible for La Matanza are in our custody. The party must decide how they will be judged. Swift tribunals would show the people that the revolution is serious, while open trials would show that we are not the butchers our enemies claim."
 el_salvador.22.a:0 "Swift revolutionary justice"
 el_salvador.22.b:0 "Fair and public trials"
 el_salvador.23.t:0 "Revolution in [ROOT.GetName]"
 el_salvador.23.d:0 "In the early hours of the morning, armed workers and soldiers loyal to the communist party seized the presidential palace, the radio station and the barracks of the capital. By dawn the old government had fled or surrendered.\n\nThe revolutionaries, armed and funded by [FROM.GetName], have proclaimed a new socialist government and placed the country under the protection of [FROM.GetName]."
 el_salvador.23.a:0 "Long live the revolution!"
 el_salvador.24.t:0 "[FROM.GetName] Offers to Buy Belize"
 el_salvador.24.d:0 "[FROM.GetNameDefCap] has offered to purchase British Honduras. The colony brings us little, and [FROM.GetName] is willing to pay well for it. Selling it would end a long-running dispute in Central America, but some in Parliament will see it as a sign of weakness."
 el_salvador.24.a:0 "Sell the colony"
 el_salvador.24.b:0 "British Honduras is not for sale"
 el_salvador.25.t:0 "Invitation to Join Central America"
 el_salvador.25.d:0 "[FROM.GetNameDefCap] has invited us to join the union of Central America. Joining would end our independence, but would make us part of a nation that stretches across the isthmus, and free us from depending on the United States."
 el_salvador.25.a:0 "Join the union"
 el_salvador.25.b:0 "Panama will remain independent"

###Events - Industry###
 el_salvador.30.t:0 "The National Research Center"
 el_salvador.30.d:0 "The National Research Center is ready to open its doors, but our budget will only equip it for one field of work. The army wants laboratories to develop new rifles and guns, our airmen ask for wind tunnels and test ranges, and the navy argues that our future lies on the Pacific. The choice is ours."
 el_salvador.30.a:0 "Focus on land warfare"
 el_salvador.30.b:0 "Focus on aviation"
 el_salvador.30.c:0 "Focus on naval research"

###Events - Panama Canal###
 el_salvador.40.t:0 "The Canal Zone Is Ours"
 el_salvador.40.d:0 "After days of hard fighting, our troops have driven the American garrison out of the Panama Canal Zone. Our flag now flies over the locks at Miraflores, but the canal is still American territory, and Washington will not take this lightly."
 el_salvador.40.a:0 "Let them come and take it"
 ELS_canal_usa_decides_tt:0 "The §YUnited States§! will decide whether to give up the canal or declare war on us."
 el_salvador.41.t:0 "[FROM.GetAdjective] Troops Seize the Canal Zone"
 el_salvador.41.d:0 "Forces of [FROM.GetNameDef] have overrun our garrison in the Panama Canal Zone and now hold the canal itself. We can accept the loss and hand the Canal Zone over, or we can teach these upstarts a lesson they will never forget."
 el_salvador.41.a:0 "Give up the canal"
 el_salvador.41.b:0 "This means war!"
 el_salvador.42.t:0 "The Americans Give Up the Canal"
 el_salvador.42.d:0 "Washington has agreed to hand over the Panama Canal Zone. For the first time since it was dug, the canal belongs to the people of Central America."
 el_salvador.42.a:0 "A historic victory"
 el_salvador.43.t:0 "The Assault on the Canal Fails"
 el_salvador.43.d:0 "The American garrison in the Canal Zone has thrown back our attack. Our troops have fallen back into Panama, and the canal remains in American hands."
 el_salvador.43.a:0 "We will return"
 el_salvador.44.t:0 "Fighting at the Canal Ends"
 el_salvador.44.d:0 "The fighting around the Panama Canal Zone has ended without a decision. The canal remains in American hands, for now."
 el_salvador.44.a:0 "For now"
 el_salvador.45.t:0 "Attack on the Canal Repulsed"
 el_salvador.45.d:0 "Central American troops attacked our garrison in the Panama Canal Zone, but were thrown back with heavy losses. The canal remains safely in our hands."
 el_salvador.45.a:0 "The canal is secure"

###Events - Spanish Civil War###
 el_salvador.50.t:0 "The Republic Triumphs"
 el_salvador.50.d:0 "The Spanish Republic has won its long war against fascism. In Madrid, the government has not forgotten the shipments that crossed the ocean from El Salvador when the Republic needed them most, and Spanish credits and orders for our goods are already arriving."
 el_salvador.50.a:0 "¡Viva la República!"
 el_salvador.51.t:0 "The Republic Has Fallen"
 el_salvador.51.d:0 "Despite everything we sent, the Spanish Republic has been defeated. Thousands of its soldiers and party members have fled into exile, and many have found their way to El Salvador. Hardened by years of war, they are eager to carry on the struggle in their new home."
 el_salvador.51.a:0 "Their fight is now ours"

###Decisions - Clandestine Network###
 ELS_clandestine_network:0 "Clandestine Network"
 ELS_clandestine_network_desc:0 "The party survives in secret cells, hidden from the Guardia Nacional. Each cell can spread our message a little further, but every meeting carries a risk."
 ELS_print_clandestine_newspapers:0 "Print Clandestine Newspapers"
 ELS_print_clandestine_newspapers_desc:0 "Hand-printed newspapers passed between workers keep the party's message alive."
 ELS_organize_workers_study_circles:0 "Organize Workers' Study Circles"
 ELS_organize_workers_study_circles_desc:0 "Secret study circles in the workshops and fincas turn sympathizers into committed comrades, though the meetings draw the attention of the authorities."
 ELS_contact_socorro_rojo:0 "Contact the Socorro Rojo"
 ELS_revolutionary_front:0 "Central American Revolutionary Front"
 ELS_revolutionary_front_desc:0 "Where the communists are strong enough, or the government weak enough, our comrades can seize power. Each new revolutionary government will owe its survival to us, and will follow our lead."
 ELS_stage_communist_coup:0 "Stage a Communist Coup in [FROM.GetNameWithFlag]"
 ELS_stage_communist_coup_desc:0 "Our comrades in [FROM.GetName] are ready to take power. With our support, they can overthrow the government in a single night."
 ELS_proclaim_the_union_tt:0 "We will become the §Y$ELS_USCA_communism$§!."
 ELS_union_annex_puppets_tt:0 "Our puppets in Central America will be §Yannexed§! into the union."
 ELS_union_owns_GUA_tt:0 "We or one of our puppets own §YGuatemala§!"
 ELS_union_owns_HON_tt:0 "We or one of our puppets own §YHonduras§!"
 ELS_union_owns_NIC_tt:0 "We or one of our puppets own §YNicaragua§!"
 ELS_union_owns_COS_tt:0 "We or one of our puppets own §YCosta Rica§!"
 ELS_coup_conditions_tt:0 "Has over §Y50%§! communist support, or over §Y30%§! communist support with stability below §Y20%§!"
 ELS_export_the_revolution:0 "Export the Revolution"
 ELS_export_the_revolution_desc:0 "Through smuggled money and rifles, we can strengthen the communist cells of our neighbors and bring their governments closer to collapse."
 ELS_fund_communist_cells:0 "Fund Communist Cells in [FROM.GetNameWithFlag]"
 ELS_fund_communist_cells_desc:0 "Send money and rifles to the communist cells of [FROM.GetName]. While the operation runs, one of our civilian factories will be busy supplying it."
 ELS_contact_socorro_rojo_desc:0 "International Red Aid supports communists imprisoned and exiled across the Americas. Its help will strengthen our cells and connect us to the wider movement."

