###Faction###
 ELS_central_america_faction:0 "Central American Defense Pact"
 ELS_revolutionary_front_faction:0 "Central American Revolutionary Front"


###Faction Goals###
 ELS_central_american_unity_goal_name:0 "Central American Unity"
 ELS_central_american_unity_goal_desc:0 "Divided, the republics of the isthmus are easy prey for foreign companies and greater powers. If every one of them stands with us in the pact, none of us will have to stand alone."
 ELS_unite_central_america_goal_name:0 "Unite Central America"
 ELS_unite_central_america_goal_desc:0 "Central America was once a single republic, and Morazán died trying to keep it whole. Divided, our five nations are easy prey for foreign companies and greater powers. Only as one union can we stand on our own."
 ELS_panama_joins_the_union_goal_name:0 "Panama Joins the Union"
 ELS_panama_joins_the_union_goal_desc:0 "Panama was never part of the old federation, but it shares our isthmus and our future. Bringing Panama into the union would carry our borders to the edge of South America."
 ELS_central_american_miracle_goal_name:0 "Central American Miracle"
 ELS_central_american_miracle_goal_desc:0 "For a century our economy has been coffee, bananas and little else. If the union is to stand among the nations of the world, it must build factories, mills and workshops of its own."
 ELS_central_american_miracle_tech_bonus:0 "$ELS_central_american_miracle_goal_name$ Goal Bonus"
 ELS_central_american_miracle_factories_tt:0 "Factories owned by the faction leader"
 ELS_central_american_miracle_target_tt:0 "Factories needed"
 ELS_the_pan_american_highway_goal_name:0 "The Pan-American Highway"
 ELS_the_pan_american_highway_goal_desc:0 "A highway running the length of the isthmus would bind our nations together more tightly than any treaty. Every capital must be linked by modern roads, so that goods, people and soldiers can move freely from Guatemala to Costa Rica."
 ELS_wings_over_the_isthmus_goal_name:0 "Wings over the Isthmus"
 ELS_wings_over_the_isthmus_goal_desc:0 "Mountains and jungle divide the isthmus, but the sky does not. A strong air force can reach any corner of Central America within hours and keep foreign bombers away from our cities."
 ELS_bring_belize_home_goal_name:0 "Bring Belize Home"
 ELS_bring_belize_home_goal_desc:0 "British Honduras has been claimed by Guatemala since the colony was founded. As long as a European flag flies over Belize, Central America is not truly free."
 ELS_belize_held_by_faction_tt:0 "§YBelize§! is held by our faction"
 ELS_guard_the_gulf_of_fonseca_goal_name:0 "Guard the Gulf of Fonseca"
 ELS_guard_the_gulf_of_fonseca_goal_desc:0 "The Gulf of Fonseca is shared by El Salvador, Honduras and Nicaragua, and the Bryan-Chamorro Treaty gave the United States the right to build a naval base there. A fleet of our own will make sure that no foreign power ever controls it."
 ELS_riches_of_the_isthmus_goal_name:0 "Riches of the Isthmus"
 ELS_riches_of_the_isthmus_goal_desc:0 "Beneath our forests and mountains lie the oil and rubber that foreign companies have long been eager to take. If our faction can draw them out of the ground itself, our armies and factories will never go without fuel or tires."
 ELS_the_caribbean_revolution_goal_name:0 "The Caribbean Revolution"
 ELS_the_caribbean_revolution_goal_desc:0 "Cuba, Haiti and the Dominican Republic are ruled by dictators who serve the American sugar companies. The revolution that freed Central America must cross the sea and free the Caribbean as well."
 COLLECTION_ELS_CENTRAL_AMERICAN_CAPITAL_STATES:0 "Capital states of Guatemala, Honduras, Nicaragua and Costa Rica"
 COLLECTION_ELS_CENTRAL_AMERICAN_CAPITAL_STATES_OWNED:0 "Central American capital states owned by us"
 COLLECTION_ELS_CENTRAL_AMERICAN_CAPITAL_STATES_IN_FACTION:0 "Central American capital states held by our faction"
 COLLECTION_ELS_PANAMANIAN_STATES:0 "States of Panama"
 COLLECTION_ELS_PANAMANIAN_STATES_OWNED:0 "Panamanian states owned by us"
 COLLECTION_ELS_ISTHMUS_CAPITAL_STATES:0 "Capital states of Central America"
 COLLECTION_ELS_ISTHMUS_CAPITAL_STATES_CONNECTED:0 "Central American capitals held by our faction with level 5 infrastructure"
 COLLECTION_ELS_CARIBBEAN_REVOLUTION_STATES:0 "States of Cuba, Haiti and the Dominican Republic"
 COLLECTION_ELS_CARIBBEAN_REVOLUTION_STATES_RED:0 "Caribbean states held by communists or our faction"


###Game Rules###
 ELS_AI_BEHAVIOR:0 "@ELS El Salvador"
 ELS_RULE_OPTION_HISTORICAL:0 "$ELS_continue_consilidation$"
 ELS_RULE_OPTION_HISTORICAL_AI_DESC:0 "Martínez stays in power and keeps El Salvador neutral, joining the Allies once the United States enters the war."
 ELS_RULE_OPTION_DEMOCRATIC:0 "$ELS_bring_araujo_home$"
 ELS_RULE_OPTION_DEMOCRATIC_AI_DESC:0 "Arturo Araujo returns from exile to restore democracy, then works to reunite Central America as a federation."
 ELS_RULE_OPTION_COMMUNIST:0 "$ELS_vengeance_for_la_matanza$"
 ELS_RULE_OPTION_COMMUNIST_AI_DESC:0 "Miguel Mármol and the communists avenge La Matanza and spread the revolution across Central America."


###Balance of Power - Oligarchy vs Military###
 ELS_oligarchy_military_bop:0 "The Oligarchy and the Army"
 ELS_oligarchy_side:0 "The Coffee Oligarchy"
 ELS_military_side:0 "The Army"
 ELS_oligarchy_military_bop_balanced:0 "Martínez Above the Factions"
 ELS_oligarchy_military_bop_army_favored:0 "Army Favored"
 ELS_oligarchy_military_bop_army_strong:0 "Army Ascendant"
 ELS_oligarchy_military_bop_army_dominant:0 "Army Dominant"
 ELS_oligarchy_military_bop_oligarchy_favored:0 "Oligarchs Favored"
 ELS_oligarchy_military_bop_oligarchy_strong:0 "Oligarchs Ascendant"
 ELS_oligarchy_military_bop_oligarchy_dominant:0 "Oligarchs Dominant"
 ELS_oligarchy_military_bop_category:0 "The Coffee Oligarchy and the Army"
 ELS_oligarchy_military_bop_category_desc:0 "Martínez rules by keeping the Fourteen Families and the officer corps wary of each other. If either grows too strong, it may remember that it helped put him in power, and that it can take him out of it."
 ELS_bop_toward_center_tt:0 "The balance between the §YCoffee Oligarchy§! and the §YArmy§! moves §Y10%§! toward the center"
 ELS_court_the_coffee_growers:0 "Court the Coffee Growers"
 ELS_court_the_coffee_growers_desc:0 "A few concessions on export duties and a seat at the President's table will remind the coffee families that the regime still serves them."
 ELS_appease_the_officers:0 "Appease the Officers"
 ELS_appease_the_officers_desc:0 "Promotions, new uniforms and better pay will keep the officer corps loyal to the President, for now."
 ELS_purge_disloyal_officers:0 "Purge Disloyal Officers"
 ELS_purge_disloyal_officers_desc:0 "Some of our officers have grown too ambitious. Retiring them, or sending them to distant garrisons, will remind the army who rules El Salvador."
 ELS_tax_the_coffee_exports:0 "Tax the Coffee Exports"
 ELS_tax_the_coffee_exports_desc:0 "The coffee families have grown rich on their exports. A new levy on every sack that leaves the country will fill the treasury and remind them of their place."
 el_salvador.60.t:0 "The Army Grows Restless"
 el_salvador.60.d:0 "The officer corps has never been stronger, and it knows it. Generals who once took the President's orders now openly discuss who should be giving them. Unless we act, the army may decide it no longer needs Martínez."
 el_salvador.60.a:0 "Give the officers what they want."
 el_salvador.60.b:0 "Remind them who rules El Salvador."
 el_salvador.61.t:0 "The Coffee Barons Grow Bold"
 el_salvador.61.d:0 "The coffee families now treat the government as their own. Their newspapers mock the President's ministers, their friends in the Assembly block anything that might cost them a cent, and now they are demanding even more."
 el_salvador.61.a:0 "Give them what they want."
 el_salvador.61.b:0 "Break their hold on the government."
 r56_ELS_purged_officers:0 "Purged Officer Corps"
 r56_ELS_purged_officers_desc:0 "Many of our most experienced officers have been retired or sent to remote garrisons. Those who remain are loyal, but not always capable."
 r56_ELS_coffee_export_tax:0 "Coffee Export Tax"
 r56_ELS_coffee_export_tax_desc:0 "Our new levy on coffee exports fills the treasury, but foreign buyers are looking for cheaper coffee elsewhere."


###Balance of Power - The Federal Question###
 ELS_federal_question_bop:0 "The Federal Question"
 ELS_federation_side:0 "The Federation"
 ELS_states_side:0 "The States"
 ELS_federal_question_bop_name_only:0 "A Federation in Name Only"
 ELS_federal_question_bop_states_dominant:0 "States Dominant"
 ELS_federal_question_bop_states_favored:0 "States Favored"
 ELS_federal_question_bop_union_of_equals:0 "A Union of Equals"
 ELS_federal_question_bop_federation_favored:0 "Federation Favored"
 ELS_federal_question_bop_federal_authority:0 "Federal Authority"
 ELS_federal_question_bop_second_federation:0 "The Second Federation"
 ELS_federal_question_category:0 "The Federal Question"
 ELS_federal_question_category_desc:0 "Central America is united on paper, but Guatemala City, Tegucigalpa, Managua and San José still answer to their own governors, courts and garrisons. The first federation fell apart in 1838 because its states never truly gave up their power. If this union is to last, the federal government must win the authority the states are so reluctant to hand over."
 ELS_federation_favored_tt:0 "§YThe Federal Question§! is at least §YFederation Favored§!"
 ELS_integrate_guatemalan_administration:0 "Integrate Guatemala's Administration"
 ELS_integrate_guatemalan_administration_desc:0 "Guatemala's ministries still act as if they ran an independent country. Bringing its civil service under federal oversight will make the union's laws mean something in Guatemala City."
 ELS_jacobo_arbenz_joins_tt:0 "§YJacobo Árbenz Guzmán§! leaves the Guatemalan army to serve the federation, and is §Gavailable§! as a general and as §YChief of Army§! (§YArmy Offense Expert§!)"
 ELS_integrate_honduran_administration:0 "Integrate Honduras's Administration"
 ELS_integrate_honduran_administration_desc:0 "Honduras's ministries still act as if they ran an independent country. Bringing its civil service under federal oversight will make the union's laws mean something in Tegucigalpa."
 ELS_julio_lozano_diaz_joins_tt:0 "§YJulio Lozano Díaz§! joins the federal government, and is §Gavailable§! as a §YPolitical Advisor§! (§YCaptain of Industry§!)"
 ELS_integrate_nicaraguan_administration:0 "Integrate Nicaragua's Administration"
 ELS_integrate_nicaraguan_administration_desc:0 "Nicaragua's ministries still act as if they ran an independent country. Bringing its civil service under federal oversight will make the union's laws mean something in Managua."
 ELS_vicente_cuadra_gomez_joins_tt:0 "§YVicente Cuadra Gomez§! joins the federal government, and is §Gavailable§! as a §YPolitical Advisor§! (§YEconomist§!)"
 ELS_integrate_costa_rican_administration:0 "Integrate Costa Rica's Administration"
 ELS_integrate_costa_rican_administration_desc:0 "Costa Rica's ministries still act as if they ran an independent country. Bringing its civil service under federal oversight will make the union's laws mean something in San José."
 ELS_rodrigo_facio_brenes_joins_tt:0 "§YRodrigo Facio Brenes§! joins the federal government, and is §Gavailable§! as a §YPolitical Advisor§! (§YLiberal Professor§!)"
 ELS_unify_the_state_armies:0 "Unify the State Armies"
 ELS_unify_the_state_armies_desc:0 "Each of the old republics still keeps its own army, loyal to its own capital. Folding them into a single federal army under one command will end any chance of the states settling their quarrels by force."
 ELS_state_generals_join_tt:0 "§YEduardo Villagrán Ariza§!, §YJosé Castro López§!, §YFrancisco Parajón Montealegre§! and §YRicardo Fernández Peralta§! join the federal army as §Ggenerals§!"
 ELS_unify_the_state_armies_cost:0 "§H50§!£pol_power §H20§!£command_power"
 ELS_unify_the_state_armies_cost_blocked:0 "§R50§!£pol_power §R20§!£command_power"
 ELS_unify_the_state_armies_cost_tooltip:0 "It costs 50£pol_power and 20£command_power to select this."
 ELS_establish_the_federal_courts:0 "Establish the Federal Courts"
 ELS_establish_the_federal_courts_desc:0 "A federal supreme court with authority over every state will settle disputes between them, and make it clear that federal law stands above their own."
 ELS_federal_investment:0 "Federal Investment"
 ELS_federal_investment_desc:0 "Roads, schools and hospitals paid for by the federal government will show the people of every state what the union can do for them, and that their loyalty belongs to it rather than to their old capitals."
 el_salvador.62.t:0 "The Second Federation Is Secured"
 el_salvador.62.d:0 "The first Federal Republic of Central America fell apart in 1838 because its states never truly accepted a government above them. That mistake has not been repeated. Federal law now holds in every state of the union, a single army answers to the federal government, and fewer people each year think of themselves first as Guatemalans or Nicaraguans. Morazán's dream is finally secure."
 el_salvador.62.a:0 "Central America is one nation."
 ELS_joins_the_usa_faction_tt:0 "Joins §Y[USA.GetFactionName]§!, along with its faction members"
 el_salvador.63.t:0 "Central America Offers an Alliance"
 el_salvador.63.d:0 "[FROM.GetNameDefCap] has made us an unusual offer. Its government will join our alliance and open its ports and airfields to our forces, if we hand over the Panama Canal Zone. Our admirals warn against giving up the most important waterway in the hemisphere, but our diplomats point out that a friendly government would still let our ships through, and that an ally on the isthmus is worth more than a garrison."
 el_salvador.63.a:0 "Accept the offer."
 el_salvador.63.b:0 "The canal is not for trade."
 el_salvador.64.t:0 "Washington Accepts"
 el_salvador.64.d:0 "The United States has accepted our offer. The Stars and Stripes have been lowered over the Canal Zone, and for the first time the canal belongs to Central America. In return, our nation now stands with the Americans and their allies, and American ships and soldiers may pass freely through our territory."
 el_salvador.64.a:0 "A fair trade."
 el_salvador.65.t:0 "Washington Refuses"
 el_salvador.65.d:0 "The United States has turned down our offer. The Americans will not trust anyone else with the Panama Canal, whatever alliance we offer them in return."
 el_salvador.65.a:0 "We will remember this."


###Focus###

#airforce
 ELS_ilopango_air_base:0 "Ilopango Air Base"
 ELS_ilopango_air_base_desc:0 "The airfield at Ilopango, just outside the capital, is home to our small air force. Longer runways, new hangars and proper workshops will turn it into a true military air base."
 ELS_escuela_militar_de_aviacion:0 "Escuela Militar de Aviación"
 ELS_escuela_militar_de_aviacion_desc:0 "Our pilots learn to fly in a handful of worn-out trainers. A proper military flying school, with modern aircraft and foreign instructors, will give us airmen able to fly the planes of tomorrow."
 ELS_air_defense_of_the_capital:0 "Air Defense of the Capital"
 ELS_air_defense_of_the_capital_desc:0 "San Salvador lies within easy reach of any enemy bomber. Anti-aircraft batteries around the city and its airfield will make any attacker pay dearly."
 ELS_taca_airlines:0 "TACA Airlines"
 ELS_taca_airlines_desc:0 "Transportes Aéreos Centro Americanos already flies passengers and cargo across the isthmus. With government support, new airfields will spring up across the country, and the airline's pilots and mechanics will serve the nation in time of war."
 ELS_coastal_air_patrols:0 "Coastal Air Patrols"
 ELS_coastal_air_patrols_desc:0 "Aircraft patrolling the Pacific coast can spot enemy ships and submarines long before they threaten our ports and the convoys that carry our coffee."
 ELS_army_cooperation:0 "Army Cooperation"
 ELS_army_cooperation_desc:0 "Our soldiers will fight in mountains and jungles where artillery cannot follow. Aircraft working closely with the army can strike the enemy wherever they hide, if they can survive the fire from the ground."
 ELS_battlefield_support:0 "Battlefield Support"
 ELS_battlefield_support_desc:0 "Our airmen will train alongside the army, learning to find and strike targets in support of the troops on the ground, whatever the weather."
 ELS_squadrons_for_ilopango:0 "Squadrons for Ilopango"
 ELS_squadrons_for_ilopango_desc:0 "With modern aircraft finally within our reach, we will equip new squadrons of fighters to defend our skies and patrol bombers to guard our coast."
 ELS_ground_attack_squadron:0 "Ground Attack Squadron"
 ELS_ground_attack_squadron_desc:0 "A squadron of dive bombers will give our army a striking power that none of our neighbors can match."
 ELS_fuerza_aerea_salvadorena:0 "Fuerza Aérea Salvadoreña"
 ELS_fuerza_aerea_salvadorena_desc:0 "From a handful of biplanes, we have built an air force worthy of the name. Its pilots, trained at home and proven in the air, will guard the skies of El Salvador for generations."

#navy
 ELS_the_coffee_fleet:0 "The Coffee Fleet"
 ELS_the_coffee_fleet_desc:0 "Every sack of coffee we sell abroad leaves our shores in a foreign ship, and every voyage puts money in foreign pockets. New dockyards will let us build a merchant fleet of our own to carry our harvest to the world."
 ELS_escort_destroyers:0 "Escort Destroyers"
 ELS_escort_destroyers_desc:0 "Our merchant ships will need protection. Fast, well-armed destroyers are the best escorts a small navy can hope for, but we must first learn to design and arm them."
 ELS_escuela_naval:0 "Escuela Naval"
 ELS_escuela_naval_desc:0 "A navy is nothing without officers who know how to command it. A naval school will train a new generation of officers in seamanship, gunnery and the art of guarding a convoy."
 ELS_destroyers_for_the_coast:0 "Destroyers for the Coast"
 ELS_destroyers_for_the_coast_desc:0 "With designs drawn up and crews in training, our dockyards will lay down the first warships ever built in El Salvador."
 ELS_merchant_marine:0 "Merchant Marine"
 ELS_merchant_marine_desc:0 "A national merchant marine, sailing under our own flag, will carry our coffee to the markets of the world and earn us the respect of our trading partners."
 ELS_port_of_acajutla:0 "Port of Acajutla"
 ELS_port_of_acajutla_desc:0 "Acajutla is the gateway through which most of our coffee leaves the country. New piers, warehouses and slipways will turn it into a true port, able to load our merchant ships and repair our warships."
 ELS_protect_the_trade_routes:0 "Protect the Trade Routes"
 ELS_protect_the_trade_routes_desc:0 "Our economy lives and dies by the ships that carry our exports. In war, our navy's first duty will be to see that they arrive safely."
 ELS_coastal_submarines:0 "Coastal Submarines"
 ELS_coastal_submarines_desc:0 "A few small submarines lurking off our coast would make any enemy fleet think twice before approaching. We must study their design before we can build them."
 ELS_mine_the_gulf_of_fonseca:0 "Mine the Gulf of Fonseca"
 ELS_mine_the_gulf_of_fonseca_desc:0 "The Gulf of Fonseca, shared with Honduras and Nicaragua, is the back door to our country. Minefields and submarines can close it to any enemy."
 ELS_submarine_flotilla:0 "Submarine Flotilla"
 ELS_submarine_flotilla_desc:0 "Our dockyards are ready to build the submarines that will guard our coast and threaten the trade of any nation that attacks us."
 ELS_commission_a_flagship:0 "Commission a Flagship"
 ELS_commission_a_flagship_desc:0 "Every navy needs a flagship. A heavy cruiser bearing the name of Francisco Morazán, hero of the old Federation, will lead our fleet and show the flag in every port of the Americas."
 ELS_add_tech_early_ship_hull_light_tt:0 "Add technology: §Y$ship_hull_light_1$§!."
 ELS_add_tech_early_destroyer_tt:0 "Add technology: §Y$destroyer_1$§!."
 ELS_add_tech_early_submarine_tt:0 "Add technology: §Y$submarine_1$§!."
 ELS_add_tech_basic_ship_hull_cruiser_tt:0 "Add technology: §Y$ship_hull_cruiser_2$§!."
 ELS_add_tech_basic_heavy_cruiser_tt:0 "Add technology: §Y$heavy_cruiser_2$§!."

#industry
 ELS_industrial_promotion_law:0 "Industrial Promotion Law"
 ELS_industrial_promotion_law_desc:0 "Our economy rises and falls with the price of coffee. Tax exemptions and cheap credit for new industries will encourage our landowners to invest their profits in factories as well as fincas."
 ELS_textile_mills:0 "Textile Mills"
 ELS_textile_mills_desc:0 "Cotton grows well on our Pacific coast, yet we sell it abroad and buy back the cloth. New mills will spin and weave it at home, and give work to thousands."
 ELS_national_radio_network:0 "National Radio Network"
 ELS_national_radio_network_desc:0 "A network of transmitters will carry the voice of the government to every town in the republic, and train a generation of technicians in the workings of radio."
 ELS_harness_the_rio_lempa:0 "Harness the Río Lempa"
 ELS_harness_the_rio_lempa_desc:0 "El Salvador has no coal, and the fuel for our factories must be bought abroad. A great dam across the Río Lempa will give us cheap hydroelectric power of our own."
 ELS_national_arsenal:0 "National Arsenal"
 ELS_national_arsenal_desc:0 "An army that must buy every cartridge abroad can be disarmed by a single embargo. A national arsenal will let us make the arms and ammunition our soldiers need."
 ELS_technical_schools:0 "Technical Schools"
 ELS_technical_schools_desc:0 "Our new factories need engineers, electricians and mechanics, not just laborers. Technical schools in the cities will train the skilled workers that industry demands."
 ELS_production_development_institute:0 "Production Development Institute"
 ELS_production_development_institute_desc:0 "A state institute will lend money to new enterprises, plan where factories should be built, and see that they are built quickly."
 ELS_cement_works:0 "Cement Works"
 ELS_cement_works_desc:0 "Every road, dam and factory we build needs cement. A national cement works will supply our builders without the cost of imports."
 ELS_coffee_research_institute:0 "Coffee Research Institute"
 ELS_coffee_research_institute_desc:0 "Funded by a tax on coffee exports, a research institute will study better strains, fertilizers and processing methods, and its laboratories will serve our scientists in every field."
 ELS_national_research_center:0 "National Research Center"
 ELS_national_research_center_desc:0 "Our engineers and scientists have shown what they can achieve. A national research center will bring them together under one roof to work on the technologies of tomorrow."
 ELS_national_research_center_facility_tt:0 "We will choose to build a §YLand§!, §YAir§! or §YNaval§! research facility in §YEl Salvador§!."
 ELS_national_research_center_research_tt:0 "We will choose a field of research to focus on, §YLand§!, §YAir§! or §YNaval§!, gaining two §Y100%§! research bonuses in that field."

#political - historical
 ELS_state_of_the_nation:0 "State Of The Nation"
 ELS_state_of_the_nation_desc:0 "Five years ago the army overthrew our elected President, and within weeks the uprising of 1932 was drowned in blood. General Maximiliano Hernández Martínez rules with the backing of the army and the coffee families, Arturo Araujo waits in exile, and the communists who survived La Matanza plot in secret. The collapse of coffee prices has left the country poor and restless. El Salvador stands at a crossroads, and the path it takes now will decide its future."
 ELS_continue_consilidation:0 "Continue Consolidating Power"
 ELS_continue_consilidation_desc:0 "General Maximiliano Hernández Martínez took power in the coup of December 1931 and crushed the uprising that followed. The country is quiet again, but the army and the coffee growers who stand behind the General expect that quiet to last. The new regime must be made permanent."
 ELS_ban_communism:0 "Ban Partido Comunista de El Salvador"
 ELS_ban_communism_desc:0 "The communists who led the uprising of 1932 are dead, in prison or in hiding, but their ideas still spread through the coffee fincas. The Partido Comunista de El Salvador will be outlawed for good, and anyone caught spreading its propaganda will answer to the Guardia Nacional."
 ELS_expand_national_guard:0 "Expand The National Guard"
 ELS_expand_national_guard_desc:0 "The Guardia Nacional is the backbone of order in the countryside. More men, more posts and better weapons will make sure that the events of 1932 can never happen again."
 ELS_press_censorship:0 "Increase Press Censorship"
 ELS_press_censorship_desc:0 "Newspapers that question the government only stir up trouble. Editors will learn to print what is good for the nation, and those who refuse will find their presses closed."
 ELS_ban_elections:0 "Ban Elections"
 ELS_ban_elections_desc:0 "The constitution forbids the President from serving a second term. A new constitution, written by a loyal assembly, will remove that obstacle, and the nation will no longer need elections to choose its leader."
 ELS_support_the_franquistats:0 "Support The Franquistats"
 ELS_support_the_franquistats_desc:0 "General Franco's rising against the Spanish Republic is a war against communism and disorder, the same war we fought in 1932. El Salvador will be among the first nations to recognize the Nationalist government, and will send whatever help it can."
 ELS_study_civil_war:0 "Lessons From Spanish Civil War"
 ELS_study_civil_war_desc:0 "The war in Spain has become a testing ground for the weapons and tactics of tomorrow. The officers we sent to fight alongside the Nationalists are returning with lessons that no textbook could teach."
 ELS_the_theosophist_president:0 "The Theosophist President"
 ELS_the_theosophist_president_desc:0 "Our President is no ordinary general. A devoted theosophist, the General lectures the nation on the radio about reincarnation and the invisible forces that govern the world, and has been heard to say that killing an ant is a greater crime than killing a man. Many find this strange, but few dare to say so."
 ELS_mysticism_and_militarism:0 "Mysticism And Militarism"
 ELS_mysticism_and_militarism_desc:0 "To the President, the army is the instrument of a higher order. Discipline, sacrifice and obedience are spiritual virtues as much as military ones, and the soldiers of El Salvador will be taught to see them that way."
 ELS_state_serves_military:0 "State Serves The Military"
 ELS_state_serves_military_desc:0 "A strong state needs a strong army, and a strong army needs a state that serves it. The nation's budget, its industry and its workers will be put at the disposal of the armed forces."
 ELS_cult_of_personality:0 "Cult Of Personality"
 ELS_cult_of_personality_desc:0 "Portraits of the President hang in every school and office, and the radio carries the General's words into every home. Enemies of the regime call the General El Brujo, the sorcerer, but to the people the President will become the father of the nation."
 ELS_secret_police:0 "Secret Police"
 ELS_secret_police_desc:0 "Plots against the government are hatched in cafés, barracks and university halls. A dedicated intelligence service will watch the regime's enemies at home and abroad, and make sure that no conspiracy ever reaches the palace."
 ELS_secret_police_agency_name:0 "ANSESAL"
 ELS_stabilise_coffee_economy:0 "Stabilize The Coffee Economy"
 ELS_stabilise_coffee_economy_desc:0 "The collapse of coffee prices brought the country to the edge of ruin. A new central bank and cheap credit for the growers will steady the currency, ease their debts and keep the harvest coming in."
 ELS_protect_coffee_oligarchy:0 "Protect The Coffee Oligarchy"
 ELS_protect_coffee_oligarchy_desc:0 "The great coffee families stood behind the government in 1932, and they expect to be rewarded. Their estates, their profits and their place at the top of society will be protected by the state."
 ELS_ban_unions:0 "Crack Down On Unions"
 ELS_ban_unions_desc:0 "Agitators have been organizing the workers in the towns and on the plantations. Unions that answer to foreign ideologies will be dissolved, and order will return to the workplaces of El Salvador."
 ELS_trade_deals:0 "Trade Deals"
 ELS_trade_deals_desc:0 "Our coffee must find buyers in every market we can reach. New trade agreements will open doors abroad and bring in the money and goods that our country needs."
 ELS_neutrality_above_all:0 "Neutrality Above All"
 ELS_neutrality_above_all_desc:0 "The great powers are preparing for another war. El Salvador has nothing to gain from their quarrels, and will stand apart from them while trading with anyone who wishes to buy our coffee."
 ELS_join_axis:0 "Join The Axis"
 ELS_join_axis_desc:0 "Germany and Italy have shown what a disciplined nation can achieve. They buy our coffee and admire our order, and El Salvador will stand with them against the decadent democracies and Bolshevism alike."
 ELS_join_allies:0 "Join The Allies"
 ELS_join_allies_desc:0 "The United States is our greatest customer and the most powerful nation in the Americas. When war comes to the hemisphere, El Salvador will stand with Washington and its allies."

#political - democratic
 ELS_bring_araujo_home:0 "Bring Araujo Home"
 ELS_bring_araujo_home_desc:0 "In 1931 Arturo Araujo won the freest election in our history, only to be overthrown by the army before the year was out. The rightful President of El Salvador has lived in exile ever since. The time has come to bring Araujo home and return the nation to the path the people chose."
 ELS_free_elections:0 "Free Elections"
 ELS_free_elections_desc:0 "For the first time since 1931, the people of El Salvador will choose their leaders at the ballot box, without the army or the coffee barons standing over them."
 ELS_restore_civil_liberties:0 "Civil Liberties Restored"
 ELS_restore_civil_liberties_desc:0 "Under military rule, a careless word could land a man in prison. Freedom of speech, of the press and of assembly will be guaranteed once more, and political prisoners will be released."
 ELS_restore_the_constitution:0 "Restore The Constitution"
 ELS_restore_the_constitution_desc:0 "The liberal constitution of 1886 promised a government of laws, not of generals. It will be restored in full, and the republic will be governed once again by elected representatives answerable to the people."
 ELS_labor_protections:0 "Labor Protections"
 ELS_labor_protections_desc:0 "Araujo's Partido Laborista promised the workers of El Salvador a fair deal. A minimum wage, limits on working hours and the right to organize will make that promise real, and a healthier, better-paid workforce will be a more productive one."
 ELS_public_hospitals:0 "Build Public Hospitals"
 ELS_public_hospitals_desc:0 "Disease kills far more Salvadorans than any war. New public hospitals in every department will bring modern medicine to people who have never seen a doctor."
 ELS_public_schools:0 "Build Public Schools"
 ELS_public_schools_desc:0 "Most Salvadorans cannot read or write. A network of public schools will give every child an education, and give the republic the citizens, clerks and engineers it needs."
 ELS_land_reforms:0 "Land Reforms"
 ELS_land_reforms_desc:0 "A few dozen families own most of the good land in El Salvador, while the people who work it own nothing. Idle estates will be bought and divided among the peasants, so that those who farm the land have a stake in its future."

#political - democratic el salvador
 ELS_strengthen_the_republic:0 "Strengthen The Republic"
 ELS_strengthen_the_republic_desc:0 "Our neighbors are ruled by strongmen, and the danger of another coup has not passed. Before we look beyond our borders, the institutions of our own republic must be made strong enough to survive any challenge."
 ELS_democratic_agency_name:0 "Dirección Nacional de Inteligencia"
 ELS_independent_judiciary:0 "Independent Judiciary"
 ELS_independent_judiciary_desc:0 "Judges who owe their positions to the government cannot hold it to account. Our courts will be made independent, so that the law protects every citizen equally, whether poor peasant or coffee baron."
 ELS_civil_service_reform:0 "Civil Service Reform"
 ELS_civil_service_reform_desc:0 "Government posts have long been handed out as rewards to friends of the ruling party. From now on, civil servants will be hired and promoted on merit, and the state will finally work for its citizens rather than its patrons."
 ELS_anti_corruption_legislation:0 "Anti-Corruption Legislation"
 ELS_anti_corruption_legislation_desc:0 "Bribery and embezzlement have drained the treasury for generations. Strict new laws and honest inspectors will put an end to the theft of public money, and that money will be put to work for the nation instead."
 ELS_trade_and_investment_commission:0 "Trade And Investment Commission"
 ELS_trade_and_investment_commission_desc:0 "Foreign investors are wary of a country where contracts depend on the goodwill of a general. A trade and investment commission will promote Salvadoran goods abroad and assure foreign capital that its money is safe in our republic."
 ELS_university_of_el_salvador:0 "Expand University Of El Salvador"
 ELS_university_of_el_salvador_desc:0 "Founded in 1841, the University of El Salvador has trained our lawyers and doctors for nearly a century, but it is too small for a modern nation. New faculties, laboratories and scholarships will open its doors to many more students."
 ELS_welfare_expansion:0 "Welfare Expansion"
 ELS_welfare_expansion_desc:0 "A democracy is only as strong as the welfare of its citizens. Pensions, accident insurance and help for the poorest families will give every Salvadoran a reason to defend the republic."
 ELS_civilian_controlled_military:0 "Civilian Control Of The Military"
 ELS_civilian_controlled_military_desc:0 "Our generals have decided who should rule El Salvador once too often. The armed forces will answer to the elected government from now on, and officers who meddle in politics will be removed from their posts."


#political - democratic central america
 ELS_central_american_cooperation:0 "Central American Cooperation"
 ELS_central_american_cooperation_desc:0 "El Salvador, Guatemala, Honduras, Nicaragua and Costa Rica were once a single nation, and they still share a history, a language and a common enemy in poverty. A free El Salvador will lead the way toward closer friendship among the peoples of the isthmus." 
 ELS_regional_development:0 "Regional Development"
 ELS_regional_development_desc:0 "The roads of Central America lead to the ports, not to each other. New highways and bridges across our borders will bind the region together and carry its trade from one nation to the next."
 ELS_central_american_customs_union:0 "Central American Customs Union"
 ELS_central_american_customs_union_desc:0 "Tariffs at every border make our small markets even smaller. A customs union will let goods move freely across the isthmus, and give our industries a market large enough to grow in."
 ELS_joint_military_exercises:0 "Joint Military Exercises"
 ELS_joint_military_exercises_desc:0 "No Central American nation can defend itself alone. Joint exercises will teach our armies to fight side by side, and show any would-be aggressor that an attack on one is a concern for all."
 ELS_shared_foreign_policy:0 "Shared Foreign Policy"
 ELS_shared_foreign_policy_desc:0 "Divided, the nations of Central America are ignored by the great powers. Speaking with one voice, they cannot be. We will invite our neighbors to entrust their foreign affairs to a common council, a first step toward union."
 ELS_draft_federal_constitution:0 "Draft A Federal Constitution"
 ELS_draft_federal_constitution_desc:0 "In 1921, El Salvador, Guatemala and Honduras signed a Pact of Union to restore the old federation, only for it to collapse within a year. This time a federal constitution will be built to last, and every nation of the isthmus will be invited to join the United States of Central America."
 ELS_central_american_defense_pact:0 "Central American Defense Pact"
 ELS_central_american_defense_pact_desc:0 "Friendship must be backed by commitment. A formal defense pact will bind the nations of Central America to come to each other's aid, and lay the foundations for something greater."

#political - democractic shared
 ELS_support_the_republicans:0 "Support The Republicans"
 ELS_support_the_republicans_desc:0 "The Spanish Republic is fighting for its life against a military uprising, the same kind of uprising that overthrew our own government in 1931. Free El Salvador will stand with Spain's elected government and send what help it can."
 ELS_spanish_refugees:0 "Spanish Refugees"
 ELS_spanish_refugees_desc:0 "Thousands of Spaniards have been driven from their homes by the war. El Salvador will open its doors to them, and many skilled workers, teachers and professionals will find a new home among us."

#political - communist
 ELS_vengeance_for_la_matanza:0 "Vengeance For La Matanza"
 ELS_vengeance_for_la_matanza_desc:0 "In January 1932 the army answered the peasants' uprising with La Matanza, the massacre of thousands of men, women and children in the coffee lands of the west. Farabundo Martí was shot, the party was driven underground, and the killers still rule from San Salvador. The workers and peasants have not forgotten. The time has come to settle the account."
 ELS_return_of_miguel_marmol:0 "The Return of Miguel Mármol"
 ELS_return_of_miguel_marmol_desc:0 "In 1932 the regime stood Miguel Mármol before a firing squad and left him for dead. He survived, and the party's most stubborn organizer has come out of hiding to lead it again."
 ELS_rebuild_the_party_cells:0 "Rebuild the Party Cells"
 ELS_rebuild_the_party_cells_desc:0 "La Matanza destroyed the Partido Comunista Salvadoreño in a matter of weeks. Small, secret cells of trusted comrades can rebuild it where the Guardia Nacional cannot see."
 ELS_organize_the_coffee_pickers:0 "Organize the Coffee Pickers"
 ELS_organize_the_coffee_pickers_desc:0 "The coffee estates run on the backs of underpaid pickers. Unions on the fincas will give them a voice, and give the party thousands of new recruits."
 ELS_huelga_de_brazos_caidos:0 "Huelga de Brazos Caídos"
 ELS_huelga_de_brazos_caidos_desc:0 "We do not need rifles to bring down the regime. If every worker, picker and clerk folds their arms at once, the country will stop, and the government will fall with it."
 ELS_international_brigades:0 "Join the International Brigades"
 ELS_international_brigades_desc:0 "Workers from across the world are traveling to Spain to defend the Republic against fascism. Salvadoran comrades will stand with them, and our factories will send what arms we can spare."
 ELS_aid_for_the_republic:0 "Aid for the Republic"
 ELS_aid_for_the_republic_desc:0 "The war in Spain has dragged on for over a year, and the Republic is running short of everything. We will send rifles and equipment from our own stockpiles, even if our workers must tighten their belts to pay for it."
 ELS_solidarity_until_victory:0 "Solidarity Until Victory"
 ELS_solidarity_until_victory_desc:0 "Two years on, the Spanish Republic still stands, but its armies are short of everything. The workers of El Salvador will tighten their belts once more, so that Republican Spain can fight on until victory."
 ELS_solidarity_until_victory_tt:0 "When the §YSpanish Civil War§! ends, we will learn whether our sacrifice was worth it."
 ELS_dissolve_the_guardia_nacional:0 "Dissolve the Guardia Nacional"
 ELS_dissolve_the_guardia_nacional_desc:0 "The Guardia Nacional carried out La Matanza and has terrorized the countryside ever since. It will be disbanded, and the officers who served the old regime will answer for their crimes."
 ELS_peoples_militias:0 "People's Militias"
 ELS_peoples_militias_desc:0 "The revolution will be defended by the people themselves. Militias raised in the towns and fincas will replace the Guardia Nacional."
 ELS_expand_the_militias:0 "Expand the Militias"
 ELS_expand_the_militias_desc:0 "Thousands more volunteers have come forward to defend the revolution. With better training and more weapons, the militias can become a fighting force to be reckoned with."
 ELS_expropriate_the_fourteen_families:0 "Expropriate the Fourteen Families"
 ELS_expropriate_the_fourteen_families_desc:0 "For generations the Fourteen Families have owned the land, the banks and the coffee. Their estates and fortunes now belong to the people."
 ELS_collectivize_the_fincas:0 "Collectivize the Fincas"
 ELS_collectivize_the_fincas_desc:0 "Following the Soviet model, the great coffee estates will become state farms. Production will rise, but the peasants who wanted land of their own will not forgive us easily."
 ELS_coffee_cooperatives:0 "Coffee Cooperatives"
 ELS_coffee_cooperatives_desc:0 "The fincas will be handed to cooperatives run by the pickers who work them. Growth will be slower, but the countryside will stand behind the revolution."
 ELS_repudiate_the_1922_loan:0 "Repudiate the 1922 Loan"
 ELS_repudiate_the_1922_loan_desc:0 "The 1922 loan from American bankers has drained our customs revenue for over a decade. We will not pay another centavo, and the money will build our own industry instead."
 ELS_nationalize_healthcare:0 "Nationalize Healthcare"
 ELS_nationalize_healthcare_desc:0 "Doctors and hospitals have served only those who could pay. The state will take over the clinics and hospitals and bring medical care to every town and finca, free of charge."
 ELS_national_literacy_campaign:0 "National Literacy Campaign"
 ELS_national_literacy_campaign_desc:0 "Most of our workers and peasants cannot read. Brigades of students and teachers will go out to the countryside to teach them, and a people that can read will build a better future."
 ELS_the_moscow_line:0 "The Moscow Line"
 ELS_the_moscow_line_desc:0 "The revolution cannot survive alone in America's backyard. By following the line set by Moscow and joining the Comintern, we will have the most powerful socialist state in the world standing behind us."
 ELS_soviet_industrial_aid:0 "Soviet Industrial Aid"
 ELS_soviet_industrial_aid_desc:0 "Soviet ships are arriving in Acajutla loaded with machine tools, and Soviet engineers are teaching our workers to use them. With their help, El Salvador can finally build an industry of its own."
 ELS_soviet_military_mission:0 "Soviet Arms Shipments"
 ELS_soviet_military_mission_desc:0 "Soviet freighters have begun arriving at Acajutla loaded with rifles, guns and the machinery to start making our own."
 ELS_salvadoran_five_year_plan:0 "The Salvadoran Five-Year Plan"
 ELS_salvadoran_five_year_plan_desc:0 "Following the Soviet example, the economy will be directed by a central plan. Heavy industry comes first, even if the shops must wait."
 ELS_spread_the_revolution:0 "Spread the Revolution"
 ELS_spread_the_revolution_desc:0 "Our revolution belongs to all of Central America. The workers of Guatemala, Honduras, Nicaragua and Costa Rica suffer under the same dictators and the same fruit companies, and we will help them rise as we did."
 ELS_fund_the_revolutionary_cells:0 "Fund the Revolutionary Cells"
 ELS_fund_the_revolutionary_cells_desc:0 "Communist cells are forming across Central America, but they lack money and weapons. We will provide both, and let our neighbors' workers do the rest."
 ELS_intelligence_agency_name:0 "Socorro Rojo"
 ELS_central_american_revolutionary_front:0 "Central American Revolutionary Front"
 ELS_proclaim_the_union:0 "Proclaim the Union of Central America"
 ELS_one_central_america:0 "One Central America"
 ELS_one_central_america_desc:0 "For the first time since the Federal Republic collapsed in 1841, Central America is one nation. Five economies, five currencies and five sets of laws must now become one."
 ELS_the_peso_centroamericano:0 "The Peso Centroamericano"
 ELS_the_peso_centroamericano_desc:0 "Colones, lempiras, quetzales and córdobas will be replaced by a single currency, issued by a single treasury. A common currency will tie the regions of the union together and give the government the means to govern them."
 ELS_central_american_common_market:0 "Central American Common Market"
 ELS_central_american_common_market_desc:0 "With the old customs posts between our states torn down, goods can move freely from Guatemala to Costa Rica. New factories will serve a market of millions rather than a few hundred thousand."
 ELS_central_american_research_institute:0 "Central American Research Institute"
 ELS_central_american_research_institute_desc:0 "A common market needs modern industry, and modern industry needs science. A Central American institute for research and industrial technology will pool the scientists and engineers of every nation of the union, and put their work at the service of the whole isthmus."
 ELS_beyond_coffee:0 "Beyond Coffee"
 ELS_beyond_coffee_desc:0 "For a century the price of coffee in New York has decided whether our people eat. The union gives us bananas, timber, minerals and oil, and the chance to never again depend on a single crop."
 ELS_partner_with_united_fruit:0 "Partner with United Fruit"
 ELS_partner_with_united_fruit_desc:0 "The United Fruit Company owns the railways, ports and plantations of the Caribbean coast. Rather than fight it, we will negotiate a fairer share of its profits and its investment in our industry."
 ELS_nationalize_united_fruit:0 "Nationalize United Fruit"
 ELS_arsenals_of_the_union:0 "Arsenals of the Union"
 ELS_arsenals_of_the_union_desc:0 "A nation of millions cannot rely on a single arms factory in San Salvador. New arsenals spread across the union will arm its defenders, wherever an enemy may strike."
 ELS_the_pan_american_highway:0 "The Pan-American Highway"
 ELS_the_pan_american_highway_desc:0 "The great highway planned to link the Americas will run the length of our union. Our engineers will build our section first, connecting every capital from Guatemala City to San José."
 ELS_trans_isthmian_railway:0 "Trans-Isthmian Railway"
 ELS_trans_isthmian_railway_desc:0 "Our railways were built by foreign companies to carry fruit and coffee to the ports, not to connect our cities. A single line from Guatemala to Costa Rica will finally bind the union together."
 ELS_survey_the_nicaraguan_canal:0 "Survey the Nicaraguan Canal"
 ELS_survey_the_nicaraguan_canal_desc:0 "For a century, engineers have dreamed of a canal through Lake Nicaragua to rival Panama's. We will begin the survey, expand the ports of Nicaragua and show the world that the route is ours."
 ELS_state_mining_corporation:0 "State Mining Corporation"
 ELS_state_mining_corporation_desc:0 "The mountains of the isthmus hold iron, chromium, coal and oil, but foreign companies have taken what little was ever dug up. A state mining corporation will survey our land and extract its wealth for the union."
 ELS_alta_verapaz_oil:0 "Alta Verapaz Oil"
 ELS_alta_verapaz_oil_desc:0 "Oil seeps have long been known in the highlands of Alta Verapaz. With proper drilling and a storage depot, Guatemala's oil can fuel the union's industry and army."
 ELS_highland_mines:0 "Highland Mines"
 ELS_highland_mines_desc:0 "The iron deposits of Honduras and the chromium of the Guatemalan and Costa Rican highlands will feed our new factories, not foreign ones."
 ELS_panamanian_concessions:0 "Panamanian Concessions"
 ELS_panamanian_concessions_desc:0 "With Panama in our hands, its untapped wealth can finally be developed. Drilling around the oil seeps near the capital and rubber plantations in the jungles of the north will add to the riches of the union."
 ELS_atlantic_rubber_plantations:0 "Atlantic Rubber Plantations"
 ELS_atlantic_rubber_plantations_desc:0 "The hot, wet lowlands of the Caribbean coast are ideal for rubber trees. Plantations on the Mosquito Coast of Nicaragua and Honduras will free us from buying rubber abroad."
 ELS_costa_rican_bauxite:0 "Costa Rican Bauxite"
 ELS_costa_rican_bauxite_desc:0 "Geologists have found bauxite in the valleys of southern Costa Rica. Mined and refined, it will give the union its own aluminum."
 ELS_purchase_belize:0 "Purchase Belize"
 ELS_purchase_belize_desc:0 "British Honduras has been claimed by Guatemala since the colony was founded. Rather than fight the British Empire for it, we will offer to buy it, and bring its people into the union."
 ELS_invite_panama:0 "Invite Panama to the Union"
 ELS_invite_panama_desc:0 "Panama was once part of Gran Colombia, not the Federal Republic, but its people share our history and our struggle against foreign interference. With the Pan-American Highway reaching its border, we will invite Panama to join the union."
 ELS_the_canal_for_an_alliance:0 "The Canal for an Alliance"
 ELS_the_canal_for_an_alliance_desc:0 "The canal that cuts our union in two still belongs to Washington. The Americans will never sell it, but they might trade it. If we stand beside them and their allies, the Canal Zone could be the price of our friendship."
 ELS_the_canal_for_an_alliance_tt:0 "Offer to join §YThe United States§!' faction in return for the §YPanama Canal§!.\nIf they accept, we gain the §YPanama Canal§! and join their faction along with our faction members."
 ELS_usa_in_a_faction_tt:0 "§YThe United States§! is in a faction"
 ELS_fortify_the_canal:0 "Fortify the Canal"
 ELS_fortify_the_canal_desc:0 "Whoever holds the Panama Canal holds the key to the hemisphere, and every great power knows it. Coastal guns, bunkers and anti-air batteries on both ends of the canal, and a shipyard to keep our fleet in repair, will make sure no one takes it from us."
 ELS_revolution_in_panama:0 "Revolution in Panama"
 ELS_revolution_in_panama_desc:0 "The workers who dig and run the Panama Canal for American profit have every reason to rise. Our comrades will carry the revolution south, and bring Panama into the union."
 ELS_nationalize_united_fruit_desc:0 "El Pulpo, the octopus, has strangled Central America for long enough. Its plantations, railways and ports now belong to the workers who built them, whatever Washington may say."
 ELS_proclaim_the_union_desc:0 "Morazán's dream of a united Central America died in 1840. Today the workers of the isthmus revive it, not as a union of landowners and generals, but as a socialist republic of the people."
 ELS_central_american_revolutionary_front_desc:0 "The cells we have funded are ready to act. Bound together in a single revolutionary front, the workers of Central America will overthrow their dictators one by one, and stand together against any power that tries to stop them."
 ELS_restore_the_tierras_comunales:0 "Restore the Tierras Comunales"
 ELS_restore_the_tierras_comunales_desc:0 "The communal lands of the indigenous villages were abolished to make way for the coffee estates. Returning them to the communities of the west will heal old wounds."

#political - war goals
 ELS_defend_the_hemisphere:0 "Defend the Hemisphere"
 ELS_defend_the_hemisphere_desc:0 "Fascism has found friends even in the Americas. As part of the Allied cause, we will not tolerate fascist regimes on our doorstep, and will help to bring them down."
 ELS_defend_the_hemisphere_tt:0 "We gain a §YTopple Government§! war goal against every §Yfascist§! country in §YCentral America§! and the §YCaribbean§!."
 ELS_settle_the_bolson_dispute:0 "Settle the Bolsón Dispute"
 ELS_settle_the_bolson_dispute_desc:0 "For decades our border with Honduras has been disputed, with whole villages claimed by both nations. With our new friends in Europe behind us, the time has come to settle the question once and for all."
 ELS_against_the_dictators:0 "Against the Dictators"
 ELS_against_the_dictators_desc:0 "The strongmen of the isthmus rule by fear and hold back the progress of their people. A free El Salvador will not stand by while its neighbors suffer under tyranny."
 ELS_against_the_dictators_tt:0 "We gain a §YTopple Government§! war goal against every §Ynon-democratic§! country in §YCentral America§!."
 ELS_morazans_sword:0 "Morazán's Sword"
 ELS_morazans_sword_desc:0 "Francisco Morazán did not unite Central America with words alone. The nations that refused our offer of union will be brought into the federation by force."
 ELS_morazans_sword_tt:0 "We gain an §YAnnex§! war goal against every §YCentral American§! nation that refused to join the union."
 ELS_smash_reaction_in_the_isthmus:0 "Smash Reaction in the Isthmus"
 ELS_smash_reaction_in_the_isthmus_desc:0 "The generals and oligarchs who rule our neighbors stand in the way of the revolution. The workers of Central America will never be free until the reactionary regimes of the isthmus are swept away."
 ELS_smash_reaction_in_the_isthmus_tt:0 "We gain a §YPuppet§! war goal against every §Yfascist§! or §Yauthoritarian§! country in §YCentral America§!."
 ELS_the_caribbean_revolution:0 "The Caribbean Revolution"
 ELS_the_caribbean_revolution_desc:0 "From the sugar fields of Cuba to the plantations of Hispaniola, the workers of the Caribbean suffer under the same tyrants and the same foreign companies as we did. The revolution must cross the sea."
 ELS_the_caribbean_revolution_tt:0 "We gain a §YPuppet§! war goal against every §Yfascist§! or §Yauthoritarian§! country in the §YCaribbean§!."
 ELS_revolution_in_mexico:0 "Revolution in Mexico"
 ELS_revolution_in_mexico_desc:0 "The Mexican Revolution promised land and freedom to its people, but its leaders have betrayed those promises. We will help the Mexican workers finish what Zapata and Villa began."
 ELS_strike_the_capitalist:0 "Strike the Capitalist"
 ELS_strike_the_capitalist_desc:0 "Every dictator in Central America has been armed, financed or installed by Washington. As long as American capitalism stands, no revolution in the Americas will ever be safe. It is time to strike at the heart of the empire."
 ELS_seize_the_panama_canal:0 "Seize the Panama Canal"
 ELS_seize_the_panama_canal_desc:0 "The canal was dug by the hands of Central American workers, yet its profits flow to Wall Street and American soldiers guard its locks. With Panama free, the time has come to take back the Canal Zone."
 ELS_seize_the_panama_canal_tt:0 "A §Yborder war§! will begin over the §YPanama Canal Zone§!. If we win, we gain a §Ycore§! on the §YPanama Canal Zone§!, and the §YUnited States§! must either give up the canal or declare war on us."

###Events###
 el_salvador.1.t:0 "Joint Army Exercises"
 el_salvador.1.d:0 "El Salvador invites us to participate in regional join army exercises, this would be a valuable opportunity to provide experience to our armed forces."
 el_salvador.1.a:0 "Participate in the exercises"
 el_salvador.1.b:0 "Politely decline"
 el_salvador.2.t:0 "Central American Customs Union"
 el_salvador.2.d:0 "El Salvador has invited us to join the Central American customs union."
 el_salvador.2.a:0 "Join the customs union"
 el_salvador.2.b:0 "Politely decline"
 el_salvador.3.t:0 "Central American Defense Pact"
 el_salvador.3.d:0 "El Salvador invites us to join the Central American Defense Pact"
 el_salvador.3.a:0 "Join the Pact"
 el_salvador.3.b:0 "This is not in our best interests"
 el_salvador.4.t:0 "A Shared Foreign Policy"
 el_salvador.4.d:0 "El Salvador proposes that the nations of Central America speak to the world with one voice. Under their proposal, El Salvador would conduct our foreign affairs while we keep control of our own internal matters."
 el_salvador.4.a:0 "Central America must stand together"
 el_salvador.4.b:0 "We will not give up our independence"
 el_salvador.5.t:0 "The Federal Constitution"
 el_salvador.5.d:0 "El Salvador has drafted a federal constitution to unite Central America into a single nation, the United States of Central America, and invites us to join it."
 el_salvador.5.a:0 "Join the federation"
 el_salvador.5.b:0 "We will remain a separate nation"

