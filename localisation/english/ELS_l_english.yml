###Ideas###

 r56_ELS_maximiliano_regime:0 "The Maximiliano Regime"
 r56_ELS_maximiliano_regime_2:0 "The Maximiliano Regime"
 r56_ELS_maximiliano_regime_3:0 "The Maximiliano Regime"
 r56_ELS_maximiliano_regime_4:0 "The Maximiliano Regime"
 r56_ELS_maximiliano_regime_5:0 "The Maximiliano Regime"
 r56_ELS_secret_police:0 "Secret Police"
 r56_ELS_secret_police_no_dlc:0 "Secret Police"
 r56_ELS_neutrality_idea:0 "Neutrality Above All"
 r56_ELS_strengthen_the_republic:0 "Strengthen The Republic"
 r56_ELS_strengthen_the_republic_2:0 "Strengthen The Republic"
 r56_ELS_diplomacy_focus:0 "Diplomacy Focus"
 r56_ELS_customs_union_idea:0 "Central American Customs Union"
 r56_ELS_old_order_remains:0 "The Old Order Remains"
 r56_ELS_old_order_remains_desc:0 "The strike brought us to power, but the officers of the old army and the Fourteen Families who own the land are still in place, and they obstruct the revolution at every turn."
 r56_ELS_old_order_officers_remain:0 "The Old Officers Remain"
 r56_ELS_old_order_officers_remain_desc:0 "The oligarchs have lost their land, but the officers of the old army are still in command and cannot be trusted."
 r56_ELS_old_order_oligarchs_remain:0 "The Oligarchs Remain"
 r56_ELS_old_order_oligarchs_remain_desc:0 "The old officer corps has been purged, but the Fourteen Families still hold the land and use their wealth to undermine the revolution."
 r56_ELS_funded_communist_cells:0 "Salvadoran-Funded Communist Cells"
 r56_ELS_funded_communist_cells_desc:0 "Money and rifles smuggled in from El Salvador are arming communist cells across the country, and their strikes and agitation are spreading unrest."
 r56_ELS_belize_payment:0 "Payment for Belize"
 r56_ELS_belize_payment_desc:0 "The purchase of Belize from the British must be paid for, and the money has to come from somewhere."
 r56_ELS_aid_to_the_republic:0 "Aid to the Spanish Republic"
 r56_ELS_aid_to_the_republic_desc:0 "Our factories are working to replace the arms we sent to Spain, leaving less for the shops at home."
 r56_ELS_peoples_militias:0 "People's Militias"
 r56_ELS_peoples_militias_desc:0 "Workers and peasants have taken up arms to defend the revolution in every town and finca."
 r56_ELS_peoples_militias_2:0 "People's Militias"
 r56_ELS_peoples_militias_2_desc:0 "The militias have grown into a true people's army, better trained and better armed to defend the revolution."
 r56_ELS_canal_offensive:0 "The Canal Offensive"
 r56_ELS_canal_offensive_desc:0 "Our soldiers have been told that the canal belongs to the people of Central America, and they are ready to take it back from the Americans by force."
 r56_ELS_coffee_convoy_escorts:0 "Coffee Convoy Escorts"
 r56_ELS_coffee_convoy_escorts_desc:0 "Our navy's first duty is to protect the merchant ships that carry our coffee to market."
 r56_ELS_battlefield_support:0 "Battlefield Support"
 r56_ELS_battlefield_support_desc:0 "Our airmen train alongside the army to support the troops on the ground in any weather."
 r56_ELS_fuerza_aerea_salvadorena:0 "Fuerza Aérea Salvadoreña"
 r56_ELS_fuerza_aerea_salvadorena_desc:0 "Our air force has grown into a proud and capable service, with skilled pilots and the experience to use them well."

