 ELS_banana_republic:0 "Banana Republic"
 ELS_banana_republic_desc:0 "We are influenced by foreign fruit companies which control a substantial amount of the economy. Our economy is heavily reliant on banana exports, and allocating resources to other industries will be difficult."
 r56_ELS_coffee_republic:0 "Coffee Republic"
 r56_ELS_coffee_republic_desc:0 "Coffee was first cultivated in El Salvador for domestic use in the early 19th century. By mid-century its commercial promise was evident, and the seeds for today's 'Coffee Republic' that El Salvador was to become were first sown. Coffee trade was monopolized in the late 19th century, leading to increasing inequalities between the working class and the elites, the so-called 'Fourteen Families', which at one point held almost 90% of all land within El Salvador, thus putting a lot of pressure on both the internal and external politics of the country. Just four years ago, it seemed as if things had reached a breaking point, the peasants were unsatisfied with their low pay, and decreasing quality of life, for which they blamed the land-owning elites. Thus, in January of 1932, the peasants launched a revolt that will come to be known as 'La Matanza'. Although this revolt was brutally crushed by the military regime, the spirit of rebellion against the elites lives on in the hearts and minds of many Salvadorans..."
