 ELS_joint_military_exercises_tt:0 "([GUA.GetFlag]§YGuatemala§!, [HON.GetFlag]§YHonduras§!, [NIC.GetFlag]§YNicaragua§!, [COS.GetFlag]§YCosta Rica§!) Will be invited to take part in §Yjoint military exercises§!. The §Yhigher their opinion§! of us, the more likely they are to accept."
 ELS_central_american_customs_union_tt:0 "([GUA.GetFlag]§YGuatemala§!, [HON.GetFlag]§YHonduras§!, [NIC.GetFlag]§YNicaragua§!, [COS.GetFlag]§YCosta Rica§!) Will be invited to join the §YCentral American Customs Union§!. The §Yhigher their opinion§! of us, the more likely they are to accept."
