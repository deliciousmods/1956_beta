 #Keep in mind countries that don't appear here might use their localization from the base game.
 
 AUS_GATHERING_STORM_DESC:2 "The First Republic is over. On the 20th of May 1933, in an enabling act eerily similar to the one Adolf Hitler had used to take power in Germany just a couple months beforehand, Chancellor Engelbert Dolfuss proclaimed the Federal State of Austria, turning the once free and democratic republic into a fascist dictatorship.\nThe following year would bring two civil wars, one with the socialists, and one with the Nazis, which would end with the assassination of Dolfuss.\nNow, Chancellor Kurt Schuschnigg finds himself steering an unstable nation into a brewing storm, and faced with a choice - choose a path, or face sure destruction."

 #GER_GATHERING_STORM_DESC:0 "A new Germany has risen. Three years have passed since the Weimar Republic was vanquished and Hitler's Third Reich put in place. Now, the military restrictions that were placed on the Reich at Versailles are long forgotten, and the Wehrmacht grows stronger by the day, as though preparing for another Weltkrieg.\n\nNonetheless, despite crackdown after crackdown resistance to Hitler's new order still simmers, with conspiratorial webs engulfing the entirety of the German State apparatus..."

 GRE_GATHERING_STORM_DESC:0 "For Greece, the Great War did not end in 1918. The disastrous war with Turkey and the terrible effects of the National Schism have left many wounds open for the Greek nation. The Great Depression, unemployment, social and political instability, and the rise of radicalism have brought the small country of Greece to a crossroads to decide its future, overcome the many problems and look ahead as its legacy calls."
 
 HOL_GATHERING_STORM_DESC:0 "The Netherlands is in the middle of a deep crisis at the moment. The country has been hit a bit later than others by The Great Depression, and consequently, it is currently suffering from its worse consequences. Unemployment is at an all-time high, and the government has not reacted so far, preferring to stick to a policy of budget balance and faith in the gold standard. Hopefully, the economic doctrine of the government is currently shifting due to the pressure of the street. To make matters worse, Germany is rearming, and the government knows that it will be extremely difficult to stay neutral this time if Europe burns once again."
 
 PER_GATHERING_STORM_DESC:0 "From the chaos of the events of 1921, marked by the socialist rebellion in the north and that of Colonel Mohammad Taqi Pessian, came out a new Iran, led by Reza Shah, the latter having been crowned Shah the same year following his coup d'état. Despite a constitution, the government is marked by a strong royal and military power, the former constantly ensuring the latter's loyalty, and by a perspective of forced modernization, secular reforms, and industrial development having been implemented."

 TUR_GATHERING_STORM_DESC:0 "After the Great War saw the fall of the Ottoman Empire, Turkey's future looked bleak. But Turkey has risen like a phoenix from out of the fires of the Turkish War of Independence. Led by Mustafa Kemal Atatürk and his Kemalist ideology, Turkey looks strong and secure. But its people are tired and in need of peace. It will take another significant change to awaken this sleeping lion."
 
 LUX_GATHERING_STORM_DESC:0 "Having been neutral for the longest time, the Great War has shook Luxembourg to its foundation. With a royal scandal bringing the young Charlotte I to the throne, the nation had to face economic stagnation and maneuver carefully between Germany and France.\n\nAs the world heats back up again and another major armed conflict looms on the horizon, Luxembourg must rethink its policies or stick what has proven been to work. Nonetheless, the coming years will decide the nation's fate: Will Luxembourg lead Europe into a bright new future or will it succomb to foreign meddling?"
 
 POR_GATHERING_STORM_DESC:0 "Following two decades of a republic defined by a ruinous Great War intervention, and armed revolts against many tried forms of government, esteemed general Óscar Carmona partook in a 1926 military coup, eventually heading a nationalist dictatorship of the right.\n\nYoung economist António de Oliveira Salazar, initially Carmona's humble but powerful finance minister, moved toward austerity, and against The Great Depression; uniting the right in his corporatist Estado Novo, where he serves as president of the Council of Ministers. Can his regime survive the Iberian peninsula's coming storm?"

 RAJ_GATHERING_STORM_DESC:0 "British India has been a construct often debated among the populations of the Indian subcontinent. Many Indians from the so-called \"jewel of the British Empire\" took part in the Great War and felt betrayed by the blatant disregard for their voices after the sacrifice of tens of thousands of lives. However, arguably the most turbulent times in Indian history are ahead. Will the democratic will of the native population prevail, or will India remain unshaken under British rule?"
 
 BEL_GATHERING_STORM_DESC:0 "Belgium may seem like an insignificant territory between France and Germany, but it's a densely industrialized country extracting precious resources from its Congo colony. The government is recovering from the Great Depression, infrastructure projects are in full swing, and industrial activity is slowly recovering. On the political scene, many voters seek solutions in extremist discourses. Léon Degrelle gains popularity day by day and may threaten the traditional coalitions of democratic parties. Meanwhile, the Flemish nationalists are also active, spreading dissent among the military's lower ranks."
 
 BHU_GATHERING_STORM_DESC:0 "Isolated in the Himalayas, Bhutan stands at the limit of the British sphere of influence. Tied to Britain through the treaty of Punakha, the country has renounced its military forces and relies on the British Indian army for its protection."
 
 BRA_GATHERING_STORM_DESC:0 "By 1936, Brazil is broken. The Coup of 1930 destroyed our traditions and democratic institutions, and soon afterward, a civil war knocked out the industry and infrastructure of the most important Brazilian state, which would make our nation fragile and unstable.\n\nWith Brazil establishing a solid leadership, the Republic must rebuild itself to secure its future."
 
 COG_GATHERING_STORM_DESC:0 "The Belgian Congo is officially a Belgian colony directly ruled by Brussels. In practice, however, the general governor Pierre Ryckmans enjoys a certain degree of autonomy due to the distance from Europe. As an exploitation colony, especially one including the "geological scandal" that is Katanga, the Congo has plenty of resources in its ground. Logically, the extraction of those resources will be one of the priorities of the colonial administration. The territory has plenty of tungsten, copper, rubber, and of course, it has access to the richest mine of uranium ore in the world."
 
 CUB_GATHERING_STORM_DESC:0 "After the Sergeants' revolt that brought down President Carlos Manuel de Céspedes y Quesada, himself having temporarily become President following the fall of the dictator Gerardo Machado, the provisional governments followed one another, still under the close supervision of Fulgencio Batista, now head of the army.\n\nIn the January general election, many see the possibility of a return to a stable government, but this could just as easily lead Cuba back into a spiral of unrest."
 
 CZE_GATHERING_STORM_DESC:0 "It has been almost 20 years since Czechoslovakia gained independence from the Austro-Hungarian empire and the small country now counts amongst some of the most industrialized countries in the world.\n\nHitler's rise to power in Germany has emboldened the German-speaking minority in the border regions and put the small country under international pressure. France, the traditional ally of Czechoslovakia, is in internal political turmoil, and as the diplomatic power of the Little Entente is slowly fading, Europe is changing."

 DEN_GATHERING_STORM_DESC:0 "Since its harrowing defeat in the Napoleonic wars, Denmark has maintained its total neutrality, idly sitting out even the Great War. The ever-rising and growingly rabid Germany to our south worries Danish leaders and citizens alike. Its rapid rearmament may force some uncomfortable mobilization measures on the population. Thorvald Stauning now must keep Denmark neutral and free."
 
 HON_GATHERING_STORM_DESC:0 "After Tiburcio Carias Andino barely won the 1932 presidential election, he cracked down on all forms of political opposition while supporting the United Fruit Company's interests. The leader of the BOC, Manuel Calix Herrera, was arrested and imprisoned on the Bay Islands after organizing several worker strikes in that same year. Now, Honduras finds itself at a crossroads. Will Carias continue his presidency, will the restless campesinos overthrow him, or will the United Fruit Company attempt to seize the country for itself?"
 
 ICE_GATHERING_STORM_DESC:0 "The Danish-Icelandic Act of Union, an agreement with Denmark signed on December 1, 1918, and valid for 25 years, recognized Iceland as a fully sovereign and independent state in a personal union with Denmark. The Government of Iceland established an embassy in Copenhagen and requested that Denmark carry out specific defense and foreign affairs matters on its behalf, subject to consultation with the Althing."
 
 IRE_GATHERING_STORM_DESC:0 "Ireland has been in a rough situation for many years. After winning independence from Britain, Ireland has been struggling in a never-ending trade war with the U.K., and the question of the constitution remains to be seen."
 
 LAT_GATHERING_STORM_DESC:0 "Latvia is at a crossroads. To the east, our old ruler, the Russians, have reformed into the Soviet Union and gaze hungrily westwards. To the west, a resurgent Germany has re-organized and seems more ready than ever to destroy the Baltic States. The next few years will be do-or-die for Latvia. Will we ally ourselves with either behemoth, or shall we strike a new path? Only time may tell, but time is running out."
 
 SWI_GATHERING_STORM_DESC:0 "Since the 1815 Vienna conference on international affairs after Napoleon's defeat, the Swiss Confederation is obliged to stay neutral in conflicts between other nations. However, with the rise of the fascists in Germany, Italy, and even Austria, can the Swiss commit to their neutrality? Or will they have to pick a side in a potential future conflict?"
 
 TIB_GATHERING_STORM_DESC:0 "Tibet may appear as a very stable isolated semi-feudal theocracy, but it is pretty far from the truth. A few years ago, communist and democratic movements were strongly repressed by the ruling religious and civilian aristocracy. The country must reform its army, but at the same time, the monasteries fear a modernizing army that would challenge their position. Last but not least, a Regent rules the country, and the reincarnation of the Dalai Lama must be found and crowned to perpetuate the theocratic system."
 
 VIN_GATHERING_STORM_DESC:0 "§RDo not select Vietnam from this screen! If you want to play it, take the right path in the French Indochina tree.§!\n\nHaving taken the French administration away with arms, Vietnam found itself independent and freed from centuries of colonial oppression.\nThe departure of France leaves a nation still full of problems, one with an uneducated domestic workforce and marred by political conflict, while surrounded by countries that could perfectly well be hostile to it."
 
 SAU_GATHERING_STORM_DESC:0 "After the defeat of Sharif Hussein bin Ali, Emir of the Hejaz, Abdulaziz ibn Abdul Rahman ibn Faisal ibn Faisal ibn Turki ibn Abdullah ibn Muhammad Al Saud launched more than fifteen years of wars for the unification of a large part of Arabia under the Saud dynasty, ending in 1932, giving birth to the Kingdom of Saudi Arabia.\n\nThe Saudi economy is still very precarious, with much of the state's income coming from pilgrimages to the holy cities of Mecca and Medina. However, the basements may well contain a real treasure that would forever change Arabia's economic and geopolitical direction."

 LIT_GATHERING_STORM_DESC:0 "Born in the aftermath of the Great War, Lithuania found itself in a difficult position. Not only was it nearly annexed to the Ober Ost German colonial project, but the Poles managed to take over and annex Vilnius to the new Polish state. Unlike all the countries of the area mainly worried about the ambitions of the Nazis and a possible return of the USSR, we also are a country without its official capital, occupied by those who were our partners for centuries..."

 SWE_GATHERING_STORM_DESC:0 "Having been neutral during the Great War, Sweden stood unscathed in the aftermath of the war that ravaged Europe and saw the fall of Empires across the continent.\n\nNot even thirty years have passed and already a new storm is brewing on the horizon. The Fascists to the south are preparing for another war, and in the east, the Russian bear is slumbering, for now. There are dark days ahead, and Sweden's path is now uncertain once more."

 r56_AFG_GATHERING_STORM_DESC:0 "Born amidst the ashes of the bloody Third Anglo-Afghan War, Afghanistan has been a battlefield of Empires for centuries. The small yet fragile country still suffers from the scars of the Civil War of 1929, which tore the poor nation apart and led to a sharp decline in the Afghan economy. \n\nSince the brutal assassination of Nadir Shah in 1933, the country has been de-facto led by the Regency Council overseeing the deeds of young Muhammad Zahir Shah. However, with dark clouds looming on the horizon, Afghanistan's future remains uncertain..." #was like this before reorganization

 BUL_GATHERING_STORM_DESC:0 "After Tsar Boris brought down Kimon Georgiev's military regime, Bulgaria became increasingly absolutist, far from what its constitution adopted at independence guaranteed. After being surrounded by former enemies and significantly reduced in size following successive defeats during the Second Balkan War and the Second World War, revanchist ideologies have continued to gain popularity. They may well bring Bulgaria back on the road to war."

 CHI_GATHERING_STORM_DESC:0 "Once the most powerful nation on the face of the Earth, China has been brought low by nearly a century of western imperialism and internal strife.\n\nChiang Kai-shek and the Kuomintang, the central government of China, now face threats from both the Japanese Empire, which has already annexed a vast swath of China, and Mao's Communists, who are currently holed up in the hills of Shaanxi. Surrounded on all sides, Chiang now prepares China for a war the likes of which the country has never seen."

 CHL_GATHERING_STORM_DESC:0 "Chile's recent history has been marked by government coups, civil strife, and political strongmen. However, there is hope within many political circles in Chile that the country can return to democracy and political stability. This task is not easy for the democratic coalition who dub themselves the 'Popular Front.' The coalition's rivals include Chile's current leader and dictator, Arturo Alessandri. Who wishes nothing but to see the coalition's demise. Radical trade unions seek to hijack the 'Popular Front' and take it in a Marxist direction. At the same time, the Nacista's fascist movement gains more sympathizers by the day."

 EGY_GATHERING_STORM_DESC:0 "The Kingdom of Egypt remains in a standstill. Almost 15 years have passed since the unilateral declaration of independence from the British Empire, yet latter is still utterly determined to keep the country as a permanent military base in order to safeguard their global empire. The ever more belligerent Italy to the west only reinforces this idea.\n\nEgypt's main aim has always been to gain full independence and establish itself as the dominant power in the region. Perhaps now is the time to embrace desired dreams once and for all?"

 FRI_GATHERING_STORM_DESC:0 "A pearl of the French colonial empire, Indochina is the most profitable French colony. Intended mainly for economic exploitation through its many raw materials, the French presence is relatively weak. The administration primarily relies on support from the indigenous elites, supported by the famous Indochinese riflemen.\n\nThe French presence has constantly been challenged, the most recent uprising being the Yen Bai mutiny in 1930. The economic devastation caused by the Great Depression could very well lead to a new wave of protest."

 GUA_GATHERING_STORM_DESC:0 "Following his victory in an election in which he was the only candidate, Jorge Ubico became the master of Guatemala, characterized by the militarization of a vast number of institutions, including the post office, and placing military officers in high positions while adopting an increasingly pro-American policy and strengthening the United Fruit Company, which controlled a large part of the land, the only railway, and electricity production.\n\nHowever, his admiration for Napoleon may lead Ubico to review his pro-American and pro-status quo policy to develop a more nationalist and pan-Central American policy."

 INS_GATHERING_STORM_DESC:0 "Indonesia may seem to be a stable colony for the inattentive observer, but the situation is much tenser for those living there. The colonial regime is maintained by a mix of repression of the natives while maintaining close ties to their aristocracy. But since the beginning of the century, nationalist organizations have started to appear and demand more autonomy and rights. Most radicals demand the end of colonial rule and are looking for support through revolutionary ideologies."

 LIE_GATHERING_STORM_DESC:0 "Liechtenstein has carefully managed a policy of neutrality since 1868, remaining out of the Great War. However, the nation was still heavily effected by it's echos, which led to a modest revolution in 1918 and the introduction of a new constitution with political allignment towards Switzerland.\n\nHowever, threats to Liechtenstein are rising again, both internally and externally. Turbulent times could pose a grave risk to the country, and it will have to ride a slippery slope in order to not become a mere footnote in history."

 MEN_GATHERING_STORM_DESC:0 "As the drums of war fell silent across the rolling hills of Manchuria, Japan's imperial ambitions were once and for all set in stone, threatening the future survival of any Chinese state. Years of steady conflict and struggle for influence over Inner Mongolia have only tightened Japan's grip, with the Kwantung Army acting as the spearhead of Japan's influence.\n\nThus, for years, political anarchy and disorder have governed the nation, leading to widely unpopular decisions and political indecisiveness... If only for one spark, Inner Mongolia would go down in flames..."

 MEX_GATHERING_STORM_DESC:0 "\n\nMexico stands at the closing days of the Maximato, the period when former president Plutarco Elias Calles held the true power in Mexico using right wing loyalists in both politics and the military. Since 1934, Lázaro Cárdenas del Río has waged a political war to end Plutarco's control over the country and enact his own left wing reforms. Mexico stands at a crossroads while the world prepares for war, as the left wing and right wing battle over control of the country's future and where it stands in the coming new world order."

 MON_GATHERING_STORM_DESC:0 "On the crossroads of the worlds Mongolia has found its resting place since the 1911 proclamation of independence from the Qing Empire. The Soviet aid turned the country into the People's Republic which has undergone huge governmental and economic changes in the recent years. \n\nBut with the new threat rising in the East, the Chinese Civil War lasting to the South and decaying relationship with USSR, the country might become a new frontier if the power balance tilts to the wrong side..."

 MPL_GATHERING_STORM_DESC:0 "Ever since the formation of the Mandate for Palestine in 1923, instability has been the norm. \nWith the mass Jewish immigration into the country following the Balfour Declaration, multiple local governments from both sides fight for control over the region, each having their own paramilitary organizations that vastly outnumber the tiny British garrison stationed in the country.\nWith tensions at an all time high following a series of incidents, the question remains: Can the British hold on? Will the region devolve into yet more fighting? Or perhaps, an unexpected solution will arise?"

 NIC_GATHERING_STORM_DESC:0 "The scars of Augusto Caesar Sandino's rebellion against the government and the American occupation troops are still visible on Nicaraguan society and politics, even more so since the collapse of the economy, mainly based on coffee exports, following the Great Depression.\n\nJuan Bautista Sacasa, who became president in 1933, saw and is partly responsible for the rise to power of the head of the national guard, Anastasio Somoza García, who had taken charge of Sandino's murder in 1934.\n\nIt seems that the fall of Sacasa is near...."

 NOR_GATHERING_STORM_DESC:0 "The early 1900s have been borderline a golden age for Norway. With independence, economic growth, polar exploration and expanded territories on both ends of the globe, the Kingdom of Norway has made its mark on the world. It hasn't all been smooth sailing, however, as Norway's neutral merchant marine suffered losses during the Great War, and more recently the Great Depression has halted the economy somewhat.\n\nWhile the welfare policies of the Labor led Government has sought to alleviate the issues, this \"Broken Gun\" policy with less defense spending has left Norway at some risk..."

 PRC_GATHERING_STORM_DESC:0 "The Chinese Communist Party is on the brink of destruction. After a failed revolution, Communist armies have been broken on all fronts by the KMT, the Communists fled from their bases in southern China to their new base in Shaanxi. From this catastrophe, a new leader emerged for the party: Mao Zedong.\n\nMao brings with him a radical new vision of communism, and a new strategy for survival and expansion. Perhaps the Communists could ally with their former enemies against a greater foe…"

 PRU_GATHERING_STORM_DESC:0 "After the death of the nationalist leader Sanchez Cerro in 1933, the Republic of Peru entered into a profound internal and external political crisis, and the chief of the armed forces, Oscar Benavides, was put in his place.\nThe great crisis that exists within the country has led the economy to a stagnation never seen before and to a severe economic crisis at the gates of the democratic elections of 1936, although it is known in some conspiracy circles that Benavides has the desire to remain in the power."

 r56_ROM_GATHERING_STORM_DESC:0 "As dusk settled on the Russian, Ottoman and Austro-Hungarian Empires following the end of the Great War, Romania, who had fought on the side of the Entente, was now the undisputed hegemon of the Balkans.\nHowever, not all is well in the nation. The country's frail democracy has been in a power struggle with King Carol ever since the beginning of his reign, with Codreanu's Iron Guard waiting for their opportunity to strike.\nNow, with a resurgent Germany looking to expand it's influence in the Balkans, and a new Communist threat to the East eyeing it's former territories, Romania must pick its friends carefully, lest an old enemy come knocking." #has r56_ tag because of conflicting localization

 SPR_GATHERING_STORM_DESC:0 "The Spanish Republic is only five years old but has seen itself confronted with instability from both sides of the political spectrum. The failure of the Asturian uprising in 1934 left many marks on Spanish society, and the corruption of Alejandro Lerroux's government only made the population lose more trust in it, leading to a radicalisation of the population.\n\nOn the left is the Popular Front, united in their anti-fascism and their desire for a reform of the republic, while on the right, the CEDA is getting closer and closer to authoritarianism and corporatism and the Falange is becoming more and more threatening."

 URG_GATHERING_STORM_DESC:0 "While Uruguay was one of the most stable countries in South America, Gabriel Terra's coup d'état was a shock to the small nation. The persecutions brought about by the regime forced many politicians and intellectuals to flee, particularly towards Argentina.\n\nHowever, the dictatorship is far from being entrenched, with a first revolutionary coup attempt in 1935, which may well not be the last."

 VEN_GATHERING_STORM_DESC:0 "The death of dictator Juan Vicente Gómez in late 1935 has unleashed an unprecedented power struggle over who his sucessor would be, even with upcoming elections it still remains unclear.\n\nA nation with widespread corruption and a large reliance on oil exports, the United States of Venezuela might find it hard to find its place as tensions are rising high around the world."

