 MEX_BLITZKRIEG_DESC:0 "\n\nThe Maximato has ended and Calles is gone, but the battle between the left and right wings is still raging on. Emboldened by the economic hardship caused by the PEMEX embargoes, the right wing have become polarized and now exist in a state of political civil war over who will become the right wing candidate for the presidency next year. The dominant PRI however now rests at a choice between compromising their ideals with the moderate candidate Camacho or double down on the left wing candidate Mugica."

 NOR_BLITZKRIEG_DESC:0 "The early 1900s have been borderline a golden age for Norway. With independence, economic growth, polar exploration and expanded territories on both ends of the globe, the Kingdom of Norway has made its mark on the world. It hasn't all been smooth sailing, however, as Norway's neutral merchant marine suffered losses during the Great War, and more recently the Great Depression has halted the economy somewhat.\n\nWhile the welfare policies of the Labor led Government has sought to alleviate the issues, this \"Broken Gun\" policy with less defense spending has left Norway at some risk..."

