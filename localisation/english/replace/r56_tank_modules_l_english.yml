l_english:

 ### R56 EQUIPMENT MODULES ###

 r56_tank_front_plate_fixed_superstructure_turret:0 "Turret Shield"
 r56_tank_front_plate_fixed_superstructure_turret_desc:0 "A metal armor plate is mounted on the desired main armament to protect the gunner team from forward-facing small arms fire. However, the sides are left seriously opposed compared to a more complete fixed superstructure. It allows the factory to mount a larger cannon than ordinarily possible on a lighter chassis. The shield also costs next to nothing to produce compared to other options."
 r56_tank_platform_mount_turret:0 "Gun Platform"
 r56_tank_platform_mount_turret_desc:0 "A platform for mounting a field piece is retrofitted ontop of the chassis. The gunner crew is exposed to a small arms fire while firing the cannon. Making the tank nearly utterly useless in a traditional armor role. It provides the team better protection while on the move than other motorized field pieces. It also makes the tank cheaper to produce as a whole due to the reduced need for armor plating and a little faster. The factory can also mount a larger cannon than ordinarily possible on the chassis. Admittedly, it makes the tank look like a metal platform and some wood placed on an oversized tractor."
 r56_tank_light_tankette_superstructure_turret:0 "Tankette Superstructure"
 r56_tank_light_tankette_superstructure_turret_desc:0 "By simpling combining the tank's front armor plating with it's superstructure to have the turret and crew sit low on the chassis. We can make faster and more concealed tanks. Though the design's performance is a bit lackluster compared to newer methods of turret mounting."
 r56_tank_light_oscillating_turret:0 "Oscillating Turret"
 r56_tank_light_oscillating_turret_desc:0 "The oscillating turret is an invention that replaces the raising and lowering of the gun within the turret with the movement of the entire turret. This means the gun requires less space within the turret, and can be installed in a higher position which in turn allow for the fitting of a bigger armament."
 oscillating_turret_unlock_tt:0 "The §YOscillating Turret§! allows light tanks to carry medium weapons without sacrificing as much armor as superstructures and partially armored turrets."
 r56_tank_anti_tank_rifle_gun:0 "Anti-Tank Rifle"
 r56_tank_anti_tank_rifle_gun_desc:0 "§YAnti-Tank Rifle§!\n\nAdopted from infantry anti-tank rifles, the rifle is a larger caliber self-chambering semi-auto version of its infantry-carried counterpart. It has good enough anti-material penetration. However, anything with more than a modest amount of armor protection would stop the round it fires, thus limiting its anti-tank performance."
 r56_tank_anti_tank_rifle_gun_2:0 "Improved Anti-Tank Rifle"
 r56_tank_anti_tank_rifle_gun_2_desc:0 "§YImproved Anti-Tank Rifle§!\n\nImprovements in ammunition and riffling have increased the armor penetration performance of our anti-tank rifles. However, its ability to stop anything with a decent amount of armor protection is nonexistent. Still, it can take out interwar tank models with greater ease compared to its last-generation counterpart."
 r56_tank_heavy_cannon_4:0 "Modern Heavy Cannon"
 r56_tank_heavy_cannon_4_desc:0 "A weapon that can fire a large shell. With exceptional armor penetration and decent performance against soft targets, its biggest drawbacks are the sheer size and cost, which make it too unwieldly to be mounted in most vehicles not specifically designed to carry it."
 r56_tank_high_velocity_cannon_4:0 "Modern High-Velocity Cannon"
 r56_tank_high_velocity_cannon_4_desc:0 "A cannon specifically designed to achieve a high muzzle velocity. Using specialized ammunition, it has superb anti-armor characteristics, but its performance against soft targets suffers."
 r56_tank_medium_cannon_3:0 "Advanced Medium Cannon"
 r56_tank_medium_cannon_3_desc:0 "A general-purpose weapon well suited to a wide variety of tasks. It excells at neither anti-infantry nor anti-tank work, but it provides a vehicle with a lot of flexibility."
 r56_tank_medium_cannon_4:0 "Modern Medium Cannon"
 r56_tank_medium_cannon_4_desc:0 "A general-purpose weapon well suited to a wide variety of tasks. It excells at neither anti-infantry nor anti-tank work, but it provides a vehicle with a lot of flexibility."
 r56_tank_supercharger:0 "Supercharger"
 r56_tank_supercharger_desc:0 "By compressing incoming air, a supercharger increases the overall oxygen intake of the tank's engine in each combustion cycle, allowing it to achieve greater horsepower and torque. The added power helps the tank accelerate much faster, climb steeper terrain or carry heavier armor or weapons effectively."
 r56_tank_hull_lmg:0 "Hull-Mounted LMG"
 r56_tank_hull_lmg_desc:0 "Being installed in the front hull of the tank, slightly offset from the driver and operated by the bow gunner, the hull-mounted light machine gun provides the tank with a much more efficient way of suppressing enemy infantry, and other soft targets, without the need to utilize its main cannon. However, it also provides the tank with a significant weakspot, which might end up hindering it in the long-term."
 EQ_MOD_CAT_r56_tank_rangefinder_category_TITLE:0 "Rangefinders"
 r56_tank_optical_rangefinder:0 "Optical Rangefinder"
 r56_tank_improved_optics:0 "Improved Optics"
 r56_tank_improved_optics_desc:0 "By including higher-quality gun sights, periscopes and observation instruments offering clearer images and greater magnification, the tanks gunner will have a much easier time identifying, spotting or tracking the enemy. This gives us a much larger advantage while fighting in open terrain, where spotting the enemy first might be a life or death situation."
 r56_tank_optical_rangefinder_desc:0 "Utilizing stereoscopic or coincidence methods, the optical rangefinder allows the gunners within the tank to precisely and efficiently estimate the distance of the enemy. This reduces the need for skilled gunners, and greatly increases the survivability of long-range duels between tanks."
 r56_tank_advanced_rangefinder:0 "Advanced Rangefinder"
 r56_tank_advanced_rangefinder_desc:0 "By using longer base lengths and clearer optics, the improved optical rangerfinder offers much greater precision, as well as much faster readings, allowing gunners to acquire range data even under the stress of combat. Having greater precision is the deciding factor of many long-range duels."
 r56_tank_electro_mechanical_fire_control:0 "Electro-Mechanical Fire Control" # Unused? - Dutch
 r56_tank_electro_mechanical_fire_control_desc:0 "" # Unused? - Dutch
 r56_tank_coaxial_support_cannon:0 "Coaxial Support Cannon"
 r56_tank_coaxial_support_cannon_desc:0 ""

