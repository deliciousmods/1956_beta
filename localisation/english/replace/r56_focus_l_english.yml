 CHL_found_national_steelworks_tt: "Unlocks the decision §Y$CHL_expand_araucanian_steelworks_decision$§! to gain more §YSteel§! in §Y[1063.GetName]§!"  #State mismatch
 CHL_propose_closer_cooperation_desc: "The communist states in our surroundings may share our ideology, but they are scattered strategically and have no coordination. We should bring them under our wings, and help better guide them." #Capitalization
 CHL_align_with_the_russian_soviet: "Align with the [SOV.GetAdjective]'s" #Edit because r56 nation names are longer
 CHL_enforce_the_chilean_identity_tt: "When the national spirit §Y$CHL_ancestral_mapuche_resistance$§! is removed, regain the core on [1063.GetName]."  #State mismatch
 BRA_anaue_tt: "Unlock decisions to recruit Integralist militia divisions in states after completing rallies there. \nRecruits a new general with the §Y$militias_officer$§! trait: \n Militia Defense §G+5%§! \n Militia Speed §G+5%§! \n Militia Organization §G+5%§!"  #Typos
 ARG_maintain_neutrality: "Maintain Neutrality" #edit
 ARG_end_operation_bolivar_desc: "We have discovered a continuous stream of espionage missions funneled into the country from the [GER.GetName]. They humorously named this 'Operation Bolívar'. This is unnacceptable, and we must immediately put a stop to all [GER.GetAdjective] operations in [ARG.GetName]." #Typo
 ARG_conquer_paraguay: "Conquer [PAR.GetName]" #Edit because r56 nation names are longer
 ARG_reach_out_to_the_soviet_union: "Reach Out to the [SOV.GetAdjective]'s" #Edit because r56 nation names are longer
 ARG_reach_out_to_the_soviet_union_tt: "Taking this focus will unlock the §YVanguardia Socialista§! division template when the §Ycivil war§! breaks out and will recruit §Yfive§! Vanguardia Socialista units in §Y[1067.GetName]§!." #State mismatch
 ARG_unite_the_workers_of_argentina_desc: "If we are to change [ARG.GetNameDef] for the better, we have to convince the proletariat of our nation that radical improvements are necessary to end their suffering. Let us unite the workers from all vocations and show the government that status quo needs to end!"  #Typo
 ARG_a_red_south_america: "A Red South America" #Edit
 ARG_unify_south_america: "Unify South America" #Edit
 GUAY_rekindle_old_gripes_ARG_PAR_tt: "If we control §Y[1069.GetName]§! within §Y365 days§! from the outbreak of war [ARG.GetName] will have to white peace or face catastrophic morale loss."  #State mismatch
 GUAY_national_academy_of_sciences_3: "Universities for All Across the Continent" #Edit
 PAR_request_weapons: "Request [USA.GetAdjective] Weaponry" #Edit because r56 nation names are longer
 PAR_purge_the_military_of_dissent: "Purge the Military of Dissent" #Capitalization
 URG_brou: "Banco de la República Oriental del Uruguay" #Edit
 URG_pluna_desc: "Primeras Líneas Uruguayas de Navegación Aérea" #Edit
 URG_establish_the_german_uruguayan_cultural_center: "Empower the [GER.GetAdjective]-[URG.GetAdjective] Cultural Center"  #Edit
 URG_break_diplomatic_relations_with_the_axis_desc: "Despite declaring neutrality, it has become clear that the Axis can no longer be tolerated. The winds of the war are strictly in favor of the Allies, and it does not behoove us to be on the losing side." #Typos
 URG_legacy_of_batlle_desc: "The shadow of José Batlle y Ordóñez's presidency continues to loom over Uruguay, and shape both its internal and exteral politics. As the architect of sweeping social and economic reforms, Batlle laid the groundwork for a modern welfare state, fostering a culture of progressivism and state intervention. Yet, his legacy is not without controversy. While many champion his vision of a democratic and egalitarian Uruguay, others view his policies as a source of economic stagnation and political instability..." #Edit
 URG_statism_desc: "A clear and strong state with centralized control over social and economic affairs is a must in these times."
