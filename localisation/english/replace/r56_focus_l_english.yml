 SWE_revoke_anti_militia_laws: "Revoke Anti-Militia Laws" #caps
 SWE_hemvarnet: "Hemvärnet"
 SWE_hemvarnet_desc: "The idea of the National Guard, or Hemvärnet, is one that we need to expand upon. Should we find ourselves under attack we need to be able to quickly mobilize a larger army to help repel the invaders." #edit
 SWE_rationing: "Rationing"
 SWE_rationing_desc: "While the idea of having to ration your food and water might not be the most thrilling, it is vital that everyone knows how to ration properly should we come under attack and our access to trade from the outside world is cut off." #edit
 NORDIC_nuclear_research: "Nuclear Research" #caps
#bba_focus_l_english
 ETH_african_central_bank_2_tt:0 "$MODIFIER_STABILITY_FACTOR$: §R-5%§! \n$modifier_production_speed_industrial_complex_factor$: §R-10%§! \n$modifier_production_speed_infrastructure_factor$: §R-10%§!" #Edit for balance?
 ITA_balkan_ambition:0 "Claims on Yugoslavia" #edit
 ITA_setting_course:0 "Setting Course"  #capitalization
 ITA_mafia_abroad:0 "Mafia Abroad"  #capitalization
 ITA_liberate_the_workers_of_africa:0 "Liberate the Workers of Africa"  #capitalization
 SWI_national_redoubt_desc:0 "Henri Guisan is proposing a different way of defending [ROOT.GetName]. Instead of trying to defend the borders of our country regardless of the price, we can strategically cede the Swiss Plateau and retreat to the alps, where we can make it costly for the enemy to occupy us."  #Edit?
 SWI_adopt_romansh_desc:0 "[ROOT.GetName] is not a country formed by [GER.GetAdjective], [FRA.GetAdjective] and [ITA.GetAdjective] regions meant to be claimed by our greedy neighbors. [ROOT.GetName] is a single, indivisible multicultural nation. Adopting Rumantsch, a language only spoken in the mountains of our [ROOT.GetAdjective] Alps will show them our culture and values are distinct from theirs, regardless of language."  #Edit?
 SWI_ortswehren_desc:0 "Total war means every [ROOT.GetAdjective] citizen must be ready to defend their region, but not everyone is able to join our militias. We can establish local guards to serve as a backbone the militias can rely on to support them in their efforts to defend [ROOT.GetNameDef]."  #Edit
 SWI_citizen_supply_mandate_desc:0 "We do not know how an invasion would play out, and event if we could rely in a centralized supply network, that's not compatible with our command structure. That is why every [ROOt.GetAdjective] household must store at least 2 months of supply in their own homes, both for them and for their local militias."  #Edit?
 SWI_take_a_stance_desc:0 "Fascist [?SWI_biggest_fascist.GetNonIdeologyName] possesses the most disgusting and miserable political system. [?SWI_biggest_fascist.GetNameDefCap] is the mortal enemy of the new [ROOT.GetName]; this is why we must make our stand and defend our democracy by any means." #edit
#bftb_focus_l_english
 GRE_open_foreign_subsidized_factories_tt:0 "One §YMilitary Factory§! and one §YCivilian Factory§! will be added for each of the following countries that §Yis not in a civil war§! and has an §Yopinion§! of §YGreece§! greater than §G80§!: \n§Y[FRA.GetNameDef]§!, §Y[ENG.GetNameDef]§!, §Y[GER.GetNameDef]§!, and §Y[SOV.GetNameDef]§!."  #Changed TT to account for sanity check
 GRE_bedrock_of_balkan_financial_stability_tt:0 "We will receive one off-map §YCivilian Factory§! for every starting country in the §YWestern Balkans§!, the §YEastern Balkans§!, and the §YNorthern Balkans§! that has more than §Y50§! §Yopinion§! of us. This applies also to §Y[AUS.GetNameDef]§!, §Y[CZE.GetNameDef]§!, and §Y[TUR.GetNameDef]§!." #Changed TT because of balance change
#dod_focus_l_english
 HUN_the_balkan_pact:0 "The Danubian Pact"  #Edit
 HUN_the_balkan_pact_desc:0 "The democracies of the West are too far away to aid us, and so we must seek allies closer to home. As the leader of the Danubian Pact, we will offer them our protection and lead them to victory!"  #Edit
 HUN_announce_the_gyor_program:0 "Announce the Györ Program"  #Edit for English name
 HUN_assault_gun_focus_desc:0 "Rather than focus on full-fledged tanks, we will instead rely on assault guns to air our infantry in affecting breakthroughs, as a more cost-effective alternative." #Typo?
 HUN_submarines_desc:0 "Submarines came close to beating the most powerful navy on the planet in the last war. We can not be taken seriously as a modern navy if we do not possess submarines of our own."  #Typo
 YUG_limited_self_government:0 "Devolution" #Edit
 YUG_mountain_brigades_desc:1 "Large parts of our nation consist of mountains, requiring the formation of special brigades specialized in combat in this type of terrain."  #Typo
 YUG_naval_bombers_desc:1 "The Adriatic is long but narrow, making it easily accessible to airplanes based in our airfields. Developing dedicated naval bomber models could significantly improve the chances of our navy against more powerful adversaries." #Edit
 ROM_balkans_dominance_desc:0 "The key to a prosperous Romanian future lies not with the revolutionaries of the East, or the democracies or fascists of the West, but with Romanian dominance of the Balkans."
 ROM_divide_yugoslavia_desc:0 "The current arrangement of the Balkan states making up Yugoslavia is not maintainable. We will issue an ultimatum requiring a restructuring of their component states, under Romanian leadership."
 ROM_secure_the_bosporus_desc:0 "Our naval access is, for now, limited to the Black Sea. Turkey, straddling the Bosporus Strait, could block our access to the Mediterranean in the case of war, and so we must ensure free passage for when we have need of it."
 ROM_appoint_german_friendly_government_tooltip:0 "Removes §YConstitutional Guarantees§! and §YSecuritate§!\n"
 ROM_appoint_allied_friendly_government_tooltip:0 "Removes §YIron Guard§! and §YSecuritate§!\n"
 ROM_appoint_soviet_friendly_government_tooltip:0 "Removes §YConstitutional Guarantees§! and §YIron Guard§!\n"
 ROM_handle_the_king_desc:0 "Legislation must be put in place to curtail the King's exuberant lifestyle. The national treasury may no longer be appropriated for his personal expenses."
 ROM_the_armored_division_tt:0 "Gain a unit with §Y4 Medium Armor§! and §Y4 Motorized§! battalions.\n"
 YUG_invite_turkey_desc:0 "The Turkish people were freed from their Caliph over a decade ago, they have still yet to be freed from their bourgeoise masters. Though the Republican People's Party of Turkey claims to be a "social-democracy", in truth, they have failed utterly to break the chains of their people and it is only with a direct Yugoslavian intervention that we may truly liberate all of the workers of the Balkans."
 YUG_dissolve_serbia_desc:0 "The region we consider "Serbia" is actually home to many people who do not consider themselves Serbs. Macedonians, Albanians, and Montenegrins all inhabit areas we claim to be Serbian. We must not allow ourselves to be perceived as invaders of their culture and we must rethink what we consider to be rightfully Serbian."
 YUG_surrender_macedonia_desc:0 "Bulgaria too has reason to rival us; claiming regions of southern Serbia and Macedonia for themselves. By ceding their claims to them, we will both silence the threat on our southern border and make Macedonian nationalism Bulgaria's problem."
 YUG_defence_army_of_yugoslavia_desc:0 "To fight for our union is a difficult thing to ask of the average citizen, but to fight for one's own home is every man's duty. With the promise of independence on the horizon, our union is overflowing with men willing to fight our enemy; all they need is government support."
 YUG_modern_tanks_desc:1 "By adding large-caliber main weaponry, armored technology has developed well beyond the simple intention of safely transporting forces from point A to point B. We must build our version of modern tanks to compete with our neighbors."
 YUG_mountain_brigades_desc:1 "Large parts of our nation consist of mountains, requiring the formation of special brigades specialized in combat in this type of terrain."
 YUG_artillery_regiments_desc:1 "By introducing powerful artillery regiments to our divisions, their overall fighting strength will significantly increase."
 YUG_naval_bombers_desc:1 "The Adriatic is long but narrow, making it easily accessible to airplanes based in our airfields. Developing dedicated naval bomber models could significantly improve the chances of our navy against more powerful adversaries."
 YUG_crush_ustasa_desc:0 "The government's decision to crack down on the fascist Ustasa group has agitated supporters of Croatian independence and the Ustasa are rapidly preparing for an armed uprising against the government. If we fail to dismantle this fascist organization in a timely manner, the Ustasa may well overpower the local Croatian government and raise their flag in rebellion against our state."
 YUG_local_self_management:0 "Local Self-Management"
 YUG_rogozarski:0 "Rogožarski"
 YUG_invite_greece_desc:0 "While Greece is not a slavic country in any way, it's an important partner in the region and we must not push them in the arms of the Soviets."
