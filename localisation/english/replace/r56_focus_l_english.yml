 MEX_focus_royal_dutch_shell_desc: "Royal Dutch Shell is a British and Dutch firm holding 60% of Mexican oil concessions. By compromising with the foreign oil companies on the matter of labor disputes, we can come to an accommodation that is beneficial to us both." #typo
 MEX_focus_purchase_belize_desc: "This small territory was long claimed by the Spanish crown in colonial times, though never settled by peninsulares. After the loss of Spain's colonial empire during the Napoleonic Wars, Britain gradually solidified a hold on the territory, culminating in the creation of the colony of British Honduras in 1862. The territory ought to be turned over to Mexico as a gesture of good faith." #typo
 MEX_focus_triumph_over_the_cristeros: "Triumph Over the Cristeros" #typo
 MEX_focus_depoliticised_army_desc: "The generals have no right to the allegiance of their soldiers. The ultimate source of legitimacy is the Mexican state. We should prevent the generals entertaining any thoughts of rebellion by rotating them between provinces so that they cannot build up patronage networks or secure the personal loyalty of their soldiers." #typo
 MEX_focus_the_gold_shirts_desc: "General Nicolás Rodríguez Carrasco formed the Gold Shirts in 1933 to defeat communist traitors working against the government. The paramilitary group should become a wing of the government as their goal is admirable and their methods necessary." #typo
 ENG_withdraw_from_contested_territories_desc: "A number of territories across the globe, considered part of the British Overseas Territories, are claimed by neighboring states. This causes diplomatic tensions, and so it may be better to reassess their status as under United Kingdom jurisdiction." #typo
 ENG_bermuda_invasion_launch_point_desc:1 "An invasion of North America will not be an easy task. We must build up our possessions in Bermuda to be able to accommodate the invasion force for such a duration of time as is necessary, before it can then be sent to spread the Revolution directly to American shores." #typo
 HOL_finish_the_noordoostpolder_desc: "Starting in 1936, the process of polderizing the area of the IJsselmeer next to the Overijssel province is finally close to completion. But when the process is completed, it will still be unused land that needs to be settled and exploited."  #Edit
 HOL_pre_empt_venezuelan_aggression: "Pre-empt Venezuelan Aggression"  #typo
 HOL_overturn_military_budget_cuts_desc: "The economy has begun recovering surprisingly quickly after we abandoned the Gold Standard... The military budget cuts we were forced to implement to keep the Guilder from devaluing can now be overturned." #typo
 HOL_volk_en_vaderland: "Popularize the "Volk en Vaderland"" #edit
 HOL_de_jeugdstorm: "Begin De Jeugdstorm Recruitment" #edit
 HOL_placate_the_japanese: "Concessions to [JAP.GetNameDef]" #Edit
 HOL_placate_the_japanese_desc: "It is known that the [JAP.GetAdjective] have designs on our prosperous colonies in the East. Our armed forces would not be able to fend off this threat. Perhaps we could establish a favorable agreement."
 HOL_taking_back_french_flanders: "Taking Back [29.controller.GetAdjective] Flanders"
 HOL_taking_back_french_flanders_desc: "The historical extent of the low countries have since been partitioned by the major powers surrounding it. Of these, [29.controller.GetNameDef] still holds a sizeable amount of land that is considered a part of historical Flanders. We are now strong enough to take it back, and so we should."
 HOL_pre_empt_western_intervention: "Pre-empt Western Intervention" #typo
 HOL_oranje_boven: "Back to Oranje Boven!" #edit
 HOL_go_with_britain: "Go With Britain" #typo
 HOL_de_vaarplicht: "Reintroduce De Vaarplicht" #edit
 HOL_lead_the_minor_democracies_desc: "As the major powers of our day seem hell-bent on another war, it is left to the small democracies of Europe to keep the world from burning, like a crowd keeping two fighters from each other. We shall lead the others in forming a bloc of neutrality against the warmongers." #typo
