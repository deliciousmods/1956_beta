 MEX_high_illiteracy:0 "High Illiteracy"  #New starting idea for the MTG tree
 MEX_high_illiteracy_desc:0 "Neglect from previous national governments has led to Mexico today possessing a large, mostly rural illiterate population. Strong action from the government will be needed to curb this roadblock to our development."
 MEX_focus_royal_dutch_shell_desc:0 "Royal Dutch Shell is a British and Dutch firm holding 60% of Mexican oil concessions. By compromising with the foreign oil companies on the matter of labor disputes, we can come to an accommodation that is beneficial to us both." #typo
 MEX_focus_purchase_belize_desc:0 "This small territory was long claimed by the Spanish crown in colonial times, though never settled by peninsulares. After the loss of Spain's colonial empire during the Napoleonic Wars, Britain gradually solidified a hold on the territory, culminating in the creation of the colony of British Honduras in 1862. The territory ought to be turned over to Mexico as a gesture of good faith." #typo
 MEX_enforce_the_calles_law2_tt:0 "§RLocks§! Decision: §YReconciliation Committee§!"
 MEX_focus_triumph_over_the_cristeros:0 "Triumph Over the Cristeros" #typo
 MEX_decision_fund_secular_education:0 "Fund Secular Education"
 MEX_decision_fund_secular_education_desc:0 "The time has come to take decisive action against rural illiteracy in Mexico. We shall forge a new generation of Mexicans, untainted by clerical corruption, and united behind our great nation."
 MEX_decision_promote_catholic_schooling:0 "Promote Catholic Schooling"
 MEX_decision_promote_catholic_schooling_desc:0 "The time has come to take a stand against the harrowing illiteracy that is a fact of life for our rural regions. By utilizing Catholic organizations in our efforts, we can work valiantly to forge a new generation of bright, god-fearing Mexicans."
 MEX_focus_depoliticised_army_desc:0 "The generals have no right to the allegiance of their soldiers. The ultimate source of legitimacy is the Mexican state. We should prevent the generals entertaining any thoughts of rebellion by rotating them between provinces so that they cannot build up patronage networks or secure the personal loyalty of their soldiers." #typo
 MEX_focus_the_gold_shirts_desc:0 "General Nicolás Rodríguez Carrasco formed the Gold Shirts in 1933 to defeat communist traitors working against the government. The paramilitary group should become a wing of the government as their goal is admirable and their methods necessary." #typo
 ENG_withdraw_from_contested_territories_desc:0 "A number of territories across the globe, considered part of the British Overseas Territories, are claimed by neighboring states. This causes diplomatic tensions, and so it may be better to reassess their status as under United Kingdom jurisdiction." #typo
 ENG_bermuda_invasion_launch_point_desc:1 "An invasion of North America will not be an easy task. We must build up our possessions in Bermuda to be able to accommodate the invasion force for such a duration of time as is necessary, before it can then be sent to spread the Revolution directly to American shores." #typo
 HOL_pre_empt_venezuelan_aggression:0 "Pre-empt Venezuelan Aggression"  #typo
 HOL_overturn_military_budget_cuts_desc:0 "The economy has begun recovering surprisingly quickly after we abandoned the Gold Standard... The military budget cuts we were forced to implement to keep the Guilder from devaluing can now be overturned." #typo
 HOL_volk_en_vaderland:0 "Popularize the "Volk en Vaderland"" #edit
 HOL_de_jeugdstorm:0 "Begin De Jeugdstorm Recruitment" #edit
 HOL_taking_back_french_flanders:0 "Taking Back [29.controller.GetAdjective] Flanders"
 HOL_taking_back_french_flanders_desc:0 "The historical extent of the low countries have since been partitioned by the major powers surrounding it. Of these, [29.controller.GetNameDef] still holds a sizeable amount of land that is considered a part of historical Flanders. We are now strong enough to take it back, and so we should."
 HOL_pre_empt_western_intervention:0 "Pre-empt Western Intervention" #typo
 HOL_oranje_boven:0 "Back to Oranje Boven!" #edit
 HOL_go_with_britain:0 "Go With Britain" #typo
 HOL_de_vaarplicht:0 "Reintroduce De Vaarplicht" #edit
 HOL_lead_the_minor_democracies_desc:0 "As the major powers of our day seem hell-bent on another war, it is left to the small democracies of Europe to keep the world from burning, like a crowd keeping two fighters from each other. We shall lead the others in forming a bloc of neutrality against the warmongers." #typo
