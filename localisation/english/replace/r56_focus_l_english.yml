 china_warlord_focus:0 "Chinese Warlord Focus Tree"
 china_nationalist_focus:0 "Republic of China National Focus" #rewritten - was really weird
 CHI_labor_reform_desc:1 "The methods and customs of working in China have developed over millennia. It is time to move them into the modern age." #typo
 CHI_complete_horgos_hami_road:0 "Complete Hargos-Hami Road"
 CHI_complete_horgos_hami_road_desc:0 "Industrial development of our country is halted by the its underdeveloped infrastructure. Connecting Western industrial areas with backwater regions of the East will allow goods and people to travel freely through the country."
 CHI_give_falkenhausen_citizenship_desc:0 "The German advisors have rendered stellar service in rebuilding and modernizing our military. We should ensure that they can stay here, no matter how the political situation might change." #typo
 CHI_chinese_general_staff_desc:0 "A well-organized General Staff is the key to planning complex operations. We should learn from the German example and create a similar organization." #typo
 CHI_experimental_mechanised_unit:0 "Experimental Mechanized Unit" #typo
 CHI_combined_arms_warfare_desc:0 "While trucks are good enough for the initial experimentation in modern mechanized warfare, their poor cross-country performance and lack of armor makes them ill-suited for front-line work." #typo
 CHI_elite_mountaineers_desc:0 "Alpine Warfare is an entirely different beast than combat in the plains. We should train specialized divisions in this art to make the best use of our terrain." #typo
 CHI_integrate_tibet_desc:0 "The experiment of [TIV.GetAdjective] independence is over. A military invasion is an option, but we should try and bring them back into the fold by peaceful means." #typo
 CHI_imperial_legacy_desc:0 "China has stood as the dominant force in the East for millennia, guaranteeing peace and stability in the region. It is time we reclaim our former position." #typo
 CHI_naval_aviation_desc:0 "The future of naval warfare is the aircraft carrier. We will never be considered a true naval power unless we possess carriers of our own." #typo
 CHI_modern_submarines_desc:0 "The Japanese are unwilling to provide us with the technical knowledge to challenge their fleet in open combat, but they consider submarine warfare an auxiliary arm. We, of course, do not necessarily need to share that opinion." #typo
 CHI_coastal_patrol_planes_desc:0 "Our long coast lines can only effectively be patrolled from the air. Modern naval bombers will allow us to defend our coasts without expending to many resources." #typo
 CHI_refugee_resettlement_desc:0 "The millions of desperate and homeless refugees created by the war need to be settled somewhere. Giving them shelter in our territory means we can keep them as a recruiting pool for our army and the economy." #typo
 CHI_rural_schooling_desc:0 "A well-educated population is the key to modernizing a nation. We can not rely on a small handful of educated administrators, but need to carry the spirit of knowledge and science into every village." #typo
 CHI_inter_party_coordination_council_desc:0 "A first step to turning our country into a functioning multi-party democracy and ending the necessary tutelage of the people will be an organization that allows other interested parties to have their say in policy making." #typo
 CHI_judicial_yuan_desc:0 "Dr. Sun Yat-Sen envisioned a modern republic with a separation of powers. Our judiciary needs to be independent of outside influence and decide cases based on the law, and the law alone." #typo
 CHI_control_yuan_desc:0 "Corruption is inevitable in any government. Effective government requires an effort to keep it in check. We will create a separate branch of government, equal to the legislative, executive and judiciary branches." #typo
 CHI_examination_yuan_desc:0 "For thousands of years, Chinese bureaucrats were selected in stringent examinations. While the necessary texts may have changed, the principle remains the same." #typo
 CHI_foreign_threats_desc:0 "A few years ago, the Japanese wrenched Manchuria away from us and created a puppet state. They will not stop until they have subjugated all of China. We must be ready to face them, even if it means making deals with local strongmen." #typo
 CHI_unified_industrial_planning_desc:0 "Our aggressive program of industrialization must not be delayed." #typo
 CHI_expand_the_academica_sinica_desc:0 "For millennia, China has led the world in development of the arts and sciences. Increased funding for our universities is just the first step to reclaim that position." #typo
 PRC_strengthen_the_central_secretariat_desc:0 "Following the Long March, we must reorganize our political organization to create a state that can compete with the Nationalists." #typo
 PRC_soviet_economic_aid_desc:0 "The devastation of the Long March would take generations to overcome without outside help. We should approach the Soviets to ask for economic assistance." #typo
 PRC_internationalism_desc:0 "The workers and peasants of the world must unite to cast off their shackles. Shoulder to shoulder, we will build a better future." #typo
 PRC_agrarian_socialism_desc:0 "China is not like the industrialized nations of the world. To expect a communist revolution as Marx imagined is to misunderstand the position our country finds itself in." #typo
 PRC_socialism_with_chinese_characteristics:0 "Socialism With Chinese Characteristics" #why it was marxism
#wuw_focus_l_english
 wuw_HUN_stage_an_uprising_in_leitha_desc: "The uprising against the Austrians in the Lajtabánság in 1921 proved that the people of [1086.GetName] wish to be a part of our great nation. We should send in agents to attempt this same thing a second time, immediately offering them protection and moving to occupy the region."
 wuw_HUN_stage_an_uprising_in_leitha_tt: "§RThis may lead to war with the owner of [1086.GetName]!§!"