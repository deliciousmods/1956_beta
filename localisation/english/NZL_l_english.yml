 NZL_combat_asian_communist_movements: "Combat Asian Communist Movements"
 NZL_combat_asian_communist_movements_desc: "While we support self-determination, we cannot allow the corrupting influence of communism to spread further into Asian society, threatening the stability of committed nations in decolonization processes." # TODO LOC
 NZL_support_indochinese_intervention: "Support Indochinese Intervention"
 NZL_support_indochinese_intervention_desc: "We must support intervention in Indochina to prevent the spread of communism and uphold regional stability."
