 NZL_support_chinese_immigration_idea: "Chinese Immigration Wave"
 NZL_support_chinese_immigration_idea_desc: "Due to the conflit - many seek a chinese seek a new home and relative safety from the conflict. However, concerns have arisen that the new wave of migrants bring with them cheap labour and may destabilize the economy."
 NZL_gold_rush_idea: "The Gold Rush"
 NZL_gold_rush_idea_desc: "Many Settlers flock to New Zealand in hopes of striking it big, The newly prospected lands of Otago promise vast gold reserves, however fears grow that this gold is not as plentiful as many hope."
 NZL_gold_fevour_ends: "The Gold Fevour Ends"
 NZL_gold_fevour_ends_desc: "As many have suspected, more permits have been issued than there is gold, many feel disheartened and return to their origin countries, However some have chosen to settle in the land of Aotearoa hoping for a new start."
