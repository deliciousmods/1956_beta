 NZL_loyalty_to_moscow_desc: "The model of Socialism practiced in the Soviet Union might not be perfect, but it is beyond any reasonable doubt that the Soviet Union has achieved the highest degree of implementation of socialist ideas. We would be fools to try and find our own way."
