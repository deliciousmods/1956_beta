 # Decisions
 NZL_prison_system_cat: "Review of the Prison System"
 NZL_prison_system_cat_desc: "Our Prisons are a reflection of the justice system and our ability to maintain order, Many hope for a change to a system promoting rehabilitiation instead of incarcaration, However with growing political unrest, wartime security concerns, and the challenge of handling subversive elements - We must review the system carefully."
 NZL_abolish_hard_labor_sentences: "Abolish Hard Labour Sentencing"
 NZL_abolish_hard_labor_sentences_desc: "Hard labor should not serve as a punishment, It is a primitive and outdated method in a society that values its citizens, regardless of their status. We must eliminate this practice and seek alternative forms of punishment."
 NZL_release_minor_offenders: "Amnesty Program for Minor Sentences"
 NZL_release_minor_offenders_desc: "We may release the strain on some of our Prisons by paroling petty offendees - Freeing up the much needed space for far more harrowing crime than pickpocketting!"
 NZL_develop_open_prisons: "Develop Open-Prisons"
 NZL_develop_open_prisons_desc: "Open Prisons will allow for much hastier rehabilitation, by allowing freedoms to offenders they may see light in co-operating and recovering into the new society we are building."
 NZL_offer_military_service: "Penal Military Service"
 NZL_offer_military_service_desc: "We can offer military service as a substitute to time served behind bars, these men can be useful to our military and our society once again."
 NZL_finalize_the_review_positively: "Finalize the Prison Review"
 NZL_finalize_the_review_positively_desc: "We have done everything in our power to establish a new prison system that creates opportunity and maintains equality among the incarecarated, Let us hope it's enough."
 NZL_finalize_the_review_negatively: "End the Farce"
 NZL_finalize_the_review_negatively_desc: "The Prison System is perfect as is, the incarcerated are there for a reason, we will not allow their crimes to destroy our society once more."
 
