 # Imperial Branch
 NZL_the_sun_never_sets: "The Sun Never Sets"
 NZL_the_sun_never_sets_desc: "We are a proud dominion, one with long ties to our mother nation, while many still believe we should cut our ties and seek independence, united with Britain we shall stand, we will be the arm in the Pacific that ensures the survival of the Empire."
 NZL_abolish_the_legislative_council: "Abolish the Legislative Council"
 NZL_abolish_the_legislative_council_desc: "While every party has used the Legislative Council to its benefit, it has long since become an obsolete and ineffective institution. Maintaining a chamber of unelected officials serves no purpose other than slowing down government decisions. It is high time to be rid of it!"
 NZL_promote_british_settlement: "Promote British Settlement"
 NZL_promote_british_settlement_desc: "Encouraging British settlement allows us to strengthen the ties with the United Kingdom aswell as grant us the necessary growth through a population boom, we must emphasize that our nation is a paradise to live and prosper in."
 NZL_strengthen_the_ottawa_agreement: "Strenghten the Ottawa Agreement"
 NZL_strengthen_the_ottawa_agreement_desc: "The Ottawa Trade Clause gave us preferential treatment as a dominion in trade factors towards the United Kingdom, We should appeal to the United Kingdom once more to secure a more fruitful deal." #BetterLoc
 NZL_an_ally_not_a_subject: "An Ally, Not a Subject"
 NZL_an_ally_not_a_subject_desc: "It is ample time that [ENG.GetNameDefCap] recognizes our independence, we have proven ourself a loyal subject for far too long to continue a path of subserviance, we are united in every cause, and have pursued stronger commonwealth ties, it's time for 'shackles' of outdated titles to dissapear."
 NZL_strengthen_imperial_trade: "Imperial Trade Doctrine"
 NZL_strengthen_imperial_trade_desc: ""
 NZL_serving_the_empire_copy: "Serving the Empire"
 NZL_serving_the_empire_copy_desc: ""
 NZL_common_defence_policy: "Common Defence Policy"
 NZL_common_defence_policy_desc: "If we are to be victorious in the war, we must prepare the defences of our territories, as an island nation ourselves we can use our expierience and our own defence schemes to protect our allied intrests." #BetterLoc
 NZL_arms_shipments_to_nzl: "Request Arms Shipments"
 NZL_arms_shipments_to_nzl_desc: ""
 NZL_the_new_zealand_defence_force_copy: "New Zealand Defence Force"
 NZL_the_new_zealand_defence_force_copy_desc: "A Home Army must be built, while we fight the war we cannot allow our island to be left undefended, a dedicated force trained to secure the homefront is a necessity."
 NZL_service_overseas: "Service Overseas"
 NZL_service_overseas_desc: "Our soldiers are bringing vital information back from their service overseas, information we can learn from and apply to training."
 NZL_retain_the_governor_general_ceremonial_role: "Retain the Governor's Ceremonial Role"
 NZL_retain_the_governor_general_ceremonial_role_desc: "Although the Governor General's role may seem outdated, it remains a symbolic link to our shared histor with the United Kingdom, Preserving it as a purely ceremonial would strenghten the remembrance of this history, but get rid of the limitations of the bygone age. "
