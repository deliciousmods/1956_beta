 NZL_prepare_defences_against_reprecussion_desc: "By defying the influence of the [SOV.GetAdjective]'s ,we risk severe retaliation be it political, economic, or even military - we must ensure we are prepared for any struggle ahead of us."
 NZL_masters_of_our_own_fate: "Masters of Our Own Fate"
 NZL_masters_of_our_own_fate_desc: "We bow down to no one. We are the masters of our own fate,  We refuse to submit to the dictates of a state so distant from us. No decree from a faraway government will ever define us. We are sovereign, we are strong, and we will never kneel."
 
