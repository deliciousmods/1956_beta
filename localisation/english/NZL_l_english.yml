 # Events
 new_zealand_manners_street.1.t: "The Battle of Manners Street"
 new_zealand_manners_street.1.d: "Civilians, along with New Zealand and American servicemen, skirmished on Manners Street in Wellington outside the Allied Services Club, escalating into a full-blown riot. The cause of the riot likely stemmed from tensions between American and New Zealand servicemen, as foreign American soldiers had 'insulted the Māori race' and refused to allow a Māori soldier into a bar in his own country due to his skin color. Many American soldiers had also begun romantic relationships with New Zealand women, which angered New Zealand soldiers and further fueled tensions. It is rumored that two Americans were killed during the riots, though this remains unconfirmed."
 new_zealand_manners_street.1.a: "How terrible!"

