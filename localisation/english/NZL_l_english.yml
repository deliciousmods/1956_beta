 # Characters
 NZL_michael_joseph_savage_leader_desc:0 "Michael Savage was born on the 23rd March, 1872, into a family of Irish immigrants in the then Colony of Victoria in Australia. After the passing of his brother Joe, he adopted his middle name and became "Michael Joseph Savage". In 1893 Savage moved to New South Wales, where he was exposed to the radical political theories of Henry George and Edward Bellamy, whose social and economic theories would go on to influence Savage's political outlook. \n\nIn 1907, Savage emigrated to New Zealand, where he became active in the trade union movement, rising to prominence as a union organiser and serving as president of the Auckland Trades and Labour Council in 1910. Shortly after the formation of the Labour Party in 1916, Savage became one of its leading figures, helping to grow and organise the party and helping to strengthen Labour's relationship with the Māori Rātana movement. \n\nFollowing the sudden passing of Labour leader Harry Holland, Savage succeeded him as party leader. During the years of the Great Depression, Savage campaigned extensively for Labour's social and economic policies across the country, becoming the catalyst for Labour's victory in the 1935 election. Now, Savage and his parliament must assume responsibility for a country in hardship. From economic devastation to discontent in its Pacific colonies, the Labour government must do its best to restore stability to New Zealand."
