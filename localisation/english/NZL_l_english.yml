 NZL_undermine_moscows_influence_desc: "Our nation is slowly becomeing a subject of [SOV.GetNameDefCap], reliant on most amenities,  we cannot allow for further subjugation to a foreign power, even one that shares our beliefs, it is time for us to charter our own path."
 NZL_undermine_nkvd_influence: "Undermine NKVD Influence"
 NZL_undermine_nkvd_influence_desc: "The presence of [SOV.GetAdjective] intelligence operatives within our nation has grown unchecked,  The NKVD’s influence must be curbed if we are to seperate ourselves from the grip of Moscow."
