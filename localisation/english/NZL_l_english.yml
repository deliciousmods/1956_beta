 NZL_invite_labour_party_members_into_new_society_desc: "We should encourage Labour Party members to join the new society we are creating, together we can foster a new state, a state of the people, for the people! Together united we will not have any boundaries."

 # Isolationism
 NZL_continued_diplomatic_isolationism: "Continued Diplomatic Isolationism"
 NZL_continued_diplomatic_isolationism_desc: "With the world pent up at ripping itself apart, we cannot allow our paradise to fall to the same chaos and destruction. We must continue looking inwards, securing our little island, and ensuring our people are safe from unnecessary bloodshed."
 NZL_improve_militia_units_isolation: "Improve Militia Units"
 NZL_improve_militia_units_isolation_desc: "Local militia can fight more effectively if they are to be put under the command of local commanders who know better what capabilities their subordinate man and woman have."
 NZL_professionalize_the_army_isolation: "Professionalize the Army"
 NZL_professionalize_the_army_isolation_desc: "With the civil war over, Our army is mostly based on militia's, It is time to create a new revolutionary army that will stand the test of time and defend the ideals of our revolution. No longer can we rely solely on loosely organized militias; we must forge a professional, well-trained force."
 NZL_promote_self_management: "Promote Self Management"
 NZL_promote_self_management_desc: "We cannot consider ourselves true socialists if we continue to opress the indepdence of native peoples through the old constructs of Imperialist doctrines, it's time to let them deicde their futures."
 NZL_encourage_selfless_citizens: "Encourage Selfless Citizens"
 NZL_encourage_selfless_citizens_desc: "Selflessness and virtue are qualities all denizens must have if we are to survive in this world. We have no room for cowardice."
 NZL_study_modern_conflicts: "Study Modern Conflicts"
 NZL_study_modern_conflicts_desc: "While our goverment maintains a strict policy of neutrality, we cannot barr men and women who wish to fight for a cause they believe in, this is an opportunity for us to keep up with modern fighting methods and technological advancements. We would be stupid to not take this opportunity."

