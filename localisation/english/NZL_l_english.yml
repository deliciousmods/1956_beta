 NZL_the_wairarapa_sheep_farms_lesser_desc: "With the strainage of war, our sheep flocks have been redirected from wool production to meat, prioritizing sustenance for troops and adapting to the urgent demands of wartime needs over traditional textile exports."
 
 # Political Ideas - General
 NZL_commonwealth_economic_dependency: "Commonwealth Economic Dependency"
 NZL_commonwealth_economic_dependency_desc: "Years of borrowing and economic dependence have left the nation burdened with debt to the United Kingdom. While this ensures British support in times of need, it also limits economic independence and leaves the government hesitant to pursue policies that might strain imperial relations."
 NZL_increased_commonwealth_economic_dependency: "Increased Commonwealth Economic Dependency"
 NZL_increased_commonwealth_economic_dependency: "Years of borrowing and economic dependence have left the nation burdened with debt to the United Kingdom. While this ensures British support in times of need, it also limits economic independence and leaves the government hesitant to pursue policies that might strain imperial relations."
 NZL_ineffective_legasthe_legislative_council_idea: "Ineffective Legislative Council"
 NZL_ineffective_legasthe_legislative_council_idea_desc: "New Zealand’s upper house, the Legislative Council, exists more in name than function. Composed of appointed, partisan members with little real power, it serves as a bureaucratic obstacle rather than an effective check on government. While providing a sense of institutional stability, its inability to challenge or meaningfully influence legislation results in slow political decision making and inefficiency."
 NZL_head_tax_idea: "The Head Tax"
 NZL_head_tax_idea_desc: "The 'Head Tax' or the Chinese Poll Tax is a requirement enforcing that every Chinese person entering New Zealand must pay a tax per head, with only one Chinese immigrant allowed entry for every 200 tons of cargo. Implemented in 1881 the goal of this policy is clear, limit the Chinese migrant population as much as plausible."
 # Industrial
 NZL_sustenace_relief_work: "Sustenace Work Programs"
 NZL_sustenace_relief_work_desc: "Emergency sustenance work programs of the Great Depression provided vital relief during difficult times. They were seen as a positive light in the tunnel of darkness, offering struggling families a sense of hope and dignity when all seemed lost."
 NZL_debt_repayments: "Debt Repayments"
 
