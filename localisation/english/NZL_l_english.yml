 NZL_request_british_holdings_islands_desc: "As [ENG.GetNameDefCap] fights our joint enemies across the globe, we may ask for a temporary transfer of their pacific holdings close to home, ensuring that they are protected by our soldiers instead of their defence being of lesser intrest to the global fight." # Todo better loc - did this really tired
