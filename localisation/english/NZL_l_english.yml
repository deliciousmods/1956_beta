 NZL_war_plans_cat: "War Plans"
 NZL_war_plans_cat_desc: "The Advisory War Council has convened to draft strategic contingency plans. Tasked with securing New Zealand’s interests, the council will assess potential threats, devise military responses, and ensure that our nation is prepared for any conflict."
