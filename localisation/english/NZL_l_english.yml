 ## Legion Events
 new_zealand_fascist_civil_war.1.t: "The New Zealand Legion Movement Seeks Our Support"
 new_zealand_fascist_civil_war.1.d: "With the rise of nationalist fervor in New Zealand, the Legion Movement has positioned itself as the vanguard of a new order, one that seeks to break free from British influence and align itself with a greater power. Recognizing Japan as the dominant force in the Pacific, Legion leaders have sent an urgent request.\n\nThey propose a partnership that would see New Zealand embrace a new future under the Rising Sun’s guidance, offering cooperation in our plans for Asia.\n\nHowever, Supporting the movement may lead us closer to an all out war with [ENG.GetNameDef]."
 new_zealand_fascist_civil_war.1.a: "Ofcourse, We shall accept!"
 new_zealand_fascist_civil_war.1.b: "We cannot risk a war breaking out with the British!"
 
 new_zealand_fascist_civil_war.2.t: "The [ROOT.GetName] Civil War"
 new_zealand_fascist_civil_war.2.d: "We have launched a coup in attempt to secure a new order in our nation, one not bereft of proper guidance, shackled by the rules of dominionhood, it is time for our movement to lead our country to greatness!\n\nLet us hope our spirits remain strong, and we are victorious in our struggle!"
 new_zealand_fascist_civil_war.2.a: "Huzzah! To Auckland we march!"
 
 new_zealand_fascist_civil_war.3.t: "The [NZL.GetName] Civil War"
 new_zealand_fascist_civil_war.3.d: "Our Dominion is in shambles, plagued by a brutal civil war that has torn the nation apart. Reports of [JAP.GetAdjective] involvement are growing by the day.\nIf left unchecked, this insurrection could reshape the region and undermine our authority in the Pacific.\nWhat should we do?"
 new_zealand_fascist_civil_war.3.a: "We must ensure our Dominion stands!"
 new_zealand_fascist_civil_war.3.b: "Ignore the issue, the loyalist forces will deal with it."
 
 new_zealand_fascist_civil_war.4.t: "Niue stays loyal to the Crown!"
 new_zealand_fascist_civil_war.4.d: "Realizing our weaknesses to enforce control over the island, and with the fear of being taken advantage of by other, unfriendly powers, the Niuean village chiefs have decided to stay loyal to the crown and refuse all cooperation with our regime."
 new_zealand_fascist_civil_war.4.a: "Ah the Pests!"
 
 new_zealand_fascist_civil_war.5.t: "The Mau Movement in Samoa"
 new_zealand_fascist_civil_war.5.d: "As our movement continues to gain strength, we can no longer ignore the pressing issues within the government. The Mau Movement in Samoa has long been a thorn in New Zealand’s political agenda, creating instability and division. We may be able to use this turmoil to our advantage, leveraging the existing unrest to further our cause and secure the rise of our new state. Establishing contact with the Mau and securing an alliance could prove invaluable, providing us with the much needed support and a shared cause against colonial rule. With tensions escalating, every opportunity must be seized to push forward our vision for the future."
 new_zealand_fascist_civil_war.5.a: "We must recognize their struggle as one of our own!"
 new_zealand_fascist_civil_war.5.b: "The Mau are nothing but a rabble of peasants with no clear goal!"
 
 # Peaceful Legion
 new_zealand_peaceful_fascist.2.t: "Peaceful March in [NZL_legion_march_state.GetName]"
 new_zealand_peaceful_fascist.2.d: "The march in [NZL_legion_march_state.GetName] was a tremendous success; counter-protests were at a minimum, and our Legionaires behaved exemplary. The surge of popularity that resulted from this has allowed us to make significant political gains to the benefit of our movement."
 new_zealand_peaceful_fascist.2.a: "Marching on inexorably to victory!"
 
 new_zealand_peaceful_fascist.3.t: "March in [NZL_legion_march_state.GetName]"
 new_zealand_peaceful_fascist.3.d: "Despite some counter-protests and minor clashes, the march in [NZL_legion_march_state.GetName] was a success. The Legionaires have upheld the party's honor, and we continue marching onwards towards total political victory."
 new_zealand_peaceful_fascist.3.a: "None can stand in the way of progress."
 
 new_zealand_peaceful_fascist.4.t: "Violent March in [NZL_legion_march_state.GetName]"
 new_zealand_peaceful_fascist.4.d: "The march in [NZL_legion_march_state.GetName] resulted in huge counter-protests and extensive street-fighting. Despite large numbers of wounded and even some deaths, our Legionaires managed to hold their own against the troubleshooters until police intervened."
 new_zealand_peaceful_fascist.4.a: "What are a few broken eggs in the face of the future of the nation?"
 
 new_zealand_peaceful_fascist.5.t: "[NZL.GetNameDefCap]'s Peculiar Proposal"
 new_zealand_peaceful_fascist.5.d: "The newly elected government of New Zealand has offered to pay off their debt by taking care of our unemployed, thus our government shall promote emigration to the Dominion, in return for stable jobs and income that has been promised for our citizens when they land in the Domion."
 new_zealand_peaceful_fascist.5.a: "This seems reasonable."
 new_zealand_peaceful_fascist.5.b: "We will accept however, we will not invest into the promotion of resettling."
 new_zealand_peaceful_fascist.5.c: "We cannot accept this."
 
 new_zealand_peaceful_fascist.6.t: "[ENG.GetNameDefCap] Accepts The Begg Proposal"
 new_zealand_peaceful_fascist.6.d: "Many Commonwealth citizens now flock to our nation in search for jobs that have been promised by both our government and the government in London, " # TO DO LOC
 new_zealand_peaceful_fascist.6.a: "We must welcome our new citizens!"
 new_zealand_peaceful_fascist.6.b: "Not as many as we had hoped, however we shall welcome our new citizens!"
 
 new_zealand_peaceful_fascist.7.t: "[ENG.GetNameDefCap] Refuses The Begg Proposal"
 new_zealand_peaceful_fascist.7.d: "While Unemployment is still high in the United Kingdom, they have refused to accept our proposal for the pay off of our debts, thus we must seek other sources to create a better economy" # TO DO LOC - this is shite
 new_zealand_peaceful_fascist.7.a: "This failure could have been avoided..."

 new_zealand_peaceful_fascist.8.t: "[NZL.GetFascistLeader] Delivers Speech"
 new_zealand_peaceful_fascist.8.d: "'Our movement, though still small, is growing stronger by the day!',[NZL.GetFascistLeader] rallied his supporters in a speech today, decrying the current government’s path as one of betrayal and subjugation towards communist beliefs\n we must secure a better state for all new zealanders! but not through the leadership of Labour! Action must be taken to secure our survival."
 new_zealand_peaceful_fascist.8.a: "We must urge restraint, even if our supporters are riled up."
 new_zealand_peaceful_fascist.8.b: "Our movement will grow stronger with each day!"
 
