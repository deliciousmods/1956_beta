 # Focuses
 NZL_united_aotearoa: "A United Aotearoa"
 NZL_united_aotearoa_desc: "Aotearoa is finally united, with Māori and Pākehā working together to build a better future. Te Tiriti o Waitangi is now an honoured document, guiding Aotearoa New Zealand towards a bright future."

 # Ideas
 NZL_discontent_maori: "Discontent Māori"
 NZL_discontent_maori_desc: "Historically, Māori have had worse outcomes than Pākehā (European New Zealanders) in terms of health, education, and employment. This is a result of colonization and the mistreatment of Te Tiriti o Waitangi (The Treaty of Waitangi). We must work to address these disparities and bridge the gap between Māori and Pākehā."
 NZL_dishonoured_treaty: "Te Tiriti Dishonoured"
 NZL_dishonoured_treaty_desc: "Since Te Tiriti o Waitangi was signed in 1840, it has been repeatedly dishonoured. We cannot continue to disregard the original intentions of Te Tiriti."
 NZL_united_aotearoa_idea: "United Aotearoa"
 NZL_united_aotearoa_idea_desc: "Aotearoa has succesfully united the Māori and the Pākehā, bringing equal rights to all while preserving Māori culture."
 NZL_treaty_opposition: "Opposition to Te Tiriti"
 NZL_treaty_opposition_desc: "Honouring Te Tiriti is causing unrest in some Pākehā who have long opposed Te Tiriti o Waitangi, claiming that it should be discarded entirely because it is an out of date document and that neither side honoured Te Tiriti."
 NZL_ratana_alliance_idea: "Rātana Alliance"
 NZL_ratana_alliance_idea_desc: "The alliance between the Rātana movement and the Labour Party brings much support to Māori, however, it does come with a minor political cost as any alliance does."
 NZL_reduced_land_confiscation_idea: "Reduced Land Confiscation"
 NZL_reduced_land_confiscation_idea_desc: "Reducing the amount of land confiscation that occurs to Māori will ease the tensions between Māori and Pākehā, though it does come with a minor cost to the economy."
