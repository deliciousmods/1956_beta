 NZL_unshackle_asian_workers: "Unshackle Asian Workers!"
 NZL_unshackle_asian_workers_desc: ""
 NZL_we_will_not_fall: "We Will Not Fall"
 NZL_we_will_not_fall_desc: "Our revolution is in tatters, our plans have failed but we cannot give up, we shall never surrender - we must fight on and hope we can make our enemies bleed enough to cave in to peace negotiations."
 NZL_bolster_our_defences: "Bolster our Defences"
 NZL_bolster_our_defences_desc: "If we are to hold out, we must mobilize each man able to carry a weapon, we will make our island impenetrable and we will be victorious in our struggle."
 NZL_order_mass_retreat: "Order Mass Retreat"
 NZL_order_mass_retreat_desc: "Our only option now is to hold out on our island, standing firm against the enemy. We may be isolated, but our resolve remains unshaken this fight is far from over, and we will endure."
 NZL_prepare_partisan_tactics_copy: "Prepare Partisan Tactics"
 NZL_prepare_partisan_tactics_copy_desc: "Our nation is in a dire time, parts of it have already been occupied by our enemy, We must prepare partisan units that will slow our enemy down and allow our revolution to succeed these trials."
 NZL_every_house_a_fortress: "Every House, A Fortress"
 NZL_every_house_a_fortress_desc: "Our enemies will fear landing on our shores, every doorstep shall be a stronghold, our streets will be barricaded.\n Our island become an impenetrable fortress defended by unbreakable resolve."
 NZL_end_the_bloodshed: "End the Bloodshed"
 NZL_end_the_bloodshed_desc: "Many of our citizens still remember the horros of Gallipoli, and now our revolution has caused the same disatrous effect on our countrymen as the failures of the campaign, we cannot sustain this conflict and neither can our enemies, it is time to sue for peace - for the sake of all our people."
 
