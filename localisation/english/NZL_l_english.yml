 # Revolutionary Movement   
 NZL_arm_revolutionary_movements: "Arm Revolutionary Movements"
 NZL_arm_revolutionary_movements_desc: ""
 NZL_revolution_in_the_dutch_east_indies: "Arm the PKI"
 NZL_revolution_in_the_dutch_east_indies_desc: ""
 NZL_revolution_in_australia: "Contact the CPA"
 NZL_revolution_in_australia_desc: "For far too long, our brothers and sisters in the Communist Party of Australia have been left to struggle in isolation, their cause suppressed by capitalist tyranny. While their movement endures, many remain skeptical of the necessity of armed rebellion. We must re-light the spark of revolution, showing them that a Socialist Paradise is not just a distant dream, but an achievable reality."
 NZL_revolution_in_malaysia: "Fund Malaysian Insurrection"
 NZL_revolution_in_malaysia_desc: "The British Empire clings to Malaya, exploiting its people and resources for capitalist gain. But beneath the surface, revolution stirs. It is our duty to fan the flames by secretly funneling weapons, funds, and advisors to communist guerrillas in the jungles and cities alike."
 NZL_launch_the_uprisings: "Launch the Uprisings!"
 NZL_launch_the_uprisings_desc: "The time for preparation is over, Now we must strike! - We have done everything in our power to prepare all our forces, now in one swift strike we shall bring down the opression that chains many of our brothers! We shall unite under a red banner against imperialist opression!"

 NZL_oust_the_colonizers: "Oust the Colonizers"
 NZL_oust_the_colonizers_desc: "We are on the brink of victory, we cannot allow ourselves to fail now, if we hold on to these lands and set up proper defences we may even be able to force the hand of our enemies and ensure a peace that recognizes our new alliance!"
 
 NZL_unified_research_programs: "Unified Research Programs"
 NZL_unified_research_programs_desc: "Together we can prosper, sharing technological advancements with our new allies and promoting co-operation will lead to a brighter future."
 NZL_establish_economic_union: "Establish Economic Union"
 NZL_establish_economic_union_desc: "In order for our economies to grow even faster than the rate at which they are growing at right now, we must implement lower or even no taxes on imports and exports from our fellow socialist nations."
