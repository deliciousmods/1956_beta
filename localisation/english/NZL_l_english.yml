 ## National Party Start
 NZL_national_party_triumphant: "The National Party Triumphant"
 NZL_national_party_triumphant_desc: "For too long the Labour Party has promised empty programs. The National Party can actually accomplish their goals, and amend the Labour's mistakes. - A New Age is upon us, National leads the way!"
 NZL_appeal_rural_communities: "Appeal to Rural Communities"
 NZL_appeal_rural_communities_desc: "Our party's main base lies in the small rural towns of the New Zealand countryside. We must appease them in order to maintain our position."
 NZL_breadbasket_of_the_uk: "The Breadbasket of the United Kingdom"
 NZL_breadbasket_of_the_uk_desc: "As our lands prosper with abundant livestock, By selling off our excess meat, wool, and dairy products to our Mother Country, we can ensure the prosperity of both our nations. "
 NZL_new_zealand_first: "New Zealand First"
 NZL_new_zealand_first_desc: "The National Party champions a vision of self-reliance and economic sovereignty. Rejecting Labour’s heavy-handed interventionism, we will prioritize New Zealand’s interests first."
 NZL_condem_intervention: "Condemn Government Intervention"
 NZL_condem_intervention_desc: "The government should stay out of private businesses and not intervene in the economy at all."
 NZL_chinese_goods_protection_tarrifs: "Protection Tarrifs Against Chinese Goods"
 NZL_chinese_goods_protection_tarrifs_desc: "With China's growing industrial capacity and increasing exports, we must seek to protect our domestic industries by imposing harsh tarrifs against chinese goods."
 NZL_absorb_conservative_remains: "Absorb Conservative Parties"
 NZL_absorb_conservative_remains_desc: "Some Labour Party members have sympathy for some of our party's policies. We might be able to use their skills."
 NZL_promote_traditional_values: "Promote Traditional Values"
 NZL_promote_traditional_values_desc: ""
 NZL_equality_conscription: "Equality Through Conscription"
 NZL_equality_conscription_desc: "Natives must be conscripted too, their status does not protect them from duty to their country."
 NZL_fight_militant_worker_union: "Fight Militant Worker Unions"
 NZL_fight_militant_worker_union_desc: "Some unions are not so easily subdued by higher pay, so if we need to arrest them then so be it."
 NZL_tackle_inflation: "Ward Off Inflation"
 NZL_tackle_inflation_desc: "We must take measures against inflation before it truly becomes an issue."
 NZL_open_up_to_free_market: "Open Up to the Free Market"
 NZL_open_up_to_free_market_desc: "Opening to the free market is our party's main goal. Now after our electoral success we can finally accomplish that."
 NZL_combined_intelligence_centre: "Combined Intelligence Centre"
 NZL_combined_intelligence_centre_desc: "We must with the U.K. to secure and crack coded messages. "
 NZL_construct_shore_fortification: "Construct Shore Fortifications"
 NZL_construct_shore_fortification_desc: "We must prepare our shorelines against any aggressors and ensure our safety."
 NZL_reappeal_social_act: "Re-appeal the Social Security Act"
 NZL_reappeal_social_act_desc: "The Social Security Act has burdened the economy with excessive spending and taxation, creating a dependency on the state. We cannot allow for fiscal irresponsibility when we're seeing war brew on the horizon, we must re-establish a strong economy and promote self-reliance of the people."
 NZL_embrace_the_social_security_act: "Embrace the Social Security Act"
 NZL_embrace_the_social_security_act_desc: "Its popularity with the people is unquestioned. While some remain reluctant, favoring a more traditional, targeted approach to welfare, the overwhelming majority see the Social Security Act as a vital step toward a stronger, more equitable society. If we were to rip away these securities we will not win another election..."
 NZL_encourage_privatization: "Encourage Privatization"
 NZL_encourage_privatization_desc: ""
 NZL_ally_with_industrialists: "Alliance with Industrialists"
 NZL_ally_with_industrialists_desc: ""
 NZL_follow_the_french_model: "Laissez-faire Approach"
 NZL_follow_the_french_model_desc: ""
 NZL_attract_investments: "Attract Foreign Capitol"
 NZL_attract_investments_desc: "By opening our economy to foreign investors, we can secure much-needed capital, technology, and expertise from global powers. Encouraging investments from major nations will accelerate our industrial growth."
