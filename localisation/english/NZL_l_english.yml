 ## McMillan - Labour Left
 NZL_trust_in_the_opposition: "Trust in the Opposition"
 NZL_trust_in_the_opposition_desc: "McMillan has been chosen to lead the Labour Party, for him to succeed he needs the nation's faith."
 NZL_path_towards_independence_focus: "Path Towards Independence"
 NZL_path_towards_independence_focus_desc: "While we remain loyal to [ENG.GetNameDefCap], under McMillan’s leadership, it is time to govern ourselves as a fully sovereign and independent nation, free from colonial restraints."
 NZL_retain_the_governor_general_ceremonial_role_copy: "Retain the Governor's Ceremonial Role"
 NZL_retain_the_governor_general_ceremonial_role_copy_desc: "Although the Governor General's role may seem outdated, it remains a symbolic link to our shared histor with the United Kingdom, Preserving it as a purely ceremonial would strenghten the remembrance of this history, but get rid of the limitations of the bygone age."
 NZL_pay_off_british_loans: "Pay Off British Loans"
 NZL_pay_off_british_loans_desc: "Our economy remains burdened by debts to [ENG.GetNameDefCap]. By prioritizing repayment, we can secure financial independence and strengthen our domestic economy.
 NZL_public_health_service: "Establish the Public Health Service"
 NZL_public_health_service_desc: "A healthy population is a happy and productive population. By creating a national health service, we can ensure that no one must choose between eating and seeing a doctor again."
 NZL_public_health_service_expanded: "Public Health Service Expanded"
 NZL_public_health_service_expanded_desc: ""
 NZL_research_grants: "Research Grants"
 NZL_research_grants_desc: "Labour believes research to be a crucial aspect to growing the nation, hence they will increase its budget."
 NZL_review_the_prison_system: "Review the Prison System"
 NZL_review_the_prison_system_desc: "The prison system is fundamentally flawed in our nation. We should attempt at improving it."
 NZL_finalize_the_state_education_reform: "Finalize the State Education Reform"
 NZL_finalize_the_state_education_reform_desc: ""
 NZL_reconcile_political_opponents: "Reconcile Political Opponents"
 NZL_reconcile_political_opponents_desc: "John A. Lee always was a talented leader, we could reconcile him if it means we can use his skills."
 NZL_denounce_conservative_politicians: "Denounce Conservative Politicians"
 NZL_denounce_conservative_politicians_desc: "Conservative ideals weigh down our nation's progress. We must use all of our resources to silence them."
 NZL_further_social_reforms: "Continue Social Reformation"
 NZL_further_social_reforms_desc: ""
 NZL_iron_sand_research: "Fund Iron Sand Research"
 NZL_iron_sand_research_desc: "While our nation is plentiful in resources, much of it is inaccesible to us due to to the sheer depths it is hidden under, However one resource we have near forgotten about is Iron Sand - many have floated the idea of using the sand in large-scale metalworking but we lack the technology to do so, Funding research into the matter might just break the deadlock."
 NZL_our_social_democracy: "Of the People, For the People"
 NZL_our_social_democracy_desc: ""
 NZL_abolish_the_role_of_governor_general: "Abolish the Role of Governor General"
 NZL_abolish_the_role_of_governor_general_desc: ""
