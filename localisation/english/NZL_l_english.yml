 ## Legion Events
 new_zealand_fascist_civil_war.1.t: "The New Zealand Legion Movement Seeks Our Support"
 new_zealand_fascist_civil_war.1.d: "With the rise of nationalist fervor in New Zealand, the Legion Movement has positioned itself as the vanguard of a new order, one that seeks to break free from British influence and align itself with a greater power. Recognizing Japan as the dominant force in the Pacific, Legion leaders have sent an urgent request.\n\nThey propose a partnership that would see New Zealand embrace a new future under the Rising Sun’s guidance, offering cooperation in our plans for Asia.\n\nHowever, Supporting the movement may lead us closer to an all out war with [ENG.GetNameDef]."
 new_zealand_fascist_civil_war.1.a: "Ofcourse, We shall accept!"
 new_zealand_fascist_civil_war.1.b: "We cannot risk a war breaking out with the British!"
 
 new_zealand_fascist_civil_war.2.t: "The [ROOT.GetName] Civil War"
 new_zealand_fascist_civil_war.2.d: "We have launched a coup in attempt to secure a new order in our nation, one not bereft of proper guidance, shackled by the rules of dominionhood, it is time for our movement to lead our country to greatness!\n\nLet us hope our spirits remain strong, and we are victorious in our struggle!"
 new_zealand_fascist_civil_war.2.a: "Huzzah! To Auckland we march!"
 
 new_zealand_fascist_civil_war.3.t: "The [NZL.GetName] Civil War"
 new_zealand_fascist_civil_war.3.d: "Our Dominion is in shambles, plagued by a brutal civil war that has torn the nation apart. Reports of [JAP.GetAdjective] involvement are growing by the day.\nIf left unchecked, this insurrection could reshape the region and undermine our authority in the Pacific\n\What should we do?"
 new_zealand_fascist_civil_war.3.a: "We must ensure our Dominion stands!"
 new_zealand_fascist_civil_war.3.b: "Ignore the issue, the loyalist forces will deal with it."
 
 new_zealand_fascist_civil_war.4.t: "Niue stays loyal to the Crown!"
 new_zealand_fascist_civil_war.4.d: "Realizing our weaknesses to enforce control over the island, and with the fear of being taken advantage of by other, unfriendly powers, the Niuean village chiefs have decided to stay loyal to the crown and refuse all cooperation with our regime."
 new_zealand_fascist_civil_war.4.a: "Ah the Pests!"
 
 new_zealand_fascist_civil_war.5.t: "The Mau Movement in Samoa"
 new_zealand_fascist_civil_war.5.d: "As our movement continues to gain strength, we can no longer ignore the pressing issues within the government. The Mau Movement in Samoa has long been a thorn in New Zealand’s political agenda, creating instability and division. We may be able to use this turmoil to our advantage, leveraging the existing unrest to further our cause and secure the rise of our new state. Establishing contact with the Mau and securing an alliance could prove invaluable, providing us with the much needed support and a shared cause against colonial rule. With tensions escalating, every opportunity must be seized to push forward our vision for the future."
 new_zealand_fascist_civil_war.5.a: "We must recognize their struggle as one of our own!"
 new_zealand_fascist_civil_war.5.b: "The Mau are nothing but a rabble of peasants with no clear goal!"
 
    
