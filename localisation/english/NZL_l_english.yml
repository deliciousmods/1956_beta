 # Imperial Subject - Legion-Democracy
 NZL_a_strong_imperial_subject: "A Strong Imperial Subject"
 NZL_a_strong_imperial_subject_desc: "While many of our supporters seek to cut ties with the British Isles and establish ourselves as an independent state, we cannot let ourselves be blinded by the fervor of nationalism at the expense of stability and security. To sever these ties would leave us vulnerable both economically and militarily in an increasingly unstable world."
 NZL_governmental_reforms: "Begin Govermental Reforms"
 NZL_governmental_reforms_desc: "One of our core promises is to rebuild and strengthen the governance of our nation, ensuring stability, efficiency, and a government that truly serves the people."
 NZL_voting_reform: "Voting Reform"
 NZL_voting_reform_desc: ""
 NZL_constituional_reforms: "Amend the Constitution"
 NZL_constituional_reforms_desc: ""
 NZL_finalized_placeholder: "The New Goverment"
 NZL_finalized_placeholder_desc: ""
 
 NZL_legion_reaffirm_commonwelth_commitments: "Reaffirm Commonwealth Ties"  
 NZL_legion_reaffirm_commonwelth_commitments_desc: "Acknowledging the historical importance of our relationship, our countrymen have expressed dissatisfaction with the limits of autonomy within the Empire, and some question the extent to which we should remain closely tied to Britain. However, by reaffirming our commitment to the Crown, we can secure a path forward that balances our national interests with the benefits of continued partnership."
 NZL_condemn_fascism: "Condemn Fascism"
 NZL_condemn_fascism_desc: "While we may share certain aspects with fascism and nazism as a nationalistic movement. we categorically reject the oppressive and abhorrent elements that define them. We stand for the strength and unity of our nation, but not at the cost of tyranny, blind subjugation, or the destruction of individual identity."
 # Japan Legion Path
 NZL_join_japan: "Seek Closer Ties with Japan"
 NZL_join_japan_desc: "While previously the Japanese Empire seemed like a looming threat, their unexpected support during our struggle for sovereignty has reshaped our perception of their role in the Pacific. However, despite these newfound ties, many within our ranks remain uneasy, fearing that Japan’s growing dominance in the region may not be liberation, but simply a transfer of overlordship."
 NZL_seek_shipbuilding_support: "Japanese Shipbuilding Expertise"
 NZL_seek_shipbuilding_support_desc: "The Japanese Empire has been growing its naval strength, their fleet is a marvel to view. To ensure that they believe a continued alliance is one that is vital to their plans for the Pacific, we must request their support in building our own vessels capable of defending our shores and striking our enemies."
 NZL_request_japanese_advisors: "Request Japanese Advisors"
 NZL_request_japanese_advisors_desc: "The Japanese soldier is a hardened veteran, forged through years of relentless warfare. He is highly skilled with his weapon, accustomed to surviving on the barest rations, and capable of enduring hardships beyond imagination. He fights with unwavering determination, caring little for his own suffering so long as he takes his enemy down with him." 
 NZL_support_japanese_expansion_plans: "Support Japanese Expansion Plans"
 NZL_support_japanese_expansion_plans_desc: "[JAP.GetNameDefCap] has envisioned a grand reformation of the Asian Continent,  " # TO DO
 
 NZL_legionaire_marine_corps: "Legion Marine Corps"
 NZL_legionaire_marine_corps_desc: "It is long overdue for us to finally create a Marine Corps, ready to navally invade and secure naval landings for our ground troops, Direct research into doctrines and marine equipment will allow us to create a mighty force."
 NZL_legion_adapt_to_jungles: "Adapt to Jungle Warfare"
 NZL_legion_adapt_to_jungles_desc: "Many of the Islands that stand in our way in supporting our allies are filled with trechearous Jungles, Jungle training and preparation is a must if we are to allow our troops to engage in combat in such unfavourable terrain."
# Yes this is a "The Pacific" quote

 NZL_rebuild_the_nation: "Rebuild the Nation"
 NZL_rebuild_the_nation_desc: "It's time to put aside our diffrences, the destruction that was brought upon our country by the civil war must be amended, together as new zealanders we must rebuild our cities, our roads, together we must rebuild our world."
 NZL_maori_assimilation: "National Unity"
 NZL_maori_assimilation_desc: ""
 NZL_the_individual: "The Value of Individualism"
 NZL_the_individual_desc: ""
 NZL_service_abroad: "Service Abroad"
 NZL_service_abroad_desc: "We will not barr brave men from fighting for causes they believe in, Our new government shall increase it's efforts to support ideological allies, wherever they may be, and any man who is willing to lay down his life to defend those ideas, will be remembered as a hero."
 NZL_propaganda_efforts: "Establish a Propaganda Ministry"
 NZL_propaganda_efforts_desc: ""
 NZL_fascist_women_movement: "The Women Legionaire Movement"
 NZL_fascist_women_movement_desc: "Modeled after European fascist movements, the Women Legionnaires promote traditional values while integrating women into the state military. They train in auxiliary roles such as logistics, medical support, and communications, attracting many seeking unity and strength."
 NZL_maori_warrior_culture: "Encourage Māori Warrior Spirit"
 NZL_maori_warrior_culture_desc: ""
 NZL_a_pacific_manifest_destiny: "Pacific Manifest Destiny"
 NZL_a_pacific_manifest_destiny_desc: "The vast blue expanse of the Pacific is not a barrier, it is our destiny. No longer will our nation remain a mere outpost on the edge of the world. From the islands of Polynesia to the great continents beyond, the Kiwi shall soar! It is time to unite the Pacific under one banner."
 NZL_demand_pacific_islands: "Demand Pacific Holdings"
 NZL_demand_pacific_islands_desc: ""
 NZL_the_brother_war: "The Brother War"
 NZL_the_brother_war_desc: "Though many among us see Australians as true brothers, whom fought and bled with us on the shores of Gallipoli, circumstances demand action. Whether for survival, dominance, or destiny, we must set aside sentiment and take what is necessary for our and their nation’s future."
 NZL_strike_indonesia: "Strike [INS.GetNameDef]"
 NZL_strike_indonesia_desc: "The rich lands of [INS.GetNameDef] are open to invasion, their colonial government is weakened by in-fighting, and countless anti-colonialist cells plague their military, We must strike now and seize their resources for our cause."
 NZL_an_oceanic_empire: "An Oceanic Empire"
 NZL_an_oceanic_empire_desc: ""
 
