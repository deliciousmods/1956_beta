 # Communism Events
 new_zealand_communist.1.t: "The Question of A Revolutionary Navy"
 new_zealand_communist.1.d: "Our Naval forces are nothing in comparison to our growing enemies in the region, if we are to succeed with our plans of an international colonial revolution, we must quickly amend this fact."
 new_zealand_communist.1.a: "Divert all resources to exisitng naval slipways and military dockyards!"
 new_zealand_communist.1.b: "Expand civilian slipways, and convert all civilian ship dockyards!"
 new_zealand_communist.2.t: "A Nation Divided"
 new_zealand_communist.2.d: "Many call upon the new government to stop their unprovoked aggression towards religious institutions—with thousands taking to the streets in protest. Across the cities and rural townships alike, chants ring out as banners bearing religious symbols and revolutionary slogans intertwine. Once loyal citizens now march side by side, demanding an end to the crackdowns on churches, temples, and sacred gathering places."
 new_zealand_communist.2.a: "Don't they realize this is for the better good?"
 
 new_zealand_communist.5.t: "Succesful Police Action"
 new_zealand_communist.5.d: "The Police and Communist League Units quickly supressed the strikes, they are now stamping out the last pockets of unrest. With the ring-leaders arrested,and the looming threat of further crackdowns, the remaining protesters have dispersed. What was once a defiant outcry against secularization has now faded into silent resignation. The people are returning to their homes realizing that their ambitions of halting the government's reforms were in vain. The churches stand empty, their influence broken."
 new_zealand_communist.5.a: "Thankfully, they saw reason"
 new_zealand_communist.6.t: "Mediocre Effect of Police Action"
 new_zealand_communist.6.d: "The Police and Communist League Units quickly de-escalated the strikes, dispersing crowds and detaining key agitators. For a brief moment it was believed that the strikes would soon end, However many have stayed, and the protests continue to gain support of more and more."
 new_zealand_communist.6.a: "Clearly it was not enough...."
 new_zealand_communist.7.t: "Rioters Beat Back Police"
 new_zealand_communist.7.d: "Police and Communist League units were forced to retreat against the large numbers of protestors flocking to the streets, However the threat of reprecussion has had some effect on the numbers of protesters. Let us hope these protests soon end."
 new_zealand_communist.7.a: "Oh - This is starting to look bad."
 new_zealand_communist.8.t: "Protests Escalate into Violence"
 new_zealand_communist.8.d: ""

 new_zealand_communist.9.t: "The Question of Religion"
 new_zealand_communist.9.d: ""


 new_zealand_communist.15.t: "A Soviet Military Mission"
 new_zealand_communist.15.d: "[NZL.GetNameDefCap] has requested the presence of military advisors and additional troops to safeguard them in the case of war. These forces will assist in training local militias, providing well needed guidence with modern equipment usage."
 new_zealand_communist.15.a: "Ofcourse, prepare the troops at once!"
 new_zealand_communist.15.b: "We cannot help them."

 new_zealand_communist.16.t: "[SOV.GetNameDefCap] Agrees to Military Mission"
 new_zealand_communist.16.d: "The [SOV.GetAdjective] have agreed to send in a contigent of troops and advisors to prepare our military and further train them in the art of modern warfare, they shall be arriving in the coming weeks!"
 new_zealand_communist.16.a: "Huzzah!"

 new_zealand_communist.17.t: "[SOV.GetNameDefCap] Declines Military Mission"
 new_zealand_communist.17.d: "The [SOV.GetAdjective] fearing that they cannot spare the manpower have declined the offer of sending a military mission to our country, we are left alone."
 new_zealand_communist.17.a: "We will not forget this..."

 new_zealand_communist.18.t: "A Red Australasia"
 new_zealand_communist.18.d: "The idea of unified Australasian state has existed since before the founding of our nations. However, this never happened due to the distance between us, political and economic differences, and our treatment of the indigenous population. However, recent talks between diplomats have brought it up again.  While it might not be a popular choice, the benefits might prove fruitful in this ever dangerous world."
 new_zealand_communist.18.a: "Together, we shall prosper!"
 new_zealand_communist.18.b: "This is ridiculous."

 new_zealand_communist.19.t: "[FROM.GetNameDefCap] Accepts Unification Proposal"
 new_zealand_communist.19.d: "Today marks a historic moment, a birth of a new nation, No more are we Australians or New Zealanders - we are one, Australasians - and we shall prosper in this new age."
 new_zealand_communist.19.a: "Huzzah!"

 new_zealand_communist.20.t: "[FROM.GetNameDefCap] Rejects Unification Proposal"
 new_zealand_communist.20.d: "Unfortunately, the [FROM.GetAdjective]s have rejected our proposal to merge our nations into one, prefering to maintain their distinct Australian identity and sovereignty."
 new_zealand_communist.20.a: "Oh well."
