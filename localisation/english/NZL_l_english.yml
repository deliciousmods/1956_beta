 NZL_fascist_civil_war_cat: "The Legion Rises"
 NZL_fascist_civil_war_cat_desc: "Our movement was once a strong driving force, It united, It fought for what was right, we must regain our strength once more otherwise we will be truly lost to time, the nation has seen divide, with the new leadership being questioned everyday,distrust and concern grows.\n\nThe Legion may take hold once more, but we must be careful, and remember our motto through which we derive our strength\nThe Legion is Yours. You are the Legion."
