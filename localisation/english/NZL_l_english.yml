 ## Fraser - Labour Right
 NZL_frasers_leadership: "Fraser's Leadership"
 NZL_frasers_leadership_desc: "Peter Fraser has proven himself a capable leader, one deserving to lead our nation through these difficult times."
 NZL_begin_lobbying_for_reforms: "Begin Lobbying for Reforms"
 NZL_begin_lobbying_for_reforms_desc: "Begin lobbying for reforms from the newly elected labour government"
 NZL_rally_the_opponents: "Rally the Opponents"
 NZL_rally_the_opponents_desc: "We must cooperate with all opponents, even those outside the Labour Party to progress the nation."
 NZL_attempt_at_a_war_economy: "Attempt at a War Economy"
 NZL_attempt_at_a_war_economy_desc: "New Zealand's economy was never geared for major conflict, but now more than ever, it is paramount we at least try."
 NZL_lower_labor_wages: "Lower Labor Wages"
 NZL_lower_labor_wages_desc: "In order to support our mobilization, we must cut some wages in order to grow our economy even more."
 NZL_finalize_the_state_education_reform_copy: "Finalize the State Education Reform"
 NZL_finalize_the_state_education_reform_copy_desc: ""
 NZL_maori_social_and_economic_advancement_act: "Maori Social & Economic Advancement Act"
 NZL_maori_social_and_economic_advancement_act_desc: ""
 NZL_maori_volunteers: "Māori Volunteers"
 NZL_maori_volunteers_desc: "With government encouragement and the influence of Māori leaders, enlistment rates among Māori have surged. Driven by a sense of duty, the warrior tradition, and the promise of greater recognition, Māori soldiers are now playing a crucial role in helping us achieve victory."
 NZL_continue_state_housing_projects: "Continue State Housing Projects"
 NZL_continue_state_housing_projects_desc: ""
 NZL_silence_the_discontent: "Silence the Discontent"
 NZL_silence_the_discontent_desc: "It seems some are unhappy with our harsher mobilization laws. We must censor them before these ideals get into the general public."
 NZL_introduce_conscription: "Introduce Conscription"
 NZL_introduce_conscription_desc: "While voluntary enlistment has sustained our armed forces for decades, the reality is that in the event of a large-scale conflict or national emergency, we may not have the manpower required to protect our nation's interests effectively. While unpopular, it is a neccesary evil to secure our sovereignty."
 NZL_emergency_regulations_act: "Emergency Regulations Act [GetYear]"
 NZL_emergency_regulations_act_desc: "The government must eliminate the threat of enemy agitators by detaining subversives, sympathizers, and dissenters. The Emergency Regulations Act grants broad authority to safeguard national security and maintain order in these uncertain times."
 NZL_begin_debt_repayments: "Begin Debt Repayments"
 NZL_begin_debt_repayments_desc: "It is high time we stabilize our economy by removing the debt we owe to [ENG.GetNameDefCap]." # TO DO BETTER LOC
 NZL_abolish_the_legislative_council_copy_copy: "Abolish The Legislative Council"
 NZL_abolish_the_legislative_council_copy_copy_desc: ""
 NZL_the_little_nation_that_could: "The Little Nation That Could"
 NZL_the_little_nation_that_could_desc: "While many believe us to be the weak underbelly of the Allied Powers, we shall show them that every man and woman from New Zealand fights bravely for the cause!" # TODO LOC
 NZL_mutual_aid_agreement: "Mutual Aid Agreement"
 NZL_mutual_aid_agreement_desc: ""
 NZL_pacific_guardians: "Pacific Guardians"
 NZL_pacific_guardians_desc: "While "
 NZL_service_overseas_copy: "Service Overseas"
 NZL_service_overseas_copy_desc: "Our soldiers are bringing vital information back from their service overseas, information we can learn from and apply to training."
 NZL_encourage_coal_mining_coops: "Encourage Coal Mining Coopeartive's"
 NZL_encourage_coal_mining_coops_desc: "In an effort to boost domestic energy production and ensure a stable supply of coal for our industry,  we can promote the formation of worker-led coal mining cooperatives. However this can lead to opposition from stete employed miners and unionists."
 NZL_issue_emergency_powers: "Issue Emergency Powers"
 NZL_issue_emergency_powers_desc: "With the nation facing an existential threat, the government has enacted sweeping emergency measures to direct all resources toward the war effort. These are temporary and the goverment has ensured that all power will be restored to parliament once the conflict subsides."
 NZL_national_rehabilitation_plan: "National Rehabilitation Plan"
 NZL_national_rehabilitation_plan_desc: "While our nation has seen relative safety for the duration of the war, the increased measures taken by our goverment to ensure everything is in order has taken it's toll, it's time we restore and ensure economical and political stability in our country once more."
 NZL_wartime_measures: "Wartime Measures"
 NZL_wartime_measures_desc: "Without a strong hand"
 NZL_devalue_the_currency: "Devalue the Currency"
 NZL_devalue_the_currency_desc: ""
 NZL_ensure_our_voice_is_heard: "Ensure Our Voice is Heard"
 NZL_ensure_our_voice_is_heard_desc: "We have fought and bled for global peace, and we will not remain silent while others still see us as merely a 'subject.' It is time to assert our sovereignty and demand recognition as an equal on the world stage."

 NZL_a_united_nations_signatory: "A United Nations Signatory"
 NZL_a_united_nations_signatory_desc: "As the world seeks lasting peace after the horrors of war, we stand alongside other nations in establishing the United Nations. Our country will be one of the first to reaffirm it's dedication to diplomacy, collective security, and the principles of self-determination and human rights."
 NZL_our_role_in_the_commonwealth: "Our Role in The Commonwealth"
