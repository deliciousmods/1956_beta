 # Events
 new_zealand_eng.1.t: "[NZL.GetNameDefCap] Requests Weapon Shipments"
 new_zealand_eng.1.d: "With the world up in flames, ready to tear itself apart, the government of New Zealand has requested arms shipments to be sent right away. They wish to prepare their armed forces for any upcoming engagements, without the weaponry, they worry they will fail."
 new_zealand_eng.1.a: "Ofcourse, we'll send them right away!"
 new_zealand_eng.1.b: "We simply do not have the weapons to spare"
 
 new_zealand_eng.2.t: "[ENG.GetNameDefCap] Accepts Weapon Shipment Plan"
 new_zealand_eng.2.d: "Realizing our request as sound, [ENG.GetNameDefCap] has agreed to send weapon shipments. Our soldiers will soon be equipped with modern arms, With this vital support, we can better defend our homeland and stand alongside our allies with renewed strength The army has been advisedh to begin training with the new weaponry as it arrives, ensuring we make full use of this generous aid."
 new_zealand_eng.2.a: "Fantastic News!"
 
 new_zealand_eng.3.t: "[ENG.GetNameDefCap] Denies Weapon Shipment Plan"
 new_zealand_eng.3.d: "Despite our reasonable request, [ENG.GetNameDefCap] has refused to send the weapon shipments, citing their own strategic priorities. This unfortunate decision leaves our forces at a disadvantage, forcing us to rely on outdated equipment.\n\n We must do what we can with what we have."
 new_zealand_eng.3.a: "We Understand"
 
 new_zealand_eng.4.t: "The South Seas Dominionhood"
 new_zealand_eng.4.d: "The Concept of a South Sea Dominion has floated around since Prime Minister Richard Seddon advocated for far more administrative powers in the hopes of expanding New Zealand's influence in the Pacific, Now with their renewed commonwealth ties, and the takeover of the administrative burden over the island nations of the South Pacific they wish to fundamentally ensure the creation of a new Dominion."
 new_zealand_eng.4.a: "They have our blessing."
 new_zealand_eng.4.b: "The transfer of land is only temporary."
 
 new_zealand_eng.5.t: "[NZL.GetNameDefCap] Requests Takeover of Administrative Burden"
 new_zealand_eng.5.d: "[NZL.GetNameDefCap] has requested to takeover the hardships and administrative burden of our pacific holdings, these include the islands of Fiji, Ellice Islands, The Friendly Islands, Gilbert and Canton Islands.\nThey hope by taking over some of our far-eastern territories it may allow our government to focus on other parts of our Empire more effiecently."
 new_zealand_eng.5.a: "Yes, this seems acceptable."
 new_zealand_eng.5.b: "What a horrid idea!"
 
 new_zealand_eng.6.t: "[ENG.GetNameDefCap] Accepts Administrative Transfer"
 new_zealand_eng.6.d: "[ENG.GetNameDefCap] has accepted our proposal, we are now in control of the British Pacific Holdings - [ENG.GetNameDefCap] has entrusted us with this duty to ensure they stay loyal to the crown and that they profitable territories of the Empire."
 new_zealand_eng.6.a: "We will not fail them"
 
 new_zealand_eng.7.t: "[ENG.GetNameDefCap] Denies Request"
 new_zealand_eng.7.d: "[ENG.GetNameDefCap] has refused to transfer the administrative burden of the British West Pacific Territories, citing that while   New Zealand's dedication to the Empire is unquestionable, the South Pacific remains a direct British responsibility. To hand over such authority would be to risk disorder—and perhaps embolden further ambitions. The Empire remains whole."
 new_zealand_eng.7.a: "Oh well, we could have predicted this"
 
 new_zealand_eng.8.t: "The Birth of the South Seas Dominion"
 new_zealand_eng.8.d: "Today marks the official creation of the South Seas Dominion—a monumental achievement for our nation. For years, we have sought to expand our influence in the Pacific, and now, under the leadership of the National Party, we have secured our rightful role as the stewards of these islands. With our new territories under our governance, we shall ensure stability, prosperity, and a stronger New Zealand-led Pacific. The dawn of a new era is upon us!"
 new_zealand_eng.8.a: "To a brighter future! Cheers!"
 
 new_zealand_eng.9.t: "The British Betrayal"
 new_zealand_eng.9.d: "Despite our ambitions and tireless efforts, the dream of a South Seas Dominion has been denied. The British government has rejected our petition, unwilling to relinquish direct control over the Pacific territories. This setback is a bitter pill to swallow for our nation and a blow to our aspirations of regional leadership. Though our influence remains limited, we shall not forget this refusal—we must find another path to assert our place in the Pacific."
 new_zealand_eng.9.a: "We will not forget this."
 
 new_zealand_eng.10.t: "[NZL.GetNameDefCap] Requests Naval Autonomy"
 new_zealand_eng.10.d: "While we have stationed a contigent of ships in the Pacific - The Goverment of New Zealand requests that the ships in the New Zealand Division be transferred under their newly forming naval command, With these vessels under their command, New Zealand’s sailors will gain the training and experience needed to establish an independent naval force."
 new_zealand_eng.10.a: "It's a reasonable request"
 new_zealand_eng.10.b: "We cannot sacrifice our own naval prowess in the region."
 
 new_zealand_eng.11.t: "The Birth of The Royal New Zealand Navy"
 new_zealand_eng.11.d: "[ENG.GetNameDefCap] has granted us two aging cruisers, however these cruisers are the backbone of our newly established naval force, we shall train new crews and adapt to the tactics of modern seaship. It will be the first step in our mastery of the seas."
 new_zealand_eng.11.a: "To a new age! Ahoy!"
 
 new_zealand_eng.12.t: "[ENG.GetNameDefCap] Refuses Naval Autonomy"
 new_zealand_eng.12.d: "While we have made our case for a stronger naval presence, the Empire cannot afford to fragment its forces in these uncertain times. The request to transfer ships has been denied, and our Pacific fleet shall remain under direct British command. If New Zealand is to expand its navy, it must do so on its own terms. For now, the security of the South Pacific remains in our hands."
 new_zealand_eng.12.a: "We shall build our own! To hell with those ships!"
 
