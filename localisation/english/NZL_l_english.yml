 NZL_intensify_naval_production: "Intensify Naval Production"
 NZL_intensify_naval_production_desc: "With our plans set in motion, we must immediately re-direct all available industrial capacity toward the construction of a formidable fleet. One that can swiftly transport our troops to newly independent states across the seas, to ensure their protection and success."
 NZL_the_red_marines: "The Red Marines"
 NZL_the_red_marines_desc: "To secure the success of our overseas revolutionary campaigns, we must establish and train a specialized force. This new force of elite units will be the vanguard of swift naval campaigns - they will spearhead the liberation of opressed workers all across Asia!"
