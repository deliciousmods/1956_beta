 NZL_coal_mining_cooperatives_desc: "A network of worker run coal mining cooperatives ensures a steady domestic supply of coal, however has lead to state employed miners angerment."
 NZL_state_paid_holidays: "State Paid Holidays"
 NZL_state_paid_holidays_desc: "To ensure compliance from the Worker Unions the state has offered to grant and pay for holidays for the workforce."
 NZL_price_controlled_goods: "Price Controlled Goods"
 NZL_increased_price_controls_on_goods: "Increased Price Controls on Goods"
 NZL_well_rested_workforce: "Well Rested Workforce"
 NZL_well_rested_workforce_desc: "Many union members have returned from the extra holidays reinvigorated and production rates have skyrocketed."
 NZL_food_stamps_idea: "Food Stamps"
 NZL_food_stamps_idea_desc: "To prevent food shortages and maintain public morale, the government distributes ration stamps, ensuring basic goods remain affordable. While this stabilizes the home front, it puts strain on the economy"
 NZL_mild_inflation: "Mild Inflation"

 # Militant Worker Unions Decisions
 NZL_address_worker_union_concerns_cat: "Adress Worker Unions Concerns"
 NZL_address_worker_union_concerns_cat_desc: "Our industrial workforce has grown restless as wartime pressures and economic policies squeeze the labor movement. With wages lowered, prices rising, and essential industries under strict government control, militant unions particularly among watersiders, miners, and rail workers have begun to push back against state intervention."
 NZL_militant_worker_unions: "Militant Worker Unions"
 NZL_militant_worker_unions_desc: "Many Unionists and their supportes have risen up against state intervention, we must quell their rebellious spirit."
 NZL_supress_the_unions: "Supress The Unions"
 NZL_supress_the_unions_desc: "The weaker members of the unions can be scared off with some police or military threat, however this action is only temporary and may flair up their resolve."
 NZL_pay_off_union_leaders: "Pay Off Union Leaders"
 NZL_pay_off_union_leaders_desc: "A simple transaction can change a man's life, some of the leaders can be persuaded to quell their supporters if they just have a little bit more money in their pocket."
 NZL_institute_price_control: "Institute Price Controls"
 NZL_institute_price_control_desc: "To ensure affordability of essential goods, a good way of securing trust with these unionists is ensuring price controls on goods."
 NZL_grant_extra_holidays: "Grant Extra Holidays"
 NZL_grant_extra_holidays_desc: "Some of the union members have been exhausted by the strain of production during wartime, to ensure their needs are met, giving them an opportunity to take a deserved break will surely support the cause."
 NZL_well_rested_workforce_tt: "-------------------------------\nIf §HGrant Extra Holidays§! decision is selected:\n-------------------------------\n"
 NZL_enact_food_stamps: "Enact Food Stamps"
 NZL_enact_food_stamps_desc: "To prevent food shortages and maintain public morale, the government distributes ration stamps, ensuring basic goods remain affordable"

 # Economic Downturn
 NZL_economic_downturn: "Economic Downturn"
 NZL_economic_downturn_desc: "Our economy is at risk of spiraling inflation due to wartime spending and currency devaluation. We must act decisively to prevent long-term economic instability"
 NZL_risk_of_inflation: "Risk of Inflation"
 NZL_risk_of_inflation_desc: "Rapid wartime spending, public borrowing, and increased demand for scarce goods have begun to strain the economy. Without careful management, rising prices could erode wages, disrupt production, and undermine public confidence in the government."
 NZL_create_wage_and_price_control_board: "Create Wage and Price Control Board"
 NZL_create_wage_and_price_control_board_desc: "We need to establish a Wage and Price Control Board to oversee economic regulation and maintain affordability for essential goods"
 NZL_lower_labour_wages: "Lower Labour Wages"
 NZL_lower_labour_wages_desc: "To keep inflation in check, we must reduce labour wages, though unpopular, it is a necessary measure to preserve national economic health."
 NZL_increase_price_controls: "Increase Price Controls"
 NZL_increase_price_controls_desc: "By expanding price controls across our industries, we can contain inflation and ensure fair distribution of resources to all citizens."
 NZL_abolish_food_stamps: "Abolish Food Stamps"
 NZL_abolish_food_stamps_desc: "Food stamps have become a financial burden. Ending the program will reduce government spending but may spark unrest among those most reliant on aid."
 NZL_encourage_savings: "Encourage Savings"
 NZL_encourage_savings_desc: "We must launch a campaign encouraging citizens to save rather than spend, easing inflation by reducing consumer demand and building long-term financial security"
 NZL_tighten_credit_and_banking_regulations: "Tighten Credit and Banking Regulations"
 NZL_tighten_credit_and_banking_regulations_desc: "We will impose stricter banking regulations and restrict credit flow to prevent reckless lending that fuels inflationary pressure."
 NZL_lower_intrest_rates: "Lower Intrest Rates"
 NZL_lower_intrest_rates_desc: "While it may undermine anti-inflation efforts, lowering interest rates could spark investment and growth some may view this shift as a timely opportunity amidst tightening conditions."
 NZL_increase_intrest_rates: "Increase Intrest Rates"
 NZL_increase_intrest_rates_desc: "A firm monetary stance may restore fiscal control, though the public may feel the pinch."
 NZL_expand_employment_programs: "Expand Employment Programs"
 NZL_expand_employment_programs_desc: "Investment in public works and other job creation opportunity's for returning soldiers may lead to stimulating growth and reducing unemployment"
 NZL_subsidize_essential_goods: "Subsidize Essential Goods"
 NZL_subsidize_essential_goods_desc: "To shield working families from the rising cost of living, the government moves to subsidize key necessities such as bread, milk, coal, and rent."

