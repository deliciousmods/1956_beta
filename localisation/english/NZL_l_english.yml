 NZL_prepare_airstrips: "Build Airstrips" # Better Naming
 NZL_prepare_airstrips_desc: "Creating airstrips for patrol aircraft to spot any possible threat will benefit our defensive schemes." # BetterLoc
 NZL_buildup_island_defences: "Buildup Island Defences"
 NZL_buildup_island_defences_desc: "Shores must be mined, anti-amphibious obstacles raised, and strongholds created to ensure our new territorial holdings do not fall under occupation."
 NZL_finalize_island_defensive_strategems: "Finalize Island Defensive Strategems"
 NZL_finalize_island_defensive_strategems_desc: "We have done all we can to bolster the defences of these remote islands, if an invasion is to come, we say let it come!"
 NZL_dig_defensive_trenches: "Dig Defensive Trenches"
 NZL_dig_defensive_trenches_desc: "Defensive Trenches will allow our units protection from enemy shore shelling and invasion forces pushing the naval landing grounds."
 NZL_mine_landing_grounds: "Mine Landing Grounds"
 NZL_mine_landing_grounds_desc: "Our enemies will fear their own beach-heads, as they will become a firewall of explosives, one that won't be easy to overcome for any force."
 NZL_place_anti_tank_obstacles: "Place Anti-Tank Obstacles"
 NZL_place_anti_tank_obstacles_desc: "Hedghehogs and Wood Pallisades will slow down any enemy armored attack, even make it impossible in certain areas."
 NZL_prepare_supply_caches: "Prepare Supply Caches"
 NZL_prepare_supply_caches_desc: "If our men are to hold these islands, they require prepared supplies to withstand for a prolonged fight."
 NZL_coordinate_with_local_forces: "Coordinate with Local Forces"
 NZL_coordinate_with_local_forces_desc: "While our regular armed forces engage the enemy in prolonged battle, irregular forces can raid enemy supply hubs and harass shore parties."

