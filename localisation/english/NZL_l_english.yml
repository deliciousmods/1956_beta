 ### LEGION Focus Branch
 NZL_legion_ideals: "Resurrecting the Legion"
 NZL_legion_ideals_desc: "Within a year, our support base crumbled, leaving us with nothing. But now, the time has come to restore faith in our movement and ensure that our nation follows a path of strength, unity, and renewal. We must not repeat the mistakes of the past—we will rise again and guide our people toward a future built on our ideals."
 NZL_seek_support_from_the_japanese_empire: "Seek Support From [JAP.GetNameDefCap]"
 NZL_seek_support_from_the_japanese_empire_desc: "[JAP.GetNameDefCap] is growing in strength, with their conquest of Manchuria, and their naval prowess unchallenged in the region, we must seek their support else our plans may never succeed."
 NZL_peaceful_takeover: "A Peaceful Path to Power"
 NZL_peaceful_takeover_desc: "The failures of the past will not define us. This time, we will work within the system, legalizing our movement and steadily building support among the people. Through patience, persuasion, and organization, we will ensure that we become a force too influential to ignore."
 NZL_placate_the_people: "Placate the People"
 NZL_placate_the_people_desc: "The people have grown tired of empty promises. The recent depression and lack of governmental support have left them disillusioned and desperate for change. They are ready for a new vision, a new leadership that truly represents their needs and aspirations. This is our moment to rise, to offer them hope, and to lead them toward a future free from the failures of the past."
 NZL_international_party_funding: "Seek International Funding"
 NZL_international_party_funding_desc: "Without funding, any hope of building a stable and well-prepared party capable of countering the growing support for both Labour and the National Party will vanish. To ensure our movement's success, we must seek foreign sponsors who can provide the necessary resources to sustain our cause."
