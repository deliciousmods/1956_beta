 NZL_secularize_the_state_cat: "Secularization of the State"
 NZL_secularize_the_state_cat_desc: "The remnants of religious influence continue to undermine the authority of the revolutionary government. To build a truly socialist society, we must decisively break the hold of outdated superstitions, redistribute the wealth hoarded by religious institutions, and crush reactionary resistance.\nThe time has come to forge an unshakable secular state."
