###Focuses###
 CENAM_armies_of_the_isthmus:0 "Armies of the Isthmus"
 CENAM_armies_of_the_isthmus_desc:0 "The armies of Central America are small, poorly armed and led by officers who spend more time on politics than on war. If our nation is to defend itself, its army must be rebuilt from the ground up."
 CENAM_us_military_mission:0 "Invite a US Military Mission"
 CENAM_us_military_mission_desc:0 "Washington is eager to replace European influence in the Americas. A mission of American officers will train our army in modern methods, and keep our country close to the United States."
 CENAM_canal_zone_training:0 "Canal Zone Training"
 CENAM_canal_zone_training_desc:0 "The US Army garrisons in the Panama Canal Zone have offered places in their courses to our officers. They will return as far better commanders."
 CENAM_german_military_mission:0 "Invite a German Military Mission"
 CENAM_german_military_mission_desc:0 "German officers have trained armies across Latin America for decades. A German mission will instill discipline and Prussian drill in our troops."
 CENAM_mausers_from_germany:0 "Mausers from Germany"
 CENAM_mausers_from_germany_desc:0 "Our German instructors have arranged the sale of Mauser rifles and field guns to equip the army they are training."
 CENAM_soviet_military_mission:0 "Invite a Soviet Military Mission"
 CENAM_soviet_military_mission_desc:0 "The Soviet Union is ready to help any workers' state defend itself. Red Army advisers and political commissars will build an army loyal to the revolution."
 CENAM_red_army_doctrine:0 "Red Army Doctrine"
 CENAM_red_army_doctrine_desc:0 "Our Soviet advisers bring with them the lessons of the Civil War and the theories of the Red Army's greatest minds."
 CENAM_escuela_militar:0 "Reform the Officer Corps"
 CENAM_escuela_militar_desc:0 "Our officers owe their commissions to family, money and politics. A proper military academy will teach them to command, and remind them who they serve."
 CENAM_professional_army:0 "A Professional Army"
 CENAM_professional_army_desc:0 "The army must stay out of politics. Officers who plot will be dismissed, and promotion will come through merit alone."
 CENAM_loyal_army:0 "A Loyal Army"
 CENAM_loyal_army_desc:0 "An army that is loyal to the government will never turn on it. Officers who prove their loyalty will be rewarded, and the barracks will become a pillar of the state."
 CENAM_the_general_staff:0 "The General Staff"
 CENAM_the_general_staff_desc:0 "With an officer corps we can rely on, we can finally form a general staff to plan our defense and study the art of modern war."
 CENAM_field_maneuvers:0 "Field Maneuvers"
 CENAM_field_maneuvers_desc:0 "Large-scale maneuvers in the mountains and jungles will test our officers in conditions close to war, and show who is fit to command."
 CENAM_escuela_superior_de_guerra:0 "Found a War College"
 CENAM_escuela_superior_de_guerra_desc:0 "A war college for our senior officers will teach strategy, logistics and the command of large formations, and produce the generals our army needs."
 CENAM_rural_reserves:0 "Rural Reserves"
 CENAM_rural_reserves_desc:0 "Every village and hacienda has men who can shoot. Organized into reserves, they can be called up to defend the country in times of need."
 CENAM_tropical_medicine:0 "Tropical Medicine"
 CENAM_tropical_medicine_desc:0 "Malaria, dysentery and yellow fever have killed more soldiers in Central America than any enemy. Army doctors and better sanitation will keep our troops alive."
 CENAM_jungle_columns:0 "Jungle Columns"
 CENAM_jungle_columns_desc:0 "Small, self-sufficient columns can move through the jungles of the lowlands where no larger force could follow."
 CENAM_fighters_of_the_sierra:0 "Fighters of the Sierra"
 CENAM_fighters_of_the_sierra_desc:0 "The cities and farms of Central America lie in the volcanic highlands. Our soldiers must learn to fight in the mountains they are defending."
 CENAM_mule_trains:0 "Mule Trains"
 CENAM_mule_trains_desc:0 "Where there are no roads, there are mules. Organized supply trains will carry food and ammunition along the mountain tracks to our troops."
 CENAM_machete_and_rifle:0 "Machete and Rifle"
 CENAM_machete_and_rifle_desc:0 "Small bands who know the land have held off far larger armies in Central America before. Trained as elite units, they will strike where the enemy is weakest and vanish into the hills."
 CENAM_arms_from_abroad:0 "Arms from Abroad"
 CENAM_arms_from_abroad_desc:0 "We have no arms industry of our own. Until we do, our weapons must be bought from the great powers, through the friends our military mission has made."
 CENAM_standardize_the_rifle:0 "Standardize the Rifle"
 CENAM_standardize_the_rifle_desc:0 "Our soldiers carry a dozen different rifles in a dozen different calibers. A single standard rifle will simplify training, supply and production."
 CENAM_pack_artillery:0 "Pack Artillery"
 CENAM_pack_artillery_desc:0 "Heavy guns cannot follow our army into the mountains, but light guns that break down to be carried by mules can."
 CENAM_army_road_battalions:0 "Army Road Battalions"
 CENAM_army_road_battalions_desc:0 "In peacetime, our soldiers will build the roads the army will need in war, and our engineers will learn their trade in the process."
 CENAM_trucks_for_the_army:0 "Trucks for the Army"
 CENAM_trucks_for_the_army_desc:0 "With new roads, trucks can carry our troops faster than any mule. The army will begin to motorize its supply and its infantry."
 CENAM_light_tanks_for_the_isthmus:0 "Light Tanks for the Isthmus"
 CENAM_light_tanks_for_the_isthmus_desc:0 "Heavy tanks would sink in our swamps and stall on our mountain roads, but light tanks can still go where our new roads lead. Simple, light designs that our workshops can build cheaply will give our army a punch no neighbor can match."
 CENAM_field_maneuvers_tt:0 "Improves the §HApolitical Officer Corps§! or §HLoyal Officer Corps§! national spirit:\n  Initiative: §G+5%§!\n  Org Loss when Moving: §G-5%§!"
 CENAM_escuela_superior_de_guerra_tt:0 "Improves the §HApolitical Officer Corps§! or §HLoyal Officer Corps§! national spirit:\n  Coordination: §G+5%§!\n  Max Planning: §G+10%§!"
 CENAM_mountain_guns:0 "Mountain Guns"
 CENAM_mountain_guns_desc:0 "Our pack guns have proven they can follow the infantry anywhere, but our gunners must still learn to fight with them among the volcanoes and ridges of the highlands. Trained alongside our mountain troops, they will bring their guns to bear where the enemy least expects them."

###Ideas###
 CENAM_us_instructors:0 "US Instructors"
 CENAM_us_instructors_desc:0 "American officers are training our army in modern methods."
 CENAM_german_instructors:0 "German Instructors"
 CENAM_german_instructors_desc:0 "German officers have brought discipline and drill to our army."
 CENAM_soviet_advisers:0 "Soviet Advisers"
 CENAM_soviet_advisers_desc:0 "Red Army advisers and political commissars are building an army loyal to the revolution."
 CENAM_apolitical_officer_corps:0 "Apolitical Officer Corps"
 CENAM_apolitical_officer_corps_desc:0 "Our officers are promoted on merit and keep out of politics."
 CENAM_loyal_officer_corps:0 "Loyal Officer Corps"
 CENAM_loyal_officer_corps_desc:0 "Our officers are rewarded for their loyalty, and the army stands firmly behind the government."
 CENAM_apolitical_officer_corps_2:0 "Apolitical Officer Corps"
 CENAM_apolitical_officer_corps_2_desc:0 "Promoted on merit and hardened by maneuvers, our officers are becoming true professionals."
 CENAM_apolitical_officer_corps_3:0 "Apolitical Officer Corps"
 CENAM_apolitical_officer_corps_3_desc:0 "Trained at our own war college, our officer corps is among the most professional in Latin America."
 CENAM_loyal_officer_corps_2:0 "Loyal Officer Corps"
 CENAM_loyal_officer_corps_2_desc:0 "Our loyal officers have proven themselves in the field as well as in the barracks."
 CENAM_loyal_officer_corps_3:0 "Loyal Officer Corps"
 CENAM_loyal_officer_corps_3_desc:0 "Trained at our own war college, our officers are both loyal to the government and capable commanders."
 CENAM_jungle_commandos:0 "Jungle Commandos"
 CENAM_jungle_commandos_desc:0 "Elite units trained to live, move and fight in the jungle, striking where the enemy is weakest and vanishing into the trees."
 CENAM_tropical_medicine_idea:0 "Tropical Medicine"
 CENAM_tropical_medicine_idea_desc:0 "Army doctors and better sanitation protect our troops from the diseases of the tropics."
 CENAM_mule_trains_idea:0 "Mule Trains"
 CENAM_mule_trains_idea_desc:0 "Organized mule trains carry supplies along mountain tracks where no truck can go."
 CENAM_standardized_rifle:0 "Standardized Rifle"

###Decisions###
 CENAM_arms_purchases:0 "Arms Purchases"
 CENAM_arms_purchases_desc:0 "Through the country that trains our army, we can buy the weapons we cannot yet make ourselves."
 CENAM_buy_rifles:0 "Buy Rifles"
 CENAM_buy_rifles_desc:0 "Order a shipment of rifles from the country that trains our army."
 CENAM_buy_artillery:0 "Buy Artillery"
 CENAM_buy_artillery_desc:0 "Order a shipment of field guns from the country that trains our army."
 CENAM_buy_support_equipment:0 "Buy Support Equipment"
 CENAM_buy_support_equipment_desc:0 "Order radios, engineering tools and other support equipment from the country that trains our army."

