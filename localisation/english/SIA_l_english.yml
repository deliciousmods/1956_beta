  # Country Leaders
  SIA_phahon_phonphayuhasena: "Phahon Phonphayuhasena"
  SIA_phahon_phonphayuhasena_desc: "Born in Bangkok in 1888 to mixed parents, Phraya Phahon Phonphayuhasena, abroad and at home, has witnessed many years of Chulalongkorn the Great's reign, the entirety of the Great War, the empire of Japan's rise on the world stage and the 1930s financial crisis.\n\nIn response to humiliating royal scandals amid financial crisis, as well as Bangkok's natural transformation to an educated, western-influenced city, civilian and military reformists, de facto guided by Phahon, joined forces for what would become the Khana Ratsadon. In 1932, this vanguard force staged a coup d'état, forcing a constitution upon Rama VII.\n\nSince then, the revolution has grown divided from the inside and resistance has formed, primarily in the countryside. Despite threats of royalist counterrevolution, calls for liberal reforms and a surge in European-style ultranationalism throughout the armed forces, Phahon as Prime Minister remains respected at the center of the revolution. With few satisfied and the clock ticking forward, how much longer can Phahon's rule last?"

