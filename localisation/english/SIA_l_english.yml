  # Mending Siamese Irredentism Decisions
  SIA_mending_siamese_irredentism_r56: "Mending [SIA.GetAdjective] Irredentism"
  SIA_mending_siamese_irredentism_r56_desc: "Seeing the futility of armed resistance, King Chulalongkorn the Great, where many others would defy, signed over a multitude of territorial concessions from the nation's sphere of influence, awarding the British and French considerable territorial concessions while maintaining the independence of our heartland.\n\nWith our nation undergoing decades of modernization, while the colonial powers overstretch themselves in their global empires, perhaps we can rally behind our losses, and with their reversal: foster a new [SIA.GetAdjective] golden era!"

  SIA_peace_with_honor_in_indochina_r56: "Peace With Honor in Indochina"
  SIA_peace_with_honor_in_indochina_r56_desc: "Much of the lands in what was once called 'French' Indochina now lie under our control. The time has come to force our enemies into a peace with honor!"
  SIA_if_all_burmese_starting_cores_are_controlled_by_us_we_will_make_a_subject_out_of_them_if_possible_tt: "If all §Y[BRM.GetAdjective]§! starting cores are controlled by us, we will make a subject out of them if possible."
  SIA_r56.28.desc: "Our enemies have accepted peace with our nation, with us agreeing to a border with influence from our line of control. May we celebrate this victory!"

  SIA_peace_for_our_western_claims_r56: "Peace for Our Western Claims"
  SIA_peace_for_our_western_claims_r56_desc: "Much of the lands in what was once indisputably British now lie under our control. The time has come to force our enemies into a peace with honor!"
  SIA_if_all_vietnamese_starting_cores_are_controlled_by_us_we_will_make_a_subject_out_of_them_if_possible_tt: "If all §Y[VIN.GetAdjective]§! starting cores are controlled by us, we will make a subject out of them if possible."

  SIA_a_new_destiny_for_indochina: "A New Destiny for Indochina"
  SIA_a_new_destiny_for_indochina_desc: "The men of mainland southeast-Asia have fallen victim to capitalism, colonialism, feudalism and nearly every other system of man-made oppression. With much of the region under our revolution banner, we can proclaim a new destiny for Indochina: foster reconciliation, spread the flames of progress and achieve prosperity for all!"
  gains_claims_on_all_starting_vietnamese_and_burmese_cores_except_shanland_r56_tt: "Gains claims on all starting §Y[VIN.GetAdjective]§! and §Y[BRM.GetAdjective]§! starting cores except §Y[1018.GetName]§!."

  SIA_restore_siamese_rule_in_lan_chang_r56: "Restore [SIA.GetAdjective] Rule in [926.GetName]"
  SIA_restore_siamese_rule_in_lan_chang_r56_desc: "Ceded to Paris's control in the Franco-Siamese Treaty of 1904, [926.GetName] province has since lied under the control of the French protectorate of Laos. Due to the province's low population, linguistic unity and recent memory of being under our realm, its reintegration should be a simple feat!"

  SIA_restore_siamese_rule_in_champasak_r56: "Restore [SIA.GetAdjective] Rule in [924.GetName]"
  SIA_restore_siamese_rule_in_champasak_r56_desc: "Ceded to Paris's control in the Franco-Siamese Treaty of 1904, [924.GetName] province has since lied under the control of the French protectorate of Laos. Due to the province's low population, linguistic unity and recent memory of being under our realm, its reintegration should be a simple feat!"

  SIA_proclaim_the_reintegration_of_laos_r56: "Proclaim the Reintegration of Laos"
  SIA_proclaim_the_reintegration_of_laos_r56_desc: "The Laotian-speaking lands on the eastern bank of the Mekong were ceded to French authority following the 1893 Franco-Siamese crisis, being arguably the most significant territorial loss during Chulalongkorn's years. While these lands were never under Bangkok's direct control, linguistic unity and the spirit of anti-western colonialism will surely propel Laos right into our virtuous hands!"

  SIA_proclaim_the_reintegration_of_inner_cambodia_r56: "Proclaim the Reintegration of Inner-Cambodia"
  SIA_proclaim_the_reintegration_of_inner_cambodia_r56_desc: "The 1907 Franco-Siamese treaty saw the ceding of Siam's Inner-Cambodia region, which lost us access to many prestigious sites, the important city of Angkor, and the critical Tonlé Sap freshwater lake. While the region lacks a significant Thai-speaking population, its loss is in recent memory, while having considerable strategic and economic purposes."

  SIA_reclaim_the_salweens_northeast_bank_r56: "Reclaim the Salween's Northeast Bank"
  SIA_reclaim_the_salweens_northeast_bank_r56_desc: "Although we forced to withdraw our claim over the eastern bank of the Salween to the benefit of British India, it was a historic part of the Lan Na kingdom who was absorbed into Siam, also being home to many speakers of the Tai Shan language. With this rightful territory under our control, its integration shall finally commence!"

  SIA_irredentist_claims_in_malaya_r56: "Irredentist Claims in Malaya"
  SIA_irredentist_claims_in_malaya_r56_desc: "In our times of weakness, we were all but forced to cede minor territories in the Kra isthmus. With it under our control, it shall be brought back into our righteous hands!"

  SIA_solidify_control_in_laos_r56: "Solidify Control in Laos"
  SIA_solidify_control_in_laos_r56_desc: "While there remains some discontent against our rule, we have largely quelled armed resistance and built limited support for our administration in Laos. With these facts clear, there is little reason to halt integrating this vital land."

  SIA_offer_laos_provincial_autonomy_r56: "Offer Laos Provincial Autonomy"
  SIA_offer_laos_provincial_autonomy_r56_desc: "Although there exists a degree of sympathy for our rule in Laos, much of the popular clings onto their ethnolinguistic identity. We should end regional policies of assimilation, and instead work towards an order where the local population is integrated, yet autonomous and free to practice their customs."

  SIA_solidify_control_in_shanland_r56: "Solidify Control in [1018.GetName]"
  SIA_solidify_control_in_shanland_r56_desc: "While there remains some discontent against our rule, we have largely quelled armed resistance and built limited support for our administration in [1018.GetName] province. With these facts clear, there is little reason to halt integrating this vital land."

  SIA_offer_inner_cambodia_provincial_autonomy_r56: "Offer Inner-Cambodia Provincial Autonomy"
  SIA_offer_inner_cambodia_provincial_autonomy_r56_desc: "If we are to establish peace in the region of Inner-Cambodia, we must respect the customs of its people and abandon attempts at forced assimilation. By living alongside our people long enough, surely they will consider themselves [SIA.GetAdjective] eventually."

  SIA_offer_autonomy_to_the_cambodian_provinces_r56: "Offer Autonomy to the Cambodian Provinces"
  SIA_offer_autonomy_to_the_cambodian_provinces_r56_desc: "While the Cambodians once laid under our banner, it was in a heavily autonomous form. By offering them a route to preserving their nationality and language through common union, surely they would be willing to serve our union."

  SIA_organize_the_burmese_provinces_r56: "Organize the Burmese Provinces"
  SIA_organize_the_burmese_provinces_r56_desc: "The Burmese provinces are highly multicultural, containing many minorities who also live in historically Siamese lands. By offering the Burmese and every other minority in their lands cultural protections and a preservation of their identity, we can bring them towards peace with our southeast-Asian union."

  SIA_offer_autonomy_to_the_vietnamese_provinces_r56: "Offer Autonomy to the Vietnamese Provinces"
  SIA_offer_autonomy_to_the_vietnamese_provinces_r56_desc: "Vietnam has fallen victim to the horrors of foreign occupation and colonialism. By offering their people the cultural autonomy, national preservation and rights that the French have failed to, we can rally them behind our banner of unity and progress!"

  SIA_offer_shanland_provincial_autonomy_r56: "Offer [1018.GetName] Provincial Autonomy"
  SIA_offer_shanland_provincial_autonomy_r56_desc: "Although there exists a degree of sympathy for our rule in [1018.GetName], much of the popular clings onto their ethnolinguistic identity. We should end regional policies of assimilation, and instead work towards an order where the local population is integrated, yet autonomous and free to practice their customs."

  SIA_crush_dissent_in_inner_cambodia_r56: "Crush Dissent in Inner-Cambodia"
  SIA_crush_dissent_in_inner_cambodia_r56_desc: "While there remains widespread discontent against our rule, we can overpower armed resistance and build tolerance for our administration in inner-Cambodia. With these facts clear, there is little reason to halt integrating this vital land."

  #Finding a Path Forward Decisions
  SIA_finding_a_path_forward_r56: "Finding a Path Forward"
  SIA_finding_a_path_forward_r56_desc: "While many men of varied ideologies and talents took up arms in cooperation against the royal dictatorship, little today stands in unity between [SIA.GetAdjective] constitutional revolutionaries.\n\nWith instability and a power vacuum visible to all, we must move wisely against threats to our rule, and carve out a clear, prosperous future for all [SIA.GetAdjective] people!"

  SIA_phahon_phonphayuhasena_steps_down_r56: "Phahon Phonphayuhasena Steps Down"
  SIA_phahon_phonphayuhasena_steps_down_r56_desc: "Phahon Phonphayuhasena, due to many rumored reasons from failing health to lack of ambition to rule, is likely not to remain as Prime Minister of [SIA.GetNameDef] for long.\n\nWhether we wish to preserve Phahon's modest reforms, or move away from his compromising nature will be decided by these later years of his rule"

  #Legacy Ideas Only Used on Other Tags:

  SIA_anti_fascism: "Anti Fascism"
  SIA_anti_fascism_desc: "Fascism is a great evil that threatens the order and freedom of all Asians. Even if nobody is with us, and even to the end, we shall be a beacon against this menace!"

  SIA_loyal_army: "Loyal Army"
  SIA_loyal_army_desc: "Through recent purges in our armed forces, we have created a staunchly loyal, decisive army who will protect our rule. Our plans for the nation shall not go opposed!"

  SIA_centralised_production: "Centralized Production"
  SIA_centralised_production_desc: "By centralizing the management of the economy, we will ensure that resources are properly allocated for the benefit of the nation."

  SIA_state_invervention: "State Intervention"
  SIA_state_invervention_desc: "State intervention in the economy is necessary to avoid the exploitation of the weakest by the strongest. Laws protecting workers with benefits will be put in place"

  # NAVY FOCUSES
  SIA_prepare_a_naval_expansion_r56: "Prepare a Naval Expansion"
  SIA_prepare_a_naval_expansion_r56_desc: "[SIA.GetNameDefCap] is surrounded on all sides by greater naval powers. While we can never hope to take on every potential rival simultaneously, we should at the very least ensure that we are capable of holding our own as a regional naval power."
  unlocks_decision_lease_foreign_repair_capacity_which_grants_r56_tt: "Unlocks Decision: §YLease Foreign Repair Capacity§!, which grants:\n§YFor 70 days:§!\nCivilian Factory Use: §R1§!\nOffmap Dockyards: §G+2§!\nShip Repair Speed: §G+25%§!"
  SIA_lease_foreign_repair_capacity_r56: "Lease Foreign Repair Capacity"
  SIA_lease_foreign_repair_capacity_r56_desc: "As a nation lacking enough industry for the task, we should look to our economically stronger neighbors in search of having our fleet serviced."

  SIA_develop_the_southern_bases_r56: "Develop the Southern Bases"
  SIA_develop_the_southern_bases_r56_desc: "We are Asia's natural base between India, China, the resources of Malaya and the Pacific. We should utilize our vital geography and construct the infrastructure needed to supply our troops in the troubles to come."

  SIA_incorporate_allied_radar_designs_r56: "Incorporate Allied RADAR Designs"
  SIA_incorporate_allied_radar_designs_r56_desc: "Our allies have made impressive progress in the development of modern RADAR technology. As a nation many decades behind in this vital research, we should look to acquiring foreign designs from our closest allies."

  SIA_prioritize_domestic_radar_research_r56: "Prioritize Domestic RADAR Research"
  SIA_prioritize_domestic_radar_research_r56_desc: "We have learned of worryingly fast development of RADAR by western nations. If we are to not fall behind, we must do all that we can to catch up in this vital area!"

  SIA_acquire_japanese_torpedoes_r56: "Acquire [JAP.GetAdjective] Torpedoes"
  SIA_acquire_japanese_torpedoes_r56_desc: "[JAP.GetNameDefCap] is on a path towards being the Pacific ocean's strongest naval power, and their aggressive submarine and naval bomber designs will play a big role in that. As a minor power with little naval industry, we should seek to acquire these weapons of asymmetrical naval warfare."

  SIA_expand_the_marine_corps_department_r56: "Expand the Marine Corps Department"
  SIA_expand_the_marine_corps_department_r56_desc: "Regardless of whether we are to become an advanced ground or naval power, [SIA.GetNameDef] must have the capacity to wage wars across the rivers and ocean that lays between us and our enemies."

  SIA_begin_limited_shipbuilding_r56: "Begin Limited Shipbuilding"
  SIA_begin_limited_shipbuilding_r56_desc: "We have come far in putting funds towards the development of a modern navy, but it will not count for much if we continue to lack the industry for modern shipbuilding. We should put efforts toward establishing a proper but humble shipbuilding industry on our southern coast."

  SIA_modernize_the_central_repair_facilities_r56: "Modernize the Central Repair Facilities"
  SIA_modernize_the_central_repair_facilities_r56_desc: "Our eastern coast is likely to see most of our action in any conflict. We should ensure that we have the proper capabilities to repair ships who are damaged in battle without clogging up future production."

  SIA_form_a_modern_sattahip_engineering_facility_r56: "Form a Modern Sattahip Engineering Facility"
  SIA_form_a_modern_sattahip_engineering_facility_r56_desc: "Our Sattahip Bay naval base is a vital part of our southern gulf defenses, and they will become a vital part in supplying our navy in the event of war. We should form a modern engineering facility in this vital location so that we may exploit any technological developments to our advantage."
  SIA_due_to_focus_establish_a_chiang_mai_military_academy_not_being_completed_we_will_receive_the_following_effects_r56_tt: "Due to Focus: §YEstablish a Chiang-Mai Military Academy§! not being completed, we will receive the following effects:"

  SIA_look_to_modern_heavy_ships_r56: "Look to Modern Heavy Ships"
  SIA_look_to_modern_heavy_ships_r56_desc: "While we lack the industry to support a gargantuan navy, surely we will require a few heavy ships of our own to defend our prestige and enforce our interests in the Malaccan straits, should we have to."

  SIA_study_modern_naval_guns_r56: "Study Modern Naval Guns"
  SIA_study_modern_naval_guns_r56_desc: "[JAP.GetNameDefCap] and several western nations have developed impressive naval weapons for destroying the armor on modern ships. We should study these weapons to see if we can develop suitable alternatives."

  SIA_develop_anti_submarine_tools_r56: "Develop Anti-Submarine Tools"
  SIA_develop_anti_submarine_tools_r56_desc: "Despite much of the world moving towards autarky, we like many others would be left in crisis should a submarine power blockade our seas. [ENG.GetNameDefCap] and [USA.GetNameDef] have developed impressive tools for detecting and combatting enemy submarines, and we should seek to incorporate them into our own fleet."

  SIA_look_to_agile_surface_ships_r56: "Look to Agile Surface Ships"
  SIA_look_to_agile_surface_ships_r56_desc: "Light ships have seen perhaps the most impressive of developments since the days of the Great War, hosting guns capable of bringing down the biggest of ships, while being agile and suited for mass-production. Perhaps we should look to acquiring designs for our use."

  SIA_import_modern_heavy_ships_r56: "Import Modern Heavy Ships"
  SIA_import_modern_heavy_ships_r56_desc: "If we are to be a major power in our seas, we require a fleet capable of protecting our presence in the region. We shall order and work to forge gargantuan ships, and with them: become a true naval power on both, our Pacific and Indian coasts."
  SIA_royal_siamese_navy_r56: "[GetSiamRoyalStatus_r56] [ROOT.GetAdjective] Navy"
  SIA_royal_siamese_navy_r56_desc: "If we are to be a major power in our seas, we require a fleet capable of protecting our presence in the region. Our forces work hard to forge major ships, acquire those needed for our defense and to become a true deterrence to any power who thinks they can challenge our independence!"

  SIA_develop_modern_escorts_r56: "Develop Modern Escorts"
  SIA_develop_modern_escorts_r56_desc: "No amount of preparation or heavy-handed autarky can fully eliminate our dependence on international trade. If our economy is to survive the coming war, we must work to modernize our convoy escort systems and tactics."

  SIA_prepare_coastal_minelaying_operations_r56: "Prepare Coastal Minelaying Operations"
  SIA_prepare_coastal_minelaying_operations_r56_desc: "Our close proximity to the Malaccan strait, and coastal threat from two sides necessitates us using all means to deter a threat by amphibious force. We should prepare minelaying operation to keep invaders at bay."

  SIA_acquire_cheap_raiding_ships_r56: "Acquire Cheap Raiding Ships"
  SIA_acquire_cheap_raiding_ships_r56_desc: "While we lack the economic power to produce a large conventional fleet, our position near the Malaccan strait makes us uniquely advantaged to replicate German submarine strategies. We should acquire cheap submarine designs, and see how we can further improve them to match our needs."

  SIA_develop_submarine_facilities_r56: "Develop Submarine Facilities"
  SIA_develop_submarine_facilities_r56_desc: "We have made important technological breakthroughs in submarine technology, but we lack the industry to use it. We must rectify this immediately."

  SIA_specialized_utility_submarines_r56: "Specialized Utility Submarines"
  SIA_specialized_utility_submarines_r56_desc: "Submarines are one tool of many in our fight to control our waters. By investing in specialized designs for ranged operations, we can improve coordination with other segments of our navy."
  SIA_specialized_submarine_production_r56: "Specialized Submarine Production"
  SIA_specialized_submarine_production_r56_desc: "Submarines are one tool of many in our fight to control our waters. Our investments in specialized designs for ranged operation are improving coordination with other segments of our navy."

  SIA_standardized_mass_production_r56: "Standardized Mass Production"
  SIA_standardized_mass_production_r56_desc: "If we are to deter a war in our waters, we must fully commit all naval industry resources toward a massive submarine fleet capable of imposing terror on any nation dependent on trade through our seas."
  SIA_mass_submarine_production_r56: "Mass Submarine Production"
  SIA_mass_submarine_production_r56_desc: "If we are to deter a war in our waters, we must fully commit all naval industry resources toward a massive submarine fleet capable of imposing terror on any nation dependent on trade through our seas."

  # AIR FORCE FOCUSES
  SIA_separate_the_royal_aeronautical_service_r56: "Separate the Royal Aeronautical Service"
  SIA_separate_the_royal_aeronautical_service_r56_desc: "Aviation developments have already shown themself to be a pivotal component in the future of warfare. Just as the western powers are, [ROOT.GetNameDef] must develop a strong and modern air force if we are to be taken seriously on the world stage."
  SIA_the_siamese_air_force: "[GetSiamRoyalStatus_r56] [ROOT.GetAdjective] Air Force"
  SIA_the_siamese_air_force_desc: "A modern army calls for a modern air force to protect and support its actions on the battlefield. The [GetSiamRoyalStatus_r56] [ROOT.GetAdjective] Air Force shall do just that for [ROOT.GetNameDef]!"

  SIA_parachute_infantry_battalion_r56: "Parachute Infantry Battalion"
  SIA_parachute_infantry_battalion_r56_desc: "Some modern militaries are experimenting with airborne infantry special forces known as paratroopers. We should experiment with this form of special forces."

  SIA_establish_a_chiang_mai_military_academy_r56: "Establish a Chiang-Mai Military Academy"
  SIA_establish_a_chiang_mai_military_academy_r56_desc: "The defense of our nation has largely been set around our capital, for better or worse. But times are changing quickly and many inside the military propose the creation of an academy further into our interior. We should make this happen to see if it bears fruit for our nation."
  has_at_least_3_researched_land_or_air_doctrine_tt: "Has at least §Y3§! researched land or air doctrine levels"
  SIA_due_to_focus_form_a_modern_sattahip_engineering_facility_not_being_completed_we_will_receive_the_following_effects_r56_tt: "Due to Focus: §YForm a Modern Sattahip Engineering Facility§! not being completed, we will receive the following effects:"

  SIA_study_the_curtiss_p36_r56: "Study the Curtiss P-36"
  SIA_study_the_curtiss_p36_r56_desc: "Fighter planes have come a long way since the days of the Great War and it is clear that agility reigns supreme in the skies. We should approach the [USA.GetAdjective] to see if they could provide access to their prototype light aircraft."

  SIA_acquire_the_messerschmitt_bf_110_r56: "Acquire the Messerschmitt BF110"
  SIA_acquire_the_messerschmitt_bf_110_r56_desc: "Fighter planes have come a long way since the days of the Great War and the best equipped planes are the ones who reign supreme in the skies. We should approach the [GER.GetAdjective] to see if they could provide access to their prototype heavy aircraft."

  SIA_begin_domestic_fighter_production_r56: "Begin Domestic Fighter Production"
  SIA_begin_domestic_fighter_production_r56_desc: "With proper [SIA.GetAdjective] designs in our hands, the time has come to put funds towards national aircraft production. Even if it's small, we must start somewhere."

  SIA_import_foreign_bombers_r56: "Import Foreign Bombers"
  SIA_import_foreign_bombers_r56_desc: "Bomber aircraft have evolved into a force of terror on the battlefield. We need to find a western supplier so that we can have access to this vital invention."

  SIA_support_interbranch_operations_r56: "Support Interbranch Operations"
  SIA_support_interbranch_operations_r56_desc: "As we forge domestic aircraft designs, we must continue to prioritize collaboration with our soldiers on the ground if we are to win."

  SIA_design_modern_fighters_r56: "Design Modern Fighters"
  SIA_design_modern_fighters_r56_desc: "The time has come to develop modern fighters of our own so that we may finally achieve dominance in our skies."

  SIA_produce_modern_bombers_r56: "Produce Modern Bombers"
  SIA_produce_modern_bombers_r56_desc: "Bomber designs of our own are starting to bear fruit, but we lack the industry to manufacture them. We must prioritize the construction of factories that can build our modern weapons of war."
  SIA_aircraft_production_advances_r56: "Aircraft Production Advances"
  SIA_aircraft_production_advances_r56_desc: "With national aircraft in our possession, the time has come to put considerable resources towards it's production."

  SIA_send_air_force_cadets_abroad_r56: "Send Air Force Cadets Abroad"
  SIA_send_air_force_cadets_abroad_r56_desc: "The nations of the west have countless academies training pilots and officers the art of aerial warfare. We should send cadets of our own across Europe to integrate the continent's experience into our own air force."
  SIA_foreign_air_mission_r56: "Foreign Air Mission"
  SIA_foreign_air_mission_r56_desc: "The nations of the west have countless academies training pilots and officers the art of aerial warfare. We should send cadets of our own across Europe to integrate the continent's experience into our own air force."

  SIA_royal_siamese_air_force_academy_r56: "[GetSiamRoyalStatus_r56] [ROOT.GetAdjective] Air Force Academy"
  SIA_royal_siamese_air_force_academy_r56_desc: "With a talented pool of officers returning from their experiences across the globe, the time has come to found an academy of our own, to train [SIA.GetNameDef]'s best and brightest to wage victory in the skies."
  SIA_the_royal_siamese_air_force_r56: "The [GetSiamRoyalStatus_r56] [ROOT.GetAdjective] Air Force"
  SIA_the_royal_siamese_air_force_r56_desc: "With a talented pool of officers returning from their experiences across the globe, the time has come to found an academy of our own, to train [SIA.GetNameDef]'s best and brightest to wage victory in the skies."

  # PREPARE A DECENTRALIZED DEFENSE
  SIA_continue_sending_cadets_abroad_r56: "Continue Sending Cadets Abroad"
  SIA_continue_sending_cadets_abroad_r56_desc: "We should not rely on ourselves alone to make our army strong. [SIA.GetNameDefCap] has a wide range of bright minds but our Great War experience only carries us so far. We should expand foreign cadet programs so that their experiences can reshape our national defense."

  SIA_study_defense_in_depth_models_r56: "Study Defense-in-Depth Models"
  SIA_study_defense_in_depth_models_r56_desc: "Compared to the threats on our horizon, our men are vastly outnumbered, equipped, and educated. Replicating the actions of 'rising' powers will not result in an overnight modernization; we must also look to the nations who have triumphed against superior foes, so that our flag too can make victory against difficult odds."

  SIA_begin_an_inland_retreat_r56: "Begin an Inland Retreat"
  SIA_begin_an_inland_retreat_r56_desc: "The war is not going well among our southern coast, but it is not the end for us. We shall retreat inland, and lure these fools into a heartland ill-suited for artillery, modern supply lines, or motor-vehicles."
  SIA_defensive_reorganization_r56: "Defensive Reorganization"
  SIA_defensive_reorganization_r56_desc: "The war is not going well among our southern coast, but it is not the end for us. We shall retreat inland, and lure these fools into a heartland ill-suited for artillery, modern supply lines, or motor-vehicles."

  SIA_continue_the_fight_underground_r56: "Continue the Fight Underground"
  SIA_continue_the_fight_underground_r56_desc: "Our conventional forces have failed to protect the nation, but we will never give up. We shall retreat the best of our surviving forces and government into our allies lands, and rebuild so that we may retake what is ours!"
  SIA_taking_the_fight_underground_r56: "Taking the Fight Underground"
  SIA_taking_the_fight_underground_r56_desc: "Our conventional forces have failed to protect the nation, but we will never give up. We shall retreat the best of our surviving forces and government into our allies lands, and rebuild so that we may retake what is ours!"

  SIA_prepare_landing_operations_r56: "Prepare Landing Operations"
  SIA_prepare_landing_operations_r56_desc: "If we are to liberate our country from the shackles of our occupiers, our best men and the most thorough of training will be needed. We've seen striking success and laughable failure in both amphibious and airborne operations, ours must be the former."

  SIA_foster_connections_on_the_ground_r56: "Foster Connections on the Ground"
  SIA_foster_connections_on_the_ground_r56_desc: "Many in our nation lacked the fortune to escape our occupiers and many more are staying by choice. We must join our efforts with theirs if we are to succeed against our unjust invaders!"

  SIA_take_the_fight_to_our_enemies_soil_r56: "Take the Fight to our Enemies Soil"
  SIA_take_the_fight_to_our_enemies_soil_r56_desc: "Our control over the nation is returning rapidly by the day. The time has come to celebrate the return of our government and bring an end to this war once and for all!"
  SIA_taking_the_fight_to_our_enemies_soil_r56: "Taking the Fight to our Enemies Soil"
  SIA_taking_the_fight_to_our_enemies_soil_r56_desc: "With the liberation of our nation nigh, the time has come to the take the fight past our soil and onto our enemies, so that we may end this war once and for all!"

  SIA_the_question_of_combined_arms_warfare_r56: "The Question of Combined-Arms Warfare"
  SIA_the_question_of_combined_arms_warfare_r56_desc: "The Great War has brought many tremendous weapons of warfare to the modern battlefield, most of all mechanized vehicles. We need to devise a plan to incorporate these vital creations to our devoted soldiers."

  SIA_procure_auxiliary_tanks_r56: "Procure Auxiliary Tanks"
  SIA_procure_auxiliary_tanks_r56_desc: "Tanks are expensive, and fully mechanized divisions just aren't practically to our circumstances. But this isn't to diminish the benefits of modern armor, as many of our top engineers hold daring plans to design auxiliary tanks to support our infantry and thrive in our unique environment."

  SIA_begin_domestic_vehicle_production_r56: "Begin Domestic Vehicle Production"
  SIA_begin_domestic_vehicle_production_r56_desc: "In order to produce modern vehicles, we need the industry and laborers needed for their manufacturing. We must put funds toward making this happen."

  SIA_the_legacy_of_clausewitz_r56: "The Legacy of Clausewitz"
  SIA_the_legacy_of_clausewitz_r56_desc: "While they are highly expensive, we cannot neglect what is undoubtedly the future of warfare. Fully mechanized offensives will be an important part of the wars to come, and we shall be among the first to implement them!"

  SIA_prepare_defensive_infrastructure_r56: "Prepare Defensive Infrastructure"
  SIA_prepare_defensive_infrastructure_r56_desc: "If we are to hold out in a defense against a militarily superior foe, we must leverage the best of our terrain and men in a desperate battle to hold out. Modern defensive infrastructure would help achieve just this."

  SIA_masters_of_our_terrain_r56: "Masters of Our Terrain"
  SIA_masters_of_our_terrain_r56_desc: "The [SIA.GetAdjective] armed forces has countless centuries of experience fighting in a terrain that few share an expertise in. This fact must be shown for all to see: from our training, clothing and specialized vehicles, we will forever dominate our rightful lands!"
  SIA_masters_of_our_terrain_r56_tt: "§Y1x§! §G75%§! Research bonus for: §YAmphibious Tractor and Amphibious Armor Technologies§!."
  SIA_masters_of_our_terrain_r56_tt_2: "§Y2x§! §G75%§! Research bonus for: §YCamouflage Pattern, Summer Clothing and Jungle Infantry Technologies§!."

  SIA_incorporate_combat_engineers_r56: "Incorporate Combat Engineers"
  SIA_incorporate_combat_engineers_r56_desc: "Our terrain poses great difficulties for any force. Combat engineer regiments that can accompany our infantry and vehicles could help us work around any difficulties they encounter on the front."

  SIA_modern_troop_support_systems_r56: "Modern Troop Support Systems"
  SIA_modern_troop_support_systems_r56_desc: "The last century has seen notable innovation on many fronts and we cannot afford to fall behind. Proper troop support as well as radios should be incorporated across our armed forces as soon as possible."

  SIA_improve_national_logistics_r56: "Improve National Logistics"
  SIA_improve_national_logistics_r56_desc: "Our logistical equipment need to reflect the circumstances of a war that is both, on and off [SIA.GetAdjective] soil, and it must also reflect our new status as a modern military."

  SIA_order_pack_bicycles_r56: "Order Pack-Bicycles"
  SIA_order_pack_bicycles_r56_desc: "[JAP.GetNameDefCap] has to some extent implemented bicycle battalions into their armed forces. Compared to other forms of cavalry, these are much better suited to our status as a relatively poor nation with ill-suitable terrain for modern vehicles."

  SIA_acquire_modern_equipment_r56: "Acquire Modern Equipment"
  SIA_acquire_modern_equipment_r56_desc: "Devotion and experience are not enough for our nation to survive the challenges of our cruel world. We must implement an armament modernization program so that we are an exceptionally equipped force."

  SIA_shift_to_national_designs_r56: "Shift to National Designs"
  SIA_shift_to_national_designs_r56_desc: "Everyone knows the weaknesses that come with dependence on foreign powers. The time has come for us to end our dependence on nation's other than our own."

  SIA_expand_bangkok_arsenal_r56: "Expand Bangkok Arsenal"
  SIA_expand_bangkok_arsenal_r56_desc: "While our central industry is still small, our capacity to produce military equipment has improved. We should further these developments if we are to become militarily self-sufficient."

  SIA_continue_importing_foreign_equipment_r56: "Continue Importing Foreign Equipment"
  SIA_continue_importing_foreign_equipment_r56_desc: "Our dependence on foreign equipment is a strength, not a weakness. Our nation surely could never handle research and development for all of our needs, at least for now; thus the importing of foreign equipment must continue."

  SIA_cooperation_on_military_projects_r56: "Cooperation on Military Projects"
  SIA_cooperation_on_military_projects_r56_desc: "Our major military partners are ahead of us in more ways than we could imagine. We should move to incorporate their latest advancements so that we remain a modern, powerful force in the region."

  SIA_asias_innovation_powerhouse_r56: "Asia's Innovation Powerhouse"
  SIA_asias_innovation_powerhouse_r56_desc: "In the spirit of technological autarky, we must become a center for military research in the region. Many investments will be needed to make this happen. If it's for the nation, surely we can find the resources and will for it."

  SIA_look_to_new_fields_of_engineering_r56: "Look to New Fields of Engineering"
  SIA_look_to_new_fields_of_engineering_r56_desc: "Just as the Great War gave us incredible machines of land, air and sea, the conflicts upon us will bring more of their own to the forefront. We should invest in a division of our research and development sectors dedicated to discovering, refining and finding use for new technologies."

  # AMEND THE MILITARY SERVICE ACT
  SIA_amend_the_military_service_act_r56: "Amend the Military Service Act"
  SIA_amend_the_military_service_act_r56_desc: "The bureaucracy making up our conscription system is out of date compared to the regions powers. In the spirit of meritocracy and equal law, we should amend the Military Service Act to better filter candidates who should not qualify for service, while also limiting conscription exemptions to only the most necessary of cases."

  SIA_specialized_breakthrough_divisions_r56: "Specialized Breakthrough Divisions"
  SIA_specialized_breakthrough_divisions_r56_desc: "No matter how long we spend defending, it alone has never won a war. We are surrounded by hostile terrain and major population centers, thus military units designed for circumventing these obstacles must be formed."

  SIA_standardize_troop_recruitment_r56: "Standardize Troop Recruitment"
  SIA_standardize_troop_recruitment_r56_desc: "Although our reforms to the Military Service Act have shown good results, further standardization of the conscription system would allow us to train and instill discipline in an increasingly large section of society."

  SIA_construct_offensive_infrastructure_r56: "Construct Offensive Infrastructure"
  SIA_construct_offensive_infrastructure_r56_desc: "[ROOT.GetNameDefCap] is positioned in a strategic position to wage offensive wars, and be caught in defensive wars from any direction. We should prepare the infrastructure needed to advance past our borders, so that any conflict involving our nation stays off our lands."
  SIA_offensive_infrastructure_investments_r56: "Offensive Infrastructure Investments"
  SIA_offensive_infrastructure_investments_r56_desc: "[ROOT.GetNameDefCap] is positioned in a strategic position to wage offensive wars, and be caught in defensive wars from any direction. We should prepare the infrastructure needed to advance past our borders, so that any conflict involving our nation stays off our lands."

  SIA_prepare_calculated_offensives_r56: "Prepare Calculated Offensives"
  SIA_prepare_calculated_offensives_r56_desc: "We are outnumbered, out supplied and out experienced by our enemies, but this is no reason to lose hope for positive outcomes in any conflict. Drawing up proper plans for retreat and breakthroughs against potential enemies will prove indispensable at using the resources we have to its best."
  SIA_prepare_calculated_offensives_r56_tt: "Unlocks §YForging Offensive Battleplans§! Decisions, which unlock §Gtemporary bonuses§! in combat against neighboring countries."
  SIA_forging_offensive_battleplans_r56: "Forging Offensive Battleplans"
  SIA_forging_offensive_battleplans_r56_desc: "We are outnumbered, out supplied and out experienced by our enemies, but this is no reason to lose hope for positive outcomes in any conflict. Drawing up proper plans for retreat and breakthroughs against potential enemies will prove indispensable at using the resources we have to its best."
  SIA_wage_victory_against_paris_r56: "Wage Victory Against Paris" 
  SIA_wage_victory_against_paris_r56_desc: "The French, who have caused us so many problems throughout the last century, are finally in a place where we can bring them to their knees. Just one step forward and they shall be crushed from the region for good!"
  SIA_push_against_the_chinese_r56: "Push Against the Chinese"
  SIA_push_against_the_chinese_r56_desc: "The Chinese, who once held sole dominion over our home region, are once again enemies of the nation. We shall end their advances and take the fight to their land!"
  SIA_crush_the_indian_front_r56: "Crush the Indian Front"
  SIA_crush_the_indian_front_r56_desc: "The divided Indian lands to our west hold some the strongest military forces in the region and the time has come to decimate their army."
  SIA_break_malayan_defenses_r56: "Break Malayan Defenses"
  SIA_break_malayan_defenses_r56_desc: "The Malayan's are home to some of the region's most important resources. Divided as they are, we can crush them in no time!"
  SIA_shatter_japans_invincibility_r56: "Shatter Japan's 'Invincibility'"
  SIA_shatter_japans_invincibility_r56_desc: "Japan has seen a spree of decisive victories over the last several decades. There are no invincible armies and there never have been; we shall show this fact to the world if nobody else will!"

  SIA_expand_the_reserve_force_r56: "Expand the Reserve Force"
  SIA_expand_the_reserve_force_r56_desc: "With so many potential enemies across our many borders, possibly even at once, we must work to expand the pool of soldiers ready to come to our defense."

  SIA_sharpen_training_standards_r56: "Sharpen Training Standards"
  SIA_sharpen_training_standards_r56_desc: "With nations leveraging every advantage at our disposal, we must further improve our methods of training so that our soldiers are to be feared on the modern battlefield."
  SIA_professional_army_r56: "Professional Army"
  SIA_professional_army_r56_desc: "With nations leveraging every advantage at our disposal, we must further improve our methods of training so that our soldiers are to be feared on the modern battlefield."

  #DEPT INDEPENDENT STATE COMMERCE
  SIA_dept_independent_state_commerce_r56: "Dept. Independent State Commerce"
  SIA_dept_independent_state_commerce_r56_desc: "We have made little progress in industrial development and it is clearly to our disadvantage. We should set up a department to investigate on how best to industrialize our wide, underdeveloped nation."
  unlocks_decision_privatize_national_assets_which_grants_tt: "Unlocks Decision: §YPrivatize National Assets§!, which grants:"
  SIA_privatize_national_assets_r56: "Privatize National Assets"
  SIA_privatize_national_assets_r56_desc: "Dumping government assets of various forms onto the open market would be a quick way to source revenue for our government, while also getting it flowing throughout our economy."

  SIA_issue_economic_mobilization_r56: "Issue Economic Mobilization"
  SIA_issue_economic_mobilization_r56_desc: "The time has come: the threats to our national security have become too much to ignore. Our economy, and society as a whole must be ready for the bloodshed that will soon come."
  SIA_issue_economic_mobilization_r56_tt: "Completes Focus §YIssue Economic Mobilization§!, which grants:"
  SIA_issue_economic_mobilization_r56_timer_tt: "Has completed Focus: §YIssue Economic Mobilization§! less than 365 days ago\nCurrent days are: [?SIA_issue_economic_mobilization_r56_timer_flag:days|Y0]"

  SIA_protect_vital_production_r56: "Protect Vital Production"
  SIA_protect_vital_production_r56_desc: "We are a hub for many resources critical to a war effort. We should do what we can to expand their production and prepare for the worst case scenario where they fall out of our hands."
  SIA_strategic_resource_policies_r56: "Strategic Resource Policies"
  SIA_strategic_resource_policies_r56_desc: "We are a hub for many resources critical to a war effort. We should do what we can to expand their production and prepare for the worst case scenario where they fall out of our hands."

  SIA_expand_military_research_r56: "Expand Military Research"
  SIA_expand_military_research_r56_desc: "It is imperative that we stay ahead of our enemies on a technological level. Failure to do so means failure to protect the nation and it's soldiers against the conflicts that rage across Asia."

  SIA_scale_up_naval_production_r56: "Scale Up Naval Production"
  SIA_scale_up_naval_production_r56_desc: "[ROOT.GetNameDefCap] is a nation on two seas and we cannot be a power one either of them without a naval force to enforce it. Industrial funds must be put into forging a strong naval industry!"
  SIA_scaling_up_naval_production_r56: "Scaling Up Naval Production"
  SIA_scaling_up_naval_production_r56_desc: "[ROOT.GetNameDefCap] is a nation on two seas and we cannot be a power one either of them without a naval force to enforce it. Industrial funds must be put into forging a strong naval industry!"

  SIA_bolster_aerial_production_r56: "Bolster Aerial Production"
  SIA_bolster_aerial_production_r56_desc: "Aircraft are the future of warfare and the time has come to throw what cards we have into it. With our defensive-suited terrain and the power of modern aircraft on side, who could pose a true threat to our independence?"

  SIA_expand_the_ground_armaments_industry_r56: "Expand the Ground Armaments Industry"
  SIA_expand_the_ground_armaments_industry_r56_desc: "The most critical of our military funds have to go to the betterment of our soldiers on the ground, who serve with distinction as the backbone of our army. Any other section of our armed forces can surely wait for these needs to be fulfilled."
  SIA_expanding_the_ground_armaments_industry_r56: "Expanding the Ground Armaments Industry"
  SIA_expanding_the_ground_armaments_industry_r56_desc: "The most critical of our military funds have to go to the betterment of our soldiers on the ground, who serve with distinction as the backbone of our army. Any other section of our armed forces can surely wait for these needs to be fulfilled."

  SIA_process_northern_agricultural_exports_r56: "Process Northern Agricultural Exports"
  SIA_process_northern_agricultural_exports_r56_desc: "To this day, the nations economy is still vitally dependent on agricultural resources, and early industrial efforts should reflect this. Before we move on to heavy industries or consumption, we should begin by setting up factories to make economic value off the large agricultural output we make."

  SIA_bangkok_centered_industrial_development_r56: "Bangkok-Centered Industrial Development"
  SIA_bangkok_centered_industrial_development_r56_desc: "Bangkok is the heartland of our nation, being on our important river networks, having vital infrastructure in place and being near the sea for commercial export. We should focus our limited resources on further investments in this vital area so that we can bring southeast Asia its first city on the economic level of the west."

  SIA_support_bangkoks_ongoing_urbanization_r56: "Support Bangkok's Ongoing Urbanization"
  SIA_support_bangkoks_ongoing_urbanization_r56_desc: "While it has been slow so far, further funding toward the Bangkok area's industrialization would be the fastest current way to increase our economic output."

  SIA_mechanize_the_agrarian_provinces_r56: "Mechanize the Agrarian Provinces"
  SIA_mechanize_the_agrarian_provinces_r56_desc: "Bangkok's primacy in development is a hinderance to the nation and its people, and we should put an end to it immediately. While introducing industrialization to the countryside would bring some level of unrest, slowly introducing mechanized tools would be a start to improving our economic efficiency."

  SIA_support_new_industrial_centers_r56: "Support New Industrial Centers"
  SIA_support_new_industrial_centers_r56_desc: "Our surge in investments towards the countryside is paying off. The time has come to further this funding and form true modern industrial centers across the nation."

  SIA_begin_the_national_industrial_plan_r56: "Begin the National Industrial Plan"
  SIA_begin_the_national_industrial_plan_r56_desc: "Despite our efforts, our industrialization is going too slowly. With the help of our most talented advisors, the time has come to formulate a mass-industrialization plan that will keep our economy afloat and stable, while promoting growth on a massive scale."
  upgrade_department_of_independent_state_commerce_r56_tt: "Upgrades §YIndustrial Concern§!: §YDepartment of Independent State Commerce§! to:"

  SIA_fulfill_domestic_consumption_r56: "Fulfill Domestic Consumption"
  SIA_fulfill_domestic_consumption_r56_desc: "An era of rapid growth is upon us and with it, living standards are on the rise. We should ensure our economy is capable of providing our population some of the amenities we would otherwise be stuck expensively importing from an ocean away."

  SIA_support_a_tech_industry_boom_r56: "Support a Tech-Industry Boom"
  SIA_support_a_tech_industry_boom_r56_desc: "Growth and peace shall transform our economy. The nation that was an industrial backwater yesterday will soon be a nation of the future. With a large, ever-growing population, we will invest in the education and industry we need to be an economic powerhouse in southeast-Asia."

  SIA_link_isan_with_the_strategic_regions_r56: "Link Isan With the Strategic Regions"
  SIA_link_isan_with_the_strategic_regions_r56_desc: "Our geography and related dependence on the south-flowing Chao Phraya makes the development of the northeast the most difficult out of all of our regions. While we can't control nature, building modern infrastructure connecting Bangkok and the northeastern provinces is an important start."

  SIA_irrigate_the_countryside_r56: "Irrigate the Countryside"
  SIA_irrigate_the_countryside_r56_desc: "Well-planned and executed irrigation provinces could vastly increase living and commercial space while bolstering agricultural output massively. We should further existing projects to transform our undeveloped regions."

  SIA_begin_laoss_industrialization_r56: "Begin Laos's Industrialization"
  SIA_begin_laoss_industrialization_r56_desc: "The Laotian lands on the eastern bank of the Mekong are almost entirely devoid of development. But by connecting it with recent lines to Isan and by putting investment towards early manufacturing, surely this can change quickly!"

  SIA_widen_the_central_industrial_region_r56: "Widen the Central Industrial Region"
  SIA_widen_the_central_industrial_region_r56_desc: "The existing light manufacturing in our central region has made us one of the fastest growing economies in the world. We should continue policies promoting this type of industry, until we are a stable, industrialized, prosperous nation."

  SIA_experiment_with_heavy_industries_r56: "Experiment With Heavy Industries"
  SIA_experiment_with_heavy_industries_r56_desc: "An abundance of heavy industry means a surplus of the machinery and resources we need to forge modern vehicles, create cheap housing on a massive scale and build modern infrastructure. The central region would be an excellent place to experiment with this."

  SIA_dam_the_chao_phraya_river_r56: "Dam the Chao-Phraya River"
  SIA_dam_the_chao_phraya_river_r56_desc: "Hydroelectric projects on our vital waterways is nothing less than critical to our independence and development. Starting a project along our largest river will be a trial for future dams across the nation!"

  #NATIONAL ROAD DEVELOPMENT PLAN
  SIA_national_road_development_plan_r56: "National Road Development Plan"
  SIA_national_road_development_plan_r56_desc: "Perhaps the greatest roadblock to our development is the primacy of Bangkok and our other southern ports. While our major rivers flow southwards, much of our population is north and east, where the cost of transportation is expensive. We should make efforts to connect Bangkok to all population centers of our country, a proper road network would be an excellent start."

  SIA_bolster_strategic_resources_r56: "Bolster Strategic Resources"
  SIA_bolster_strategic_resources_r56_desc: "Despite our large agricultural dependence, our lands also hold many natural resources. With a bit of investment, we can use this output to fund further industrial endeavors."

  SIA_continue_the_national_electrification_r56: "Continue the National Electrification"
  SIA_continue_the_national_electrification_r56_desc: "Completing the nation's power-grid is an important part of making economic growth possible across the country. Investment in this area is needed, whatever it takes."

  SIA_rural_schooling_programs_r56: "Rural Schooling Programs"
  SIA_rural_schooling_programs_r56_desc: "While we are rapidly modernizing on this front, [SIA.GetAdjective] illiteracy remains a problem for our state, primarily but not only among the countryside. An educated nation is one who will not falter despite the threats in our modern world!"

  SIA_amend_the_thesaban_organization_act_r56: "Amend the Thesaban Organization Act"
  SIA_amend_the_thesaban_organization_act_r56_desc: "The nation needs a modern administration with a clearly laid out system of governance. We should amend the aging Thesaban Organization Act into a system that clearly lays out the responsibilities of local administrations and what the central government's place in it will be."
  SIA_administrative_reforms_r56: "Administrative Reforms"
  SIA_administrative_reforms_r56_desc: "The nation needs a modern administration with a clearly laid out system of governance and we are on our way to bringing it. The Thesaban Organization Act shall be transformed into a system that clearly lays out the responsibilities of local administrations and what the central government's place in it will be."

  SIA_exploit_freshwater_gains_r56: "Exploit Freshwater Gains"
  SIA_exploit_freshwater_gains_r56_desc: "The lakes and rivers in our occupied territories are a major boon to our economy and security. We should make efforts to exploit these gains."
  SIA_luang_prabang_shanland_batambang_and_cambodia_will_each_gain_1_building_slot_if_they_are_controlled_by_us_or_a_subject_r56: "§Y[926.GetName]§!, §Y[1018.GetName]§!, §Y[925.GetName]§! and §Y[741.GetName]§! will each gain §G1§! Building Slot if they are controlled by us or a subject."
  if_we_control_luang_prabang_or_shanland_tt: "If we control §Y[926.GetName]§! or §Y[1018.GetName]§!:"
  if_we_control_batambang_or_cambodia_tt: "If we control §Y[925.GetName]§! or §Y[741.GetName]§!:"
  SIA_expand_control_over_the_mekong_r56: "Expand Control Over the Mekong"
  SIA_expand_control_over_the_mekong_r56_desc: "The Mekong river, while also an important natural defense to our east, is also key to our agricultural output in the northern and northeast. With control over more of the region than ever, we should expand our control over it and ensure that we may economically benefit."
  SIA_exploit_the_tonle_sap_r56: "Exploit the Tonlé Sap"
  SIA_exploit_the_tonle_sap_r56_desc: "The Tonlé Sap freshwater lake is the largest of its kind in Asia. We should ensure this great boon to our agriculture and industry can play its part in our economy."
  SIA_exploiting_the_mekong_r56: "Exploiting the Mekong"
  SIA_exploiting_the_mekong_r56_desc: "The Mekong river, while also an important natural defense to our east, is also key to our agricultural output in the northern and northeast. With control over more of the region than ever, we should expand our control over it and ensure that we may economically benefit."
  SIA_exploiting_the_tonle_sap_r56: "Exploiting the Tonlé Sap"
  SIA_exploiting_the_tonle_sap_r56_desc: "The Tonlé Sap freshwater lake is the largest of its kind in Asia. We should ensure this great boon to our agriculture and industry can play its part in our economy."

  SIA_expand_land_clearing_projects_r56: "Expand Land-Clearing Projects"
  SIA_expand_land_clearing_projects_r56_desc: "Our inland forests, which are often riddled with malaria, are a burden on both, our population and industrialization. We should move to clear them as soon as possible for the good of the nation."

  SIA_separate_the_ministry_of_public_health_r56: "Separate the Ministry of Public Health"
  SIA_separate_the_ministry_of_public_health_r56_desc: "With a growing population comes growing needs and one of those needs is a proper ministry of public health, separate from other areas of our administration."

  # DIPLOMACY FOCUS'S
  SIA_negotiation_with_the_old_powers_r56: "Negotiation With the Old Powers"
  SIA_negotiation_with_the_old_powers_r56_desc: "The old powers, despite seeing victory and expansion in the Great War, have become overstretched in their vast colonial empires. With our lands finally out of their reach, perhaps now is the time to utilize international diplomacy with these nations to safeguard [SIA.GetAdjective] national interests, and possibly see a reclaimant of what we call our rightful lands!"
  SIA_towards_equality_with_the_west_r56: "Towards Equality With the West"
  SIA_towards_equality_with_the_west_r56_desc: "The nation's foreign ministry is moving rapidly to cut down unequal treaties bestowed on us. We must continue emphasizing that we are an independent, equal player in the region."

  SIA_look_to_the_waking_giant_r56: "Look to the Waking Giant"
  SIA_look_to_the_waking_giant_r56_desc: "[USA.GetNameDefCap] is returning to global prominence, and we believe they are here to stay. As many global empires fall into decline, the [USA.GetAdjective] only seem to grow in economic and international power by the day. We should add [USA.GetNameDef] to the list of nations we are in active diplomacy with."
  SIA_ally_the_united_states_of_america_r56: "Ally [USA.GetNameDef]"
  SIA_ally_the_united_states_of_america_r56_desc: "The [USA.GetAdjective]'s are here to stay as a global power and we must become a partner of theirs for the betterment of our defense and development."
  unlocks_decision_invite_american_economic_advisors_which_grants_tt: "Unlocks Decision: §YInvite American Economic Advisors§!, which grants:"
  for_84_days_factory_output_6_dockyard_output_6_tt: "§YFor 84 days:§!\nFactory Output: §G+6.00%§!\nDockyard Output: §G+6.00%§!"
  SIA_invite_american_economic_advisors_r56: "Invite [USA.GetAdjective] Economic Advisors"
  SIA_invite_american_economic_advisors_r56_desc: "With [USA.GetAdjective] contacts secured, we have an opportunity to leverage their influence to formulate an economic plan that better suits our needs. We should see what they have to offer us."

  SIA_expand_british_cooperation_r56: "Expand [ENG.GetAdjective] Cooperation"
  SIA_expand_british_cooperation_r56_desc: "The [ENG.GetAdjective] have been the most influential western power in our country this last century, and their role in the world will be defined by the events of the present. We [SIA.GetAdjective] will look to how these developments can meet our mutual interests!"
  SIA_restore_the_anglo_siamese_alliance_r56: "Restore the Anglo-[SIA.GetAdjective] Alliance"
  SIA_restore_the_anglo_siamese_alliance_r56_desc: "The [ENG.GetAdjective] are a key player in the region and have been reliable partners of ours in the past. We should seek to strengthen ties with them once more!"
  SIA_request_british_protection_r56: "Request [ENG.GetAdjective] Protection"
  SIA_request_british_protection_r56_desc: "The [ENG.GetAdjective] are a key player in the region; with regional tensions on the rise and the shared understanding that the fall of our nation means vulnerability for their colonies, surely they would be willing to guarantee our independence."
  siam_r56.16.title: "[FROM.GetNameDefCap] Requests our Protection"
  siam_r56.16.desc: "The [FROM.GetAdjective] foreign ambassador has recently approached our own, officially requesting protection, pointing out the joint threat of [JAP.GetNameDef] to our securities."\n\nWith [FROM.GetNameDef] in our historic sphere, what are we to say to their request?"
  siam_r56.17.title: "[FROM.GetNameDefCap] Commits to our Security"
  siam_r56.17.desc: "[FROM.GetNameDefCap] foreign ambassador has reported to our own that they are willing to protect our "strategic independence" were a war to be waged against us. This is without doubt an important victory for our national security."
  siam_r56.18.desc: "[FROM.GetNameDefCap] foreign ambassador has reported to our own that they are unwilling to protect our "strategic independence" were a war to be waged against us. It seems we will be without [FROM.GetNameDef]'s protection in the event of war."
  SIA_request_revision_of_the_northwestern_border_r56: "Request Revision of the Northwestern Border"
  SIA_request_revision_of_the_northwestern_border_r56_desc: "The northwest border between [SIA.GetNameDef] and historic British India are an unjust boundary that separates our people and natural defenses. Gaining a foothold on the Salween river, and the incorporation of our kin into our state would surely be a just arrangement."

  SIA_peace_with_the_western_order_r56: "Peace With the Western Order"
  SIA_peace_with_the_western_order_r56_desc: "The nations of the west have achieved supremacy in the pacific, just as they had once already. [SIA.GetNameDefCap], with our flexible diplomatic policies and renewed strength, is ready to become an equal of the west in this new, familiar world order."
  SIA_influx_in_foreign_investment_r56: "Influx in Foreign Investment"
  SIA_influx_in_foreign_investment_r56_desc: "We are entering a transition to open our economy once more and its effects will surely pay off. We shall come out of this restructuring a tougher, growing economic power in the region."

  SIA_address_the_eastern_border_r56: "Address the Eastern Border"
  SIA_address_the_eastern_border_r56_desc: "The [FRA.GetAdjective], for all of the trouble they've caused us, are at their most vulnerable point in the last century. If we are to pry away at, or completely eliminate their Indochinese possession, a better time will never come than now!"
  SIA_address_the_eastern_border_r56_tt: "Diplomatic requests for larger territorial transfers will be §Rless likely§! to succeed!"
  SIA_r56.6.title: "The Extent of Our Claims"
  siam_r56.6.desc: "With the French at their weakest point in a century and with us at our all-time high, the time has come to look upon our many lost territories.\n\nClearly, our diplomats would have a stronger chance at securing more modest claims, but with our national resolve growing by the day, many seek to see us lead Asia's second-ever major victory against a European power.\n\nThe choice is ultimately ours, where should the extent of our claims be?"
  siam_r56.6.a: "Regaining only the recently lost lands would surely be realistic."
  siam_r56.6.a_tt: "Future negotiations will only involve §Y[926.GetName]§!, §Y[924.GetName]§! and §Y[925.GetName]§!." 
  siam_r56.6.b: "We would hold no honor leaving our Lao brothers behind."
  siam_r56.6.b_tt: "Future negotiations will involve §Y[925.GetName]§! and all §Y[LAO.GetAdjective]§! starting cores."
  SIA_claims_on_laos_r56: "Claims on Laos"
  siam_r56.6.c: "All foreigners must leave our historic suzerainty!"
  siam_r56.6.c_tt: "Future negotiations will involve all §Y[LAO.GetAdjective]§! and §Y[CAM.GetAdjective]§! starting cores."
  SIA_claims_on_laos_and_cambodia_r56: "Claims on Laos and Cambodia"
  SIA_is_claiming_small_border_states_only_scriptloc_r56: "The [SIA.GetAdjective] request involves us withdrawing from the recently taken provinces of [926.GetName], [924.GetName] and [925.GetName]."
  SIA_is_claiming_small_border_states_and_laos_scriptloc_r56: "The [SIA.GetAdjective] request involves us withdrawing from all of Laos, while also retreating from the recently seized [925.GetName]."
  SIA_is_claiming_all_of_laos_and_cambodia_scriptloc_r56: "The [SIA.GetAdjective] request involves us withdrawing from all of Laos and Cambodia, returning to [SIA.GetNameDef] all Indochinese territories historically under the Siamese monarchy."
  SIA_demand_the_western_bank_of_the_mekong_r56: "Demand the Western Bank of the Mekong"
  SIA_demand_protector_status_over_laos_r56: "Demand 'Protector' Status Over Laos"
  SIA_demand_protector_status_over_laos_r56_desc: "Prior to it's colonization by Paris, most of Laos was under our subjugation, serving as a natural buffer state while improving our influence in the region. With it 'independent' we must demand they return to our banner."
  SIA_demand_batambang_r56: "Demand [925.GetName]"
  SIA_demand_batambang_r56_desc: "[925.GetName], despite so obviously belonging to us, has been torn from our hands while we were vulnerable. With the time being right, we shall strike back and demand the return of this vital land!"
  SIA_demand_protector_status_over_cambodia_r56: "Demand 'Protector' Status Over Cambodia"
  SIA_demand_protector_status_over_cambodia_r56_desc: "Prior to it's colonization by Paris, most of Cambodia was under our subjugation, serving as a natural buffer state while improving our influence in the region. With it 'independent' we must demand they return to our banner."
  SIA_request_revision_of_the_eastern_border_r56: "Request Revision of the Eastern Border"
  SIA_request_revision_of_the_eastern_border_r56_desc: "The time has come to bring the provinces to our east under their rightful control once again. With the strength and will mustered, we must decide what compromises we will make if any, and move forward."
  SIA_request_revision_of_the_eastern_border_vichy_r56_desc: "Although our requests were previous declined, France is now at its weakest point. The time is now to act on our rightful claim!"
  SIA_r56.7.title: "[FROM.GetNameDefCap] Demands our Subjugation"
  siam_r56.7.desc: "Following worrying trends of diplomats from [FROM.GetNameDef] increasingly withdrawing from our nation, the [FROM.GetAdjective] foreign ambassador has officially delivered to our own a 10-day ultimatum to "militarily and politically submit" to their control. Is a second round in the name of our independence worth fighting?"
  siam_r56.7.a: "We have no choice but to comply."
  siam_r56.7.b: "We will never again belong to a foreign power!"
  SIA_r56.13.title: "[FROM.GetNameDefCap] has Refused our Demands!"
  SIA_r56.13.desc: "Diplomats representing [FROM.GetName] have refused our righteous demands for suzerainty over their lands. We shall use our strength to crush these fools for this!"
  siam_r56.13.a: "They know the cost of refusal."
  siam_r56.13.b: "Then we will bide our time."
  SIA_r56.14.title: "[FROM.GetNameDefCap] has Accepted our Demands"
  siam_r56.14.desc: "In a wave of excellent news, diplomats representing [FROM.GetName] have officially agreed to 'limited union' between us and our claimed lands. Our control over them has just begun!"
  siam_r56.14.a: "Excellent news."
  SIA_r56.15.title: "Dealing for the Eastern Territories"
  siam_r56.15.desc: "With our claims in historic French Indochina established, the time has come to choose what we may offer in exchange for regional peace, and the return of our rightful lands. What should we negotiate for?"
  siam_r56.15.a: "We can offer a non-aggression pact as a token of good will."
  SIA_offered_non_aggression_pact_scriptloc_r56: "In exchange for these lands, [FROM.GetNameDef] is offering a non-aggression pact, and an agreement to avoid "further hostilites" in the region."
  siam_r56.15.b: "We can sweeten the deal with minor economic concessions."
  siam_r56.15.b_tt: "If they accept, we will provide resource rights to [289.GetName] and all states transferred to us."
  SIA_offered_minor_economic_concessions_scriptloc_r56: "In exchange for these lands, [FROM.GetNameDef] is offering a non-aggression pact, as well as a non-aggression pact, while also stating their desire to avoid "further hostilites" in the region."
  siam_r56.15.c: "They need all of the help they can get in their war effort; we can offer it."
  SIA_offered_alliance_scriptloc_r56: "In exchange for these lands, [FROM.GetNameDef] is offering their membership in our alliance."
  if_they_accept_we_will_be_called_into_their_wars_and_if_possible_join_their_faction_in_exchange_for_our_claimed_territories_r56_tt: "If they accept, §Ywe will be called into their wars§! and, if possible, §Gjoin their faction§!, in exchange for our claimed territories."
  SIA_r56.8.title: "[SIA.GetNameDefCap] Requests Revision of our Borders"
  SIA_r56.8.desc: "Today, an envoy from [FROM.GetNameDef] has arrived in our nation, requesting control over provinces we hold that lie on the western bank of the Mekong river. While these provinces would be difficult to hold in a war, can we give in to [SIA.GetAdjective] demands?"
  siam_r56.8.a: "Reasonable enough, we can agree to this."
  siam_r56.8.b: "Outrageous, they will not exploit us in our time of weakness!"
  siam_r56.19.title: "[SIA.GetNameDefCap] Requests Revision of our Common Border"
  siam_r56.19.desc: "Today, a diplomatic envoy has reached us from [SIA.GetNameDef], seeking to "reverse the unjust borders" instilled during their days as a weaker, absolute monarchy. [GetSiamLandsDemanded_r56]\n\n[GetSiamDeal_r56]\n\nWhat do we make of this [SIA.GetAdjective] offer for what is so clearly our rightful land?"
  siam_r56.19_tt: "In exchange for these lands, [SIA.GetNameDef] will grant §YResource Rights§! to §Y[289.GetName]§! and any lands transferred from us."
  siam_r56.21.desc: "Today, a diplomatic envoy has reached us from [SIA.GetNameDef], seeking to "reverse the unjust borders" instilled during their days as a weaker, absolute monarchy. Specifically, the [SIA.GetAdjective] are requesting control over the state of [1018.GetName] in exchange for a pact of non-aggression.\n\nWhat do we make of this [SIA.GetAdjective] offer for what is so clearly our rightful land?"
  due_to_its_far_proximity_from_mainland_france_this_action_will_bypass_any_guarantees_that_they_have_tt: "Due to it's §Ydistance§! from mainland §YFrance§!, this action will §GBypass§! any §YGuarantees§! that they have."
  SIA_r56.29.title: "[FROM.GetNameDefCap] Strikes our Lands in Indochina"
  SIA_r56.29.desc: "Following our refusal of [FROM.GetAdjective] demands to give up what is our righteous land, the warmongers of [SIA.GetNameDef] have launched offensive operations into French Indochina. This threat shall be put down with total force!"

  SIA_avenge_chulaloks_legacy_r56: "Avenge Chulalok's Legacy"
  SIA_avenge_chulaloks_legacy_r56_desc: "We have done what so many call impossible: [SIA.GetNameDef] once more holds total supremacy in southeast-Asia. This feat shall become a point of celebration for years to come and the west will finally treat us as an equal once more!"
  you_or_a_subject_contros_all_starting_laotian_cores_r56_tt: "You or a subject controls all starting §Y[LAO.GetAdjective]§! cores."
  you_or_a_subject_controls_all_starting_cambodian_cores_r56_tt: "You or a subject controls all starting §Y[CAM.GetAdjective]§! cores."
  you_or_a_subject_controls_all_starting_vietnamese_cores_r56_tt: "You or a subject controls all starting §Y[VIN.GetAdjective]§! cores."
  you_or_a_subject_controls_all_starting_burmese_cores_r56_tt: "You or a subject controls all starting §Y[BRM.GetAdjective]§! cores."
  SIA_southeast_asias_regional_power_r56: "Southeast-Asia's Regional Power"
  SIA_southeast_asias_regional_power_r56_desc: "We have done what so many call impossible: [SIA.GetNameDef] once more holds total supremacy in southeast-Asia. This feat shall become a point of celebration for years to come and the west will finally treat us as an equal once more!"

  SIA_the_non_aligned_movement_r56: "The Non-Aligned Movement"
  SIA_the_non_aligned_movement_r56_desc: "With [SIA.GetNameDef] having made itself a respected power in east-Asia once again, it is time that we move to solidify our place as an equal power that is loyal to nobody else. The idea for a non-aligned movement represents this true interest of ours."
  SIA_armed_neutrality_r56: "Armed Neutrality"
  SIA_armed_neutrality_r56_desc: "While we are a growing power in the region, we must still bide our time for what is to come. The world is more unstable ever just as the nation's around us pose greater danger than ever. We will put everything we can towards ensuring our national defenses will stand ready for what is to come."

  SIA_towards_a_new_asian_order_r56: "Towards a New Asian Order"
  SIA_towards_a_new_asian_order_r56_desc: "The last century has not been good to the so-called 'great powers' of the world. We should move past dependency on one power, whether it's the Chinese, British, or any other 'great power' to come. As one of Asia's only free nations, we are in prime position to bring southeast-Asia under our righteous watch!"
  upon_the_completion_of_focus_phahon_steps_down_r56_tt: "Upon the completion of Focus: §YPhahon Steps Down§!:"
  unlocks_decisions_to_join_factions_in_the_region_r56_tt: "Unlocks Decisions to §YJoin Factions§! in the region."

  SIA_recognize_the_soviet_union_r56: "Recognize the Soviet Union"
  SIA_recognize_the_soviet_union_r56_desc: "While we are heavily distant from them, [SOV.GetNameDef] is one of many powers who are looking to further their interests in Asia. We should establish diplomatic relations with them, and see if we can foster mutually-beneficial arrangements."
  SIA_request_old_soviet_weapons_r56: "Request Old [SOV.GetAdjective] Weapons"
  SIA_request_old_soviet_weapons_r56_desc: "The [SOV.GetAdjective]'s have a wide arsenal dating back to their civil war. Surely, they would be willing to fork some of that over in the name of holding a greater influence over our nation."
  unlocks_decision_request_old_soviet_weapons_which_grants_tt: "Unlocks Decision: §YRequest Old Soviet Weapons§!, which grants:"
  for_84_days_daily_communism_support_004_tt: "§YFor 84 days:§!\nDaily Communism Support: §G+0.04§!\n"
  SIA_invite_soviet_heavy_industry_support_r56: "Invite [SOV.GetAdjective] Heavy Industry Support"
  SIA_invite_soviet_heavy_industry_support_r56_desc: "For the many issues it has had, the [SOV.GetAdjective] have achieved perhaps the fastest industrialization campaign on earth. We should see if some of their most talented advisors could aid us in accomplishing the same."
  unlocks_decision_invite_soviet_heavy_industry_support_which_grants_tt: "Unlocks Decision: §YInvite [SOV.GetAdjective] Heavy Industry Support§!, which grants:"
  for_84_days_construction_speed_5_production_efficiency_growth_075_daily_communism_support_006_tt: "§YFor 84 days§!:\nConstruction Speed: §G+5.00%§!\nProduction Efficiency growth: §G+7.50%§!\nDaily Communism Support: §G+0.06§!"
  SIA_seek_membership_in_the_comintern_r56: "Seek Membership in the [SOV.GetFactionName]"
  SIA_seek_membership_in_the_comintern_r56_desc: "The [SOV.GetFactionName] have been a welcome counterbalance against the nations of the west and we want a part in it. We should see if they are willing to welcome our support."

  SIA_anti_imperial_southeast_asia_league_r56: "Anti-Imperial Southeast Asia League"
  SIA_anti_imperial_southeast_asia_league_r56_desc: "With much of our strength in the region restored, the time has come to look toward establishing an anti-colonial Asian order that can avoid us falling under the suzerainty of a fellow Asian nation. We shall show initiative in fostering this development!"
  SIA_southeast_asia_league: "Southeast Asia League"
  unlocks_decisions_to_invite_neighbors_to_our_faction_r56_tt: "Unlocks Decisions to §YInvite Neighbors§! to our faction."

  SIA_leaders_of_a_free_southeast_asia_r56: "Leaders of a Free Southeast-Asia"
  SIA_leaders_of_a_free_southeast_asia_r56_desc: "[SIA.GetNameDefCap] is once more a leading force among the nations of southeast-Asia. Only through standing together, we shall achieve not only survival, but progress amidst the horrors consuming this world!"

  SIA_approach_the_empire_of_japan_r56: "Approach [JAP.GetNameDef]"
  SIA_approach_the_empire_of_japan_r56_desc: "[JAP.GetNameDefCap], despite the wishes of the west, has become the most influential power in east-Asia. While we can never expect them to look to us as equals, surely we can find common ground, or at least use them as one string of many in our webs of diplomatic engagement."
  SIA_ally_the_empire_of_japan_r56: "Ally [JAP.GetNameDef]"
  SIA_r56.10.title: "[FROM.GetNameDefCap] Offers Wartime Support in Exchange for Peace"
  SIA_r56.10.desc: "Today, following our declaration of war on [ROOT.GetNameDef], diplomats from their nation, with the Prime Minister's backing, have officially offered an offensive alliance in exchange for peace.\n\nWhile [FROM.GetNameDef] surely can't hold out on their own in this conflict, most of our armed forces are in agreement that their utility to us is largely as a base to conduct strikes on [ENG.GetAdjective] territories in India and Malaya.\n\nThe decision is ours to make: can [SIA.GetNameDef] become a partner in what's to come?"
  siam_r56.10.b: "You should've picked the right side sooner."
  SIA_r56.11.title: "[FROM.GetNameDefCap] Agrees to our Request"
  SIA_r56.11.desc: "The [FROM.GetAdjective] government has accepted our request for an alliance, meaning we are tied to their war efforts across Asia. May we remain pragmatic amidst the struggles to come."
  siam_r56.11.a: "We are down a far more dangerous path than before..."
  SIA_seek_japanese_support_for_territorial_revision_r56: "Seek [JAP.GetAdjective] Support for Territorial Revision"
  SIA_r56.12.title: "[FROM.GetNameDefCap] Requests Support for Territorial Claims in Indochina"
  SIA_r56.12.desc: "Today, a delegation from the [FROM.GetAdjective] has arrived, requesting support for their territorial claims across lands that the French have once seized from them. Should we respect their territorial ambitions as we work to expand our influence across Asia?"
  siam_r56.12.b: "What have they done to deserve these lands?"
  unlocks_decision_invite_japanese_military_advisors_which_grants_tt: "Unlocks Decision: §YInvite Japanese Military Advisors§!, which grants:"
  for_84_days_army_experience_gain_02_naval_experience_gain_02_air_experience_gain_02_daily_command_power_gain_multiplier_20_land_doctrine_mastery_gain_20_naval_doctrine_mastery_gain_20_air_doctrine_mastery_gain_20_tt: "§YFor 84 days:§!\nArmy Experience Gain: §G+0.2§!\nNaval Experience Gain: §G+0.2§!\nAir Experience Gain: §G+0.2§!\nDaily Command Power Gain Multiplier: §G+20%§!\n§YLand doctrine§! mastery gain: §G+20%§! daily\n§YNaval doctrine§! mastery gain: §G+20%§! daily\n§YAir doctrine§! mastery gain: §G+20%§! daily"
  SIA_invite_japanese_military_advisors_r56: "Invite [JAP.GetAdjective] Military Advisors"
  SIA_invite_japanese_military_advisors_r56_desc: "In the modern era, the [JAP.GetAdjective] holds by far the greatest track record in waging victory on the battlefield. We should see if their advisors can help us in our modernization."

  SIA_navigate_asias_new_order_r56: "Navigate Asia's New Order"
  SIA_navigate_asias_new_order_r56_desc: "At the hands of a 'rising' power, the colonial powers have been kicked out of east-Asia, leaving behind a power vacuum that we must make a part for ourselves in."
  SIA_between_a_rock_and_a_hard_place_r56: "Between a Rock and a Hard Place"
  SIA_between_a_rock_and_a_hard_place_r56_desc: "With the colonial powers largely gone from Asia, a new order is upon us and it is imperative that we are prepared. We shall never fall!"

  # Mend the Fragmented Khana Ratsadon (Early Game Politics)
  SIA_address_rama_viis_abdication_r56: "Address Rama VII's Abdication"
  SIA_address_rama_viis_abdication_r56_desc: "Rama VII's 1935 abdication is still a recent shock that threatens the popular support and stability of the state. With his legitimate heir, Mahidol, still abroad, and the people demanding answers, it is time to address why this happened and how we seek to prevent another disaster from happening."
  siam_r56.2.title: "Addressing the Chakri's Downfall"
  siam_r56.2.desc: "The shock of Rama VII's 1935 abdication brought us many steps back on our march to restore order. With the threat of royalist counterrevolution still present, how should we move forward and address the monarchies role in [SIA.GetAdjective] society?"
  siam_r56.2.a: "The king's abdication was unfortunate; we must reconcile those who cherished his rule."
  siam_r56.2.b: "Prajadhipok was weak, and has demonstrated the weakness in royal control."

  SIA_build_rural_popular_support_r56: "Build Rural Popular Support"
  SIA_build_rural_popular_support_r56_desc: "If the constructional order is to gain acceptance across our society, it will only come through policies that look past Bangkok's urban center and instead to those breaking their backs in fields, with more connection to every part of life than politics. How should we address rural indifference to our revolution?"
  SIA_r56.3.title: "Addressing Rural Grievances"
  siam_r56.3.desc: "Our 1932 revolution's vanguardist nature has led to struggles in finding support among our ever-growing rural class. The rural needs of our nation are complex, as much of the population remains farming-dependent, uneducated and undedicated to modern politics.\n\nBoth, most of the junior military and Pridi's platforms support modest reforms alongside a rapid modernization of the countryside to bring uniformity to all corners of the nation.\n\nMore traditionalist segments of the civilian wing, along with most of the rural populace desires a focus on relieving their economic burden, such as by cutting taxes on certain crops.\n\nWith funds set aside for the job, what should be our primary means in finding rural support?"
  siam_r56.3.a: "We must work hard to modernize every corner of the [SIA.GetAdjective] nation!"
  siam_r56.3.b: "We must respect and listen to the needs of the rural populace."

  SIA_strengthen_business_ties_r56: "Strengthen Business Ties"
  SIA_strengthen_business_ties_r56_desc: "While they are hardly loyal to our interests for the nation, the [SIA.GetAdjective] business class has the potential to aid our industrialization. We should seek their friendship with this interest in mind."

  SIA_stability_centered_policies_r56: "Stability-Centered Policies"
  SIA_stability_centered_policies_r56_desc: "Instability has plagued the nation since the days of 1932, and if we are to hold any popular support, we must defend the nation against any allegations of promoting or tolerating what has come to us."

  SIA_crown_property_bureau_r56: "Crown Property Bureau"
  SIA_crown_property_bureau_r56_desc: "Corruption and excess spending in the royal family has plagued the finances of the state. Setting up a sector of the government to monitor and manage these finances would go a long way in preventing yet another financial disaster."
  unlocks_decision_stabilize_the_baht_which_grants_tt: "Unlocks Decision: §YStabilize the Baht§!, which grants:"
  SIA_stabilize_the_baht_r56: "Stabilize the Baht"
  SIA_stabilize_the_baht_r56_desc: "Due to aggressive fiscal policies, the baht is in a state of overzealous devaluation. We should temporarily slow the level of investment and flow of money into our economy until this calms down."

  SIA_move_to_depoliticize_the_army_r56: "Move to Depoliticize the Army"
  SIA_move_to_depoliticize_the_army_r56_desc: "Phibunsongkhram's plans to promote aggressive nationalism among the army is a dangerous ambition that threatens the balance of our government. [SIA.GetNameDefCap] requires a strong army, but we are not to become an army with a state or a place where military influence controls our nation."
  SIA_siamese_ultranationalist_movement_weakened_r56_desc: "Despite the [SIA.GetAdjective] armed forces holding vast power inside the ruling Khana Ratsadon, little stands in the name of ideological unity. Through the influence of the rising Plaek Phibunsongkhram, ultranationalism in the style of Italy and Japan has gained notable traction throughout the country.\n\nDue to recent moves against him by the prime minister [SIA.GetLeader], Phibunsongkhram has become hostile to the ruling government, as his former role as minister of defense has been passed elsewhere to his detriment."

  SIA_end_the_constitutional_protection_act_r56: "End the Constitutional Protection Act"
  SIA_end_the_constitutional_protection_act_r56_desc: "While the Constitutional Protection Act did restore some much needed stability to [SIA.GetNameDef], it is far too draconian for the nation's good. We should move to repeal it immediately, so that freer voices may question the current order and create something better."

  SIA_limited_worker_protections_r56: "Limited Worker Protections"
  SIA_limited_worker_protections_r56_desc: "While we are still early in our industrialization, poor worker protections are becoming a source of discontent for our modernization. We should make clear to the nation that we have plans to address these shortcomings amid our industrial transformation."

  SIA_improve_national_education_r56: "Improve National Education"
  SIA_improve_national_education_r56_desc: "While we have invested heavily in education since 1932, widespread illiteracy, especially among the countryside, is a plague that threatens our status as an equal in the region. The junior army and civilian wing both have unique proposals on how we can combat this threat, we should hear them out and work towards compromise on a wider plan."
  SIA_nationalist_education_policies_r56: "Nationalist Education Policies"
  SIA_nationalist_education_policies_r56_desc: "With illiteracy still a problem in the nation and with the need for strong defenses clearer than ever, the military, inspired by foreign models, is taking a larger part than ever in the cultivation of disciplined, motivated men who are ready to defend our fatherland at all costs."
  siam_r56.1.title: "A Proposal From the Junior Military"
  siam_r56.1.desc: "Phibunsongkhram and his junior faction of the armed forces have recently made increased pushes for funding towards military ventures dedicated to "educative training in national skills."\n\nWhile our armed forces have become a place for young men across our nation to develop useful skills, surely any funding could instead be directed to national schools."
  siam_r56.1.a: "Modern education will only come through institutional progress."
  siam_r56.1.b: "With the backbone that our army is, such an initiative is necessary."

  SIA_military_led_nation_building_r56: "Military-Led Nation-Building"
  SIA_military_led_nation_building_r56_desc: "Phibunsongkhram is one of our greatest officers, and is the de-facto leader of the Khana Ratsadon's militaristic movement, where he has slowly been moving to centralize, modernize and militarize the state. With threats on the horizon, we should look into his proposals for the nation."
  SIA_utilize_the_engineer_corps_r56: "Utilize the Engineer Corps"
  SIA_utilize_the_engineer_corps_r56_desc: "Much of the [SIA.GetAdjective] countryside remains underdeveloped. Our disciplined engineer corps could perhaps play a role in projects that would modernize these parts of the country."
  unlocks_decision_utilize_the_engineer_corps_which_grants_tt: "Unlocks Decision: §YUtilize the Engineer Corps§!, which grants:\n§YFor 84 days§!:\nDaily Democratic Support: §R-0.02§!\nConstruction Speed: §G+6.00%§!\n\n"

  SIA_strengthen_the_youth_corps_r56: "Strengthen the Youth Corps"
  SIA_strengthen_the_youth_corps_r56_desc: "Many of the modern European states we look to have forged a culture of loyalty and devotion inside their armed forces, particularly by instilling militaristic fervor in the growing minds of their nations through youth programs. Perhaps it is time for [SIA.GetNameDef] to have a youth corps of its own."

  SIA_propagandize_the_six_principles_r56: "Propagandize the Six Principles"
  SIA_propagandize_the_six_principles_r56_desc: "The Khana Ratsadon has a talented division of artists and propagandists. We should use them to build support for whatever movement we deem necessary."
  SIA_r56.4.title: "Propagandizing the National Revolution"
  siam_r56.4.desc: "The reasons that our 1933 revolution was a necessity are still unknown among much of our population. Through our monopoly on state propaganda, what should be the primary avenue of this vital tool?"
  siam_r56.4.a: "We shall restore strength to the nation, and avenge what cost us so dearly."
  siam_r56.4.b: "We seek peace and modernity in this chaotic world order."

  SIA_phahon_steps_down_r56: "Phahon Steps Down"
  SIA_phahon_steps_down_r56_desc: "While we forever thank him for his service to the nation, it is clear that the time has come for a new leader to guide the Khana Ratsadon forward. With the world rapidly moving towards war once more, we must choose carefully who can carry on, and push forward much-needed reforms."
  SIA_phahon_steps_down_r56_tt: "When §YPhahon Steps Down§! via event, this Focus will automatically be completed"
  SIA_traditionalist_opposition_r56: "Traditionalist Opposition"
  SIA_traditionalist_opposition_r56_desc: "The collapse of Phraya Phonphayuhasena in favor of a less moderate Prime Minister is a worry for much of the nation's population. We should work to calm this discontent by whatever means possible."
  SIA_r56.5.title: "Elections in the People's Assembly"
  siam_r56.5.desc: "Following many months of political scandals, corrupt ministers souring the ruling government and rumors of Phahon's failing health, he has agreed to step down in favor of a younger successor.\n\nThe most obvious candidate for the role is Plaek Phibunsongkhram, who has for years built up a network of power throughout the army. Although he is friendly with Phahon, Phibun's policies are far more militant and nationalistic, and he will likely for better or worse increase the nation's role on the world stage.\n\nPridi Banomyong is the most reformist candidate for the Premiership, being one of the main champions of institutional reforms passed in the later years of Phahon's tenure. Under a Pridi Premiership, it is likely he will direct [ROOT.GetNameDef] to internal reform and external internationalism.\n\nFinally, although his willingness to hold the title is questionable and he's not on the best of terms with Phahon, Phraya Songsuradet is the most powerful member of the armed forces outside of Phibunsongkhram, and is the only possible successor on the conservative end of [ROOT.GetAdjective] politics. Being far more reactionary than Phahon makes direct conflict with Pridi and Phibun highly likely.\n\nWhile Phahon's powerbase has largely collapsed in recent months, his opinion does carry weight in the People's Assembly. Who will Phahon support to continue where he left off?"
  SIA_available_option_if_authoritarian_support_is_30_or_higher_tt: "Available Option if §gAuthoritarian§! support is 30% or higher:"
  SIA_available_option_if_democratic_support_is_30_or_higher_tt: "Available Option if §4Democratic§! support is 30% or higher:"
  SIA_available_option_if_fascism_support_is_30_or_higher_tt: "Available Option if §8Fascism§! support is 30% or higher:"
  siam_r56.5.a: "Songsuradet will reconcile our revolution with Siam's peaceful traditions."
  SIA_completes_focus_songsuradets_ascendency_which_grants_tt: "Completes Focus §YSongsuradet's Ascendency§!, which grants:"
  siam_r56.5.b: "Pridi will continue Siam's institutional modernization, until we are one with the west!"
  SIA_completes_focus_pridis_premiership_which_grants_tt: "Completes Focus §YPridi's Premiership§!, which grants:"
  siam_r56.5.c: "Phibunsongkhram will restore the honor of the [SIA.GetAdjective] nation!"
  SIA_completes_focus_phibuns_takeover_which_grants_tt: "Completes Focus §YPhibun's Takeover§!, which grants:"

  #Songsuradet - Moderately Traditionalist -> Authoritarian / Democracy
  SIA_songsuradets_ascendency_r56: "Songsuradet's Ascendency"
  SIA_songsuradets_ascendency_r56_desc: "Although Songsuradet has long lacked interest in taking power, [SIA.GetNameDef]'s situation calls for strong, modest authority. The modernization of the nation shall continue, this time, under our wise watch!"
  SIA_songsuradets_ascendency_r56_tt: "Selectable via Event §YElections in the People's Assembly§! if §gAuthoritarian§! support is 30% or higher."
  SIA_songsuradets_ascendency_r56_idea_desc: "Songsuradet's ascendency to the Premiership has led to discontent among members of the Khana Ratsadon's civilian faction. We need to find common cause or crush this agitation if we are to accomplish our plans for the nation."
  SIA_siamese_ultranationalist_movement_hostile_r56_desc: "Despite our armed forces holding vast power inside the ruling Khana Ratsadon, little stands in the name of ideological unity. Through the influence of the rising Plaek Phibunsongkhram, ultranationalism in the style of Italy and Japan are rapidly gaining traction throughout the country.\n\nCurrently, Phibunsongkhram dislikes our ruling government, and is utilizing his role as Minister of Defense to bolster his influence throughout the county, likely in an attempt to overthrow the regime. He and his followers need to be aligned or crushed if we wish for the return of national stability."
  SIA_siamese_ultranationalist_movement_hostile_2_r56_desc: "Despite our armed forces holding vast power inside the ruling Khana Ratsadon, little stands in the name of ideological unity. Through the influence of the rising Plaek Phibunsongkhram, ultranationalism in the style of Italy and Japan are rapidly gaining traction throughout the country.\n\nDue to his destabilizing nature, we have forced Phibunsongkhram into exile so that he may no longer utilize his role as Minister of Defense to empower himself at the expense of the nation. His remaining followers need to be aligned or crushed if we wish for the return of national stability."
  SIA_siamese_youth_corps_r56: "[SIA.GetAdjective] Youth Corps"
  SIA_siamese_youth_corps_r56_desc: "In the shadows of many European regimes who have done similar, the [SIA.GetAdjective] Youth Corps seeks to forge a culture of loyalty and devotion inside the armed forces, particularly by instilling militaristic fervor in the growing minds of the nation.\n\nThis organization's ultranationalist outlook is currently influencing the population's broader outlook in favor of such policies."
  SIA_siamese_youth_corps_2_r56_desc: "In the shadows of many European regimes who have done similar, the [SIA.GetAdjective] Youth Corps seeks to forge a culture of loyalty and devotion inside the armed forces, particularly by instilling militaristic fervor in the growing minds of the nation."

  SIA_return_to_international_prestige_r56: "Return to International Prestige"
  SIA_return_to_international_prestige_r56_desc: "Through our righteous rule, we have restored the nation into a regional player and powerbroker once more. We are ready to face head on the chaos and instability that has engulfed Europe!"

  SIA_remodel_the_fine_arts_department_r56: "Remodel the Fine Arts Department"
  SIA_remodel_the_fine_arts_department_r56_desc: "If we are to survive the times to come, we need a propaganda ministry that can match the powers we face. Our fine arts department could be transformed to suit this important mission."
  unlocks_decision_prepare_a_wartime_mobilization_which_grants_tt: "Unlocks Decision: §YPrepare a Wartime Mobilization§!, which grants:"
  SIA_remodel_the_fine_arts_department_r56_tt: "§YFor 105 days:§! §GReduces§! the cost of Conscription, Trade and Economy Laws by §G75%§!."
  SIA_call_for_support_in_our_war_effort_r56: "Call for Support in Our War Effort"
  SIA_call_for_support_in_our_war_effort_r56_desc: "A war is upon us and the people of our nation must stand ready. We must call for all to give what they can in the name of our nation coming out on top and alive."
  unlocks_decision_call_for_support_in_our_war_effort_which_grants_tt: "Unlocks Decision: §YCall for Support in Our War Effort§!, which grants:"

  SIA_propagandize_our_rule_r56: "Propagandize our Rule"
  SIA_propagandize_our_rule_r56_desc: "A time of crisis is upon us, one which will decide the fate of all [SIA.GetAdjective] people. With the party by our side, we shall forge a bright future for this corner of Asia!"
  SIA_protectors_of_the_nation_r56: "Protectors of the Nation"
  SIA_protectors_of_the_nation_r56_desc: "A time of crisis is upon us, one which will decide the fate of all [SIA.GetAdjective] people. With the party by our side and our rule total, we shall forge a bright future for this corner of Asia!"

  SIA_respond_to_the_international_crisis_r56: "Respond to the International Crisis"
  SIA_respond_to_the_international_crisis_r56_desc: "War is coming to east Asia and our political scene is in need of preparation for the chaos and blood that this will bring. Policies must be implemented to show that we are a force to be feared on the world stage."
  unlocks_decision_expand_national_rice_reserves_which_grants_tt: "Unlocks Decision: §YExpand National Rice Reserves§!, which grants:"
  SIA_expand_national_rice_reserves_r56: "Expand National Rice Reserves"
  SIA_expand_national_rice_reserves_r56_desc: "Our nation is vulnerable to droughts, bombings and other causes of failed harvests. We should prepare adequate reserves of rice to avoid famines and instability in what's to come."
  SIA_prepare_a_wartime_mobilization_r56: "Prepare a Wartime Mobilization"
  SIA_prepare_a_wartime_mobilization_r56_desc: "Our economy and society at large must be prepared for the fact that a war may come soon to our homeland. We shall give all today so that our children can live in a prosperous nation tomorrow!"

  SIA_promote_national_unity_r56: "Promote National Unity"
  SIA_promote_national_unity_r56_desc: "While we must always answer to the needs of our people, the time has come to put all else aside in the name the order we've established against the chaos that has engulfed this world."
  SIA_government_of_national_unity_r56: "Government of National Unity"
  SIA_government_of_national_unity_r56_desc: "While we must always answer to the needs of our people, the time has come to put all else aside in the name the order we've established against the chaos that has engulfed this world. We shall sit side by side with the most competent men of all ideologies who seek the best for our nation!"

  SIA_wartime_economic_policies_r56: "Wartime Economic Policies"
  SIA_wartime_economic_policies_r56_desc: "A move towards war means a move towards economic policies that defend our industry and maintain stability. We will be ready for what is to come, no matter what!"
  unlocks_decision_implement_price_controls_which_grants_tt: "Unlocks Decision: §YImplement Price Controls§!, which grants:"
  SIA_implement_price_controls_r56: "Implement Price Controls"
  SIA_implement_price_controls_r56_desc: "The level of economic mobilization in our country is an unfortunate but necessary cause of volatile prices. Although they may lead to shortages, calculated price controls can hopefully dampen the level of inflation in our country and restore popularity."
  unlocks_decision_instill_wartime_taxes_which_grants_tt: "Unlocks Decision: §YInstill Wartime Taxes§!, which grants:\n§YFor 105 days:§!\nProduction Efficiency Retention: §G+8.00%§!\nProduction Efficiency Growth: §G+8.00%§!\nLack of Resources Penalty: §G-16.00%§!"
  SIA_instill_wartime_taxes_r56: "Instill Wartime Taxes"
  SIA_instill_wartime_taxes_r56_desc: "While they will undoubtedly be a caused of discontent, additional taxes are ultimately needed to grant our government the funds it needs to keep our economy afloat amid this war."

  SIA_open_up_the_economy_r56: "Open up the Economy"
  SIA_open_up_the_economy_r56_desc: "The nations of the west are competing for influence in our vital corner of the world. We should return to an open-door policy with trade, so that we may enrich ourselves and protect our independence."
  SIA_stanvac_oil_company_r56: "Stanvac Oil Company"
  SIA_stanvac_oil_company_r56_tt: "Extra resources from trade with §Y[USA.GetNameWithFlag]§!: §G+2§!"
  SIA_hsbc_r56: "HSBC"
  SIA_hsbc_r56_tt: "Extra resources from trade with §Y[ENG.GetNameWithFlag]§!: §G+2§!"
  SIA_behn_meyer_co_r56: "Behn, Meyer & Co."
  SIA_behn_meyer_co_r56_tt: "Extra resources from trade with §Y[GER.GetNameWithFlag]§!: §G+2§!"
  

  SIA_negotiate_a_mass_development_plan_r56: "Negotiate a Mass-Development Plan"
  SIA_negotiate_a_mass_development_plan_r56_desc: "While we seek to protect a stable order, this cannot come if the poor conditions of [SIA.GetAdjective] peasants and industrial laborers aren't addressed. We should work with members of the civilian wing in forging a development plan that can protect the interest of our people while protecting against overzealous change."
  SIA_negotiate_a_mass_development_plan_r56_idea: "Due to our support for their reforms, the civilian wing has largely become amicable to our national platform. We hope through continued cooperation, this can blossom into a friendship that can stabilize the nation."

  SIA_steady_path_to_rural_development_r56: "Steady Path to Rural Development"
  SIA_steady_path_to_rural_development_r56_desc: "The introduction of new labor and peasant reforms has boded well for our stability and economy. As long we continue to protect our independence and stick to wise policies, the coming times will transform our nation into a regional economic powerhouse!"

  SIA_build_a_modest_social_state_r56: "Build a Modest Social State"
  SIA_build_a_modest_social_state_r56_desc: "Part of bringing our nation to prosperity will involve the formation of a meaningful social state, so that our workers and peasants are protected from the effects of capitalism and our industrial transformation. While we are not a rich country, we should be able to bring forward modest reforms with the resources that we have."
  SIA_build_a_modest_social_state_r56_idea_desc: "Due to our wide support for their reforms, the civilian wing has largely become friendly to our national platform. May we together restore unity across the nation!"

  SIA_stabilize_our_economic_course_r56: "Stabilize Our Economic Course"
  SIA_stabilize_our_economic_course_r56_desc: "With the civilian wing largely crushed, we will bring an end to the notion that investments in our country can fall victim to socialist's calls for redistribution of what is rightfully theirs."

  SIA_address_the_need_for_reforms_r56: "Address the Need for Reforms"
  SIA_address_the_need_for_reforms_r56_desc: "With the calls for violent reform largely crushed, we should announce plans of our own devisement to bring improvements to the state of living of our peasants."

  SIA_secure_the_armed_forces_r56: "Secure the Armed Forces"
  SIA_secure_the_armed_forces_r56_desc: "Phibun and his ultranationalist movement are the greatest threat to our rule. We must banish him and all of his most militant allies, and bring those willing to work with us to the negotiation table."

  SIA_refine_the_revolutionary_policies_r56: "Refine the Revolutionary Policies"
  SIA_refine_the_revolutionary_policies_r56_desc: "Whether we want it or not, the nation will always contain those opposed to our ideals of governance. We can surely make peace with this fact and tolerate reform of our initial goals for the nation."
  unlocks_decision_expand_tolerance_for_political_pluralism_which_grants_tt: "Unlocks Decision: §YExpand Tolerance for Political Pluralism§!, which grants:\nDaily Democratic Support: §G+0.05§!\nDaily Fascism Support: §G+0.01§!\n\n"
  SIA_expand_tolerance_for_political_pluralism_r56: "Expand Tolerance for Political Pluralism"
  SIA_expand_tolerance_for_political_pluralism_r56_desc: "No matter what we do, Khana Ratsadon rule will always bring calls for one thing: democracy, to the nation. We must tolerate this fact and see where we can make compromise on their proposed reforms."
  unlocks_decision_push_for_national_order_which_grants_tt: "Unlocks Decision: §YPush for National Order§!, which grants:"
  SIA_push_for_national_order_r56: "Push for National Order"
  SIA_push_for_national_order_r56_desc: "Liberals and communists are the greatest threat to this nation and we must move against them. We shall call for order in the nation and force an end to their opposition!"

  SIA_redressment_for_the_june_coup_r56: "Redressment for the June Coup"
  SIA_redressment_for_the_june_coup_r56_desc: "Phahon bringing an end to our conservative coalition in 1933, and bringing the destabilizer Pridi back to our nation was a tragedy for the peaceful nature of our revolution. This must not happen again under any circumstances and we shall guarantee that it cannot!"

  SIA_focus_on_economic_growth_r56: "Focus on Economic Growth"
  SIA_focus_on_economic_growth_r56_desc: "With stability back in the nation, the time has come to implement policies to foster economic growth. May the coming decades bring prosperity to our people!"
  SIA_stability_and_economic_growth_r56: "Stability and Economic Growth"
  SIA_stability_and_economic_growth_r56_desc: "With stability back in the nation, the time has come to implement policies to foster economic growth. May the coming decades bring prosperity to our people!"

  SIA_disciplined_separate_army_r56: "Disciplined, Separate Army"
  SIA_disciplined_separate_army_r56_desc: "With the nationalist movement on our sided and with conservative, nationalistic politicians in our nation, the time has come to separate the army from internal politics so they can best serve the true threat to our nation: the outside world."

  SIA_protectors_of_the_old_order_r56: "Protectors of the Old Order"
  SIA_protectors_of_the_old_order_r56_desc: "The end of revolutionary violence will only come via a transformation of the army into a force that can subvert and control calls for revolutions like the one that tore our nation apart. The army's influence in politics must be entrenched if stability is to remain."

  SIA_absorb_the_nationalist_movement_r56: "Absorb the Nationalist Movement"
  SIA_absorb_the_nationalist_movement_r56_desc: "With Phibun gone from the country, we must address those who follows his ideals. As we too seek order and strength for the nation, surely we can find some ideological common ground with the ultranationalist movement; all that is required is a simple dialogue!"
  SIA_nationalist_conservative_cooperation_r56: "Nationalist-Conservative Cooperation"
  SIA_nationalist_conservative_cooperation_r56_desc: "With Phibun gone from the country and with the nation under conservative rule, remaining ultranationalist forces are gradually cooperating with our reign, knowing that we envision only the best for our nation."

  SIA_economy_of_national_defense_r56: "Economy of National Defense"
  SIA_economy_of_national_defense_r56_desc: "A war is upon southeast Asia and we must stand ready. While our military is a relatively strong force, our economy is weak and unprepared; we must address this fact at once."

  SIA_restore_the_honor_of_the_chakri_r56: "Restore the Honor of the Chakri"
  SIA_restore_the_honor_of_the_chakri_r56_desc: "Even with the return of conservative rule, much of the population is still anxious and untrusting of Khana Ratsadon rule. The time has come to restore the honor of the monarchy and with it: the nation shall prosper!"
  SIA_rama_vii_r56: "Rama VII"
  SIA_rama_vii_r56_desc: "Making a recent return to the nation after the return of pro-monarchy premier, Rama VII has agreed to uphold a ceremonial role under the governmental leadership of the Khana Ratsadon. With his abdication having been a significant driver of national instability, his return bodes well for what is to come."

  SIA_utilize_the_royal_opulence_r56: "Utilize the Royal Opulence"
  SIA_utilize_the_royal_opulence_r56_desc: "The royal family is sitting on an abundance of wealth and this may pose a mutually-beneficial opportunity. Through contributions to national projects and the social state, the Rama dynasty can bolster its influence and support while empowering the nation and putting an end to calls for forced distribution."

  SIA_continue_the_democratic_transition_r56: "Continue the Democratic Transition"
  SIA_continue_the_democratic_transition_r56_desc: "Songsuradet is far from power-seeking, and the time has come to find a successor so that he may return to military affairs. "

  SIA_end_the_revolutionary_turbulence_r56: "End the Revolutionary Turbulence"
  SIA_end_the_revolutionary_turbulence_r56_desc: "We have returned peace, order and stability to the nation. We shall come out on top of every global conflict we enter, and bring a golden age for the nation!"

  SIA_consolidate_the_peoples_assembly_r56: "Consolidate the People's Assembly"
  SIA_consolidate_the_peoples_assembly_r56_desc: "Songsuradet, although far from power-seeking, is the best man to rule the nation at this time. For stability to come back to Siam, he must consolidate power and lead a moderate dictatorship to promote economic growth and stability."

  SIA_push_wichitwathakan_to_the_forefront_r56: "Push Wichitwathakan to the Forefront"
  SIA_push_wichitwathakan_to_the_forefront_r56_desc: "Luang Wichitwathakan, although once an ally of the ultranationalist movement, clearly shows far greater respect for the monarchy and our traditions compared to the Italophile Phibun. With the military still divided and nationalist and conservative factions strong, a civil minister with an ideological blend of conservatism and nationalism is exactly what our nation needs in what's to come."

  SIA_strengthen_the_anti_communist_act_r56: "Strengthen the Anti-Communist Act"
  SIA_strengthen_the_anti_communist_act_r56_desc: "Even going back to the days of Nitithada, it's clear that Pridi and his reformist wing of the Khana Ratsadon is a threat to the nation and what we stand for. If we seek to avoid the chaos that his rule would bring, he must be brought down from power immediately."
  this_national_spirit_will_be_removed_after_365_days_tt: "This §YNational Spirit§! will be §GRemoved§! after §Y365§! days."
  SIA_lingering_civilian_wing_opposition: "Lingering Civilian Wing Opposition"
  SIA_lingering_civilian_wing_opposition_desc: "Utilizing the Anti-Communist Act, we are pushing the most reformist wing of the Khana Ratsadon out of our government and into exile. Their revolutionary ideals can stay in the chaotic nations of the west that they came from."
  SIA_has_been_purged_by_conservative_or_ultranationalist_forces: "Has been Purged by §gConservative§! or §8Ultranationalist§! forces"

  #Pridi - Social Nationalism -> Authoritarian / Democratic / Communist
  SIA_pridis_premiership_r56: "Pridi's Premiership"
  SIA_pridis_premiership_r56_desc: "Pridi Banomyong has gone from a leading force in our revolution to nearly ending up purged from our nation; finally coming back to [SIA.GetNameDef] under Phahon's premiership. We have achieved many great things, but under our leadership, a better tomorrow is possible for the [SIA.GetAdjective] people!"
  SIA_pridis_premiership_r56_tt: "Selectable via Event §YElections in the People's Assembly§! if §4Democratic§! support is 30% or higher."

  SIA_prepare_a_defense_of_the_nation_r56: "Prepare a Defense of the Nation"
  SIA_prepare_a_defense_of_the_nation_r56_desc: "War is coming to the region once again and we must stand ready. For if we fall, everything we have worked so hard to achieve would be all for nothing. Our nation must be ready to defend itself against all the great powers will throw at it!"

  SIA_the_question_of_the_regency_r56: "The Question of the Regency"
  SIA_the_question_of_the_regency_r56_desc: "The abdication of Prajadhipok set off a wave of instability throughout the nation and we are yet to recover from its effects. With the monarchy at its lowest point, we should decide now what its long-term role for the country will be."
  unlocks_decision_levy_additional_taxes_on_royal_wealth_which_grants_tt: "Unlocks Decision: §YLevy Additional Taxes on Royal Wealth§!, which grants:"
  SIA_levy_additional_taxes_on_royal_wealth_r56: "Levy Additional Taxes on Royal Wealth"
  SIA_levy_additional_taxes_on_royal_wealth_r56_desc: "The royal family still holds excessive financial resources despite our best efforts. With much of the nation destitute, this small elite cannot continue to hold so much economic power over our nation."
  upon_the_completion_of_focus_prioritize_socioeconomic_progress_r56_tt: "Upon the completion of Focus: §YPrioritize Socioeconomic Progress§!:"
  SIA_abolish_the_monarchist_order_r56: "Abolish the Monarchist Order"
  SIA_abolish_the_monarchist_order_r56_desc: "With the national communist movement on the rise and with most opposed movements at their weakest, the time has come to overthrow the monarchist order and forge a socialist paradise in southeast Asia."
  unlocks_decision_abolish_the_monarchist_order_which_grants_tt: "Unlocks Decision: §YAbolish the Monarchist Order§!, which grants:"
  SIA_r56.30.title: "The Fate of the Chakri Dynasty"
  SIA_r56.30.desc: "With much of the royal family still hostile to our rule and with it's power still at a low point, the time has come to decide what it's fate shall be in what's to come.\n\nWhile distancing society from the Chakri dynasty will be a slow, painful process, our experience with constitutional monarchy has shown that kings of our nation have a strong expectation for power which we cannot tolerate under any condition.\n\nWhat shall the fate of the monarchy be?"
  siam_r56.30.a: "Reconciliation with the king is to the interest of us all!"
  siam_r56.30.b: "We need no king. The royal families influence shall be kept as weak as possible!"
  SIA_has_reconciled_with_the_royal_family_r56_tt: "Has §GReconciled§! with the §YRoyal Family§!"

  SIA_deal_with_the_armed_forces_r56: "Deal With the Armed Forces"
  SIA_deal_with_the_armed_forces_r56_desc: "The greatest threat to democratic rule has clearly shown itself to be ultranationalist's lingering among our increasingly powerful armored forces. By banishing the powerful Luang Phibunsongkhram and some of his most loyal followers, we can neutralize the threat of the armed forces without too many consequences."

  SIA_rewrite_the_1932_constitution_r56: "Rewrite the 1932 Constitution"
  SIA_rewrite_the_1932_constitution_r56_desc: "With Phahon's fall from power, and with the nation once more under our hopeful watch, the time has come to review the state of the nation and once more ask ourselves what our best path forward is."
  SIA_towards_a_peoples_democracy_r56: "Towards a People's Democracy"
  SIA_towards_a_peoples_democracy_r56_desc: "With the [SIA.GetAdjective] national premiership secured from nationalist and reactionary forces, the time has come to give the people a taste of the ideals we fight for. A government that fights for the needs of our people is a must in what's to come!"

  SIA_prioritize_socioeconomic_progress_r56: "Prioritize Socioeconomic Progress"
  SIA_prioritize_socioeconomic_progress_r56_desc: "Perhaps, as experienced by many leaders before us, our goals for a rapid democratic transition were too lofty for [SIA.GetAdjective] society. Before we can act as a democratic nation of the west, we must fight to enshrine national education, industrialize [SIA.GetAdjective] society and create a public who is ready for modern political institutions."
  SIA_clamp_down_on_anti_revolutionary_dissent_r56_effects: "§YFor 56 days:§! §GReduces§! daily §2Democratic§! and §8Fascism§! support by §G0.02§!."
  SIA_clamp_down_on_anti_revolutionary_dissent_r56: "Clamp Down on Anti-Revolutionary Dissent"
  SIA_clamp_down_on_anti_revolutionary_dissent_r56_desc: "While many call it needlessly authoritarian, dissent against our rule is dissent against progress and the long-term survivability of our nation. Appropriate censorship must be in order if we are to forge the nation we need to survive what is to come."

  SIA_equality_under_our_law_r56: "Equality Under Our Law"
  SIA_equality_under_our_law_r56_desc: "With counterrevolution among the armed forces put to a stop, the time has come to continue institutional reforms. Only with a modern legal code can we truly become an equal to the west."
  SIA_beacon_of_progress_r56: "Beacon of Progress"
  SIA_beacon_of_progress_r56_desc: "With Phahon and Phibun falling from power, and Pridi rising in their place, the nation is once more in a period of great reform. Siam is on the road to becoming a modern nation and nothing can stand in our way!"

  SIA_bottom_up_societal_modernization_r56: "Bottom-Up Societal Modernization"
  SIA_bottom_up_societal_modernization_r56_desc: "While work has been done to alleviate our problems, [SIA.GetNameDef] is in need of further modernization. In the shadows of other modernization regimes, we can learn from their successes and failings and finally make [SIA.GetNameDef] stand as an equal to the west!"

  SIA_industrial_workers_reforms_r56: "Industrial Workers Reforms"
  SIA_industrial_workers_reforms_r56_desc: "We are still early in our industrialization and much will have to go right for us to avoid the political chaos that once engulfed Europe during this time. By steadily improving worker conditions and keeping living standards high, we can surely prevent a wave of dissent from destroying the nation."

  SIA_maintain_the_fire_r56: "Maintain the Fire"
  SIA_maintain_the_fire_r56_desc: "The holding of national elections has boded well for the popularity of our government and it has granted us the power to continue our campaign of reform. The transformation of our nation shall continue, this time with an undoubted mandate of our people!"
  unlocks_decision_support_laborer_organizations_which_grants_tt: "Unlocks Decision: §YSupport Laborer Organizations§!, which grants:"
  SIA_support_laborer_organizations_r56: "Support Laborer Organizations"
  SIA_support_laborer_organizations_r56_desc: "The nation's peasant class are a growing base for our support and if we wish for our rule to continue, we must implement policies that are in their interests. Supporting their efforts at collective organization would be a good method to achieve that."
  unlocks_decision_support_rural_farmers_which_grants_tt: "Unlocks Decision: §YSupport Rural Farmers§!, which grants:\n§YFor 105 days:§!\nConsumer Goods Factory factor: §Y15.0%§!\n\n"
  SIA_support_rural_farmers_r56: "Support Rural Farmers"
  SIA_support_rural_farmers_r56_desc: "While our development projects have done well to increase content with our rule, more work is needed. For popularity to come to our government, work must be done to reduce the cost of electricity and water. We must also work to cut certain taxes that overburden our rural population. By doing these, surely we can form genuine popular support among the countryside."


  SIA_forge_a_democratic_legacy_r56: "Forge a Democratic Legacy"
  SIA_forge_a_democratic_legacy_r56_desc: "Though we have strengthened our civilian institutions, the history of [SIA.GetAdjective] democracy has been a story of turmoil, chaos and uncertainty. Through time and continued reforms, surely we can stabilize and paint a hopeful picture of what is to come."

  SIA_hold_national_elections_r56: "Hold National Elections"
  SIA_hold_national_elections_r56_desc: "With the reforms we have put forward, the time has come to hold elections throughout the nation and usher in a new era for [SIA.GetNameDef]."

  SIA_asias_liberal_firebrand_r56: "Asia's Democratic Firebrand"
  SIA_asias_liberal_firebrand_r56_desc: "Siam is at a crossroads that many leaders have experienced before us. Where many would consolidate power under the guise of 'preparing' their nation for ideological goals, we shall give the people a taste of the freedom we fight and die for. The [SIA.GetAdjective] shall be the freest men in the east!"

  SIA_stabilize_siams_political_woes_r56: "Stabilize Siam's Political Woes"
  SIA_stabilize_siams_political_woes_r56_desc: "Ever since the days of 1932, great instability has plagued the cause of our revolution. Since then, we have strengthened civil rule and guaranteed an end to military interference and with that: a time of stability and economic growth shall finally come to our nation!"

  #Phibungsongkhram - Fascist
  SIA_phibuns_takeover_r56: "Phibun's Takeover"
  SIA_phibuns_takeover_r56_desc: "Between increasing domestic tensions and a return to international conflicts, we are at a crossroads which we must navigate under strong leadership. Phibunsongkhram has defended our revolution before against the reactionary Boworadet Rebellion, and has had a vital role in improving our military readiness. The time has come to appoint him, and show [SIA.GetNameDef]'s resolve on the world stage!"
  SIA_phibuns_takeover_r56_tt: "Selectable via Event §YElections in the People's Assembly§! if §8Fascism§! support is 30% or higher."

  SIA_siamese_national_banking_bureau_r56: "[SIA.GetAdjective] National Banking Bureau"
  SIA_siamese_national_banking_bureau_r56_desc: "Despite the work done, we are still decades behind Europe in societal and economic development. Modern banking institutions are the start of a modern economic plan that can give us the resources to bring our nation up to par with the west."
  SIA_natl_banking_bureau_r56: "Natl. Banking Bureau"
  unlocks_decision_inflate_the_baht_which_grants_tt: "Unlocks Decision: §YInflate the Baht§!, which grants:\n§YFor 140 days§!:\nConstruction Speed: §G+8.00%§!\nFactory Output: §G+8.00%§!\nDockyard Output: §G+8.00§!\n\n"
  SIA_inflate_the_baht_r56: "Inflate the Baht"
  SIA_inflate_the_baht_r56_desc: "While not the most ideal long-term strategy, inflating the [SIA.GetAdjective] Baht is a strategy we need to take control of our debts and keep our national defenses afloat."

  SIA_push_for_universal_education_r56: "Push for Universal Education"
  SIA_push_for_universal_education_r56_desc: "While we have done much to elevate education across [SIA.GetAdjective], access is still highly unequal, to the detriment of our rural provinces. We should make universal, centralized national education a goal for the near-future across the entirety of our nation."

  SIA_towards_national_autarky_r56: "Towards National Autarky"
  SIA_towards_national_autarky_r56_desc: "As war reaches Asia, we cannot afford a dependency on the nations of Europe or anywhere else. We must be able to produce all that which our economy depends on."

  SIA_escalate_industrial_policy_r56: "Escalate Industrial Policy"
  SIA_escalate_industrial_policy_r56_desc: "The pace of our industrialization has been unacceptable. If we are to become a modern nation, we must replicate the accomplishment of other powers and utilize national capital to further the development of modern factories."

  SIA_improve_the_siamese_countryside_r56: "Improve the [SIA.GetAdjective] Countryside"
  SIA_improve_the_siamese_countryside_r56_desc: "The rapidly modernizing Bangkok is completely at odds with the impoverished, agriculture-dependent northern half of our country. We must do what we can to improve the efficiency and livelihoods of our rural brothers."
  SIA_local_industrial_boom_r56: "Local Industrial Boom"

  SIA_solidify_governmental_control_r56: "Solidify Governmental Control"
  SIA_solidify_governmental_control_r56_desc: "If we are to become a major power in Asia, we must destroy any idea that meaningful opposition to our national plans will be tolerated. All who seek to destroy the glory of our nation must be wiped out for the good of [SIA.GetNameDef]!"
  SIA_r56.20.title: "Securing the Khana Ratsadon"
  siam_r56.20.desc: "With the premiership secured, the time has come to bring stability to [SIA.GetNameDef]. Opposition can be found in all areas of the government, and it is concentrated in two main fronts:\n\nFirstly, the senior military that is loosely led by Phraya Songsuradet, who has a history of reactionary social and economic policies that means natural opposition to our proposed reforms. They are similarly disliked by Pridi and his reformist allies for their roadblocking of his national plans.\n\nOn the other hand, talented liberal Pridi Banomyong still remains at the center stage, and has some history of compromise with Phahon; although his liberal tendencies means he will likely resist many of our nationalistic reforms. We can also leverage his unpopularity with the senior military, who considers him nothing less than a communist, in order to bring them under our cause "in the name of eradicating [SIA.GetAdjective] Marxism".\n\nWe have the political capital and popularity to bring an end to one of these men. The only question that remains is, which faction can stand at our side as we reclaim our national glory?"
  siam_r56.20.a: "Unlike Pridi and his allies, Songsuradet's reactionary wing has no use to us."
  SIA_compromise_modernization_front_r56: "Compromise Modernization Front"
  SIA_compromise_modernization_front_r56_desc: "While we stand at odds with each other, the civilian wing is home to some of Thailand's best and brightest. It would be a shame to lose them in the nation's moment of need for bright, strong men."
  siam_r56.20.b: "Pridi's reforms threaten the needs of the state. We must rally the senior military against him."
  SIA_united_front_against_socialism_r56: "United Front Against Socialism"
  SIA_united_front_against_socialism_r56_desc: "While we stand at odds with each other, we, unlike the specter of communism, do not seek to throw off the established order in favor of madness and chaos. Surely, we can find some semblance of common cause with traditionalists inside our government."

  SIA_towards_a_great_thai_empire_r56: "Towards a Great Thai Empire"
  SIA_towards_a_great_thai_empire_r56_desc: "Siamese nationalism has seen a gradual rise since the beginning of Chulalongkorn's reign, but we can make it something better. Despite what anyone may say, our nation was forged and belongs to Thai speakers of our culture, of which, many are tragically outside the 'Siamese' borders. We must emphasize our ethnolinguistic identity, and with it: forge an empire that is an equal to Japan and the west!"

  SIA_weaken_the_feudalist_institutions_r56: "Weaken the Feudalist Institutions"
  SIA_weaken_the_feudalist_institutions_r56_desc: "With our path to proper nationhood started, we must address the need for modernization. As a nation in the shadows of Kemalist Turkey and Meiji Japan, we have a plethora of national policies that we can modify to address the nation's unique circumstances. No matter what, we must keep moving forward."
  SIA_towards_a_great_thai_empire_r56_timer_tt: "Has completed another Focus in the §YTowards a Great [SIA.GetAdjective] Empire§! subbranch less than 70 days ago\nCurrent days are: [?SIA_towards_a_great_thai_empire_r56_timer_flag:days|Y0]"

  SIA_enact_nationalist_policies_r56: "Enact Nationalist Policies"
  SIA_enact_nationalist_policies_r56_desc: "While much of the nation resonates with the ideals of [SIA.GetAdjective] nationalism, that is hardly enough to make our nation truly thrive. We must implement domestic policies that promote the status of our new identity."
  unlocks_decision_tax_anti_thai_foreign_businesses_which_grants_tt: "Unlocks Decision: §YTax 'Anti-[SIA.GetAdjective]' Foreign Businesses§!, which grants:\n§YFor 84 days:§!\nFactory Output: §G+8.00%§!\nDockyard Output: §G+8.00%§!\n\n"
  SIA_tax_anti_thai_foreign_businesses_r56: "Tax 'Anti-[SIA.GetAdjective]' Foreign Businesses"
  SIA_tax_anti_thai_foreign_businesses_r56_desc: "Foreign industries that are disloyal to our interests remain powerful. Through disproportionate taxation, certainly we can return their lucrative profits to the [SIA.GetAdjective] people who deserve it so much more."

  SIA_tighten_the_dictatorship_r56: "Tighten the Dictatorship"
  SIA_tighten_the_dictatorship_r56_desc: "Our policies of national centralization are paying off. The time has come to further the power of the premiership, so that our grand plans for the nation can now commence, uninterrupted!"
  unlocks_decision_organize_a_secret_police_crackdown_which_grants_tt: "Unlocks Decision: §YOrganize a Secret Police Crackdown§!, which grants:\n§YFor 175 days:§!\nWeekly Stability: §G+0.50%§!\nDaily Fascism Support: §G+0.01§!"
  SIA_organize_a_secret_police_crackdown_r56: "Organize a Secret Police Crackdown"
  SIA_organize_a_secret_police_crackdown_r56_desc: "Disloyal elements are still far too powerful despite our best efforts. When all else fails, our Special Branch Bureau can make quick work of traitors."

  SIA_elevate_the_special_branch_r56: "Elevate the Special Branch"
  SIA_elevate_the_special_branch_r56_desc: "Between the powers of Europe and the pacific, there lies many nations who hold potential to use tools of espionage against our national interests. We should ensure that our powerful Special Branch is granted the funding and tools needed to destroy any threats to our internal security."
  SIA_empowered_special_branch_r56_LAR: "Empowered Special Branch"
  SIA_empowered_special_branch_r56_LAR_desc: "Between the powers of Europe and the pacific, there lies many nations who hold potential to use tools of espionage against our national interests. We should ensure that our powerful Special Branch is granted the funding and tools needed to destroy any threats to our internal security."

  SIA_form_a_cult_of_personality_r56: "Form a Cult of Personality"
  SIA_form_a_cult_of_personality_r56_desc: "Despite Phibunsongkhram's proven talents for the capacity of prime minister, large swathes of the nation continue to cling to other institutions, notably the monarchy. For the good of our national development, we should form a cult of personality around Phibunsongkhram, so that we have the momentum needed to launch the radical reforms the [SIA.GetAdjective] needs for its survival!"
  unlocks_decision_demand_public_display_of_the_prime_minister_which_grants_tt: "Unlocks Decision: §YDemand Public Display of the Prime Minister§!, which grants:"
  SIA_demand_public_displays_of_the_prime_minister_r56: "Demand Public Display of the Prime Minister"
  SIA_demand_public_displays_of_the_prime_minister_r56_desc: "Despite our wishes, the royal family holds too much influence over our society while our brave and devoted premier is an after-thought. We must rectify this and make it to known to all that we are the true protectors of the nation!"

  SIA_restorer_of_thailands_power_and_modernity_r56: "Restorer of Thailand's Power and Modernity"
  SIA_restorer_of_thailands_power_and_modernity_r56_desc: "After centuries of territorial and military decline, we have, under the strong-willed fervor of Phibunsongkhram, placed our economy, internal stability, and military readiness into a new golden age! Only a fool would deny that we are an equal of the west."

  SIA_iron_chancellor_of_the_east_r56: "Iron Chancellor of the East"
  SIA_iron_chancellor_of_the_east_r56_desc: "After decades of grief over our national losses, we, under the righteous reign of Phibunsongkhram, have undone the worst of our losses and united the Tai peoples behind our flag, just as Bismark had the Germans! Who can seriously doubt our rule now, after all that we've accomplished?"
  all_starting_laotian_cores_are_owned_by_you_or_a_subject_tt: "All starting §YLaotian§! cores are owned by you or a subject"
  shanland_is_owned_by_you_or_a_subject_tt: "§Y[1018.GetName]§! is owned by you or a subject"
  batambang_is_owned_by_you_or_a_subject_tt: "§Y[925.GetName]§! is owned by you or a subject"

  SIA_opportunistic_militarization_r56: "Opportunistic Militarization"
  SIA_opportunistic_militarization_r56_desc: "A time of great opportunity is upon us, should we decide to act on it. For [SIA.GetNameDef] to be an acting power in Asia once more, we must take vital steps to bolster our military readiness! The time has come to issue economic mobilization, and make clear to our people that we have begun the final steps to restore our power on the world stage!"

  SIA_national_cultural_preservation_act_r56: "National Cultural Preservation Act "
  SIA_national_cultural_preservation_act_r56_desc: "Our [SIA.GetAdjective]-nationalist policies are paying off, and with them we are forging a stronger, more harmonious power inside southeast Asia. We must further what we've started, and escalate the transformation which we've too recently begun!"
  unlocks_decision_heavy_handed_assimilation_policies_which_grants_tt: "Unlocks Decision: §YHeavy-Handed Assimilation Policies§!, which grants:"
  SIA_heavy_handed_assimilation_policies_r56: "Heavy-Handed Assimilation Policies"
  SIA_heavy_handed_assimilation_policies_r56_desc: "For us to remain a strong nation, we need an equally strong cultural and linguistic identity. All who have settled here must become just as [SIA.GetAdjective] as the rest of us!"

  SIA_return_to_the_world_stage_r56: "Return to the World Stage"
  SIA_return_to_the_world_stage_r56_desc: "Conflict is once more upon us. We must do all that we can to secure our position in the world, so that we don't once more end up in an era of humiliation, to the benefit of foreign powers."

  SIA_forced_out_of_neutrality_r56: "Forced Out of Neutrality"
  SIA_forced_out_of_neutrality_r56_desc: "Despite our desire to remain neutral in the Great East-Asian war, [JAP.GetNameDef] has launched an invasion of our lands, and strung us to our side in a moment of desperation. We are on a dangerous road, but under wise leadership we shall come out a stronger power."
  SIA_forced_out_of_neutrality_r56_tt: "§Y[JAP.GetNameDefCap]§! has violated our neutrality, while laying open to negotiated peace."

  SIA_limit_wartime_activity_r56: "Limit Wartime Activity"
  SIA_limit_wartime_activity_r56_desc: "Major involvement in this war is not to our national interest. We should seek to make distance between ourselves and this conflict."
  SIA_focus_on_domestic_stability_r56: "Focus on Domestic Stability"
  SIA_focus_on_domestic_stability_r56_desc: "Major involvement in this war is not to our national interest. We should seek to make distance between ourselves and this conflict."

  SIA_flexible_wartime_policies_r56: "Flexible Wartime Policies"
  SIA_flexible_wartime_policies_r56_desc: "[SIA.GetNameDefCap] is a nation whose foreign policy is built on simultaneous interaction between many powers. As war consumes Asia, we must look carefully, even to our allies; whatever side is losing this war, that must be our enemy."
  siam_r56.22.t: "A New Direction for the Nation"
  siam_r56.22.desc: "Dissatisfaction with our war effort is growing by the day and it is beginning to sour Phibun's popularity across [ROOT.GetAdjective] society.\n\nWe must ask ourselves two vital questions: is [SIA.GetNameDef] to fight to the bitter end, and if so, under whose watch will it be?"
  unlocks_decision_abandon_the_war_effort_which_grants_tt: "Unlocks Decision: §YAbandon the War Effort§!, which grants:"
  SIA_abandon_the_war_effort_r56: "Abandon the War Effort"
  SIA_abandon_the_war_effort_r56_desc: "The time has come: this war is no longer in our interests. We must seek to leave it as soon as possible for the good of the [SIA.GetAdjective] people and nation."
  siam_r56.23.title: "[FROM.GetNameDefCap] Requests Peace"
  siam_r56.23.desc: "Today, following their 'partnership' with our [JAP.GetAdjective] enemy, diplomats from their nation, with the Prime Minister's backing, have officially offered conditional surrender to us.\n\nIf we accept, they will re-enter the war, this time on our side, to the end; while also remaining an ally in Asia to aid in enforcing a post-war order.\n\nShould we accept [SIA.GetNameDefCap]'s attempt for peace with our nation?"
  siam_r56.23.b: "You aren't squeaking your way out of this one."
  siam_r56.24.title: "[FROM.GetNameDefCap] Accepts Our Offer of Peace"
  siam_r56.24.desc: "Today, we've received a response from [FROM.GetNameDef], stating that we share a desire to achieve peace between our nations. Under the support of our new, righteous allies, we shall together crush our mutual enemies!"
  siam_r56.24.a: "May the coming months be kind to our nation..."
  siam_r56.25.title: "[FROM.GetNameDefCap] Declines an Offer of Peace"
  siam_r56.25.desc: "Sadly, we've received a response from [FROM.GetNameDef], stating their refusal to make peace between our nations. We shall fight on, for now."
  siam_r56.25.a: "Our situation just went from bad to quite a lot worse..."
  siam_r56.22.a: "A more moderate force would be... helpful in what's to come."
  siam_r56.22.a_tt: "Appointing §YKhuang Aphaiwong§! will be seen by foreign powers as distancing ourselves from §Y[JAP.GetNameDef]§!, making an offer for §Ypeace§! §Gmore likely§! to succeed."
  siam_r56.22.b: "We must further Phibun's authority! He knows what's best for us [SIA.GetAdjective]!"
  unlocks_decision_expand_our_commitment_to_the_war_effort_which_grants_tt: "Unlocks Decision: §YExpand our Commitment to the War Effort§!, which grants:"
  SIA_expand_our_commitment_to_the_war_effort_r56: "Expand our Commitment to the War Effort"
  SIA_expand_our_commitment_to_the_war_effort_r56_desc: "While our wartime commitments have been low so far, the tide is currently changing. If we seek a righteous outcome to this conflict, we must bring our nation to the forefront in victories to come!"
  disables_decision_SIA_abandon_the_war_effort_r56_tt: "§RDisables§! decision §YAbandon the War Effort§!"
  completes_focus_prove_thailands_worth_which_grants_tt: "Completes Focus §YProve Thailand's Worth§!, which grants:"

  SIA_end_foreign_subversion_r56: "End Foreign Subversion"
  SIA_end_foreign_subversion_r56_desc: "With the threat of war upon us, we must take whatever steps possible to quell any first signs of undue 'foreign' influence in our nation. Our nation is a birthright of the [SIA.GetAdjective] people, it shall never fall!"

  SIA_ensure_wartime_stability_r56: "Ensure Wartime Stability"
  SIA_ensure_wartime_stability_r56_desc: "While the international crisis has brought sentiments of unity to our nation, it has opened the door for chaos and uncertainty to take root. We must reverse these trends before widespread unrest harms our ability to fight effectively."
  SIA_united_modernization_front_r56: "United Modernization Front"
  SIA_united_modernization_front_r56_desc: "While they are largely under the subjugation of the armed forces, the Khana Ratsadon encompasses most of the nations civilian and military modernizers, who seek to place [SIA.GetNameDef] as an equal among the western nations."

  SIA_prove_thailands_worth_r56: "Prove Thailand's Worth"
  SIA_prove_thailands_worth_r56_desc: "A crisis is upon us once more, and we have gained the chance to turn the horrors of today into opportunity for our nation. We will show the fervor of our new empire, and carve out a defined place in our new Asian order!"

  SIA_everything_for_victory_r56: "Everything for Victory"
  SIA_everything_for_victory_r56_desc: "Whether we desired to be here or not, we have committed ourselves to war efforts. If we are to be held as a strong nation capable of exercising our will, we must treat this conflict with the unyielding resolve that once brought us to greatness. A great [SIA.GetAdjective] kingdom is on the other side of this bloodshed, all that we must do is hold out and fight on for the freedom of all Thai people's!"

  SIA_military_first_policies_r56: "Military-First Policies"
  SIA_military_first_policies_r56_desc: "The politicians and bureaucrats of our nation are the first to flee and last to stand in the name of our homeland. The needs of the military should thus come before these fools should we endure what is to come."
  unlocks_decision_requisition_rice_for_military_use_which_grants_tt: "Unlocks Decision: §YRequisition Rice for Military Use§!, which grants:\n§YFor 140 days:§!\nFactory Output: §G+10.00%§!\nDockyard Output: §G+10.00§!\n\n"
  SIA_requisition_rice_for_military_use_r56: "Requisition Rice for Military Use"
  SIA_requisition_rice_for_military_use_r56_desc: "Although it will bring a degree of disdain, our military would benefit greatly from some of our plentiful rice reserves."
  unlocks_decision_nationalize_foreign_industries_which_grants_tt: "Unlocks Decision: §YNationalize 'Foreign' Industries§!, which grants:"
  SIA_nationalize_foreign_industries_r56: "Nationalize 'Foreign' Industries"
  SIA_nationalize_foreign_industries_r56_desc: "We cannot ever hope to control our own nation if individuals and nations who lack utmost loyalty holds influence over our most vital sectors. We must rectify the damage that internationalism has caused upon us."

