  # Starting Ideas
  SIA_agrarian_society_r56: "Agrarian Society"
  SIA_agrarian_society_r56_desc: "Due to poor progress in, both, mass education and industrial development, a small percentage of the [SIA.GetAdjective] population can read, while little industrial process has occurred. An aggressive transformation, or many years of slow development will be needed to mitigate these effects."

  SIA_rama_viii_r56: "Rama VIII"
  SIA_rama_viii_r56_desc: "Propelled by Rama VII's 1935 abdication, the influence of the [SIA.GetAdjective] monarchy has gone from a state of decline to free fall, leading to discontent among the largely conservative population, while leaving a power vacuum for other areas of the government.\n\nRama VIII is currently too young to hold the throne and is studying abroad in Switzerland. It will take a strong monarch to restore the prominence of the [ROOT.GetAdjective] monarchy and until then, we will be caught with conservative dissent and the opportunism of politicians."

  SIA_state_of_the_civilian_wing_r56: "State of the Civilian Wing"
  SIA_state_of_the_civilian_wing_r56_desc: "The ruling Khana Ratsadon, while largely under the control of the [SIA.GetAdjective] armed forces, still holds an influential civilian wing which represents the nation's western-educated ministers. Although the civilian wing holds many men of varied ideologies, it lies under the de facto leadership of the highly progressive Pridi Banomyong.\n\nReturning to the nation during Phonphayuhasena's premiership in 1934, Pridi Banomyong has been relatively warm with the ruling government, becoming an instrumental force in the modernization of our institutions and diplomacy. If we wish to avoid his sidelining from other ideological forces, we should keep his influence strong."

  SIA_siamese_ultranationalist_movement_r56: "[SIA.GetAdjective] Ultranationalist Movement"
  SIA_siamese_ultranationalist_movement_r56_desc: "Despite our armed forces holding vast power inside the ruling Khana Ratsadon, little stands in the name of ideological unity. Through the influence of the rising Plaek Phibunsongkhram, ultranationalism in the style of Italy and Japan are rapidly gaining traction throughout the country.\n\nCurrently, although Phibunsongkhram is friendly to the ruling government, he is utilizing his role as Minister of Defense to bolster his influence throughout the county. If we wish to avoid being succeeded by his rule, decisive action will be needed to curb his power."

  SIA_sluggish_industrialization_r56: "Sluggish Industrialization"
  SIA_sluggish_industrialization_r56_desc: "While the constitutional government has made leaps in industrializing Bangkok, we remain a largely agrarian nation, and developments to our national economy have been slow. Some argue that we need to take a more active role in our nations economy."

  SIA_high_illiteracy_r56: "High Illiteracy"
  SIA_high_illiteracy_r56_desc: "While the constitutional government has made leaps in this area, many centuries of educational neglect have culminated in [ROOT.GetNameDef] remaining a largely illiterate nation. Significant investments will be needed in order to address this long weakness of our nation."

  SIA_illiteracy_r56: "Illiteracy"
  SIA_illiteracy_r56_desc: "The constitutional government has made massive leaps in providing mass education. While [ROOT.GetAdjective] literacy standards are below those of western Europe, mass education initiatives are bearing fruit, and at this rate we may become a beacon of education in Asia."

  SIA_rapidly_improving_illiteracy_r56: "Rapidly Improving Illiteracy"
  SIA_rapidly_improving_illiteracy_r56_desc: "The constitutional government has made massive leaps in providing mass education. While [ROOT.GetAdjective] literacy standards are below those of western Europe, mass education initiatives are bearing fruit, and soon we will be a beacon of education in Asia."

  # Modified versions of SIA_sluggish_industrialization
  SIA_modest_industrialization_r56: "Modest Industrialization"
  SIA_modest_industrialization_r56_desc: "The constitutional government is making leaps in industrializing the nation. Although we remain a largely agrarian nation, developments to our nation have sped up."

  SIA_heavy_handed_industrialization_r56: "Heavy-Handed Industrialization"
  SIA_heavy_handed_industrialization_r56_desc: "The constitutional government is making heavy leaps in industrializing the nation. Although we remain a largely agrarian nation, developments to our nation are occurring rapidly, which will hopefully bear fruit in industrializing the poorer regions of our country."

  SIA_overzealous_industrialization_r56: "Overzealous Industrialization"
  SIA_overzealous_industrialization_r56_desc: "Industrial policies in the nation have been overzealous, leading to massive economy instability. We will need to shift course if we are to avoid mass chaos."

  SIA_modern_market_economy_r56: "Modern Market Economy"
  SIA_modern_market_economy_r56_desc: "The constitutional government is making leaps in industrializing the nation. While our industrial development is happening slowly, the economy as a whole is one of the fastest growing in the world."

  SIA_modest_mixed_economy_r56: "Modest Mixed Economy"
  SIA_modest_mixed_economy_r56_desc: "The constitutional government is making leaps in industrializing the nation. Industrial development is happening at a decent pace, making our economy as a whole one of the fastest growing in the world."

  SIA_heavy_handed_interventionism_r56: "Heavy-Handed Interventionism"
  SIA_heavy_handed_interventionism_r56_desc: "The constitutional government is making heavy-handed leaps in industrializing the nation. Industrial development is happening at a rapid pace, making our economy as a whole one of the fastest growing in the world, although at the cost of minor instability."

