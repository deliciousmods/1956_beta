  SIA_expand_military_research_r56: "Expand Military Research"
  SIA_expand_military_research_r56_desc: ""

  SIA_scale_up_naval_production_r56: "Scale Up Naval Production"
  SIA_scale_up_naval_production_r56_desc: "[ROOT.GetNameDefCap] is a nation on two seas and we cannot be a power one either of them without a naval force to enforce it. Industrial funds must be put into forging a strong naval industry!"
  SIA_scaling_up_naval_production_r56: "Scaling Up Naval Production"
  SIA_scaling_up_naval_production_r56_desc: "[ROOT.GetNameDefCap] is a nation on two seas and we cannot be a power one either of them without a naval force to enforce it. Industrial funds must be put into forging a strong naval industry!"

  SIA_bolster_aerial_production_r56: "Bolster Aerial Production"
  SIA_bolster_aerial_production_r56_desc: "Aircraft are the future of warfare and the time has come to throw what cards we have into it. With our defensive-suited terrain and the power of modern aircraft on side, who could pose a true threat to our independence?"

  SIA_expand_the_ground_armaments_industry_r56: "Expand the Ground Armaments Industry"
  SIA_expand_the_ground_armaments_industry_r56_desc: ""
  SIA_expanding_the_ground_armaments_industry_r56: "Expanding the Ground Armaments Industry"
  SIA_expanding_the_ground_armaments_industry_r56_desc: ""

  SIA_process_northern_agricultural_exports_r56: "Process Northern Agricultural Exports"
  SIA_process_northern_agricultural_exports_r56_desc: "To this day, the nations economy is still vitally dependent on agricultural resources, and early industrial efforts should reflect this. Before we move on to heavy industries or consumption, we should begin by setting up factories to make economic value off the large agricultural output we make."

  SIA_bangkok_centered_industrial_development_r56: "Bangkok-Centered Industrial Development"
  SIA_bangkok_centered_industrial_development_r56_desc: "Bangkok is the heartland of our nation, being on our important river networks, having vital infrastructure in place and being near the sea for commercial export. We should focus our limited resources on further investments in this vital area so that we can bring southeast Asia its first city on the economic level of the west."

  SIA_support_bangkoks_ongoing_urbanization_r56: "Support Bangkok's Ongoing Urbanization"
  SIA_support_bangkoks_ongoing_urbanization_r56_desc: ""

