  SIA_populist_economic_policies_r56:0 "Populist Economic Policies"
  SIA_populist_economic_policies_r56_desc:0 ""

  SIA_institutional_transformation_r56:0 "Institutional Transformation"
  SIA_institutional_transformation_r56_desc:0 ""

  SIA_asias_democratic_firebrand_r56:0 "Asia's Democratic Firebrand"
  SIA_asias_democratic_firebrand_r56_desc:0 "Siam is at a crossroads that many leaders have experienced before us. Where many would consolidate power under the guise of 'preparing' their nation for ideological goals, we shall give the people a taste of the freedom we fight and die for. The [SIA.GetAdjective] shall be the freest men in the east!"

