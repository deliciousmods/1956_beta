  # DIPLOMACY FOCUS'S
  SIA_negotiation_with_the_old_powers_r56:0 "Negotiation With the Old Powers"
  SIA_negotiation_with_the_old_powers_r56_desc:0 "The old powers have seen victory, and have subsequently overstretched themselves in their colonial empires. This makes them a lower threat than ever to our independence, and it may even be possible to see a negotiated transfer of some recently 'lost' territories."

  SIA_move_against_asias_growing_threat_r56:0 "Move Against Asia's Growing Threat"
  SIA_move_against_asias_growing_threat_r56_desc:0 ""

  SIA_peace_with_the_western_order_r56:0 "Peace With the Western Order"
  SIA_peace_with_the_western_order_r56_desc:0 "The nations of the west have achieved supremacy in the pacific, just as they had once more. [SIA.GetNameDefCap], with our flexible diplomatic policies, is ready to become an equal of the west in this new, familiar world order."

  SIA_join_the_united_nations_r56:0 "Join the United Nations"
  SIA_join_the_united_nations_r56_desc:0 ""

  SIA_take_to_the_disputed_territories_r56:0 "Take to the Disputed Territories"
  SIA_take_to_the_disputed_territories_r56_desc:0 ""

  SIA_strengthen_regional_cooperation_r56:0 "Bolster Regional Cooperation"
  SIA_strengthen_regional_cooperation_r56_desc:0 "Our dependence on the action of the great powers is a weakness we should move away from. The time has come to work towards a future where we Asians are dependent on ourselves, not the west!"

  SIA_address_our_newly_independent_neighbors_r56:0 "Address Our Newly Independent Neighbors"
  SIA_address_our_newly_independent_neighbors_r56_desc:0 "Recent events have placed new, truly independent Asian nations on our doorstep. We must make clear what our plans are for these nations."

  SIA_towards_a_colonialist_free_asia_r56:0 "Towards a Colonialist-Free Asia"
  SIA_towards_a_colonialist_free_asia_r56_desc:0 "The last century has not been good to the so-called 'great powers' of the world. We should move past needing the Chinese, British, or any other supposed great power to come. As one of Asia's only free nations, we are in prime position to bring southeast-Asia under its rightful rulers!"
  SIA_southeast_asia_league:0 "Southeast Asia League"

  SIA_leaders_of_a_free_southeast_asia_r56:0 "Leaders of a Free Southeast-Asia"
  SIA_leaders_of_a_free_southeast_asia_r56_desc:0 "[SIA.GetNameDefCap] is once more a leading force among the nations of southeast-Asia. Together, we shall achieve not only survival, but progress amidst the horrors consuming the world."

  SIA_fulfill_chulaloks_legacy_r56:0 "Fulfill Chulalok's Imperial Legacy"
  SIA_fulfill_chulaloks_legacy_r56_desc:0 "We have done what so many call impossible: [SIA.GetNameDef] once more holds total supremacy in southeast-Asia. This feat shall become a point of celebration for years to come!"

  SIA_the_non_aligned_movement_r56:0 "The Non-Aligned Movement"
  SIA_the_non_aligned_movement_r56_desc:0 "With [SIA.GetNameDef] having made itself a respected power in east-Asia once again, it is time that we move to solidify our place as an equal power that is loyal to nobody else. The idea for a non-aligned movement represents this true interest of ours."

  SIA_look_to_the_rising_powers_r56:0 "Look to the Rising Powers"
  SIA_look_to_the_rising_powers_r56_desc:0 "If southeast Asia is to ever become truly independent from the European powers, we must pivot our focus to the powers encompassing the Asia-pacific region, most notably: Japan and the United States of America."

  SIA_establish_ties_with_the_new_china_r56:0 "Establish Ties With the New China"
  SIA_establish_ties_with_the_new_china_r56_desc:0 ""

  SIA_strengthen_japanese_ties_r56:0 "Strengthen [JAP.GetAdjective] Ties"
  SIA_strengthen_japanese_ties_r56_desc:0 ""

  SIA_navigate_asias_new_order_r56:0 "Navigate Asia's New Order"
  SIA_navigate_asias_new_order_r56_desc:0 "At the hands of a 'rising' power, the colonial powers have been kicked out of east-Asia, leaving behind a power vacuum that we must make a part for ourselves in."

  # Mend the Fragmented Khana Ratsadon (Early Game Politics)
  SIA_mend_the_fragmented_khana_ratsadon_r56:0 "Mend the Fragmented Khana Ratsadon"
  SIA_mend_the_fragmented_khana_ratsadon_r56_desc:0 "Despite the years that have gone by since the 1932 coup, [SIA.GetAdjective] society is still in an uncertain place. As the ruling Phahon Phonphayuhasena ages, and as militarists, traditionalists and liberals battle for influence in the People's Assembly, we must work to decide what the future of our nation shall look like."

  SIA_the_question_of_the_monarchy_r56:0 "The Question of the Monarchy"
  SIA_the_question_of_the_monarchy_r56_desc:0 "Prajadhipok's 1935 abdication is still a recent shock that threatens the popular support and stability of the state. With his legitimate heir, Mahidol, still abroad, and the people demanding answers, it is time to address the long-term fate of the [SIA.GetAdjective] monarchy."

  SIA_crown_property_bureau_r56:0 "Crown Property Bureau"
  SIA_crown_property_bureau_r56_desc:0 "Corruption and excess spending in the royal family has plagued the finances of the state. Setting up a sector of the government to monitor and manage these finances would go a long way in preventing yet another financial disaster."

  SIA_towards_a_depoliticized_army_r56:0 "Towards a Depoliticized Army"
  SIA_towards_a_depoliticized_army_r56_desc:0 "Phibunsongkhram's plans to promote aggressive nationalism among the army is a dangerous ambition that threatens the balance of our government. [SIA.GetNameDefCap] requires a strong army, but we are not to become an army with a state."
  SIA_siamese_ultranationalist_movement_weakened_r56_desc:0 "Despite the [SIA.GetAdjective] armed forces holding vast power inside the ruling Khana Ratsadon, little stands in the name of ideological unity. Through the influence of the rising Plaek Phibunsongkhram, ultranationalism in the style of Italy and Japan has gained notable traction throughout the country.\n\nDue to recent moves against him by the prime minister [SIA.GetLeader], Phibunsongkhram has become hostile to the ruling government, as his former role as minister of defense has been passed elsewhere to his detriment."

  SIA_civil_service_reform_r56:0 "Civil Service Reform"
  SIA_civil_service_reform_r56_desc:0 "Pridi Banomyong is one of our greatest civil servants, and is the de-facto leader of the Khana Ratsadon's civilian-government proponents. If we are to become a modern nation, we should at least look into his proposals for reform."

  SIA_improve_national_education_r56:0 "Improve National Education"
  SIA_improve_national_education_r56_desc:0 ""

  SIA_PLACEHOLDER_r56:0 "PLACEHOLDER"
  SIA_PLACEHOLDER_r56_desc:0 ""

  SIA_PLACEHOLDE_2_r56:0 "PLACEHOLDER"
  SIA_PLACEHOLDE_2_r56_desc:0 ""

  SIA_military_led_nation_building_r56:0 "Military-Led Nation-Building"
  SIA_military_led_nation_building_r56_desc:0 "Phibunsongkhram is one of our greatest officers, and is the de-facto leader of the Khana Ratsadon's militaristic movement, where he has slowly been moving to centralize, modernize and militarize the state. With threats on the horizon, we should look into his proposals for the nation."

  SIA_strengthen_the_youth_corps_r56:0 "Strengthen the Youth Corps"
  SIA_strengthen_the_youth_corps_r56_desc:0 "Many of the modern European states we look to have forged a culture of loyalty and devotion inside their armed forces, particularly by instilling militaristic fervor in the growing minds of their nations through youth programs. Perhaps it is time for [SIA.GetNameDef] to have a youth corps of its own."

  SIA_propagandize_the_six_principles_r56:0 "Propagandize the Six Principles"
  SIA_propagandize_the_six_principles_r56_desc:0 "The reasons that our 1933 revolution was a necessity are still unknown among much of our population. Through our monopoly on state propaganda, all shall know the values we fight and die for."

  SIA_engineer_corps_public_works_r56:0 "Engineer Corps Public Works"
  SIA_engineer_corps_public_works_r56_desc:0 "Much of the [SIA.GetAdjective] countryside remains underdeveloped. Our disciplined engineer corps could perhaps play a role in projects that would modernize these parts of the country."

  SIA_phahon_steps_down_r56:0 "Phahon Steps Down"
  SIA_phahon_steps_down_r56_desc:0 "While we forever thank him for his service to the nation, it is clear that the time has come for a new leader to guide the Khana Ratsadon forward. With the world rapidly moving towards war once more, we must choose carefully who can carry on, and push forward much-needed reforms."
  SIA_phahon_steps_down_r56_tt:0 "When §YPhahon Steps Down§! in §YDecember 1938§!, this focus will automatically be completed"

  #Songsuradet - Moderately Traditionalist -> Authoritarian / Democracy
  SIA_songsuradets_ascendency_r56:0 "Songsuradet's Ascendency"
  SIA_songsuradets_ascendency_r56_desc:0 "Although Songsuradet has long lacked interest in taking power, the situation that [SIA.GetNameDef] has entered calls for strong, modest authority. The modernization of the nation shall continue, this time, under our wise watch!"

