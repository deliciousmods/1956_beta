  # Mending Siamese Irredentism Decisions
  SIA_mending_siamese_irredentism_r56: "Mending [SIA.GetAdjective] Irredentism"
  SIA_mending_siamese_irredentism_r56_desc: "Seeing the futility of armed resistance, King Chulalongkorn the Great, where many others would defy, signed over a multitude of territorial concessions from the nation's sphere of influence, awarding the British and French considerable territorial concessions while maintaining the independence of our heartland.\n\nWith our nation undergoing decades of modernization, while the colonial powers overstretch themselves in their global empires, perhaps we can rally behind our losses, and with their reversal: foster a new [SIA.GetAdjective] golden era!"

  SIA_restore_siamese_rule_in_lan_chang_r56: "Restore [SIA.GetAdjective] Rule in [926.GetName]"
  SIA_restore_siamese_rule_in_lan_chang_r56_desc: "Ceded to Paris's control in the Franco-Siamese Treaty of 1904, [926.GetName] province has since lied under the control of the French protectorate of Laos. Due to the province's low population, linguistic unity and recent memory of being under our realm, its reintegration should be a simple feat!"

  SIA_restore_siamese_rule_in_champasak_r56: "Restore [SIA.GetAdjective] Rule in [924.GetName]"
  SIA_restore_siamese_rule_in_champasak_r56_desc: "Ceded to Paris's control in the Franco-Siamese Treaty of 1904, [924.GetName] province has since lied under the control of the French protectorate of Laos. Due to the province's low population, linguistic unity and recent memory of being under our realm, its reintegration should be a simple feat!"

  SIA_proclaim_the_reintegration_of_laos_r56: "Proclaim the Reintegration of Laos"
  SIA_proclaim_the_reintegration_of_laos_r56_desc: "The Laotian-speaking lands on the eastern bank of the Mekong were ceded to French authority following the 1893 Franco-Siamese crisis, being arguably the most significant territorial loss during Chulalongkorn's years. While these lands were never under Bangkok's direct control, linguistic unity and the spirit of anti-western colonialism will surely propel Laos right into our virtuous hands!"

  SIA_proclaim_the_reintegration_of_inner_cambodia_r56: "Proclaim the Reintegration of Inner-Cambodia"
  SIA_proclaim_the_reintegration_of_inner_cambodia_r56_desc: "The 1907 Franco-Siamese treaty saw the ceding of Siam's Inner-Cambodia region, which lost us access to many prestigious sites, the important city of Angkor, and the critical Tonlé Sap freshwater lake. While the region lacks a significant Thai-speaking population, its loss is in recent memory, while having considerable strategic and economic purposes."

  SIA_reclaim_the_salweens_northeast_bank_r56: "Reclaim the Salween's Northeast Bank"
  SIA_reclaim_the_salweens_northeast_bank_r56_desc: "Although we forced to withdraw our claim over the eastern bank of the Salween to the benefit of British India, it was a historic part of the Lan Na kingdom who was absorbed into Siam, also being home to many speakers of the Tai Shan language. With this rightful territory under our control, its integration shall finally commence!"

  SIA_irredentist_claims_in_malaya_r56: "Irredentist Claims in Malaya"
  SIA_irredentist_claims_in_malaya_r56_desc: "In our times of weakness, we were all but forced to cede minor territories in the Kra isthmus. With it under our control, it shall be brought back into our righteous hands!"

  SIA_solidify_control_in_laos_r56: "Solidify Control in Laos"
  SIA_solidify_control_in_laos_r56_desc: "While there remains some discontent against our rule, we have largely quelled armed resistance and built limited support for our administration in Laos. With these facts clear, there is little reason to halt integrating this vital land."

  SIA_solidify_control_in_shanland_r56: "Solidify Control in [1018.GetName]"
  SIA_solidify_control_in_shanland_r56_desc: "While there remains some discontent against our rule, we have largely quelled armed resistance and built limited support for our administration in [1018.GetName] province. With these facts clear, there is little reason to halt integrating this vital land."

  SIA_offer_inner_cambodia_provincial_autonomy_r56: "Offer Inner-Cambodia Provincial Autonomy"
  SIA_offer_inner_cambodia_provincial_autonomy_r56_desc: "If we are to establish peace in the region of Inner-Cambodia, we must respect the customs of its people and abandon attempts at forced assimilation. By living alongside our people long enough, surely they will consider themselves [SIA.GetAdjective] eventually."

  SIA_offer_shanland_provincial_autonomy_r56: "Offer [1018.GetName] Provincial Autonomy"
  SIA_offer_shanland_provincial_autonomy_r56_desc: "Although there exists a degree of sympathy for our rule in [1018.GetName], much of the popular clings onto their ethnolinguistic identity. We should end regional policies of assimilation, and instead work towards an order where the local population is integrated, yet autonomous and free to practice their customs."

  SIA_crush_dissent_in_inner_cambodia_r56: "Crush Dissent in Inner-Cambodia"
  SIA_crush_dissent_in_inner_cambodia_r56_desc: "While there remains widespread discontent against our rule, we can overpower armed resistance and build tolerance for our administration in inner-Cambodia. With these facts clear, there is little reason to halt integrating this vital land."

  SIA_offer_laos_provincial_autonomy_r56: "Offer Laos Provincial Autonomy"
  SIA_offer_laos_provincial_autonomy_r56_desc: "Although there exists a degree of sympathy for our rule in Laos, much of the popular clings onto their ethnolinguistic identity. We should end regional policies of assimilation, and instead work towards an order where the local population is integrated, yet autonomous and free to practice their customs."

  #Finding a Path Forward Decisions
  SIA_finding_a_path_forward_r56: "Finding a Path Forward"
  SIA_finding_a_path_forward_r56_desc: "While many men of varied ideologies and talents took up arms in cooperation against the royal dictatorship, little today stands in unity between [SIA.GetAdjective] constitutional revolutionaries.\n\nWith instability and a power vacuum visible to all, we must move wisely against threats to our rule, and carve out a clear, prosperous future for all [SIA.GetAdjective] people!"

  SIA_phahon_phonphayuhasena_steps_down_r56: "Phahon Phonphayuhasena Steps Down"
  SIA_phahon_phonphayuhasena_steps_down_r56_desc: "Phahon Phonphayuhasena, due to many rumored reasons from failing health to lack of ambition to rule, is likely not to remain as Prime Minister of [SIA.GetNameDef] for long.\n\nWhether we wish to preserve Phahon's modest reforms, or move away from his compromising nature will be decided by these later years of his rule"

  #Legacy Ideas Only Used on Other Tags:

  SIA_anti_fascism: "Anti Fascism"
  SIA_anti_fascism_desc: "Fascism is a great evil that threatens the order and freedom of all Asians. Even if nobody is with us, and even to the end, we shall be a beacon against the fascist menace!"

  SIA_rama_vii_constitutional: "Rama VII"
  SIA_rama_vii_constitutional_desc: ""

  SIA_loyal_army: "Loyal Army"
  SIA_loyal_army_desc: "Through recent purges in our armed forces, we have created a staunchly loyal, decisive army who will protect our rule. Our plans for the nation shall not go opposed!"

  SIA_centralised_production: "Centralized Production"
  SIA_centralised_production_desc: "By centralizing the management of the economy, we will ensure that resources are properly allocated for the benefit of the nation."

  SIA_state_invervention: "State Intervention"
  SIA_state_invervention_desc: "State intervention in the economy is necessary to avoid the exploitation of the weakest by the strongest. Laws protecting workers with benefits will be put in place"

  # NAVY FOCUSES
  SIA_prepare_a_naval_expansion_r56: "Prepare a Naval Expansion"
  SIA_prepare_a_naval_expansion_r56_desc: "[SIA.GetNameDefCap] is surrounded on all sides by greater naval powers. While we can never hope to take on every potential rival simultaneously, we should at the very least ensure that we are capable of holding our own as a regional naval power."

  SIA_develop_the_southern_bases_r56: "Develop the Southern Bases"
  SIA_develop_the_southern_bases_r56_desc: "We are Asia's natural base between India, China, the resources of Malaya and the Pacific. We should utilize our vital geography and construct the infrastructure needed to supply our troops in the troubles to come."

  SIA_incorporate_allied_radar_designs_r56: "Incorporate Allied RADAR Designs"
  SIA_incorporate_allied_radar_designs_r56_desc: "Our allies have made impressive progress in the development of modern RADAR technology. As a nation many decades behind in this vital research, we should look to acquiring foreign designs from our closest allies."

  SIA_prioritize_domestic_radar_research_r56: "Prioritize Domestic RADAR Research"
  SIA_prioritize_domestic_radar_research_r56_desc: "We have learned of worryingly fast development of RADAR by western nations. If we are to not fall behind, we must do all that we can to catch up in this vital area!"

  SIA_acquire_japanese_torpedoes_r56: "Acquire [JAP.GetAdjective] Torpedoes"
  SIA_acquire_japanese_torpedoes_r56_desc: "[JAP.GetNameDefCap] is on a path towards being the Pacific ocean's strongest naval power, and their aggressive submarine and naval bomber designs will play a big role in that. As a minor power with little naval industry, we should seek to acquire these weapons of asymmetrical naval warfare."

  SIA_expand_the_marine_corps_department_r56: "Expand the Marine Corps Department"
  SIA_expand_the_marine_corps_department_r56_desc: "Regardless of whether we are to become an advanced ground or naval power, [SIA.GetNameDef] must have the capacity to wage wars across the rivers and ocean that lays between us and our enemies."

  SIA_begin_limited_shipbuilding_r56: "Begin Limited Shipbuilding"
  SIA_begin_limited_shipbuilding_r56_desc: "We have come far in putting funds towards the development of a modern navy, but it will not count for much if we continue to lack the industry for modern shipbuilding. We should put efforts toward establishing a proper but humble shipbuilding industry on our southern coast."

  SIA_modernize_the_central_repair_facilities_r56: "Modernize the Central Repair Facilities"
  SIA_modernize_the_central_repair_facilities_r56_desc: "Our eastern coast is likely to see most of our action in any conflict. We should ensure that we have the proper capabilities to repair ships who are damaged in battle without clogging up future production."

  SIA_form_a_modern_sattahip_engineering_facility_r56: "Form a Modern Sattahip Engineering Facility"
  SIA_form_a_modern_sattahip_engineering_facility_r56_desc: "Our Sattahip Bay naval base is a vital part of our southern gulf defenses, and they will become a vital part in supplying our navy in the event of war. We should form a modern engineering facility in this vital location so that we may exploit any technological developments to our advantage."

  SIA_look_to_modern_heavy_ships_r56: "Look to Modern Heavy Ships"
  SIA_look_to_modern_heavy_ships_r56_desc: "While we lack the industry to support a gargantuan navy, surely we will require a few heavy ships of our own to defend our prestige and enforce our interests in the Malaccan straits, should we have to."

  SIA_study_modern_naval_guns_r56: "Study Modern Naval Guns"
  SIA_study_modern_naval_guns_r56_desc: "[JAP.GetNameDefCap] and several western nations have developed impressive naval weapons for destroying the armor on modern ships. We should study these weapons to see if we can develop suitable alternatives."

  SIA_develop_anti_submarine_tools_r56: "Develop Anti-Submarine Tools"
  SIA_develop_anti_submarine_tools_r56_desc: "Despite much of the world moving towards autarky, we like many others would be left in crisis should a submarine power blockade our seas. [ENG.GetNameDefCap] and [USA.GetNameDef] have developed impressive tools for detecting and combatting enemy submarines, and we should seek to incorporate them into our own fleet."

  SIA_look_to_agile_surface_ships_r56: "Look to Agile Surface Ships"
  SIA_look_to_agile_surface_ships_r56_desc: "Light ships have seen perhaps the most impressive of developments since the days of the Great War, hosting guns capable of bringing down the biggest of ships, while being agile and suited for mass-production. Perhaps we should look to acquiring designs for our use."

  SIA_import_modern_heavy_ships_r56: "Import Modern Heavy Ships"
  SIA_import_modern_heavy_ships_r56_desc: "If we are to be a major power in our seas, we require a fleet capable of protecting our presence. We shall order and work to forge gargantuan ships, and with them: become a true naval power on both, our Pacific and Indian coasts."
  SIA_the_royal_siamese_navy_r56: "[GetSiamRoyalStatus_r56] [ROOT.GetAdjective] Navy"
  SIA_the_royal_siamese_navy_r56_desc: ""

  SIA_develop_modern_escorts_r56: "Develop Modern Escorts"
  SIA_develop_modern_escorts_r56_desc: "No amount of preparation or heavy-handed autarky can fully eliminate our dependence on international trade. If our economy is to survive the coming war, we must work to modernize our convoy escort systems and tactics."

  SIA_prepare_coastal_minelaying_operations_r56: "Prepare Coastal Minelaying Operations"
  SIA_prepare_coastal_minelaying_operations_r56_desc: "Our close proximity to the Malaccan strait, and coastal threat from two sides necessitates us using all means to deter a threat by amphibious force. We should prepare minelaying operation to keep invaders at bay."

  SIA_acquire_cheap_raiding_ships_r56: "Acquire Cheap Raiding Ships"
  SIA_acquire_cheap_raiding_ships_r56_desc: "While we lack the economic power to produce a large conventional fleet, our position near the Malaccan strait makes us uniquely advantaged to replicate German submarine strategies. We should acquire cheap submarine designs, and see how we can further improve them to match our needs."

  SIA_develop_submarine_facilities_r56: "Develop Submarine Facilities"
  SIA_develop_submarine_facilities_r56_desc: "We have made important technological breakthroughs in submarine technology, but we lack the industry to use it. We must rectify this immediately."

  SIA_specialized_utility_submarines_r56: "Specialized Utility Submarines"
  SIA_specialized_utility_submarines_r56_desc: "Submarines are one tool of many in our fight to control our waters. By investing in specialized designs for ranged operations, we can improve coordination with other segments of our navy."
  SIA_specialized_submarine_production_r56: "Specialized Submarine Production"
  SIA_specialized_submarine_production_r56_desc: ""

  SIA_standardized_mass_production_r56: "Standardized Mass Production"
  SIA_standardized_mass_production_r56_desc: "If we are to deter a war in our waters, we must fully commit all naval industry resources toward a massive submarine fleet capable of imposing terror on any nation dependent on trade through our seas."
  SIA_mass_submarine_production_r56: "Mass Submarine Production"
  SIA_mass_submarine_production_r56_desc: "If we are to deter a war in our waters, we must fully commit all naval industry resources toward a massive submarine fleet capable of imposing terror on any nation dependent on trade through our seas."

  # AIR FORCE FOCUSES
  SIA_separate_the_royal_aeronautical_service_r56: "Separate the Royal Aeronautical Service"
  SIA_separate_the_royal_aeronautical_service_r56_desc: "Aviation developments have already shown themself to be a pivotal component in the future of warfare. Just as the western powers are, [ROOT.GetNameDef] must develop a strong and modern air force if we are to be taken seriously on the world stage."
  SIA_the_siamese_air_force: "[GetSiamRoyalStatus_r56] [ROOT.GetAdjective] Air Force"
  SIA_the_siamese_air_force_desc: "A modern army calls for a modern air force to protect and support its actions on the battlefield. The [GetSiamRoyalStatus_r56] [ROOT.GetAdjective] Air Force shall do just that for [ROOT.GetNameDef]!"

  SIA_parachute_infantry_battalion_r56: "Parachute Infantry Battalion"
  SIA_parachute_infantry_battalion_r56_desc: "Some modern militaries are experimenting with airborne infantry special forces known as paratroopers. We should experiment with this form of special forces."

  SIA_establish_a_chiang_mai_military_academy_r56: "Establish a Chiang-Mai Military Academy"
  SIA_establish_a_chiang_mai_military_academy_r56_desc: ""
