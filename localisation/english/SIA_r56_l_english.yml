  l_english:
  siamese_r56_focus_tree: "Siamese Focus Tree"
  SIA_GATHERING_STORM_r56_DESC: "In 1932, after centuries of absolute rule, a vanguardist coalition of senior officers, nationalist and liberal forces staged a coup d'état against the royal government, forcing a constitution upon Rama VII under the authority of the Khana Ratsadon (People's Party).\n\nThe revolution quickly grew divided and in 1934, royalist counterrevolution struck, eventually being defeated by ultranationalist Minister of Defense Phibunsongkhram, bringing him to the center-stage. With tensions across east-Asia and Rama VII's 1935 abdication for a child successor, can Phahon's regime restore stability to Siam?"

  # AI Strategy Plans
  SIA_historical_phibuns_takeover_r56: "§YHistorical§!: §8Phibun's Takeover§!"
  SIA_historical_phibuns_takeover_r56_desc: "Following Phahon's resignation as prime minister, the People's Assembly will empower Plaek Phibunsongkhram, who will implement ultranationalist policies at home, balancing foreign influence, and making territorial gains abroad."

  SIA_songsuradets_conservative_regime_r56: "§gSongsuradet's Conservative Regime§!"
  SIA_songsuradets_conservative_regime_r56_desc: "Following Phahon's resignation as prime minister, the People's Assembly will empower Phraya Songsuradet, who will reverse many of Pridi Banomyong's liberal reforms while elevating the monarchy; consolidating Siam as conservative and authoritarian at home, while working with the international community abroad."

  SIA_songsuradet_restores_elections_r56: "§2Songsuradet Restores Elections§!"
  SIA_songsuradet_restores_elections_r56_desc: "Following Phahon's resignation as prime minister, the People's Assembly will empower Phraya Songsuradet, who will blend traditionalist and democratic forces to create a modest, democratic Siam, while working to foster ties in the international community."

  SIA_pridis_democratic_firebrand_r56: "§4Pridi's Democratic Firebrand§!"
  SIA_pridis_democratic_firebrand_r56_desc: "Following Phahon's resignation as prime minister, the People's Assembly votes in Pridi Banomyong, who will usher in a democratic transformation that works with the international community in the name of collective interest."

  SIA_pridi_prioritizes_national_reform_r56: "§tPridi Prioritizes National Reform§!"
  SIA_pridi_prioritizes_national_reform_r56_desc: "Following Phahon's resignation as prime minister, the People's Assembly votes in Pridi Banomyong, who will limit prior commitments toward national democracy in favor of socioeconomic modernization policies — forging a new Siam who can bear the difficulties of tomorrow in cooperation with the international community."

