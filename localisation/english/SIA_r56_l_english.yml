  SIA_prepare_a_defense_of_the_nation_r56_desc: ""

  SIA_end_the_regency_r56: "End the Regency"
  SIA_end_the_regency_r56_desc: ""

  SIA_deal_with_the_armed_forces_r56: "Deal With the Armed Forces"
  SIA_deal_with_the_armed_forces_r56_desc: ""

  SIA_sideline_the_traditionalists_r56: "Sideline the Traditionalists"
  SIA_sideline_the_traditionalists_r56_desc: ""

  SIA_rewrite_the_1932_constitution_r56: "Rewrite the 1932 Constitution"
  SIA_rewrite_the_1932_constitution_r56_desc: "With Phahon's fall from power, and with the nation once more under our hopeful watch, the time has come to review the state of the nation and once more ask ourselves what our best path forward is."

  SIA_hold_national_elections_r56: "Prepare National Elections"
  SIA_hold_national_elections_r56_desc: ""

  SIA_reconciliation_with_the_royal_family_r56: "Reconciliation With the Royal Family"
  SIA_reconciliation_with_the_monarchy_r56_desc: "Although we have our differences, the abdication of Prajadhipok heavily empowered [SIA.GetAdjective] militarists while furthering rural disdain for our rule. We should attempt to settle our differences with the former king; offering a return to his ceremonial rule is our first step to doing that."

  SIA_erode_the_monarchies_power_r56: "Erode the Monarchies Power"
  SIA_erode_the_monarchies_power_r56_desc: "Shortly following the 1933 revolution, Prajadhipok and his traditionalist allies were the strongest opponents of any meaningful reform. With the monarchy weaker than ever, we should use this time to bring progress and justice to the nation!"
  unlocks_decision_levy_additional_taxes_on_royal_wealth_which_grants_tt: "Unlocks Decision §YLevy Additional Taxes on Royal Wealth§!, which grants:"
  SIA_levy_additional_taxes_on_royal_wealth_r56: "Levy Additional Taxes on Royal Wealth"
  SIA_levy_additional_taxes_on_royal_wealth_r56_desc: ""

  SIA_prioritize_socioeconomic_progress_r56: "Prioritize Socioeconomic Progress"
  SIA_prioritize_socioeconomic_progress_r56_desc: "Perhaps, as experienced by many leaders before us, our goals for a rapid democratic transition were too lofty for [SIA.GetAdjective] society. Before we can act as a democratic nation of the west, we must fight to enshrine national education, industrialize [SIA.GetAdjective] society and create a public who is ready for modern political institutions."

  SIA_equality_under_our_law_r56: "Equality Under Our Law"
  SIA_equality_under_our_law_r56_desc: ""

  SIA_bottom_up_societal_modernization_r56: "Bottom-Up Societal Modernization"
  SIA_bottom_up_societal_modernization_r56_desc: ""

  SIA_industrial_workers_reforms_r56: "Industrial Workers Reforms"
  SIA_industrial_workers_reforms_r56_desc: ""

  SIA_improve_rural_living_standards_r56: "Improve Rural Living Standards"
  SIA_improve_rural_living_standards_r56_desc: ""

  SIA_populist_economic_policies_r56: "Populist Economic Policies"
  SIA_populist_economic_policies_r56_desc: ""

  SIA_institutional_transformation_r56: "Institutional Transformation"
  SIA_institutional_transformation_r56_desc: ""

  SIA_maintain_the_fire_r56: "Maintain the Fire"
  SIA_maintain_the_fire_r56_desc: ""

  SIA_forge_a_democratic_legacy_r56: "Forge a Democratic Legacy"
  SIA_forge_a_democratic_legacy_r56_desc: ""

  SIA_hold_national_elections_r56: "Hold National Elections"
  SIA_hold_national_elections_r56_desc: ""

  SIA_asias_democratic_firebrand_r56: "Asia's Democratic Firebrand"
  SIA_asias_democratic_firebrand_r56_desc: "Siam is at a crossroads that many leaders have experienced before us. Where many would consolidate power under the guise of 'preparing' their nation for ideological goals, we shall give the people a taste of the freedom we fight and die for. The [SIA.GetAdjective] shall be the freest men in the east!"

  SIA_end_siams_political_woes_r56: "End Siam's Political Woes"
  SIA_end_siams_political_woes_r56_desc: ""

  #Phibungsongkhram - Fascist
  SIA_phibuns_takeover_r56: "Phibun's Takeover"
  SIA_phibuns_takeover_r56_desc: "Between increasing domestic tensions and a return to international conflicts, we are at a crossroads which we must navigate under strong leadership. Phibunsongkhram has defended our revolution before against the reactionary Boworadet Rebellion, and has had a vital role in improving our military readiness. The time has come to appoint him, and show [SIA.GetNameDef]'s resolve on the world stage!"
  SIA_phibuns_takeover_r56_tt: "Selectable via Event §YElections in the People's Assembly§! if §8Fascism§! support is 30% or higher."

  SIA_siamese_national_banking_bureau_r56: "[SIA.GetAdjective] National Banking Bureau"
  SIA_siamese_national_banking_bureau_r56_desc: "Despite the work done, we are still decades behind Europe in societal and economic development. Modern banking institutions are the start of a modern economic plan that can give us the resources to bring our nation up to par with the west."

  SIA_push_for_universal_education_r56: "Push for Universal Education"
  SIA_push_for_universal_education_r56_desc: "While we have done much to elevate education across [SIA.GetAdjective], access is still highly unequal, to the detriment of our rural provinces. We should make universal, centralized national education a goal for the near-future across the entirety of our nation."

  SIA_towards_national_autarky_r56: "Towards National Autarky"
  SIA_towards_national_autarky_r56_desc: "As war reaches Asia, we cannot afford a dependency on the nations of Europe or anywhere else. We must be able to produce all that which our economy depends on."

  SIA_escalate_industrial_policy_r56: "Escalate Industrial Policy"
  SIA_escalate_industrial_policy_r56_desc: "The pace of our industrialization has been unacceptable. If we are to become a modern nation, we must replicate the accomplishment of other powers and utilize national capital to further the development of modern factories."

  SIA_improve_the_siamese_countryside_r56: "Improve the [SIA.GetAdjective] Countryside"
  SIA_improve_the_siamese_countryside_r56_desc: "The rapidly modernizing Bangkok is completely at odds with the impoverished, agriculture-dependent northern half of our country. We must do what we can to improve the efficiency and livelihoods of our rural brothers."
  SIA_local_industrial_boom_r56: "Local Industrial Boom"

  SIA_solidify_governmental_control_r56: "Solidify Governmental Control"
  SIA_solidify_governmental_control_r56_desc: "If we are to become a major power in Asia, we must destroy any idea that meaningful opposition to our national plans will be tolerated. All who seek to destroy the glory of our nation must be wiped out for the good of [SIA.GetNameDef]!"
  SIA_r56.20.title: "Securing the Khana Ratsadon"
  siam_r56.20.desc: "With the premiership secured, the time has come to bring stability to [SIA.GetNameDef]. Opposition can be found in all areas of the government, and it is concentrated in two main fronts:\n\nFirstly, the senior military that is loosely led by Phraya Songsuradet, who has a history of reactionary social and economic policies that means natural opposition to our proposed reforms. They are similarly disliked by Pridi and his reformist allies for their roadblocking of his national plans.\n\nOn the other hand, talented liberal Pridi Banomyong still remains at the center stage, and has some history of compromise with Phahon; although his liberal tendencies means he will likely resist many of our nationalistic reforms. We can also leverage his unpopularity with the senior military, who considers him nothing less than a communist, in order to bring them under our cause "in the name of eradicating [SIA.GetAdjective] Marxism".\n\nWe have the political capital and popularity to bring an end to one of these men. The only question that remains is, which faction can stand at our side as we reclaim our national glory?"
  siam_r56.20.a: "Unlike Pridi and his allies, Songsuradet's reactionary wing has no use to us."
  SIA_compromised_modernization_front_r56: "Compromised Modernization Front"
  SIA_compromised_modernization_front_r56_desc: "While we stand at odds with each other, the civilian wing is home to some of Thailand's best and brightest. It would be a shame to lose them in the nation's moment of need for bright, strong men."
  siam_r56.20.b: "Pridi's reforms threaten the needs of the state. We must rally the senior military against him."
  SIA_united_front_against_socialism_r56: "United Front Against Socialism"
  SIA_united_front_against_socialism_r56_desc: "While we stand at odds with each other, we, unlike the specter of communism, do not seek to throw off the established order in favor of madness and chaos. Surely, we can find some semblance of common cause with traditionalists inside our government."

  SIA_towards_a_great_thai_empire_r56: "Towards a Great [SIA.GetAdjective] Empire"
  SIA_towards_a_great_thai_empire_r56_desc: "Siamese nationalism has seen a gradual rise since the beginning of Chulalongkorn's reign, but we can make it something better. Despite what anyone may say, our nation was forged and belongs to Thai speakers of our culture, of which, many are tragically outside the 'Siamese' borders. We must emphasize our ethnolinguistic identity, and with it: forge an empire that is an equal to the west!"

  SIA_weaken_the_feudalist_institutions_r56: "Weaken the Feudalist Institutions"
  SIA_weaken_the_feudalist_institutions_r56_desc: "With our path to proper nationhood started, we must address the need for modernization. As a nation in the shadows of Kemalist Turkey and Meiji Japan, we have a plethora of national policies that we can modify to address the nation's unique circumstances. No matter what, we must keep moving forward."
  SIA_towards_a_great_thai_empire_r56_timer_tt: "Has completed another focus in the §YTowards a Great [SIA.GetAdjective] Empire§! subbranch less than 70 days ago\nCurrent days are: [?SIA_towards_a_great_thai_empire_r56_timer_flag:days|Y0]"

  SIA_enact_nationalist_policies_r56: "Enact Nationalist Policies"
  SIA_enact_nationalist_policies_r56_desc: "While much of the nation resonates with the ideals of [SIA.GetAdjective] nationalism, that is hardly enough to make our nation truly thrive. We must implement domestic policies that promote the status of our new identity."
  SIA_tax_anti_thai_foreign_businesses_r56: "Tax 'Anti-[SIA.GetAdjective]' Foreign Businesses"
  SIA_tax_anti_thai_foreign_businesses_r56_desc: ""

  SIA_tighten_the_dictatorship_r56: "Tighten the Dictatorship"
  SIA_tighten_the_dictatorship_r56_desc: "Our policies of national centralization are paying off. The time has come to further the power of the premiership, so that our grand plans for the nation can now commence, uninterrupted!"
  SIA_organize_a_secret_police_crackdown_r56: "Organize a Secret Police Crackdown"
  SIA_organize_a_secret_police_crackdown_r56_desc: ""

  SIA_elevate_the_special_branch_r56: "Elevate the Special Branch"
  SIA_elevate_the_special_branch_r56_desc: "Between the powers of Europe and the pacific, there lies many nations who hold potential to use tools of espionage against our national interests. We should ensure that our powerful Special Branch is granted the funding and tools needed to destroy any threats to our internal security."
  SIA_empowered_special_branch_r56_LAR: "Empowered Special Branch"
  SIA_empowered_special_branch_r56_LAR_desc: "Between the powers of Europe and the pacific, there lies many nations who hold potential to use tools of espionage against our national interests. We should ensure that our powerful Special Branch is granted the funding and tools needed to destroy any threats to our internal security."

  SIA_form_a_cult_of_personality_r56: "Form a Cult of Personality"
  SIA_form_a_cult_of_personality_r56_desc: "Despite Phibunsongkhram's proven talents for the capacity of prime minister, large swathes of the nation continue to cling to other institutions, notably the monarchy. For the good of our national development, we should form a cult of personality around Phibunsongkhram, so that we have the momentum needed to launch the radical reforms the [SIA.GetAdjective] needs for its survival!"
  unlocks_decision_demand_public_display_of_the_prime_minister_which_grants_tt: "Unlocks Decision §YDemand Public Display of the Prime Minister§!, which grants:"
  SIA_demand_public_displays_of_the_prime_minister_r56: "Demand Public Display of the Prime Minister"
  SIA_demand_public_displays_of_the_prime_minister_r56_desc: ""

  SIA_restorer_of_thailands_power_and_modernity_r56: "Restorer of Thailand's Power and Modernity"
  SIA_restorer_of_thailands_power_and_modernity_r56_desc: "After centuries of territorial and military decline, we have, under the strong-willed fervor of Phibunsongkhram, placed our economy, internal stability, and military readiness into a new golden age! Only a fool would deny that we are an equal of the west."

  SIA_iron_chancellor_of_the_east_r56: "Iron Chancellor of the East"
  SIA_iron_chancellor_of_the_east_r56_desc: "After decades of grief over our national losses, we, under the righteous reign of Phibunsongkhram, have undone the worst of our losses and united the Tai peoples behind our flag, just as Bismark had the Germans! Who can seriously doubt our rule now, after all that we've accomplished?"
  owns_all_starting_laotian_cores_tt: "Owns all starting §YLaotian§! cores"

  SIA_opportunistic_militarization_r56: "Opportunistic Militarization"
  SIA_opportunistic_militarization_r56_desc: "A time of great opportunity is upon us, should we decide to act on it. For [SIA.GetNameDef] to be an acting power in Asia once more, we must take vital steps to bolster our military readiness! The time has come to issue economic mobilization, and make clear to our people that we have begun the final steps to restore our power on the world stage!"

  SIA_national_cultural_preservation_act_r56: "National Cultural Preservation Act "
  SIA_national_cultural_preservation_act_r56_desc: "Our [SIA.GetAdjective]-nationalist policies are paying off, and with them we are forging a stronger, more harmonious power inside southeast Asia. We must further what we've started, and escalate the transformation which we've too recently begun!"
  unlocks_decision_heavy_handed_assimilation_policies_which_grants_tt: "Unlocks Decision §YHeavy-Handed Assimilation Policies§!, which grants:"
  SIA_heavy_handed_assimilation_policies_r56: "Heavy-Handed Assimilation Policies"
  SIA_heavy_handed_assimilation_policies_r56_desc: ""

  SIA_return_to_the_world_stage_r56: "Return to the World Stage"
  SIA_return_to_the_world_stage_r56_desc: "Conflict is once more upon us. We must do all that we can to secure our position in the world, so that we don't once more end up in an era of humiliation, to the benefit of foreign powers."

  SIA_forced_out_of_neutrality_r56: "Forced Out of Neutrality"
  SIA_forced_out_of_neutrality_r56_desc: "Despite our desire to remain neutral in the Great East-Asian war, [JAP.GetNameDef] has launched an invasion of our lands, and strung us to our side in a moment of desperation. We are on a dangerous road, but under wise leadership we shall come out a stronger power."
  SIA_forced_out_of_neutrality_r56_tt: "§Y[JAP.GetNameDefCap]§! has violated our neutrality, while laying open to negotiated peace."

  SIA_limit_wartime_activity_r56: "Limit Wartime Activity"
  SIA_limit_wartime_activity_r56_desc: "Major involvement in this war is not to our national interest. We should seek to make distance between ourselves and this conflict."
  SIA_focus_on_domestic_stability_r56: "Focus on Domestic Stability"
  SIA_focus_on_domestic_stability_r56_desc: "Major involvement in this war is not to our national interest. We should seek to make distance between ourselves and this conflict."

  SIA_flexible_wartime_policies_r56: "Flexible Wartime Policies"
  SIA_flexible_wartime_policies_r56_desc: "[SIA.GetNameDefCap] is a nation whose foreign policy is built on simultaneous interaction between many powers. As war consumes Asia, we must look carefully, even to our allies; whatever side is losing this war, that must be our enemy."
  siam_r56.22.t: "A New Direction for the Nation"
  siam_r56.22.desc: ""
  unlocks_decision_abandon_the_war_effort_which_grants_tt: "Unlocks Decision §YAbandon the War Effort§!, which grants:"
  SIA_abandon_the_war_effort_r56: "Abandon the War Effort"
  SIA_abandon_the_war_effort_r56_desc: ""
  siam_r56.23.title: "[FROM.GetNameDefCap] Requests Peace"
  siam_r56.23.desc: "Today, following their 'partnership' with our [JAP.GetAdjective] enemy, diplomats from their nation, with the Prime Minister's backing, have officially offered conditional surrender to us.\n\nIf we accept, they will re-enter the war, this time on our side, to the end; while also remaining an ally in Asia to aid in enforcing a post-war order.\n\nShould we accept [SIA.GetNameDefCap]'s attempt for peace with our nation?"
  siam_r56.23.b: "You aren't squeaking your way out of this one."
  siam_r56.24.title: "[FROM.GetNameDefCap] Accepts Our Offer of Peace"
  siam_r56.25.desc: ""
  siam_r56.24.b: "May the coming months be kind to our nation..."
  siam_r56.25.title: "[FROM.GetNameDefCap] Declines an Offer of Peace"
  siam_r56.25.desc: "Sadly, we've received a response from [FROM.GetNameDef], stating their refusal to make peace between our nations. We shall fight on, for now."
  siam_r56.25.a: "Our situation just went from bad to quite a lot worse..."
  siam_r56.22.a: "A more moderate force would be... helpful in what's to come."
  siam_r56.22.a_tt: "Appointing §YKhuang Aphaiwong§! will be seen by foreign powers as distancing ourselves from §Y[JAP.GetNameDef]§!, making an offer for §Ypeace§! §Gmore likely§! to succeed."
  siam_r56.22.b: "We must further Phibun's authority! He knows what's best for us [SIA.GetAdjective]!"
  unlocks_decision_expand_our_commitment_to_the_war_effort_which_grants_tt: "Unlocks Decision §YExpand our Commitment to the War Effort§!, which grants:"
  SIA_expand_our_commitment_to_the_war_effort_r56: "Expand our Commitment to the War Effort"
  SIA_expand_our_commitment_to_the_war_effort_r56_desc: "While our wartime commitments have been low so far, the tide is currently changing. If we seek a righteous outcome to this conflict, we must bring our nation to the forefront in victories to come!"
  disables_decision_SIA_abandon_the_war_effort_r56_tt: "§RDisables§! decision §YAbandon the War Effort§!"
  completes_focus_return_to_the_world_stage_which_grants_tt: "Completes focus §YReturn to the World Stage§!, which grants:"

  SIA_end_foreign_subversion_r56: "End Foreign Subversion"
  SIA_end_foreign_subversion_r56_desc: "With the threat of war upon us, we must take whatever steps possible to quell any first signs of undue 'foreign' influence in our nation. Our nation is a birthright of the [SIA.GetAdjective] people, it shall never fall!"

  SIA_ensure_wartime_stability_r56: "Ensure Wartime Stability"
  SIA_ensure_wartime_stability_r56_desc: "While the international crisis has brought sentiments of unity to our nation, it has opened the door for chaos and uncertainty to take root. We must reverse these trends before widespread unrest harms our ability to fight effectively."
  SIA_united_modernization_front_r56: "United Modernization Front"
  SIA_united_modernization_front_r56_desc: "While they are largely under the subjugation of the armed forces, the Khana Ratsadon encompasses most of the nations civilian and military modernizers, who seek to place [SIA.GetNameDef] as an equal among the western nations."

  SIA_prove_thailands_worth_r56: "Prove Thailand's Worth"
  SIA_prove_thailands_worth_r56_desc: "A crisis is upon us once more, and we have gained the chance to turn the horrors of today into opportunity for our nation. We will show the fervor of our new empire, and carve out a defined place in our new Asian order!"

  SIA_everything_for_victory_r56: "Everything for Victory"
  SIA_everything_for_victory_r56_desc: "Whether we desired to be here or not, we have committed ourselves to war efforts. If we are to be held as a strong nation capable of exercising our will, we must treat this conflict with the unyielding resolve that once brought us to greatness. A great [SIA.GetAdjective] kingdom is on the other side of this bloodshed, all that we must do is hold out and fight on for the freedom of all Thai people's!"

  SIA_military_first_policies_r56: "Military-First Policies"
  SIA_military_first_policies_r56_desc: "The politicians and bureaucrats of our nation are the first to flee and last to stand in the name of our homeland. The needs of the military should thus come before these fools should we endure what is to come."
  SIA_requisition_rice_for_military_use_r56: "Requisition Rice for Military Use"
  SIA_requisition_rice_for_military_use_r56_desc: ""
  SIA_nationalize_foreign_industries_r56: "Nationalize 'Foreign' Industries"
  SIA_nationalize_foreign_industries_r56_desc: ""

