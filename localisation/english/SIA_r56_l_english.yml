  # Generic Decisions
  SIA_mending_siamese_irredentism_r56:0 "Mending [SIA.GetAdjective] Irredentism"
  SIA_mending_siamese_irredentism_r56_desc:0 "Seeing the futility of armed resistance, King Chulalongkorn the Great, where many others would defy, signed over a multitude of territorial concessions from the nation's sphere of influence, awarding the British and French considerable territorial concessions while maintaining the independence of our heartland.\n\nWith our nation undergoing decades of modernization, while the colonial powers overstretch themselves in their global empires, perhaps we can rally behind our losses, and with their reversal: foster a new [SIA.GetAdjective] golden era!"

  SIA_restore_siamese_rule_in_lan_chang_r56:0 "Restore [SIA.GetAdjective] Rule in Lan Chang"
  SIA_restore_siamese_rule_in_lan_chang_r56_desc:0 "Ceded to Paris's control in the Franco-Siamese Treaty of 1904, Lan Chang province has since lied under the control of the French protectorate of Laos. Due to the province's low population, linguistic unity and recent memory of being under our realm, its reintegration should be a simple feat!"

  SIA_restore_siamese_rule_in_champasak_r56:0 "Restore [SIA.GetAdjective] Rule in Champasak"
  SIA_restore_siamese_rule_in_champasak_r56_desc:0 "Ceded to Paris's control in the Franco-Siamese Treaty of 1904, Champasak province has since lied under the control of the French protectorate of Laos. Due to the province's low population, linguistic unity and recent memory of being under our realm, its reintegration should be a simple feat!"

  SIA_proclaim_the_reintegration_of_laos_r56:0 "Proclaim the Reintegration of Laos"
  SIA_proclaim_the_reintegration_of_laos_r56_desc:0 "The Laotian-speaking lands on the eastern bank of the Mekong were ceded to French authority following the 1893 Franco-Siamese crisis, being arguably the most significant territorial loss during Chulalongkorn's years. While these lands were never under Bangkok's direct control, linguistic unity and the spirit of anti-western colonialism will surely propel Laos right into our virtuous hands!"

  SIA_proclaim_the_reintegration_of_inner_cambodia_r56:0 "Proclaim the Reintegration of Inner-Cambodia"
  SIA_proclaim_the_reintegration_of_inner_cambodia_r56_desc:0 "The 1907 Franco-Siamese treaty saw the ceding of Siam's Inner-Cambodia region, which lost us access to many prestigious sites, the important city of Angkor, and the critical Tonlé Sap freshwater lake. While the region lacks a significant Thai-speaking population, its loss is in recent memory, while having considerable strategic and economic purposes."

  SIA_reclaim_the_salweens_northeast_bank_r56:0 "Reclaim the Salween's Northeast Bank"
  SIA_reclaim_the_salweens_northeast_bank_r56_desc:0 "Although we forced to withdraw our claim over the eastern bank of the Salween to the benefit of British India, it was a historic part of the Lan Na kingdom who was absorbed into Siam, also being home to many speakers of the Tai Shan language. With this rightful territory under our control, its integration shall finally commence!"

