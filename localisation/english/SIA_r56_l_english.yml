  # Starting Ideas
  SIA_rama_viii_r56:0 "Rama VIII"
  SIA_rama_viii_r56_desc:0 "Following disagreements with the Khana Ratsadon, and the fall of [SIA.GetAdjective] royal prestige during the reactionary Boworadet rebellion, the ruling Rama VII fell out of influence before abdicating the throne in 1935. His successor, Rama VIII, is still young and studying abroad, and as a result the role of King of [ROOT.GetNonIdeologyName] has fallen into political obscurity. It will take a strong monarch to restore the former prestige of the title."

  SIA_state_of_the_civilian_wing_r56:0 "State of the Civilian Wing"
  SIA_state_of_the_civilian_wing_r56_desc:0 "The ruling Khana Ratsadon, while largely under the control of the [SIA.GetAdjective] armed forces, still holds an influential civilian wing which represents the nation's western-educated ministers. Although the civilian wing holds many men of varied ideologies, it lies under the de facto leadership of the highly progressive Pridi Banomyong.\n\nReturning to the nation during Phonphayuhasena's premiership in 1934, Pridi Banomyong has been relatively warm with the ruling government, becoming an instrumental force in the modernization of our institutions and diplomacy. If we wish to avoid his sidelining from ultranationalist forces, we could look into strengthen his influence."

  SIA_siamese_ultranationalist_movement_r56:0 "[SIA.GetAdjective] Ultranationalist Movement"
  SIA_siamese_ultranationalist_movement_r56_desc:0 "Despite the [SIA.GetAdjective] armed forces holding vast power inside the ruling Khana Ratsadon, little stands in the name of ideological unity. Through the influence of the rising Plaek Phibunsongkhram, ultranationalism in the style of Italy and Japan are rapidly gaining traction throughout the country.\n\nCurrently, although Phibunsongkhram is friendly to the ruling government, he is utilizing his role as minister of defense to bolster his influence throughout the county. If we wish to avoid being succeeded by his rule, decisive action will be needed to curb his power."

