  SIA_rural_schooling_programs_r56:0 "Rural Schooling Programs"
  SIA_rural_schooling_programs_r56_desc:0 "While we are rapidly modernizing on this front, [SIA.GetAdjective] illiteracy remains a problem for our state, primarily but not only among the countryside. An educated nation is one who will not falter despite the threats in our modern world!"

  SIA_improve_health_and_sanitation_services_r56:0 "Improve Health and Sanitation Services"
