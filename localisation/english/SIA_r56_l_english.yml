  SIA_continue_the_national_electrification_r56: "Continue the National Electrification"
  SIA_continue_the_national_electrification_r56_desc: ""

  SIA_rural_schooling_programs_r56: "Rural Schooling Programs"
  SIA_rural_schooling_programs_r56_desc: "While we are rapidly modernizing on this front, [SIA.GetAdjective] illiteracy remains a problem for our state, primarily but not only among the countryside. An educated nation is one who will not falter despite the threats in our modern world!"

  SIA_amend_the_thesaban_organization_act_r56: "Amend the Thesaban Organization Act"
  SIA_amend_the_thesaban_organization_act_r56_desc: ""
