  SIA_rewrite_the_1932_constitution_r56:0 "Rewrite the 1932 Constitution"
  SIA_rewrite_the_1932_constitution_r56_desc:0 "With Phahon's fall from power, and with the nation once more under our hopeful watch, the time has come to review the state of the nation and once more ask ourselves what our best path forward is."

  SIA_reconciliation_with_the_monarchy_r56:0 "Reconciliation With the Monarchy"
  SIA_reconciliation_with_the_monarchy_r56_desc:0 "Although we have our differences, the abdication of Prajadhipok heavily empowered [SIA.GetAdjective] militarists while furthering rural disdain for our rule. We should attempt to settle our differences with the former king; offering a return to his ceremonial rule is our first step to doing that."

  SIA_weaken_the_monarchist_institutions_r56:0 "Weaken the Monarchist Institutions"
  SIA_weaken_the_monarchist_institutions_r56_desc:0 "Shortly following the 1933 revolution, Prajadhipok and his traditionalist allies were the strongest opponents of any meaningful reform. With the monarchy weaker than ever, we should use this time to bring progress and justice to the nation!"

  SIA_prioritize_socioeconomic_progress_r56:0 "Prioritize Socioeconomic Progress"
  SIA_prioritize_socioeconomic_progress_r56_desc:0 "Perhaps, as experienced by many leaders before us, our goals for a rapid democratic transition were too lofty for [SIA.GetAdjective] society. Before we can act as a democratic nation of the west, we must fight to enshrine national education, industrialize [SIA.GetAdjective] society and create a public who is ready for modern political institutions."

  SIA_institutional_modernization_r56:0 "Institutional Modernization"
  SIA_institutional_modernization_r56_desc:0 ""

  SIA_bottom_up_societal_modernization_r56:0 "Bottom-Up Societal Modernization"
  SIA_bottom_up_societal_modernization_r56_desc:0 ""

  SIA_accelerate_industrial_reform_r56:0 "Accelerate Industrial Reform"
