# Tooltip for the Restore the Nobility focus

 AUS_nobility_restoration_tooltip:0 "The 1919 Law on the Abolition of the Nobility is repealed and former nobles may start using their titles again. For example, §YKurt Schuschnigg§! will be known as §YKurt von Schuschnigg§!."
 AUS_nobility_restoration_2_tooltip:0 "Once the monarchy is restored, it will be possible to §Ygrant noble titles§!."
 AUS_ennoblement_possible_restoration_tooltip:0 "It will be possible to §Ygrant noble titles§!."

