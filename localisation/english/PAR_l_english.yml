 # Chaco Peace Conference Focuses
 r56_PAR_formalize_the_chaco_conference_decisions: "Chaco Peace Conference Resolutions"
 r56_PAR_formalize_the_chaco_conference_decisions_desc: "With our formal retreat, it is time for the Chaco Conference countries to fullfill their promises of aiding the former belligrents in restoring their economy."
 r56_PAR_brazilian_road_finance: "[BRA.GetAdjective] Road Finance"
 r56_PAR_brazilian_road_finance_desc: "[USA.GetName] has convinced the [BRA.GetAdjective] government to invest in expanding our road infrastructure as per the Chaco Conference agreement."
 r56_PAR_mend_the_relations: "Mend the Rift"
 r56_PAR_mend_the_relations_desc: "Time for a new chapter in history, forgive and restore - The Chaco War was one of brutality and destruction, over 50% of our Male Population wiped out, same goes for the [BOL.GetName] - We should turn over a new leaf and remind ourselves of our joint heritage."
 r56_PAR_river_trade: "Re-establish River Trade"
 r56_PAR_river_trade_desc: "With the Chaco-War officially coming to an end, it is time to look to the future, amend the mistakes of the past and re-establish river trade, one that is so vital to both our neighbours and ourselves."
 r56_PAR_quell_the_revolutionaries: "Quell the Revolutionaries"
 r56_PAR_quell_the_revolutionaries_desc: ""
 # Chaco Peace Conference End
 r56_PAR_the_state_of_paraguay: "A Strong State"
 r56_PAR_the_state_of_paraguay_desc: "In response to the rising tide of militarism and the looming threat of Nazi penetration, We have attempted to cull the internal threats, while maintaining the hopes of a grand future for Paraguay. Now it is time for a tour of the Interior of the country, attend to the needs of the masses and inspection of our military forces."
