 ## Chaco Focus + Decisions + Events ##
 ######################################
 #  Chaco Focus
 r56_PAR_survey_the_chaco: "Survey the Chaco"
 r56_PAR_survey_the_chaco_desc: "The Paraguayan part of the Chaco also known as Boquerón, makes up more than 50% of Paraguayan territory but only harbors around 50 thousand inhabitants who live as nomads, disconnected from paraguayan society. It is time the Paraguayan government invests into surveying the Chaco to hopefully discover rich resource deposits and to incentivize colonisation of one of the last uninhabited places in South America."
 r56_PAR_start_the_colonization: "Encourage Colonisation"
 r56_PAR_start_the_colonization_desc: "While for long sparse Paraguayan partrols have crossed the Chaco, it cannot be described as thorougly Paraguayan. The truth is, the few who inhabit the Chaco feel no connection to the government in Asunción, and the government, until now, has not felt so either. But now the time of change has arrived and the government will spend whatever is necessary to populate and control the Chaco."
 r56_PAR_invite_oil_company: "The Promise of Black Gold"
 r56_PAR_invite_oil_company_desc: "If there is Oil to be found, the support of the Royal Dutch Shell, cannot be forgotten - and with it the promise of oil drilling rights to the deposits. - However, we may choose to ignore the promise of the previous goverment and expand our country's wealth alone!"
 r56_PAR_exploit_the_chaco: "Exploit the Chaco Resources"
 r56_PAR_exploit_the_chaco_desc: "The vast plains and caverns, enshroud the mineral deposits of the Chaco, it's exploration and exploitatio may spurt a new revival of our economy."
 # Events 
 r56_paraguay.12.t: "The Grand Chaco Expedition"
 r56_paraguay.12.d: "The Grand Chaco Expedition is the greatest project of the paraguayan government in the 20th century. After our defeat in the War of the Triple Alliance, our government has not had the resources to truly invest into its own people and nation. Those times are over and we must move on to once again reclaim our status of a formidable power."
 r56_paraguay.12.a: "Onwards! Into the vast Chaco!"
  
 r56_paraguay.13.t: "The Mennonite Settlements"
 r56_paraguay.13.d: "The Plautdietsch speaking settlers of the Chaco Boreal have already established themselves, and are a thorn in the side of the goverment - We must ensure their co-operation if the Chaco Boreal is to become fully Paraguayan."
 r56_paraguay.13.a: "Grant Limited Self-Rule to the Settlers"
  
 r56_paraguay.14.t: "The Tribal Land Question"
 r56_paraguay.14.d: "Many Tribes call the Chaco their home, however their continued aggression towards the goverment in Asunión is a growing issue, Granting them legal rights to the lands they now hold might mitigate their aggression and allow our surveyors safe passage through the lands, without risk of antagonizing or causing harm to the local communes."
 r56_paraguay.14.a: "So be it."
  
 r56_paraguay.15.t: "The Oil Thesis"
 r56_paraguay.15.d: "Many believe the Chaco-War was one of corporate greed, with the Royal Shell Company supporting our cause against the Bolivarian occupation of the Chaco, The question of the oil deposits arises - Is there any of it in the lands of the Chaco?"
 r56_paraguay.15.a: "So much so for the "Oil"... "
 r56_paraguay.15.b: "Joyous Occasion!"
  
 r56_paraguay.16.t: "The Complete Survey"
 r56_paraguay.16.d: "The Chaco Boreal has been mapped, and greatly explored - however further missions are needed to mark the entire area - with time and support of the goverment the Chaco Region may become our wealthiest province. We cannot forget the man responsible for starting this quest - Juan Belaieff for his role in the first expeditions"
 r56_paraguay.16.a: "Splendid, a toast to the Expeditionaries! and a toast to Juan Belaieff!"
  
 r56_paraguay.17.t: "The Question of the Oil Rights"
 r56_paraguay.17.d: "With the discovery of the oil, the Dutch Shell Company has requested that we allow them the rights to drill the deposits, in return for establishing themselves in Paraguay - the choice is however ours if we wish to exploit it ourselves, though this would be a first for our nation and we would require great expertise..."
 r56_paraguay.17.a: "Grant Drilling Rights to Royal Shell Company"
 r56_paraguay.17.b: "The Oil is ours! and will continue to be ours!"
