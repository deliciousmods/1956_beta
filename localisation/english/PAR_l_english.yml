 ## Events
 
 
 r56_paraguay.1.t: "Military Coup!"
 r56_paraguay.1.d: "After the last year's Chaco war which we managed to win we still retained the weak government of Eusebio Ayala, but Colonel Rafael Franco has orchestrated a coup d'état to establish a much stronger military regime with the support of many opposition parties."
 r56_paraguay.1.a: "Long live Colonel Franco!"
 r56_paraguay.2.a: "We must resist! Form a coalition with the PCP and fight!"
 r56_PAR_franco_coup: "Upcoming Military Coup"
 r56_PAR_franco_coup_desc: "The military unhappy with the weak regime of [PAR.getleader] has formed a conspiracy to overthrow the current government. The conspiracy is being led by the exiled Colonel Franco. If we are to prevent it we must move fast."
 r56_PAR_coup_called_off: "Colonel Franco was §YAssassinated§!"
 r56_PAR_franco_coup_mission: "Colonel Franco's Return"
 r56_PAR_franco_coup_mission_desc: "Our sources say Colonel Franco's return will mark the start of the Military coup."
 r56_PAR_military_concessions: "Concessions to Morinigo's faction"
 r56_PAR_marxist_concessions: "PCP Concessions"
 ############################
 ## Shared PCP/PRF Focuses ##
 ############################
 r56_PAR_agrarian_industry_focus: "Agrarian Industry Focus"
 r56_PAR_agrarian_industry_focus_desc: "Expansion of vital cow and wool husbandry will allow us for a greater self-suffieciency, and establishment of a strong agrarian sector in South America."
 
 ######
 r56_PAR_reach_out_to_the_soviet_union: "Reach out to the [SOV.GetAdjective]s"
 r56_PAR_reach_out_to_the_soviet_union_desc: "The Soviet Union has always percieved a global worker revolution as a neccesity for the future, if they wish to see it unfold they must support our cause! - We should send out an envoy to ensure the best chances of our victory."
 r56_PAR_unite_the_workers: "Unite the Workers"
 r56_PAR_unite_the_workers_desc: "The Workers are the backbone of our Industry, without them the country would collapse it's time to grant them leverage over decisions the goverment makes by creating a communal way of rule!"
 r56_PAR_viva_la_revolucion: "Issue the Proclamation!"
 r56_PAR_viva_la_revolucion_desc: "The time to rise up is now! Gloria a la revolución!"
 r56_PAR_heavy_industry: "Heavy Industry Focus"
 r56_PAR_heavy_industry_desc: ""
 r56_PAR_expand_health_ministry: "Establish the Public Health Ministry"
 r56_PAR_expand_health_ministry_desc: "By investing in healthcare infrastructure and services, we ensure access to quality medical care for all citizens. Prioritizing public health is paramount for the prosperity and vitality of our nation"
 r56_PAR_beef_and_hide_industry: "Expand the Beef & Hide Industry"
 r56_PAR_beef_and_hide_industry_desc: "With the land reforms slowly coming to an end, the expansion and the visible domination of Argentinian Beef on the market, it's time to expand our own."
 r56_PAR_forge_our_own_destiny: "Forge our own Destiny!"
 r56_PAR_forge_our_own_destiny_desc: "With the destruction of the PCP, we are free to do as we wish. We are a proud people! we do not need allies to restore our glory days! Our sovereignty and independence shall guide us forward."
 r56_PAR_rekindle_old_gripes: "Beneath the Shadow of the Triple Alliance"
 r56_PAR_rekindle_old_gripes_desc: "60% of the population died during the war of the Triple Alliance and our country never recovered. Only expansion can bring stability and prosperity to our people; no longer will we live under the shadow of that cursed alliance."
 r56_PAR_allign_the_pcp: "Empower the Partido Comunista Paraguayo"
 r56_PAR_allign_the_pcp_desc: "By empowering the PCP within the government, we open the door to radicalized thoughts and policies aimed at addressing the grievances of the masses. However, this decision comes with inherent risks and uncertainties, as the PCP's agenda may clash with established norms and interests."
 r56_PAR_ban_the_pcp: "Ban the PCP"
 r56_PAR_ban_the_pcp_desc: "Banning the Partido Comunista Paraguayo (PCP) will undoubtedly provoke general strikes and unrest among certain segments of the population. However, it also holds the potential to restore stability and mitigate the influence of communism within our nation."
 r56_PAR_mechanization_of_agriculture: "Mechanization of Agriculture"
 r56_PAR_mechanization_of_agriculture_desc: "Implementing the mechanization of agriculture in Paraguay promises increased productivity and modernization of rural practices. Embracing technological advancements will revolutionize our agricultural sector, ensuring sustained growth and prosperity for our nation"
 r56_PAR_mineral_wealth_focus: "Exploit Mineral Deposits"
 r56_PAR_mineral_wealth_focus_desc: ""
 r56_PAR_soviet_economic_aid: "Soviet Economic Aid"
 r56_PAR_soviet_economic_aid_desc: "The economic turmoil plaguing our nation demands swift action. Paraguay faces mounting challenges, amplified by the failings of our current regime. In light of these dire circumstances, a petition for Soviet economic aid has emerged as a beacon of hope. However, while this avenue offers promise, our nation must also consider standing its ground and exploring alternative means of economic growth."
 r56_PAR_estegarriba_dictatorship: "Ascension of Estegarribia"
 r56_PAR_estegarriba_dictatorship_desc: "With the help of the Liberal Party and the backing of the army, José Félix Estigarribia has been chosen to lead us in these testing times, with anarchy rising and tensions brewing. Let us hope his promises are fullfilled and Paraguy can turn over a new leaf in our history."
 r56_PAR_restore_the_university: "Restore the National University"
 r56_PAR_restore_the_university_desc: "Once a beacon of intellectual pursuit and academic excellence, the university had been shuttered under the repressive policies of previous regimes, It's time to restore its glory, Viva Paraguayo!"
 r56_PAR_mission_to_the_holy_see: "Mission to the Holy See"
 r56_PAR_mission_to_the_holy_see_desc: "Since the early days of Paraguay's history, the Christian Mission has been an enduring presence, offering support and guidance to countless individuals across the nation. As our country undergoes a revitalization and reformation, the imperative for robust educational systems becomes ever more pronounced."
 r56_PAR_estegarriba_emergency_powers: "Emergency Powers"
 r56_PAR_estegarriba_emergency_powers_desc: "With the state in disarray, The President must be given extensive rights to restore the state."
 ##################################
 ## Partido Communista Paraguayo ##
 ##################################
 # Focuses
 r56_PAR_arm_the_militias: "Arm the Militias"
 r56_PAR_laissez_faire: "Continue Laissez-Faire Policy"
 r56_PAR_no_gods_no_masters: "Proclaim the Anarchist Council of Paraguay!"
 r56_PAR_no_gods_no_masters_desc: "Today marks the day of the formal end to goverments! The people will rule themselves and we shall establish a free society from capitalist ideas!"
 r56_PAR_state_atheism: "The Question of Religion"
 r56_PAR_state_atheism_desc: "While we are majorly a christian country, The State should encompass a vision of no beliefs other than the Marxist Ideas that have brought us here."
 r56_PAR_soviet_milmission: "The Soviet Military Mission"
 r56_PAR_soviet_milmission_desc: ""
 r56_PAR_soviet_intel: "Invite NKVD Agents"
 r56_PAR_soviet_intel_desc: "We should establish our intelligence network, however with that we need knowledge - and who else to ask but the great minds in the Soviet Union whomst mastered the art of covert operations."
 r56_PAR_rapid_industrialization: "Rapid Industralization Programs"
 r56_PAR_rapid_industrialization_desc: "Following the 5-year plan may not be the best choice, as our nations economy must recover first from the disastrous wars and effects of previous conflicts. - Rapid Industralization of Communal Centers may provide us an opportunity in the future."
 r56_PAR_collectivization_of_transport: "Collectivize Transport"
 r56_PAR_collectivization_of_transport_desc: ""
 r56_PAR_communal_leadership: "The Founding Father"
 r56_PAR_communal_leadership_desc: "It's time for Oscar Creydt to assume the leadership of our nation, a victor of the Civil War he now stands as the envisioner of the great revolution!"
 r56_PRA_spread_the_revolution: "Our Revolution"
 r56_PRA_spread_the_revolution_desc: "While the Soviet Union has helped to achieve victory over the Colorado's and the goverment of Rafael Franco, It is time to achieve our own glory and free the workers of South America by ourselves!"
 r56_PAR_conquer_south_america: "A Red South America!"
 r56_PAR_conquer_south_america_desc: ""
 r56_PAR_forment_a_split: "Spirit of Encarnación"
 r56_PAR_forment_a_split_desc: "The Taking of Encarnación was an attempted anarchist occupation of Encarnación , in February 1931 as part of a broader plan to start a anarchist social revolution in the country, the spirit of the anarchist ideas lives on in many PCP members, and with that we can finalize our idea!"
 r56_PAR_agrarian_statute_reform: "Formulate Agrarian Statute"
 r56_PAR_agrarian_statute_reform_desc: "With many Febreristas still in key-positions of goverment, de-centralizing the state by abandoning previous reforms may not bode well, We should encourage these ideas to soldifiy our rule."
 r56_PAR_restore_the_constitution: ""Restore" The Constitution"
 r56_PAR_restore_the_constitution_desc: "Félix Paiva's only political action was the abandonment of the Great Charter and restoration of the 1870 Constitution, It's time to restore it to its former glory and establish laws that will support our struggle against anarchy."
 r56_restore_national_pride: "Restore National Pride"
 r56_restore_national_pride_desc: "With our victory in the Chaco War - the losses were staggering, our morale was beaten back and our army in shambles, now a new era of prosperity arises - an Era of dominance and victory. We shall not repeat the same mistakes as our forefathers. Gloria a Dios!"
 r56_PAR_avenge_the_chaco_war: "Avenge the Chaco War!"
 r56_PAR_avenge_the_chaco_war_desc: "The time has come, Launch the invasion! Subjugate the Bolivian's once and for all."
 r56_PAR_allign_with_the_pcp: "The Struggle of the PCP"
 r56_PAR_allign_with_the_pcp_desc: "Betrayed by the Febrerista Movement, pushed to the sidelines, it is our time to revolt against the rule of another dictator! and establish a commune worthy of the worker revolution!"
 r56_PAR_indoctrination_focus: "Indoctrination Focus"
 r56_PAR_indoctrination_focus_desc: "For our revolution to survive the trying years to come, it's necessary to ensure the teachings of Marx to the youthful generations and establish a education program that instills pride and understanding of what we stand for into the populace."
 r56_PAR_communist_reeducation: "Communist Re-Education Centers"
 r56_PAR_communist_reeducation_desc: "" # Gave up here.
 r56_PAR_communist_higher_education: "Asunción Academy of Sciences"
 r56_PAR_communist_higher_education_desc: ""
 r56_PAR_the_five_year_plan: "Adopt the Five Year Plan"
 r56_PAR_the_five_year_plan_desc: ""
