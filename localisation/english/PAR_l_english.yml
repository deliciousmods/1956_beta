 # Focus
 r56_PAR_no_more_failures: "Eternal Paraguay"
 
 r56_PAR_stabilize_the_economy: "Stabilize the Economy"
 r56_PAR_stabilize_the_economy_desc: "With the economy in shambles, the first action is establishing the guarani currency as a stable and worthy currency. Adopting the gold standard will greatly improve confidence and stability, aiding in our economic recovery and growth of our industrial capacity."
 #### #### #### #### #### #### ##
 ## Higinio Moringo Ascension ##
 ### #### #### #### #### #### ##
 
 # Focus
 r56_PAR_rise_of_higinio_moringo: "Rise of Higinio Morínigo"
 r56_PAR_rise_of_higinio_moringo_desc: "The Minister of War and Navy, Higinio Morínigo ascends to the role of provisional president after the tragic death of José Félix Estigarribia, a true leader of the people he has promoted his anti-party manifesto as his first act."
 r56_PAR_suspend_elections: "Suspend Elections"
 r56_PAR_suspend_elections_desc: "Elections must be postponed in the current climate. The resignation of the liberal ministers in the government has left almost no one left to oppose us."
 r56_PAR_discipline_hierarchy_and_order: "Discipline, Hierarchy and Order"
 r56_PAR_discipline_hierarchy_and_order_desc: "With elections disbanded we will announce a new policy of "Discipline, Hierarchy and Order. A strike set or principles that will govern our country and persons who spread subversive ideas will be subject to confinement"
 r56_PAR_get_rid_of_colonel_peredes: "Get Rid of Colonel Paredes"
 r56_PAR_get_rid_of_colonel_peredes_desc: "The Interior Minister Paredes is a potential rival due to his influence. We shall remove him to strengthen our authority"
 r56_PAR_ban_the_liberal_party: "Ban the Liberal Party"
 r56_PAR_ban_the_liberal_party_desc: "The Liberal party are conspiring with the Bolivians. The exile of their leaders is the only suitable punishment."
 r56_PAR_ensure_army_loyalty: "Ensure Army Loyalty"
 r56_PAR_ensure_army_loyalty_desc: "Dissent is growing, and the people put up widespread resistance and general strikes. To avoid facing the same coup as our predecessor the military shall get a large portion of our country's GDP"
 r56_PAR_use_the_guijon_rojo: "Align with the Guión Rojo"
 r56_PAR_use_the_guijon_rojo: "We need to bring the Colorado party's paramilitary organization and their leader, Juan Natalicio González under our wing. We shall use them to threaten and harass our political opposition."
 r56_PAR_nazify_the_army: "Nazify the Army"
 r56_PAR_nazify_the_army_desc: "Nazi symbolism is already spreading like wildfire across the military. Anything else than accepting this, and even encouraging it would ire the military. We can use this to grow closer to [GER.GetName] while also growing a stronger military identity."
 r56_PAR_radicalize_the_police: "Radicalize the Police"
 r56_PAR_radicalize_the_police_desc: "The police is vital in keeping the peace internally while the army is focused on external threats, but they can become a greater tool in propping up the state. We shall provide them with greater resources and in return put them in the governments fold, and should either the military or the police become too powerful we can always pit them against each other."
 r56_PAR_the_war_front: "The War Front"
 r56_PAR_the_war_front_desc: ""
 r56_PAR_state_invervention: "State Intervention Policy"
 r56_PAR_state_invervention_desc: ""
 r56_PAR_protect_domestic_industries: "Protect Domestic Industries"
 r56_PAR_protect_domestic_industries_desc: "While engaging in foreign trade we must take great caution to replace our domestic product with cheap foreign goods. We need to implement a suit of import taxes to protect our domestic economy first and foremost."
 r56_PAR_take_control_of_the_press: "Take over the Press"
 r56_PAR_take_control_of_the_press_desc: "Our goverment cannot be undermined by the few public annoucement agencies that wish to restore the Febreristas to power. Taking over the press and establishing censorship will ensure the stability of our nation."
 r56_PAR_establish_the_denapro: "Establish the DENAPRO"
 r56_PAR_establish_the_denapro_desc: "The National Department of Press and Propaganda is a tool we can monitor all public and individual activities. The Institute will promote a nationalistic cultural policy, rejecting foreign cultural expression and curbing separatism in it's crib."
 r56_PAR_power_to_the_colorados: "Use the Guijon Rojo"
 r56_PAR_power_to_the_colorados_desc: "With the Sanctions imposed on our military after the Buenos Aires Conference, We can take the Colorado Paramilitary Wing under our leadership, using them as a force to quell any rebellion, and intimidate the opposition, aswell as adopting them as a standard unit of our army."
 r56_PAR_renounce_the_treaty_of_buenos_aires: "Renounce the Treaty of Buenos Aires"
 r56_PAR_renounce_the_treaty_of_buenos_aires_desc: "Seeking to humiliate our might and play-down our victory in the Chaco, our enemies strenghten themselves, build up their armies while we are limited by the treaty imposed by the "Great Powers", it's time to rip off these shackles and amend the mistakes of the past."
