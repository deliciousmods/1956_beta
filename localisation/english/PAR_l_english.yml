 ##########################
 ## Liberal Path Focuses ##
 ##########################
 r56_PAR_contact_the_americans: "Reach out to [USA.GetAdjective] Contacts for Aid"
 r56_PAR_contact_the_americans_desc: "The army is too strong compared to our cobbled together force. We need to swallow our pride and reach out to [USA.GetName] for aid and convince them that a communist state in their yard is not preferable."
 r56_PAR_request_american_intervention: "Request American Intervention"
 r56_PAR_request_american_intervention_desc: "It is obvious we cannot beat this war on our own, and we require assitance of the American Military Might, We must petition them to intervene on our behalf!"
 r56_PAR_a_call_out_for_aid: "A Call-Out For Aid"
 r56_PAR_a_call_out_for_aid_desc: "We shall use the presidents [FRA.GetAdjective] wife to lobby the [FRA.GetAdjective] government to allow volunteers to aid in our fight."
 r56_PAR_request_weapons: "Request [USA.GetAdjective] Weaponry"
 r56_PAR_request_weapons_desc: "We cannot win this fight with the paltry stash of light weapons that we have now. We need to reach out to [USA.GetName] and convince them that a communist government in the middle of their sphere of influence is not something they wish to happen."
 r56_PAR_to_cross_a_river: "To Cross a River"
 r56_PAR_to_cross_a_river_desc: "The Paraguay River is a major obstacle for us and prevents most crossings naturally. We should approach a militarily experienced power with a strong marine core to aid us in this endeavor."
 r56_PAR_ask_for_bankroll: "Ask For Bankroll"
 r56_PAR_ask_for_bankroll_desc: "We cannot afford this war while the economy is in shambles. It is clear that we need a foreign force to bankroll to not have the entire country descend into anarchy."
 r56_PAR_assasinate_rafael_franco: "Assassinate Rafael Franco"
 r56_PAR_assasinate_rafael_franco_desc: "If we could cut of the head of the snake it could drastically reduce the morale of the enemy. We shall contact local dissidents within the Chaco and provide them with the tools to see it done."
 r56_PAR_goad_bolivia: "Goad Bolivia"
 r56_PAR_goad_bolivia_desc: "If we could involve Bolivia in the conflict it would make the rebels so much weaker. While risky, we will put out a fake telegram implicating Franco's desire to expand his conquest into Bolivia after the civil has concluded, hopefully goading the [BOL.GetAdjective] government to get involved."
 r56_PAR_revenge_for_the_chaco_war: "Entrench in the Chaco Boreal"
 r56_PAR_revenge_for_the_chaco_war_desc: "[BOL.GetName] is still eyeing the Chaco region, and it will only be a matter of time before they try to claim it again. We need to be proactive and strike first, entrenching our troops and establishing clear logistic routes will increase our chance of a victory."
 r56_PAR_access_the_sea: "Access the Sea"
 r56_PAR_access_the_sea_desc: "Our nation has never had a saltwater port, but it is clear that any great power needs one for its national security. We need to acquire one at any cost."
 r56_PAR_by_all_means_which_to_win: "By All Means Which To Win"
 r56_PAR_by_all_means_which_to_win_desc: "Until the war has concluded we need the entire economy focused on the current conflict. The population will suffer as a result, but if we lose the war they will be worse off, under the yoke of communists..."
 r56_PAR_emergency_powers: "Emergency Powers"
 r56_PAR_emergency_powers_desc: "The country's precarious state internally and externally requires a strong leader to hold us together. It can only be done if that leader is given the authority to act quickly and decisively. "
 r56_PAR_pass_labour_laws: "Pass Labour Laws"
 r56_PAR_pass_labour_laws_desc: "The Febreristas gained the support of the masses through promise of reforms, if we wish to continue our hold on the nation - our victory in the Civil War cannot ignore the needs of the people."
 r56_PAR_crush_the_UNL: "Crush the Remaining Febreristas"
 r56_PAR_crush_the_UNL_desc: "Our victory in the civil war has given us the right to fully eradicate the memory of the Febreristas and their ideas! - We shall hunt down any febrerista supporters and confine them to a life imprisonment!"
 r56_PAR_a_new_economic_policy: "A New Economic Policy"
 r56_PAR_a_new_economic_policy_desc: "With the mass support that the rebellion had gained, it is indispensible that we govern the country with a new set of eyes, one that supports the struggle of our people - and enlightens them with hope of a brighter future under democratically elected leaders, we cannot allow for the roots of evil to once more grasp at the balance of our country."
 r56_PAR_attend_to_foreign_politics: "Re-establish Foreign Relations"
 r56_PAR_attend_to_foreign_politics_desc: "With many goverments recognizing the Febrerista's as legitimate, it is time to re-establish our goverment as the true leadership and return to the drawing board with our foreign policy."
 r56_PAR_attract_american_investment: "Attract American Investment"
 r56_PAR_attract_american_investment_desc: "We must promote that our country is a prime destination for American investors, offering a fertile landscape for profitable ventures. With a stable economy, favorable tax incentives and a strategic placement in the heart of South America."
 r56_PAR_the_paraguayan_new_deal: "Adopt the "New Deal" Policy"
 r56_PAR_the_paraguayan_new_deal_desc: "Seeing the success of the "New Deal Policy" on modernizing infrastructure, our government wishes to emulate the American approach with a series of reforms focusing on connecting the country and allowing for ease-of-transport across the vastness of our country."
 r56_PAR_urbanization_efforts: "Urbanization Efforts"
 r56_PAR_urbanization_efforts_desc: ""
 r56_PAR_empower_the_land_owners: "Empower Land-Owners"
 r56_PAR_empower_the_land_owners_desc: ""
 r56_PAR_a_new_paraguay: "A New Paraguay"
 r56_PAR_a_new_paraguay_desc: ""
 r56_PAR_issue_amensty: "Issue Amnesties"
 r56_PAR_issue_amensty_desc: ""
 r56_PAR_the_youth_front: "The Next Generation"
 r56_PAR_the_youth_front_desc: ""
 r56_PAR_pass_welfare_reforms: "Welfare Reforms"
 r56_PAR_pass_welfare_reforms_desc: ""
 r56_PAR_the_education_focus: "Educational Reform"
 r56_PAR_the_education_focus_desc: ""
