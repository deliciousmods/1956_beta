 # Historical Route
 r56_PAR_pull_back_troops_from_the_chaco: "Pull Back Troops From the Chaco"
 r56_PAR_pull_back_troops_from_the_chaco_desc: "The troops stationed in the Chaco has to be pulled back to not escalate tensions with [BOL.GetName], despite what the military says."
 r56_PAR_expand_the_ministries: "Merge the Ministries"
 r56_PAR_expand_the_ministries_desc: "Many Ministries are over-extended and unnecesary, combining certain ones to strenghten their power may allow us to hasten any reform brought by the Parliament."
 r56_PAR_grant_broad_freedoms_to_the_press: "Broaden Freedoms of the Press"
 r56_PAR_grant_broad_freedoms_to_the_press_desc: "Though once alligned with the Liberal Faction, the silencing of the press was always a mistake, a rightful goverment listens to its people no matter the consequences."
