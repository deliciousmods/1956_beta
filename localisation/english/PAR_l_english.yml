 # Focus
 r56_PAR_a_land_of_two_languages: "A Land of Two Languages"
 r56_PAR_a_land_of_two_languages_desc: "First roughly adopted by the military during the Chaco War to ensure sensitive military information did not leak to Bolivian troops, Its widespread use reflects Paraguay's unique cultural heritage, blending indigenous roots with Spanish influences - It would be wise to make a decision on the official stance of the goverment on the usage of the language."
 # Events
 r56_paraguay.21.t: "The Land of Two Languages"
 r56_paraguay.21.d: "Amidst growing concerns about security and the potential for espionage, some within the military advocate for limiting Guarani's usage to classified communications and internal operations, while others argue that the adoption of the Guarani Language promotes national unity and embraces our nations heritage."
 r56_paraguay.21.a: "Officiate the usage in the military"
 r56_paraguay.21.b: "Adopt it as a second language"
