 # Events
 r56_paraguay.11.t: "Félix Paiva's Brief Presidency"
 r56_paraguay.11.d: "Felix Paiva restored the Constitution, but with mounting pressure from the opposition and the army José Félix Estigarribia was chosen to lead us! - While Paiva's role and term was short he will be remembers as a national hero!"
 r56_paraguay.11.a: "Viva"
 
 r56_paraguay.18.t: "The Fateful Flight"
 r56_paraguay.18.d: "The single-engine aircraft embarked on its journey from Asunción to San Bernardino, carrying General José Félix Estigarribia, President of the Republic of Paraguay, and his wife, along with their pilot. As they neared their destination, a dense fog enveloped the landscape, drastically reducing visibility. The pilot, faced with this challenging condition, assessed their altitude meticulously."
 r56_paraguay.18.a: "...as they descended through the thick fog... "
 r56_paraguay.18.b: "Acknowledging the perilous conditions...."
  
 r56_paraguay.19.t: "The Fateful Flight"
 r56_paraguay.19.d: "Despite the deteriorating visibility, the pilot persisted with the descent, hoping to reach San Bernardino Airport. However, as they descended through the thick fog, the pilot misjudged their altitude, resulting in a catastrophic impact with the ground. The aircraft crashed in an open field located in Altos, approximately 10 km north of San Bernardino. Tragically, all three occupants, including General José Félix Estigarribia and his wife, perished in the crash, leaving behind a nation in mourning"
 r56_paraguay.19.a: "Que Dios los tenga cerca..."
  
 r56_paraguay.20.t: "The Fateful Flight"
 r56_paraguay.20.d: "Acknowledging the perilous conditions, the pilot made the prudent decision to abort the approach to San Bernardino Airport. Instead, he navigated the aircraft to an alternative landing site, where the fog was less severe. With cautious precision, the pilot guided the plane to a safe touchdown in an open field located in Altos, just 10 km north of their intended destination. Despite the unexpected detour, all three passengers emerged unscathed, grateful for the pilot's quick thinking and skillful execution."
 r56_paraguay.20.a: "Gracias a Dios"

