 # Events - If anyone feels more sophisticated localization is required please correct it im crap at it - Simpy
 r56_paraguay.3.t: "[PAR.GetName] Pleads for Armament Assistance"
 r56_paraguay.3.d: "The ongoing conflict in Paraguay has caused devastating losses, The Military Faction has asked us to supply them with weaponry to fight against the communists.\nTheir fate lies in our hands, as without our support their resolve will falter.\n and their fall hastened."
 r56_paraguay.3.a: "Send all we can!"
 r56_paraguay.3.b: "Damn them!"

 r56_paraguay.4.t: "The [USA.GetName] Accepts"
 r56_paraguay.4.d: "The [USA.GetName] have accepted to support us in our struggle, and soon our band-aid army will have the strenght to defeat the communists!, for the meantime - we must ensure the defences of the Capital and secure further support to ensure our survival."
 r56_paraguay.4.a: "¡Gracias a dios!"

 r56_paraguay.5.t: "The [USA.GetName] Refuses"
 r56_paraguay.5.d: "Quoting their own issues at home and the rise of communism on their shores, the [USA.GetName] has refused to help in our struggle against communist forces, we are on our own...."
 r56_paraguay.5.a: "We will be victorious by sheer will!"
 
 r56_paraguay.6.t: "[PAR.GetName] Requests Aid"
 r56_paraguay.6.d: "The Liberal Party of Paraguay has asked our goverment to support them in their struggle against the Army Uprising, we have a choice to wipe our hands or involve ourselves by supporting the eager french volunteers ready to travel across the world to fight for the goverment of Paraguay, Send a small detachment of French Foreign Legionaires.... or, ignore their plea all together.."
 r56_paraguay.6.a: "They have our ships! and the eager volunteers, Best of luck to them!"
 r56_paraguay.6.b: "Secretly involve the 3rd Foreign Infantry Regiment!"
 r56_paraguay.6.c: "Bugger off, we've got bigger problems!"
 
 r56_paraguay.7.t: "French Support!"
 r56_paraguay.7.d: "The French are coming! - Reports have said that many French Nationals are being transported over to Guiana and from there, travelling to Paraguay through means supported by the French Goverment.... Whispers of the French Foreign Legion's involvement have arised, we must quash those allegations"
 r56_paraguay.7.a: "Fantastic!"
 
 r56_paraguay.8.t: "The French Refuse!"
 r56_paraguay.8.d: "After pleading with French Authorities, we have sadly come with empty hands, the French will not help us in our war... We are alone."
 r56_paraguay.8.a: "Damn Them!"
 
 r56_paraguay.9.t: "Paraguayan Financial Aid Plea"
 r56_paraguay.9.d: "The Paraguayans cannot continue this war, without funding - they have asked us for a Loan in return for repayments once they secure their country from internal threats."
 r56_paraguay.9.a: "We'll Bankroll the Goverment"
 r56_paraguay.9.b: "Inflation is too high, we cannot"
 
 r56_paraguay.10.t: "Army Revolt"
 r56_paraguay.10.d: "The Army backed by the Right Wing Paramilitary wing, unhappy with recent changes and the withdrawal of our troops from foward positions in the Chaco Boreal has launched a coup! - The Liberal Party has encouraged the election of José Félix Estigarribia but for now with the state in shambles this role has been taken over by Félix Paiva whom has promised to re-establish the 1870 Constitution as his first act as president."
 r56_paraguay.10.a: "So be it, We shall not stop them"
 
 # Ideas
 PAR_french_bankroll: "French Economic Aid"
 PAR_french_bankroll_desc: "We're recieving 2 Military Factories and 1 Civilian Factory"
 PAR_french_aid_tt: "For 275 Days we will gain:"
 ### END
 r56_PAR_union_nacional_revolucionaria: "Partido Revolucionario Febrerista"
 r56_PAR_union_nacional_revolucionaria_desc: "Our new  party shall become the only legal party in the country. A new start to the Revolutionary National Union in which the country's power and institutions are derived from the party leadership." 
 r56_PAR_accept_american_loans: "Accept American Loans"
 r56_PAR_accept_american_loans_desc: "The Americans are pressuring us to not join the Axis powers and are willing to invest heavily into our country to prevent us from drifting closer to their adversaries"
 r56_PAR_agricultural_technical_assistence: "Agricultural and Medical Technical Assistance"
 r56_PAR_agricultural_technical_assistence_desc: "The Americans are willing to provide us with Agricultural and Medical technological modernization should be post-pone any plans which threatens their interests."
 r56_PAR_put_estigarribia_on_a_pedestal: "Put Estigarribia on a pedestal"
 r56_PAR_put_estigarribia_on_a_pedestal_desc: "José Félix Estigarribia is widely seen as a hero of both the Chaco war and now as a key figure winning the civil war. We will use him for propaganda purposes in lowering the turmoil of the civil war and unite the country and reward him for his service."
 r56_PAR_purge_the_military_of_dissent: "Purge the Military of Dissent"
 r56_PAR_purge_the_military_of_dissent_desc: "Estigarribia has agreed to root out any residual dissent in the army and purge links to Franco's revolution."
 r56_PAR_aftermath_of_the_coup: "Aftermath of the Civil War"
 r56_PAR_aftermath_of_the_coup_desc: "The country is devastated after enduring hammer blows upon hammer blows. The war of the Triple Alliance, the Chaco conflict and now a second civil war has left our land devastated, but what can we do but endure? Today begins the great reconstruction, ¡Paz y justicia! For Paraguay!"
 r56_PAR_soliders_for_prisoners: "Prisoners as Soldiers"
 r56_PAR_soliders_for_prisoners_desc: "Our army is lacking in men after the civil war which has left our country vulnerable. With [BOL.GetName] waiting for an opportune moment to take back the Chaco we need a drastic influx of men as a backstop. We shall pardon prisoners if they agree to join the army and bolster our forces until a proper army can be raised."


