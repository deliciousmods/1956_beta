 r56_PAR_soviet_support_desc: ""
 r56_PAR_joint_technological_development: "Joint Technological Development"
 r56_PAR_joint_technological_development_desc: ""
 r56_PRA_support_in_the_great_patriotic_war: "Join the Struggle"
 r56_PRA_support_in_the_great_patriotic_war_desc: ""
 r56_PAR_communist_secret_police: "Adopt NKVD Tactics"
 r56_PAR_communist_secret_police_desc: "By implementing the rigorous and highly effective methods of the NKVD, we can significantly enhance our police operations."
 r56_PAR_the_new_paraguayan_army: "The New Paraguayan Army"
 r56_PAR_the_new_paraguayan_army_desc: ""
 r56_PAR_invite_soviet_military_advisors: "Invite Soviet Military Advisors"
 r56_PAR_invite_soviet_military_advisors_desc: "We should invite the Soviet military to help us organize our forces. Their expertise will provide advanced training, strategic insights, and modern tactics, greatly enhancing our military effectiveness. By learning from their experience, we can improve our command structure, optimize our resources, and bolster our national defense capabilities."
