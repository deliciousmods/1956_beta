l_english:
 ###########
 ## FOCUS ##
 ###########
  # Starting Ideas
 PAR_agrarian_economy: "Agrarian Economy"
 PAR_agrarian_economy_desc: "Our country is characterized by its vast expanses of fertile land and a thriving agrarian industry. With a landscape dominated by lush greenery and sprawling fields, agriculture forms the backbone of the nation's economy and identity. Mobilization and Industralization of our small country is difficult, with many of the remaining males working the fields, We require to invest heavily in the modernization of our standing armed forces."
 PAR_serenade_of_sorrows: "Serenade of Sorrows"
 PAR_serenade_of_sorrows_desc: "In the wake of the Paraguayan War, the dissolution and utter shame lingered as haunting echoes in the national consciousness. The scars of that devastating conflict cut deep into the fabric of Paraguayan society.\n\n And now, the recent Chaco War having lasted from 1932 to 1935. The will to fight has been completely drained from the most ardent supporters of expansionism. Many of our kinsmen now lay dead in the Chaco Boreal a somber reminder of the cost of the war."
 #####################
 ## Airforce Branch ##
 #####################
 r56_PAR_build_silvio_petrosi_airport: "Build Silvio Petrosi Airport"
 r56_PAR_build_silvio_petrosi_airport_desc: "Of Italian descent Silvio Petrossi singlehandenly pioneered the intrests of our nation in aviation. An avid enthusiast from a young age, he attended Spoleto Military School and then learnt the trade from the famous Argentine aviator Jorge Newbery - he created the first Paraguayan Aviator Club serving as it's first president. Now we honor him and his legacy."
 # State of Paraguay
 r56_PAR_state_of_paraguay: "The State of the Nation"
 r56_PAR_state_of_paraguay_desc: "Following the end of the Chaco War, The country has been dealing with the aftermath of this brutal conflict, addressing economic hardships, reintegrating veterans, and managing political instability. President Eusebio Ayala is facing mounting pressures from various political factions and the military. Will our nation endure these shifting times?"
 ##############################
 ##  Febrerista Revolucion!  ##
 ##############################
 # Focuses
 r56_PAR_febrerista_land_reforms: "Febrerista Land Reforms"
 r56_PAR_febrerista_land_reforms_desc: "Our need for revolution is rooted in the hopes and dreams of peasants, war veterans, and students. Implementing land redistribution from wealthy landowners unites them all! To ensure the continued support and growth of Paraguay, we must act swiftly.."
 r56_PAR_inaugurate_the_pantheon: "Inaugurate the National Pantheon of Heroes"
 r56_PAR_inaugurate_the_pantheon_desc: "The National Pantheon of Heroes must be completed and inaugurated in order to show the February Movements dedication to the nation and its history. Many late heroes of Paraguay will be buried there to remind the people of their duties to protect the nation."
 r56_PAR_establish_the_labor_code: "Paraguayan Labor Code"
 r56_PAR_establish_the_labor_code_desc: "As one of the only South American nations, Paraguay has officially established labor rights. Monitored by the Ministry of Labor, the workers of Paraguay shall have their rights protected and never again shall the neofeudal order of the Liberals reemerge."
 r56_PAR_invite_japanese_settlers: "Invite Japanese Settlers"
 r56_PAR_invite_japanese_settlers_desc: "With [BRA.GetName] halting Japanese immigration there is ample opportunity to invite them here instead. The settlers will be a boost to agriculture and the general economy."
 r56_PAR_expand_soy_bean_production: "Expand Japanese Soy-Bean Plantations"
 r56_PAR_expand_soy_bean_production_desc: "Focusing on expanding our Agricultural sector through the expertise the Japanese settlers offer us may greatly improve our agrarian exports aswell as ensure the stability of food availability in case of prolonged conflict."
 r56_PAR_auto_industry: "Invite Japanese Automotive Experts"
 r56_PAR_auto_industry_desc: "The Japanese settling into our country are skilled labourers, many of which have connections to the Japanese automotive industry, Granting them govermental leniency on tax may exhibit in the establishment of a powerful automotive industry."
 r56_PAR_mythologize_the_father_of_the_nation: "$GUAY_mythologize_the_father_of_the_nation$"
 r56_PAR_mythologize_the_father_of_the_nation_desc: "$GUAY_mythologize_the_father_of_the_nation_desc$"
 r56_PAR_get_rid_of_obsolete_guns: "Get Rid of Obsolete Guns"
 r56_PAR_get_rid_of_obsolete_guns_desc: "Our army's armaments consists of obsolete guns. We need to modernize by getting rid of the scraps of metal that hamper us and modernize our storage."
 r56_PAR_liga_nacional_independiente: "Sway the Liga Nacional Independiente"
 r56_PAR_liga_nacional_independiente_desc: "To further our cause, the LNI must be strenghtened, their anti-liberal stance and La Nacion newspaper may bring us allies through the masses"
 r56_PAR_ministry_of_labour: "Establish the Ministry of Labour"
 r56_PAR_ministry_of_labour_desc: "Recognizing the intrinsic value of labor rights and the welfare of our workforce we must establish an overseeing body to safeguard the rights of workers, ensuring fair employment practices, and fostering harmonious relations between employers and employees in these tough times"
 r56_PAR_ban_vouchers: "Ban Vouchers as Payment"
 r56_PAR_ban_vouchers_desc: "We have to stop employers to pay workers in so called \"white money\". Vouchers that the employers give  employees as alternative to money, perpetuating inequality and creating dependence for the empoloyee. This has to stop."
 r56_PAR_allow_unions_to_strike: "Legalize Unions Strikes"
 r56_PAR_allow_unions_to_strike_desc: "Granting legal rights to strike would provide essential protection for workers, empowering unions to advocate for their interests and ensuring greater representation for Paraguayan laborers. This measure would not only safeguard workers but also alleviate concerns among the workforce, offering reassurance and support for their rights and needs."
 r56_PAR_allow_women_workers: "Allow Female Workers"
 r56_PAR_allow_women_workers_desc: "After the disastrous Triple Alliance war and the following Chaco war we are sorely lacking an effective workforce due to the lack of working age males. "
 r56_PAR_chaco_war_decoration: "Chaco War Decorations"
 r56_PAR_chaco_war_decoration_desc: "The veterans of the Chaco war deserves the war decorations that they never got from the previous government. A small cost to appease the military."
 r56_PAR_order_italian_planes: "Order [ITA.GetAdjective] Planes"
 r56_PAR_order_italian_planes_desc: "We need to modernize our military. We shall approach [ITA.GetName] to make sure that our air-force is up to par to avert any threat from our neighbors."
 r56_PAR_military_pensions: "Implement Military Pensions"
 r56_PAR_military_pensions_desc: "Under the previous administration, military pensions for veterans of the Chaco War were denied, neglecting the sacrifices made by our brave soldiers. Our rule is committed to rectifying this injustice and honoring the service and dedication of our veterans. By providing military pensions, we not only acknowledge their contributions but also ensure their well-being and dignity in their later years."
 r56_PAR_a_great_charter: "A Great Charter"
 r56_PAR_a_great_charter_desc: "It's time to break free from the constraints of the past. Under General Rafael Franco's leadership, Paraguay is poised for a new beginning. Our outdated constitution no longer reflects the aspirations of our people. We must draft a new charter, one that paves the way for a brighter future. This is our chance to create a vision of justice, equality, and prosperity for all."
 r56_PAR_women_in_the_army: "Allow the Enlistment of Women in the Army"
 r56_PAR_women_in_the_army_desc: ""
 # Mission
 
 # Ideas
 PAR_national_revanchism: "National Revanchism"
 PAR_national_revanchism_upgrade: "National Revanchism"
 PAR_national_revanchism_desc: "The Paraguayan Nation and its people have long been subservient to elites residing in Argentina and Brazil. After our humiliation in the War of 1864, our nation has been a laughing stock to foreign commoners and cheap labour to be abused to foreign capitalists. It is time we reclaim our position in the forefront of the continent."
 #########################################
 ## Franco Union Nacional Revolucionara ##
 #########################################
 r56_PAR_entrench_the_febrerista_movement: "Anchor the Febrerista Movement"
 r56_PAR_entrench_the_febrerista_movement_desc: "Our movement is one of popular beliefs, of the needs of the many. We shall establish ourselves as the pillar that future generations look upon for guidance! A new era approaches us."
 r56_PAR_further_govermental_reforms: "Continue with Govermental Reforms"
 r56_PAR_further_govermental_reforms_desc: "Our reforms have greatly imrpoved the welfare of our people, it is a continued action necessary for the eradication of our dramatic history and establishing ourselves once more as a power in South America."
 r56_PAR_goverment_reshuffle: "Expand Goverment Ministries"
 r56_PAR_goverment_reshuffle_desc: "The Expansion and Reshuffling of the goverment is a neccesity for the promotion of a One-Party State idea! - With loyal cabinets to the President we will be able to institute new agendas hastily and without opposition of bureaucratic discussions."
 r56_PAR_kickstart_domestic_arms_factory: "Kickstart the Arms Factories"
 r56_PAR_kickstart_domestic_arms_factory_desc: "Our nation is ill-prepared for war, and to this we must engage in vital construction of armament factories, retooling civilian production and preparing for the Grand Revival of Paraguay Dominance."
 r56_PAR_mobilize_the_economy_for_war: "Prepare the Economy for Total War!"
 r56_PAR_mobilize_the_economy_for_war_desc: "The Economy requires a swift change to an economy of war! - We must prepare ourselves for the reconquest of our lands if we see it a fitting time to strike!"
 r56_PAR_nationalistic_school_education: "Nationalistic Education"
 r56_PAR_nationalistic_school_education_desc: ""
 r56_PAR_national_febrerista_youth: "The Next Generation"
 r56_PAR_national_febrerista_youth_desc: "The next generations youth must be prepared for the ultimate sacrifice for the safety of our nation! training and establishing unions for the youth to promote the ideas of the PRF!"
 r56_PAR_expand_the_health_ministry: "Expand the Ministry of Public Health"
 r56_PAR_expand_the_health_ministry_desc: "The staggering losses of the Chaco War were partially due to the rampant sickness among our troops. Without proper logistics and medical knowledge, many battle wounds became fatal. To prevent such tragedies in the future, it's crucial to expand the Health Ministry. Enhancing healthcare infrastructure and education will ensure our citizens receive the necessary care and our nation is better prepared for any crisis."
 r56_PAR_finalize_land_reforms: "Finalize the Land Reforms"
 r56_PAR_finalize_land_reforms_desc: "Popular among the masses, the land redistribution act of 1936, has granted over 10,00 acres to farmers! - and re-distributed land of filthy rich mega-plantations that were failing but keeping our people at bay! Today marks a great victory for the Paraguayan people."
 r56_PAR_finalize_the_aircraft_purchase: "Further Aircraft Procurement"
 r56_PAR_finalize_the_aircraft_purchase_desc: "As our warplanes become outdated, the question of whom to procure new aircraft from arises, The [ITA.GetAdjective]'s have been supportive of our previous purchase, and in so the choice was simple."
 r56_PAR_neutralize_the_colorados: "Neutralize the Colorado's"
 r56_PAR_neutralize_the_colorados_desc: "The radical paramilitary group of the Colorados, the Guión Rojo are a security threat to the government and a constant thorn in our side. We need to neutralize and disarm the group before they can break out into full blown conflict"
 r56_PAR_nationalize_foreign_owned_companies: "Nationalize Foreign-Owned Estates"
 r56_PAR_nationalize_foreign_owned_companies_desc: "Many Argentinian and Brazilian land-owners still plague our economy, it's time to free ourselves from the shackles of economic colonization by these nations."
 r56_PAR_avenge_the_1870_war: "Avenge the 1870 War"
 r56_PAR_avenge_the_1870_war_desc: "The Conflict that shaped our early histo   ry, the massive losses of our population and the economic devastation will be avenged!, We will establish ourselves as a new Great Power among the South American Nations"
 r56_PAR_closer_relations_with_the_italians: "Approach the Italians"
 r56_PAR_closer_relations_with_the_italians_desc: ""
 r56_PAR_closer_relations_with_the_americans: "Approach the Americans"
 r56_PAR_closer_relations_with_the_americans_desc: ""
 r56_PAR_invite_italian_corporations: "Invite Italian Corporations"
 r56_PAR_invite_italian_corporations_desc: ""
 r56_PAR_a_new_power_emerges: "A New South American Power"
 r56_PAR_a_new_power_emerges_desc: ""
 r56_PAR_cult_of_personality: "The Cult of Personality"
 r56_PAR_cult_of_personality_desc: ""
 r56_PAR_strenghten_the_bank_of_paraguay: "Strenghten the Central Bank"
 r56_PAR_strenghten_the_bank_of_paraguay_desc: ""
 r56_PAR_adopt_corporatism: "Adopt Corporatism"
 r56_PAR_adopt_corporatism_desc: ""
 r56_PAR_foreign_ministry: "Expand the Foreign Ministry"
 r56_PAR_foreign_ministry_desc: ""
