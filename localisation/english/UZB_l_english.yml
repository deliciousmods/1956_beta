 UZB_mustafa_shokay:0 "Mustafa Shokay"
 UZB_mustafa_shokay_leader_desc:0 "Mustafa bey Shokay was born into an aristocratic Kazakh family in 1890 in the Middle Juz region of the Kazakh Steppes. At age seven, Mustafa was admitted to a Russian-language school in Ak-Meshit, where his time there enabled him to become fluent in Russian and later navigate political life within Tsarist Russia. \n\nAfter completing his education, Shokay became involved in the Kazakh and broader Muslim political movements within the Russian Empire. This involvement led to Shokay establishing ties with many notable Muslim leaders in the Russian Empire who seeked independence for their homeland, and would aid Shokay in his own vision. Influenced by developments in the wider Muslim world, most notably the reforms brought about by Mustafa Kemal in Turkey, Shokay began to view political modernisation and national self-determination as increasingly viable goals for Turkestan. \n\nDuring the Russian Civil War, Shokay's political ambitions came to an abrupt end by the collapse of the Kokand Autonomy in 1918, following its defeat at the hands of the Red Army. Left with no other choice, Shokay was forced into exile, eventually relocating to Istanbul and later Paris with assistance from Alexander Kerensky. In exile, Shokay continued to attempt to raise awareness about the Turkestani struggle, with limited success. \n\nAlthough, an oppertunity would present itself when Soviet domination over Central Asia showed signs of weakening. After the Turkestani people achieved their long desired independence, Shokay was invited to lead the nation, for better or worse, which he gladly accepted. Now with his dream of a Turkestani state achieved, many speculate in which direction Shokay will lead the nation, whether it be implementing the reforms he once sought to impose upon Turkestan, or something else."

