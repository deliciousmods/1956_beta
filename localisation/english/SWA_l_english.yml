 SWA_sobhuza_ii:0 "Sobhuza II"
 SWA_sobhuza_ii_desc:0 "Nkhotfotjeni Mona was the only son of King Ngwane V, being born in 1899 in the village of Zombodze. He would go on to lose his father at an extremely young age. Following his father's unexpected passing, the royal council would go on to make Nkhotfotjeni the King of Swaziland at the age of just 4 months old, and as a mark of distinction, Nkhotfotjeni was given the name Sobhuza II. \n\nDue to Sobhuza's young age, his close relatives assumed the role of regents until he would come of age in late 1921, at which point his relatives would transfer their power to him, officially marking the beginning of Sobhuza's rule over Swaziland. \n\nFrom the beginning of his reign, he and a delegation of Swazi nationals would petition King George IV to restore former Swazi lands lost to the British back to the Kingdom of Swaziland. Which, while the British maintained control of the territories, this assertive stance earned him support back at home. Internal changes have also been seen and felt. Knowing the colonial rule in Swaziland will eventually come to an end, Sobhuza has been preparing his people through education, ensuring that the population is ready to take up the responsibility of caring and governing the nation. \n\nWith global tensions continiung to rise, Sobhuza has been seeking to keep Swaziland neutral and free from involvement in conflicts beyond its borders by adopting a diplomacy focused on non-alignment."