 DOM_el_jefe:0 "El Jefe"
 r56_DOM_rafael_trujillo_desc:0 "A young troublemaker, Trujillo joined the Guardia Nacional in 1918 with the beginning of the U.S. occupation of the Dominican Republic. Quickly rising through the ranks of the military, Trujillo gained many connections and powerful friends, becoming head of the Policia Nacional in 1924, managing to convert it into a de facto independent body, his personal army, over the span of five years. With the coming of 1930, the current government was being threatened by anti-regime rebels, with whom Trujillo had secured a deal, leading to his eventual rise to power following a coup d'état.\n\nNow in power, Trujillo worked to mold the nation into a one-party state, with many of his political opponents being killed under suspicious circumstances or disappearing. Effectively all branches of the Dominican government have become mere extensions of Trujillo's own hand, which now holds sway over the economy, military and political administration of the country."
