#Events
indonesia.1.t:0 "An Offer from the East Indies"
indonesia.1.desc:0 "While the main city of Singapore is well defended, it is no secret that a more significant naval presence is needed to protect our east Asian colonies. A communique from the colonial government of the East Indies has given us an interesting opportunity; air supplies for military access. Should we accept?"
indonesia.1.a:0 "Capital!"
indonesia.1.b:0 "Our current defenses suit us just fine, thank you."
indonesia.4.t:0 "East Indies Naval Autonomy?"
indonesia.4.desc:0 "While our current naval position in the East Indies is secured, our shipyards are far away from Java. The colonial government has requested naval autonomy and command of a squadron of our ships to counter this. Should we allow their request?"
indonesia.4.a:0 "Very well."
indonesia.4.b:0 "We cannot afford to lose a single ship."
indonesia.5.t:0 "[HOL.GetNameDefCap] Agrees!"
indonesia.5.desc:0 "Whether by apathy or sincere belief in our efforts, the [HOL.GetAdjective] government has granted us limited naval autonomy in our region."
indonesia.5.a:0 "We will seize this opportunity!"
indonesia.6.t:0 "[HOL.GetNameDefCap] Refuses"
indonesia.6.desc:0 "Preferring direct control over the region, the Hague has refused our request for naval autonomy."
indonesia.6.a:0 "We will go ahead without them."
indonesia.7.t:0 "Naval Exercises in Southeast Asia"
indonesia.7.desc:0 "As the current climate of Asia is tense, it is no wonder that nations are invested in displaying strength. [ROOT.GetNameDefCap] is no exception and has begun to reveal its newfound naval power in the region."
indonesia.7.a:0 "Concerning."
indonesia.7.b:0 "We have shown the world our strength."
indonesia.7.c:0 "They grow up so fast."
indonesia.7.d:0 "A challenger approaches?"
indonesia.8.t:0 "The Sutarjo Petition"
indonesia.8.desc:0 "While nationalistic sympathies have been running high in our colonies, the colonial government we have in place has managed to placate the native population and keep it relativly content. However, there is still many extremists and radicals among the nationalist and pro-independence ranks that have called for, if not complete freedom, increased autonomy for the East Indies. Thus the Sutarjo Petition was drawn just some days ago in the Volksraad and made it's way here."
indonesia.8.a:0 "A small price to pay for stability."
indonesia.8.b:0 "The situation as it stands works fine for us."
indonesia.9.t:0 "[FROM.GetNameDefCap] Accepts"
indonesia.9.desc:0 "After, most likely, fierce and fiery debates over the Sutarjo Petition, it has been decided that [ROOT.GetNameDefCap] shall achieve higher or even full autonomy within the Commonwealth of the Netherlands. This has proved to be a great success and there is, of course, somebody to thank for this, that being Sutarjo Kartohadikusumo, leader of the Native Civil Servants Association and all of his supporters."
indonesia.9.a:0 "Another step towards freedom!."
indonesia.10.t:0 "Freedom for the East Indies?"
indonesia.10.desc:0 "Nationalistic sympathies have run high in our colonies and reached a breaking point. Democratic agitators in the East Indies have begun demanding free elections and freedom from colonial control but are willing for an alliance in the future. How do we react?"
indonesia.10.a:0 "Better them than the communists."
indonesia.10.b:0 "Ungrateful colonials!"

indonesia.33.t:0 "[INS.GetNameDefCap] Claims Guinea!"
indonesia.33.desc:0 "Our shared border with the East Indies on the island of Guinea has always been a tense but restrained affair. However, tensions have broken, with the new [INS.GetAdjective] government demanding complete control and sovereignty over the island. What should we do?"
indonesia.33.a:0 "Give in to their demands."
indonesia.33.b:0 "Their independence has made them headstrong; ignore them."
indonesia.34.t:0 "[AST.GetNameDefCap] Submits!"
indonesia.34.desc:0 "Our threats worked; [Ast.GetNameDef] has surrendered all claims to Guinea, and control is being transferred to us immediately."
indonesia.34.a:0 "A victory for diplomacy!"
indonesia.35.t:0 "[AST.GetNameDefCap] Refuses!"
indonesia.35.desc:0 "Diplomacy has failed despite our best efforts; [Ast.GetNameDef] has ignored all our demands and continues as if nothing has changed."
indonesia.35.a:0 "Very well."
indonesia.35.b:0 "They will pay for this insolence."
indonesia.36.t:0 "[INS.GetNameDefCap] Claims Timor!"
indonesia.36.desc:0 "Our shared border with the East Indies on the island of Timor has always been a tense but restrained affair. However, tensions have come to a breaking point, with the new [INS.GetAdjective] government demanding complete control and sovereignty of the island. What should we do?"
indonesia.36.a:0 "Give in to their demands."
indonesia.36.b:0 "Their independence has made them headstrong; ignore them."
indonesia.37.t:0 "[721.Owner.GetNameDefCap] Cedes Timor!"
indonesia.37.desc:0 "The [721.Owner.GetAdjective] government, unable to project its forces, has decided to accept our demands instead of risking war."
indonesia.37.a:0 "A victory for diplomacy!"
indonesia.38.t:0 "[POR.GetNameDefCap] Refuses!"
indonesia.38.desc:0 "Diplomacy has failed despite our best efforts; [POR.GetNameDef] has ignored all our demands and continues as if nothing has changed."
indonesia.38.a:0 "Very well."
indonesia.38.b:0 "They will pay for this insolence."

################

indonesia.40.t:0 "[FROM.GetNameDefCap] Petitions for Colonial Freedom"
indonesia.40.desc:0 "The world has changed vastly since the Great War, and the time of colonial empires has become quite old-fashioned. The recently independent [FROM.GetName] is a prime example of the struggle of the native people under colonial rule for freedom and independence. Diplomats from the [FROM.GetAdjective] government and administration have pleaded and petitoned for us to allow our colonial holdings in Southeast Asia independence in exchange for a guarantee of [INS.GetAdjective] protection. What should we make of this offer?"
indonesia.40.a:0 "This might be in everyone's best interests..."
indonesia.40.c:0 "Our colonial holdings are of great strategic and economic importance, we shall not accept."

indonesia.41.t:0 "[FROM.GetNameDefCap] Agrees To Our Petition!"
indonesia.41.desc:0 "The [FROM.GetAdjective] government has agreed to withdraw it's military forces and diplomats from their colonial holdings in Southeast Asia. Most likely due to [ROOT.GetAdjective] pressure, they are inclined to believe that this might actually be in everyone's best interests as they wouldn't like [ROOT.GetNameDef] as their enemy in the region. Nonetheless, this marks yet another step towards the freedom of Asian peoples!"
indonesia.41.a:0 "A victory of diplomacy!"

indonesia.42.t:0 "[ROOT.GetAdjective] Independence Has Been Achieved!"
indonesia.42.desc:0 "Our brothers in [FROM.GetNameDef] have not taken their newfound independence for granted. They have petitioned [OVERLORD.GetNameDef] for the total independence of [ROOT.GetNameDef] and subsequent withdrawal of [OVERLORD.GetAdjective] military forces within Southeast Asia. The end of colonialism is near, our independence marks just another step towards it!"
indonesia.42.a:0 "Glory to the liberation of the [ROOT.GetAdjective] peoples!"
indonesia.42.b:0 "Our future lies with [OVERLORD.GetNameDef]..."

indonesia.45.t:0 "[FROM.GetNameDefCap] Refuses!"
indonesia.45.desc:0 "Despite our good intentions, our petition has fallen on deaf ears. [FROM.GetNameDefCap] has no plans on relinquishing control over it's colonial holdings within Southeast Asia. Sadly, colonialism and imperialism live yet another day!"
indonesia.45.a:0 "There is nothing we can do..."
indonesia.45.b:0 "Colonialism must meet it's fate, one way or the other!"

################

indonesia.46.t:0 "The Passing of Dr. Sutomo"
indonesia.46.d_1:0 "Reports has arrived from Surabaya about the recent death of Doctor Sutomo, leader of the Parindra, last night due to liver cancer.\n\nThe founder of Budi Utomo, the first Bumiputra political movement in the Indies, Dr. Sutomo has consistenly proved that by extolting one's virtue, independence can be brought by non-violent means compared to the more radical movements such as Sarekat Islam and Partai Nasional Indonesia. A funeral procession was to be taken place at Surabaya with his followers at Parindra such as his successor Wurjaningrat and the leader of Nationalist Faction in the Volksraad, Mohammad Husni Thamrin."
indonesia.46.d_2:0 "Reports has arrived from Surabaya about the recent death of President Sutomo, leader of our nation and our party Parindra, last night due to liver cancer.\n\nThe founder of Budi Utomo, the first Bumiputra political movement in the Indies, Dr. Sutomo has consistently proven that, while independence can be brought by non-violent means, ultimately the Indonesians needs to extol their virtues and assert themselves as the rightful owners of the Indonesian homeland.\n\nWhile Wurjaningrat has succeeded him as the party leader, a special convention is being held to elect the next President of [INS.GetNameDef]. By acclamation:"
indonesia.46.a:0 "A force of good, has gone"
indonesia.46.b:0 "Mohammad Husni Thamrin shall lead our nation!"
indonesia.46.c:0 "Wurjaningrat should ensure the transition is proceeding as intended"
INS_dr_sutomo_passed:0 "§YDr. Sutomo§! has passed away"

indonesia.47.t:0 "Changing of the Guards"
indonesia.47.d:0 "With the recent promotion of Rear Admiral Ferwerda and Furstner in the Koninklijke Marine, Vice Admiral Maarten van Dulm would be officially retired at the age of 57 years old, having serve the East Indies Fleet since 1934 until now."
indonesia.47.a:0 "The Kingdom still needs his service"
indonesia.47.b:0 "Thank you for your service"

indonesia.48.t:0 "Choosing the Royal Candidate"
indonesia.48.d:0 "The leadership of Parindra has convened today to elect our future monarch for the Indonesian Sultanate. While the decision immediately agreed upon is to choose the House of Mataram as our dynasty, the position of monarch itself has two competing claims between the older branch led by the House of Paku Buwono and the younger branch led by the House of Hamengku Buwono. Which one would be our chosen monarch?"
indonesia.48.a:0 "The elder branch, House of Paku Buwono"
indonesia.48.b:0 "The younger branch, House of Hamengku Buwono"

indonesia.49.t:0 "The Passing of Paku Buwono X"
indonesia.49.d_1:0 "Sri Susuhonan Paku Buwono the Tenth, the Monarch of Surakarta, has passed away after a long battle of illness due to his old age. The funeral procession was attended by a number of Javanese, Indonesian, and even Dutch dignitaries, as he is widely respected for his acceptance towards the modernization process in the East Indies. It is expected that Raden Mas Ontoseno, Pangeran Hangabehi, would inherit his father's throne as Sri Susuhonan Paku Buwono XI."
indonesia.49.d_2:0 "Sri Susuhonan Paku Buwono the Tenth, our current monarch, has passed away after a long battle of illness due to his old age. The funeral procession was attended by numerous Indonesian officials, including First Minister Wurjaningrat himself. It is expected that Raden Mas Ontoseno, Pangeran Hangabehi, would inherit his father's throne as Sri Susuhonan Paku Buwono XI."
indonesia.49.a:0 "We offer condolences"
indonesia.49.b:0 "The nation mourns"

indonesia.50.t:0 "The Passing of Hamengkubuwono VIII"
indonesia.50.d_1:0 "Sri Sultan Hamengkubuwono the Eighth, the Monarch of Yogyakarta, has passed away due to a sudden heart attack whilst on a train home. The funeral procession was attended by a number of Javanese, Indonesian, and even Dutch dignitaries, including H. J. van Mook, who is a personal acquiantances with the late Sultan during his days as an agricultural officer at Yogyakarta. It is expected that Gusti Raden Mas Dorojatun would inherit his father's throne as Sri Sultan Hamengkubuwono IX."
indonesia.50.d_2:0 "Sri Sultan Hamengkubuwono the Eighth, the Monarch of Yogyakarta, has passed away due to a sudden heart attack whilst on a train home. The funeral procession was attended by numerous Indonesian officials, including [INS.GetLeader] himself. It is expected that Gusti Raden Mas Dorojatun would inherit his father's throne as Sri Sultan Hamengkubuwono IX."
indonesia.50.d_3:0 "Sri Sultan Hamengkubuwono the Eighth, our current monarch, has passed away due to a sudden heart attack whilst on a train home. The funeral procession was attended by numerous Indonesian officials, including First Minister Wurjaningrat himself. It is expected that Gusti Raden Mas Dorojatun would inherit his father's throne as Sri Sultan Hamengkubuwono IX."
indonesia.50.a:0 "Goodbye, old friend."
indonesia.50.b:0 "We offer condolences"
indonesia.50.c:0 "The nation mourns"

 indonesia.51.t:0 "Fall of the East Indies"
 indonesia.51.d:0 "With our most precious island of our country has become increasingly threatened by the enemy's hands, there is an increasing probability that Java would be invaded soon. With such vulnerable position, some key officials has been ordered to evacuate towards a more secure place to keep fighting from afar. For the rest of them who remained here, what should we do?"
 indonesia.51.a:0 "We must fight on abroad!"
 indonesia.51.b:0 "Continue the fight, until the end!"

 indonesia.52.t:0 "Conquest of the Southern Resource Territory"
 indonesia.52.d:0 "With fall of Java, the whole [INS.GetFactionName] effort on this area is shattered completely, and the Indian Ocean is completely open for our continued advance. Several member of Indonesian nationalists groups has presented themselves before the leading invasion forces, clearly seeking collaboration with us, in exchange for us to freely export their riches to fuel our war effort, exactly like what has been our aim since the start."
 indonesia.52.a:0 "We must keep our direct control"

 indonesia.53.t:0 "Death of Frederik de Hoog"
 indonesia.53.d:0 "Earlier this morning, a shocking news came from the Fatherland. Frederik Hermanus de Hoog, leader of the Indo-Europeesch Verbond, has passed away due to a brain stroke during his vacation there in purpose to recuperate from a heart failure earlier this year.\n\nFrederik de Hoog was an upstanding member of the East Indies society with many of his contributions helped his fellow Indos in the Malaise. A Leiden University alumni, he was a member in the IEV since 1920, appointed as a principal officer at the Staatspoor en Tramwegen in 1922, and finally member at the Volksraad in 1923 representing the IEV. During his tenure at both the IEV and Volksraad, De Hoog advocates for political and economic emancipation, both for to provide equal opportunity for all layers of society in the East Indies and also to prevent more extreme ideas to take hold in the archipelago.\n\nHe was to be buried at Bandung, attended by both IEV members, Volksraad members, and also officials from the Batavian government."
 indonesia.53.a:0 "Rest in Peace, Frederik"
 
 indonesia.54.t:0 "The Revolution Blooms!"
 indonesia.54.d:0 "Just hours after our proclamation of independence, the remnants of Dutch rule has seized key governmental posts in Batavia, North Sumatra, and also the Great East. It is clear that they would not stop until our resistance is fully extinguished."
 indonesia.54.a:0 "Merdeka atau Mati!!!"
 INS_NATREV_aggressor_tt:0 "§RWe would fight tooth and nail against foreign oppressors!§!\n"

 indonesia.55.t:0 "The Indonesian Uprising"
 indonesia.55.desc:0 "Attempts to contact Batavia for the last six hours after the midnight has met with eerie silence, but just this hour, a frantic message has arrived from Surabaya through Singapore. Following the closure of the Volksraad, escalated tensions between the Bumiputra militants and the colonial government, backed by NSB sympathizers, has led into a revolution led by the remnants of the Indonesian Communist Party."
 indonesia.55.a:0 "We are too preoccupied right now"
 indonesia.55.b:0 "Retake our Crown Jewel of the Empire!"
 indonesia.55.c:0 "We must take direct control of the situation!"
 indonesia.55.d:0 "Secure New Guinea at once!"

 indonesia.56.t:0 "[FROM.GetNameDefCap] Rejects"
 indonesia.56.desc:0 "After, most likely, fierce and fiery debates over the Sutarjo Petition, it has been decided that [ROOT.GetNameDefCap] shall retain it's current administrative and colonial position within the Commonwealth of the Netherlands. It appears that [FROM.GetNameDef] strives to maintain the status quo within [ROOT.GetNameDefCap] and possibly other colonies, fearing that accepting might be a show of weakness."
 indonesia.56.a:0 "At least they gave us an answer."
 indonesia.56.b:0 "Enough is enough! Freedom must be achieved by any means necessary!"
 
 indonesia.57.t:0 "The Revolution Triumphant!"
 indonesia.57.d:0 "Following the conquest of the last Dutch bastions, our people is finally freed from three centuries of colonialism.\n\nA question remained, however, about our own militias who has helped us to defeat the colonialists. While they are rightfully deserved to be integrated into our armed forces, a vocal group in our committee has demanded them to be disbanded altogether, but with a chance to receive proper training in our armed forces recruitment afterwards."
 indonesia.57.a:0 "They can be disbanded"
 indonesia.57.b:0 "They can be integrated into our Worker's Army"
 
 indonesia.58.t:0 "Return of the Communist Exiles"
 indonesia.58.desc:0 "Following the conclusion of the Indonesian Revolution, several prominent communists who has been exiled following the failed 1926-27 Revolution has been returned to the Motherland. Renowned revolutionary Tan Malaka has make himself known to the locals at Serang, Banten three days ago, and our first chairman Semaun has arrived at Semarang, Central Java a day after.\n\nAn impromptu Party Congress has been organized at [INS.GetCapitalVictoryPointName] today to decide the direction of the party would take, for the first time after the Indonesian independence. While the underground leadership of Amir Syarifuddin and Musso Munawar has been proved successful as shown with the current revolution, some comrades has pointed a need to reinstate a proper leadership for the upcoming days ahead."
 indonesia.58.a:0 "Bung Musso can help us connect with the Third International"
 indonesia.58.b:0 "Bung Malaka can show the way Nusantara was meant to be"
 indonesia.58.c:0 "Bung Semaun would unite us all just like the olden days"
 
 indonesia.59.t:0 "The 4th National Congress of PKI"
 indonesia.59.desc:0 "After more than a decade of banning and persecution, the Communist Party of Indonesia was able to liberate the homeland from the colonialists. And finally, after five years, the Central Committee has managed to convene again to discuss the direction of the party's policies. This would include selecting the leader of the party itself, representing numerous intra-party factions with difference ranging from foreign political alignment, national planning, to even simple favoritism between the party's leaders.\n\nNevertheless, the Congress would produce a new chairmanship for the next five years, and the chosen one is:"
 indonesia.59.a:0 "Bung Musso can help us connect with the Third International"
 indonesia.59.b:0 "Bung Musso can lead the party again"
 indonesia.59.c:0 "Bung Malaka can show the way Nusantara was meant to be"
 indonesia.59.d:0 "Bung Malaka can lead the party again"
 indonesia.59.e:0 "Bung Amir has proven himself once in the Revolution"
 indonesia.59.f:0 "Bung Amir can lead the party again"
 indonesia.59.g:0 "Pak Alimin can lead the party once more"

