INS_braat:0 "Machinefabriek Braat"
INS_braat_desc:0 "Machine Factory Braat, established in 1902."
INS_barata:0 "Barata Metalworks & Engineering"
INS_barata_desc:0 "Barata Indonesia, assets acquired from nationalization of Machinefabriek Braat in 1961."
INS_shell:0 "Bataafsche Petroleum Maatschappij"
INS_shell_desc:0 "Established at Batavia on 1907"
INS_permina:0 "Permina"
