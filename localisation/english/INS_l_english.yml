#focus ideas
INS_volunteers_idea:0 "Interventionism"
INS_volunteers_idea_desc:0 "The KNIL has a long tradition of volunteerism; it is only natural to bring this exuberance into the 20th century."
INS_army_idea_two:0 "Army Reforms"
INS_army_idea_two_desc:0 "Though true reform is a long way off, this is the first step."
INS_army_idea_two_1:0 "Army Reforms"
INS_army_idea_two_1_desc:0 "Though true reform is a long way off, this is the first step."
INS_army_idea_two_2:0 "Army Reforms"
INS_army_idea_two_2_desc:0 "Though true reform is a long way off, this is the next step."
INS_army_idea_two_3:0 "Army Reforms"
INS_army_idea_two_3_desc:0 "Though true reform is a long way off, this is the last step."
INS_army_idea_six:0 "Kartika Eka Paksi"
INS_army_idea_six_desc:0 "Our reforms, though long and painful, have been a success! Our sons shall carry [INS.GetNameDef] like a bird of prey, watchful of all foes."
INS_ace_idea:0 "Wings of the Motherland"
INS_ace_idea_desc:0 "[INS.GetNameDef] will rule its skies."
INS_coastal_entrenchment_idea:0 "Coastal Entrenchment"
INS_coastal_entrenchment_idea_desc:0 "Our coastal defense capabilities are lacking, but with careful management of our resources, we can afford to build up a limited amount of coastal forts in our important naval bases across the archipelago."
INS_abda_idea:0 "ABDA"
INS_abda_idea_desc:0 "American-British-Dutch-Australian Command"
INS_science_idea_1:0 "Education Reforms"
INS_science_idea_1_desc:0 "While improving, education is still reserved strictly for the elites, to the detriment of our nation."
INS_science_idea_two:0 "Local Universities"
INS_science_idea_two_desc:0 "Our education facilities are the pride of Southeast Asia; we have done well to teach tomorrow's leaders the lessons of today."
INS_economy_idea_two:0 "Koninklijk Paketvaart Maatschappij"
INS_economy_idea_two_desc:0 "The riches of Indonesia are here again, this time, for the people."
INS_political_idea_two:0 "Colonial Loyalty"
INS_political_idea_two_desc:0 "There is no place to talk of violent revolution at this time; we must focus all our efforts on peaceful separation from the motherland."
INS_political_idea_two_1:0 "Colonial Loyalty"
INS_political_idea_two_1_desc:0 "There is no place to talk of violent revolution at this time; we must focus all our efforts on peaceful separation from the motherland."
INS_political_idea_democratic:0 "Democratic Support"
INS_political_idea_democratic_desc:0 "Democracy is the future; let us strive for it."
INS_political_idea_fascism:0 "Fascist Support"
INS_political_idea_fascism_desc:0 "A strong nation is needed to achieve independence, and a strong leader to guide it."
INS_political_idea_fascism_1:0 "Fascist Support"
INS_political_idea_fascism_1_desc:0 "A strong nation is needed to achieve independence, and a strong leader to guide it."
INS_political_idea_communism:0 "Communist Support"
INS_political_idea_communism_desc:0 "For too long, the rich have lorded over the commoner. No longer."
INS_political_idea_democratic_1:0 "Democratic Transition"
INS_political_idea_democratic_1_desc:0 "Our freedom was a success! Now, to return our government to peace."
INS_political_idea_democratic_2:0 "Guided Democracy"
INS_political_idea_democratic_2_desc:0 "Neither the West nor the East's traditions, our solution is our own."
INS_political_idea:0 "Kebangkitan Nasional"
INS_political_idea_desc:0 "Nationalistic sentiment runs rampant within all layers of Indonesian society, especially the lower class. Due to poor living conditions created by colonial abuse over the years the people of Indonesia grow more and more radical by the day. However, not all is black and white within the political landscape of Indonesia as there is many parties and movements still willing to cooperate with the [HOL.GetAdjective] administrators in order to promote and protect Indonesian interests."
INS_kebangkitan_nasional:0 "Kebangkitan Nasional"
INS_kebangkitan_nasional_desc:0 "Nationalistic sentiment runs rampant within all layers of Indonesian society, especially the lower class. Due to poor living conditions created by colonial abuse over the years the people of Indonesia grow more and more radical by the day. However, not all is black and white within the political landscape of Indonesia as there is many parties and movements still willing to cooperate with the [HOL.GetAdjective] administrators in order to promote and protect Indonesian interests."
INS_kebangkitan_nasional_2_desc:0 "Nationalistic sentiment runs rampant within all layers of Indonesian society, especially the lower class. Due to poor living conditions created by colonial abuse over the years the people of Indonesia grow more and more radical by the day. However, not all is black and white within the political landscape of Indonesia as there is many parties and movements still willing to cooperate with the [HOL.GetAdjective] administrators in order to promote and protect Indonesian interests."
INS_kebangkitan_nasional_3_desc:0 "Nationalistic sentiment runs rampant within all layers of Indonesian society, especially the lower class. Due to poor living conditions created by colonial abuse over the years the people of Indonesia grow more and more radical by the day. However, not all is black and white within the political landscape of Indonesia as there is many parties and movements still willing to cooperate with the [HOL.GetAdjective] administrators in order to promote and protect Indonesian interests."
INS_political_idea_4:0 "Unity in Diversity"
INS_political_idea_4_desc:0 "We are united together as a people in peace, not violence."
INS_political_idea_5:0 "Peacetime Economics"
INS_political_idea_5_desc:0 "Our freedom has been a long time coming, and it is now time to enjoy the results of our hard work; the people of [INS.GetNameDef] will no longer face unrest or war but peace and prosperity."
INS_political_idea_five:0 "Kemerdekaan"
INS_political_idea_five_desc:0 "We have waited for our freedom for so long that it is hard to believe we are finally here. May [INS.GetAdjective]s forever remember the day of our independence!"
INS_political_idea_five_1:0 "Kemerdekaan"
INS_political_idea_five_1_desc:0 "We have waited for our freedom for so long that it is hard to believe we are finally here. May [INS.GetAdjective]s forever remember the day of our independence!"

INS_army_idea:0 "Disjointed Army"
INS_army_idea_desc:0 "Though adequate for peacekeeping, the reliance of our army on [HOL.GetAdjective] support, alongside a lack of native officers in our ranks, has left our military crippled and ineffective; significant reform is needed."
INS_economy_idea:0 "[Root.getinseconname]"
INS_economy_idea_desc:0 "[Root.getinsecondesc]"
INS_colonial_economy:0 "De Malaise"
INS_colonial_economy_desc:0 "While we are a bountiful nation, so much of what we produce is sent overseas that our native economy suffers for it, even as we are struggling on our own economic crisis."
INS_postcolonial_economy:0 "Post-Colonial Economy"
INS_postcolonial_economy_desc:0 "The economic ruins brought by both De Malaise and the recent revolution leaves a rather large scar. We must fix them before the untenability of our economy becomes a political matter."
INS_science_idea:0 "Education Reforms"
INS_science_idea_desc:0 "While improving, education is still reserved strictly for the elites, to the detriment of our nation."

indonesia.1.t:0 "An Offer from the East Indies"
indonesia.1.desc:0 "While the main city of Singapore is well defended, it is no secret that a more significant naval presence is needed to protect our east Asian colonies. A communique from the colonial government of the East Indies has given us an interesting opportunity; air supplies for military access. Should we accept?"
indonesia.1.a:0 "Capital!"
indonesia.1.b:0 "Our current defenses suit us just fine, thank you."
indonesia.4.t:0 "East Indies Naval Autonomy?"
indonesia.4.desc:0 "While our current naval position in the East Indies is secured, our shipyards are far away from Java. The colonial government has requested naval autonomy and command of a squadron of our ships to counter this. Should we allow their request?"
indonesia.4.a:0 "Very well."
indonesia.4.b:0 "We cannot afford to lose a single ship."
indonesia.5.t:0 "[HOL.GetNameDefCap] Agrees!"
indonesia.5.desc:0 "Whether by apathy or sincere belief in our efforts, the [HOL.GetAdjective] government has granted us limited naval autonomy in our region."
indonesia.5.a:0 "We will seize this opportunity!"
indonesia.6.t:0 "[HOL.GetNameDefCap] Refuses"
indonesia.6.desc:0 "Preferring direct control over the region, the Hague has refused our request for naval autonomy."
indonesia.6.a:0 "We will go ahead without them."
indonesia.7.t:0 "Naval Exercises in Southeast Asia"
indonesia.7.desc:0 "As the current climate of Asia is tense, it is no wonder that nations are invested in displaying strength. [ROOT.GetNameDefCap] is no exception and has begun to reveal its newfound naval power in the region."
indonesia.7.a:0 "Concerning."
indonesia.7.b:0 "We have shown the world our strength."
indonesia.7.c:0 "They grow up so fast."
indonesia.7.d:0 "A challenger approaches?"
indonesia.8.t:0 "The Sutarjo Petition"
indonesia.8.desc:0 "While nationalistic sympathies have been running high in our colonies, the colonial government we have in place has managed to placate the native population and keep it relativly content. However, there is still many extremists and radicals among the nationalist and pro-independence ranks that have called for, if not complete freedom, increased autonomy for the East Indies. Thus the Sutarjo Petition was drawn just some days ago in the Volksraad and made it's way here."
indonesia.8.a:0 "A small price to pay for stability."
indonesia.8.b:0 "The situation as it stands works fine for us."
indonesia.9.t:0 "[FROM.GetNameDefCap] Accepts"
indonesia.9.desc:0 "After, most likely, fierce and fiery debates over the Sutarjo Petition, it has been decided that [ROOT.GetNameDefCap] shall achieve higher or even full autonomy within the Commonwealth of the Netherlands. This has proved to be a great success and there is, of course, somebody to thank for this, that being Sutarjo Kartohadikusumo, leader of the Native Civil Servants Association and all of his supporters."
indonesia.9.a:0 "Another step towards freedom!."
indonesia.10.t:0 "Freedom for the East Indies?"
indonesia.10.desc:0 "Nationalistic sympathies have run high in our colonies and reached a breaking point. Democratic agitators in the East Indies have begun demanding free elections and freedom from colonial control but are willing for an alliance in the future. How do we react?"
indonesia.10.a:0 "Better them than the communists."
indonesia.10.b:0 "Ungrateful colonials!"

indonesia.33.t:0 "[INS.GetNameDefCap] Claims Guinea!"
indonesia.33.desc:0 "Our shared border with the East Indies on the island of Guinea has always been a tense but restrained affair. However, tensions have broken, with the new [INS.GetAdjective] government demanding complete control and sovereignty over the island. What should we do?"
indonesia.33.a:0 "Give in to their demands."
indonesia.33.b:0 "Their independence has made them headstrong; ignore them."
indonesia.34.t:0 "[AST.GetNameDefCap] Submits!"
indonesia.34.desc:0 "Our threats worked; [Ast.GetNameDef] has surrendered all claims to Guinea, and control is being transferred to us immediately."
indonesia.34.a:0 "A victory for diplomacy!"
indonesia.35.t:0 "[AST.GetNameDefCap] Refuses!"
indonesia.35.desc:0 "Diplomacy has failed despite our best efforts; [Ast.GetNameDef] has ignored all our demands and continues as if nothing has changed."
indonesia.35.a:0 "Very well."
indonesia.35.b:0 "They will pay for this insolence."
indonesia.36.t:0 "[INS.GetNameDefCap] Claims Timor!"
indonesia.36.desc:0 "Our shared border with the East Indies on the island of Timor has always been a tense but restrained affair. However, tensions have come to a breaking point, with the new [INS.GetAdjective] government demanding complete control and sovereignty of the island. What should we do?"
indonesia.36.a:0 "Give in to their demands."
indonesia.36.b:0 "Their independence has made them headstrong; ignore them."
indonesia.37.t:0 "[721.Owner.GetNameDefCap] Cedes Timor!"
indonesia.37.desc:0 "The [721.Owner.GetAdjective] government, unable to project its forces, has decided to accept our demands instead of risking war."
indonesia.37.a:0 "A victory for diplomacy!"
indonesia.38.t:0 "[POR.GetNameDefCap] Refuses!"
indonesia.38.desc:0 "Diplomacy has failed despite our best efforts; [POR.GetNameDef] has ignored all our demands and continues as if nothing has changed."
indonesia.38.a:0 "Very well."
indonesia.38.b:0 "They will pay for this insolence."

################

indonesia.40.t:0 "[FROM.GetNameDefCap] Petitions for Colonial Freedom"
indonesia.40.desc:0 "The world has changed vastly since the Great War, and the time of colonial empires has become quite old-fashioned. The recently independent [FROM.GetName] is a prime example of the struggle of the native people under colonial rule for freedom and independence. Diplomats from the [FROM.GetAdjective] government and administration have pleaded and petitoned for us to allow our colonial holdings in Southeast Asia independence in exchange for a guarantee of [INS.GetAdjective] protection. What should we make of this offer?"
indonesia.40.a:0 "This might be in everyone's best interests..."
indonesia.40.c:0 "Our colonial holdings are of great strategic and economic importance, we shall not accept."

indonesia.41.t:0 "[FROM.GetNameDefCap] Agrees To Our Petition!"
indonesia.41.desc:0 "The [FROM.GetAdjective] government has agreed to withdraw it's military forces and diplomats from their colonial holdings in Southeast Asia. Most likely due to [ROOT.GetAdjective] pressure, they are inclined to believe that this might actually be in everyone's best interests as they wouldn't like [ROOT.GetNameDef] as their enemy in the region. Nonetheless, this marks yet another step towards the freedom of Asian peoples!"
indonesia.41.a:0 "A victory of diplomacy!"

indonesia.42.t:0 "[ROOT.GetAdjective] Independence Has Been Achieved!"
indonesia.42.desc:0 "Our brothers in [FROM.GetNameDef] have not taken their newfound independence for granted. They have petitioned [OVERLORD.GetNameDef] for the total independence of [ROOT.GetNameDef] and subsequent withdrawal of [OVERLORD.GetAdjective] military forces within Southeast Asia. The end of colonialism is near, our independence marks just another step towards it!"
indonesia.42.a:0 "Glory to the liberation of the [ROOT.GetAdjective] peoples!"
indonesia.42.b:0 "Our future lies with [OVERLORD.GetNameDef]..."

indonesia.45.t:0 "[FROM.GetNameDefCap] Refuses!"
indonesia.45.desc:0 "Despite our good intentions, our petition has fallen on deaf ears. [FROM.GetNameDefCap] has no plans on relinquishing control over it's colonial holdings within Southeast Asia. Sadly, colonialism and imperialism live yet another day!"
indonesia.45.a:0 "There is nothing we can do..."
indonesia.45.b:0 "Colonialism must meet it's fate, one way or the other!"

################

indonesia.46.t:0 "The Passing of Dr. Sutomo"
indonesia.46.d_1:0 "Reports has arrived from Surabaya about the recent death of Doctor Sutomo, leader of the Parindra, last night due to liver cancer.\n\nThe founder of Budi Utomo, the first Bumiputra political movement in the Indies, Dr. Sutomo has consistenly proved that by extolting one's virtue, independence can be brought by non-violent means compared to the more radical movements such as Sarekat Islam and Partai Nasional Indonesia. A funeral procession was to be taken place at Surabaya with his followers at Parindra such as his successor Wurjaningrat and the leader of Nationalist Faction in the Volksraad, Mohammad Husni Thamrin."
indonesia.46.d_2:0 "Reports has arrived from Surabaya about the recent death of President Sutomo, leader of our nation and our party Parindra, last night due to liver cancer.\n\nThe founder of Budi Utomo, the first Bumiputra political movement in the Indies, Dr. Sutomo has consistently proven that, while independence can be brought by non-violent means, ultimately the Indonesians needs to extol their virtues and assert themselves as the rightful owners of the Indonesian homeland.\n\nWhile Wurjaningrat has succeeded him as the party leader, a special convention is being held to elect the next President of [INS.GetNameDef]. By acclamation:"
indonesia.46.a:0 "A force of good, has gone"
indonesia.46.b:0 "Mohammad Husni Thamrin shall lead our nation!"
indonesia.46.c:0 "Wurjaningrat should ensure the transition is proceeding as intended"

indonesia.47.t:0 "Changing of the Guards"
indonesia.47.d:0 "With the recent promotion of Rear Admiral Ferwerda and Furstner in the Koninklijke Marine, Vice Admiral Maarten van Dulm would be officially retired at the age of 57 years old, having serve the East Indies Fleet since 1934 until now."
indonesia.47.a:0 "The Kingdom still needs his service"
indonesia.47.b:0 "Thank you for your service"

indonesia.48.t:0 "Choosing the Royal Candidate"
indonesia.48.d:0 "The leadership of Parindra has convened today to elect our future monarch for the Indonesian Sultanate. While the decision immediately agreed upon is to choose the House of Mataram as our dynasty, the position of monarch itself has two competing claims between the older branch led by the House of Paku Buwono and the younger branch led by the House of Hamengku Buwono. Which one would be our chosen monarch?"
indonesia.48.a:0 "The elder branch, House of Paku Buwono"
indonesia.48.b:0 "The younger branch, House of Hamengku Buwono"

indonesia.49.t:0 "The Passing of Paku Buwono X"
indonesia.49.d_1:0 "Sri Susuhonan Paku Buwono the Tenth, the Monarch of Surakarta, has passed away after a long battle of illness due to his old age. The funeral procession was attended by a number of Javanese, Indonesian, and even Dutch dignitaries, as he is widely respected for his acceptance towards the modernization process in the East Indies. It is expected that Raden Mas Ontoseno, Pangeran Hangabehi, would inherit his father's throne as Sri Susuhonan Paku Buwono XI."
indonesia.49.d_2:0 "Sri Susuhonan Paku Buwono the Tenth, our current monarch, has passed away after a long battle of illness due to his old age. The funeral procession was attended by numerous Indonesian officials, including First Minister Wurjaningrat himself. It is expected that Raden Mas Ontoseno, Pangeran Hangabehi, would inherit his father's throne as Sri Susuhonan Paku Buwono XI."
indonesia.49.a:0 "We offer condolences"
indonesia.49.b:0 "The nation mourns"

indonesia.50.t:0 "The Passing of Hamengkubuwono VIII"
indonesia.50.d_1:0 "Sri Sultan Hamengkubuwono the Eighth, the Monarch of Djogjakarta, has passed away due to a sudden heart attack whilst on a train home. The funeral procession was attended by a number of Javanese, Indonesian, and even Dutch dignitaries, including H. J. van Mook, who is a personal acquiantances with the late Sultan during his days as an agricultural officer at Djogjakarta. It is expected that Gusti Raden Mas Dorojatun would inherit his father's throne as Sri Sultan Hamengkubuwono IX."
indonesia.50.d_2:0 "Sri Sultan Hamengkubuwono the Eighth, the Monarch of Djogjakarta, has passed away due to a sudden heart attack whilst on a train home. The funeral procession was attended by numerous Indonesian officials, including [INS.GetLeader] himself. It is expected that Gusti Raden Mas Dorojatun would inherit his father's throne as Sri Sultan Hamengkubuwono IX."
indonesia.50.d_3:0 "Sri Sultan Hamengkubuwono the Eighth, our current monarch, has passed away due to a sudden heart attack whilst on a train home. The funeral procession was attended by numerous Indonesian officials, including First Minister Wurjaningrat himself. It is expected that Gusti Raden Mas Dorojatun would inherit his father's throne as Sri Sultan Hamengkubuwono IX."
indonesia.50.a:0 "Goodbye, old friend."
indonesia.50.b:0 "We offer condolences"
indonesia.50.c:0 "The nation mourns"

 indonesia.51.t:0 "Fall of the East Indies"
 indonesia.51.d:0 "With our most precious island of our country has become increasingly threatened by the enemy's hands, there is an increasing probability that Java would be invaded soon. With such vulnerable position, some key officials has been ordered to evacuate towards a more secure place to keep fighting from afar. For the rest of them who remained here, what should we do?"
 indonesia.51.a:0 "We must fight on abroad!"
 indonesia.51.b:0 "Continue the fight, until the end!"

 indonesia.52.t:0 "Conquest of the Southern Resource Territory"
 indonesia.52.d:0 "With fall of Java, the whole [INS.GetFactionName] effort on this area is shattered completely, and the Indian Ocean is completely open for our continued advance. Several member of Indonesian nationalists groups has presented themselves before the leading invasion forces, clearly seeking collaboration with us, in exchange for us to freely export their riches to fuel our war effort, exactly like what has been our aim since the start."
 indonesia.52.a:0 "We must keep our direct control"

 indonesia.53.t:0 "Death of Frederik de Hoog"
 indonesia.53.d:0 "Earlier this morning, a shocking news came from the Fatherland. Frederik Hermanus de Hoog, leader of the Indo-Europeesch Verbond, has passed away due to a brain stroke during his vacation there in purpose to recuperate from a heart failure earlier this year.\n\nFrederik de Hoog was an upstanding member of the East Indies society with many of his contributions helped his fellow Indos in the Malaise. A Leiden University alumni, he was a member in the IEV since 1920, appointed as a principal officer at the Staatspoor en Tramwegen in 1922, and finally member at the Volksraad in 1923 representing the IEV. During his tenure at both the IEV and Volksraad, De Hoog advocates for political and economic emancipation, both for to provide equal opportunity for all layers of society in the East Indies and also to prevent more extreme ideas to take hold in the archipelago.\n\nHe was to be buried at Bandung, attended by both IEV members, Volksraad members, and also officials from the Batavian government."
 indonesia.53.a:0 "Rest in Peace, Frederik"
 
 indonesia.54.t:0 "The Revolution Blooms!"
 indonesia.54.d:0 "Just hours after our proclamation of independence, the remnants of Dutch rule has seized key governmental posts in Batavia, North Sumatra, and also the Great East. It is clear that they would not stop until our resistance is fully extinguished."
 indonesia.54.a:0 "Merdeka atau Mati!!!"
 INS_NATREV_aggressor_tt:0 "§RWe would fight tooth and nail against foreign oppressors!§!\n"

 indonesia.55.t:0 "The Indonesian Uprising"
 indonesia.55.desc:0 "Attempts to contact Batavia for the last six hours after the midnight has met with eerie silence, but just this hour, a frantic message has arrived from Surabaya through Singapore. Following the closure of the Volksraad, escalated tensions between the Bumiputra militants and the colonial government, backed by NSB sympathizers, has led into a revolution led by the remnants of the Indonesian Communist Party."
 indonesia.55.a:0 "We are too preoccupied right now"
 indonesia.55.b:0 "Retake our Crown Jewel of the Empire!"
 indonesia.55.c:0 "We must take direct control of the situation!"
 indonesia.55.d:0 "Secure New Guinea at once!"

 indonesia.56.t:0 "[FROM.GetNameDefCap] Rejects"
 indonesia.56.desc:0 "After, most likely, fierce and fiery debates over the Sutarjo Petition, it has been decided that [ROOT.GetNameDefCap] shall retain it's current administrative and colonial position within the Commonwealth of the Netherlands. It appears that [FROM.GetNameDef] strives to maintain the status quo within [ROOT.GetNameDefCap] and possibly other colonies, fearing that accepting might be a show of weakness."
 indonesia.56.a:0 "At least they gave us an answer."
 indonesia.56.b:0 "Enough is enough! Freedom must be achieved by any means necessary!"
 
 indonesia.57.t:0 "The Revolution Triumphant!"
 indonesia.57.d:0 "Following the conquest of the last Dutch bastions, our people is finally freed from three centuries of colonialism.\n\nA question remained, however, about our own militias who has helped us to defeat the colonialists. While they are rightfully deserved to be integrated into our armed forces, a vocal group in our committee has demanded them to be disbanded altogether, but with a chance to receive proper training in our armed forces recruitment afterwards."
 indonesia.57.a:0 "They can be disbanded"
 indonesia.57.b:0 "They can be integrated into our Worker's Army"
 
 indonesia.58.t:0 "Return of the Communist Exiles"
 indonesia.58.desc:0 "Following the conclusion of the Indonesian Revolution, several prominent communists who has been exiled following the failed 1926-27 Revolution has been returned to the Motherland. Renowned revolutionary Tan Malaka has make himself known to the locals at Serang, Banten three days ago, and our first chairman Semaun has arrived at Semarang, Central Java a day after.\n\nAn impromptu Party Congress has been organized at [INS.GetCapitalVictoryPointName] today to decide the direction of the party would take, for the first time after the Indonesian independence. While the underground leadership of Amir Syarifuddin and Musso Munawar has been proved successful as shown with the current revolution, some comrades has pointed a need to reinstate a proper leadership for the upcoming days ahead."
 indonesia.58.a:0 "Bung Musso can help us connect with the Third International"
 indonesia.58.b:0 "Bung Malaka can show the way Nusantara was meant to be"
 indonesia.58.c:0 "Bung Semaun would unite us all just like the olden days"

#INS renames cities
indonesia.100.t:0 "Removing Colonialist Influence"
indonesia.100.desc:0 "Now that we are independent, a good first step in showcasing our autonomy would be changing the names of some of our cities. [HOL.GetAdjective] influence has no place in our new nation."
indonesia.100.a:0 "It shall be done!"
indonesia.100.b:0 "I like Hollandia."

indonesia.105.t:0 "The New Governor"
indonesia.105.desc:0 "The retirement of Cornelis de Jonge as Governor-general of the East Indies marks the end of an era. A strong, stubborn man, Jonge was firmly opposed to local autonomy and was also firmly pro-Dutch in his administration, rejecting most efforts to increase colonial autonomy. His replacement, Stachouwer, has yet to decide which way he will point the administration, but many are hoping for a breath of fresh air to kickstart independence movements."
indonesia.105.a:0 "May he govern well."

indonesia.107.t:0 "The First Sila"
indonesia.107.desc:0 "The Investigating Committee for Preparatory Work for Independence has created a draft of the guiding principles of our fledgling country known as the Pancasila or the Five Principles. However, they have reached a disagreement on what would be the first Sila. Incidentally, this would determine the place of Islam within the government. Some push for the implementation of Shariah for Muslims, while others would like to go further and hold every citizen accountable based on their respective religions. A minority among the Committee has also stated their desire for a secular Indonesia and another a monarchist one. After careful deliberation, the Committee has decided that the first Sila would be..."
indonesia.107.a:0 "...to follow the Sharia and walk with Allah."
indonesia.107.c:0 "...to honor God, Sultan, and Country."
indonesia.107.d:0 "...what the secularists propose."

#descripts
INS_reforming_the_army:0 "Army Reorganization"
INS_reforming_the_army_desc:0 "Our reforms, though long and painful, is soon to be a success! Our sons shall carry [INS.GetNameDef] like a bird of prey, watchful of all foes."
INS_naval_autonomy_ships:0 "§Y[HOL.GetName]§! will transfer several destroyers and light cruisers to [INS.GetNameDef]."
INS_naval_autonomy_ships_desc:0 "It is time for us to wield more naval autonomy from Den Haag by requesting the East Indies Fleet. This surely would improve our naval capabilities and become our first line of defense in case we are suddenly attacked by a foreign enemy."
INS_increase_convoy_production:0 "Increase Convoy Production"
INS_increase_convoy_production_desc:0 "Our islands are numerous, and our trade reaches far away well into Europe and even the Americas. We need to extensively expand our convoy merchant production capabilities to both support our future exports and imports of fine products too."
INS_concessions_to_the_nationalists:0 "Concessions to the National Elites"
INS_concessions_to_the_nationalists_desc:0 "By giving limited concession to the various regional leaders within the Indies, we can both ensure their loyalty towards the Kingdom and depower the remaining radical nationalist sentiments, whether it's Indies or Indonesian."
INS_promote_national_independence:0 "Promote National Independence"
INS_promote_national_independence_desc:0 "The Indies has become its own nation, as the people here are recognizing their shared homeland as the binding power of the nation rather than religion or race. We shall promote further this sentiment so that we can stand equal with the Netherlands behind the Kingdom on his time in need!"
INS_demand_volksraad_elections:0 "Demand Volksraad Elections"
INS_demand_volksraad_elections_desc:0 "To have a leader that properly represents their elector's wishes is a privilege that a democratic nation has, and ours is surely is! It is time to organize the first election in [INS.GetNameDef] to properly elect the prime minister that would represent our nation!"
INS_nationalize_the_factories:0 "Nationalize the Factories"
INS_nationalize_the_factories_desc:0 "Despite the numerous factories and dockyards existed in our archipelago, they are mostly owned by the private sector, invited by the Colonial Government to industrialize the lands. We ought to use them for the benefit of our people, with one way or another."
INS_issue_emergency_powers:0 "Issue Emergency Powers"
INS_issue_emergency_powers_desc:0 "The current extraordinary situation has called us for extraordinary measures. Hubertus Johannes van Mook has viewed by many as extraordinary, given his recent dealings with the Japanese economic delegates. It is time to entrust him with the responsibility to defend the archipelago!"
INS_implement_the_sharia:0 "Implement the Sharia"
INS_implement_the_sharia_desc:0 "Without a doubt, our nation is a religious one, with four-fifth of us are submitted to Allah. We must ensure the continuation of freedom of worship, with the obligation for our fellow Muslims to carry out Sharia law."
INS_equal_under_god:0 "Equal Under God"
INS_equal_under_god_desc:0 "As it have said in the Scripture, all people are created equal, even though they are not identical to one another. And so our Indonesian nation, despite of our religious differences, all believed in one supreme being. Enough with the exploitation of man by man!"
INS_death_to_colonialism:0 "Death to Colonialism!"
INS_death_to_colonialism_desc:0 "While we are thankful for our freedom, unfortunately, there are many others who are remained subjugated in our region. Let our freedom to be the first death throes of colonialism!"
INS_unite_the_ummah:0 "Unite the Ummah"
INS_unite_the_ummah_desc:0 ""
INS_liberate_the_northern_muslims:0 "Liberate the Northern Muslims"
INS_liberate_the_northern_muslims_desc:0 "Our oldest neighbor has been long subjugated by the British. It is time to finally throw back the British yoke from their lands and finally unite with our brethrens!"
INS_consolidate_the_right:0 "Consolidate the Nationalists"
INS_consolidate_the_right_desc:0 "The Indonesian nationalists has been long divided from one another, despite of our mutual adherence of a national struggle against the Dutch. Let us unite them so that we can be strong enough to break the shackles!"
INS_favour_the_radicals:0 "Favor the Radicals"
INS_favour_the_radicals_desc:0 "Since the days of Budi Utomo, our national movement seeks to cooperate with the colonial government to achieve freedom for our nation. No more. We cannot wait until all of us are deported to Digul one by one, and with the ongoing crisis, we must strike now!"
INS_reinvigorate_the_pfi:0 "Reinvigorate the PFI"
INS_reinvigorate_the_pfi_desc:0 "In mid-1933, Raden Notonindito and his fellow ultra-monarchists formed Partai Fasis Indonesia to restore the glory of Majapahit. While the party's old leadership has fallen to obscurity, we shall keep the idea alive. For a great Indonesia!"
INS_choosing_royal_after_coup_tt:0 "Upon the coup's success, a §Gtransitional period§! of reforming Indonesia into a §YMonarchy§! would start."
INS_utilize_the_youth:0 "Utilize the Youth"
INS_utilize_the_youth_desc:0 ""
INS_reorganize_the_underground:0 "Reorganize the PKI"
INS_reorganize_the_underground_desc:0 "The prevailing political and economic crisis, made by capitalist and imperialist incompetence, has resulted with revival of leftist ideas throughout the working class. We maybe were not strong enough in 1926, but now with this second chance and Kawan Musso's presence, perhaps we can finally break free!"
INS_the_new_party_leadership:0 "Replace the Party's Leadership"
INS_the_new_party_leadership_desc:0 "Rather than the failed Stalinists, we shall pass the revolutionary banner to the still-popular Indonesian National Party. Sukarno and Hatta's name has become even more popular with their languishing on Eastern Indonesia. Let every Dutch nightmare come true...."
INS_launch_the_revolution:0 "Launch the Revolution"
INS_launch_the_revolution_desc:0 "It is time for us to rise, we must break the chains these imperialists have imposed on us, and we shall fight down to the last man and woman!\n"Awake, the souls and the hearts, for a free Indonesia!""
INS_the_coup:0 "The [GetMonth] Coup"
INS_the_coup_desc:0 "It is time to deliver the final blow to the colonial system that has been shackled us for far too long. The Indonesian souls and bodies, rise up for a Great Indonesia!"
INS_reinforce_the_national_identity:0 "Reinforce the National Identity"
INS_reinforce_the_national_identity_desc:0 "Our Indonesian Nationalism does not rally behind a specific ethnic or religious identity, but it born out of love for our people, regardless of their background. Let it be taught to our fellow Indonesians to serve as a glue for our collective identity."
INS_implement_a_democratic_system:0 "Implement a Democratic System"
INS_implement_a_democratic_system_desc:0 "Our governance stems from the ordinary people's way of life, and ultimately it exists to serve them. Let any differences be talked through to achieve a mutually-agreed outcome."
INS_establish_true_equality:0 "Establish True Equality"
INS_establish_true_equality_desc:0 "Under the Dutch rule, there are wealth inequality, there are status inequality, and there are also ethnic inequality, all of those does which do not befit for our revolutionary nation. Let us do away with all of that."
INS_join_the_comintern:0 "Join the Comintern"
INS_join_the_comintern_desc:0 "The [SOV.GetName] has aided us in becoming independent from the Dutch rule. We must show our gratitude by joining the [SOV.GetFactionName], and thus we shall spread the proletariat revolution together!"

INS_popular_front:0 "Popular Front"
INS_popular_front_desc:0 "Our national movement are comprised of many organizations, but strived for the same goal of indepenence and sovereign self-rule!"
INS_emergency_powers:0 "Emergency Powers"
INS_emergency_powers_desc:0 "Our government is at war, and we will ensure our victory by any means necessary."
INS_equal_under_god_idea:0 "Equal Under God"
INS_equal_under_god_idea_desc:0 "As it have said in the Scripture, all people are created equal, even though they are not identical to one another. And so our Indonesian nation, despite of our religious differences, all believed in one supreme being. Enough with the exploitation of man by man!"
INS_unified_right:0 "Unified Right-Wing"
INS_unified_right_desc:0 "Our previously divided nationalist movements is now united under the banner of Partai Indonesia Raya. Together we are strong, divided we are weak!"
INS_indonesian_national_identity:0 "Indonesian National Identity"
INS_jewel_of_the_pacific_idea:0 "Jewel of the Pacific"
INS_jewel_of_the_pacific_idea_desc:0 "If [RAJ.GetNameDef] is the jewel of the British Empire, then the East Indies is our jewel. Our wealth and resources are the last significant vestige of the Dutch maritime empire, and we should do all we could to protect it."
INS_sharia_idea:0 "Sharia"
INS_sharia_idea_desc:0 "Without a doubt, our nation is a religious one, with four-fifth of us are submitted to Allah. We must ensure the continuation of freedom of worship, with the obligation for our fellow Muslims to carry out Sharia law."

