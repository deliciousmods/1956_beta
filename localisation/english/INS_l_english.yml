INS_surabaya_dm:0 "Surabaya Droogdok Maatschappij"
INS_surabaya_dm_desc:0 "Historically established at Surabaya on 1910 with several drydocks are operating there since 1913, including a 14.000 tonne drydock installed in 1916."
INS_pal_surabaya:0 "Penataran Angkatan Laut - Surabaya"
INS_pal_surabaya_desc:0 "The first Indonesian shipbuilding dry dock, assets acquired from nationalization of Surabaya DM at various point through a time period of 1945-1957."
INS_ptdi:0 "Aeronautical Planning and Construction Bureau"
INS_ptdi_desc:0 "Established from scratch in 1946 at Madiun, East Java."
INS_nv_merbabu:0 "N.V. Merbabu"
INS_sstw:0 "Staatspoor en Tramwegen"
INS_sstw_desc:0 "Established in 1875 at Bandung, the State Railways and Tramways Service is the government counterpart of the private Netherlands Indies Railway Company."
INS_jkari:0 "Jawatan Kereta Api Republik Indonesia"
INS_jkari_desc:0 "Established during the National Revolution, assets acquired from nationalization of both SSTW and NISM."
INS_daf:0 "Doorne's Aanhangwagen Fabriek - East Indies Division"
INS_gm_java:0 "General Motors - Java Trading Company"
INS_gm_java_desc:0 "Established in 1927 at Tanjung Priok, the first truck factory opened in 1938."
INS_toyota:0 "Toyota"
INS_hanomag:0 "Hannover MAG - East Indies Division"
INS_acf:0 "American Car and Foundry Company - East Indies Division"
INS_acf_desc:0 "Producing the famous M4 Sherman Tanks that would be used in the East Indies in late 1940s."
INS_artilerie_inrichtingen:0 "Artilerie Inrichtingen Bandung"
INS_artilerie_inrichtingen_desc:0 "Established at Bandung on 1923"
INS_psm:0 "Pabrik Senjata dan Mesiu"
INS_psm_desc:0 "The first Indonesian armament factory, acquired from nationalization of AI Bandung at 1949"
INS_aniem:0 "Algemeene Nederlandsch-Indische Electriciteis Maatschappij"
INS_aniem_desc:0 "Established at Surabaya on 1909"
INS_pln:0 "Perusahaan Listrik Negara"
INS_pln_desc:0 "The first Indonesian electricity company, acquired from nationalization of ANIEM at period of 1945-1954"
INS_nakajima:0 "Nakajima Hikouki Kaisha"
INS_sumitomo:0 "Sumitomo Shouji"
INS_kawasaki:0 "Kawasaki Juukougyou"
