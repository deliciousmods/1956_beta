INS_knil_incompetence_1_desc:0 ""
INS_knil_incompetence_1_showcase:0 "KNIL Incompetence"
INS_knil_incompetence_1_showcase_desc:0 "The KNIL (Royal Netherlands Indies Army) are lacking manpower since they only allowed Europeans and Indos citizens to serve. They are also suffering from heavy funding shortages and their tactics aren't suitable for the terrain of the East Indies.\n\n§GProgressing down the army branch would gradually improve this national spirit§!"
