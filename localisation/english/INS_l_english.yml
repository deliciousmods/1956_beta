INS_bank_java_desc:0 "Established at Batavia in 1828"
INS_bank_indonesia:0 "Bank Indonesia"
INS_bank_indonesia_desc:0 "Assets acquired from nationalization of De Javasche Bank and several other banks in the East Indies in 1953"
