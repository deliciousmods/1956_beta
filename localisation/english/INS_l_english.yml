#desc
INS_abikusno_cokrosuyoso_desc:0 "Born in 1897 at Madiun, East Java, Abikusno Cokrosuyoso was the oldest younger brother of the famed nationalist Cokroaminoto.\n\nA direct descendant of Hamengkubuwono I, he studied architecture at Queen Emma's Middle School at Surabaya. During these time, he also followed his brother's campaign in Sarekat Islam, in which the organization has grown from a strictly religious-economic organization into a prominent anti-colonialist political one.\n\nHe followed Agus Salim's lead on expelling the Socialist-aligned 'Red' faction within the organization led by Semaun until 1934, when both Cokrosuyoso and Salim parted ways over their difference on their ways on dealing with the Colonial Government. He also expelled the Ultra-Radical 'Black' Faction led by Kartosuwiryo who advocates outright violence towards the Dutch.\n\nNow leading the reformed Sarekat Islam of Indonesia Party, Cokrosuyoso remained commited on both his non-cooperation stance towards the government and his adherence to non-violent means to achieve greater autonomy for Indonesia."
INS_amir_syarifuddin_harahap_desc:0 "Born in 1907 at Medan, East Sumatra, Amir Syarifuddin Harahap is one of the prominent younger generation of Indonesian left-influenced nationalists.\n\nSon of a Batak nobleman and an affluent Malay, he was sent to study at Leiden and became involved in Mohammad Hatta's Perhimpunan Indonesia, where he was also influenced by French revolutionaries such as Robespierre.\n\nA few years after his return, Syarifuddin's journalistic activities at "Panorama" newspaper drew attention from the Dutch authorities, and he was arrested in mid-1933 for two years after publishing an inflammatory essay. It has been almost six months after his release, a long path awaits for him."
INS_bonifacius_cornelis_de_jonge_desc:0 "\nBorn in 1875 at Den Haag, the old Governor-General has enforced the Queen's rule over the East Indies for almost five years.\n\nHe oversaw the incarceration of prominent Indonesian independence figures such as Sukarno, Mohammad Hatta, and Sutan Syahrir into the Great East following the failed Indonesian Uprising of 1926.\n\nOther than that, he also rolled back the progressive reforms enacted during the first Ethical Policies era, including dismissing the Stuwgroep, a clique of Dutch intellectuals seeking to reform the colony in a more democratic approach led by Hubertus Johannes van Mook."
INS_hubertus_van_mook_desc:0 "Born in 1894 at Semarang, Central Java, Hubertus Johannes van Mook has became famously known for leading the 1917 Student Congress of the Indies at Leiden University, advocating for greater autonomy for the Bumiputras.\n\nOther than that, he is also a capable economic administrator and frequently sided with the more moderate left group during his time as a member of the Volksraad."
INS_husni_thamrin_desc:0 "Born in 1894 at Batavia, Mohammad Husni Thamrin is a prominent member of the Volksraad since 1927.\n\nA son of a government officer, Thamrin has shown an exceptional humility with his fellow Betawi peers, and excellence towards his peers at the Volksraad. Thamrin was the one who suggested the Kampung Verbetering program, a series of improvement for the Batavian slums after an outbreak of cholera following the Great Flood of Batavia in 1918."
INS_mohammad_hatta_desc:0 "Born in 1902 at Bukittinggi, West Sumatra, Mohammad Hatta was known as a prominent student leader among his intellectual peers within Perhimpunan Indonesia during his study at Rotterdam. He made his name in 1928 when after he was charged with sedition, he delivered a speech condemning Dutch oppression towards the Indonesian national movements.\n\nBack in the Indies since 1932, his activities to revive the buried PNI are noteworthy for being more troublesome than Sukarno's, who has been incarcerated at Bandung in 1930. But now, with his exile along with Syahrir at Boven Digul since 1933 under the orders of Governor-General De Jonge, his political activities has been much subdued."
INS_sukarno_desc:0 "Born in 1901 at Surabaya, East Java, Sukarno has made himself known with his activities at Jong Java, a Javanese youth association since his highshool days.\n\nFollowing the footsteps of his mentor, the late Umar Said Cokroaminoto, former leader of Sarekat Islam, Sukarno also involved himself with the nascent Indonesian nationalist movement, especially after he studied at Technische Hoogeschool te Bandung since 1921. In 1926 with the help of Cipto Mangunkusumo, he organizes a local general study club, which would become the Indonesian Nationalist Party just the year after. Following the politial crackdowns after the failed 1926 Rebellion, Sukarno's nationalist activities remained at large. But after an anti-colonial gathering in late 1929 at Yogyakarta, Sukarno was apprehended by the Politieke Inlichtingen Dienst and jailed in Bandung.\n\nAlthough he was sentenced to a four-year imprisonment, he was released just after one year of serving on account of a good conduct and opened an architectural firm before turning it into a means to supporting the weakened PNI. In August 1933 under the governorship of Bonifacius Cornelis de Jonge, Sukarno was arrested for the second time and immediately sentenced to exile at Ende in the island of Flores, Lesser Sunda Island.\n\n§YNow preoccupied himself with writing and teaching the local schoolkids about the East Indies, Sukarno is away from any political machinations in Java, for now....§!"
INS_tan_malaka_desc:0 "Born in 1897 at Limapuluh Kota, West Sumatra, the man has assumed numerous names during his exile since 1922. Elias Fuentes, Ossorio, Ahmad Gozali, and maybe a few more.\n\nIbrahim, Datuk Sutan Malaka was a leading figure for the Indonesian communists during the early days of ISDV on the onset of the Great War, his influence on the current nationalist and communist exiles is far-reaching, even when the man is still hiding from the Dutch authorities.\n\nBut one thing for certain, he seek nothing but complete liberation for the Indonesian Archipelago."

