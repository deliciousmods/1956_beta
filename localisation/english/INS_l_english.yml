INS_pal_surabaya:0 "Penataran Angkatan Laut - Surabaya"
INS_pal_surabaya_desc:0 "The first Indonesian shipbuilding dry dock, assets acquired from nationalization of Surabaya DM at various point through a time period of 1945-1957."
INS_ptdi:0 "Aeronautical Planning and Construction Bureau"
INS_ptdi_desc:0 "Established from scratch in 1946 at Madiun, East Java."
INS_nv_merbabu:0 "N.V. Merbabu"
INS_sstw:0 "Staatspoor en Tramwegen"
INS_sstw_desc:0 "Established in 1875 at Bandung, the State Railways and Tramways Service is the government counterpart of the private Netherlands Indies Railway Company."
INS_jkari:0 "Jawatan Kereta Api Republik Indonesia"
INS_jkari_desc:0 "Established during the National Revolution, assets acquired from nationalization of both SSTW and NISM."
INS_daf:0 "Doorne's Aanhangwagen Fabriek - East Indies Division"
INS_gm_java:0 "General Motors - Java Trading Company"
INS_gm_java_desc:0 "Established in 1927 at Tanjung Priok, the first truck factory opened in 1938."
