#INS renames cities
indonesia.100.t:0 "Removing Colonialist Influence"
indonesia.100.desc:0 "Now that we are independent, a good first step in showcasing our autonomy would be changing the names of some of our cities. [HOL.GetAdjective] influence has no place in our new nation."
indonesia.100.a:0 "It shall be done!"
indonesia.100.b:0 "I like Hollandia."

indonesia.105.t:0 "The New Governor"
indonesia.105.desc:0 "The retirement of Cornelis de Jonge as Governor-general of the East Indies marks the end of an era. A strong, stubborn man, Jonge was firmly opposed to local autonomy and was also firmly pro-Dutch in his administration, rejecting most efforts to increase colonial autonomy. His replacement, Stachouwer, has yet to decide which way he will point the administration, but many are hoping for a breath of fresh air to kickstart independence movements."
indonesia.105.a:0 "May he govern well."

indonesia.107.t:0 "The First Sila"
indonesia.107.desc:0 "The Investigating Committee for Preparatory Work for Independence has created a draft of the guiding principles of our fledgling country known as the Pancasila or the Five Principles. However, they have reached a disagreement on what would be the first Sila. Incidentally, this would determine the place of Islam within the government. Some push for the implementation of Shariah for Muslims, while others would like to go further and hold every citizen accountable based on their respective religions. A minority among the Committee has also stated their desire for a secular Indonesia and another a monarchist one. After careful deliberation, the Committee has decided that the first Sila would be..."
indonesia.107.a:0 "...to follow the Sharia and walk with Allah."
indonesia.107.c:0 "...to honor God, Sultan, and Country."
indonesia.107.d:0 "...what the secularists propose."

#descripts
INS_reforming_the_army:0 "Army Reorganization"
INS_reforming_the_army_desc:0 "Our reforms, though long and painful, is soon to be a success! Our sons shall carry [INS.GetNameDef] like a bird of prey, watchful of all foes."
INS_naval_autonomy_ships:0 "§Y[HOL.GetName]§! will transfer several destroyers and light cruisers to [INS.GetNameDef]."
INS_naval_autonomy_ships_desc:0 "It is time for us to wield more naval autonomy from Den Haag by requesting the East Indies Fleet. This surely would improve our naval capabilities and become our first line of defense in case we are suddenly attacked by a foreign enemy."
INS_increase_convoy_production:0 "Increase Convoy Production"
INS_increase_convoy_production_desc:0 "Our islands are numerous, and our trade reaches far away well into Europe and even the Americas. We need to extensively expand our convoy merchant production capabilities to both support our future exports and imports of fine products too."
INS_concessions_to_the_nationalists:0 "Concessions to the National Elites"
INS_concessions_to_the_nationalists_desc:0 "By giving limited concession to the various regional leaders within the Indies, we can both ensure their loyalty towards the Kingdom and depower the remaining radical nationalist sentiments, whether it's Indies or Indonesian."
INS_promote_national_independence:0 "Promote National Independence"
INS_promote_national_independence_desc:0 "The Indies has become its own nation, as the people here are recognizing their shared homeland as the binding power of the nation rather than religion or race. We shall promote further this sentiment so that we can stand equal with the Netherlands behind the Kingdom on his time in need!"
INS_demand_volksraad_elections:0 "Demand Volksraad Elections"
INS_demand_volksraad_elections_desc:0 "To have a leader that properly represents their elector's wishes is a privilege that a democratic nation has, and ours is surely is! It is time to organize the first election in [INS.GetNameDef] to properly elect the prime minister that would represent our nation!"
INS_nationalize_the_factories:0 "Nationalize the Factories"
INS_nationalize_the_factories_desc:0 "Despite the numerous factories and dockyards existed in our archipelago, they are mostly owned by the private sector, invited by the Colonial Government to industrialize the lands. We ought to use them for the benefit of our people, with one way or another."
INS_issue_emergency_powers:0 "Issue Emergency Powers"
INS_issue_emergency_powers_desc:0 "The current extraordinary situation has called us for extraordinary measures. Hubertus Johannes van Mook has viewed by many as extraordinary, given his recent dealings with the Japanese economic delegates. It is time to entrust him with the responsibility to defend the archipelago!"
INS_implement_the_sharia:0 "Implement the Sharia"
INS_implement_the_sharia_desc:0 "Without a doubt, our nation is a religious one, with four-fifth of us are submitted to Allah. We must ensure the continuation of freedom of worship, with the obligation for our fellow Muslims to carry out Sharia law."
INS_equal_under_god:0 "Equal Under God"
INS_equal_under_god_desc:0 "As it have said in the Scripture, all people are created equal, even though they are not identical to one another. And so our Indonesian nation, despite of our religious differences, all believed in one supreme being. Enough with the exploitation of man by man!"
INS_death_to_colonialism:0 "Death to Colonialism!"
INS_death_to_colonialism_desc:0 "While we are thankful for our freedom, unfortunately, there are many others who are remained subjugated in our region. Let our freedom to be the first death throes of colonialism!"
INS_unite_the_ummah:0 "Unite the Ummah"
INS_unite_the_ummah_desc:0 ""
INS_liberate_the_northern_muslims:0 "Liberate the Northern Muslims"
INS_liberate_the_northern_muslims_desc:0 "Our oldest neighbor has been long subjugated by the British. It is time to finally throw back the British yoke from their lands and finally unite with our brethrens!"
INS_consolidate_the_right:0 "Consolidate the Nationalists"
INS_consolidate_the_right_desc:0 "The Indonesian nationalists has been long divided from one another, despite of our mutual adherence of a national struggle against the Dutch. Let us unite them so that we can be strong enough to break the shackles!"
INS_favour_the_radicals:0 "Favor the Radicals"
INS_favour_the_radicals_desc:0 "Since the days of Budi Utomo, our national movement seeks to cooperate with the colonial government to achieve freedom for our nation. No more. We cannot wait until all of us are deported to Digul one by one, and with the ongoing crisis, we must strike now!"
INS_reinvigorate_the_pfi:0 "Reinvigorate the PFI"
INS_reinvigorate_the_pfi_desc:0 "In mid-1933, Raden Notonindito and his fellow ultra-monarchists formed Partai Fasis Indonesia to restore the glory of Majapahit. While the party's old leadership has fallen to obscurity, we shall keep the idea alive. For a great Indonesia!"
INS_choosing_royal_after_coup_tt:0 "Upon the coup's success, a §Gtransitional period§! of reforming Indonesia into a §YMonarchy§! would start."
INS_utilize_the_youth:0 "Utilize the Youth"
INS_utilize_the_youth_desc:0 ""
INS_reorganize_the_underground:0 "Reorganize the PKI"
INS_reorganize_the_underground_desc:0 "The prevailing political and economic crisis, made by capitalist and imperialist incompetence, has resulted with revival of leftist ideas throughout the working class. We maybe were not strong enough in 1926, but now with this second chance and Kawan Musso's presence, perhaps we can finally break free!"
INS_the_new_party_leadership:0 "Replace the Party's Leadership"
INS_the_new_party_leadership_desc:0 "Rather than the failed Stalinists, we shall pass the revolutionary banner to the still-popular Indonesian National Party. Sukarno and Hatta's name has become even more popular with their languishing on Eastern Indonesia. Let every Dutch nightmare come true...."
INS_launch_the_revolution:0 "Launch the Revolution"
INS_launch_the_revolution_desc:0 "It is time for us to rise, we must break the chains these imperialists have imposed on us, and we shall fight down to the last man and woman!\n"Awake, the souls and the hearts, for a free Indonesia!""
INS_the_coup:0 "The [GetMonth] Coup"
INS_the_coup_desc:0 "It is time to deliver the final blow to the colonial system that has been shackled us for far too long. The Indonesian souls and bodies, rise up for a Great Indonesia!"
INS_reinforce_the_national_identity:0 "Reinforce the National Identity"
INS_reinforce_the_national_identity_desc:0 "Our Indonesian Nationalism does not rally behind a specific ethnic or religious identity, but it born out of love for our people, regardless of their background. Let it be taught to our fellow Indonesians to serve as a glue for our collective identity."
INS_implement_a_democratic_system:0 "Implement a Democratic System"
INS_implement_a_democratic_system_desc:0 "Our governance stems from the ordinary people's way of life, and ultimately it exists to serve them. Let any differences be talked through to achieve a mutually-agreed outcome."
INS_establish_true_equality:0 "Establish True Equality"
INS_establish_true_equality_desc:0 "Under the Dutch rule, there are wealth inequality, there are status inequality, and there are also ethnic inequality, all of those does which do not befit for our revolutionary nation. Let us do away with all of that."
INS_join_the_comintern:0 "Join the Comintern"
INS_join_the_comintern_desc:0 "The [SOV.GetName] has aided us in becoming independent from the Dutch rule. We must show our gratitude by joining the [SOV.GetFactionName], and thus we shall spread the proletariat revolution together!"

INS_popular_front:0 "Popular Front"
INS_popular_front_desc:0 "Our national movement are comprised of many organizations, but strived for the same goal of indepenence and sovereign self-rule!"
INS_emergency_powers:0 "Emergency Powers"
INS_emergency_powers_desc:0 "Our government is at war, and we will ensure our victory by any means necessary."
INS_equal_under_god_idea:0 "Equal Under God"
INS_equal_under_god_idea_desc:0 "As it have said in the Scripture, all people are created equal, even though they are not identical to one another. And so our Indonesian nation, despite of our religious differences, all believed in one supreme being. Enough with the exploitation of man by man!"
INS_unified_right:0 "Unified Right-Wing"
INS_unified_right_desc:0 "Our previously divided nationalist movements is now united under the banner of Partai Indonesia Raya. Together we are strong, divided we are weak!"
INS_indonesian_national_identity:0 "Indonesian National Identity"
INS_jewel_of_the_pacific_idea:0 "Jewel of the Pacific"
INS_jewel_of_the_pacific_idea_desc:0 "If [RAJ.GetNameDef] is the jewel of the British Empire, then the East Indies is our jewel. Our wealth and resources are the last significant vestige of the Dutch maritime empire, and we should do all we could to protect it."
INS_sharia_idea:0 "Sharia"
INS_sharia_idea_desc:0 "Without a doubt, our nation is a religious one, with four-fifth of us are submitted to Allah. We must ensure the continuation of freedom of worship, with the obligation for our fellow Muslims to carry out Sharia law."

