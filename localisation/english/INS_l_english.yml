#focus ideas
#National spirits - Armed Forces
INS_volunteers_idea:0 "Interventionism"
INS_volunteers_idea_desc:0 "The KNIL has a long tradition of volunteerism; it is only natural to bring this exuberance into the 20th century."
INS_army_idea:0 "Disjointed Army"
INS_army_idea_desc:0 "Though adequate for peacekeeping, the reliance of our army on [HOL.GetAdjective] support, alongside a lack of native officers in our ranks, has left our military crippled and ineffective; significant reform is needed."
INS_army_idea_two:0 "Army Reforms"
INS_army_idea_two_desc:0 "Though true reform is a long way off, this is the first step."
INS_army_idea_two_1:0 "Army Reforms"
INS_army_idea_two_1_desc:0 "Though true reform is a long way off, this is the first step."
INS_army_idea_two_2:0 "Army Reforms"
INS_army_idea_two_2_desc:0 "Though true reform is a long way off, this is the next step."
INS_army_idea_two_3:0 "Army Reforms"
INS_army_idea_two_3_desc:0 "Though true reform is a long way off, this is the last step."
INS_army_idea_six:0 "Kartika Eka Paksi"
INS_army_idea_six_desc:0 "Our reforms, though long and painful, have been a success! Our sons shall carry [INS.GetNameDef] like a bird of prey, watchful of all foes."
INS_ace_idea:0 "Wings of the Motherland"
INS_ace_idea_desc:0 "[INS.GetNameDef] will rule its skies."
INS_coastal_entrenchment_idea:0 "Coastal Entrenchment"
INS_coastal_entrenchment_idea_desc:0 "Our coastal defense capabilities are lacking, but with careful management of our resources, we can afford to build up a limited amount of coastal forts in our important naval bases across the archipelago."
INS_abda_idea:0 "ABDA"
INS_abda_idea_desc:0 "American-British-Dutch-Australian Command"

INS_science_idea_1:0 "Education Reforms"
INS_science_idea_1_desc:0 "While improving, education is still reserved strictly for the elites, to the detriment of our nation."
INS_science_idea_two:0 "Local Universities"
INS_science_idea_two_desc:0 "Our education facilities are the pride of Southeast Asia; we have done well to teach tomorrow's leaders the lessons of today."

#National spirits - Political
INS_political_idea_two:0 "Colonial Loyalty"
INS_political_idea_two_desc:0 "There is no place to talk of violent revolution at this time; we must focus all our efforts on peaceful separation from the motherland."
INS_political_idea_two_1:0 "Colonial Loyalty"
INS_political_idea_two_1_desc:0 "There is no place to talk of violent revolution at this time; we must focus all our efforts on peaceful separation from the motherland."
INS_political_idea_democratic:0 "Democratic Support"
INS_political_idea_democratic_desc:0 "Democracy is the future; let us strive for it."
INS_political_idea_fascism:0 "Fascist Support"
INS_political_idea_fascism_desc:0 "A strong nation is needed to achieve independence, and a strong leader to guide it."
INS_political_idea_fascism_1:0 "Fascist Support"
INS_political_idea_fascism_1_desc:0 "A strong nation is needed to achieve independence, and a strong leader to guide it."
INS_political_idea_communism:0 "Communist Support"
INS_political_idea_communism_desc:0 "For too long, the rich have lorded over the commoner. No longer."
INS_political_idea_democratic_1:0 "Democratic Transition"
INS_political_idea_democratic_1_desc:0 "Our freedom was a success! Now, to return our government to peace."
INS_political_idea_democratic_2:0 "Guided Democracy"
INS_political_idea_democratic_2_desc:0 "Neither the West nor the East's traditions, our solution is our own."
INS_political_idea:0 "Kebangkitan Nasional"
INS_political_idea_desc:0 "Nationalistic sentiment runs rampant within all layers of Indonesian society, especially the lower class. Due to poor living conditions created by colonial abuse over the years the people of Indonesia grow more and more radical by the day. However, not all is black and white within the political landscape of Indonesia as there is many parties and movements still willing to cooperate with the [HOL.GetAdjective] administrators in order to promote and protect Indonesian interests."
INS_kebangkitan_nasional:0 "Kebangkitan Nasional"
INS_kebangkitan_nasional_desc:0 "Nationalistic sentiment runs rampant within all layers of Indonesian society, especially the lower class. Due to poor living conditions created by colonial abuse over the years the people of Indonesia grow more and more radical by the day. However, not all is black and white within the political landscape of Indonesia as there is many parties and movements still willing to cooperate with the [HOL.GetAdjective] administrators in order to promote and protect Indonesian interests."
INS_kebangkitan_nasional_2_desc:0 "Nationalistic sentiment runs rampant within all layers of Indonesian society, especially the lower class. Due to poor living conditions created by colonial abuse over the years the people of Indonesia grow more and more radical by the day. However, not all is black and white within the political landscape of Indonesia as there is many parties and movements still willing to cooperate with the [HOL.GetAdjective] administrators in order to promote and protect Indonesian interests."
INS_kebangkitan_nasional_3_desc:0 "Nationalistic sentiment runs rampant within all layers of Indonesian society, especially the lower class. Due to poor living conditions created by colonial abuse over the years the people of Indonesia grow more and more radical by the day. However, not all is black and white within the political landscape of Indonesia as there is many parties and movements still willing to cooperate with the [HOL.GetAdjective] administrators in order to promote and protect Indonesian interests."
INS_political_idea_4:0 "Unity in Diversity"
INS_political_idea_4_desc:0 "We are united together as a people in peace, not violence."
INS_political_idea_5:0 "Peacetime Economics"
INS_political_idea_5_desc:0 "Our freedom has been a long time coming, and it is now time to enjoy the results of our hard work; the people of [INS.GetNameDef] will no longer face unrest or war but peace and prosperity."
INS_political_idea_five:0 "Kemerdekaan"
INS_political_idea_five_desc:0 "We have waited for our freedom for so long that it is hard to believe we are finally here. May [INS.GetAdjective]s forever remember the day of our independence!"
INS_political_idea_five_1:0 "Kemerdekaan"
INS_political_idea_five_1_desc:0 "We have waited for our freedom for so long that it is hard to believe we are finally here. May [INS.GetAdjective]s forever remember the day of our independence!"

#National spirits - economic
INS_economy_idea:0 "[Root.getinseconname]"
INS_economy_idea_desc:0 "[Root.getinsecondesc]"
INS_economy_idea_two:0 "Koninklijk Paketvaart Maatschappij"
INS_economy_idea_two_desc:0 "The riches of Indonesia are here again, this time, for the people."
INS_colonial_economy:0 "De Malaise"
INS_colonial_economy_desc:0 "While we are a bountiful nation, so much of what we produce is sent overseas that our native economy suffers for it, even as we are struggling on our own economic crisis."
INS_postcolonial_economy:0 "Post-Colonial Economy"
INS_postcolonial_economy_desc:0 "The economic ruins brought by both De Malaise and the recent revolution leaves a rather large scar. We must fix them before the untenability of our economy becomes a political matter."
INS_science_idea:0 "Education Reforms"
INS_science_idea_desc:0 "While improving, education is still reserved strictly for the elites, to the detriment of our nation."

#EIR Ideas - Economic
INS_imperial_burden_1:0 "Imperial Burden-Sharing"
INS_imperial_burden_1_desc:0 "Since the beginning of De Crisisjaren, our profits are largely spent on paying the Imperial Defenses costs, in which three-fifth of it are being placed on our responsibility."
INS_imperial_burden_2_desc:0 "Since the beginning of De Crisisjaren, our profits are largely spent on paying the Imperial Defenses costs, in which three-fifth of it are being placed on our responsibility."
INS_imperial_burden_3_desc:0 "Since the beginning of De Crisisjaren, our profits are largely spent on paying the Imperial Defenses costs, in which two-fifth of it are being placed on our responsibility."
INS_imperial_burden_4_desc:0 "Since the beginning of De Crisisjaren, our profits are largely spent on paying the Imperial Defenses costs, in which two-fifth of it are being placed on our responsibility."
INS_imperial_burden_5_desc:0 "Since the beginning of De Crisisjaren, our profits are largely spent on paying the Imperial Defenses costs, in which now our share has been lessened to be just one-fifth of it."
INS_japanese_investment_1:0 "Economic Dependence on the Japanese"
INS_japanese_investment_1_desc:0 "The Malaise largely affects the European and American markets and would deprieve us from our much-needed cash if not for a new source of investment, the rising power of the Japanese Empire.\n\nUnless the Western powers managed to counteract the Japanese enroachment into our economy, our clear economic disavantage means that we would need to abide by the Japanese demands for the time being, lest they would disrupt the peace by taking this land for themselves.\n\n§RThis national spirit would cease either upon war declaration between us or our faction member and the Japanese, or directly supporting a country at war with Japan.§!"
INS_japanese_investment_2_desc:0 "The Malaise largely affects the European and American markets and would deprieve us from our much-needed cash if not for a new source of investment, the rising power of the Japanese Empire.\n\nUnless the Western powers managed to counteract the Japanese enroachment into our economy, our clear economic disavantage means that we would need to abide by the Japanese demands for the time being, lest they would disrupt the peace by taking this land for themselves.\n\n§RThis national spirit would cease either upon war declaration between us or our faction member and the Japanese, or directly supporting a country at war with Japan.§!"
INS_japanese_investment_3_desc:0 "The Malaise largely affects the European and American markets and would deprieve us from our much-needed cash if not for a new source of investment, the rising power of the Japanese Empire.\n\nUnless the Western powers managed to counteract the Japanese enroachment into our economy, our clear economic disavantage means that we would need to abide by the Japanese demands for the time being, lest they would disrupt the peace by taking this land for themselves.\n\n§RThis national spirit would cease either upon war declaration between us or our faction member and the Japanese, or directly supporting a country at war with Japan.§!"
INS_japanese_surprise_1:0 "Japanese Surpise Attack!"
INS_japanese_surprise_1_desc:0 "The perfidious Japanese has finally revealed their true colors and attacked us! Despite of that, years of Japanese enroachment into our economy would meant that they has a clear advantage compared to ours. An effort has been undertaken to mitigate it for the time being."
INS_japanese_surprise_2_desc:0 "The perfidious Japanese has finally revealed their true colors and attacked us! Despite of that, years of Japanese enroachment into our economy would meant that they has a clear advantage compared to ours. An effort has been undertaken to mitigate it for the time being."
INS_japanese_surprise_3_desc:0 "The perfidious Japanese has finally revealed their true colors and attacked us! Despite of that, years of Japanese enroachment into our economy would meant that they has a clear advantage compared to ours. An effort has been undertaken to mitigate it."
INS_malaise_1:0 "The Malaise"
INS_malaise_1_desc:0 "The Great Depression, or as they called here as The Malaise, has shocked our economy much, evenmore than the aftermath of 1926 Rebellion. Whilst the worst effects has been contained, thanks for the Japanese and investments from Den Haag, our industry is still pretty much stagnant until further investments are drawn to stimulate it again.\n\n§GCompleting national focus "End the Malaise" would remove completely the remaining effects of the Malaise.§!"
INS_malaise_2:0 "Economic Recovery"
INS_malaise_2_desc:0 "Our government has began to address the Malaise by reforming several economic laws regarding trade flexibility.\n\n§GCompleting national focus "End the Malaise" would remove completely the remaining effects of the Malaise.§!"
INS_malaise_3:0 "Internal Strengthening"
INS_malaise_3_desc:0 "With factories built in our own territory, our economy would not be depended as much to the foreign markets, as millions of our people would be the first and foremost beneficiaries of it.\n\n§GCompleting national focus "End the Malaise" would remove completely the remaining effects of the Malaise.§!"
INS_malaise_4:0 "Return to Normalcy"
INS_malaise_4_desc:0 "Our economy has largely devoid of any post-Malaise stagnations, and the time is near for us to officialy proclaim the end of The Malaise!\n\n§GCompleting national focus "End the Malaise" would remove completely the remaining effects of the Malaise.§!"
INS_luxury_goods:0 "Luxury Goods Export"
INS_luxury_goods_desc:0 "Sugarcanes! Tea leaves! Coffee beans! Indigo leaves! What splendor that the East Indies has for the world. While it is not much compared to the Indian products, our own has its qualities too that is worth to be exported on.\n\n§RThe loss of Sumatra and Java would render this national spirit moot.§!"
INS_strength:0 "Strengthened Economy"
INS_strength_desc:0 "Our position is vital and our economy is important. It would be stupid for our future enemies to disrupt world trade by attacking us!"
INS_unity:0 "United We Stands"
INS_unity_desc:0 "Whoever the enemy is, no matter what strong they are, our spirit remains unbreakable and we are ready to fight them down to the smallest villages!"
INS_attract_foreign_industry:0 "Attract Foreign Industry"
INS_attract_foreign_industry_desc:0 "The central government has decided to sign a short-term contract with foreign industrial magnates to helped us with our development in the Indies, lightening up our financial burden and allow us to dedicate our resources elsewhere."
INS_attract_foreign_investors:0 "Attract Foreign Investors"
INS_attract_foreign_investors_desc:0 "The central government has decided to sign a short-term contract with foreign industrial magnates to helped us with our development in the Indies, lightening up our financial burden and allow us to dedicate our resources elsewhere."

#Ethical Policy
INS_agrarian_society_1:0 "Agrarian Society"
INS_agrarian_society_1_desc:0 "Outside of the Europeans, Indos, and Orientals, there are the Bumiputras whose agrarian way of life were still left untouched and has managed to provide for their fellow displaced factory workers after the Malaise.\n\nWhile it has quelled further resentments for now, their subsistence farming methods leaves little for them to further improve their own well-beings... and also our own capabilities to recruit capable men to defend our lands too.\n\n§GEnacting agrarian reforms-related decisions unlocked by national focus "Reinstate the Ethical Policies" or "Build New Schools" would gradually decrease the effect.§!\n\n§YIrrigation Projects§! required: 1 \n§YTransmigration Projects§! required: 1 \n§YEducational Projects§! required: 1 \n\n§YTotal Projects§! required: 4"
INS_agrarian_society_2:0 "Traditional Society"
INS_agrarian_society_2_desc:0 "Outside of the Europeans, Indos, and Orientals, there are the Bumiputras whose agrarian way of life were still left untouched and has managed to provide for their fellow displaced factory workers after the Malaise.\n\nWhile it has quelled further resentments for now, their subsistence farming methods leaves little for them to further improve their own well-beings... and also our own capabilities to recruit capable men to defend our lands too.\n\n§GEnacting agrarian reforms-related decisions unlocked by national focus "Reinstate the Ethical Policies" or "Build New Schools" would gradually decrease the effect.§!\n\n§YIrrigation Projects§! required: 3 \n§YTransmigration Projects§! required: 5 \n§YEducational Projects§! required: 3 \n\n§YTotal Projects§! required: 12"
INS_agrarian_society_3:0 "Developing Society"
INS_agrarian_society_3_desc:0 "Outside of the Europeans, Indos, and Orientals, there are the Bumiputras whose agrarian way of life were still left untouched and has managed to provide for their fellow displaced factory workers after the Malaise.\n\nWhile it has quelled further resentments for now, their subsistence farming methods leaves little for them to further improve their own well-beings... and also our own capabilities to recruit capable men to defend our lands too.\n\n§GEnacting agrarian reforms-related decisions unlocked by national focus "Reinstate the Ethical Policies" or "Build New Schools" would gradually decrease the effect.§! \n\n§YTotal Projects§! required: 16"
INS_agrarian_society_4:0 "Developed Society"
INS_agrarian_society_4_desc:0 "With most of our citizens are currently properly educated and are capable to be conscripted in our time of need, there are still some agricultural villages and tribes that are largely autonomous from our governace and mostly secluded from the outside world such as the Badui villages in West Java, Saminist villages in East Java, and the hunter-gatherers in New Guinea. For the time being, there is nothing much we can do for them, but eventually they would find the way to open themselves."
INS_education_elitist:0 "Elitist Educational Program"
INS_education_elitist_desc:0 "Formulated by Dr. Christiaan Snouck Hurgronje and Jacques Henrij Abendanon and implemented in the first five years of the First Ethical Policy era, this method of education was aimed to create a new class of intellectual Bumiputras who would helped the colonial administrators to manage the colony until a sufficient size has achieved and they would eventually lead it."
INS_education_nationalist:0 "Broad Educational Program"
INS_education_nationalist_desc:0 "Formulated by Governor-General Johannes Benedictus van Heustz and Alexander Willem Frederik Idenburg and implemented from 1905 to 1930, this method of education was aimed to improve the overall welfare of the whole populace on this colony by giving necessary tehnical, engineering, and scientific educations for the aspirants and eventually opening work opportunities for the others."
INS_education_tamansiswa:0 "Tamansiswa Educational Program"
INS_education_tamansiswa_desc:0 "Formulated by Ki Hajar Dewantara, formerly known as Raden Mas Suwardi, and implemented in his Taman Siswa schools since 1922, this method of education was aimed to properly educate the masses, with not just preparing them for any technical-related jobs in the future, but also to develop their inherent talents with the available means around them. Inspired by renowned educational pioneers such as Maria Montessori, Friedrich Frobel, and Rabindranath Tagore, Taman Siswa is purely aimed to develop the native society and adapted them into the modern age."
ASEAN_agrarian_society_1:0 "Agrarian Society"
ASEAN_agrarian_society_2:0 "Traditional Society"
ASEAN_agrarian_society_3:0 "Developing Society"
