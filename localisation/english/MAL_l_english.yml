 # Events
 r56_malaysia.1.t:0 "Sultan of Johor Expresses Interest in a Johorean Airforce"
 r56_malaysia.1.desc:0 "After our recent advancements in the aerodynamics field, the Sultan of Johor, Ibrahim, has shown great interest in developing a Johorean airforce based in his sultanate down south. With the Sultanate of Johor already possesing its own army independent from us and [ENG.GetNameDef], would an airforce of its own make Johor an obstacle in the future if we come into conflict with the state?"
 r56_malaysia.1.a:0 "Delusional."
 r56_malaysia.1.b:0 "Tell him to cut the idea short."

