 # Ideas
 MAL_neglected_army_idea_r56:0 "Neglected Army"
 MAL_neglected_army_idea_r56_desc:0 "From the times of the Malacca and Johor Sultanates who dominated the region now known as the Malaya Peninsula, the Malays have always been known to fight with glory and were formidable forces in their time. But after many violent confrontations between these Malay states and the European powers, it left their armies shattered, and this weakness allowed for much of the peninsula to fall under the influence of [ENG.GetNameDef]. \n\nNow, [ROOT.GetNameDef] rely on [ROOT.OVERLORD.GetNameDef] for its defense against foreign threats, which has left the army lacking the necessary funds and to become neglected by the government. If we want to fully ensure our own security, we must restore Malaya's former military capabilities."

 MAL_dependency_on_uk_r56:0 "Economic Dependence on [ENG.GetNameDef]"
 MAL_dependency_on_uk_r56_desc:0 "We currently relay heavily on [ENG.GetNameDef] economically."

 MAL_allocated_funds_idea_r56:0 "Allocated Funds"

 MAL_allocated_funds_idea_to_navy_r56:0 "Allocated Funds to the Formation of a [ROOT.GetAdjective] Navy"
 MAL_allocated_funds_idea_to_navy_r56_desc:0 "Currently we are allocating funds to the creation of a Malaysian naval force that can fend off future threats from the sea."

 MAL_spent_too_much_money_r56:0 "Overspent Budget"
 MAL_spent_too_much_money_r56_desc:0 "After the failure to establish airbases all around the Malay peninsula, many investors and government officials have withdrawn their funding from the project, leading to temporary economic strain."

