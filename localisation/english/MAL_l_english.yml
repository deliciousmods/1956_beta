 MAL_obtain_soviet_military_assistance_r56: "Obtain [SOV.GetAdjective] Military Assistance"
 MAL_obtain_soviet_military_assistance_r56_desc: "Our movement lacks the necessary amount of arms to pose an existential threat to our occupiers. To be able to stand a chance against these imperialists, we must acquire a substantial amount of weapons in order to equip our men for the upcoming battle against the occupiers. Many in our upper ranks have suggested reaching out to [SOV.Capital.GetCapitalVictoryPointName], who may be willing to spread the revolution."

 MAL_purge_lai_teck_r56: "Purge Lai Teck From the Party"
 MAL_purge_lai_teck_r56_desc: "Lai Teck's many connections, especially to the Anglos, has raised suspicion amongst our fellow party members. With his connections, many in the party believe he may be a double, or at worst, a triple agent. We must get rid of this liability before it explodes in our faces."

 MAL_reinforce_lai_tecks_control_r56: "Reinforce Lai Teck's Position"
 MAL_reinforce_lai_tecks_control_r56_desc: "Lai Teck's commitment to the party has earned him his position as the main leader of the Malayan Communist Party. We shall advance fourth under his guidance and liberate the peninsula once and for all!"

