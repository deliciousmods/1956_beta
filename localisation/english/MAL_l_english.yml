 r56_malaysia.2.t: "[FROM.GetCommunistParty] Requests Weapon Shipments"
 r56_malaysia.2.desc: "After the capitulation of the colonial regime in Singapore, the Malayan Communist Party, an offshoot of the Chinese Communist Party, seeks our aid in their cause to liberate the Malay peninsula from imperialist powers and to establish a socialist state on the peninsula. Malaya holds an abundance of raw materials, materials which we can acquire if a friendly regime is set up in Singapore."
 r56_malaysia.2.a: "This is too good of a deal."
 r56_malaysia.2.b: "We are preoccupied pal."

 r56_malaysia.3.t: "[FROM.GetNameDefCap] Sends Weapons"
 r56_malaysia.3.desc: "After receiving our plea, [FROM.GetLeader] has decided to sympathize with our cause and has ordered a large shipment of [FROM.GetAdjective] weapons to be dropped off at an undisclosed location in the Malayan jungle, where our partisans can get a hold of the weapons and use them to combat the imperialist scum."
 r56_malaysia.3.a: "Great."

 r56_malaysia.4.t: "[FROM.GetNameDefCap] Refuses to Aid Us"
 r56_malaysia.4.desc: "[FROM.GetNameDefCap] has refused to aid our cause against the imperialist scum, saying that their stockpiles will serve a better purpose elsewhere."
 r56_malaysia.4.a: "Unfortunate."

 r56_malaysia.5.t: "[FROM.GetAdjective] Revolutionaries Secure Power"
 r56_malaysia.5.desc: "Hours ago, the Malayan Communist Party announced to the world that it will take up arms against their occupiers, and proclaimed themselves as the true government of Malaya, directly contesting our rule."
 r56_malaysia.5.a: "Whatever."

 r56_malaysia.6.t: "Lai Teck Purged From the Malayan Communist Party"
 r56_malaysia.6.desc: "As a result of suspicion and paranoia amongst the party's members, a coalition from both the mainstream and off shoots of the Malayan Communist Party have overthrown and subsequently purged Lai Teck. Now, a power vacuum is present within the party, and we must decide who shall take up Lai Teck's position."
 r56_malaysia.6.a: "Elevate Chin Peng forwards!"

 r56_malaysia.7.t: "An Opportunity Presents Itself"
 r56_malaysia.7.desc: "The Malayan Communist Party is without a doubt a major thorn in the [JAP.GetAdjective]s side, and the [JAP.GetAdjective] government most certainly seeks to eliminate it. In addition, opposition to Lai Teck's rule still exists within the party. This opportunity to collaborate with our occupiers in order to secure Lai Teck's control over the party is a once in a life time opportunity. We must take time considering this."
 r56_malaysia.7.a: ""Crush two birds with one stone""
 r56_malaysia.7.b: "We should be ashamed of even considering this."

 r56_malaysia.8.t: "Malay Partisans Retreat to the Jungle"
 r56_malaysia.8.desc: "Following our conquest of the Malay Peninsula, many resistance fighters have fled to the dense Malay jungle in an attempt to avoid capture by our authorities. From there, they will be able to launch raids against our posts and infrastructure."
 r56_malaysia.8.a: "Keep an eye out for them."

 r56_malaysia.9.t: "An Offer From Singapore"
 r56_malaysia.9.desc: "Earlier this morning, an anonymous resident in Singapore has approached our garrison, wishing to strike a deal with our government. This individual proposes that we aid Malaya's independence organisations in exchange for their cooperation with our authorities. While this is certainly not the first time we've received such offers, it may help lift garrison duties from our already stretched armed forces in the area."
 r56_malaysia.9.a: "Welcome aboard!"
 MAL_tooltip_this_can_lead_to_collab: "Once §Y[FROM.GetNameDef]§! completes either the §Y"What Must be Done"§! or §Y"An Ally, Not a Subject"§! focuses, §YMalaya§! will respawn as our §OPuppet§!."
 r56_malaysia.9.b: "How can we trust them?"
 MAL_i_think_motomoto_no_like_u:0 "§Y[JAP.GetNonIdeologyName]§! Rejected Collaboration."

