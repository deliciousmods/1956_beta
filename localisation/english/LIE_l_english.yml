 LIE_the_rotter_opportunity:0 "The Rotter Opportunity"
 LIE_the_rotter_opportunity_desc:0 "We as a people should quit looking at the Rotter kidnapping as a curse and much more as a blessing, with this mindset we can take our place amongst the fascist powers of the world."
 LIE_coup_the_government:0 "Coup the Government"
 LIE_coup_the_government_desc:0 "With our support within the Liechtenstein state secured, we must demand an end to the incompetent and lax government that has weakened our nation for far too long. We must strike while the iron is hot."
 LIE_full_german_military_integration:0 "Full [GER.GetAdjective] Military Integration"
 LIE_full_german_military_integration_desc:0 "With Germany once again proving to be Europe's most vital power, we should seek their assitance in integrating our military capabilities with theirs."
 LIE_german_equipment:0 "[GER.GetAdjective] Equipment"
 LIE_german_equipment_desc:0 "Further integration into Germany's Wehrmacht must include the standard-issuing of their most elite infantry equipment. We should dispatch an envoy to Berlin, officially requesting the authority to begin domestic production of their armaments."
 LIE_brothers_in_arms:0 "Brothers in Arms"
 LIE_brothers_in_arms_desc:0 "With our armed forced highly integrated and with German relations at a high, now is the time to request our formal entry into the Axis."
 LIE_eradicate_communism:0 "Eradicate Communism"
 LIE_eradicate_communism_desc:0 "It is no secret that Fascism is ideologically opposed to Communism, as such we shall seek to root it out not only in our own country but around the world."
 LIE_invade_the_soviets:0 "Invade the [SOV.GetAdjective]s"
 LIE_invade_the_soviets_desc:0 "The biggest continental threat to all of Europe is that of the [SOV.GetAdjective]'s as such we must strike them first as to avoid a Russian dominated Europe."
 LIE_alliance_with_the_industrialists:0 "Alliance with the Industrialists"
 LIE_alliance_with_the_industrialists_desc:0 "By making an alliance with the few industrailists in the nation, we can safely nationalize assets to better serve the state as a whole."
 LIE_radical_autarky:0 "Radical Autarky"
 LIE_radical_autarky_desc:0 "The idea of Autarky is a popular one amongst the German people as such we too shall seek to emulate it ourselves in order to better preseve the state."
 LIE_eliminate_the_vestiges:0 "Eliminate the Vestiges"
 LIE_eliminate_the_vestiges_desc:0 "Whatever resistance is left of the government and it's supporters should be swiftly rooted out to better secure our position in power."
 LIE_the_liechtenstein_ss:0 "The [ROOT.GetAdjective] SS"
 LIE_the_liechtenstein_ss_desc:0 "Germany's SS has been one of the many successful ideas to come out of the new Germany. With the threat of communism rampant, we must ourselves emulate this idea to its fullest effect, which will bolster our military capabilities as well."
 LIE_ministry_of_public_enlightenment:0 "Ministry of Public Enlightenment"
 LIE_ministry_of_public_enlightenment_desc:0 "Propaganda is a powerful force in any country and Liechtenstein is no different, we must encourage our population to fight for the security of the nation."
 LIE_social_welfare:0 "Social Welfare"
 LIE_social_welfare_desc:0 "By investing in an expansion of social welfare, we shall have the means to strengthen the minds of Liechtenstein."
