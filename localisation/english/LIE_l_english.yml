 LIE_partitioning_russia_desc:0 "Even with all of our might and glory, we are, at the end of the day, a tiny rock in the middle of Europe. We cannot hope to liberate all of Russia on our own, and it is as unrealistic to expect other's to aid us in this cause... Unless we were to grant concessions to these nations in exchange for their help against the red menace.."
