 form_russia_category: "Reclaiming the Motherland"
 form_russia_category_desc:0 "After the Russian civil war, we were driven out of our motherland and forced to find asylum abroad, landing us in the mountains of Liechtenstein. But with renewed strenght and new allies by our side, we shall take back what's rightfully ours from the Bolshevik scum and reestablish Russia's glory for centuries to come."
 form_russia:0 "Form Russia"
 form_russia_desc:0 "As the sun sets in Moscow, the White-blue-red flag is raised above the Kremlin once more, as the Bolshevik threat is driven out of the motherland into the sea. People on the streets greet their Russian comrades with joy, knowing that the tyrannical rule of the Bolshevik government finally comes to an end once and for all. [ROOT.GetLeader] stands in the city square, reading out his proclamation to the citizens of Moscow: \n\n"Today marks the return of the true Russian government to Russia. I hereaby declare the end of the illegitimate Soviet state, and the reestablishment of the Russian Empire!""
 bring_back_white_names:0 "Decommunization Efforts"
 question_of_the_capital_russia:0 "Question of the Capital"
 reintegrate_the_don_republic:0 "Reintegrate the Don Republic"
 reintegrate_the_don_republic_desc:0 "The Don Cossacks were instrumental in the White effort during the Russian civil war, with them playing a key part in the southern frontier and keeping Soviet forces preoccupied. This sacrifice and loyalty has not gone unnoticed by our administration. We should award their loyalty to the White cause by granting them citizenship within the New Russia."
 reclaim_the_kuban_region:0 "Reclaim the Southern Cossack Hosts"
 reclaim_the_kuban_region_desc:0 "Much like their counterparts in the north, the southern Cossacks of Kuban and Terek were crucial in fighting against the Bolsheviks in the Russian civil war. Similarly, we should award them too with citizenship privileges."
 concessions_to_kalmyks:0 "Grant Political Concessions to Kalmyks"
