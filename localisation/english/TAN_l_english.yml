l_english:

 TAN_Industrial_Start:0 "Begin Industrial Buildup"
 TAN_Industrial_Start_desc:0 "An era of change is coming. Investments are coming in, machines are being invented and our country must adapt in order to cope with those evolutions."
 TAN_increase_sedentarization:0 "Increase Sedentarization"
 TAN_increase_sedentarization_desc:0 "Our nomadic population is not as economically productive and we need to settle them if we want to stimulate our industrialization."
 TAN_Futher_Investments:0 "Encourage Foreign Investors"
 TAN_Futher_Investments_desc:0 "Foreign powers have a much greater industry than our own, therefore we must rely on their knowledge."
 TAN_Civilian_One:0 "Expand Civilian Manufactures"
 TAN_Civilian_One_desc:0 "New factories are essential for a modern country."
 TAN_Civilian_Two:0 "Improve Civilian Industry Capacity"
 TAN_Civilian_Two_desc:0 "Our industry has to be modernized to keep up with the demands of our age."
 TAN_Research:0 "New Schools & Modern Teaching"
 TAN_Research_desc:0 "Instruction is the basis of science and the key to adapt to the current world."
 TAN_Excavation:0 "Reveal Mineral Wealth"
 TAN_Excavation_desc:0 "Richness necessary for war may be hidden deep under our soil and its our duty to reveal them."
 TAN_Refinery:0 "Focus on Synthetic Processing"
 TAN_Refinery_desc:0 "The fabrication of oil and rubber from coal enables to be free from the need to import oil or control oil fields. This synthetic oil is however much more polluting and costly to produce."
 TAN_Autarky:0 "Reform the Taxes"
 TAN_Autarky_desc:0 "With a more organized administrative power, the state will be better equipped to deal with the current difficulties."


 TAN_Military_Buildup:0 "Expand Military Capacity"
 TAN_Military_Buildup_desc:0 "The military requires vast quantities of new equipment. Constructing few factories will surely satisfy their needs."
 TAN_Invite_Japanese:0 "Invite Japanese Investors"
 TAN_Invite_Japanese_desc:0 "Many Japanese corporations are interested in exerting their influence and presence around the world. We can use their good relations to us and appeal for a few humble investments."
 TAN_Japanese_Heavy:0 "Japanese Heavy Industry Expansion"
 TAN_Japanese_Heavy_desc:0 "Stable industrial cooperation with our Japanese allies is helping us to modernise heavy industry"
 TAN_Invite_American:0 "Invite American Investors"
 TAN_Invite_American_desc:0 "The Great Powers of Western hemisphere are always interested in exerting their influence and freedom values around the world. We can use their good relations to us and appeal for a few humble investments."
 TAN_American_Air:0 "American Air Industry Expansion"
 TAN_American_Air_desc:0 "Planes are future of trade, tourism and warfare. Under the guidance of the USA we can open even more new factories"
 TAN_Invite_Soviets:0 "Invite Soviet Planners"
 TAN_Invite_Soviets_desc:0 "Unique Soviet architecture and city planning are surely applicable for many facilities around our own country. Constructing a brand-new industrial complex should be a first step in our cooperation."
 TAN_Soviet_Heavy_Industry:0 "Communist Heavy Industry"
 TAN_Soviet_Heavy_Industry_desc:0 "Our communist friends are suggesting a coordinated expansion of our heavy industry."
 TAN_Automobile:0 "Automobile Industry"
 TAN_Automobile_tt:0 "Gain small amount of §HMotorized Equipment§! from invited companies."
 TAN_Automobile_desc:0 "Local car manufacturers are currently being encouraged to coordinate with their colleagues from abroad."
 TAN_Licences:0 "Purchase Foreign Licenses"
 TAN_Licences_EXPL:0 "Unlock §HPurchase Foreign Armor§! decisions."
 TAN_Licences_desc:0 "As we are now capable of producing modern equipment we can purchase the most modern designs from other nations. Even though a certain price must be paid it will surely be worth it."

 TAN_State_Matter:0 "Focus on Internal Matters"
 TAN_State_Matter_desc:0 "Never before our country has felt so divided and thorn apart by the internal power struggle. Establishing a strong consolidated government should be our first priority."

 TAN_Collectivist_Ethos:0 "Collectivist Ethos"
 TAN_Collectivist_Ethos_desc:0 "A powerful state is a one-party state. Silencing any democratic opposition will only strengthen the regime of the authorities."
 TAN_case_of_the_nine:0 "Case of the Nine"
 TAN_case_of_the_nine_desc:0 "Mongush Buyan-Badyrgy and Donduk Kuular have both been executed for their sympathy to the old, un-socialist ways, but there still exist too many in the party that stand opposed to Salchak Toka's lead. The reason for this is obvious: the meddling of [JAP.GetNameDef]! These counterrevolutionaries, snakes that hatched in the clergy and nobility, have to be removed with haste!"
 TAN_gather_the_party_opposition:0 "Gather the Party Opposition"
 TAN_gather_the_party_opposition_desc:0 "The TPRP has come under the rule of Stalinists who seek to undermine our country's society and draw it closer to the Russians, perhaps to the point of annexation. Before any purges could happen, the politicians that still care for Tuva should unite under Sat Churmit-Dazhy to initiate a coup d'état. Then, the undoing of harsh policies and the recovery of Buddhism can be arranged."
 TAN_Organise_Youth:0 "Organize the Youth"
 TAN_Organise_Youth_desc:0 "Young voices praising the current regime can be heard from any corner of our country. Their joint support can be used to reinforce the peoples belief in our cause. "
 TAN_Com_Generals:0 "Expand Communist Military Command"
 TAN_Com_Generals_desc:0 "Many educated peasants and workers are willingly joining the military to fill the lacking officer ranks."
 TAN_Collectivist_Propaganda:0 "The Worker's Culture"
 TAN_Collectivist_Propaganda_desc:0 "Redistributed wealth is successfully used to improve the running factories and increase production output."
 TAN_the_fifth_constitution:0 "The Fifth Constitution"
 TAN_the_fifth_constitution_desc:0 "With Salchak Toka securing his authority over the party, a need to reorganize the state is apparent. The time is right to inaugurate a new constitution that is more aligned to our ideology than any of its predecessors."
 #TAN_revolutionary_guards:0 "Revolutionary Guards" # Removed
 #TAN_revolutionary_guards_desc:0 "A secret police is needed to suppress counter-revolutionary elements. Comrade Toka's fight against the pro-Japanese Danchayites within the party cannot be for nothing!"
 TAN_red_army:0 "The Tuvan People's Revolutionary Army"
 TAN_red_army_desc:0 "Under the command of the state is the Tuvan People's Revolutionary Army, a valiant force of soldiers who fight and sacrifice for our revolution. Truly, they are worthy of the remembrance of all generations to come."
 TAN_sovietization:0 "Sovietization"
 TAN_sovietization_desc:0 "Comrade Toka once said that 'the accession of the Arat people to the people of the great Soviet Union' was his dream. The pro-[JAP.GetAdjective] Danchayite traitors have been crushed and our ties to [SOV.GetNameDef] have never been closer. We can finally begin with this process. Social and economic overhaul, the changing of state symbols, and the adoption of Cyrillic are on the agenda!"
 
 TAN_restore_our_ways:0 "Restore our Ways"
 TAN_restore_our_ways_desc:0 "If we stayed complacent as Salchak Toka continued his vile rule, our nation would have lost its soul. Thankfully, he is gone, and now we can govern in a more moderate fashion that continues our revolution, but without abandoning our livelihoods.\n\nWe will make Chairman Buyan-Badyrgy proud!"
 TAN_the_basis_of_the_economy:0 "The Basis of the Economy"
 TAN_the_basis_of_the_economy_desc:0 "Churmit-Dazhy intends for our economic policies to focus on [TAN.GetNameDef]'s established strengths - cattle breeding being the most important one, in his eyes. However, he also has plans for the production of other goods, such as textiles, which can be exported. This is much more suitable for our country than what could have been forced upon us."
 
 TAN_Conquer:0 "Expansive Policy"
 TAN_Conquer_desc:0 "The military strength and power of our regime together with weakness and incompetence of our neighbour's governments has left us no choice but to bring the right rule to them."
 TAN_Intervene:0 "Interfering Policy"
 TAN_Intervene_desc:0 "Our cause can be promoted around the world through a small brigades which will assist the proper regime of authorities through ideological education, staff planning and military support. "
 TAN_Isolated:0 "Isolated State"
 TAN_Isolated_desc:0 "Our reign shall be associated with political stability and national prosperity. But should someone disregard our neutrality, they will heavily pay for that!"
 TAN_Forced_Conscription:0 "Conscription Law"
 TAN_Forced_Conscription_desc:0 "If we are to survive in the powderkeg the world has become, we would need many more soldiers defending our values."
 TAN_Fanaticism:0 "Ideological Fanaticism"
 TAN_Fanaticism_desc:0 "There is no meed to limit our propaganda efforts. If any people are ready to die for our cause, why should we restrict them to do so?"
 TAN_tuvan_nationalism:0 "Tuvan Nationalism"
 TAN_tuvan_nationalism_desc:0 "The Soviets tried to force us under thier boot. In the past, the Chinese also tried to control us. It is time to assert ourselves as a nation opposed to foreign powers."

 TAN_Liberty_Ethos:0 "Liberty Ethos"
 TAN_Liberty_Ethos_desc:0 "A new government will function more effectively if it listens to the will of all population groups and disregards any division by gender, race or political affiliation."
 TAN_rehabilitate_pre_revolutionary_practices:0 "Rehabilitate Uriankhai Practices"
 TAN_rehabilitate_pre_revolutionary_practices_desc:0 "The policies enacted by the Tuvan People's Revolutionary Party have decimated the essence of the Tuvan nation. But let it be known that we are not an extension of the heartless 'Soviet Union', a product of ideology and not culture; we are the proud Tьвalar, sons and daughters of our mighty mountains and serene rivers!"
 TAN_Strenghten_Democracy:0 "Strengthen the Democracy"
 TAN_Strenghten_Democracy_desc:0 "The peoples trust and devotion to our cause are undeniable. new legislative period will bring even more liberal values to the masses!"
 TAN_Defence_Act:0 "National Security Act"
 TAN_Defence_Act_desc:0 "Promoting loyal police, military and intelligence experts will improve the positions of the government and secure the legislative apparatus from foreign influence."
 TAN_Brigades:0 "Form International Brigades"
 TAN_Brigades_desc:0 "If our military abilities are to be taken seriously on the global scale, we should increase our volunteers presence around the globe."
 TAN_Military_Build:0 "Arms Protect the Nation"
 TAN_Military_Build_desc:0 "Nations external security is associated with the size of its army. If we are to supply the growing demands of our soldiers, a military industrial expansion is a must!"
 TAN_Anti_Invasion:0 "Forts Protect the Nation"
 TAN_Anti_Invasion_desc:0 "A defense of key industrial and research centres will be more effective if the most vulnerable locations can be fortified and their garrison extended."
 TAN_carry_the_altai_torch:0 "Carry the Altai Torch"
 TAN_carry_the_altai_torch_desc:0 "Our democratic reforms may give hope for the whole of South-Central Siberia. The Altai once tried to carve out a state for themselves in the Russian Civil War, the Confederated Republic of Altai. It did not last, but voicing our support for [ALT.GetAdjective] separation in this day, perhaps as part of a wider, stronger state of our own, could be the way to stand up against [SOV.GetNameDef]."
 TAN_bolster_altai_economy:0 "Bolster Altai Economy"
 TAN_bolster_altai_economy_desc:0 "Our newly acquired Oyrot region has been rural and economically unproductive for the longest time. We cannot let this region be neglected, lest the Altai people turn their back on us. Investing in the area will not only please the people, proving that we are better custodians of the land than the [SOV.GetAdjective]s, but it will have positive effects for the statewide economy."
 TAN_refuge_for_the_tofalar:0 "Refuge for the Tofalar"
 TAN_refuge_for_the_tofalar_desc:0 "The small-numbered Tofalar, a fellow Turkic ethnicity living in the region of Tofalaria north of our kozhuun of Tozhu, have, much like ourselves, been forced to concede their customs at the hands of the communists. It may be possible to relocate them to [TAN.GetNameDef], which could protect them from further destruction and assimilation."

 TAN_restore_monastic_prerogatives:0 "Restore Monastic Prerogatives"
 TAN_restore_monastic_prerogatives_desc:0 "While the 'right wing' faction of the TPRP was supportive of Buddhism, the 1929 coup that put the Moscow loyalist traitors in charge set our country on the path of the most reprehensible state atheism. Now, the monasteries barely hold on, but fortunately there are still people sympathetic to our nation's faith who can return them to their rightful place."
 TAN_adopt_nichirenist_principles:0 "Adopt Nichirenist Principles"
 TAN_adopt_nichirenist_principles_desc:0 "The Japanese monk serves as the anchoring figure of Japanese nationalists willing to wage a holy war against the enemies of Buddhism. Recent history has proven that we have been in such peril as the pushing of our clergy to the brink of death. We could still be in such precarity, so it may not be so bad of a choice as to import these ways to rally the people and make Tuva the capable nation it needs to be."
 TAN_mobilize_for_a_holy_war:0 "Mobilize for a Holy War"
 TAN_mobilize_for_a_holy_war_desc:0 "It is time to prepare our population for the Holy War, a final struggle for the purification of the world. It will be a great challenge, but we know that there is no more noble reason to wage war than that."
 TAN_appropriate_the_gokturks:0 "Appropriate the Göktürks"
 TAN_appropriate_the_gokturks_desc:0 "We must establish a new hegemony covering the Steppe and beyond. Only we carry the right ideals to be advanced; only we deserve to inherit the legacy of the grand empires of old."


 TAN_call_for_army_readiness:0 "Call for Army Readiness"
 TAN_call_for_army_readiness_desc:0 "We need to awaken to the certainly disturbing possibility that an hostile army could reach our country in the heart of Asia."
 TAN_cavalry_tradition:0 "Cavalry Tradition"
 TAN_cavalry_tradition_desc:0 "Horseback riding has been the only way for our people to travel and control our herds. The [TAN.GetAdjective] traditional lifestyle offers the army a valuable strength."
 TAN_establish_the_ministry_of_war:0 "Establish the Ministry of War"
 TAN_establish_the_ministry_of_war_desc:0 "To grow our army further, we will have to establish a ministry to manage it."
 TAN_improve_officer_training_formation:0 "Improve Officer Training Formation"
 TAN_improve_officer_training_formation_desc:0 "Only well trained officers can correctly lead men in combat."
 TAN_uphold_the_cavalry_primacy:0 "Uphold the Cavalry Primacy"
 TAN_uphold_the_cavalry_primacy_desc:0 "We must perfect our mastery of the horse if we want to effectively fighting on the steppe."
 TAN_scavenge_battlefield_equipment:0 "Scavenge Battlefield Equipment"
 TAN_scavenge_battlefield_equipment_desc:0 "Capturing equipment on the battlefield, despite its unreliability as a source, would relieve a bit of pressure from our military indistry."

 TAN_gold_mining:0 "Gold Mining"
 TAN_gold_mining_desc:0 "The gold reserves of Tuva are what brought the Russians to our country in the first place. This tradition is still present to this day."
 TAN_exploit_the_ulugh_khem_coal_basin:0 "Exploit the Ulugh-Khem Coal Basin"
 TAN_exploit_the_ulugh_khem_coal_basin_desc:0 "Besides gold, the second treasure lying under our feet is a vast quantity of coal. Extracting it and using it will be essential to fuel our industrialization."
 TAN_coal_based_industry:0 "Coal-Based Industry"
 TAN_coal_based_industry_desc:0 "With the exploitation of our coal reserves, we could fuel a massive industrialization program."

 #decisions and tooltips
 TAN_assimilate_altai:0 "Assimilate the Altai"
 TAN_1941_flag_change_tt:0 "Changes the flag to the 1941 Soviet-resembling one."
 TAN_1943_flag_change_tt:0 "Changes the flag to the 1943 Soviet-resembling one."
 TAN_represent_buddhism_on_our_flag:0 "Represent Buddhism on our Flag"
 TAN_represent_buddhism_on_our_flag_desc:0 "Our reforms call back to the first years of [TAN.GetNameDef]. The unofficial flag we used in those times represents the nature of our state once again."
 TAN_buddhist_flag_change_tt:0 "Changes the flag to a reconstruction of the unofficial pre-constitution flag."
 SIB_unified_tt:0 "Siberian State Formed"

 #ideas
 TAN_disorganized_military:0 "Disorganized Military"
 TAN_disorganized_military_2:0 "Disorganized Military"
 TAN_true_heirs_of_the_gokturks_idea:0 "True Heirs of the Göktürks"
 TAN_true_heirs_of_the_gokturks_idea_desc:0 "We have tapped into the eternal legacy of our distant ancestors - none other than the Celestial Turks. The world is witnessing the establishment of a modern Türük el, made possible by the incomparably strong spirit of our nation!"

 TAN_bank_of_tuva:0 "Tuvan Commercial and Industrial Bank"
 
 #traits
 kamby_lama:0 "The Kamby Lama"
 TAN_voice_of_restraint_communist:0 "Voice of Restraint"
 
 #characters
 TAN_salchak_toka:0 "Salchak Toka"
 TAN_adyg_tulush_khemchik_ool:0 "Adyg-Tyulyush Khemchik-ool"
 TAN_sat_churmit_dazhy:0 "Sat-Churmit Dazhy"
 TAN_sat_churmit_dazhy_desc:0 "Outcry against Tuvan communism itself has managed to sway even Sat Churmit-Dazhy, at the cost of his position as head of government. The fight is on against Toka!"
 TAN_lanzy_nazynchap:0 "Lanzy Nazynchap"
 TAN_sodunam_balchyr_oglu_lanzy_nazynchap_desc:0 "Sodunam-Balchyr oglu Lanzy Nazynchap is the son of the last Amban-Noyon of Uryankhay Krai, Kombu-Dorzhu oglu Sodunam-Balchyr, representing the continuation of a lineage of Amban-Noyons that governed Tannu Uriankhai as far back as 1787."
 TAN_kamby_lama:0 "Kamby Lama"
 TAN_kamby_lama_desc:0 "The end of Buddhism's oppression has brought about the re-emergence of the Kamby Lama, the highest position in Tuva's clergy."
 TAN_kenden_khomushku:0 "Kenden Khomushku"
 TAN_seren_kuzhuget:0 "Seren Kuzhuget"
 TAN_m_bayyskylan:0 "Mongush Bayyskylan"
 TAN_amelchenko:0 "Timofey Amelchenko"
 TAN_kuular_davaa_sambuu:0 "Kuular Davaa-Sambuu"
 TAN_kidispey_choodu:0 "Kidispey Choodu"
 TAN_mongush_suwaku:0 "Mongush Suwaku"
 TAN_lakpa_oyun:0 "Oyun Lakpa"
 TAN_khertek_anchimaa_toka:0 "Khertek Anchimaa"
 TAN_khertek_anchimaa_toka_desc:0 "Khertek Amyrbit kyzy Anchimaa, having been born in the Uryankhay Republic, was soon introduced to Tuvan socialism, joining the Revolutionary Youth Union in 1918 and being one of the first to learn the Tuvan alphabet. After graduating from the KUTV she worked in the Barun-Khemchiksky kozhuun government, and the party took note of her success and vigor. Having her in the government could provide a dedicated representative of the women of Tuva."
 TAN_sat_bazyr_ool_oglu_lopsan:0 "Sat Lopsan"
 TAN_oiun_danchai:0 "Oyun Danchay"
 TAN_kuular_sungar_ool:0 "Kuular Sungar-ool"
 TAN_kuular_sungar_ool_desc:0 "Kuular Sungar-ool Tovunak oglu is known for his intellect. Born of a shaman, he studied the Mongolian script on his own and rose to become Ambassador to Mongolia."
 TAN_polat_oyun:0 "Oyun Polat"
 TAN_saryg_donggak_chymba:0 "Saryg-Donggak Chymba"
 TAN_nikolay_comrade:0 "Nikolay Choldak-oolovich"
 TAN_saaya_ala:0 "Saaya Ala"
 TAN_saaya_ala_desc:0 "Engineer platoon commander of the Tuvan People's Revolutionary Army's cavalry regiment."
 TAN_naval_preparatory_committee:0 "Naval Preparatory Committee"
 TAN_naval_preparatory_committee_desc:0 "A group of anyone remotely qualified to manage the construction of Tuva's first ever navy was hastily arranged."
 
 #events
 tuva.1.t:0 "Events in Kyzyl"
 tuva.1.d:0 "The leader of [TAN.GetNameDef], [TAN.GetLeader], after recieving a delegation of ours instructing him to do so, has concluded the trials and executions of his political adversaries, including but not limited to the Chairman of the Council of Ministers Sat Churmit-Dazhy, Chairman of the Presidium of the Little Khural Adyg-Tyulyush Khemchik-ool, and chairman of the board of Tuvinbank Oyun Danchay. These individuals, among others, came from noble and clerical backgrounds and formed what remained of the right wing of the Tuvan People's Revolutionary Party, which was more lenient towards the country's Buddhist faith and nomadic way of life. Their disposal has ensured the loyalty of [TAN.GetNameDef] and its party towards us, as no true opposition to Toka remains and he is dedicated to following our example."
 tuva.1.a:0 "Tuva won't be straying away again any time soon."
 tuva.2.t:0 "Salchak Toka Overthrown in Tuva"
 tuva.2.d:0 "The regime of Salchak Toka in the largely unrecognised [TAN.GetName] has fallen apart. The Tuvan People's Revolutionary Party's 'right wing' faction, which continues the original Buddhist vision of their country's early politicians, has united to overthrow the percieved threat of the Stalinist elements that were in power.\n\nWhile Toka was the state's de facto head, Sat Churmit-Dazhy, the orchestrator of the coup, was the nominal head of government. With a record of support for monasteries and moderatist economic plans, he has expressed determination to consolidate Tuva as an agrarian, Buddhist socialist state. However, this will undoubtedly strain [TAN.GetAdjective]-[SOV.GetAdjective] relations, as similar governance to this did before."
 tuva.2.a:0 "Back and forth."
 tuva.2.b:0 "A victory for the rights of the arats!"
 tuva.2.c:0 "These 'Buddhist socialists' are like cockroaches!"
 tuva.3.t:0 "[TAN.GetNameDefCap] Pushes for Oyrot Cession"
 tuva.3.d:0 "The recently established democratic government in [TAN.GetNameDef] has made calls for unity among its regions' ethnicities. Citing percieved unjust rule on our part in the Oyrot region, they have officially demanded we transfer it to their administration 'for the good of the Altai nation'..."
 tuva.3.a:0 "That oblast has no use for us."
 tuva.3.b:0 "Our territory will not be chipped away from. Especially not by a puny splinter state."
 tuva.4.t:0 "Oyrot Region Ceded"
 tuva.4.d:0 "Despite the many doubts, our demands for the Oyrot region's transfer have proven fruitful. Now, the Altai people can know they have a future."
 tuva.4.a:0 "Two nations, one brotherhood."
 tuva.5.t:0 "Diplomatic Failure over Oyrot"
 tuva.5.d:0 "Our diplomats have returned, having not signed any treaty. Perhaps this was an ill-considered venture..."
 tuva.5.a:0 "It probably was."
 tuva.5.b:0 "The Altai need this. At any cost."
 tuva.6.t:0 "[TAN.GetNameDefCap] Proposes Unification"
 tuva.6.d:0 "We have been approached with a proposal to unify our country with [TAN.GetNameDef]. Our neighbour promises a larger joint state based upon Tuvan-Altai cultural closeness would come with many benefits."
 tuva.6.a:0 "This can be done."
 tuva.6.b:0 "We won't be made into a junior partner."
 tuva.7.t:0 "The Unification of Tuva and Altai"
 tuva.7.d:0 "Our idea of a greater state has been realised. [ALT.GetNameDefCap]'s government has understood our calls for unity."
 tuva.7.a:0 "Two nations, one brotherhood."
 tuva.8.t:0 "Unification Offer Declined"
 tuva.8.d:0 "[ALT.GetNameDefCap] has strongly refused our proposal for unity. They are inadvertedly choosing to waste away as a weak state and be eventually preyed upon by outsiders!"
 tuva.8.a:0 "What a shame."
 tuva.8.b:0 "They don't know what's best for them, but we do!"
 #Parties
 TAN_great_khural_party:0 "Deedi Xural"
 TAN_great_khural_party_long:0 "Deedi Xural"
 