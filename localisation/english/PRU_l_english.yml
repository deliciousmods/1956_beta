 PRU_circle_service_extreme:0 "§RMilitary pressure§!"
 PRU_circle_coalition_help:0 "Caudillos judge government policies and their own commitments. Military, civil and popular reforms can benefit one partner while alienating another. Military intermediaries also influence the Army–Navy balance until command is unified."
