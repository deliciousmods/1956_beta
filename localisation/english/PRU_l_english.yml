 PRU_settle_command:0 "Negotiate with the Command Office"
 PRU_settle_command_desc:0 "Negotiate with the current intermediary over 21 days: +12 personal trust, +8 government legitimacy, and 180 days without ideological friction. Changing intermediaries cancels the negotiations."
