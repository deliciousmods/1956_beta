 PRU_rearm_the_army:0 "Continue the Rearmament of the Army"
 PRU_rearm_the_army_desc:0 "Give the army first call on the defence estimates. Release rifles for training and fund a northern field staff with its own engineers and supply columns."
 PRU_dominion_of_the_mar_de_grau:0 "Dominion of the Mar de Grau"
 PRU_dominion_of_the_mar_de_grau_desc:0 "Place the Pacific squadron first in the estimates. Reopen the yards and give Callao a choice between escorting merchant shipping and sending torpedo flotillas to sea."
 PRU_services_shortcut:0 "Armed Forces"
 PRU_army_reform_tt:0 "Improve §Y$PRU_service_army$§! by one grade: §G+0.24%§! division organization and §G-0.10%§! supply consumption."
 PRU_navy_reform_tt:0 "Improve §Y$PRU_service_navy$§! by one grade: §G+0.30%§! naval organization and §G+0.15%§! fleet coordination."
 PRU_air_reform_tt:0 "Improve §Y$PRU_service_air$§! by one grade: §G+0.18%§! air mission efficiency and §G-0.24%§! air accident chance."
 PRU_acquire_italian_planes_desc:0 "Order eight Caproni attack aircraft and eight bombers, giving the CAP a cadre of crews familiar with both types."
 PRU_reformed_logistics_desc:0 "Stage fuel and ammunition at roadheads where trucks can hand their loads to pack columns. A reliable supply schedule will do more for a division in the highlands than another vehicle in Lima."
 PRU_piura_field_staff:0 "A Field Staff for Piura"
 PRU_piura_field_staff_desc:0 "Give the northern commanders a single staff to plan movements from the coastal railheads into the foothills."
 PRU_northern_road_sappers:0 "The Northern Road Sappers"
 PRU_northern_road_sappers_desc:0 "Post engineer detachments along the Piura roads. All-weather approaches will let the columns reach their assembly areas with ammunition intact."
 PRU_portable_signal_sets:0 "Field Wireless Sections"
 PRU_portable_signal_sets_desc:0 "Issue portable sets to battalion signallers. The staff can now keep touch with units beyond the last telephone exchange."
 PRU_chira_bridge_columns:0 "Bridge Columns on the Chira"
 PRU_chira_bridge_columns_desc:0 "Practice assembling a crossing from boats and locally cut timber before taking heavy equipment across the Chira."
 PRU_high_pass_observers:0 "Observers on the High Passes"
 PRU_high_pass_observers_desc:0 "Pair artillery observers with the new radio sections. Survey parties will produce firing tables for mountain batteries."
 PRU_northern_grouping:0 "Form the Agrupamiento del Norte"
 PRU_northern_grouping_desc:0 "Bring the bridge columns and observation detachments under the same headquarters. A cadre at Piura will form the nucleus of the northern grouping."
 PRU_santa_catalina_depot:0 "The Santa Catalina Reserve"
 PRU_santa_catalina_depot_desc:0 "Hold replacement weapons in Lima and mark stores by battalion, so a field formation can draw its losses in a single consignment."
 PRU_piura_motor_pool:0 "Establish the Piura Motor Pool"
 PRU_piura_motor_pool_desc:0 "Reserve trucks for the field grouping instead of filling the Lima magazines. Crews will make the long return journey with casualties and damaged equipment."
 PRU_mobile_field_workshop:0 "Travelling Ordnance Workshops"
 PRU_mobile_field_workshop_desc:0 "Send fitters and spare parts north with the field grouping. The workshops must be able to service imported armour without returning it to Lima."
 PRU_pacific_squadron_staff:0 "The Pacific Squadron Estimates"
 PRU_pacific_squadron_staff_desc:0 "Give the squadron at Callao its own programme of coastal surveys, maintenance and procurement."
 PRU_island_soundings:0 "Soundings off the Guano Islands"
 PRU_island_soundings_desc:0 "Survey the approaches to the guano islands and chart anchorages where small ships can shelter from the Pacific swell."
 PRU_callao_repair_slips:0 "Repair Slips at Callao"
 PRU_callao_repair_slips_desc:0 "Set aside a slip and stocks of replacement plate for the squadron. Ships damaged on patrol can now refit at home."
 PRU_escort_desk:0 "Escort the Coastal Trade"
 PRU_escort_desk_desc:0 "Assign the new patrol schedules to the merchant routes. Escorts and freighters will practise sailing the coast in company."
 PRU_torpedo_flotillas:0 "Strike from the Inshore Approaches"
 PRU_torpedo_flotillas_desc:0 "Use the surveyed anchorages to assemble small attack groups. Their task is to shadow a superior squadron and approach after dusk."
 PRU_coastal_convoy_pool:0 "A Pool of Coastal Freighters"
 PRU_coastal_convoy_pool_desc:0 "Reserve freight tonnage and train civilian masters to follow escort signals when the coast route comes under threat."
 PRU_torpedo_school:0 "The Torpedo School at La Punta"
 PRU_torpedo_school_desc:0 "Rotate destroyer officers through the submarine flotilla. Both services will use the same range tables and night recognition signals."
 PRU_squadron_tenders:0 "Tenders for the Squadron"
 PRU_squadron_tenders_desc:0 "Pool workshops and fuel lighters at Callao. Either an escort group or a torpedo flotilla can now turn around farther up the coast."
 PRU_foreign_hull_commission:0 "The Foreign Hull Commission"
 PRU_foreign_hull_commission_desc:0 "Dispatch a purchasing commission to negotiate for surplus foreign warships. Sellers set their terms and may turn down an offer."
 PRU_war_station_callao:0 "Squadron War Stations"
 PRU_war_station_callao_desc:0 "Bring the dockyard staff and the operational flotillas together for a mobilisation exercise off Callao."
 PRU_loreto_survey:0 "Chart the Rivers of Loreto"
 PRU_loreto_survey_desc:0 "Army surveyors and river pilots will mark landing places, seasonal channels and the trails that connect them."
 PRU_iquitos_launches:0 "The Iquitos River Launches"
 PRU_iquitos_launches_desc:0 "Fit shallow-draught launches to move patrols along the tributaries. Teach infantry to embark at an unprepared bank."
 PRU_amazon_pioneers:0 "Pioneers of the Selva"
 PRU_amazon_pioneers_desc:0 "Train detachments to cut trails, drain camps and keep a crossing open in the wet season."
 PRU_iquitos_air_landings:0 "A River Landing at Iquitos"
 PRU_iquitos_air_landings_desc:0 "Connect the surveyed river landing to a small flying station. Fuel and spare parts can come up by launch when the weather closes the route."
 PRU_amazon_district:0 "A Joint Command for the Amazon"
 PRU_amazon_district_desc:0 "Put patrol launches, the Iquitos flying station and the trail detachments on a single timetable. Supplies travel by water and urgent dispatches by air."
 PRU_las_palmas_instruments:0 "Instrument Flying at Las Palmas"
 PRU_las_palmas_instruments_desc:0 "Train pilots to hold a course above the coastal fog before trusting them with a mail flight over the passes."
 PRU_highland_weather:0 "The Cordillera Weather Net"
 PRU_highland_weather_desc:0 "Have airfields exchange wind and cloud reports before crews commit to a pass. Mobile observers will relay their readings to the CAP."
 PRU_aerial_photography:0 "Photograph the Northern Routes"
 PRU_aerial_photography_desc:0 "Issue survey cameras and put aircrew in the briefing room with the surveyors who draw the army maps."
 PRU_talara_ground_school:0 "The Ground Crews of Talara"
 PRU_talara_ground_school_desc:0 "Train fitters at Talara to service aircraft operating far from the main workshops. A maintained dispersal field is worth more than another hangar in Lima."
 PRU_coastal_recognition:0 "Coastal Recognition Flights"
 PRU_coastal_recognition_desc:0 "Fly recognition circuits from Talara and identify ships before passing their bearings to the coastal stations."
 PRU_air_ambulance:0 "The CAP Air Ambulance"
 PRU_air_ambulance_desc:0 "Adapt a small transport detachment to take stretcher cases out of isolated garrisons. The medical service will train orderlies for the flight."
 PRU_highland_air_rescue:0 "Search the Andean Passes"
 PRU_highland_air_rescue_desc:0 "Use the medical flights and survey photographs to plot emergency landing grounds. Station rescue supplies along the inland route."
 PRU_forward_air_parties:0 "Forward Air Parties"
 PRU_forward_air_parties_desc:0 "Give the airborne school a ground liaison section. An observer with a wireless set can direct a supporting aircraft onto the right valley."
 PRU_pacific_air_plot:0 "The Pacific Air Plot"
 PRU_pacific_air_plot_desc:0 "Combine sightings from the shore stations and CAP patrols on a single chart at Callao. The duty officer can vector ships towards a reported contact."
 PRU_pisco_staff_college:0 "Publish the Pisco Staff Course"
 PRU_pisco_staff_college_desc:0 "Turn the lessons of the field exercise into a course for the next class of army, naval and aviation officers. Each staff must defend its plan before the other two."
 PRU_chira_bridge_drill:0 "Chira Bridging Drill"
 PRU_loreto_boat_drill:0 "Loreto River Pilots"
 PRU_selva_trail_drill:0 "Selva Trail Detachments"
