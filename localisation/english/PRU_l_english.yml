#Decisions
 r56_decision_PRU_nationalize_rubber_development_corporation_subsidiary: "Nationalize the Rubber Development Corporation"
 r56_decision_PRU_nationalize_rubber_development_corporation_subsidiary_desc: "Foreign actors have way too much sway in our strategic resource development industry. It is in our best interest to ensure that our assets will not fall into foreign hands in case of hostilities."
 r56_decision_PRU_rural_education_in_FROM: "Rural Education in [FROM.getName]"
 r56_decision_PRU_rural_education_in_FROM_desc: "Our teachers and scholar are ready to embark on this tedious journey to bring the light of progress into every home. Knowledge for everybody, free, and no one will get away unsatisfied!"

 r56_PRU_foreign_policy_decisions: "[PRU.getAdjective] Foreign Policy"
 r56_PRU_foreign_policy_decisions_desc: "The current state of internal political affairs allows us to pursue external allegiances of different degree of complexity, ranging from simple industrial concessions and joint military exercises to diplomatic alliances and military invasions of hostile nations. We better tread carefully before embarking on another foreign voyage."

 r56_decision_PRU_recruitment_campaign_in_FROM: "Recruitment Campaign in [FROM.getName]"
 r56_decision_PRU_recruitment_campaign_in_FROM_desc: "Lacking the stern support from the military wing, we need to establish our own armed corps ready to take arms in times of need."

 r56_decision_PRU_support_side_in_scw_FROM: "Support [FROM.getName] in Civil War"
 r56_decision_PRU_support_side_in_scw_FROM_desc: "Our Hispanic brothers across the sea are fighting for the just cause! We must support them in their struggle and potentially learn from their experience in the process."
 PRU_election_countdown_mission: "Election Countdown"
 PRU_election_countdown_mission_desc: "Upcoming presidential elections are expected to have a strong influence onto the country politics and we are better to make sure that the current regime is prepared for these changes."

