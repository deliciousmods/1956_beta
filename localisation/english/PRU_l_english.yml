 PRU_civil_guarantors:0 "The Civilian Guarantors"
 PRU_civil_guarantors_desc:0 "The banks, export houses and conservative organisations do not speak with one voice. A civilian broker must negotiate their support for the government before the election can proceed."
 PRU_government_pact:0 "Form a Governing Coalition"
 PRU_government_pact_desc:0 "The new government must govern with the forces that actually exist. This agreement opens programmes of civil administration, military organisation and social reform."
 PRU_cabinet_responsibility:0 "A Cabinet Answerable to the Presidency"
 PRU_cabinet_responsibility_desc:0 "Turn private promises into a legislative programme. Civilian reform, electoral succession and constitutional debate all require a government able to carry its agreements through Congress."
 PRU_presidential_arbitration:0 "Arbitrate between the Services"
 PRU_presidential_arbitration_desc:0 "The Army and Navy expect to be heard. Settle the military caudillo's immediate demands and establish the guarantees needed for succession or a new political settlement."
 PRU_union_negotiations:0 "Open Popular Negotiations"
 PRU_union_negotiations_desc:0 "Recognise workers and communities as political interlocutors. The appointment remains ours until a crisis forces another representative upon the government."
 PRU_national_convention:0 "Resolve the Question of Power"
 PRU_national_convention_desc:0 "A civil, military or popular settlement can only be built around an intermediary who cooperates with the government. The resulting agreement opens later programmes; it does not immunise a regime against future crises."
 peru.220.t:0 "An Electoral Intervention without Support"
 peru.220.d:0 "The proposed alternative cannot secure the support promised in its name. Its organisers are absent from government or have not prepared their campaign. With no credible basis for changing the result, the presidency must recognise Eguiguren's mandate or support an annulment. The failed intervention has already damaged public confidence."
 peru.220.a:0 "Recognise Eguiguren and negotiate with his supporters."
 peru.220.b:0 "Support annulment and continue under Benavides."
 peru.221.t:0 "The Basis of a New Political Settlement"
 peru.221.d:0 "Civilian brokers, military guarantors and popular organisers have brought their demands to a national convention. Their agreement will determine which constitutional proposals can advance. It is the beginning of a programme, not the proclamation of a new regime."
 peru.221.a:0 "Build the settlement around civilian guarantees."
 peru.221.b:0 "Let the officers guarantee the agreement."
 peru.221.c:0 "Recognise the mandate of organised popular movements."
 peru.221.defer:0 "Keep the negotiations open."
 PRU_political_talks_continue:0 "Adjourn until a supported candidate emerges."
 PRU_ballot_jorge_requirements_tt:0 "This alternative requires §YJorge Prado§! as the civil caudillo and at least §Y45 legitimacy§!. Without those supports, the intervention fails: -3% stability, -8 legitimacy and a new choice between recognition and annulment."
 PRU_ballot_villaran_requirements_tt:0 "This alternative requires §YManuel Vicente Villarán§! as the civil caudillo and at least §Y45 legitimacy§!. Without those supports, the intervention fails: -3% stability, -8 legitimacy and a new choice between recognition and annulment."
 PRU_ballot_flores_requirements_tt:0 "§YA prepared UR victory§! requires Flores as popular caudillo, his nationalist organisation, trust of at least 60 and influence of at least 55. Without these, Flores still takes office but faces a fragile mandate and organised opposition within a week."
 PRU_resume_election_203:0 "Reconvene the Electoral Negotiations"
 PRU_resume_election_203_desc:0 "Appoint the caudillo who can support the proposed candidate, then reopen the adjourned electoral meeting. This decision does not guarantee that candidate's accession."
 PRU_resume_election_205:0 "Reconvene the Electoral Negotiations"
 PRU_resume_election_205_desc:0 "Appoint the caudillo who can support the proposed candidate, then reopen the adjourned electoral meeting. This decision does not guarantee that candidate's accession."
 PRU_resume_leadership_16:0 "Reconvene the Leadership Negotiations"
 PRU_resume_leadership_16_desc:0 "With a represented candidate and an unresolved political crisis, negotiate the leadership of this programme again."
 PRU_resume_leadership_17:0 "Reconvene the Leadership Negotiations"
 PRU_resume_leadership_17_desc:0 "With a represented candidate and an unresolved political crisis, negotiate the leadership of this programme again."
 PRU_resume_leadership_18:0 "Reconvene the Leadership Negotiations"
 PRU_resume_leadership_18_desc:0 "With a represented candidate and an unresolved political crisis, negotiate the leadership of this programme again."
 PRU_reopen_national_convention:0 "Reopen the National Political Convention"
 PRU_reopen_national_convention_desc:0 "A crisis, or a government with at least 75 legitimacy, can renegotiate the basis of its national settlement. Changing the mandate opens different programmes; it does not undo completed mutually exclusive focuses."

 peru.202.incumbent:0 "Renew Eguiguren's civilian mandate."
 PRU_resume_election_202:0 "Reconvene the 1939 Succession"
 PRU_resume_election_202_desc:0 "Appoint Manuel Prado, or a conservative patron backing Quesada, before reopening the adjourned succession."

