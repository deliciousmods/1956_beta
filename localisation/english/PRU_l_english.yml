 PRU_command_resentment:0 "Resentful Officer Network"
 PRU_command_resentment_desc:0 "The outgoing patron retains contacts outside government. This temporary obstruction lasts 90 days after dismissing an entrenched collaborator, or 180 days after dismissing a challenger. It does not stack with another obstruction from the same office."
