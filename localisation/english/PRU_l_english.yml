 PRU_legacy_army_budget_tt:0 "This appropriation was already adopted in the earlier defence budget."
 PRU_legacy_navy_budget_tt:0 "This appropriation was already adopted in the earlier defence budget."
 PRU_army_programme_tt:0 "Unlocks the §YNorthern Field Staff§!, its engineer columns and the choice of a weapons reserve or a motor pool."
 PRU_navy_programme_tt:0 "Unlocks the §YPacific Squadron§!, the escort or torpedo programme and negotiations for foreign warships."
 PRU_defence_vote_open_tt:0 "The armed forces have yet to receive their priority appropriation."
 PRU_ballot_poll:0 "Call the Presidential Election"
 PRU_ballot_poll_desc:0 "Choose how the campaign reaches the provinces. Local committees can bring APRA onto the ballot. The prefects can deliver a majority for Flores. Either campaign can recognise Eguiguren or extend Benavides’s mandate."
 PRU_ballot_apra_government_tt:0 "Víctor Raúl Haya de la Torre takes office. The PAP governs as Communist and suspends elections."
 PRU_ballot_party_apra:0 "PAP"
 PRU_ballot_party_apra_long:0 "Partido Aprista Peruano"
 PRU_ballot_apra:0 "Readmit APRA to the Ballot"
 PRU_ballot_apra_desc:0 "Lift the ban before the count and let Haya de la Torre form an Aprista government backed by organised labour."
 PRU_ballot_eguiguren_government_tt:0 "Luis Antonio Eguiguren takes office. His Social Democratic Party governs as Democratic, with elections."
 PRU_ballot_party_eguiguren:0 "PSD"
 PRU_ballot_party_eguiguren_long:0 "Partido Social Demócrata"
 PRU_ballot_eguiguren:0 "Honour Eguiguren’s Victory"
 PRU_ballot_eguiguren_desc:0 "Count the ballots cast by Aprista sympathisers. Benavides accepts the result and hands the palace to Luis Antonio Eguiguren."
 PRU_ballot_benavides_government_tt:0 "Óscar R. Benavides remains president of the Non-Aligned government. Elections remain suspended."
 PRU_ballot_party_benavides:0 "GB"
 PRU_ballot_party_benavides_long:0 "Gobierno de Benavides"
 PRU_ballot_benavides:0 "Annul the Returns: Benavides Stays"
 PRU_ballot_benavides_desc:0 "Congress annuls the count and extends Benavides’s mandate. This begins the historical succession through Prado, Bustamante and Odría."
 PRU_ballot_flores_government_tt:0 "Luis Alberto Flores takes office. Unión Revolucionaria governs as Fascist and suspends further elections."
 PRU_ballot_party_flores:0 "UR"
 PRU_ballot_party_flores_long:0 "Unión Revolucionaria"
 PRU_ballot_flores:0 "Elect Luis Alberto Flores"
 PRU_ballot_flores_desc:0 "Give Unión Revolucionaria the winning vote. Flores enters the palace through the election and concentrates power in the party."
 PRU_ballot_apra_press:0 "Reopen the Aprista Press"
 PRU_ballot_apra_press_desc:0 "Bring the party newspapers out of clandestinity and let local organisers speak openly."
 PRU_ballot_workers:0 "Seat the Provincial Labour Boards"
 PRU_ballot_workers_desc:0 "Give mill workers and plantation labourers provincial boards to hear wage claims. Both Haya and Eguiguren can build their government around these boards."
 PRU_ballot_apra_land:0 "An Agrarian Compact"
 PRU_ballot_apra_land_desc:0 "Extend the provincial settlement to the countryside. Land boards will hear disputes between communities and estates."
 PRU_ballot_civil_register:0 "Protect the Electoral Registers"
 PRU_ballot_civil_register_desc:0 "Entrust the registers to civilian officials and guarantee that a vote cannot be thrown out for its presumed sympathies."
 PRU_ballot_municipal:0 "Restore Municipal Representation"
 PRU_ballot_municipal_desc:0 "Let elected councils present provincial budgets and petitions in Lima. Both Haya and Eguiguren can give the municipalities this role."
 PRU_ballot_civil_charter:0 "A Constitutional Presidency"
 PRU_ballot_civil_charter_desc:0 "Submit the cabinet to congressional scrutiny and protect the transfer of power between civilian governments."
 PRU_ballot_extended_mandate:0 "Order, Peace and Work"
 PRU_ballot_extended_mandate_desc:0 "Benavides trades a limited public works programme for congressional backing until the next presidential contest."
 PRU_ballot_prado_government_tt:0 "Manuel Prado Ugarteche succeeds Benavides. His civilian government is Non-Aligned and restores elections."
 PRU_ballot_party_prado:0 "CC"
 PRU_ballot_party_prado_long:0 "Concentración Conservadora"
 PRU_ballot_prado:0 "Negotiate a Civilian Succession"
 PRU_ballot_prado_desc:0 "The 1939 succession brings Manuel Prado to office. His civilian administration must keep industry supplied as overseas trade is disrupted."
 PRU_ballot_front_government_tt:0 "José Luis Bustamante y Rivero succeeds Prado. The FDN governs as Non-Aligned, with elections."
 PRU_ballot_party_front:0 "FDN"
 PRU_ballot_party_front_long:0 "Frente Democrático Nacional"
 PRU_ballot_front:0 "Bring the Democratic Front Together"
 PRU_ballot_front_desc:0 "The 1945 coalition brings José Luis Bustamante y Rivero to the palace. He must govern with the parties that secured his victory."
 PRU_ballot_odria_government_tt:0 "Manuel A. Odría deposes Bustamante. His Non-Aligned military junta suspends elections."
 PRU_ballot_party_odria:0 "JMG"
 PRU_ballot_party_odria_long:0 "Junta Militar de Gobierno"
 PRU_ballot_odria:0 "Hand Power to the Garrison Chiefs"
 PRU_ballot_odria_desc:0 "The Arequipa garrison declares against Bustamante. Odría assumes command of the junta after the October coup."
 PRU_ballot_ochonio:0 "Take Public Works to the Barrios"
 PRU_ballot_ochonio_desc:0 "With the 1950 ballot behind him, Odría turns to schools, roads and public buildings. The investment places new demands on the treasury."
 PRU_ballot_convivencia_government_tt:0 "Manuel Prado Ugarteche returns for a second term. His Non-Aligned civilian government restores elections."
 PRU_ballot_party_convivencia:0 "MDP"
 PRU_ballot_party_convivencia_long:0 "Movimiento Democrático Pradista"
 PRU_ballot_convivencia:0 "Reach an Understanding with the Apristas"
 PRU_ballot_convivencia_desc:0 "The civilian succession of 1956 returns Prado to office. An understanding with the Apristas reopens congressional politics."
 PRU_ballot_ur_branches:0 "Organise the Urrista Branches"
 PRU_ballot_ur_branches_desc:0 "Give the provincial branches of Unión Revolucionaria responsibility for rallying support for the presidency."
 PRU_ballot_ur_accord:0 "A Pact with the Manufacturers"
 PRU_ballot_ur_accord_desc:0 "Bring the manufacturers to the negotiating table. Their commitment to domestic production can shore up either Benavides or Flores."
 PRU_ballot_ur_state:0 "The Corporative State"
 PRU_ballot_ur_state_desc:0 "Replace the temporary industrial pact with permanent chambers through which the presidency directs organised interests."
 PRU_ballot_poll_patrons_tt:0 "Caudillo candidates: Flores, Haya, Villarán and Jorge Prado."
 PRU_ballot_apra_press_patrons_tt:0 "Caudillo candidates: Ravines and Churata."
 PRU_ballot_apra_land_patrons_tt:0 "Caudillo candidates: Huillca."
 PRU_ballot_civil_register_patrons_tt:0 "Caudillo candidates: Manuel Prado and Belaúnde."
 PRU_ballot_extended_mandate_patrons_tt:0 "Caudillo candidates: Ureta and Saldías."
 PRU_ballot_prado_patrons_tt:0 "Lavalle can join the cabinet. Manuel Prado becomes eligible after his presidency."
 PRU_ballot_front_patrons_tt:0 "Caudillo candidates: Odría and Belaúnde."
 PRU_ballot_ur_branches_patrons_tt:0 "Caudillo candidates: Ureta and Lavalle."
 PRU_ballot_shortcut:0 "Presidential Election"
 PRU_ballot_candidate_eligible_tt:0 "The candidate is active in Peru and is free to take office."
 PRU_ballot_vacate_popular_tt:0 "The new president vacates the popular caudillo seat and its modifiers end."
 PRU_ballot_vacate_civil_tt:0 "The new president vacates the civil caudillo seat and its modifiers end."
 PRU_ballot_vacate_military_tt:0 "The new president vacates the military caudillo seat and its modifiers end."
 PRU_ballot_committees:0 "Build a Network of Local Committees"
 PRU_ballot_committees_desc:0 "Print electoral rolls in the union halls and find witnesses for the count. These committees give Haya a way back onto the ballot."
 PRU_ballot_prefects:0 "Canvass through the Prefectures"
 PRU_ballot_prefects_desc:0 "Ask each prefect to assemble the provincial notables behind a slate. Flores can use their backing to take Unión Revolucionaria to the polls."
 PRU_ballot_provincial_funds:0 "Finance the Departmental Councils"
 PRU_ballot_provincial_funds_desc:0 "Let the departmental councils draw up local budgets. They can secure provincial backing for either Benavides or Flores."
 peru.1.eguiguren:0 "Luis Antonio Eguiguren - Social Democratic Party"
 peru.1.prado:0 "Jorge Prado Ugarteche - National Front"
 peru.1.villaran:0 "Manuel Vicente Villarán - Right-Wing Coalition"
 peru.1.flores:0 "Luis Alberto Flores - Revolutionary Union"
 peru.1.annul:0 "Annul the election and extend Benavides' mandate."
 PRU_revise_electoral_rolls:0 "Certify the Provincial Rolls"
 PRU_revise_electoral_rolls_desc:0 "The electoral boards must reconcile the provincial registers before the government can call a national vote."
 PRU_call_general_election:0 "Open the Polls for Prado and Quesada"
 PRU_call_general_election_desc:0 "Open the polls to the lists of Manuel Prado and José Quesada and publish the returns."
 peru.390.t:0 "The Electoral Boards Are Ready"
 peru.390.d:0 "Provincial boards have certified their registers. Manuel Prado and José Quesada await the government's call to the polls."
 peru.390.a:0 "Open the polling stations."
 PRU_polling_day:0 "The electoral boards have reported ready for the 1939 election"
 peru.306.ureta:0 "Ureta carries the provinces."
 peru.391.t:0 "Marshal Ureta Takes the Oath"
 peru.391.d:0 "Congress receives the marshal as elected president. His supporters expect the discipline of a military cabinet, but his authority now rests on a civilian ballot."
 peru.391.a:0 "Convene the cabinet."
 peru.3.hear:0 "Send the prefects to report on the crowds."
 PRU_loyalist_cabinet:0 "Government of National Continuity"
 PRU_white_committee_spirit:0 "The Provincial Defence Committees"
 PRU_white_committee_spirit_desc:0 "The estates can supply grain and horses, but the officers, constitutionalists and royalists disagree over who signs their orders."
 PRU_white_ureta_spirit:0 "The Provincial Commands"
 PRU_white_ureta_spirit_desc:0 "Ureta retains the provincial columns under a single payroll. Maintaining their depots ties up civilian transport."
 PRU_white_hispanist_spirit:0 "The Hispanic Regency"
 PRU_white_hispanist_spirit_desc:0 "The regency brings parish councils into the settlement. Its insistence on a crown divides the civilian opposition."
 PRU_white_estates_spirit:0 "The League of Haciendas"
 PRU_white_estates_spirit_desc:0 "Estate syndicates guarantee deliveries to the cities in exchange for control over the district authorities."
 PRU_peruvian_white_army:0 "The Peruvian White Army"
 PRU_peruvian_white_army_desc:0 "Urrista officers, royalists, landowners and constitutional opponents of communism have agreed on one demand: Benavides must leave. Their provincial columns will fight under a provisional junta."
 PRU_white_junta:0 "Provisional Directorate of the White Army"
 PRU_advances_on_the_sugar_harvest:0 "The War Chest of the Coastal Valleys"
 PRU_advances_on_the_sugar_harvest_desc:0 "The sugar estates offer advances against the next harvest. The junta must decide how much influence the lenders will buy."
 PRU_convention_at_palacio_de_gobierno:0 "The Convention at Palacio de Gobierno"
 PRU_convention_at_palacio_de_gobierno_desc:0 "The loyalists have surrendered. The victors meet at Government Palace to divide the ministries and decide who will sign for the new Peru. The officers, the royalists and the hacendados each want the presidency."
 PRU_white_ureta_command_party:0 "Directorio de Chorrillos"
 PRU_directorio_de_chorrillos:0 "Ureta's Chorrillos Directorate"
 PRU_directorio_de_chorrillos_desc:0 "The officers at Chorrillos put Eloy Ureta's name before the delegates. He offers the provincial commanders a regular payroll and the right to recruit in their home districts. In return they must take orders from his new cabinet in Lima."
 PRU_chorrillos_staff_register:0 "The Chorrillos Staff Register"
 PRU_chorrillos_staff_register_desc:0 "The staff college sets a common officers' syllabus and one payroll for the old volunteer columns."
 PRU_white_hispanic_regency_party:0 "Hispanic Regency of Peru"
 PRU_regency_of_santo_domingo:0 "The Crown in the Sacristy"
 PRU_regency_of_santo_domingo_desc:0 "The priests and Hispanic clubs seat Riva-Agüero as regent. His first task is finding a claimant who can unite the Peruvian crown with the royal cause in Spain."
 PRU_white_hispanic_regency_settlement:0 "A Regency at Santo Domingo"
 PRU_white_hispanic_regency_settlement_desc:0 "The parish councils will swear to a regency until the claimant arrives. In return they ask for guarantees on the education and relief programmes they financed during the rising."
 PRU_white_estate_council_party:0 "National Agrarian Party"
 PRU_beltrans_agrarian_cabinet:0 "Beltrán's Cabinet of Hacendados"
 PRU_beltrans_agrarian_cabinet_desc:0 "Beltrán brings the agrarian societies and the highland gamonales into the cabinet. The estate syndicates guarantee credit while reserving political office for their own delegates."
 PRU_canete_harvest_contracts:0 "Cañete Signs the Harvest Contracts"
 PRU_canete_harvest_contracts_desc:0 "Beltrán uses his contacts in Cañete to guarantee grain shipments and commissions repairs on the roads that carry them."
 peru.392.t:0 "A Directorate without a President"
 peru.392.d:0 "Urristas bring officers, the royalists bring parish contacts, and the estates bring horses. The democratic delegates demand that no permanent ruler be named until the loyalists lay down their arms."
 peru.392.a:0 "Keep the directorate provisional."
 peru.393.t:0 "Advances against the Sugar Harvest"
 peru.393.d:0 "The coastal syndicates will release grain and credit if their men countersign the accounts. The district committees offer smaller subscriptions with fewer strings attached."
 peru.393.a:0 "Take the estate advance and requisition their lorries."
 peru.393.b:0 "Fund a smaller column from district subscriptions."
 peru.394.t:0 "The Division of the Ministries"
 peru.394.d:0 "The Whites have won, and the provisional cabinet cannot satisfy all its backers. Ureta demands control of the army and the presidency. Riva-Agüero offers a Catholic regency and a crown. Pedro Beltrán brings the votes of the agrarian syndicates and their credit. The assembly will ratify one settlement."
 peru.394.a:0 "Let the delegations present their terms."
 PRU_parish_musters_of_the_sierra:0 "The Parish Bells of the Sierra"
 PRU_parish_musters_of_the_sierra_desc:0 "Parish councils open their registers to volunteers. Market towns can now send formed companies, with their own captains and kitchens, to the provisional army."
 PRU_rifles_on_the_callao_wharves:0 "Rifles behind the Sugar Sacks"
 PRU_rifles_on_the_callao_wharves_desc:0 "The regimental armourers send rifles up the coast disguised as freight. Estate drivers move them between depots and the White columns."
 PRU_arrieros_of_the_cordillera:0 "The Mule Trains of the Sierra"
 PRU_arrieros_of_the_cordillera_desc:0 "The White columns need provisions and guides in the passes. The provincial committees promise ration trains in exchange for a place at the peace congress."
 PRU_departmental_muster_rolls:0 "A Muster Roll for Each Prefecture"
 PRU_departmental_muster_rolls_desc:0 "District officers open barracks to younger volunteers. The new recruiting rolls call men to service before the workshops have replaced their labour."
 PRU_piura_frontier_command:0 "The Frontier Command at Piura"
 PRU_piura_frontier_command_desc:0 "The frontier staff now has the provincial muster and a transport plan. Ureta can bargain with Tokyo or Berlin, or take an independent course under the banner of Inti. His larger army keeps a permanent claim on civilian supplies."
 PRU_montalvan_experimental_station:0 "The Montalván Demonstration Plots"
 PRU_montalvan_experimental_station_desc:0 "The estate will demonstrate mechanical cotton cultivation and train overseers to use the new equipment. The arrangements leave the tenants outside the syndicate."
 PRU_callao_cotton_exchange:0 "A Cotton Exchange at Callao"
 PRU_callao_cotton_exchange_desc:0 "Exporters pool their warehouses and borrow against the bales awaiting shipment. Profits from the coast can finance workshops inland."
 PRU_pact_of_the_coastal_valleys:0 "The Pact of the Coastal Valleys"
 PRU_pact_of_the_coastal_valleys_desc:0 "Beltrán summons the prefects to sign the harvest agreement. An export contract gives the estates first claim on labour at picking time. A contract with Lima's markets reserves land for food crops and leaves more households free to send a recruit."
 PRU_new_world_coronation:0 "A Peruvian Crown at Government Palace"
 PRU_new_world_coronation_desc:0 "The Peruvian royalists present their own sovereign. The court will look to its neighbours for recognition of the new dynasty."
 PRU_new_world_coronation_party:0 "Royal Party of Peru"
 PRU_house_habsburg_bourbon:0 "House of Habsburg-Bourbon"
 PRU_claim_the_habsburg_territories:0 "Claim the Habsburg Inheritance"
 PRU_claim_the_habsburg_territories_desc:0 "The court invokes the old domains of the House of Austria. This creates claims on its former possessions in Europe."
 PRU_claim_the_portuguese_empire:0 "Revive the Iberian Union"
 PRU_claim_the_portuguese_empire_desc:0 "The court claims the Portuguese imperial inheritance, from Lisbon and Brazil to the overseas territories."
 PRU_white_mule_trains_idea:0 "Ration Trains through the Passes"
 PRU_white_mule_trains_idea_desc:0 "The Sierra committees keep the columns supplied while the provincial roads can still carry the food trains."
 PRU_white_ureta_levies_spirit:0 "The Departmental Muster"
 PRU_white_ureta_levies_spirit_desc:0 "The recruiting depots fill their rolls faster. Pulling volunteers out of the workshops leaves fewer resources for civilians."
 PRU_white_ureta_frontier_spirit:0 "The Frontier Directorate"
 PRU_white_ureta_frontier_spirit_desc:0 "The columns are trained to deploy in the mountains and ready to mobilise on short notice. Civil industry bears the cost of their equipment."
 PRU_white_estates_credit_spirit:0 "Credit against the Harvest"
 PRU_white_estates_credit_spirit_desc:0 "Coastal creditors can count on export surpluses. The estates still shut Indigenous communities out of army recruitment."
 PRU_white_estates_compact_spirit:0 "The Compact of the Haciendas"
 PRU_white_estates_compact_spirit_desc:0 "The cabinet ties investment to estate output. The gamonales keep military service and public office out of the hands of the communities that work their land."
 PRU_ureta_reservist_books:0 "A Return Ticket in Every Service Book"
 PRU_ureta_reservist_books_desc:0 "Give discharged soldiers a rail warrant and register the station nearest their homes. If Peru goes to war, one emergency recall can bring these trained men back without imposing a new general levy."
 PRU_ureta_veterans_settlement:0 "A Place for the Licenciados"
 PRU_ureta_veterans_settlement_desc:0 "The district committees ask the army to find work for men returning from service. Pay former section leaders to supervise municipal road crews and lead local reserve exercises on Sundays."
 PRU_ureta_pack_columns:0 "Muleteers on the Army Lists"
 PRU_ureta_pack_columns_desc:0 "Pay the arrieros and register their animals by district. A commander in the Andes can call up the pack trains for a campaign, provided the treasury pays the carriers and the towns release their teams."
 PRU_ureta_railway_sappers:0 "The Sappers of the Central Railway"
 PRU_ureta_railway_sappers_desc:0 "Give the railway workshops a standing order for bridge stores and wagons. The engineers can assemble a mobile supply train for an offensive, at the cost of diverting civilian freight."
 PRU_ureta_instructor_school:0 "The Licenciados Return to Chorrillos"
 PRU_ureta_instructor_school_desc:0 "A corporal who has led a section in the sierra can teach things a recruit will never find in his manual. Bring the best of the district instructors to Chorrillos to exchange field notes on first aid, signals and supply. They will take the lessons home to their companies."
 PRU_ureta_piura_exercises:0 "Staff Rides out of Piura"
 PRU_ureta_piura_exercises_desc:0 "Ureta gives his staff a problem to solve on the roads out of Piura. Can the reserve battalions assemble with their supplies before the northern command needs them? The railway engineers will keep the lorries after the exercise. A column using pack animals will take its field stores back to the depot."
 PRU_ureta_district_reserves:0 "One Muster from Piura to Puno"
 PRU_ureta_district_reserves_desc:0 "The prefects can now tell Chorrillos how many men will answer a summons, who trained them and how they will travel. Issue each district its own mobilisation table and keep its instructors on army pay between call-ups."
 PRU_ureta_district_reserves_spirit:0 "Ureta's District Reserves"
 PRU_ureta_district_reserves_spirit_desc:0 "Each district keeps a roll of trained men, a cadre of instructors and a transport allotment. The regiments can bring recruits up to strength quickly. The treasury must pay for depots and transport even between call-ups."
 PRU_beltran_water_boards:0 "Seats on the Cañete Water Board"
 PRU_beltran_water_boards_desc:0 "Beltrán asks the canal associations to survey land at the valley's edge. In return for signing the permits, the regantes want a vote before the next stretch of canal is opened."
 PRU_beltran_water_turns:0 "A Water Turn for Every Acequia"
 PRU_beltran_water_turns_desc:0 "An upstream estate can take a whole night's flow before the next holding sees a drop. Put the turns in writing and send surveyors down the canal with the ditch keepers. Their measurements will guide the next works in the valley."
 PRU_beltran_chincha_gins:0 "The Cotton Gins of Chincha"
 PRU_beltran_chincha_gins_desc:0 "One broken shaft can leave a yard full of raw cotton waiting for the ship. Pool spare parts and bring mechanics from the valley's gins together during the slack season. Their workshops can apply the same methods to other machinery."
 PRU_beltran_lima_markets:0 "Beans and Maize for Lima"
 PRU_beltran_lima_markets_desc:0 "Lima's market women need a steady supply even when cotton fetches a better price abroad. Offer purchase guarantees to estates that leave irrigated plots to their tenant farmers for beans and maize."
 PRU_beltran_market_compact_tt:0 "The Pact of the Coastal Valleys will favour urban food supplies, raising stability and easing the estates' hold on recruits."
 PRU_beltran_export_compact_tt:0 "The Pact of the Coastal Valleys will favour exports, raising factory output and civilian construction speed while reserving more workers for the estates."
 PRU_beltran_city_markets_spirit:0 "The Lima Provisioning Compact"
 PRU_beltran_city_markets_spirit_desc:0 "The city guarantees the price of staple crops. Tenants keep more of their plots for food, and the prefects release some families from harvest obligations. The estates still have a say over who may enlist."
 PRU_from_vitarte_to_callao:0 "From Vitarte's Looms to Callao's Docks"
 PRU_from_vitarte_to_callao_desc:0 "The textile delegates arrive from Vitarte with a list of workshops prepared to repair our equipment. The stevedores can get the parts through Callao. Both ask for a place for organised labour in the Peruvian cabinet."
 PRU_the_ayllus_assemble_in_cusco:0 "The Ayllus Assemble in Cusco"
 PRU_the_ayllus_assemble_in_cusco_desc:0 "The village delegates lay their staffs of office before the assembly in Cusco. They will send volunteers if their communities have a voice over the lands they work. The government accepts their mandate and takes the name and colours of Tawantinsuyu."
 PRU_convene_the_provincial_cabildos:0 "Open the Cabildos to the Provinces"
 PRU_convene_the_provincial_cabildos_desc:0 "It takes a mule two days to bring a petition to the prefect and weeks to get an answer from Lima. Let each town call an open cabildo, record its grievances and choose someone who can speak for it at the provincial capital."
 PRU_san_marcos_extension_brigades:0 "San Marcos beyond the Lecture Hall"
 PRU_san_marcos_extension_brigades_desc:0 "The delegates have offered classrooms above their meeting halls. Send teachers, surveyors and medical students from San Marcos to work there for a term and bring the provinces' questions back to the university."
 PRU_the_market_towns_sign_on:0 "A Fair Price at the Ferias"
 PRU_the_market_towns_sign_on_desc:0 "Mayors and traders will send food up the valley if the carriers receive cash and a signed receipt. In wartime the agreement keeps the columns supplied. Once the fighting ends, it gives the towns a reason to trust the new authorities."
 PRU_market_town_supply_contracts:0 "Contracts at the Provincial Ferias"
 PRU_market_town_supply_contracts_desc:0 "Provincial markets supply the columns at agreed prices. Army quartermasters save on transport, while the treasury pays the carriers and keeps the market stalls stocked."
 PRU_municipal_companies_tt:0 "When the district reserves muster, the municipal companies will supply a further 1,000 recruits."
 PRU_district_instructors_tt:0 "When the district reserves muster, the instructors' reports will grant 10 Army Experience."
 PRU_rotate_the_montana_battalions:0 "Rotate the Montaña Battalions"
 PRU_rotate_the_montana_battalions_desc:0 "The eastern posts have asked for regular relief. Ureta can give the assignment to the army. Each returning battalion will bring its armourers' reports to Chorrillos, where the purchasing officers can see which rifles stood up to a season in the forest."
 PRU_iquitos_river_flotilla:0 "The Iquitos Flotilla Takes the Mail"
 PRU_iquitos_river_flotilla_desc:0 "The river captains at Iquitos offer to carry the mail, stores and replacements on a fixed schedule. Give the navy the transport appropriation and hire civilian vessels to release its crews for the longer runs."
 PRU_register_the_yanacona_leases:0 "Enter the Yanaconas in the Land Register"
 PRU_register_the_yanacona_leases_desc:0 "A tenant can grow food for Lima and still lose his plot on a foreman's word. The market agreement gives Beltrán a reason to hear the yanaconas. A written lease, witnessed in the district office, would last through the next harvest."
 PRU_callao_warehouse_warrants:0 "Warehouse Warrants on the Callao Docks"
 PRU_callao_warehouse_warrants_desc:0 "A bale in a bonded warehouse can pay for repairs before the ship sails. Callao's exporters ask the Banco Agrícola to accept the warehouse receipt as security. Someone must stand behind the dock clerk's signature."
 peru.397.t:0 "A Signature for the Banco Agrícola"
 peru.397.d.markets:0 "Two tenant delegates set their rent books on Beltrán's desk. Lima has contracted for their maize, yet the estate may reassign either plot before delivery. The district notary will register the leases if the cabinet pays the fees. The hacendados want the matter returned to their own offices."
 peru.397.d.exports:0 "The cotton is at Callao, but the ship is late and the warehouse payroll falls due on Friday. The Banco Agrícola will advance the wages against the receipts if Beltrán guarantees them. The syndicate could carry the loss itself, though its smaller growers would be the last paid."
 peru.397.a:0 "Pay the notaries and give each tenant a copy."
 peru.397.b:0 "Guarantee the receipts at Callao."
 peru.397.c:0 "Send the account back to the hacendados."
 PRU_yanacona_settlement_tt:0 "In 70 days, registered leases will grant 2.5% stability and free 600 recruits from estate obligations."
 PRU_callao_warrants_tt:0 "In 70 days, the guarantee will return 10 political power and open one building slot, preferably on the coast."
 peru.398.t:0 "The Harvest Accounts Come In"
 peru.398.d.markets:0 "At the district office the tenants read their names in the register. Produce has reached Lima under the new contracts. The prefect can at last strike the men claimed twice, once for the estate and once for military service, from the labour roll."
 peru.398.d.exports:0 "The ship has cleared Callao. The bank returns part of the guarantee, and merchants release a warehouse yard for construction. This time the smaller growers have their receipts in hand."
 peru.398.a:0 "Send the corrected roll to the prefects."
 peru.398.b:0 "Release the warehouse yard."
 peru.396.t:0 "The Delegations at Government Palace"
 peru.396.d:0 "The municipal delegates have brought lists of volunteers to Lima. Some towns want entire companies to enlist together and keep their own names. Others ask the army to pay experienced sergeants to train men locally, so the workshops need not lose a whole shift at once."
 peru.396.a:0 "Accept the companies and their district colours."
 peru.396.b:0 "Put the sergeants on the state payroll."
 PRU_ureta_field_orders:0 "Orders of the Provincial Commands"
 PRU_ureta_field_orders_desc:0 "The district reserve books and the transport programme at Chorrillos determine which resources the directorate can call upon during a campaign."
 PRU_ureta_second_call:0 "Stamp the Second-Call Warrants"
 PRU_ureta_second_call_desc:0 "Recall the trained reservists to their depots. The railway warrants can be issued once. Their absence will be felt in the towns that provided them."
 PRU_ureta_open_passes:0 "Call Out the Pack Trains"
 PRU_ureta_open_passes_desc:0 "Hire the district mule trains for sixty days of offensive operations. Food reaches the columns more reliably, but fewer teams are left to deliver civilian supplies."
 PRU_ureta_dispatch_trains:0 "Give the Army Priority on the Central Railway"
 PRU_ureta_dispatch_trains_desc:0 "Reserve the freight timetable for sixty days of offensive operations. The army can build up its advance faster, while fewer materials reach civilian construction sites."
 PRU_alliance_with_spain_desc:0 "Peruvian colleges can offer places to Spanish teachers displaced by the fighting. In return the incoming masters will teach a term outside Lima and help establish technical classes there."
