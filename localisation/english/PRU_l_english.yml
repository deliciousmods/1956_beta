 indigenous_recruiter:0 "Indigenous Recruiter"
 son_of_the_sun:0 "Son of the Sun"
 democratic_socialist:0 "Democratic Socialist"
 PRU_llama_army_tech:0 "Llama Army Tech"

 PRU_hugo_pesce:0 "Hugo Pesce"
 PRU_roberto_latorre_medina:0 "Roberto Latorre Medina"
 PRU_carlos_miro_quesasa_laos:0 "Carlos Miró-Quesada Laos"
 PRU_javier_luis_calmell_del_solar:0 "Javier Luis Calmell del Solar"
 PRU_francisco_lanatta:0 "Francisco Lanatta"
 PRU_hildebrando_castro_pozo:0 "Hildebrando Castro Pozo"
 PRU_jose_luis_bustamante_rivero:0 "José Luis Bustamante Rivero"
 PRU_alberto_arca_parro:0 "Alberto Arca Parró"

 PRU_czech_equipment_aquisition:0 "Czech Equipment"
 PRU_czech_equipment_aquisition_desc:0 "After the great defeat suffered during the Pacific War in 1883, the [ROOT.getAdjective] army was weak for a time since the government could not afford such a large military expense, but now that we can acquire new weapons, it is time to reorganize our forces to form a mighty army."
 PRU_andean_warfare:0 "Include the Ronderos in the Army"
 PRU_andean_warfare_desc:0 "The Ronderos are a fundamental piece of [ROOT.getAdjective] history; their presence on battlefields was always of importance as in the war against Chile after the fall of Lima, we require that all Quechuas join this body of Ronderos"

 PRU_paratrooper_company:0 "Paratrooper Company"
 PRU_paratrooper_company_desc:0 "We can create a parachute corps to support the ground troops by building a large fleet of aircraft."
 PRU_modernize_the_infantry_kit:0 "Modernize the Infantry Kit"
 PRU_modernize_the_infantry_kit_desc:0 "New war tactics developed throughout the world mean that we must update our knowledge of war tactics, which leads to acquiring modern equipment to leave behind our old arsenal left over from the Leticia war."
 PRU_jungle_training:0 "Create Ashaninka Army"
 PRU_jungle_training_desc:0 "For a long time, the Ashaninka people lived isolated in the Peruvian jungle, oblivious to all the affairs of central Peru. The rubber companies would discover these indigenous people, starting one of the largest known genocides in Peru. These jungle men will be useful for our operations. We need them now more than ever in our army."
 PRU_motorization:0 "Motorization"
 PRU_motorization_desc:0 "For a long time, our wartime resources were moved by mule or llama over the mountains of our rugged terrain, but with the construction of major highways, it might be time to start using trucks to move military assets."
 PRU_create_the_infantry_and_cavalry_schools:0 "Create the Infantry and Cavalry Schools"
 PRU_create_the_infantry_and_cavalry_schools_desc:0 "The cavalry is a vital resource for our army. Due to our rugged geography, we do not have many motorized vehicles; the horse and the mule have always been highly trusted by the Peruvian army, and the specialization of some commanders in war tactics with cavalry will guide us to victory."
 PRU_cold_weather_equipment:0 "Cold Weather Equipment"
 PRU_czech_tanks:0 "Acquire Czech Tanks"
 PRU_czech_tanks_desc:0 "The new tanks will be of great help for a greater thrust of our army to crush anyone who dares to outrage the country."
 PRU_study_the_blueprints:0 "Study the Blueprints"
 PRU_study_the_blueprints_desc:0 "With our own designs, we will succeed in creating and fortifying our national industry."
 PRU_foreign_licenses:0 "Foreign Licenses"
 PRU_foreign_licenses_desc:0 "With the new foreign weapons licenses, it will be possible to locally produce advanced weapons for our army."
 PRU_italian_guns:0 "Italian Guns"
 PRU_italian_guns_desc:0 "After acquiring Italian planes and military training, it is time to acquire modern Italian cannons to make our power known in the Andes."
#  PRU_invite_italian_military_mission:0 "Invite Italian Military Mission"
 PRU_invite_soviet_military_mission:0 "Invite Soviet Military Mission"
 PRU_expand_the_national_arsenal:0 "Expand the National Arsenal"
 PRU_expand_the_national_arsenal_desc:0 "One of the main arms factories in Lima became obsolete and could not provide enough arms to decently arm our army. Expanding provinces with new military factories will satisfy this need for arms."
 PRU_new_weapons_new_tactics:0 "New Weapons, New Tactics"
 PRU_new_weapons_new_tactics_desc:0 "Our new weapons will help us adapt to the new tactics of war."

 #Focuses Shortcuts
 PRU_economy_shortcut: "Economy"
 PRU_land_army_shortcut: "Land Army"
 PRU_air_and_navy_shortcut: "Air and Navy"
 PRU_politics_non_monarchist_shortcut: "Politics: Non-Monarchist"
 PRU_politics_monarchist_shortcut: "Politics: Monarchist"
 #Industrial focuses
 PRU_industrial_modernization: "Industrial Modernization"
 PRU_industrial_modernization_desc:0 "The Great Depression put a strong toll on our economy in particular. An industrialization program must be initiated to battle the aftermath of the crisis."
 PRU_diversify_steel_production: "Diversify Steel Production"
 PRU_diversify_steel_production_desc: "The steel industry is severely lacking local production capabilities and heavily relies on foreign imports. Home market will benefit greatly from the expansion of this vital sector."
 PRU_maranon_basin_model: "Maranon Basin Model"
 PRU_maranon_basin_model_desc: "Spectacular development of the Maranon River Basin will serve as a pinnacle of our transition into the model age of progress and technological development."
 PRU_strengthen_locomotive_industry: "Strengthen Locomotive Industry"
 PRU_strengthen_locomotive_industry_desc: "Within the scope of the modernization initiative, it is a strict necessity to continue the expansion of the national railway service for both civilian and commercial use."
 PRU_centralize_the_railway_network: "Centralize the Railway Network"
 PRU_centralize_the_railway_network_desc: "The current railway network operates as a disjoint regional system rather than the unified grid, focusing on very localized connections. Such service is unsuitable for any large-scale supply movement of troops or supplies, we better do something about it."
 PRU_rely_on_international_trade: "Rely on International Trade"
 PRU_rely_on_international_trade_desc: "National reliance has proven to be insufficient in the battle against effects of the Great Depression. Opening our markets for trade should increase the liquidity and bring the capital into the country."
 PRU_enlarge_paita_seaport: "Enlarge Paita Seaport"
 PRU_enlarge_paita_seaport_desc: "Located in close proximity of the city of Piura, Paita serves as a logistical hub for exporting the agricultural and lumber products. Its modernization is a necessary measure to maintain the steady flow of goods."
 PRU_invite_foreign_experts:"Invite Foreign Experts"
 PRU_invite_foreign_experts_desc:"Country's mineral and industrial potential is not fully utilized. Inviting foreign experts to help us develop our resources will be a great step forwards towards battling the Great Depression."
 PRU_yearname_organic_law_of_education: "[GetYear] Organic Law of Education"
 PRU_yearname_organic_law_of_education_desc: "Introduction of the compulsory education for all ages is a necessary mean to ensure that our populace will not fall victim to foreign propaganda. Urban areas are encouraged to develop education focused on industrial sector while rural schools should be keen to teach agricultural practices."
 PRU_prioritize_self_sufficiency: "Prioritize Self-Sufficiency"
 PRU_prioritize_self_sufficiency_desc: "Foreign capital is a double-edged sword. While it can help us in the short term, it can also be a threat to our national sovereignty. We must prioritize self-sufficiency and develop our own industries to ensure long-term stability."
 PRU_talara_refinery_expansion: "Talara Refinery Expansion"
 PRU_talara_refinery_expansion_desc: "Having additional governmental funds and 20 years of technological advancements provide us with a unique opportunity to expand the extraction and procession of oil in the Talara Province."
 PRU_support_private_resource_ventures: "Support Private Resource Ventures"
 PRU_support_private_resource_ventures_desc: "Big number of entrepreneurs are interested in investing in the country. We must support them to strengthen the national economy."
 PRU_construct_the_pan_american_highway: "Construct the Pan-American Highway"
 PRU_construct_the_pan_american_highway_desc: "The all-American initiative calls for establishing the highway along the entirety of the West Coast of the country, greatly boosting the foreign trade and local mobility of the population."
 PRU_finalize_transition_from_libra_to_sol_de_oro: "Finalize Transition from Libra to Sol de Oro"
 PRU_finalize_transition_from_libra_to_sol_de_oro_desc: "The six-year transition period of the Peruvian currency from the Libra to the Sol de Oro is coming to an end. The new currency will be a symbol of our economic independence and stability."
 PRU_finish_callahuanca_hydroelectric_plant: "Finish Callahuanca Hydroelectric Plant"
 PRU_finish_callahuanca_hydroelectric_plant_desc: "The hydroelectric plant will be located just 50 kilometers East of Lima. Commissioned in 1934, its construction has been delayed by the recent political instabilities. We better finnish this project in time."
 PRU_economic_centralization: "Economic Centralization"
 PRU_economic_centralization_desc: "Industrialization can be vastly sped up if we only focus on the coastal enclaves with strong port infrastructure such as Lima and Piura. Improving the market connectivity will be a good deal in securing our trade partner's loyalty."
 PRU_end_the_lima_arequipa_rivalry: "End the Lima-Arequipa Rivalry"
 PRU_end_the_lima_arequipa_rivalry_desc: "Two largest cities of the country have been squabbling for too long. Our administration is ready to make substantial concessions to Arequipa in order to promote fair and square competition on the domestic market."
 PRU_bolster_the_timber_industry: "Bolster the Timber Industry"
 PRU_bolster_the_timber_industry_desc: "Lumber harvesting and processing industry experienced a significant growth in recent years and with a handful of governmental subsidies, it can expand into an even larger endeavour."
 PRU_settle_amazonian_frontier: "Settle Amazonian Frontier"
 PRU_settle_amazonian_frontier_desc: "Clearing lands for new settlements and encouraging immigration should bolster the prosperity of the neglected areas in the selva."
 PRU_subsidize_rubber_production: "Subsidize Rubber Production"
 PRU_subsidize_rubber_production_desc: "We have learned our lessons from the first rubber rush in the early 20th century. In order to prevent any further exploitation of the indigenous people, we must fund a new government-controlled rubber company to oversee this decaying industry."
 PRU_expand_gold_and_silver_mining:0 "Expand Gold and Silver Mining"
 PRU_expand_gold_and_silver_mining_desc:0 "Our natural resources, such as gold and silver, will catapult our country to success. The available funds will greatlystrengthen the national currency."
 PRU_supplement_zinc_and_lead_concentrators: "Supplement Zinc and Lead Concentrators"
 PRU_supplement_zinc_and_lead_concentrators_desc: "Technological advancement in separation of pure metal components from waste rock have already vastly increased the output of our mines. Adding more concentrators to our mining complexes will allow us to spend even less resources on logistical needs."
 PRU_seize_foreign_businesses: "Seize Foreign Businesses"
 PRU_seize_foreign_businesses_desc: "British, German and American Companies have dominated the local economy for far too long. This exploitation must end immediately and the obtained wealth must be used to strengthen the national economy."
 PRU_foundation_for_the_urban_normal_school: "Foundation for the Urban Normal School"
 PRU_foundation_for_the_urban_normal_school_desc: "Establishing a national network of urban normal schools will improve education and training for our future teachers, ensuring a better-educated population and a stronger workforce."
 PRU_bring_education_to_the_countryside: "Bring Education to the Countryside"
 PRU_bring_education_to_the_countryside_desc: "The disease of illiteracy must be battled on all scales and new motivated teachers are encouraged to bring seeds of wisdom to the countryside."

 #Political Focuses
 #Elections
 PRU_rally_the_opposition: "Rally the Opposition"
 PRU_rally_the_opposition_desc: "Disunited and suppressed by the militant regime of Benavides, the opposition parties will not be able to turn over the scale in their favour. Forging new alliances and opening up for negotiations - only in such way will it be possible to secure the firm and democratic Peru!"
 PRU_indigenous_narrative: "Indigenous Narrative"
 PRU_indigenous_narrative_desc: "Exclusion from public affairs and semi-feudal conditions of haciendas reinforce the governmental policies towards the suppression of indigeneous Andean people. Voices among the populace call for an organized strike to showcase the unity and will of our brethren!"
 PRU_expand_the_protest_network: "Expand the Protest Network"
 PRU_expand_the_protest_network_desc: "Continuous focus of central government on the capital state of Lima further deepens the divide among the rich and poor. With minorities and APRA having a solid support basis for their cause among the people, we can invest additional funds to ensure that small towns will also join our side in this struggle."
 PRU_a_state_within_a_state: "A State within a State"
 PRU_a_state_within_a_state_desc: "We are prepared to carry on with a general strike unless the state is ready to make hefty concessions towards the indigeneous community of Eastern Peru. The proper representation of native affairs requires an establishment of the autonomous region with limited self-governance - only by these means the security of the supplies can be maintained."
 PRU_militarize_the_red_countryside: "Militarize the Red Countryside"
 PRU_militarize_the_red_countryside_desc: "Neglected for too long, the common man is ready to fight for the revolutionary ideas. Words will not suffice to defeat the armed oppressors when they eventually will come for our souls."
 PRU_sway_the_cusco_garrison: "Sway the Cusco Garrison"
 PRU_sway_the_cusco_garrison_desc: "One of the major supply and deployment hubs in the area, Cusco overlooks the Southern Cierra and would a thorn in our side should hostilities with the central government break out. Securing their loyalty might be a costly, but such prize is worth the pay."
 PRU_seek_foreign_assistance: "Seek Foreign Assistance"
 PRU_seek_foreign_assistance_desc: "A plentiful of foreign emissaries have expressed the willingness to support our fight for justice and freedom, all offering a varyying price for their loyalty and relief in times of need..."
 PRU_a_harsh_stance_against_authoritarianism: "A Harsh Stance Against Authoritarianism"
 PRU_a_harsh_stance_against_authoritarianism_desc: "Power-hungry militants are embarking our country on the one-way journey towards the military dictatorship! It is our rightful duty to ensure that the liberty prevails over the authoritarian rule!"
 PRU_obtain_support_from_civilian_wing: "Obtain Support From Civilian Wing"
 PRU_obtain_support_from_civilian_wing_desc: "In order to gain the needed legitimacy for the new regime, it is quintessential to receive the approval of the parliamentary majority. Concessions and compromises are known factors in play here and we have a plenty of tools at our disposal here."
 PRU_ensure_apras_support: "Ensure APRA's Support"
 PRU_ensure_apras_support_desc: "The left-wing sector of the political landscape is severely underrepresented after the APRA's voter base was driven out of large cities. Luckily, our agenda has a rather large number of agreements, allowing us to advocate for a union candidate for the upcoming coalition government."
 PRU_distance_from_international_parties: "Distance from International Parties"
 PRU_distance_from_international_parties_desc: "APRA and their supporters cannot be trusted - their agitators in the countryside risk to spark another Trujillo tragedy if we allow them to gain more momentum. No matter if Left or Right, the main party block will never work with extremists who threaten to bring the international revolution into our peaceful country."
 PRU_commit_to_democratic_elections: "Commit to Democratic Elections"
 PRU_commit_to_democratic_elections_desc: "Transitional government of president Benavides saved our country in dire times, but now it is time to move on and elect a popular ruler who will guide the nation towards its true destiny."
 PRU_harsh_takeover: "Harsh Takeover"
 PRU_harsh_takeover_desc: "All pieces are set in position and the board is ready for taking: a single spark of red flame will engulf the nation brighter than the revolt of 1932. We will accomplish our goals of bringing down the tyrants who denied our people liberty."
 PRU_socialism_not_internationalism: "Socialism, not Internationalism"
 PRU_socialism_not_internationalism_desc: "The revolutionary cause is only the mean to achieve the true class liberty and prosperity of a specific nation in question. We do not want to carry the fire of revolt abroad and soak the soil of beloved neighbors in blood and tears. The socialist cause will prevail with a new identity of the Communist Party."
 PRU_adopt_the_soviet_model: "Adopt the Soviet Model"
 PRU_adopt_the_soviet_model_desc: "Our goals are closely aligned to those suggested by the Communist International directives and involve the establishment of the collectivized national economy coupled with the liberation of the worker and empowerment of the trade unions. The just cause will allow us to pursue a policy of closer cooperation with our communist brethren."
 PRU_agricultural_collectivization: "Agricultural Collectivization"
 PRU_agricultural_collectivization_desc: "Rich and powerful landowners managed to amass a huge amount of capital through means of exploitation of the common peasant. The haciendas system is the representation of the historical injustices enforces on the poor and those in struggle. The abolishment will certainly cause an uproar, but for the just cause all means might be necessary."
 PRU_conclude_the_agrarian_modernization: "Conclude the Agrarian Modernization"
 PRU_conclude_the_agrarian_modernization_desc: "Initiated reforms have already bared their fruits of labor, but the process of modernization is far from complete. We must continue to support the peasantry class and ensure that the haciendas system is dismantled once and for all."
 PRU_nationalize_key_industries: "Nationalize Key Industries"
 PRU_nationalize_key_industries_desc: "To achieve our socialist goals, it is necessary to bring the key industries under state control. This will allow us to ensure fair working practices and prevent exploitation of the working class by private capitalists. Nationalization is also expected to provide the state with the resources needed to invest in social programs and infrastructure."
 PRU_maintain_the_popular_front: "Maintain the Popular Front"
 PRU_maintain_the_popular_front_desc: "Social-democrats represent a significant left-leaning force whose cooperation is desirable in order to achieve the common goal. With some popular concessions from our side and their showcase of distance from the purely capitalist model, we can build a strong coalition government to secure the stability of the political domain."
 PRU_anti_fascist_struggle: "Anti-Fascist Struggle"
 PRU_anti_fascist_struggle_desc: "Right-wing militants are still sharpening their daggers, waiting in the shadows to strike in the back of our politicians. With a strong backing for our cause, we can comb through their ranks and remove some of their most powerful leaders, ensuring that the fascist threat is contained and will not rise again."
 PRU_subvert_apristas_influence: "Subvert Aprista's Influence"
 PRU_subvert_apristas_influence_desc: "Despite our common initial goal, this militant internationalist faction continues to engage in demonstrations, protest actions and armed sabotage pushing for their populist cause! Dismantling their support basis in rural regions should nullify their influence and ensure that we are not associated with tis rabble."
 PRU_promises_to_keep: "Promises to Keep"
 PRU_promises_to_keep_desc: "A tight victory of the broad coalition over the conservative minority is the first step in moving the country away from the atmosphere of repression and fear. With a new-found might, we can embark on quest of fulfilling our electoral promises to all the constituent members of our large government."
 PRU_initiate_labor_reforms: "Initiate Labor Reforms"
 PRU_initiate_labor_reforms_desc: "One of the main strongholds of the social-democrats was and will remain the working class, all those men and women who tirelessly work in factories for the good of the nation. Lifting up their spirits will bolster the ranks and improve our popular standing."
 PRU_empower_trade_unions: "Empower Trade Unions"
 PRU_empower_trade_unions_desc: "Founded in 1929, the General Confederation of Workers of Peru remains a main institution which serves to represent the interests of the workers and laborers of our nation. Providing them with additional funds and governmental support will ensure that their effort are never in vain."
 PRU_diversify_electoral_pool: "Diversify Electoral Pool"
 PRU_diversify_electoral_pool_desc: "A tight victory of democratic coalition in recent elections has clearly shown the lack of ideological agitation and cohesion among the supportive voters of different areas. It is best to solidify the governmental positions and ensure that the coalition prevails in a long run."
 PRU_full_voting_rights_for_women: "Full Voting Rights for Women"
 PRU_full_voting_rights_for_women_desc: "Despite their contribution to the society, women so far are granted permission to vote only in communal and not general elections. This virtuality denies more than half of our citizens their basic rights which cannot stand any further!"
 PRU_bridge_the_pongos: "Bridge the Pongos"
 PRU_bridge_the_pongos_desc: "Many communities of our vast nation remain isolated from the political activities in large cities. Bridging the divide across these gaps and integrating the local minorities into the public life should greatly improve the cohesion of our nation."
 PRU_first_indigenous_cabinet: "First Indigenous Cabinet"
 PRU_first_indigenous_cabinet_desc: "Progressives virtues and support for local communities have shattered the invisible roof which limited the maximum achievable status of many indigenous communities. Now, their members can join the Congress of the Republic, sign up for higher governmental positions and submit candidates for presidential elections."
 PRU_secularize_the_state: "Secularize the State"
 PRU_secularize_the_state_desc: "Catholic church remains a strong actor in public affairs and while on paper the church and state appear to be separated, former politicians were eager to empower and weaken the positions of the clergy if it fitted their agenda. Archbishops also utilized their privileged status to advocate for political candidates of their likings. We should push for a clear separation between the two entities."

 PRU_finalize_the_1935_cabinet_reforms: "Finalize the 1935 Cabinet Reforms"
 PRU_finalize_the_1935_cabinet_reforms_desc: "Initiated in October 1935, these administrative reforms sought to improve the public opinion of the current governmental cabinet by establishing an independent Ministry of Public Health, Work and Social Welfare. Finalization of these processes will allow us to improve the quality of life for every Peruvian in a long run."
 PRU_entrench_benavides_positions: "Entrench Benavides Positions"
 PRU_entrench_benavides_positions_desc: "Voices of opposition are amassing the popular support in favour of liberal and social democratic candidates. In order for the current state of affairs to continue throughout these uneasy times, we must fortify our political flanks."
 PRU_concessions_to_rural_regions: "Concessions to Rural Regions"
 PRU_concessions_to_rural_regions_desc: "APRA is running rampant in the countryside with their propaganda campaigns aiming to sway the popular vote in their favour. Granting some liberties to rural populace and minorities will ease the tension and reduce the danger of the red threat from the rear."
 PRU_secure_the_conservative_rule: "Secure the Conservative Rule"
 PRU_secure_the_conservative_rule_desc: "Our conservative protege Jorge Prado Ugarteche from the Conservative Coalition amassed enough popular support to ensure the smooth transition of power towards the civilian government."
 PRU_employment_program: "Employment Program"
 PRU_employment_program_desc: "Countryside is still dominated by the semi-feudal employment practices in which poor peasants are usually either underemployed or are exploited to do low-wage subsistence work. Initiating an job market reform in these areas will allow us to battle the historical injustices in those areas."
 PRU_push_for_agrarian_reform: "Push for Agrarian Reform"
 PRU_push_for_agrarian_reform_desc: "Haciendas continue to dictate the behavior of agricultural sector in the country and persistence of their owners on usage of outdated techniques has to be put to an end. While full redistribution of properties under current circumstances is naturally out of question, we can still pass a number of legislation to ease the struggle of the poorest ones."
 PRU_limited_reconciliation_with_the_left: "Limited Reconciliation with the Left"
 PRU_limited_reconciliation_with_the_left_desc: "More ground in the countryside can be gained if we allow some of the left-leaning administrators to partake in decision making. By doing so, we can breach the stronghold of APRA in rural areas and ensure that far-left never raise their heads above the ground."
 PRU_god_country_and_family: "God, Country and Family"
 PRU_god_country_and_family_desc: "The national idea is build on the cornerstone of three main principles which bound us all together. These being the Allmighty support, the national pride and core communities who will stand for each other in times of need."
 PRU_embrace_the_catholic_identity: "Embrace the Catholic Identity"
 PRU_embrace_the_catholic_identity_desc: "By 1936 more than 95% of our population identified as Catholic and it will be foolish to force people to break one of the pillar on which our society is built upon. Expanding the religious education and elevating regional archbishoprics will further strengthen the unity of our nation."

 PRU_continue_the_third_militarism: "Continue the Third Militarism"
 PRU_continue_the_third_militarism_desc: "Liberal parties have gained an unprecedented amount of support through the subversive sentiment of APRA militants. We cannot give up our power in the hands of ill-prepared and coward politicians. Our great president Benadives will have to rule until the situation stabilizes again."
 PRU_enlist_blackshirts_into_army: "Enlist Blackshirts Into Army"
 PRU_enlist_blackshirts_into_army_desc: "Paramilitary lads from the Revolutionary Union have been acting in the interest of our regime, bringing order and promoting state-sponsored values to the countryside. They would only benefit from sharing experiences with our commanders."
 PRU_maintain_the_democratic_facade: "Maintain the Democratic Facade"
 PRU_maintain_the_democratic_facade_desc: "The pretext for the unclear election results was not well received among the population and it is therefore imperative to normalize the current state of the governance. Democracy will prevail, be it a valid reality or the one on our speech sheets."
 PRU_cooperate_with_the_rich: "Cooperate with the Rich"
 PRU_cooperate_with_the_rich_desc: "The unfortunate lack of cohesion within our judicial codex allows some of our high-ranking bureaucrats to bypass the current legislation and establish a number of ... mutually beneficial connections with some of the wealthier families known around."
 PRU_support_big_agricultural_sector: "Support Big Agricultural Sector"
 PRU_support_big_agricultural_sector_desc: "Stability of agricultural supplies depends heavily on two main factors, namely on the width of logistical networks overseen by the central government and performance of the agrosector itself managed by the large-scale landowners. While we can handle the first one, it is wise to invest into the second one."
 PRU_plutocracy_in_all_but_name: "Plutocracy in All but Name"
 PRU_plutocracy_in_all_but_name_desc: "Clearly democratic principles of Ancient Rome saw senate give up their power in times of need and empower consuls to guide the struggling country to victory. Our worthy and influential patrons are also ready to take the heavy burden of ruling the struggling democracy to its new true glory."
 PRU_order_peace_and_work: "Order, Peace and Work"
 PRU_order_peace_and_work_desc: "During the first term of president Benavides, the statesman ruled the country following the three guiding principles: Order, Peace and Work. In order to fulfill those, the campaign to suppress the red militants of APRA was initiated, the peace with Colombia of 1934 was negotiated and a massive public works program was funded. Continuation of this course is expected to improve the support of the current regime."
 PRU_deradicalization_initiative: "Deradicalization Initiative"
 PRU_deradicalization_initiative_desc: "Security of the state depends on the cohesion of the population and with clear display of violence in the countryside perpetrated by both left and right, we should embark on the dangerous journey to battle such behavior and ensure that minds of our youth remain clean of such vicious propaganda."
 PRU_militarize_the_government: "Militarize the Government"
 PRU_militarize_the_government_desc: "Interferences of all kinds into the election procedure displayed a clear weakness of the civilian-led government. If they cannot maintain control, the army will be ready to step in and ensure that voices of state enemies are silenced by all means necessary."
 PRU_the_hunt_for_apristas: "The Hunt for Apristas"
 PRU_the_hunt_for_apristas_desc: "The red enemy has infiltrated every cell of our rural society and continues to spread the venom paralyzing the body of our regime. We will strengthen garrisons in the countryside and begin the reeducation campaign to contain the red threat."
 PRU_officialize_the_military_junta: "Officialize the Military Junta"
 PRU_officialize_the_military_junta_desc: "Corrupt politicians and puny demagogues have completely lost their grip on reality! The state needs a strong hand which will carry both the sword and the quill in times of need. Let us embrace our true future and solidify the already strong control of the army over the state."

 PRU_march_to_victory: "March to Victory"
 PRU_march_to_victory_desc: "The Revolutionary Front is ready to wield the sword of justice from the Government Palace of Peru. Having the support from rural people and the backing of the military, we can ensure swift and decisive victory."



 PRU_reinforce_border_patrols: "Reinforce Border Patrols"
 PRU_reinforce_border_patrols_desc: "lacking the official agency to keep the watch over numerous border crossings in difficult terrain, the duty was so far carried out by the armed servicemen and local paramilitary squadrons. Instead of relying on constant military support, we should fund the creation of the state-affiliated agency to do so."

 PRU_break_down_the_smuggling_rings: "Break Down the Smuggling Rings"
 PRU_break_down_the_smuggling_rings_desc: "Since 1930 Coup d'Etat by the military, subsequent red insurrections and eventual transition into semi-functioning democracy, the country is riddled with looters and smuggles who abuse their power to enrich themselves of the common man. We should utilize our newly established border guards together with some military personnel to get rid of this pest."

 PRU_rebuke_the_border_treaties: "Rebuke the Border Treaties"
 PRU_rebuke_the_border_treaties_desc: "During the last several decades we became witnesses to the number of territorial disputes in which the common borders to our neighbors were continuously redrawn not in our favour. These treaties left many dissatisfied and asking for retaliation. With our newfound resolve, it has become possible to question these "deals" once more."

 PRU_legacy_of_saltpeter_war: "Legacy of Saltpeter War"
 PRU_legacy_of_saltpeter_war_desc: "The region of Tacna-Arica witnessed intense fighting campaigns during the Saltpeter, or how it is better known, Pacific War with [CHL.getNameDef] over the access to these nitrate-rich coastal regions. Just a few years ago,  in the moment of our weakness, we obtained a territory of Tacna and a compensation of 6 Million dollars for the 40 years of Chilean occupation of these areas. It is time to renegotiate these "generous" concessions again."

 PRU_titicaca_lake_access: "Titicaca Lake Access"
 PRU_titicaca_lake_access_desc: "Since late 19th century we maintain the Puno naval base which hosts a naval garrison equipped with two patrol boats Yavari and Yapura. Recent reports, however, indicate, that [BOL.getAdjective] government has expanded their fishing zone way beyond the originally demarcated line, clearly violating our agreement. Perhaps they can make some amends to resolve this issue..."

 PRU_secure_loreto_triangle: "Secure the Loreto Triangle"
 PRU_secure_loreto_triangle_desc: "For the last century we have been in the process of constant negotiation over the Amazonian river access and logistical control over the Iquitos-Panroja-La Chorrera region encompassing the Southern Colombia, East Equador and Northern Peru. With our neighbours seemingly being too stubborn to renew negotiations over the dispute, it is perhaps time to secure these territories by force."

 PRU_ulloa_viteri_accord: "Ulloa-Viteri Accord"
 PRU_ulloa_viteri_accord_desc: "Following the signing of the Rio Protocol of 1934 and the end of the hostilities over the territory of Sucumbios, we maintained warm relations with [COL.getNameDef]. The protocol will not be complete without the presence of the [ECU.getAdjective] delegation and we should therefore invite them as equal partners to negoatiate a mutually-beneficial deal."

 PRU_finalize_the_frontier: "Finalize the Frontier"
 PRU_finalize_the_frontier_desc: "With our Northern flank secured and the source of the Amazonian firmly secured in our hands, we can begin integrating the new frontier into our realm and expand the existing infrastructure to connect the previously neglected provinces into the central governmental network."

 PRU_department_of_foreign_affairs: "Department of Foreign Affairs"
 PRU_department_of_foreign_affairs_desc: "Foreign relations build the foundation of the modern state and without any sort of mutually-beneficial trade agreements and research exchange, our economy would've become sluggish and inefficient. We are lucky to posess a number of skillfull diplomats who tirelessly work on improving the international standing of our country."

 PRU_good_neighbour_policy: "Good Neighbour Policy"
 PRU_good_neighbour_policy_desc: "Trade, cooperation and respect of the national sovereignity as advocated by the [USA.getAdjective] president Franklin D. Roosvelt should be the building blocks for the Latin America diplomacy. War with our neighbours will only bring destruction and devastation, so preventing it is the first objective for our newfound regime."

 PRU_pan_american_conference: "[GetYear] Pan-American Conference"
 PRU_pan_american_conference_desc: "For more than 40 years we have been an active participant of the Pan-American Conference, seeking cooperation and beneficial deals with our North, Central and South American partners. This year we can host the conference in Lima and seek to expand our political agenda on more members of the organisation."

 PRU_hemisphere_defence_protocols: "Hemisphere Defence Protocols"
 PRU_hemisphere_defence_protocols_desc: "With war engulfing more and more of the civilized world, the Monroe doctrine slowly begins to crumble under the increasing pressure of the foreign powers. We are ready to sign the agreement by which the American country facing aggression from outside will now not only face the [USA.getAdjective], but also our intervention as well!"

 PRU_support_the_spanish_struggle: "Support the Spanish Struggle"
 PRU_support_the_spanish_struggle_desc: "Our Hispanic brethren have embarked on the complicated journey to modernize their country and extinguish the voices of restrain holding them back. We cannot stand aside and observe their struggle for freedom, but should instead assist and learn from them."

 PRU_encourage_immigration: "Encourage Immigration"
 PRU_encourage_immigration_desc: "Facing increased hostilities on the national and religious basis, many individuals from Europe are now seeking refuge in countries untouched by struggle and conflict. Governmental funds can be deducted to establish integrated comunes where these people can enjoy safety and continue their productive works for the benefit of the nation."

 PRU_expand_the_volunteer_program: "Expand the Volunteer Program"
 PRU_expand_the_volunteer_program_desc: "As volunteers return from the conflict zones, they bring with them a wealth of experience and knowledge which can be utilized to improve the national military. We should therefore expand the volunteer program to ensure that more of our citizens can partake in this noble endeavour."

 PRU_propaganda_and_culture_section: "Propaganda and Culture Section"
 PRU_propaganda_and_culture_section_desc: "Our Ministry of Foreign Affairs has been working tirelessly to improve the international standing of our country. Their experience in reaching out to people can be utilized on the home front as well."

 PRU_a_reborn_navy:0 "A Reborn Navy"
 PRU_a_reborn_navy_desc:0 "After the Pacific War in 1880, our Navy was constantly declining from one of the best trained in South America to one of the worst and most obsolete. This is our opportunity to see our Navy reborn."
 PRU_expand_the_naval_factory_of_bellavista:0 "Expand the Naval Factory in Bellavista"
 PRU_expand_the_naval_factory_of_bellavista_desc:0 "The Bellavista Naval Factory was always the national naval factory par excellence, but with the recent rebirth of our navy, it would be a good idea to start expanding our factory to the north and south of the country."
 PRU_work_with_foreigners:0 "Work with Foreigners"
 PRU_work_with_foreigners_desc:0 "Foreigners know about ships more than we do. We will work with them to grow our navy."
 PRU_National_Admiralty_Corps:0 "National Admiralty Corps"
 PRU_National_Admiralty_Corps_desc:0 "If we bring together the most brilliant minds in naval strategy in Peru, we can form a larger admiralty cabinet to make the decisions in a naval battle."
 PRU_naval_industry:0 "Naval Industry"
 PRU_naval_industry_desc:0 "Beyond the expansion of our naval industry, we must build larger shipyards to create a great national fleet."
 PRU_modernize_destroyers:0 "Modernize Destroyers"
 PRU_modernize_destroyers_desc:0 "Our newest destroyers are already obsolete, so starting a research program for new models is vital."
 PRU_Modernize_our_submarines:0 "Modernize Submarines"
 PRU_Modernize_our_submarines_desc:0 "Our newest submarines are already obsolete, so starting a research program for new models is vital."
 PRU_the_grau_class_project:0 "The Grau Class Project"
 PRU_the_grau_class_project_desc:0 "The Grau Class cruisers were the largest and most modern ships that the Peruvian Navy had since its fall in the Pacific War. Their battle capacity was such that the state wanted these ships to be used as a base for the massive creation of more Grau Class cruisers."
 PRU_expand_naval_production:0 "Expand Naval Production"
 PRU_expand_naval_production_desc:0 "We need more shipyards to expand our great navy."
 PRU_modernize_battleships:0 "Modernize Battleships"
 PRU_modernize_battleships_desc:0 "It is time to start the Lima Battleship project. We could never afford such a battleship due to internal economic problems. Now such a purchase can be allowed."
 PRU_modernize_carrier:0 "Modernize Carriers"
 PRU_modernize_carrier_desc:0 "It is time to start the Republica del Peru Carrier project. We could never afford such a battleship due to internal economic problems. Now such a purchase can be allowed."
 PRU_naval_doctrine:0 "Naval Doctrine"
 PRU_naval_doctrine_desc:0 "New ships, new naval doctrines."
 PRU_fly_with_the_sun:0 "Heroes of the Sun"
 PRU_fly_with_the_sun_desc:0 "The new recruits of the Peruvian air force since its creation in 1919 have received many talented recruits who achieved incredible things in the cockpit of a plane. It is time for these new pilots to show their country who owns the South American skies."
 PRU_start_aircraft_purchase:0 "Aircraft Purchases"
 PRU_start_aircraft_purchase_desc:0 "To add more planes to our air force, we must choose which foreign country we will request planes from."
 PRU_acquire_italian_planes:0 "Acquire Italian Planes"
 PRU_acquire_italian_planes-desc:0 "Italian planes are strong and heavy. They are perfect for our air force."
 PRU_acquire_usa_planes:0 "Acquire [USA.GetAdjective] planes"
 PRU_acquire_usa_planes_desc:0 "American planes are fast and light. They are perfect for our air force."
 PRU_strengthen_the_air_force:0 "Strengthen the Air Force"
 PRU_strengthen_the_air_force_desc:0 "Our air force is disorganized, and our airfields are neglected. If we develop these aspects, our air force will be the most powerful in the region."
 PRU_work_with_our_designs:0 "Create Factorias Faucett"
 PRU_work_with_our_designs_desc:0 "Our aircraft designs will be better than those we acquire from foreigners. It is of the utmost importance to improve the designs we already have."
 PRU_work_on_heavy_aircraft:0 "Work on Heavy Aircraft"
 PRU_work_on_heavy_aircraft_desc:0 "If we develop our heavy planes, we can be strong and hit the enemy without him noticing."
 PRU_work_on_light_aircraft:0 "Work on Light Aircraft"
 PRU_work_on_light_aircraft_desc:0 "If we develop our light aircraft, we can be fast and hunt down the enemy without him noticing."
 PRU_air_innovations:0 "Air Innovations"
 PRU_air_innovations_desc:0 "New planes, new tactics."
 PRU_total_production:0 "Total Production"
 PRU_total_production_desc:0 "We must multiply our production of fighters and CAS to create a great force. Only then will we achieve absolute air superiority."
 PRU_heroes_of_the_air:0 "Heroes of the Air"
 PRU_heroes_of_the_air_desc:0 "The new knights of the Air, those who are lucky enough to fight for their country in their steel corsets."
 PRU_organize_future_elections:0 "Organize Future Elections"
 PRU_organize_future_elections_desc:0 "After a short period of government by Benavides, fulfilling what the constitution mandates, he should call for general elections in Peru, although he has among his plans to stay a while longer."
 PRU_mediate_between_the_parties:0 "Mediate Between the Parties"
 PRU_mediate_between_the_parties_desc:0 "Call on the parties to prepare for general elections."
 PRU_british_airports:0 "British Airports"
 PRU_british_airports_desc:0 "With the help of the British, we can develop our neglected national airports."
 PRU_Military_Universities:0 "Military Universities"
 PRU_Military_Universities_desc:0 "The expansion of the educational system in Peru has helped the creation of new civil and military institutions. Among these, there is the idea of ​​creating a military university."
 PRU_give_asylum_to_the_jews:0 "Give Asylum to the Jews"
 PRU_give_asylum_to_the_jews_desc:0 "Several Jewish intellectuals are fleeing from Europe due to the current policies that are taken in the heart of it. The best thing would be to open our country to Jewish refugees to support the research effort."
 PRU_consolidate_borders:0 "A New Peruvian Identity"
 PRU_consolidate_borders_desc:0 "Through cultural and educational policies, we will seek to forge a solid national identity that transcends regional differences. We will promote patriotic pride and loyalty to the nation among our citizens. This is an essential step in building a cohesive and resilient society."
 PRU_nationalize_banking_sector:0 "Nationalize Banking Sector"
 PRU_nationalize_banking_sector_desc:0 "For a long time, our banks were in the hands of foreigners who only served their interests. Now, the bank must only serve the state." #nationalize fascist
 PRU_empower_benavides:0 "Empower Benavides"
 PRU_empower_benavides_desc:0 "The elections must be canceled in favor of a unified government with Benavides at the head."
 PRU_legacy_of_sachez_cerro:0 "Legacy of Sanchez Cerro"
 PRU_legacy_of_sachez_cerro_desc:0 "Sanchez Cerro was the liberator who ended the unpatriotic Leguia and his government of 11 years. During his government, laws of social interest and protection of the indigenous would be passed. Due to his humble Chola origins, he is seen as a representative of the best Peru can offer."
 PRU_conservative_coalition:0 "Conservative Coalition"
 PRU_conservative_coalition_desc:0 "After the dissolution of the Civil Party as a result of the Crash of 1929, the landowners and gamonales lost their political power. Given this, the right fragmented into multiple independent organizations that joined forces in 1930 and decided to form the Conservative Coalition. This was a coalition of conservative right-wing political parties in Peru. Its leader, Manuel Prado Ugarteche."
 PRU_social_democratic_coalition:0 "Social Democratic Coalition"
 PRU_social_democratic_coalition_desc:0 "Peru needs a party with programmatic volume from the center. The Social Democratic Party is not a closed echelon. The Patriotic Union Registry has no hateful restrictions and no unfriendly preventions. Its flag is the flag of Peru. The homeland is a symbol of union, all the more vigorous the more intense the affective solidarity and economic cooperation among compatriots."
 PRU_alerta_en_la_frontera:0 "An Alert on the Front"
 PRU_alerta_en_la_frontera_desc:0 "The issue of disputed territories with Ecuador is vast. Since the times of the Spanish colony, the territories were never clear between the viceroyalty of Peru and the viceroyalty of New Granada. After independence, things did not improve between the Republic of Peru and the Republic of Gran Colombia. A clear border has not been delimited after many years. We believe the best way out would be to draw the border through war, although we could also resort to other more peaceful means."
 PRU_protest_against_the_cancellation:0 "Protest Against the Cancellation"
 PRU_protest_against_the_cancellation_desc:0 "Benavides is a dictator who canceled the elections and deserves all the punishment of God and the people."
 PRU_prolong_benavides_presidency:0 "Prolong the Benavides Presidency"
 PRU_prolong_benavides_presidency_desc:0 "Our country has prospered a lot under the government of Benavides. He should stay for a few more years."
 PRU_peruvian_blackshirts:0 "Peruvian Blackshirts"
 PRU_peruvian_blackshirts_desc:0 "The blackshirts of Peru under the command of Luis Alberto Flores will lead us to victoria."
 PRU_give_power_to_general_ureta:0 "Give Power to General Ureta"
 PRU_give_power_to_general_ureta_desc:0 "General Ureta, a fervent Urrista and nationalist, is fed up with the extremist policies of Alberto Flores. He plans to coup the party to be the leader of the Union Revolucionaria."
 PRU_integrate_the_church:0 "Integrate the Church"
 PRU_integrate_the_church_desc:0 "The Catholic Church is a vital piece of the life of the entire Peruvian population."
 PRU_remember_the_Trujillo_revolution:0 "Remember the Trujillo Revolution"
 PRU_remember_the_Trujillo_revolution_desc:0 "During the government of Sanchez Cerro in 1932 in the city of Trujillo, there was a large-scale uprising of militants from the APRA party where they managed to take the city entirely and threatened to make a march to Lima to take power. The government's response was harsh. The revolution was crushed with aerial bombardment and artillery, but the memory remains in the Aprista population."
 PRU_benavides_nightmare:0 "Beginning of the Revolution"
 PRU_benavides_nightmare_desc:0 "The communists rose up en masse for the cancellation of the elections. It is the end of the Benavides era and of personal liberties in Peru."
 PRU_select_a_successor_for_benavides:0 "Select a Successor for Benavides"
 PRU_select_a_successor_for_benavides_desc:0 "Benavides is too old and weak to continue governing. It would be best to elect a successor as soon as possible."
 PRU_hispanism:0 "Hispanism"
 PRU_hispanism_desc:0 "Hispanism is the memory of the old union of the old viceroyalties of America, which together formed a mighty empire. The memory of it is part of the national identity of Peru."
 PRU_tax_reform:0 "Tax Reform"
 PRU_tax_reform_desc:0 "Taxes are currently balanced for those with more money than the average citizen. It is time to reform this absurd system to make it fairer for everyone."
 PRU_revolutionary_goverment:0 "The Revolution of Tacna"
 PRU_revolutionary_goverment_desc:0 "Although Ricardo Perez Godoy was not an Urrista, his nationalist ideas came together with social ideas to save Peru from a possible communist revolution, seeing that the government did not do much to stop the advance of communism in Peru."
 PRU_left_and_right_united:0 "Left and Right United"
 PRU_left_and_right_united_desc:0 "If we want to get more power, we must unify forces between socialists, moderates, and conservatives. Together, we will achieve a better Peru."
 PRU_the_teachings_the_amauta:0 "The Teachings of the Amauta"
 PRU_the_teachings_the_amauta_desc:0 "José Carlos Mariátegui, remembered as the "Amauta", is the main socialist ideologue of Peru whom [ROOT.GetLeader] greatly admired and wished to continue his legacy through communist policies in [ROOT.GetNameDefCap]."
 PRU_commit_to_democratic_election:0 "Commit to Democratic Elections"
 PRU_commit_to_democratic_election_desc:0 "The recent cancellation of the elections by Benavides had caused a strong popular rejection that would force the Dictator to promise democracy in the future."
 PRU_select_montagne_as_successor:0 "Select Montagne as Successor"
 PRU_select_montagne_as_successor_desc:0 "Ernesto Montagne Markholz is a convinced Urrista, being this part of the Revolutionary Union party when Sanchez Cerro created it and was in his bases of nationalism. When the party fell into the hands of Luis Alberto Flores and began to resemble Italian fascism, Ernesto Montagne decided to leave the party and remain independent until he was called by Benavides to be his successor and continue with his government of reforms in [ROOT.GetNameDefCap]."
 PRU_unite_the_andes:0 "Unite the Andes"
 PRU_unite_the_andes_desc:0 "The betrayal committed by [BOL.GetNameDefCap] against [ROOT.GetNameDefCap] cannot be forgotten. We must unify all the Quechua peoples under the leadership of [ROOT.GetLeader] on our own."
 PRU_alliance_with_bolivia:0 "Alliance with Bolivia"
 PRU_alliance_with_bolivia_desc:0 "[ROOT.GetNameDefCap] and [BOL.GetNameDefCap] share a common past, an Inca past and a Viceroyalty past. It is time to leave differences behind and reach the union of brother peoples."
 andean_pact:0 "Andean Pact"
 PRU_place_odria_as_adviser:0 "Place Odria as Adviser"
 PRU_place_odria_as_adviser_desc:0 "Instead of a government of Manuel Odria, a feasible option would be to place him as a political adviser for [ROOT.GetLeader] so that he could give him the advice to reform Peru and put it on the path of development."
 PRU_strengthen_the_national_industry:0 "Strengthen the National Industry"
 PRU_strengthen_the_national_industry_desc:0 "[ROOT.GetLeader] is looking for new national and international capital to strengthen our industry."
 PRU_exile_luis_alberto_flores:0 "Exile Luis Alberto Flores"
 PRU_exile_luis_alberto_flores_desc:0 "One of the greatest political agitators that Peru has is Luis Alberto Flores. We should exile him to Chile."
 PRU_reform_the_constitution:0 "Rewrite the Constitution"
 PRU_reform_the_constitution_desc:0 "The last constitution written by the former dictator Luis Miguel Sanchez Cerro is no longer valid for the current government. [ROOT.GetLeader] believes it should be reformed to make way for the creation of the new Peru."
 PRU_legacy_of_pachacutec:0 "Legacy of Pachacutec"
 PRU_legacy_of_pachacutec_desc:0 "Pachacutec, or the one who changes the earth. It is time to modify our land to make it more modern."
 PRU_hasta_quemar_el_ultimo_cartucho:0 "Until the Last Cartridge is Burned"
 PRU_hasta_quemar_el_ultimo_cartucho_desc:0 "Hasta quemar el ultimo Cartucho. We will never give up so easy."
 PRU_regain_the_new_spain_heritage:0 "Regain the New Spain Heritage"
 PRU_regain_the_new_spain_heritage_desc:0 " "
 PRU_secure_the_central_america:0 "Secure the Central America"
 PRU_secure_the_central_america_desc:0 " "
 PRU_alliance_with_mexico:0 "Alliance with Mexico"
 PRU_alliance_with_spain:0 "Alliance With Spain"
 PRU_Support_the_banana_industry:0 "Support the Banana Industry"
 PRU_Support_the_banana_industry_desc:0 ""
 PRU_alliance_mexico_desc:0 "The ties that unite [ROOT.GetLeader] and [MEX.GetLeader] are more than a Hispanic past. They are more ideological ties."
 PRU_alliance_with_mexico_desc:0 "The ties that unite [ROOT.GetLeader] and [MEX.GetLeader] are more than a Hispanic past. They are more ideological ties."
 PRU_expand_the_agricultural_sector:0 "Expand the Agricultural Sector"
 PRU_expand_the_agricultural_sector_desc:0 "Our land is rich and can support diverse vegetables. Let's use these to feed our population and stop depending on foreign imports."
 PRU_crusade_against_radicalism_in_america:0 "Crusade Against Radicalism"
 PRU_crusade_against_radicalism_in_america_desc:0 "Fascism and communism are rapidly expanding throughout the South American region. It is our sacred duty to purge it of these evil ideologies."
 PRU_integrate_the_indigenous:0 "Integrate the Quechua People"
 PRU_integrate_the_indigenous_desc:0 "In the past, the indigenous Quechuas were deprived of rights and reduced to simple servitude to the country's oligarchs. It would be a good time to add the indigenous Quechuas to the country's industrial force since they can add much power to the political movement."
 PRU_Legion_Peruana:0 "La Legion Peruana"
 PRU_Legion_Peruana_desc:0 "The Legion Peruana was an elite group of the republic in its beginnings to fight the most brutal wars. At times like now, [ROOT.GetLeader] once again requires a new Legion Peruana."
 PRU_inca_industry:0 "Create the Qhapaq ñan"
 PRU_inca_industry_desc:0 "The Qhapaq ñan, or "great road" in Quechua, is an ancient Inca construction connecting the entire empire from north to south and east to west. It is time to go back to the old road system and modernize it."
 PRU_prepare_for_another_pacific_war:0 "Prepare for Another Pacific War"
 PRU_prepare_for_another_pacific_war_desc:0 "The Nacistas are taking time to gain power in Chile. Perhaps Peruvian weapons will manage to place a fascist in Chile."
 PRU_a_new_peru:0 "A New Peru"
 PRU_a_new_peru_desc:0 "The new Peru represents a new political era, leaving behind the past of caudillos and revolutionaries."
 PRU_the_only_sun:0 "The Only Sun"
 PRU_the_only_sun_desc:0 "There is only one sun, and that sun is the one that shines and will shine for the Incas the sun god Inti."
 PRU_looking_north:0 "Looking North"
 PRU_looking_north_desc:0 "[ROOT.GetLeader] is not in favor of the policies taken by [COL.GetLeader] on the subject of the Amazonian trapeze and the city of Leticia, which still has Peruvian citizens. It is time to take Leticia by force."
 lima_group:0 "Lima Group"
 PRU_follow_in_the_footsteps_of_tupac_amaru:0 "In the Footsteps of Tupac Amaru II"
 PRU_follow_in_the_footsteps_of_tupac_amaru_desc:0 "The legacy of the indigenous revolutionary Tupac Amaru II still lives in the heart and memory of several Quechua indigenous people, who rose up against the Spanish domination of the Inca empire in the past. Today the revolution evokes his name to unite the towns !Y no podran matarlo¡."
 PRU_benavides_is_dead:0 "Benavides is Dead"
 PRU_benavides_is_dead_desc:0 "Our caudillo leader, who pacified the country after the death of Sanchez Cerro, feels extremely ill. Is it possible that he could die?"
 PRU_wake_up_a_giant:0 "Wake up a Giant"
 PRU_wake_up_a_giant_desc:0 "The country that saw the birth of one of the most important cultures in South America before the colony, the one that saw the birth of one of the most powerful viceroyalties in America and then rested on its laurels for more than 100 years due to an unstable republic, it's time to wake up."
 PRU_riva_agueros_dream:0 "Riva Agueros Dream"
 PRU_riva_agueros_dream_desc:0 "Forming a unified and pacified homeland after several years of revolts and coups is the dream of the Catholic nationalist José de la Riva Agüero y Osma, who finally sees his dream come true at the hands of [ROOT.GetLeader]."

 PRU_Eradicate_the_traitors:0 "Eradicate the Traitors"
 PRU_Eradicate_the_traitors_desc:0 "Alberto Flores has decided to take drastic measures to safeguard the purity and greatness of our nation. An exhaustive purge will be carried out to eliminate the APRAs and their allies, who threaten stability and national identity. Although this measure will undoubtedly result in human losses, Flores argues that it is essential to preserve the glory of our beloved Peru."

 PRU_The_People_General:0 "The People's General"
 PRU_The_People_General_desc:0 "Under the charismatic leadership of Eloy Ureta, Peruvian nationalism takes a new direction. Committed to protecting the people and leaving years of oppression behind, Ureta strives to build a more just and united nation. This more compassionate approach seeks to heal the wounds of the past."

 PRU_Return_to_Negotiate_with_Caproni:0 "Return to Negotiate with Caproni"
 PRU_Return_to_Negotiate_with_Caproni_desc:0 "Aware of the importance of maintaining solid trade relations, the Peruvian government has decided to return to the negotiating table with Caproni. We seek to review and improve the terms of our initial 1934 agreement to ensure a beneficial and equitable collaboration that advances the development of our nation."
 PRU_aprista_guerrilla:0 "Aprista Guerrilla"
 PRU_aprista_guerrilla_desc:0 "The guerrillas organized by APRA could be of great help in times of war, the experience of the Trujillo guerrillas during the Sanchez dictatorship closed."

 PRU_Sovereign_Industrial_Expansion:0 "Sovereign Industrial Expansion"
 PRU_Sovereign_Industrial_Expansion_desc:0 "Under the banner of national sovereignty, our leader has launched an ambitious initiative to foster domestic industrial growth. As we encourage industrialization, we strive to forge a future where every machine and every factory is a testament to our independence and determination."
 PRU_Create_the_Royal_Army:0 "Create the Royal Army"
 PRU_Create_the_Royal_Army_desc:0 "We seek the formation of a military force loyal to the Peruvian monarchy, thus guaranteeing the defense of our nation and the preservation of monarchical values."
 PRU_The_Soldier_King:0 "The Soldier King"
 PRU_The_Soldier_King_desc:0 "In an unprecedented act, our monarch takes an active role in military leadership as 'The Soldier King'. By inspiring the armed forces and spearheading military strategy, our monarch demonstrates his unwavering commitment to the security and defense of Peru. This approach will strengthen our military position and cement the image of the monarch as a brave and determined leader."
 PRU_sons_of_the_conquistador:0 "Sons of the Conquistador"
 PRU_sons_of_the_conquistador_desc:0 "In an effort to revitalize the spirit of our ancestors and honor the rich heritage of the conquistadors. Recognizing the bravery and audacity of conquerors, we aspire to forge a future full of greatness and achievement."
 PRU_defend_our_empire:0 "Defend our Empire"
 PRU_defend_our_empire_desc:0 "In an increasingly uncertain world, it is our duty to protect and preserve our beloved empire. By uniting in the defense of our empire, we will guarantee the security of our borders and the future of the Peruvian monarchy."
 PRU_Receive_refugees_from_the_Spanish_civil_war:0 "Receive Refugees From Spain"
 PRU_Receive_refugees_from_the_Spanish_civil_war_desc:0 "Faced with the devastation of the civil war in Spain, we have decided to open our doors to refugees seeking safety and a new home. By welcoming refugees, we not only extend Peru's helping hand, but we also strengthen our communities with talent and diversity."
 PRU_all_spanish_cores_controlled_by_self_or_puppet_tt:0 "All Spanish cores are controlled by either [ROOT.GetNameDef] or any of its subjects."

 PRU_exile_haya_de_la_torre:0 "Exile Haya de la Torre"
 PRU_exile_haya_de_la_torre_desc:0 "Víctor Raúl Haya de la Torre is one of the greatest political agitators in Peru, since the founding of APRA they have always been a problem for the stability of Peru. The words of Víctor Raúl Haya de la Torre mobilize indigenous people, peasants and the impoverished middle class who want a change, the best thing would be to exile him to Mexico."
 PRU_Recovering_from_the_civil_war:0 "Recover From the Depression"
 PRU_Recovering_from_the_civil_war_desc:0 "After the great depression of 1929 and the sad death of the military leader Luis Sánchez Cerro, Peru fell into a serious economic crisis that made its development seriously impossible, but if the few existing mining resources and those yet to be discovered are used correctly, it could be built. a solid economy."
 PRU_peruvian_military_youth:0 "Peruvian Military Youth"
 PRU_peruvian_military_youth_desc:0 "Compulsory military service in Peru has generated debates and controversies due to the violence with which it operates, both by forcing and by mistreating and even torturing kidnapped youth. It was not until the late 1930s that the cruelty with which they operated would be demonstrated. This new recruitment system for Peruvian youth would give new soldiers for the national army."
 PRU_develop_the_provinces:0 "Pan-Incaism"
 PRU_develop_the_provinces_desc:0 "The radiance of Inca greatness must illuminate our path to the future. This cultural rebirth will strengthen our sense of national identity and we will be able to add indigenous people who were formerly members of the Inca empire to our cause. May the spirit of the Inca Empire guide our path to greatness!"
 PRU_include_llamas_in_the_army:0 "Include Llamas in the Army"
 PRU_include_llamas_in_the_army_desc:0 "The llama is a domestic artiodactyl mammal of the Camelidae family, it was domesticated by native Andean peoples through artificial selection from the guanaco. This occurred, initially independently in time and space, in sectors of Peru. This mammal was fully exploited by the Inca Empire."
 PRU_control_the_economy:0 "Control the Economy"
 PRU_control_the_economy_desc:0 "The Peruvian economy is completely controlled by the wealthiest large families and a reduced oligarchy that only looks out for their interests and international interests. For the state to take control of the main means of production in Peru, such as agriculture and mining, displacing the old Lima oligarchy, would avoid a possible revolution by them, instantly paralyzing the entire country."
 PRU_open_universities_to_indigenous_people:0 "Open Universities to Indigenous People"
 PRU_open_universities_to_indigenous_people_desc:0 "For a long time the indigenous Quechua and Aymara, who are the majority of the population of Peru, never had access to quality education since the best schools and universities were mainly concentrated in the capital city of Lima. The opening of public schools and universities to indigenous people could open up new hidden talents that could never have been discovered."
 PRU_reject_international_ideologies:0 "Reject International Ideologies"
 PRU_reject_international_ideologies_desc:0 "International ideologies such as communism and fascism have flooded the peasant population and middle class of Peru, these radical ideologies detach people from the Inca roots where they come from and make them sympathize with foreign powers alien to our national reality, the prohibition of these ideologies will avoid a possible revolution in the future against the Inca legacy."
 PRU_organize_protests_in_the_south:0 "Organize the Indigenous People of the South"
 PRU_organize_protests_in_the_south_desc:0 "The mobilization of indigenous Quechuas in the main squares of Cuzco, Arequipa and Puno could put the central government on alert about a possible revolution, but it could also paralyze these southern areas of the country, depriving the capital of metals and food that are produced in the area."
 PRU_convince_the_high_command:0 "Convince the High Command"
 PRU_convince_the_high_command_desc:0 "Among the members of the Military Junta there are important military heads who sympathize with the idea of reforming the incanato, their influence is such that if they were able to talk with them, an agreement could be reached to have their support in the event of a possible revolution."
 PRU_monumental_architecture:0 "Monumental Arquitecture"
 PRU_monumental_architecture_desc:0 "The architecture developed in the Inca period is characterized by the accuracy of its forms, its solidity, its symmetry and by seeking that its constructions harmonize the landscape. Unlike coastal societies such as the Chimú, the Incas used quite creative decoration. The main material used was stone, in the simplest constructions it was placed without carving, but not in the most complex and important ones. The Inca builders developed techniques to build enormous walls, true mosaics made up of blocks of carved stone that fit perfectly, without even a pin being able to pass between them."
 PRU_the_march_of_the_four_suyos:0 "The March of the Four Suyos"
 PRU_the_march_of_the_four_suyos_desc:0 "The indigenous people from all parts of Peru have just met to launch the coup against the central government, the peoples of the four suyos meet for a common cause that would be the restoration of the Inca empire."
 PRU_Convince_supporters_of_Flores:0 "Convince Supporters of Flores"
 PRU_Convince_supporters_of_Flores_desc:0 "It is known from a very good source that members of the Union Revolucionario party close to Luis Alberto Flores have ideals of monarchical governments. Flores, being a deeply rooted nationalist, causes the disappointment of his more conservative followers and monarchs who decide to gradually join the protests caused to put a king at the head of Peru."
 PRU_Support_the_Catholic_Church:0 "Support the Catholic Church"
 PRU_Support_the_Catholic_Church_desc:0 "The Peruvian Constitution recognizes the valuable contribution that the Catholic religion had to the formation of the Peruvian nation, but although the Catholic religion is the majority, Peru ceased to be a confessional State, recognizing religious freedom. Even the way in which the Catholic religion is practiced in Peru is diverse, the so-called "popular religion" is born from the religious syncretism of the Catholic religion and pre-Hispanic practices."
 PRU_launch_the_coup:0 "Launch the Coup"
 PRU_launch_the_coup_desc:0 "The republican system of government is not working, since the republic of Peru was founded in 1821 and its congress has been in charge of plunging Peru into a deep social and economic crisis that caused the stagnation of its society and its industry. The refoundation of Peru under the government of a king could open the doors to a future full of splendor and glory."

 PRU_our_revolution:0 "Our Revolution"
 PRU_our_revolution_desc:0 "With the creation of the Alianza por la Revolucion Americana, it is planned to face the demands of Moscow with the communist countries of the world, treating them as if they were mere colonies of their property, [ROOT.GetLeader] is in the task of being the guide of the great South American revolution."
 alliance_for_the_american_revolution:0 "Alliance for the American Revolution"
 PRU_revolucion_restauradora:0 "Restore Order"
 PRU_revolucion_restauradora_desc:0 "The Revolucion Restauradora at the hands of General Panupali's hero Manuel Odria will be the only way out to end the incompetence of the old political class and usher in a new era for [ROOT.GetNameDefCap] without corruption and with a prosperous future."
 PRU_inti_raymi:0 "Legacy of the Inti"
 PRU_inti_raymi_desc:0 "Incaism will unite our people in a single force to remember that splendid past embracing all allies South American Quechua."
 runasimi_union:0 "Runasimi Union"
 PRU_legacy_of_guayaquil_treaty:0 "Legacy of Guayaquil Treaty"
 PRU_legacy_of_guayaquil_treaty_desc:0 "Our Northern border shall be reinforced if any of so-called former Bolivarian states are willing to invoke the Uti possidetis juris principle and attempt to reinforce their claims on regions of Loreto and Pastaza!"
 PRU_hispanic_union:0 "Hispanic Union"
 PRU_hispanic_union_desc:0 "The history of Hispanic heritage in Peru is embodied in the nationalist Hispanist José de la Riva Agüero y Osma who, evoking the splendid past of the Peruvian Viceroyalty where there was abundance and prosperity, were part of a solid and strong unit that they want to bring back by uniting all the Hispanists of South America."
 union_hispanica:0 "Union Hispanica"
 PRU_la_legion_peruana:0 "La Legion Peruana"
 PRU_la_legion_peruana_desc:0 "We must strengthen our army by bringing back La Legion Peruana, the old elite corps used in difficult times in [PRU.GetNameDefCap], but we will use Quechua people to form it this time."
 PRU_incaism:0 "Our Glorious Past"
 PRU_incaism_desc:0 "The Inca Empire in the past was one of the most powerful empires of pre-Columbian America; we must strengthen our relationship with our Inca past."
 PRU_new_peru_1:0 "New Peru"
 PRU_new_peru_1_desc:0 "After an era of corrupt rulers and oligarchs, it is time for [PRU.GetNameDefCap] to enter a new era, evolving its policies and renewing its political class."
 PRU_riva_agueros:0 "Riva Aguero Dream"
 PRU_riva_agueros_desc:0 "The Catholic ideologue José de la Riva Agüero y Osma had made known his desire to create a Peruvian nationalism without reaching the extremism of the fascists; today, his dream has come true."
 PRU_agricultural:0 "Agricultural Reform"
 PRU_agricultural_desc:0 "Our agriculture, rich in various foods, has always been one of the great thrusts of our country; the recent development of this sector will help the development of all social classes in [PRU.GetNameDefCap]."
 PRU_revolucion:0 "Restorative Conservative Revolution"
 PRU_revolucion_desc:0 "General Odria, the hero of Panupali's combat with his Union Nacional Odrista (UNO) party, will lead us to the victory and development that our country needs."
 PRU_wake_up:0 "Wake Up a Giant"
 PRU_wake_up_desc:0 "A great country rises; with the will and faith of the people who occupy it, it will impose its will on its neighbors."
 PRU_wake_up_fascism:0 "Wake Up a Giant"
 PRU_wake_up_fascism_desc:0 "A great country rises; with the will and faith of the people who occupy it, it will impose its will on its neighbors."
 PRU_inti:0 "Inti Legacy"
 PRU_inti_1:0 "Inti Legacy"
 PRU_inti_2:0 "Inti Legacy"
 PRU_inti_desc:0 "The union of all the indigenous Quechuas of all the South American countries will create a new army that will support us to victory."
 PRU_nationalizex_the_banking_sector:0 "Nationalized Banks"
 PRU_nightmare:0 "Revolution in Progress"
 PRU_nightmare_desc:0 "The nightmare of [PRU.getLeader] today is the will of the people, since they cannot achieve the social reforms required for the people."
 PRU_rights_to_indigenous_people:0 "Rights to Indigenous People"
 PRU_social_spending:0 "Increased Social Spending"
 PRU_women_in_the_army:0 "Women in the Army"
