 PRU_enlist_ureta_desc:0 "$PRU_circle_dossier_ureta$\n\nAppointment: §Y45 political power§!, §R8 legitimacy§! and a §Y90-day§! office cooldown. An occupied office also incurs the replacement consequences above."
