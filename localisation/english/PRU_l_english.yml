 PRU_A_new_war_machine_desc:0 "Taking advantage of the ingenuity of the Andean people and the legacy of their ancestors, the Inka Reich has designed a new kind of war machine. Combining traditional metallurgical secrets with modern technology, creating a formidable force on the battlefield."


