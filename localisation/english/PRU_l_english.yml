 PRU_the_party_of_flores:0 "The Party of Flores"
 PRU_return_to_the_ballot_box:0 "Return to the Ballot Box"
 PRU_prado_and_the_convivencia:0 "Prado and the Convivencia"
 PRU_belaundes_popular_coalition:0 "Belaúnde's Popular Coalition"
 PRU_lavalles_national_unity:0 "Lavalle's National Unity"
 PRU_an_aprista_social_contract:0 "An Aprista Social Contract"
 PRU_a_republic_of_workers_and_communities:0 "A Republic of Workers and Communities"
 PRU_the_officers_retain_control:0 "The Officers Retain Control"
 PRU_consolidate_the_corporative_state:0 "Consolidate the Corporative State"
 PRU_indigenous_narrative:0 "Listen to Indigenous Grievances"
 PRU_militarize_the_red_countryside:0 "Reinforce the Hacienda System"
 PRU_indigenous_narrative_desc:0 "Hear petitions over grazing rights, rents and compulsory labor. Giving community delegates a hearing builds consent, at a cost to the cabinet."
 PRU_militarize_the_red_countryside_desc:0 "Guarantee the authority of estate owners. Their backing strengthens the cabinet in Lima at the price of unrest in the countryside."
 PRU_review_ballot_tt:0 "Military custody of the count will allow Congress to annul the returns in four days."
 peru.331.t:0 "Congress Rejects the Returns"
 peru.331.d:0 "Eguiguren leads the count, but the officers entrusted with the ballot have referred the returns to Congress. Invoking votes cast by supporters of the proscribed APRA, the government has secured an annulment. Benavides will remain in office."
 peru.331.a:0 "Extend the mandate."
 PRU_who_will_safeguard_the_count_desc:0 "Provincial returns will reach Lima through officials appointed by the government. Congress wants to know who will answer for the count."
 PRU_put_the_count_under_military_guard_desc:0 "The prefects will entrust the returns to the garrisons. If Eguiguren leads, the officers can refer his Aprista votes to Congress and secure an extension for Benavides."
 PRU_entrust_the_ballot_to_civil_authorities_desc:0 "Place the returns in civilian custody. Eguiguren can take office, while a conservative contender will need a patron in the cabinet and sufficient government legitimacy."
 PRU_count_the_presidential_ballots_desc:0 "Count the provincial returns. Civilian guarantees, military custody and the candidates represented in the cabinet will determine which verdict can stand."
 PRU_organize_the_blackshirts_desc:0 "Flores wants the provincial committees of the Unión Revolucionaria ready for the campaign. Their organization gives him an opening to seek the popular caudillo seat."
 PRU_cells_in_the_mining_camps_desc:0 "Give the mining committees a voice in Lima. Ravines can now be considered for the popular caudillo seat."
 PRU_delegates_from_the_andean_communities_desc:0 "Bring community delegates into the capital and open the popular caudillo seat to Gamaliel Churata."
 PRU_a_cabinet_of_compromise_desc:0 "A divided Congress can keep a civilian president in office by agreeing on a cabinet acceptable to the provinces and the capital."
 PRU_officers_committee:0 "Organize the Officers’ Committee"
 PRU_officers_committee_desc:0 "Ureta needs the backing of the provincial commands before the officers can challenge the government in Lima."
 PRU_ureta_palace_coup:0 "Ureta Moves on the Palace"
 PRU_ureta_palace_coup_desc:0 "With the Army behind him, Ureta can displace the incumbent and head a nationalist military government."
 peru.332.t:0 "The Garrison Declares for Ureta"
 peru.332.d:0 "The officers have withdrawn their support from the cabinet. With the garrison answering to him, Eloy Ureta takes the presidency and suspends elections. Civilian leaders dispute his mandate."
 peru.332.a:0 "The officers will answer to Ureta."
 PRU_credit_from_lima:0 "Negotiate Credit in Lima"
 PRU_credit_from_lima_desc:0 "The banking houses will finance the government if their representatives have a voice in the succession."
 PRU_miners_delegates:0 "Seat the Mining Delegates"
 PRU_miners_delegates_desc:0 "Invite the mining committees to send delegates to the workers’ negotiations."
 PRU_puno_assembly:0 "Convene the Puno Assembly"
 PRU_puno_assembly_desc:0 "Gamaliel Churata can carry the communities’ demands into the popular council."
 PRU_patron_santisteban:0 "Antonio Silva Santisteban"
 PRU_patron_montagne_command:0 "Ernesto Montagne"
 PRU_patron_santisteban_hostile:0 "Antonio Silva Santisteban (Aggressive)"
 PRU_patron_montagne_command_hostile:0 "Ernesto Montagne (Aggressive)"
 PRU_enlist_santisteban:0 "Appoint Antonio Silva Santisteban to Military Command"
 PRU_enlist_montagne_command:0 "Appoint Ernesto Montagne to Military Command"
 PRU_enlist_santisteban_desc:0 "$PRU_circle_dossier_santisteban$\n\nAppointment: §Y45 political power§!, §R8 legitimacy§! and a §Y90-day§! office cooldown. An occupied office also incurs the replacement consequences above."
 PRU_enlist_montagne_command_desc:0 "$PRU_circle_dossier_montagne_command$\n\nAppointment: §Y45 political power§!, §R8 legitimacy§! and a §Y90-day§! office cooldown. An occupied office also incurs the replacement consequences above."
 PRU_build_network_santisteban:0 "Strengthen the Network of $PRU_circle_name_santisteban$"
 PRU_build_network_montagne_command:0 "Strengthen the Network of $PRU_circle_name_montagne_command$"
 PRU_build_network_santisteban_desc:0 "Organise supporters for 45 days: +10 personal influence and +5 trust, at a cost of 3 government legitimacy. Stronger partners can deliver political agreements, but a powerful opponent is more dangerous."
 PRU_build_network_montagne_command_desc:0 "Organise supporters for 45 days: +10 personal influence and +5 trust, at a cost of 3 government legitimacy. Stronger partners can deliver political agreements, but a powerful opponent is more dangerous."
 PRU_demand_santisteban:0 "The Demands of $PRU_circle_name_santisteban$"
 PRU_demand_montagne_command:0 "The Demands of $PRU_circle_name_montagne_command$"
 PRU_demand_santisteban_desc:0 "Antonio Silva Santisteban wants the provincial commands funded and consulted. An unmet deadline costs 20 trust and adds 10 power."
 PRU_demand_montagne_command_desc:0 "Ernesto Montagne wants the provincial commands funded and consulted. An unmet deadline costs 20 trust and adds 10 power."
 PRU_concede_santisteban:0 "Meet the Demands of $PRU_circle_name_santisteban$"
 PRU_concede_montagne_command:0 "Meet the Demands of $PRU_circle_name_montagne_command$"
 PRU_concede_santisteban_desc:0 "Fund the provincial commands. Antonio Silva Santisteban gains 15 trust and 5 power. The Army gains influence, while civil partners lose 5 trust."
 PRU_concede_montagne_command_desc:0 "Fund the provincial commands. Ernesto Montagne gains 15 trust and 5 power. The Army gains influence, while civil partners lose 5 trust."
 PRU_discredit_santisteban:0 "Discredit $PRU_circle_name_santisteban$"
 PRU_discredit_montagne_command:0 "Discredit $PRU_circle_name_montagne_command$"
 PRU_discredit_santisteban_desc:0 "Reduce their power by 20 and their trust by 15. The public dispute costs 1% stability."
 PRU_discredit_montagne_command_desc:0 "Reduce their power by 20 and their trust by 15. The public dispute costs 1% stability."
 PRU_exile_santisteban:0 "Exile $PRU_circle_name_santisteban$"
