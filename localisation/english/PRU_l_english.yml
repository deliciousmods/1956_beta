#National Ideas
 r56_idea_PRU_haciendas_dominated_agriculture: "Haciendas-Dominated Agriculture"
 r56_idea_PRU_haciendas_dominated_agriculture_desc: "For centuries the rural areas of the nation were dominated by the large plantation and farm estates. Their practices follow the century-old semi-feudal character based off the old colonial Hispanic and Roman tradition where landowner leases the land to dependent peasants who cultivate the land and pay off their debts in harvested crops."

 r56_idea_PRU_smuggler_paradise: "Smuggler Paradise"
 r56_idea_PRU_smuggler_paradise_desc: "Political instability coupled with a complex geography and lack of stable border control led to the formation of organized smuggling rings who exploit the current economic system for personal enrichment."

 r56_idea_PRU_new_extraction_model_idea: "New Extraction Model"
 r56_idea_PRU_new_extraction_model_idea_desc: "Successful transition of the Maranon River Industries from crude rubber harvest to oil drilling and wood harvesting has shown our ability to refocus the capital investments into the growing industrial sectors."

 r56_idea_PRU_funding_the_urban_normal_school_development:"Funding the Urban Normal School Development"
 r56_idea_PRU_funding_the_urban_normal_school_development_desc:"The government has issued additional funds to enlarge the Escuela Normal Urbana in large cities, which will allow for the training of more teachers to educate the youth of Peru."

 r56_idea_PRU_contributing_to_the_construction_project: "Contributing to the Construction Project"
 r56_idea_PRU_contributing_to_the_construction_project_desc: "Extensive funds are being relocated to complete our section of the Pan-American Highway."

 r56_idea_PRU_major_hacienda_strikes_idea: "Major Haciendas Strikes"
 r56_idea_PRU_major_hacienda_strikes_idea_desc: "Dissatisfied with systematic oppression of the rural minirities, the local committees organized a nationwide strike targeting the hacienda estates."

 r56_idea_PRU_secularization_campaign: "Secularization Campaign"
 r56_idea_PRU_secularization_campaign_desc: "Deepening the separation between the religion and state is not an easy task. But the long-term benefits are certainly worth it."

 r56_idea_PRU_battling_the_rural_unemployment: "Battling the Rural Unemployment"
 r56_idea_PRU_battling_the_rural_unemployment_desc: "Skilled workers are being located and reassigned to fill in the emerging production chains."

 r56_idea_PRU_diminishing_haciendas_influence: "Diminishing Haciendas Influence"
 r56_idea_PRU_diminishing_haciendas_influence_desc: "A nationwide campaign is currently being prepared and executed to ensure the smooth transition of the agricultural sector towards the model favouring small-scale efficient producers."

 r56_idea_PRU_dismantling_old_agricultural_practices: "Dismantling Old Agricultural Practices"
 r56_idea_PRU_dismantling_old_agricultural_practices_desc: "Some of our officialias might be pursuing the new reforms a bit too eagerly, resulting into the questrionable practises"

 r56_idea_PRU_disgruntled_upper_class: "Disgruntled Upper Class"
 r56_idea_PRU_disgruntled_upper_class_desc: "Nationalizion policies of the current government left several wealthy indudstrialists quite dissatisfied."

 r56_idea_PRU_studying_the_spanish_civil_war: "Studying the Spanish Civil War"
 r56_idea_PRU_studying_the_spanish_civil_war_desc: "The Spanish Civil War is a complex conflict with many moving parts. We are currently studying the war to understand the different factions and their strategies."

 r56_idea_PRU_expanded_volunteer_program: "Expanded Volunteer Program"
 r56_idea_PRU_expanded_volunteer_program_desc: "Learning from the prior experiences, we can more effectively project our influence while also supporting the powers allied to our cause around the world."

