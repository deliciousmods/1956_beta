 PRU_movement_ultimatum:0 "The Streets Challenge the Government"
 PRU_movement_ultimatum_desc:0 "Restore trust to 40 or reduce the challenger's power below 45 within 90 days. Dismissal alone leaves their network intact."
 PRU_resolve_movement_ultimatum:0 "Negotiate the Popular Ultimatum"
 PRU_resolve_movement_ultimatum_desc:0 "Offer a public concession: +25 trust and +5 influence for the instigator, 180 days without ideological friction, and -2% stability. A deeply hostile caudillo may still require further reconciliation."
 PRU_consolidate_fragile_mandate:0 "Consolidate the Electoral Mandate"
 PRU_consolidate_fragile_mandate_desc:0 "Once the confrontation is resolved, legitimacy and a cooperative popular intermediary can give this government a durable foundation."
 peru.222.t:0 "Victory without an Organisation"
 peru.222.d:0 "Flores has taken office, but an electoral proclamation cannot replace a political movement. Opponents demand a recognised representative. Those who organised before the election now have the strongest claim."
 peru.222.a:0 "Recognise the balance of forces—and prepare our response."
 peru.230.t:0 "The Barracks Issue Their Demands"
 peru.230.d:0 "The military caudillo is aggressive and has built enough power to challenge the government. There are 90 days to bring them back to collaboration or lower their power below 45."
 peru.231.t:0 "Our Civil Partners Break Ranks"
 peru.231.d:0 "The civil caudillo is aggressive and has built enough power to challenge the government. There are 90 days to bring them back to collaboration or lower their power below 45."
 peru.232.t:0 "The Popular Caudillo Challenges Us"
 peru.232.d:0 "The popular caudillo is aggressive and has built enough power to challenge the government. There are 90 days to bring them back to collaboration or lower their power below 45."
 PRU_read_ultimatum:0 "We have ninety days to act."
 peru.233.t:0 "The Military Ultimatum Expires"
 peru.233.d:0 "The military caudillo has enough support to force the government out. The president is removed from office and the challenger takes power."
 peru.233.a:0 "The government is forced to resign."
 peru.233.b:0 "Mobilise the loyal institutions and arrest the plotters."
 peru.234.t:0 "The Popular Confrontation Reaches Its Climax"
 peru.234.d:0 "The popular caudillo has turned their movement against the government. Provincial supporters have raised a rival administration, and the challenger will lead it into civil war."
 peru.234.a:0 "The movement takes up arms."
 peru.234.b:0 "Use the loyal military to suppress the movement."
 peru.235.t:0 "Patronage under Investigation"
 peru.235.d:0 "The civil caudillo has stopped protecting the cabinet. Accusations of favoured contracts and political appointments are now circulating in Lima. The cabinet can spend political capital on an immediate inquiry or let the controversy run its course."
 peru.235.a:0 "Weather the scandal for four months."
 PRU_reorganize_cabinet:0 "Reorganise the Cabinet"
 PRU_reorganize_cabinet_desc:0 "An administration needs intermediaries who can speak for the armed forces, civil interests and organised popular movements. Empty seats remain a political choice; appointing a patron creates obligations."
 PRU_prepare_presidential_succession:0 "Prepare the Presidential Succession"
 PRU_prepare_presidential_succession_desc:0 "Consult the officers or secure civil guarantees before the election. These preparations build a mandate, but cannot guarantee that every sector will accept the result."
 PRU_organize_political_participation:0 "Organise Political Participation"
 PRU_organize_political_participation_desc:0 "Give the popular intermediary the means to organise. A leader who has already taken office can build their movement here, but an outstanding crisis must still be resolved."
 PRU_meet_social_commitments:0 "Honour the Social Commitments"
 PRU_meet_social_commitments_desc:0 "Meet the promises made to workers and communities. Popular cooperation has a price: civil partners expect their own guarantees in return."
