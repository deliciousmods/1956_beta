 PRU_circle_title:0 "THE THREE CAUDILLOS"
 PRU_circle_replacement_tt:0 "Removing an incumbent costs legitimacy. An active ultimatum survives dismissal until the instigator is reconciled or their power is reduced. An aggressive caudillo must be below 45 power before they can be dismissed or replaced. Prison and exile also require less than 45 power."
 PRU_circle_project_help:0 "A personal project requires 30 power, costs 35 political power and usually takes 70 days. Only one may run at a time. Completion adds 15 trust and 10 power and fulfils outstanding demands. Dismissal cancels unfinished work."
 PRU_circle_empty_compact:0 "No collaborator\nNo office modifiers"
 PRU_circle_empty_dossier:0 "This seat is vacant. The government can appoint an available candidate. A political crisis can impose a popular intermediary."
