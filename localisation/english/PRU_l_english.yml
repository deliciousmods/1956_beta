 indigenous_recruiter:0 "Indigenous Recruiter"
 son_of_the_sun:0 "Son of the Sun"
 democratic_socialist:0 "Democratic Socialist"
 PRU_llama_army_tech:0 "Llama Army Tech"

 PRU_hugo_pesce:0 "Hugo Pesce"
 PRU_roberto_latorre_medina:0 "Roberto Latorre Medina"
 PRU_carlos_miro_quesasa_laos:0 "Carlos Miró-Quesada Laos"
 PRU_javier_luis_calmell_del_solar:0 "Javier Luis Calmell del Solar"
 PRU_francisco_lanatta:0 "Francisco Lanatta"
 PRU_hildebrando_castro_pozo:0 "Hildebrando Castro Pozo"
 PRU_jose_luis_bustamante_rivero:0 "José Luis Bustamante Rivero"
 PRU_alberto_arca_parro:0 "Alberto Arca Parró"

 PRU_czech_equipment_aquisition:0 "Order Czechoslovak Rifles"
 PRU_czech_equipment_aquisition_desc:0 "An order for a thousand Czechoslovak rifles will equip new formations and give our armourers a working relationship with the supplier of the LTP."
 PRU_andean_warfare:0 "Train for the Cordillera"
 PRU_andean_warfare_desc:0 "Between the coast and the highlands, even a short march can carry a column over a pass beyond the reach of its trucks. Our field manual will teach infantry to fight on the slopes and give mountain brigades a common training programme."

 PRU_paratrooper_company:0 "Paratrooper Company"
 PRU_paratrooper_company_desc:0 "We can create a parachute corps to support the ground troops by building a large fleet of aircraft."
 PRU_modernize_the_infantry_kit:0 "Modernize the Infantry Kit"
 PRU_modernize_the_infantry_kit_desc:0 "New war tactics developed throughout the world mean that we must update our knowledge of war tactics, which leads to acquiring modern equipment to leave behind our old arsenal left over from the Leticia war."
 PRU_jungle_training:0 "Create Ashaninka Army"
 PRU_jungle_training_desc:0 "For a long time, the Ashaninka people lived isolated in the Peruvian jungle, oblivious to all the affairs of central Peru. The rubber companies would discover these indigenous people, starting one of the largest known genocides in Peru. These jungle men will be useful for our operations. We need them now more than ever in our army."
 PRU_motorization:0 "Motorization"
 PRU_motorization_desc:0 "For a long time, our wartime resources were moved by mule or llama over the mountains of our rugged terrain, but with the construction of major highways, it might be time to start using trucks to move military assets."
 PRU_create_the_infantry_and_cavalry_schools:0 "Create the Infantry and Cavalry Schools"
 PRU_create_the_infantry_and_cavalry_schools_desc:0 "The cavalry is a vital resource for our army. Due to our rugged geography, we do not have many motorized vehicles; the horse and the mule have always been highly trusted by the Peruvian army, and the specialization of some commanders in war tactics with cavalry will guide us to victory."
 PRU_cold_weather_equipment:0 "Cold Weather Equipment"
 PRU_czech_tanks:0 "Purchase the LTP"
 PRU_czech_tanks_desc:0 "A first order of twenty-four light tanks will give our crews machines on which to train and our workshops a Czech design to study."
 PRU_study_the_blueprints:0 "Study the Blueprints"
 PRU_study_the_blueprints_desc:0 "With our own designs, we will succeed in creating and fortifying our national industry."
 PRU_foreign_licenses:0 "Foreign Licenses"
 PRU_foreign_licenses_desc:0 "With the new foreign weapons licenses, it will be possible to locally produce advanced weapons for our army."
 PRU_italian_guns:0 "Italian Guns"
 PRU_italian_guns_desc:0 "Order forty-eight field guns from Italy and send artillery officers to study their handling before the batteries enter service."
#  PRU_invite_italian_military_mission:0 "Invite Italian Military Mission"
 PRU_invite_soviet_military_mission:0 "Invite Soviet Military Mission"
 PRU_expand_the_national_arsenal:0 "Expand the National Arsenal"
 PRU_expand_the_national_arsenal_desc:0 "One of the main arms factories in Lima became obsolete and could not provide enough arms to decently arm our army. Expanding provinces with new military factories will satisfy this need for arms."
 PRU_new_weapons_new_tactics:0 "New Weapons, New Tactics"
 PRU_new_weapons_new_tactics_desc:0 "Our new weapons will help us adapt to the new tactics of war."

 #Focuses Shortcuts
 PRU_economy_shortcut: "Economy"
 PRU_land_army_shortcut: "Land Army"
 PRU_air_and_navy_shortcut: "Air and Navy"
 PRU_politics_non_monarchist_shortcut: "Politics: Non-Monarchist"
 PRU_politics_monarchist_shortcut: "Politics: Monarchist"
 #Industrial focuses
 PRU_industrial_modernization: "Industrial Modernization"
 PRU_industrial_modernization_desc:0 "The Great Depression put a strong toll on our economy in particular. An industrialialization program must be initiated to battle the aftermath of the crisis."
 PRU_diversify_steel_production: "Diversify Steel Production"
 PRU_diversify_steel_production_desc: "The steel industry is severly lacking local production capabilties and heavily relies on foreign imports. Home market will benefit greatly from the expansion of this vital sector."
 PRU_maranon_basin_model: "Maranon Basin Model"
 PRU_maranon_basin_model_desc: "Spectacular development of the Maranon River Basin will serve as a pinnacle of our transition into the model age of progress and technological development."
 PRU_strengthen_locomotive_industry: "Strengthen Locomotive Industry"
 PRU_strengthen_locomotive_industry_desc: "Within the scope of the modernization initiative, it is a strict necessity to continue the expansion of the national railway service for both civilian and commercial use."
 PRU_centralize_the_railway_network: "Centralize the Railway Network"
 PRU_centralize_the_railway_network_desc: "The current railway network operates as a disjoint regional system rathen than the unified grid, focusing on very localized connections. Such service is unsuitable for any large-scale supply movement of troops or supplies, we better do something about it."
 PRU_rely_on_international_trade: "Rely on International Trade"
 PRU_rely_on_international_trade_desc: "National reliance has proven to be insufficient in the battle against effects of the Great Depression. Opening our markets for trade should increase the liquidity and bring the capital into the country."
 PRU_enlarge_paita_seaport: "Enlarge Paita Seaport"
 PRU_enlarge_paita_seaport_desc: "Located in close proximity of the city of Piura, Paita serves as a logistical hub for exporting the agricultural and lumber products. Its modernization is a necessary measure to maintain the steady flow of goods."
 PRU_invite_foreign_experts:"Invite Foreign Experts"
 PRU_invite_foreign_experts_desc:"Country's mineral and industrial potential is not fully utilized. Inviting foreign experts to help us develop our resources will be a great step forwards towards battling the Great Depression."
 PRU_yearname_organic_law_of_education: "[GetYear] Organic Law of Education"
 PRU_yearname_organic_law_of_education_desc: "Introduction of the compulsory education for all ages is a necessary mean to ensure that our populace will not fall victim to foreign propaganda. Urban areas are encouraged to develop education focused on industrial sector while rural schools should be keen to teach agricultural practises."
 PRU_prioritize_self_sufficiency: "Prioritize Self-Sufficiency"
 PRU_prioritize_self_sufficiency_desc: "Foreign capital is a double-edged sword. While it can help us in the short term, it can also be a threat to our national sovereignty. We must prioritize self-sufficiency and develop our own industries to ensure long-term stability."
 PRU_talara_refinery_expansion: "Talara Refinery Expansion"
 PRU_talara_refinery_expansion_desc: "Having additional governmental funds and 20 years of technoligical advancements provide us with a unique opportunity to expand the extraction and procession of oil in the Talara Province."
 PRU_support_private_resource_ventures: "Support Private Resource Ventures"
 PRU_support_private_resource_ventures_desc: "Big number of enterpreneours are interested in investing in the country. We must support them to strengthen the national economy."
 PRU_construct_the_pan_american_highway: "Construct the Pan-American Highway"
 PRU_construct_the_pan_american_highway_desc: "The all-American initiative calls for establishing the highway along the entirety of the West Coast of the country, greatly boosting the foreign trade and local mobility of the population."
 PRU_finalize_transition_from_libra_to_sol_de_oro: "Finalize Transition from Libra to Sol de Oro"
 PRU_finalize_transition_from_libra_to_sol_de_oro_desc: "The six-year transition period of the Peruvian currency from the Libra to the Sol de Oro is coming to an end. The new currency will be a symbol of our economic independence and stability."
 PRU_finish_callahuanca_hydroelectric_plant: "Finish Callahuanca Hydroelectric Plant"
 PRU_finish_callahuanca_hydroelectric_plant_desc: "The hydroelectric plant will be located just 50 kilometers East of Lima. Commissioned in 1934, its construction has been delayed by the recent political instabilities. We better finnish this project in time."
 PRU_economic_centralization: "Economic Centralization"
 PRU_economic_centralization_desc: "Industralization can be vastly sped up if we only focus on the coastal enclaves with strong port infrastructure such as Lima and Piura. Improving the market connectivity will be a good deal in securing our trade partner's loyalty."
 PRU_end_the_lima_arequipa_rivalry: "End the Lima-Arequipa Rivalry"
 PRU_end_the_lima_arequipa_rivalry_desc: "Two largest cities of the country have been squabbling for too long. Our adiministration is ready to make substanial concessions to Arequipa in order to promote fair and square competition on the domestic market."
 PRU_bolster_the_timber_industry: "Bolster the Timber Industry"
 PRU_bolster_the_timber_industry_desc: "Lumber harvesting and processing industry experienced a significant growth in recent years and with a handful of governmental subsidies, it can expand into an even larger endeavour."
 PRU_settle_amazonian_frontier: "Settle Amazonian Frontier"
 PRU_settle_amazonian_frontier_desc: "Clearing lands for new settlements and encouraging immigration should bolster the prosperity of the neglected areas in the selva."
 PRU_subsidize_rubber_production: "Subsidize Rubber Production"
 PRU_subsidize_rubber_production_desc: "We have learned our lessons from the first rubber rush in the early 20th century. In order to prevent any further exploitation of the indigeneous people, we must fund a new government-controlled rubber company to oversee this decaying industry."
 PRU_expand_gold_and_silver_mining:0 "Expand Gold and Silver Mining"
 PRU_expand_gold_and_silver_mining_desc:0 "Our natural resources, such as gold and silver, will catapult our country to success. The available funds will greatlystrengthen the national currency."
 PRU_supplement_zinc_and_lead_concentrators: "Supplement Zinc and Lead Concentrators"
 PRU_supplement_zinc_and_lead_concentrators_desc: "Technological advancement in separation of pure metal components from waste rock have already vastly increased the output of our mines. Adding more concentrators to our mining complexes will allow us to spend even less resources on logistical needs."
 PRU_seize_foreign_businesses: "Seize Foreign Businesses"
 PRU_seize_foreign_businesses_desc: "British, German and American Companies have dominated the local economy for far too long. This exploitation must end immediately and the obtained wealth must be used to strengthen the national economy."
 PRU_foundation_for_the_urban_normal_school: "Foundation for the Urban Normal School"
 PRU_foundation_for_the_urban_normal_school_desc: "Establishing a national network of urban normal schools will improve education and training for our future teachers, ensuring a better-educated population and a stronger workforce."
 PRU_bring_education_to_the_countryside: "Bring Education to the Countryside"
 PRU_bring_education_to_the_countryside_desc: "The disease of illiteracy must be battled on all scales and new motivated teachers are encouraged to bring seeds of wisdom to the countryside."

 PRU_give_rights_to_indigenous_people:0 "Hear the Petitioners from the Sierra"
 PRU_give_rights_to_indigenous_people_desc:0 "The inhabitants of the Andes were always treated as slaves even when Peru became independent from the Spanish yoke; now, as a developing country, it is vitally important to secure their support."
 PRU_a_reborn_navy:0 "A Reborn Navy"
 PRU_a_reborn_navy_desc:0 "After the Pacific War in 1880, our Navy was constantly declining from one of the best trained in South America to one of the worst and most obsolete. This is our opportunity to see our Navy reborn."
 PRU_expand_the_naval_factory_of_bellavista:0 "Expand the Naval Factory in Bellavista"
 PRU_expand_the_naval_factory_of_bellavista_desc:0 "The Bellavista Naval Factory was always the national naval factory par excellence, but with the recent rebirth of our navy, it would be a good idea to start expanding our factory to the north and south of the country."
 PRU_work_with_foreigners:0 "Work with Foreigners"
 PRU_work_with_foreigners_desc:0 "Foreigners know about ships more than we do. We will work with them to grow our navy."
 PRU_National_Admiralty_Corps:0 "National Admiralty Corps"
 PRU_National_Admiralty_Corps_desc:0 "If we bring together the most brilliant minds in naval strategy in Peru, we can form a larger admiralty cabinet to make the decisions in a naval battle."
 PRU_naval_industry:0 "Naval Industry"
 PRU_naval_industry_desc:0 "Beyond the expansion of our naval industry, we must build larger shipyards to create a great national fleet."
 PRU_modernize_destroyers:0 "Modernize Destroyers"
 PRU_modernize_destroyers_desc:0 "Our newest destroyers are already obsolete, so starting a research program for new models is vital."
 PRU_Modernize_our_submarines:0 "Modernize Submarines"
 PRU_Modernize_our_submarines_desc:0 "Our newest submarines are already obsolete, so starting a research program for new models is vital."
 PRU_the_grau_class_project:0 "The Grau Class Project"
 PRU_the_grau_class_project_desc:0 "The Grau Class cruisers were the largest and most modern ships that the Peruvian Navy had since its fall in the Pacific War. Their battle capacity was such that the state wanted these ships to be used as a base for the massive creation of more Grau Class cruisers."
 PRU_expand_naval_production:0 "Expand Naval Production"
 PRU_expand_naval_production_desc:0 "We need more shipyards to expand our great navy."
 PRU_modernize_battleships:0 "Modernize Battleships"
 PRU_modernize_battleships_desc:0 "It is time to start the Lima Battleship project. We could never afford such a battleship due to internal economic problems. Now such a purchase can be allowed."
 PRU_modernize_carrier:0 "Modernize Carriers"
 PRU_modernize_carrier_desc:0 "It is time to start the Republica del Peru Carrier project. We could never afford such a battleship due to internal economic problems. Now such a purchase can be allowed."
 PRU_naval_doctrine:0 "Naval Doctrine"
 PRU_naval_doctrine_desc:0 "New ships, new naval doctrines."
 PRU_fly_with_the_sun:0 "Heroes of the Sun"
 PRU_fly_with_the_sun_desc:0 "The new recruits of the Peruvian air force since its creation in 1919 have received many talented recruits who achieved incredible things in the cockpit of a plane. It is time for these new pilots to show their country who owns the South American skies."
 PRU_start_aircraft_purchase:0 "Aircraft Purchases"
 PRU_start_aircraft_purchase_desc:0 "To add more planes to our air force, we must choose which foreign country we will request planes from."
 PRU_acquire_italian_planes:0 "Acquire Italian Planes"
 PRU_acquire_usa_planes:0 "Acquire [USA.GetAdjective] planes"
 PRU_acquire_usa_planes_desc:0 "Order eight fighters and eight ground-attack aircraft to train crews for air defence and close support."
 PRU_strengthen_the_air_force:0 "Strengthen the Air Force"
 PRU_strengthen_the_air_force_desc:0 "Our air force is disorganized, and our airfields are neglected. If we develop these aspects, our air force will be the most powerful in the region."
 PRU_work_with_our_designs:0 "The Faucett Workshops"
 PRU_work_with_our_designs_desc:0 "Civil aircraft already leave the Faucett workshops. Put their designers in touch with the CAP to study a light aircraft suited to our airfields."
 PRU_work_on_heavy_aircraft:0 "Work on Heavy Aircraft"
 PRU_work_on_heavy_aircraft_desc:0 "If we develop our heavy planes, we can be strong and hit the enemy without him noticing."
 PRU_work_on_light_aircraft:0 "Work on Light Aircraft"
 PRU_work_on_light_aircraft_desc:0 "If we develop our light aircraft, we can be fast and hunt down the enemy without him noticing."
 PRU_air_innovations:0 "Air Innovations"
 PRU_air_innovations_desc:0 "New planes, new tactics."
 PRU_total_production:0 "Transport Flights to the Interior"
 PRU_total_production_desc:0 "Assign three transports to the interior. Landing fuel, spare parts and personnel at isolated airstrips will teach crews to keep a route open with little ground support."
 PRU_heroes_of_the_air:0 "Heroes of the Air"
 PRU_heroes_of_the_air_desc:0 "The new knights of the Air, those who are lucky enough to fight for their country in their steel corsets."
 PRU_mediate_between_the_parties:0 "Mediate between the Parties"
 PRU_mediate_between_the_parties_desc:0 "Give the elected administration a working agreement. Its actual strength still depends on the people who can deliver cooperation outside the presidential palace."
 PRU_british_airports:0 "British Ground Crews at Limatambo"
 PRU_british_airports_desc:0 "Invite British technicians to help expand the airfield at Limatambo. Training the ground crews will matter as much as extending the runways."
 PRU_mobilize_womans:0 "Organise the Women's Auxiliary"
 PRU_mobilize_womans_desc:0 "The women of our country were always segregated from the political system, but now they will be included in politics, military and civil."
 PRU_leacy_of_Benavides:0 "Keep the Arsenals at Work"
 PRU_leacy_of_Benavides_desc:0 "We must continue the legacy of Benavides, a former Civilist Governor, by maintaining his works."
 PRU_Military_Universities:0 "Extend the Schools of Chorrillos"
 PRU_Military_Universities_desc:0 "The expansion of the educational system in Peru has helped the creation of new civil and military institutions. Among these, there is the idea of ​​creating a military university."
 PRU_give_asylum_to_the_jews:0 "Offer Refuge through Callao"
 PRU_give_asylum_to_the_jews_desc:0 "Several Jewish intellectuals are fleeing from Europe due to the current policies that are taken in the heart of it. The best thing would be to open our country to Jewish refugees to support the research effort."
 PRU_reforma_agraria:0 "Reforma Agraria"
 PRU_reforma_agraria_desc:0 "La tierra es de quien la trabaja."
 PRU_consolidate_borders:0 "One Muster for the Four Suyos"
 PRU_consolidate_borders_desc:0 "Each district now has an instructor and a calendar. Record its service obligations in the same book as its harvest exemptions. The reserves can travel light if the treasury keeps the tambos supplied."
 PRU_nationalize_banking_sector:0 "Apprentices at the Callao Maestranza"
 PRU_nationalize_banking_sector_desc:0 "A yard foreman asks why a provincial apprentice must spend years carrying tools before taking the fitter’s examination. Establish a common workshop test and send the first class into the yards."
 PRU_empower_benavides:0 "Empower Benavides"
 PRU_empower_benavides_desc:0 "The annulment of the election allows Benavides to remain in office. The officers gain reassurance, while the unresolved succession continues to shape politics."
 PRU_legacy_of_sachez_cerro:0 "The Legacy of Sánchez Cerro"
 PRU_legacy_of_sachez_cerro_desc:0 "With the returns proclaimed, Luis A. Flores leads the Unión Revolucionaria to the memorial for Sánchez Cerro. The provincial secretaries want to know whether the movement that won the ballot can also run a ministry."
 PRU_conservative_coalition:0 "Villarán's Constitutional Right"
 PRU_conservative_coalition_desc:0 "Villarán will assemble the constitutional right around the parliamentary benches. Its first test is whether to bargain with Aprista organisers or keep them outside government."
 PRU_social_democratic_coalition:0 "Eguiguren's Social Democratic Cabinet"
 PRU_social_democratic_coalition_desc:0 "Eguiguren needs parliamentary support beyond his own Social Democrats. Labour protections and the petitions of highland communities offer a programme around which to assemble it."
 PRU_alerta_en_la_frontera:0 "An Alert on the Front"
 PRU_alerta_en_la_frontera_desc:0 "The issue of disputed territories with Ecuador is vast. Since the times of the Spanish colony, the territories were never clear between the viceroyalty of Peru and the viceroyalty of New Granada. After independence, things did not improve between the Republic of Peru and the Republic of Gran Colombia. A clear border has not been delimited after many years. We believe the best way out would be to draw the border through war, although we could also resort to other more peaceful means."
 PRU_protest_against_the_cancellation:0 "The Streets Reject the Extension"
 PRU_protest_against_the_cancellation_desc:0 "The extension of the presidential mandate has brought demonstrators into the streets. The government can stand firm, or the opposition can seize the initiative."
 PRU_prolong_benavides_presidency:0 "Prolong the Benavides Presidency"
 PRU_prolong_benavides_presidency_desc:0 "Our country has prospered a lot under the government of Benavides. He should stay for a few more years."
 PRU_peruvian_blackshirts:0 "The Camisas Negras Answer to Lima"
 PRU_peruvian_blackshirts_desc:0 "The prefects refuse to accept orders from two men in the same town. Flores calls the provincial chiefs to Lima and makes them sign the party register before they go home."
 PRU_give_power_to_general_ureta:0 "The Officers Rally to Ureta"
 PRU_give_power_to_general_ureta_desc:0 "General Ureta, a fervent Urrista and nationalist, is fed up with the extremist policies of Alberto Flores. He plans to coup the party to be the leader of the Union Revolucionaria."
 PRU_integrate_the_church:0 "Parish Councils in the Provinces"
 PRU_integrate_the_church_desc:0 "The Catholic Church is a vital piece of the life of the entire Peruvian population."
 PRU_workers_protection:0 "Contracts for the Port Workers"
 PRU_workers_protection_desc:0 "The workers of our country demand labor reforms to perform better in the factories."
 PRU_remember_the_Trujillo_revolution:0 "Remember the Trujillo Revolution"
 PRU_remember_the_Trujillo_revolution_desc:0 "During the government of Sanchez Cerro in 1932 in the city of Trujillo, there was a large-scale uprising of militants from the APRA party where they managed to take the city entirely and threatened to make a march to Lima to take power. The government's response was harsh. The revolution was crushed with aerial bombardment and artillery, but the memory remains in the Aprista population."
 PRU_select_a_successor_for_benavides:0 "Designate an Heir at Government Palace"
 PRU_select_a_successor_for_benavides_desc:0 "Before the electoral boards report, Benavides can ask an officer to take responsibility for his cabinet and the succession."
 PRU_hispanism:0 "The Cabildos of Hispanic Peru"
 PRU_hispanism_desc:0 "Lima’s delegation brings parish teachers, master artisans and lawyers from the provincial cabildos. Flores promises them a place in a Hispanic republic whose officers and foremen will learn their trades in the same schools."
 PRU_tax_reform:0 "Reform the Treasury in Lima"
 PRU_tax_reform_desc:0 "Taxes are currently balanced for those with more money than the average citizen. It is time to reform this absurd system to make it fairer for everyone."
 PRU_left_and_right_united:0 "A Parliamentary Truce in Lima"
 PRU_left_and_right_united_desc:0 "If we want to get more power, we must unify forces between socialists, moderates, and conservatives. Together, we will achieve a better Peru."
 PRU_help_our_brothers:0 "Solidarity beyond the Andes"
 PRU_help_our_brothers_desc:0 "[ROOT.GetLeader] is considering sending some volunteers to support the socialist causes of the Spanish people."
 PRU_the_teachings_the_amauta:0 "The Teachings of the Amauta"
 PRU_the_teachings_the_amauta_desc:0 "A copy of Mariátegui's Seven Essays changes hands in a weaving shed in Vitarte. Another is read aloud after a land dispute in Cusco. Both audiences see a promise in his writing. Only one will give the new government its mandate."
 PRU_commit_to_democratic_election:0 "Commit to Democratic Elections"
 PRU_commit_to_democratic_election_desc:0 "The recent cancellation of the elections by Benavides had caused a strong popular rejection that would force the Dictator to promise democracy in the future."
 PRU_select_montagne_as_successor:0 "Montagne Forms His Cabinet"
 PRU_select_montagne_as_successor_desc:0 "Ernesto Montagne Markholz is a convinced Urrista, being this part of the Revolutionary Union party when Sanchez Cerro created it and was in his bases of nationalism. When the party fell into the hands of Luis Alberto Flores and began to resemble Italian fascism, Ernesto Montagne decided to leave the party and remain independent until he was called by Benavides to be his successor and continue with his government of reforms in [ROOT.GetNameDefCap]."
 PRU_unite_the_andes:0 "Unite the Andes"
 PRU_unite_the_andes_desc:0 "The betrayal committed by [BOL.GetNameDefCap] against [ROOT.GetNameDefCap] cannot be forgotten. We must unify all the Quechua peoples under the leadership of [ROOT.GetLeader] on our own."
 PRU_alliance_with_bolivia:0 "The Boatmen of Lake Titicaca"
 PRU_alliance_with_bolivia_desc:0 "At Puno the boatmen can name every landing they use on the Bolivian shore. Have the customs officers agree on cargo papers and landing fees while the lake is open to trade."
 andean_pact:0 "Andean Pact"
 PRU_place_odria_as_adviser:0 "Bring Odría into the Cabinet"
 PRU_place_odria_as_adviser_desc:0 "Instead of a government of Manuel Odria, a feasible option would be to place him as a political adviser for [ROOT.GetLeader] so that he could give him the advice to reform Peru and put it on the path of development."
 PRU_spanish_civil_war_involvement:0 "Passage from Callao to Cádiz"
 PRU_spanish_civil_war_involvement_desc:0 "Recruiting offices in the port have received letters from Spain asking for volunteers. The cabinet must authorise their passage while the civil war is still being fought."
 PRU_strengthen_the_national_industry:0 "A Market for Peruvian Manufactures"
 PRU_strengthen_the_national_industry_desc:0 "[ROOT.GetLeader] is looking for new national and international capital to strengthen our industry."
 PRU_nationalize_the_banking_sector:0 "Bring Lima Finance under Public Control"
 PRU_nationalize_the_banking_sector_desc:0 "[ROOT.GetLeader] has ordered the immediate nationalization of the banking sector in favor of the people."
 PRU_increase_social_spending:0 "Relief for the Barrios Obreros"
 PRU_increase_social_spending_desc:0 "The people demand an increase in social spending. We will fulfill the will of the people to earn their trust."
 PRU_exile_luis_alberto_flores:0 "Exile Luis Alberto Flores"
 PRU_exile_luis_alberto_flores_desc:0 "One of the greatest political agitators that Peru has is Luis Alberto Flores. We should exile him to Chile."
 PRU_reform_the_constitution:0 "Redraft the Charter in Lima"
 PRU_reform_the_constitution_desc:0 "The last constitution written by the former dictator Luis Miguel Sanchez Cerro is no longer valid for the current government. [ROOT.GetLeader] believes it should be reformed to make way for the creation of the new Peru."
 PRU_legacy_of_pachacutec:0 "The Varayocs Bring Their Staffs"
 PRU_legacy_of_pachacutec_desc:0 "The elected village authorities come to Cusco carrying their staffs of office. Let each present its land register and name the road or bridge it most needs repaired."
 PRU_hasta_quemar_el_ultimo_cartucho:0 "Four Dispatches at Torre Tagle"
 PRU_hasta_quemar_el_ultimo_cartucho_desc:0 "On the foreign minister’s desk lie dispatches for Tokyo and Berlin and a draft invitation to our American neighbours. From Arequipa comes a fourth envelope, bearing the signatures of officers who would put Odría in charge."
 PRU_celebration_of_the_andean_past:0 "The Provinces Gather in Cusco"
 PRU_celebration_of_the_andean_past_desc:0 "At the regional fair the districts compare harvest dates and choose the weeks their reservists can leave home. Publish the agreed calendar in Quechua and Spanish."
 PRU_industrial_cooperation:0 "Fitters at the Puno Railhead"
 PRU_industrial_cooperation_desc:0 "A broken winch can hold a cargo on the lake for days. Invite mechanics from both shores to the railhead at Puno and let the workshops share their spare parts lists."
 PRU_regain_the_new_spain_heritage:0 "Regain the New Spain Heritage"
 PRU_regain_the_new_spain_heritage_desc:0 " "
 PRU_secure_the_central_america:0 "Secure the Central America"
 PRU_secure_the_central_america_desc:0 " "
 PRU_alliance_with_mexico:0 "Bills of Lading for Veracruz"
 PRU_alliance_with_spain:0 "The Schoolmasters’ Passage to Callao"
 PRU_Support_the_banana_industry:0 "The Packing Sheds of Tumbes"
 PRU_Support_the_banana_industry_desc:0 "The growers of Tumbes lose cargo waiting for the coastal steamer. Back a packing shed and a regular collection day. The same merchants will carry machine parts on their return voyage."
 PRU_alliance_mexico_desc:0 "The ties that unite [ROOT.GetLeader] and [MEX.GetLeader] are more than a Hispanic past. They are more ideological ties."
 PRU_alliance_with_mexico_desc:0 "A commercial mission can find a return cargo for the Mexican run. Ask the consuls to settle the freight accounts without committing either cabinet to a military pact."
 PRU_expand_the_volunteer_program:0 "Recruit in the Departmental Capitals"
 PRU_expand_the_volunteer_program_desc:0 "The army requires more manpower. We can achieve a stronger army by using a broader volunteer law."
 PRU_national_investigation:0 "Fund the Laboratories of San Marcos"
 PRU_national_investigation_desc:0 "An agency specialized in investigating new resources in our land and reinforcing the investigation effort in our country would be a great advance."
 PRU_expand_the_military_industry:0 "Arm the Workers' Battalions"
 PRU_expand_the_military_industry_desc:0 "[ROOT.GetLeader] is looking for new national and international capital to strengthen our industry."
 PRU_expand_the_agricultural_sector:0 "Credit for the Coastal Valleys"
 PRU_expand_the_agricultural_sector_desc:0 "Our land is rich and can support diverse vegetables. Let's use these to feed our population and stop depending on foreign imports."
 PRU_crusade_against_radicalism_in_america:0 "Crusade Against Radicalism"
 PRU_crusade_against_radicalism_in_america_desc:0 "Fascism and communism are rapidly expanding throughout the South American region. It is our sacred duty to purge it of these evil ideologies."
 PRU_integrate_the_indigenous:0 "Integrate the Quechua People"
 PRU_integrate_the_indigenous_desc:0 "In the past, the indigenous Quechuas were deprived of rights and reduced to simple servitude to the country's oligarchs. It would be a good time to add the indigenous Quechuas to the country's industrial force since they can add much power to the political movement."
 PRU_Legion_Peruana:0 "The Colours of the Legión Peruana"
 PRU_Legion_Peruana_desc:0 "Bring the regimental colours to the capital. Each delegation will send a standard-bearer of its own when the army swears its oath to the elected government."
 PRU_inca_industry:0 "Reopen the Tambos of the Qhapaq Ñan"
 PRU_inca_industry_desc:0 "Storehouses along the old road can serve mule trains again. Pay the communities to repair the roofs, survey the passes and keep provisions ready between market days."
 PRU_research_cooperation:0 "Soundings on Lake Titicaca"
 PRU_research_cooperation_desc:0 "Take the lake pilots aboard with the surveyors. Their charts of the shoals and winter landings will guide traffic from both shores."
 PRU_neo_incaic_unification:0 "A Through Ticket from Puno to Guaqui"
 PRU_neo_incaic_unification_desc:0 "The stationmaster in Puno proposes one ticket for the train, the lake crossing and the onward journey from Guaqui. The customs offices can settle with each other at the end of the month."
 PRU_prepare_for_another_pacific_war:0 "Prepare for Another Pacific War"
 PRU_prepare_for_another_pacific_war_desc:0 "The Nacistas are taking time to gain power in Chile. Perhaps Peruvian weapons will manage to place a fascist in Chile."
 PRU_integrate_women:0 "Women in the Coastal Workshops"
 PRU_integrate_women_desc:0 "Women are the engine of our country. We must include them in the factories to increase the workforce."
 PRU_food_importation:0 "Grain Ships for Callao"
 PRU_food_importation_desc:0 "If the necessary amount of food cannot be produced in our country due to the rugged geography, then the best way out would be to buy food from other countries."
 PRU_arm_the_people:0 "Rifles for the Trujillo Committees"
 PRU_arm_the_people_desc:0 "The united [ROOT.getAdjective] people cannot be defeated. Their strength will make a great fist that will make the imperialist hordes fear."
 PRU_promote_the_military_industry:0 "Orders for the National Arsenals"
 PRU_promote_the_military_industry_desc:0 "[ROOT.GetLeader] is looking for new national and international capital to strengthen our industry."
 PRU_promote_the_national_industry:0 "Contracts for Peruvian Mills"
 PRU_promote_the_national_industry_desc:0 "[ROOT.GetLeader] is looking for new national and international capital to strengthen our industry."
 PRU_a_new_peru:0 "A Compact with the Provinces"
 PRU_a_new_peru_desc:0 "The new Peru represents a new political era, leaving behind the past of caudillos and revolutionaries."
 PRU_the_only_sun:0 "The Only Sun"
 PRU_the_only_sun_desc:0 "There is only one sun, and that sun is the one that shines and will shine for the Incas the sun god Inti."
 PRU_looking_north:0 "Looking North"
 PRU_looking_north_desc:0 "[ROOT.GetLeader] is not in favor of the policies taken by [COL.GetLeader] on the subject of the Amazonian trapeze and the city of Leticia, which still has Peruvian citizens. It is time to take Leticia by force."
 PRU_join_allies:0 "Bring Peru into the Allied Camp"
 PRU_join_allies_desc:0 "Our commercial allies call on us to end fascism in Europe."
 PRU_create_the_Lima_group:0 "Convene the American Republics in Lima"
 PRU_create_the_Lima_group_desc:0 "The Lima group should be born to remain neutral in the face of the events that plague Europe. Our continent should remain neutral to the war."
 lima_group:0 "Lima Group"
 PRU_follow_in_the_footsteps_of_tupac_amaru:0 "In the Footsteps of Tupac Amaru II"
 PRU_follow_in_the_footsteps_of_tupac_amaru_desc:0 "The legacy of the indigenous revolutionary Tupac Amaru II still lives in the heart and memory of several Quechua indigenous people, who rose up against the Spanish domination of the Inca empire in the past. Today the revolution evokes his name to unite the towns !Y no podran matarlo¡."
 PRU_benavides_is_dead:0 "The Transfer at the Legislative Palace"
 PRU_benavides_is_dead_desc:0 "The congressional chambers receive the president elected in June. A new ministry must win a hearing for its programme."
 PRU_wake_up_a_giant:0 "Rally the Departmental Capitals"
 PRU_wake_up_a_giant_desc:0 "The country that saw the birth of one of the most important cultures in South America before the colony, the one that saw the birth of one of the most powerful viceroyalties in America and then rested on its laurels for more than 100 years due to an unstable republic, it's time to wake up."
 PRU_riva_agueros_dream:0 "Riva Agueros Dream"
 PRU_riva_agueros_dream_desc:0 "Forming a unified and pacified homeland after several years of revolts and coups is the dream of the Catholic nationalist José de la Riva Agüero y Osma, who finally sees his dream come true at the hands of [ROOT.GetLeader]."
 PRU_hit_bolivia:0 "Finish off the Bolivians"
 PRU_hit_bolivia_desc:0 "The opinion that is held about the [BOL.getAdjective] people is very varied on the subject of [ROOT.getAdjective] politicians, in the past it was an ally of [ROOT.GetNameDefCap] along with its idea of reforming the country called 'Peru-Bolivia' that was very strong in the past, then [ROOT.GetNameDefCap] was betrayed by the [BOL.getAdjective] army during the Pacific War leaving this war without resistance."
 PRU_ask_for_enter_to_comintern:0 "Request Comintern Membership"
 PRU_ask_for_enter_to_comintern_desc:0 "After a long debate between the members of the [ROOT.GetCommunistParty], it was concluded that [ROOT.GetLeader] should ask to join the Comintern since the [SOV.GetNameDefCap] could help us develop our country and spread the revolution throughout South America."
 PRU_new_road_conscription_law:0 "Road Crews for the Sierra"
 PRU_new_road_conscription_law_desc:0 "Revive the old Road Conscription Law, our government proposes a renewed version with improved benefits for workers. This initiative seeks not only to improve our road infrastructure, but also to offer employment opportunities and contribute to the development of our roads and paths."
 PRU_protect_democratic_institutions:0 "Safeguard the Chambers in Lima"
 PRU_protect_democratic_institutions_desc:0 "This is a crucial period for our democracy, with [ROOT.GetLeader] leadership, we are committed to safeguarding transparency, accountability and citizen participation."
 PRU_workers_rights_act:0 "A Labour Compact for the Coast"
 PRU_workers_rights_act_desc:0 "In a clear commitment to the well-being of our workers, [ROOT.GetLeader] presents the Labor Rights Law. Designed to strengthen the position of workers, this legislation ensures fair working conditions, reasonable hours and the protection of their fundamental rights."
 PRU_god_country_and_family:0 "God, Country and Family"
 PRU_god_country_and_family_desc:0 "The search to consolidate conservative values, the 'God, Country and Family' initiative is proposed. Under the leadership of our conservative government, we are committed to strengthening the influence of faith, preserving patriotic principles, and protecting the family foundations that have been the foundation of our society."
 PRU_state_serves_the_people:0 "Open the Ministries to Petitioners"
 PRU_state_serves_the_people_desc:0 "We are committed to prioritizing the needs of the people. This initiative seeks to strengthen state intervention in crucial areas such as education, health and well-being, ensuring that the benefits of progress are accessible to all. United we move towards a Peru where the State works tirelessly to serve and raise the quality of life of each citizen."

 PRU_Eradicate_the_traitors:0 "Who Speaks for the Unión Revolucionaria?"
 PRU_Eradicate_the_traitors_desc:0 "At the party convention, one delegation lays the minutes of the old cabildos on the table. Another brings petitions signed by the ayllus. Both claim Sánchez Cerro’s movement as their own. Flores will have to give one delegation the floor."

 PRU_The_People_General:0 "The People's General"
 PRU_The_People_General_desc:0 "The provincial delegates have come back to Government Palace. Their towns supplied the volunteers who brought Ureta to Lima. Now they want to know who will pay the sergeants and whether their sons can serve together."

 PRU_Return_to_Negotiate_with_Caproni:0 "Caproni Fitters for Las Palmas"
 PRU_Return_to_Negotiate_with_Caproni_desc:0 "Rather than purchase another squadron outright, invite the Italian fitters to train apprentices at Las Palmas. The workshop wants its first order guaranteed by the treasury."

 PRU_adean_commissars:0 "Andean Commissars"
 PRU_adean_commissars_desc:0 "The new Andean Commissars will enforce the popular laws in the towns furthest from the main cities."
 PRU_the_great_peruvian_red_army:0 "A Red Army for the Andes"
 PRU_the_great_peruvian_red_army_desc:0 "The great red army of Peru made up of workers and peasants will liberate South America from the exploiters that dominate it, the united people will never be defeated."
 PRU_acquire_soviet_tanks:0 "Armour for the Andean Brigades"
 PRU_acquire_soviet_tanks_desc:0 "Our military power will be strengthened by the nascent [SOV.getAdjective] military industry, we will be the great fist of social justice in South America that will exercise its law through our great military power"
 PRU_acquire_soviet_plane_factories:0 "Soviet Aircraft for Las Palmas"
 PRU_acquire_soviet_plane_factories_desc:0 "[SOV.getAdjective] planes are strong and heavy. They are perfect for our air force."
 PRU_national_literacy_programs:0 "Reading Rooms in the Provinces"
 PRU_national_literacy_programs_desc:0 "The opening of new public universities in Lima and in the other cities of the country will give more people access to free higher education and train qualified people for the future of Peru."
 PRU_end_capitalism:0 "End Capitalism"
 PRU_end_capitalism_desc:0 "The American empire wants to expand to our country and end the government of [ROOT.GetLeader], it is time to unify all [ROOT.getAdjective] people to form a great fist that will strike the blow that ends the great giant of America, for the freedom of all [ROOT.getAdjective] people."
 PRU_unite_the_ecuadorian_proletariat:0 "Unite the Ecuadorian Proletariat"
 PRU_unite_the_ecuadorian_proletariat_desc:0 "The peasants of the coffee plants went on strike in Ecuador, after a long time of unimaginable abuses the dictator [ECU.GetLeader] decided to attack his own people, an intervention in Ecuador will ensure the will of the people"
 PRU_drive_out_the_banana_companies:0 "Drive out the Banana Companies"
 PRU_drive_out_the_banana_companies_desc:0 "After the so-called Banana Massacre in 1928, the [COL.getAdjective] people were very resentful of the United Fruit Company that continues to operate in the country. The [COL.getAdjective] people supported an intervention by the Aprista liberation army to expel those capitalists."
 PRU_union_with_the_pcv:0 "Union with the PCV"
 PRU_union_with_the_pcv_desc:0 "Our brothers in Venezuela are being oppressed by the dictator [VEN.GetLeader], his terror regime already counts several [VEN.getAdjective] deaths and thousands of people suffer the consequences of this, it is time to put an end to his government."
 PRU_collective_agriculture:0 "Cooperatives in the Sierra"
 PRU_collective_agriculture_desc:0 "After the peasants took control of the sugar plantations, they developed improved methods of producing goods. This has allowed us to better develop our sugar industry and send the surplus to our partners abroad."
 PRU_rallying_the_peasants:0 "Organise the Campesino Leagues"
 PRU_rallying_the_peasants_desc:0 "It is necessary for our industrialization that the peasant population be mobilized to the factories to triple the effectiveness of these, some of them do not know how to read or write, but with time they will adapt to this lifestyle."
 PRU_public_universities:0 "Provincial Chairs at San Marcos"
 PRU_public_universities_desc:0 "The opening of new public universities in Lima and in the other cities of the country will give more people access to free higher education and train qualified people for the future of Peru."
 PRU_Nationalize_the_brea_y_parinas:0 "Nationalize the Brea y Pariñas"
 PRU_Nationalize_the_brea_y_parinas_desc:0 "The issue of oil and La Brea y Pariñas is a problem that Peru has brought since 1914 after the signing of a very unfair contract for us that was tolerated by previous governments, it has just been discovered that the American company in charge of exploiting the oil does not pay all the quota that corresponds to it, the nationalization of these oil complexes and the expulsion of the North American owners will solve this problem."

 PRU_Sovereign_Industrial_Expansion:0 "The Chorrillos and Callao Examinations"
 PRU_Sovereign_Industrial_Expansion_desc:0 "The first provincial apprentices are ready to qualify. Let the instructors at Chorrillos and the masters at Callao recognise the same certificate, and pay the inspectors from the national budget."
 PRU_standard_oil_refinery_initiative:0 "The Talara Refinery Contracts"
 PRU_standard_oil_refinery_initiative_desc:0 "This initiative promotes the construction of refineries, incorporating advanced technologies to maximize efficiency and diversify our oil production. Guided by Standard Oil's experience, we seek not only to strengthen our oil infrastructure, but also to position Peru as a key player in the global energy scene."
 PRU_oil_infrastructure_expansion:0 "Pipelines from the Northern Fields"
 PRU_oil_infrastructure_expansion_desc:0 "With this expansion, we not only enhance our capacity to meet domestic demand, but also prepare ourselves to play a leading role in the global oil market."
 PRU_privatize_the_public_service:0 "Concessions for Public Utilities"
 PRU_privatize_the_public_service_desc:0 "We explore options to transfer certain public services into private hands, seeking to improve quality and efficiency in the provision of essential services. This strategy aims to unleash the potential of the private sector to contribute to progress and development."
 PRU_protect_our_businesses:0 "Protect the Coastal Trading Houses"
 PRU_protect_our_businesses_desc:0 "Faced with economic challenges and international competition, we implemented the 'Protect Our Businesses' strategy. Collaborating with Standard Oil, we strengthen measures to safeguard the integrity and competitiveness of our national companies. This initiative seeks to create a solid and resilient business environment."
 PRU_eliminate_the_competition:0 "Consolidate the Petroleum Concessions"
 PRU_eliminate_the_competition_desc:0 "We need to eradicate our competitors and opponents, we embark on decisive actions to ensure the economic supremacy of our companies. The goal is to remove obstacles and ensure our domestic industries thrive."
 PRU_expand_the_oil_industry:0 "Drill the Northern Oilfields"
 PRU_expand_the_oil_industry_desc:0 "Nuestra estrategia tiene como objetivo no solo fortalecer nuestra posición en el mercado mundial del petróleo, sino también impulsar el desarrollo económico y tecnológico. "
 PRU_create_the_national_education_fund:0 "The National Education Fund"
 PRU_create_the_national_education_fund_desc:0 "Establece el Fondo Nacional de Educación para mejorar la calidad educativa, invertir en infraestructuras, capacitar docentes y desarrollar programas innovadores, fortaleciendo así el sistema educativo."
 PRU_mandatory_social_security:0 "Insurance for Salaried Peruvians"
 PRU_mandatory_social_security_desc:0 "Introduce a mandatory Social Security system to guarantee protection and well-being, thus improving the quality of life of our citizens."
 PRU_the_empire_of_the_constitution:0 "The Empire of the Constitution"
 PRU_the_empire_of_the_constitution_desc:0 "With the 'Empire of the Constitution', focused on strengthening the rule of law and democracy. We seek to consolidate constitutional institutions, guaranteeing the separation of powers, the protection of individual rights and the promotion of transparent governance"
 PRU_the_new_oil_law:0 "The Petroleum Code"
 PRU_the_new_oil_law_desc:0 "It seeks to restructure policies related to the oil industry, promoting investment, efficiency and sustainability. The New Petroleum Law aims to enhance the economic development of the country through the responsible management of oil resources."
 PRU_oil_deal_with_the_united_states:0 "Negotiate the Talara Concessions"
 PRU_oil_deal_with_the_united_states_desc:0 "We seek to promote economic and strategic cooperation in the oil sector, promoting investments and advanced technologies. The Oil Agreement with the United States aims to strengthen bilateral relations, promote energy development and contribute to the economic growth of Peru."
 PRU_great_national_construction_program:0 "The Great School Units"
 PRU_great_national_construction_program_desc:0 "The ministry will bring classrooms, workshops and playing fields together in large secondary schools. The first contracts will go to the departmental capitals."
 PRU_womens_right_to_vote:0 "The Women of Peru Go to the Polls"
 PRU_womens_right_to_vote_desc:0 "We seek gender equality and full participation in the democratic process, recognizing and strengthening the fundamental role of women in society. By granting the right to vote, progress is made towards a more inclusive and equitable representation in political decision-making in Peru."
 PRU_a_new_military_doctrine:0 "The Chorrillos Staff Papers"
 PRU_a_new_military_doctrine_desc:0 "We seek to modernize our Armed Forces, taking advantage of the experience and lessons of our allies to ensure an efficient and prepared defense." 
 PRU_japanese_investment_in_the_naval_industry:0 "Japanese Orders for the Callao Yards"
 PRU_japanese_investment_in_the_naval_industry_desc:0 "This strategic collaboration involves the entry of Japanese investments into our naval sector, allowing us to modernize and expand our maritime capabilities. The goal is not only to ensure the effective defense of our coasts, but also to foster lasting cooperation with our Japanese allies."
 PRU_invite_japanese_naval_advisors:0 "Japanese Instructors at La Punta"
 PRU_invite_japanese_naval_advisors_desc:0 "Extendemos una cordial invitación a asesores navales japoneses para colaborar estrechamente con nuestras fuerzas navales.Este paso estratégico no solo refuerza nuestra defensa naval, sino que también fomenta una alianza duradera con Japón en el ámbito militar."
 PRU_German_investment_in_the_military_industry:0 "German Machine Tools for Lima"
 PRU_German_investment_in_the_military_industry_desc:0 "This strategic effort involves the entry of German investments into our military-industrial complex, allowing us to modernize and expand our capabilities. The goal is to not only strengthen our defense, but also foster a lasting partnership with our German allies."
 PRU_invite_german_military_advisors:0 "A German Mission to Chorrillos"
 PRU_invite_german_military_advisors_desc:0 "We seek to share advanced tactical, strategic and technological knowledge, thus improving our defensive capacity. This strategic step not only strengthens our military readiness, but also fosters a lasting alliance with Germany in the military sphere."
 PRU_expel_the_reds_from_america:0 "Expel the Reds from America"
 PRU_expel_the_reds_from_america_desc:0 "This strategy seeks to strengthen cooperation with our anti-communist allies to resist and expel red influence from our nations. Collaborating with other American nations, we commit to safeguarding stability and freedom on the continent."
 PRU_long_live_our_caudillo:0 "Long Live our Caudillo"
 PRU_long_live_our_caudillo_desc:0 "This initiative reaffirms our unwavering commitment to the strong and visionary leadership that our Caudillo embodies. We seek to consolidate his legacy, promote internal stability and strengthen national unity."
 PRU_The_new_South_american_axis:0 "A Lima Axis"
 PRU_The_new_South_american_axis_desc:0 "This ambitious strategy seeks to strengthen cooperation and unity among South American nations, promoting stability and joint development. Collaborating in areas of security, economy and diplomacy, we aspire to build a solid bloc that defends common interests and promotes prosperity throughout the region."
 PRU_american_fascist_union:0 "American Fascist Union" 
 PRU_american_fascist_union_desc:0 "We seek to consolidate a unified political front, promoting fascist principles to ensure stability and order in our nation. Under the leadership of this union, we seek to implement policies that strengthen the authority of the State, national unity and prosperity." 
 PRU_Create_the_Royal_Army:0 "Create the Royal Army"
 PRU_Create_the_Royal_Army_desc:0 "We seek the formation of a military force loyal to the Peruvian monarchy, thus guaranteeing the defense of our nation and the preservation of monarchical values."
 PRU_The_Soldier_King:0 "The Soldier King"
 PRU_The_Soldier_King_desc:0 "In an unprecedented act, our monarch takes an active role in military leadership as 'The Soldier King'. By inspiring the armed forces and spearheading military strategy, our monarch demonstrates his unwavering commitment to the security and defense of Peru. This approach will strengthen our military position and cement the image of the monarch as a brave and determined leader."
 PRU_Royal_Construction_Program:0 "Royal Construction Program"
 PRU_Royal_Construction_Program_desc:0 "This ambitious plan encompasses key projects that will boost economic development, infrastructure and technology in Peru. By investing in modernization, we will not only strengthen our global position, but also reaffirm the greatness of the Peruvian monarchy."
 PRU_Acquire_French_weapons:0 "Acquire French Weapons"
 PRU_Acquire_French_weapons_desc:0 "In search of strengthening our armed forces, we have decided to seek collaboration with France for the acquisition of advanced weapons. By incorporating French technology and equipment, we will strengthen our defenses and demonstrate our commitment to national security."
 PRU_sons_of_the_conquistador:0 "Sons of the Conquistador"
 PRU_sons_of_the_conquistador_desc:0 "In an effort to revitalize the spirit of our ancestors and honor the rich heritage of the conquistadors. Recognizing the bravery and audacity of conquerors, we aspire to forge a future full of greatness and achievement."
 PRU_defend_our_empire:0 "Defend our Empire"
 PRU_defend_our_empire_desc:0 "In an increasingly uncertain world, it is our duty to protect and preserve our beloved empire. By uniting in the defense of our empire, we will guarantee the security of our borders and the future of the Peruvian monarchy."
 PRU_Receive_refugees_from_the_Spanish_civil_war:0 "Receive Refugees From Spain"
 PRU_Receive_refugees_from_the_Spanish_civil_war_desc:0 "Faced with the devastation of the civil war in Spain, we have decided to open our doors to refugees seeking safety and a new home. By welcoming refugees, we not only extend Peru's helping hand, but we also strengthen our communities with talent and diversity."
 PRU_create_the_united_kingdom_of_spain:0 "Create the United Kingdom of Spain"
 PRU_all_spanish_cores_controlled_by_self_or_puppet_tt:0 "All Spanish cores are controlled by either [ROOT.GetNameDef] or any of its subjects."

 PRU_Bring_the_revolution_to_all_America:0 "Bring the Revolution to All of America"
 PRU_Bring_the_revolution_to_all_America_desc:0 "The revolutionary feeling is going to be felt throughout Latin America, after many years serving the interests of big capital and the great American devil, it is time to rise up and break their chains."
 PRU_radicalize_the_pcp:0 "The PCP Calls Its Congress"
 PRU_radicalize_the_pcp_desc:0 "Since its foundation, the Peruvian Communist Party (PCP) needed Soviet communist doctrines for its development, but in reality, what else could be achieved if it continued to be linked to the socialist figure of Mariategui, the Peruvian thinker who devised a formula different from Soviet socialism. less authoritarian, the best option to put this thought aside is to radicalize the party in order to erase all ideology contrary to Soviet dogma."
 PRU_revolutionary_vanguard:0 "Revolutionary Vanguard"
 PRU_revolutionary_vanguard_desc:0 "The Vanguardia Revolucionaria (VR) was a Peruvian Marxist political party founded in 1935. After its foundation, it became an important reference point for the Peruvian left and has been one of the basic trunks from which various socialist organizations originated."
 PRU_give_power_to_cgtp:0 "Seat the CGTP at the Cabinet Table"
 PRU_give_power_to_cgtp_desc:0 "The General Confederation of Workers of Peru is a Peruvian trade union center of Mariateguista ideology with headquarters in Lima. It was founded in 1929 by José Carlos Mariátegui and is oriented under the guidelines of the class struggle. The motto of the CGTP is 'For proletarian unity' and its official newspaper is Labor."
 PRU_request_soviet_support:0 "A Delegation from Lima to Moscow"
 PRU_request_soviet_support_desc:0 "The recent trip that Ravines made to the Soviet Union in 1930 managed to strengthen relations between the Soviets and Peruvians, the Moscow plan agreed with Ravines was fulfilled since Peru was under a communist mandate, but substantial monetary and support was needed. military by the Soviets so that this communist regime can last and progress expanding to the other corners of South America."
 PRU_soviet_support:0 "[SOV.GetAdjective] Support"
 PRU_the_peruvian_five_year_plan:0 "Draw Up the Plan in Lima"
 PRU_the_peruvian_five_year_plan_desc:0 "The five year plan used in the Soviet Union would have turned this country from a rural country to a fully industrialized country, since its foundation in 1821 Peru was always a rural and mainly mining country and did not produce any good since it did not have an industry established nation, the small effort that the Peruvian people will have to make will be well rewarded with an industrialized nation."
 PRU_exile_haya_de_la_torre:0 "Exile Haya de la Torre"
 PRU_exile_haya_de_la_torre_desc:0 "Víctor Raúl Haya de la Torre is one of the greatest political agitators in Peru, since the founding of APRA they have always been a problem for the stability of Peru. The words of Víctor Raúl Haya de la Torre mobilize indigenous people, peasants and the impoverished middle class who want a change, the best thing would be to exile him to Mexico."
 PRU_the_memory_of_benavides:0 "The President Faces Congress"
 PRU_the_memory_of_benavides_desc:0 "Bustamante must bargain with the parties that brought him to power. A victorious Ureta instead draws his cabinet closer to the officer corps."
 PRU_Recovering_from_the_civil_war:0 "Manuel Prado Takes the Oath"
 PRU_Recovering_from_the_civil_war_desc:0 "Manuel Prado must hold together the coalition that carried him to office. The ministries can now turn from the succession to credit, production and public contracts."
 PRU_peruvian_military_youth:0 "Bring the Prefects to Lima"
 PRU_peruvian_military_youth_desc:0 "Summon the departmental prefects to settle disputes over local appointments before the presidential succession."
 PRU_the_victory_of_our_caudillo:0 "The Caudillo Addresses the Plaza"
 PRU_the_victory_of_our_caudillo_desc:0 "Caudillo is a term used to refer to a leader, be it political, military or ideological. Although in a broad sense this term is used for anyone who guides others in any field, usage has given the word caudillo a certain political connotation. The military leader who governs Peru today has managed to defeat all his political rivals and rise as the most powerful leader in the country."
 PRU_liberate_all_cab:0 "Bring the Revolution to the Caribbean"
 PRU_liberate_all_cab_desc:0 "The great American demon expanded its tentacles beyond its borders, placing its flag on the island of Puerto Rico and the Dominican Republic. The sacred duty of all the peoples of South America is to join forces to expel the malevolent forces of Uncle Sam from Latin America."
 PRU_develop_the_provinces:0 "Pan-Incaism"
 PRU_develop_the_provinces_desc:0 "The radiance of Inca greatness must illuminate our path to the future. This cultural rebirth will strengthen our sense of national identity and we will be able to add indigenous people who were formerly members of the Inca empire to our cause. May the spirit of the Inca Empire guide our path to greatness!"
 PRU_legacy_of_the_war_with_ecuador:0 "Legacy of the War with Ecuador"
 PRU_legacy_of_the_war_with_ecuador_desc:0 "To achieve total victory, [ROOT.GetLeader] must totally secure the Andes, being the Republic of [ECU.GetNameDefCap] still a threat that will constantly bite our country's boot if we don't eliminate them."
 PRU_american_naval_doctrine:0 "American Instructors at La Punta"
 PRU_american_naval_doctrine_desc:0 "The [USA.getAdjective] naval doctrine will help the revival of our obsolete navy, our naval tactics of the last century will not serve in a major conflict and our best option is to collaborate with this naval power."
 PRU_recover_from_the_economic_crisis:0 "Credit for the Lima Workshops"
 PRU_recover_from_the_economic_crisis_desc:0 "After the great depression of 1929 and the sad death of the military leader Luis Sánchez Cerro, Peru fell into a serious economic crisis that made its development seriously impossible, but if the few existing mining resources and those yet to be discovered are used correctly, it could be built. a solid economy."
 PRU_freedom_defenders:0 "Jorge Prado's National Front"
 PRU_freedom_defenders_desc:0 "Jorge Prado brings the National Front into government. Provincial notables and commercial interests expect their representatives to have a voice in Lima."
 PRU_include_llamas_in_the_army:0 "Pack Trains for the Puna"
 PRU_include_llamas_in_the_army_desc:0 "Beyond the motor roads, a pack train can keep an infantry column moving. Recruit local handlers who know the grazing grounds and high passes."
 PRU_german_aeronautic_cooperation:0 "German Instructors at Las Palmas"
 PRU_german_aeronautic_cooperation_desc:0 "[GER.getAdjective] planes are strong and heavy. They are perfect for our air force."
 PRU_japanece_naval_doctrine:0 "Japanese Lessons for the Mar de Grau"
 PRU_japanece_naval_doctrine_desc:0 "The [JAP.getAdjective] naval doctrine will help the revival of our obsolete navy, our naval tactics of the last century will not serve in a major conflict and our best option is to collaborate with this naval power."
 PRU_contact_pedro:0 "Support Pedro's Claim"
 PRU_contact_pedro_desc:0 "Pedro Enrique de Orleans-Braganza, nicknamed 'the Expected Prince', was a descendant of the Brazilian imperial family and a pretender to the throne of Brazil from 1921 until his death in July 1981. He succeeded his grandmother, Princess Isabel, at the head of the Imperial House of Brazil in November 1921, with the support of the monarchists and his uncle, Prince Pedro de Alcántara of Orleans-Braganza. He was first cousin of Princess María de las Mercedes, Countess of Barcelona, therefore, first cousin of King Juan Carlos I and first cousin and great-grandfather of King Felipe VI of Spain."
 PRU_restore_the_empire:0 "Restore the Empire"
 PRU_restore_the_empire_desc:0 "The former Empire of Brazil that, hand in hand with its monarchs, managed to become a regional power, our Rey has decided that it is a national duty to support the supporters of Pedro Enrique, the only ruler of all Brazilians."
 PRU_control_the_economy:0 "The Estimates Come to Palacio"
 PRU_control_the_economy_desc:0 "The provincial registers and the guild accounts give the Treasury two very different pictures of national service. Flores must now put a figure beside the promises his government has made."
 PRU_open_universities_to_indigenous_people:0 "A Quechua Chair at San Antonio Abad"
 PRU_open_universities_to_indigenous_people_desc:0 "The delegates have promised district schools. A teaching chair in Cusco can prepare the first instructors and print the readers they will carry back to the provinces."
 PRU_reject_international_ideologies:0 "Reject International Ideologies"
 PRU_reject_international_ideologies_desc:0 "International ideologies such as communism and fascism have flooded the peasant population and middle class of Peru, these radical ideologies detach people from the Inca roots where they come from and make them sympathize with foreign powers alien to our national reality, the prohibition of these ideologies will avoid a possible revolution in the future against the Inca legacy."
 PRU_organize_protests_in_the_south:0 "Organize the Indigenous People of the South"
 PRU_organize_protests_in_the_south_desc:0 "The mobilization of indigenous Quechuas in the main squares of Cuzco, Arequipa and Puno could put the central government on alert about a possible revolution, but it could also paralyze these southern areas of the country, depriving the capital of metals and food that are produced in the area."
 PRU_convince_the_high_command:0 "Convince the High Command"
 PRU_convince_the_high_command_desc:0 "Among the members of the Military Junta there are important military heads who sympathize with the idea of reforming the incanato, their influence is such that if they were able to talk with them, an agreement could be reached to have their support in the event of a possible revolution."
 PRU_monumental_architecture:0 "Monumental Arquitecture"
 PRU_monumental_architecture_desc:0 "The architecture developed in the Inca period is characterized by the accuracy of its forms, its solidity, its symmetry and by seeking that its constructions harmonize the landscape. Unlike coastal societies such as the Chimú, the Incas used quite creative decoration. The main material used was stone, in the simplest constructions it was placed without carving, but not in the most complex and important ones. The Inca builders developed techniques to build enormous walls, true mosaics made up of blocks of carved stone that fit perfectly, without even a pin being able to pass between them."
 PRU_the_march_of_the_four_suyos:0 "The March of the Four Suyos"
 PRU_the_march_of_the_four_suyos_desc:0 "The indigenous people from all parts of Peru have just met to launch the coup against the central government, the peoples of the four suyos meet for a common cause that would be the restoration of the Inca empire."
 PRU_look_to_the_past_2:0 "Look to the Past"
 PRU_look_to_the_past_2_desc:0 "The splendid past of the viceregal era of Peru is still alive in the memory of the majority of Peruvians who, tired of the republican system, want an immediate change. For a long time the Peruvian republican system only served to cause disunity and corruption within the heart of the Peruvian parliament and its state tentacles, the memory of the past full of wealth and splendor fans the flame of revolution in the people."
 PRU_Convince_supporters_of_Flores:0 "Convince Supporters of Flores"
 PRU_Convince_supporters_of_Flores_desc:0 "It is known from a very good source that members of the Union Revolucionario party close to Luis Alberto Flores have ideals of monarchical governments. Flores, being a deeply rooted nationalist, causes the disappointment of his more conservative followers and monarchs who decide to gradually join the protests caused to put a king at the head of Peru."
 PRU_secure_the_northern_road_network:0 "Secure the Northern Road Network"
 PRU_secure_the_northern_road_network_desc:0 "The various infrastructure networks that link the north with the capital of Peru are of very strategic value. If these networks were cut, the central government of Peru would be left without oil or rubber, which comes mostly from northern Peru. This would make the central government see that the demands of the people to impose a monarchical government would be extremely serious."
 PRU_Support_the_Catholic_Church:0 "Support the Catholic Church"
 PRU_Support_the_Catholic_Church_desc:0 "The Peruvian Constitution recognizes the valuable contribution that the Catholic religion had to the formation of the Peruvian nation, but although the Catholic religion is the majority, Peru ceased to be a confessional State, recognizing religious freedom. Even the way in which the Catholic religion is practiced in Peru is diverse, the so-called 'popular religion' is born from the religious syncretism of the Catholic religion and pre-Hispanic practices."
 PRU_organize_marches_in_the_north:0 "Organize Marches in the North"
 PRU_organize_marches_in_the_north_desc:0 "The northern cities of Peru always had a majority of Hispanic and mestizo people, the organization of these people in the main squares of Trujillo, Piura, Lima and Tumbes could exert pressure on the central government. It is possible that the protests escalate to a level of violence becoming a true revolution."

 alliance_for_the_american_revolution:0 "Alliance for the American Revolution"
 PRU_revolucion_restauradora:0 "The Arequipa Pronunciamiento"
 PRU_revolucion_restauradora_desc:0 "Odría asks the Arequipa garrison to recognise a military junta. Under Bustamante the confrontation comes in October 1948. Under Flores the dispatch can arrive as soon as his cabinet has to choose Peru's course abroad."
 PRU_trans_pacific_alliance:0 "From Callao Roads to Tokyo Bay"
 PRU_trans_pacific_alliance_desc:0 "Torre Tagle will instruct its minister in Tokyo to seek admission to Japan's faction. The naval staff at La Punta wants an agreement signed before it sends instructors across the Pacific."
 PRU_join_axis:0 "Torre Tagle Cables Berlin"
 PRU_join_axis_desc:0 "The minister in Berlin has asked for written instructions. Authorise him to request a place in Germany's alliance and negotiate the military exchanges that would follow."
 PRU_inti_raymi:0 "An American Pact at Inti Raymi"
 PRU_inti_raymi_desc:0 "Set a place for the neighbouring republics at the festival in Cusco. Peru will host the headquarters and issue its own invitations. The first signatures will decide how far the new alliance reaches beyond the Andes."
 PRU_flores_four_dispatches_tt:0 "Choose a course for Peru: seek admission to Japan's or Germany's faction, lead an American pact at Inti Raymi, or let Odría take power in Arequipa."
 peru.399.t:0 "The Prefects Present Their Accounts"
 peru.399.d.ayllus:0 "A prefect sets a district roll on the cabinet table. Fourteen hundred reservists can report after the harvest if the treasury advances their travel money. The finance minister has already promised the Chamber a balanced appropriation."
 peru.399.d.cabildos:0 "The Callao masters have trained a class of fitters but have no money for their first sets of tools. Chorrillos offers to take the class together if the cabinet releases an advance. The finance minister taps the spending ceiling pencilled in the margin."
 peru.399.a:0 "Pay the reservists' fares after the harvest."
 peru.399.b:0 "Buy the tools and take the whole class."
 peru.399.c:0 "Keep the appropriation the Chamber approved."
 PRU_flores_cabildo_schools:0 "The Cabildo Schools"
 PRU_flores_cabildo_schools_desc:0 "Municipal schools supply trained instructors to the army. The treasury pays their salaries between intakes."
 PRU_flores_chartered_cadres:0 "The Chartered Cadres of Chorrillos"
 PRU_flores_chartered_cadres_desc:0 "Officers and workshop masters recognise a common certificate. Recruits spend less time in elementary instruction, though the inspections draw on the civilian budget."
 PRU_flores_provincial_levies:0 "The Provincial Muster of Tawantinsuyu"
 PRU_flores_provincial_levies_desc:0 "The ayllus register men by district and season. Surveyors and labourers are released from public works to prepare the rolls."
 PRU_flores_four_suyos_reserves:0 "Reserves of the Four Suyos"
 PRU_flores_four_suyos_reserves_desc:0 "The districts maintain reserves and provision them at the tambos along the old roads. Every team assigned to the depots spends less time on civilian construction."
 runasimi_union:0 "Runasimi Union"
 PRU_legacy_of_guayaquil_treaty:0 "Legacy of Guayaquil Treaty"
 PRU_legacy_of_guayaquil_treaty_desc:0 "Our Northern border shall be reinforced if any of so-called former Bolivarian states are willing to invoke the Uti possidetis juris principle and attempt to reinforce their claims on regions of Loreto and Pastaza!"
 PRU_hispanic_union:0 "The Guild Charters of Lima"
 PRU_hispanic_union_desc:0 "Printers, metalworkers and shipwrights send their masters to the municipal hall. The government will recognise their apprenticeship certificates if the guilds admit provincial students."
 union_hispanica:0 "Union Hispanica"
 PRU_attack_japan:0 "Attack Japan"
 PRU_attack_japan_desc:0 "As agreed with our new Allies [ENG.GetNameDefCap] and [USA.GetNameDefCap] we must attack [JAP.GetNameDefCap] as soon as possible and end their reign of terror in Asia once and for all."
 PRU_attack_germany:0 "Attack Germany"
 PRU_attack_germany_desc:0 "As agreed with our new Allies [ENG.GetNameDefCap] and [USA.GetNameDefCap] we must attack [GER.GetNameDefCap] as soon as possible and end their reign of terror in Europe once and for all."
 PRU_hit_argentina:0 "Kill the Giant of the South"
 PRU_hit_argentina_desc:0 "The country of our liberator San Martin, the most prosperous and richest country in South America today must fall to make way for the new South American power."
 PRU_hit_chile:0 "Revenge War"
 PRU_hit_chile_desc:0 "After the war of the Pacific, our army and navy were completely defeated, with a thirst for revenge that they kept since that defeat, the new generations grew up in an atmosphere of nationalism and revengeful feelings that are fueled by the leader [ROOT.GetLeader], the moment of revenge to recover our lost territory is coming soon."
 PRU_ochenio_de_Odria:0 "The Ochenio of Manuel Odría"
 PRU_ochenio_de_Odria_desc:0 "Manuel Odria was always a visionary, since before assuming a public position in politics he had the idea of completely modernizing the country by creating neighborhood units, school units and the great Empleado hospital, the great highways that would unite all corners of the country. To take modernity to the last furthest point."
 PRU_hit_colombia:0 "Northern Expansion"
 PRU_hit_colombia_desc:0 "After the brief war between Leticia and [COL.GetNameDefCap] and having given up the Amazonian trapeze thanks to the anti patriotism of Oscar Benavides, the time has come to recover our territory under the command of our leader [ROOT.GetLeader], who will lead Peru to a great victory to restore our original borders."
 PRU_the_final_march:0 "The Final March"
 PRU_the_final_march_desc:0 "The American empire wants to expand to our country and end the government of [ROOT.GetLeader], it is time to unify all [ROOT.getAdjective] people to form a great fist that will strike the blow that ends the great giant of America, for the freedom of all [ROOT.getAdjective] people."
 PRU_la_legion_peruana:0 "La Legion Peruana"
 PRU_la_legion_peruana_desc:0 "We must strengthen our army by bringing back La Legion Peruana, the old elite corps used in difficult times in [PRU.GetNameDefCap], but we will use Quechua people to form it this time."
 PRU_incaism:0 "Under the Chakana of the Four Suyos"
 PRU_incaism_desc:0 "The delegates from Cusco ask whose country the party means when it speaks of the nation. Flores accepts their standard and proclaims Tawantinsuyu before the assembly. In return, its provincial councils will help raise the reserves."
 PRU_integrate_women1:0 "Integrate Women"
 PRU_integrate_women1_desc:0 "Peruvian women are the base pillar of our economy and our traditional family life; their inclusion in the factories will give greater effectiveness in our nascent industry."
 PRU_oil_republic:0 "Oil Republic"
 PRU_oil_republic_1:0 "Oil Republic"
 PRU_new_peru_1:0 "New Peru"
 PRU_new_peru_1_desc:0 "After an era of corrupt rulers and oligarchs, it is time for [PRU.GetNameDefCap] to enter a new era, evolving its policies and renewing its political class."
 PRU_riva_agueros:0 "Riva Aguero Dream"
 PRU_riva_agueros_desc:0 "The Catholic ideologue José de la Riva Agüero y Osma had made known his desire to create a Peruvian nationalism without reaching the extremism of the fascists; today, his dream has come true."
 PRU_agricultural:0 "Agricultural Reform"
 PRU_agricultural_desc:0 "Our agriculture, rich in various foods, has always been one of the great thrusts of our country; the recent development of this sector will help the development of all social classes in [PRU.GetNameDefCap]."
 PRU_revolucion:0 "Restorative Conservative Revolution"
 PRU_revolucion_desc:0 "General Odria, the hero of Panupali's combat with his Union Nacional Odrista (UNO) party, will lead us to the victory and development that our country needs."
 PRU_wake_up:0 "Wake Up a Giant"
 PRU_wake_up_desc:0 "A great country rises; with the will and faith of the people who occupy it, it will impose its will on its neighbors."
 PRU_wake_up_fascism:0 "Wake Up a Giant"
 PRU_wake_up_fascism_desc:0 "A great country rises; with the will and faith of the people who occupy it, it will impose its will on its neighbors."
 PRU_inti:0 "Inti Legacy"
 PRU_inti_1:0 "Inti Legacy"
 PRU_inti_2:0 "Inti Legacy"
 PRU_inti_desc:0 "The union of all the indigenous Quechuas of all the South American countries will create a new army that will support us to victory."
 PRU_nationalizex_the_banking_sector:0 "Nationalized Banks"
 PRU_nightmare:0 "Revolution in Progress"
 PRU_nightmare_desc:0 "The nightmare of [PRU.getLeader] today is the will of the people, since they cannot achieve the social reforms required for the people."
 PRU_rights_to_indigenous_people:0 "Rights to Indigenous People"
 PRU_social_spending:0 "Increased Social Spending"
 PRU_arm_people:0 "Arm People"
 PRU_women_in_the_army:0 "Women in the Army"
 PRU_peru_falangism:0 "Hispanism"
 PRU_peru_falangism_1:0 "Hispanic Pride"
 PRU_flores_influence:0 "Flores's Influence"
 PRU_flores_influence_1:0 "Caudillo Flores"
 PRU_flores_influence_2:0 "Caudillo Flores"
 PRU_ureta_influence:0 "Ureta's Influence"
 PRU_ureta_influence_1:0 "Caudillo Ureta"
 PRU_ureta_influence_2:0 "Caudillo Ureta"
 PRU_montagne_influence:0 "Montagne's Influence"
 PRU_odria_advisor:0 "Odria's Influence"
 PRU_friend_aprac:0 "Befriend the Apristas"
 PRU_friend_aprac_desc:0 "To gain stability in the nation, it is vital to get the support of the APRA party."
 PRU_military_revolution:0 "Military Revolution"
 PRU_military_revolution_desc:0 "The Gobierno Revolucionario De Las Fuerzas Armadas proclaims a more Peruvian nationalism unattached to European fascist doctrines; we will move forward with our own nationalism."
 PRU_aprismo:0 "Aprismo"
 PRU_Increase_in_Crops:0 "Increase in Crops"
 PRU_defeated_navy:0 "Neglected Navy"
 PRU_defeated_navy_desc:0 "The ships are from the previous century and outdate, and our naval doctrine is obsolete. Nor is there currently the will to fix it."
 PRU_great_marina:0 "The Rebirth of Our Navy"
 PRU_apra_revolution:0 "Subversive Sentiment"
 PRU_apra_revolution_desc:0 "The Apristas are causing destruction with subversive movements"
 PRU_friend_apra:0 "Be Friends with the Apristas"
 PRU_friend_apra_desc:0 "To gain stability in the nation it is very necessary to get the support of the APRA party."
 PRU_oppresed_apristas:0 "Oppressed Apristas"
 PRU_oppresed_apristas_desc:0 "We do not need the radical Apristas to strengthen the nation, their leaders are in jail and their movement is in danger of disappearing."
 PRU_oppresed_urristas:0 "Oppressed Urristas"
 PRU_oppresed_urristas_desc:0 "We do not need the radical Urristas to strengthen the nation, their leaders are in jail and their movement is in danger of disappearing."
 PRU_ideological_agents:0 "Ideological Agents"
