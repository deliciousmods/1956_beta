 PRU_dismiss_command_decision_desc:0 "$PRU_circle_replacement_tt$\n\nDismissal costs §Y30 political power§! and leaves this office vacant for §Y30 days§!."
 PRU_settle_cabinet:0 "Negotiate with the Cabinet Office"
