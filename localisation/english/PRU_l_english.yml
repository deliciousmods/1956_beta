 PRU_electoral_mobilisation_desc:0 "A contested campaign draws the public back into politics, but tensions between rival organisations are rising."
 PRU_enlist_ramirez:0 "Appoint Rodríguez Ramírez to Military Command"
 PRU_enlist_ramirez_desc:0 "$PRU_circle_dossier_ramirez$\n\nAppointment: §Y45 political power§!, §R8 legitimacy§! and a §Y90-day§! office cooldown. An occupied office also incurs the replacement consequences above."
 PRU_project_ramirez:0 "Inspect the Provincial Garrisons"
 PRU_project_ramirez_desc:0 "An initiative sponsored by $PRU_circle_name_ramirez$. $PRU_circle_project_help$"
 PRU_build_network_ramirez:0 "Strengthen the Network of $PRU_circle_name_ramirez$"
 PRU_build_network_ramirez_desc:0 "Organise supporters for 45 days: +10 personal influence and +5 trust, at a cost of 3 government legitimacy. Stronger partners can deliver political agreements, but a powerful opponent is more dangerous."
 PRU_demand_ramirez:0 "The Demands of $PRU_circle_name_ramirez$"
 PRU_demand_ramirez_desc:0 "Rodríguez Ramírez wants the provincial commands funded and consulted. An unmet deadline costs 20 trust and adds 10 power."
 PRU_concede_ramirez:0 "Meet the Demands of $PRU_circle_name_ramirez$"
 PRU_concede_ramirez_desc:0 "Fund the provincial commands. Rodríguez gains 15 trust and 5 power. The Army gains influence, while civil partners lose 5 trust."
 PRU_discredit_ramirez:0 "Discredit $PRU_circle_name_ramirez$"
 PRU_discredit_ramirez_desc:0 "Reduce their power by 20 and their trust by 15. The public dispute costs 1% stability."
 PRU_exile_ramirez:0 "Exile $PRU_circle_name_ramirez$"
 PRU_exile_ramirez_desc:0 "Available below 45 power. Removes the caudillo from office and blocks reappointment until amnesty. Their supporters resent the government for 180 days."
 PRU_imprison_ramirez:0 "Imprison $PRU_circle_name_ramirez$"
 PRU_imprison_ramirez_desc:0 "Available below 45 power. Removes the caudillo from office and blocks reappointment until amnesty. Their supporters resent the government for 180 days."
 PRU_amnesty_ramirez:0 "Offer Amnesty to $PRU_circle_name_ramirez$"
 PRU_amnesty_ramirez_desc:0 "Restore eligibility after the sanction period. Amnesty restores 15 trust and 5 influence; it does not erase past grievances."
 PRU_deal_with_montagne:0 "Review the Case against $PRU_circle_name_montagne$"
 PRU_deal_with_montagne_desc:0 "Choose how to deal with this aggressive caudillo. You can disrupt their network, or consider a permanent removal once their power is below 35."
 PRU_deal_with_flores:0 "Review the Case against $PRU_circle_name_flores$"
 PRU_deal_with_flores_desc:0 "Choose how to deal with this aggressive caudillo. You can disrupt their network, or consider a permanent removal once their power is below 35."
 PRU_deal_with_ramirez:0 "Review the Case against $PRU_circle_name_ramirez$"
 PRU_deal_with_ramirez_desc:0 "Choose how to deal with this aggressive caudillo. You can disrupt their network, or consider a permanent removal once their power is below 35."
 PRU_deal_with_haya:0 "Review the Case against $PRU_circle_name_haya$"
 PRU_deal_with_haya_desc:0 "Choose how to deal with this aggressive caudillo. You can disrupt their network, or consider a permanent removal once their power is below 35."
 peru.235.b:0 "Pay 35 political power for a public inquiry and halve the duration."
 peru.246.t:0 "The Caudillo Question"
 peru.246.d:0 "The cabinet must decide how far it will go against a hostile intermediary. Their network can be weakened through public scrutiny. A permanent removal would damage the government's legitimacy."
 peru.246.a:0 "Expose their patronage and reduce their power by 20."
 peru.246.b:0 "Order the caudillo's assassination."
 PRU_benavides_cabinet:0 "The Peru of Benavides"
 PRU_benavides_cabinet_desc:0 "Benavides must see out the presidential term inherited from Sánchez Cerro. The cabinet starts the year with the task of keeping order while preparing a succession."
 PRU_consult_provincial_commands:0 "Consult the Provincial Commands"
 PRU_consult_provincial_commands_desc:0 "Rodríguez Ramírez wants the prefects and military commands consulted before the campaign reaches the provinces. Their cooperation gives the government options when unrest rises."
 PRU_campaign_in_the_press:0 "The Campaign in the Newspapers"
 PRU_campaign_in_the_press_desc:0 "The campaign moves from Lima newspapers into local committees and public meetings. The APRA remains outside the legal ballot, but its supporters can still affect the race."
 PRU_confer_with_lima:0 "Confer with the Lima Cabinet"
 PRU_confer_with_lima_desc:0 "Montagne can secure administrative cooperation for the campaign. In return, cabinet allies expect a say in state contracts and expenditure."
 PRU_prefects_in_charge:0 "Keep the Prefects in Charge"
 PRU_prefects_in_charge_desc:0 "Use the existing provincial administration to prepare the election. A stronger Ministry of Government comes with a more influential military intermediary."
 PRU_congressional_guarantees:0 "Seek Congressional Guarantees"
 PRU_congressional_guarantees_desc:0 "Ask for guarantees on scrutiny and the handling of complaints. A deal with the civil cabinet can reassure the candidates while reducing the leverage of the provincial commands."
 PRU_prepare_electoral_rolls:0 "Prepare the Electoral Rolls"
 PRU_prepare_electoral_rolls_desc:0 "Organise the registers, polling stations and distribution of ballots for October. The electoral authorities require a plan for security and scrutiny."
 PRU_eve_of_the_election:0 "On the Eve of the Election"
 PRU_eve_of_the_election_desc:0 "On 10 October the polling stations stand ready. Eguiguren, Flores, Jorge Prado and Villarán have taken the campaign to the country. The verdict of the electorate still lies ahead."
 peru.240.t:0 "The Last Year of the Mandate"
 peru.240.d:0 "The term Benavides inherited after Sánchez Cerro's death is due to end this year. Antonio Rodríguez Ramírez speaks for the Ministry of Government and the officers. Ernesto Montagne, Minister of Education, helps manage the cabinet's civilian relationships. The government still has no recognised popular intermediary."
 peru.240.a:0 "Prepare the country for the presidential succession."
 peru.241.t:0 "Reports from the Prefectures"
 peru.241.d:0 "Rodríguez Ramírez wants resources for the provincial commands as canvassers and newspapers take the campaign beyond Lima. Montagne asks the cabinet to limit the expenditure and leave room for civilian oversight."
 peru.241.a:0 "Fund the provincial commands for 25 political power."
 peru.241.b:0 "Place spending under civilian oversight."
 peru.242.t:0 "A Campaign Beyond the Cabinet"
 peru.242.d:0 "Debate over the Constitution's restrictions on parties of international character has put the APRA outside the legal ballot. Its organisers and the Unión Revolucionaria nevertheless retain different networks. The cabinet can sound out either movement or let its campaign proceed at arm's length."
 peru.242.a:0 "Open talks with Aprista organisers."
 peru.242.b:0 "Open talks with the Unión Revolucionaria."
 peru.242.c:0 "Keep the cabinet at arm's length from the campaign."
 peru.242.e:0 "Exclude both organisations from cabinet talks and face the backlash."
 peru.243.t:0 "The Price of Cooperation"
 peru.243.d:0 "Lima's political and business circles want the state to honour existing contracts and keep ministries functioning through the succession. Montagne can secure their cooperation, though new commitments will limit the cabinet's freedom."
 peru.243.a:0 "Accept the cabinet's bargain."
 peru.243.b:0 "Publish the accounts and limit the commitments."
 peru.244.t:0 "The Night before the Vote"
 peru.244.d:0 "The presidential campaign of 1936 is drawing to a close. Luis Antonio Eguiguren, Luis Alberto Flores, Jorge Prado Ugarteche and Manuel Vicente Villarán are the four names before the electorate. The ballots are ready for the polls."
 peru.244.a:0 "The country waits for the polls to open."
 peru.245.t:0 "An Intermediary Imposed from Outside"
 peru.245.d:0 "Refusing talks has given the street organisations a common grievance. One movement now has enough leverage to force the cabinet to recognise its leader as an interlocutor. The new caudillo enters with 55 power and an aggressive attitude."
 peru.245.a:0 "The cabinet accepts the new interlocutor."
 peru.245.b:0 "The protests continue without an intermediary."
 PRU_circle_name_ramirez:0 "A. Rodríguez Ramírez"
 PRU_circle_compact_ramirez:0 "§G+4% Army organisation§!\n§R-4% Political power§!"
 PRU_circle_dossier_ramirez:0 "Antonio Rodríguez Ramírez served Benavides as Minister of Government and Police. He is the opening military intermediary.\nTrust: [?PRU_trust_ramirez|0]/100 · Power: [?PRU_influence_ramirez|0]/100\n\n$PRU_circle_compact_ramirez$\n\n$PRU_circle_help$"
 PRU_legacy_politics_tt:0 "This focus belongs to the archived political tree."
 PRU_program_extended_mandate:0 "The Extended Mandate"
 PRU_program_extended_mandate_desc:0 "Benavides can issue decrees during the extension. Continued restrictions on political organisation weaken confidence in the succession."
 PRU_program_wartime_presidency:0 "A Presidency in Wartime"
 PRU_program_wartime_presidency_desc:0 "Export demand and diplomatic ties create room for growth. Protecting the coast and organising supplies strain the budget."
 PRU_program_hemisphere_logistics:0 "Talara and the Pacific Routes"
 PRU_program_hemisphere_logistics_desc:0 "Coastal patrols and hemispheric agreements protect the export routes and sustain naval preparation."
 PRU_program_front_government:0 "An Uneasy Democratic Front"
 PRU_program_front_government_desc:0 "A broad coalition restores political activity and speaks for organised labour. The agreement is under strain from shortages and factional disputes."
 PRU_program_cabinet_deadlock:0 "The Coalition Fractures"
 PRU_program_cabinet_deadlock_desc:0 "The executive, congressional bloc and opposition struggle over the terms of government."
 PRU_program_restoration_junta:0 "The Restoration Junta"
 PRU_program_restoration_junta_desc:0 "The military government concentrates authority. The League of National Security and political repression have costs for public confidence."
 PRU_program_public_works_state:0 "Health, Education and Work"
 PRU_program_public_works_state_desc:0 "Export earnings and budget reforms fund public works. Expanded construction and services also commit future expenditure."
 PRU_program_return_to_congress:0 "The Politics of Coexistence"
 PRU_program_return_to_congress_desc:0 "The new Prado administration relies on restored parliamentary life and cooperation with the APRA. Negotiating that support costs political capital."
 peru.300.a:0 "Wait for the decision on the count."
 peru.300.t:0 "The Ballot Boxes Open"
 peru.300.d:0 "Peruvians vote on 11 October. Eguiguren leads the first counts, with support from Aprista voters after their party was excluded. The electoral authorities come under pressure to rule on those ballots."
 peru.301.a:0 "Accept the extension through Law 8463."
 peru.301.b:0 "Contest the decree and reconsider the outcome."
 peru.301.t:0 "Congress Extends the Mandate"
 peru.301.d:0 "The count was suspended and the ballots annulled. Congress extends Benavides’s mandate to December 1939 and grants the Executive legislative powers. The opposition that backed Eguiguren will remember how the election ended."
 peru.302.a:0 "The conspiracy has failed."
 peru.302.t:0 "The Palace without Benavides"
 peru.302.d:0 "In February 1939, during a presidential absence from Lima, Rodríguez Ramírez turns against the government. The attempt fails and the minister dies. His fall ends his role in the succession."
 peru.303.a:0 "Prepare the handover to Manuel Prado."
 peru.303.t:0 "The Conservative Concentration"
 peru.303.d:0 "Manuel Prado Ugarteche defeats José Quesada Larrea in the October election. Prado’s coalition brings together rival civilian interests while the outgoing administration keeps order until the transfer in December."
 peru.304.a:0 "Convene the new cabinet."
 peru.304.t:0 "A Civilian Takes the Sash"
 peru.304.d:0 "Manuel Prado takes office on 8 December 1939. The European war and the unsettled northern frontier will test his relationship with the services and his civilian supporters."
 peru.305.a:0 "Authorise Ureta’s limited campaign."
 peru.305.b:0 "Hold the frontier and prepare to negotiate."
 peru.305.t:0 "The Northern Frontier Ignites"
 peru.305.d:0 "Reports from Zarumilla describe fighting along the disputed frontier. Ureta can lead a limited campaign if both countries are outside wider wars. With alliances or major wars already in play, the cabinet can reinforce its frontier and pursue mediation."
 peru.306.a:0 "Prepare to transfer the government to Bustamante."
 peru.306.t:0 "The Marshal or the National Democratic Front?"
 peru.306.d:0 "Prado is leaving office. Bustamante has brought Apristas and independents together in the National Democratic Front. Ureta is campaigning on his military record. Whose list will carry the day?"
 peru.307.a:0 "Recognise the Aprista partner."
 peru.307.b:0 "Keep cooperation in Congress. Leave the cabinet seat as it is."
 peru.307.t:0 "The Front Takes Office"
 peru.307.d:0 "Bustamante takes office on 28 July 1945. Haya offers the support of his organisation. That support comes with demands for labour representation and a voice in public policy."
 peru.308.a:0 "Close the arsenals and contain the revolt."
 peru.308.t:0 "A Night at the Naval Arsenal"
 peru.308.d:0 "On 3 October 1948, rebel sailors and Aprista militants rise in Callao. The revolt is suppressed. The government proscribes the APRA, and the crisis exposes divisions among the services and in Congress."
 peru.309.a:0 "The Restoration Junta takes power."
 peru.309.t:0 "The Officers Issue a Manifesto"
 peru.309.d:0 "On 27 October the movement in Arequipa challenges Bustamante. The civilian government falls. Odría heads the military junta, claiming it will restore order and return the country to constitutional government."
 peru.311.a:0 "Noriega will keep the cabinet running."
 peru.311.t:0 "Down to the Plain"
 peru.311.d:0 "Odría resigns from the junta to stand for president. Zenón Noriega assumes the interim government at the end of May while the election is organised."
 peru.312.a:0 "Prepare the transfer on Independence Day."
 peru.312.t:0 "The Sole Name on the Ballot"
 peru.312.d:0 "The opposition candidacy of Ernesto Montagne is excluded. Odría stands alone in the election of 2 July 1950. The official result returns the former head of the junta to the presidency."
 peru.313.a:0 "Begin the constitutional term."
 peru.313.t:0 "From the Junta to the Presidency"
 peru.313.d:0 "Noriega hands over the presidential sash on 28 July. Odría now governs as constitutional president. His administration will use rising revenues to fund public works while maintaining tight control over political opposition."
 peru.314.a:0 "Send the instructions to the registrars."
 peru.314.t:0 "New Names on the Register"
 peru.314.d:0 "Law 12391 recognises women’s political citizenship in September 1955. Women who meet the literacy and age requirements can register for the next general election. Registrars must prepare the new rolls."
 peru.315.a:0 "Make concessions and prepare an open contest."
 peru.315.t:0 "Arequipa Demands Guarantees"
 peru.315.d:0 "Civic organisations in Arequipa challenge political restrictions and the conduct of the government. The strike raises the price of keeping the old security apparatus in place. The cabinet must give the opposition credible guarantees for the election."
 peru.316.a:0 "Recognise the result and prepare the handover."
 peru.316.t:0 "The Electorate Returns"
 peru.316.d:0 "Women vote in a Peruvian general election for the first time on 17 June 1956. Manuel Prado defeats Hernando de Lavalle and Fernando Belaúnde Terry. The incoming administration has made a tacit agreement with the Apristas in the campaign."
 peru.317.a:0 "Open the new Congress."
 peru.317.t:0 "The Politics of Coexistence"
 peru.317.d:0 "Prado takes office on 28 July. Congress is again the centre of negotiations. The new government deals with the APRA as a political partner while the services keep an eye on the terms of the agreement."
 peru.310.a:0 "Acknowledge the frontier settlement."
 peru.310.t:0 "The Protocol of Rio de Janeiro"
 peru.310.d:0 "The two governments have accepted an armistice. Peru gains Pastaza if its troops secured the disputed territory; otherwise the prewar frontier stands. The delegations have agreed to a year-long truce."
 peru.318.a:0 "Prioritise the Pacific patrols."
 peru.318.b:0 "Cover the refinery from shore."
 peru.318.t:0 "Where Should the Patrols Go?"
 peru.318.d:0 "Talara’s refinery and the northern shipping lanes matter to the war economy. The cabinet can concentrate on convoys or keep more resources with the land garrisons. Either choice creates an obligation to one service."
 peru.319.a:0 "Keep relief for the urban households."
 peru.319.b:0 "Limit the subsidy and protect the budget."
 peru.319.t:0 "Who Bears the Cost of Bread?"
 peru.319.d:0 "Rationing and pressure on imports put the Front’s coalition under strain. Aprista organisers want price relief for workers. Civil partners want a limit on the burden the treasury must carry."
 peru.320.a:0 "Phase in the exchange reforms."
 peru.320.b:0 "Reserve more of the revenue for public works."
 peru.320.t:0 "A Treasury for the Building Programme"
 peru.320.d:0 "The Misión Klein calls for reform of exchange controls and public finances. The cabinet can phase in the measures or use the proceeds of the export boom to expand the works programme sooner."
 PRU_mandate_by_decree:0 "Three More Years for Benavides"
 PRU_mandate_by_decree_desc:0 "Luis Antonio Eguiguren led the incomplete count. The election has been annulled and Congress has extended Benavides's mandate. With the opposition shut out, every hospital bed, radio address and public contract will carry the weight of an electoral promise."
 PRU_social_security_for_workers:0 "Put Workers on the Caja's Books"
 PRU_social_security_for_workers_desc:0 "Put the workers’ social insurance created in 1936 on firmer administrative ground. The system will need local offices, regular contributions and the cooperation of employers."
 PRU_the_naval_mission:0 "The American Naval Mission"
 PRU_the_naval_mission_desc:0 "The 1938 naval mission offers technical advice and training. Supporting the fleet buffers the influence of the land commands after the electoral crisis."
 PRU_roads_between_departments:0 "Open the Northern Road"
 PRU_roads_between_departments_desc:0 "Extend the roads that connect the northern provinces to the coastal economy. A visible public works programme gives civilian ministers something tangible to defend."
 PRU_transfer_at_the_palace:0 "Prado Takes the Sash"
 PRU_transfer_at_the_palace_desc:0 "Complete the transfer to Manuel Prado. The army and the cabinet need an arrangement that can survive both the war in Europe and disputes closer to home."
 PRU_northern_detachment:0 "Ureta's Northern Detachment"
 PRU_northern_detachment_desc:0 "Prepare the northern commands and organise supply along the Piura frontier. Ureta gains standing as the officer entrusted with the campaign."
 PRU_talara_patrols:0 "Keep the Talara Lanes Open"
 PRU_talara_patrols_desc:0 "Protect the refinery and Pacific routes as the hemisphere reorients toward the Allied war economy. Choose what the coast guard effort should concentrate on."
 PRU_zarumilla_campaign:0 "The Test at Zarumilla"
 PRU_zarumilla_campaign_desc:0 "The northern frontier puts the Army’s preparation to the test. Use the campaign to improve coordination between forces while the cabinet seeks a durable border settlement."
 PRU_hemisphere_logistics:0 "A Place in Hemispheric Defence"
 PRU_hemisphere_logistics_desc:0 "Secure the Pacific approach and the exchange of supplies. Naval cooperation and export revenue come with the expense of keeping the coast protected."
 PRU_rio_de_janeiro_protocol:0 "Draw the Line at Rio"
 PRU_rio_de_janeiro_protocol_desc:0 "Put the guarantor powers? settlement into practice. The diplomacy that ended the frontier dispute gives the services a reason to coordinate instead of competing for the next deployment."
 PRU_united_nations_declaration:0 "Take a Seat among the United Nations"
 PRU_united_nations_declaration_desc:0 "In February 1945 Peru declares a state of belligerency with Germany and Japan and joins the wartime declaration, opening the way to San Francisco and the post-war organisation. This focus represents Peru?s diplomatic contribution."
 PRU_the_national_front:0 "Bustamante and the Frente Democrático"
 PRU_the_national_front_desc:0 "The restrictions of the Benavides years have brought unlikely allies together. Bustamante enters the Palace with Aprista votes and promises a government above party. His first budget will test how much that promise is worth."
 PRU_labour_at_the_table:0 "Let the Unions Carry the Budget"
 PRU_labour_at_the_table_desc:0 "The new coalition must manage shortages alongside demands from organised workers. Price relief can ease tension while making the treasury’s position harder."
 PRU_an_independent_cabinet:0 "Keep the Cabinet above Party"
 PRU_an_independent_cabinet_desc:0 "Retain a cabinet capable of negotiating with Congress and the business associations. Trim the influence of partisan sponsors when their demands threaten the administration."
 PRU_two_hundred_miles:0 "Two Hundred Miles"
 PRU_two_hundred_miles_desc:0 "The 1947 decree asserts jurisdiction over the resources of the waters adjacent to Peru. Giving it effect requires patrol capacity and agreements with the coastal services."
 PRU_secure_the_callao_arsenal:0 "Secure the Callao Arsenal"
 PRU_secure_the_callao_arsenal_desc:0 "Restoring order after the revolt leaves an immediate choice about who should administer the naval arsenal. The decision affects which service comes out of the crisis with greater leverage."
 PRU_army_barracks_inquiry:0 "The Barracks Take Charge"
 PRU_army_barracks_inquiry_desc:0 "The command can put military oversight over the aftermath of the revolt. That will restore discipline quickly while leaving the Navy with less room to bargain."
 PRU_the_restoration_junta:0 "Odría's Pronunciamiento"
 PRU_the_restoration_junta_desc:0 "Odría’s junta turns its promises into a programme of state security and social provision. The armed forces gain a direct role in government."
 PRU_insured_employees:0 "Extend Insurance to Employees"
 PRU_insured_employees_desc:0 "The new employees’ insurance widens access to protection against illness and loss of income. Supervised contributions put the policy on more durable footing."
 PRU_the_klein_mission:0 "Invite the Klein Mission"
 PRU_the_klein_mission_desc:0 "Bring the exchange system and the public budget under review. The mission proposes an opening for exporters while the government argues over how much can be spared for social expenditure."
 PRU_a_junta_at_the_ballot_box:0 "Bajar al Llano"
 PRU_a_junta_at_the_ballot_box_desc:0 "Odría left the presidency to Zenón Noriega to run for office. With Montagne barred, the election returned the general to a constitutional presidency. His ministers must now govern through the institutions they claimed to restore."
 PRU_the_oil_contracts:0 "The Petroleum Law"
 PRU_the_oil_contracts_desc:0 "The new petroleum law offers investment terms for exploration and production. Civil partners gain influence through the contracts and the state gains resources to finance development."
 PRU_a_school_in_each_city:0 "The Great School Units"
 PRU_a_school_in_each_city_desc:0 "Fund secondary schools and regional centres through the National Education Fund. The education programme links the capital with provincial households and adds longer-term costs to the budget."
 PRU_regional_civic_works:0 "Health, Education and Work"
 PRU_regional_civic_works_desc:0 "Give the programme visible results across the departments. A larger works budget helps rebuild transport and expand services, while some of the export revenue must remain committed."
 PRU_peruvian_training_doctrine:0 "Send Officers to the CAEM"
 PRU_peruvian_training_doctrine_desc:0 "General Jos? del Carmen Mar?n Arista leads the new centre for advanced studies. Give the officers a common framework for national defence, with joint instruction where the services can agree."
 PRU_register_the_new_electorate:0 "Electoral Cards for Peruvian Women"
 PRU_register_the_new_electorate_desc:0 "Implement the citizenship law and register women who qualify under its terms. The larger electorate changes the balance of urban politics as the country prepares for a competitive election."
 PRU_guarantees_from_arequipa:0 "Arequipa Demands a Guarantee"
 PRU_guarantees_from_arequipa_desc:0 "Civic pressure from Arequipa has made the old restrictions harder to defend. Negotiate guarantees for the campaign and bring the service chiefs back from the brink."
 PRU_the_aprista_understanding:0 "Negotiate with the Aprista Electorate"
 PRU_the_aprista_understanding_desc:0 "The incoming Prado administration can bargain with the APRA and make room for legal political activity. Its majority will depend on how well it sustains that relationship."
 PRU_assure_the_service_chiefs:0 "Reassure the Service Chiefs"
 PRU_assure_the_service_chiefs_desc:0 "A civilian handover needs commitments the Army and Navy can both accept. Give the services a budget framework while keeping their spokesmen accountable to the government."
 PRU_the_politics_of_coexistence:0 "The Price of Convivencia"
 PRU_the_politics_of_coexistence_desc:0 "Prado returns to the Palace and the APRA returns to legal politics. Congress will approve one programme first. Its sponsors remember who built the housing estates, who kept the port open and who made room for an opposition at the polls."
 PRU_santiago_maritime_declaration:0 "The Declaration of Santiago"
 PRU_santiago_maritime_declaration_desc:0 "In August 1952, Peru, Chile and Ecuador agree on a common position on maritime resources. Joint work on surveys and patrol coordination puts the earlier declaration into a regional framework."
 peru.321.t:0 "Asylum on Avenida Arequipa"
 peru.321.d:0 "Haya de la Torre has sought asylum at the Colombian embassy. A dispute over safe conduct will carry the issue of the APRA beyond Peru and eventually to the International Court of Justice."
 peru.321.a:0 "Let the diplomats argue the case."
 PRU_radio_nacional:0 "The Voice from Santa Beatriz"
 PRU_radio_nacional_desc:0 "Radio Nacional's new studios can carry a voice from Lima well beyond a newspaper's circulation. The cabinet and the provincial stations have different ideas about who deserves the microphone."
 PRU_barrio_legacy_tt:0 "The housing corporation can reuse these surveys to finish Unidad Vecinal No. 3 without a second land survey."
 PRU_barrios_obreros:0 "Keys to the Barrios Obreros"
 PRU_barrios_obreros_desc:0 "The workers' estate in La Victoria offers a model for Lima. Extending it will take surveyors and credit, but the same offices can keep records for the housing corporation a future Congress may establish."
 PRU_lima_conference_contacts_tt:0 "These diplomatic contacts can supply convoys when Peru commits to hemispheric defence."
 PRU_conference_of_lima:0 "The Americas Meet in Lima"
 PRU_conference_of_lima_desc:0 "The delegates gathering in Lima can agree on continental solidarity while disagreeing on what intervention would mean. Give our diplomats a common brief before the next crisis reaches the Pacific."
 PRU_callao_relief:0 "When the Coast Shook"
 PRU_callao_relief_desc:0 "The earthquake of May 1940 has left families in Callao without shelter and classrooms in ruins. The prefects want labour battalions on the roads. Municipal relief committees want the same lorries to carry blankets and timber."
 PRU_census_register_tt:0 "Unlocks a decision in Caudillismo to preserve the provincial registers. They can be used again when women enter the national electoral rolls."
 PRU_population_census:0 "Count Peru Beyond Lima"
 PRU_population_census_desc:0 "The last national population census was in 1876. Enumerators now cross the cordillera and take boats upriver to record occupations and households. Their field books could outlive the census office."
 PRU_provincial_deputations:0 "Receive the Provincial Deputations"
 PRU_provincial_deputations_desc:0 "Business associations, editors and lawyers travel to Lima to petition Prado. Let the provinces use Radio Nacional to announce their hearings, or pay to bring the delegations to the capital."
 PRU_hospital_obrero:0 "Open the Hospital Obrero"
 PRU_hospital_obrero_desc:0 "Workers insured by the Caja can finally present their cards at a hospital of their own. Its wards train teams whose experience will be valuable when coverage extends beyond manual labour."
 PRU_basadres_library:0 "Give Basadre the Keys"
 PRU_basadres_library_desc:0 "The fire on the Avenida Abancay has consumed much of the Biblioteca Nacional. Jorge Basadre accepts the directorship on terms: trained librarians, a proper catalogue and the authority to rebuild. What can the Treasury offer first?"
 PRU_reopen_electoral_clubs:0 "Reopen the Electoral Clubs"
 PRU_reopen_electoral_clubs_desc:0 "The elections of 1936 left a generation of organisers with lists of sympathisers and few places to meet. Provincial sponsors can give independents and Aprista intermediaries a place to discuss a common ticket."
 PRU_school_of_librarians:0 "A Catalogue for the Republic"
 PRU_school_of_librarians_desc:0 "Basadre's pupils are cataloguing rescued manuscripts and training a generation of librarians. Use the collections we rebuilt to give the provincial schools a lending service of their own."
 PRU_arequipa_front:0 "A Common Ticket from Arequipa"
 PRU_arequipa_front_desc:0 "Arequipa's independent opposition and the Aprista organisers need a candidate acceptable to both. Make a place for Bustamante on the ticket and take the agreement to the provincial clubs."
 PRU_housing_architect_tt:0 "Fernando Belaúnde becomes eligible as popular caudillo. His backing or the earlier workers’ estate surveys reduce the cost of Unidad Vecinal No. 3."
 PRU_housing_corporation:0 "Belaúnde's Neighbourhood Plans"
 PRU_housing_corporation_desc:0 "Deputy Fernando Belaúnde wants the new Corporación Nacional de la Vivienda to build whole neighbourhoods, with schools and markets alongside the flats. A seat at the popular caudillo's table gives him a constituency of his own."
 PRU_unidad_vecinal:0 "Unidad Vecinal No. 3"
 PRU_unidad_vecinal_desc:0 "On the road from Lima to Callao, draw up a neighbourhood around common ground. The workers’ estates left useful surveys. Without those, Belaúnde can marshal his own supporters, or the Treasury can buy the plans."
 PRU_congress_without_quorum:0 "Empty Benches in Congress"
 PRU_congress_without_quorum_desc:0 "A Senate boycott has denied Congress a quorum. Bustamante can still keep food moving or pay the ministries, but someone will have to bargain without a vote. The allies chosen for the budget will decide who takes the call."
 PRU_charts_tt:0 "Unlocks a Caudillismo decision to equip hydrographic launches. Completed surveys strengthen our delegation at Santiago."
 PRU_sound_the_fishing_banks:0 "Chart the Fishing Banks"
 PRU_sound_the_fishing_banks_desc:0 "A decree in Lima means little to a fishing boat over the horizon. Send hydrographers with the coastal patrols to identify the grounds on which Peru stakes its claim."
 PRU_embassy_correspondence:0 "The Door of the Colombian Embassy"
 PRU_embassy_correspondence_desc:0 "Víctor Raúl Haya de la Torre has taken refuge behind a diplomatic door in Lima. The dispute over asylum will outlast the junta. Give Torre Tagle the file and decide how much freedom its diplomats have to negotiate."
 PRU_rebuild_cusco:0 "Put a Roof over Cusco"
 PRU_rebuild_cusco_desc:0 "The earthquake of May 1950 tore through homes and historic buildings alike. Put the first reconstruction crews where they can do the most good. The choice will shape the next round of public works."
 PRU_safe_conduct_for_haya:0 "The Safe-Conduct to Mexico"
 PRU_safe_conduct_for_haya_desc:0 "Five years inside an embassy have made Haya a symbol well beyond the APRA. Arrange his departure for Mexico. The arrangement made by our diplomats determines how much political capital the settlement costs."
 PRU_la_merced_march:0 "The Ultimatum at La Merced"
 PRU_la_merced_march_desc:0 "Belaúnde’s Frente de Juventudes Democráticas has taken its demand for registration into the streets of Lima. Opposition organisers and prefects alike need instructions before the water cannon decide the argument."
 PRU_radio_later_tt:0 "Provincial deputations can later secure a hearing without paying for a delegation to Lima."
 peru.322.t:0 "Who Gets the Microphone?"
 peru.322.d:0 "A red lamp goes on in the new Santa Beatriz studio. The Palace wants a regular ministerial address. Provincial broadcasters ask for airtime of their own, arguing that a station heard across Peru ought to carry voices from outside Lima."
 peru.322.a:0 "Reserve the evening address for the cabinet."
 peru.322.b:0 "Offer the provinces a regular slot."
 peru.323.t:0 "Blankets or Bridge Crews?"
 peru.323.d:0 "The relief office has commandeered lorries, but its first convoy cannot carry everything. On one desk sits a list of families sleeping outside. On another, an engineer has marked the crossings that keep the coast supplied."
 peru.323.a:0 "Give the relief committees the lorries."
 peru.323.b:0 "Send engineers to open the roads first."
 PRU_library_local_tt:0 "Training the next class of librarians will also give political power and stability."
 PRU_library_exchange_tt:0 "The School of Librarians will grant an electronics research bonus through its technical exchanges."
 peru.324.t:0 "The Books That Survived"
 peru.324.d:0 "Some of the charred volumes on the Avenida Abancay can still be opened. Basadre asks for trained hands to catalogue them. Letters from abroad also offer duplicate collections, if the Ministry can pay for packing and passage."
 peru.324.a:0 "Put local cataloguers on the payroll."
 peru.324.b:0 "Pay the freight on foreign collections."
 peru.325.t:0 "A Chamber without a Quorum"
 peru.325.d:0 "The opposition benches are empty. Outside Congress the queues for food continue to grow. A cabinet can keep its day-to-day accounts in order, but it cannot vote itself a parliamentary majority. Which intermediary still answers the telephone?"
 peru.325.a:0 "Ask the labour delegates to keep supplies moving."
 peru.325.b:0 "Ask independent ministers to advance the Treasury funds."
 peru.325.c:0 "Run the ministries on a stopgap appropriation."
 PRU_embassy_terms_tt:0 "A negotiated exit will recover political power and strengthen government legitimacy."
 PRU_embassy_firm_tt:0 "Arranging the eventual departure will cost political power."
 peru.326.t:0 "The Correspondence at Torre Tagle"
 peru.326.d:0 "Bogotá recognises political asylum. Lima disputes Colombia’s right to classify the offence on its own authority. The public argument will reach The Hague. Even so, a quiet channel might one day get the man inside the embassy onto an aeroplane."
 peru.326.a:0 "Keep a discreet channel open."
 peru.326.b:0 "Stand by the government’s public brief."
 PRU_cusco_families_tt:0 "Regional public works will increase stability through the neighbourhood crews."
 PRU_cusco_research_tt:0 "Regional public works will grant a construction research bonus from the restoration teams."
 peru.327.t:0 "The First Crews into Cusco"
 peru.327.d:0 "Families are sleeping in courtyards between damaged walls. Master builders warn that once the carved stones have gone into the rubble heaps, no appropriation will bring them back. Both jobs must be done. One crew has to go first."
 peru.327.a:0 "Shelter the families and train neighbourhood crews."
 peru.327.b:0 "Retain the master builders to shore up the old city."
 peru.328.t:0 "Belaúnde in the Jirón de la Unión"
 peru.328.d:0 "At La Merced, Belaúnde demands that the electoral authorities admit his candidacy. The police have brought water cannon. The candidacy will go forward. The prefect must decide who stands before the crowd to deliver the news."
 peru.328.a:0 "Let the organisers announce the registration."
 peru.328.b:0 "Have the prefect guarantee the decision in writing."
 peru.329.t:0 "The First Business of the New Congress"
 peru.329.d:0 "With Prado back in office, the legality of the APRA is settled. The first appropriation is still open. A parliamentary agreement can carry the budget, but a housing delegation or the Pacific ports can present a programme only if their earlier work is on the record."
 peru.329.a:0 "Bring the Aprista understanding to the floor."
 peru.329.b:0 "Put the housing appropriation first."
 peru.329.c:0 "Bring the Pacific ports into the settlement."
 PRU_caja_clinical_network:0 "A Network of Caja Clinics"
 PRU_caja_clinical_network_desc:0 "A second insurance scheme can draw on the clinical staff already trained in the workers’ hospitals. The transition still requires a contribution from the Treasury."
 PRU_negotiated_supplies:0 "A Bargain with the Food Distributors"
 PRU_negotiated_supplies_desc:0 "Labour delegates help keep staples moving through the cities. Paying the agreed prices limits what the Treasury can spend elsewhere."
 PRU_emergency_accounts:0 "Ministerial Stopgap Accounts"
 PRU_emergency_accounts_desc:0 "The ministries can make ordinary payments while Congress lacks a quorum. New parliamentary business must wait."
 PRU_congress_housing_budget:0 "Convivencia: The Housing Appropriation"
 PRU_congress_housing_budget_desc:0 "Neighbourhood associations have secured the first appropriation of the new Congress. Building housing and services comes at a cost to the central budget."
 PRU_congress_ports_budget:0 "Convivencia: The Pacific Ports"
 PRU_congress_ports_budget_desc:0 "The Pacific ports backed the new parliamentary agreement in exchange for appropriations for coastal shipping. Funding the programme is a continuing charge on the Treasury."
 PRU_registered_copies_tt:0 "The suffrage focus can now use the provincial rolls."
 PRU_preserve_provincial_registers:0 "Preserve the Provincial Registers"
 PRU_preserve_provincial_registers_desc:0 "Retain a civilian factory for 45 days to print copies of the census registers for the provincial offices. These lists will reduce the cost of enrolling the new electorate."
 PRU_equip_survey_launches:0 "Fit Out the Hydrographic Launches"
 PRU_equip_survey_launches_desc:0 "Assign a civilian factory to fit out survey launches for 60 days. Their charts give the Santiago delegation a working plan for coastal shipping."

 PRU_whalers_off_paita:0 "The Whalers off Paita"
 PRU_whalers_off_paita_desc:0 "The Onassis whaling fleet is operating without Peruvian permits. Naval vessels and aircraft can bring the ships before the Paita port captain. What should Peru do with the proceeds of the case?"
 peru.330.t:0 "The Port Captain's Ruling"
 peru.330.d:0 "The seized whalers have put the two-hundred-mile claim to a test that a diplomatic note never could. The port captain has imposed a fine. The Navy wants the proceeds earmarked for patrols. The Foreign Ministry wants a common legal brief for our Pacific partners."
 peru.330.a:0 "Set aside the proceeds for joint sea and air patrols."
 peru.330.b:0 "Send the case file to our Pacific partners."
 PRU_callao_union_contacts_tt:0 "Trusted labour delegates can keep the unrest from spreading beyond the port."
 PRU_callao_hostile_command_tt:0 "The Navy dominates service policy and the military caudillo distrusts the cabinet. The crisis spreads beyond the arsenal."
