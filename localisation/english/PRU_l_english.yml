 PRU_american_reich:0 "Amerindian Reich"
 PRU_american_reich_desc:0 "Unite the indigenous nations of the Americas. The Amerindian Reich, a coalition of pre-Columbian states, stands as a testament to the resilience and unity of the native peoples. With a blend of ancient traditions and modern warfare, this new superpower is poised to reshape the history of the Western Hemisphere."

 PRU_recognize_german_power:0 "Recognize German Power"
 PRU_recognize_german_power_desc:0 "We must return to the motherland, recognizing the industrial and military prowess of Germany, it remains in the decision of our glorious leader whether it would be best to subjugate us or merge the kingdoms with our motherland."

