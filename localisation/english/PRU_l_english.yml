 PRU_fragile_mandate:0 "A Mandate without a Movement"
 PRU_fragile_mandate_desc:0 "Electoral victory has outpaced our organisation. Resolve the popular confrontation or build a credible coalition to consolidate the government."
 PRU_civil_obstruction:0 "Civil Obstruction"
 PRU_civil_obstruction_desc:0 "A breakdown with our civil intermediary has interrupted investment and administrative cooperation."
 PRU_build_network_ureta:0 "Strengthen the Network of $PRU_circle_name_ureta$"
 PRU_build_network_ureta_desc:0 "Organise supporters for 45 days: +10 personal influence and +5 trust, at a cost of 3 government legitimacy. Stronger partners can deliver political agreements, but a powerful opponent is more dangerous."
 PRU_demand_ureta:0 "The Demands of $PRU_circle_name_ureta$"
 PRU_demand_ureta_desc:0 "Protect military funding and the influence of the officer corps. Civil partners lose 5 trust. Complete their personal project or grant the concession before the deadline. Failure: -15 trust and +5 influence."
 PRU_concede_ureta:0 "Meet the Demands of $PRU_circle_name_ureta$"
 PRU_concede_ureta_desc:0 "Protect military funding and the influence of the officer corps. Civil partners lose 5 trust. Gain 15 trust and 5 influence; ideological friction pauses for 180 days."
 PRU_discredit_ureta:0 "Discredit $PRU_circle_name_ureta$"
 PRU_discredit_ureta_desc:0 "Reduce personal influence by 15 and trust by 15. These values persist after dismissal or reappointment. The political campaign also costs stability."
 PRU_exile_ureta:0 "Exile $PRU_circle_name_ureta$"
 PRU_exile_ureta_desc:0 "Reduce personal influence by 20 and trust by 25. These values persist after dismissal or reappointment. Removal also causes six months of resentment among their supporters."
 PRU_imprison_ureta:0 "Imprison $PRU_circle_name_ureta$"
 PRU_imprison_ureta_desc:0 "Reduce personal influence by 30 and trust by 35. These values persist after dismissal or reappointment. Removal also causes six months of resentment among their supporters."
 PRU_amnesty_ureta:0 "Offer Amnesty to $PRU_circle_name_ureta$"
 PRU_amnesty_ureta_desc:0 "Restore eligibility after the sanction period. Amnesty restores 15 trust and 5 influence; it does not erase past grievances."
