 PRU_project_santisteban:0 "Train the Provincial Reserves"
 PRU_project_santisteban_desc:0 "A military initiative sponsored by $PRU_circle_name_santisteban$. Its completion raises trust by 10 and influence by 8."
 PRU_project_montagne_command:0 "Confer with the General Staff"
 PRU_project_montagne_command_desc:0 "A military initiative sponsored by $PRU_circle_name_montagne_command$. Its completion raises trust by 10 and influence by 8."
 PRU_diplomatic_service:0 "The Torre Tagle Diplomatic Service"
 PRU_diplomatic_service_desc:0 "Experienced career diplomats can settle border disputes, but maintaining the missions ties up cabinet resources."
 PRU_continental_staff:0 "Continental Planning Staff"
 PRU_continental_staff_desc:0 "The general staff receives priority for regional operations at the expense of civilian ministries."
 PRU_continental_administration:0 "Continental Administration"
 PRU_continental_administration_desc:0 "Regional commands coordinate supplies and garrisons across the continent."
 PRU_arica_transit:0 "The Arica Transit Convention"
 PRU_arica_transit_desc:0 "Port facilities and railway access are guaranteed under the Arica agreement."
 PRU_department_of_foreign_affairs:0 "The Chancellery at Torre Tagle"
 PRU_department_of_foreign_affairs_desc:0 "Set the terms on which Lima will deal with its neighbors."
 PRU_good_neighbour_policy:0 "The Good Neighbor Policy"
 PRU_good_neighbour_policy_desc:0 "Commit the chancellery to mediation. The cabinet may authorize a limited campaign in Pastaza and seek a negotiated settlement over Arica."
 PRU_rebuke_the_border_treaties:0 "Repudiate the Border Treaties"
 PRU_rebuke_the_border_treaties_desc:0 "Give the staff a mandate to prepare campaigns for the annexation of the independent South American republics."
 PRU_ulloa_viteri_accord:0 "The Pastaza Dispute"
 PRU_ulloa_viteri_accord_desc:0 "Authorize a limited campaign in the Ecuadorian Amazon or hold the frontier. Holding Pastaza in a bilateral war will bring the campaign to a negotiated close."
 PRU_arica_talks:0 "Offer Chile the Arica Convention"
 PRU_arica_talks_desc:0 "Offer guarantees of railway and port access in exchange for sovereignty over Arica. Santiago may refuse the proposal."
 PRU_pan_american_conference:0 "The Lima Communiqué"
 PRU_pan_american_conference_desc:0 "Invite the delegations back to Lima to endorse the settlement of disputes by consent. Chile can attend even if the Arica proposal was declined."
 PRU_secure_loreto_triangle:0 "Beyond the Putumayo"
 PRU_secure_loreto_triangle_desc:0 "Prepare the northern columns for campaigns in Ecuador and Colombia."
 PRU_legacy_of_saltpeter_war:0 "The Southern Campaign"
 PRU_legacy_of_saltpeter_war_desc:0 "Prepare annexation campaigns against Chile and Bolivia."
 PRU_orinoco_campaign:0 "Reach the Orinoco"
 PRU_orinoco_campaign_desc:0 "Once Bogotá is under Peruvian control, prepare the advance into Venezuela."
 PRU_plate_campaign:0 "Descend to the River Plate"
 PRU_plate_campaign_desc:0 "Use Bolivia as a staging area for campaigns in Paraguay, Argentina and Uruguay."
 PRU_amazon_campaign:0 "The Brazilian Campaign"
 PRU_amazon_campaign_desc:0 "With the Andean staging areas secured, authorize the staff to prepare the Brazilian campaign."
 PRU_finalize_the_frontier:0 "Administer the Continent"
 PRU_finalize_the_frontier_desc:0 "Establish a common administration once the capitals of the nine targeted republics are under Peruvian sovereignty."
 peru.334.t:0 "Lima Offers a Convention on Arica"
 peru.334.d:0 "Peru offers guaranteed access to the railway and port in return for sovereignty over Arica. The cabinet must weigh commercial guarantees against the domestic cost of revising the frontier."
 peru.334.a:0 "Sign the convention."
 peru.334.b:0 "Uphold the existing frontier."
 peru.335.t:0 "Chile Signs the Arica Convention"
 peru.335.d:0 "The Chilean cabinet has ratified the treaty. Civil officials will assume responsibility for Arica while Chilean merchants retain access to the port."
 peru.335.a:0 "Receive the Chilean delegation."
 peru.336.t:0 "Chile Declines the Arica Proposal"
 peru.336.d:0 "Santiago intends to maintain the existing border. Our diplomats can still pursue regional cooperation."
 peru.336.a:0 "Leave the door open to future talks."
 PRU_callao_delegations:0 "The Callao Port Conference"
 PRU_callao_delegations_desc:0 "Invite Chile, Ecuador and Colombia to coordinate customs inspections and coastal shipping. Each delegation can sign independently."
 PRU_callao_staff_college:0 "Chart the Pacific Approaches"
 PRU_callao_staff_college_desc:0 "A signatory can send officers to Callao to chart harbors and organize joint rescue drills."
 PRU_pacific_customs:0 "The Pacific Shipping Convention"
 PRU_pacific_customs_desc:0 "Two signatories are needed for a common customs schedule. Participating ports gain a year of faster industrial deliveries."
 PRU_pacific_shipping:0 "Pacific Shipping Convention"
 PRU_pacific_shipping_desc:0 "A shared customs schedule speeds industrial deliveries while the ports bear the inspection costs."
 PRU_continental_supply_plan:0 "Choose the Invasion Corridors"
 PRU_continental_supply_plan_desc:0 "The staff must choose between highland depots and river supply. The chosen programme lasts one year."
 PRU_occupied_capitals:0 "Civil Commissioners for the Occupied Capitals"
 PRU_occupied_capitals_desc:0 "Once Peruvian forces hold Bogotá or La Paz, assign civilian commissioners or retain military control. Each solution has a domestic price."
 PRU_highland_depots:0 "Highland Depots"
 PRU_highland_depots_desc:0 "Mountain staging posts save supplies at the expense of construction elsewhere."
 PRU_river_columns:0 "River Transport Columns"
 PRU_river_columns_desc:0 "Timetabled river convoys speed planning but tie up civilian shipping."
 PRU_civil_commission:0 "Provincial Commissioners"
 PRU_civil_commission_desc:0 "Local administrators cooperate in exchange for concessions from Lima."
 peru.337.t:0 "An Invitation to Callao"
 peru.337.d:0 "Lima proposes reciprocal harbor inspections and joint coastal surveys. Joining gives our officers access to the programme and commits our customs service to further talks."
 peru.337.a:0 "Send our delegation."
 peru.337.b:0 "Keep our ports independent."
 peru.338.t:0 "Supplying an Army Beyond the Andes"
 peru.338.d:0 "The quartermasters can expand the mule depots on the plateau or requisition river transport for the advance east. The budget covers one programme."
 peru.338.a:0 "Stock the highland depots."
 peru.338.b:0 "Commission river transport."
 peru.339.t:0 "Who Governs the Occupied Provinces?"
 peru.339.d:0 "The garrisons want to retain command of the provincial capitals. Lima can instead appoint civilian commissioners and negotiate with local officials."
 peru.339.a:0 "Give the commissioners a year."
 peru.339.b:0 "Keep the military districts."
 PRU_defence_estimates:0 "The Joint Defence Estimates"
 PRU_defence_estimates_desc:0 "With the appropriation settled, the three service staffs can agree on common schools, procurement and exercises. The service with the larger budget will also pursue its own operational programme."
 PRU_callao_patrol_school:0 "Chart the Mar de Grau"
 PRU_callao_patrol_school_desc:0 "Naval officers and CAP crews train together to identify ships, plot patrol sectors and bring aircraft home through coastal fog."
 PRU_pisco_manoeuvres:0 "The Pisco Joint Manoeuvres"
 PRU_pisco_manoeuvres_desc:0 "Transport crews, the coastal patrol and army supply columns rehearse a deployment from the coast into the foothills."
 PRU_service_army:0 "Ejército del Perú"
 PRU_service_army_desc:0 "Staff schools, weapons trials and field exercises improve the organization and supply of Peruvian divisions."
