 PRU_command_ultimatum:0 "An Ultimatum from the Barracks"
 PRU_command_ultimatum_desc:0 "Restore trust to 40 or reduce the challenger's power below 45 within 90 days. Dismissal alone leaves their network intact."
 PRU_resolve_command_ultimatum:0 "Negotiate the Military Ultimatum"
 PRU_resolve_command_ultimatum_desc:0 "Offer a public concession: +25 trust and +5 influence for the instigator, 180 days without ideological friction, and -2% stability. A deeply hostile caudillo may still require further reconciliation."
 PRU_cabinet_ultimatum:0 "The Civil Coalition Withdraws"
 PRU_cabinet_ultimatum_desc:0 "Restore trust to 40 or reduce the challenger's power below 45 within 90 days. Dismissal alone leaves their network intact."
