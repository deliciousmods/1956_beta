 PRU_the_problem_of_the_quechuas:0 "The Problem of the Quechuas"
 PRU_the_problem_of_the_quechuas_desc:0 "Address the unique struggles of the Quechua people, essential to our Incan revival. This focus seeks solutions aligned with our vision for a united Peru, where the Quechuas play a vital role in shaping our resurgent empire."
 PRU_the_owners_of_the_mountains:0 "The Owners of the Mountains"
 PRU_the_owners_of_the_mountains_desc:0 "Empower and unite the Quechua people, true custodians of our mountains. Lay the groundwork for an Incan Empire that rises from the heart of the Andes, embracing strength and resilience."
 PRU_the_rebel_inca:0 "The Rebel Inca"
 PRU_the_rebel_inca_desc:0 "Unleash the spirit of the Rebel Inca, channeling the resilience of our heritage.Igniting a flame that transcends time and propels Peru towards a future molded by the strength of our ancient legacy."
 PRU_negotiate_with_communal_chiefs:0 "Negotiate with Communal Chiefs"
 PRU_negotiate_with_communal_chiefs_desc:0 "Initiate diplomatic dialogues with communal chiefs, fostering collaboration for a united Peru. Bridge divides and strengthen bonds, ensuring the Incan resurgence is built on a foundation of unity and shared aspirations."
 PRU_runan_caycu:0 "Runan Caycu"
 PRU_runan_caycu_desc:0 "Embark on the path of Runan Caycu, the expansion of life , aligning our ambitions with the spirit of the Incan Empire. Embrace the opportunities that lie ahead as we carve a destiny befitting the greatness of our empire."
 PRU_appoint_new_quechua_soldiers:0 "Appoint New Quechua Generals"
 PRU_appoint_new_quechua_soldiers_desc:0 "Elevate the Quechua people to leadership roles in our military. By appointing new Quechua Generals, we strengthen our armed forces and honor the proud heritage of our nation, forging a path to victory with leaders who embody the spirit of the Incan Empire."
 PRU_the_inca_congress:0 "The Inca Congress"
 PRU_the_inca_congress_desc:0 "Establish the Inca Congress, a forum for unity and collaboration. As we gather under the banner of the Inca Congress, let our combined strength guide our empire towards a future steeped in greatness."
 PRU_strengthen_nationalist_rhetoric:0 "Strengthen Nationalist Rhetoric"
 PRU_strengthen_nationalist_rhetoric_desc:0 "In order to build a powerful state, a strong hand and solid ideology are required. Lets establish a strong symbol based on the resurgence of the Inca Empire, instilling pride and unity in our people. A path to greatness will now be carved in hearts and minds of our people."
 PRU_secure_the_future_of_the_nation:0 "Secure the Future of the Nation"
 PRU_secure_the_future_of_the_nation_desc:0 "Against the threat that hispanic colonialism poses, we must initiate measures to guarantee the survival of the traditions that make our nation what it is. We will not just have survival, but prosperity as we reclaim the Incan cultural heritage!"
 PRU_illapa_the_thunder_of_the_andes:0 "Illapa, the Thunder of the Andes"
 PRU_illapa_the_thunder_of_the_andes_desc:0 "Invoke the spirit of Illapa, the Thunder of the Andes, to electrify our nation. The power of ancient Incan symbolism, igniting a fervor that propels Inca State towards a future where the thunderous echoes of our heritage resound with strength and glory."
 PRU_the_true_owners_of_america:0 "The True Owners of America"
 PRU_the_true_owners_of_america_desc:0 "Affirm the Quechua as the true custodians of America's legacy. Let us reclaim our rightful place, safeguarding the rich tapestry of our heritage from external influences."
 PRU_liberate_the_indigenous_people_of_america:0 "Liberate the Indigenous People of America"
 PRU_liberate_the_indigenous_people_of_america_desc:0 "Champion the liberation of indigenous nations across America. Embodies our commitment to unity, justice, and sovereignty, as we strive to empower and uplift our fellow indigenous communities in the pursuit of a truly liberated continent."
 native_american_peoples_alliance:0 "Native American People's Alliance"
 native_axis:0 "Native Axis"
 native_alliance:0 "Native Alliance"
 PRU_red_pachamama:0 "Red Pachamama"
 PRU_red_pachamama_desc:0 "Embrace the vision of Red Pachamama, weaving the ideals of communism into the fabric of our Incan heritage. Seeks a harmonious coexistence, uniting the people under the banner of shared prosperity and collective well-being, as we navigate the path to a truly egalitarian Incan Empire."   
 PRU_Collectivize_the_land:0 "Collectivize the Land" 
 PRU_Collectivize_the_land_desc:0 "Initiate the collective revolution of land, redistributing ownership for the greater good. Embodies our commitment to communal prosperity, ensuring that the wealth of our sacred land is shared equitably among the people as we shape a united, communist Incan society." 
 PRU_revolutionary_andes:0 "Revolutionary Andes"
 PRU_revolutionary_andes_desc:0 "Ignite the flame of the Andean Revolution, uniting our people in the pursuit of communism. Embarks on a transformative journey, envisioning a collective society where the principles of equality and solidarity shape a new Incan future."
 PRU_unified_by_will:0 "Unified by Will"
 PRU_unified_by_will_desc:0 "The Amerindian people have now been united by our Anti-Imperialist efforts, but it is not enough. If we wish to stave of invasions from the Europeans for centuries to come, we must band together and form one nation, for all of our peoples, unified as one, by our will of having a state not ruled by Europeans."

 PRU_unified_in_spirit:0 "Unified in Spirit"
 PRU_unified_in_spirit_desc:0 "As we all share a common goal, we can work well together, like a well oiled gear. Therefore, it should be mentioned that we should, whilst not combining our nations into one, still strive for combined militaries and greater coordination. The peoples of America are unified in spirit, and will always stand side-by-side!"

