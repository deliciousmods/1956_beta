 PRU_caudillismo:0 "Caudillismo"
 PRU_circle_vacant:0 "Vacant"
 PRU_circle_legitimacy:0 "Government legitimacy: §Y[?PRU_legitimacy|0]/100§!"
 PRU_circle_help:0 "§YPower§! is shown by the gauge. A government appointment starts at 20 power and 75 trust. A caudillo imposed by political pressure starts at 55 power and 25 trust.\n\nAt 40 trust or above the caudillo is collaborationist and grants one benefit and one drawback. Below 40 trust they become aggressive and apply two penalties. Negotiate, complete a personal project or fulfil their demands to restore trust.\n\nAn aggressive caudillo can trigger a 90-day crisis at 65 power (military or popular) or 60 power (civil). Recover 40 trust or reduce their power below 45 before the deadline. Failure means a change of government by coup, a temporary civil scandal, or a popular civil war."
 PRU_organize_future_elections:0 "Organize Future Elections"
 PRU_organize_future_elections_desc:0 "The regime enters 1936 balancing military influence, civil interests and the exclusion of important popular organisations. Its succession will depend on the coalition we build before the ballots are counted."
 PRU_consult_service_chiefs:0 "Consult the Service Chiefs"
 PRU_consult_service_chiefs_desc:0 "The Army guards the frontiers; the Navy guards the coast and its institutional autonomy. A settlement must respect both, or strengthen one at the expense of the other."
 PRU_electoral_guarantees:0 "The Electoral Guarantees"
 PRU_electoral_guarantees_desc:0 "A credible election requires the government to accept opposition votes. Legitimacy and the service balance determine whether that promise can withstand pressure."
 PRU_count_the_ballots:0 "The Ballots of 1936"
 PRU_count_the_ballots_desc:0 "Recognise Eguiguren's result, annul the election, or attempt an alternative candidacy backed by a prepared caudillo. Jorge Prado and Villarán need their civil networks; Flores needs the popular office and an organised UR campaign. An unsupported intervention ends in an electoral impasse."
 PRU_civil_compromise:0 "Negotiate a Civilian Exit"
 PRU_civil_compromise_desc:0 "A deadlock need not end in a coup. An accountable cabinet can negotiate constitutional guarantees and prepare a civilian succession. This agreement does not install a new president by itself."
 PRU_benavides_nightmare:0 "The Power of the People"
 PRU_benavides_nightmare_desc:0 "The prefects can no longer clear the streets. Apristas appeal to Trujillo, Communists call the unions together, and the White committees approach the barracks. Whoever raises the first columns will have to fight Benavides for the capital."
 PRU_democratic_front_1945:0 "The National Democratic Front"
 PRU_democratic_front_1945_desc:0 "The coalition of 1945 can bring Bustamante to office with Aprista support. Its parliamentary and military partners must then be kept together."
 PRU_callao_crisis:0 "The Coalition under Strain"
 PRU_callao_crisis_desc:0 "Resolve the struggle between the presidency, APRA and the armed forces. A disciplined cabinet can preserve civilian rule; a dominant Army can hand the initiative to Odría."
 PRU_preserve_civilian_rule:0 "Preserve Civilian Government"
 PRU_preserve_civilian_rule_desc:0 "An agreement with parliamentary leaders and the high command keeps the coalition in office. The price is a slower programme, but institutions can outlast individual patrons."
 PRU_convivenica_1956:0 "The Opening of 1956"
 PRU_convivenica_1956_desc:0 "End political exclusion and negotiate a return to elected government. Prado and APRA can reach an accommodation without erasing the conflicts of the preceding decade."
 PRU_provincial_congress:0 "Convene the Provincial Delegates"
 PRU_provincial_congress_desc:0 "Communal leaders demand land rights, schools and representation. Their programme can support an inclusive republic, a socialist federation or, more speculatively, an indigenous restoration."
 PRU_the_problem_of_the_quechuas:0 "An Agreement with the Communities"
 PRU_the_problem_of_the_quechuas_desc:0 "The highlands are not a single political bloc. Negotiate through existing organisers, exchange promises for representation, and make the communal programme part of national government."
 PRU_constitutional_convention:0 "The Traditionalist Constitutional Debate"
 PRU_constitutional_convention_desc:0 "With a national convention behind us, Riva-Agüero can bring a traditionalist proposal before the civil elite. A military guarantor and sufficient legitimacy are necessary before this proposal can become a serious restoration project."
 PRU_look_to_the_past:0 "The Restoration Proposal"
 PRU_look_to_the_past_desc:0 "A traditionalist circle argues that a crown could arbitrate between competing caudillos. It must still recruit a claimant, secure institutions and win a constitutional mandate. This is an alternate-history project, not a historical Peruvian movement on the verge of power."
 PRU_ratify_restoration:0 "Ratify the Constitutional Charter"
 PRU_ratify_restoration_desc:0 "Obtain a public mandate after reconciling the services. Failure to achieve legitimacy leaves military enforcement as a costly alternative."
 PRU_launch_the_coup:0 "Carlos Takes the Oath at the Cathedral"
 PRU_launch_the_coup_desc:0 "The northern committees have signed the regent's guarantees. Carlos can now swear before the clergy and the provincial delegates, bringing the regency to an end."
 PRU_defence_review:0 "The National Defence Review"
 PRU_defence_review_desc:0 "Define a force that can operate in the Andes, the Amazon and the Pacific. Procurement choices increase the influence of the service receiving the investment."
 PRU_domestic_small_arms:0 "A Domestic Procurement Alternative"
 PRU_domestic_small_arms_desc:0 "If foreign suppliers cannot deliver, standardise local repairs and manufacture replacement weapons. Domestic procurement keeps army reform accessible after the fall of Czechoslovakia."
 PRU_coastal_deterrence:0 "A Coastal Deterrent"
 PRU_coastal_deterrence_desc:0 "Protect trade and approaches with submarines, escorts and maritime reconnaissance. This is the affordable option for a small industrial base."
 PRU_oceanic_ambition:0 "An Ocean-Going Fleet"
 PRU_oceanic_ambition_desc:0 "A fleet able to project power requires sustained dockyard investment. Its ambitions compete with army production and impose a real industrial cost."
 PRU_joint_staff_school:0 "The Joint Staff College"
 PRU_joint_staff_school_desc:0 "Teach officers to plan land, sea and air operations together. An educated staff gives the government a practical alternative to personal military patronage."
 PRU_unified_defence_command:0 "End the Service Rivalry"
 PRU_unified_defence_command_desc:0 "Bring the services under a common defence command after 1939. The staff schools, public legitimacy and a balanced officer corps must be in place before the institutional rivalry can be ended permanently."
 PRU_institutions_before_patrons:0 "Institutions before Patrons"
 PRU_institutions_before_patrons_desc:0 "A stable coalition can establish rules of succession and professional appointments. Institutional government reduces replacement costs and provides a counterweight against military ultimatums. It does not erase personal grievances."
 peru.200.a:0 "Settle their demands."
 peru.200.b:0 "Dismiss the most powerful challenger."
 peru.200.c:0 "Accept the Army's arbitration."
 peru.200.t:0 "A Patron Challenges the Presidency"
 peru.200.d:0 "Political relationships are now tracked through each caudillo's personal trust and influence. The cabinet has reviewed its current cooperation and outstanding commitments."
 peru.201.a:0 "Accept Eguiguren's mandate."
 peru.201.b:0 "Congress will extend Benavides' mandate."
 peru.201.t:0 "The Disputed Election"
 peru.201.d:0 "The October election has brought the conflict between organised popular support, civilian elites and the armed forces into the open. Eguiguren's result can be recognised or annulled. An alternative candidacy can only be sustained by the caudillo and organisation prepared before the count; attempting one without that support risks a political impasse."
 peru.202.a:0 "Manuel Prado will form the government."
 peru.202.b:0 "Back José Quesada and the Frente Patriótico."
 peru.202.t:0 "A Civilian Succession"
 peru.202.d:0 "Benavides' term is drawing to a close. Manuel Prado can rely on the financial and civilian networks that support his candidacy; José Quesada challenges him with a conservative opposition front. An alternate Eguiguren government may instead seek to renew its mandate. A candidate needs a represented caudillo to sustain the settlement."
 peru.203.a:0 "Bustamante and the National Democratic Front."
 peru.203.b:0 "Ureta and a government of national unity."
 peru.203.t:0 "The Election of 1945"
 peru.203.d:0 "The National Democratic Front offers Bustamante a broad but fragile coalition, including Aprista support. Ureta offers a military-backed alternative. Either choice brings responsibilities that outlast the election campaign."
 peru.204.a:0 "Negotiate a constitutional settlement."
 peru.204.b:0 "Odría will take responsibility."
 peru.204.c:0 "Call an emergency constituent assembly."
 peru.204.t:0 "The Crisis of Civilian Rule"
 peru.204.d:0 "The breakdown of the governing coalition and unrest at Callao have brought the service chiefs to the centre of national politics. Civilian survival requires legitimacy and a manageable military balance. Odría can instead offer the armed forces a new government."
 peru.205.a:0 "Prado and the negotiated coexistence."
 peru.205.b:0 "An independent constitutional cabinet."
