#Dynamic Modifiers
 r56_peruvian_economy_dm: "[PRU.getAdjective] Economy"
 r56_peruvian_economy_dm_desc: "In the wake of the Great Depression, Peruvian economists used every means at their disposal to protect the national economy, including decoupling the national currency, the libra, from the U.S. dollar, writing off debts owed to the United States, and imposing strict restrictions on the trade balance between imports and exports. \n\nHowever, the resulting imbalances also exposed serious shortcomings in local supply chains and business practices that will have to be addressed sooner or later if the country is to enter the modern industrial age."

 r56_PRU_peruvian_economy_dm_tt: "Modify §Y$r56_peruvian_economy_dm$§! by"

 r56_PRU_state_of_internal_politics_dm: "State of Internal Politics"
 r56_PRU_state_of_internal_politics_dm_desc: "A signature look of an union for the outsider, the internal struggle for power and recognition is a brewing pot full of intrigues, scandals and mutual distrust favoured with a spicy notes of compromises and concessions. The governmental positions are never solidified and a new emerging political power can always tilt the balance in favour of an opposite side. \n\nArmy officers looking for glory, oligarchs and rich families who amassed unprecedented amount of wealth over centuries of rule from the shadows, disgruntled natives who seek to mitigate the injusties of the past and young revolutionaries roaming the roads of our vast nations - all of them are ready to enter this struggle and fight for their rights and interests."

 r56_PRU_state_of_internal_politics_dm_tt: "Modify §Y$r56_PRU_state_of_internal_politics_dm$§! by"

 r56_river_port_system_state_modifier: "River Port System"
 r56_river_port_system_state_modifier_desc: "Rough terrain at this location allows only for the limited access via a system of river ports."
 r56_economic_favoritism_modifier: "Economic Favoritism"
 r56_economic_favoritism_modifier_desc: "This region enjoyed a plentiful of state investments and experiences a rapid development."
 r56_moderate_economic_inequality_modifier: "Moderate Economic Inequality"
 r56_moderate_economic_inequality_modifier_desc: "Our practices of focusing most of the investments into one industrial region left this area neglected."
 r56_severe_economic_inequality_modifier: "Severe Economic Inequality"
 r56_severe_economic_inequality_modifier_desc: "Lack of investments hinders the developed of this region."
 r56_critical_economic_inequality_modifier: "Critical Economic Inequality"
 r56_critical_economic_inequality_modifier_desc: "Development of this state has been effectively halted by seemingly malicious governmental practices."
 r56_agitated_rural_communities_modifier: "Agitated Rural Communities"
 r56_agitated_rural_communities_modifier_desc: "Local peasants and farmers are encouraged to support the struggle in fight against the oppressors of the people!"
 r56_PRU_revolutionary_headquarters_modifier: "Revolutionary Headquarters"
 r56_PRU_revolutionary_headquarters_modifier_desc: "The revolutionary movement has established a stronghold in this region, entrenching their positions and preparing for a long-term struggle against the government."

