 PRU_project_lavalle_desc:0 "An initiative sponsored by $PRU_circle_name_lavalle$. $PRU_circle_project_help$"
 PRU_circle_compact_belaunde:0 "§G+8% Infrastructure§!\n§R+1% Civilian goods§!"
 PRU_patron_belaunde_desc:0 "Provincial cooperation and a younger civilian movement. Available from 1944, he can build support for a 1956 candidacy. Only one collaborator may hold this office; replacing them removes these modifiers."
 PRU_circle_dossier_belaunde:0 "§Y$PRU_circle_name_belaunde$§!\nTrust: [?PRU_trust_belaunde|0]/100 · Influence: [?PRU_influence_belaunde|0]/100\n\nFavours democratic government and public development. Available from 1944.\n\n§YWhen cooperative:§!\n§G+8% Infrastructure§!\n§R+1% Civilian goods§!\nAt 26–59 trust, favorable contributions are reduced. At 25 or less, these benefits are replaced by penalties.\n\n§YPersonal initiative:§! $PRU_project_belaunde$\n$PRU_circle_project_help$\n\n$PRU_circle_replacement_tt$"
 PRU_enlist_belaunde_desc:0 "$PRU_circle_dossier_belaunde$\n\nAppointment: §Y45 political power§!, §R8 legitimacy§! and a §Y90-day§! office cooldown. An occupied office also incurs the replacement consequences above."
