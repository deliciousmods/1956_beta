 peru.18.b:0 "Ureta will lead a reforming military cabinet."
 PRU_revolutionary_goverment:0 "Ureta Calls the General Staff"
 PRU_revolutionary_goverment_desc:0 "Ureta can use the authority of the established military leadership to sponsor a programme of national integration. This is an alternative to both the civilian succession and a personalist nationalist dictatorship."
 PRU_caudillismo_desc:0 "The military, civil and popular caudillos are intermediaries of government. Watch their trust and the power shown on the gauge. Appointments, demands and measures against a caudillo appear below."
 PRU_ureta_project:0 "Inner Circle Research Programme"
 PRU_saldias_project:0 "Inner Circle Research Programme"
 PRU_ravines_project:0 "Inner Circle Research Programme"
 PRU_churata_project:0 "Inner Circle Research Programme"
 PRU_arequipa_dialogue:0 "Hear the Opposition in Arequipa"
 PRU_arequipa_dialogue_desc:0 "Address the opposition before repression turns demonstrations into a national crisis. This opens a competitive 1950 contest even under a military government."
 PRU_election_1950:0 "The Election of 1950"
 PRU_election_1950_desc:0 "Choose whether to register the opposition or ratify the military government. Montagne can challenge Odría through a civilian electoral coalition; this is distinct from an early military succession."
 PRU_montagne_civilian_mandate:0 "Montagne and the Democratic League"
 PRU_montagne_civilian_mandate_desc:0 "An opposition victory must restore parliamentary government instead of replacing one personal dictatorship with another."
 PRU_independent_electoral_board:0 "An Independent Electoral Board"
 PRU_independent_electoral_board_desc:0 "Protect candidate registration and the count from the presidency after an opposition victory or a renewed civilian mandate. Constitutional institutions reduce patronage without giving the government unlimited political resources."
 PRU_prado_coexistence:0 "The Civilian Settlement"
 PRU_prado_coexistence_desc:0 "Prado can negotiate coexistence with APRA, while a surviving Bustamante government can renew its constitutional coalition. Either settlement exchanges greater stability for continuing social obligations."
 PRU_belaunde_cooperation:0 "Popular Cooperation"
 PRU_belaunde_cooperation_desc:0 "Belaúnde offers public works and local participation as an alternative to the older political bargains. Provincial organisation improves construction at a continuing political cost."
 PRU_lavalle_settlement:0 "National Unification"
 PRU_lavalle_settlement_desc:0 "Lavalle can build a conservative civilian settlement around legal guarantees and commercial confidence. The agreement stabilises the cabinet, but social concessions limit its resources."
 PRU_legalise_apra:0 "Bring APRA into Legal Politics"
 PRU_legalise_apra_desc:0 "Haya's organisation can negotiate legal participation with a democratic government. Its caudillo must already be part of the governing arrangement; legalisation is a bargain, not an automatic transfer of the presidency."
 PRU_apra_electoral_mandate:0 "An Electoral Mandate for APRA"
 PRU_apra_electoral_mandate_desc:0 "A legal party, an organised popular movement, a civilian guarantor and a credible government can negotiate a new electoral mandate. Before 1939 the foundations of that settlement must still be built."
 PRU_apra_workers_middle_classes:0 "Workers and the Middle Classes"
 PRU_apra_workers_middle_classes_desc:0 "Establish the social coalition behind Aprismo. A programme of labour protection, national development and provincial participation does not by itself imply Soviet alignment."
 PRU_apra_programme_congress:0 "Debate the American Programme"
 PRU_apra_programme_congress_desc:0 "The movement must decide whether continental solidarity means parliamentary cooperation or preparation for revolutionary confrontation. The congress can authorise a radical break, but doing so costs stability and legitimacy."
 PRU_apra_ballot_strategy:0 "The Ballot and the Social Contract"
 PRU_apra_ballot_strategy_desc:0 "Commit to competitive institutions and negotiated reform. Continental allies can still be gathered, but this mandate does not authorise revolutionary wars."
 PRU_apra_insurrectionary_strategy:0 "The Insurrectionary Mandate"
 PRU_apra_insurrectionary_strategy_desc:0 "Use the congress mandate to prepare revolutionary organisation. This is a costly alternate development of Aprismo, not its default ideology."
 PRU_continental_cadres:0 "Train the Continental Cadres"
 PRU_continental_cadres_desc:0 "Build the organisation and cadres needed to export a revolution. The movement now breaks with parliamentary Aprismo and adopts a revolutionary socialist government."
 PRU_our_revolution:0 "The American Congress"
 PRU_our_revolution_desc:0 "Create an independent forum for American cooperation. Organise sympathetic movements, invite governments and negotiate a continental compact. Revolutionary war requires a separate mandate."
 PRU_american_compact:0 "A Compact of American Republics"
 PRU_american_compact_desc:0 "Invite other American governments into a common organisation. Members retain their sovereignty; neither an invitation nor ideological sympathy grants Peru their territory."
 PRU_congress_defence_board:0 "A Continental Defence Board"
 PRU_congress_defence_board_desc:0 "Coordinate training and logistics among the republics. Sustaining a common staff has a political cost and does not replace the need for national institutions."
 PRU_federal_convention:0 "The Federal Convention"
 PRU_federal_convention_desc:0 "Agree how conquered or voluntarily associated territories may enter a wider federation. Integration requires ownership, effective control and local compliance; it is not an automatic reward for occupation."
 PRU_the_great_world_revolution:0 "The Great World Revolution"
 PRU_the_great_world_revolution_desc:0 "A continental organisation with a federal charter can now invite movements beyond the Americas, support revolutionary interventions and integrate its own territories. Expansion remains a process of diplomacy, war and negotiated administration."
 PRU_communal_citizenship:0 "Citizenship and the Communities"
 PRU_communal_citizenship_desc:0 "Guarantee representation, local languages and communal institutions within a republic. This alternative rejects both ethnic exclusion and a mandatory return to monarchy."
 PRU_land_arbitration:0 "Land and Local Courts"
 PRU_land_arbitration_desc:0 "Use public arbitration and communal land protection to carry reform into the provinces. Mobilisation improves, but negotiating the reform consumes political resources."
 PRU_andean_solidarity:0 "An Andean Solidarity Pact"
 PRU_andean_solidarity_desc:0 "Build regional influence through agreements with neighbouring republics. Indigenous emancipation can support diplomacy and mutual defence without requiring continental annexation."
 PRU_professional_nationalism:0 "The Professional National State"
 PRU_professional_nationalism_desc:0 "Ureta can place the officer corps and a trained army at the centre of national development. Professional formations cost more to train and cannot mobilise unlimited manpower."
 PRU_corporate_mobilisation:0 "The Corporatist Organisation"
 PRU_corporate_mobilisation_desc:0 "Flores requires a functioning political organisation before turning nationalist rhetoric into regional power. Industrial mobilisation comes at the cost of political flexibility."
 PRU_carlist_emigres:0 "The Carlist Exile Networks"
 PRU_carlist_emigres_desc:0 "A Peruvian court cannot recover Spain through genealogy alone. Organise émigré contacts and establish a political constituency for the claimant."
 PRU_atlantic_preparations:0 "Prepare the Atlantic Expedition"
 PRU_atlantic_preparations_desc:0 "Secure transport, naval training and a supply plan before attempting a European campaign. The procurement programme provides transports, not a free invasion fleet."
 PRU_spanish_compact:0 "A Charter for the Spanish Kingdoms"
 PRU_spanish_compact_desc:0 "Offer a constitutional settlement to supporters across the Atlantic. Legitimacy and a defined charter strengthen the claim; the Spanish government retains the choice to reject it."
 PRU_return_to_europe:0 "Return to Europe"
 PRU_return_to_europe_desc:0 "With Carlos on the throne and an expeditionary army ready, the court can press its claim to Spain. An independent Spain that refuses the claim can be brought under the Crown by force."
 PRU_cortes_of_the_two_shores:0 "The Cortes of Both Shores"
 PRU_cortes_of_the_two_shores_desc:0 "A transatlantic crown needs a settlement between its American and European territories. Consolidate representation and administration before making further dynastic demands."
 PRU_constitutional_republic:0 "Constitutional Government"
 PRU_constitutional_republic_desc:0 "A governing settlement with continuing obligations. This programme replaces the previous national political settlement."
 PRU_coexistence_programme:0 "The Coexistence Agreement"
 PRU_coexistence_programme_desc:0 "A governing settlement with continuing obligations. This programme replaces the previous national political settlement."
 PRU_popular_cooperation:0 "Popular Cooperation"
 PRU_popular_cooperation_desc:0 "A governing settlement with continuing obligations. This programme replaces the previous national political settlement."
 PRU_national_unification:0 "National Unification"
 PRU_national_unification_desc:0 "A governing settlement with continuing obligations. This programme replaces the previous national political settlement."
 PRU_apra_social_contract:0 "The Aprista Social Contract"
 PRU_apra_social_contract_desc:0 "A governing settlement with continuing obligations. This programme replaces the previous national political settlement."
 PRU_apra_revolutionary_coalition:0 "The Revolutionary Coalition"
 PRU_apra_revolutionary_coalition_desc:0 "A governing settlement with continuing obligations. This programme replaces the previous national political settlement."
 PRU_communal_land_settlement:0 "The Communal Land Settlement"
 PRU_communal_land_settlement_desc:0 "A governing settlement with continuing obligations. This programme replaces the previous national political settlement."
 PRU_professional_national_state:0 "The Professional National State"
 PRU_professional_national_state_desc:0 "A governing settlement with continuing obligations. This programme replaces the previous national political settlement."
 PRU_corporatist_state:0 "The Corporatist State"
 PRU_corporatist_state_desc:0 "A governing settlement with continuing obligations. This programme replaces the previous national political settlement."
 PRU_continental_cadres_idea:0 "Continental Cadres"
 PRU_continental_cadres_idea_desc:0 "Maintaining this institution requires political resources as well as national commitment."
 PRU_congress_defence:0 "The Continental Defence Board"
 PRU_congress_defence_desc:0 "Maintaining this institution requires political resources as well as national commitment."
 PRU_transatlantic_cortes:0 "The Cortes of Both Shores"
 PRU_transatlantic_cortes_desc:0 "Maintaining this institution requires political resources as well as national commitment."
 PRU_fernando_belaunde:0 "Fernando Belaúnde Terry"
 PRU_hernando_lavalle:0 "Hernando de Lavalle"
 peru.205.t:0 "The Election of 1956"
 peru.205.d:0 "The opening of civilian politics has produced competing programmes. Prado offers an agreement with the Apristas; Belaunde campaigns for popular participation and public works; Lavalle represents a conservative civilian settlement. An incumbent constitutional government may also seek renewal."
 peru.205.c:0 "Fernando Belaúnde and the democratic youth."
 peru.205.e:0 "Hernando de Lavalle and national unification."
 peru.206.a:0 "Ratify the Odria government."
 peru.206.b:0 "Recognise a victory for Montagne and the opposition."
 peru.206.t:0 "The Presidential Contest of 1950"
 peru.206.d:0 "The government must determine whether to admit the opposition led by Ernesto Montagne. Guarantees agreed before the campaign, or sufficient public legitimacy, make a competitive election possible. Without them, the military can ratify its own candidate."
 peru.207.a:0 "Negotiate a parliamentary social contract."
 peru.207.b:0 "Authorise preparations for a revolutionary break."
 peru.207.t:0 "The Aprista Programme Congress"
 peru.207.d:0 "Workers, provincial committees and the middle classes debate the next stage of Aprismo. A parliamentary social contract can broaden the movement. A mandate for revolutionary confrontation instead requires sacrificing part of that coalition and building an organisation capable of sustaining the struggle."
 peru.210.a:0 "Accept the invitation."
 peru.210.b:0 "We will retain our diplomatic independence."
 peru.210.t:0 "An Invitation to the American Congress"
 peru.210.d:0 "[From.GetName] proposes a common organisation for diplomacy and mutual defence. Membership preserves our government and territory. Refusing may increase tensions if the sponsors have embraced revolutionary intervention."
 peru.212.a:0 "Accept the proposed personal union."
 peru.212.b:0 "Reject the claimant."
 peru.212.t:0 "A Transatlantic Dynastic Proposal"
 peru.212.d:0 "A Peruvian court has built an exile network and prepared an Atlantic expedition in support of its claimant. It now proposes a personal union and a charter for the Spanish kingdoms. Accepting places our foreign policy under the claimant; rejecting preserves independence but may lead to a campaign to enforce the claim."
 PRU_american_congress:0 "The American Congress"
 PRU_american_congress_desc:0 "Organise sympathisers, seek voluntary allies and coordinate continental defence. A revolutionary mandate permits interventions after a diplomatic refusal. The Great World Revolution extends this organisation beyond the Americas."
 PRU_integrate_FROM_to_apra:0 "Integrate [FROM.GetName]"
 PRU_integrate_FROM_to_apra_desc:0 "Integrate an owned and fully controlled territory through a 90-day civil administration programme. Requires peace, at least 50 compliance and less than 15 resistance. At most three territories can be integrated at once. War or loss of control cancels the programme."
 PRU_integrate_FROM_to_ROOT:0 "Integrate [FROM.GetName]"
 PRU_integrate_FROM_to_ROOT_desc:0 "Integrate an owned and fully controlled territory through a 90-day civil administration programme. Requires peace, at least 50 compliance and less than 15 resistance. At most three territories can be integrated at once. War or loss of control cancels the programme."
 PRU_congress_organise_support:0 "Organise Congress Support in [FROM.GetName]"
 PRU_congress_organise_support_desc:0 "Fund local committees for 60 days. Contacts last two years and allow a diplomatic invitation even when governments differ. The programme promotes our ideology and improves relations; it does not transfer territory."
 PRU_congress_invite:0 "Invite [FROM.GetName] to the Congress"
 PRU_congress_invite_desc:0 "Offer faction membership to an independent government. It can accept or refuse; membership does not make it a subject."
 PRU_congress_intervention:0 "Prepare an Intervention in [FROM.GetName]"
 PRU_congress_intervention_desc:0 "After a diplomatic refusal, a revolutionary government may prepare a puppet war goal. This takes 60 days and does not declare war automatically. Existing alliances and guarantees still apply."
 PRU_reconvene_apra_congress:0 "Reconvene the Aprista Congress"
 PRU_reconvene_apra_congress_desc:0 "A crisis permits the movement to reconsider its mandate, provided it has not already committed to a parliamentary or insurrectionary strategy."
 PRU_enforce_dynastic_claims:0 "Enforce the Dynastic Claim against [FROM.GetName]"
 PRU_enforce_dynastic_claims_desc:0 "Prepare a campaign after Spain refuses the union, or against a holder of territories claimed by the restored crown. The decision grants a war goal after 60 days, costs legitimacy and does not declare war automatically."
 PRU_andean_solidarity_faction:0 "Andean Solidarity Pact"
 PRU_create_apra:0 "Organise the Aprista Committees"
 PRU_create_apra_desc:0 "Give the committees of Trujillo and the plantation districts permanent seats in the Aprista organisation."
 PRU_aprista_guerrilla:0 "Committees and Citizen Reserves"
 PRU_aprista_guerrilla_desc:0 "Extend the provincial organisation into a disciplined reserve network. Better mobilisation and supply replace the earlier committee spirit, with a continuing industrial cost."
 PRU_aprismo_desc:0 "An emerging movement seeking an agreement between workers, provincial organisations and the middle classes. Its eventual political programme remains to be decided."
 PRU_create_the_united_kingdom_of_spain_desc:0 "Ratify the transatlantic union after securing the European Spanish core territories for ourselves or our subjects. The crown adopts the United Kingdom of Spain title. Provincial integration remains a separate administrative programme."
 PRU_Apra_influence_desc:0 "Provincial committees support recruitment and government administration, but their organisation consumes industrial resources."
 PRU_Apra_influence_1_desc:0 "Citizen reserves and provincial committees share a single organisation. Better mobilisation and supply replace the earlier committee spirit."
 peru.16.a:0 "Give Haya and the Trujillo committees the mandate."
 peru.16.b:0 "Ravines and the Communist Party."
 peru.206.c:0 "Renew the surviving constitutional coalition."
 PRU_core_claim_territories_decision_desc:0 "Prepare dynastic campaigns and integrate claimed territories after establishing the Spanish union. Integration requires peace, ownership, local compliance and sustained civil administration."
 PRU_the_great_world_revolution_decision_desc:0 "The federal charter permits integration of our own American territories. A world congress extends the charter beyond the Americas. Local compliance and civil administration remain necessary in every province."
 PRU_circle_compact_ureta:0 "§G+4% Army org.§!\n§R+4% Training§!"
 PRU_circle_dossier_ureta:0 "§Y$PRU_circle_name_ureta$§!\nTrust: [?PRU_trust_ureta|0]/100 · Influence: [?PRU_influence_ureta|0]/100\n\nOpposes communist government; favours army preparation.\n\n§YWhen cooperative:§!\n§G+4% Army org.§!\n§R+4% Training§!\nAt 26–59 trust, favorable contributions are reduced. At 25 or less, these benefits are replaced by penalties.\n\n§YPersonal initiative:§! $PRU_project_ureta$\n$PRU_circle_project_help$\n\n$PRU_circle_replacement_tt$"
 PRU_circle_compact_saldias:0 "§G+6% Navy org.§!\n§R-2% Output§!"
 PRU_circle_dossier_saldias:0 "§Y$PRU_circle_name_saldias$§!\nTrust: [?PRU_trust_saldias|0]/100 · Influence: [?PRU_influence_saldias|0]/100\n\nDefends naval interests and opposes military supremacy over civil institutions.\n\n§YWhen cooperative:§!\n§G+6% Navy org.§!\n§R-2% Output§!\nAt 26–59 trust, favorable contributions are reduced. At 25 or less, these benefits are replaced by penalties.\n\n§YPersonal initiative:§! $PRU_project_saldias$\n$PRU_circle_project_help$\n\n$PRU_circle_replacement_tt$"
 PRU_circle_compact_odria:0 "§G+4% Attack§!\n§R-4% PP gain§!"
 PRU_circle_dossier_odria:0 "§Y$PRU_circle_name_odria$§!\nTrust: [?PRU_trust_odria|0]/100 · Influence: [?PRU_influence_odria|0]/100\n\nFavours an authoritarian or nationalist administration. Available from 1945.\n\n§YWhen cooperative:§!\n§G+4% Attack§!\n§R-4% PP gain§!\nAt 26–59 trust, favorable contributions are reduced. At 25 or less, these benefits are replaced by penalties.\n\n§YPersonal initiative:§! $PRU_project_odria$\n$PRU_circle_project_help$\n\n$PRU_circle_replacement_tt$"
 PRU_circle_compact_montagne:0 "§G+0.12 Daily PP§!\n§R-2% Stability§!"
 PRU_circle_dossier_montagne:0 "§Y$PRU_circle_name_montagne$§!\nTrust: [?PRU_trust_montagne|0]/100 · Power: [?PRU_influence_montagne|0]/100\n\n§YCivil intermediary§!: Montagne represents cabinet coordination in this gameplay abstraction, despite being a career officer. He was Education Minister at the start of 1936 and became head of the cabinet on 13 April.\n\n§YWhen cooperative:§!\n$PRU_circle_compact_montagne$\nAggression replaces his benefits with civil obstruction. He no longer shifts the Army–Navy balance.\n\n§YPersonal initiative:§! $PRU_project_montagne$\n$PRU_circle_project_help$\n\n$PRU_circle_replacement_tt$"
 PRU_circle_compact_prado:0 "§G+4% Construction§!\n§R+2% Civilian goods§!"
 PRU_circle_dossier_prado:0 "§Y$PRU_circle_name_prado$§!\nTrust: [?PRU_trust_prado|0]/100 · Influence: [?PRU_influence_prado|0]/100\n\nDefends civil finance and opposes communist government.\n\n§YWhen cooperative:§!\n§G+4% Construction§!\n§R+2% Civilian goods§!\nAt 26–59 trust, favorable contributions are reduced. At 25 or less, these benefits are replaced by penalties.\n\n§YPersonal initiative:§! $PRU_project_prado$\n$PRU_circle_project_help$\n\n$PRU_circle_replacement_tt$"
 PRU_circle_compact_bustamante:0 "§G+4% Stability§!\n§R-3% War support§!"
 PRU_circle_dossier_bustamante:0 "§Y$PRU_circle_name_bustamante$§!\nTrust: [?PRU_trust_bustamante|0]/100 · Influence: [?PRU_influence_bustamante|0]/100\n\nFavours democratic government and constitutional agreements.\n\n§YWhen cooperative:§!\n§G+4% Stability§!\n§R-3% War support§!\nAt 26–59 trust, favorable contributions are reduced. At 25 or less, these benefits are replaced by penalties.\n\n§YPersonal initiative:§! $PRU_project_bustamante$\n$PRU_circle_project_help$\n\n$PRU_circle_replacement_tt$"
 PRU_circle_compact_riva:0 "§G+0.10 Daily PP§!\n§R-2% Research§!"
 PRU_circle_dossier_riva:0 "§Y$PRU_circle_name_riva$§!\nTrust: [?PRU_trust_riva|0]/100 · Influence: [?PRU_influence_riva|0]/100\n\nFavours traditionalist or nationalist government. Available until October 1944.\n\n§YWhen cooperative:§!\n§G+0.10 Daily PP§!\n§R-2% Research§!\nAt 26–59 trust, favorable contributions are reduced. At 25 or less, these benefits are replaced by penalties.\n\n§YPersonal initiative:§! $PRU_project_riva$\n$PRU_circle_project_help$\n\n$PRU_circle_replacement_tt$"
 PRU_circle_compact_churata:0 "§G+3% Research§!\n§R-4% PP gain§!"
 PRU_circle_dossier_churata:0 "§Y$PRU_circle_name_churata$§!\nTrust: [?PRU_trust_churata|0]/100 · Influence: [?PRU_influence_churata|0]/100\n\nFavours communist or explicitly communal government and indigenous representation.\n\n§YWhen cooperative:§!\n§G+3% Research§!\n§R-4% PP gain§!\nAt 26–59 trust, favorable contributions are reduced. At 25 or less, these benefits are replaced by penalties.\n\n§YPersonal initiative:§! $PRU_project_churata$\n$PRU_circle_project_help$\n\n$PRU_circle_replacement_tt$"
 PRU_circle_compact_haya:0 "§G+8% Recruitable§!\n§R+2% Civilian goods§!"
 PRU_circle_dossier_haya:0 "§Y$PRU_circle_name_haya$§!\nTrust: [?PRU_trust_haya|0]/100 · Power: [?PRU_influence_haya|0]/100\n\nFavours democratic government, popular organisation and social commitments. Aprismo is not automatically communism.\n\n§YWhen cooperative:§!\n§G+8% Recruitable§!\n§R+2% Civilian goods§!\nAt 40 trust or above they collaborate. Below 40 trust the spirit changes to two penalties.\n\n§YPersonal initiative:§! $PRU_project_haya$\n$PRU_circle_project_help$\n\n$PRU_circle_replacement_tt$"
 PRU_circle_compact_ravines:0 "§G+4% Output§!\n§R-3% Stability§!"
 PRU_circle_dossier_ravines:0 "§Y$PRU_circle_name_ravines$§!\nTrust: [?PRU_trust_ravines|0]/100 · Influence: [?PRU_influence_ravines|0]/100\n\nFavours communist government and organised labour. Available in this political role before 1945.\n\n§YWhen cooperative:§!\n§G+4% Output§!\n§R-3% Stability§!\nAt 26–59 trust, favorable contributions are reduced. At 25 or less, these benefits are replaced by penalties.\n\n§YPersonal initiative:§! $PRU_project_ravines$\n$PRU_circle_project_help$\n\n$PRU_circle_replacement_tt$"
