 PRU_patron_ureta:0 "$PRU_circle_name_ureta$ ? Military Caudillo"
 PRU_patron_ureta_desc:0 "A professional command built around infantry preparation. Army influence rises by 0.625 points each week. Only one collaborator may hold this office; replacing them removes these modifiers."
