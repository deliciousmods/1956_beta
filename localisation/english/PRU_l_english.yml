 PRU_movement_resentment:0 "Displaced Political Organisers"
 PRU_movement_resentment_desc:0 "The outgoing patron retains contacts outside government. This temporary obstruction lasts 90 days after dismissing an entrenched collaborator, or 180 days after dismissing a challenger. It does not stack with another obstruction from the same office."
 PRU_circle_filter_movement:0 "Popular"
 PRU_circle_filter_all:0 "All offices"
 PRU_circle_filter_help:0 "Filter appointments, negotiations and projects by office. General political decisions remain visible. These buttons only organise the decision list."
 PRU_circle_compact_jorge:0 "§G+0.08 Daily PP§!\n§R+1% Civilian goods§!"
 PRU_patron_jorge_desc:0 "A broker between conservative electoral organisations. His mediation can sustain a civilian candidacy. Only one collaborator may hold this office; replacing them removes these modifiers."
 PRU_circle_dossier_jorge:0 "§Y$PRU_circle_name_jorge$§!\nTrust: [?PRU_trust_jorge|0]/100 · Influence: [?PRU_influence_jorge|0]/100\n\nFavours constitutional civilian government.\n\n§YWhen cooperative:§!\n§G+0.08 Daily PP§!\n§R+1% Civilian goods§!\nAt 26–59 trust, favorable contributions are reduced. At 25 or less, these benefits are replaced by penalties.\n\n§YPersonal initiative:§! $PRU_project_jorge$\n$PRU_circle_project_help$\n\n$PRU_circle_replacement_tt$"
 PRU_enlist_jorge_desc:0 "$PRU_circle_dossier_jorge$\n\nAppointment: §Y45 political power§!, §R8 legitimacy§! and a §Y90-day§! office cooldown. An occupied office also incurs the replacement consequences above."
 PRU_project_jorge_desc:0 "An initiative sponsored by $PRU_circle_name_jorge$. $PRU_circle_project_help$"
 PRU_circle_compact_villaran:0 "§G+3% Stability§!\n§R-0.05 Daily PP§!"
 PRU_patron_villaran_desc:0 "Constitutional guarantees and conservative reform. His project establishes judicial guarantees for the electoral process. Only one collaborator may hold this office; replacing them removes these modifiers."
 PRU_circle_dossier_villaran:0 "§Y$PRU_circle_name_villaran$§!\nTrust: [?PRU_trust_villaran|0]/100 · Influence: [?PRU_influence_villaran|0]/100\n\nFavours constitutional civilian government.\n\n§YWhen cooperative:§!\n§G+3% Stability§!\n§R-0.05 Daily PP§!\nAt 26–59 trust, favorable contributions are reduced. At 25 or less, these benefits are replaced by penalties.\n\n§YPersonal initiative:§! $PRU_project_villaran$\n$PRU_circle_project_help$\n\n$PRU_circle_replacement_tt$"
 PRU_enlist_villaran_desc:0 "$PRU_circle_dossier_villaran$\n\nAppointment: §Y45 political power§!, §R8 legitimacy§! and a §Y90-day§! office cooldown. An occupied office also incurs the replacement consequences above."
 PRU_project_villaran_desc:0 "An initiative sponsored by $PRU_circle_name_villaran$. $PRU_circle_project_help$"
 PRU_circle_compact_lavalle:0 "§G+3% Construction§!\n§R-3% PP gain§!"
 PRU_patron_lavalle_desc:0 "A conservative settlement available for the 1956 succession. His network supports a negotiated civilian opening. Only one collaborator may hold this office; replacing them removes these modifiers."
 PRU_circle_dossier_lavalle:0 "§Y$PRU_circle_name_lavalle$§!\nTrust: [?PRU_trust_lavalle|0]/100 · Influence: [?PRU_influence_lavalle|0]/100\n\nDefends civil business interests. Available from 1954.\n\n§YWhen cooperative:§!\n§G+3% Construction§!\n§R-3% PP gain§!\nAt 26–59 trust, favorable contributions are reduced. At 25 or less, these benefits are replaced by penalties.\n\n§YPersonal initiative:§! $PRU_project_lavalle$\n$PRU_circle_project_help$\n\n$PRU_circle_replacement_tt$"
