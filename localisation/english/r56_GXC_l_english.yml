GXC_chinese_armor: "Chinese Armor"
GXC_make_use_of_the_indochinese_route: "Make Use of the Indochinese Route"
GXC_supply_the_chinese_war_machine: "Supply the Chinese War Machine"
GXC_success_of_the_guangxi_system: "The Guangxi System's Success"
GXC_success_of_the_guangxi_system_desc: "The Guangxi System has proved its worth as a system capable of recruiting and deploying a substantial and powerful force. Let us rejoice in this!"
GXC_fasttrack_training_methods: "Fasttrack Training Methods"
GXC_fasttrack_training_methods_desc: "If we are to be victorious, we must be able to mobilize a vast amount of men in a short time. Thus, we must make a more efficient training system, allowing for us to train large amounts of men in a short time frame."
GXC_exalt_institutional_identity: "Exalt Institutional Identity"
GXC_exalt_institutional_identity_desc: "Our forces must know that they are nothing without their institutions. As such we are only victorious when we act together in accordance with each other and our units!"
GXC_all_must_fight: "All Must Fight"
GXC_all_must_fight_desc: "Our state will not stand if it is merely a couple of soldiers who fight, instead all of us must fight and resist the enemy, or we will not be able to win."
GXC_mobilization_through_militia: "Mobilization Through the Militia"
GXC_mobilization_through_militia_desc: "Mobilization is needed even without conscription. To do this, let us utilize our militia as a recruiting ground and motivate our men to not only form local defensive groups but also fight against our enemies!"
GXC_training_and_reorganization: "Training and Reorganization"
GXC_training_and_reorganization_desc: "Having learned from our first engagements with the enemy, it is time to give our troops a proper training and reorganization regimen to ensure that they do not fail."
GXC_towards_self_sufficiency: "Towards [ROOT.GetAdjective] Self-Sufficiency"
GXC_towards_self_sufficiency_desc: "A key principle we stand upon is self-sufficiency. This will ensure that no outside power is capable of dictating our Clique's affairs."
GXC_secure_our_own_resources: "Secure Our Resources for Ourselves"
GXC_secure_our_own_resources_desc: "The Central Government looks upon our resources with a greedy eye. Let us make sure they do not take them from us!"
GXC_self_sufficiency_achieved: "Self-Sufficiency Achieved"
GXC_self_sufficiency_achieved_desc: "We have finally done it! We have reached a state of self sufficiency where we are no longer dependent on any foreign power!"
GXC_deal_with_the_refugees: "Deal with the Refugee Situation"
GXC_deal_with_the_refugees_desc: "With the refugee crisis on our hands, we must take action and deal with them now, lest they become and excessive burden."
GXC_combine_the_school_and_militia_systems: "Fully Combine School and Militia Systems"
GXC_combine_the_school_and_militia_systems_desc: "School and Militia must be one system for our state to run at peak efficiency. Let us engrain this into our people."
GXC_school_or_training: "School or Training"
GXC_school_or_training_desc: "While this may hurt our militia building efforts, if we were to allow people to avoid service in the militia if they visit school instead, it would allow us to drastically increase the enrolled population and strengthen the education of our nation."
GXC_full_wartime_production: "Full Wartime Production"
GXC_full_wartime_production_desc: "With our state engulfed in a great conflict, it is time to mobilize everything for the war effort. No cost can be spared!"
GXC_new_industrial_projects: "Launch new Industrial Projects"
GXC_new_industrial_projects_desc: "If our economy is to grow long term, industrial projects are in the order. Let us launch them and ensure our success!"
GXC_develop_the_economy: "Develop the Economy"
GXC_develop_the_economy_desc: "A great part of our new politics is the construction of a stable economy. Let us get to this at once!"
GXC_mechanize_our_forces: "Mechanize Our Forces"
GXC_mechanize_our_forces_desc: "It is only with mechanization that we will truly enter into a new age, let us work fast to properly mechanize and thus enter into this new age of warfare!"
GXC_declare_the_adult_education_year: "Declare the Adult Education Year"
GXC_declare_the_adult_education_year_desc: "With the 6 Year Plan not having had sufficient results, we must declare an adult education year, allowing for us to invest heavily into the education of adults, to ensure that all can read, so that we may be a modern military province."
GXC_spearhead_the_party_opposition: "Spearhead the Party Opposition"
GXC_spearhead_the_party_opposition_desc: "With the dust of Liangguang Settled, it is time to spearhead the opposition faction of the KMT, aligning with our Goals and ambitions. Let us go about this as fast as possible!"
GXC_fortify_the_bastion: "Fortify the Bastion"
GXC_fortify_the_bastion_desc: "If Guangxi is to stand we must transform it into an unbreakable bastion, capable of resisting the fiercest of foes!"
GXC_glory_throughout_all_china: "Reap Glory Throughout China"
GXC_glory_throughout_all_china_desc: "With such a massive war breaking out, we must prepare to fight in all of China for all of China, let us prepare for this monumental task!"
GXC_entrench_guangxi_militarism: "Entrench Guangxi Militarism"
GXC_entrench_guangxi_militarism_desc: "Militarism is the key thing that props up our clique. Let us fully entrench it in the populous and build on it!"
GXC_towards_southern_military_dominance: "Dominate the Chinese Military Scene"
GXC_towards_southern_military_dominance_desc: "Our forces are capable of being some of the greatest in all of China. Let us entrench this sentiment and ensure that this continues on!"
GXC_utilize_traditional_conscription: "Utilize Traditional Conscription"
GXC_utilize_traditional_conscription_desc: "To field an army of proper size, we must utilize conscription. Though it may anger some people it is for the best and will bring our nation to greatness!"
GXC_rely_on_volunteer_units: "Rely on Volunteer Units"
GXC_rely_on_volunteer_units_desc: "Volunteer units are simply superior to the classic conscript. The soldiers are more motivated and disciplined and are willing to die for their country of their own free will!"
GXC_deal_with_the_opium_trade: "Address the Opium Trade"
GXC_deal_with_the_opium_trade_desc: "With the opium market having been radically transformed after the collapse of the official taxed trade, we must now decide how we wish to address the new version of this trade."
GXC_build_up_infrastructure: "Build Up Infrastructure"
GXC_build_up_infrastructure_desc: "All of China, including our part of it, has horrid infrastructure. As such, if we are to be a model for China to follow, let us be the first to change this!"
GXC_end_tax_evasion: "End Tax Evasion"
GXC_end_tax_evasion_desc: "Tax evasion is the last element of corruption that is running rampant in our nation. Let us crack down on this and ensure that we are truly corruption free!"
GXC_new_politics: "Introduce 'New Politics'"
GXC_new_politics_desc: "We must introduce a series of new politics if our state is to become a true model and an example to be emulated."
GXC_move_institutions_inland: "Move Institutions Inland"
GXC_move_institutions_inland_desc: "With war upon us, we must move our institutions inland, ensuring they do not fall into foreign hands!"
GXC_expand_reconstruction_efforts: "Redouble [GXC.GetAdjective] Reconstruction"
GXC_expand_reconstruction_efforts_desc: "The rebuilding of our hurt economy is of utmost importance, let us work as hard as we can to rebuild and restore what was lost!"
GXC_move_the_provincial_capital: "Move the Provincial Capital"
GXC_move_the_provincial_capital_desc: "While our current capital is indeed a great city, it is not ideally situated. As such, we shall move it to a new and better location, where it is far more secure and stable."
GXC_the_pearl_on_the_coast: "The Pearl on the Coast"
GXC_the_pearl_on_the_coast_desc: "Guangzhou has always been the most important City in Southern China, at least among those that are still Chinese. Let us invest in this great economic center and ensure that it allows us all to thrive!"
GXC_the_hidden_powerhouse: "The Hidden Powerhouse"
GXC_the_hidden_powerhouse_desc: "Not as well known as Nanning or Guangzhou, due to not being a capital and being much further away from the coast, Guilin is nonetheless an industrial giant of a city and packs quite the punch. As such let us capitalize on this and invest in it."
GXC_the_heart_of_guangxi: "The Heart of Guangxi"
GXC_the_heart_of_guangxi_desc: "Nanning, the heart and capital of Guangxi province has always been a key to our success, let us invest in it and its institutions!"
GXC_build_guangxi_revive_china: "Build Guangxi, Revive China"
GXC_build_guangxi_revive_china_desc: "If China is to be revived, we must find a place to start said revival in, we currently have some the best conditions to make our model province more than just a nice place, but rather turn it into a true model that all the other provinces can emulate."
GXC_put_officers_into_schools: "Put Officers into Schools"
GXC_put_officers_into_schools_desc: "Officers in our schools would kill two birds with one stone, not only would they be able to help ensure that we have a long term powerful army, but they would also stand in to ensure that the people are taught to read."
GXC_focus_on_proper_education: "Focus on Proper Education"
GXC_focus_on_proper_education_desc: "Education is the key to our nations survival. As such, we must invest all we can into making ourselves an educational powerhouse and must further resist the temptation to dilute this with excessive militarism."
GXC_towards_combined_arms: "Towards Modern Combined Arms Warfare"
GXC_towards_combined_arms_desc: "Combined arms warfare is a must have for any modern nation, as such we must jump on the bus to achieve it ourselves!"
GXC_a_focus_on_self_defense: "[GXC.GetAdjective] Self-Defense"
GXC_a_focus_on_self_defense_desc: "Self-Defense is a key part of our regime, we must entrench this principle as it allows us to secure our state against all the enemies around it."
GXC_a_true_fortress_city: "Construct the [GXC.capital.GetName] Fortress City"
GXC_a_true_fortress_city_desc: "If we are truly to survive a full onslaught, our capital must be forged into an impregnable fortress, capable of resisting even the most advanced armies!"
GXC_double_down_on_small_arms: "Double Down on Small Arms"
GXC_double_down_on_small_arms_desc: "Small Arms are what made our military the best Chinese army. We do not need fancy artillery, instead investing more into the usage and deployment of small arms and machine guns is what will lead us to victory!"
GXC_obtain_foreign_artillery: "Obtain Foreign Artillery"
GXC_obtain_foreign_artillery_desc: "A key issue we face is that we have no artillery of our own, as such, we must try and get it from overseas sources in order to be able to enter into the new age of warfare."
GXC_invest_into_radios: "Invest into Radios"
GXC_invest_into_radios_desc: "With us having finally figured out how to produce our own radios, let us mass produce them and utilize them in our divisions, allowing for a new age of warfare to arrive!"
GXC_capitalize_on_military_genius: "Capitalize on Military Genius"
GXC_capitalize_on_military_genius_desc: "Some of our generals are considered the best of the best as far as Chinese generals go, let us capitalize on this and make use of their skills!"
GXC_modernize_the_military: "Modernize the Military"
GXC_modernize_the_military_desc: "Despite being the best in China, our military is highly out of date, as such we must work to bring it up to par with actually equipped armies."
GXC_expand_wartime_taxation: "Expand Wartime Taxation"
GXC_expand_wartime_taxation_desc: "With our economy headed towards higher and higher mobilization levels, it has become a necessity to expand wartime taxation in order to fund it all."
GXC_retreat_into_the_hills: "Retreat into the Hills"
GXC_retreat_into_the_hills_desc: "While we may not be able to beat the Japanese out in the open, we can retreat to the hills and beat them in favorable terrain!"
GXC_further_push_the_big_rear_plan: "Further Push the Big Rear Plan"
GXC_further_push_the_big_rear_plan_desc: "The big Rear Plan is the lynchpin of the Chinese Defense. As such we must push it with all we can to ensure our collective survival and continued resistance against Japan."
GXC_bunker_down_by_the_coast: "Bunker Down by the Coast"
GXC_bunker_down_by_the_coast_desc: "To survive an attack from up north, we must bunker down by the coast, near our key cities and near foreign supplies."
GXC_full_self_reliance: "Towards Full Self-Reliance"
GXC_full_self_reliance_desc: "Our state cannot stand if it depends on others to thrive, therefore we must stand for full self-reliance. We must make the most out of our resources and ensure that we have first dibs on them!"
GXC_cooperate_with_the_nrc: "Cooperate with the NRC"
GXC_cooperate_with_the_nrc: "The National Resource Commission is a key organization in distributing resources through China. If we were to work with them it would allow China easier access to our industry, which they desperately need. Furthermore it would allow for us to have economic growth and better utilize our own resources!"
GXC_our_own_military_industry: "[GXC.GetAdjective] Military Industry"
GXC_our_own_military_industry_desc: "If we are to thrive, we must build up our own military industry in order to truly stand a chance against the central government or the Japanese..."
GXC_enshrine_guangxi_autonomy: "Enshrine Guangxi Self-Government"
GXC_enshrine_guangxi_autonomy_desc: "Guangxi must stay separate from the central government and its Chiangist stooges! Instead of bowing to them we will strive for self-government and resist any attempts to subdue us!"
GXC_enshrine_guangxi_autonomy_tt: "§Y[CHI.GetNameDefCap]§! will lose all decisions to subjugate or integrate us."
GXC_win_naval_access: "Win Naval Access"
GXC_win_naval_access_desc: "With our great participation in the defense of the nation, we have won the right to reclaim a strip of coast allowing for us to have naval access and thus have our economy flourish!"
GXC_import_goods_by_sea: "Import Goods by Sea"
GXC_import_goods_by_sea_desc: "With us having secured naval access, we may as well use it to import foreign goods and export our own, allowing for us to have a new age of economic prosperity!"
GXC_prepare_a_second_anti_chiang_coalition: "Prepare a Second Anti-Chiang Coalition"
GXC_prepare_a_second_anti_chiang_coalition_desc: "The first anti-Chiang coaltion was a failure as the central plains war was lost by the northern warlords in the coalition. The South, however, was a stunning success. If we were to launch another central plains war and keep the power base in the south, we could perhaps change this..."
GXC_build_up_the_southern_bastion: "Consolidate the Southwest Bastion"
GXC_build_up_the_southern_bastion_desc: "We can only rely on the little land controlled by the political affairs council if we are to restore stable governance. As such, let us focus on this area and consolidate it."
GXC_secure_guangxi_loyalties: "Secure Guangxi Loyalties"
GXC_secure_guangxi_loyalties_desc: "The support of the Guangxi Clique is paramount to the survival of the Soutwest Polticial Affairs Council. As such, we must fully secure it in order to ensure our survival."
GXC_aftermath_of_the_liangguang_incident: "Aftermath of the Liangguang Incident"
GXC_aftermath_of_the_liangguang_incident_desc: "The Guangxi Clique is now the only survivor of what was once the Southwest Political Affairs Council. We must now tread carefully to prevent full assimilation into the nationalist government."
#GUI related
r56_chinese_gui_liangguang_crisis_1: "§OLiangguang Crisis Brewing...§!"
r56_chinese_gui_liangguang_crisis_1_delayed: "The final bastion of the old right of the §2KMT§!, the §YSouthwest Political Affairs Council§! and its twin provinces of §YGuangxi§! and §YGuangdong§!, collectively referred to as 'Liangguang', or 'Two Guangs' are in a precarious state, especially as their nominal leader, §YHu Hanmin§!'s health is waning as he sits in exile.\n\nShould his illness lead to his death, many experts fear that a crisis could encapsulate the two provinces, that may perhaps lead to the collapse of the §YSouthwest Political Affairs Council§!...\nEither way, we should be poised to act should it come to that point..."
r56_chinese_gui_liangguang_crisis_2: "§tLiangguang Crisis!§!"
r56_chinese_gui_liangguang_crisis_2_delayed: "The final bastion of the old right of the §2KMT§!, the §YSouthwest Political Affairs Council§! and its twin provinces of §YGuangxi§! and §YGuangdong§!, collectively referred to as 'Liangguang', or 'Two Guangs' are in chaos and collapse, as their leader §YHu Hanmin§! has died in exile.\n\nThis has brought forth a crisis in which the southern §2KMT§! warlords once again face off with their longstanding enemy of §YChiang Kai-Shek§!, hoping to if not depose §YChiang§!, at least not have the last bastion of the old right be snuffed out as the central government moves to usurp the power vacuum left by §YHu Hanmin§!'s death...\nWe must now act swiftly if we are to be proven victorious..."
