#events
GXC_event.1.t: "Chen Jitang Flees for Hong Kong"
GXC_event.1.desc: "With the ultimatum from Nanjing and the Guangxi Clique having switched to a pro-Nanjing stance, Chen Jitang's position has collapsed. Rather than try and fight to the bitter end and spill his and his men's blood senselessly, the man has fled to british controlled Hong Kong.\n\nWith this, the Southwest Political Affairs Council has officially collapsed. Forces loyal to the central government have gobbled up the Guangdong clique, while Guangxi has broken away and become its own state, with Li Zongren steering the Clique away from the Political Affairs Council into a turbulent future."
GXC_event.1.a: "Let us hope that Li has hedged his bets well..."

GXC_event.2.t: "The Guangxi Clique Requests Naval Access"
GXC_event.2.desc: "In the Liangguang Crisis, sparked by Hu Hanmin's death, Guangxi has begun to take more and more initiative in considering other alliances than Chen Jitang's Guangdong Clique. Should we manage to break the two of them apart, then Guangdong is nigh sure to collapse.\n\nSeeing this, the Guangxi Clique has made some overtures towards us. While they have yet to promise alignment, they have hinted that official recognition of Nanlu as part of Guangxi would go a long way to convincing them to change sides and betray Chen Jitang, giving us the rest of Guangdong Province...."
GXC_event.2.a: "A small strip of land is all they want? Sure!"
GXC_event.2.b: "Without a full promise that is impossible."

GXC_event.3.t: "The Guangxi Clique Pledges Support"
GXC_event.3.desc: "In light of recent tensions between us and Chen Jitang, the Guangxi Clique has decided to pledge full support to the Nanjing Government, destroying any base of legitimacy the Southwest Political Affairs Council has. As such, we are pleased to announce that Chen Jitang's fall is inevitable!"
GXC_event.3.a: "They have made the right choice!"

GXC_event.4.t: "Chiang Demands Guangdong Subjugation"
GXC_event.4.desc: "With the NRA in position to crush Guangdong, Chiang has decided to demand our subjugation including the integration of all our forces into the main NRA. As such, tensions have risen to a new height, and it appears war is about to break out, at least if the Southwest even withstands the internal stresses..."

GXC_event.5.t: "[GXC.GetLeader] Proposes a Second Anti-Chiang Coalition"
GXC_event.5.desc: "In lieu of rising tensions in the south, the Guangxi and Guangdong Cliques have proposed a second anti-Chiang coalition. This should on one hand reduce centralization and on the other bring back the true form of the three principles instead of the perversion created by Chiang Kai-Shek. In their preparations for this Coalition, [GXC.GetLeader] has invited us to join their secret alliance of warlords."
GXC_event.5.a: "We shall ready for war against Nanjing!"
GXC_event.5.b: "We already failed once, it would be devastating to fail again..."