 CZE_finish_the_tvp_project_desc: "The TVP project is an ambitious tank development program aimed at combining the best aspects of [GER.GetAdjective], [ENG.GetAdjective], [SOV.GetAdjective] and [ROOT.GetAdjective] designs."
 CZE_acquire_soviet_tanks: "Acquire [SOV.GetAdjective] Tanks"
 CZE_acquire_soviet_tanks_desc: "Our close alignment with [SOV.GetNameDef] means we should not be wasting our time trying out brand new tank designs, when our ally is already mass producing their own cutting-edge designs."
 CZE_continue_producing_german_designs: "Continue Producing German Designs"
 CZE_handle_the_communist_power_grab: "The Communist Police Crisis"
 CZE_five_year_plan: "The Five Year Plan"
 CZE_five_year_plan_desc:0 "It is an unfortunate reality that much of the nation is poorly, if at all industrialized. Strong central action will be needed from Prague to curb the economic divide before it tears our union apart."
 CZE_currency_reform: "Currency Reform"
 CZE_collectivize_key_industries: "Nationalize Key Industries"
 CZE_collectivize_key_industries_desc:0 "Czechoslovakia's industrial elite have profited for far too long exploiting the industrialization of the Czech and German-speaking regions of the country. An aggressive program of nationalization will bring popular support to our government, and demolish the tainting of capitalist industrialists in our government."
 CZE_suppress_the_church: "Suppress the Church"
 CZE_suppress_the_church_desc:0 "Catholicism in our nation has been one of the greatest roadblocks to social progress in our nation. If we are to become a modern nation with a uniquely brilliant population, heavy-handed state atheism will be needed to foster a new revolutionary society!"
 CZE_collectivize_farms: "Collectivize Farms"
 CZE_collectivize_farms_desc:0 "Czechoslovakia's agrarian regions, which are primarily in Slovak lands, have been used as tools of the elite at the expense of our national progress. By moving to economically centralize this sector of our economy, we can bring all of the nation forward!"
