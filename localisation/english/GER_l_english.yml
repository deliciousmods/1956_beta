#landmark
 landmark_die_neue_wache: "Die Neue Wache"
 landmark_die_neue_wache_desc: "Originally constructed in 1818 by the Prussian Karl Friedrich Shinkel as a Liberation War memorial and a guardhouse for the Royal Palace, but later destroyed by bombing during our last war, the Neue Wache has been rebuilt as the Central Memorial of [ROOT.GetNameDef] for the Victims of War and Tyranny. This monument serves to warn us of the dangers of war and tyranny while at the same time seeking to honor the soldiers who have fought and died in opposition to these two forces of evil."
 landmark_kaiser_wilhelm_institutes: "The Kaiser Wilhelm Institutes"
 landmark_kaiser_wilhelm_institutes_desc: "Established in 1915, the Kaiser Wilhelm Institute are the pinnacle of global science, having been at the forefront of all sorts of development, most notably Atomic Fission. In recent years, we have taken great efforts to free these of Nazi Influence and Greatly Expand them in order to return Germany to what it once was!"
 landmark_karl_marx_cultural_center: "Karl Marx Cultural Center"
 landmark_karl_marx_cultural_center_desc: "Karl Marx has been the harbinger of communism. As such, the German government has built a cultural institute in his honor and in the honor of the liberation of our workers. It has been placed on his birthplace and home town of Trier. This institute now serves as both a monument of the global communist Revolution and as a institute for the education of our people and the establishment of a new German culture."
