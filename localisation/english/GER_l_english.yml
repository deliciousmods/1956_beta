 GER_state_of_the_union_desc: "The [GER_cvu_scripted_name] is quite the unstable party, considering it is the union of the §gDNVP§! and the §2Zentrum§! and fully carries over this rift, often acting as two separate parties rather than one, each striving to control the union and ready to break away should the union prove to cause more harm than good.\n\nThe Current Stability of the Union is: §Y[?DVU_stability]§!, with the party collapsing should it reach §R0§!\n\nThe Current Balance of Power in the Union is: §Y[?DVU_bop]§!, with negative numbers representing §gDNVP§! control and positive §2Zentrum§! control."
