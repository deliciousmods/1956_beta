 r56_ger_naval_treaty:0 "[ENG.GetAdjective]-[GER.GetAdjective] Naval Treaty"
 r56_ger_naval_treaty_desc:0 "Recent talks with [ENG.GetNameDef] has largely loosened the naval restrictions upon us dictated by the Treaty of Versailles, thus allowing us to massively increase our naval capacity. However, restrictions do still exist upon our naval production and will remain to do so until we take the step to liberate our navy of the treaty entirely."
 r56_GER_four_year_plan:0 "The Four Year Plan"
 r56_GER_four_year_plan_upgrade:0 "The Perpetual Four Year Plan"
 r56_GER_four_year_plan_desc:0 "§WEntering an§! §ROffensive War§! §Wwith a§! §YMajor Power§! §RRemoves§! §Wthis§! §YNational Spirit§!\n"
 GER_coerce_the_technocrats:0 "Coerce the Technocrats"
 r56_GER_four_year_plan_upgrade_tt:0 "§Y$r56_GER_four_year_plan$ National Spirit§! becomes permanent and will not longer be removed upon §REntering an Offensive War§!§W.§!"
 GER_coerce_the_technocrats_desc:0 "Many businessmen and their partners, the so-called Technocratic class hate doing business and research under our current government. This potential fifth column must be destroyed before it has the chance to destroy us from within. The technocratic class will bend to our will and help our efforts to develop our country. One way or the other."
 r56_GER_coerce_the_technocrats_idea:0 "Coerced Technocrats"
 r56_GER_coerce_the_technocrats_idea_desc:0 "The business and technocratic class will bend to our will. We'll give them no choice!"
 GER_coerce_the_technocrats_tt:0 "When the Focus §Y$GER_institute_price_controls$§! is §YCompleted:§!"
 r56_GER_economic_uncertainty:0 "Economic Uncertainty"
 r56_GER_economic_uncertainty_desc:0 "The Industrialists are anxious about the economic choices that the government has to make. Choosing whether to keep or scrap the MEFO Bills scheme for another growth scheme would ease these market anxieties about our economy at home and internationally."
 r56_ger_ersatz_idea_1:0 "Ersatzmaterialien"
 r56_ger_ersatz_idea_1_desc:0 "The economy is not getting access to all the materials it needs from international trade. We must use what we have to make substitutions."
 
 

