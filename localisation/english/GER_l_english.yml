 GER_pressure_LIT: "Pressure [LIT.GetName]"
 GER_pressure_LIT_desc: "[LIT.GetNameDefCap] has developed a heavy reliance on [ROOT.GetName] for its food trade after the loss of its Klaipéda port, threatening to close this line of trade gives us significant leverage over them."
