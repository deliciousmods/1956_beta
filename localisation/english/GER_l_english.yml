 GER_the_enemies_of_democracy_desc: "Many Parts of the new German society would like to see the fall of the current democratic order. We have the far-right §9NRAF§! with the §LSA§! and the rightist §gFreikorps§! who are staunchly against anything they consider 'Socialist'. Then there are the §tKPD§! and their own militia, the §tAntifaschistische Aktion§!, who seek to destroy our structures and bring about a leftist Germany. \nThat is not all, however, as even some parts of the §gmilitary§! are displeased with the current state of democracy in Germany and seek to overthrow it...\n\n\n§gMilitary§! Opinion of the Government: §Y§Y[?GER_mil_opinion]§!§!\n§gMilitary§! Influence in Germany: §Y§Y[?GER_mil_inf]§!§!\n\n§tShould§! §gMilitary§! §tinfluence ever be above the§! §gMilitary§! §topinion, they will take action.§!"
