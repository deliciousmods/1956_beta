 GER_reichstag_warning: "*Note that all §YParties§! in §YGovernment§! will lose §R1§! polled §YSeat§! monthly, with the leading §YParty§! losing §R1§! extra."
 GER_no_gov_button_tt: "§tNO ACTIVE GOVERNMENT§!"
 GER_no_gov_button_delayed: "There currently is §tno§! government in Germany and the chancellor has no real power as he lacks any legislative backing..."
 GER_dnvp_button_tt: "§gDNVP§! Government"
 GER_dnvp_button_delayed: "The §gDNVP§! has managed to lead the new German government, providing the chancellor and being the key party in Germany's future."
 GER_dvu_button_tt: "[GER_cvu_scripted_name] Government"
 GER_dvu_button_delayed: "The [GER_cvu_scripted_name] has managed to lead the new German government, providing the chancellor and being the key party in Germany's future."
 GER_zentrum_button_tt: "§2Zentrum§! Government"
 GER_zentrum_button_delayed: "The §2Zentrum§! has managed to lead the new German government, providing the chancellor and being the key party in Germany's future."
 GER_nraf_button_2_tt: "§9Nationalrevolutionäre Arbeiterfront§!"
 GER_nraf_button_2_delayed: "Arguably heirs to the dissolved §9NSDAP§!, the §9Nationalrevolutionäre Arbeiterfront§! is a deeply divided political force, comprised of a hodge podge of §YOtto Strasser§! and his strasserists and left-§9NSDAP§! members, most notably §YViktor Lutze§! and his §YSA§!, along with numerous ex-§9NSDAP§! affiliated extremists. Should it rule, it is unclear if this tenuous alliance will hold or if it will devolve into bloodshed...\nThis party can roughly be summed up as left-nazis, advocating for a second revolution along state feudalist lines, although §YOtto Strasser§! and his camp share some further distinctions from mainline nazism. As such, the party, while fascistic in nature is prone to welcome much more fringe and even communist cooperation and individuals.\n\nIf smaller than them, this party is able to join §YCoalitions§! led by the §gDNVP§! \nFurthermore it may join §YCoalitions§! led by the §tKPD§! if §YTake a Stance on the Communists§! has led to their collaboration."
 GER_dnvp_button_2_tt: "§gDeutschnationale Volkspartei§!"
 GER_dnvp_button_2_delayed: "The heart of the German Right under §YAlfred Hugenberg§! until the §9NSDAP§! overtook it, the §gDeutschnationale Volkspartei§! has gained great influence in §YGermany§! since §YOperation Valkyre§!, with §YCarl Friedrich Goerdeler§! reforming it after its dissolving into the §9NSDAP§!, espcecially due to it's massive influence in said operation.\nWith the post civil war dissolving of the §9NSDAP§!, the §gDNVP§! now once again bears the banner of the German Right and seeks to bring back a strong monarchy and conservative moral order, be it under §YGoerdeler§! and his more moderate industrial conservatism or §YHugenberg§! and his almost fascistic agrarianism...\n\nIf smaller than them, this party is able to join §YCoalitions§! led by the §9NRAF§!, §2Zentrum§!, and §YLVP§!"
 GER_zentrum_button_2_tt: "§2Deutsche Zentrumspartei§!"
 GER_zentrum_button_2_delayed: "One of, if not the most important parties of the Weimar era, the §2Deutsche Zentrumspartei§! was initially created as a catholic party to preserve the interests of Catholics living in a protestant state. Though in recent years it has become a more broadly Christian party, it still primarily serves this goal. \nAs such, it has quite a broad spectrum of politicians, who have banded together in the name of common interest rather than a shared coherent ideology.\n\nIf smaller than them, this party is able to join §YCoalitions§! led by the §gDNVP§!, and §YLVP§! \nFurthermore it may join §YCoalitions§! led by the §RSPD§! if §YKonrad Adenauer§! does not lead the §2Zentrum§!."
 GER_dstp_button_2_tt: "§YLiberale Volkspartei§!"
 GER_dstp_button_2_delayed: "Liberalism has fallen far from the days of Bismarck, with the last liberal parties losing any semblance of political support by 1933. Now one party stands to undo this. Formed by the merger of the recently reestablished national liberal §YDVP§! and the center-left liberal §YDStP§!, the §YLiberale Volkspartei§! has since striven to bring liberalism back to the forefront of German politics. \nThe Brainchild of §YTheodor Heuss§!, this project for a united and strong liberal party must see if it can fulfill the legacy of its forefathers, most notably stresemann, who once guided the nation or if it will devolve into infighting and be overshadowed by its larger coalition allies. \nThe future offers much to gain and much to lose for this last desperate attempt at bringing political meaning to German liberalism.\n\nIf smaller than them, this party is able to join §YCoalitions§! led by the §gDNVP§!, §2Zentrum§!, and §RSPD§!"
 GER_spd_button_2_tt: "§RSozialdemokratische Partei Deutschlands§!"
 GER_spd_button_2_delayed: "The world's oldest social democratic party, the §RSozialdemokratische Partei Deutschlands§! has been a massive player in German politics. Singlehandedly having resisted §YOtto von Bismarck§! and his anti-Socialist laws, become the largest fraction of both Pre- and Post war Parliament, and having signed the treaty of Versailles.\nHaving resisted the §9NSDAP§! and its brutal regime, the §RSPD§! has returned as a force in modern German politics, seeking to once again come to power despite both the opposition of the new conservative order and an increasingly divided party, with democratic socialists under §YKurt Schuhmacher§! pushing the party along more and more radical lines than the dying §YOtto Wels§! would ever want. \n\nAs such, the party must act and act decisively, settling Wels' succession and uniting the party while dismantling the conservative order.\n\nIf smaller than them or banned from forming §YCoalitions§!, this party is able to join §YCoalitions§! led by the §YLVP§!, §2Zentrum§!, and §tKPD§!"
 GER_kpd_button_2_tt: "§tKommunistische Partei Deutschlands§!"
 GER_kpd_button_2_delayed: "The most staunch party of the Weimar era, the §tKommunistische Partei Deutschlands§! has greatly impacted German politics, sadly not just positively. \nDue to their Staunch Marxism-Lenninism, Stalinism, and uncompromising struggle for the working man, the §tKPD§! indirectly brought about Nazi rule, as their uncompromising nature brought about a negative majority and thus the failure of the Weimar republic. After that however, their hopes for a communist revolution were quickly dashed, as the Reichtagsbrandverordnung arrested their key politicians. \nHaving been recently legalized and now in the new §YReichstag§!, the §tKPD§! once more stands for it's stalinist values, though it has declared that it will work with any party that stands strongly for workers rights, in an attempt to prevent another §9NSDAP§! from rising and the §tKPD§!'s ranks from being purged once more...\n\nIf smaller than them, this party is at times able to join §YCoalitions§! led by the §RSPD§! \nFurthermore it may join §YCoalitions§! led by the §9NRAF§! if §YTake a Stance on the Communists§! has led to their collaboration."
 GER_dvu_button_2_tt: "§1Christliche Volksunion§!"
 GER_dvu_button_2_delayed: "Forged through a merger of the protestant national-conservative §gDNVP§! and the catholic federalist-conservative §2Zentrum§! during the German Civil War, the §1Christliche Volksunion§! has become the hegemon of the German Right, forming a united conservaitve, christian, and monarchist bloc.\nWhile nominally a union of equals, the party has in many ways fallen to factionalism along the lines of the constituent parties, with large criticism claiming that the party is merely a scheme for protestants to dominate the nation and for §YCarl Friedrich Goerdeler§! to consolidate his power. Due to this many political experts believe the party's collapse may be inevitable, and are placing bets on which faction will gain the most in the fallout... \nNevertheless, the initial concessions given to the §2Zentrum§! still hold the party together as it works to bring about its ideal for a united Christoconservative German Empire...\n\nIf smaller than them, this party is able to join §YCoalitions§! led by the §9NRAF§! or the §YLVP§!"
 GER_dvu_button_3_tt: "§1Deutsche Christkonservative Partei§!"
 GER_dvu_button_3_delayed: "Forged as the §1Christliche Volksunion§! through a merger of the protestant national-conservative §gDNVP§! and the catholic federalist-conservative §2Zentrum§! during the German Civil War, the §1Deutsche Christkonservative Partei§! has become the hegemon of the German Right, forming a united conservaitve, christian, and monarchist bloc.\nSince it's forming, the party has rallied further and further around §YCarl Friedrich Goerdeler§!, as he has become a new self styled Bismarck. Now the has ended the party's factionalism by entrenching §gDNVP§! dominance and uniting the nation around his person and national-conservative ideology.\nHaving solved its internal woes, the party now looks outward, seeking to establish a stranglehold on German politics and ensuring its permanent rule in the §YReichstag§!\n\nIf smaller than them, this party is able to join §YCoalitions§! led by the §9NRAF§! or the §YLVP§!"
 GER_dvu_button_4_tt: "§1Deutsche Christuspartei§!"
 GER_dvu_button_4_delayed: "Forged as the §1Christliche Volksunion§! through a merger of the protestant national-conservative §gDNVP§! and the catholic federalist-conservative §2Zentrum§! during the German Civil War, the §1Deutsche Christuspartei§! has become the hegemon of the German Right, forming a strong christoconservative bloc.\nTo the surpise of most political experts, after the party's formation, the §2Zentrum§! faction managed to take charge of it, turning a new page for the party and bringing about a sense of a united christendom above church lines, respecting the rights of protestants and catholics alike.\nHaving solved its internal woes, the party now looks outward, seeking to entrench Christian influence in Germany and build a new moral order. If this idealistic vision is able to prevent another 1933, only the future will tell...\n\nIf smaller than them, this party is able to join §YCoalitions§! led by the §9NRAF§! or the §YLVP§!"
