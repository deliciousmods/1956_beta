 GER_NVA_category_desc:0 "The Volksarmee was established after our victory in the civil war and is protecting this country, its people and the interests of the proletariat. It is the beacon of the socialist world in eastern and central europe. If we want the revolution to be protected or even expanded, we will have to handle the Volksarmee with great care but also with priority."
 GER_nva_institute_equal_service:0 "Institute Equal Service"
 GER_nva_institute_equal_service_desc:0 "The Revolution has succeeded and should involve every german equally. We therefore cannot continue the disallowance of women serving the military."
 GER_nva_military_exercise:0 "Order a Military Exercise"
 GER_nva_military_exercise_desc:0 "Although we have a strong standing army, it remains to be seen if it is effective in the field. We should start a large-scale military exercise to determine our military readiness."
