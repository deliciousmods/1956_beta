 GER_strong_arm_the_industrialists:0 "Strong Arm the Industrialists"
 GER_strong_arm_the_industrialists_desc:0 "We can 'suggest' to Industrialists that they take on loans as Mefo Bills instead of asking for loans from the Reichsbank. This way we can hide how much money the Reichsbank is loaning out to invest in heavy industry while at the same time gaining political leverage over the industrialists in our country. Taking on these private loans as Mefo Bills does run the risk of cannibalizing our economy, but such fears are unfound, right?"
 GER_rally_the_technocrats:0 "Rally the Technocrats"
 GER_rally_the_technocrats_desc:0 "Getting the Technocrats to support us is key to our future war efforts."
