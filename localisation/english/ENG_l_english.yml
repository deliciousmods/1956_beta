 ENG_embrace_royal_german_heritage: "Embrace Royal [GER.GetAdjective] Heritage"
 ENG_embrace_royal_german_heritage_desc: "For too long have we rejected our royal roots to [GER.GetNameDef], it is now time we drop the mask and return to the original and only real name of our royal house."

 ENG_speech_against_war: "Speech Against War"
 ENG_speech_against_war_desc: "The blood of our finest youth will not be spilled in vain due to foreign rabbles. Britain must remain at peace if Britain must endure. Our voice must be heard in every street. We demand peace! But we will be ready to defend our soil, to be armed against the foreign invaders. To those who claim that we want to cause trouble, to cause wars, we respond with one unanimous voice: Britain lives and marches on, in peace!"

