 ENG_royal_family_remnants: "Royal Family Remnants"
 ENG_royal_family_remnants_desc: "While most of the Royal Family was executed by those communist demons, there is always an heir, eager to get rid of this new rump parliament and restore the British throne."
 ENG_mi6_ns: "MI6"

 #Events

 britain.25.t: "The [ENG.GetName] proposes an alliance"
 britain.25.d: "With growing tensions around the globe and the world becoming a more dangerous place, the [ENG.GetAdjective] and the [FRA.GetAdjective] are the few remaining bastions of democracy in Europe, now [ENG.GetNameDef] has proposed an alliance between our two nations.\n\nHow should we reply?"
 britain.25.a: "United we stand."
 britain.25.b: "We don't need the [ENG.GetAdjective]."

 britain.26.t: "The [FRA.GetName] accepts our alliance"
 britain.26.d: "'History has shown how much can be accomplished when our great nations stand side by side. In the spirit of the Entente Cordiale, we are proud to welcome you not only as friends, but as Allies. Together we will be a shining beacon of liberty in a world encroached by the darkness of oppression!'\n\nOur request to join the [FRA.GetAdjective] has been accepted. We can count their full support in the turbulent times ahead."
 britain.26.a: "Together we will hold the line!"

 britain.27.t: "The [FRA.GetName] refuses our alliance."
 britain.27.d: "'While we have enjoyed good relations in the past, we cannot risk an escalation between us and the Germans on our border, should we find ourselves thrown into another conflict it will ensue another devastating war we can ill-afford. Peace must always be the goal of any democratic nation.'\n\nOur request to join the [FRA.GetAdjective] has been denied. The [FRA.GetAdjective] government is unwilling to to antagonize [GER.GetNonIdeologyName] further, and will not jeopardize the current peace."
 britain.27.a: "Their 'peace' is just another word for 'surrender'."

 britain.28.t: "[ENG.GetNameDefCap] seeks diplomatic reconciliation"
 britain.28.d: "[ENG.GetNameDefCap] has presented us with a pact of reconciliation with us despite our mutual destain for eachother. The [ENG.GetAdjective] have cited due to our mutual enemy it is vital that we learn to cooperate with eachother with a non-agression pact and to set aside our differences, for now."
 britain.28.a: "If that's what it takes."
 britain.28.b: "We have no interest in such deals."

 britain.29.t: "[SOV.GetNameDefCap] embraces diplomatic reconciliation"
 britain.29.d: "[SOV.GetNameDefCap] has agreed to our propsal of a reconciliation pact agreeing that our mutual enemy takes higher priority over any previous destain between our two nations, and they agree to cooperate with us in matters regarding them while also promising there will be no hostility between our two nations in the meantime."
 britain.29.a: "We'll have to work together, for now."

 britain.30.t: "[SOV.GetNameDefCap] rejects diplomatic reconciliation"
 britain.30.d: "[SOV.GetNameDefCap] has rejected to our propsal of a reconciliation pact and dismissed it readingly, citing that the mutual destain between our two nations will not allow any cooperation between us conducted in good faith. The [SOV.GetAdjective]s also seek no interest in promising there will be hostiliies between our two nations."
 britain.30.a: "They're just as bad as we thought."

 #Decisions

 ENG_weapons_purchases_category: "Purchase [USA.GetAdjective] Weapons"
 ENG_weapons_purchases_category_desc: "With our industry still playing catch-up, looking abroad for modern weapons might be the only way to bring our armed forces up to modern standards."
