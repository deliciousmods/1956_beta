#Country Stuff
 ENG_establish_the_colony_of_aden: "Establish the Colony of Aden"
 ENG_establish_the_colony_of_aden_desc: "The port of Aden is one of the most important in trade between India, Europe and the Far East. The Government of India Act 1935 included the transfer of control of this port directly to the Government of London, whereas it had previously been administered as a Chief Commissioner's province. The final preparations are now complete for the establishment of Aden as a separate colony."
#Focus
 # ENG_war_with_ussr: "Operation Unthinkable"
 uk_industrial_focus: "Expand Northern English Industry"
 uk_industrial_focus_desc: "Northern England was full of boomtowns during the Industrial Revolution. This glory is already disappearing in front of our eyes. \nLet's stop that!"
 uk_extra_tech_slot: "Support the Oxford University Research"
 uk_extra_tech_slot_desc: "The University of Oxford is our oldest and most prestigious university. Its research division can help our national security if we support it."
 ENG_tube_alloys: "Tube Alloys"
 ENG_tube_alloys_desc: "Physical equations show that the fission of uranium could release a gigantic quantity of energy. This could potentially lead to the creation of a bomb of almost inconceivable power."

 ENG_tank_variant_focus: "Develop Tank Variants"
 ENG_tank_variant_focus_desc: "Tanks can serve much more roles than direct combat. They can be made amphibious, be equipped with artillery pieces they can blast enemy defenses or become anti air platforms to secure the surrounding troops against air attacks."

 uk_naval_gunnery: "Naval Gunnery"
 uk_naval_gunnery_desc: "Improve the efficiency of our naval equipment to hit harder and rule the seas."
 ENG_admiralty_naval_staff: "Admiralty Naval Staff"
 ENG_admiralty_naval_staff_desc: "The Admiralty naval staff is the true core of our navy, an organization which can coordinate and influence the operation of our ships across the entire world."
 ENG_french_alliance: "French Alliance"
 ENG_french_alliance_desc: "Only [ROOT.GetNameDef] and the [FRA.GetNameDef] remain of the old Triple Entente with Russia forever changed. If history is doomed to repeat itself, we must ensure that these two nations, bastions of democracy and liberty in Europe, remain Allies."
 ENG_the_home_army: "The Home Army"
 ENG_the_home_army_desc: "As the threat of conflict on our homeland becomes ever more clear it is ideal we form a home militia mostly comprised of Great War veterans to slow down any foreign invaders in time for professional troops to reorganize and retaliate."
 ENG_special_operations_executive: "Special Operations Executive"
 ENG_special_operations_executive_desc: "Forming a dedicated department of our intelligence agency to assist foreign resistance organisations and infiltrate enemy institutions will greatly help us gain the upper hand and also in our future operations."
 ENG_reconciliation_with_ussr: "Reconciliation with the [SOV.GetAdjective]s"
 ENG_reconciliation_with_ussr_desc: "Despite our differences and mutual distain for eachother, [SOV.GetNameDef] presents a vital step in countering the greater threat posed against the world's peace. We must set aside our differences and learn to work together to achieve a common goal, for now."
 ENG_permit_plane_leasement: "Permit [SOV.GetAdjective] Plane Leasement"
 ENG_permit_plane_leasement_desc: "In our mutual war effort, leasing [SOV.GetNameDef] with planes will assist them in their fight against our common enemy."
 ENG_embargo_china: "Embargo China"
 ENG_embargo_china_desc: "" #TODO: Description
 ENG_influence_japan: "Influence Japan"
 ENG_influence_japan_desc: "" #TODO: Description
 ENG_conquer_guanxi: "Conquer Guanxi"
 ENG_conquer_guanxi_desc: "" #TODO: Description
 ENG_war_with_china: "War with China"
 ENG_war_with_china_desc: "" #TODO: Description

 ENG_london_pact: "London Pact"
 ENG_london_pact_desc: "It's only natural that the cause of the British Empire aligns with those of the Germans. We are a proud people and united, all will fear our triumph."
 ENG_german_military_cooperation: "German Military Cooperation"
 ENG_german_military_cooperation_desc: "The Germans have been preparing for war for quite some time and their general staff could teach us a thing or two."
 ENG_war_with_poland: "War with Poland"
 ENG_war_with_poland_desc: "We agree with the Germans that the Polish do not deserve their own state. Those lands would serve better under our influence."
 ENG_burn_french_liberty_works: "Burn French Literary Works"
 ENG_burn_french_liberty_works_desc: "For over a century the French have been spouting about liberty, and now they sympathize with the communists. We must actively promote Francophobia in the empire."
 ENG_war_with_france: "War with France"
 ENG_war_with_france_desc: "Fascism has not been able to gain strength in France. The liberal and communist ideals have too much strength, so it falls upon us to liberate the Frenchman from weakness."

 ENG_spanish_civil_war_involvement: "Spanish Civil War Involvement"
 ENG_spanish_civil_war_involvement_desc: "" #TODO: Description
 ENG_promote_new_officers: "Promote New Officers"
 ENG_promote_new_officers_desc: "" #TODO: Description
 ENG_agents_of_the_revolution: "Agents of the Revolution"
 ENG_agents_of_the_revolution_desc: "Cover operations are essential to protect the Revolution."
 ENG_enforced_economic_reorganization: "Economic Reorganization"
 ENG_enforced_economic_reorganization_desc: "" #TODO: Description
 ENG_heavy_industry_investment: "Develop the Heavy Industry"
 ENG_heavy_industry_investment_desc: "" #TODO: Description
 ENG_workers_brigades: "Workers Brigades"
 ENG_workers_brigades_desc: "The workers constitute the vanguard of the class conscious proletariat. They must be organized into militias in order to defend their work tools if need be."

 ENG_motorized_focus: "A Motorized Army"
 ENG_motorized_focus_desc: "Recently the Army has been experimenting with fully motorized infantry units. As yet, they have not formed any fully motorized divisions, but with the right words to the Secretary of State for War this could soon be possible."
 ENG_tank_focus: "Royal Tank Regiment"
 ENG_tank_focus_desc: "Britain invented the tank, and so the Royal Tank Regiment should be equipped with the world's best tanks, but this is not currently the case. The Special Vehicle Development Committee proposes to research and develop a modern design to keep Britain at the forefront of tank development."
 royal_ordinance_focus: "Royal Ordnance Factories"
 royal_ordinance_focus_desc: "The Royal Arsenal at Woolwich is woefully insufficient to produce all the munitions and small arms we need. We should establish many more factories around the country, preferably in relatively safe areas."

 #Archived - Those focuses could be added in the future
 ENG_army_innov: "Army Innovations"
 ENG_army_innov_desc: "In times of uncertainty or war the British Empire requires a first-rate military. There is no excuse for anything less."
 ENG_equipment_effort: "Equipment Effort"
 ENG_equipment_effort_desc: "Our soldiers need better weapons. For far too long we've been using outdated equipment that would be a liability in a war."
 ENG_capital_focus: "Capital Ship Production"
 ENG_capital_focus_desc: "We may have modern capital ships, but our production of them isn't where it could be. We should remedy this."
 ENG_escort_focus: "Escort Ship Production"
 ENG_escort_focus_desc: "We should focus our production on our escorts to defend both our warships and supply lines."
 ENG_improved_screen_ships: "Improved Screen Ships"
 ENG_improved_screen_ships_desc: "Warships are extremely vulnerable if not escorted properly. Having modern Destroyer and Cruiser vessels is mandatory."
 ENG_convoy_tactics: "Convoy Tactics"
 ENG_convoy_tactics_desc: "As an empire with many far-flung colonies and our reliance on their resources, we must ensure that our navy can defend our trade routes."

