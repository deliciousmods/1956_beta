 ENG_revolutionary_scientific_congress_desc: "The revolution offers the unique opportunity to allow the scientific and workers of the world to share their knowledge and eradicate the reactionary science called genetics."

 ENG_retake_the_african_jewel: "Retake the African Jewel"
 ENG_retake_the_african_jewel_desc: "An independent Egypt is a too great of risk for our Asian and African interests. They will be once again brought under our control."
 uk_egypt_focus: "Development in Egypt"
 uk_egypt_focus_desc: "The Egyptians lay at the heart of our interests in Africa and the Mediterranean, it is within in our best interest to make sure they have their own defensive capabilities while also keeping on good terms with them in case of a future conflict."

 ENG_take_the_reactionaries_out_of_their_nest: "Take the Reactionaries ouf of their Nest"
 ENG_take_the_reactionaries_out_of_their_nest_desc: "Take the Reactionaries ouf of their Nest"
 ENG_anti_american_rhetoric: "Anti American Rhetoric"
 ENG_anti_american_rhetoric_desc: "Anti American Rhetoric"
 ENG_liberate_the_american_workers: "Liberate the American Workers"

 ENG_welcome_british_exiles: "Welcome British Exiles"
 ENG_welcome_british_exiles_desc: "They are devastated by the events shaking Britain and have often lost everything but they never lost their talent..."
 ENG_recruit_volunteers: "Recruit Volunteers"
 ENG_recruit_volunteers_desc: "The Influx of British refugees brought a lot of people willing to fight to reconquer the land of their childhood rather than live overseas."
 ENG_british_agents: "British Agents"
 ENG_british_agents_desc: "Some of those refugees could become competent secret operatives."
 ENG_landing_exercices: "Landing Exercices"
 ENG_landing_exercices_desc: "Invading through the vastness of the see is not an easy task and we must be sure that we are prepared technologically, logistically and morally for this endeavour."
 ENG_reclaim_the_british_isles_exile: "Reclaim the [ENG.GetAdjective] Isles"
 ENG_reclaim_the_british_isles_exile_desc: "Revolutionaries have desecrated the monarchy and the parliament, bringing tyranny and misery onto the [ENG.GetAdjective] people. It is our duty as member of the Commonwealth to fight for the restoration of Britain. The rumour says that the king himself said that he was eager to "reclaim his birthright"."

 # New stuff
 ENG_northern_ireland_for_assistance: "[119.GetName] for Assistance"
 ENG_northern_ireland_for_assistance_desc: "With threats worldwide, it is not within our best interest to continue our border dispute with [IRE.GetNameDef]. Perhaps we can offer the disputed territory to the [IRE.GetAdjective] in return for them fully committing to assisting in our efforts."
 ENG_secure_ireland: "Secure [IRE.GetNonIdeologyName]"
 ENG_secure_ireland_desc: "An [IRE.GetNonIdeologyName] under hostile control or influence works as the perfect staging ground for attacks into our land borders, for which is completely unacceptable. We granted the [IRE.GetAdjective] their independence, but could just as easily take it away aswell."

 ENG_the_wartime_cabinet_committee: "The Wartime Cabinet Committee"
 ENG_the_wartime_cabinet_committee_desc: "Dire times are now upon us. We must take all the steps necessary to ensure that our forces are as organized and properly lead as possible."

 ENG_evacuate_colonial_assets: "Evacuate Colonial Assets"
 ENG_evacuate_colonial_assets_desc: "Now that our former colonies are on their way it is now time to return our investment on them."

 ENG_unify_the_isles: "Unify the Isles"
 ENG_unify_the_isles_desc: "[ROOT.GetNonIdeologyName] shall be one! Direct rule from London!"

 ENG_edward_viii: "Edward VIII"
 ENG_elisabeth_ii: "Elizabeth II"
 r56_eng.5.t: "The Death of Georges VI"
 r56_eng.5.desc: "Georges VI has died tragically. Leaving the nation in a deep state of sorrow. He who lead us through those trying years will be remembered fondly by the British people. It is now up to princess Elisabeth to take the succession and wear the Imperial State Crown. Let's hope that she will show the same abilities as Elisabeth and Victoria. Long live the Queen!"
 r56_eng.5.a: "Long Live the Queen"

 r56_eng.6.t: "The Future of Newfoundland in Question"
 r56_eng.6.desc: "With economic activities coming back in [NFL.GetNonIdeologyName], the question of its future has returned to the forefront. Back in the early 1930's, the country was hit hard by the great depression and asked for a return of direct British rule in exchange for financial relief. This event ended the era commonly known as the 'responsible government'. This debate, interrupted by the years of war is now resurfacing. The territory is now at the crossroad as it could either become its own dominion or be federated with Canada, which would in practice be an annexation in all but name."
 r56_eng.6.a: "The territory should be administered by Canada"
 r56_eng.6.b: "Restore the [NFL.getAdjective] Dominion"

 r56_eng.10.t: "Gilbert Stephenson"
 r56_eng.10.d: "When Gilbert Stephenson was retired (as a Rear Admiral) from the Royal Navy in 1929, he was one of their foremost experts in anti-submarine warfare. When war broke out again, he was called back to service. Despite his years (he was born in 1878), he remained fit, healthy and energetic, and had the capacity to apply his incisive mind to whatever the Admiralty saw fit to assign him to.\n\nHistorically, his key contribution was running the escort working-up facility at Tobermory (Tobermory Bay is pictured below with Stephenson), where he and his team put 911 ships through 1,132 training courses. He also played a role coordinating the evacuation of Dunkirk in 1940, as well as performed as a Commodore on a number of convoys very early in the war.\n\nTobermory under Stephenson's guidance played an important part in the Battle of the Atlantic, getting escorts out to sea quickly and with effective training. Stephenson's innovative but challenging techniques influenced the Royal Navy's post-war working-up procedures, while also earning him the nickname 'The Terror of Tobermory'."
 r56_eng.10.a: "Get Stephenson to set up Tobermory"
 r56_eng.10.b: "Give Stephenson a command at sea"

 ENG_for_the_good_of_the_revolution_idea: "For the Good of the Revolution"
 ENG_for_the_good_of_the_revolution_idea_desc: "All must be willing to make sacrifices in comfort for the good of the state. The [ROOT.getAdjective] people will keep their heads high in the face of rationing, confident that it will ensure our eventual victory."

 
 newsmod.3.t: "Germany Accepts British Empire Into Axis"
 newsmod.3.d: "This past year, ultra-nationalist fascist movements exploded in Britain. The democratic way of life has become a minority as the nation embraces fascism. What's more - the British have decided to join in an alliance with Hitler and the German Reich, threatening the stability of Europe. The Dominions have also been forced to join the Axis, but they are reluctant and feel the time has come to distance themselves from Britain...."
 newsmod.3.a: "A true turning point in our history!"
 newsmod.3.b: "We welcome our British friends!"
 newsmod.3.c: "We do not agree to this!"
 newsmod.3.e: "Worrying."

 
 englandmod.1.t: "England Asks To Join Axis"
 englandmod.1.d: "A representative from [ENG.GetName] has just arrived. [ENG.GetName] has recently undergone a strong ultra-nationalist movement and wishes to join The Reich and the Axis in guiding the future of the world."
 englandmod.1.a: "Accept"
 englandmod.1.b: "Refuse."
 englandmod.5.t: "The British Demand Our Annexation"
 englandmod.5.d: "A British delegate arrived in Dublin this morning. The effects of the ultra-nationalist movement in Britain has finally come to our doorstep, as London demands our immediate annexation. We don't know if the French or Americans will come to our defense, and have a tough decision to make."
 englandmod.5.a: "Give in to their demands."
 englandmod.5.b: "Fat chance."
 englandmod.6.t: "Ireland Gives In!"
 englandmod.6.d: "Our delegate from Dublin has arrived with fantastic news! The weak Irish have decided to accept our demand for their immediate Annexation. We can now move on to the next phase of our plan."
 englandmod.6.a: "They made a smart choice."
 englandmod.7.t: "Ireland Refuses Our Demands!"
 englandmod.7.d: "In a pathetic, final attempt at bravery, the foolish Irish government has refused our demand for annexation. What's more, they have decided to mobilize their armed forces in case of a British attack."
 englandmod.7.a: "Are they suicidal?"
 englandmod.8.t: "The British Propose An Alliance"
 englandmod.8.d: "A British delegate arrived in Lisbon this morning. If it wasn't clear enough already with their meddling with Spanish politics, they now seek to influence our own and offer us an alliance."
 englandmod.8.a: "We accept!"
 englandmod.8.b: "We will take no part in this."
 englandmod.9.t: "Portugal Accepts!"
 englandmod.9.d: "Portugal has accepted our alliance offer! Once again the Portuguese and British stand side by side against their adversaries!"
 englandmod.9.a: "Huzzah!"
 englandmod.10.t: "Portugal Refuses!"
 englandmod.10.d: "Portugal has refused our alliance offer! They have proven to be useless to us!"
 englandmod.10.a: "If you're not with us you're against us."
 englandmod.11.t: "The British Propose An Alliance"
 englandmod.11.d: "A British delegate arrived in Rome this morning. The British are starting to focus their efforts in the Mediterranean and would like to propose an alliance. While we don't want to antagonize them, if we agree to an alliance it could undermine some of our claims..."
 englandmod.11.a: "We accept!"
 englandmod.11.b: "No way."
 englandmod.12.t: "Italy Accepts!"
 englandmod.12.d: "Italy has accepted our alliance offer! Together we will share hegemony!"
 englandmod.12.a: "Huzzah!"
 englandmod.13.t: "Italy Refuses!"
 englandmod.13.d: "Italy has refused our alliance offer! They have proven to be useless to us!"
 englandmod.13.a: "If you're not with us you're against us."
 englandmod.14.t: "The British Propose An Alliance"
 englandmod.14.d: "A British delegate arrived in Warsaw this morning. The British expect that eventually the Germans will declare war on one of its neighbors, and they assume that will be us. They propose an alliance to deter the Germans from attacking, but we also feel like they will lead us down a dark path eventually...."
 englandmod.14.a: "We accept!"
 englandmod.14.b: "No way."
 englandmod.15.t: "Poland Accepts!"
 englandmod.15.d: "Poland has accepted our alliance offer! Together we will defeat the Germans!"
 englandmod.15.a: "Huzzah!"
 englandmod.16.t: "Poland Refuses!"
 englandmod.16.d: "Poland has refused our alliance offer! They have proven to be useless to us!"
 englandmod.16.a: "If you're not with us you're against us."
 englandmod.17.t: "British Alliance Offer"
 englandmod.17.d: "A British delegate arrived in Tokyo yesterday. It appears the British feel renewing the Japanese-Anglo alliance would serve both countries well. Could they also be considering a war with the United States?"
 englandmod.17.a: "We agree to renewing the alliance."
 englandmod.17.b: "We don't need them."
 englandmod.18.t: "The Japanese Accept!"
 englandmod.18.d: "Good news! Japan has accepted our alliance offer! With our combined might the Americans will surely fall!"
 englandmod.18.a: "Huzzah!"
 englandmod.19.t: "The Japanese Refuse!"
 englandmod.19.d: "Bad news! Japan has refused our alliance offer. Do they not realize the sleeping giant will soon wake?"
 englandmod.19.a: "It's their funeral."
 englandmod.20.t: "British Alliance Offer"
 englandmod.20.d: "A British delegate arrived in Caracas yesterday. It appears the British feel a military alliance between our two nations would be mutually beneficial. Could they also be considering a war with the United States?"
 englandmod.20.a: "We agree to join!"
 englandmod.20.b: "No thanks"
 englandmod.21.t: "Venezuela Accepts!"
 englandmod.21.d: "Good news! Venezuela has accepted our alliance offer! They will prove useful as a base from which to strike the western hemisphere."
 englandmod.21.a: "Huzzah!"
 englandmod.22.t: "Venezuela Refuses!"
 englandmod.22.d: "Bad news! Venezuela has refused our alliance offer. Do they not realize the sleeping giant will soon wake?"
 englandmod.22.a: "Whatever"
 englandmod.23.t: "The Status of English Fascism"
 englandmod.23.d: "Even though our former English overlords tried to push fascism on our country, we no longer have to tolerate such meddling. Should we get rid of the fascist influence that the British introduced to our country?"
 englandmod.23.a: "Yes, it's time to get rid of that silly ideology."
 englandmod.23.b: "No thanks, I rather like fascism."
 mtg_news.14.e: "The collapse of capitalism is inevitable!"

 
