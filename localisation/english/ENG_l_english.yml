 ENG_for_the_good_of_the_revolution_idea: "For the Good of the Revolution"
 ENG_for_the_good_of_the_revolution_idea_desc: "All must be willing to make sacrifices in comfort for the good of the state. The [ROOT.getAdjective] people will keep their heads high in the face of rationing, confident that it will ensure our eventual victory."

 mtg_news.14.e: "The collapse of capitalism is inevitable!"

