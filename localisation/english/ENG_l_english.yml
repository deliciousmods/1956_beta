 r56_britain.1.t: "Fascism alone can preserve the Peace!"
 r56_britain.1.desc: "Fascism means peace because fascism alone fights the true cause of war. A strong autarkic policy would enable to escape the unwinnable competition for markets that have caused so many wars. This is why peace and Empire are compatible. They go hand in hand as a way to ensure economic independence!"
 r56_britain.1.a: "We will prevent war!"

 r56_britain.2.t: "On Foreign Wars"
 r56_britain.2.desc: "Britons must fight for Britain only! The sight of the sons of Britain leaving our shores in order to die for foreign quarrels must become an entry if your history books. Britons must only fight for Britain and the defense of the Empire."
 r56_britain.2.a: "We will not die on foreign shores!"

 r56_britain.3.t: "British Military Exiles Demand Asylum"
 r56_britain.3.desc: "Former members of the British military fleeing the communists have arrived and are requesting asylum. Actually they could certainly serve our armed forces instead."
 r56_britain.3.a: "We always need experienced personel!"

 r56_britain.4.t: "Survivors of the Royal Family are Taking Refuge in our Country"
 r56_britain.4.desc: "Escaping from the tragic events which decimated the Royal Family, the survivors have requested to be able to establish themselves in our country, with the hope that they would one day be able to restore the monarchy in Britain."
 r56_britain.4.a: "This is not Westminster but we will do our best."

 r56_britain.5.t: "The Death of Georges VI"
 r56_britain.5.desc: "Georges VI has died tragically. Leaving the nation in a deep state of sorrow. He who lead us through those trying years will be remembered fondly by the British people. It is now up to princess Elisabeth to take the succession and wear the Imperial State Crown. Let's hope that she will show the same abilities as Elisabeth and Victoria. Long live the Queen!"
 r56_britain.5.a: "Long Live the Queen"

 r56_britain.6.t: "The Future of Newfoundland in Question"
 r56_britain.6.desc: "With economic activities coming back in [NFL.GetNonIdeologyName], the question of its future has returned to the forefront. Back in the early 1930's, the country was hit hard by the great depression and asked for a return of direct British rule in exchange for financial relief. This event ended the era commonly known as the 'responsible government'. This debate, interrupted by the years of war is now resurfacing. The territory is now at the crossroad as it could either become its own dominion or be federated with Canada, which would in practice be an annexation in all but name."
 r56_britain.6.a: "The territory should be administered by Canada"
 r56_britain.6.b: "Restore the [NFL.getAdjective] Dominion"

 r56_britain.7.t: "The Elections of [GetYear]"
 r56_britain.7.desc: "It has been 5 years since the last elections, and it would appear that once again it is time for the people of [ENG.GetNameDef] to vote for their government.\n\nIn the past years, the Labour Party has been a harsh critic of the Conservative's support for appeasement, with the Conservative Party defending their actions by claiming that [ENG.GetNameDef] was not ready to fight a war at the time. Otherwise, the parties' are following their usual campaigns, Labour's social democratic platform clashing against the Conservative's more right-wing policies.\n\nWho will the [ENG.GetAdjective] people decide fit to lead them?"
 r56_britain.7.a: "The Conservatives know what they are doing."
 r56_britain.7.b: "Labour will drive [ENG.GetNameDef] into the future!"

 r56_britain.8.t: "Wartime Elections?"
 r56_britain.8.desc: "5 years have passed since the last elections, and the time to vote has arrived. However, [ENG.GetNameDef] finds itself fighting a war against a major power, and many believe holding elections at this time would only serve to destabilize the nation during it's darkest hour.\n\nWhat should be done?"
 r56_britain.8.a: "The people have a right to be heard."
 r56_britain.8.b: "It can wait until we achieve victory."

 r56_britain.9.t: "[ENG.GetLeader] Wins [ENG.GetAdjective] Elections"
 r56_britain.9.desc.a: "It has been 5 years since the last [ENG.GetAdjective] elections, and yesterday the [ENG.GetAdjective] people once again went to the polls to decide the future of their government.\n\nAs the ballots have been counted, it appears that the Labour Party under Clement Atlee has secured power, promising to stand against appeasement and progress social reforms in [ENG.GetAdjective] society.\n\nTime will tell if the new [ENG.GetAdjective] government can hold on."
 r56_britain.9.desc.b: "It has been 5 years since the last [ENG.GetAdjective] elections, and yesterday the [ENG.GetAdjective] people once again went to the polls to decide the future of their government.\n\nAs the ballots have been counted, it appears that the Conservative Party under [ENG.GetLeader] has secured power, with it's campaign being the continuation of protectionist policies and the maintenance of the Empire.\n\nTime will tell if the new [ENG.GetAdjective] government can hold on."
 r56_britain.9.a: "A good show."
 r56_britain.9.b: "Will he differ from the previous administration?"

 r56_britain.10.t: "Gilbert Stephenson"
 r56_britain.10.desc: "When Gilbert Stephenson was retired (as a Rear Admiral) from the Royal Navy in 1929, he was one of their foremost experts in anti-submarine warfare. When war broke out again, he was called back to service. Despite his years (he was born in 1878), he remained fit, healthy and energetic, and had the capacity to apply his incisive mind to whatever the Admiralty saw fit to assign him to.\n\nHistorically, his key contribution was running the escort working-up facility at Tobermory (Tobermory Bay is pictured below with Stephenson), where he and his team put 911 ships through 1,132 training courses. He also played a role coordinating the evacuation of Dunkirk in 1940, as well as performed as a Commodore on a number of convoys very early in the war.\n\nTobermory under Stephenson's guidance played an important part in the Battle of the Atlantic, getting escorts out to sea quickly and with effective training. Stephenson's innovative but challenging techniques influenced the Royal Navy's post-war working-up procedures, while also earning him the nickname 'The Terror of Tobermory'."
 r56_britain.10.a: "Get Stephenson to set up Tobermory"
 r56_britain.10.b: "Give Stephenson a command at sea"

 r56_britain.11.t: "The British Demand Our Annexation"
 r56_britain.11.desc: "A British delegate arrived in Dublin this morning. The effects of the ultra-nationalist movement in Britain has finally come to our doorstep, as London demands our immediate annexation. We don't know if the French or Americans will come to our defense, and have a tough decision to make."
 r56_britain.11.a: "Give in to their demands."
 r56_britain.11.b: "Fat chance."

 r56_britain.12.t: "Ireland Gives In!"
 r56_britain.12.desc: "Our delegate from Dublin has arrived with fantastic news! The weak Irish have decided to accept our demand for their immediate Annexation. We can now move on to the next phase of our plan."
 r56_britain.12.a: "They made a smart choice."

 r56_britain.13.t: "Ireland Refuses Our Demands!"
 r56_britain.13.desc: "In a pathetic, final attempt at bravery, the foolish Irish government has refused our demand for annexation. What's more, they have decided to mobilize their armed forces in case of a British attack."
 r56_britain.13.a: "Are they suicidal?"

 r56_britain.14.t: "British Alliance Offer"
 r56_britain.14.desc: "A British delegate arrived in Tokyo yesterday. It appears the British feel renewing the Japanese-Anglo alliance would serve both countries well. Could they also be considering a war with the United States?"
 r56_britain.14.a: "We agree to renewing the alliance."
 r56_britain.14.b: "We don't need them."

 r56_britain.15.t: "The Japanese Accept!"
 r56_britain.15.desc: "Good news! Japan has accepted our alliance offer! With our combined might the Americans will surely fall!"
 r56_britain.15.a: "Huzzah!"

 r56_britain.16.t: "The Japanese Refuse!"
 r56_britain.16.desc: "Bad news! Japan has refused our alliance offer. Do they not realize the sleeping giant will soon wake?"
 r56_britain.16.a: "It's their funeral."

 r56_britain.17.t: "Archibald Wavell is Coming to India"
 r56_britain.17.desc: "The General Archibald Wavell has recently been promoted in order to command the British Indian Army, he should arrive in a few days."
 r56_britain.17.a: "Understood."

 r56_britain.19.t: "$ENG_winston_churchill$ Retires"
 r56_britain.19.desc: "After intensified health qualms, Sir $ENG_winston_churchill$ has retired as head of the Conservative Party, with $ENG_anthony_eden$ taking over his duties. Letting $ENG_winston_churchill$ retire in favor of $ENG_anthony_eden$ had been considered earlier, however the latter had himself been suffering from health issues."
 r56_britain.19.a: "He will be missed."

