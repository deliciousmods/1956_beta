 nauru_focus: "Nauru Focus Tree"

 NRU_commander_ridge_phosphate:0 "Command Ridge Phosphate Deposits"
 NRU_commander_ridge_phosphate_desc:0 "Command Ridge, or Peak Janor in Nauruan, is the highest point of the island. and most phosphate lies on it. \n \nPhosphate mining has been practiced by the European Powers on Nauru ever since it was occupied by Germany in the Nauruan Civil War.\nThe phosphate gives Nauru both benefits and downsides, which we have to make sure not extract too much or too little in order to not collapse the economy."
