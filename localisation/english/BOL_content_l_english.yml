l_english:
 bolivia.1.t:0 "The Power of the Landowners"
 bolivia.1.d:0 "Mine owners and rural patrons dominate the old republic. Their cooperation offers stability, but preserving their privileges will deepen the divide between the state and the countryside."
 bolivia.1.a:0 "Secure their cooperation."
 bolivia.1.b:0 "The republic must serve its people."
 bolivia.2.t:0 "Lessons of the Chaco"
 bolivia.2.d:0 "The officer corps must decide whether to protect its old hierarchies or listen to veterans whose experience was bought at terrible cost."
 bolivia.2.a:0 "Professional training must come first."
 bolivia.2.b:0 "Learn from the enlisted veterans."
 bolivia.3.t:0 "The Government Coup"
 bolivia.3.d:0 "Young officers and Chaco veterans attempt to overthrow Tejada Sorzano. Success brings David Toro to power. If the coup fails, Sorzano remains president and can disarm the political army, democratize the republic and seek Allied assistance."
 bolivia.3.a:0 "The coup succeeds. Toro takes power."
 bolivia.3.b:0 "The coup fails. Tejada Sorzano remains in office."
 bolivia.5.t:0 "A Second Attempt"
 bolivia.5.d:0 "A second uprising is ready. Choose the Falange under Oscar Unzaga or the indigenous movement under Santos Marka Tula. Our chosen movement takes power immediately, but republican loyalists will resist in the eastern lowlands. We retain most of the army and receive emergency reinforcements; a long war will drain public support."
 bolivia.5.a:0 "Unzaga and the Falange will lead the uprising."
 bolivia.5.b:0 "Santos Marka Tula will lead the indigenous revolution."
 bolivia.10.t:0 "Busch Takes the Presidency"
 bolivia.10.d:0 "The coalition behind Toro has fractured. German Busch now assumes the presidency, promising to defend Bolivia from both foreign dependence and the entrenched mining interests. The future of military socialism remains unsettled."
 bolivia.10.a:0 "A new chapter of the revolution."
 bolivia.11.t:0 "The End of the Busch Government"
 bolivia.11.d:0 "The death of German Busch has left the reform movement without its central figure. Carlos Quintanilla assumes provisional authority. The army must now choose between restoring civilian government and keeping power for itself."
 bolivia.11.a:0 "Establish a provisional government."
 bolivia.20.t:0 "The Fall of Villarroel"
 bolivia.20.d:0 "Strikes and a widening opposition coalition have overwhelmed the government. Villarroel has been killed, and a provisional civilian administration under Nestor Guillen is attempting to restore order before Tomas Monje can take office."
 bolivia.20.a:0 "The provisional administration must hold."
 bolivia.22.t:0 "The Monje Administration"
 bolivia.22.d:0 "Tomas Monje takes charge of the provisional government. Its immediate task is to organize elections and restore civilian institutions after the violence in La Paz."
 bolivia.22.a:0 "Prepare a civilian election."
 bolivia.21.t:0 "The Stolen Election"
 bolivia.21.d:0 "The MNR has won the largest share of the vote. The historical government transferred power to the military instead of permitting the constitutional process. A republic preserved through Sorzano\'s democratic route can choose to respect the result."
 bolivia.21.a:0 "The junta has closed the parliamentary road."
 bolivia.30.t:0 "Bolivia Requests a Pacific Settlement"
 bolivia.30.d:0 "Bolivia proposes a negotiated transfer of its former Litoral department in exchange for a long-term compensation program and an end to its other coastal claims. Accepting would restore Bolivian access to the Pacific, but surrender territory administered by Chile."
 bolivia.30.a:0 "Accept the settlement."
 bolivia.30.b:0 "Our frontier is not for sale."
 bolivia.31.t:0 "A Road Back to the Pacific"
 bolivia.31.d:0 "Chile has accepted the proposed settlement. The former Litoral department will return to Bolivian administration. Compensation will burden the budget for two years, and reintegration must still be organized before the coast can become a full part of the republic."
 bolivia.31.a:0 "Honor the agreement and reopen the ports."
 bolivia.32.t:0 "Chile Rejects the Settlement"
 bolivia.32.d:0 "The Chilean government has rejected our proposed coastal settlement. Diplomatic recognition of our ambitions will require a different approach; this refusal does not itself authorize a war."
 bolivia.32.a:0 "We will reconsider our policy."
 bolivia.40.t:0 "A Bolivian Request for Cooperation"
 bolivia.40.d:0 "Bolivia seeks Soviet equipment and training assistance. Its government presents the request as cooperation between socialist states rather than a demand for immediate military intervention."
 bolivia.40.a:0 "Send a limited military mission."
 bolivia.40.b:0 "We cannot make this commitment."
 bolivia.41.t:0 "Soviet Military Cooperation"
 bolivia.41.d:0 "The Soviet government has agreed to send an instructional mission and a limited shipment of small arms. Our officers will adapt this assistance to the conditions of the Andes."
 bolivia.41.a:0 "Put the mission to work."
 bolivia.42.t:0 "Our Request Is Declined"
 bolivia.42.d:0 "The Soviet government has declined our request for a mission. We must continue preparing our forces with the resources available at home."
 bolivia.42.a:0 "Continue the domestic program."
 bolivia.43.t:0 "An Invitation from Bolivia"
 bolivia.43.d:0 "Bolivia proposes a regional alliance founded on compatible governments and mutual defense. Joining would give La Paz a leading role in our foreign policy and involve us in the alliance obligations that follow."
 bolivia.43.a:0 "Join the Bolivian-led alliance."
 bolivia.43.b:0 "Preserve our independent foreign policy."
 bolivia.44.t:0 "Bolivian Support for the Chilean Left"
 bolivia.44.d:0 "Organizers across the border have offered support to Chilean workers and left-wing movements. We can allow the contacts or suppress them, at the cost of diplomatic friction with Bolivia."
 bolivia.44.a:0 "Permit the cross-border contacts."
 bolivia.44.b:0 "Close the channels of interference."
 bolivia.45.t:0 "Our Alliance Invitation Is Declined"
 bolivia.45.d:0 "The government we approached has declined membership in our regional alliance. There will be no forced accession: our diplomats must continue building trust."
 bolivia.45.a:0 "Respect their decision."
 BOL_rural_illiteracy:0 "Rural Illiteracy"
 BOL_rural_illiteracy_desc:0 "Most rural communities lack reliable access to schools. Expanding basic education and the universities is essential to building a modern state."
 BOL_rural_schools:0 "The Education Code"
 BOL_rural_schools_desc:0 "Rural schools, teacher training and a common educational framework are extending citizenship beyond the cities."
 BOL_reconstruction_inflation:0 "Revolutionary Reconstruction"
 BOL_reconstruction_inflation_desc:0 "Nationalization and rural reform have transformed the country, but disrupted output and fiscal deficits are placing the currency under strain."
 BOL_monetary_stabilization:0 "Monetary Stabilization"
 BOL_monetary_stabilization_desc:0 "Fiscal restraint and foreign assistance are stabilizing the currency. The program eases economic uncertainty but imposes political costs on the revolutionary coalition."
 BOL_workers_planning:0 "Workers' Reconstruction Plan"
 BOL_workers_planning_desc:0 "A single planning administration replaces the separate COB and FSTMB programmes. Public production and recruitment expand, but political administration and civilian consumption become more demanding."
 BOL_coastal_compensation:0 "Pacific Settlement Payments"
 BOL_coastal_compensation_desc:0 "Payments agreed with Chile place a temporary burden on civilian industry while the recovered coast is rebuilt."
 BOL_coastal_compensation_received:0 "Bolivian Compensation"
 BOL_coastal_compensation_received_desc:0 "Compensation under the Pacific settlement finances a limited civilian development program."
 BOL_foreign_training_mission:0 "Foreign Training Mission"
 BOL_foreign_training_mission_desc:0 "Foreign instructors assist our officers without taking command of Bolivia's armed forces."
 BOL_mining_survey:0 "Geological Survey Program"
 BOL_mining_survey_desc:0 "Engineers map deposits and improve extraction methods before expensive new projects are authorized."
 BOL_veterans_training:0 "Veterans' Training Courses"
 BOL_veterans_training_desc:0 "Experienced noncommissioned officers teach small-unit tactics and fieldcraft to the next intake of recruits."
 BOL_reintegration_administration:0 "Regional Reintegration"
 BOL_reintegration_administration_desc:0 "Civil servants, schools and local councils are preparing recently acquired territories for equal participation in the republic."
 BOL_bolivian_irredentism:0 "Bolivia and Its Neighbors"
 BOL_bolivian_irredentism_desc:0 "Diplomatic agreements and territorial reintegration must be backed by control, investment and a government capable of honoring its commitments."
 BOL_national_development:0 "Building the Republic"
 BOL_national_development_desc:0 "Education, professional training and geological surveys strengthen the institutions behind our national development."
 BOL_regional_diplomacy:0 "Andean Diplomacy"
 BOL_regional_diplomacy_desc:0 "Regional cooperation requires willing partners. Invitations can be refused, and territorial settlements impose costs on the government that negotiates them."
 BOL_reintegrate_litoral_department:0 "Reintegrate the Litoral Department"
 BOL_reintegrate_litoral_department_desc:0 "Local councils and public services will incorporate the region into Bolivia. The program takes six months and requires us to own and control the territory throughout."
 BOL_reintegrate_acre_state:0 "Reintegrate Acre"
 BOL_reintegrate_acre_state_desc:0 "Local councils and public services will incorporate the region into Bolivia. The program takes six months and requires us to own and control the territory throughout."
 BOL_establish_arica_department:0 "Establish the Arica Department"
 BOL_establish_arica_department_desc:0 "Local councils and public services will incorporate the region into Bolivia. The program takes six months and requires us to own and control the territory throughout."
 BOL_reintegrate_chaco:0 "Reintegrate the Chaco"
 BOL_reintegrate_chaco_desc:0 "Local councils and public services will incorporate the region into Bolivia. The program takes six months and requires us to own and control the territory throughout."
 BOL_integrate_andean_region:0 "Integrate [FROM.GetName]"
 BOL_integrate_andean_region_desc:0 "Bring an Andean region into the common institutions of the new state. Integration requires peace, ownership, low resistance and substantial local cooperation."
 BOL_embrace_plurinationalism:0 "Embrace Plurinationalism"
 BOL_embrace_plurinationalism_desc:0 "Recognize the republic as a shared political home for its many peoples. This grants a common national identity without automatically integrating conquered territory."
 BOL_negotiate_pacific_settlement:0 "Propose a Pacific Settlement"
 BOL_negotiate_pacific_settlement_desc:0 "Offer Chile a negotiated return of the Litoral department. Acceptance requires two years of compensation payments. Chile can refuse; a refusal does not automatically grant a war goal."
 BOL_review_coastal_refusal:0 "Prepare a Military Alternative"
 BOL_review_coastal_refusal_desc:0 "After the failure of negotiations, ask the government to authorize preparations for a territorial war. This requires an independent authoritarian government and carries a substantial political cost."
 BOL_found_andean_league:0 "Found the Andean League"
 BOL_found_andean_league_desc:0 "Create an independent regional alliance. Membership by neighboring states must be negotiated separately."
 BOL_invite_PRU:0 "Invite Peru to the League"
 BOL_invite_PRU_desc:0 "Send an invitation to Peru. Only an independent government with a compatible political system can accept."
 BOL_invite_ECU:0 "Invite Ecuador to the League"
 BOL_invite_ECU_desc:0 "Send an invitation to Ecuador. Only an independent government with a compatible political system can accept."
 BOL_invite_ARG:0 "Invite Argentina to the League"
 BOL_invite_ARG_desc:0 "Send an invitation to Argentina. Only an independent government with a compatible political system can accept."
 BOL_invite_PAR:0 "Invite Paraguay to the League"
 BOL_invite_PAR_desc:0 "Send an invitation to Paraguay. Only an independent government with a compatible political system can accept."
 BOL_invite_CHL:0 "Invite Chile to the League"
 BOL_invite_CHL_desc:0 "Send an invitation to Chile. Only an independent government with a compatible political system can accept."
 BOL_export_revolution_PRU:0 "Prepare Revolution in Peru"
 BOL_export_revolution_PRU_desc:0 "Commit political resources to an armed confrontation with a neighboring government. This authorizes war; it does not create an uprising or annex territory automatically."
 BOL_export_revolution_PAR:0 "Prepare Revolution in Paraguay"
 BOL_export_revolution_PAR_desc:0 "Commit political resources to an armed confrontation with a neighboring government. This authorizes war; it does not create an uprising or annex territory automatically."
 BOL_export_revolution_ECU:0 "Prepare Revolution in Ecuador"
 BOL_export_revolution_ECU_desc:0 "Commit political resources to an armed confrontation with a neighboring government. This authorizes war; it does not create an uprising or annex territory automatically."
 BOL_survey_mineral_deposits:0 "Survey Mineral Deposits"
 BOL_survey_mineral_deposits_desc:0 "Fund a year of geological surveys to improve the yield of existing deposits."
 BOL_veterans_training_courses:0 "Organize Veterans' Training Courses"
 BOL_veterans_training_courses_desc:0 "Use the experience of Chaco veterans to improve recruit training for the next year."
 BOL_rearm_the_civilian_guard:0 "Rebuild the Republican Guard"
 BOL_rearm_the_civilian_guard_desc:0 "Replace the politically discredited army with a smaller professional force. This removes the disarmament penalty without creating free divisions."
 BOL_busch_succession_1939:0 "The Succession of 1939"
 BOL_busch_succession_1939_desc:0 "The historical course of military socialism reaches its end with Busch's death. Quintanilla will take provisional control before the next political settlement."
 BOL_urriolagoitia_1949:0 "Urriolagoitia Takes Office"
 BOL_urriolagoitia_1949_desc:0 "Hertzog withdrew from active government in May 1949; his resignation in October confirmed Urriolagoitia as president. This focus represents the formal succession and the growing confrontation with organized opposition."
 BOL_education_code_1955:0 "The Education Code of 1955"
 BOL_education_code_1955_desc:0 "A national educational framework will extend rural schooling, train teachers and turn the revolution's promise of citizenship into practical access to learning."
 BOL_stabilization_plan_1956:0 "The Stabilization Plan of 1956"
 BOL_stabilization_plan_1956_desc:0 "Implement the stabilization programme promulgated on 15 December 1956 under Siles Zuazo. It addresses inflation and exchange controls while straining relations with organized labour."
 BOL_workers_stabilization_plan:0 "A Workers' Reconstruction Plan"
 BOL_workers_stabilization_plan_desc:0 "Replace inflation and the separate union programmes with a consolidated workers' recovery plan. Higher production and recruitment require sustained political administration and a larger civilian allocation."
 BOL_university_of_san_andres:0 "Strengthen San Andres University"
 BOL_university_of_san_andres_desc:0 "Expand scientific education and basic literacy together. This provides the first research expansion only if another education initiative has not already done so."
 BOL_national_research_council:0 "The National Research Council"
 BOL_national_research_council_desc:0 "An expanded industrial base can support a permanent research council connecting the universities, public enterprises and technical services."
 BOL_technical_universities:0 "A Network of Technical Universities"
 BOL_technical_universities_desc:0 "A mature industrial economy needs engineers, scientists and specialist schools throughout the country. Expand research capacity to support long-term development."
 BOL_return_to_the_pacific:0 "An Ocean-Going Armada"
 BOL_return_to_the_pacific_desc:0 "Once Bolivia owns and controls a coast, build its first modern dockyards. A previous coastal construction program will not grant the same shipyards twice."
 BOL_constitution_1938:0 "The Social Constitution of 1938"
 BOL_constitution_1938_desc:0 "Promulgated on 30 October 1938, the social constitution recognizes state responsibilities and the social role of property. It is distinct from the General Labour Law issued in May 1939."
