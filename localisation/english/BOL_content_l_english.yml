 BOL_empresa_nacional_ferrocarriles_del_estado_desc:0 "A coordinated railway network links the highland mines with the markets and farms of the eastern lowlands."
 BOL_vicente_rojo_lluch:0 "Vicente Rojo Lluch"
 BOL_vicente_rojo_lluch_desc:0 "An experienced foreign instructor helps professionalize our infantry and officer corps."
 BOL_yacimientos_petroliferos_fiscales_bolivianos_desc:0 "The national petroleum enterprise develops domestic fuel supplies and technical expertise."
 BOL_diplomatic_friendship:0 "Diplomatic Friendship"
 BOL_diplomatic_friction:0 "Diplomatic Friction"
 BOL_diplomatic_hostility:0 "Diplomatic Hostility"

 BOL_santos_marka_tula:0 "Santos Marka Tula"
 BOL_FSB_party:0 "FSB"
 BOL_FSB_party_long:0 "Falange Socialista Boliviana"
 BOL_second_civil_war_choice_tt:0 "Choose between Oscar Unzaga's fascist Falange and Santos Marka Tula's communist indigenous movement. Your choice immediately installs the new government and starts a second civil war against republican loyalists. Win to continue the chosen branch."
 BOL_second_civil_war_tt:0 "Republican loyalists rise in the eastern lowlands. We retain 70% of the army and 75% of the air force, receive two emergency militia divisions, 1,000 rifles and 4,000 manpower, and gain combat bonuses for 120 days. If the war continues past that deadline, lose 5% stability and 50 political power."
 BOL_revolutionary_momentum:0 "Revolutionary Momentum"
 BOL_revolutionary_momentum_desc:0 "The new coalition has mobilized its supporters and seized the initiative. This advantage lasts for 120 days and ends when the civil war is won."
 BOL_civil_conflict:0 "The Second Bolivian Civil War"
 BOL_civil_conflict_desc:0 "Our movement controls the heartland and most of the armed forces. Defeat the republican loyalists before public confidence and our temporary military advantage run out."
 BOL_win_the_second_civil_war:0 "Secure the Revolution within 120 Days"
 BOL_win_the_second_civil_war_desc:0 "Defeat the republican loyalists to open the chosen political branch. A war lasting more than 120 days costs 5% stability and 50 political power, and ends our Revolutionary Momentum."
 bolivia.72.t:0 "The Second Revolution Triumphs"
 bolivia.72.d:0 "The last republican loyalists have surrendered. Our chosen government controls Bolivia, and the political program of our movement can now proceed."
 bolivia.72.a:0 "Consolidate our victory."
 BOL_quechua_communities_of_peru:0 "Rally the Quechua Communities"
 BOL_quechua_communities_of_peru_desc:0 "Extend the ayllu revolution across the Peruvian frontier. Claim the Peruvian heartland and prepare a campaign to unite its communities with ours."
 BOL_guarani_of_the_chaco:0 "The Guarani of the Chaco"
 BOL_guarani_of_the_chaco_desc:0 "The Chaco must become a meeting place for its peoples. The ayllu federation will challenge Paraguay and extend communal representation beyond the Altiplano."
 BOL_mapuche_and_the_pacific:0 "From the Altiplano to the Pacific"
 BOL_mapuche_and_the_pacific_desc:0 "Carry the revolution through Chile and establish links with Mapuche communities. Conquest opens the road; local councils must still earn support before integration."
 BOL_communities_of_the_southern_cone:0 "The Communities of the Southern Cone"
 BOL_communities_of_the_southern_cone_desc:0 "Challenge the Argentine state and bring the southern communities into our continental project. Even a vast levy needs rifles, supply and trained officers."
 BOL_congress_of_abya_yala:0 "The Congress of Abya Yala"
 BOL_congress_of_abya_yala_desc:0 "With the Bolivian heartland and the capitals of Peru, Paraguay, Chile and Argentina secured, proclaim a federation of peoples. Its name does not turn conquered provinces into cores: local integration remains necessary."
 BOL_falange_chaco_campaign:0 "Settle the Chaco Account"
 BOL_falange_chaco_campaign_desc:0 "The Falange promises to overturn the humiliation of the Chaco War. Prepare a campaign against Paraguay and establish a corridor for further southern operations."
 BOL_falange_andean_hegemony:0 "Hegemony over the Andes"
 BOL_falange_andean_hegemony_desc:0 "Bring Peru under Bolivian leadership. Our continental order rests on a centralized state and a professional army, rather than a federation of local councils."
 BOL_falange_la_plata_campaign:0 "The Road to La Plata"
 BOL_falange_la_plata_campaign_desc:0 "The southern campaign demands careful planning and a reliable supply network. Challenge Argentina for leadership of the continent."
 BOL_falange_continental_directorate:0 "The Continental Directorate"
 BOL_falange_continental_directorate_desc:0 "Control of Lima, Santiago, Asuncion and Buenos Aires allows the Falange to proclaim its continental directorate. Occupied lands remain under administration; victory does not create instant cores."
 BOL_condor_acre_campaign:0 "Reopen the Acre Question"
 BOL_condor_acre_campaign_desc:0 "The military government will press its historic claim to Acre. This is a limited border campaign, not a claim to the whole of Brazil."
 BOL_condor_pacific_campaign:0 "A Military Corridor to the Pacific"
 BOL_condor_pacific_campaign_desc:0 "Reclaim the lost coast through a limited military campaign. Consolidate the disputed borderlands before considering further ambitions."
 BOL_socialist_andean_front:0 "The Andean Workers Front"
 BOL_socialist_andean_front_desc:0 "Organize a regional revolutionary front. Diplomatic cooperation with sympathetic governments and support for workers across the border will carry the revolution farther than isolated declarations."
 BOL_socialist_southern_front:0 "Workers across the Southern Frontier"
 BOL_socialist_southern_front_desc:0 "Open campaigns to support the workers of Chile and Argentina. These operations aim to install friendly governments, not to absorb every province into Bolivia."
 BOL_pragmatic_andean_market:0 "The Andean Common Market"
 BOL_pragmatic_andean_market_desc:0 "Extend Bolivian influence through an Andean league, infrastructure and trade. A coastal settlement remains our territorial priority."
 BOL_historical_allied_mission:0 "The Allied Training Mission"
 BOL_historical_allied_mission_desc:0 "Exchange reliable tin deliveries for weapons and instruction. A modest training mission will help Bolivia protect its borders without dragging the historical government into a continental war."
 BOL_democratic_pacific_arbitration:0 "Arbitration for a Pacific Outlet"
 BOL_democratic_pacific_arbitration_desc:0 "A civilian government can seek access to the Pacific by negotiation. Chile may refuse; there is no automatic transfer of sovereign territory."
 BOL_coup_outcome_tt:0 "An event will decide the coup: success opens the military-socialist path under Toro; failure opens Failed Coup under Quintanilla. Historical AI chooses success. This event does not start a civil war."
 BOL_carlos_apaza:0 "Carlos Apaza"
 BOL_felipe_willka:0 "Felipe Willka"
 BOL_killa_copa:0 "Killa Copa"
 BOL_ayllu_mass_levies:0 "The Ayllu Mass Levy"
 BOL_ayllu_mass_levies_desc:0 "Communal networks can mobilize a large army quickly, but hastily trained formations lack staff coordination and heavy weapons. Diverting rural labour also strains military production. The Peoples Army focus improves organization without removing every trade-off."
 BOL_ayllu_peoples_army:0 "The Ayllu Peoples Army"
 BOL_ayllu_peoples_army_desc:0 "Experienced communal officers can coordinate the mass levy and keep it fighting. Exceptional recruitment and recovery remain our strengths; lower organization, weaker attacks and constrained military production still demand numerical superiority and careful supply."
 BOL_falange_assault_cadres:0 "Falange Assault Cadres"
 BOL_falange_assault_cadres_desc:0 "A smaller, disciplined cadre emphasizes attack, planning and organization. Longer training, additional supply needs and the cost of maintaining this apparatus limit rapid expansion."
 BOL_falange_professional_army:0 "The Professional Falangist Army"
 BOL_falange_professional_army_desc:0 "Military industry supports a professional army with strong staff work. Training remains demanding and the army consumes more supplies and civilian resources than improvised formations."
 BOL_communal_arsenals:0 "Communal Arsenals"
 BOL_communal_arsenals_desc:0 "Small workshops and communal purchasing help equip the levy. They ease the shortage of rifles, but investment in them diverts civilian resources and does not erase the structural limits of mass mobilization."
 BOL_regional_trade_network:0 "Regional Trade Network"
 BOL_regional_trade_network_desc:0 "Trade agreements and infrastructure projects extend Bolivian influence through economic cooperation."
 BOL_allied_training_program:0 "Allied Training Programme"
 BOL_allied_training_program_desc:0 "A limited foreign mission shares staff procedures and lessons from the modern battlefield."
 BOL_federal_ayllu_administration:0 "Federal Ayllu Administration"
 BOL_federal_ayllu_administration_desc:0 "Local councils widen recruitment and strengthen support for the federation, at the cost of slower central political decision-making."
 BOL_integrate_abya_yala_region:0 "Integrate [FROM.GetName] into the Federation"
 BOL_integrate_abya_yala_region_desc:0 "Recognize communal representation and extend federal administration to this claimed region. Integration costs 100 political power and takes 180 days of peace, full ownership and control, at least 60% compliance and less than 20% resistance."
 BOL_support_workers_CHL:0 "Support a Workers Government in Chile"
 BOL_support_workers_CHL_desc:0 "Prepare a war to install a friendly government in Chile. A communist country or member of our faction cannot be targeted."
 BOL_support_workers_ARG:0 "Support a Workers Government in Argentina"
 BOL_support_workers_ARG_desc:0 "Prepare a war to install a friendly government in Argentina. A communist country or member of our faction cannot be targeted."
 BOL_indigenous_command_tt:0 "Recruit three indigenous commanders and, after the civil-war split, raise three four-battalion Ayllu Guard divisions at 75% equipment and low experience. This mobilization occurs only once."
