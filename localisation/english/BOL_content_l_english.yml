 BOL_empresa_nacional_ferrocarriles_del_estado_desc:0 "A coordinated railway network links the highland mines with the markets and farms of the eastern lowlands."
 BOL_vicente_rojo_lluch:0 "Vicente Rojo Lluch"
 BOL_vicente_rojo_lluch_desc:0 "An experienced foreign instructor helps professionalize our infantry and officer corps."
 BOL_yacimientos_petroliferos_fiscales_bolivianos_desc:0 "The national petroleum enterprise develops domestic fuel supplies and technical expertise."
 BOL_diplomatic_friendship:0 "Diplomatic Friendship"
 BOL_diplomatic_friction:0 "Diplomatic Friction"
 BOL_diplomatic_hostility:0 "Diplomatic Hostility"

 BOL_santos_marka_tula:0 "Santos Marka Tula"
 BOL_FSB_party:0 "FSB"
 BOL_FSB_party_long:0 "Falange Socialista Boliviana"
 BOL_second_civil_war_choice_tt:0 "Choose between Oscar Unzaga's fascist Falange and Santos Marka Tula's communist indigenous movement. Your choice immediately installs the new government and starts a second civil war against republican loyalists. Win to continue the chosen branch."
 BOL_second_civil_war_tt:0 "Loyalists rise in the eastern lowlands with two emergency militia divisions. We retain 70% of the army and 75% of the air force, receive 1,000 rifles and 4,000 manpower, and gain combat bonuses for 120 days. The Falange receives two emergency militia divisions; the indigenous movement receives its three Ayllu Guard divisions instead. If the war continues past the deadline, lose 5% stability and 50 political power."
 BOL_revolutionary_momentum:0 "Revolutionary Momentum"
 BOL_revolutionary_momentum_desc:0 "The new coalition has mobilized its supporters and seized the initiative. This advantage lasts for 120 days and ends when the civil war is won."
 BOL_civil_conflict:0 "The Second Bolivian Civil War"
 BOL_civil_conflict_desc:0 "Our movement controls the heartland and most of the armed forces. Defeat the republican loyalists before public confidence and our temporary military advantage run out."
 BOL_win_the_second_civil_war:0 "Secure the Revolution within 120 Days"
 BOL_win_the_second_civil_war_desc:0 "Defeat the republican loyalists to open the chosen political branch. A war lasting more than 120 days costs 5% stability and 50 political power, and ends our Revolutionary Momentum."
 bolivia.72.t:0 "The Second Revolution Triumphs"
 bolivia.72.d:0 "The last republican loyalists have surrendered. Our chosen government controls Bolivia, and the political program of our movement can now proceed."
 bolivia.72.a:0 "Consolidate our victory."
 BOL_quechua_communities_of_peru:0 "Rally the Quechua Communities"
 BOL_quechua_communities_of_peru_desc:0 "Extend the ayllu revolution across the Peruvian frontier. Claim the Peruvian heartland and prepare a campaign to unite its communities with ours."
 BOL_guarani_of_the_chaco:0 "The Guarani of the Chaco"
 BOL_guarani_of_the_chaco_desc:0 "The Chaco must become a meeting place for its peoples. The ayllu federation will challenge Paraguay and extend communal representation beyond the Altiplano."
 BOL_mapuche_and_the_pacific:0 "From the Altiplano to the Pacific"
 BOL_mapuche_and_the_pacific_desc:0 "Carry the revolution through Chile and establish links with Mapuche communities. Conquest opens the road; local councils must still earn support before integration."
 BOL_communities_of_the_southern_cone:0 "The Communities of the Southern Cone"
 BOL_communities_of_the_southern_cone_desc:0 "Challenge the Argentine state and bring the southern communities into our continental project. Even a vast levy needs rifles, supply and trained officers."
 BOL_congress_of_abya_yala:0 "The Congress of Abya Yala"
 BOL_congress_of_abya_yala_desc:0 "With the Bolivian heartland and the capitals of Peru, Paraguay, Chile and Argentina secured, proclaim a federation of peoples. Its name does not turn conquered provinces into cores: local integration remains necessary."
 BOL_falange_chaco_campaign:0 "Settle the Chaco Account"
 BOL_falange_chaco_campaign_desc:0 "The Falange promises to overturn the humiliation of the Chaco War. Prepare a campaign against Paraguay and establish a corridor for further southern operations."
 BOL_falange_andean_hegemony:0 "Hegemony over the Andes"
 BOL_falange_andean_hegemony_desc:0 "Bring Peru under Bolivian leadership. Our continental order rests on a centralized state and a professional army, rather than a federation of local councils."
 BOL_falange_la_plata_campaign:0 "The Road to La Plata"
 BOL_falange_la_plata_campaign_desc:0 "The southern campaign demands careful planning and a reliable supply network. Challenge Argentina for leadership of the continent."
 BOL_falange_continental_directorate:0 "The Continental Directorate"
 BOL_falange_continental_directorate_desc:0 "Control of Lima, Santiago, Asuncion and Buenos Aires allows the Falange to proclaim its continental directorate. Occupied lands remain under administration; victory does not create instant cores."
 BOL_condor_acre_campaign:0 "Reopen the Acre Question"
 BOL_condor_acre_campaign_desc:0 "The military government will press its historic claim to Acre. This is a limited border campaign, not a claim to the whole of Brazil."
 BOL_condor_pacific_campaign:0 "A Military Corridor to the Pacific"
 BOL_condor_pacific_campaign_desc:0 "Reclaim the lost coast through a limited military campaign. Consolidate the disputed borderlands before considering further ambitions."
 BOL_socialist_andean_front:0 "The Andean Workers Front"
 BOL_socialist_andean_front_desc:0 "Organize a regional revolutionary front. Diplomatic cooperation with sympathetic governments and support for workers across the border will carry the revolution farther than isolated declarations."
 BOL_socialist_southern_front:0 "Workers across the Southern Frontier"
 BOL_socialist_southern_front_desc:0 "Open campaigns to support the workers of Chile and Argentina. These operations aim to install friendly governments, not to absorb every province into Bolivia."
 BOL_pragmatic_andean_market:0 "The Andean Common Market"
 BOL_pragmatic_andean_market_desc:0 "Extend Bolivian influence through an Andean league, infrastructure and trade. A coastal settlement remains our territorial priority."
 BOL_historical_allied_mission:0 "The Allied Training Mission"
 BOL_historical_allied_mission_desc:0 "Exchange reliable tin deliveries for weapons and instruction. A modest training mission will help Bolivia protect its borders without dragging the historical government into a continental war."
 BOL_democratic_pacific_arbitration:0 "Arbitration for a Pacific Outlet"
 BOL_democratic_pacific_arbitration_desc:0 "A civilian government can seek access to the Pacific by negotiation. Chile may refuse; there is no automatic transfer of sovereign territory."
 BOL_coup_outcome_tt:0 "Success opens the military-socialist path under Toro. Failure keeps Tejada Sorzano in power and opens civil reforms or a second radical attempt. Historical AI chooses success."
 BOL_marcelino_llanqui:0 "Marcelino Llanqui"
 BOL_gregorio_titiriku:0 "Gregorio Titiriku"
 BOL_toribio_miranda:0 "Toribio Miranda"
 BOL_meliton_gallardo:0 "Melitón Gallardo"
 BOL_avelino_sinani:0 "Avelino Siñani"
 BOL_eduardo_nina_quispe:0 "Eduardo Leandro Nina Quispe"
 BOL_leandro_condori_chura:0 "Leandro Condori Chura"
 BOL_warisata_educator:0 "Educator of Warisata"
 BOL_ayllu_rights_advocate:0 "Defender of Communal Rights"
 BOL_communal_administrator:0 "Scribe of the Caciques"
 BOL_ayllu_mass_levies:0 "The Ayllu Mass Levy"
 BOL_ayllu_mass_levies_desc:0 "Communal networks can mobilize a large army quickly, but hastily trained formations lack staff coordination and heavy weapons. Diverting rural labour also strains military production. The Peoples Army focus improves organization without removing every trade-off."
 BOL_ayllu_peoples_army:0 "The Ayllu Peoples Army"
 BOL_ayllu_peoples_army_desc:0 "Experienced communal officers can coordinate the mass levy and keep it fighting. Exceptional recruitment and recovery remain our strengths; lower organization, weaker attacks and constrained military production still demand numerical superiority and careful supply."
 BOL_falange_assault_cadres:0 "Falange Cadres"
 BOL_falange_assault_cadres_desc:0 "The early Falange combines political discipline with a limited trained cadre. Its later identity replaces this programme."
 BOL_falange_professional_army:0 "The Professional Falangist Army"
 BOL_falange_professional_army_desc:0 "The mature Hispanist programme concentrates on quality and staff work. It replaces earlier political and military programmes, retaining the cost of training, supply and civilian funding."
 BOL_communal_arsenals:0 "Communal Arsenals"
 BOL_communal_arsenals_desc:0 "Small workshops and communal purchasing help equip the levy. They ease the shortage of rifles, but investment in them diverts civilian resources and does not erase the structural limits of mass mobilization."
 BOL_regional_trade_network:0 "Regional Trade Network"
 BOL_regional_trade_network_desc:0 "Trade agreements and infrastructure projects extend Bolivian influence through economic cooperation."
 BOL_allied_training_program:0 "Allied Training Programme"
 BOL_allied_training_program_desc:0 "A limited foreign mission shares staff procedures and lessons from the modern battlefield."
 BOL_federal_ayllu_administration:0 "Federal Ayllu Administration"
 BOL_federal_ayllu_administration_desc:0 "Local councils widen recruitment and strengthen support for the federation, at the cost of slower central political decision-making."
 BOL_integrate_abya_yala_region:0 "Integrate [FROM.GetName] into the Federation"
 BOL_integrate_abya_yala_region_desc:0 "Recognize communal representation and extend federal administration to this claimed region. Integration costs 100 political power and takes 180 days of peace, full ownership and control, at least 60% compliance and less than 20% resistance."
 BOL_support_workers_CHL:0 "Support a Workers Government in Chile"
 BOL_support_workers_CHL_desc:0 "Prepare a war to install a friendly government in Chile. A communist country or member of our faction cannot be targeted."
 BOL_support_workers_ARG:0 "Support a Workers Government in Argentina"
 BOL_support_workers_ARG_desc:0 "Prepare a war to install a friendly government in Argentina. A communist country or member of our faction cannot be targeted."
 BOL_indigenous_command_tt:0 "After the civil-war split, raise three four-battalion Ayllu Guard divisions at 75% equipment and low experience. After victory, Seek Help from Indigenous Peoples replaces the old command and cabinet. This troop mobilization occurs only once."
 BOL_ayllu_roster_replacement_tt:0 "Retire the old military and political staff, including hired advisers. Santos Marka Tula remains leader. Marcelino Llanqui, Gregorio Titiriku, Toribio Miranda and Melitón Gallardo become our four generals; they also offer army advice. Avelino Siñani, Eduardo Leandro Nina Quispe and Leandro Condori Chura become available as civilian advisers. Advisers must be hired normally; this transition grants no additional troops."
 BOL_abya_yala:0 "Federation of Abya Yala"
 BOL_abya_yala_DEF:0 "the Federation of Abya Yala"
 BOL_abya_yala_ADJ:0 "Abya Yalan"
 BOL_abya_yala_communism:0 "Federation of Abya Yala"
 BOL_abya_yala_communism_DEF:0 "the Federation of Abya Yala"
 BOL_abya_yala_communism_ADJ:0 "Abya Yalan"
 BOL_abya_yala_fascism:0 "Federation of Abya Yala"
 BOL_abya_yala_fascism_DEF:0 "the Federation of Abya Yala"
 BOL_abya_yala_fascism_ADJ:0 "Abya Yalan"
 BOL_abya_yala_democratic:0 "Federation of Abya Yala"
 BOL_abya_yala_democratic_DEF:0 "the Federation of Abya Yala"
 BOL_abya_yala_democratic_ADJ:0 "Abya Yalan"
 BOL_abya_yala_neutrality:0 "Federation of Abya Yala"
 BOL_abya_yala_neutrality_DEF:0 "the Federation of Abya Yala"
 BOL_abya_yala_neutrality_ADJ:0 "Abya Yalan"
 BOL_continental_directorate:0 "Bolivian Continental Directorate"
 BOL_continental_directorate_DEF:0 "the Bolivian Continental Directorate"
 BOL_continental_directorate_ADJ:0 "Bolivian"
 BOL_continental_directorate_communism:0 "Bolivian Continental Directorate"
 BOL_continental_directorate_communism_DEF:0 "the Bolivian Continental Directorate"
 BOL_continental_directorate_communism_ADJ:0 "Bolivian"
 BOL_continental_directorate_fascism:0 "Bolivian Continental Directorate"
 BOL_continental_directorate_fascism_DEF:0 "the Bolivian Continental Directorate"
 BOL_continental_directorate_fascism_ADJ:0 "Bolivian"
 BOL_continental_directorate_democratic:0 "Bolivian Continental Directorate"
 BOL_continental_directorate_democratic_DEF:0 "the Bolivian Continental Directorate"
 BOL_continental_directorate_democratic_ADJ:0 "Bolivian"
 BOL_continental_directorate_neutrality:0 "Bolivian Continental Directorate"
 BOL_continental_directorate_neutrality_DEF:0 "the Bolivian Continental Directorate"
 BOL_continental_directorate_neutrality_ADJ:0 "Bolivian"
 BOL_nationalize_standard_oil_1937:0 "Nationalize Standard Oil"
 BOL_nationalize_standard_oil_1937_desc:0 "On 13 March 1937 the Toro government nationalized Standard Oil properties. Expand the state oil industry while accepting temporary commercial and administrative costs."
 BOL_oil_nationalization_dispute:0 "The Oil Nationalization Dispute"
 BOL_oil_nationalization_dispute_desc:0 "Building an independent oil administration improves resource extraction, but the dispute over expropriation temporarily burdens commerce and public finances."
 BOL_social_constitution:0 "The Social Constitution"
 BOL_social_constitution_desc:0 "The 1938 constitution recognizes the social role of property and the state. Implementing those commitments requires public investment."
 BOL_chaco_peace_1938:0 "The Chaco Peace Settlement"
 BOL_chaco_peace_1938_desc:0 "The peace treaty of 21 July 1938 formalized the end of the Chaco conflict. Demobilize exhausted veterans and redirect scarce resources toward reconstruction."
 BOL_veteran_resettlement:0 "Veteran Resettlement"
 BOL_veteran_resettlement_desc:0 "Returning veterans support reconstruction. The demobilization programme eases civilian construction but temporarily reduces mobilization speed."
 BOL_general_labour_law_1939:0 "The General Labour Law"
 BOL_general_labour_law_1939_desc:0 "Busch issued the General Labour Law on 24 May 1939. Establish labour protections separately from the social constitution of October 1938."
 BOL_mining_exchange_decree_1939:0 "Bring Export Earnings Home"
 BOL_mining_exchange_decree_1939_desc:0 "The decree of 7 June 1939 required mining export earnings to return to the state. Finance imports and public investment while accepting the political cost of confrontation with the mining interests."
 BOL_export_exchange_controls:0 "Export Exchange Controls"
 BOL_export_exchange_controls_desc:0 "State access to foreign exchange helps sustain essential imports, but confrontation over export earnings consumes political resources."
 BOL_fstmb_organization:0 "The Organized Miners"
 BOL_fstmb_organization_desc:0 "The FSTMB strengthens workers organization. Better recruitment and factory output come with stronger demands on the government."
 BOL_revolutionary_army_disruption:0 "The Army after the Revolution"
 BOL_revolutionary_army_disruption_desc:0 "The collapse of the old military order weakens staff organization. Rebuilding the military college restores a trained officer corps under the new institutions."
 BOL_rebuild_military_college:0 "Rebuild the Military College"
 BOL_rebuild_military_college_desc:0 "Rebuild officer training after the upheaval of 1952. The college was authorized to reopen in 1953 and resumed its activities that October; professional education must now serve the new republic."
 BOL_social_insurance:0 "Social Insurance"
 BOL_social_insurance_desc:0 "The 1956 Social Security Code extends protection against sickness, disability and old age. Its benefits require a continuing civilian contribution."
 BOL_social_security_code_1956:0 "Prepare the Social Security Code"
 BOL_social_security_code_1956_desc:0 "Prepare the legislation and institutions for the Social Security Code promulgated on 14 December 1956. Once preparations are complete, the civilian government enacts the code on that date, or later if preparations were delayed."
 BOL_civic_institutions:0 "Civilian Institutions"
 BOL_civic_institutions_desc:0 "Independent civil institutions improve public administration and defence of the republic. Their funding requires a modest civilian contribution."
 BOL_constitutional_defence:0 "Defend the Constitutional Republic"
 BOL_constitutional_defence_desc:0 "After resisting the attempted military takeover, strengthen civilian institutions and offer a democratic alternative to the conservative restoration. This is an alternative outcome of the 1943 crisis."
 BOL_constitutional_andean_cooperation:0 "A Constitutional Andean League"
 BOL_constitutional_andean_cooperation_desc:0 "Pursue regional cooperation from the surviving republic. Trade and negotiated access to the Pacific offer goals beyond domestic constitutional reform."
 BOL_civic_development_council:0 "A Civilian Development Council"
 BOL_civic_development_council_desc:0 "Create a development council that can choose between temporary programmes for civilian construction, arms production and military training. Concentrating resources in one programme carries a cost in another sector."
 BOL_pragmatic_investment_board:0 "The National Investment Board"
 BOL_pragmatic_investment_board_desc:0 "Coordinate state mines, transport and private investment. Unlock temporary investment priorities instead of committing every resource to a permanent expansion programme."
 BOL_workers_supply_councils:0 "Workers Supply Councils"
 BOL_workers_supply_councils_desc:0 "Coordinate mining and military production through workers councils. More reliable armaments output requires resources for civilian consumption and local administration."
 BOL_workers_supply_congress:0 "The Workers Supply Congress"
 BOL_workers_supply_congress_desc:0 "Coordinate the mines with arms workshops and military procurement. Unlock civilian, armaments and training priorities: each costs political power, lasts six months and prevents the other priorities from being active at the same time."
 BOL_ayllu_field_services:0 "Ayllu Field Services"
 BOL_ayllu_field_services_desc:0 "Local porters, medical posts and trained supply officers support the levy. They ease losses and transport demands without erasing the limitations of hastily trained formations."
 BOL_ayllu_supply_and_medicine:0 "Porters and Community Medics"
 BOL_ayllu_supply_and_medicine_desc:0 "Organize communal transport and battlefield medical services. Improve the endurance of the mass army while preserving its disadvantages in staff work and equipment production."
 BOL_falange_combined_arms:0 "The Combined Arms School"
 BOL_falange_combined_arms_desc:0 "Build on the professional cadres with artillery and staff exercises. Better training requires scarce support equipment; these formations retain their higher training time and supply needs."
 BOL_border_quartermasters:0 "The Border Quartermasters"
 BOL_border_quartermasters_desc:0 "A permanent logistics service supports the military government\'s limited border campaigns. Its staff reduces supply demands, but retaining experienced officers takes time."
 BOL_condor_border_command:0 "The Border Command"
 BOL_condor_border_command_desc:0 "Organize the supply depots and officer staff needed for limited campaigns in Acre, the Chaco and the Pacific borderlands."
 BOL_priority_civilian:0 "Civilian Investment Priority"
 BOL_priority_civilian_desc:0 "Civilian works receive materials and credit for 180 days, reducing the resources available to arms production."
 BOL_priority_arms:0 "Armaments Investment Priority"
 BOL_priority_arms_desc:0 "Arms output receives a temporary priority. Its additional civilian cost ends after 180 days."
 BOL_priority_training:0 "Military Training Priority"
 BOL_priority_training_desc:0 "Staff exercises and additional training accelerate army experience and organization recovery, at the expense of industrial output."
 BOL_priority_civilian_programme:0 "Prioritize Civilian Works"
 BOL_priority_civilian_programme_desc:0 "Spend 50 political power to set this priority for 180 days. Only one investment priority can run at a time. The council must wait 180 days before launching this programme again."
 BOL_priority_arms_programme:0 "Prioritize Arms Production"
 BOL_priority_arms_programme_desc:0 "Spend 50 political power to set this priority for 180 days. Only one investment priority can run at a time. The council must wait 180 days before launching this programme again."
 BOL_priority_training_programme:0 "Prioritize Army Training"
 BOL_priority_training_programme_desc:0 "Spend 50 political power to set this priority for 180 days. Only one investment priority can run at a time. The council must wait 180 days before launching this programme again."
 BOL_mining_arbitration:0 "A Mining Wage Settlement"
 BOL_mining_arbitration_desc:0 "A negotiated settlement limits industrial disruption and supports stability. The budget must fund agreed improvements in conditions."
 BOL_negotiate_mining_settlement:0 "Negotiate a Mining Settlement"
 BOL_negotiate_mining_settlement_desc:0 "Spend 50 political power to negotiate a wage and conditions settlement. It lasts 180 days, improves stability and industrial cooperation, and requires additional civilian resources."
 BOL_private_development_contracts:0 "Private Development Contracts"
 BOL_private_development_contracts_desc:0 "Private contracts accelerate civilian investment, while reliance on outside capital limits political freedom of action."
 BOL_andean_welfare_services:0 "Andean Welfare Services"
 BOL_andean_welfare_services_desc:0 "Health and social services stabilize the republic and improve recovery from losses, with a permanent civilian funding requirement."
 BOL_found_comibol_1952:0 "Create COMIBOL"
 BOL_found_comibol_1952_desc:0 "Create the state mining corporation established on 2 October 1952. Organize its administration before transferring the large private mining companies to public ownership later that month."
 BOL_mining_administrative_transition:0 "Building a Mining Administration"
 BOL_mining_administrative_transition_desc:0 "Preparing the state corporation requires administrative resources before it can assume responsibility for the nationalized mines."
 BOL_wartime_alignment_1943:0 "Bolivia and the Allied War Effort"
 BOL_wartime_alignment_1943_desc:0 "Bolivia declared itself at war with the Axis on 7 April 1943. Decide whether to take that historical step or maintain material assistance. A declaration is offered only against an existing Axis government already fighting the United Kingdom."
 bolivia.80.t:0 "Bolivia and the World War"
 bolivia.80.d:0 "Our exports already support the Allied war effort. In the historical course Bolivia declared war on the Axis on 7 April 1943. We can take that step against fascist governments still fighting Britain, or continue material assistance without a declaration."
 bolivia.80.a:0 "Declare war on the remaining Axis belligerents."
 bolivia.80.b:0 "Continue material assistance."
 BOL_social_security_enactment_tt:0 "The social insurance spirit takes effect on or after 14 December 1956, once this focus is complete and Bolivia has a democratic government."
 bolivia.81.t:0 "The Social Security Code"
 bolivia.81.d:0 "The prepared social insurance legislation has entered into force. Its historical promulgation was on 14 December 1956. Public institutions must now fund the protection promised to workers and their families."
 bolivia.81.a:0 "Put the new institutions to work."
 BOL_crackdown_1949:0 "The Cost of Repression"
 BOL_crackdown_1949_desc:0 "Deploying troops against the 1949 uprising secures government control but disrupts production and deepens political resentment."
 BOL_concessions_1949:0 "A Negotiated Settlement"
 BOL_concessions_1949_desc:0 "Negotiations ease immediate tensions, but concessions constrain government decision-making during the settlement."
 BOL_crisis_of_1949:0 "The Crisis of 1949"
 BOL_crisis_of_1949_desc:0 "The armed MNR uprising of 1949 exposed the fragility of the conservative order. Choose repression or negotiation. This internal conflict is represented by an event and temporary national effects."
 bolivia.82.t:0 "The Uprising of 1949"
 bolivia.82.d:0 "Armed opposition has challenged the conservative government in several regions. The historical government used military force to restore control. A settlement could reduce immediate tensions, but would require concessions to its opponents."
 bolivia.82.a:0 "Restore control by force."
 bolivia.82.b:0 "Seek a negotiated settlement."
 BOL_civilian_transfer_1947:0 "A Constitutional Transfer of Power"
 BOL_civilian_transfer_1947_desc:0 "A republic that has preserved constitutional government can transfer power through elections instead of the overthrow of Villarroel. This succession opens the shared postwar political programme to both Sorzano's republic and the government that resisted the coup of 1943."
 BOL_ayllu_road_army:0 "The Army of the Andean Roads"
 BOL_ayllu_road_army_desc:0 "Communal transport sustains a smaller mass levy with better movement and supply. Recruitment remains exceptional, but organization, attacks, industry and political administration still bear the costs of this army. Replaces the previous Ayllu army programme."
 BOL_ayllu_confederate_levies:0 "The Confederate Ayllu Levies"
 BOL_ayllu_confederate_levies_desc:0 "The constituent communities mobilize an even larger army. Greater numbers demand more supply and administration, while loosely coordinated formations lose organization, offensive strength and industrial labour. Replaces the previous Ayllu army programme."
 BOL_mine_joint_boards:0 "Joint Mining Boards"
 BOL_mine_joint_boards_desc:0 "Local boards coordinate labour and production at a political and civilian cost. Mature mining institutions replace this provisional programme; it does not establish the COB ahead of the national revolution."
 bolivia.21.b:0 "Respect the result and install the elected administration."
 BOL_falange_hispanist_cadres:0 "The Hispanist Professional Army"
 BOL_falange_hispanist_cadres_desc:0 "Professional officers and careful staff work improve attack and organization. Extended training and greater supply demands limit rapid expansion."
 BOL_falange_andean_columns:0 "The Andean Mobilization Columns"
 BOL_falange_andean_columns_desc:0 "Local recruiting networks emphasize movement and rapid mobilization. Staff coordination and military production are weaker than in the professional alternative."
 BOL_falange_andean_army:0 "The Andean Army of Mobilization"
 BOL_falange_andean_army_desc:0 "The mature Andean programme mobilizes more recruits and moves quickly. Its formations retain weaker organization, slower planning and constrained arms production. It replaces the previous stage."
 BOL_professional_army_advocate:0 "Professional Army Advocate"
 BOL_andean_mobilizer:0 "Andean Mobilizer"
 BOL_historic_frontier_administration:0 "The Historic Frontier Programme"
 BOL_historic_frontier_administration_desc:0 "Prepare to integrate selected historical regions: the former Peruvian confederate territory, Antofagasta and Arica, Los Andes/Puna de Atacama, Chaco Boreal and Acre. Conquest alone does not grant cores. Owned and controlled regions require local integration, compliance and political investment."
 BOL_falange_acre_frontier:0 "The Acre Frontier"
 BOL_falange_acre_frontier_desc:0 "Reopen the Acre dispute with Brazil as a limited territorial campaign. The frontier integration programme covers Acre, not the whole of Brazil."
 BOL_integrate_falangist_historic_region:0 "Integrate [FROM.GetName] into the State"
 BOL_integrate_falangist_historic_region_desc:0 "Integrate an explicitly listed historical or confederate region. Costs 100 political power and 120 days of peace. Requires ownership, full control, at least 50% compliance and less than 20% resistance."
 BOL_historic_integration_tt:0 "Unlock integration of the listed historic regions for 100 political power and 120 days each, after ownership, full control, at least 50% compliance and less than 20% resistance. Capitals and other provinces outside the list receive no automatic cores."
 BOL_workers_transition:0 "The Workers Transition"
 BOL_workers_transition_desc:0 "Breaking the mining oligarchy improves the state\'s access to production, but political confrontation and administrative costs burden the transition."
 BOL_workers_planned_republic:0 "The Planned Workers Republic"
 BOL_workers_planned_republic_desc:0 "A consolidated workers programme coordinates factories and militia recruitment. It replaces the early mining, militia and political spirits, while retaining political and civilian costs."
 BOL_workers_revolutionary_state:0 "The Organized Revolutionary State"
 BOL_workers_revolutionary_state_desc:0 "The mature programme balances a reliable arms industry with trained workers formations. It replaces previous political stages rather than stacking their modifiers."
 BOL_workers_peasant_compact:0 "The Workers and Peasants Compact"
 BOL_workers_peasant_compact_desc:0 "Link the miners unions to rural communities and prevent the new workers state from becoming an isolated industrial enclave. Land reform supports the same evolving political programme rather than another permanent national spirit."
 BOL_workers_five_year_plan:0 "The First Workers Industrial Plan"
 BOL_workers_five_year_plan_desc:0 "Coordinate mine output, transport and armament production. Establish a small additional arsenal and an industrial research programme instead of accumulating another permanent factory-output spirit."
 BOL_mexican_agrarian_exchange:0 "The Mexican Agrarian Exchange"
 BOL_mexican_agrarian_exchange_desc:0 "Agrarian training and community organization improve rural construction. Public administration must fund the exchange."
 BOL_chilean_union_exchange:0 "The Chilean Union Exchange"
 BOL_chilean_union_exchange_desc:0 "Mining union delegates and workshop technicians improve temporary armaments output, with an additional civilian cost."
 BOL_american_revolutionary_models:0 "American Revolutionary Experiences"
 BOL_american_revolutionary_models_desc:0 "Study Mexican agrarian organization or Chilean mining unions. Choose one temporary exchange programme; these are inspirations for the alternate workers republic, not claims that every participating government was communist."
 BOL_american_workers_international:0 "The American Workers International"
 BOL_american_workers_international_desc:0 "Organize a continental workers alliance. If Bolivia is independent and outside a faction, found a new international; otherwise retain the current alliance and expand cooperation through the available decisions."
 BOL_peruvian_workers_campaign:0 "The Peruvian Workers Campaign"
 BOL_peruvian_workers_campaign_desc:0 "Support a revolutionary government in Peru and confront the established state if it resists. This objective installs an allied workers administration rather than granting every Peruvian state as a Bolivian core."
 BOL_southern_workers_campaign:0 "Workers of the Southern Cone"
 BOL_southern_workers_campaign_desc:0 "Prepare campaigns for friendly workers governments in Chile, Paraguay and Argentina. Communist governments, faction partners and our own subjects cannot be targeted."
 BOL_brazilian_workers_campaign:0 "The Brazilian Workers Campaign"
 BOL_brazilian_workers_campaign_desc:0 "Extend the international toward Brazil. A vast country requires a political objective beyond annexation: establish a friendly workers government and cooperate through the continental alliance."
 BOL_caribbean_workers_campaign:0 "The Northern Workers Front"
 BOL_caribbean_workers_campaign_desc:0 "Support revolutionary governments in Colombia and Venezuela. The campaign opens a northern front for the international, with all the diplomatic risks of confronting their current governments."
 BOL_congress_of_american_workers:0 "The Congress of American Workers"
 BOL_congress_of_american_workers_desc:0 "Once at least one friendly workers government is associated with us as an ally or subject, convene a continental congress. Consolidate the political programme and military lessons without receiving an additional stacking national spirit."
 BOL_american_workers_international_faction:0 "American Workers International"
 bolivia.84.t:0 "American Revolutionary Experiences"
 bolivia.84.d:0 "Our delegates propose two practical exchanges: rural organization inspired by Mexican agrarian reform, or technical cooperation with Chilean mining unions. We can sustain one of these programmes for six months."
 bolivia.84.a:0 "Study agrarian organization."
 bolivia.84.b:0 "Bring mining and workshop delegates."
 BOL_workers_invite_BRA:0 "Invite Brazil to the Workers International"
 BOL_workers_invite_BRA_desc:0 "Invite an independent communist government to our faction. The government can accept or decline."
 BOL_workers_invite_COL:0 "Invite Colombia to the Workers International"
 BOL_workers_invite_COL_desc:0 "Invite an independent communist government to our faction. The government can accept or decline."
 BOL_workers_invite_VEN:0 "Invite Venezuela to the Workers International"
 BOL_workers_invite_VEN_desc:0 "Invite an independent communist government to our faction. The government can accept or decline."
 bolivia.85.t:0 "An Invitation to the Workers International"
 bolivia.85.d:0 "The Bolivian workers government proposes a continental alliance of sympathetic governments. Membership offers collective cooperation and also commits us to its diplomatic obligations."
 bolivia.85.a:0 "Join the international."
 bolivia.85.b:0 "Maintain our independence."
