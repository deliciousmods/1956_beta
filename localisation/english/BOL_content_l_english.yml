 BOL_andean_diplomacy_tt:0 "Unlocks decisions to found a regional alliance and invite independent neighboring governments. Membership requires their consent."
 BOL_export_revolution_tt:0 "Unlocks decisions to prepare wars against neighboring non-communist governments. Each campaign requires a separate political commitment."
 BOL_andean_integration_tt:0 "Unlocks integration of owned Peruvian and mainland Ecuadorian regions during peacetime. Each region requires 60% compliance, low resistance, 100 political power and 180 days."
