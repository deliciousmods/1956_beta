 PLY_UNIFIED_polynesian_unifacation:0 "Polynesian Unifacation Achieved"
 PLY_UNIFIED_polynesian_unifacation_desc:0 "After a huge struggle against the colonial powers in Polynesia, we we're able to unite the region once and for all!"
 PLY_UNIFIED_connect_the_villages:0 "Connect the Villages"
 PLY_UNIFIED_connect_the_villages_desc:0 "Most of our islands are underdeveloped and lack any sufficent infrastructure. it is vital that we change that"
 PLY_UNIFIED_tourism_based_industry:0 "Establish the Tourism Sector"
 PLY_UNIFIED_tourism_based_industry_desc:0 "Who wouldn't want to travel to a remote island in the middle of the ocean?!"
 PLY_UNIFIED_first_steps_towards_modernisation:0 "Steps Towards Industrialisation"
 PLY_UNIFIED_first_steps_towards_modernisation_desc:0 "Polynesia is lacking in terms of industrial capacity. without any industrial sector, we will not survive the next decade."
 PLY_UNIFIED_connect_the_islands:0 "Build Up Our Islands"
 PLY_UNIFIED_connect_the_islands_desc:0 "To connect the populations of our country better, we must establish key ports on each island. so that the people of each part of our country will be able to get across to the other."
 PLY_UNIFIED_develop_taiwan:0 "Develop Taiwan"
 PLY_UNIFIED_exploit_the_fijian_goldmines:0 "Exploit the Fijian Goldmines"
 PLY_UNIFIED_exploit_the_fijian_goldmines_desc:0 "Fiji has a large deposit of gold we could potentially use to our advantage, and to grow our economy."
 PLY_UNIFIED_exploit_the_nauruan_phosphate_mines:0 "Exploit the Nauruan Phosphate Deposits"
 PLY_UNIFIED_exploit_the_nauruan_phosphate_mines_desc:0 "Nauru has a large quantity of phosphate on its island which has been proven to be the highest quality of phosphate in the world. it would be wasteful not to use this phosphate to our own benefit."
 PLY_UNIFIED_seize_japanese_assets:0 "Seize Japanese Assets"
 PLY_UNIFIED_seize_japanese_assets_desc:0 "The Japanese threat is gone, and we will make sure of that by seizing any possible assets in our own country."
 PLY_UNIFIED_watching_over_the_pacific:0 "Guardians of the Pacific"
 PLY_UNIFIED_watching_over_the_pacific_desc:0 "Many empires have dominated the region in the past, but times have changed. it is the native people's opportunity to show to the world who is the rightful ruler of this land!"
 PLY_UNIFIED_educational_reform:0 "Education Reform"
 PLY_UNIFIED_educational_reform_desc:0 "A large portion of our population lacks in the education sector due to neglect from their European overlords. we must give them what they lacked, and make sure every single person in our country is as knowledgeable as the ones in the west!"
 