 TON_war_industrialisation_r56:0 "War Industrialisation"
 PLY_will_be_removed_once_factories_tt:0 "§YThis national spirit will be removed once we have more than 2 factories.§!"

 # Decisions
 TON_opposition_coup_r56:0 "The Free Tonga Plot"
 TON_opposition_coup_r56_desc:0 "The Tupou dynasty has held Tonga back from its full potential for far too long! We must overthrow their government and establish a fully independent Tonga, not influenced by foreign powers such as [ENG.GetNameDef]. Although, our preparations will most likely not go unnoticed, and so we must hurry in order to not attract the attention of any foreign powers."

 TON_until_plot_failure_r56:0 "Foreign Intervention"
 TON_until_plot_failure_r56_desc:0 "Our preparations are not going unnoticed. We must make haste and commence our plot as soon as possible."

 # Events
 tonga_r56.1.t:0 "Crisis in Tonga"
 tonga_r56.1.desc:0 "Over the course of the year, a plot against the government of [TON.GetNameDef] has been in the works. This plot threatens our allies within the nation and now we must make a choice to either intervene directly and ensure order or to let fate take its course."
 tonga_r56.1.a:0 "We must intervene."
 tonga_r56.1.b:0 "What's in it for us?"

 tonga_r56.2.t:0 "[FROM.GetNameDefCap] Invades!"
 tonga_r56.2.desc:0 "Our plot took too long to commence, and because of this foreign agents were able to infiltrate our inner circle and get rid of any immediate danger possed to the [ROOT.GetAdjective] government."
 tonga_r56.2.a:0 "We gave it our best."

