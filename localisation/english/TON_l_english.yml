 # Politics
 PLY_open_up_politics_r56:0 "Open up the [ROOT.GetAdjective] Politicl Sphere"
 PLY_open_up_politics_r56_desc:0 "Now that we have finally secured self governance, we can take the first steps to establishing a functioning government." 

 PLY_trust_democratic_institutions_r56:0 "Trust Democratic Institutions"
 PLY_trust_democratic_institutions_r56_desc:0 "We must trust in democratic values of the Western world if we want to be a truly modern nation."

 PLY_our_traditional_ways_r56:0 "Continue the Chiefly System"
 PLY_our_traditional_ways_r56_desc:0 "The traditional politics of [ROOT.GetAdjective] are well established with most of our citizens. There is no need to fix whats not broken."

 PLY_radicalize_chiefs_r56:0 "Radicalize the Native Chiefs"
 PLY_radicalize_chiefs_r56_desc:0 "Hard times require strong leaders. With the world seemingly coming ever so closer to all out war, our nation requires a strong leader who can guide us through times of hardship."
















