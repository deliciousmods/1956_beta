l_english:
 TON_salote_tupou_iii:0 "Sālote Tupou III"
 TON_salote_tupou_iii_desc:0 "Sālote Mafile'o Pilolevu was born in 1900 to King George Tupou II and his wife, Lavinia Veiongo. Having grown up in New Zealand due to the danger posed back at home, she received a Western-style education that deeply influenced her worldview, something which would prove invaluable in the coming years. She was later ordered to return back to Tonga by Tongan chiefs, where she became the Heir presumptive until her father's succumbing to tuberculosis. \n\nIn 1917, just before his passing, seeking to secure the throne for his daughter, Sālote's father had arranged a marriage between Sālote and one of the most powerful chieftains of Tonga at the time, Viliami Tungī Mailefihi, who would later become the Queen's trusted right hand man. Following her father's passing, she assumed the throne and officially became the Queen of the Kingdom of Tonga, while being only 18 years old. \n\nHer charismatic and gracious personality made her a beloved figure both at home and abroad. Being a skilled diplomat representing Tonga on the global stage, while modernizing and leading her country during challenging times. Despite the pressure faced by foreign powers, she has been successful in preserving her country's independence and has ultimately become the face of the Kingdom of Tonga."
