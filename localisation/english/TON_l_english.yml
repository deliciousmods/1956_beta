l_english:

 # Characters
 TON_salote_tupou_iii:0 "Sālote Tupou III"
 TON_salote_tupou_iii_desc:0 "Sālote Mafile'o Pilolevu was born in 1900 to King George Tupou II and his wife, Lavinia Veiongo. Having grown up in New Zealand due to the danger posed back at home, she received a Western-style education that deeply influenced her worldview, something which would prove invaluable in the coming years. She was later ordered to return back to Tonga by Tongan chiefs, where she became the Heir presumptive until her father's succumbing to tuberculosis. \n\nIn 1917, just before his passing, seeking to secure the throne for his daughter, Sālote's father had arranged a marriage between Sālote and one of the most powerful chieftains of Tonga at the time, Viliami Tungī Mailefihi, who would later become the Queen's trusted right hand man. Following her father's passing, she assumed the throne and officially became the Queen of the Kingdom of Tonga, while being only 18 years old. \n\nHer charismatic and gracious personality made her a beloved figure both at home and abroad. Being a skilled diplomat representing Tonga on the global stage, while modernizing and leading her country during challenging times. Despite the pressure faced by foreign powers, she has been successful in preserving her country's independence and has ultimately become the face of the Kingdom of Tonga."

 TON_sioape_kaho:0 "Sioape Kaho"

 TON_ulukalala:0 "Siaosi Mīsini"

 # Ideas
 TON_political_opposition_r56:0 "Popular Opposition"
 TON_political_opposition_r56_desc:0 "Many in the [ROOT.GetAdjective] parliament feel dissatisfied with the [ROOT.GetLeader]'s leadership. This has led to the formation of a Reactionary Party headed by Sioape Kaho and likeminded individuals, who have been able to garner much support from the local population."

 TON_failed_education_reforms_r56:0 "Failed Education Reforms"
 TON_failed_education_reforms_r56_desc:0 "After King Tupou I had established an independent Tongan church in an attempt to appease the local chiefs of Tonga, many of the Western missionaries who were responsible for the education of the Tongan youth exited the country on mass, leaving the inexperienced Tongans to themselves. Over time, failed reforms have left the Tongan education system in a complete mess."

 TON_risk_of_famine_r56:0 "Risk of Famine"
 TON_risk_of_famine_r56_desc:0 "A year prior, a short famine caused wide-spread hunger all throughout our country. With the frequent possibility of droughts, the threat of a full fledged famine still lingers."

 TON_united_coalition_r56:0 "Popular Opposition"

 TON_queen_salote_constitutional_r56:0 "Sālote Tupou III"
 TON_queen_salote_constitutional_r56_desc:0 "Sālote Mafile'o Pilolevu was born in 1900 to King George Tupou II and his wife, Lavinia Veiongo. Having grown up in New Zealand due to the danger posed back at home, she received a Western-style education that deeply influenced her worldview, something which would prove invaluable in the coming years. She was later ordered to return back to Tonga by Tongan chiefs, where she became the Heir presumptive until her father's succumbing to tuberculosis. \n\nIn 1917, just before his passing, seeking to secure the throne for his daughter, Sālote's father had arranged a marriage between Sālote and one of the most powerful chieftains of Tonga at the time, Viliami Tungī Mailefihi, who would later become the Queen's trusted right hand man. Following her father's passing, she assumed the throne and officially became the Queen of the Kingdom of Tonga, while being only 18 years old. \n\nHer charismatic and gracious personality made her a beloved figure both at home and abroad. Being a skilled diplomat representing Tonga on the global stage, while modernizing and leading her country during challenging times. Despite the pressure faced by foreign powers, she has been successful in preserving her country's independence and has ultimately become the face of the Kingdom of Tonga."

