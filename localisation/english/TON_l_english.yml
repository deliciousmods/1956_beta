 PLY_UNIFIED_polynesian_unifacation:0 "Polynesian Unification Achieved"
 PLY_UNIFIED_polynesian_unifacation_desc:0 "After a huge struggle against the colonial powers in Polynesia, we are able to unite the region once and for all!"
 PLY_UNIFIED_connect_the_villages:0 "Connect the Villages"
 PLY_UNIFIED_connect_the_villages_desc:0 "Most of our islands are underdeveloped and lack sufficient infrastructure. It should be in our best interest to change that."
 PLY_UNIFIED_first_steps_towards_modernisation:0 "Steps Towards Industrialisation"
 PLY_UNIFIED_first_steps_towards_modernisation_desc:0 "Our country is way behind in terms of industrialisation, making us unable to compete with our neighbors. But we can change that by initiating an industrialisation program aimed at modernizing our industries."
 PLY_UNIFIED_connect_the_islands:0 "Build Up Our Islands"
 PLY_UNIFIED_connect_the_islands_desc:0 "In order to make exporting and importing easier for trade partners, we must take measures to build ports in our islands and to ensure that trade can enter and leave our country safely."
 PLY_UNIFIED_develop_taiwan:0 "Develop [524.GetName]"
 PLY_UNIFIED_develop_taiwan_desc:0 ""
 PLY_UNIFIED_exploit_the_fijian_goldmines:0 "Exploit the Fijian Goldmines"
 PLY_UNIFIED_exploit_the_fijian_goldmines_desc:0 "Fiji has large deposits of gold we could potentially use to our advantage, and to grow our economy."
 PLY_UNIFIED_exploit_the_nauruan_phosphate_mines:0 "Exploit the Nauruan Phosphate Mines"
 PLY_UNIFIED_exploit_the_nauruan_phosphate_mines_desc:0 "Nauru has a large quantity of phosphate on its island which has been proven to be the highest quality of phosphate in the world. It would be wasteful not to use this phosphate to our own benefit."
 PLY_UNIFIED_seize_japanese_assets:0 "Seize Japanese Assets"
 PLY_UNIFIED_seize_japanese_assets_desc:0 "Following the seizure of the Micronesian islands, the Japanese have left their assets unprotected. We could seize these assets and grow our economy."
 PLY_UNIFIED_educational_reform:0 "Education Reform"
 PLY_UNIFIED_educational_reform_desc:0 "A large portion of our population is lacking in the education sector due to neglect from their previous European overlords. We must give them what they lacked, and make sure the current and future generations of our country are well educated."
