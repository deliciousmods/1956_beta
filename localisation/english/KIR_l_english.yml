 canton_island.1.d:0 "Recently, a convoy of American scientists was sent to the islands to oversee the ongoing solar eclipse. Although their original mission was only to observe the eclipse, they have decided to go a step further, and occupy the islands."
 canton_island.1.a:0 "We have more pressing matters at hand.."

 USA_contest_canton_island:0 "Occupy Canton Island"
