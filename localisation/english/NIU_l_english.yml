 NIU_memories_from_ww1:0 "Memories of the Great War"
 NIU_memories_from_ww1_desc:0 "In 1915 we sent a contingent of 150 men to fight a war which we had no right to be in, and did not need to participate in. \nThe brave [NIU.GetAdjective] soldiers fought in France, but had to be sent back home in 1917 due to disease. From then on, we have remained on our island and uninvolved in foreign conflict. And we intend to keep it that way. \n\n§YIn order to remove this spirit, we must raise an army consisting of a single battalion.§!"
