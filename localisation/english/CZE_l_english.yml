 CZE_continue_the_fight: "Continue the Fight"
 CZE_continue_the_fight_desc: "Our country may have fallen but not our nation and spirit."

 CZE_organize_exiles: "Organize the Exiles"
 CZE_organize_exiles_desc: "To effectively organize resistance against the occupiers, we have to gather all exiles to be stronger."

 CZE_organize_new_legions: "Establish the New Legions"
 CZE_organize_new_legions_desc: "To reclaim the motherland, as it was done in 1918, legions have to be formed."

 CZE_enlist_czech_pilots_in_raf: "Enlist Czech Pilots"
 CZE_enlist_czech_pilots_in_raf_desc: "Over 1500 brave men fled our country in order to fight from overseas for our homeland."

