 #################################################################################
 ######################## Dem. Hist + Alt Political Tree #########################
 #################################################################################


 CZE_sideline_the_sdp: "Sideline the SdP"
 CZE_sideline_the_sdp_desc: "The 1935 elections ended in a surprise for everyone, as the SdP ended up winning with the most votes (15.2%). And while Konrad Henlein personally assured the president of his loyalty to Czechoslovakia, it is obvious that letting him be in charge of forming the government would only lead to further radicalization of minorities."


 CZE_help_republican_spain: "Help Republican Spain"
 CZE_help_republican_spain_desc: ""


 CZE_international_armament_exports: "International Armament Exports"
 CZE_international_armament_exports_desc: "Military export was a very important part of the Czechoslovak economy, with the country being the fourth largest general military materials exporter and the second largest small arms exporter in the world in 1930. Consequently, the factories are seldom left without work."


 CZE_a_wide_coalition: "A Wide Coalition"
 CZE_a_wide_coalition_desc: "The recent elections showed us that only by working together can we overcome the threat of fascism and brave the upcoming storm. The new coalition will unite seven parties, with the agrarian RSZML taking the lead. With an ethnic SLovak becoming the PM, it seems that things might start changing to the better."

 CZE_a_new_king_of_the_castle: "New King of the Castle"
 CZE_a_new_king_of_the_castle_desc: "T. G. Masaryk's selection of Beneš as his successor indicates his belief in Beneš's qualifications for the high office. Given that Czechoslovakia owes its very existence to Masaryk, it would be unwise to challenge his decision. Beneš shall take up the mantle of the new king of the Castle, tasked with protecting the Czechs from the tide of 20th century radicalism."

 CZE_reaffirm_treaty_with_france: "Reaffirm Treaty with France"
 CZE_reaffirm_treaty_with_france_desc: "Even though it is quite unfortunate, it seems that France remains our only possible ally. Therefore, we must reaffirm our commitments and hope that France does the same."

 CZE_the_february_treaty: "The February Treaty"
 CZE_the_february_treaty_desc: "With Milan Hodža becoming the PM, it looks like we might finally be able to start solving at least some of our problems. The National Political Program, also known as the February Treaty, will include more government assistance for German minorities in the Sudetenland region, as well as more government contracts with local industry."

 CZE_the_fourth_plan: "The Fourth Plan"
 CZE_the_fourth_plan_desc: "The SdP demands we sign the so-called Karlsbader program. It will spell disaster for our country, while these radicals will find something new to complain about. But, considering the pressure that England and France are applying upon us, Edvard Beneš, the minister of foreign affairs, has come up with a plan that, while addressing some of the economic problems, will still let us remain in control of our territories."

 CZE_government_resignation: "Government Resignation"
 CZE_government_resignation_desc: "Our current leadership is clearly incapable of dealing with the pressures exerted by the Reich and our "allies." With widespread demonstrations against giving up our territory, the government has no choice but to resign."

 CZE_the_treaty_stands: "The Treaty Stands"
 CZE_the_treaty_stands_desc: "It looked like our allies had abandoned us, considering how actively they tried to make us give up our land. But it seems that when push came to shove, they remained loyal and chose honour."

 CZE_together_to_victory: "Together to Victory"
 CZE_together_to_victory_desc: "Now that the SdP has lost its ally in the Third Reich, we can finally eliminate it and bring peace to our lands."

 CZE_bastion_of_democracy: "Bastion of Democracy"
 CZE_bastion_of_democracy_desc: "Czechoslovakia has persevered and survived the recent turbulent events, emerging out of them as a true beacon of liberty and democracy. And our people will do everything they can to protect it."

 CZE_western_betreyal: "Western Betreyal"
 CZE_western_betreyal_desc: "We were foolish to trust France and England. Now that it is clear that they are going to side with Germany, we must choose - will we give up our land and fold to the Munich Dictat, or will we resist and fight?"

 CZE_death_before_surrender: "Death Before Surrender"
 CZE_death_before_surrender_desc: "France and England betrayed us and refused to come to our aid. So be it, but we will not surrender. We have an impregnable defence line, a modern army, and an ally in the Soviet Union, who promised to support us even if France didn't. We will not give up without a fight. Let them come."

 CZE_soviet_military_shipments: "Soviet Military Shipments"
 CZE_soviet_military_shipments_desc: "The Soviets want to strengthen our military to strengthen our position as a buffer state."

 CZE_reform_the_state: "Reform the State"
 CZE_reform_the_state_desc: "Our previous government wasn't able to solve the main economic and political problems. Now that the government has absolute power, we can finally begin reforming our society."

 CZE_czecho_slovak_social_democracy: "Czecho-Slovak Social Democracy"
 CZE_czecho_slovak_social_democracy_desc: "With the war finally over, we can start focusing on rebuilding our country and making it a better place to live for everyone."

 CZE_expand_the_welfare_state: "Expand the Welfare State"
 CZE_expand_the_welfare_state_desc: "Our welfare state is becoming just a burden not helping anybody. It truly needs to be helping workers of Czechoslovakia."

 CZE_social_security_benefits: "Increase Social Security Benefits"
 CZE_social_security_benefits_desc: "Elderly are people too and we should care for them even when they are not war veterans."

 CZE_provide_free_healthcare: "Provide Free Healthcare"
 CZE_provide_free_healthcare_desc: "As the risk of disease is rapidly increasing we have to provide healthcare services for free."

 CZE_we_were_left_alone: "We Were Left Alone"
 CZE_we_were_left_alone_desc: "It would be unwise to start a European war that we would have no hope of winning. Without France and England, it wouldn't be possible to hope for victory. As a result, we must rely on Hitler's assurances that the Sudetenland is his final demand from Europe."


 CZE_set_up_refugee_camps: "Set Up Refugee Camps"
 CZE_set_up_refugee_camps_desc: "A lot of our former citizens are fleeing from their occupied lands; we must set up refugee centres to minimise casualties and resettle our people inside what's left of our country."


 CZE_capitulate_the_state: "Capitulate the State"
 CZE_capitulate_the_state_desc: "The Third Reich continues to pressure us for the rest of our territory, and just as before, the allied guarantees seem to be absolutely useless. Considering that we lost our main defence line in Sudetenland, we have no choice but to capitulate the state faster than the Reich annexes it by force."


 CZE_standing_firm: "Standing Firm"
 CZE_standing_firm_desc: "Surprisingly, the Fourth Plan was a success, largely diffusing the current situation. With the SdP's influence waning, it is possible to move on and begin removing said party from our country." 


 CZE_realign_the_parties: "Realign the Parties"
 CZE_realign_the_parties_desc: "Radical problems require radical solutions, and the current leadership seems incapable of implementing them. This means that Hodža must resign and let the foreign minister, Eduard Beneš take the lead."


 CZE_deal_with_the_radicals: "Deal with the Radicals"
 CZE_deal_with_the_radicals_desc: "Allowing SdP and HSLS to operate was a mistake. These radical parties that were sponsored by hostile foreign powers should be banned immediately."


 CZE_monopolize_slovak_industry: "Monopolize Slovak Industry"
 CZE_monopolize_slovak_industry_desc: "The Slovak bourgeoisie is too incompetent to be allowed to operate strategic industries and resources in Slovakia. By forcing them to operate under the Czech companies, we could increase the output."


 CZE_confiscate_sudeten_factories: "Confiscate Sudeten Factories"
 CZE_confiscate_sudeten_factories_desc: "The Sudeten Germans have always been disloyal to our state. Therefore, it will only be fair if we confiscate some of the Sudeten industry."


 CZE_expell_the_minorities: "Pass the Beneš Decrees"
 CZE_expell_the_minorities_desc: "Recent events showed us that we cannot allow Sudeten Germans to continue living in our country. The only possible way to solve this problem is to relocate them from Sudetenland. However, not everyone will be happy with such a drastic solution."


 CZE_unite_the_nation: "Unite the Nation"
 CZE_unite_the_nation_desc: "Now that we have expelled the Germans from Sudetenland, we can finally unite the country and solve its economic problems."


 CZE_accept_the_karlsbader_programm: "Accept the Karlsbader Programm"
 CZE_accept_the_karlsbader_programm_desc: "The actions of our "Western Allies" have shown that they will not risk a war to help us, regardless of what papers they signed. Therefore, we must try to survive on our own, which means we will have to sign the Karlsbader treaty that the SdP wants. It is improbable that it will be enough, but at least the treaty will help us win some time."


 CZE_federalize_the_state: "Federalize the State"
 CZE_federalize_the_state_desc: "To save our lands from our greedy neighbours, we must commit to a drastic solution - the federalization of the entire state. Although it will be very unpopular with our core Czech population, it is our only choice if we want to avoid war."


 CZE_reorganize_political_parties: "Reorganize Political Parties"
 CZE_reorganize_political_parties_desc: "The time has come to begin the implementation of some drastic changes, and we do not have time for ordinary political squabbles. Therefore, we must unite our political parties into one and replace the PM with someone who can get things done."


 CZE_the_prague_agreement: "The Prague Agreement"
 CZE_the_prague_agreement_desc: "Hitler wants our industrial power, and we can provide it to him for guarantees of our independence. And with our previous actions, even he can no longer come up with lies about our treatment of the German minority. Obviously, he will expect us to renounce France and England, but it's not like they were particularly useful to us anyway."


 CZE_contact_the_allies: "Contact the Allies"
 CZE_contact_the_allies_desc: "While the Prague agreement was a diplomatic success, we can no longer tolerate the direction in which our country is being led. And even though France and England did not help us, Czechoslovakia should still help them in the fight against the Third Reich."


 CZE_bratislava_memorandum: "Bratislava Memorandum"
 CZE_bratislava_memorandum_desc: "The time has come to end this ridiculous federation and get rid of the Prague Agreement. We will send our subjects an ultimatum - either they will accept full reintegration or we will reintegrate them ourselves."


 CZE_start_the_regional_investments_programm: "Start the Regional Investments Programm"
 CZE_start_the_regional_investments_programm_desc: "With our independence secured, we can finally start solving the economic inequality problem that has plagued us for a long time. With a sizable concentration of our industry in the less developed areas of our federation, we will be able to create a better future for us all."


 CZE_contact_the_comintern: "Contact the Comintern"
 CZE_contact_the_comintern_desc: "We will never be safe with the fascist Third Reich on our borders. It means that a war will be our only solution, and the Soviet Union our only real ally."


 CZE_united_against_fascism: "Together Against Fascism"
 CZE_united_against_fascism_desc: "We have built up our army, and now, with the help of our Soviet allies, we are ready to stop this disastrous ideology once and for all."


 CZE_united_once_more: "United Once More"
 CZE_united_once_more_desc: "Under the prudent leadership of our party, we have braved the storm and emerged from it even better than before."


 CZE_split_away_from_germany: "Split Away from Germany"
 CZE_split_away_from_germany_desc: "The time has come to distance ourselves from the Reich. With our state being far more stable and our army being even stronger than before, we can slowly start reducing our commitments to Germany."


 CZE_start_reintegration_process: "Start Reintegration Process"
 CZE_start_reintegration_process_desc: "With the conclusion of our regional investments program, we can finally see how working together can create a better future for all of our people."

 CZE_undermine_the_hrad: "Undermine the Hrad"
 CZE_undermine_the_hrad_desc: "The Hrad has been a thorn in the side of Czechoslovakia for a long time. Although it would have been political suicide to oppose the revered "Father of Czechs," Masaryk, his successor, Beneš, is a different matter altogether. We must diminish the Hrad's influence for the good of the Republic, as the tide of nationalism that contributed to the fall of the Empire is rising again, and this time we may take its place."

 CZE_military_support_to_israel: "Promote Military Aviation Exports"
 CZE_military_support_to_israel_desc: ""

 ########################### Little Entente, CEF, MoD ############################

 CZE_elect_the_future_king: "Elect the Future Monarch"
 CZE_elect_the_future_king_desc: ""

 CZE_the_realists_approach: "The Realist's Approach"
 CZE_the_realists_approach_desc: "It is evident that our alliance with the West is a futile endeavour, and this should have been clear from the outset. We must either seek to restore our relations within the Little Entente or pursue PM Hodža's dream of a Central European Federation. However, before we embark on either course, we must first settle our domestic problems."

 CZE_the_issue_of_unempolyment: "The Issue of Unemployment"
 CZE_the_issue_of_unempolyment_desc: "Unemployment has become a top issue in our politics, especially in Slovakia and Carpathian Ruthenia."

 CZE_prepare_pol_refs: "Prepare Political Reforms"
 CZE_prepare_pol_refs_desc: "Our political system is incredibly flawed, if we want to stand tall on the European stage then reform is desperatly needed."

 CZE_fair_investments_prog: "Fair Investments Programme"
 CZE_fair_investments_prog_desc: "" #Check description

 CZE_eject_the_president: "Eject the President"
 CZE_eject_the_president_desc: "The democratic front has done huge amounts of damage to our nation and our people. It's about time we remove them from power,starting with the President."

 CZE_between_the_swastika_and_the_sickle: "Between the Swastika and the Sickle"
 CZE_between_the_swastika_and_the_sickle_desc: "Our country is surrounded by enemies. The only way to maintain our independance is a defensive block of our own."

 CZE_in_palackys_footsteps: "In Palacky's Footsteps"
 CZE_in_palackys_footsteps_desc: "The ideals of Palacky's Austroslavism are ones,that our country needs to take to heart!"

 CZE_the_cef: "The Central European Federation"
 CZE_the_cef_desc: "To achieve Austroslavism we need reintegrate our former oppressors under the triple monarchy!"

 CZE_follow_hodzas_ideas: "Follow Hodža's Ideas"
 CZE_follow_hodzas_ideas_desc: "" #Check description

 CZE_the_habsburg_solution: "The Habsburg Solution"
 CZE_the_habsburg_solution_desc: "With the endorsement of Otto von Habsburg we might be able to convince to austrian people to join our federation willingly."

 CZE_budapest_agreement: "Budapest Agreement"
 CZE_budapest_agreement_desc: "We have to convince the Hungarians that it is in their best interest to join the federation."

 CZE_resolve_the_sudeten_opposition: "Resolve the Sudeten Opposition"
 CZE_resolve_the_sudeten_opposition_desc: "The radicalisation and opposition of the Sudeten germans has caused our nation great pain,it shall no longer be tolerated."

 CZE_the_principle_of_national_autonomy: "The Principle of National Autonomy"
 CZE_the_principle_of_national_autonomy_desc: "The core idea of a federation is the right of Autonomy to several of its regions,we shall achieve said idea for ourselves."

 CZE_gemran_monarchist_infiltration: "German Monarchist Infiltration"
 CZE_gemran_monarchist_infiltration_desc: "German monarchists disgruntled with the current regime have been offering support to our cause. Accepting this support seems like a necessity."

 CZE_shift_internal_politics: "Consolidate the Šlechta"
 CZE_shift_internal_politics_desc: "The broader public does not necessarily support our cause, we should focus the consolidation of our country on the aristocrats and nobility."

 CZE_secret_negotiations_with_horthy: "Secret Negotiations with Horthy"
 CZE_secret_negotiations_with_horthy_desc: "The Horthy regime has shown interest in joining our renewed superpower. We should gain their total support through negotiations."

 CZE_enlist_the_kaisers_support: "Enlist the Kaiser's Support"
 CZE_enlist_the_kaisers_support_desc: "We cannot consolidate power on our own. Now that we control the slechta we should reach out to the kaiser for support."

 CZE_the_march_on_prague: "The March on Prague"
 CZE_the_march_on_prague_desc: "Now its our time to strike, remove the traitors from power and install Schwarzenberg!"

 CZE_restore_the_monarchy: "Establish the Danube Monarchy"
 CZE_restore_the_monarchy_desc: "With total control over the country we shall restore another monarchy on the Danube."

 CZE_reestablish_the_evb: "Reestablish the Evidenzbüro"
 CZE_reestablish_the_evb_desc: "The Evidenzbüro used to be the news source for military afairs for the Austro-Hungarian empire, after its fall it was dissolved, but since we have grasped power once more the reestablishment of the agency seems like the only logical conclusion" #Check description

 CZE_reclaim_lost_lands: "Reclaim Lost Lands"
 CZE_reclaim_lost_lands_desc: "Ever since the treatys of Trianon and Saint-Germain we've been missing alot of our southern and eastern territories. But now that we have regained our strength we shall revise those treaties by sending an ultimatum to Austria."

 CZE_central_powers_once_again: "Central Powers Once Again"
 CZE_central_powers_once_again_desc: "After our horrible defeat in the great war, our alliance, which covered a good chunk of Europe was dismantled. Now that our position is temporarily secured we shall ask the Germans to rejoin their block."

 CZE_prepare_infiltration_groups: "Prepare Infiltration Groups"
 CZE_prepare_infiltration_groups_desc: "With the Evidenzbüro reestablished we now have acces to modern infiltration techniques, we shall make use of them to give us an edge in any conventional war."

 CZE_military_buildup: "Military Buildup"
 CZE_military_buildup_desc: "Through the temporary relocation of funds from civilian sectors to the military we shall bridge the gab between our military and the other European powers."

 CZE_arm_the_szekelys: "Arm the Székelys"
 CZE_arm_the_szekelys_desc: "Through the armament of Hungarian minorities in Transilvania we might be able to expand our influence in the region."

 CZE_support_yugoslav_separatists: "Support the Yugoslav Separatists"
 CZE_support_yugoslav_separatists_desc: "We shall gather support by the Yugoslav minorities who dont wanna be part of the yugoslav experiment anymore."

 CZE_ignite_the_sparks: "Ignite the Sparks"
 CZE_ignite_the_sparks_desc: "With support among minorities in our former owned regions it would just be the natural conclusion that we ask of said territories back. Their refusal shall have consequenzes."

 CZE_ask_for_arbitration: "Ask for Arbitration"
 CZE_ask_for_arbitration_desc: "Instead of trying to pressure Romania and Yugoslavia on our own we should perhaps ask Germany for support."

 CZE_repeal_the_restitution_act: "Repeal the Restitution Act"
 CZE_repeal_the_restitution_act_desc: "" #Check description

 CZE_use_royal_ties: "Use the Royal Ties"
