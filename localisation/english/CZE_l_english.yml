 CZE_beness_counterproposal: "The February Agreement failed, and the Karlsbader Programme was rejected"

 CZE_february_agreement_agreed: "The February Agreement of §Y1937§! was signed with Wenzel Jaksch of the Sudeten German Social Democrats."

 CZE_sdp_hsls_coop: "SdP HSĽS cooperation"
 CZE_sdp_hsls_coop_desc: "It seems that the HSĽS leader Hlinka and the second in command of the SdP Karl Hermann Frank have agreed to begin a cooperation between their parties."

 CZE_ban_the_tschechenspiegel: "Ban the Tschechischen Spiegel"
 CZE_ban_the_tschechenspiegel_desc: "The Tschechischen Spiegel, a German-language newspaper based in Vienna, has been reporting on various issues in the Sudetenland. However, its corrosive nature is no longer tolerable and the only solution is to ban the newspaper from being published in our territory."

 CZE_suppress_independent_newspapers: "Suppress Independent Newspapers"
 CZE_suppress_independent_newspapers_desc: "Our government has, to this point, tolerated diverse oppositional publications, but some of them have recently been jeopardizing our country's security and stability. The Czech "Völkerbund", the Sudeten "Zeitschrift", and the "Bohemia" of Prague shall all be closed in accordance with Law 201, and all their present publications shall be confiscated."

 CZE_extend_the_censorship_law: "Extend the Censorship Law"
 CZE_extend_the_censorship_law_desc: "The effects of the 3rd Section's rigorous monitoring of all Hungarian literature have been evident in the curbing of Hungarian secessionism in the southern territories of our Slovakian lands. By possibly implementing similar measures in the Sudetenland region, we may attain comparable outcomes."

 CZE_feb_plan: "§YBeneš's Missions:§! February Plan Commitments"

 cz_tt_22: "Unlock §YFebruary Plan Commitments§! decisions. Failing to complete them will result in deepening ethnic tensions."

 cz_tt_23: "\n§YChoosing§! this option will §Rlock us§! to §YThe Fourth Plan§! focus path"

 CZE_support_cz_nationalists_in_parl: "Support Czech nationalist parties in the Parliament"
 CZE_support_cz_nationalists_in_parl_desc: "The Czech nationalist factions have been losing their hold, with a mere 8% of votes garnered by various right-wing parties. Increasing their funding would enable us to make the functioning of Parliament considerably more difficult, thereby bolstering the authority of the Castle."

 CZE_invest_in_legiobanka: "Invest in Legiobanka"
 CZE_invest_in_legiobanka_desc: "The Legiobanka has been the main supporter of far-right parties such as the NSj and the NOF. Increasing its prominence will increase the influence of such figures as Radola Gajda and others."

 CZE_unlock_CZE_the_february_treaty_tt: "\n§YUnlock§! §YThe February Treaty§! national focus."

 CZE_fund_public_projects: "§YBeneš's Missions:§! Fund Public Works"
 CZE_fund_public_projects_desc: "Unfortunately, the lamentable contrast in the rate of joblessness between the Sudeten Germans and the Czechs has been a scourge upon our land for far too long. Therefore, by commencing a public works scheme subsidised by the government, we shall undoubtedly diminish unemployment to a great extent whilst simultaneously creating significant infrastructure in the region. \n§WCompleted reforms:§! §Y[?reform_promises]§!"

 CZE_fund_projects_ci_tt: "\nIncrease the number of completed §YReform promises§!\n"

 CZE_implement_proportional_rep: "§YBeneš's Missions:§! Implement Proportional Representation"
 CZE_implement_proportional_rep_desc: "One of the principal points of contention between the central administration and the Sudeten folk is the lack of representation in the regional bureaucracies. A recent inquiry found that there exists a shortfall of 44,000 positions in the Sudetenland, which should be occupied by Sudeten Germans. Nevertheless, with new government edicts and increased investments, this predicament can be redressed and improved upon. \n§WCompleted reforms:§! §Y[?reform_promises]§!"

 CZE_cancel_52_tt: "Increase the number of completed §YReform promises§!"

 CZE_return_multiling_ci_tt: "Increase the number of completed §YReform promises§!"

 CZE_prop_rep_ci_tt: "Increase the number of completed §YReform promises§!"

 CZE_cancel_the_52_law: "§YBeneš's Missions:§! Cancel Law 52"
 CZE_cancel_the_52_law_desc: "The 52nd Law stipulates that passing Czech language state examinations is mandatory for anyone aspiring to assume any administrative post. Wenzel Jaksch states that it is prejudicial to the Sudeten Germans, who constitute an overwhelming majority of German speakers in the region. Though it may be feasible to abolish this legislation, it is likely to cause a great displeasure among Czech nationalists. \n§WCompleted reforms:§! §Y[?reform_promises]§!"

 CZE_return_to_multilingualism: "§YBeneš's Missions:§! Return to the Practise of Multilingualism"
 CZE_return_to_multilingualism_desc: "During the days of the Austro-Hungarian Empire, the Imperial Reichsrat had an interesting practise in place: the deputies could speak any of the 12 officially recognised state languages. And even though that is, at least in theory, still allowed by the Czechoslovak laws, it has seldom been practised lately. In addition to that, there has been a push to replace the minority languages from the public sphere. Wenzel Jaksch firmly believes that the return to the former practise will show the national minorities of Czechoslovakia that the country really cares about them; this is certainly something we should consider doing, though such an action will definitely earn us the ire of the Czech nationalists. \n§WCompleted reforms:§! §Y[?reform_promises]§!"

