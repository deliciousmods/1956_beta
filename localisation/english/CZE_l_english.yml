 CZE_economic_inequality_idea: "Economic Inequality"
 CZE_economic_inequality_idea_desc: "The Great Depression, the government's late abandonment of the gold standard, and the laissez-faire approach to economic development gave rise to a significant inequality problem, with the bulk of wealth concentrated in the central Bohemian regions, fueling the radicalization of Sudeten Germans and stirring up resentment among Slovaks and Hungarians. Adding to the troubles, the Sudetenland has been grappling with a severe unemployment crisis, with up to five times more jobless Sudeten Germans compared to Czechs in the Bohemian and Moravian regions."


