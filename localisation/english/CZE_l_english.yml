 #################################################################################
 ################################# Internal Woes #################################
 #################################################################################

 CZE_internal_woes: "Internal Woes"
 CZE_internal_woes_desc: "Czechoslovakia, as a successor of Austria-Hungary, has inherited its diverse makeup. As per the 1921 census, just 64% of the populace was "Czechoslovak" (under Masaryk's conception, Czechs and Slovaks were supposedly a single nationality). The largest minority were the Sudeten Germans, constituting approximately 24% of the population. As the interwar era unfolded, particularly after the Great Depression, the national minorities demanded more rights from the Czechs."

 CZE_minorities_revolt: "The Minorities are revolting!"
 CZE_minorities_revolt_desc: "The situation is spiraling out of control. If we don't do anything, the minorities shall start a civil war!"

 CZE_slovak_tax: "§YBeneš's Missions:§! Decrease Taxes in Slovakia"
 CZE_slovak_tax_desc: "The hardworking farmers of Slovakia have been burdened with excessive taxes for an extended period of time. The crippling effect of the Great Depression on our economy has only compounded the difficulties faced by ordinary Slovaks. To add to this, President Beneš has made a pledge to the autonomist HSĽS party to grant them greater autonomy in exchange for their support of his presidency.\n§WCompleted reforms:§! §Y[?reform_promises]§!"

 CZE_ruth_tax: "§YBeneš's Missions:§! Decrease Taxes in Subcarpathia"
 CZE_ruth_tax_desc: "The Ruthenian region, one of the most destitute areas in the country, has been deprived of basic amenities for its population. The region also bears the brunt of the unjust taxation policies of the central government, which has further exacerbated the situation. To kickstart the process of modernization in the region, the first step must be taken to alleviate the burden of unfair taxation.\n§WCompleted reforms:§! §Y[?reform_promises]§!"

 CZE_beness_promises: "§YBeneš's Promises§!"
 CZE_beness_promises_desc: "In order to secure his election, President Beneš had to persuade the autonomist parties representing the Slovak and Hungarian national minorities to endorse his candidacy. To gain their support, he pledged to introduce reforms that would enhance their autonomy and expand their rights.\n§WCompleted reforms:§! §Y[?reform_promises]§! §Wout of§! §Y5§!"

 CZE_legalise_respwehr: "Legalise The Respwehr"
 CZE_legalise_respwehr_desc: "The Respwehr (Republikanischer Wehrmacht) was a paramilitary organization of the Social-Democratic Sudeten German Party. Following the elections, the government legalised the organization, which was primarily responsible for protecting workers' demonstrations and occasionally engaging in clashes with the Freikorps of the Sudeten German Party. The main objective of the Respwehr was to maintain the region's allegiance to Czechoslovakia while advocating for greater autonomy and expanded rights for the Sudeten Germans."

 CZE_beness_visit: "Visit the Sudetenland"
 CZE_beness_visit_desc: "Beneš visited Sudetenland in the summer of 1936. He tried to calm the discontented population and promised certain changes, which, however, never materialised."

 CZE_repeal_the_censorship_law: "§YBeneš's Missions:§! Repeal the Slovak Censorship Law"
 CZE_repeal_the_censorship_law_desc: "In 1935, Masaryk's Castle enacted a censorship law that placed all Hungarian literature in the Slovak region under strict control by the Castle's propaganda ministry, the 3rd Section. As per this law, all books and magazines were required to undergo screening before they could be distributed in regions where the majority of the population consisted of Hungarians. Repealing this law will surely please János Esterházy and his Hungarian autonomists.\n§WCompleted reforms:§! §Y[?reform_promises]§!"

 CZE_fund_the_prager_presse: "Fund the Prager Presse"
 CZE_fund_the_prager_presse_desc: "The Prager Presse was a newspaper established by the 3rd Section of the Castle with the aim of reaching out to the Sudeten Germans. The newspaper's primary objective was to discourage the minority from taking any radical steps and to foster their loyalty to the government."

 CZE_hun_parties_unification: "Hungarian Opposition Uniting"
 CZE_hun_parties_unification_desc: "The Second Section has informed us about the plans of the Hungarian opposition to form the united front. Since such a bold action would certainly be in violation of Law 201, this will surely irk the more nationalist circles of the parliament."

 CZE_amend_the_201_law: "§YBeneš's Missions:§! Amend Law 201"
 CZE_amend_the_201_law_desc: "On October 25, 1933, Masaryk's Castle passed Law 201, also known as the "Law concerning suspension of activities and dissolution of political parties". This law granted the central government the power to dissolve or suspend any political organization that was deemed to "gravely endanger" the state, with no possibility of appeal. While completley abolishing it may not be in our interests, we could still amend it to be less antidemocratic.\n§WCompleted reforms:§! §Y[?reform_promises]§!"

 CZE_increase_slovak_funding: "§YBeneš's Missions:§! Invest in Slovakia"
 CZE_increase_slovak_funding_desc: "The creation of Czechoslovakia in 1918 highlighted a significant problem - the enormous difference between the Cisleithanian and the Transleithanian parts of the former Austro-Hungarian Empire. Some have said that this difference amounted to about 50 years. The Czechoslovak government's laissez-faire attitude has only exacerbated this gap, leading to growing disillusionment among Slovaks who feel exploited by Prague without receiving any benefits in return. To address this, the central government should increase funding for local projects and begin the process of reconciliation with the Slovak population.\n§WCompleted reforms:§! §Y[?reform_promises]§!"

 CZE_investigate_hungarian_spies_army: "Investigate reports of infiltration into the army"
 CZE_investigate_hungarian_spies_army_desc: "We have recieved information about possible leaks of secret information from our army"

 CZE_further_investigation_into_hungarian_spies: "Further investigation of Hungarian spies in the army"
 CZE_further_investigation_into_hungarian_spies_desc: "While some hoped that V. Tikal was just one isolated occurence it seems that the Hungarian infiltration into our army is much deeper than was previously thought. A series of arrests of high rated officers rang through the army, including that of Captain Wilhelm Ketzern of the 10th Infantry Regiment in October. Later, Staff Sergeant Major Josef Krejz of the artillery section 252 was arrested, tried, and sentenced to death by a firing squad. During his interrogation, Krejz revealed the name of Bohumil Opočenský, the chief of staff of the 5 division, as a possible co-conspirator. However, Opočenský passed away during questioning, reportedly due to a heart failure. We must investigate how far has this infiltration gone before any sensitive information gets leaked."

 CZE_a_51_warns_of_leaks: "Agent A-51 warns of further leaks"
 CZE_a_51_warns_of_leaks_desc: "We have recently received a warning from our agent in the Abwehr A-51, informing us of a potential breach of top-secret information. In light of this warning, it is imperative that we launch an immediate investigation to prevent any further leaks."

 CZE_cancel_the_201_law: "Cancel the 201 Law"
 CZE_cancel_the_201_law_desc: "The time has come to cancel the undemocratic 201 Law. With enough support from the parliamentary parties it will be possible to cancel the law."

 CZE_arm_sokol_paras: "Arm the Sokol Paramilitaries"
 CZE_arm_sokol_paras_desc: "The Sokol organization has maintained a paramilitary contingent, comprised of strong young men, with no access to substantive armaments. However, if the group were to be equipped with weapons, the government would be in possession of a potent instrument within the realm of semi-sanctioned paramilitary operations, thereby affording a credible basis for action, in the event of violent exigencies."

 CZE_ban_turnverbund: "Ban the Turnverbund"
 CZE_ban_turnverbund_desc: "The Turnverbund, a German gymnastics league akin to the Czech Sokol, enjoyes a close association with the SdP. It is apparent that the organization harbours an adversarial stance towards our government and serves as a breeding ground for radicalisation. Therefore, we ought to contemplate prohibiting it, notwithstanding the likelihood of provoking a hostile response from its adherents."

 CZE_hsls_7th_congress: "Slovak People's Party's 7th Congress"
 CZE_hsls_7th_congress_desc: "The 7th Congress of the Slovak People's Party is scheduled for the 19th of September, and it is uncertain what remarks Hlinka will make on this occasion. Should the commitments made to the autonomists be fulfilled, we may emerge unscathed. However, if these undertakings are not honoured, Hlinka will undoubtedly express his strong disapproval and advance his autonomist agenda."

 CZE_karol_sidor_speech: "Karol Sidor gives a speech at the Comenius University"
 CZE_karol_sidor_speech_desc: "Karol Sidor, a member of the HSĽS party, is scheduled to deliver a speech to the local students at Comenius University. It seems certain that his address will pour even more oil into the fire."

 CZE_karlsbader_speech: "Karlsbader Speech"
 CZE_karlsbader_speech_desc: "Konrad Henlein is preparing to deliver a speech in the city of Karlsbad (Karlovy Vary in Czech), in which he will unveil his program of reform for the Czechoslovak state and propose a comprehensive overhaul of the Czechoslovak minority policy."

 CZE_sdp_frank_radicalising: "Radicalisation of the SdP"
 CZE_sdp_frank_radicalising_desc: "From the outset, K. Henlein leaned towards the Austrofascist concepts of Dr. O. Spann, but Karl Herman Frank is an explicit proponent of the Hitler's version of the ideology. As the country becomes more volatile, it may be simpler for Frank to draw the party towards the far-right."

 CZE_february_agreement_speech: "Wenzel Jaksch's reformation proposal"
 CZE_february_agreement_speech_desc: "The leader of the Sudeten German Social Democratic Party, Wenzel Jaksch, along with his party members are working on a comprehensive reform plan."

 CZE_hsls_8th_congress: "Slovak People's Party's 8th Congress"
 CZE_hsls_8th_congress_desc: "The 8th Congress of the Slovak People's Party is scheduled for the 19th of September, and it is certain that the autonomists will push their agenda of self-determination. 3rd Section reports that some of the HSĽS leaders are urging Tiso to go even further in his upcoming speech. Whatever the outcome may be, it is bound to exacerbate tensions."

 CZE_increase_3rd_section_funding: "Increase 3rd Section's funding"
 CZE_increase_3rd_section_funding_desc: "The 3rd Section is an internal propaganda ministry that reports directly to the Castle. It played a vital role in creating and promoting Masaryk's cult of personality while discrediting any potential opponents. The 3rd Section is also responsible for conducting active anti-restorationist propaganda against the Habsburgs, Hungarians, and Austrians. By increasing the ministry's budget, we could enhance Beneš's popularity among the Czech population."

 CZE_government_falls: "The Government falls"
 CZE_government_falls_desc: "In the face of the radicalization of the minorities reaching an unprecedented height and Hitler's demands for our territories, the present leadership is forced to contemplate resignation."

 CZE_arrest_henlein: "Arrest the SdP leadership"
 CZE_arrest_henlein_desc: "Now that Germany has cut off its support to the SdP, arresting the party's leadership has become possible. It will be the first step to finish off the internal problems that plague our nation"

 CZE_enact_curfew: "Enact Curfew in Sudetenland"
 CZE_enact_curfew_desc: "Ordering a curfew across the entire region will allow us to curb the activities of the opposition."

 CZE_sudetenland_troubles: "Troubles in Sudetenland"

