 ####### FUTURE ADDITIONS

 ####### cze.447.t: "Autonomy of Slovakia and Carpathian Ruthenia"
 ####### cze.447.desc: "The aftermath of the Munich crisis demanded higher autonomy for the eastern regions of Czechoslovakia. Two constitutional laws of 22 November 1938 (constitutional law no. 299/1938 Coll. on the autonomy of Slovakia and the constitutional law no. 328/1938 Coll. on the autonomy of Carpathian Ruthenia) replaced the existing unified character of the Czechoslovak State with an asymmetrical model of the autonomy of Slovakia and Carpathian Ruthenia, but not the historical Czech lands.\n\nA new local government under Tiso was established in Slovakia, and the name of the country changed from the Czechoslovak Republic to the Czecho-Slovak Republic. However, given the events in 1939 and the occupation of the Czech lands by Germany, the existence of this federation lasted only a few months before the independent Slovak Republic was established as a client state of Nazi Germany."
 ####### cze.447.a: "Prepare the Autonomy."

 #DECISIONS#
 CZE_the_second_czechoslovak_republic: "The Second Czechoslovak Republic"
 CZE_the_second_czechoslovak_republic_desc: "[CZE.GetNameDefCap] is a multiethnic state which emerged out of the decaying Austro-Hungarian Empire in 1918 as an independent nation populated by many ethnic Czechs, Slovaks, Germans, Hungarians, Ruthenians, Poles and many more. \nSuch diversity carries various benefits and obstructions for the young republic. "
 CZE_subcarpathian_ruthenia_political_reforms: "Political Reforms in [73.getName]"
 CZE_subcarpathian_ruthenia_political_reforms_desc: "The aftermath of the Munich crisis demanded higher autonomy for the Eastern regions of [CZE.GetNameDef].\n\nTwo constitutional laws of 22 November 1938 (constitutional law no. 299/1938 Coll. on the autonomy of Slovakia and the constitutional law no. 328/1938 Coll. on the autonomy of Carpathian Ruthenia) replaced the existing unified character of the Czechoslovak State with an asymmetrical model of the autonomy of Slovakia and Carpathian Ruthenia, but not the historical Czech lands."

 CZE_invite_jan_masarik_to_promote_the_czechoslovak_governement_in_exile: "Invite Jan Masaryk to the Exile Government"



