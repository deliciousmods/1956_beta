 CZE_vozhd_gajda_desc: "Radola Gajda, born Rudolf Geidl, is a Czech/Montenegrin military officer and politician. During the First World War, he became a hero of the Czechoslovak Legion in Russia, but later came to be an extremely disputed person, dismissed from the army in 1926 because of his attempted putsch. He cofounded the NoF."
