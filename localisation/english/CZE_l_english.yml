 #################################################################################


 CZE_walter_engines: "Walter Engines"
 CZE_walter_engines_desc: "The Walter company has a history of producing aircraft engines since the days of the Austro-Hungarian Empire. Given that one of the primary bottlenecks in our aircraft development is the absence of modern engines, investing in the Walter company would prove to be highly beneficial for us."


 CZE_fund_further_monoplane_experiments: "Fund Further Monoplane Experiments"
 CZE_fund_further_monoplane_experiments_desc: "Even if our Avia B.534 biplane is among the best currently available, it is obvious that monoplane fighters are the way of the future. František Novotný, head of the Avia construction bureau, has been working to get a modern monoplane airframe ready for production but hasn't been able to build it due to engine issues and a lack of funding. We ought to think about boosting government support for the program."


 CZE_cas_focus: "CAS Focus"
 CZE_cas_focus_desc: "It is apparent that close air support will play an extensive role in the upcoming conflicts. And while our Letov Š-28s have been very successful, we must keep on innovating."

 generic_mio_initial_trait_aircraft_designer: "Aircraft Engine Designer"

