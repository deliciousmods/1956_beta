 CZE_masaryk_president_idea: "Tomáš Garrigue Masaryk"
 CZE_masaryk_president_idea_desc: "Tomáš Garrigue Masaryk, the man who spearheaded the establishment of modern Czechoslovakia from the lands of the Austro-Hungarian Empire, has assumed the mantle of the unchanging President of the Republic. Viewing Czechoslovakia as his offspring, his brainchild, he has perhaps embraced an overly paternalistic outlook on his role, gradually consolidating power under the "Castle" and rendering various powerful ministries subservient to him rather than to the parliament. However, Masaryk's tenure is evidently nearing its end, as he has been beset by serious health issues, and the question of his heir to the presidency is bound to arise soon."

 CZE_benes_president_idea: "Edvard Beneš"
 CZE_benes_president_idea_desc: "Edvard Beneš was personally selected by his mentor T. G. Masaryk to succeed him as the President of Czechoslovakia. While a cunning politician, he may have lacked some finesse in diplomacy, earning the moniker "the little fox" for his unsuccessful intrigues. Some parliamentarians harbour doubts about his strategic competence, but his prowess as a party leader is widely acknowledged."

