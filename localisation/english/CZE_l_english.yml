###---> Characters <><> <><> <><>
 CZE_jan_antonin_bata: "Jan Antonín Baťa"
 CZE_jan_antonin_bata_desc: "Jan Antonín Baťa is a shoe manufacture magnate. He became the owner and chief executive of Baťa company after his half-brother Tomáš Baťa died in an unfortunate plane crash."

 CZE_emil_kolben: "Emil Kolben"
 CZE_emil_kolben_desc: "Emil Kolben is a Czech engineer, entrepreneur, and founder and director of ČKD."

 CZE_radola_gajda: "Radola Gajda"
 CZE_radola_gajda_desc: "Radola Gajda, born Rudolf Geidl, is a Czech/Montenegrin military officer and politician. During the First World War, he became a hero of the Czechoslovak Legion in Russia, but later came to be an extremely disputed person, dismissed from the army in 1926 because of his attempted putsch. He cofounded the NoF."

 CZE_karel_husarek: "Karel Husárek"
 CZE_karel_husarek_desc: "General Karel Husárek holds position of the director of the fortification works."

 CZE_jan_netik: "Jan Netík"
 CZE_jan_netik_desc: "General Jan Netík is the head of the II. 'Artillery and Ordnance' department of Ministry of National Defense since 1927. His department is crucial in forming the rearmament program of the Czechoslovak Army following the Great Depression."

 CZE_milan_hodza: "Milan Hodža"
 CZE_milan_hodza_desc: "Milan Hodža is a prominent Slovak politician and journalist, serving from 1935 to 1938 as the Prime Minister of Czechoslovakia.\n\nAs a proponent of regional integration, he is famous for attempting to establish a democratic federation of Central European states."
 CZE_milan_hodza_pm_desc: "Milan Hodža is a prominent Slovak politician and journalist, serving since 1935 as the Prime Minister of Czechoslovakia.\n\nAs a proponent of regional integration, he is famous for attempting to establish a democratic federation of Central European states."
 CZE_milan_hodza_afterpm_desc: "Milan Hodža is a prominent Slovak politician and journalist, serving from 1935 to 1938 as the Prime Minister of Czechoslovakia.\n\nAs a proponent of regional integration, he is famous for attempting to establish a democratic federation of Central European states."

 CZE_klement_gottwald: "Klement Gottwald"
 CZE_klement_gottwald_desc: "Klement Gottwald is a Czechoslovak communist politician and longtime leader of the Communist Party of Czechoslovakia (KSČ)."
 CZE_klement_gottwald_beforepm_desc: "Klement Gottwald is a Czechoslovak communist politician and longtime leader of the Communist Party of Czechoslovakia (KSČ)."
 CZE_klement_gottwald_pm_desc: "Klement Gottwald is a Czechoslovak communist politician and longtime leader of the Communist Party of Czechoslovakia (KSČ). After the communist coup, he became the Prime Minister and President of Czechoslovakia."

 CZE_prokop_drtina: "Prokop Drtina"
 CZE_prokop_drtina_desc: "Prokop Drtina is a leading member of the National Socialist Party. This influential group shapes Czechoslovak political scene and has close ties to the country's second president Edvard Beneš."

 CZE_silvestr_blaha: "Silvestr Bláha"
 CZE_silvestr_blaha_desc: "Czech general and theorist, head of the Military Office of the President. He is known for his published work about state defense and support equipment. He is a proponent of the extension of mandatory military service."

 CZE_louis_eugene_faucher: "Louis Eugène Faucher"
 CZE_louis_eugene_faucher_desc: "Louis Eugene Faucher is the head of French military mission in Czechoslovakia since 1926. After the Franco-British ultimatum to the Czechoslovak government, he presented his resignation to the French government on 23 September 1938 but remained in Czechoslovakia.\n\nDuring World War II, he was part of Armée secrète (French Resistance)."
 CZE_louis_eugene_faucher_start_desc: "Louis Eugene Faucher is the head of French military mission in Czechoslovakia since 1926. After the Franco-British ultimatum to the Czechoslovak government, he presented his resignation to the French government on 23 September 1938 but remained in Czechoslovakia.\n\nDuring World War II, he was part of Armée secrète (French Resistance)."
 CZE_louis_eugene_faucher_munich_desc: "Louis Eugene Faucher is the head of French military mission in Czechoslovakia since 1926. After the Franco-British ultimatum to the Czechoslovak government, he presented his resignation to the French government on 23 September 1938 but remained in Czechoslovakia.\n\nDuring World War II, he was part of Armée secrète (French Resistance)."

 CZE_vaclav_holek: "Václav Holek"
 CZE_vaclav_holek_desc: "The eldest of the Holek brothers and famous Czechoslovak firearms designer."

 CZE_ludvik_krejci_desc: "Ludvík Krejčí was a Czechoslovak general and Chief of the General Staff of Czechoslovakia from 1933 to 1939."

 CZE_vojtech_luza_desc: "Vojtěch Boris Luža was a Czechoslovak general who supported the offensive tactics of the French Marshal Foch and Ludendorff and the book "Achtung - Panzer!" by German General Heinz Guderian."

 CZE_lev_prchala_desc: "General Prchala was a staunch opponent of the Munich surrender and commander of the IV. Army that guarded the critical South-Moravian border in 1938.\n\nHe was also suspected of forming a plan for a military coup."

 CZE_jan_syrovy_desc: "Jan Syrový was a Czechoslovak Army general, former chief of staff, and prime minister during the Munich Crisis.\n\nDuring World War I, he fought in the Czechoslovak Legions of the Russian army and lost his right eye in the Battle of Zborov. By the end of the war, he commanded the Legions and anti-Bolshevik forces on the Trans-Siberian railway."

 cze_jan_rys_rozsevac: "Jan Rys-Rozsévač"
 cze_jan_rys_rozsevac_desc: "Jan Rys-Rozsévač was a Czechoslovakian journalist, politician, and leader of the fascist, pro-Nazi organization Vlajka."

 chief_luza_appointed: "Has been appointed Chief of Staff"
 chief_prchala_appointed: "Has been appointed Chief of Staff"

###---> Ideas <><> <><> <><>
 tgm: "Tomáš Garrigue Masaryk (1st President)"
 tgm_desc: "Tomáš Garrigue Masaryk was a Czechoslovak politician, sociologist, philosopher, and an eager advocate of Czechoslovak independence during World War I. He became the founder and first President of Czechoslovakia.\n\nMasaryk was re-elected three times in May 1920, 1927, and 1934. He resigned from office in 1935 on the grounds of old age and poor health, and his pupil Edvard Beneš succeeded him."
 edvard_benes: "Edvard Beneš (2nd President)"
 edvard_benes_desc: "The former Minister of Foreign Affairs and a prominent member of the Czechoslovak National Social Party, Dr. Edvard Beneš, was elected president in 1935 after Tomáš Garrigue Masaryk retired.\n\nBeneš was the first and longest-serving Foreign Minister of Czechoslovakia, a post he held through 10 successive governments since he represented Czechoslovakia in talks on the Treaty of Versailles. He was a renowned and influential figure at international conferences and a member of the League of Nations Council between 1923 and 1927."

 CZE_fifth_column: "Fifth Column"
 CZE_fifth_column_desc: "Sudetendeutsches Freikorps operates in Czechoslovakia."
 CZE_mobilization_1938: "General Mobilization"
 CZE_mobilization_1938_desc: "A general mobilization order was issued. Reservists are gathering at their units."
 emil_hacha: "Emil Hácha (3rd President)"
 emil_hacha_desc: "Emil Dominik Josef Hácha was a Czech lawyer, the third President of Czechoslovakia from 1938 to 1939. After the occupation of the remnants of Czechoslovakia on 16 March, Hácha retained his office as President but was forced to swear an oath to Hitler, who appointed Konstantin von Neurath as Protector of Bohemia and Moravia."

###---> Events <><> <><> <><>
 r56_czechoslovakia.1.t: "Problems in Sudetenland"
 r56_czechoslovakia.1.desc: "With the [GER.GetAdjective] occupation of the Rhineland, the Germans in the Sudeten regions are becoming more restless with each passing day. Although the leader of the Sudeten German Party (SdP), Konrad Heinlein, reassures the [CZE.GetAdjective] government of the loyalty of Germans in [CZE.GetNameDef] and distances himself from German National Socialism, intelligence reports say otherwise.\n\nThe right of self-determination for Sudetenland Germans, pan-Germanism, and even open sympathy for the ideals of National Socialism is more than a common occurrence in SdP political rallies."
 r56_czechoslovakia.1.a: "Don't worry. It's just political populism."
 r56_czechoslovakia.2.t: "Funeral of Tomáš Garrigue Masaryk"
 r56_czechoslovakia.2.desc: "In Prague, a city in mourning, black flags fluttered from downtown buildings. Busts and pictures of Masaryk with that distinctive, fluffy, white mustache dotted the town and covered the front pages of numerous newspapers.\n\nBlack banners reading "TGM" adorned Saint Vitus Cathedral and buildings on Wenceslas Square. Thousands of soldiers and legionnaires marched in his funeral procession [ROOT.GetDateText] as 146 military standards appeared. Draped with the [CZE.GetAdjective] flag, his coffin was carried on a gun carriage through the city. On its last leg to Lány, the coffin traveled by train, placed in a car covered in wreaths and flowers.\n\nTomáš Garrigue Masaryk was a Czechoslovak politician, sociologist, and philosopher, an eager advocate of Czechoslovak independence during World War I, and became the founder and first President of Czechoslovakia. He was re-elected as president three times. He resigned from office in 1935 on the grounds of old age and poor health, and Edvard Beneš succeeded him."
 r56_czechoslovakia.2.a: "Sad day for [CZE.GetNameDef]."
 r56_czechoslovakia.3.t: "Former Czechoslovak President Dies"
 r56_czechoslovakia.3.desc: "In Prague, a city in mourning, black flags fluttered from downtown buildings. Busts and pictures of Masaryk with that distinctive, fluffy, white mustache dotted the town and covered the front pages of numerous newspapers.\n\nBlack banners reading "TGM" adorned Saint Vitus Cathedral and buildings on Wenceslas Square. Thousands of soldiers and legionnaires marched in his funeral procession [ROOT.GetDateText] as 146 military standards appeared. Draped with the [CZE.GetAdjective] flag, his coffin was carried on a gun carriage through the city. On its last leg to Lány, the coffin traveled by train, placed in a car covered in wreaths and flowers."
 r56_czechoslovakia.3.a: "Sad day for [CZE.GetNameDef]."
 r56_czechoslovakia.3.b: "One less capitalist to worry about."
 r56_czechoslovakia.3.c: "Finally, the old goat is dead!"
 r56_czechoslovakia.4.t: "SdP Declares Karlsbad Program"
 r56_czechoslovakia.4.desc: "On [ROOT.GetDateText], the SdP proclaimed the "Karlsbader Program", which demanded in eight points the complete equality between the Sudeten Germans and the Czech people, including autonomy in regions occupied by ethnic Germans.\n\nThe Prague government initially refused, claiming that some points were unrealizable. However, under the pressure of the United Kingdom (Lord Runciman Mission), it eventually agreed to most of the demands presented by Henlein's party. However, the Germans were not satisfied with this compromise. They made additional unacceptable or unrealizable demands to escalate the situation further and create a regional crisis, which eventually resulted in the Munich Conference."
 r56_czechoslovakia.4.a: "We have to do something."
 cze_karlsbad_program: "The SdP is not radicalized."
 r56_czechoslovakia.5.t: "Fifth Column Established in [CZE.GetNameDef]"
 r56_czechoslovakia.5.desc: "A few weeks before the Munich conference, Hitler made a speech at a Nazi Party rally in Nuremberg on the Sudeten crisis in which he condemned the actions of the government of Czechoslovakia.\n\nHitler denounced Czechoslovakia as a fraudulent state that violated the international law's emphasis on national self-determination, claiming it was a Czech hegemony where neither the Germans, the Slovaks, the Hungarians, the Ukrainians, nor the Poles of the country wanted to be in a union with the Czechs.\n\nA week later, the Führer ordered the establishment of Sudetendeutsches Freikorps. This paramilitary organization took over the structure of Ordnersgruppe, an organization of ethnic Germans in Czechoslovakia that the Czechoslovak authorities had dissolved due to its implication in many terrorist activities. The organization was sheltered, trained, and equipped by German authorities and conducted cross-border terrorist operations into the Czechoslovak territory.\n\nMany ethnic-Germans refused to follow the Czechoslovak army mobilization order and either ran across the border to Germany and joined Freikorps, continuing cross border raids from there, or established Grün Freikorps units which were operating from Czechoslovak forests, receiving arms and equipment from Germany, and continuing attacks against Czechoslovak authorities, Jews and Czechs, up until the German occupation of the Czechoslovak border areas following the Munich agreement."
 r56_czechoslovakia.5.a: "Declare Martial Law!"
 r56_czechoslovakia.6.t: "Mobilization!"
 r56_czechoslovakia.6.desc: "Czechoslovak leadership rejects the British-French suggestion for [CZE.GetNameDef] to cede the Sudetenland to Czechoslovakia.\n\nA state of emergency and general mobilization were declared soon after. The mobilization order applied to about 1,250,000 soldiers, including reservists called up earlier for various exercises.\n\nResponse to the announcement of general mobilization was swift; first, reservists reported for duty just a few minutes after hearing the decree from the radio. The influx of soldiers increased rapidly in the following hours.\n\nThe army took control and guarded key strategic buildings during the night, and military units reformed to war organizations.\n\nCzechoslovakia was ready to defend its independence."
 r56_czechoslovakia.6.a: "Truth Prevails!"
 r56_czechoslovakia.7.t: "President Edvard Beneš Resigns"
 r56_czechoslovakia.7.desc: "Following Germany's occupation of the Sudetenland, president Edward Beneš was forced to resign on [ROOT.GetDateText] under heavy German pressure. Our reports suggest that he went into exile to Putney, London, and keeps a low profile - for now."
 r56_czechoslovakia.7.a: "Understood."
 r56_czechoslovakia.8.t: "Presidential Vote"
 r56_czechoslovakia.8.desc: "The former President of the Supreme Administration Court, Dr. Emil Hácha, was chosen by the National Assembly on [ROOT.GetDateText] as the successor of Edvard Beneš as the President of Czechoslovakia. He was selected because of his Catholicism, conservatism, and lack of involvement in any of the governments that had led to the disastrous partition of the country.\n\nHe remained in the Office even after establishment of the Protectorate of Bohemia and Moravia, however, was a mere puppet and lost most of his political influence, especially after assassination of Reinhard Heydrich in June 1942."
 r56_czechoslovakia.8.a: "Prepare the Inauguration Ceremony."
 r56_czechoslovakia.9.t: "Freikorps Insurrection"
 r56_czechoslovakia.9.desc: "The Sudetendeutsches Freikorps were a paramilitary entity constituted of ethnic Germans residing in the Sudetenland region of Czechoslovakia during the Interbellum period.\n\nThe Freikorps committed a string of border clashes with the Czechoslovak forces, including sabotage of military and state-owned properties, abductions, and targeted killings. These clashes culminated in the undeclared German-Czechoslovak War of 1938, which persisted from September 17 to October 10, 1938. During the hostilities, the Freikorps fought in conjunction with German forces and played an influential role in securing the Sudetenland for Nazi Germany. The "war" was concluded with the signing of the Munich Dictate on October 10, 1938, which transferred Sudetenland to Germany.\n\nAfter the hostilities, the Freikorps were integrated into the German military and discontinued as an autonomous entity. Many of its members fought in the Wehrmacht during the World War II" 
 r56_czechoslovakia.9.a: "We must solve this problem quickly"
 r56_czechoslovakia.10.t: "Sudetenland Revolts!"
 r56_czechoslovakia.10.desc: "Konrad Heinlein and the Sudetendeutsche Partei (SdP), aided significantly by our belligerent neighbor, have succeeded in inciting an extensive rebellion. With the understanding that their efforts are not isolated and that the Reich supports their cause, one can only anticipate what the ensuing developments will entail."
 r56_czechoslovakia.10.a: "Traitors!"
 r56_czechoslovakia.10.b: "We shall fight for our freedom!"
 r56_czechoslovakia.11.t: "Sudetenland Breaks Away!"
 r56_czechoslovakia.11.desc: "Sudeten people, with our active support have finally managed to launch a full-fledged insurrection against the Czechoslovak regime"
 r56_czechoslovakia.11.a: "We shall incorporate them into our country"
 r56_czechoslovakia.11.b: "We shall reallign their policies with our's"
 r56_czechoslovakia.11.c: "Supporting them was a mistake..."
 cze_mobilisation_formation_template_tooltip_reward: "§OSpecial Bonus:§! New Division Template (§YMobilizační Těleso§! - Mobilized Formation)."
 r56_czechoslovakia.12.t: "Faucher Recalled!"
 r56_czechoslovakia.12.desc: "The French government recalled general Louis Eugéne Faucher to serve in their army."
 r56_czechoslovakia.12.a: "Are we alone?"
 r56_czechoslovakia.13.t: "Choosing Our Leader"
 r56_czechoslovakia.13.desc: "To continue with our fascist revolution, we have to choose a new leader who will lead us to greatness."
 r56_czechoslovakia.13.a: "Konrad Henlein"
 r56_czechoslovakia.13.b: "Jaroslav Krejčí"
 r56_czechoslovakia.13.c: "Radola Gajda"
 r56_czechoslovakia.14.t: "Czechs Propose an Alliance"
 r56_czechoslovakia.14.desc: "The Czech government gave us an offer to join their proposed alliance opposing Germany and the Bolsheviks."
 r56_czechoslovakia.14.a: "We'll support our fascist borthers!"
 r56_czechoslovakia.14.b: "We don't need em."
 r56_czechoslovakia.15.t: "Assassination Attempt on Henlein"
 r56_czechoslovakia.15.desc: "On 28th of March 1938"
 r56_czechoslovakia.15.a: "He survives!"
 r56_czechoslovakia.15.b: "What a disaster..."
 r56_czechoslovakia.16.t: "Radola Gajda Dead!"
 r56_czechoslovakia.16.desc: "[ROOT.r56_czechoslovakia_16]"
 r56_czechoslovakia.16.da: "Our dear leader Radola Gajda has passed away after prolongued health issues. Many questions are still asked like who his successor should be?"
 r56_czechoslovakia.16.db: "The traitor Radola Gajda has finally died while serving a two-year sentence. This marks an end to a dark chapter in our history..."
 r56_czechoslovakia.16.a: "The Frenemy"
 r56_czechoslovakia.16.b: "The Slovak Brother"
 r56_czechoslovakia.16.c: "DEATH TO THE NAZI SCUM!"
 r56_czechoslovakia.17.t: "Czechoslovakia Moves to Annex Us"
 r56_czechoslovakia.17.desc: "The Czechoslovak government wants to annex our country into their."
 r56_czechoslovakia.17.a: "Ok..."
 r56_czechoslovakia.17.b: "no"
 r56_czechoslovakia.18.t: "Hungary Submits"
 r56_czechoslovakia.18.desc: "The Hungarians have accepted our demands."
 r56_czechoslovakia.18.a: "Good boy... wink wink"
 r56_czechoslovakia.19.t: "Hungary Defiant"
 r56_czechoslovakia.19.desc: "The Hungarians have rejected our demands."
 r56_czechoslovakia.19.a: "Ffs"
 r56_czechoslovakia.19.b: "War duh..."
 r56_czechoslovakia.20.t: "Czechoslovak Firearms"
 r56_czechoslovakia.20.desc: "Although Czechoslovakia was a significant arms exporter, the Czechoslovak Army adopted modern infantry weapons somewhat slowly before 1936. But that changed when the rearmament program was initiated and large orders for rifles and modern machine guns were issued. By the time of Munich, Czechoslovakia had one of the best-equipped armies in the world and supposedly the highest number of automatic weapons per soldier (1/7).\n\nThe vz.24 rifle, based on the reliable Mauser (7.92 mm) design, was the standard-issue infantry weapon of the Czechoslovak army and later also of SOS (State Defense Guard) units. It was manufactured by Zbrojovka Brno and by [ROOT.GetDateText], 762,000 vz. 24 rifles were ready for mobilization with 424.9 million pieces of ammunition, with another 141.7 million stockpiled by ŘOP for storage in border fortifications.\n\nThe forefather of the famous Bren gun, the ZB vz. 26 machine gun (7,92 mm), was the standard weapon for both infantry support units and light and heavy fortifications. Based on the early 1920s design by V. Holek, the gun or its licenced production was exported to several countries, including the UK and China. By 1936, 34,557 weapons were available for the army, and several thousand were ordered for fortifications.\n\nThe TK vz. 37 heavy machine gun was a refinement of the previously used vz. 35. It was used as a squad support weapon, as a mounted machine gun for tanks and other armored vehicles, and on fixed positions inside Czechoslovak border fortifications. Like other Czech weapons, it also used 7.92 mm ammo for easier supply and storage inside heavy forts. A licenced version of this weapon was produced in the UK as the Besa machine gun.\n\nFor some reason, the army leadership was unwilling to introduce submachine guns, despite the fact that a modern prototype of a weapon later known as the Samopal vz. 38 had existed since 1937. \n\nAlmost all of the equipment was requisitioned by the Germans after the 1939 occupation and, by some estimates, could be used to equip about half of the Wehrmacht. A lot of the captured modern equipment was issued to SS divisions."
 r56_czechoslovakia.20.a: "Modernize standard issue weapons."
 r56_czechoslovakia.20.b: "Order heavy machine guns."
 r56_czechoslovakia.21.t: "Czechoslovakia Demands Reintegration"
 r56_czechoslovakia.21.desc: "With the changes of the government in Prague and its new commitments to the allies, they demand our full reintegration."
 r56_czechoslovakia.21.a: "We have no choice but to accept."
 r56_czechoslovakia.21.b: "We will not surrender ourselves."
 r56_czechoslovakia.22.t: "Czechoslovakia Demands Reintegration"
 r56_czechoslovakia.22.desc: "With the changes of the government in Prague and its new commitments to the allies, they demand our full reintegration."
 r56_czechoslovakia.22.a: "We have no choice but to accept."
 r56_czechoslovakia.22.b: "We will not surrender ourselves."
 r56_czechoslovakia.23.t: "Czechoslovakia Demands Reintegration"
 r56_czechoslovakia.23.desc: "With the changes of the government in Prague and its new commitments to the allies, they demand our full reintegration."
 r56_czechoslovakia.23.a: "We have no choice but to accept."
 r56_czechoslovakia.23.b: "We will not surrender ourselves."
 r56_czechoslovakia.24.t: "Returning the Republic"
 r56_czechoslovakia.24.desc: "Now that we have made our intentions clear to everyone, it is time to restore our country."
 r56_czechoslovakia.24.a: "Finally!"
 r56_czechoslovakia.25.t: "The Czecho-Slovak Federation"
 r56_czechoslovakia.25.desc: "Now that all our internal problems have been solved and all the constituent parts of our country have been united again, the time has come to proclaim the new Czecho-Slovak Federation."
 r56_czechoslovakia.25.a: "Great!"
 r56_czechoslovakia.32.t: "Prague Wants to Buy Old Austro-Hungarian Ships"
 r56_czechoslovakia.32.desc: "After the Great War ended, the entire Austro-Hungarian navy was split between victorious powers. We still have two such ships - the destroyer SMS Dukla and the scout cruiser SMS Novara. Since we have already been looking to scrap the SMS Dukla, and the SMS Novara is currently used as a barracks ships under the name of Thionville, we might as well sell them to [CZE.GetNameDef]."
 r56_czechoslovakia.32.a: "We wanted to sell them anyway"
 r56_czechoslovakia.32.b: "We will not sell these ships to Prague"
 r56_czechoslovakia.33.t: "France Agrees to the Sale"
 r56_czechoslovakia.33.desc: "We were able to come to an agreement with the french authorities, and the ships will soon be transfered to our dockyards. After a quick refurbishment, these ships will be able to return to service."
 r56_czechoslovakia.33.a: "Great"
 r56_czechoslovakia.34.t: "France Rejects the Offer"
 r56_czechoslovakia.34.desc: "Surprisingly, France refused to sell us these ships."
 r56_czechoslovakia.34.a: "Sad"
 r56_czechoslovakia.35.t: "Prague Wants to Buy Old Austro-Hungarian Ships"
 r56_czechoslovakia.35.desc: "After the Great War ended, the entire Austro-Hungarian navy was split between victorious powers. We still have three such ships - two 250t class sea going torpedo boats and the SMS Basilisk minelayer. Considering the fact, that [CZE.GetNameDef] is ready to pay us well, it might be better to sell these old ships."
 r56_czechoslovakia.35.a: "Fine"
 r56_czechoslovakia.35.b: "We will sell these ships for a non-aggression pact"
 r56_czechoslovakia.35.c: "We will not sell these ships to Prague"
 r56_czechoslovakia.36.t: "Romania Agrees to the Sale"
 r56_czechoslovakia.36.desc: "We were able to come to an agreement with the Romanian authorities, and the ships will soon be transfered to our dockyards. After a quick refurbishment, these ships will be able to return to service."
 r56_czechoslovakia.36.a: "Great"
 r56_czechoslovakia.37.t: "Romania Rejects the Offer"
 r56_czechoslovakia.37.desc: "Romanian government refused to sell us our old ships."
 r56_czechoslovakia.37.a: "Sad"
 r56_czechoslovakia.38.t: "Romania Makes Extra Demands"
 r56_czechoslovakia.38.desc: "The Romanian authorities are ready to sell us our old ships, but only if we sign a non-aggression treaty with them."
 r56_czechoslovakia.38.a: "Fine, we can agree to that"
 r56_czechoslovakia.38.b: "It would not be in our intrests"
 r56_czechoslovakia.39.t: "Prague Agrees"
 r56_czechoslovakia.39.desc: "[CZE.GetNameDef] has agreed to our deal."
 r56_czechoslovakia.39.a: "Good"
 r56_czechoslovakia.40.t: "Prague Refuses"
 r56_czechoslovakia.40.desc: "[CZE.GetNameDef] has refused the deal."
 r56_czechoslovakia.40.a: "Bad"
 r56_czechoslovakia.41.t: "Prague Wants to Buy Old Austro-Hungarian Ships"
 r56_czechoslovakia.41.desc: "After the Great War ended, the entire Austro-Hungarian navy was split between victorious powers. We still have five 250t class sea going torpedo boats. Considering the fact, that [CZE.GetNameDef] is ready to pay us well, it might be better to sell these old ships."
 r56_czechoslovakia.41.a: "Fine"
 r56_czechoslovakia.41.b: "We will not sell these ships to Prague"
 r56_czechoslovakia.42.t: "Greece Agrees to the Sale"
 r56_czechoslovakia.42.desc: "We were able to come to an agreement with the greek authorities, and the ships will soon be transfered to our dockyards. After a quick refurbishment, these ships will be able to return to service."
 r56_czechoslovakia.42.a: "Great"
 r56_czechoslovakia.43.t: "Greece Rejects the Offer"
 r56_czechoslovakia.43.desc: "Greece has refused to sell the ships, citing the need to protect their own coasts."
 r56_czechoslovakia.43.a: "Sad"
 r56_czechoslovakia.44.t: "Prague Wants to Buy Old Austro-Hungarian Ships"
 r56_czechoslovakia.44.desc: "After the Great War ended, the entire Austro-Hungarian navy was split between victorious powers. We still have seven 250t class sea going torpedo boats. Considering the fact, that [CZE.GetNameDef] is ready to pay us well, it might be better to sell these old ships."
 r56_czechoslovakia.44.a: "Fine"
 r56_czechoslovakia.44.b: "We will not sell these ships to Prague"
 r56_czechoslovakia.45.t: "Yugoslavia Agrees to the Sale"
 r56_czechoslovakia.45.desc: "We were able to come to an agreement with the yugoslav authorities, and the ships will soon be transfered to our dockyards. After a quick refurbishment, these ships will be able to return to service."
 r56_czechoslovakia.45.a: "Great"
 r56_czechoslovakia.46.t: "Yugoslavia Rejects the Offer"
 r56_czechoslovakia.46.desc: "Yugoslavia has refused to sell the ships, citing the need to protect their own coasts."
 r56_czechoslovakia.46.a: "Sad"
 r56_czechoslovakia.47.t: "Prague Wants to Buy Old Austro-Hungarian Ships"
 r56_czechoslovakia.47.desc: "After the Great War ended, the entire Austro-Hungarian navy was split between victorious powers. We still have several of these ships. Considering the fact, that [CZE.GetNameDef] is ready to pay us well, it might be better to sell them."
 r56_czechoslovakia.47.a: "We wanted to sell them anyway"
 r56_czechoslovakia.47.b: "We will not sell these ships to Prague"
 r56_czechoslovakia.48.t: "Italy Agrees to the Sale"
 r56_czechoslovakia.48.desc: "We were able to come to an agreement with the italian authorities, and the ships will soon be transfered to our dockyards. After a quick refurbishment, these ships will be able to return to service."
 r56_czechoslovakia.48.a: "Great"
 r56_czechoslovakia.49.t: "Italy Rejects the Offer"
 r56_czechoslovakia.49.desc: "Italian government refused to sell us our old ships."
 r56_czechoslovakia.49.a: "Sad"
 r56_czechoslovakia.50.t: "1935 Election Results"
 r56_czechoslovakia.50.desc: "The 1935 elections ended in a surprise for everyone, as the newly formed nationalist Sudetendeutsche Partei (SdP) won both the Chamber of Deputies and the Senate. The president must now decide whether to trust Heinlein with the formation of the government, or whether to entrust it to the RSZML candidate Milan Hodža, whose party came in second."
 r56_czechoslovakia.50.a: "Konrad Heinlein cannot be trusted. Milan Hodža should form the cabinet"
 r56_czechoslovakia.50.b: "Konrad Heinlein won the election. Let him be in charge of forming the cabinet"
 r56_czechoslovakia.51.t: "Coalition Negotiations"
 r56_czechoslovakia.51.desc: "Now that Milan Hodža has been chosen to form a cabinet, the talks must begin. While the factions have been quite radicalised, he may yet be able to succeed in creating a coalition of democratic parties."
 r56_czechoslovakia.51.a: "A wide coalition of democratic parties can be achieved"
 r56_czechoslovakia.51.b: "The Coalition talks fail"
 r56_czechoslovakia.52.t: "Federalization"
 r56_czechoslovakia.52.desc: "The Federalization is complete."
 r56_czechoslovakia.52.a: "It had to be done"
 r56_czechoslovakia.56.t: "The President-Parlament split in Czechoslovakia"
 r56_czechoslovakia.56.desc: "Ever since its inception under the visionary leadership of T. G. Masaryk in the aftermath of the Great War, Czechoslovakia has been a highly centralized state. President Masaryk, who held the reins of power from 1918 till the end of 1935, consolidated an enormous amount of power in his presidential office, which included various ministries answerable only to him. This concentration of power became known as the Castle (Hrad in Czech), and the struggle for supremacy between the Castle and the Parliament, which attempted to limit the President's power, marked the entire interwar period of Czechoslovak internal politics. The Castle remained the bastion of conservatism, staunchly opposing any radical reforms, whether from the Czech natinalists or from the left-wing parties.\n\nThe newly elected President, Eduard Beneš, has pledged to break away from this tradition and give greater autonomy to the nationalities of Czechoslovakia. However, it remains to be seen whether his promises can be trusted, given that he was one of the closest associates of the old President and most of his promises were made only in order to garner support for his presidency. It is a fact that without the support of the Slovak Milan Hodža, Beneš would not have been able to ascend to the presidency. In any case, with Masaryk largely out of the picture, the government now has the power to complicate the life of the Hrad, should it choose to do so."
 r56_czechoslovakia.56.a: "Beneš is Masaryk's chosen successor. We would be foolish not to trust him"
 r56_czechoslovakia.56.b: "We should take out the Hrad from politics"
 r56_czechoslovakia.57.t: "Espionage scandal"
 r56_czechoslovakia.57.desc: "With the recent scandals that have exposed the deep Hungarian infiltration into our army, members of the 2nd Section of the Intelligence Agency, charged with counterintelligence, are advocating for a broad inquiry into senior army generals who may have harboured sympathies for the Habsburg Empire and served in the Austro-Hungarian army while refusing to join the Czechoslovak legions.\n\nAt the same time, there is reason to believe that certain politicians may have close affiliations with foreign powers. An inquiry into these individuals may serve to demonstrate the competency of our intelligence service.\n\nHowever, there are compelling arguments to avoid overreacting and instead proceed with the status quo, in the hope that further infiltration may be averted."
 r56_czechoslovakia.57.a: "We cannot risk it. Investigate the generals"
 r56_czechoslovakia.57.b: "Investigating the Autonomist Party leaders will be easy"
 r56_czechoslovakia.57.c: "We shouldn't overreact"
 r56_czechoslovakia.58.t: "Army Investigations"
 r56_czechoslovakia.58.desc: "As the investigation nears its conclusion, regrettably, no conclusive evidence has been found to incriminate those suspected of collusion with foreign powers. Nevertheless, the abundance of circumstantial evidence may be deemed sufficient for a conviction, though it falls to us to determine who shall shoulder the brunt of the blame for these transgressions."
 r56_czechoslovakia.58.a: "Jaroslav Eminger will have to retire"
 r56_czechoslovakia.58.b: "Josef Köppl will be demoted"
 r56_czechoslovakia.58.c: "Josef Votruba shall be forced into pension"
 r56_czechoslovakia.59.t: "Political Investigations"
 r56_czechoslovakia.59.desc: "As the investigation draws to a close, it has become apparent that János Esterházy has been in contact with the Hungarian government, receiving funds for his autonomist party. While no direct evidence of the transfer of state secrets has been discovered, the available evidence is sufficient to warrant his arrest. In addition to Esterházy, journalist and politician Erwin Zajiček, who has been campaigning ardently for greater Sudeten autonomy, may also be sent away from the country, as some of his writings may potentially be in violation of Law 201."
 r56_czechoslovakia.59.a: "Arrest Esterházy"
 r56_czechoslovakia.59.b: "Exile Zajiček"
 r56_czechoslovakia.60.t: "Top-Secret information leaked"
 r56_czechoslovakia.60.desc: "After concluding our investigation, it was found that the situation is far more dire than we had anticipated. Our agent in the Abwehr A-51 has brought to our attention that the Germans are now in possession of highly classified information, including the top-secret plans of our North-Eastern fortifications and even our mobilization strategies. With assistance from A-51 we have traced the leak to Captain Edmund Kalmar, stationed at the headquarters of the 4th division. The 2nd Section was able to apprehend Kalmar, who was subsequently sentenced to death for his treacherous actions. Furthermore, we have also discovered the presence of another Hungarian agent, Lieutenant Colonel Alois Wünsch of the construction directorate of 3rd corps in Brno. Wünsch was found guilty of transferring sensitive information about our southern defences to Hungarian authorities and was also sentenced to death."
 r56_czechoslovakia.60.a: "Where was the 2nd Section looking?"
 r56_czechoslovakia.61.t: "Hlinka's Speech"
 r56_czechoslovakia.61.desc: "During the 7th HSĽS party congress held today, Hlinka delivered a speech reaffirming the significance of upholding Slovak identity, embracing faith in the Almighty, and displaying steadfast resistance towards communists and Jews. Fortunately, it appears that Hlinka's speech did not contain any overtly negative remarks about our government. Nonetheless, it is imperative that we remain vigilant and keep a watchful eye on any developments that may transpire in the autonomist block."
 r56_czechoslovakia.61.a: "At least he didn't say anything too bad about us"
 r56_czechoslovakia.62.t: "Hlinka Condemns the Czech Government"
 r56_czechoslovakia.62.desc: "At the 7th HSĽS party congress that took place today, Hlinka gave a speech wherein he vehemently condemned our government for failing to fulfil its commitments to the Autonomist Block. During the congress, he proclaimed a declaration which asserted Slovakia's right to broad autonomy, implying that it is merely a matter of time before Slovakia gains independence. Hlinka's speech has already sparked considerable commotion in Prague."
 r56_czechoslovakia.62.a: "That was worse than we expected"
 r56_czechoslovakia.63.t: "Karol Sidor gives a speech at the Comenius University"
 r56_czechoslovakia.63.desc: "In November 1937, Karol Sidor delivered a passionate speech that inflamed the students of Bratislava, inspiring them to stage a demonstration in the streets. They chanted slogans such as "Slovak in Slovakia", with many of them adorning the HSĽS party badges."
 r56_czechoslovakia.63.a: "Why do they have to do that?"
 r56_czechoslovakia.64.t: "Karlsbader Agreement"
 r56_czechoslovakia.64.desc: "Dissatisfied with the February Plan, the SdP led by Henlein have declared their own reform plan. The program comprises of eight main demands, namely: 1. Complete equality between the Germans and the Czechs; 2. Recognition of the Sudeten-German ethnic group as a legal entity; 3. Establishment of defined borders for the Sudeten-Germans and the Czechs; 4. Self-governance in all areas of public life; 5. Legal protection for Germans residing outside of the Sudetenland; 6. Compensation for the 1918 confiscations; 7. Implementation of the principle of "German civil servants on German land"; and 8. Full freedom for German culture and the German "way of life"."
 r56_czechoslovakia.64.a: "We shall accept these demands"
 r56_czechoslovakia.65.t: "Beneš's Counterproposal"
 r56_czechoslovakia.65.desc: "Following the unrealised February Plan, the SdP led by Henlein have declared their last attempt to reconcile the differences between the Sudeten Germans and the Czech government. The program comprises of eight main demands, namely: 1. Complete equality between the Germans and the Czechs; 2. Recognition of the Sudeten-German ethnic group as a legal entity; 3. Establishment of defined borders for the Sudeten-Germans and the Czechs; 4. Self-governance in all areas of public life; 5. Legal protection for Germans residing outside of the Sudetenland; 6. Compensation for the 1918 confiscations; 7. Implementation of the principle of "German civil servants on German land"; and 8. Full freedom for German culture and the German "way of life".\nThese demands are obviously unreasonable, but we are ready to concede to at least some of them. The Hrad, along with the Parliament, shall come up with the Fourth Plan in the hopes that it will satisfy the autonomists."
 r56_czechoslovakia.65.a: "We can't give up our identity"
 r56_czechoslovakia.66.t: "The February Memorandum"
 r56_czechoslovakia.66.desc: "On January 27, 1937, the leader of the Sudeten German Social-Democratic Party, Wanzel Jaksch, submitted the reformation plan directly to Milan Hodža, who swiftly agreed to sign it. The plan had the following provisions:\n\nFirstly, the Sudeten Germans were to become the second nationality with state-forming status, after the "Czechoslovak" nationality.\n\nSecondly, the state was obligated to assist the unemployed Sudeten Germans, as the unemployment rate in the Sudetenland was up to three times higher than in the Czech regions.\n\nThirdly, proportional representation of Germans was to be ensured in local governments.\n\nLastly, the discriminatory 52nd Language Law was to be abolished, which had made Czech language compulsory for all civil cervants, and the Austro-Hungarian practice of multilingualism was to be reinforced in the Parliament.\n\nUnfortunately, the implementation of this plan was beset by active protests from the Beneš's Castle and Czech nationalist parties and was never finished."
 r56_czechoslovakia.66.a: "We should sign the Treaty right away"
 r56_czechoslovakia.67.t: "Tiso Complains About the Government"
 r56_czechoslovakia.67.desc: "At the 8th HSĽS party congress held today, Tiso, who took over the party leadership after Hlinka's death, delivered a speech as anticipated, in which he expressed his grievances about the central government, acknowledging that some advancements had been made but that they were still inadequate and progressing at a sluggish pace. Considering the fact that except for these complaints, which were bound to happen anyway, no other comments were made, we can count ourselves lucky."
 r56_czechoslovakia.67.a: "It could have been much worse"
 r56_czechoslovakia.68.t: "Tiso Demands Autonomy"
 r56_czechoslovakia.68.desc: "At the 8th HSĽS party congress held today, Tiso, who assumed the party leadership after Hlinka's passing, delivered an impassioned speech that led to the swift acceptance of a resolution by the party. The resolution demanded extensive autonomy in accordance with the Pittsburgh Agreement, which was drafted before the establishment of the Czechoslovak state, but since left ignored. This resolution has made the news in Prague and the tensions are running high now."
 r56_czechoslovakia.68.a: "That is bad"
 r56_czechoslovakia.69.t: "Investigatation of a Possible Army Infiltration"
 r56_czechoslovakia.69.desc: "The 2nd Section agents have recently been informed that the Chief of Staff of the Regional Military Command in Prague has been infiltrated by Hungarian spies. Captain Vilém Tikal, the main suspect, was subsequently arrested. A thorough search of his home and a rigorous interrogation confirmed the claim that he had been transferring confidential information to the Hungarian intelligence service. Regrettably, Tikal was discovered dead, having been hanged in his cell. However, the investigation must continue, for there may yet be more subversive elements lurking within the ranks of the army."
 r56_czechoslovakia.69.a: "Unpleasant"
 r56_czechoslovakia.70.t: "The February Plan Fails"
 r56_czechoslovakia.70.desc: "Although the Prime Minister made assurances of his utmost efforts in implementing the February Plan, constant squabbling amongst the parliamentary factions, coupled with vehement opposition from the Castle and Beneš himself, resulted in the plan's failure. Our minorities are becoming increasingly radicalised, with the Sudeten German Social Democratic Party losing most of its voter base because of its association with us. Their voters are now shifting their support towards the SdP.\nTo make matters worse, there are reports that a meeting between high-ranking members of the Sudeten Social Democratic Party and the SdP has been arranged. Nonetheless, all is not yet lost, and there remains a slim possibility of reaching an agreement with Henlein, who now stands as the uncontested leader of the Sudeten Germans."
 r56_czechoslovakia.70.a: "That is very concerning"
 r56_czechoslovakia.71.t: "The Government Falls"
 r56_czechoslovakia.71.desc: "As the pressure continued to mount and the level of radicalization soared, news of the potential surrender of the Sudeten provinces to the Germans leaked from the government office, causing a massive uproar in Prague that led to extensive demonstrations. Klement Gottwald and the KSČ were among the main leaders of this rally.\nUsing this opportunity, Matúš Černak, a minister from the HSĽS, issued a threat to resign unless autonomy was granted to Slovakia within 24 hours. Upon Beneš's refusal, Matúš resigned on the 4th of October, triggering the collapse of the government. The following day, Beneš resigned, and on the 6th of October, General Jan Syrový assumed the role of caretaker. That same day, Jozef Tiso proclaimed, "The moment has come when the Slovaks, as a sovereign and independent nation, start to write their own history," forcing the recognition of Slovaks as a distinct nationality (rather than a part of the "Czechoslovak nation") and reforming Czechoslovakia into Czecho-Slovakia."
 r56_czechoslovakia.71.a: "Everything is coming down in flames"
 r56_czechoslovakia.72.t: "Konrad Henlein Arrested"
 r56_czechoslovakia.72.desc: "In a stunning turn of events, Konrad Henlein and several other high-ranking members of the SdP have been apprehended by Czechoslovak authorities. This comes just days after President Beneš delivered a historic speech, accusing Henlein, Karl Frank, and other prominent figures of conspiring against the state.\nReports suggest that the Czechoslovak 2nd Section agents successfully completed the arrests, leaving the SdP in disarray. With the party's main leadership now behind bars, its members are grappling with a lack of organization and direction. \nMeanwhile, rumors abound that a significant demonstration is being planned in Karlsbad by SdP loyalists. However, the effectiveness of such an event remains questionable in light of the recent arrests.\nThis development signals a turning tide against the Sudeten Germans, who have been fervently opposing the central government in Prague. As the authorities take decisive action, it appears that the Czechoslovak state is regaining control and asserting its authority in the face of internal unrest."
 r56_czechoslovakia.72.a: "Finaly, we got these troublemakers"
 r56_czechoslovakia.73.t: "Nationalist Coup Thwarted"
 r56_czechoslovakia.73.desc: "In a shocking turn of events, a group of Czech nationalist generals and former legionaries launched a failed coup attempt against the central government, aiming to establish a quasi-fascist state and roll back liberal reforms. Disgruntled by what they saw as a betrayal of the Czech people, the group sought to establish a "National State" and reclaim the nation's sovereignty.\nThe coup quickly unravelled as loyalist tanks rolled into Prague, thwarting the rebels' plans. The majority of the perpetrators were apprehended, ensuring that order was restored. However, concerns arise from the fact that only half of the Czechoslovak generals, most of them former Imperial loyalists, responded to the government's call for support, highlighting a deepening division within the military.\nAt the forefront of the coup was Radola Gajda, a former general of the Czech Legions and leader of the fascist NOF party. Gajda, once influential among Czech nationalists, now finds himself in custody, facing charges for his role in the failed uprising.\nThe nation remains on edge as the central government evaluates the implications of this attempted coup and works to mend the growing fractures within the military and society at large."
 r56_czechoslovakia.73.a: "Execute the insurrectionists; court marshall those generals who refused to help us."
 r56_czechoslovakia.73.b: "Executing the insurrectionists will serve as a good-enough warning for everybody else."
 r56_czechoslovakia.73.c: "Radola Gajda is a valued military specialist, it would be ill-advised to execute him."
 r56_czechoslovakia.74.t: "Legionnaires Trial"
 r56_czechoslovakia.74.desc: "Considering the lack of support for our government in the moment of greatest need, a trial of these disloyal generals began. Now we must decide what course of action shall be taken - should we demote the main culprits and force them into pension, which would allow us to recall them back, should the need arise, or should we exile them?"
 r56_czechoslovakia.74.a: "Demote them, we may need their help after all."
 r56_czechoslovakia.74.b: "Exile them, we have no need for such traitors."
 r56_czechoslovakia.75.t: "Tiso Demands Independence"
 r56_czechoslovakia.75.desc: "With the political situation rapidly deteriorating, Slovak nationalists have become increasingly bold. Jozef Tiso has now formally demanded complete independence, and it seems that he has secured the support of the Third Reich for his cause."
 r56_czechoslovakia.75.a: "Horrible"
 r56_czechoslovakia.76.t: "Dissolution of Czechoslovakia"
 r56_czechoslovakia.76.desc: "As the Third Reich's ambitions continue to expand, the destiny of Czechoslovakia becomes inexorably intertwined with our vision of a Greater Germany. Now, the Czechoslovak government, led by President Emil Hácha, has come to Berlin to make a fateful decision - to surrender their sovereignty to the might of the Third Reich. Emil Hácha, the President of Czechoslovakia, stands at a crossroads. With the Sudeten border fortifications surrendered and the international community showing its inability to halt our advance, the once-proud Czechoslovakia now recognizes the reality of its situation: resistance would only lead to further suffering for its people. The only remaining question is the fate of the Southern Slovak lands - the Felvidék and Carpathian Ruthenia - which are claimed by Hungarians. Should we transfer these lands to Budapest?"
 r56_czechoslovakia.76.a: "Transfer the territories claimed by Hungary to them"
 r56_czechoslovakia.76.b: "Leave the these territories to the Slovak State"
 r56_czechoslovakia.77.t: "A War Against the Reich?"
 r56_czechoslovakia.77.desc: "The situation in Europe grows increasingly tense as the Czechoslovak comrades extend an urgent invitation to the Soviet Union, asking for our assistance in a war against the Third Reich. The threat of fascism looms large over the continent, and we are faced with a pivotal decision: Do we heed their call and join the fight against the fascist threat, or do we bide our time and wait for a more opportune moment to engage?"
 r56_czechoslovakia.77.a: "Let us end the Fascist threat"
 r56_czechoslovakia.77.b: "It wouldn't be in our interest"
 r56_czechoslovakia.78.t: "Beneš Discredited"
 r56_czechoslovakia.78.desc: "The recent publications uncovered certain issues with the course that has been set by the President."
 r56_czechoslovakia.78.a: "Good"
 r56_czechoslovakia.79.t: "Beneš Emerges Unscathed"
 r56_czechoslovakia.79.desc: "The publications hostile to the President were dissmedessmised as mostly irrelevant and partisan."
 r56_czechoslovakia.79.a: "We will get him next time"
 r56_czechoslovakia.80.t: "Prague Proposes to Renegotiate the Little Entente Treaty"
 r56_czechoslovakia.80.desc: "With the world tension increasing Prague decided to rekindle the fading Little Entente. Should we agree to a closer cooperation?"
 r56_czechoslovakia.80.a: "Little Entente will serve our interests"
 r56_czechoslovakia.80.b: "That boat has already sailed. We do not need the Czechs"
 le_treaty: "Will unlock the Form the Entente Council focus"
 r56_czechoslovakia.81.t: "Prague Proposes to Renegotiate the Little Entente Treaty"
 r56_czechoslovakia.81.desc: "With the world tension increasing Prague decided to rekindle the fading Little Entente. Should we agree to a closer cooperation?"
 r56_czechoslovakia.81.a: "Little Entente will serve our interests"
 r56_czechoslovakia.81.b: "That train has already left. We do not need the Czechs"
 r56_czechoslovakia.82.t: "Negotiations Fail"
 r56_czechoslovakia.82.desc: "Even though we did everything in our power to restore the alliance, our partners decided that it's not in their immediate interests to enter into the alliance"
 r56_czechoslovakia.82.a: "We must consider our options"
 r56_czechoslovakia.83.t: "Runciman's Mission to Czechoslovakia"
 r56_czechoslovakia.83.desc: "The Runciman Mission to Czechoslovakia was a British Government initiative to resolve an international crisis threatening to lead to war in Europe in the summer of 1938. The Mission, headed by a former British cabinet minister Lord Runciman, was sent to mediate a dispute between the Government of Czechoslovakia and the Sudeten German Party (SdP), representing the radicalized ethnic German minority within the country. The British mediators were active in Czechoslovakia during the late summer, issuing their report shortly before the Munich Conference in September.\n\nThe report of the Runciman Mission, in the form of letters to the British and Czechoslovak prime ministers dated [ROOT.GetDateText], was intensely hostile in tone towards the Czechoslovak Government and recommended the immediate transfer of the mainly German-inhabited territories to Germany. The 2000-word report firmly blamed the breakdown in negotiations on the SdP leadership, who used the pretext of civil unrest in some German areas to sever contacts. The report also noted that Beneš's 'Fourth Plan' proposals met "almost all the requirements" of the SdP's demands. Nevertheless, when itemizing the grievances of the German minority, Runciman expressed his sympathy for the Sudeten case observing that it was "a hard thing to be ruled by an alien race". Although declaring that Czech rule was "not actively oppressive, and certainly not 'terroristic'", the report alleged, "it was marked by tactlessness, lack of understanding, petty intolerance and discrimination".\n\nHowever, should the Czechoslovak government solve the Sudetenland problem before the escalation of the ethnic conflict, the report of the Runciman Mission would probably turn favorably for the Czech side. Thus the United Kingdom and France would be more willing to back Czechoslovakia against potential Hitler's aggression."
 r56_czechoslovakia.83.a: "Invite Lord Runciman to Sudetenland."
 r56_czechoslovakia.84.t: "Czechoslovak Nobility Asks for Support"
 r56_czechoslovakia.84.desc: "Trouble and discontent are increasing in the neighbouring Czechoslovakia, and we have been approached by the Šlechta, who is asking us to support them politically."
 r56_czechoslovakia.84.a: "Supporting Czechoslovak monarchists alligns with our goals"
 r56_czechoslovakia.84.b: "Why should we care?"
 r56_czechoslovakia.85.t: "Kaiser Lends His Support"
 r56_czechoslovakia.85.desc: "After breif negotiations, the Kaiser seems to have agreed to support our cause"
 r56_czechoslovakia.85.a: "Great"
 r56_czechoslovakia.86.t: "Negotiations Stall"
 r56_czechoslovakia.86.desc: "Unfortunately, the negotiations have stalled. It seems that we shall not recive any additional support from Berlin."
 r56_czechoslovakia.86.a: "Sad"
 r56_czechoslovakia.87.t: "Horthy Agrees To Full Integration"
 r56_czechoslovakia.87.desc: "The negotiations have been a complete success, with the Hungarians agreeing to a complete integration. On the formation of the Danube Monarchy, our two countries shall be united."
 r56_czechoslovakia.87.a: "Great"
 r56_czechoslovakia.88.t: "Secret Negotiations with Prague"
 r56_czechoslovakia.88.desc: "It seems that the Czechoslovak nobility is planning to restore the foremer monarchy, and a proposition has been put forth - the countires should unite once again. With political climate worsening day-by-day, uniting to form a stronger state would be a better solution than to stand alone."
 r56_czechoslovakia.88.a: "We shall accept full integration"
 r56_czechoslovakia.88.b: "We can agree to a closer cooperation"
 r56_czechoslovakia.88.c: "It's not in our interests"
 r56_czechoslovakia.89.t: "Horthy Agrees To a Closer Cooperation"
 r56_czechoslovakia.89.desc: "The negotiations in Budapest have been concluded, with the sides agreeing to a closer cooperation. In a callback to the former Empire, Hungary shall retain control over its domestic issues, whilst following us in foreign affairs."
 r56_czechoslovakia.89.a: "Good enough"
 r56_czechoslovakia.90.t: "Negotiations Fail"
 r56_czechoslovakia.90.desc: "It seems that the admiral has gotten a taste for power. Our advancments have been refused, and it seems that we will have to solve this issue by force."
 r56_czechoslovakia.90.a: "Sad"
 r56_czechoslovakia.92.t: "Prague Demands a Referendum"
 r56_czechoslovakia.92.desc: "In a speech in Prague, [CZE.GetLeader] has demanded that the country be permitted to restore the former state. In a gesture of reconciliation, however, he has publicly noted that the people should be permitted to make that choice for themselves."
 r56_czechoslovakia.92.a: "Let the people have their say."
 r56_czechoslovakia.92.b: "That's not in our interest."
 r56_czechoslovakia.92.c: "We can agree to a closer cooperation"
 r56_czechoslovakia.94.t: "Referendum Succeeds"
 r56_czechoslovakia.94.desc: "Shortly after midnight, [AUS.GetLeader] announced that the Austrian people had voted for a union with Prague. A telegram has arrived, formally offering Otto von Habsburg the crown of Austria in a first step to revive the double monarchy."
 r56_czechoslovakia.94.a: "Excellent."
 r56_czechoslovakia.93.t: "Referendum Approved"
 r56_czechoslovakia.93.desc: "The results of the Referendum are in, and the preliminary count shows a significant majority for Union with Prague."
 r56_czechoslovakia.93.a: "The people have spoken."
 r56_czechoslovakia.95.t: "Referendum Fails"
 r56_czechoslovakia.95.desc: "Despite a well-orchestrated campaign by pro-restorationist groups and monarchists, preliminary results show a small majority for maintaining the status quo."
 r56_czechoslovakia.95.a: "Wise choice."
 r56_czechoslovakia.96.t: "Referendum Defeated"
 r56_czechoslovakia.96.desc: "Despite our best efforts, the people have decided to keep the status quo."
 r56_czechoslovakia.96.a: "We must liberate the country and return it to its rightful ruler."
 r56_czechoslovakia.96.b: "We shall respect the result."
 r56_czechoslovakia.97.t: "Referendum Refused"
 r56_czechoslovakia.97.desc: "Austrian leader [AUS.GetLeader] has publicly declared that the entire country is united in their opposition to the Habsburgs, and that the very idea of a referendum on Austrian independence is utterly absurd. "
 r56_czechoslovakia.97.a: "We shall see how united they really are."
 r56_czechoslovakia.97.b: "Democracy at work."
 r56_czechoslovakia.98.t: "Austria Agrees to a Closer Cooperation"
 r56_czechoslovakia.98.desc: "The Austrian government has decided to meet our demand half-way, agreeing in principle to coordinate their policies with us whilst still maintaining a certain degree of autonomy."
 r56_czechoslovakia.98.a: "Good enough."
 r56_czechoslovakia.99.t: "Electing the Monarch"
 r56_czechoslovakia.99.desc: "Now that the Šlechta came to power a pressing issue must be resolved - who will get the Bohemian crown? Three possible options exist - with Otto von Habsburg being the obvious choice, as he has proclaimed his loyalty to our state multiple times already, even applying to become a citizen of the then-new republic. Alternatively, we could choose the eldest child of the late Franz Ferdinand - Sophie von Hohenberg. The fact that she is half-Czech will surely have a stabilising influence, although her lack of experience in politics may constitute a problem. Or, we could officially proclaim František von Schwarzenberg as our regent for the time being."
 r56_czechoslovakia.99.a: "We do not need a monarch - let us keep František von Schwarzenberg for now"
 r56_czechoslovakia.99.b: "We shall choose Princess Sophie von Hohenberg"
 r56_czechoslovakia.99.c: "Otto von Habsburg is the natural choice"
 r56_czechoslovakia.101.t: "Referendum Refused"
 r56_czechoslovakia.101.desc: "Hungarian leader [HUN.GetLeader] has publicly declared that the entire country is united in their opposition to the Habsburgs, and that the very idea of a referendum on Hungarian independence is utterly absurd. "
 r56_czechoslovakia.101.a: "We shall see how united they really are."
 r56_czechoslovakia.101.b: "Democracy at work."
 r56_czechoslovakia.103.desc: "Shortly after midnight, [HUN.GetLeader] announced that the Hungarian people had voted for a union with Prague. A telegram has arrived, formally offering Otto von Habsburg the crown of Hungary in a first step to revive the double monarchy."
 r56_czechoslovakia.105.t: "Hungary Agrees to a Closer Cooperation"
 r56_czechoslovakia.105.desc: "The Hungarian government has decided to meet our demand half-way, agreeing in principle to coordinate their policies with us whilst still maintaining a certain degree of autonomy."
 r56_czechoslovakia.105.a: "Good enough."
 r56_czechoslovakia.106.t: "Prague Proposes Mutual Guarantees"
 r56_czechoslovakia.106.desc: "In a speech in Prague, [CZE.GetLeader] has proposed making mutual guarantees to each other. This could certainly deter potential enemies, although this could also drag us into a war. What is our answer?"
 r56_czechoslovakia.106.a: "Guaranteeing each other's independence would increase stability in the region"
 r56_czechoslovakia.106.b: "It's not in our interest."
 r56_czechoslovakia.107.t: "Poland Agrees to Our Proposal"
 r56_czechoslovakia.107.desc: "Polish leader [POL.GetLeader] has decided to agree to our proposal. This agreement will surely be to our mutual benefit."
 r56_czechoslovakia.107.a: "Great."
 r56_czechoslovakia.108.t: "No Agreement Reached"
 r56_czechoslovakia.108.desc: "Polish leader [POL.GetLeader] has decided declined to sign our proposal. It seems that the Poles have different priorities."
 r56_czechoslovakia.108.a: "Fine, we didn't need them anyway."
 r56_czechoslovakia.109.t: "[CZE.GetAdjective]s Demand Territorial Renegotiations"
 r56_czechoslovakia.109.desc: "With the reunification of Austria and Hungary with Czechoslovakia, [CZE.GetLeader] has petitioned our government, asking for the return of territories where Hungarians constitute a majority. As a compensation, Prague offers large industrial investments, guarantees and an official alliance that would protect us against the Soviets. Should we accept this offer?"
 r56_czechoslovakia.109.a: "We shall transfer North Transylvania and Transylvania"
 r56_czechoslovakia.109.b: "We will return North Transylvania"
 r56_czechoslovakia.109.c: "We won't return anything, those territories are ours."
 r56_czechoslovakia.110.t: "Romania Transferes the Territories"
 r56_czechoslovakia.110.desc: "Romania agreed to our proposal, and the transfer of the Erdély region shall begin shortly, as will our payments to Romanians"
 r56_czechoslovakia.110.a: "Great."
 r56_czechoslovakia.111.t: "Romania Transferes North Transylvania"
 r56_czechoslovakia.111.desc: "Romania partially agreed to our proposal, and the transfer of North Transylvania shall begin shortly, as will our payments to Romanians"
 r56_czechoslovakia.111.a: "Good."
 r56_czechoslovakia.112.t: "Romania Refuses!"
 r56_czechoslovakia.112.desc: "The Romanian government refused to consider our proposal. Now we have to decide on the course of our next actions. We could ask for mediation from the UK or from Poland, we could consider using force or we could back down."
 r56_czechoslovakia.112.a: "We can't risk starting a war now, we have to back down."
 r56_czechoslovakia.112.b: "Let's approach the British for mediation."
 r56_czechoslovakia.112.c: "Let's ask Poland for mediation."
 r56_czechoslovakia.112.d: "Then we will just take those territories by force!"
 r56_czechoslovakia.113.t: "[CZE.GetName] Asks for Arbitration"
 r56_czechoslovakia.113.desc: "With conflict brewing in Eastern Europe, the [CZE.GetName] has approached us asking to mediate upon the disagreement between them and the Romanians. Should we support Prague's claims?"
 r56_czechoslovakia.113.a: "Yes, their claims are just."
 r56_czechoslovakia.113.b: "No, it doesn't concern us."
 r56_czechoslovakia.114.t: "Arbitration Successful!"
 r56_czechoslovakia.114.desc: "Our diplomats were succesful, and a support agreement was signed. Now the Romanians will either have to fold or face the combined force of our armies"
 r56_czechoslovakia.114.a: "Great."
 r56_czechoslovakia.115.t: "Arbitration Failed"
 r56_czechoslovakia.115.desc: "Our diplomats weren't able to succede, and now we must choose if we want to further escalate or if we should back down."
 r56_czechoslovakia.115.a: "Then war it is"
 r56_czechoslovakia.115.b: "We should back down"
 r56_czechoslovakia.116.t: "[FROM.GetNameDefCap] Demands Resolution of the Territorial Issues"
 r56_czechoslovakia.116.desc: "It seems that Prague managed to get British support in their quest to get our territoriy. We are now forced to consider weather to give up the territory of North Transylvania or enter into a large-scale conflict."
 r56_czechoslovakia.116.a: "Fine, they can have it"
 r56_czechoslovakia.116.b: "We won't back down"
 r56_czechoslovakia.117.t: "[FROM.GetNameDefCap] Requests a Union"
 r56_czechoslovakia.117.desc: "The [CZE.GetAdjective] government wants to unify both of our countries into a West Slavic hegemon of Eastern Europe."
 r56_czechoslovakia.117.a: "Sure"
 r56_czechoslovakia.117.b: "Nie!"
 r56_czechoslovakia.118.t: "Poland Accepts Union"
 r56_czechoslovakia.118.desc: "The Polish Sejm ratified this world changing agreement."
 r56_czechoslovakia.118.a: "Good boy... wink wink"
 r56_czechoslovakia.119.t: "Poland Rejects Union"
 r56_czechoslovakia.119.desc: "The Polish Sejm refused to ratify this agreement and this can only result in two things:"
 r56_czechoslovakia.119.a: "Nothin'"
 r56_czechoslovakia.119.b: "TOTÁLNÍ VÁLKA!"
 r56_czechoslovakia.120.t: "[CZE.GetAdjective]s Demand Territorial Renegotiations"
 r56_czechoslovakia.120.desc: "With the reunification of Austria and Hungary with Czechoslovakia, [CZE.GetLeader] has petitioned our government, asking for the transfer of parts of Slovenia and coastal Croatia. In particular, the provinces of Lower Styria, Prekmurje, Ljubljana and Kvarner were mentioned. As a compensation, Prague offers large industrial investments, guarantees and an official alliance that would protect us against the Italians. Should we accept this offer?"
 r56_czechoslovakia.120.a: "Fine"
 r56_czechoslovakia.120.b: "We shall not give up our territories"
 r56_czechoslovakia.121.t: "Yugoslavia Transfers the Territories"
 r56_czechoslovakia.121.desc: "Our diplomats were succesful, and the Yugoslav government has already begun the process of transferring the territories in question."
 r56_czechoslovakia.121.a: "Lovely."
 r56_czechoslovakia.122.t: "Yugoslavia Refuses"
 r56_czechoslovakia.122.desc: "We werent able to persuade Yugoslavia to agree to our terms. Now it seems we must choose weather to go to war over the territories or to back down."
 r56_czechoslovakia.122.a: "War it is."
 r56_czechoslovakia.122.b: "We can't start a war right now."
 r56_czechoslovakia.123.t: "[CZE.GetAdjective]s Demand Withdrawl from Croatia"
 r56_czechoslovakia.123.desc: "Prague wants us to give up large parts of our territories. Unfortunately, it seems that their agents managed to convince some of the local populace to fight against our rule. Should we fight back?"
 r56_czechoslovakia.123.b: "Fine, they can have it"
 r56_czechoslovakia.123.a: "We won't back down"
 r56_czechoslovakia.125.t: "Croatian Government Established"
 r56_czechoslovakia.125.desc: "With our help the Croatians have established their government. Our material and political support has resulted in a certain level of influence over their actions."
 r56_czechoslovakia.125.a: "Great"
 r56_czechoslovakia.126.t: "Prague demands we pull out of our Transylvanian territories"
 r56_czechoslovakia.126.desc: "Prague wants us to give up large parts of our territories. Unfortunately, it seems that their agents managed to convince some of the local populace to fight against our rule. Should we fight back?"
 r56_czechoslovakia.126.b: "Fine, they can have it"
 r56_czechoslovakia.126.a: "We won't back down"
 r56_czechoslovakia.124.t: "Local Militias Raised"
 r56_czechoslovakia.124.desc: "The local militias, using the weapons that Prague donated to us, have risen up and are ready to defend our nation"
 r56_czechoslovakia.124.a: "Great"
 r56_czechoslovakia.128.t: "Székely Government Established"
 r56_czechoslovakia.128.desc: "With our help the Hungarians in Transylvania have established their government. Our material and political support has resulted in a certain level of influence over their actions."
 r56_czechoslovakia.128.a: "Great"
 r56_czechoslovakia.127.t: "Local Militias Raised"
 r56_czechoslovakia.127.desc: "The local militias, using the weapons that Prague donated to us, have risen up and are ready to defend our nation"
 r56_czechoslovakia.127.a: "Great"
 r56_czechoslovakia.129.t: "[CZE.GetName] Asks for Arbitration"
 r56_czechoslovakia.129.desc: "An envoy from Prague has arrived, asking our help in putting diplomatic pressure on the Romanians and the Serbs to yield to the demands and relinquish their control over certain regions. Should the negotiations fail, however, Prague might expect us to help them militarily"
 r56_czechoslovakia.129.a: "Offer them our support"
 r56_czechoslovakia.129.b: "Lets not rock the boat"
 r56_czechoslovakia.130.t: "Arbitration Successful!"
 r56_czechoslovakia.130.desc: "Our diplomatic mission was a success, Germany has declared its support"
 r56_czechoslovakia.130.a: "Great"
 r56_czechoslovakia.131.t: "Arbitration Failed"
 r56_czechoslovakia.131.desc: "Citing stability concerns and not wishing to destabilise the international situation, Berlin has stated that, while in principle, it fully supports our cause, Germany doesn't wish to make any threats against other countries."
 r56_czechoslovakia.131.a: "Sad"
 r56_czechoslovakia.132.t: "[CZE.GetName] Demands Transylvania"
 r56_czechoslovakia.132.desc: "Citing concerns over the alleged mistreatment of the Szekely population in Northern Transylvania, Prague has demanded we give up the state to them. What shall we do?"
 r56_czechoslovakia.132.a: "We shoouldn't risk war"
 r56_czechoslovakia.132.b: "We won't give up our territory"
 r56_czechoslovakia.133.t: "[CZE.GetName] Demands Slovenia and Croatia"
 r56_czechoslovakia.133.desc: "Accusing us of forging the resulsts of the referenda held after the Great War and stating that our rule from Belgrade has been aimed at destroying the culture of said territories, Prague has demanded we retreat from Slovenia and Northern Croatia. Should we resist this aggression?"
 r56_czechoslovakia.133.a: "We shoouldn't risk war"
 r56_czechoslovakia.133.b: "We won't give up our territory"
 r56_czechoslovakia.134.t: "Romania Refuses our Demand"
 r56_czechoslovakia.134.desc: "They have stated that our claims are false and that they will resist any attempt at annexation."
 r56_czechoslovakia.134.a: "Sad"
 r56_czechoslovakia.135.t: "The Serbs Refuse our Demands"
 r56_czechoslovakia.135.desc: "Serbian government stated that they shall not bow to our demands and will defend their borders"
 r56_czechoslovakia.135.a: "Sad"
 r56_czechoslovakia.136.t: "Czechoslovakia Offers to Split Poland"
 r56_czechoslovakia.136.desc: "The Czechoslovak Foreign Ministry has recently sent us a proposal, offering to divide the recently independent nation of Poland between ourselves. In exchange for our participation in the invasion, they are currently offering us total control over the lands lost to us in the recent Polish-Soviet war. What are we to say of this significant offer?"
 r56_czechoslovakia.136.a: "This will bring mutual benefit to us all!"
 r56_czechoslovakia.136.b: "We can't risk further antagonizing of the west."
 r56_czechoslovakia.137.t: "The [SOV.GetAdjective] Have Agreed!"
 r56_czechoslovakia.137.desc: "The [SOV.GetAdjective] have agreed to our proposal to divide Poland. We are now ready to issue imminent plans for a joint-invasion of the nation."
 r56_czechoslovakia.137.a: "Excellent news."
 r56_czechoslovakia.138.t: "The [SOV.GetAdjective] Have Refused!"
 r56_czechoslovakia.138.desc: "The [SOV.GetAdjective] have refused our proposal to divide Poland, stating that they cannot risk "indefinite conflict" with the western world, who they say this will surely antagonize."
 r56_czechoslovakia.138.a: "Then we will go alone!"
 r56_czechoslovakia.139.t: "Beneš's Little Entente Negotiations Fail"
 r56_czechoslovakia.139.desc: "A scandal is brewing in Prague - and this time, it seems, Beneš won't be able to survive it. With another of his strategic plans failed, multiple parties in the parliament are calling for his resignation. With pressure mounting, it seems that Milan Hodža will have to take the matters into his own hands and take control of the government, at least for the time being. The cost of Beneš's economic policies is yet to be estimated, but one thing is already certain - this shortsighted attempt to attune our industries and farmers to stop competing with the Romanians and the Serbians without getting anything in return will cost us."
 r56_czechoslovakia.139.a: "R E S I G N"
 r56_czechoslovakia.139.b: "A political scandal for sure"
 r56_czechoslovakia.140.t: "Little Entente Offers Rapproachment"
 r56_czechoslovakia.140.desc: "Little Entente delegates have arrived and want to mend their ties with us, citing their concerns regarding the international stability and stating, that small nations should stick together to resist the threats from totalitarian regimes around us. Should we accept their offer and being a closer cooperation with their alliance?"
 r56_czechoslovakia.140.a: "This will be to our benefit"
 r56_czechoslovakia.140.b: "No, we have other plans"
 r56_czechoslovakia.141.t: "[FROM.GetLeader] Agrees to Closer Cooperation"
 r56_czechoslovakia.141.desc: "[FROM.GetLeader] has signed the treaty of closer cooperation between our countries and guarantees were given."
 r56_czechoslovakia.141.a: "Great"
 r56_czechoslovakia.142.t: "[FROM.GetLeader] Refused Negotiations"
 r56_czechoslovakia.142.desc: "[FROM.GetLeader] stated that [FORM.GetNameDef] has a firm comitment to the policy of neutrality and so shall refrain from entering into any alliances."
 r56_czechoslovakia.142.a: "Neutrality? Preposterous! What is he planning?"

 CZE_great_depression_aftermath: "1936 Currency Devaluation"
 CZE_great_depression_aftermath_desc: "The Czechoslovak economy was always export-oriented, which was one of the reasons why the Great Depression hit the country hard. Devaluing our currency will lower the prices of goods we export, allowing us to begin the recovery process. At the same time, such a move will not be very popular at home."
 CZE_great_depression_aftermath_tooltip_reward: "\n§YIndustry§! related §YResearch Bonus§!."
 CZE_support_consumer_goods_industry: "Support Consumer Goods Industry"
 CZE_support_consumer_goods_industry_desc: "Czechoslovakia was always an export-oriented country. Before the Great Depression hit the country, the main exports included various food processing goods (sugar, beer, and ham), glass, wood products, paper, textiles, clothing, shoes, and leather goods. Helping these industries will expedite our recovery."
 CZE_support_consumer_goods_industry_tooltip_reward: "\n§YCivilian Industry§!."
 CZE_highway_construction_project: "Improve Highway Connections"
 CZE_highway_construction_project_desc: "The construction of a highway from the westernmost part of our country to the easternmost will increase the mobility of our citizens, making it easier to travel and transport goods."
 CZE_highway_construction_project_tooltip_reward: "Improves §YInfrastructure§! of Czechoslovakia."
 CZE_prospect_new_resources: "Prospect for New Resources"
 CZE_prospect_new_resources_desc: "The critical natural resources of Czechoslovakia include timber, soft coal, hard coal, graphite, and clay. Iron ore was mined mainly in Slovakia, but deposits for other metals were relatively insignificant. A small bauxite deposit occurs at Rychnov in Bohemia, and small high-quality oil deposits have been extracted since 1900 in South Moravia."
 CZE_prospect_new_resources_tooltip_reward: "\n§YNew Resources§! and §YIndustry§! related §YResearch Bonus§!."
 CZE_expand_heavy_industry: "Expand Heavy Industry" 
 CZE_expand_heavy_industry_desc: "As one of the main branches of industry with relatively modern plant and equipment, the metallurgy industry formed the basis of the technically advanced mechanical and electrical engineering industries and many other branches of industry in pre-Munich Czechoslovakia."
 CZE_expand_heavy_industry_tooltip_reward: "\n§YNew Resources§! (Steel)."
 CZE_eastern_urbanization: "Eastern Urbanization Project"
 CZE_eastern_urbanization_desc: "Between 1918 and 1938, the Czechoslovak government made certain efforts to develop the Slovak and Ruthenian regions, and thousands of Czech teachers, police officers, clerks, and business people went to the region."
 CZE_eastern_urbanization_tooltip_reward: "Increases §YBuilding Slots§! in the regions of §YSlovakia§! and §YCarpathian Ruthenia§!."
 CZE_chemical_industry_development: "Chemical Industry Development"
 CZE_chemical_industry_development_desc: "Czechoslovakia had a thriving chemical industry, centered primarily in northwestern Sudetenland. When Nazi Germany annexed Czechoslovakia, it finished building crucial synthetic oil refineries in Most (German Brüx)."
 CZE_chemical_industry_development_tooltip_reward: "\n§YCivilian Industry§! and §YSynthetic Oil§! related §YResearch Bonus§!."
 CZE_commercial_tyre_production: "Commercial Tire Production"
 CZE_commercial_tyre_production_desc: "The high cost of rail transport prompted the Bata company to operate its fleet of vehicles to transport goods by road. In 1934, to counteract the high costs of importing tires for its fleet of vehicles, the company decided to produce them."
 CZE_commercial_tyre_production_tooltip_reward: "\n§YCivilian Industry§! and §YNew Resources§! (Rubber)."
 CZE_support_strategic_industry: "Support Strategic Industry"
 CZE_support_strategic_industry_desc: "Many small industrial firms made Czechoslovakia a diversified producer of goods, but a few companies dominated the economy and were strategically important."
 CZE_secure_arms_export_deals: "Secure Arms Export Deals"
 CZE_secure_arms_export_deals_desc: "Czechoslovakia had long been one of the world's leading exporters of weapons to the developing world. By selling arms, Czechoslovakia could profit, stimulate its industrial economy, and form closer political relations with the states that purchased its arms."
 CZE_secure_arms_export_deals_tooltip_reward: "\n§YResearch§! and §YTrade§! related §YNational Idea§!."
 CZE_liechtenstein_properties: "[LIE.GetNonIdeologyName] Properties"
 CZE_explosives_production: "Expand Explosives Industry"
 CZE_explosives_production_desc: "Czechoslovakia had a long tradition in the explosives business that continued well after World War II. Semtex plastic explosive is probably one of the best-known Czechoslovak explosives since the Cold War."
 CZE_explosives_production_tooltip_reward: "\n§YCivilian Industry§! OR §YMilitary Industry§! with §YArtillery§! related §YResearch Bonus§!."
 CZE_skoda_naval_artillery_experience: "Skoda Naval Artillery Experience"
 CZE_skoda_naval_artillery_experience_desc: "Skoda designed the guns of the Austro-Hungarian navy; it's time to put that experience to good use once again."
 CZE_cvut: "Czech Technical University"
 CZE_cvut_desc: "The Czech Technical University in Prague (ČVUT) is one of the oldest universities in the Central European region, having been established in 1707 by Emperor Joseph I. Expanding it would be very beneficial for the country."
 CZE_cvut_tooltip_reward: "\nGain §G1§! Research Slot."
 CZE_commercial_uranium_mining: "Uranium Mining"
 CZE_commercial_uranium_mining_desc: "Czechoslovakia is the birthplace of industrial-scale uranium mining. Uranium mining at Jáchymov (at that time named Joachimsthal and belonging to Austria-Hungary) started in the 1890s on an industrial scale after the silver and cobalt production of the deposit declined."
 CZE_commercial_uranium_mining_tooltip_reward: "\n§YCivilian Industry§! OR §YNuclear Technology§! related §YResearch Bonus§!."
 CZE_nuclear_physics_institute: "Nuclear Physics Institute"
 CZE_nuclear_physics_institute_desc: "The Nuclear Physics Institute of the Czechoslovak Academy of Sciences was founded in 1955, long after the Second World War. However, if historical events had taken a different path, atomic research in Czechoslovakia might have begun much sooner."
 CZE_rocket_research: "Rocket Research"
 CZE_rocket_research_desc: "Rocket and jet engines allow for unprecedented speeds for crewless and crewed vessels alike. Pioneering these technologies enables us to take the enemy by surprise."

 CZE_engineer_corps: "Engineer Corps Training"
 CZE_engineer_corps_desc: "Engineer units were crucial for the Fortification Works project and thus received the best training and equipment."
 CZE_military_education: "Support Military Education"
 CZE_military_education_desc: "Several military schools and academies were operational in pre-war Czechoslovakia and were greatly influenced by the French military mission."
 CZE_military_education_tooltip_reward: "\n Choice between three §YMilitary§! related §YNational Ideas§!."
 CZE_border_brigades: "Form Border Brigades"
 CZE_border_brigades_desc: "We need to form highly trained garrison regiments for our heavy border fortification objects."
 CZE_border_brigades_tooltip_reward_old: "§OSpecial Bonus:§! New Division Template (§YHraničářská Brigáda§! - Elite Garrison Brigade)."
 CZE_border_brigades_tooltip_reward: "§YHraničářská Brigáda§! - Elite Garrison Brigade."

 CZE_mobile_army: "Form Fast Divisions"
 CZE_mobile_army_desc: "Tanks are to play a very important role in our military. Realizing this and shifting our tactics towards those favouring armored combat will bring good results."
 CZE_mobile_army_tooltip_reward: "\n §OSpecial Bonus:§! New Division Template (§YRychlá Divize§! - Light Tank Division)."
 CZE_new_doctrines: "Study Latest Military Doctrines"
 CZE_new_doctrines_desc: "Czechoslovak Army has to adopt the latest trends in military doctrines and adopt modern training methods and unit organization."
 CZE_military_science_institute: "Military Science Institute"
 CZE_military_science_institute_desc: "The Czechoslovak Military Science Institute (Vědecký Ústav Vojenský - VÚV) was established in 1920s from the former structures of Scientific Union of Czechoslovak Officers."

 CZE_czechoslovak_firearms: "Modernize Infantry Equipment"
 CZE_czechoslovak_firearms_desc: "Although Czechoslovakia was a significant arms exporter for decades, the army adopted modern infantry weapons very slowly. However, once the rearmament program started, large orders for rifles and modern machine guns were issued."

 CZE_holek_brothers: "Design New Firearms"
 CZE_holek_brothers_desc: "During their time at Zbrojovka Brno, the Holek brothers designed the most advanced Czechoslovak firearms licenced worldwide."
 firearms_designer: "Firearms Designer"

 CZE_armament_1: "Firearms and Munition Deliveries"
 CZE_armament_1_desc: "Czechoslovakia was a major exporter of arms, and the domestic production could easily cover all the needs of the Czechoslovak armed forces before 1936. But as the orders from the army increased, the existing factories had to be expanded."
 CZE_armament_1_tooltip_reward: "\n§YMilitary Industry§! and §YInfantry Equipment§! related bonus."
  czub: "ČZUB"
  czub_desc: "Armament firm from Uherský Brod, a branch of Česká Zbrojovka."
 CZE_armament_2: "Secure Armament Contracts"
 CZE_armament_2_desc: "Czechoslovakia traditionally relied on domestic firms to supply the army with equipment and supplies. Both Škoda and ČKD exported modern weapons to the world, but before 1936, there was no incentive for the Czechoslovak leadership to modernize the armed forces' equipment."
 CZE_armament_2_tooltip_reward: "\n§YMilitary Industry§! and §YMilitary Production§! related §YNational Idea§!." 
 cze_skoda_works: "Škoda Works"
 cze_skoda_works_desc: "The Škoda Works was one of the largest European industrial conglomerates of the 20th century."
 cze_ckd_company: "ČKD"
 cze_ckd_company_desc: "ČKD was one of the largest engineering companies in former Czechoslovakia."
 CZE_armament_2b: "Order Military Trucks"
 CZE_armament_2b_desc: "The Czechoslovak army had plans for higher motorization. Unfortunately, the enormous cost of fortification works meant that the budget for procuring new trucks was limited."
 CZE_armament_2b_tooltip_reward: "\n§YMilitary Industry§! and §YMilitary Production§! related §YNational Idea§!."
 cze.216.t: "Ringhoffer - Tatra"
 cze.216.desc: "Tatra dates back to 1850, when Ignac Sustala founded a carriage and coach factory in Koprivnice (Nesselsdorf) with two journeymen.\n\nAfter 1918, the name of the Koprivnice company was changed from Nesselsdorfer Wagenbau to Koprivnicka vozovka, a.s. At that time, the company's management moved from Vienna to Prague after a call from the Czechoslovak state authorities. In 1919, the TATRA brand appeared on vehicles for the first time.\n\nThe company was incorporated into the Ringhoffer Corporation in 1926. In 1936, after another approximation with the Prague magnate, Ringhoffer TATRA, a.s. was founded and renamed Ringhoffer TATRA Werke AG two years later.\n\nExcept for some contracts for armored cars, the company never really succeeded in any military contests. The ČKD/Škoda cartel almost always secured the contracts for the Czechoslovak army, often thanks to bribes. However, this did not stop Tatra from developing its armored vehicles and even experimental tanks apart from traditional car, truck, and locomotive production.\n\nDuring World War II, Tatra was instrumental in producing trucks and tank engines for the German war effort, and the famous T 111 was born. This three-axle heavy truck with a directly air-cooled 12-cylinder diesel engine remained in production for 16 years.\n\nAnother successful design, the Tatra 87 car, was popular amongst German officers during World War II for its superior speed and handling on the Autobahn. Hitler was a keen automotive enthusiast and had ridden in the Tatras during political tours of Czechoslovakia.\n\nMany German officers met their deaths driving heavy, rear-engined Tatras faster around corners than they could handle. At the time, as an anecdote, Tatra became known as the "Czech Secret Weapon" for the scores of officers who died behind the wheel; at one point, official orders were issued forbidding German officers from driving."
 cze.216.a: "Order new trucks." 
  tatra: "Ringhoffer - Tatra"
  tatra_desc: "A company from Koprivince and a significant producer of cars, trucks, and locomotives."
 CZE_new_tanks: "Field Test New Tank Models"
 CZE_new_tanks_desc: "The Czechoslovak armed forces held a competition for a new medium tank in 1937, and Škoda, ČKD, and Tatra competed. The army eventually ordered LT vz. 38 from ČKD/Škoda, which Nazi Germany later used against Poland and France. Among the concepts presented was the ČKD ST.39 medium tank."
 CZE_new_tanks_tooltip_reward: "\nNew §YLight Tank§! variant OR §YMedium Tank§! research."
 cze.217.t: "Czechoslovak Army Tank Modernization"
 cze.217.desc: "Because of the worsening international situation in Europe, the Czechoslovak armed forces launched a contest for a new tank. Out of the several projects presented, the modernized version of TNHP light tanks and the V-8-H medium tank prototype were the most promising in the test runs.\n\nIn 1935, the Czechoslovak tank manufacturer KD was looking for a replacement for the LT VZ-35 tank that they were producing in collaboration with Škoda Works. The resulting vehicle was reliable and an export success under the name "TNH". With slight variations for each customer, 50 were exported to Iran (TNHP) and 24 each to Peru (LTP) and Switzerland (LTH). Lithuania also ordered some (LTL). A somewhat modernized variant of the tank, later known as the LT vz. 38,  participated in the contest.\n\nThe V-8-H project was started in the late 1930s by ČKD, and the resulting vehicle was eventually known as the ST vz. 39. Due to the worsening international situation, the army ordered a few hundred of these vehicles. However, the order was cancelled after the Munich Agreement, and the model was never mass-produced.\n\nWhich tanks should be ordered for the Czechoslovak army?"
 cze.217.a: "Order the production of LT vz. 38 light tanks."
 cze.217.b: "Further develop the V-8-H medium tank project."
  skoda_works_artillery: "Škoda Works"
  skoda_works_industry: "Škoda Works"
  ckd_tanks: "ČKD & Škoda"
  ckd_electric: "ČKD"
 CZE_artillery_focus: "Artillery Modernization"
 CZE_artillery_focus_desc: "The Czechoslovak Army ordered and used many excellent artillery, anti-tank, and anti-air guns produced by Škoda Works."
 CZE_armoured_cars: "Armored Cars Modernization"
 CZE_armoured_cars_desc: "The Czechoslovak Army had been evaluating various Tatra armored cars since 1926, with many prototypes built. Eventually, OA vz. 30 armoured cars were ordered, and around 50 were made for the army. During World War II, Tatra developed its first air-cooled diesel engine, a massive V12 initially designed for the armored SdKfz 234 Puma."
 CZE_mechanized_units: "Armored Personnel Carriers"
 CZE_mechanized_units_desc: "We need to focus on developing special armored vehicles for our motorized infantry."
 CZE_new_tank_design: "Design New Tanks"
 CZE_new_tank_design_desc: "We need to focus on developing new, modern tanks."

 CZE_air_is_our_sea: "Air Is Our Sea"
 CZE_air_is_our_sea_desc: "The Czechoslovak leadership needed to build a capable air force for a modern nation surrounded by potentially hostile neighbours without access to the ocean. As a result, the motto "Air is our sea" was born."
 CZE_air_is_our_sea_tooltip_reward: "\n§YAir Doctrines§! research bonus."
 CZE_czechoslovak_airforce: "Expand the Czechoslovak Airforce"
 CZE_czechoslovak_airforce_desc: "In the spring of 1935, Germany publicly confessed to building a strong air force; Czechoslovakia and France responded by deepening aviation cooperation and expanding their air forces."
 CZE_czechoslovak_airforce_tooltip_reward: "\nFree §YChief of Airforce§! and §YAir Base§!."
 cze.219.t: "Expansion of the Czechoslovak Airforce"
 cze.219.desc: "Czechoslovak Airforce operated directly under the Ministry of National Defense as part of III. Department (Air Force) that administered affairs of the air force and air defense. It was probably one of the most prestigious branches of the armed forces, although, in personnel, it only represented about 4% of total numbers.\n\nMuch like in the case of the army, the air forces also relied solely on domestic production for all weapons, equipment, and other avionics instruments. However, later some new licenses for modern airplanes were purchased from France and the Soviet Union.\n\nIn 1934, the Ministry of National Defense decided that the air forces would be equipped with a single type of fighter, the Avia B.534 biplane, which eventually became the backbone of the Czechoslovak Air Force with 568 planes, built in four series (versions).\n\nWhen in the spring of 1935, Germany publicly confessed to building a strong Air Force, Czechoslovakia and France responded by deepening aviation cooperation. Czechoslovak High Command reacted to this new fact by expanding three airfields to seven, each capable of supplying two bomber squadrons that would arrive from France in case of war with Germany.\n\nEarly in 1936, a new batch of Avia B.534 aircraft was ordered by MND, with planes entering service in the spring of 1937. The last version of the plane included various refinements that allowed the IV. series to have an increased speed of over 200 mph (320 km/h), which placed it on par with the best of its contemporary biplanes.\n\nGeneral Jaroslav Fajfr was the head of the III. Department of MND since 1927 and significantly contributed to the expansion and organization of the Czechoslovak Air Force."
 cze.219.a: "Allocate more funds to the III. Department."
 CZE_air_modernization: "Letov Military Aircraft Factory"
 CZE_air_modernization_desc: "The Czechoslovak government, between the wars, balanced a home-grown aviation industry with licensing engines and aircraft designs from allied nations. Letov military factory was found to repair and upgrade old planes, and many models were continuously refitted to prolong their lifespan."
 CZE_air_modernization_tooltip_reward: "\nNew §YFighter§! and §YClose Air Support§! variant."
 cze.220.t: "History of the Letov Company"
 cze.220.desc: "The Letov company is the oldest aviation manufacturer in former Czechoslovakia and was founded originally in 1918 by the Ministry of National Defense as a state-controlled aircraft repair firm for WW1 planes inherited by the Czechoslovak Airforce.\n\nThe company was situated in Letnany, Prague, and employed about 1.200 workers in the late 1930s, when it manufactured the Š-328 reconnaissance and light bomber biplane, of which over 450 were produced. The entire airframe of the plane was welded together, not bolted or riveted.\n\nThe Letov factory was also the only Czechoslovak plant that manufactured metal propellers.\n\nDuring World War II, the factory served as a repair shop for the German Luftwaffe. Production lines were also set up for combat versions of the Ju 290 aircraft, commencing with the Ju 290 A-2, which carried a search radar for its patrol role.\n\nMany Czechoslovak aircraft designs were upgraded and refitted to prolong their lifespan, including the Avia B.534 and Letov Š-328 planes produced in several series that refined the original designs and fixed mechanical problems encountered during the service."
 cze.220.a: "Upgrade Czechoslovak military aircraft."
 CZE_pilot_training: "Military Aviation School"
 CZE_pilot_training_desc: "Czechoslovak pilots had good reputations before the outbreak of World War II, and many of them later escaped for Poland or France after the occupation of Czechoslovakia. Some eventually ended up in England and participated in the Battle of Britain."
 CZE_pilot_training_tooltip_reward: "\nNew §YFighter Ace§! and §YAir Doctrines§! research bonus."
 cze.221.t: "Military Aviation School in Prostejov"
 cze.221.desc: "The history of Czechoslovak military aviation education has almost a century of tradition and dates back to 1919, to the founding of the Flight School in Prague.\n\nIn 1920, Cheb became a major center of military aviation education. However, in 1927 the aviation school was eventually moved to a newly built facility in Prostejov and renamed Military Aviation School.\n\nThe two-year education program produced perfectly trained officers and mechanics, and other technical staff that the Czechoslovak Air Force sorely needed.\n\nMany pilots that fought in the Battle of Britain were graduates of the Military Air School of Prostějov, including Josef František, one of the highest-scoring Allied aces."
 cze.221.a: "Fund military aviation education programs."
 CZE_armament_3: "Expand Aircraft Production"
 CZE_armament_3_desc: "Avia was acquired by Škoda Works in 1929, and over the next few years, the factory grew to become the most important aircraft manufacturer in Czechoslovakia, moving to Letňany near Prague. During World War II, Avia was crucial in producing various fighter aircraft, including the Me-262 jets for the German Luftwaffe."
 CZE_armament_3_tooltip_reward: "\n§YMilitary Industry§! and §YMilitary Production§! related §YNational Idea§!."
 cze.222.t: "Exporting military aviation"
 cze.222.desc: "During the Interbellum years Czechoslovakia not only exported a lot of tanks, small arms and artillery, but also a large amount of military aircraft. Perhaps one of the most important was the Letov Š-28 series CAS. There were many variations of this biplane, with the Letov Š-328 being the most produced. They served in the air forces of Estonia, Latvia, Romania, Greece, Bulgaria and other countries."
 cze.222.a: "Build new facility in Kunovice."
 cze_avia_letnany: "Build more factories"
 cze_avia_letnany_desc: "Modern Aircraft Company located in Letňany, Prague."



 CZE_paradesant_brigade: "Establish Paradesant Brigades"
 CZE_paradesant_brigade_desc: "Based on the [SOV.getAdjective] and French paratrooper training programs, the Czechoslovak High Command decided in summer 1938 to start preparing for the founding of paratrooper units. The 3rd Department of the Ministry of State Defense was responsible for laying the groundwork."
 para_tech: "Paratrooper Training"
 CZE_advanced_aircraft_prototypes: "Design New Aircraft"
 CZE_advanced_aircraft_prototypes_desc: "Czechoslovak companies need to quickly catch up in the aerospace industry, either by designing their new prototypes or by purchasing licences to produce successful foreign planes."
 air_plane_models: "Airplane models"
 CZE_jet_engine_research: "The New Age of Aviation"
 CZE_jet_engine_research_desc: "Rocket and jet engines allow for unprecedented speeds for crewless and crewed vessels alike. Pioneering these technologies enables us to take the enemy by surprise."

 CZE_legacy_of_legions: "Legacy of the Czechoslovak Legion"
 CZE_legacy_of_legions_desc: "The Czechoslovak Legion were volunteer armed forces composed predominantly of Czechs with a small number of Slovaks fighting together with the Entente powers during World War I. After the founding of Czechoslovakia, many former legionaries entered service in the newly formed Czechoslovak Army, taking their valuable combat experiences with them."
 CZE_legacy_of_legions_tooltip_reward: "\n§YPolitical Power§! OR §YVolunteers§! related §YNational Idea§! OR §YArmy Experience§!."
 CZE_czechoslovak_volunteers_idea: "Czechoslovak Union of Volunteers"
 CZE_czechoslovak_volunteers_idea_desc: "Czechoslovak volunteerism has a long tradition. During the Spanish Civil War, almost 1,000 Czechoslovaks fought on the side of Republican Spain as part of the international brigades."
 cze.300.t: "Legacy of the Legions"
 cze.300.desc: "The Czechoslovak Legions were volunteer forces composed of Czechs with a small number of Slovaks fighting for the Entente during World War I. Their goal was to win the Allies' support for the independence of Bohemia and Moravia from the Austrian Empire and Slovak territories from the Kingdom of Hungary, which were then part of the Austro-Hungarian Empire.\n\nIn Russia, they took part in several battles, including those at Zborov and Bakhmach. They were heavily involved in the Russian Civil War, fighting their way to Vladivostok port along the Transsiberian Railway line.\n\nWhen the armistice with the Bolsheviks was concluded, the Legions started a slow evacuation of Czechoslovak troops from Vladivostok, and the last legionaries left the port in September 1920. These men travelled around the world before reaching their newly formed homeland.\n\nAfter their return to Czechoslovakia they assumed the leadership positions in the Army, where they got the highest positions. Due to internal politics, the majority of newly appointed generals were legionaries — particularly those who fought on the Russian front."
 cze.300.a: "Use the influence of the Czechoslovak Association of Legionnaires."
 cze.300.b: "Support Military Volunteer Organizations."
 cze.300.c: "Lessons of the Great War."
 legion_bug: "\n §OSpecial Bonus:§! Can send §GVolunteers§! even at the lowest levels of §YWorld Tension.§!"
 CZE_reorganize_general_staff: "Reorganize the General Staff"
 CZE_reorganize_general_staff_desc: "The organizational structure of the Czechoslovak army was initially based on the French command structure, and the first Chiefs of Staff were French generals. Once a new generation of Czech officers was trained, French officers were no longer needed."
 CZE_reorganize_general_staff_tooltip_reward: "\nChoice between three different §YChiefs of Staff§! for the Czechoslovak Army."
 CZE_military_maneuvers: "Organize Military Maneuvers"
 CZE_military_maneuvers_desc: "The Czechoslovak Army tested its new organization and capabilities during large military maneuvers held in August and September 1936. The whole endeavour taught valuable lessons and sent a clear message to Europe about the readiness of the Czechoslovak armed force."
 CZE_military_maneuvers_tooltip_reward: ""
 CZE_prepare_new_plan: "Prepare New Defense Strategy"
 CZE_prepare_new_plan_desc: "With the rise of Hitler and his demands for unification of German minorities (the Sudeten-Germans) and return of other claimed territories (the Sudetenland), the alarmed Czechoslovak leadership and high command formed new defensive plans."
 CZE_prepare_new_plan_tooltip_reward: ""
 CZE_2nd_departnment: "Expand 2nd Department"
 CZE_2nd_departnment_desc: "The 2nd Department of the General Staff was the military intelligence service operating in Czechoslovakia between 1919 and 1939, responsible for espionage and counter-espionage activities and operations."
 CZE_intelligence_service_offense: "Expand the Offensive Section"
 CZE_intelligence_service_offense_desc: "The primary role of the offensive section of the search group was to gain external information on military threats, and the main subject of its interest was military, political, and economic data."
 CZE_intelligence_service_defense: "Expand the Defensive Section"
 CZE_intelligence_service_defense_desc: "The main objective of the defensive section of the Military Intelligence was to prevent infiltration of foreign espionage groups in the Czechoslovak Army and areas necessary for defense support of Czechoslovakia (arms industry, defense facilities development, etc.)."
 CZE_infiltrate_abwehr: "Infiltrate Abwehr"
 CZE_infiltrate_abwehr_desc: "The German minority situation in Czechoslovakia created a great operational situation for Germany's Abwehr activities and espionage. However, this could also expose Abwehr to Czechoslovak Counter-Intelligence Service attempts to infiltrate Abwehr with double agents."
 CZE_military_intelligence_service_idea: "Military Intelligence Service"
 CZE_sabotage_anchluss: "Sabotage Austro-German Alliance"
 CZE_sabotage_anchluss_desc: "Restoration of the Habsburg Monarchy is as significant a threat to Czechoslovakia as Austrofascism and a potential alliance Austro-German alliance. We have to stop it at all costs."
 CZE_sabotage_anchluss_tooltip_reward: "\n §OSpecial Bonus:§! Austria will have much higher chance to resist German attempts to take over the country."
 CZE_support_oster: "Support Wehrmacht Officer Coup"
 CZE_support_oster_desc: "Our sources in Abwehr report that there may be some attempts to overthrow Hitler. Perhaps we could use our inside man to support this initiative quietly."
 CZE_support_oster_tooltip_reward: "§OSpecial Bonus:§! In a month some Wehrmacht officers may kill Hitler and start a civil war to remove Nazis from power."
 cze.309.t: "Hitler is dead!"
 cze.309.desc: "[ROOT.GetLeader], it appears that some Wehrmacht officers assassinated Adolf Hitler, and various cliques are now fighting over the power in NSDAP. Part of the German military is now in open revolt and tries to remove the national socialists from power before they can destroy Germany.\n\nThe Chief of Staff is waiting to discuss the situation with you in the next room."
 cze.309.a: "We should intervene immediately!"
 cze.309.b: "We won't meddle in German affairs."
 CZE_soviet_intelligence: "VONAPO 20"
 CZE_soviet_intelligence_desc: "A [SOV.getAdjective] Intelligence station, code-named VONAPO 20, was established in Prague in 1936 as a joint information exchange project between Czechoslovak and [SOV.getAdjective] intelligence services."
 CZE_soviet_intelligence_tooltip_reward: "\n §YInteligence Services§! related §YNational Idea§!."
 cze.310.t: "Interwar Czechoslovak-[SOV.getAdjective] Intelligence Cooperation"
 cze.310.desc: "Czechoslovakia was not among the main objectives of Soviet espionage. The Kremlin was much more interested in Poland and Germany. Yet the Bolshevik agents were rigorously watching the numerous Russian and Ukrainian émigrés who settled in Czechoslovakia, and GRU operatives also conducted extensive industrial espionage.\nWith the increasing threat to the Republic from Germany, the second department began intensive cooperation with the Soviet military intelligence service GRU. Czechoslovakia ceased to be an objective for Soviet spies and became a 'safe bridgehead' for actions in Germany and Western Europe.\n\nAt the same time, the levels of industrial espionage dropped as the Czech arms companies delivered their products to [SOV.GetNameDef]. [SOV.getAdjective] specialists were trained in Czech factories.\n\nA special joint operation, code-named VONAPO 20, was established on May 27, 1936, to exchange intelligence information. However, except for two conferences, the flow of information was only in one direction; from Prague to Moscow. The Russians typically did not provide any information.\n\nStaff Captain Karel Paleček has been responsible for VONAPO 20 project until the occupation of Czechoslovakia. He was one of the ten intelligence officers that accompanied Colonel Moravec during his escape to London in 1939."
 cze.310.a: "Organize VONAPO 20 meeting."
 CZE_vonapo20_idea: "State Military Intelligence"
 CZE_vonapo20_desc_idea: "A joint [SOV.getAdjective] Intelligence station in Prague."
 CZE_uranium_for_soviets: "Provide Uranium for [SOV.getAdjective]s"
 CZE_uranium_for_soviets_desc: "The NKVD has contacted us with an exciting offer regarding our uranium. Their intentions remain a mystery; however, the [SOV.getAdjective]s offer considerable compensation for the quiet acquirement of uranium outside of official channels."
 CZE_uranium_for_soviets_tooltip_reward: "\n Possible exchange of §YCivilian Industry§! for §YResources§!."
 cze.311.t: "Sell Uranium to [SOV.GetNameDef]"
 cze.311.desc: "The [SOV.getAdjective] project to develop an atomic bomb began during World War II due to the discovery of the American, British, and Canadian nuclear project. The project was directed by [SOV.getAdjective] nuclear physicist Igor Kurchatov, while the military logistics and intelligence efforts were undertaken and managed by NKVD people's commissar Lavrentiy Beria.\n\nThe single most significant problem during the early Soviet project was the procurement of uranium ore, as the USSR had no known domestic sources at the beginning of the project. The large deposits of Kazakhstan and other regions of the Soviet Union were not yet discovered, so the project had to rely on foreign sources.\n\nIt is not far-fetched to think that closer cooperation between the Czechoslovak Intelligence Service and the NKVD could be used for secret procurement of uranium ore from Jachymov in exchange for oil or other mineral resources the Czech industry was sorely lacking."
 cze.311.a: "Try to negotiate a deal with their agents"
 cze.312.t: "Czechoslovak Uranium for the [SOV.getAdjective] Nuclear Program"


 CZE_hungarian_alliance: "Hungarian Alliance"
 CZE_hungarian_alliance_desc: "Now that democracy has been restored in Hungary, they must become our allies rather than our enemies."
 cze.312.desc: "Comrade [SOV.GetName], the NKVD reports that it can obtain high-quality uranium ore from Czechoslovakia in exchange for crude oil deliveries and other resources for their industry. Should we negotiate the deal and secure the uranium?"
 cze.312.a: "Da. Secure as much as possible for our research."
 cze.312.b: "Just procure some samples; we have other priorities at the moment."
 cze.313.t: "The [SOV.getAdjective]s Are Interested in our Uranium"
 cze.313.desc: "Mr. Prime Minister, our military intelligence reports that they secured the deal with the NKVD. Resource deliveries will start shortly and be stockpiled at a secured military warehouse in the Ruthenian mountains."
 cze.313.a: "Excellent"
 cze.314.t: "The [SOV.getAdjective]s are not interested in our Uranium."
 cze.314.desc: "Mr. Prime Minister, our military intelligence reports that [SOV.getAdjective]s are not interested in regular Uranium deliveries. However, they would like to buy a small quantity of Uranium for their theoretical nuclear technology research."
 cze.314.a: "Unfortunate, but still better than nothing."
 CZE_french_military_mission: "The French Military Mission"
 CZE_french_military_mission_desc: "At the government's request, a group of officers of the French army was sent to Czechoslovakia in 1919 to help with the building and organization of the newly created army and training of new officers."
 CZE_french_military_mission_tooltip_reward: "\n§GFranco-Czechoslovak Alliance§!, and Free §YTheorist§! OR §YArmy Experience§!."
 CZE_czech_france_alliance: "Franco-Czechoslovak Alliance"
 cze.315.t: "Origins of French Military Mission in Czechoslovakia"
 cze.315.desc: "Shortly after the declaration of its independence, a military mission was called into Czechoslovakia to help build an army and train commissioned military officers. The first test of the army came in 1919 with the brief war with Hungary over Slovakia. When the war was over, Pellé was experiencing a period of great popularity among the Czechoslovak public.\n\nUnder the General's command, the Czechoslovak army proved its combat readiness and regained its honor. Pellé intended to use this in his favor when promoting his concept of a permanent Czechoslovak army as part of the Allied army. He intended to reflect this in the new Czechoslovak National Defense Act, which he essentially achieved in 1920. The first Czechoslovak military academy was inaugurated in 1920 to train high-ranking domestic officers.\n\nAs Chief of Staff, General Pellé led the French mission in Czechoslovakia from 1919 until 1920. As a soldier and diplomat, he fully understood his unique position in Czechoslovakia: an intermediary between Czechoslovakia and France. Several times, Pellé backed Czechoslovakia, risking the disapproval of his French superior. He also had personal reasons for this because he met his future wife in Prague, whom he married in 1921.\n\nGeneral Eugène Mittelhausser replaced Pellé in 1921 and served as the head of the military mission until 1926, when he was replaced by Louis Eugene Faucher that held the position until 1938.\n\nIn Paris, the Treaty of Alliance and Friendship between France and Czechoslovakia was signed on January 25, 1924."
 cze.315.a: "Strengthen the competencies of the mission."
 cze.315.b: "Increase funding for military academies."
 CZE_france_alliance: "Scientific and Cultural Exchange"
 CZE_france_alliance_desc: "During the interwar period, Czech-French relations had a privileged status. Therefore, scientific and cultural relations between France and Czechoslovakia were structured and developed as such - as politically privileged relations. The Francophile lobby was represented in critical positions at the Czechoslovak Ministries of Education and Military."
 CZE_soviet_treaties: "Improve Treaties With [SOV.getAdjective]s"
 CZE_soviet_treaties_desc: "On May 16, 1935, Czechoslovakia and the Soviet Union signed the Treaty of Alliance due to the Soviet alliance with France. With the rising political tensions, it might be prudent to increase our ties with the USSR."
 CZE_soviet_treaties_tooltip_reward_1: "\n§G[SOV.getAdjective]-Czechoslovak Treaty of Alliance§!, and §YDiplomatic Event§!.\n" 
 CZE_soviet_treaties_tooltip_reward_2: "\nNegotiation for §YMilitary Technology§!:\n§OTactical Bomber I§! (90% chance)." 
 CZE_soviet_treaties_positive: "[SOV.getAdjective]-Czechoslovak Treaty of Alliance"
 CZE_soviet_treaties_negative: "[SOV.getAdjective]-Czechoslovak Treaty of Alliance"
 cze.316.t: "Czechoslovak-[SOV.GetAdjective] relations"
 cze.316.desc: "Czechoslovakia and [SOV.GetNameDef] had a complicated diplomatic relationship. The countries' intense animosity stemmed from the armed conflict between Bolshevik authorities and Czechoslovak Legions in Russia after the Great War.\n\nMoreover, the first Prime Minister of Czechoslovakia, Karel Kramar, intensely disliked Bolsheviks for personal reasons because his wife came from Russian nobility. So it will come as no surprise that Czechoslovakia was among the last countries to officially recognize the Soviet Union in 1934.\n\nOn May 16, 1935, the Czechoslovak-Soviet Treaty of Alliance was signed between the two states due to the Soviet alliance with France, Czechoslovakia's leading political and military ally. At the insistence of the Czechoslovak government, a protocol on the treaty's signing stipulated that the treaty would go into force only if France assisted the victim of aggression.\n\nFollowing the Munich Pact of 1938 and the occupation of Czechoslovakia by fascist Germany in March 1939, the Soviet Union refused to recognize the end of Czechoslovakia's independence."
 cze.316.a: "Further improve the relations."
 cze.317.t: "Negotiate Licensed Production Agreement"
 cze.317.desc: "The government of Czechoslovakia proposes a licensed production agreement. We would acquire the rights for the production of Škoda's high-quality C-5 mountain guns and R-5 anti-air guns, while the Czechoslovaks are interested in our SB-2 bombers for their airforce.\n\nShould we negotiate the treaty, comrade [SOV.GetLeader]?"
 cze.317.a: "Go ahead."
 cze.317.b: "No."
 cze.318.t: "[SOV.getLeader] Agreed to a License Production Deal"
 cze.318.desc: "Czechoslovakia and the USSR signed a mutual agreement about military equipment license production. Škoda acquired the rights for the licensed production of SB-2 bombers in exchange for licensing rights and pattern pieces of Škoda's high-quality C-5 mountain guns and R-3 (vz. 37) anti-air guns.\n\nThe SB-2 bombers will be produced under their Czechoslovak B.71 designation, and the production will be split between Letov, Aero, and Avia companies."
 cze.318.a: "Excellent."
 cze.319.t: "The [SOV.getAdjective]s Refused License Production Deal"
 cze.319.desc: "Unfortunately, we have to inform you that the government of [SOV.GetNameDef] was not interested in our licensed production trade proposal."
 cze.319.a: "That's unfortunate."
 CZE_acquire_access_for_soviets: "Negotiate Military Access for [SOV.getAdjective]s"
 CZE_acquire_access_for_soviets_desc: "The central fact that degraded the alliance's effectiveness was the absence of a common border between the USSR and Czechoslovakia. Warsaw staunchly refused any attempts to grant the Soviet Union access, much like the Romanian government. But what would have happened if the Czechoslovakian government had managed to convince its neighbours to allow passage for the Red Army?"
 CZE_acquire_access_for_soviets_tooltip_reward: "\nNegotiation for §YMilitary Access§! for the §YSoviet Union§! through §YPoland§! (30% chance) or §YRomania§! (50% chance)."
 CZE_soviet_military: "Soviet Military Influence"
 CZE_soviet_military_desc: "We have much to learn from our [SOV.getAdjective] comrades!"
 cze.320.t: "Czechoslovakia Requests Protection"
 cze.320.desc: "Due to the escalation of the German-Czechoslovak political situation, the Czechoslovak government tries to strengthen its military ties with [SOV.GetNameDef] against the fascists. If we guarantee our support, they will try to negotiate military access for our troops through neighboring countries.\n\nThis presents us with a unique opportunity to spread the revolution further into the heart of Europe."
 cze.320.a: "We will honour our treaty"
 cze.320.b: "The Czechs are on their own."
 cze.321.t: "The Soviets Will Support Us"
 cze.321.desc: "Representatives of [SOV.GetNameDef] have reassured us of their support. We now need to secure military access through either Poland or Romania."
 cze.321.a: "Try to negotiate military access."
 cze.322.t: "The Soviets Are Not Interested"
 cze.322.desc: "The Soviets have refused us. It appears that a deeper Czech-[SOV.getAdjective] alliance is impossible in the current political situation."
 cze.322.a: "That's most unfortunate."
 cze.323.t: "Military Access for the Soviet Union"
 cze.323.desc: "Due to the escalation of the German-Czechoslovak political situation, the Czechoslovak government tries to strengthen its military ties with the Soviet Union.\n\nTheir government politely asks us to allow Soviet troops to pass through our country should it come to war."
 cze.323.a: "Agreed, Germany must be kept in check."
 cze.323.b: "Are the Czechs mad? No way we will allow Bolsheviks to trespass on our soil."
 cze.324.t: "Military Access for the Soviet Union"
 cze.324.desc: "Due to the escalation of the German-Czechoslovak political situation, the Czechoslovak government tries to strengthen its military ties with the Soviet Union.\n\nTheir government politely asks us to allow Soviet troops to pass through our country should it come to war."
 cze.324.a: "Agreed, Germany must be kept in check."
 cze.324.b: "No Soviet soldier will set foot on Romanian soil."
 cze.325.t: "Military Access for the Soviet Union Secured"
 cze.325.desc: "It seems that Czech diplomats could convince one of their neighbors of our plight. With much reluctance, they have finally agreed to grant the Soviet Union military access to assist the Czechs against the Germans."
 cze.325.a: "We will stand together against the fascists."
 cze.326.t: "Poland Refuses"
 cze.326.desc: "The Polish government officially refused our requests to allow Soviet troops to move through Poland."
 cze.326.a: "Understood."
 cze.327.t: "Alliance with the Soviets"
 cze.327.desc: "The Soviets also reassured us of their willingness to come to our help should it come to war."
 cze.327.a: "Great!"
 cze.328.t: "Understood."
 cze.328.desc: "Romanian government officially refused our requests to allow Soviet troops to move through Poland."
 cze.328.a: "We are on our own."
 cze.328.b: "How dare they even ask such a thing."
 CZE_revive_little_entente: "Revive the Little Entente Alliance"
 CZE_revive_little_entente_desc: "The Little Entente was an alliance formed in 1920 and 1921 by Czechoslovakia, Romania, and Yugoslavia for the common defense against Hungarian revision and the prevention of a Habsburg restoration. France supported the alliance by signing treaties with each member country. The Little Entente began to break down in 1936 and disbanded entirely in 1938."
 CZE_revive_little_entente_tooltip_reward: "\nCreates new faction: §YLittle Entente§!"
 CZE_little_entente_alliance: "Little Entente Alliance"
 CZE_little_entente_alliance_negative: "Little Entente Alliance"
  little_entente: "Little Entente"
 cze.329.t: "History of Little Entente alliance"
 cze.329.desc: "The Little Entente was a mutual defense arrangement among Czechoslovakia, Yugoslavia, and Romania during the interwar period. The alliance was based on several treaties signed between 1920-1921. It was directed against German and Hungarian domination in the Danube River basin and toward protecting the members' territorial integrity and political independence. During the 1920s, the three nations sought economic and political cooperation and negotiated alliances with France.\n\nAfter Adolf Hitler assumed power in 1933, the members of the Little Entente created a Permanent Secretariat and a Permanent Council, composed of their foreign ministers, that met three times a year to direct a joint policy. Nevertheless, during the 1930s, the three states increasingly adopted independent foreign policies, mainly after Germany occupied the Rhineland in 1936 and the French support, upon which the entente relied, lost much of its value.\n\nHistorically, the entente lost its remaining political significance when in April 1937, both Yugoslavia and Romania denied a request by Czechoslovakia, then threatened by Germany, that the entente pledges total military aid to a member that was the victim of aggression. The entente finally collapsed when Germany annexed the Sudeten area of Czechoslovakia in September 1938."
 cze.329.a: "Try to restore the Little Entente."
 cze.330.t: "[ROOT.GetLeader] Attempts to Reform the Little Entente"
 cze.330.a: "We cannot this to happen again!"
 cze.330.desc: "Seeking to form a united front against common enemies, [ROOT.From.GetName] has reached out to the members of the Little Entente with an offer to extend the purpose of the alliance and unite against common enemies.\n\nCzechoslovak leadership has established diplomatic ties with other nations that might feel threatened and are encouraging unity for the sake of keeping the diplomatic balance in Europe and preventing future conflict. Only time will tell if they can succeed."
 cze.330.b: "Vive la L'Entente!"
 cze.330.c: "That may complicate our plans for Europe."
 cze.330.e: "Europe must unite against Fascist aggressors!"
 cze.330.f: "A sign of rising European tensions."
 CZE_invite_romania: "Invite Romania"
 CZE_invite_romania_desc: "We need to strengthen our alliance with Romania."
 CZE_invite_romania_tooltip_reward: "\n§YRomania§! joins §YLittle Entente§! (90% chance)."
 CZE_invite_yugoslavia: "Invite Yugoslavia"
 CZE_invite_yugoslavia_desc: "We need to strengthen our alliance with Yugoslavia."
 CZE_invite_yugoslavia_tooltip_reward: "\n§YYugoslavia§! joins §YLittle Entente§! (90% chance)."
 cze.331.t: "Reformation of the Little Entente"
 cze.331.desc: "To restore the Little Entente, Czechoslovakia requests that we reaffirm our alliance to contain the possible resurgence of aggressive expansionism on the part of the old Central Powers or the Soviet Union."
 cze.331.a: "Gladly. The Little Entente needs to be rebuilt."
 cze.331.b: "[ROOT.GetNameDefCap] walks its own path."
 cze.332.t: "[ROOT.From.GetNameDefCap] Joins the Little Entente"
 cze.332.desc: "Our plan to stop the Little Entente alliance from falling apart and away from us is making progress. [ROOT.From.GetLeader] approves of our efforts and has accepted our proposal to reform the alliance."
 cze.332.a: "We are one step closer to rebuilding the Little Entente."
 cze.333.t: "[ROOT.From.GetNameDefCap] Refuses Czechoslovak proposal"
 cze.333.desc: "Despite our best efforts to reform the Little Entente, our most recent attempt to reach out to one of the nations has been met with skepticism. [ROOT.From.GetLeader] has refused to join the alliance, perhaps doubting our motives or being concerned that aligning too closely with us would make them a target."
 cze.333.a: "They could already be a target for all they know!"
 CZE_hungary_intervention: "Intervention in Hungary"
 CZE_hungary_intervention_desc: "Czechoslovakia had a complicated relationship with Hungary. After the proclamation of independence in 1918, border tensions in Slovakia resulted in armed conflict. Since then, Hungary was always somewhat of a thorn in the back of Czechoslovakia."
 CZE_austria_intervention: "Intervention in Austria"
 CZE_austria_intervention_desc: "Czechoslovakian leadership was well-aware of the rising fascist support in Austria, and fears of an Austro-German alliance of some sort were not mere superstition as later years would show."
 CZE_claims_bohemian_crown: "Claims on Former Bohemian Crown Lands"
 CZE_claims_bohemian_crown_desc: "The Slavic Sorbs from Lusatia always wanted to be part of Czechoslovakia. Let's put international pressure on Germany over some parts of the Bohemian Crown Lands."
 CZE_claims_bohemian_crown_tooltip_reward: "\nIssues ultimatum to Germany (§YClaims and Limited War Wargoal§!) over parts of former Bohemian Crown Lands (§YNiederschlesien§!)."
 cze.350.t: "Claims on Lusatia"
 cze.350.desc: "During the Great War, especially in the last year of the war, several Czech political and cultural representatives reflected upon an idea of a renewal of the Czech state in the historical borders of the former Czech crown lands.\n\nSimultaneously negotiations about the borders of a new state took place. The final decision was made at the Paris Peace Conference in January 1919. The Czech delegation was led by prime minister Karel Kramář and foreign minister Edvard Beneš. They tried hard to persuade the Allies that Czechoslovakia should have its historic crownland borders.\n\nWhile the negotiations over Ruthenia and Upper Hungary were successful, the Czech delegation had to withdraw in many cases, for example, in Kladsko, Lusatia, or a corridor to Yugoslavia.\n\nLusatia had a specific role in that political play for territorial claims. A relatively strong Lusatian national movement existed, demanding autonomy within Germany or incorporation to the new Czechoslovak republic. The question of Lusatia was not of vital importance for Czechoslovak diplomats. Without transparent support of the Czechoslovak state, the unofficial Lusatian delegation at the Peace Conference could not put the Lusatian demands through the Conference´s agenda. Nevertheless, good relations between the Czechs and the Sorbs continued during the First Czechoslovak Republic.\n\nHistorically, the Lusatia region became part of Prussia at the Vienna Congress in 1815. Despite Germanization, the original Slavic language of the people known as Sorbs or Wends was preserved to a certain extent. During the 19th century, a Sorbian Seminary was founded in Prague to support students from Lusatia.\n\nAfter World War II, the people of Lusatia attempted to become part of Czechoslovakia, but the Allies did not support their efforts."
 cze.350.a: "We must protect our Sorbian friends from German oppression."

 CZE_czechoslovak_government_reform: "Reform Czechoslovak Government"
 CZE_czechoslovak_government_reform_desc: "On November 6, 1935, the then Prime Minister, Jan Malypetr, was elected as new chairman of the Chamber of Deputies after the death of the former chairman Bohumír Bradáč. Because the positions of Prime Minister and Chairman of the Chamber of Deputies were mutually exclusive, a new Prime Minister, Milan Hodža, had to be appointed."
 CZE_czechoslovak_government_reform_tooltip_reward: "\n §YPolitical Power§!."
 cze.400.t: "1935 Election Results"
 cze.400.desc: "On 19 May 1935, the fourth parliamentary election for both chambers of the parliament was held in the First Czechoslovak Republic - for the Chamber of Deputies and the Senate of the National Assembly of the Czechoslovak Republic.\n\nAccording to the census results of 1930, the Czechoslovak Republic of that time had 14,479,565 inhabitants in total, with a vibrant national composition of the state:\n\n- Czechs and Slovaks - 66.9% (9,688,770)\n- Germans 22.3% (3,231,688)\n- Hungarians 4.8% (691,923)\n- Ruthenians 3.8% (549,169)\n- Poles, 0.6% (81,737).\n\nThe number of valid votes cast in the election for the Chamber of deputies amounted to 8,231,412, which represents almost 92% voter turnout.\n\nThe results of the parliamentary election of 1935 brought a considerable surprise. The opposition and Sudeten German Party (Sudetendeutsche Partei; SdP, led by Konrad Henlein) became the winner of the parliamentary election at the national level, both in the election for the Chamber of Deputies (15.2%) and in the election for the Senate (15%). Over two-thirds of the vote amongst Sudeten Germans was for SdP.\n\nThe strongest governmental party, the agrarian party (Republican Party of Farmers and Peasants), obtained 14.3% votes and the social democrats acquired 12.6%. Nevertheless, thanks to the electoral arithmetic, the governmental agrarian party finally got the most mandates, 45, while the SdP got one mandate less.\n\nAs a result of the elections, the existing governing coalition (led by Jan Malypetr) lost its majority (had 149 out of 300 representatives) and resigned. In July, a new broad coalition government (without SdP) was eventually formed. However, Milan Hodža replaced Jan Malypetr as the prime minister in November 1935 and, in the following months, made some changes to his cabinet."
 cze.400.a: "Reform the Government"
 CZE_extend_military_service: "Extend Military Service"
 CZE_extend_military_service_desc: "Compulsory military service in Czechoslovakia was initially 14 months, later extended to 18 and even 24 months during the critical pre-war years. Even after his basic training, every man was obliged to participate in military exercises for a total duration of 14 weeks."
 CZE_extend_military_service_tooltip_reward: "\nChange in §YConscription Law§! OR §YManpower§! related §YNational Idea§!."
 cze.401.t: "Military Service in Czechoslovakia"
 cze.401.desc: "When Czechoslovakia was formed in 1918, military service was initially limited to 14 months. Since 1924, this had increased to 18 months, and a two-year draft was enacted in 1933 based on the international situation.\n\nThe compulsory military service was mandatory for all male citizens of Czechoslovakia, including ethnic Germans and other minorities. Thus, conscription and mobilization plans had to be adjusted accordingly to avoid possible desertion in the event of conflict with Germany.\n\nAfter finishing their military service, the conscripts were transferred to the active reserves, divided into I and II reserves.\n\nThe I Reserve was made up of fit and healthy conscripts up to the age of 40. They were to be mobilized in the event of war and used to supplement the army as needed.\n\nThe II Reserve was for those conscripts who were not eligible for the I Reserve. Those who were beyond the age of 40 and those who were not fit enough for active service They were to fulfil support roles or serve in the rear echelons. Conscripts who were drafted in excess of the standard yearly quota or whose full-service would be materially detrimental were classified as replacement reserves but technically included in the II Reserve. \n\nMembers of the I Reserve were obliged to perform several military exercises: two that lasted four weeks and three that lasted three weeks. Members of the replacement reserves had to complete an additional four weeks of training.\n\nThe Ministry of National Defense had the additional authority to call the I. and Replacement Reserves for additional special, up to four-week-long exercises. This was usually used when new equipment was adopted by the army, but it could also be used in exceptional circumstances."
 cze.401.a: "Extend Military Service"
 cze.401.b: "Prepare Minority Conscription and Mobilization Plan"
 cze_minority_mobilization_plan: "Minority Conscription and Mobilization Plan"
 cze_minority_mobilization_plan_desc: "The minority conscription plan is in effect."
 CZE_field_medics: "Finish Masaryk Military Hospital"
 CZE_field_medics_desc: "The peacetime military medical services in Czechoslovakia consisted of a network of 12 divisional hospitals.\n\nIn 1925, on the 75th birthday of President Tomáš Garrigue Masaryk, the parliament decided to build a new military hospital; however, the construction started in 1936."
 CZE_field_medics_tooltip_reward: "\n§YArmy Experience§! and §YField Hospital§! related §YResearch Bonus§!."
 cze.402.t: "Masaryk Military Hospital in Prague"
 cze.402.desc: "The peacetime military medical services in the so-called First Republic consisted of a network of 12 divisional hospitals. Divisional Hospital No. 1 was located at Charles Square in Prague, and it became the top military medical institute in the country at that time.\n\nIn 1925, on the 75th birthday of President Tomáš Garrigue Masaryk, the parliament decided to build a new military hospital.\n\nBut the construction of new premises of the Masaryk Military Hospital began after more than ten years. The most satisfying project designed by Architect B. Adamek from the Dejvice district of Prague in 1930 fulfilled both roles of a modern medical and military center with actual mobilization functions.\n\nThe construction began in March 1936, and the first phase was finished in 1938. The main hospital building, including surgical and internal clinics, boiler houses, and houses for military mercenaries, was built.\n\nThe Masaryk Military Hospital was officially opened on the 1st August 1938, while it served its first patients a month later. Additional expansions were planned; however, the construction was interrupted by World War II, and the hospital was occupied by the German army, which used it as a backup hospital (Reserve Lazaret I, Prag).\n\nNowadays, the facility is known as the Military University Hospital Prague and serves as a training, educational and professional medical facility of the Army of the Czech Republic, which provides comprehensive health care at the level of university hospitals."
 cze.402.a: "Open Masaryk Military Hospital."
 CZE_sokol_movement: "Support Sokol Movement"
 CZE_sokol_movement_desc: "The Sokol movement (from the Slavic word for falcon) is an all-age gymnastics organization initially founded in Prague in 1862 by Miroslav Tyrš and Jindřich Fügner. It was based on the principle of "a strong mind in a sound body," but was also crucial for the revival of Czech national identity."
 CZE_sokol_movement_tooltip_reward: "\n §YStability§! OR §YManpower§! related §YNational Idea§!."
 cze.403.t: "History of the Sokol Movement"
 cze.403.desc: "The Sokol movement (from the Slavic word for falcon) is an all-age gymnastics organization initially founded in Prague in 1862 by Miroslav Tyrš and Jindřich Fügner. It was based upon the principle of "a strong mind in a sound body" but was also crucial for the revival of Czech national identity.\n\nThe patriotism of Sokol was to be seen from the very beginning. Sokols made trips in national costumes (Kroj), were present at national ceremonies and public exercises, and generally encouraged people to show patriotism.\n\nThe biggest event organized by Sokol is the "všesokolský slet" (meeting of all Sokol members) that takes place once every six years. These meetings originated in June 1882, and the first "slet" counted more than 700 sportspeople.\n\nSokol flourished during the interwar period, and during this time, the membership grew to over a million. Influential politicians, including the first two presidents of the Czechoslovak Republic, Masaryk and Beneš, were members of Sokol.\n\nIn this period, nationalism increased, and ethnic discrimination or even anti-semitism was nothing exceptional. Sokol members also actively participated in the "Czechization" of ethnic Germans in the border regions and German language islands and generally shared the responsibility with other Czech and German associations for the resulting national hatred between Czechs and Germans in the interwar period.\n\nSokol was almost liquidated three times and was banned by all totalitarian regimes in Czechoslovak history. Firstly, Sokol was banned in 1915 during World War I. Secondly, it happened during the Nazi occupation of Czech lands. Finally, Sokol was banned by the communists after 1948. In 1968, struggles for Sokol revival were killed by normalization, and so after 42 years of hibernation, Sokol was restored for the fourth time in 1990."
 cze.403.a: "Encourage patriotism."
 cze.403.b: "Support physical exercises."
 cze_sokol_movement_1: "Sokol Movement"
 cze_sokol_movement_1_desc: "'Mens sana in corpore sano'"
 cze_sokol_movement_2: "Sokol Movement"
 cze_sokol_movement_2_desc: "'Mens sana in corpore sano'"
 CZE_establish_the_nouz: "Establish the NOÚZ"
 CZE_establish_the_nouz_desc: "" #check description #Full Name: Národní odborová ústředna zaměstnanecká
 CZE_nouz: "NOÚZ"
 CZE_empower_internationalism: "Galvanize Red Unions"
 CZE_empower_internationalism_desc: "KSČ was the Czechoslovak section of the Communist International, and the so-called Red Unions were established in 1922. As of 1928, the party was the second-largest section of the International, with an estimated membership of around 138,000."
 CZE_empower_internationalism_tooltip_reward: "\nChoice between two §YCommunism§! related §YNational Ideas§!."
 cze.404.t: "Profintern in Czechoslovakia"
 cze.404.desc: "The Red International of Labor Unions (RILU), commonly known as the Profintern, was an international body established by the Communist International to coordinate Communist activities within trade unions.\n\nDuring the 1920s, most of the trade union members of Czechoslovakia affiliated with RILU, following a campaign of expulsions of Communist individuals and unions by the Social Democratic leadership. In October 1922, the Czech Red unions held a congress, formalizing the split with the Social Democratic unions.\n\nThe Communist Party of Czechoslovakia was a massive organization in this period, claiming 170,000 members in 1922, dwarfing all but a few Communist parties around the world.\n\nDuring the Great Depression in the first half of the 1930s, the Red Unions organized a series of strikes and demonstrations while collaborating with members of other trade unions.\n\nOne of the most significant union strikes in central Europe was organized by the Red Unions in Most, Czechoslovakia, in March 1932. What started as a small strike of laid-off miners from the mines "Nelson" and "Humboldt II" quickly escalated to a general strike of the whole mining region along with a demonstration of over 40,000 people. Two people died, and eighteen were wounded due to the clash between the demonstrators and local police and military forces.\n\nIn the second half of the 1930s, the Red Unions called for the unification of the Czechoslovak trade union movement to create a united front against fascism. Following the occupation by Germany, the Red Unions were officially disbanded in 1939."
 cze.404.a: "Increase the influence of the Red unions."
 cze.404.b: "Organize more union strikes!"
 cze_internationalism: "Red Unions"
 cze_internationalism_desc: "With each day, more comrades are joining the Internationalism movement."
 cze_red_union_strikes: "Red Union strikes."
 cze_red_union_strikes_desc: "New worker strikes are being organized by Profintern."
 CZE_state_defense_law: "Amend State Defense Act"
 CZE_state_defense_law_desc: "To face the threat of Hitler's Germany, the National Assembly of the Czechoslovak Republic enacted a new controversial law to protect the Republic and national interests - Act 131/1936 State Defense Act."
 CZE_state_defense_law_tooltip_reward: "\n §YPolitical Power§! OR Nationalization of §YIndustry§! OR §YEconomy Law§! and §YTrade Law§! change."
 cze.405.t: "Act 131/1936 Controversy"
 cze.405.desc: "Act no. 131/1936 (known as State Defense Act) was the 3rd and last amendment to the original act of 1923 that further strengthened the powers of the government for the defense of the republic and the preservation of the democratic system in Czechoslovakia in times of crisis.\n\nThe primary purpose of this act was to face a military threat to the Czechoslovak Republic by Hitler's Germany. However, the anti-German focus of the law further escalated the ethnic conflict. It was one of the reasons why the United Kingdom refused to support Czechoslovakia during the Sudetenland crisis and effectively sided with Hitler (Lord Runciman Mission).\n\nOne of the (many) controversies of the law was the definition of so-called "state unreliable persons". Such a person had several restrictions; for example, they were not allowed to run a business of strategic importance or receive important public contracts but could also be laid off from employment without any justification.\n\nFurthermore, the authorities were not obliged to give any reasons for their decision in this matter, and thus it was permissible to issue such a decision without any justification. Judicial review of "unreliable person status" was not possible. All this made the law highly abusable.\n\nThe act also permitted the government in a national emergency to impose tight controls on all industrial enterprises that it deemed essential to its security.\n\nAlthough one cannot deny the legitimacy of the effort to ensure Czechoslovakia can adequately defend itself from external threats, the law stepped far beyond what is permissible in a democratic constitutional state.\n\nQuite ironically, the State Defense act proved an effective instrument for the Wehrmacht after the 1939 occupation. It allowed for the quick seizure of the armaments industry of the newly established Protectorate.\n\nOne German armament expert supposedly called it "one of the best laws on war economy in Central Europe" and "an exemplar of tight organization concentrated in one hand" to effectively control all branches necessary for arms production.\n\nThe Minister of National Defense, František Machník, was amongst the greatest proponents of the State Defense Act."
 cze.405.a: "Suppress German political opposition."
 cze.405.b: "Implement Emergency Measures."
 cze.405.c: "Nationalize strategic industry."
 cze_state_defense_law_idea: "State Defense Act"
 cze_state_defense_law_idea_desc: "Act no. 131/1936 is in effect."
 CZE_democratic_reforms: "Prepare Sudetenland Autonomy"
 CZE_democratic_reforms_desc: "The time has come to finally solve the minority issue in Czechoslovakia and prepare some degree of autonomy of regions occupied by ethnic Germans before the internal ethnic conflicts engulf the Republic."
 CZE_democratic_reforms_tooltip: "'Constitutional Reforms' are finished."
 CZE_democratic_reforms_tooltip_reward: "\n §YPolitical§! related §YTemporary National Idea§! required to solve the ethnic-German issue constitutionally."
 cze.406.t: "Avert Sudetenland Crisis"
 cze.406.desc: "Since the founding of Czechoslovakia in 1918, extreme oppression and denial of franchise were perceived by the significant German minority. Most argued that the Sudetenland, with its overwhelming ethnic German majority and exceedingly distinct culture and economic potential, should manage its political affairs autonomously.\n\nConsistently, the Czechoslovak government refused any notion of autonomy for the Sudeten Germans due to the crippling effect of giving almost a third of the country autonomy and control over one of the most important industrial centers. The Sudeten-Germans responded by increasing political radicalization.\n\nThe concomitant ascension of the pan-Germanic Adolf Hitler in Germany in 1933, with his rhetoric of uniting all Germans across Europe against the perfidy and 'oppression' of the Slavs, greatly gravitated the Sudeten-Germans towards racialist and far-right nationalism. The vast majority of Sudeten-Germans quickly called for almost complete autonomy or even independence from Czechoslovakia and possible merger into the Third Reich. The leading vanguard of the pan-Germanist movement was the Sudeten German Party (SdP) of Konrad Henlein.\n\nThe peaceful coexistence between Czechs and Germans in Czechoslovakia was always a matter of a relatively small part of the German and Czech population under the leadership of individual politicians. In the tense period of early 1938, waves of extreme nationalism on both sides aggravated the situation.\n\nIt should be noted that the concessions made by the Czechoslovak government in late 1938 would be most likely enough for the Sudeten-Germans would they have been implemented before 1938.\n\nUnfortunately, the reforms and autonomy laws drafts came at a point of no return and could not change anything. Hitler was determined to destroy Czechoslovakia, and Henlein's SdP and the escalated ethnic conflict were crucial to his plans."
 cze.406.a: "Prepare the constitutional reforms."
 cze_constitutional_reforms: "Constitutional Reform."
 cze_constitutional_reforms_desc: "The autonomy of Sudetenland is being prepared, and the new constitutional reforms and laws are being implemented."
 cze_constitutional_reforms_flag: "New constitutional reforms"
 CZE_boycott_press_law: "Boycott Press Law Amendment"
 CZE_boycott_press_law_desc: "Although Czechoslovakia was a democratic state, it gradually moved towards authoritative democracy through several controversial legal norms. One such act was the so-called "Small Press Law"; act no. 126/1933."
 CZE_boycott_press_law_tooltip_reward: "\n Choice between two types of §YPolitics§! related rewards."
 cze.407.t: "Act no. 126/1933 Controversy"
 cze.407.desc: "With the appearance of political extremism, Czechoslovakia promulgated a State Defense Act in 1923 to protect the Republic, which punished acts of subversion.\n\nBased on this law, the Czechoslovak authorities could suspend the publication of periodicals, the distribution of printed materials subverting the constitutional integrity and the republican and democratic system of Czechoslovakia, and it could ban materials of obscene nature.\n\nThe censorship was further increased with Act no. 126/1933, the so-called 'Small Press Law'. It was called small because it was an amendment to the original Press Laws that dated back to the Austro-Hungarian Monarchy.\n\nCombined with later approved Act no. 201/1933 (dissolution and suspension activity of political parties) and Act no. 131/136 (State Defense Act), the government had all the tools to suppress both German nationalists as well as the Communist party.\n\nCzechoslovakia made this conception of authoritative democracy to make good connections with its allies in Europe, consolidate home policy and political system, and build a strong defense against Nazi Germany.\n\nIt is no surprise that all non-Czech political parties heavily criticized the press law amendment, considering that the government frequently censored German, Slovak, and Hungarian press.\n\nHowever, the SdP and the Communist Party formed an unusual parliamentary alliance during the parliamentary debates because the communist press was also often censored. Several times, the government suspended the official party press 'Rudé Právo' (Our Red Rights)."
 cze.407.a: "Political obstructions."
 cze.407.b: "Call for demonstrations."
 cze_press_law_idea: "Press Law Act"
 cze_press_law_idea_desc: "Act no. 126/1933 is in effect."
 cze_communist_obstructions_idea: "Communist Parliamentary Obstructions"
 cze_communist_obstructions_idea_desc: "The Communist party is blocking the approval of the Small Press Law."
 CZE_state_defense_guard: "Establish State Defense Guard"
 CZE_state_defense_guard_desc: "State Defense Guard was a military service established in 1936 to protect the borders of Czechoslovakia. Members of the guard were local policemen, existing finance guards, and members of state police, and later it incorporated loyal citizens."
 CZE_state_defense_guard_tooltip_reward: "\n\n§YAnti-Partisan§! related §YNational Idea§! and §YMilitary Police§! related §YResearch Bonus§!."
 cze.408.t: "The Founding of State Defense Guard"
 cze.408.desc: "From 1918 to 1936 border of Czechoslovakia was protected by the "finance guard", an armed branch of the Ministry of Finance. Their main task was to carry on customs duty; border protection was secondary. For over a decade, army and police leadership had suggested setting up an organization of higher military value. Amid international tensions, Czechoslovakia established the new service in 1937.\n\nState Defense Guard (in Czech Straz obrany statu, SOS) was a military service created in October 1936 to protect the borders of Czechoslovakia. The newly established defense guard had three main tasks: protecting the border, keeping order and the rule of law, and supporting executions of customs duty.\n\nMembers of the guard were local policemen, existing finance guards, and members of state police. Later, citizens loyal to Czechoslovakia were incorporated (for example, many members of sports organization Sokol or active anti-fascist Germans). The government created plans to support the guard with regular army units to handle local conflicts.\n\nThe planned size of the service was 38 battalions, but only 31 had been mustered (one of them in Prague). Their equipment were pistols, rifles, light machine guns, and grenades.\n\nAs the tensions between Czechoslovakia, local Germans, and Nazi Germany grew, the guard was deployed on the border during May 1938 and stayed there until September, when the Allies ceded Sudetenland to Germany. During September, the guard fought low-level warfare with local German partisans (Sudetendeutsches Freikorps) and commandos from Germany. After the loss of borderland, SOS moved inland on new positions. The clashes had still occurred but on a smaller level.\n\nA total of 312 members of the Defense Guards lost their lives during the existence of the service between 1936 and 1939."
 cze.408.a: "Establish State Defense Guard"
 cze_sos: "State Defense Guard"
 cze_sos_desc: "State Defense Guard was established and is guarding the borders of Czechoslovakia."
 CZE_national_unity_government: "Form Party of National Unity"
 CZE_national_unity_government_desc: "The Party of National Unity was created in November 1938, after German occupation, as a kind of last attempt to save Czechoslovakia. It included almost all center-right parties and the Czechoslovak National Socialist Party."
 CZE_national_unity_government_tooltip_reward: "\n §OSpecial Bonus:§! Removes §YMinority Penalties§!, changes §YGovernment§!."
 cze.409.t: "Party of National Unity Formed"
 cze.409.desc: "In hopes of appeasing the Germans after the Munich Agreement, Rudolf Beran gathered most of the country's non-socialist parties into the Party of National Unity, with himself as the leader. He also subjected the press to strict censorship. He did, however, preside over granting the Slovaks and Ruthenians' longstanding demands for autonomy. None of these measures were enough to prevent Slovakia from seceding on 14 March or Germany from occupying the remainder of the country a day later. He then served as the first prime minister of the Protectorate of Bohemia and Moravia until his retirement on 27 April 1939.\n\nAfter the war, Beran was arrested as a collaborator by the Communist authorities and, in a manipulated political trial, was sentenced to twenty years in prison. He died in Leopoldov prison in 1954."
 cze.409.a: "So be it."
 cze_national_unity_government_idea: "National Unity Government"
 cze_national_unity_government_idea_desc: "A new government was formed in a last-ditch effort to save the Republic."
 CZE_sudetenland_autonomy: "Autonomy for German Regions"
 CZE_sudetenland_autonomy_desc: "There have been plans to grant higher autonomy to specific regions within Czechoslovakia, including Sudetenland, since the early 1920s, but the internal politics of Czechoslovakia blocked such initiatives. Who knows, perhaps giving higher autonomy to German regions would have saved thousands of lives, or maybe even millions."
 CZE_levy_liechtenstein_properties: "Levy [LIE.GetAdjective] Properties"
 CZE_levy_liechtenstein_properties_desc: "[LIE.GetNameDefCap] owns several properties within our nation, if we levy more taxes of them we may be able to benefit ourselves."
 CZE_sudetenland_autonomy_tooltip_reward: "\n Choice between two types of §YSudetenland Autonomy§!."
 cze.410.t: "Grant Autonomy to Sudetenland"
 cze.410.desc: "After many months of political negotiations and drafting of new constitutional and minority protection laws, the time has finally come to determine the form and extent of the autonomy granted to regions predominantly occupied by ethnic Germans."
 cze.410.a: "Some degree of autonomy will be sufficient."
 cze.410.b: "Sudetenland will require higher autonomy."
 cze_higher_autonomy_reward_1: "\n§YSudetenland§! and §YEastern Sudetenland§! regions are no longer cores for Czechoslovakia."
 cze_higher_autonomy_reward_2: "\nNationalized industry is restituted back to German owners (§G-2§! §YCivilian Factories§! in §YSudetenland§!)."
 cze_content_minorities: "Content Minorities"
 cze_content_minorities_desc: "With the main issues of Sudetenland problems solved and higher autonomy granted to ethnic Germans, Czechoslovakia seems to be stronger than ever."
 CZE_partial_mobilization: "Declare Partial Mobilization"
 CZE_partial_mobilization_desc: "In the spring days of 1938, the political situation in Czechoslovakia deteriorated so much that the government announced a partial mobilization.\n\nReservists and preselected military specialists were called, and the army soon grew to about 383,000 men."
 CZE_partial_mobilization_tooltip_reward: "\nFree §YEconomy Law§! change."
 cze.411.t: "Partial Mobilization Order"
 cze.411.desc: "Claiming hostile military maneuvers by the Wehrmacht during [ROOT.GetDateText], the Prague government responded to reports of German military concentrations along the Czechoslovak border. It passed a decree which instructed the Minister of National Defense, František Machník, to call up reservists and preselected military specialists.\n\nThe reservists reported for duty promptly and with enthusiasm; after many months of passivity, uncertainty, and humiliation, the course now seemed clear: Czechoslovakia was not Austria; it was not going to be wiped out without an organized, liberty-or-death kind of defense.\n\nHitler was enraged by the audacity of the Prague government, and the May crisis only strengthened his resolve to destroy Czechoslovakia. He sensed that the swift and enthusiastic strategic concentration on the other side of the border had brought about a loss of German and his prestige. He sat down to rewrite the Operation Green directive, the very first sentence of which now read, "It is my unalterable intention to smash Czechoslovakia by military action in the nearest future...""
 cze.411.a: "We won't resign!"
 cze.412.t: "Czechoslovakia Issued Partial Mobilization"
 cze.412.desc: "Claiming hostile military maneuvers by the Wehrmacht during the night of [ROOT.GetDateText], the Prague government responded to reports of German military concentrations along the Czechoslovak border. It passed a decree which instructed the Minister of National Defense, František Machník, to call up reservists and preselected military specialists.\n\nAs was to be expected, German diplomacy reacted to the partial mobilization with fury. The German minister in Prague, Ernst Eisenlohr, denied the existence of any military concentrations in an interview with Czech Minister for Foreign Affairs Kamil Krofta and responded that the accusations were 'grober Unsinn' (bullshit)."
 cze.412.a: "That won't end well."
 cze_partial_mobilization_1938: "Mobilization Efforts"
 cze_partial_mobilization_1938_desc: "The government issued a partial mobilization order."
 CZE_military_coup: "Military Coup"
 CZE_military_coup_desc: "Unhappy with the political situation and the politics of appeasement of western allies, some high officers of the Czechoslovak army could have resorted to a military coup in a last-ditch effort to save the republic."
 CZE_military_coup_tooltip_reward: "\n Choice between two types of §YMilitary Government§!."
 CZE_military_coup_tt: "Has at least §Y40% Military Strength§! compared to §YGerman Reich§!"
 cze.413.t: "Legionary Coup"
 cze.413.desc: "Furious with how the diplomats and politicians dealt with the international crisis and sick of the appeasement policies of so-called Western allies, some more radical elements of the Czechoslovakian army, with the general support of the Czech population, resorted to a peaceful coup to preserve the Republic.\n\nGeneral Syrovy was summoned to Prague Castle to calm the protesters who chanted 'Give us weapons or Syrovy' or 'Long live the Army; we want general Syrovy'.\n\nThe elderly hero of the Battle of Zborov reluctantly agreed to take the Prime Minister's seat and established a temporary caretaker government."
 cze.413.a: "Form a new military government."
 cze.413.b: "More radical brother legionaries should take the power!"
 cze_militarism_focus: "Government of the Republic Defense"
 cze_militarism_focus_desc: "A temporary broad coalition caretaker government was established."
 cze_militarism_focus_2: "Legionary Government"
 cze_militarism_focus_2_desc: "More radical elements of the military now control the government."
 cze_oppressed_minorities: "Martial Law"
 cze_oppressed_minorities_desc: "Martial Law has been declared in Sudetenland and other regions occupied by ethnic minorities."
 cze_republic_defense_party: "The Government of the Republic of Defense"
 cze_legionary_party: "Legionary Government"
 cze_radola_gajda_general_tooltip: "§YRadola Gajda§!: Field Marshal (Offensive Doctrine)\n"
  legionary_government: "Legionaries control the government"
  republic_defense_government: "Government of National Defense formed"
 cze_lev_prchala_general: "Lev Prchala"
 cze_lev_prchala_general_desc: "General Prchala was a staunch opponent of the Munich surrender and commander of the IV. Army that guarded the critical South-Moravian border in 1938.\n\nHe was also suspected of forming a plan for a military coup."
 CZE_zaolzie_for_alliance: "Zaolzie for Polish Alliance"
 CZE_zaolzie_for_alliance_desc: "The Zaolzie region was disputed between Czechoslovakia and Poland since 1920. It's time to solve this issue and join forces against the Fascists and Communists."
 CZE_zaolzie_for_alliance_tooltip_reward_1: "\n§YDiplomatic Event§! for §YPoland§! with proposal to finally solve the Cieszyn Silesia issue.\n"
 CZE_zaolzie_for_alliance_tooltip_reward_2: "\n§YPoland§! joins the §YLittle Entente§! in exchange for §YZaolzie§! region (80% chance)."
 cze.414.t: "History of Polish-Czechoslovak dispute over Zaolzie"
 cze.414.desc: "The Polish-Czechoslovak war was a local military confrontation between the newly established states of Czechoslovakia and Poland over the territory of Cieszyn Silesia in 1919. In some Czech sources, the conflict is described as the 'Seven-day war' because of its quick conclusion.\n\nThe chief importance of Cieszyn Silesia was the rich coal basin around Karviná and the valuable Košice-Bohumín Railway line, which linked the Czech lands with Slovakia. Furthermore, in north-western Cieszyn Silesia, the railroad junction of Bohumín served as a crossroad for international transport and communications.\n\nThe casus belli for the war was the Polish preparation of national parliamentary elections in the area designated Polish in the interim agreement as no sovereign rule was to be executed in the disputed areas.\n\nThe Polish government declined Prague's request that the Poles cease their preparations, and the Czechoslovak side decided to stop the preparations by force. Because most Polish troops were engaged in fighting with the West Ukrainian National Republic over eastern Galicia, Czechoslovak forces quickly gained the upper hand. However, Czechoslovakia was forced to stop the advance by the Entente, and Czechoslovakia and Poland were compelled to sign a new demarcation line. The disputed territory was placed under international control.\n\nThe final division of Cieszyn Silesia came in July 1920 due to the Spa Conference. In conclusion, the railway line connecting the Czech lands with Slovakia and the territory to the south were assigned to Czechoslovakia, while the territory north of the railway line was transferred to Poland. After that, the region under the control of Czechoslovakia was known as Zaolzie, a name that means 'lands beyond the Olza river'.\n\nPoland briefly occupied the region during the Munich Crisis, and it was later annexed by the independent Slovak state but returned under Czechoslovak control after World War II. However, the disputes over the region were finally settled in 1958."
 cze.414.a: "Let's finally settle the Cieszyn Silesia issue."
 cze.415.t: "Czechoslovakia Offers Zaolzie for Military Alliance"
 cze.415.desc: "The Czechoslovak government has informed us that they would like to solve the disputes over the Zaolzie region. They will agree to cede the area for our military support as part of the Little Entente alliance."
 cze.415.a: "Excellent"
 cze.415.b: "No way! We will get it soon enough."
 cze.416.t: "Poland Agrees"
 cze.416.desc: "The Polish government has informed us that they agree to our proposal. We will prepare the region's transition to Polish control and relocation of our citizens and military personnel."
 cze.416.a: "Excellent"
 cze.417.t: "Poland Refuses"
 cze.417.desc: "The Polish government has informed us that they are not interested in our proposal. Nevertheless, they made it pretty clear that they still consider Zaolzie as part of their country and demand the region - unconditionally."
 cze.417.a: "Blasted Poles!"
 CZE_czech_fascism_onrise: "Unite the National Fascist Community"
 CZE_czech_fascism_onrise_desc: "The dominant far-right political movement of Czechoslovakia was the National Fascist Community, modeled on Benito Mussolini's National Fascist Party, which had about 200,000 followers in 1926.\n\nIn contrast, the Slovak far-right was mainly represented by Christian nationalists from Hlinka's Slovak People's Party."
 CZE_czech_fascism_onrise_tooltip_reward: "\nChoice between two types of §YCzech Fascism§! support."
 cze.418.t: "Fascism in Interwar Czechoslovakia"
 cze.418.desc: "The National Fascist Community (Národní obec fašistická) was a Czechoslovakian Fascist movement led by Radola Gajda and based on the Fascism of Benito Mussolini. The party was formed in March 1926 by the merger of a group of dissident National Democrats known as the "Red-Whites" with various other rightist groups across Bohemia and Moravia.\n\nIt was distinguished by a strong current of opposition to Germany, which continued even after Adolf Hitler had come to power. Instead, the NOF looked to Italy as its model and based itself wholly on Mussolini's National Fascist Party. In this respect, it differed markedly from its chief rival 'Vlajka', which was firmly in the Hitler camp.\n\nGroups targeted by the NOF for criticism included the Jews, communists, the Czechoslovak government, and the Magyars. It set up a youth group and a small trade union movement.\n\nThe group also advocated a policy of Pan-Slavism and hoped to take a joint lead with Poland of a grand Slavic alliance that would overthrow communism in the Soviet Union. They also believed in a corporatist economy with a large agricultural sector. The NOF attracted some early support from veterans of the Czechoslovak Legions.\n\nThe party failed to maintain its support and received only 2% of the vote and seven seats in the National Council in the elections of 1935. It was eventually disbanded during the German occupation of Czechoslovakia.\n\nDuring most of NOF's existence, it was led by the former general and hero of the Czechoslovak Legion in Russia, Radola Gajda. In 1933 Gajda was briefly imprisoned and stripped of military rank and pension due to the so-called 'Zidenice Mutiny' scandal, a failed military coup done by certain fascist elements in the military.\n\nGajda was marginalized during the 1939-1945 occupation and abandoned politics. He occasionally assisted the Czech resistance by helping army officers flee into Poland and hiding his son's resistance activities. He was investigated by the Gestapo but avoided imprisonment.\n\nWhen World War II ended, Gajda was imprisoned by the NKVD and interrogated under harsh conditions. In April 1947, he was brought to trial for 'propagation of Fascism and Nazism', for which the prosecutor requested a life sentence. Gajda's guilt was far from clear, and the resulting sentence of two years allowed him to leave prison shortly after that. Penniless and forgotten, he died several months later."
 cze.418.a: "Use anti-communist rhetoric."
 cze.418.b: "Rally anti-german supporters."
  demoted_general: "Ambitious Ex-General"
 cze.419.t: "Czech Fascism on Rise"
 cze.420.t: "Fascist Sympathies between Former Legionaries"
 cze.421.t: "Fascist Coup"
 cze.422.t: "Civil War for Czech Fascism"
 cze.423.t: "Gajda Guards Formed"
 czech_fascist_assault_divisions: "Gajda Guards"
 czech_fascist_assault_divisions_desc: "The Gajda Guards (Czech: Gajdovy Gardy) represented the paramilitary wing of the NOF, often former legionaries."
 cze.424.t: "The Threat of Communism"
 cze.425.t: "The Threat of National Socialism"
 cze.425.desc: "'[ROOT.GetLeader] would have you believe [ROOT.GetNameDef] stands safe and united. It is no surprise that such lies have poisoned the minds of our people when a snake is coiled up next door! Look no further than across our border to see compatriots having turned on each other in the name of national socialism, declaring the end of nations. How long until they declare our nation dead as well? Will the [ROOT.GetRulingParty] protect us from this threat?'\n\nHitler's pan-German rhetoric has bolstered the growth of the Czech fascist movement in [ROOT.GetNameDef]. Many moderates who might normally dismiss fascism as another misguided ideological experiment find this a genuine concern for them. Given a choice between the communism of our neighbors and a fascist regime, they would admittedly prefer the latter. They might even be willing to support it actively."
 cze.425.a: "We will be the vanguard against German national socialism!"
 cze.426.t: "Czech Fascists Demand Referendum"
 czech_fascist_revolutionaries: "Czech Fascist Revolutionaries"
 czech_fascist_revolutionaries_desc: "If support for Neutrality rises above 70%, the nation will be plunged into civil war. If support for Neutrality drops below 30%, revolutionary activity will stop."
 cze.427.t: "Fascists March on Prague"
 cze.428.t: "Gajda Ridiculed"
 CZE_ban_communism: "Consolidate Czechoslovak State"
 CZE_ban_communism_desc: "The fascists in Czechoslovakia dreamt about a strong national state for decades. Finally, the time has come to change dreams into reality."
 CZE_ban_communism_tooltip_reward: "\nChoice between three §YFascism§! related §YNational Ideas§!."
 removes_communism_ideas: "Removes all §YCommunism§! related §YNational Ideas§!"
 cze.429.t: "Fascist Czechoslovak State"
 cze.429.desc: "The National Fascist Community (NOF) was inspired by Italian fascism and adapted to Czech conditions. It demanded a strong national state based on corporate principles and compromised strong anti-German sentiment.\n\nThe Czech fascism presented itself above established social classes. It demanded subordination of personal and class interests to the nation's needs as a whole, which was expressed by the NOF motto 'The welfare of the people shall be the supreme law'.\n\nPanslavism was a general theme among the Czech fascists, but because many members of NOF were former legionaries, anti-communism sentiment was also extreme in the movement.\n\nVarious youth organizations would educate and indoctrinate a new generation of obedient citizens and soldiers.\n\nIn the minds of NOF leaders, the government consisted of eight ministers and experts of only Czech or Slovak origin. Germans, Hungarians, and Jews were not allowed to become government members; however, the government would otherwise guarantee their civil rights.\n\nFurthermore, the NOF advocated restrictions on big businesses, cartels, and monopolies. The state economy and private sector should be built for self-sufficiency and establish a balance between production and consumption.\n\nOverall the Czech fascists dreamt about an entirely unrealistic state, but they never got their chance in history to prove them wrong."
 cze.429.a: "Expel minority representatives from public offices."
 cze.429.b: "Support fascist youth movements."
 cze.429.c: "Eradicate the communists."
 cze_anti_communism: "Persecution of Communists"
 cze_anti_communism_desc: "Various fascist groups in Czechoslovakia were either anti-nazi or pro-nazi, but all were anti-communists."
 cze_military_youth_idea: "Fascist Youth Movements"
 cze_military_youth_idea_desc: "Several fascist youth organizations were established in Czechoslovakia."
 CZE_join_axis: "Deal with the Devil"
 CZE_join_axis_desc: "Putting aside the hostilities with Germany, Czechoslovakia should join the Anti-Comintern pact and raise arms against the Bolsheviks like Czechoslovak Legions in Russia two decades ago."
 CZE_join_axis_tooltip_reward: "\n§YDiplomatic Event§! for §YGerman Reich§! with proposal to solve the Sudeten German issue.\n"
 CZE_join_axis_tooltip_reward_2: "\nChance for §YCzechoslovakia§! to joins §YAxis§!."
 cze.430.t: "Vassal of the German Reich"
 cze.430.desc: "Our so-called 'western allies' have deserted us, and we stand alone against the might of the German Reich. Perhaps it would be wiser to put the state's welfare over internal politicking and negotiate with Hitler. After all, the red menace seems far more dangerous, something many brother legionaries remember from years spent fighting Bolsheviks in Russia."
 cze.430.a: "Invite Herr Ribbentrop to Prague."
 cze_seek_accommodation_with_germany: "Join Anti-Comintern Pact"
 cze.431.t: "Czechoslovakia negotiates."
 cze.431.desc: "Interesting turn of events in Czechoslovakia. Our ambassador in Prague has contacted us, and it seems that with Edvard Beneš gone, the new Czechoslovak leadership appears to be more than willing to compromise with us.\n\nPerhaps such an arrangement would prevent unnecessary bloodshed. What should we do?"
 cze.431.a: "Send Ribbentrop to Prague"
 cze.431.b: "Do nothing; Czechoslovakia will be destroyed."
 cze.432.t: "Diplomatic Negotiations in Prague"
 cze.432.desc: "After days of negotiations, it is clear that the Germans are not interested in just a diplomatic solution to the Sudetenland problem. They have issued several strong demands and threatened war should these negotiations fail."
 cze.432.a: "We have to accept."
 cze.432.b: "That's unacceptable!"
 cze_reich_support: "Industrial Support for German Reich"
 cze_reich_support_desc: "Skoda Works and other armament firms are now producing equipment for Wehrmacht."
 cze_czech_industry_bonus: "Czechoslovak Industry"
 cze_czech_industry_bonus_desc: "Czechoslovak industry produces war material for Wehrmacht."
 cze_svatoplukovy_gardy: "The Svatopluk Guards"
 cze_svatoplukovy_gardy_desc: "The Svatopluk Guards (Czech: Svatoplukovy Gardy) represented the paramilitary wing of Vlajka modelled after the SA."
 cze_czechoslovak_protectorate: "Czechoslovak Protectorate"
 cze_czechoslovak_protectorate_desc: "Most of the Czechoslovak armament industry is working for the German War Machine."
 cze_higher_autonomy_reward_1_b: "\n§YSudetenland§! and §YEastern Sudetenland§! regions are no longer cores for Czechoslovakia.\n\n"
 cze.433.t: "No Response"
 cze.433.desc: "We have got no response from the German side yet. This means only one thing."
 cze.433.a: "Declare General Mobilization"
 CZE_nazi_puppet: "Under the Reich's Protection"
 CZE_nazi_puppet_desc: "It is now clear that we can no longer resist the German Reich. We must negotiate a settlement with the German Reich to preserve Czechoslovakia."
 CZE_nazi_puppet_tooltip_reward: "\n §OSpecial Bonus:§! Pro-Nazi collaboration elements will attempt a coup with support from §YGerman Reich§!. If successful, a §YPuppet Government§! will be installed."
 cze.434.t: "Czechoslovak Protectorate"
 cze.434.desc: "It is now clear that we can no longer resist the German Reich. Our Western allies have betrayed us, and the Bolsheviks threaten us all. Some nationalistic movements, such as 'Vlajka', would like to change the current direction of anti-German politics and negotiate a settlement with the German Reich.\n\nSome would call them traitors and Nazi collaborators, but men like Jan Rys-Rozsévač want to build a new, stronger Czechoslovakia.\n\nHistorically, Vlajka was a radical fascist movement that, under the influence of Jan Rys-Rozsévač, changed from traditional Czech anti-German chauvinism to collaboration with Nazis and Gestapo.\n\nAt first, the occupation authorities supported this group of collaborators and used it for propaganda purposes. However, once their usefulness ended, Vlajka was disbanded at the end of 1942, and the leaders, including Rys-Rozsévač, were sent to the Dachau concentration camp.\n\nAfter the war, Rys-Rozsévač and other members of Vlajka were sentenced to death."
 cze.434.a: "Pledge allegiance to the German Reich."
 cze_vlajka_party: "ČNST - Vlajka"
 cze_vlajka_party_long: "Český národně-sociální tábor - Vlajka"
  removes_anti_fascist_ideas: "\n§ODeclares Martial Law§! (removes anti-fascism, communism or democratic related §YNational Ideas§!.\n\n"
 cze.435.t: "Czechoslovakia Seeks Protection"
 cze.435.desc: "The radical fascist elements in Czechoslovakia, represented by Herr Rozsevac from Vlajka, would like to take power in the country and establish a new government based on national socialistic ideas.\n\nThe country is in international isolation, and the internal political strife presents a unique opportunity to secure the country. However, Vlajka requires our support with the organization of the coup and securing the country in the aftermath.\n\nWhat are your orders?"
 cze.435.a: "Support 'Vlajka'"
 cze.435.b: "We have other plans for Czechoslovakia."
 cze.436.t: "Vlajka Takes Over Czechoslovakia"
 cze.436.desc: "With the german support secured, it will be just days before we secure the country. Let's make sure our militias will arrest all the troublemakers before they can escape. We can't afford to let them play heroes in exile."
 cze.436.a: "Execute the coup."
 cze.437.t: "Germany Is Not Interested"
 cze.437.desc: "The German leadership is not interested in our proposal. We are on our own."
 cze.437.a: "Czechoslovakia is doomed."
 CZE_petition_league_of_nations: "Petition the League of Nations"
 CZE_petition_league_of_nations_desc: "With the ethnic crisis avoided, we should invite an international commission to examine Germans' alleged plight and ethnic oppression in Czechoslovakia."
 CZE_petition_league_of_nations_tooltip_reward: "§OSpecial Bonus:§! The British and French will side with the Czechs during Munich Conference."

 CZE_join_allies: "Seek Cooperation with Allies"
 CZE_join_allies_desc: "We should join an alliance and face the threat of Nazi Germany together and stop Hitler before it's too late."
 CZE_join_allies_tooltip_reward: "\n Chance for §YCzechoslovakia§! to joins the §YAllies§!."
 CZE_join_allies_tt: "Is in faction with §YUnited Kingdom§! or §YFrance§!."
 cze.439.t: "Czechoslovakia Wants to Join the Allies"
 cze.439.desc: "The aggression of the German Reich knows no bound. Lord Runciman reports that the situation in Czechoslovakia is far from what Herr Hitler claims.\n\nCzechoslovakia is the last stable democracy in central Europe and sorely needs our help against German aggression. How should we reply?"
 cze.439.a: "Invite them to the Allies."
 cze.439.b: "The Czechs are on their own."
 cze_seek_accommodation_with_britain: "Czechoslovak-British Diplomatic efforts"
 cze.440.t: "Britain Accepts Our Request"
 cze.440.desc: "We are pleased to report that Britain has accepted us into the Allies."
 cze.440.a: "Perhaps there is hope yet."
 cze.441.t: "Britain Refuses Our Request"
 cze.441.desc: "Unfortunately, it seems that Britain does not want us to be part of the Allies yet."
 cze.441.a: "That's most unfortunate."
 CZE_strengthen_communism: "Strengthen the Communist Party"
 CZE_strengthen_communism_desc: "The communists always wanted to get power in Czechoslovakia. In 1929 Klement Gottwald became the party's Secretary-General after purging his opposition. Although the party did not participate in the government before Munich and was even banned in 1938, communists under Gottwald eventually seized power in 1948."
 CZE_strengthen_communism_tooltip_reward: "\n Free §YCommunist§! Revolutionary."
 cze.442.t: "Communism in Interwar Czechoslovakia"
 cze.442.desc: "The formation of a communist party in Czechoslovakia was accomplished slowly and due to the steady pressure and constant guidance of the Communist International between 1919 and 1921. When the Communist Party of Czechoslovakia (KSC) was finally established in the latter year, this outcome represented a compromise between the extreme, doctrinaire policies of the Comintern and the more moderate Czechoslovak-oriented views of Bohumil Smeral, the party's first leader.\n\nKSC organization was based on the Leninist concept of democratic centralism, which provided for the election of party leaders at all levels but required that each level be fully subject to the control of the next higher unit. Accordingly, party programs and policies were directed from the top, and resolutions of higher organs were unconditionally binding on all lower organs and individual party members. In theory, policy matters were freely and openly discussed at congresses, conferences, membership meetings, and party press. In practice, however, these discussions merely reflected decisions made by a small contingent of top party officials.\n\nIn 1929 Klement Gottwald became the party's Secretary-General after the purging from it of various oppositional elements, some of whom allied themselves to Lev Trotsky and the International Left Opposition.\n\nIn 1935 parliamentary election party held its original 30 mandates with little over 10% votes. However, the events of 1938 resulted in the party being banned, but it continued to exist as an underground organization.\n\nDuring World War II, many KSC leaders sought refuge in the Soviet Union, where they prepared to broaden the party's power base once the war ended. In the early postwar period, the Soviet-supported Czechoslovak communists launched a sustained drive culminating in their seizure of power in 1948."
 cze.442.a: "Strengthen the party."
 CZE_peoples_revolution: "Establish People's Militia"
 CZE_peoples_revolution_desc: "Communists came to power in Czechoslovakia in 1948. But who knows? If the political situation was different in Europe, they might have come to power sooner."
 CZE_peoples_revolution_tooltip_reward: "\n Nationalization of §YIndustry§! OR §YCommunism§! related §YNational Idea§! OR §YManpower§! related §YNational Idea§!"
 cze.443.t: "People's Militia in Czechoslovakia"
 cze.443.desc: "People's Militias, also called 'The armed fist of the working class', was a militia organization of the Communist Party of Czechoslovakia between 1948 and 1989.\n\nThe predecessor of these militias were armed groups of factory workers formed in June 1945 to protect the factories from their rightful owners during the post-war industry nationalization process.\n\nIn the middle of February 1948, the central committee of the Communist Party decided to form armed units from Communist Party members and supporters. The militias were hastily equipped and set on alert during the communist takeover of power at the end of February. They soon changed the name to People's Militias.\n\nThe task of the militias was to protect against guerrillas expected to appear after the takeover, against undercover agents sent to Czechoslovakia, and cooperate with the police and the army. About 3,000 militiamen joined police forces. Non-communists were slowly removed from the militias. The control over the militias went to the Ministry of the Interior.\n\nIn February 1948, the militias obtained 10,000 rifles and 2,000 submachine guns from the armament factory Zbrojovka Brno. They continually modernized the equipment with sniper rifles, machine guns, mortars, anti-aircraft machine guns, and transport vehicles. They kept the ammunition in army stores. During the 1970s, recoilless guns and RPG-7 were added among the armament.\n\nAfter the communist party fell from power at the end of 1989, the militias were dissolved on December 21, 1989."
 cze.443.a: "Nationalize German-owned industry."
 cze.443.b: "Persecute bourgeoisie and democratic intelligence."
 cze.443.c: "Arm the People's Militia"
 CZE_collectivist_ethos_idea: "Democratic Purges"
 CZE_collectivist_ethos_idea_desc: "Nothing can stop the People's Revolution!"
 CZE_peoples_militia_idea: "People's Militia"
 CZE_peoples_militia_idea_desc: "The People's Militia was established in Czechoslovakia."
 CZE_join_commitern: "Join Comintern"
 CZE_join_commitern_desc: "For a long time, Klement Gottwald and other Czechoslovak communists dreamed about a strong socialist republic as one of the leading members of the Comintern."
 CZE_join_commitern_tooltip_reward: "\n Chance for §YCzechoslovakia§! to joins the §YComintern§!."
 CZE_join_comitern_tt: "Is in faction with §YSoviet Union§!."
 cze.444.t: "Czechoslovakia Wants to Join the Comintern"
 cze.444.desc: "The fascists are threatening our Czechoslovak ally. The local communists led by Klement Gottwald have established a strong communist movement in the country and are now formally asking that we accept them to the Comintern.\n\nWhat should we do, comrade [SOV.GetName]?"
 cze.444.a: "Invite them to the Comintern."
 cze.444.b: "The Czechs are on their own."
 cze_seek_accommodation_with_USSR: "Join the Comintern"
 cze.445.t: "The Soviet Union Accepts"
 cze.445.desc: "We are pleased to report that the delegation from the Soviet Union has reassured us about our membership in the Comintern."
 cze.445.a: "Perhaps there is hope yet."
 cze.446.t: "The Soviet Union Refuses"
 cze.446.desc: "Unfortunately, it seems that we are still not worthy of being part of the Comintern."
 cze.446.a: "That's most unfortunate."
 CZE_faction_research_exchange: "Technology Sharing"
 CZE_faction_research_exchange_desc: "By sharing technological advances with our allies, our whole faction will conduct wartime R&D more efficiently."

 CZE_expand_soviet_ties: "Expand [SOV.GetAdjective] Ties"
 CZE_expand_soviet_ties_desc: "The [SOV.GetAdjective]'s have proven themselves to be a reliable ally in the ever-changing global order. Surely they would be pleased by an offer to further our ties, and it would strengthen our nation's for what is to come."
 CZE_help_from_sov: "Soviet Aid"
 CZE_friendship_with_USSR: "Treaty of Friendship"
 cze.448.t: "Czechoslovakia Offers Treaty of Friendship"
 cze.448.desc: "The Czechoslovak government in recent days has sent a delegation, requesting a formal treaty of friendship, which they say will solidify our ties. What are we to say to our friends in Prague?"
 cze.448.a: "Of course, we shall sign this now!"
 cze.448.b: "No thanks."
 cze.449.t: "The [SOV.GetAdjective]'s Have Agreed"
 cze.449.desc: "The [SOV.GetAdjective]'s have agreed to our 'Friendship Treaty' proposal. Our relations shall flourish at this development."
 cze.449.a: "Great."
 cze.450.t: "The [SOV.GetAdjective]'s Have Refused"
 cze.450.desc: "The [SOV.GetAdjective]'s have refused our 'Friendship Treaty' proposal, claiming that our terms are overly one-sided. This is without doubt, a disappointing development."
 cze.450.a: "Unfortunate..."

 CZE_split_poland: "Divide Poland"
 CZE_split_poland_desc: "The Entente were foolish and naive with the establishment of states incaable of their own defense. Poland, who has long been under reactionary, totalitarian governance, shall be torn off the map; and our west slavic comrades in these lands shall be brought under our mantle. With the help of our [SOV.GetAdjective] allies, what is to stop us now!"
###---> Army Tree <><> <><> <><>
 CZE_ministry_of_defense: "Reorganize Ministry of National Defense"
 CZE_ministry_of_defense_desc: "The Ministry of National Defense was an organization responsible for mobilization preparations per the guidelines of the high command, management of supplies, and coordination of the rearmament program."
 CZE_armament_program: "Initiate Armament Program"
 CZE_armament_program_desc: "The unfavourable material situation of the army forced the government to address this issue seriously. After complex negotiations, it finally decided to adopt the armament program in 1936, which defined priorities and determined deadlines to supply various types of equipment."
###---> Politics Tree: Communism/SocDem <><> <><> <><>
 CZE_union_with_warsaw: "Union With Warsaw"
 CZE_union_with_warsaw_desc: "With the workers of Poland under our banner, we can finally materialize the popular, though failed idea of a true union of the west-Slavic nations! Our only defense against the western world is comradery upon our long friends."
 CZE_union_with_warsaw_trigger_tt: "All starting §YPolish§! states that are not cores of any other country: \n Compliance more than §Y50%§! \n Resistance less than §Y5%§!"
 CZE_union_with_warsaw_effect_tt: "We will be known as §Ythe Democratic Republic of Czechoslovakia-Poland§!"

 CZE_finish_the_tvp_project: "Finish the TVP Project"
 CZE_finish_the_tvp_project_desc: "The TVP project is an ambitious tank development program aimed at combining the best aspects of [GER.GetAdjective], [ENG.GetAdjective], [SOV.GetAdjective] and [ROOT.GetAdjective] designs."
 CZE_acquire_soviet_tanks: "Acquire [SOV.GetAdjective] Tanks"
 CZE_acquire_soviet_tanks_desc: "Our close alignment with [SOV.GetNameDef] means we should not be wasting our time trying out brand new tank designs, when our ally is already mass producing their own cutting-edge designs."
 CZE_continue_producing_german_designs: "Continue Producing German Designs"
 CZE_handle_the_communist_power_grab: "The Communist Police Crisis"
 CZE_handle_the_communist_power_grab_desc: "The communists with the help of Soviets have been packing the police force with communist loyalists. Many Anti-Communist elements in our government want to regain control over the police force."
 CZE_five_year_plan: "The Five Year Plan"
 CZE_five_year_plan_desc: "It is an unfortunate reality that much of the nation is poorly, if at all industrialized. Strong central action will be needed from Prague to curb the economic divide before it tears our union apart."
 CZE_currency_reform: "Currency Reform"
 CZE_currency_reform_desc: "To reduce inflation we have to reform our currency and overvalue it."
 CZE_collectivize_key_industries: "Nationalize Key Industries"
 CZE_collectivize_key_industries_desc: "Czechoslovakia's industrial elite have profited for far too long exploiting the industrialization of the Czech and German-speaking regions of the country. An aggressive program of nationalization will bring popular support to our government, and demolish the tainting of capitalist industrialists in our government."
 CZE_suppress_the_church: "Suppress the Church"
 CZE_suppress_the_church_desc: "Catholicism in our nation has been one of the greatest roadblocks to social progress in our nation. If we are to become a modern nation with a uniquely brilliant population, heavy-handed state atheism will be needed to foster a new revolutionary society!"
 CZE_collectivize_farms: "Collectivize Farms"
 CZE_collectivize_farms_desc: "Czechoslovakia's agrarian regions, which are primarily in Slovak lands, have been used as tools of the elite at the expense of our national progress. By moving to economically centralize this sector of our economy, we can bring all of the nation forward!"
 #ideas
 CZE_inflation: "Problematic Inflation"
 CZE_nationalism_idea: "Nationalism" #Henlein-Krejčí
 CZE_nationalism_idea_2: "Ultranationalism" #Henlein-Krejčí
 CZE_nationalism_1: "Czech Nationalism" #Gajda
 CZE_resistance_from_within: "Resistance from Within" 
 CZE_aftermath_of_a_purge: "Aftermath of a Purge" 
 CZE_autarky: "Czech Autarky" 
 CZE_a_stable_republic: "A Stable Republic"
 #flag
 CZE_started_five_year_plan: "Completed §YThe Five Year Plan§!"
 CZE_revolted_against_soviets: "Revolted against [SOV.GetNameDef]"
 #tooltip
 CW_czechoslovak_autonomy_postyalta: "Granted [CZE.GetNonIdeologyName] limited autonomy"

