 CZE_legacy_of_the_legions_desc: "Men have fought wars in Europe for thousands of years, but rarely has a people fought in so many different armies and regions, in the Imperial Russian Army, in France, in Italy. It is for the old to pass on their knowledge to the young so they do not make the same mistakes."
