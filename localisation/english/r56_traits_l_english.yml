 scientist_trait_r56_reckless_prototyper:0 "Reckless Prototyper"
 scientist_trait_r56_reckless_prototyper_desc:0 "Quick to learn from their mistakes and failures to deliver the newest iteration. Everyone else at the facility just wishes they didn't leave a gaint burning pile of scrap metal in the wake of their work."
 scientist_trait_r56_stubborn:0 "Stubborn Project Manager"
 scientist_trait_r56_stubborn_desc:0 "They are stuck in their way, for better and for worse. However, they often deliver projects early and on budget." 
 scientist_trait_r56_research_focused:0 "Research Focused"
 scientist_trait_r56_research_focused_desc:0 "Get's a little too caught up in the research part of the job in a way that lets the project fall behind."
 scientist_trait_r56_political_dancer:0 "Political Navigator"
 scientist_trait_r56_political_dancer_desc:0 "This person knows all the right things to say to those in power so they can continue their work in peace."
 scientist_trait_r56_old_guard:0 "Old Guard"
 scientist_trait_r56_old_guard_desc:0 "They keep things moving, but teaching this old dog new tricks takes a little longer."

 #These are more of a catch all comapred to their general counterparts fyi
