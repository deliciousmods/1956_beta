# ideas
r56_CYP_aftermath_october_events: "Aftermath of the October Events"
r56_CYP_aftermath_october_events_desc: "In October 1931, the Island of Cyprus was rocked by a major revolt, spearheaded by a mixed group of Greek Cypriots demanding §HEnosis§!. Then-governour Ronald Storrs supressed these activities which lead to a brief period of conflict between the protesters and the local police force. This resulted in the deaths of several civilians, various injuries and criminal punishments for the protesters. Additionally, ten were sent into exile.\n\nThe British administration pinned the instigation of the revolt on Alexis Kyrou, general council to Limassol sent by the Greek government. He had indead created underground opposition to British rule, yet the Greek government denied all involvement with his activities. He was therefore assigned a different position as secretary of the Greek delegation to Germany, utilising his expertise in foreign politics.\n\nThe aftermath of this revolt is still felt on the island, as the newly appointed governour of Cyprus, Richmond Palmer, lead a period of autocratic rule, also known as 'Palmerokratia' or 'Palmerocracy'. Altough he helped to relieve the risk of famine after two years of drought and enlarged the port of Famagusta, his rule was strict and effectively ended all direct calls for §HEnosis§!."
r56_CYP_orthodox_church_idea: "Influental Orthodox Church"
r56_CYP_orthodox_church_idea_desc: "The Orthodox Christian faith has been a part of Cypriot history since the 1st century AD, as Cyprus became one of the first countries ruled by a Christian leader. The religion spread further towards the end of the 4th century AD and throughout the coming millenia it cemented itself as a key part of the island.\n\nNowadays, it plays an important role in its identity and most residents look up to it for guidance. As the island got occupied by Great Britain, the local clergy has started to also play an active role in Cypriot politics. In 1931, Archbishop Kiton Nikodemos called for civil disobedience until §HEnosis§! was achieved which kicked off the October Events a few days later. Currently, the throne of the Archbishop of Cyprus is vacant since almost all bishos of the island were expelled due as instigators of the revolt. As only remaining bishop, Panagiotis Vassiliou occupies the office of Archbishop as regent until a new one is elected."
r56_CYP_ideological_turmoil: "Ideological Turmoil"
r56_CYP_ideological_turmoil_desc: "Whilst almost united in seeking §HEnosis§!, the Cypriot population is anything but banded together. Much political thought is present, very few agree with each other. This has lead to an ideological struggle for the island.\n\n Whilst the outlawed KKK has had years of underground experience and their ideas are spread throughout the island, they are far from the majority. As the Orthodox Church holds vast sway over the population, their support for democratic rule has also become the most widespread. However the long and arduous British occupation has radicalised many people. This has strengthened nationalist groups that are willing to put §HEnosis§! over everything."
r56_CYP_ethno_religious_conflict: "Ethno-Religious Conflict"
r56_CYP_ethno_religious_conflict_desc: "Cyprus has long been the home of many people, most of them Greeks but the long rule of the Ottoman Empire and the proximity to the Anatolian Peninsula has also given the island a sizable Turkish minority, who is dominated by Islam. As they are outnumbered almost ten to one, the Turkish population mostly keeps to their own communities.\n\nThe almost antagonistic relation between Greece and Turkey and the events of the last decade have made a harmonious life almost impossible. The strong call for §HEnosis§! by the Greek population is seen as a disaster by the Turkish minority, whilst nationalists see the island as Greek homeland and other peoples as intruders. This clash has resulted in regular conflicts between Turks and Greeks that rarely end peacefully."

# industrial concerns
r56_CYP_mining_corporation: "Cyprus Mining Corporation"
r56_CYP_mining_corporation_desc: "Founded by the American Charles G. Gunther in 1914, this mining company is mining large quanities of copper and selling it worldwide."
r56_CYP_aetk: "Archís Esoterikón Tilepikoinonión Kýprou"
r56_CYP_aetk_desc: "The AETK or Cyprus Inland Telecommunications Authority is the country's first telecommunications company. As a semi-governmental company it is responsible for Cyprus' connection to the rest of the world."

