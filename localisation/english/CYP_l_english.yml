l_english:
cyprus_tree: "Cyprus Focus Tree"
CYP_generic_communist_revolutionary: "Ezekias Papaioannou"

# focuses
CYP_begin_urbanisation_efforts: "Begin Urbanisation Efforts"
CYP_begin_urbanisation_efforts_desc: "We are watching as every country around us overtakes us in industrial output, we must follow their lead to not be left behind."
CYP_continue_farming_reliance: "Continue Reliance on Farming"
CYP_continue_farming_reliance_desc: "By not changing our ways, we can utilise our domestic expertise and create a flourishing economy."
CYP_railways: "Import Railways"
CYP_railways_desc: "Whilst we lack the means to construct a railway system ourselves, we can import the needed materials and construct the first rail line of this island."
CYP_urban_investments: "Urban Investments"
CYP_urban_investments_desc: "Accelerating urbanisation is crucual to the continued aim of our economic policy. As such, investments are a logical step."
CYP_coastal_investments: "Develop Our Coast"
CYP_coastal_investments_desc: "As an island, [183.GetName] needs a developed coast to be connected to the rest of the world, as well as providing transportation around the island itself."
CYP_subsidise_fruit_farming: "Subsidise Fruit Farming"
CYP_subsidise_fruit_farming_desc: "Our mediterranean climate is perfect for growing various kinds of fruits. They can become an important export good if we subsidise their production."
CYP_mining_effort: "Mining Effort"
CYP_mining_effort_desc: "Despite our focus on agriculture, we must still stay competitive in raw goods production."
CYP_construct_power_plants: "Build Power Plants"
CYP_construct_power_plants_desc: "To Support the growing urban sectors and factories, an expansion to our power grid is in order."
CYP_link_the_cities: "Connect the Cities"
CYP_link_the_cities_desc: "An economy is only the sum of its part if there is proper interconnectivity. This should be facilitated by a sturdy road network."
CYP_national_industries: "National Industries"
CYP_national_industries_desc: "To control the economy and stop mismanagement, we can establish national industries."
CYP_natural_build_up: "Prioritise Natural Growth"
CYP_natural_build_up_desc: "If we influence the economy too much, we are risking an economic collapse. We must ensure a more natural and gradual growth to prevent such a disaster."
CYP_water_infrastructure: "Build Water Infrastructure"
CYP_water_infrastructure_desc: "The island's climate makes a solid water network almost mandatory in order for crops to not dry up."
CYP_rural_infrastructure: "Provide Rural Infrastructure"
CYP_rural_infrastructure_desc: "Rural communities are often very hard to reach. To stop this, we must construct roads to even the most remote villages."
CYP_resource_prospecting: "Resource Prospecting"
CYP_resource_prospecting_desc: "We have not prospected every available resource on [183.GetName]. That shall now be rectified."
CYP_construct_argaka_dam: "Contruct the Argaka Dam"
CYP_construct_argaka_dam_desc: "We have surveyed a suitable site for a major dam. Construction will take a while, but it will be worth it."
CYP_develop_heavy_industry: "Develop Heavy Industry"
CYP_develop_heavy_industry_desc: "We cannot build an economy purely on services and refinement, developing a heavy industry will create jobs and a new sector."
CYP_trade_port: "Establish a Trade Port"
CYP_trade_port_desc: "With our position in the Mediterranean Sea, we have great potential for trade. We should construct a trade port to tap into this potential."
CYP_utilise_stengths: "Utilise our Strengths"
CYP_utilise_stengths_desc: "By continueing what we have done for millenia, our nation can reach ture prosperity."
CYP_education_effort: "Education Effort"
CYP_education_effort_desc: "Educating our people should always be a priority. Under the occupations of the past, this has been neglected so we should begin an education campaign."
CYP_research_sector: "Establish a Research Sector"
CYP_research_sector_desc: "We have the funds to create a dedicated research sector that may transform our nation into an advanced economy and country."
CYP_trade_economy: "Trade Economy"
CYP_trade_economy_desc: "Trade has done wonders for our economy, we should boost its effect further by leaning more heavily into trade."
CYP_educated_nation: "An Educated Nation"
CYP_educated_nation_desc: "Our efforts have done wonders and what little illiteracy was present is now almost fully gone. We have successfully transformed into a modern and educated nation."

# ideas
r56_CYP_aftermath_october_events: "Aftermath of the October Events"
r56_CYP_aftermath_october_events_desc: "In October 1931, the Island of Cyprus was rocked by a major revolt, spearheaded by a mixed group of Greek Cypriots demanding §HEnosis§!. Then-governor Ronald Storrs supressed these activities which lead to a brief period of conflict between the protesters and the local police force. This resulted in the deaths of several civilians, various injuries and criminal punishments for the protesters. Additionally, ten were sent into exile.\n\nThe British administration pinned the instigation of the revolt on Aléxis Kýrou, general council to Limassol sent by the Greek government. He had indead created underground opposition to British rule, yet the Greek government denied all involvement with his activities. He was therefore assigned a different position as secretary of the Greek delegation to Germany, utilising his expertise in foreign politics.\n\nThe aftermath of this revolt is still felt on the island, as the newly appointed governor of Cyprus, Richmond Palmer, lead a period of autocratic rule, also known as 'Palmerokratía' or 'Palmerocracy'. Altough he helped to relieve the risk of famine after two years of drought and enlarged the port of Famagusta, his rule was strict and effectively ended all direct calls for §HEnosis§!."
r56_CYP_orthodox_church_idea: "Influental Orthodox Church"
r56_CYP_orthodox_church_idea_desc: "The Orthodox Christian faith has been a part of Cypriot history since the 1st century AD, as Cyprus became one of the first countries ruled by a Christian leader. The religion spread further towards the end of the 4th century AD and throughout the coming millenia it cemented itself as a key part of the island.\n\nNowadays, it plays an important role in its identity and most residents look up to it for guidance. As the island got occupied by Great Britain, the local clergy has started to also play an active role in Cypriot politics. In 1931, the Bishop of Kition called for civil disobedience until §HEnosis§! was achieved which kicked off the October Events a few days later. Currently, the throne of the Archbishop of Cyprus is vacant since almost all bishos of the island were expelled due as instigators of the revolt. As only remaining bishop, [ROOT.CYP_leontios.GetName] occupies the office of Archbishop as regent until a new one is elected."
r56_CYP_ideological_turmoil: "Ideological Turmoil"
r56_CYP_ideological_turmoil_desc: "Whilst almost united in seeking §HEnosis§!, the Cypriot population is anything but banded together. Much political thought is present, very few agree with each other. This has lead to an ideological struggle for the island.\n\n Whilst the outlawed KKK has had years of underground experience and their ideas are spread throughout the island, they are far from the majority. As the Orthodox Church holds vast sway over the population, their support for democratic rule has also become the most widespread. However the long and arduous British occupation has radicalised many people. This has strengthened nationalist groups that are willing to put §HEnosis§! over everything."
r56_CYP_ethno_religious_conflict: "Ethno-Religious Conflict"
r56_CYP_ethno_religious_conflict_desc: "Cyprus has long been the home of many people, most of them Greeks but the long rule of the Ottoman Empire and the proximity to the Anatolian Peninsula has also given the island a sizable Turkish minority, who is dominated by Islam. As they are outnumbered almost ten to one, the Turkish population mostly keeps to their own communities.\n\nThe almost antagonistic relation between Greece and Turkey and the events of the last decade have made a harmonious life almost impossible. The strong call for §HEnosis§! by the Greek population is seen as a disaster by the Turkish minority, whilst nationalists see the island as Greek homeland and other peoples as intruders. This clash has resulted in regular conflicts between Turks and Greeks that rarely end peacefully."
r56_CYP_urbanisation_campaign: "Urbanisation Campaign"
r56_CYP_urbanisation_campaign_desc: "As an island dominated by its agricultural sector, it is time to shift the industry towards a more developed state."
r56_CYP_hydroelectricity: "Hydroelectricity"
r56_CYP_hydroelectricity_desc: "[ROOT.GetNonIdeologyName] has a large potential for Hydroelectricity due to the island's geography."
r56_CYP_naval_industry: "[ROOT.GetAdjectiveCap] Naval Industry"
r56_CYP_naval_industry_desc: "As the only way to export large amounts of goods, the naval industry of [ROOT.GetNonIdeologyName] is vital for the country at large."
r56_CYP_national_industries: "National Industries"
r56_CYP_national_industries: "Several important companies in [ROOT.GetName] have been nationalized or founded by the state."
r56_CYP_growing_economy: "Growing Economy"
r56_CYP_growing_economy_desc: "As [ROOt.GetName] continues to build up its industry, the economy has experienced a prolonged period of economic growth."
r56_CYP_trade_hub: "Mediterranean Trade Hub"
r56_CYP_trade_hub_desc: "Cyprus is strategically located at a major trade route to Asia. This traffic can be profited from."
r56_CYP_farming_focus: "Farming Focus"
r56_CYP_farming_focus_desc: "With most the population employed in the primary economic sector, the farming industry takes priority in [ROOT.GetName]."
r56_CYP_mine_expansion: "Mine Expansion"
r56_CYP_mine_expansion_desc: "Cyprus is rich in resources, it is only a matter of extracting them."
r56_CYP_accessible_countryside: "Accessible Countryside"
r56_CYP_accessible_countryside_desc: "Due to extensive efforts to connect remote communities to the rest of the island, getting around on [183.GetName] has never been easier."
r56_CYP_agrarian_economy: "Agrarian Economy"
r56_CYP_agrarian_economy_desc: "The focus on farming and the economic base of [ROOT.GetNonIdeologyName] has led to a flourishing agrarian sector that paves the way for an economic boom."
r56_CYP_education_initiative: "Education Initiative"
r56_CYP_education_initiative_desc: "The population requires proper education to work at maximum capacity and high education are also a sign of a high level of development. These things will be improved with an education initiative."

# industrial concerns
r56_CYP_mining_corporation: "Cyprus Mining Corporation"
r56_CYP_mining_corporation_desc: "Founded by the American Charles G. Gunther in 1914, this mining company is mining large quanities of copper and selling it worldwide."
r56_CYP_aetk: "Archís Esoterikón Tilepikoinonión Kýprou"
r56_CYP_aetk_desc: "The AETK or Cyprus Inland Telecommunications Authority is the country's first telecommunications company. As a semi-governmental company it is responsible for Cyprus' connection to the rest of the world."
r56_CYP_jp_ltd: "Ioannou & Paraskevaides Ltd."

