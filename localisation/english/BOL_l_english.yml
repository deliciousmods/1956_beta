 form_peru_bolivia_category_category:0 "Revive the Peru-Bolivian Confederation"
 form_peru_bolivia_category_category_desc:0 "Separated for much of their history, there was a short period when Peru and Bolivia were united in a single confederation that could compete with its various neighbors. Now that our two nations are back under the same flag, we could proclaim the restoration of the Peru-Bolivian Confederation."
 BOL_invite_vicente_rojo:0 "Invite Vicente Rojo"

 BOL_yacimientos_petroliferos_fiscales_bolivianos:0 "Yacimientos Petrolíferos Fiscales Bolivianos"

 spanish_emigres_decisions:0 "The Fate of the Spanish Republicans"

 BOL_military_socialist:0 "Military Socialist"

 # Existing Bolivia spirits
 BOL_defeated_people:0 "Defeated People"
 BOL_defeated_people_desc:0 "The Chaco War left Bolivia humiliated, exhausted and uncertain of its future."
 BOL_defeated_people_2:0 "Defeated People"
 BOL_defeated_people_2_desc:0 "The shock of defeat is fading, but the army and public still carry the scars of the Chaco."
 BOL_defeated_people_3:0 "Defeated People"
 BOL_defeated_people_3_desc:0 "Bolivia is beginning to recover its confidence, though the wounds of the war remain."
 BOL_unarmed_army:0 "Unarmed Army"
 BOL_unarmed_army_desc:0 "The army has been politically broken and materially neglected."
 BOL_a_new_national_pride:0 "A New National Pride"
 BOL_a_new_national_pride_desc:0 "Bolivians are rediscovering confidence after years of defeat and crisis."
 BOL_week_republic:0 "Weak Republic"
 BOL_week_republic_desc:0 "The state is fragile, divided and unable to command full loyalty."
 BOL_week_republic_2:0 "Weak Republic"
 BOL_week_republic_2_desc:0 "The republic is still weak, but the worst paralysis has begun to ease."
 BOL_gamonal_society:0 "Gamonal Society"
 BOL_gamonal_society_desc:0 "Rural bosses, landowners and mine interests still shape much of Bolivian life."
 BOL_gamonal_society_2:0 "Entrenched Gamonal Society"
 BOL_gamonal_society_2_desc:0 "The old social order has dug itself into the state, resisting any serious reform."
 BOL_eliminated_gamonales:0 "Gamonales Broken"
 BOL_eliminated_gamonales_desc:0 "The old rural bosses have been broken, opening space for a new social order."
 BOL_aymara_support:0 "Aymara Support"
 BOL_aymara_support_desc:0 "Aymara communities are mobilizing behind the state and demanding a voice in it."
 BOL_toll_of_the_chaco_war:0 "Toll of the Chaco War"
 BOL_toll_of_the_chaco_war_desc:0 "The cost of the Chaco War still weighs on recruitment, morale and national confidence."
 BOL_toll_of_the_chaco_war_2:0 "Crushing Toll of the Chaco War"
 BOL_toll_of_the_chaco_war_2_desc:0 "The Chaco defeat has left the country demoralized and slow to mobilize."
 BOL_plurinational_democracy:0 "Plurinational Democracy"
 BOL_plurinational_democracy_desc:0 "Bolivia is trying to build a state that includes the peoples once kept outside the republic."
 BOL_era_of_national_regression:0 "Era of National Regression"
 BOL_era_of_national_regression_desc:0 "A maximalist national project is straining the state and alarming its neighbors."
 BOL_empresa_nacional_ferrocarriles_del_estado:0 "Empresa Nacional de Ferrocarriles del Estado"

 south_american_events.63.t:0 "Death of Germán Busch Becerra"
 south_american_events.63.d:0 "After fierce and undying media pressure on Becerra's government, it has been reported that Germán Busch Becerra has taken his own life just this afternoon. Many of his family members as well as his coworkers have cited that there appeared to be nothing unusual or strange about Becerra's behaviour. Nonetheless, this has put the country in complete shock, with many of the political rivals of Becerra already vying for power. The future of Bolivia is uncertain."
 south_american_events.63.a:0 "Elections must take place immediately!"
 south_american_events.63.b:0 "Set up a provisional government."

 # Bolivia national spirits
 BOL_military_socialism:0 "Military Socialism"
 BOL_military_socialism_desc:0 "The army has stepped into politics as a reforming force, promising national renewal after the humiliation of the Chaco War."
 BOL_ypfb_state_oil:0 "State Oil Enterprise"
 BOL_ypfb_state_oil_desc:0 "Bolivia's oilfields are being pulled into the hands of the state, giving La Paz leverage over foreign companies and new tools for development."
 BOL_busch_labor_code:0 "Busch's Labor Code"
 BOL_busch_labor_code_desc:0 "Labor law, social reform and nationalist discipline are binding workers to the state."
 BOL_worker_militias:0 "Worker Militias of the Altiplano"
 BOL_worker_militias_desc:0 "Armed workers and veterans organize around the mines and highland towns, ready to defend the revolution."
 BOL_state_mining_control:0 "State Mining Control"
 BOL_state_mining_control_desc:0 "The tin economy is being bent toward national priorities, even as the old mine owners resist every decree."
 BOL_revolutionary_export:0 "Export the Revolution"
 BOL_revolutionary_export_desc:0 "Bolivia's revolution will not remain trapped behind the Andes."
 BOL_bohan_plan:0 "Bohan Development Plan"
 BOL_bohan_plan_desc:0 "Roads, agriculture and eastern settlement are reshaping Bolivia's economic map."
 BOL_lost_sea_campaign:0 "Sea for Bolivia"
 BOL_lost_sea_campaign_desc:0 "The memory of the lost coast has become a national project, whether through diplomacy, pressure or war."
 BOL_technocratic_junta:0 "Technocratic Junta"
 BOL_technocratic_junta_desc:0 "Officers and civilian experts are trying to stabilize the state before ideology tears it apart."
 BOL_state_of_siege:0 "State of Siege"
 BOL_state_of_siege_desc:0 "The regime governs through emergency powers, censorship and military pressure."
 BOL_tin_for_the_allies_idea:0 "Tin for the Allies"
 BOL_tin_for_the_allies_idea_desc:0 "Bolivian tin has become a strategic export, tying the republic to the Allied war economy."
 BOL_radepa_cells:0 "RADEPA Cells"
 BOL_radepa_cells_desc:0 "Young nationalist officers conspire through secret networks inside the army."
 BOL_villarroel_nationalism:0 "Villarroel's Nationalism"
 BOL_villarroel_nationalism_desc:0 "The government seeks a new pact with workers, soldiers and indigenous communities."
 BOL_indigenous_congress_idea:0 "Indigenous Congress"
 BOL_indigenous_congress_idea_desc:0 "Indigenous leaders have forced their demands into national politics."
 BOL_rosca_restoration:0 "Rosca Restoration"
 BOL_rosca_restoration_desc:0 "The mine oligarchy has clawed its way back into power, stabilizing production while poisoning legitimacy."
 BOL_mnr_revolution:0 "MNR Revolution"
 BOL_mnr_revolution_desc:0 "The National Revolution has broken the old order and opened a dangerous, thrilling new chapter."
 BOL_universal_suffrage_idea:0 "Universal Suffrage"
 BOL_universal_suffrage_idea_desc:0 "The vote is no longer the guarded privilege of a narrow republic."
 BOL_comibol_idea:0 "COMIBOL"
 BOL_comibol_idea_desc:0 "The national mining corporation now stands at the center of Bolivia's revolutionary economy."
 BOL_agrarian_reform_idea:0 "Agrarian Reform"
 BOL_agrarian_reform_idea_desc:0 "The hacienda order is being broken apart and land is being redistributed to rural communities."
 BOL_cob_power:0 "Power of the COB"
 BOL_cob_power_desc:0 "Organized labor has become one of the pillars of the new Bolivian state."
 BOL_revolutionary_militias:0 "Revolutionary Militias"
 BOL_revolutionary_militias_desc:0 "Militias answer the call of the revolution, though their autonomy makes every cabinet meeting nervous."
 BOL_fsb_corporatism:0 "FSB Corporatism"
 BOL_fsb_corporatism_desc:0 "The Falange offers order, hierarchy and mobilization under a nationalist corporate state."
 BOL_falangist_state:0 "Falangist State"
 BOL_falangist_state_desc:0 "The movement has fused Catholic corporatism, military discipline and Andean myth into a hard new regime."
 BOL_ayllu_order:0 "Ayllu Political Order"
 BOL_ayllu_order_desc:0 "Communal structures are being elevated into the organizing principle of the state."
 BOL_red_ayllu:0 "Red Ayllu"
 BOL_red_ayllu_desc:0 "Aymara communal tradition and revolutionary socialism have found a volatile common language."
 BOL_tawantinsuyu_project:0 "Tawantinsuyu Project"
 BOL_tawantinsuyu_project_desc:0 "The Andean revolution imagines itself as the rebirth of an older continental order."
 BOL_altiplano_army:0 "Army of the Altiplano"
 BOL_altiplano_army_desc:0 "The army is being rebuilt around the hard lessons of mountain, desert and jungle warfare."
 BOL_landlocked_navy:0 "Landlocked Navy"
 BOL_landlocked_navy_desc:0 "Bolivia may lack a coast, but it refuses to surrender the idea of naval power."
 BOL_fuerza_aerea:0 "Fuerza Aerea Boliviana"
 BOL_fuerza_aerea_desc:0 "A modern air arm is being built for a country of mountains, distances and difficult borders."
 BOL_economic_miracle:0 "Bolivian Economic Miracle"
 BOL_economic_miracle_desc:0 "Mines, roads, oil and settlement projects are finally moving in the same direction."
 BOL_chaco_reformed_army:0 "Reformed Chaco Army"
 BOL_chaco_reformed_army_desc:0 "The army has absorbed the bitter lessons of the Chaco War and reorganized itself for Bolivia's mountains, deserts and lowlands."
 BOL_titicaca_flotilla:0 "Titicaca Flotilla"
 BOL_titicaca_flotilla_desc:0 "Bolivia's naval ambitions survive on Lake Titicaca, the Amazonian rivers and the stubborn memory of the lost coast."
 BOL_condor_air_force:0 "Condor Air Force"
 BOL_condor_air_force_desc:0 "The Fuerza Aerea Boliviana is learning to fight across altitude, distance and dangerous weather."
 BOL_mining_state_complex:0 "State Mining Complex"
 BOL_mining_state_complex_desc:0 "The state, the mines and the new industrial program have been bound together into a single development machine."
 BOL_mining_credit_system:0 "Mining Credit System"
 BOL_mining_credit_system_desc:0 "A national credit network gives the mines the machinery, transport and liquidity they need, while binding their output closer to the state."
 BOL_miner_worker_control:0 "Miner Worker Control"
 BOL_miner_worker_control_desc:0 "Armed miners and union committees now hold real power in the pits, raising output and revolutionary energy at the cost of political calm."
 BOL_lowland_development:0 "Lowland Development Drive"
 BOL_lowland_development_desc:0 "Roads, medical posts and colonization bureaus are pushing the republic toward Santa Cruz, Beni and the eastern frontier."
 BOL_oriente_oil_push:0 "Oriente Oil Push"
 BOL_oriente_oil_push_desc:0 "YPFB engineers and state planners are turning the eastern oilfields into a pillar of national development."
 BOL_andes_to_amazon_railway:0 "Andes-to-Amazon Railway"
 BOL_andes_to_amazon_railway_desc:0 "A rail and road network tying the highlands to the Amazon would redraw Bolivia's economic geography."

 # Bolivia focus tree
 BOL_a_defeated_patria:0 "A Defeated Patria"
 BOL_a_defeated_patria_desc:0 "The Chaco defeat has shaken the republic. Recognizing the losses is the first step toward rebuilding the army and restoring public confidence."
 BOL_a_new_bolivia_emerges:0 "A New Bolivia Emerges"
 BOL_a_new_bolivia_emerges_desc:0 "The first reforms have created a more capable state. Its survival now depends on institutions that can withstand political succession."
 BOL_a_second_chance:0 "A Second Chance"
 BOL_a_second_chance_desc:0 "A new coalition can seize the initiative, but must choose between nationalist organizations and indigenous revolutionary supporters."
 BOL_accept_help_from_nationalists:0 "Accept Help from Nationalists"
 BOL_accept_help_from_nationalists_desc:0 "Accept nationalist support for a new government, giving the Falange a decisive role in the political settlement."
 BOL_agrarian_reform_of_1953:0 "Agrarian Reform of 1953"
 BOL_agrarian_reform_of_1953_desc:0 "Break the hacienda order through land redistribution and recognition of peasant communities. Reform must reach beyond decrees issued in La Paz."
 BOL_air_superiority_over_the_andes:0 "Air Superiority Over the Andes"
 BOL_air_superiority_over_the_andes_desc:0 "Bolivia chooses how to turn crisis into power, balancing the legacy of the Chaco War with the ambitions of a new generation."
 BOL_alliance_with_the_PIR:0 "Alliance with the PIR"
 BOL_alliance_with_the_PIR_desc:0 "The revolutionary left offers organizers and intellectuals who can turn military reform into a broader socialist movement."
 BOL_american_flight_training_program:0 "American Flight Training Program"
 BOL_american_flight_training_program_desc:0 "Bolivia chooses how to turn crisis into power, balancing the legacy of the Chaco War with the ambitions of a new generation."
 BOL_andean_third_position:0 "Andean Third Position"
 BOL_andean_third_position_desc:0 "Pursue an independent socialist policy, avoiding dependence on Washington or Moscow while organizing a regional movement."
 BOL_andean_welfare_state:0 "Andean Welfare State"
 BOL_andean_welfare_state_desc:0 "Invest in social protection and basic services, making democratic government tangible in ordinary citizens' lives."
 BOL_arm_indigenous_peoples:0 "Arm Indigenous Peoples"
 BOL_arm_indigenous_peoples_desc:0 "Recruit volunteers from communities excluded by the old state. Local organization provides manpower, but training and equipment must follow."
 BOL_armed_export_of_the_revolution:0 "Armed Export of the Revolution"
 BOL_armed_export_of_the_revolution_desc:0 "Prepare instruments for spreading the revolution across the border. Each confrontation requires a separate political commitment."
 BOL_army_of_the_altiplano_reborn:0 "Army of the Altiplano Reborn"
 BOL_army_of_the_altiplano_reborn_desc:0 "Bolivia chooses how to turn crisis into power, balancing the legacy of the Chaco War with the ambitions of a new generation."
 BOL_axis_sympathies_in_the_cabinet:0 "Axis Sympathies in the Cabinet"
 BOL_axis_sympathies_in_the_cabinet_desc:0 "Nationalist ministers advocate closer relations with the Axis, opening an alternative foreign policy and strengthening authoritarian currents."
 BOL_aymara_and_inca_pride:0 "Aymara and Inca Pride"
 BOL_aymara_and_inca_pride_desc:0 "Emphasize indigenous and Andean heritage within the nationalist movement, offering an alternative to its Hispanic interpretation."
 BOL_aymara_architecture:0 "Aymara Architecture"
 BOL_aymara_architecture_desc:0 "Invest in public buildings and transport shaped by local needs, making the new state visible in daily life."
 BOL_birth_of_extremist_ideologies:0 "Birth of Extremist Ideologies"
 BOL_birth_of_extremist_ideologies_desc:0 "The failed coup discredits officers and traditional parties alike. Radical movements offer rival explanations for Bolivia's defeat and poverty."
 BOL_bolivarian_socialist_congress:0 "Bolivarian Socialist Congress"
 BOL_bolivarian_socialist_congress_desc:0 "Bring revolutionary organizers and economic specialists together to coordinate an independent program for the Andean republics."
 BOL_bolivia_arbitrates_between_powers:0 "Bolivia Arbitrates Between Powers"
 BOL_bolivia_arbitrates_between_powers_desc:0 "Preserve diplomatic room for maneuver by negotiating development agreements with several powers."
 BOL_bolivia_model_for_latin_america:0 "Bolivia Model for Latin America"
 BOL_bolivia_model_for_latin_america_desc:0 "Demonstrate that universal citizenship, land reform and national development can survive a constitutional transfer of power."
 BOL_bolivia_neutral_in_the_world_war:0 "Bolivia Neutral in the World War"
 BOL_bolivia_neutral_in_the_world_war_desc:0 "Preserve diplomatic freedom during the wider war, concentrating on domestic stability and regional relations."
 BOL_bolivian_liberal_republic:0 "The Bolivian Liberal Republic"
 BOL_bolivian_liberal_republic_desc:0 "Consolidate a civilian republic based on constitutional government, broad participation and a peaceful transfer of authority."
 BOL_bolivian_national_corporatism:0 "Bolivian National Corporatism"
 BOL_bolivian_national_corporatism_desc:0 "Organize labor, employers and technical education within a state-directed corporate framework intended to replace parliamentary bargaining."
 BOL_bolivian_national_syndicalism:0 "Bolivian National Syndicalism"
 BOL_bolivian_national_syndicalism_desc:0 "Create supervised industrial organizations to direct labor and capital toward military and national development."
 BOL_break_with_the_mining_rosca:0 "Break with the Mining Rosca"
 BOL_break_with_the_mining_rosca_desc:0 "Compromise with the mining oligarchy has reached its limit. Break its political power and strengthen the revolutionary state."
 BOL_build_airfields_on_the_altiplano:0 "Build Airfields on the Altiplano"
 BOL_build_airfields_on_the_altiplano_desc:0 "Bolivia chooses how to turn crisis into power, balancing the legacy of the Chaco War with the ambitions of a new generation."
 BOL_busch_enacts_the_labor_code:0 "Busch Enacts the Labor Code"
 BOL_busch_enacts_the_labor_code_desc:0 "A national labor code will give workers enforceable rights and bring industrial disputes within a legal framework."
 BOL_call_for_free_elections:0 "Call for Free Elections"
 BOL_call_for_free_elections_desc:0 "Prepare elections and a civilian cabinet. Restoring political competition offers a way out of permanent military rule."
 BOL_calm_the_high_command:0 "Calm the High Command"
 BOL_calm_the_high_command_desc:0 "Persuade the officers that political change will not mean abandoning their soldiers. Restore communication between the barracks and government."
 BOL_censorship_and_press_control:0 "Censorship and Press Control"
 BOL_censorship_and_press_control_desc:0 "Bring newspapers under government supervision and prevent opposition networks from organizing through independent publications."
 BOL_children_of_pachamama:0 "Children of Pachamama"
 BOL_children_of_pachamama_desc:0 "Strengthen the connection between communities and the state through rural welfare and communal participation."
 BOL_clerical_nationalism_of_the_andes:0 "Clerical Nationalism of the Andes"
 BOL_clerical_nationalism_of_the_andes_desc:0 "Build an alliance with religious institutions and present the government as defender of a common national and moral order."
 BOL_close_air_support_for_the_army:0 "Close Air Support for the Army"
 BOL_close_air_support_for_the_army_desc:0 "Bolivia chooses how to turn crisis into power, balancing the legacy of the Chaco War with the ambitions of a new generation."
 BOL_colonization_of_santa_cruz:0 "Colonization of Santa Cruz"
 BOL_colonization_of_santa_cruz_desc:0 "Invest in settlement and services around Santa Cruz, opening another center of development beyond the western mines."
 BOL_colonization_of_santa_cruz_and_beni:0 "Colonization of Santa Cruz and Beni"
 BOL_colonization_of_santa_cruz_and_beni_desc:0 "Extend the revolution's development program into eastern settlement, agriculture and public infrastructure."
 BOL_comibol_nationalization_of_the_mines:0 "COMIBOL Nationalization of the Mines"
 BOL_comibol_nationalization_of_the_mines_desc:0 "Place the major mines under COMIBOL, making public ownership a central institution of the National Revolution."
 BOL_consolidation_of_military_socialism:0 "Consolidation of Military Socialism"
 BOL_consolidation_of_military_socialism_desc:0 "Toro promises a national state above the old parties. Officers and civilian reformers will organize its economic and social program."
 BOL_control_the_tin_barons:0 "Control the Tin Barons"
 BOL_control_the_tin_barons_desc:0 "Compel mining houses to support government priorities through tighter regulation of production and strategic materials."
 BOL_controlled_tin_nationalization:0 "Controlled Tin Nationalization"
 BOL_controlled_tin_nationalization_desc:0 "Strengthen public oversight of strategic mines while preserving production and access to foreign markets."
 BOL_coup_of_december_1943:0 "Coup of December 1943"
 BOL_coup_of_december_1943_desc:0 "RADEPA and the MNR will overthrow Penaranda and place Gualberto Villarroel at the head of a nationalist military government."
 BOL_democracy_resists:0 "Democracy Resists"
 BOL_democracy_resists_desc:0 "The civilian government survives the conspiracy and pursues reform through constitutional institutions, opening an alternative democratic settlement."
 BOL_democratize_the_country:0 "Democratize the Country"
 BOL_democratize_the_country_desc:0 "Use the army's retreat from politics to reconstruct democracy rather than replace one military regime with another."
 BOL_develop_the_eastern_lowlands:0 "Develop the Eastern Lowlands"
 BOL_develop_the_eastern_lowlands_desc:0 "Bolivia chooses how to turn crisis into power, balancing the legacy of the Chaco War with the ambitions of a new generation."
 BOL_diplomacy_of_the_lost_sea:0 "Diplomacy of the Lost Sea"
 BOL_diplomacy_of_the_lost_sea_desc:0 "Open negotiations for a Pacific settlement. Chile must agree to any transfer, and a successful agreement requires compensation."
 BOL_direct_democracy_of_the_ayllu:0 "Direct Democracy of the Ayllu"
 BOL_direct_democracy_of_the_ayllu_desc:0 "Give local assemblies a recognized role while building institutions capable of coordinating them across Bolivia."
 BOL_disarm_the_bolivian_army:0 "Disarm the Bolivian Army"
 BOL_disarm_the_bolivian_army_desc:0 "Break the army's ability to dictate politics. The resulting military weakness must be repaired by a new government."
 BOL_dissolve_the_oligarchic_army:0 "Dissolve the Oligarchic Army"
 BOL_dissolve_the_oligarchic_army_desc:0 "Reorganize the defeated army under revolutionary authority. Its personnel must serve the state rather than dictate political outcomes."
 BOL_doctrine_of_aggressive_advance:0 "Doctrine of Aggressive Advance"
 BOL_doctrine_of_aggressive_advance_desc:0 "Bolivia chooses how to turn crisis into power, balancing the legacy of the Chaco War with the ambitions of a new generation."
 BOL_doctrine_of_defensive_depth:0 "Doctrine of Defensive Depth"
 BOL_doctrine_of_defensive_depth_desc:0 "Bolivia chooses how to turn crisis into power, balancing the legacy of the Chaco War with the ambitions of a new generation."
 BOL_empire_of_the_condor:0 "Empire of the Condor"
 BOL_empire_of_the_condor_desc:0 "After recovering the Chaco, proclaim a new national order built around the military state's restored prestige."
 BOL_expand_the_military_academies:0 "Expand the Military Academies"
 BOL_expand_the_military_academies_desc:0 "Bolivia chooses how to turn crisis into power, balancing the legacy of the Chaco War with the ambitions of a new generation."
 BOL_expand_the_oruro_smelters:0 "Expand the Oruro Smelters"
 BOL_expand_the_oruro_smelters_desc:0 "Bolivia chooses how to turn crisis into power, balancing the legacy of the Chaco War with the ambitions of a new generation."
 BOL_expropriate_the_oligarchy:0 "Expropriate the Oligarchy"
 BOL_expropriate_the_oligarchy_desc:0 "Break the economic independence of the old oligarchy and place its resources at the disposal of the state."
 BOL_failed_coup:0 "Failed Coup"
 BOL_failed_coup_desc:0 "The attempted military takeover has failed. Civilian authorities survive, but the army remains divided by suspicion and humiliation."
 BOL_falangist_crusade_for_the_sea:0 "Falangist Crusade for the Sea"
 BOL_falangist_crusade_for_the_sea_desc:0 "Turn maritime ambitions into an authorized military campaign against Chile, with territorial claims and a defined objective."
 BOL_fiscal_petroleum_fields:0 "Fiscal Petroleum Fields"
 BOL_fiscal_petroleum_fields_desc:0 "A public oil enterprise can develop the eastern fields and reduce dependence on foreign concessions. Petroleum must serve domestic development."
 BOL_forging_the_highland_infantry:0 "Forging the Highland Infantry"
 BOL_forging_the_highland_infantry_desc:0 "Bolivia chooses how to turn crisis into power, balancing the legacy of the Chaco War with the ambitions of a new generation."
 BOL_free_press_and_public_forum:0 "Free Press and Public Forum"
 BOL_free_press_and_public_forum_desc:0 "An informed public needs independent newspapers and education. Expand access to learning alongside civil liberties."
 BOL_freedom_of_press_and_opinion:0 "Freedom of Press and Opinion"
 BOL_freedom_of_press_and_opinion_desc:0 "Restore space for newspapers, parties and public debate so civilian government has a foundation beyond the barracks."
 BOL_german_military_advisors:0 "German Military Advisors"
 BOL_german_military_advisors_desc:0 "Bolivia chooses how to turn crisis into power, balancing the legacy of the Chaco War with the ambitions of a new generation."
 BOL_great_bolivian_reich_of_the_south:0 "The Greater Bolivian State"
 BOL_great_bolivian_reich_of_the_south_desc:0 "After recovering a Pacific coast, proclaim a greater Bolivian state centered on territorial restoration."
 BOL_great_socialist_homeland_of_the_south:0 "Great Socialist Homeland of the South"
 BOL_great_socialist_homeland_of_the_south_desc:0 "Expand recruitment around the revolution's public institutions. A socialist Bolivia must be able to defend its sovereignty."
 BOL_guarantee_the_loyalty_of_the_people:0 "Guarantee the Loyalty of the People"
 BOL_guarantee_the_loyalty_of_the_people_desc:0 "Negotiate a broader political understanding with communities that distrust the old republic. Military loyalty alone cannot preserve the government."
 BOL_hispanism:0 "Hispanism"
 BOL_hispanism_desc:0 "Make cultural and religious ties with Spain central to the regime's interpretation of Bolivia's national identity."
 BOL_homeland_or_death_decree:0 "Homeland or Death Decree"
 BOL_homeland_or_death_decree_desc:0 "Busch will assume extraordinary powers to overcome resistance to reform. Political order will depend on the revolution's success."
 BOL_impose_the_family_ayllu_system:0 "Impose the Family Ayllu System"
 BOL_impose_the_family_ayllu_system_desc:0 "Extend communal organization into civil administration and make the revolutionary state accountable to local communities."
 BOL_indigenous_congress_of_1945:0 "Indigenous Congress of 1945"
 BOL_indigenous_congress_of_1945_desc:0 "Bring indigenous representatives to a national congress and recognize demands long excluded from public debate."
 BOL_industrialize_la_paz:0 "Industrialize La Paz"
 BOL_industrialize_la_paz_desc:0 "Bolivia chooses how to turn crisis into power, balancing the legacy of the Chaco War with the ambitions of a new generation."
 BOL_international_diplomatic_opening:0 "International Diplomatic Opening"
 BOL_international_diplomatic_opening_desc:0 "Restore regular contact with foreign governments and commercial representatives. Bolivia needs markets as well as recognition."
 BOL_iron_fist_on_the_altiplano:0 "Iron Fist on the Altiplano"
 BOL_iron_fist_on_the_altiplano_desc:0 "Strengthen authority in the highland cities and mining districts, placing public order above political accommodation."
 BOL_lend_lease_in_exchange_for_tin:0 "Lend Lease in Exchange for Tin"
 BOL_lend_lease_in_exchange_for_tin_desc:0 "Use strategic exports to secure American small arms. The army needs practical equipment more urgently than diplomatic ceremony."
 BOL_march_toward_the_new_bolivian_order:0 "March Toward the New Bolivian Order"
 BOL_march_toward_the_new_bolivian_order_desc:0 "Bring Unzaga to power and replace the provisional coalition with a Falangist party-state."
 BOL_maritime_preparations_for_war:0 "Maritime Preparations for War"
 BOL_maritime_preparations_for_war_desc:0 "Bolivia chooses how to turn crisis into power, balancing the legacy of the Chaco War with the ambitions of a new generation."
 BOL_mechanized_forces_for_the_lowlands:0 "Mechanized Forces for the Lowlands"
 BOL_mechanized_forces_for_the_lowlands_desc:0 "Bolivia chooses how to turn crisis into power, balancing the legacy of the Chaco War with the ambitions of a new generation."
 BOL_militarize_the_people:0 "Militarize the People"
 BOL_militarize_the_people_desc:0 "Recruit volunteers outside the discredited command structure and restore confidence through a new language of national service."
 BOL_modernization_of_the_national_army:0 "Modernization of the National Army"
 BOL_modernization_of_the_national_army_desc:0 "Replace worn equipment and improve staff work without creating an army larger than the country can supply."
 BOL_multiparty_congress_in_sucre:0 "Multiparty Congress in Sucre"
 BOL_multiparty_congress_in_sucre_desc:0 "Restore a legislature where competing movements can negotiate reforms without settling every dispute through a coup."
 BOL_national_arms_manufacturing:0 "National Arms Manufacturing"
 BOL_national_arms_manufacturing_desc:0 "Bolivia chooses how to turn crisis into power, balancing the legacy of the Chaco War with the ambitions of a new generation."
 BOL_naval_officer_training_in_peru:0 "Naval Officer Training in Peru"
 BOL_naval_officer_training_in_peru_desc:0 "Bolivia chooses how to turn crisis into power, balancing the legacy of the Chaco War with the ambitions of a new generation."
 BOL_one_nation_one_leader_one_faith:0 "One Nation One Leader One Faith"
 BOL_one_nation_one_leader_one_faith_desc:0 "Subordinate competing loyalties to a common political doctrine and the authority of the central state."
 BOL_open_doors_to_foreign_capital:0 "Open Doors to Foreign Capital"
 BOL_open_doors_to_foreign_capital_desc:0 "Invite regulated foreign investment to overcome the limits of domestic credit, machinery and industrial capacity."
 BOL_outreach_to_francos_spain:0 "Outreach to Francos Spain"
 BOL_outreach_to_francos_spain_desc:0 "Seek cooperation with the Spanish government through movements claiming a common Hispanic political tradition."
 BOL_pachamama_feeds_the_world:0 "Pachamama Feeds the World"
 BOL_pachamama_feeds_the_world_desc:0 "Consolidate the Andean union around agriculture, public welfare and institutions created by its participating communities."
 BOL_pact_with_foreign_capital:0 "Pact with Foreign Capital"
 BOL_pact_with_foreign_capital_desc:0 "Negotiate investment that preserves public authority. Foreign machinery and credit can support development without controlling the state."
 BOL_pact_with_the_mining_rosca:0 "Pact with the Mining Rosca"
 BOL_pact_with_the_mining_rosca_desc:0 "Exchange political protection for the cooperation of the great mining interests. Stability will rest on an explicit bargain."
 BOL_paz_estenssoro_returns_from_exile:0 "Paz Estenssoro Returns from Exile"
 BOL_paz_estenssoro_returns_from_exile_desc:0 "Rebuild Paz Estenssoro's network and prepare the MNR's return to national politics after the collapse of its previous coalition."
 BOL_peoples_republic_of_bolivia:0 "Peoples Republic of Bolivia"
 BOL_peoples_republic_of_bolivia_desc:0 "Proclaim a socialist republic that recognizes Bolivia's many peoples as participants in a common state."
 BOL_permanent_state_of_siege:0 "Permanent State of Siege"
 BOL_permanent_state_of_siege_desc:0 "Make emergency rule permanent, accepting its economic burden in exchange for tighter political control."
 BOL_petroleum_exports_from_santa_cruz:0 "Petroleum Exports from Santa Cruz"
 BOL_petroleum_exports_from_santa_cruz_desc:0 "Bolivia chooses how to turn crisis into power, balancing the legacy of the Chaco War with the ambitions of a new generation."
 BOL_petroleum_refineries_of_the_oriente:0 "Petroleum Refineries of the Oriente"
 BOL_petroleum_refineries_of_the_oriente_desc:0 "Bolivia chooses how to turn crisis into power, balancing the legacy of the Chaco War with the ambitions of a new generation."
 BOL_pragmatic_economic_reform:0 "Pragmatic Economic Reform"
 BOL_pragmatic_economic_reform_desc:0 "The government's credibility depends on visible improvements. Direct scarce investment toward projects that can begin producing quickly."
 BOL_public_works_for_the_nation:0 "Public Works for the Nation"
 BOL_public_works_for_the_nation_desc:0 "Road construction can create employment while linking distant settlements to the national administration."
 BOL_purge_of_liberal_intellectuals:0 "Purge of Liberal Intellectuals"
 BOL_purge_of_liberal_intellectuals_desc:0 "Remove influential opponents from public institutions and impose the party's doctrine on education and administration."
 BOL_reclaim_the_bolivian_chaco:0 "Reclaim the Bolivian Chaco"
 BOL_reclaim_the_bolivian_chaco_desc:0 "Prepare to recover the territory lost to Paraguay. The army must confront the terrain that defeated its predecessors."
 BOL_red_army_of_the_altiplano:0 "Red Army of the Altiplano"
 BOL_red_army_of_the_altiplano_desc:0 "Reorganize revolutionary forces under common training and command. Militias alone cannot defend a modern socialist state."
 BOL_regional_strategic_alliances:0 "Regional Strategic Alliances"
 BOL_regional_strategic_alliances_desc:0 "Improve relations with Peru and Argentina to reduce isolation and create space for regional economic cooperation."
 BOL_reinforce_incaism:0 "Reinforce Incaism"
 BOL_reinforce_incaism_desc:0 "Incorporate Andean symbols into the nationalist program, claiming continuity with a past older than the republic."
 BOL_resistance_to_imperialist_influence:0 "Resistance to Imperialist Influence"
 BOL_resistance_to_imperialist_influence_desc:0 "Foreign companies cannot dictate every national decision. Assert the government's right to regulate strategic resources and essential services."
 BOL_river_gunboats_of_the_amazon:0 "River Gunboats of the Amazon"
 BOL_river_gunboats_of_the_amazon_desc:0 "Bolivia chooses how to turn crisis into power, balancing the legacy of the Chaco War with the ambitions of a new generation."
 BOL_road_to_the_amazon:0 "Road to the Amazon"
 BOL_road_to_the_amazon_desc:0 "Develop eastern transport and renew the claim to Acre. Lowland ambitions require a stronger administrative presence."
 BOL_rubber_and_quinine_of_the_amazon:0 "Rubber and Quinine of the Amazon"
 BOL_rubber_and_quinine_of_the_amazon_desc:0 "Bolivia chooses how to turn crisis into power, balancing the legacy of the Chaco War with the ambitions of a new generation."
 BOL_sea_for_bolivia:0 "Sea for Bolivia"
 BOL_sea_for_bolivia_desc:0 "With a coast under Bolivian control, build a working port and naval program to fulfill the old maritime ambition."
 BOL_secure_the_southern_provinces:0 "Secure the Southern Provinces"
 BOL_secure_the_southern_provinces_desc:0 "Rebuild relations with southern communities through local recruitment and cooperation with indigenous representatives."
 BOL_seek_help_from_indigenous_peoples:0 "Seek Help from Indigenous Peoples"
 BOL_seek_help_from_indigenous_peoples_desc:0 "Build the new coalition around indigenous demands for land, representation and protection from rural coercion."
 BOL_silence_the_chaco_veterans:0 "Silence the Chaco Veterans"
 BOL_silence_the_chaco_veterans_desc:0 "Veterans threaten to turn their grievances into an organized challenge. Containing their protests will buy time, but deepen resentment."
 BOL_silence_the_opposition_press:0 "Silence the Opposition Press"
 BOL_silence_the_opposition_press_desc:0 "Restrict newspapers that organize resistance. Censorship reduces immediate pressure while narrowing the government's political base."
 BOL_socialist_constitution_of_1938:0 "Socialist Constitution of 1938"
 BOL_socialist_constitution_of_1938_desc:0 "Write labor rights, public responsibility for resources and social citizenship into a new constitutional settlement."
 BOL_solidarity_with_the_soviet_comrades:0 "Solidarity with the Soviet Comrades"
 BOL_solidarity_with_the_soviet_comrades_desc:0 "Soviet cooperation could provide technical assistance and an international partner for our isolated revolution."
 BOL_state_oil_enterprise:0 "State Oil Enterprise"
 BOL_state_oil_enterprise_desc:0 "Expand public petroleum production and processing. The eastern fields can finance an industrial base beyond the mines."
 BOL_strategic_bombing_capacity:0 "Strategic Bombing Capacity"
 BOL_strategic_bombing_capacity_desc:0 "Bolivia chooses how to turn crisis into power, balancing the legacy of the Chaco War with the ambitions of a new generation."
 BOL_support_chilean_anarchists:0 "Support Chilean Anarchists"
 BOL_support_chilean_anarchists_desc:0 "Support Chilean workers and left-wing organizers. Their government may permit the contacts or suppress them."
 BOL_support_for_revolutionary_movements:0 "Support for Revolutionary Movements"
 BOL_support_for_revolutionary_movements_desc:0 "The military socialists need allies beyond the barracks. Nationalist intellectuals and workers' organizations can broaden the base for reform."
 BOL_surplus_aircraft_from_the_chaco:0 "Surplus Aircraft from the Chaco"
 BOL_surplus_aircraft_from_the_chaco_desc:0 "Bolivia chooses how to turn crisis into power, balancing the legacy of the Chaco War with the ambitions of a new generation."
 BOL_tawantinsuyu_reborn:0 "Tawantinsuyu Reborn"
 BOL_tawantinsuyu_reborn_desc:0 "With Lima and the Bolivian heartland owned and controlled, proclaim a new Andean union. Its regions still require individual integration."
 BOL_technocrats_in_the_cabinet:0 "Technocrats in the Cabinet"
 BOL_technocrats_in_the_cabinet_desc:0 "Bring civilian specialists into government to turn broad reform promises into budgets, regulations and practical construction programs."
 BOL_the_altiplano_autarky:0 "The Altiplano Autarky"
 BOL_the_altiplano_autarky_desc:0 "Support local production and communal provisioning to reduce dependence on institutions controlled by political opponents."
 BOL_the_andean_league_of_nations:0 "The Andean League of Nations"
 BOL_the_andean_league_of_nations_desc:0 "Propose a regional league founded on consent. Bolivia can establish the alliance, but neighboring governments must choose whether to join."
 BOL_the_april_revolution_of_1952:0 "The April Revolution of 1952"
 BOL_the_april_revolution_of_1952_desc:0 "The April uprising breaks the old army's political supremacy and brings Paz Estenssoro to power with a program of national transformation."
 BOL_the_armed_peasant_militias:0 "The Armed Peasant Militias"
 BOL_the_armed_peasant_militias_desc:0 "Organize rural defense around communities transformed by land reform. Their mobilization strengthens the revolution while complicating central control."
 BOL_the_ashes_of_the_liberal_state:0 "The Ashes of the Liberal State"
 BOL_the_ashes_of_the_liberal_state_desc:0 "The old settlement has lost its authority. Reorganize the administration around forces that can still command public support."
 BOL_the_awakening_of_the_bolivians:0 "The Awakening of the Bolivians"
 BOL_the_awakening_of_the_bolivians_desc:0 "The war brought workers, peasants and officers together. Their demands can become a foundation for national renewal."
 BOL_the_aymara_peoples_army:0 "The Aymara Peoples Army"
 BOL_the_aymara_peoples_army_desc:0 "Give rural and urban volunteers common training and command, turning local militias into a national force."
 BOL_the_bohan_development_plan:0 "The Bohan Development Plan"
 BOL_the_bohan_development_plan_desc:0 "Connect eastern agriculture, roads and industry with the highland economy using the proposals associated with the Bohan mission."
 BOL_the_bolivian_economic_miracle:0 "The Bolivian Economic Miracle"
 BOL_the_bolivian_economic_miracle_desc:0 "Bolivia chooses how to turn crisis into power, balancing the legacy of the Chaco War with the ambitions of a new generation."
 BOL_the_bolivian_mining_bank:0 "The Bolivian Mining Bank"
 BOL_the_bolivian_mining_bank_desc:0 "Provide machinery and credit to operations unable to obtain favorable terms from the great private houses."
 BOL_the_catavi_massacre_will_not_be_forgotten:0 "The Catavi Massacre Will Not Be Forgotten"
 BOL_the_catavi_massacre_will_not_be_forgotten_desc:0 "The memory of the 1942 Catavi massacre continues to unite miners against the established order and shape the revolutionary coalition."
 BOL_the_chakana_on_the_rise:0 "The Chakana on the Rise"
 BOL_the_chakana_on_the_rise_desc:0 "Make the chakana a public symbol linking Andean identity with the movement's revolutionary demands."
 BOL_the_cob_pillar_of_the_new_nation:0 "The COB Pillar of the New Nation"
 BOL_the_cob_pillar_of_the_new_nation_desc:0 "Recognize the Central Obrera Boliviana as a partner in the revolutionary coalition, giving organized labor influence over national policy."
 BOL_the_destiny_of_america:0 "The Destiny of America"
 BOL_the_destiny_of_america_desc:0 "Present indigenous political participation as a wider continental project beyond the borders of Bolivia."
 BOL_the_destiny_of_our_revolution:0 "The Destiny of our Revolution"
 BOL_the_destiny_of_our_revolution_desc:0 "Toro's coalition is breaking apart. Busch prepares to assume responsibility for a revolution whose direction remains unresolved."
 BOL_the_doctrine_of_inca_blood:0 "The Doctrine of Inca Blood"
 BOL_the_doctrine_of_inca_blood_desc:0 "The Andean wing will build its legitimacy around an imagined national inheritance, challenging the movement's European orientation."
 BOL_the_dream_of_a_pacific_coast:0 "The Dream of a Pacific Coast"
 BOL_the_dream_of_a_pacific_coast_desc:0 "Bolivia chooses how to turn crisis into power, balancing the legacy of the Chaco War with the ambitions of a new generation."
 BOL_the_end_of_corruption:0 "The End of Corruption"
 BOL_the_end_of_corruption_desc:0 "Dismantle the patronage networks that discredited the old government without destroying the administration we now need to govern."
 BOL_the_exchange_decree_of_1939:0 "The Exchange Decree of 1939"
 BOL_the_exchange_decree_of_1939_desc:0 "Mining exporters must return foreign-exchange earnings to Bolivia. This revenue can support national industry and essential imports."
 BOL_the_falange_youth_brigades:0 "The Falange Youth Brigades"
 BOL_the_falange_youth_brigades_desc:0 "Combine political education, physical training and preparation for national service in party-run youth organizations."
 BOL_the_falangist_state_of_order:0 "The Falangist State of Order"
 BOL_the_falangist_state_of_order_desc:0 "Turn promises of discipline into a permanent administrative and security structure serving the movement."
 BOL_the_false_son_of_the_sun:0 "The False Son of the Sun"
 BOL_the_false_son_of_the_sun_desc:0 "Challenge rival claims to represent the Andean peoples and strengthen the council's authority within the movement."
 BOL_the_fate_of_the_oligarchs:0 "The Fate of the Oligarchs"
 BOL_the_fate_of_the_oligarchs_desc:0 "Mining houses and rural patrons dominate political life. We must decide whether to preserve their cooperation or confront their privileges."
 BOL_the_fstmb_is_born_at_pulacayo:0 "Organize the Federation of Mining Workers"
 BOL_the_fstmb_is_born_at_pulacayo_desc:0 "Support the federation of mining workers founded in 1944. Organized miners are becoming a national force that no government can ignore."
 BOL_the_fuerza_aerea_boliviana:0 "The Fuerza Aerea Boliviana"
 BOL_the_fuerza_aerea_boliviana_desc:0 "Bolivia chooses how to turn crisis into power, balancing the legacy of the Chaco War with the ambitions of a new generation."
 BOL_the_government_coup:0 "The Government Coup"
 BOL_the_government_coup_desc:0 "The May crisis threatens the government's survival. Military socialists prepare to take power, while loyalists organize a defense of the republic."
 BOL_the_hispanist_crusade:0 "The Hispanist Crusade"
 BOL_the_hispanist_crusade_desc:0 "Present Bolivia as part of an international Hispanic nationalist revival with a wider cultural mission."
 BOL_the_ibero_american_falangist_pact:0 "The Ibero American Falangist Pact"
 BOL_the_ibero_american_falangist_pact_desc:0 "Create machinery for a regional nationalist alliance. Friendly governments must still accept membership voluntarily."
 BOL_the_inca_road_network_restored:0 "The Inca Road Network Restored"
 BOL_the_inca_road_network_restored_desc:0 "Reconnect the highlands through modern transport inspired by the continental reach of the old Andean roads."
 BOL_the_indigenous_agrarian_congress:0 "The Indigenous Agrarian Congress"
 BOL_the_indigenous_agrarian_congress_desc:0 "Coordinate land reform, schooling and practical agricultural needs through a congress of rural representatives."
 BOL_the_insurgent_chakana:0 "The Insurgent Chakana"
 BOL_the_insurgent_chakana_desc:0 "Organize recruitment around common symbols and the defense of indigenous political authority."
 BOL_the_junta_consolidates:0 "The Junta Consolidates"
 BOL_the_junta_consolidates_desc:0 "Busch will preserve the military government's independence while building institutions capable of surviving a change of leadership."
 BOL_the_landlocked_navy_of_bolivia:0 "The Landlocked Navy of Bolivia"
 BOL_the_landlocked_navy_of_bolivia_desc:0 "Bolivia chooses how to turn crisis into power, balancing the legacy of the Chaco War with the ambitions of a new generation."
 BOL_the_leader_embodies_the_nation:0 "The Leader Embodies the Nation"
 BOL_the_leader_embodies_the_nation_desc:0 "Concentrate political legitimacy around a single leader and weaken institutions capable of challenging his authority."
 BOL_the_legacy_of_the_national_revolution:0 "The Legacy of the National Revolution"
 BOL_the_legacy_of_the_national_revolution_desc:0 "Consolidate the institutions created since 1952. The revolution must now confront the economic costs of rebuilding Bolivia."
 BOL_the_lessons_of_the_chaco:0 "The Lessons of the Chaco"
 BOL_the_lessons_of_the_chaco_desc:0 "Bolivia chooses how to turn crisis into power, balancing the legacy of the Chaco War with the ambitions of a new generation."
 BOL_the_liberal_constitution_of_la_paz:0 "The Liberal Constitution of La Paz"
 BOL_the_liberal_constitution_of_la_paz_desc:0 "Protect civilian government through a revised constitution that clarifies the limits of executive power."
 BOL_the_lynching_of_villarroel_1946:0 "The Lynching of Villarroel 1946"
 BOL_the_lynching_of_villarroel_1946_desc:0 "Villarroel's coalition collapses amid strikes and violent opposition. His fall brings provisional civilian authorities and renewed uncertainty."
 BOL_the_mines_belong_to_the_people:0 "The Mines Belong to the People"
 BOL_the_mines_belong_to_the_people_desc:0 "Public investment and stronger oversight will challenge the concentration of mining wealth in private hands."
 BOL_the_mnr_centers_with_siles_zuazo:0 "The MNR Centers with Siles Zuazo"
 BOL_the_mnr_centers_with_siles_zuazo_desc:0 "Siles Zuazo will succeed Paz Estenssoro in 1956, preserving the main reforms while seeking a sustainable economic settlement."
 BOL_the_mnr_radicalizes_with_lechin:0 "The MNR Radicalizes with Lechin"
 BOL_the_mnr_radicalizes_with_lechin_desc:0 "Lechin and organized labor will push toward workers' control, rejecting a settlement that restores conservative influence."
 BOL_the_mnr_rises_in_opposition:0 "The MNR Rises in Opposition"
 BOL_the_mnr_rises_in_opposition_desc:0 "The emerging MNR brings together nationalist intellectuals, younger officers and reformers dissatisfied with the conservative republic."
 BOL_the_mnr_wins_and_the_vote_is_stolen:0 "The MNR Wins and the Vote Is Stolen"
 BOL_the_mnr_wins_and_the_vote_is_stolen_desc:0 "The MNR's electoral victory is denied by a transfer of power to Ballivian's military junta. The crisis moves beyond parliamentary politics."
 BOL_the_moderate_reform_agenda:0 "The Moderate Reform Agenda"
 BOL_the_moderate_reform_agenda_desc:0 "Pursue reforms that can command a parliamentary majority while protecting civil rights and economic development."
 BOL_the_mountain_warfare_school:0 "The Mountain Warfare School"
 BOL_the_mountain_warfare_school_desc:0 "Bolivia chooses how to turn crisis into power, balancing the legacy of the Chaco War with the ambitions of a new generation."
 BOL_the_national_literacy_program:0 "The National Literacy Program"
 BOL_the_national_literacy_program_desc:0 "Literacy campaigns and teacher training will connect neglected communities with public institutions and expand scientific capacity."
 BOL_the_new_hispanic_order_of_the_andes:0 "The New Hispanic Order of the Andes"
 BOL_the_new_hispanic_order_of_the_andes_desc:0 "Consolidate the nationalist regime after its cultural disputes. Both ideological traditions must answer to the central state."
 BOL_the_pact_with_the_ussr:0 "The Pact with the USSR"
 BOL_the_pact_with_the_ussr_desc:0 "Request Soviet instructors and military equipment. Moscow may refuse, so our domestic research program must continue independently."
 BOL_the_penaranda_government:0 "The Penaranda Government"
 BOL_the_penaranda_government_desc:0 "Enrique Penaranda assumes the presidency through a conservative civilian coalition, restoring electoral government while preserving established interests."
 BOL_the_permanent_revolution_of_the_worker:0 "The Permanent Revolution of the Worker"
 BOL_the_permanent_revolution_of_the_worker_desc:0 "Place the government under Lechin's leadership and commit the state to a socialist program rooted in organized labor."
 BOL_the_pongueaje_shall_be_abolished:0 "The Pongueaje Shall Be Abolished"
 BOL_the_pongueaje_shall_be_abolished_desc:0 "End compulsory personal service on estates and challenge the authority of rural patrons over indigenous labor."
 BOL_the_popular_ayllu:0 "The Popular Ayllu"
 BOL_the_popular_ayllu_desc:0 "Expand communal organizations into a national network capable of mobilizing volunteers and sustaining local government."
 BOL_the_popular_mining_front:0 "The Popular Mining Front"
 BOL_the_popular_mining_front_desc:0 "Workers and public managers will coordinate mining production through a common political front. The state needs their experience and cooperation."
 BOL_the_pragmatic_caudillo:0 "The Pragmatic Caudillo"
 BOL_the_pragmatic_caudillo_desc:0 "A durable government must negotiate with interests it cannot immediately replace. Busch will pursue economic sovereignty through selective compromise."
 BOL_the_principles_of_the_ayllu:0 "The Principles of the Ayllu"
 BOL_the_principles_of_the_ayllu_desc:0 "Recognize local assemblies and communal responsibility as foundations of the new political order."
 BOL_the_pulacayo_thesis:0 "The Pulacayo Thesis"
 BOL_the_pulacayo_thesis_desc:0 "The miners' radical program calls for labor to lead a wider transformation, sharpening debate inside the workers' movement."
 BOL_the_quintanilla_dictatorship:0 "The Quintanilla Dictatorship"
 BOL_the_quintanilla_dictatorship_desc:0 "Quintanilla will retain military authority instead of preparing a civilian transfer. Emergency powers become the basis of the regime."
 BOL_the_radepa_conspires_in_the_shadows:0 "The RADEPA Conspires in the Shadows"
 BOL_the_radepa_conspires_in_the_shadows_desc:0 "Younger officers organize through RADEPA to pursue the national reforms abandoned by the conservative coalition."
 BOL_the_red_ayllu_in_distant_lands:0 "The Red Ayllu in Distant Lands"
 BOL_the_red_ayllu_in_distant_lands_desc:0 "Build contacts abroad so the movement becomes an Andean project rather than an isolated national experiment."
 BOL_the_red_inca_confederation:0 "The Red Inca Confederation"
 BOL_the_red_inca_confederation_desc:0 "Strengthen the union through a confederal revolutionary structure and recruit volunteers to defend its constituent communities."
 BOL_the_red_pachamama_trail:0 "The Red Pachamama Trail"
 BOL_the_red_pachamama_trail_desc:0 "Connect revolutionary organizations through the countryside around a shared obligation to the land and its communities."
 BOL_the_rosca_sexennium:0 "The Rosca Sexennium"
 BOL_the_rosca_sexennium_desc:0 "Hertzog restores conservative civilian rule. Mining interests regain influence while excluded nationalists and unions prepare their return."
 BOL_the_sacred_art_of_tiwanaku:0 "The Sacred Art of Tiwanaku"
 BOL_the_sacred_art_of_tiwanaku_desc:0 "Use Tiwanaku's imagery in architecture and propaganda to give the regime a distinctly Andean public identity."
 BOL_the_sacred_sun_of_andean_falangism:0 "The Sacred Sun of Andean Falangism"
 BOL_the_sacred_sun_of_andean_falangism_desc:0 "Complete the movement's Andean program, presenting national rebirth through symbols drawn from the highland past."
 BOL_the_savior_of_the_people:0 "The Savior of the People"
 BOL_the_savior_of_the_people_desc:0 "In this alternative course, Busch breaks with the conservative officers and commits his government to a socialist transformation of Bolivia."
 BOL_the_secret_police_of_the_republic:0 "The Secret Police of the Republic"
 BOL_the_secret_police_of_the_republic_desc:0 "Create a centralized security apparatus to monitor conspiracies and protect the military administration from another coup."
 BOL_the_south_american_integration_project:0 "The South American Integration Project"
 BOL_the_south_american_integration_project_desc:0 "Develop commercial and diplomatic cooperation before pursuing deeper political integration across South America."
 BOL_the_titicaca_lake_flotilla:0 "The Titicaca Lake Flotilla"
 BOL_the_titicaca_lake_flotilla_desc:0 "Bolivia chooses how to turn crisis into power, balancing the legacy of the Chaco War with the ambitions of a new generation."
 BOL_the_true_democracy_of_the_altiplano:0 "The True Democracy of the Altiplano"
 BOL_the_true_democracy_of_the_altiplano_desc:0 "Make democratic citizenship meaningful across linguistic, regional and social divisions. The republic must represent more than its urban elites."
 BOL_the_true_heirs_of_the_inca_empire:0 "The True Heirs of the Inca Empire"
 BOL_the_true_heirs_of_the_inca_empire_desc:0 "Claim an Andean inheritance and prepare institutions to integrate territories acquired from Peru and mainland Ecuador."
 BOL_the_war_against_the_colonizers:0 "The War Against the Colonizers"
 BOL_the_war_against_the_colonizers_desc:0 "Authorize an Andean campaign centered on Bolivia and Peru. Integration requires conquest, administration and local cooperation."
 BOL_the_wealth_beneath_our_feet:0 "The Wealth Beneath our Feet"
 BOL_the_wealth_beneath_our_feet_desc:0 "Bolivia chooses how to turn crisis into power, balancing the legacy of the Chaco War with the ambitions of a new generation."
 BOL_tin_for_the_allies:0 "Tin for the Allies"
 BOL_tin_for_the_allies_desc:0 "Strategic tin exports can secure Allied markets and assistance while drawing Bolivia toward their diplomatic camp."
 BOL_tin_the_backbone_of_the_economy:0 "Tin the Backbone of the Economy"
 BOL_tin_the_backbone_of_the_economy_desc:0 "Bolivia chooses how to turn crisis into power, balancing the legacy of the Chaco War with the ambitions of a new generation."
 BOL_total_mobilization_of_the_falange:0 "Total Mobilization of the Falange"
 BOL_total_mobilization_of_the_falange_desc:0 "Expand recruitment through labor and youth organizations, preparing society to support a larger military establishment."
 BOL_trans_andean_railroad_network:0 "Trans Andean Railroad Network"
 BOL_trans_andean_railroad_network_desc:0 "Bolivia chooses how to turn crisis into power, balancing the legacy of the Chaco War with the ambitions of a new generation."
 BOL_universal_suffrage_without_exclusions:0 "Universal Suffrage Without Exclusions"
 BOL_universal_suffrage_without_exclusions_desc:0 "Remove property and literacy restrictions on voting. Political citizenship must include the rural and indigenous majority."
 BOL_unstable_republic:0 "Unstable Republic"
 BOL_unstable_republic_desc:0 "Cabinet intrigue and military unrest have exposed the weakness of civilian institutions. Emergency reforms can keep the state functioning."
 BOL_unzaga_and_the_fsb_take_the_streets:0 "Unzaga and the FSB Take the Streets"
 BOL_unzaga_and_the_fsb_take_the_streets_desc:0 "Unzaga's followers organize demonstrations and party networks, turning the Falange into a movement capable of claiming power."
 BOL_uprising_of_the_communist_ayni:0 "Uprising of the Communist Ayni"
 BOL_uprising_of_the_communist_ayni_desc:0 "Establish an indigenous council government combining communal institutions with a socialist national program."
 BOL_villarroel_and_the_new_nationalism:0 "Villarroel and the New Nationalism"
 BOL_villarroel_and_the_new_nationalism_desc:0 "Build a coalition of officers, workers and indigenous representatives capable of governing without returning power to the old parties."
 BOL_war_of_revenge_of_the_pacific:0 "War of Revenge of the Pacific"
 BOL_war_of_revenge_of_the_pacific_desc:0 "Authorize preparations for a territorial confrontation with Chile. Military planning will replace the search for a negotiated settlement."
 BOL_what_is_our_country:0 "What Is our Country"
 BOL_what_is_our_country_desc:0 "The old parties cannot explain why so many Bolivians fought for a state that barely represented them. A national debate must begin."
 BOL_willkas_legacy:0 "Willkas Legacy"
 BOL_willkas_legacy_desc:0 "Honor indigenous resistance while defining a program suited to the institutions and conflicts of the twentieth century."
 BOL_workers_militias_of_the_altiplano:0 "Workers Militias of the Altiplano"
 BOL_workers_militias_of_the_altiplano_desc:0 "Organize local defense around the mines. Workers' mobilization strengthens the revolution but creates armed organizations outside normal military command."

 # Bolivia expanded military and economy branches
 BOL_lessons_of_boqueron:0 "Lessons of Boqueron"
 BOL_lessons_of_boqueron_desc:0 "The defeat at Boqueron still lives in every officer's memory. Bolivia will study the Chaco War honestly and rebuild an army suited to altitude, thirst and distance."
 BOL_colegio_militar_del_ejercito:0 "Army Military College"
 BOL_colegio_militar_del_ejercito_desc:0 "A modern officer corps must be trained to think beyond parade-ground discipline and prepare for real campaigns in the Andes and lowlands."
 BOL_regimientos_del_altiplano:0 "Altiplano Regiments"
 BOL_regimientos_del_altiplano_desc:0 "The highland regiments will be rearmed and reorganized around veterans who know the land and the cost of bad logistics."
 BOL_escuela_de_montana_sajama:0 "Sajama Mountain School"
 BOL_escuela_de_montana_sajama_desc:0 "The peaks and passes of Bolivia can be a fortress if our troops learn to move, fight and survive in them."
 BOL_misiones_militares_extranjeras:0 "Foreign Military Missions"
 BOL_misiones_militares_extranjeras_desc:0 "Selective foreign advisors can help professionalize the army without handing Bolivia's strategy to outsiders."
 BOL_fusiles_para_los_veteranos:0 "Rifles for the Veterans"
 BOL_fusiles_para_los_veteranos_desc:0 "The men who survived the Chaco deserve more than speeches. They will receive weapons, organization and a place in the new army."
 BOL_movilidad_en_los_llanos:0 "Mobility in the Llanos"
 BOL_movilidad_en_los_llanos_desc:0 "The lowlands punish armies that crawl. Trucks, fuel and practical planning will let us fight beyond the railheads."
 BOL_fabrica_nacional_de_municiones:0 "National Munitions Factory"
 BOL_fabrica_nacional_de_municiones_desc:0 "Bolivia cannot rely forever on imported cartridges and spare parts. A national munitions base is the first step toward military independence."
 BOL_doctrina_de_defensa_en_profundidad:0 "Defense-in-Depth Doctrine"
 BOL_doctrina_de_defensa_en_profundidad_desc:0 "Mountains, deserts and fortified towns can bleed any invader if the army learns to trade space for time."
 BOL_doctrina_de_maniobra_en_los_llanos:0 "Lowland Maneuver Doctrine"
 BOL_doctrina_de_maniobra_en_los_llanos_desc:0 "Future wars may be decided far from the Altiplano. Mobility and coordination in the eastern plains must become second nature."
 BOL_ejercito_del_altiplano_reformado:0 "Reformed Altiplano Army"
 BOL_ejercito_del_altiplano_reformado_desc:0 "The army that marched into the Chaco will not be the army that defends Bolivia's future."

 BOL_armada_boliviana_en_tierra:0 "Bolivian Navy on Land"
 BOL_armada_boliviana_en_tierra_desc:0 "Bolivia lost its coast, not its naval memory. The navy survives on rivers, Lake Titicaca and the stubborn claim that the sea is not forgotten."
 BOL_flotilla_del_lago_titicaca:0 "Lake Titicaca Flotilla"
 BOL_flotilla_del_lago_titicaca_desc:0 "The high lake can serve as a naval classroom, a patrol zone and a symbol that the Armada still has a mission."
 BOL_canones_del_mamore:0 "Guns of the Mamore"
 BOL_canones_del_mamore_desc:0 "The Amazonian river routes must be watched and defended. River craft and shore guns will give the navy a practical frontier role."
 BOL_cadetes_navales_en_el_callao:0 "Naval Cadets in Callao"
 BOL_cadetes_navales_en_el_callao_desc:0 "Training abroad will expose Bolivian cadets to modern seamanship while they wait for the day their country returns to the coast."
 BOL_astilleros_lacustres_de_guaqui:0 "Guaqui Lake Shipyards"
 BOL_astilleros_lacustres_de_guaqui_desc:0 "Small workshops on Lake Titicaca can maintain patrol boats, train technicians and keep naval industry alive."
 BOL_sueno_del_litoral_perdido:0 "Dream of the Lost Littoral"
 BOL_sueno_del_litoral_perdido_desc:0 "The lost coast remains a wound in the national imagination. Keeping that dream alive can rally the country around the Armada."
 BOL_doctrina_de_rios_y_lagos:0 "River and Lake Doctrine"
 BOL_doctrina_de_rios_y_lagos_desc:0 "A landlocked navy must master what it has: rivers, lakes, logistics and the political power of memory."

 BOL_reorganizar_la_fab:0 "Reorganize the FAB"
 BOL_reorganizar_la_fab_desc:0 "The Fuerza Aerea Boliviana proved its courage in the Chaco. Now it needs structure, training and aircraft fit for the Andes."
 BOL_veteranos_del_chaco_en_el_aire:0 "Chaco Veterans in the Air"
 BOL_veteranos_del_chaco_en_el_aire_desc:0 "Pilots and mechanics from the Chaco War will pass on hard-earned lessons before they are lost."
 BOL_mision_aerea_estadounidense:0 "American Air Mission"
 BOL_mision_aerea_estadounidense_desc:0 "A limited American mission can modernize training, maintenance and doctrine without erasing Bolivia's own air tradition."
 BOL_campos_de_aviacion_del_altiplano:0 "Altiplano Airfields"
 BOL_campos_de_aviacion_del_altiplano_desc:0 "High-altitude bases near La Paz and the plateau will turn geography into an air defense advantage."
 BOL_escuela_de_aviacion_el_alto:0 "El Alto Aviation School"
 BOL_escuela_de_aviacion_el_alto_desc:0 "A permanent aviation school at El Alto will produce pilots accustomed to thin air and harsh weather."
 BOL_aviacion_de_apoyo_cercano:0 "Close Air Support Aviation"
 BOL_aviacion_de_apoyo_cercano_desc:0 "The army remembers what air support meant in the Chaco. The FAB will learn to fly directly for the soldier on the ground."
 BOL_bombarderos_para_los_andes:0 "Bombers for the Andes"
 BOL_bombarderos_para_los_andes_desc:0 "Light and tactical bombers can strike across valleys, roads and remote supply lines where artillery cannot reach."
 BOL_condores_sobre_los_andes:0 "Condors Over the Andes"
 BOL_condores_sobre_los_andes_desc:0 "A modern FAB will watch the mountains, shield the cities and carry Bolivia's flag over terrain few air forces understand."

 BOL_riqueza_bajo_nuestros_pies:0 "Wealth Beneath Our Feet"
 BOL_riqueza_bajo_nuestros_pies_desc:0 "Tin, oil, rubber and land have made fortunes for others. Bolivia must decide whether that wealth will serve the republic or the old owners."
 BOL_estano_de_oruro_y_potosi:0 "Tin of Oruro and Potosi"
 BOL_estano_de_oruro_y_potosi_desc:0 "The mines of Oruro and Potosi remain the backbone of the national economy, even if tin must be represented through the resources the game provides."
 BOL_banco_minero_de_bolivia:0 "Mining Bank of Bolivia"
 BOL_banco_minero_de_bolivia_desc:0 "Credit, machinery and transport contracts can bring order to the mines while giving the state leverage over production."
 BOL_pact_with_patio_hoch_and_aramayo:0 "Pact with Patino, Hochschild and Aramayo"
 BOL_pact_with_patio_hoch_and_aramayo_desc:0 "The tin barons can be coerced into funding national development, though every concession leaves the Rosca breathing."
 BOL_break_the_tin_barons:0 "Break the Tin Barons"
 BOL_break_the_tin_barons_desc:0 "The mining oligarchy has ruled from behind ledgers and foreign accounts for too long. The state and the miners will take the initiative."
 BOL_fundiciones_de_oruro:0 "Oruro Smelters"
 BOL_fundiciones_de_oruro_desc:0 "Bolivia should not merely dig ore and watch the profit leave. Smelters in Oruro will anchor a heavier industrial base."
 BOL_cob_mine_committees:0 "COB Mine Committees"
 BOL_cob_mine_committees_desc:0 "The mine unions are not just a pressure group; they can become an organized force in production and revolutionary defense."
 BOL_quina_y_goma_del_beni:0 "Quinine and Rubber of Beni"
 BOL_quina_y_goma_del_beni_desc:0 "The northern lowlands hold rubber, quinine and routes that tie Bolivia to the Amazonian world."
 BOL_rubber_and_quinine_trails:0 "Rubber and Quinine Trails"
 BOL_rubber_and_quinine_trails_desc:0 "Opening trails and depots through Beni will turn isolated extraction into a planned frontier economy."
 BOL_tropical_medicine_posts:0 "Tropical Medicine Posts"
 BOL_tropical_medicine_posts_desc:0 "Settlers, soldiers and workers cannot build the Oriente if disease defeats them first."
 BOL_colonizacion_de_santa_cruz_y_beni:0 "Colonization of Santa Cruz and Beni"
 BOL_colonizacion_de_santa_cruz_y_beni_desc:0 "The eastern lowlands will no longer be treated as a distant afterthought. Colonization bureaus will bring roads, clinics and new farms."
 BOL_petroleo_del_oriente:0 "Oil of the Oriente"
 BOL_petroleo_del_oriente_desc:0 "The eastern oilfields promise fuel, bargaining power and a way to loosen Bolivia's dependence on tin."
 BOL_refinerias_de_santa_cruz:0 "Santa Cruz Refineries"
 BOL_refinerias_de_santa_cruz_desc:0 "Refining oil inside Bolivia will give YPFB more than a flag; it will give the state real industrial muscle."
 BOL_pipeline_to_the_altiplano:0 "Pipeline to the Altiplano"
 BOL_pipeline_to_the_altiplano_desc:0 "Oil from the east must reach the highland cities, arsenals and rail lines if it is to transform the whole country."
 BOL_ferrocarril_transandino:0 "Trans-Andean Railway"
 BOL_ferrocarril_transandino_desc:0 "Rail and road links between mines, valleys and frontier towns can finally make Bolivia feel like one economy."
 BOL_plan_bohan_boliviano:0 "Bolivian Bohan Plan"
 BOL_plan_bohan_boliviano_desc:0 "The Bohan Plan points toward roads, agriculture, oil and lowland settlement: a practical blueprint for a less fragile Bolivia."
 BOL_industria_militar_de_la_paz:0 "La Paz Military Industry"
 BOL_industria_militar_de_la_paz_desc:0 "The capital's workshops and arsenals will turn mining wealth into rifles, shells and repair capacity."
 BOL_tin_export_royalties:0 "Tin Export Royalties"
 BOL_tin_export_royalties_desc:0 "If the Rosca is allowed to live, it must pay for the privilege. Export royalties will turn private tin fortunes into public works."
 BOL_comibol_y_la_nacionalizacion:0 "COMIBOL and Nationalization"
 BOL_comibol_y_la_nacionalizacion_desc:0 "A national mining corporation can transform the revolution's slogans into control over Bolivia's most important export."
 BOL_santa_cruz_agricultural_pivot:0 "Santa Cruz Agricultural Pivot"
 BOL_santa_cruz_agricultural_pivot_desc:0 "The eastern plains can feed cities, supply industry and become a new pole of national development."
 BOL_agrarian_reform_commissions:0 "Agrarian Reform Commissions"
 BOL_agrarian_reform_commissions_desc:0 "The hacienda order cannot survive untouched. Reform commissions will carry the revolution into the countryside."
 BOL_revolucion_economica_de_1952:0 "A Modern National Economy"
 BOL_revolucion_economica_de_1952_desc:0 "Mines, oil, land and labor are being pulled into one national project. Bolivia will no longer be rich only on paper."
