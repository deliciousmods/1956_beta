 south_american_events.63.t:0 "Death of Germán Busch Becerra"
 south_american_events.63.d:0 "After fierce and undying media pressure on Becerra's government, it has been reported that Germán Busch Becerra has taken his own life just this afternoon. Many of his family members as well as his coworkers have cited that there appeared to be nothing unusual or strange about Becerra's behavior. Nonetheless, this has put the country in complete shock, with many of the political rivals of Becerra already vying for power. The future of Bolivia is uncertain."
 south_american_events.63.a:0 "Elections must take place immediately!"
 south_american_events.63.b:0 "Set up a provisional government."
 