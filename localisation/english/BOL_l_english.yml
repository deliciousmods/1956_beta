 form_peru_bolivia_category_category:0 "Revive the Peru-Bolivian Confederation"
 form_peru_bolivia_category_category_desc:0 "Separated for much of their history, there was a short period when Peru and Bolivia were united in a single confederation that could compete with its various neighbors. Now that our two nations are back under the same flag, we could proclaim the restoration of the Peru-Bolivian Confederation."
 BOL_invite_vicente_rojo:0 "Invite Vicente Rojo"

 BOL_yacimientos_petroliferos_fiscales_bolivianos:0 "Yacimientos Petrolíferos Fiscales Bolivianos"

 spanish_emigres_decisions:0 "The Fate of the Spanish Republicans"

 BOL_military_socialist:0 "Military Socialist"

 # Existing Bolivia spirits
 BOL_defeated_people:0 "Defeated People"
 BOL_defeated_people_desc:0 "The Chaco War left Bolivia humiliated, exhausted and uncertain of its future."
 BOL_defeated_people_2:0 "Defeated People"
 BOL_defeated_people_2_desc:0 "The shock of defeat is fading, but the army and public still carry the scars of the Chaco."
 BOL_defeated_people_3:0 "Defeated People"
 BOL_defeated_people_3_desc:0 "Bolivia is beginning to recover its confidence, though the wounds of the war remain."
 BOL_unarmed_army:0 "Unarmed Army"
 BOL_unarmed_army_desc:0 "The army has been politically broken and materially neglected."
 BOL_a_new_national_pride:0 "A New National Pride"
 BOL_a_new_national_pride_desc:0 "Bolivians are rediscovering confidence after years of defeat and crisis."
 BOL_week_republic:0 "Weak Republic"
 BOL_week_republic_desc:0 "The state is fragile, divided and unable to command full loyalty."
 BOL_week_republic_2:0 "Weak Republic"
 BOL_week_republic_2_desc:0 "The republic is still weak, but the worst paralysis has begun to ease."
 BOL_gamonal_society:0 "Gamonal Society"
 BOL_gamonal_society_desc:0 "Rural bosses, landowners and mine interests still shape much of Bolivian life."
 BOL_gamonal_society_2:0 "Entrenched Gamonal Society"
 BOL_gamonal_society_2_desc:0 "The old social order has dug itself into the state, resisting any serious reform."
 BOL_eliminated_gamonales:0 "Gamonales Broken"
 BOL_eliminated_gamonales_desc:0 "The old rural bosses have been broken, opening space for a new social order."
 BOL_aymara_support:0 "Aymara Support"
 BOL_aymara_support_desc:0 "Aymara communities are mobilizing behind the state and demanding a voice in it."
 BOL_toll_of_the_chaco_war:0 "Toll of the Chaco War"
 BOL_toll_of_the_chaco_war_desc:0 "The cost of the Chaco War still weighs on recruitment, morale and national confidence."
 BOL_toll_of_the_chaco_war_2:0 "Crushing Toll of the Chaco War"
 BOL_toll_of_the_chaco_war_2_desc:0 "The Chaco defeat has left the country demoralized and slow to mobilize."
 BOL_plurinational_democracy:0 "Plurinational Democracy"
 BOL_plurinational_democracy_desc:0 "Bolivia is trying to build a state that includes the peoples once kept outside the republic."
 BOL_era_of_national_regression:0 "Era of National Regression"
 BOL_era_of_national_regression_desc:0 "A maximalist national project is straining the state and alarming its neighbors."
 BOL_empresa_nacional_ferrocarriles_del_estado:0 "Empresa Nacional de Ferrocarriles del Estado"

 south_american_events.63.t:0 "Death of Germán Busch Becerra"
 south_american_events.63.d:0 "After fierce and undying media pressure on Becerra's government, it has been reported that Germán Busch Becerra has taken his own life just this afternoon. Many of his family members as well as his coworkers have cited that there appeared to be nothing unusual or strange about Becerra's behaviour. Nonetheless, this has put the country in complete shock, with many of the political rivals of Becerra already vying for power. The future of Bolivia is uncertain."
 south_american_events.63.a:0 "Elections must take place immediately!"
 south_american_events.63.b:0 "Set up a provisional government."

 # Bolivia national spirits
 BOL_military_socialism:0 "Military Socialism"
 BOL_military_socialism_desc:0 "The army has stepped into politics as a reforming force, promising national renewal after the humiliation of the Chaco War."
 BOL_ypfb_state_oil:0 "State Oil Enterprise"
 BOL_ypfb_state_oil_desc:0 "Bolivia's oilfields are being pulled into the hands of the state, giving La Paz leverage over foreign companies and new tools for development."
 BOL_busch_labor_code:0 "Busch's Labor Code"
 BOL_busch_labor_code_desc:0 "Labor law, social reform and nationalist discipline are binding workers to the state."
 BOL_worker_militias:0 "Worker Militias of the Altiplano"
 BOL_worker_militias_desc:0 "Armed workers and veterans organize around the mines and highland towns, ready to defend the revolution."
 BOL_state_mining_control:0 "State Mining Control"
 BOL_state_mining_control_desc:0 "The tin economy is being bent toward national priorities, even as the old mine owners resist every decree."
 BOL_revolutionary_export:0 "Export the Revolution"
 BOL_revolutionary_export_desc:0 "Bolivia's revolution will not remain trapped behind the Andes."
 BOL_bohan_plan:0 "Bohan Development Plan"
 BOL_bohan_plan_desc:0 "Roads, agriculture and eastern settlement are reshaping Bolivia's economic map."
 BOL_lost_sea_campaign:0 "Sea for Bolivia"
 BOL_lost_sea_campaign_desc:0 "The memory of the lost coast has become a national project, whether through diplomacy, pressure or war."
 BOL_technocratic_junta:0 "Technocratic Junta"
 BOL_technocratic_junta_desc:0 "Officers and civilian experts are trying to stabilize the state before ideology tears it apart."
 BOL_state_of_siege:0 "State of Siege"
 BOL_state_of_siege_desc:0 "The regime governs through emergency powers, censorship and military pressure."
 BOL_tin_for_the_allies_idea:0 "Tin for the Allies"
 BOL_tin_for_the_allies_idea_desc:0 "Bolivian tin has become a strategic export, tying the republic to the Allied war economy."
 BOL_radepa_cells:0 "RADEPA Cells"
 BOL_radepa_cells_desc:0 "Young nationalist officers conspire through secret networks inside the army."
 BOL_villarroel_nationalism:0 "Villarroel's Nationalism"
 BOL_villarroel_nationalism_desc:0 "The government seeks a new pact with workers, soldiers and indigenous communities."
 BOL_indigenous_congress_idea:0 "Indigenous Congress"
 BOL_indigenous_congress_idea_desc:0 "Indigenous leaders have forced their demands into national politics."
 BOL_rosca_restoration:0 "Rosca Restoration"
 BOL_rosca_restoration_desc:0 "The mine oligarchy has clawed its way back into power, stabilizing production while poisoning legitimacy."
 BOL_mnr_revolution:0 "MNR Revolution"
 BOL_mnr_revolution_desc:0 "The National Revolution has broken the old order and opened a dangerous, thrilling new chapter."
 BOL_universal_suffrage_idea:0 "Universal Suffrage"
 BOL_universal_suffrage_idea_desc:0 "The vote is no longer the guarded privilege of a narrow republic."
 BOL_comibol_idea:0 "COMIBOL"
 BOL_comibol_idea_desc:0 "The national mining corporation now stands at the center of Bolivia's revolutionary economy."
 BOL_agrarian_reform_idea:0 "Agrarian Reform"
 BOL_agrarian_reform_idea_desc:0 "The hacienda order is being broken apart and land is being redistributed to rural communities."
 BOL_cob_power:0 "Power of the COB"
 BOL_cob_power_desc:0 "Organized labor has become one of the pillars of the new Bolivian state."
 BOL_revolutionary_militias:0 "Revolutionary Militias"
 BOL_revolutionary_militias_desc:0 "Militias answer the call of the revolution, though their autonomy makes every cabinet meeting nervous."
 BOL_fsb_corporatism:0 "FSB Corporatism"
 BOL_fsb_corporatism_desc:0 "The Falange offers order, hierarchy and mobilization under a nationalist corporate state."
 BOL_falangist_state:0 "Falangist State"
 BOL_falangist_state_desc:0 "The movement has fused Catholic corporatism, military discipline and Andean myth into a hard new regime."
 BOL_ayllu_order:0 "Ayllu Political Order"
 BOL_ayllu_order_desc:0 "Communal structures are being elevated into the organizing principle of the state."
 BOL_red_ayllu:0 "Red Ayllu"
 BOL_red_ayllu_desc:0 "Aymara communal tradition and revolutionary socialism have found a volatile common language."
 BOL_tawantinsuyu_project:0 "Tawantinsuyu Project"
 BOL_tawantinsuyu_project_desc:0 "The Andean revolution imagines itself as the rebirth of an older continental order."
 BOL_altiplano_army:0 "Army of the Altiplano"
 BOL_altiplano_army_desc:0 "The army is being rebuilt around the hard lessons of mountain, desert and jungle warfare."
 BOL_landlocked_navy:0 "Landlocked Navy"
 BOL_landlocked_navy_desc:0 "Bolivia may lack a coast, but it refuses to surrender the idea of naval power."
 BOL_fuerza_aerea:0 "Fuerza Aerea Boliviana"
 BOL_fuerza_aerea_desc:0 "A modern air arm is being built for a country of mountains, distances and difficult borders."
 BOL_economic_miracle:0 "Bolivian Economic Miracle"
 BOL_economic_miracle_desc:0 "Mines, roads, oil and settlement projects are finally moving in the same direction."
 BOL_chaco_reformed_army:0 "Reformed Chaco Army"
 BOL_chaco_reformed_army_desc:0 "The army has absorbed the bitter lessons of the Chaco War and reorganized itself for Bolivia's mountains, deserts and lowlands."
 BOL_titicaca_flotilla:0 "Titicaca Flotilla"
 BOL_titicaca_flotilla_desc:0 "Bolivia's naval ambitions survive on Lake Titicaca, the Amazonian rivers and the stubborn memory of the lost coast."
 BOL_condor_air_force:0 "Condor Air Force"
 BOL_condor_air_force_desc:0 "The Fuerza Aerea Boliviana is learning to fight across altitude, distance and dangerous weather."
 BOL_mining_state_complex:0 "State Mining Complex"
 BOL_mining_state_complex_desc:0 "The state, the mines and the new industrial program have been bound together into a single development machine."
 BOL_mining_credit_system:0 "Mining Credit System"
 BOL_mining_credit_system_desc:0 "A national credit network gives the mines the machinery, transport and liquidity they need, while binding their output closer to the state."
 BOL_miner_worker_control:0 "Miner Worker Control"
 BOL_miner_worker_control_desc:0 "Armed miners and union committees now hold real power in the pits, raising output and revolutionary energy at the cost of political calm."
 BOL_lowland_development:0 "Lowland Development Drive"
 BOL_lowland_development_desc:0 "Roads, medical posts and colonization bureaus are pushing the republic toward Santa Cruz, Beni and the eastern frontier."
 BOL_oriente_oil_push:0 "Oriente Oil Push"
 BOL_oriente_oil_push_desc:0 "YPFB engineers and state planners are turning the eastern oilfields into a pillar of national development."
 BOL_andes_to_amazon_railway:0 "Andes-to-Amazon Railway"
 BOL_andes_to_amazon_railway_desc:0 "A rail and road network tying the highlands to the Amazon would redraw Bolivia's economic geography."
 bolivia.10.t:0 "The Direction of Military Socialism"
 bolivia.10.d:0 "The revolution born from the Chaco crisis has reached a crossroads. Officers, workers and reformers all claim to speak for the nation, but Bolivia can only march under one command."
 bolivia.10.a:0 "The revolution must choose its road."
 bolivia.20.t:0 "The Fall of Villarroel"
 bolivia.20.d:0 "The coalition that carried Villarroel to power has shattered. Crowds, students, workers and the old political class have turned La Paz into a battlefield of memory and vengeance."
 bolivia.20.a:0 "Bolivia enters another hard season."
 bolivia.21.t:0 "The Stolen Election"
 bolivia.21.d:0 "The MNR has proven its strength at the ballot box, but the old order refuses to hand over the republic. The crisis is no longer parliamentary. It is revolutionary."
 bolivia.21.a:0 "The streets will answer."

