 MAN_kwantung_marches_north: "Kwantung Marches North"
 MAN_communist_cells: "Communist Cells"
 MAN_eastasian_order: "Manchuria in the East Asian Order"
 MAN_a_walk_to_capitalism: "A Walk to Capitalism"
 MAN_a_walk_to_capitalism_desc: "The key to long term economic growth lies with capitalism. If we are to thrive, we must embrace this."
 MAN_liberalize_the_economy: "Liberalize the Economy"
 MAN_liberalize_the_economy_desc: "To implement this policy of capitalism, it is necessary to liberalize the economy and ensure long term growth."
 MAN_slash_tax_rates: "Slash Tax Rates"
 MAN_slash_tax_rates_desc: "We will slash the tax rates for businesses, helping to ensure that business can flourish in Manchuria."
 MAN_dole_out_starting_capital: "Dole out Starting Capital"
 MAN_dole_out_starting_capital_desc: "To further increase the strength of our businesses, starting capital will be doled out."
 MAN_a_prosperous_manchuria: "A Prosperous Manchuria"
 MAN_a_prosperous_manchuria_desc: "It is done, Manchuria is a prosperous state. The people now will have all their needs met and go into a prosperous time."
 MAN_support_interest_of_the_buisness_owners: "Support Business Interests"
 MAN_support_interest_of_the_buisness_owners_desc: "With the economy becoming ever more capitalist, we will make sure to enshrine the interest of the business owners in our state, helping them boost the economy."
 MAN_sacrfice_for_the_state: "Sacrifice for the State"
 MAN_sacrfice_for_the_state_desc: "The People must sacrifice for the Manchurian State, giving all they have for it to ensure that we will be victorious."
 MAN_total_economic_coherance_3: "Total Economic Coherence"
 MAN_total_economic_coherance_3_desc: "The continuous reforms undertaken by the Manchurian government have culminated in a perfectly organized and efficient Imperial Economy organized from top to bottom. Like a well-oiled machine our economy can now serve the demands of the Emperor and of course the demands of the Manchurian people."
 MAN_support_workers_rights: "Support Workers Rights"
 MAN_support_workers_rights_desc: "We will support the rights of workers in our nation. This will ensure that they are happy to work for us."
 MAN_begin_socialist_reforms: "Begin Socialist Reforms"
 MAN_begin_socialist_reforms_desc: "Manchuria has been helped much by its socialist allies, as a reward, we will implement some of their policies in the nation."
 MAN_expropriate_the_japanese_sympathisers: "Expropriate the Japanese Sympathizers"
 MAN_expropriate_the_japanese_sympathisers_desc: "The Japanese Sympathizers have done much to damage our nation. They must be expropriated and their assets redistributed for the good of our state and people."
 MAN_bring_about_social_justice_by_state_methods: "Social Justice by the Sword"
 MAN_bring_about_social_justice_by_state_methods_desc: "Social Justice must be brought about. There must be no stopping of this. All sacrifices must be made."
 MAN_nationalize_the_industries: "Nationalize the Industries"
 MAN_nationalize_the_industries_desc: "The Capitalists and industrialists have done much to hurt our people. Their assets will be nationalized and used for the good of our people."
 MAN_a_state_for_the_people: "A State for the People"
 MAN_a_state_for_the_people_desc: "Manchuria has become a state for the people. All are taken care of and will benefit."
 MAN_the_kwantung_withdrawal: "The Kwantung Withdrawal"
 MAN_the_kwantung_withdrawal_desc: "With most of the Kwantung Army withdrawn, we shall now chase out the rest. Manchuria will be free!"
 MAN_invest_in_a_modern_tank_force: "Invest in a Modern Tank Force"
 MAN_invest_in_a_modern_tank_force_desc: "The State must invest in a modern tank force, securing the power of the army and ensuring our safety for the years to come."
 MAN_consolidate_internal_politics: "Consolidate Internal Politics"
 MAN_consolidate_internal_politics_desc: "It is time to consolidate our internal politics, securing the future and stability of the state."
 MAN_break_the_notion_of_the_past: "Break the Notion of the Past"
 MAN_break_the_notion_of_the_past_desc: "In the past Manchuria was considered an inalienable part of China, even by the old Qing. The new emperor has recognized that this is not the case! Manchuria is a unique state. Manchuria will forge its own future."
 MAN_forging_a_unique_identity: "Forging a Unique Identity"
 MAN_forging_a_unique_identity_desc: "Manchuria will forge a unique identity, one merging cultures of many ethnic groups into a unique concoction never seen before throughout the entire world. We are the future of Asia and the world!"
 MAN_greater_manchuria_theory: "Greater Manchuria Theory"
 MAN_greater_manchuria_theory_desc: "We will commit to the idea of a greater Manchuria, reclaiming the lands Russia has occupied from us. Manchuria will be made great again!"
 MAN_integrate_the_frontier: "Integrate the Frontier"
 MAN_integrate_the_frontier_desc: "Having reclaimed several of our old provinces, it is now time to integrate them, securing our power in the area and fully uniting the nation!"
 MAN_deal_with_kwantung_remnants: "Deal with Kwantung Remnants"
 MAN_deal_with_kwantung_remnants_desc: "Japan and the Kwantung armies still hold on to major chunks of our lands. We must push them out and destroy them and free our people."
 MAN_abide_by_the_constitution: "Draft a new Constitution"
 MAN_abide_by_the_constitution_desc: "With the overthrow of the Japanese puppet state, we have long had no constitution, being ruled by strongmen. The time has come to end this and finally write up a new constitution."
 MAN_manchurian_constitutionalism: "Full Subordination to the Constitution"
 MAN_manchurian_constitutionalism_desc: "The emperor has decided to fully submit to the authority of the Constitution, becoming a constitutional monarchy, allowing for more freedom for our people!"
 MAN_rule_by_decree: "Rule by Decree"
 MAN_rule_by_decree_desc: "Puyi will continue to simply rule by decree, allowing for near dictatorial power over the nation under the Emperor."
 MAN_centralizing_authority: "Centralizing Authority"
 MAN_centralizing_authority_desc: "We must centralize our authority in the nation, securing the regime and the Emperor's eternal rule!"
 MAN_his_wish_our_command: "His Wish, Our Command"
 MAN_his_wish_our_command_desc: "The People shall submit to the wish of the Emperor, his work is divine and the People will obey!"
 MAN_the_qing_restoration: "The Qing Restoration"
 MAN_the_qing_restoration_desc: "With our success in the Harbin Congress, the monarchy has been entrenched in Manchuria! Hail the return of the Qing!"
 MAN_the_manchu_restoration: "Entrench Manchu Hegemony"
 MAN_the_manchu_restoration_desc: "Manchu Hegemony will be in our lands, securing our eternal return to power. No more will Manchus be oppressed by the Han or Japanese."
 MAN_the_hope_of_seperatism_desc: "Manchuria lives with the goal of achieving it's sovereignty and splitting off from the degenerates in China."
 MAN_the_hope_of_seperatism_tt: "For each Chinese core state you own, that is not your core, receive:\n Consumer Goods Factories §Y1.5%§! \n Stability §R-1.50% §!\n Resistance Target §R+2%§!\n Resistance Growth Speed: §R+2%§!\n Compliance Growth Speed §R-1%§!"
 MAN_open_the_mining_industry_for_investments_desc: "We will Open the mining industry for investments, ensuring that the economy can be built up to a powerful force."
 MAN_expand_state_resource_extraction_desc: "The Resources extracted by the state must be expanded. The economy will be booming."


 MAN_greatly_increase_tenko_measures: "Greatly Increase Tenko Measures"
 MAN_greatly_increase_tenko_measures_desc: "Kwantung will greatly increase our measures in brainwashing the people. They must be loyal to the emperor and not their socialist ideology, even if that is why they left Japan for Manchuria."
 MAN_raid_the_social_research_unit: "Raid the Social Research Unit"
 MAN_raid_the_social_research_unit_desc: "To deal with Socialism, the Social research unit and it's communist sympathizers are to be raided. Manchuria must be made free of these imbeciles!"
 MAN_enforce_japanese_cultural_norms: "Enforce Japanese Cultural Norms"
 MAN_enforce_japanese_cultural_norms_desc: "Japanese Cultural Norms must be enforced, ensuring that we have a state free of this leftist thought from the settlers."
 MAN_consolidate_control_over_the_state: "Consolidate Control Over the State"
 MAN_consolidate_control_over_the_state_desc: "With Kwantung having so much influence in Manchuria, it is now time to fully consolidate it. None will question the Army and none will question the emperor!"
 MAN_fully_sideline_kwantung: "Fully Sideline Kwantung"
 MAN_fully_sideline_kwantung_desc: "We will fully sideline the weakened Kwantung Army, leaving the regime to achieve its goals instead."
 MAN_kwantungs_power_secured: "Kwantung's Power Secured"
 MAN_kwantungs_power_secured_desc: "The Kwantung Army has now fully consolidated it's power. All hail the Kwantung army!"
 MAN_our_part_in_the_new_eastasian_order: "Our Part in the New East Asian Order"
 MAN_our_part_in_the_new_eastasian_order_desc: "Our Troops now march to help our overlords in their attempt to liberate Asia from the colonizers. soon Asia will be free!"
 MAN_a_bent_knee_before_the_emporer: "A Bent Knee Before the Emperor"
 MAN_a_bent_knee_before_the_emporer_desc: "Puyi Bends his knees before our great overlords and the Japanese Empire. It is our duty to submit to them."
 MAN_kwantung_finally_marches_south: "Kwantung Finally Marches South"
 MAN_kwantung_finally_marches_south_desc: "It is now finally time for Kwantung to March South and fight for the rest of China. Soon it too will be pacified."
 MAN_sino_japanese_basic_treaty: "Sino-Japanese Basic Treaty"
 MAN_sino_japanese_basic_treaty_desc: "With A Collaboration Regime set up in Nanjing, the cabinet will have them sign a new treaty with us, recognizing Manchukuo as an independent state. This will boost our legitimacy and make us a truly legitimate state!"
 MAN_full_seperation_from_china: "Full Separation from China"
 MAN_full_seperation_from_china_desc: "With China now secured in the Japanese sphere, Japanese backing will force them to withdraw from our lands and affirm the Sino-Japanese Basic Treaty, recognizing the People of Manchukuo."
 MAN_expand_kwantung_influence_in_china: "Expand Kwantung Influence in China"
 MAN_expand_kwantung_influence_in_china_desc: "With Kwantung having played a not unimportant role in liberating China, they will expand their influence there and seize some of their assets."
 MAN_the_fight_for_the_continent: "The Fight for the Continent"
 MAN_the_fight_for_the_continent_Desc: "The war with the Russians for the Asian continent has begun. Soon our forces will defeat them and liberate greater Manchuria!"
 MAN_embrace_the_status_quo: "Embrace the Status Quo"
 MAN_embrace_the_status_quo_desc: "It is clear that Japan and the Kwantung Army have certain goals for our state. The Manchurian state is obligated to work with them to help ensure their success, using us as a state to split off from China and enriching our own state along with that of Japan."
 MAN_the_empire_of_great_manchuria: "The Empire of Great Manchuria"
 MAN_the_empire_of_great_manchuria_desc: "It is time to declare the Empire of Great Manchuria, beginning to cement our own Identity in opposition to the Chinese one."
 MAN_increase_japanese_settlements: "Increase Japanese Settlements"
 MAN_increase_japanese_settlements_desc: "Great investments will be made to Increase Japanese Settlements in our country, making sure to use their funds to build up our country."
 MAN_a_truly_non_han_identity: "A Truly Non-Han Identity"
 MAN_a_truly_non_han_identity_desc: "With so many Japanese and diverse ethnic minorities in our land, we can begin to cement an identity that is completely different from the rest of China's. All Hail Manchuria!"
 MAN_bedrock_of_the_japanese_economy: "Bedrock of the Japanese Economy"
 MAN_bedrock_of_the_japanese_economy_desc: "We have now become the bedrock of the Japanese economy, supplying them, let us leverage this for our own economic benefit."
 MAN_pacify_the_countryside_2: "Pacify the Countryside"
 MAN_pacify_the_countryside_2_desc: "Ever since we have come to power, outlaws and rebels have tried to contest our rule in the more remote areas of the country. If we want to be taken seriously as a government, we need to root out these terrorists and show the population that we can enforce our rule."
 MAN_army_modernization_2: "Army Modernization"
 MAN_army_modernization_2_desc: "Our Army is both small and outdated. Given our available resources, this is unacceptable. We must be able to pull our weight."
 MAN_mukden_military_academy_2: "Mukden Military Academy"
 MAN_mukden_military_academy_2_desc: "Our army needs good and loyal officers to lead it if we ever want to rely on more than just mass to achieve our objectives."
 MAN_invite_japanese_settlers_2: "Invite Japanese Settlers"
 MAN_invite_japanese_settlers_2_desc: "We have far more space than we have people. Large areas of the country remain essentially wilderness. We should settle people in these areas to form new communities and allow for more economical development."
 MAN_collective_farms_2: "Collective Farms"
 MAN_collective_farms_2_desc: "The system of individual farms owned and operated by single families is both backwards and inefficient. Combining all the manpower and land of a village into a single entity allows for much more efficient development."
 MAN_law_university_2: "Law University"
 MAN_law_university_2_desc: "Our country is still young. We have a real opportunity to create an entirely new system of laws, based on the most modern understanding of government. To do so, we should create a specialized facility to bring together some of the brightest minds in Asia."
 MAN_research_and_education_department_2: "Research And Education Department"
 MAN_research_and_education_department_2_desc: "As our nation grows, we need to ensure that our education and research facilities grow to match it. Greater efforts must be made to ensure that our research efforts are focused where they are needed most."
 MAN_trade_delegation_2: "Trade Delegation"
 MAN_trade_delegation_2_desc: "The rest of the world is further ahead in industrial methods than we are. We should send out a delegation to study their techniques to find ways to improve our own."
 MAN_expand_the_textile_industry_2: "Expand the Textile Industry"
 MAN_expand_the_textile_industry_2_desc: "Our textile works have long been the mainstay of our industry, and will be the easiest way to acquire more foreign capital to expand our industrial base."
 MAN_obedience_2: "Obedience"
 MAN_obedience_2_desc: "Some call us a mere puppet of the Japanese, but they fundamentally misunderstand our close and equal relationship. To go against our benefactors would be the same as a child going against its parents."
 MAN_hoankyoku_2: "Hoankyoku"
 MAN_hoankyoku_2_desc: "Our government is the best hope China has for a bright future. Clearly, many people have an interest in ensuring its destruction. We must have an organization that will hunt these people down and protect our state."
 MAN_first_five_year_plan_2: "First Five Year Plan"
 MAN_first_five_year_plan_2_desc: "Although tainted by the association with communism, the five-year-plan is a valuable tool in planning the economic development of a country. We should implement such a plan to steer the expansion of our industry."
 MAN_invite_japanese_investors_2: "Invite Japanese Investors"
 MAN_invite_japanese_investors_2_desc: "Developing our country will require outside help. A number of companies in Japan have indicated that they are willing to invest in our nation."
 MAN_expand_the_railways_2: "Expand the Railways"
 MAN_expand_the_railways_2_desc: "A modern railway system is key to connecting all parts of our nation and bringing it together under one roof."
 MAN_develop_aluminum_sources_2:0 "Develop Aluminum Sources"
 MAN_develop_aluminum_sources_2_desc:0 "We have extensive deposits of Bauxite in Liaoning that are ripe for exploitation. They will provide a vital boost to our aviation industry."
 MAN_expand_showa_steel_works_2:0 "Expand Showa Steel Works"
 MAN_expand_showa_steel_works_2_desc:0 "The Showa Steel Works form the backbone of our heavy industry. Investing in them will allow us to reap the benefits later."
 MAN_social_research_unit_2:0 "Social Research Unit"
 MAN_social_research_unit_2_desc:0 "We should set up a special unit to research the ways and customs of our people, so that we can better guide them to become productive citizens of the nation."
 MAN_second_five_year_plan_2:0 "Second Five Year Plan"
 MAN_second_five_year_plan_2_desc:0 "With the success of the First Five Year Plan, it only makes sense that we should repeat it with another economic development plan."
 MAN_national_defense_state_2:0 "National Defense State"
 MAN_national_defense_state_2_desc:0 "Until the war is won and we have returned to rule all of China, we must make every effort, be willing to make every sacrifice and use every available resource to wage the war."
 MAN_mukden_arsenal_2:0 "Mukden Arsenal"
 MAN_mukden_arsenal_2_desc:0 "The old Imperial Arsenal will form the core of a new military-industrial complex that will supply our army with modern weapons."
 MAN_mamc_2:0 "MAMC"
 MAN_mamc_2_desc:0 "Forming the Manchurian Aircraft Manufacturing Company will give us a way to build a modern air force, capable of standing up to any other."
 MAN_alliance_with_the_kwantung_army_2:0 "Alliance With the Kwantung Army"
 MAN_alliance_with_the_kwantung_army_2_desc:0 "The Japanese forces in the country are often at odds with our ideas. We should forge a closer connection with them to ensure we work together with as little conflict as possible."
 MAN_chinese_leadership_2:0 "Chinese Leadership"
 MAN_chinese_leadership_2_desc:0 "The Chinese people need a Chinese leader. We should publicly declare that we aim at nothing less than the full restoration of the Imperial Rule over all of China."
 MAN_vassalize_mengukuo_2:0 "Vassalize Mengkukuo"
 MAN_vassalize_mengukuo_2_desc:0 "The Prince of Mengkukuo is not fit to stand side by side with the Emperor of Manchukuo. It is time we end this silly experiment and put him in his proper place."
 MAN_national_cooperation_government_2:0 "National Cooperation Government"
 MAN_national_cooperation_government_2_desc:0 "We have received disturbing rumors that the Japanese are considering other Chinese politicians - commoners - to form a collaboration government. This is unacceptable. We must ensure that any Chinese territory taken by our combined forces is administered by us."
 MAN_the_two_emperors_2:0 "The Two Emperors"
 MAN_the_two_emperors_2_desc:0 "The time has come to an end the absurd notion that we are anything but fully equal partners of the Japanese. Our two Emperors are like brothers!"
 MAN_assertiveness_2: "Assertiveness"
 MAN_assertiveness_2_desc: "The Japanese continue to rule over us with an infuriating arrogance. We should remind them that we, too, are an Empire worthy of respect."
 MAN_request_control_of_the_railways_2: "Request Control of the Railways"
 MAN_request_control_of_the_railways_2_desc: "In a country as big as ours, controlling the railways means controlling the country. \n\nAnd the Japanese control the railroads.\n\n That has to change."
 MAN_staff_the_court_with_manchus_2:0 "Staff the Court With Manchus"
 MAN_staff_the_court_with_manchus_2_desc:0 "The Qing dynasty has ruled China for centuries. If we want to reclaim our former glory, we must ensure that we follow their example as closely as possible."
 MAN_expand_the_imperial_guards_2:0 "Expand the Imperial Guards"
 MAN_expand_the_imperial_guards_2_desc:0 "The Imperial Guard will form the elite of our new army and will be an example for all of our soldiers to aspire to."
 MAN_local_arms_procurement_2:0 "Local Arms Procurement"
 MAN_local_arms_procurement_2_desc:0 "We can not rely on the Japanese to supply us with guns forever. If we want to come into our own, we need a source of weapons that we control."
 MAN_five_equal_peoples_2:0 "Five Equal Peoples"
 MAN_five_equal_peoples_2_desc:0 "The days in which one people could rule supreme over all others are over. Manchukuo will be a new type of nation, in which five people - Russians, Japanese, Mongolians, Koreans and Manchus - will live together in harmony."
 MAN_white_russian_advisers_2:0 "White Russian Advisers"
 MAN_white_russian_advisers_2_desc:0 "After the Russian civil war, a number of Russians preferred exile to whatever fate the Soviets had planned for their defeated enemies. We could use these people to rebuild and train our army."
 MAN_empower_the_legislative_council_2:0 "Empower the Legislative Council"
 MAN_empower_the_legislative_council_2_desc:0 "The Legislative Council is currently little more than a ceremonial body that agrees to whatever our Japanese overlords put before it. If we want to become a real sovereign nation, we must have full autonomy in our legislative matters first."
 MAN_five_people_armies_2:0 "Five People Armies"
 MAN_five_people_armies_2_desc:0 "If every citizen is equal, then every citizen must be equally ready and willing to defend it against foreign oppressors."

 MAN_purge_the_general_affairs_council_2:0 "Purge the General Affairs Council"
 MAN_purge_the_general_affairs_council_2_desc:0 "The General Affairs Council was put in place by the Japanese to ensure that they had full control over our government. This can not go on. We must eliminate anyone whose loyalty to our government is even slightly suspect."
 MAN_independence_war_2:0 "Independence War"
 MAN_independence_war_2_desc:0 "The time has come to throw off the shackles of oppression and fight for our ancient freedoms. Manchukuo will be the first part of China that breathes free from all foreign oppression."
 MAN_imperial_divinity_2:0 "Imperial Divinity"
 MAN_imperial_divinity_2_desc:0 "In times past, the Emperors of China were revered as living gods. We must reconnect the current Emperor to this ancient tradition."
 MAN_imperial_university_2:0 "Imperial University"
 MAN_imperial_university_2_desc:0 "The Empire requires bright people to further its cause. We should create a place where the best and brightest of our people come together to teach and learn from one another."
 MAN_move_capitals_2:1 "Move the Capital"
 MAN_move_capitals_2_desc:0 "The ancient capital of all of China has always been Beijing. Now that it is has been retaken, we can return the Emperor in triumph to his old home."
 MAN_claim_the_mandate_of_heaven_2:0 "Claim the Mandate of Heaven"
 MAN_claim_the_mandate_of_heaven_2_desc:0 "Our victories in the war have made it clear that heaven itself has judged the Emperor just and worthy of the Celestial Throne. Any doubt that he is not the legitimate ruler of all of China must vanish in the face of such overwhelming evidence."
 MAN_reclaim_the_empire_2:0 "Reclaim the Empire"
 MAN_reclaim_the_empire_2_desc:0 "Now that we have won our freedom, it is time to carry on the war against the traitors and rebels in the rest of China. We will rule this country, or perish in the attempt."
 MAN_assert_our_authority_2:0 "Assert Our Authority"
 MAN_assert_our_authority_2_desc:0 "The rest of the country is internally divided. None of the usurpers and bandits calling themselves warlords and Chairmen are fit to rule. They will be brought to heel, and our enlightened rule will spread across all of China."
 MAN_offer_vassalization_2:0 "Offer Vassalization"
 MAN_offer_vassalization_2_desc:0 "The war has torn the country apart. We can end it, if we offer those who have so far refused to take a side a place in our court."

 MAN_finish_the_five_year_plan_2:0 "Finish the Five Year Plan"
 MAN_finish_the_five_year_plan_2_desc:0 "Our second five year plan has been fruitful, we just need to put a little more effort into it and our industry will be booming in no time."
 MAN_reclaim_the_entierty_of_manchuria_puppet_2: "Reproach Russian Imperialism"
 MAN_reclaim_the_entierty_of_manchuria_puppet_2_desc: "While China was on its knees, the Russians stole great swathes of Manchuria which they today call Primayure in a naked display of colonial imperialism. Though we attended to the struggle against the western Imperialist powers of the present, time has seen fit to make us do battle with Russians yet again, a chance to right these wrongs!."

 MAN_acquire_kanto_shu_2: "Acquire Kanto-Shu"
 MAN_acquire_kanto_shu_2_desc: "The Japanese authorities are too focused on the war with the Chinese, and they are trying to transfer Kanto-shu to us to lift some of their legislative pressures. We could also gain an important port in the process."

 MAN_for_the_emperor_2: "For the Emperor"
 MAN_for_the_emperor_2_desc: "Our soldiers fight in the name of our glorious and beloved emperor, our victory is assured!"

 MAN_send_cadets_to_japan_2:0 "Send Cadets To Japan"
 MAN_send_cadets_to_japan_2_desc:0 "The lack of military academy in our nation has caused our military officers to lack some experience. We can send them to Japanese academies on the Home Islands to improve this situation."

 MAN_reform_command_structure_2:0 "Reform Command Structure"
 MAN_reform_command_structure_2_desc:0 "Our current command structure is not very efficient, it could use some reforms."

 MAN_restore_the_old_frontier_2:0 "Restore the Old Frontier"
 MAN_restore_the_old_frontier_2_desc:0 "Now that the central plain is under control, the next step in the plan is to regain the lost outer territories."

 MAN_restore_the_tributary_system_2: "Restore the Tributary System"
 MAN_restore_the_tributary_system_2_desc: "With the Empire's tremendous power, surrounding minor nations shall have the chance of being protected by the Great Qing. It would be their honor to be part of the Empire."

 MAN_revive_zongli_yamen_2: "Revive Zongli Yamen"
 MAN_revive_zongli_yamen_2_desc: "The Zongli Yamen was an organization mostly in charge of foreign affairs and technological advancement of the Qing Empire. If the Empire is to compete with the Western powers, the Zongli Yamen shall be an indispensable part of it."

 MAN_revive_the_grand_council_2:0 "Revive the Grand Council"
 MAN_revive_the_grand_council_2_desc:0 "The Grand Council was abandoned when the unsuccessful "Royal Cabinet" was created. Such an important body of the Empire shall be revived and contribute to the glory of the Great Qing Empire again."

 MAN_subjugate_japan_2:0 "Subjugate Japan"
 MAN_subjugate_japan_2_desc:0 "The Japanese shall pay for their humiliation cast upon us. We shall bring them to their knees!"

MAN_reclaim_the_entierty_of_manchuria_2:0 "Rebuke the Amur Annexation"
MAN_reclaim_the_entierty_of_manchuria_2_desc:0 "While our people were at their weakest, the Russians stole great swathes of our ancestral homelands past the river Amur, the part of Manchuria they now call Primayure. With our newfound strength, and the renewal of the mandate of heaven, we can see to it that this grievance is finally avenged with interest."
MAN_qing_romanov_alliance_2:0 "An Olive branch across Siberia"
MAN_qing_romanov_alliance_2_desc:0 "While many among our number wish to lash out against the Russians for their past crimes, times have changed and these two thrones in Asia should instead band together against the perversions of modernity and the Imperialist might of the other great powers."

MAN_winter_training_2:0 "Winter Training"
MAN_winter_training_2_desc:0 "It's cold out there, chapkas are useful."

MAN_manchuria_petroleum_company_2: "Manchuria Petroleum Company"
MAN_manchuria_petroleum_company_2_desc: "Established on the 10th of May 1935, the company enabled a complete Japanese monopoly over the oil exploitation and refining in Manchuria."

MAN_national_martyr_shrine_2: "National Martyr Shrine"
MAN_national_martyr_shrine_2_desc: "The losses of their lives will not be forgotten. They are a sacrifice I willingly accept as a necessity in order to regain my throne."

MAN_support_aikawa_2:0 "Support Aikawa"
MAN_support_aikawa_2_desc:0 "Aikawa Yoshisuke's plan for the national economy of Manchukuo, to establish a zaibatsu style industrial conglomerate in order to develop the economy according to the needs of the state and all involved actors, will hold benefits to all those holding an interest in the industrialization of Manchuria. Aikawa has convinced the government."

MAN_support_hoshino_2:0 "Support Hoshino"
MAN_support_hoshino_2_desc:0 "The national syndicalist model envisioned and partly enacted by Hoshino Naoki will allow for more flexibility and better adherence for the demands of the military in Manchukuo. Furthermore, his unethical practices will entice additional income for the government."

MAN_establish_mangyo_2:0 "Establish Mangyo"
MAN_establish_mangyo_2_desc:0 "The Manchurian Industrial Development Company or for short Mangyo will be established as the Industrial Conglomerate to be granted a monopoly over the Manchurian economy. Several formerly independent corporations such as the Showa Steel Works or the South Manchuria Railway will be integrated."

MAN_expand_opium_production_2:0 "Expand Opium Production"
MAN_expand_opium_production_2_desc:0 "The promotion of Hoshino has opened new possibilities for the State Opium Monopoly Bureau, the new revenues will strengthen the government and allow it to exert greater influence over unruly areas. Under Hoshinos guidance, the Bureau will grow to be the largest Opium distributor in the world."

MAN_mantetsu_railway_monopoly_2:0 "Mantetsu Railway Monopoly"
MAN_mantetsu_railway_monopoly_2_desc:0 "The South Manchurian Railway has even before the establishment of the Empire of Manchuria been one of the most profitable businesses in all of Asia, with their integration into the economic structure of Manchukuo, their profits will provide wealth and prosperity."

MAN_total_economic_coherence_2: "Total Economic Coherence"
MAN_total_economic_coherence_2_desc: "The continuous reforms undertaken by the Manchurian government have culminated in a perfectly organized and efficient Imperial Economy organized from top to bottom. Like a well-oiled machine our economy can now serve the demands of the Japanese Empire, the demands of the Kwantung Army and of course the demands of the Manchurian people."

MAN_officer_academies_2: "Establish Officer Academies"
MAN_officer_academies_2_desc: "In order to create a somewhat reliable and self-sufficient army, the [MAN.GetName] must train a confident class of officers that are loyal to our cause."

MAN_labor_corps_2: "Manchurian Labor Corps"
MAN_labor_corps_2_desc: "If there is one thing that the [MAN.GetName] has, it's a large workforce, this workforce can also be used for military purposes such as maintaining and repairing military instalments."

MAN_special_river_detachments_2: "Special River Detachments"
MAN_special_river_detachments_2_desc: "In order for the Manchurian Army to effectively assist our overlords endeavors, whatever they might be, it must create a specialized corps that can excel at their assigned task. While we are not able to keep up with the Kwantung Army at all levels, through specialization we will still be of some use!"

MAN_military_supplies_requisition_law_2:0 "Pass the Military Supplies Requisition Law"
MAN_military_supplies_requisition_law_2_desc:0 "Passing the Military Supplies Requisition Law will allow the government to appropriate land and resources for military purposes if seen fit, furthermore it gives the official authority to conscript laborers to assist the military."

MAN_auxiliary_forces_2:0 "Auxiliary Forces"
MAN_auxiliary_forces_2_desc:0 "In order to create a coherent fighting force, auxiliary forces to keep the peace behind the frontlines are indispensable."

MAN_self_sufficient_military_2:0 "Self Sufficient Military"
MAN_self_sufficient_military_2_desc:0 "Previous reforms of the Manchurian government have finally led the army to turn from an gang of bribed bandits to a sufficient and reliable force that is fully able to assist in Japanese operations and conduct their own attacks."

MAN_reinforce_the_heilongjiang_2:0 "Reinforce the Heilongjiang"
MAN_reinforce_the_heilongjiang_2_desc:0 "the [SOV.GetName] is undoubtedly the greatest threat to Japanese Imperial holdings on the continent and the [MAN.GetName] itself. We must direct government efforts towards constructing military infrastructure and a system of supply that is sufficient for operations along the border."

MAN_reinforce_east_hebei_2:0 "Reinforce East Hebei"
MAN_reinforce_east_hebei_2_desc:0 "The Imperial Japanese Government has expressed its desires to expand operations against the Nationalist Government of [CHI.GetLeader], we shall assist them by investing in the reinforcement of East Hebei and to enable maneuvers on the mainland conducted by both the Manchurian and Japanese armies."

MAN_the_kwantung_connection_2:0 "The Kwantung Connection"
MAN_the_kwantung_connection_2_desc:0 "The Chief of Staff of the Kwantung Army, Seishiro Itagaki has a good relationship with influential general and politician Hideki Tojo, this connection gives us the possibility of persuading the Japanese government to refrain from supporting a rival KMT government and instead supporting our rightful claim for China."

MAN_imperial_tianjin_conference_2:0 "Imperial Tianjin Conference"
MAN_imperial_tianjin_conference_2_desc:0 "The future of the [MAN.GetName] in possession of all of China will be decided mainly in Tokyo, not in China itself. To get ahead of any decisions concerning the future leadership of the new Chinese State, The Manchu Government and the Kwantung Army have called for a Conference in occupied Tianjin, inviting representatives of all stakeholders in China within the Japanese Sphere."

MAN_order_under_the_marshal_2:0 "Order Under the Marshal"
MAN_order_under_the_marshal_2_desc:0 "With the rather unexpected appointment of a Warlord of only secondary importance, [MAN.GetLeader] as President and therefore puppet leader of the [MAN.GetName], maintaining order in the countryside, especially in former KMT territories is of utmost importance. Martial Law shall be instated across the mainland."

MAN_lessons_of_the_warlord_era_2:0 "Lessons of the Warlord Era"
MAN_lessons_of_the_warlord_era_2_desc:0 "The many warlord conflicts, [MAN.GetLeader] having been a primary combatant himself, were some of the only large scale military conflicts in the interwar period, many things can be learned by studying strategies and tactics used."

MAN_honor_the_military_2:0 "Honor the Military"
MAN_honor_the_military_2_desc:0 "With Martial Law instated, the army can now exercise far reaching powers, therefore it is important to show the people that the Manchurian Military is an honorable institution, that serves to protect them from bandits and traitors."

MAN_back_to_the_basics_2:0 "Back to the Basics"
MAN_back_to_the_basics_2_desc:0 "With the defeat of the KMT government, the plan devised at the Tianjin Conference can finally be implemented, under nominal leadership of Marshal-President [MAN.GetLeader], a league of autonomous collaborator warlord governorates shall be established across China. While weakening the central government, it ensures Japanese control over the vast territories of China and minimal cost of administration."

MAN_return_of_the_manchus_2:0 "Return of the Manchus"
MAN_return_of_the_manchus_2_desc:0 "With the coronation of Aisin Gioro Pujie as Emperor of China complete and his incompetent brother dealt with, we shall look back at the history of the Qing, who went into battle against a corrupt Chinese government to return China to true glory, just as we are doing now. Death to Republicanism!"

MAN_the_republican_disgrace_2:0 "The Republican Disgrace"
MAN_the_republican_disgrace_2_desc:0 "With the overthrow of the Qing Dynasty in 1911, and the introduction of the wicked ideals of Republicanism to China, its history of centralization fractured into a conglomerate of squabbling warlords that had lost their respect to authority. It is to be recognized as the most jarring disaster in Chinese history. Republicanism in China must be stamped out and order must be restored."

MAN_vanguard_of_the_state_2:0 "Vanguard of the State"
MAN_vanguard_of_the_state_2_desc:0 "The Manchu Imperial Guard, Emperor [MAN.GetLeader] himself being their ceremonial leader shall be expanded into a small but elite force, to carry out special tasks in the name of the Emperor at the side of the IJA."

MAN_a_tale_of_two_emperors_2:0 "A Tale of Two Emperors"
MAN_a_tale_of_two_emperors_2_desc:0 "The Chinese Empire has finally been reclaimed! While its rightful rulers are back at the helm, we can not forget who brought us here, without our benevolent overlords in Japan, our legacy would have been destroyed by Republicanism and Banditry. We must not only accept but embrace our position as a subservient Empire to the Chrysanthemum Throne."

MAN_our_place_in_the_empire_2:0 "Our Place in the Empire"
MAN_our_place_in_the_empire_2_desc:0 "We must recognize that the destiny of Manchuria, is a Manchurian one, we shall remain separate from the central government of China, and we shall make the best of it! We will continue our rapid industrial and economic expansion and show the world the glory of the New Order in Asia!"

MAN_mongol_dominion_2:0 "Mongol Dominion"
MAN_mongol_dominion_2_desc:0 "[MEN.GetLeader]'s rule is opportunistic as best and treacherous at worst, the inner Mongol state has outlived its purpose and it shall be integrated into the [MAN.GetName]."

MAN_mongol_dominion_3:0 "Mongol Dominion"
MAN_mongol_dominion_3_desc:0 "[MEN.GetLeader]'s rule is opportunistic as best and treacherous at worst, the inner Mongol state has outlived its purpose and it shall be integrated into the [MAN.GetName]."

MAN_request_continental_territory_2:0 "Request Continental Territory"
MAN_request_continental_territory_2_desc:0 "Although we recognize our position as the [MAN.GetName], requesting territories in proximity to our current borders might help reduce administrative cost for our overlord and provide us with additional labor and resources."

MAN_mukden_convention_2:0 "Mukden Convention"
MAN_mukden_convention_2_desc:0 "Having now established our position as distinct from China, there still lies the issue of former territories of the old Qing stolen by the Russian Empire. We shall call a convention at Mukden to convene with Japanese officials and Military delegates, whether or not we shall lay claim to territories formerly held by the Qing in Mongolia and Outer Manchuria."

MAN_depose_the_weak_monarch_2:0 "Depose the Weak Monarch"
MAN_depose_the_weak_monarch_2_desc:0 "The rule of the Puyi has come about as a tool to gain international legitimacy, posing ourselves as rightful rulers of China. But having now relinquished our claim on China, we are no longer in need of maintaining the facade of Puyi ruling our State, he must go. While his removal is assured, the question of a successor is more complicated."

MAN_reorganize_the_kwantung_army_2:0 "Reorganize the Kwantung Army"
MAN_reorganize_the_kwantung_army_2_desc:0 "With the Kwantung Army now having absolute control over the [MAN.GetName], the relation of the Kwantung to the State itself must be redefined, the Kwantung Army shall be merged with the currently existing Manchurian Armed Forces, to form the Continental Frontier Army. Before this can take place, a reorganization of both entities is needed."

MAN_establish_continental_frontier_army_2:0 "Establish the CFA"
MAN_establish_continental_frontier_army_2_desc:0 "Preparations are complete and the Continental Frontier Army can be established, commanders of the Kwantung Army, who had formerly only held power behind Manchurian puppet leaders, will now assume official positions and more effectively use their expertise for the [MAN.GetName]."

MAN_technological_supremacy_2:0 "Technological Supremacy"
MAN_technological_supremacy_2_desc:0 "One way, with which we can prove our superiority and present the legitimacy of the New Order in Asia, is achieving technological supremacy over neighboring nations and even European powers."

MAN_the_imperial_wildcard_2:0 "The Imperial Wildcard"
MAN_the_imperial_wildcard_2_desc:0 "While initially posing as a compromise candidate, Kishi has shown his true face only shortly after assuming his position. Using his connections in Tokyo, he has quickly disposed of the Kwantung Army and their influence and chastised the remaining industrialists to act only under his supervision. He has granted the Zaibatsu free hand to exploit and abuse the [MAN.GetName], under his control of course."

MAN_council_of_corporations_2:0 "Council of Corporations"
MAN_council_of_corporations_2_desc:0 "By creating a council of all economic actors in the [MAN.GetName], industrial efforts can be coordinated more effectively and the worries of investors can be quickly addressed by the government."
MAN_the_council_of_corporations_desc:0 "By creating a council of all economic actors in the [MAN.GetName], industrial efforts can be coordinated more effectively and the worries of investors can be quickly addressed by the government."

MAN_the_concord_of_ethnicities_2:0 "The Concord of Ethnicities"
MAN_the_concord_of_ethnicities_2_desc:0 "The rise of the Concordia Association, with the support of the Industrialists, allows us to further expand upon our aim of creating a Pan-Asian State in which the indigenous peoples of the region collaborate and cooperate."

MAN_the_pan_asian_dream_2:0 "The Pan Asian Dream"
MAN_the_pan_asian_dream_2_desc:0 "The rule of the Concordia Association has seen the distribution of effective propaganda not only in Manchuria but also in allied territories, it has led to the immigration of many peoples fleeing from the War in China or from the Japanese occupation in Korea, granting us the benefit of many refugees in the name of the Pan Asian Dream."

MAN_central_control_2:0 "Perfect Dictatorship"
MAN_central_control_2_desc:0 "Kishi has created in Manchuria what other dictators can only dream of, a state in which nothing happens without his knowledge, a state in which every acting party understands that it must be loyal to its leader or be crushed, a state in which no one dares to resist the goons of the Chief Executive."

MAN_operation_kantokuen_2:0 "Operation Kantokuen"
MAN_operation_kantokuen_2_desc:0 "The time has come to defeat the ultimate enemy of our New Order in Asia, the Russians have for centuries occupied Asian territories, claiming it to be theirs. Their arrogance will be crushed once again by a united alliance of Asian nations! We must prepare our armed forces for a long march into Siberia to banish European forces once and for all."

MAN_greater_manchuria_2:0 "Greater Manchuria"
MAN_greater_manchuria_2_desc:0 "The [MAN.GetName] must aim to reclaim the territories of Outer Manchuria stolen by the Russians in 1858 and 1860. §RClaiming lands that have not been under our control for such a long time will destabilize our nation, but the liberation of Asia will be worth every drop of blood!§!"

MAN_beyond_baikal_2:0 "Beyond Baikal"
MAN_beyond_baikal_2_desc:0 "To truly show the world our paradise of Pan-Asian peoples, our claims shall extend beyond Lake Baikal to incorporate all Mongols, Buryats and more! §RClaiming such vast territories will heavily destabilize our nation, but we must remain true to our cause of Pan-Asianism!§!"

MAN_revise_imperial_treaties_2:0 "Revise Imperial Treaties"
MAN_revise_imperial_treaties_2_desc:0 "Our preparations are complete and the time has come! The treaties of Aigun and Beijing will be revised, and our territories reclaimed! The European colonizers will be banished across the Urals! §RDeclaring war on a nation of superior strength will incite defeatism in the Army.§!"

MAN_liberation_is_nigh_2:0 "Liberation is Nigh!"
MAN_liberation_is_nigh_2_desc:0 "We have succeeded in liberating the territories claimed by the government, §GWhile helping to root out defeatism§, we still have a long way to go for the Russians to surrender!"

MAN_propagate_nanshinron_2:0 "Propagate Nanshin-ron"
MAN_propagate_nanshinron_2_desc:0 "The Nanshrin-ron doctrine embraced by the Japanese government must be propagated within the government to allow for mobilization against the enemies of the New Order in Asia, military construction shall take place in order to prepare for war with hostile nations."

MAN_pressure_tibet_2:0 "Pressure Tibet"
MAN_pressure_tibet_2_desc:0 "The [TIB.GetName] has been an obstacle in our way of threatening the [RAJ.GetName], they must either submit to Japanese control and accept our offer of compromise of ceding Qinghai or be crushed under the might of the New Order in Asia. We shall deliver the Ultimatum."

MAN_the_kashmir_border_2:0 "The Kashmir Border"
MAN_the_kashmir_border_2_desc:0 "The Kashmir Border is our second possible staging ground for ground operations against the [RAJ.GetName] besides Burma, we must ensure the existence of sufficient infrastructure and supply capabilities for the support of such maneuvers."

MAN_remodel_the_river_detachments_2:0 "Remodel the River Detachments"
MAN_remodel_the_river_detachments_2_desc:0 "Our enemies in Asia possess many colonies that can only be liberated by launching grand scale naval maneuvers, we shall remodel our River Detachments to be capable of naval landings."

MAN_hainan_forward_operating_base_2:0 "Hainan Forward Operating Base"
MAN_hainan_forward_operating_base_2_desc:0 "Hainan is a perfect location for a Forward Operating Base for naval landings, we shall build up the island to allow for the stationing of large quantities of marine forces and the Imperial Japanese Fleet."

MAN_assume_continental_responsibilities_2:0 "Assume Continental Responsibilities"
MAN_assume_continental_responsibilities_2_desc:0 "By assuming the responsibility of simple garrison and defense duties, we can alleviate pressure from the IJA and IJN to allow them to stage offensive operations. Our forces will be adequately adjusted to be fit for service in Burmese and Malayan terrain."

MAN_new_imperial_chinese_navy_2:0 "New Imperial Navy"
MAN_new_imperial_chinese_navy_2_desc:0 "With the removal of the Kwantung Army, we shall bolster our independent armed forces and recreate our Imperial Navy!"

MAN_manchurian_auxiliary_navy_2:0 "Manchurian Auxiliary Navy"
MAN_manchurian_auxiliary_navy_2_desc:0 "We shall invest in our naval capacities to increase mercantile activities and assist the IJN."

### China:
KMT_utilize_german_training_methods: "Form a German Trained Division"
KMT_raise_baojia_troops_in_FROM: "Raise Baojia Troops in [FROM.GetName]"
KMT_mobilize_the_industries: "Mobilize the Industries"
KMT_mobilize_the_industries_desc: "If we are to be ready for war, we must have a proper war industry, let us make sure to achieve this and catch up to the industrial output of the japanese!"
KMT_modernize_whampoa_academy: "Modernize Whampoa Academy"
KMT_modernize_whampoa_academy_desc: "Whampoa has done a great many things for China, however it has been outdated at times, let us revise this and bring it up to par with all the western Schools!"
KMT_reorganize_the_command_structures: "Reorganize the Command Structure"
KMT_reorganize_the_command_structures_desc: "The NRA's command Structure is not set up ideally, as such we will work to reorganize it and ensure that our army is in top condition to deal with our enemies!"
KMT_en_masse_conscription: "En Masse Conscription"
KMT_en_masse_conscription_desc: "We must conscript a vast amount of men to help us win this war, our nation is in a dire position and must do anything we can to get ready for war!"
KMT_centralize_military_direction: "Centralize Military Direction"
KMT_centralize_military_direction_desc: "The the NRA is to be victorious, it must be centralized around one force, Chiang Kai Chek, and follow his vision and his direction when in battle, that way it will be victorious over the invaders."
KMT_adress_the_nras_politicization: "Address the NRA's Politicization"
KMT_adress_the_nras_politicization_desc: "If the NRA is to function properly, we must address the elephant in the room, the fact that it is being used in politics to reinforce [CHI.GetLeader]'s and the KMT's Rule, serving as a party army, rather than state army."
KMT_hold_the_national_defense_conference: "Hold the National Defense Conference"
KMT_hold_the_national_defense_conference_desc: "With the Japanese and the communist bandits hounding our forces and our Regime we must hold a grand conference to ensure their demise rather than ours. Let us work to bring about this grand goal!"
KMT_mobilize_the_railways: "Mobilize the Railways"
KMT_mobilize_the_railways_desc: "The railways shall not just serve the industry, instead the military needs them just as much in order to feed our armies, let us therefore work to mobilize the railways and use them for war!"
KMT_armored_pincer_strikes: "Armored Pincer Strikes"
KMT_armored_pincer_strikes_desc: "Any Modern Army needs the offensive brilliance of modern armored pincer strikes, we will therefore be forced to invest into tanks and make sure that we have the greatest of them all! This project will start with the 200th division and spread its way through the rest of the army!"
KMT_the_grand_infantry_offensive: "The Chinese Way of War"
KMT_the_grand_infantry_offensive_desc: "China has never won by having better or more modern troops than its enemies, instead the sheer numbers and sheer will of our troops, with their willingness to die for the country has won us our wars, as proven by the Suiyuan campaign. We will therefore delve deeper into this Chinese way, supporting grand infantry offensives!"
KMT_utilize_meritocratic_incentives: "Utilize Meritocratic Incentives"
KMT_utilize_meritocratic_incentives_desc: "If our troops are to be victorious on the battlefield, they must be incentivized to head into combat, let us use exactly these incentives to reward officers who lead our troops to victory!"
KMT_modernize_the_army_new: "Modernize the Army"
KMT_modernize_the_army_new_desc: "Without a modern Army, we will never be able to reunite China, let alone project our power. Therefore it is of utmost importance that we invest into reforming our army as fast as possible..."
KMT_prepare_for_foreign_inasion: "Prepare for Foreign Invasion"
KMT_prepare_for_foreign_inasion_desc: "China has always been threatened by foreign invaders, as such, we must prepare for a new invader striking us at any moment. Let us therefore prepare some stratagems to deal with this!"
KMT_drive_them_back: "Drive them Back"
KMT_drive_them_back_desc: "In the dire straights that we are in, we cannot simply wait to lure our enemies in and fight them then, instead we must focus on driving them back and removing them from our lands!"
KMT_forge_a_modern_offensive_force: "Forge a Modern Offensive Force"
KMT_forge_a_modern_offensive_force_desc: "If our Army is to do well on the battle, a coherent offensive force must be established, be it with infantry or tanks, it matters not, something must be done!"
KMT_strengthen_the_logistical_department: "Establish the Combined Logistics Command"
KMT_strengthen_the_logistical_department_desc: "Logistics are key to the survival of our nation and it's victory in future battlefields, let us therefore make sure to establish a command center for it, to ensure that our troops maintain permanently supplied!"
KMT_found_the_roc_armed_forces: "[ROOT.GetNameDefCap] Armed Forces"
KMT_found_the_roc_armed_forces_desc: "The NRA has long been a party army, controlled by the KMT rather than China as a whole. This must change and the first step towards depoliticization shall be taken, as the army is reformed!"
KMT_major_operational_planning: "Strategize for Major Operations"
KMT_major_operational_planning_desc: "We must begin gathering experience in the planning of Operations and Offensives, if we are to be victorious in the battlefield!"
KMT_continue_the_nanjing_decades_progress: "Maintain the Nanjing Decade's Progress"
KMT_continue_the_nanjing_decades_progress_desc: "The Nanjing Decade has brought about a vast amount of Progress for China in these last few years, let us delve deeper into this and harness this for our growth!"
KMT_china_back_from_the_grave: "China back from the Grave"
KMT_china_back_from_the_grave_desc: "Despite all the damage that war has done to us, our economy has truly recovered, it seems as though we may go through a second Nanjing Decade and resume our old economic progress!"
KMT_utilize_the_national_resources_commission: "Utilize the National Resource Commission"
KMT_utilize_the_national_resources_commission_desc: "The National Resource Commission is key to providing our industry and armed forces with the materiel they need. Let us utilize it to its fullest extent to help secure this."
KMT_launch_the_three_year_plan: "Launch the Three Year Plan"
KMT_launch_the_three_year_plan_desc: "We shall launch a three year plan to further invigorate our industry, modernizing quickly to outpace the Japanese and westerners!"
KMT_resource_monopolies_on_strategic_minerals: "Secure Strategic Mineral Resource Monopolies"
KMT_resource_monopolies_on_strategic_minerals_desc: "Any largescale Economy thrives off of its resources. As such we must make sure to expand our grasp over the rural wastes of the nation, securing the resources there and winning them for our industry. The National Resource Commission will help us greatly in this endeavor!"
KMT_construct_largescale_chemical_complexes: "Construct Largescale Chemical Complexes"
KMT_construct_largescale_chemical_complexes_desc: "If our Chemical industry is properly built up, it will act as a great force multiplier for our economy, boosting the effectiveness of our nation manyfold"
KMT_reform_the_taxation_system: "Reform the Taxation System"
KMT_reform_the_taxation_system_desc: "Our Taxation System is woefully outdated and in need of reform, let us implement this in order to keep it up to par with its growing financial demands!"
KMT_some_uni_i_guess: "Form the National Political University"
KMT_some_uni_i_guess_desc: "With illiteracy dealt with, we must work to improve our higher level academia. For this, we shall merge the Central Political Institute with the Central Youth Cadre School in order to greatly consolidate and centralize Chinese academia. As such we will have a model university for the Nation to follow!"
KMT_a_naitonal_defense_state: "A Chinese National Defense State"
KMT_a_naitonal_defense_state_desc: "With war further and further pushing us down, we now have no choice but to copy the Japanese and enter into a national defense state for the interest of our own nation. All must serve the nation and its survival and defense, cost it what it must!"
KMT_enact_technical_training: "Enact Technical Training"
KMT_enact_technical_training_desc: "Our experts need to be trained properly and must be ready to deal with all the different hazards of leading an economy properly. Let us work towards this at once!"
KMT_construct_heavy_machinery: "Construct Heavy Machinery"
KMT_construct_heavy_machinery_desc: "If the Chinese Economy is to thrive, we must invest into it, securing the necessary capacity to build it up and prosper deep into the future!"
KMT_foster_modern_power_infrastructure: "Foster Modern Power Infrastructure"
KMT_foster_modern_power_infrastructure_desc: "Modern Power Infrastructure is key to any long term industrialization. Let us invest in and build this."
KMT_prepare_inflation_weaponry: "Prepare Inflation Weaponry"
KMT_prepare_inflation_weaponry_desc: "With the economy suffering greatly from inflation, it is time to deal with this vice. We must prepare weapons to destroy and eradicate this from our nation!"
KMT_expand_efforts_to_deal_with_national_devastation: "Fight Economic Devastation"
KMT_expand_efforts_to_deal_with_national_devastation_desc: "After Our Economy has been devastated by the foreign invasion, we must invest money into it to undo what has been done to us!"
KMT_secure_foreign_investment: "Secure Foreign Investment"
KMT_secure_foreign_investment_desc: "Foreing investment is the key to industrial growth, therefore let us set out to get exactly this."
KMT_build_up_the_rear_area: "Build Up the Rear Area"
KMT_build_up_the_rear_area_desc: "If we are to hold out against the foreign invaders, we must build up our heartland, the rear area. Let us make it a bastion of military production to keep our army well supplied and ready to resist the enemy!"
KMT_finalize_war_preparations: "Finalize Preparations for War"
KMT_finalize_war_preparations_desc: "Many a foreign power is on our doorstep, as such we must be ready. We will further invest into the military sector of our economy and seek to entrench it as fast as possible."
KMT_deal_with_rural_illiteracy: "Deal with Rural Illiteracy"
KMT_deal_with_rural_illiteracy_desc: "Rural illiteracy is a massive issue plaguing the nation. As such we must dedicate vast amounts of time and effort to combat it."
KMT_expand_military_aid: "Expand Foreign Military Aid"
KMT_expand_military_aid_desc: "While we have some international funding, we need to give this funding to the military as well. Let us purchase the necessary weapons from our investors."
KMT_a_foreign_funded_defense_indstry: "A Foreign Funded Defense Indstry"
KMT_a_foreign_funded_defense_indstry_desc: "If we are to survive, we must face the facts. China currently is unable to properly defend against our enemies. As such we must rely more and more on foreign funding for our industries, allowing us to remain resilient despite economic collapse."
KMT_reintroduce_income_tax: "Reintroduce Income Tax"
KMT_reintroduce_income_tax_desc: "Income tax, though unpopular is the key to a long term survivable economy. This, while bureaucratically challenging and unpopular is what brought the western economies forward and it will do the same for us."
KMT_nationalize_the_grain_tax: "Nationalize the Grain Tax"
KMT_nationalize_the_grain_tax_des: "The grain tax has been a key to building up many a Chinese dynasty. While it now goes to the provinces, we must change that to be able to adequately fund our military and economy. If we are to do this, however, we must decide how we shall do it. While we could force the provinces to fully hand it over to us, that would lead to a massive conflict with them, potentially causing more damage than it is worth. Instead, we could make a compromise with them, where they only hand us a portion of it instead, making both ends meet."
KMT_expand_military_schooling: "Expand Military Schooling"
KMT_expand_military_schooling_desc: "Military schooling is the key to getting our military up to par with the west. We must make full use of this in order to catch up as fast as possible."
KMT_launch_a_major_fortification_programme: "Launch a Major Fortification Programme"
KMT_launch_a_major_fortification_programme_desc: "If we are to be able to properly defend China, we must launch a major fortification programme, giving us the ability to hold off our enemies and defend the nation."
