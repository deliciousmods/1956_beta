KMT_lacking_support_for_conscription_desc: "Our state lacks means to enforce conscription throughout the nation. Additionally many a bottleneck prevent the conscription of a large army, as overdoing it would cause massive starvation."
 KMT_the_kuomintang_natl_revolution_desc: "The Kuomintang National Revolution has gone a good step towards it's end goal of uniting the Nation, yet this politically fragmented movement has slowly stagnated and is prone to infighting. As such, it has been unclear if it will achieve its final goal of Chinese unification or not."
 KMT_corruption_tt: "This will worsen §YCorruption§! in the §2KMT§!..."
