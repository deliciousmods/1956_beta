KMT_wp_event.1.t: "[CUG.GetNameDefCap] Sues for Peace"
KMT_wp_event.1.desc: "After years of bloody war and a horrible stalemate that has cost millions of lives, the central Government of China has decided to sue for peace. They have offered us unrestricted control of ALL of their treaty ports, most notably including Shanghai, along with control over Shandong, Hebei, Chahar, Jiangsu, and Guangdong Provinces. Finally they have agreed to accept all claims of [MEN.GetNameDef] and they have agreed to demilitarize most of their borders. With this offer, while still being far from dominating China, we would have a fiefdom there and control most of the coast. Perhaps we should at least consider it."
KMT_wp_event.1.a: "Our Soldiers did not die for this little!"
KMT_wp_event.1.b: "A Toast to this new peace!"

KMT_wp_event.2.t: "[CUG.GetNameDefCap] Sues for Peace"
KMT_wp_event.2.desc: "After years of bloody war and a horrible stalemate that has cost millions of lives, the central Government of China has decided to sue for peace. They have offered us unrestricted control of ALL of their treaty ports, most notably including Shanghai, along with surrendering the entire seaboard along with their most profitable regions to [RNG.GetNameDef]. Finally they have agreed to accept all claims of [MEN.GetNameDef]. Should we accept this, we will have devastated the Chinese and won a sphere to be proud of, securing the first step in the new asian Order, to the point that [RNG.GetNameDef] will be the officially recognized government of China."
KMT_wp_event.2.a: "Our Soldiers did not die for this little!"
KMT_wp_event.2.b: "A Victory worth celebrating over!"

KMT_wp_event.3.t: "[CUG.GetNameDefCap] Attempts to Flee to Sichuan"
KMT_wp_event.3.desc: "After years of bloody war, we have won. The Remaining forces of the central government have fled to the remove Sichuan province, leaving us with essentially all of the valuable parts of China! let us celebrate this and bathe in the spoils of our war. These pathetic socalled nationalists are of no more threat to us in their mountain hole!"
KMT_wp_event.3.a: "Even so, they must die, just to spite them!"
KMT_wp_event.3.b: "Hail the Emperor!"

KMT_wp_event.4.t: "[CUG.GetNameDefCap] Offers us Subjugation"
KMT_wp_event.4.desc: "No longer being able to withstand the might of the IJA, [CUG.GetLeader] has decided to offer us his services, promising to change sides and join us should we make him our chosen puppet state in China. While this is tempting and would wreak havoc on the Chinese United Front, this man is now a turncoat and thus unreliable and could change back later on..."
KMT_wp_event.4.a: "They would be absolutely unreilable!"
KMT_wp_event.4.b: "Victory at last!"

KMT_event.1.t: "The Direction of the NRA"
KMT_event.1.desc: "It was never our goal to remain only controlling these small lands. We are Nationalists and as such we seek to unite all of China! That brings us to an important question. Do we focus on the internal issues to deal with the communists and warlords first, or do we focus on preparing to deal with the Japanese threat?"
KMT_event.1.a: "We must focus on the true enemy, the communists!"
KMT_event.1.b: "We shall focus on driving out Japanese influence in China!"

KMT_event.2.t: "The KMT Civil War"
KMT_event.2.desc: "In the lieu of the Chinese National Congress, the Chiangists and the Pro Democratic politicians have come to a great disagreement. Due to this, two camps have formed and a civil war has broken out between them. This brings us to the question. Who do we recognize as our rightful overlord?"
KMT_event.2.a: "We Recognize no one and instead use this as an opportunity to break away!"
KMT_event.2.b: "We Must Support the Generalissimo"
KMT_event.2.c: "Democracy must Save China!"
KMT_event.2.d: "We will sit this one out, and simply side with the winners"
 
KMT_event.3.t: "The New Fourth Army Incident"
KMT_event.3.desc: "While we were fighting the Japanese together, our units have been bamboozled and stabbed in the back by an NRA ambush, despite us allegedly being allies. This has caused massive losses amongst our troops, leaving us incapable to fully prevent their current purge of Communists in the lands under the Central Government! After all, some of our best men have died and units lost. What are we to do in this dire situation?"
KMT_event.3.a: "We denounce the Nationalist Government and cut all ties!"
KMT_event.3.b: "We are in no position to fight without the NRA on our side."

KMT_event.4.t: "Finalizing the Constitutional Draft"
KMT_event.4.desc: "With the constitutional draft finished, we now have two complete constitutions lying out in front of us. We must choose between the one supported by the Chiangists and that supported by the Democrats. What constitution will be rubber stamped?"
KMT_event.4.a: "We will support Chiang."
KMT_event.4.b: "We cannot make a choice. Abandon the Draft!"
KMT_event.4.c: "We will support the Democrats"
 
KMT_event.5.t: "The National Congress of the KMT"
KMT_event.5.desc: "With the National Congress and the fate of the Nation about to be decided, it is time we pick a side."
KMT_event.5.a:0 "We will Support the Chiangists"
KMT_event.5.b:0 "We will Support the Party Bureaucracy"

KMT_event.6.t: "Chiang's Demands"
KMT_event.6.desc: "In the National Congress, Chiang takes the stage first, for the good of all China. What does he say the country must do now?"
KMT_event.6.a:0 "Chiang demands full transference of power..."
KMT_event.6.b:0 "Chiang makes no demands, for now..."

KMT_event.7.t: "The Party Gives in"
KMT_event.7.desc: "The Party has accepted Chiang's demands! He is now the sole holder of power in China! Glory to Chiang's National Revolution!"
KMT_event.7.a:0 "Glorious!"

KMT_event.8.t: "The Party Betrayal"
KMT_event.8.desc: "The Party has betrayed us! They have Resisted Chiang and thus he has, in spite of them, declared himself dictator of all China! This has caused the Party to revolt against us!"
KMT_event.8.a:0 "May the gods help us!"

KMT_event.9.t: "The Party's Demands"
KMT_event.9.desc: "The Party has taken the stage against Chiang and has decided to lay out their plans for China. What are they?"
KMT_event.9.a:0 "The Party Demands Free Elections"
KMT_event.9.b:0 "The Party has no demands, for now..."

KMT_event.10.t: "Chiang Submits"
KMT_event.10.desc: "Chiang has decided to agree to stepping down and accepting free elections. A new dawn is upon China!"
KMT_event.10.a:0 "Glorious!"

KMT_event.11.t: "Chiang Revolts"
KMT_event.11.desc: "Chiang has decided that he must take over national power, after demanding this, we have stopped him, yet he has used that as a chance to revolt and fight against us."
KMT_event.11.a:0 "May the gods help us!"

KMT_event.12.t: "The Election Results"
KMT_event.12.desc: "We have announced the election results and after a close race, it has become clear that one group of politicians have come out on top."
KMT_event.12.a:0 "The KMT has won again, unsurprisingly"
KMT_event.12.b:0 "Carsun and his idealism have won"
KMT_event.12.c:0 "The Conservative YCP has won the day"

KMT_event.13.t: "The Chinese Government Strikes at Mongolia"
KMT_event.13.desc: "The Chinese Government is seeking to declare on Mongolia any day now! What do we do about this massive Asian Front?"
KMT_event.13.a:0 "The Chinese must die."
KMT_event.13.b:0 "We will agree to abandon Mongolia for peace."

KMT_event.14.t: "China Demands Indochinese Liberation"
KMT_event.14.desc: "After years of criticism of Imperialism in Asia, the Chinese have finally come to us and demanded the abolishment of the oppression of the peoples in Indochina. What do we do about this?"
KMT_event.14.a: "We must fight for our Colonies!"
KMT_event.14.b: "It is not worth fighting a Land war in Asia."

KMT_event.15.t: "China Demands Korean Liberation"
KMT_event.15.desc: "After years of criticism of our Imperialism, the Chinese have finally sent us an ultimatum to withdraw from Korea. What do we do about that?"
KMT_event.15.a:0 "We will hold onto our hard earned lands"
KMT_event.15.b:0 "We must grant them freedom"

KMT_event.16.t: "China Nationalizes Our Assets"
KMT_event.16.desc: "The KMT has nationalized many of our assets throughout China. What do we do about this?"
KMT_event.16.a:0 "It is fait accompli, there is nothing we can do."
KMT_event.16.b:0 "We will hit them with a hefty embargo."

KMT_event.17.t: "[PRC.GetNameDefCap] Leaves the United Front"
KMT_event.17.desc: "In light of our execution of many a communist, including quite a few of the forces of [PRC.GetNameDef], [PRC.GetNameDef] has abandoned the United Front and denounced us, calling us traitors and butchers."
KMT_event.17.a:0 "It is they who are traitors to the Nation!"

KMT_event.18.t: "Wang Jing Wei's Olive Branch"
KMT_event.18.desc: "Wang Jing Wei has made us an offer. He has made us an offer by which we will meet in Taiwan to discuss terms of an economic pact and deal for us."
KMT_event.18.a: "Some Rapprochement may perhaps be possible"
KMT_event.18.b: "We could never do such a thing"

KMT_event.19.t: "The Taiwan Accords"
KMT_event.19.desc: "China has finally made good on its promise to make a deal with us. They propose a research treaty by which they will give us a share of their economy in exchange for some help developing themselves. They additionally offer to increase this share through expansion of the treaty later."
KMT_event.19.a: "Free Money? Why, of Course"
KMT_event.19.b: "A Modern China? That would be our end."

KMT_event.20.t: "China Seeks to invite Japanese Investors"
KMT_event.20.desc: "China has proposed to renew our treaty and invite our investors. This would bring us great profits but boost their economy long term."
KMT_event.20.a: "Free Money? Why, of Course"
KMT_event.20.b: "We do not seek to help them in this way"

KMT_event.21.t: "China Proposes a Scientist Exchange Program"
KMT_event.21.desc: "China has proposed to renew our treaty and start a Scientist Exchange program. They have offered to pay to make this worth it."
KMT_event.21.a: "Free Money? Why, of Course"
KMT_event.21.b: "We do not seek to help them in this way"

KMT_event.22.t: "China Seeks to Purchase Our Produce"
KMT_event.22.desc: "China has proposed to renew our treaty and purchase vast amounts of our produce. This would bring us great profits but allow them to copy our technology."
KMT_event.22.a: "Free Money? Why, of Course"
KMT_event.22.b: "We do not seek to help them in this way"

KMT_event.23.t: "China Seeks to Acquire Our Research"
KMT_event.23.desc: "China has proposed to renew our treaty and give us a beneficial resource deal. This would help solve the resource issue but greatly help their technology."
KMT_event.23.a: "Cheap Resources? Why, of Course"
KMT_event.23.b: "We do not seek to help them in this way"

KMT_event.24.t: "China Seeks to Acquire Our Expertise"
KMT_event.24.desc: "China has proposed to renew our treaty and offer us laborers, who will probably give them some of our technological information but would be free factory manpower."
KMT_event.24.a: "Free workers? Why, of Course"
KMT_event.24.b: "We do not seek to help them in this way"

KMT_event.25.t: "China Demands Land"
KMT_event.25.desc: "China has demanded we pull out of every bit of land we own that is theirs. In exchange we will gain docking rights to ensure our naval edge. Or they will attack us with their technological edge. What do we do?"
KMT_event.25.a: "We give in"
KMT_event.25.b: "Our spirit will lead us to victory"

KMT_event.26.t: "China Demands Land for Naval Bases"
KMT_event.26.desc: "China has demanded we pull out of every bit of land we own that is theirs. Or they will attack us with their technological edge. What do we do?"
KMT_event.26.a: "We give in"
KMT_event.26.b: "Our spirit will lead us to victory"

KMT_event.27.t: "China Demands Carte Blanche in Manchuria"
KMT_event.27.desc: "China has demanded a Carte Blanche in Manchuria to take over the region without our involvement. What do we do about that?"
KMT_event.27.a: "We give in"
KMT_event.27.b: "We stand firm"

KMT_event.28.t: "China Demands Carte Blanche in Manchuria for Maintaining Our Economic Influence"
KMT_event.28.desc: "China has demanded a Carte Blanche in Manchuria to take over the region without our involvement. What do we do about that?"
KMT_event.28.a: "We give in, after all they are paying us to do so"
KMT_event.28.b: "We stand firm"

KMT_event.29.t: "Japan Sells Us Out"
KMT_event.29.desc: "China has made a deal with Japan to give us to them. What do we do about this?"
KMT_event.29.a: "We give in, after all, Japan's wish is our command"
KMT_event.29.b: "We must live on"

KMT_event.30.t: "Assassin Strikes at Wang"
KMT_event.30.desc: "Feeling that Jingwei was betraying the Chinese People by reaching out to Japan, an assassin has struck out at Wan Jingwei and attempted to kill him."
KMT_event.30.a: "Luckily, he missed"
KMT_event.30.b: "It seems the leader of the Kuomintang is dead. Again."

# KMT_event.31.t: "Zhang Xueliang Invites Chiang to Go North"
# KMT_event.31.desc: "Zhang Xueliang has invited Chiang to go join him in the north to make plans about the fate of China and his Army. What do we do about this?"
# KMT_event.31.a: "Of course, China must work together."
# KMT_event.31.b: "This reeks of a trap."

# KMT_event.32.t: "Zhang Xueliang Attempts to Kidnap Chiang"
# KMT_event.32.desc: "In order to attempt a united China, Xueliang has decided to kidnap Chiang in order to force him to negotiate. In this, he has staged an ambush to take Chiang into captivity."
# KMT_event.32.a: "Chiang has fought valiantly, but has died to the superior enemy numbers"
# KMT_event.32.b: "Succumbing to the Trap, Chiang has agreed to go with Xueliang and speak with the communists"

# KMT_event.33.t: "Xueliang brings us Chiang"
# KMT_event.33.desc: "Xueliang has decided to capture Chiang and has brought him to us to force him to the negotiating table."
# KMT_event.33.a: "A commendable initiative, but Chiang must die."
# KMT_event.33.b: "We will demand he sign a peace deal or die."

# KMT_event.34.t: "Mao Gives Chiang an Ultimatum"
# KMT_event.34.desc: "Mao, having been handed Chiang, has given him an ultimatum. He must either accept peace, or die. What do we make of this."
# KMT_event.34.a: "We will not negotiate with traitors"
# KMT_event.34.b: "We have no Choice. We negotiate."

KMT_event.35.t: "Jingwei Hangs Himself"
KMT_event.35.desc: "With Japan rejecting our offer to meet and being openly hostile to us, Wang Jing Wei has killed himself, believing the future of China to be hopeless and himself being the first to be executed by the Japanese."
KMT_event.35.a: "Yet, in tragedy, new hope arises"

KMT_event.39.t: "[CHI.GetNameDef] Demands Hegemony Over Indochina"
KMT_event.39.desc: "Today [CHI.GetNameDef] has announced to us that they demand that we transfer our colony in Indochina to them, for their own empire. While we are in no position to stop them from taking it this is an insult to us. What shall we do?"
KMT_event.39.a: "We really have no choice here"
KMT_event.39.b: "We will fight with honor"

KMT_event.40.t: "The Chinese Government Strikes at Tuva"
KMT_event.40.desc: "The Chinese Government is seeking to declare on Tuva any day now! What do we do about this massive Asian Front?"
KMT_event.40.a:0 "The Chinese must die."
KMT_event.40.b:0 "We will agree to abandon Tuva for peace."

KMT_event.41.t: "The Chinese Empire Demands the Overturning of the Amur Annexations"
KMT_event.41.desc: "The Chinese Government has stated that our annexation of the Amur regions was against international law and that these lands are Chinese. We however have settled many people there, who now live their own Russian lives. What shall we do about this ultimatum?"
KMT_event.41.a:0 "Vladivostok is Russian"
KMT_event.41.b:0 "We really have no means of fighting a land war in Asia"

KMT_event.42.t: "The Chinese Demand Joint Rulership of Indochina"
KMT_event.42.desc: "The Chinese Government has stated that Indochina is in their sphere of influence and that they are entitled to a share of its profits for not attacking it. This proposal seems quite reasonable, as it is a far away land."
KMT_event.42.a:0 "We Reject Nonetheless"
KMT_event.42.b:0 "Why would we not accept such a great deal?"

KMT_event.43.t: "Blueshirts Rise Up in Beijing"
KMT_event.43.desc: "The Blueshirts, after falling out with us, after our attempts to disband them, have never truly disappeared... Today they have moved in on Beijing and taken control of the City. It has fallen. The Blueshirts seem to be back and more powerful than ever."
KMT_event.43.a: "This does not bode well..."
 KMT_event.43.t:0 "Blueshirts Rise Up in Beiping"
 KMT_event.43.desc:0 "The Blueshirts, after falling out with us, after our attempts to disband them, have never truly disappeared... Today they have moved in on Beiping and taken control of the City. It has fallen. The Blueshirts seem to be back and more powerful than ever."
 KMT_event.43.a: "This does not bode well..."

KMT_event.44.t: "The Beijing Declaration and Coup"
KMT_event.44.desc: "In Beijing Dai Li has made a Proclamation, decrying Chiang as an imbecile and declaring himself the new lord of China. Simultaneously he has declared Beijing the new capital of China and has taken over as much of the state apparatus as possible. Lastly his troops are now marching on Nanjing, to fully take over China."
KMT_event.44.a:0 "At this Coup, the Chiangist troops have defected, with Chiang being Captured."
KMT_event.44.b:0 "the Chiangists stand strong, resisting this betrayal."

KMT_event.45.t: "[FROM.GetNameDefCap] Declares Independence"
KMT_event.45.desc: "After fleeing to our islands, the KMT has decided to abandon the concept of China and now has committed yet another act of treason and declared independence. What will we do about this?"
KMT_event.45.a:0 "It is better to let these useless people and traitors go their own way."
KMT_event.45.b:0 "We will end their disgusting existence"

KMT_event.46.t: "[FROM.GetNameDefCap] Requests Economic Aid"
KMT_event.46.desc: "After their exile to the islands, the KMT has begun to request foreign aid for their feeble and incompetent industry. What will we do about this?"
KMT_event.46.a: "To send an advisor to help an ally would be in order"
KMT_event.46.b:0 "We will not get involved in this issue"

KMT_event.47.t: "The First National Congress Abroad"
KMT_event.47.desc: "While the KMT has fallen far, we still hold a congress, and plot the future of our new realm. One day we will return. It is inevitable that Chiang will lead us to Victory and the reclamation of the homeland."
KMT_event.47.a:0 "Through Despair, hope rises!"

KMT_event.48.t: "Chiang Addresses the Nation"
KMT_event.48.desc: "As Chiang begins to speak, a gunshot rises from the crowd, one of the surviving communists turns his gun at himself now, shouts, long live the CCP and kills himself, in a murder suicide. As the KMT sorts itself after this incident, Chiang's son is made the new president of the KMT..."
KMT_event.48.a:0 "The president is dead, long live the new president!"

KMT_event.49.t: "Li Zongren Rejoins the Nanjing KMT"
KMT_event.49.desc: "Seeing a chance to be elected in Chiang's stead, Li Zongren has returned to Nanjing to secure control over the nation and oust Chiang finally."
KMT_event.49.a:0 "Another despot or a flicker of hope?"

KMT_event.50.t: "A Chance at the Presidency"
KMT_event.50.desc: "Elections have come across China and Li Zongren sees a chance for winning them. Yet before doing so, he has consulted his wife, asking if he should go or not."
KMT_event.50.a:0 "Why not? This will finally oust Chiang!"
KMT_event.50.b:0 "The family has already suffered too much at Chiang's hands."

KMT_event.51.t: "The KMT Centrists Nominate a Candidate"
KMT_event.51.desc: "In the Struggle for nominating a united KMT candidate, the KMT centrists have brought forth their Candidate Today"
KMT_event.51.a:0 "Let us win the Candidacy!"

KMT_event.52.t: "The KMT Leftists Nominate a Candidate"
KMT_event.52.desc: "In the Struggle for nominating a united KMT candidate, the KMT leftists have brought forth their Candidate Today"
KMT_event.52.a:0 "Let us win the Candidacy!"
KMT_event.52.b: "Yet as they did so, they were dissolved by the army and their candidate put under house arrest..."

KMT_event.53.t: "The End of the Power Struggle"
KMT_event.53.desc: "In the Struggle for nominating a united KMT candidate, the KMT has finally finished their meetings and discussions, nominating a great candidate to lead the nation into the future!"
KMT_event.53.a: "Time to destroy the feeble opposition!"

KMT_event.54.t: "The Leftists Abandon the KMT"
KMT_event.54.desc: "After the outcome of the internal power struggle of the KMT has been such a disaster for them, the leftists in the KMT have abandoned us, flocking to the CDSP instead, seeking economic equality there."
KMT_event.54.a:0 "Traitors!"

KMT_event.55.t: "The Centrists Abandon the KMT"
KMT_event.55.desc: "After the outcome of the internal power struggle of the KMT has been such a disaster for them, with the party turning towards the left, the centrists in the KMT have abandoned us, flocking to the YCP instead, seeking a united, strong China there."
KMT_event.55.a:0 "Traitors!"

KMT_event.56.t: "Chiang Himself Abandons the KMT"
KMT_event.56.desc: "After the outcome of the internal power struggle of the KMT has been such a disaster for them, with the party turning towards the left, the Chiang Kai-Shek abandoned us, disavowing politics and denouncing the party that was once his."
KMT_event.56.a:0 "Traitor!"

KMT_event.60.t: "China Requests Independence"
KMT_event.60.desc: "Having built themselves back up into a great beacon, the Chinese have requested independence again, while respecting our economic influence. What do we say about such an idea?"
KMT_event.60.a:0 "This will help us reconcile"
KMT_event.60.b: "We will grant them... nominal Independence"
KMT_event.60.c: "This is out of the question"

KMT_event.61.t: "China Offers Peace"
KMT_event.61.desc: "We have seemingly lost the war against the Chinese, they have not only broken free from our rule but also pushed us out of their lands and now demand we pull our forces from their lands."
KMT_event.61.a: "It is what it is... Alas, we have lost."
KMT_event.61.b: "Nonetheless, we will fight to the last man."

KMT_event.62.t: "Allegations of Corruption in the KMT"
KMT_event.62.desc: "During our power struggle and with elections approaching, allegations of Corruption in the KMT, our ruling party, have surfaced. Many now call for a formal investigation committee to be created to investigate it. However this must be greenlighted by the KMT itself first..."
KMT_event.62.a: "Surprisingly, the KMT allows this..."
KMT_event.62.b: "As Expected, it has been blocked."

KMT_event.63.t: "The Investigation Committee"
KMT_event.63.desc: "With the committee established, it now prepares to investigate the corruption allegations, however certain people seek to bribe and influence the committee in order to use it for their own political benefit."
KMT_event.63.a: "Despite all this, the committee remains neutral"
KMT_event.63.b: "The committee agrees to pay 'extra attention' to Chiang's activities"
KMT_event.63.c: "The committee agrees to watch out what may be going on in the party bureaucracy"
KMT_event.63.d: "The committee agrees to look into suspicious leftist activities"

KMT_event.64.t: "The Committee Verdict: A Guilty KMT"
KMT_event.64.desc: "After much investigation, the Committee has come to the conclusion that the KMT as a whole is guilty of massive corruption. While the KMT still will be running for office, this is sure to reshuffle the cards and reduce their popularity and harm their reputation."
KMT_event.64.a: "Perhaps we should have never allowed this investigation..."

KMT_event.65.t: "The Committee Verdict: A Guilty Chiang"
KMT_event.65.desc: "After much investigation and perhaps a bit of outside 'help', the committee has come to the conclusion that Chiang alone is guilty of corruption and that the KMT as a whole is fine. Chiang is fuming at this great setback and undermining of his influence."
KMT_event.65.a: "Perfect, all goes according to plan"

KMT_event.66.t: "The Committee Verdict: A Guilty Bureaucracy"
KMT_event.66.desc: "After much investigation and perhaps a bit of 'help' from the inside of Chiang's pockets, the committee has come to the conclusion, that the party bureaucrats and the likes of Lin Sen alone are guilty of corruption and that the KMT as a whole is fine. These are, of course, fuming at this great setback and undermining of their influence."
KMT_event.66.a: "Perfect, all goes according to plan"

KMT_event.67.t: "The Committee Verdict: A Guilty Left"
KMT_event.67.desc: "After much investigation and perhaps a bit of 'help' from the inside of Chiang's pockets, the committee has come to the conclusion, that the party leftists and the likes of Soong Qing Ling alone are guilty of corruption and that the KMT as a whole is fine. These are, of course, fuming at this great setback and undermining of their influence."
KMT_event.67.a: "Perfect, all goes according to plan"
KMT_event.67.b: "The Perfect excuse to ban them yet again!"

KMT_event.70.t: "The Kuomintang Reaches out to us"
KMT_event.70.desc: "With their new, more left wing government in charge, the KMT has reached out to us, attempting to secure our support of their government and our friendship and guidance."
KMT_event.70.a: "Of course we will help a friend."
KMT_event.70.b: "We will not waste our precious resources."

KMT_event.71.t: "The Kuomintang Requests a Military Mission"
KMT_event.71.desc: "With us helping their government, the KMT has now requested a military mission as well, to help guide their dated military and help it plan its offensives in a modern manner."
KMT_event.71.a: "A great asset against fascism in Asia, send the men!"
KMT_event.71.b: "We will not waste our precious resources."

KMT_event.72.t: "The Kuomintang Suggests a Full Military Alliance"
KMT_event.72.desc: "With us having helped both their government and army, the KMT has stated that it is obvious that their future lies in an alliance with us. They have furthermore pointed out that it would increase the effectiveness of our military cooperation and make a strong Eurasian bloc."
KMT_event.72.a: "We welcome them with open arms!"
KMT_event.72.b: "They are but a burden."

KMT_event.73.t: "The Power Struggle Progresses"
KMT_event.73.desc: "As the Power Struggle progresses, candidates have made great speeches to the party, attempting to consolidate their leadership over it."
KMT_event.73.a: "The results have been... interesting"

KMT_event.74.t: "The Twilight of the Tutelage"
KMT_event.74.desc: "It is time, the final steps towards elections have begun as different groups in China vie for power. \nIn the §2KMT§!, various factions and cliques have used Chiang's eroded power to their advantage and caused the party to fall into a power struggle, which is no longer singlehandedly dominated by the Chiangists. This power struggle is set to determine the leader of the §2KMT§! post elections.\nMeanwhile, if given the opportunity and the legal status, the §8YCP§! and the §OCDSP§! also seek to outdo the §2KMT§! and become the new dominant political force in China... \nFinally the military dwells in the background and should they believe that things are not going well and that there is large scale fraud going on with the government refusing to announce the results after the elections completion, there lies a chance of a coup...\n\nIt seems only time can tell who will be the dominant force in China."
KMT_event.74.a: "Let us toast to this new era!"

KMT_event.75.t: "The Fate of the Election Results"
KMT_event.75.desc: "While elections have been held, certain people are displeased with the results and are trying to prevent the announcing of them in order to maintain what little power they currently have."
KMT_event.75.a: "Nonetheless, the people must know the truth."
KMT_event.75.b: "At least for now they are successful."

KMT_event.76.t: "China Requests a Barter Agreement"
KMT_event.76.desc: "With the Handelsgesellschaft für Industrielle Produkte operating in China and selling them our weaponry, in order to bypass international law regarding weapons trading. China has now reached out, proposing to trade resources for Guns, in deals that will be worked out in detail once this treaty is signed..."
KMT_event.76.a: "Business? Yes please!"
KMT_event.76.b: "There is no need to antagonize the international community"

KMT_event.77.t: "China Seeks to Purchase Blueprints"
KMT_event.77.desc: "In order to modernize their outdated army, the Chinese have offered to increase our influence in their economy in exchange for some military blueprints, allowing them to enter into the modern age as a great power."
KMT_event.77.a: "A wonderful deal!"
KMT_event.77.b: "German Blueprints are for Germans only!"

KMT_event.78.t: "China Seeks to Open a Military Exchange"
KMT_event.78.desc: "In order to modernize their outdated army, the Chinese have offered to increase our influence in their economy in exchange for a military exchange. While nominally to both of our benefits, this will of course mostly help their military."
KMT_event.78.a: "A wonderful deal!"
KMT_event.78.b: "German Science is for Germans only!"

KMT_event.79.t: "China Seeks to Acquire Military Experience"
KMT_event.79.desc: "In order to modernize their outdated army, the Chinese have offered to increase our influence in their economy in exchange for a little experience."
KMT_event.79.a: "A wonderful deal!"
KMT_event.79.b: "German Experience is for Germans only!"

KMT_event.80.t: "China Dissolves HAPRO"
KMT_event.80.desc: "Displeased with our hold in their economy, the Chinese have dissolved HAPRO and taken their share of the profits and left, ending our cooperation and removing our access to cheap resources in China."
KMT_event.80.a: "I guess it's fait accompli"
KMT_event.80.b: "Damn You, Chiang!"

KMT_event.81.t: "[FROM.GetNameDefCap] Demands Full Control Over the Bandit Suppression Headquarters"
KMT_event.81.desc: "[FROM.GetNameDefCap] has demanded that we have flirted too much with the communists and that our diplomatic closeness to them is inacceptable. As such, they have demanded we rejoin the central government and allow them to lead us against the insurgency."
KMT_event.81.a: "Of Course, we are loyal members of the NRA after all!"
KMT_event.81.b: "To do this would be to doom China!"
KMT_event.81.c: "Zhang Xueliang and his loyalists swap sides!"

KMT_event.82.t: "Chaos in Xian"
KMT_event.82.desc: "Chaos has hit Xian as Zhang Xueliang and half of the Northeastern army have defected to [PRC.GetNameDef]. In the wake of this, the northwest army has secured Xian itself, as Xueliang and the Communists have taken charge of the surrounding countryside..."
KMT_event.82.a: "China is in flames again..."

KMT_event.812.t: "[FROM.GetNameDefCap] Demands Dissolution of the Bandit Suppression Headquarters"
KMT_event.812.desc: "[FROM.GetNameDefCap] has stated that since the communists are dealt with, there is no point in our existence as an entity, as such they have requested us to rejoin them, with a thinly veiled threat that they will invade us otherwise, to prevent a resurgenr Fengtian clique."
KMT_event.812.a: "Of Course, we are loyal members of the NRA after all!"
KMT_event.812.b: "The Clique has won one war, it will win another!"

KMT_event.83.t: "[FROM.GetNameDefCap] Seizes Control of Shimen"
KMT_event.83.desc: "[FROM.GetNameDefCap] has decided that we are too close to the Japanese and Beijing is too vulnerable. As such they have marched into our territory and are moving quickly to seize Beijing. At the same time they have successfully called for large parts of our army to join the central government, drastically weaking our position..."
KMT_event.83.b: "Beijing will stay under our hold!"
KMT_event.83.c: "We have no choice but to retreat and appeal to the Kwantung Army"

KMT_event.84.t: "Chaos in Beijing"
KMT_event.84.desc: "Chaos has erupted as the Kwantung Army again expands it's sphere in northern China. As Beijing was seized by the NRA, the remains of the Hebei-Chahar Garrison joined the Kwantung army under the promise that Beijing and Shimen would later be returned... Now both the Central Government and Japan's spheres of influence have expanded and tensions are skyrocketing..."
KMT_event.84.a: "China is in flames again..."

KMT_event.85.t: "Song resists!"
KMT_event.85.desc: "As our army has secured Shimen and continues north, the Beijing garrison has refused us entry into the city and Song has refused to submit to our authority... We are now in an open stat of war with this traitor!"
KMT_event.85.a: "Death to Traitors!"

KMT_event.86.t: "[FROM.GetNameDefCap] Demands Troop Access"
KMT_event.86.a: "Yet it is worth it."
KMT_event.86.b: "Autonomy is not debatable."

KMT_event.87.t: "[FROM.GetNameDefCap] Demands Submission"
KMT_event.87.desc: "After the Liangguang incident, our loyalty has been greatly questioned by the KMT upper leadership, as a result they have now demanded full submission to the central Government."
KMT_event.87.a: "It is our duty."
KMT_event.87.b: "We will not submit to Chiang!"

KMT_event.90.t: "The Central Government Prepares to Integrate the Cliques"
KMT_event.90.desc: "The Central Government has decided to use our alliance to begin to centralize the Nation. We must be wary if we do not seek to fall to their influence..."
KMT_event.90.a: "Let us be wily as snakes and tame as doves..."

KMT_event.91.t: "The Central Government Prepares Invigorates Integration Efforts"
KMT_event.91.desc: "The Central Government has decided to clamp down on our Clique and has begun to further integrate us, slowly eroding our power..."
KMT_event.91.a: "Towards a United China!"
KMT_event.91.b: "This is unacceptable!"
KMT_event.91.c: "All of China Must Rally against this Madness!"

KMT_event.92.t: "[FROM.GetNameDefCap] Calls us to join arms against Nanjing!"
KMT_event.92.desc: "After the Central Government has begun clamping down on our cliques, [FROM.GetNameDef] has decided to stop this, as such they have declared a revolt and called all warlords to join them in solidarity!"
KMT_event.92.a: "Down with these Traitors!"
KMT_event.92.b: "Down with Nanjing!"

KMT_event.93.t: "[FROM.GetNameDefCap] Requests our Intervention Against the Communists"
KMT_event.93.desc: "With their war against [PRC.GetNameDef] started, the Nationalist Government has decided to offer us the Yan'an basin in exchange for our intervention, which would allow us to encircle the communists for them."
KMT_event.93.a: "Not After the Central Plains War."
KMT_event.93.b: "Renewed Influence? Glorious!"

KMT_event.94.t: "The Kwantung Army Prepares for War!"
KMT_event.94.desc: "With Recent developments in China pitting the NRA and the Kwantung Army closer into eachother's spheres of influence, it seems the Kwantung Army is preparing for a war of it's own against China, despite the Emperor's Veto."
KMT_event.94.a: "This does not bode well..."

KMT_event.95.t: "The Politicization of the NRA"
KMT_event.95.desc: "The NRA, especially it's dominant pro-Chiangist Whampoa clique has had quite a history. Especially it's use in politics is quite interesting, as with blocks in the traditional power bases, Chiang has used them to rule with impunity and lead the nation according to his wishes. At this point in time, however, Chiang must decide if he wishes to keep his little party army or slowly transition away from Whampoa and towards a more balanced government."
KMT_event.95.a: "The Whampoa Clique is Key to Chinese Politics!"
KMT_event.95.b: "A Modern Country needs a Depoliticized Army..."

KMT_event.96.t: "The Nanjing Decade's March To Progress"
KMT_event.96.desc: "In the Past Years we have seen incredible Economic growth, growth that we shall set forth to maintain. Despite having lost a vast amount of some of our riches and most industrious lands, we [ROOT.GetNameDef] have bested both that and the great depression and have achieved the impossible, a larger economy than before both of those calamities... In just a few years we have shocked the world and achieved more economic growth and modernization than the Qing did over all of the centuries!"
KMT_event.96.a: "All hail the Dang and what it has done for the Country!"
KMT_event.96.b: "A true testament to the Chinese Nation and its prowess!"
KMT_event.96.c: "It has been a time of democratization on top of the modernization!"

KMT_event.97.t: "The Central Government Requests to Purchase a Resource Monopoly over [FROM.FROM.GetName]"
KMT_event.97.desc: "In the wake of the launching of their Three Year Plan, the Central Government has, in cooperation with the National Resources Commission decided to implement a series of Resource Monopolies all over China. As such they have decided that the deposits in [FROM.FROM.GetName] are highly valuable and have requested to purchase the rights to them."
KMT_event.97.a: "These Profits cannot be lost!"
KMT_event.97.b: "Who are we to refuse their Money?"

KMT_event.98.t: "The Focus of the Reform"
KMT_event.98.desc: "As we go about reforming the taxation system, we must choose where to focus our reforms on in order to accomplish our desired goals for the Nation. Our two greatest issues are lack of capital and corruption, so we must choose to double down on one of these or spread our efforts across both. Each has their own unique advantages, so let us be tame as doves and wily as serpents as we choose what will keep us in the graces of the people."
KMT_event.98.a: "The focus of the reforms should be to bring in money!"
KMT_event.98.b: "The key to harmony is moderation and balance!"
KMT_event.98.c: "Our Economy can only grow if corruption is deal with!"

KMT_event.99.t: "H. H. Kung Embezzles the Dollar Bonds"
KMT_event.99.desc: "Our Dollar Bonds have proven to be excellent value for money, which would seem as if they'd be perfect to remove excess currency from the market. We however failed to take into account the rampant corruption in our regime and to our great dismay H. H. Kung and his economic clique have never even put them out on the market, instead taking them for themselves..."
KMT_event.99.a: "An so inflation rises further..."

KMT_event.100.t: "[FROM.GetLeader] Requests [ROOT.GetAdjective] Investments"
KMT_event.100.desc: "As part of the [FROM.GetAdjective] modernization and industrialization programme, [FROM.GetLeader] has requested that we invest into them. In exchange we would be receiving resources from their nation and help lift the millions of Chinese out of poverty, along with making a long term partnership possible."
KMT_event.100.a: "Gladly!"
KMT_event.100.b: "The KMT is too corrupt to get [ROOT.GetAdjective] money..."

KMT_event.101.t: "On Reintroducing the Grain Tax"
KMT_event.101.desc: "The grain tax has been a key to building up many a Chinese dynasty. While it now goes to the provinces, we must change that to be able to adequately fund our military and economy. If we are to do this, however, we must decide how we shall do it. While we could force the provinces to fully hand it over to us, that would lead to a massive conflict with them, potentially causing more damage than it is worth. Instead, we could make a compromise with them, where they only hand us a portion of it instead, making both ends meet."
KMT_event.101.a: "Let us come to a compromise."
KMT_event.101.b: "Full submission to Nanjing is undebatable."

KMT_event.102.t: "The Focus of Our Military Schooling Program"
KMT_event.102.desc: "With our military schooling program beginning in earnest, we must decided what to focus on in the forefront of our new education system. After all, if the Whampoa Clique does not know what to focus on, how should they preform well on the battlefield?"
KMT_event.102.a: "We must make sure to focus on the big picture."
KMT_event.102.b: "The Infantry is the bread and butter of the NRA."
KMT_event.102.c: "The Infantry cannot win without artillery support."
KMT_event.102.d: "Amor is what will lead us to victory!"

KMT_event.103.t: "[FROM.GetNameDefCap] Requests Joint Exercises with our Troops"
KMT_event.103.desc: "As part of their army modernization program, [FROM.GetNameDef] has decided to request the opportunity to conduct joint training with our troops, allowing for both our nation's militaries to profit, though some of our more nationalistically minded folk oppose this."
KMT_event.103.a: "Sure, where is the harm?"
KMT_event.103.b: "Our military secrets are for us alone!"

KMT_event.104.t: "The Sino-[ROOT.GetAdjective] Joint Commission on Rural Reconstruction is Formed"
KMT_event.104.desc: "Due to our influence in China, they have recognized our expertise in rural affairs, as such they have reached out to some of our experts and gained their help in their efforts in rural construction. As such we have gained great political capital and influence in China."
KMT_event.104.a: "The world sees it, no one surpasses our expertise and influence!"

KMT_event.105.t: "The Fall of [FROM.FROM.GetName] Brings Economic Chaos"
KMT_event.105.desc: "As the great city of [FROM.FROM.GetName] has fallen to invading hordes of barbarians, inflation skyrockets, as a major source of government revenue has disappeared. With this, many economic masterminds are quite alarmed at the start of the Chinese economy, seeing revenue collapse and inflation increase, as the KMT has resorted to more and more printing to cover the lacking expenditure."
KMT_event.105.a: "This is horrible!"

