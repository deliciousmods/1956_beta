 MAN_56_event.1.t: "The Kwantung Army Requests Support"
 MAN_56_event.1.desc: "The Kwantung Army has requested that we send them more weapons and men to help them stabilize Manchuria and consolidate their control there. What do we say to such an offer?"
 MAN_56_event.1.a: "Japanese Resources are for the Japanese"
 MAN_56_event.1.b: "We would be fools to refuse"

 MAN_56_event.2.t: "The NRA Restarts Manchurian Operations"
 MAN_56_event.2.desc: "In their goal to unify all of China, including our state, the Chinese have decided to restart operations in Manchuria, restarting this brutal guerrilla war.\n\nIn other words, China is now beginning to mess with our balance of power and we must therefore watch out for, or remove said threat."
 MAN_56_event.2.a: "Unfortunate times are upon us."

 MAN_56_event.3.t: "Manchuria Ignited"
 MAN_56_event.3.desc: "Today the Emperor has announced that it is time to drive out the Japanese. As such his forces and garrisons have risen up, starting a massive insurgency in Manchuria, with resistance against Japan at a level not seen since the days of the Fengtian Clique. Only time will tell if Puyi and his regime may survive..."
 MAN_56_event.3.a: "All hail the Qing"

 MAN_56_event.4.t: "Puyi requests our help"
 MAN_56_event.4.desc: "Today Puyi has sent a secret envoy to our outposts near the border with Manchuria. He has requested our support for his secret uprising, with the goal to bring about the vanquishing of Japanese influence in Manchuria...\nWhile we may oppose certain parts of his ideology, this may be a great chance to push the Japanese out of the continent."
 MAN_56_event.4.a: "The enemy of my enemy is my friend"
 MAN_56_event.4.b: "Excuse me, who?"
 MAN_56_event.4.c: "Such insolence must be reported at once!"

 MAN_56_event.5.t: "[FROM.GetNameDefCap] demands full withdrawal from Manchuria."
 MAN_56_event.5.desc: "With them having consolidated power over their state through recent times, the Manchurians have grown weary of our occupation or a few remaining states. They now demand we return their whole country. What do we do about this?"
 MAN_56_event.5.a: "These Lands are rightfully Japanese!"
 MAN_56_event.5.b: "They have beaten the Kwantung army once, and will win again. It would be stupid to resist!"

 MAN_56_event.6.t: "Puyi Requests the Bolstering of Bandit Operations"
 MAN_56_event.6.desc: "There are many bandits in Manchuria that are funded by our government, to capitalize on this, Puyi has asked to help us escalate these efforts, to swiftly bring about an end to the Japanese rule."
 MAN_56_event.6.a: "A method to fight the Japanese? Splendid!"
 MAN_56_event.6.b: "This would give him too much knowledge on our operations"

 MAN_56_event.8.t: "Puyi Asks for the Northeast Army"
 MAN_56_event.8.desc: "The northeast army, under Zhang Xueliang, has long since fought the Japanese and itches to do so again. As such, Puyi has suggested it be transferred to him at the conspiracy's launch, allowing him to use these forces to drive out the Japanese."
 MAN_56_event.8.a: "If it is their will, of course!"
 MAN_56_event.8.b: "Give up our forces? No way!"

 MAN_56_event.9.t: "Puyi Proposes a Further Deal"
 MAN_56_event.9.desc: "Puyi, seeing our displeasure in the creation of a second national government in China has offered us a deal, in exchange for a massive amount of guns, he will drop the Qing claim to all lands outside of Manchuria, ensuring peace in our time."
 MAN_56_event.9.a: "Fight the Japanese and secure peace? Hell yeah!"
 MAN_56_event.9.b: "That land is still Chinese!"

 MAN_56_event.10.t: "Spies Report Suspicious Activities..."
 MAN_56_event.10.desc: "Our spies have come to us with a report that Puyi may indeed be plotting something against us, while there is no proof that this is indeed the case, certain evidence points in the direction..."
 MAN_56_event.10.a: "We must remain vigilant."

 MAN_56_event.11.t: "The 125th Army Reports Bribery..."
 MAN_56_event.11.desc: "The 125th Army reports that someone tried to bribe them, quite possibly Puyi, with the goal of swaying them to his side, while there is no proof that this is indeed the case, certain evidence points in the direction..."
 MAN_56_event.11.a: "Noted."

 MAN_56_event.12.t: "[FROM.GetNameDefCap] Claims to Have Proof of a Manchu Insurgency"
 MAN_56_event.12.desc: "[FROM.GetName] has claimed that Puyi reached out to them to establish relations and receive help in overthrowing us. While this could be a lie, we are quite wary..."
 MAN_56_event.12.a: "Rebellion will never defeat our nation!"

 MAN_56_event.13.t: "Japan Moves to Depose the Emperor"
 MAN_56_event.13.desc: "The Japanese seem to believe that the Emperor is conspiring against them and then have moved to purge him. The emperor must now decide his fate..."
 MAN_56_event.13.a: "The Emperor declares the end of Japanese Rule"
 MAN_56_event.13.b: "The Emperor takes his life"

 MAN_56_event.14.t: "The Fate of Manchuria"
 MAN_56_event.14.desc: "With the Japanese having withdrawn from our nation, the Emperor must act decisively, with pressure from many pro-independence groups mounting and the Kwantung army seeking to establish its hold on the state. The fate of Manchuria truly hangs on a strand of silk."
 MAN_56_event.14.a: "The Emperor declares the end of Japanese Rule"
 MAN_56_event.14.b: "The Emperor submits to the Kwantung Army"

 MAN_56_event.15.t: "The Jackboot of the Kwantung Army"
 MAN_56_event.15.desc: "The Kwantung Army has seized Manchuria for Japan and now rules it, heavily influencing all functions of the state and having the Emperor merely as a puppet under its own control. It is they who truly call the shots in this pseudo-state.\n\nAnd yet the Kwantung army is not all powerful and depends heavily on its own military success, should it start losing in the field, its grip at home may very well begin to erode as well."
 MAN_56_event.15.a: "Noted..."

 MAN_56_event.16.t: "Manchuria Seeks further Cooperation"
 MAN_56_event.16.desc: "Manchuria has now requested we complete the next step in our cooperation. That we permanently and officially give up our claims on Them."
 MAN_56_event.16.a: "This goes against the principles of the revolution."
 MAN_56_event.16.b: "Of course, a toast to our new allies!"

 MAN_56_event.17.t: "Manchuria Breaks into Chaos"
 MAN_56_event.17.desc: "In our war with Manchuria, they have broken into chaos, beginning a fight for independence. Puyi leads the charge to drive out the Japanese, our true enemies from this speck of Land in northern China."
 MAN_56_event.17.a: "Despite this, Puyi is still our enemy."
 MAN_56_event.17.b: "The enemy of our enemy is our friend."

