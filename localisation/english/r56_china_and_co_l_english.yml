KMT_the_invaders_vanquished: "The Invaders Vanquished"
KMT_the_invaders_vanquished_desc: "The Japanese and the other foreigners have been driven out of China! We have finally saved the nation from further humiliations!"

KMT_the_national_government_secured: "National Governance Secured"
KMT_the_national_government_secured_desc: "We have done it! All of central China has been secured and the communists snuffed out! China is one and China is strong! None will resist the KMT!"

KMT_wittle_down_the_cliques: "Wittle Down the Cliques"
KMT_wittle_down_the_cliques_desc: "The Various Warlord Cliques have been causing all kinds of trouble for us in recent times, it is now time to start slowly pushing them back with help of the NRA!"

KMT_utilize_asymetric_warfare: "Wage Unequal War"
KMT_utilize_asymetric_warfare_desc: "If we are to win this war, we cannot fight as a normal nation, instead we shall fight the enemy where he isn't. We will stab him in the back and destroy his fighting capability before he gets to the front!"

KMT_work_towards_the_integration_of_the_cliques: "Integrate the Cliques"
KMT_work_towards_the_integration_of_the_cliques_desc: "The various clique that are keeping our nation divided must go, we will begin to integrate them and annex them as fast as possible!"


KMT_end_the_red_menace_once_and_for_all: "Permanently Deal With the Red Menace"
KMT_end_the_red_menace_once_and_for_all_desc: "It is time to deal with the Communists once and for all, there are no more Japanese to mess with us and now we can give them our full attention. Let us start by seizing the key points they have seized control of!"


KMT_deal_with_the_traitor_in_nanning: "Never Another Liangguang"
KMT_deal_with_the_traitor_in_nanning_desc: "The Guangxi and Guangdong Cliques attempted to betray us. We must ensure that this is not let go. As such we will demand their submission and ensure a grip over the south, so that this will not happen again!"

KMT_increase_preparations_for_the_united_front: "Increase Preparations for a United Front"
KMT_increase_preparations_for_the_united_front_desc: "While we are not pleased with this, considering how much the Japanese are pushing us, we must be ready to work with the communists. If this is to go well, we may as well get the infrastructure ready ahead of time!"

KMT_march_into_the_communist_basin: "Cleanse the Yannan Base Area"
KMT_march_into_the_communist_basin_desc: "With the Bandit Suppression Headquarters secured, we can insure that it's job is fulfilled, we will march on Yannan and destroy this communist staging ground for good. Communism must never take root in China!"

KMT_secure_the_yellow_river_line: "Secure the Yellow River Line"
KMT_secure_the_yellow_river_line_desc: "The Yellow River is key to defending northern China from the Japanese, as such, we will demand our army be let into Shanxi so that we can properly entrench and prepare the land there for the war."

KMT_disband_the_bandit_suppression_headquarters: "Directly Control the Bandit Suppression HQ"
KMT_disband_the_bandit_suppression_headquarters_desc: "If the Communists are to fall at all, we must relieve Zhang Xueliang of his duties in the bandit suppression headquarters, as he is ignoring them. Let us instead demand their integration into the NRA and end the communists ourselves!"

KMT_set_up_the_big_rear_plan: "Set Up the Big Rear Plan"
KMT_set_up_the_big_rear_plan_desc: "With a Japanese Invasion on the horizion, we must be ready, we will make sure that all preparations for the big rear plan are done ahead of time and that is can be implemented swiftly!"

KMT_destroy_the_remnants_of_the_NCAM: "Destory the NCAM Remnants"
KMT_destroy_the_remnants_of_the_NCAM_desc: "Japan has sought to split north China off of us, let us undo this to the last bit, even dissolving the Japanese puppet state in East Hebei."

KMT_end_songs_flirtations: "End Song's Flirtations"
KMT_end_songs_flirtations_desc: "Song and his army in Beiping have beeen far too comfortable working with the Japanese and even occasionally collaborating with the North China Autonomy Movement. This must be ended, and to do this, we will send him an ultimatum at the same time as we march towards the forbidden city."

KMT_military_reconstruciton_tt: "All decisions regarding to removing §YNational Devastation§! will have halved prices and take §Y20§! days less"

