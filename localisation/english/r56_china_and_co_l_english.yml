KMT_2_nanjing_decade_desc: "During the Second Nanjing Decade and its peace and stability, the economy is thriving and growing at an absurd level, even overtaking its pre second Sino-Japanese war state, despite having had most of its industry torn up and destroyed. If things keep on going this swimmingly, it seems that China may become a major in its own right!\n\n§RThe §YSecond Nanjing Decade§! will end should one of the following occur:\n 1. §Y[ROOT.GetNameDef]§! no longer controls §Y[1114.GetName]§!\n 2. More than §Y10%§! surrender progress\n 3. §YPartial Mobilization§!  has been surpassed§!"
KMT_nanjing_decade: "Nanjing Decade"
KMT_nanjing_decade_desc: "During the Nanjing Decade and its peace and stability, the economy is thriving and growing at an absurd level, even overtaking its pre great depression state, despite having lost Manchuria. If things keep on going this swimmingly, it seems that China may become a major in its own right!\n\n§RThe §YNanjing Decade§! will end should one of the following occur:\n 1. §Y[ROOT.GetNameDef]§! no longer controls §Y[1114.GetName]§!\n 2. More than §Y10%§! surrender progress\n 3. §YEarly Mobilization§! has been surpassed (You may have §YPartial Mobilization§! if you have completed §YFinalize War Preparations§!)§!"
