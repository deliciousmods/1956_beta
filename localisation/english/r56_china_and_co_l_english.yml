  XIC_towards_peace_across_china_r56: "Towards Peace Across China"
  XIC_towards_peace_across_china_r56_desc: "Nanjing's internal-first military policies are leaving China devastated and unprepared for the increasingly militarizing Japan. We must end our subservience in this arrangement, so that we may instead turn all of China against the true enemies of our nation: [JAP.GetNameDef]."

  XIC_force_an_end_to_the_fighting_r56: "Force an End to the Fighting"
  XIC_force_an_end_to_the_fighting_r56_desc: "Despite the communist's clear willingness to come to the negotiation table, Nanjing remains firm and unnegotiable. We must force them to the table by any means necessary."

  XIC_return_to_nanjing_r56: "Return to Nanjing"
  XIC_return_to_nanjing_r56_desc: "Despite our many differences, our mission is complete and the time has come for us to return home. A strong China must come out from the conflicts ahead; only together, with unbroken unity, may we achieve this!"

  XIC_synthesis_with_the_communists_r56: "Synthesis With the Communists"
  XIC_synthesis_with_the_communists_r56_desc: "One of the saddest tails of China's 20th century has been the absence of dialogue and the opening of violence across our revolution. While they are not perfect, the Chinese Soviet Republic is fighting for a better future than the capitalist order we've maintained. We shall fight as one to achieve prosperity for all of China!"

  XIC_finish_the_encirclement_campaign_r56: "Finish the Encirclement Campaign"
  XIC_finish_the_encirclement_campaign_r56_desc: "The Chinese Soviet Republic has been shook and beaten to the point of near-destruction. It would be a tragedy for us to end operations against them at this point of close victory. We shall march into the Yan'an base area and crush China's internal threat once and for all!"

  XIC_consolidate_authority_in_shaanxi_r56: "Consolidate Control in [622.GetName]"
  XIC_consolidate_authority_in_shaanxi_r56_desc: "We have done what so many considered impossible. With the communists shaken out of the Yan'an base area for good, it is time for us to establish a proper Kuomintang administration in the region. With China's internal enemy finally destroyed, prosperity will follow for the nation!"

  XIC_a_new_path_for_china_r56: "A New Path for China"
  XIC_a_new_path_for_china_r56_desc: "The Sixth Encirclement Campaign has propelled Zhang Xueling to dominance once more in China's north. The regime in Nanjing has failed the needs of our people; we can answer to them and unite the nation for a brighter tomorrow!"

 LKMT_sov_agreemnt:0 "The Left-Kuomintang and the Soviet Union are Cooperating"

CHI_warlords.1.t: "The Question of the System"
CHI_warlords.1.desc: "Before we go about writing our constitution, we must decide what type of system our country should have. We could either have one with a strong permanent guiding hand of the warlord, where he is the president of each government, or we could have one where the parties will be fully empowered to run parliament as they please."
CHI_warlords.2.t: "The Question of the Constitution"
CHI_warlords.2.desc: "Writing a Constitution has not turned out easy, in fact it has caused much discussion. Many people believe the constitution should empower a strong executive, while others believe these duties should be left to the deep state. Now it is up to the warlord what to choose."
CHI_warlords.3.t: "Election Results"
CHI_warlords.3.desc: "We have finally held free elections. Now that this is done it is time to see who has won!"
CHI_warlords.4.t: "[FROM.GetNameDefCap] Seeks to Submit to Us."
CHI_warlords.4.desc: "It seems as though [FROM.GetNameDef] is afraid, as they have decided to abandon the plan for federalism for all China, instead they have reached out and offered to subjugate themselves to us, so long as we allow them to maintain the policies of federalism in their own land and governates. Do we make use of this to unite China, or do we hold out and fight and conquer these lands to implement direct rule?"
CHI_warlords.5.t: "The War of Resistance!"
CHI_warlords.5.desc: "What we have greatly feared for a long time has occurred! The Japanese, who have been meddling in our country and abusing our people for far too long, have finally pushed things so far that a war has broken out between us. With this, the War of Resistance has broken out and it is time to fight for our very survival!This does, however bring up a question. Do we invite the other Chinese cliques to join our great fight?"
CHI_warlords.6.t: "A Proposal to Save China!"
CHI_warlords.6.desc: "The greatest Disaster for the Chinese People has occurred! [JAP.GetNameDefCap] has invaded our Country! [CUG.GetNameDef] seems wildly unprepared for this task. As such they have called out to all Chinese people to join them in repelling the Japanese! Our own people very much support this grand show of solidarity to fight off the invaders and save China, however it may not serve our best interest. What do we do about this?"
CHI_warlords.7.t: "A Warlord Offers to Join Our Republic"
CHI_warlords.7.desc: "[FROM.GetLeader] from [FROM.GetNameDef] has offered to fully rejoin our great Republic, however he requests to be able to control his Clique as a somewhat autonomous Puppet. Do we accept this?"
CHI_warlords.8.t: "Who Are We a Bulwark Against?"
CHI_warlords.8.desc: "With us having declared ourselves a Bulwark of Defense, this raises a question: Who are we defending against?"
CHI_warlords.9.t: "Ultimatum from [FROM.GetNameDef]"
CHI_warlords.9.desc: "[FROM.GetNameDefCap] Has Sent Us an Ultimatum demanding various lands of ours they have claimed. They have already begun to seize these Lands, the question is do we stop them or do we fight to hold our Land?"
CHI_warlords.10.t: "[FROM.GetNameDefCap] Seeks Protection"
CHI_warlords.10.desc: "We have just received an envoy from the warlord in [FROM.GetName]. The warlord seeks help against the threats from [Jap.GetName] and [PRC.GetName] and protection from our own Regime. Therefore he has offered to submit to our protection and foreign policy in exchange for maintaining his power over his Clique."
CHI_warlords.11.t: "[FROM.GetNameDefCap] Bribes Our Officials!"
CHI_warlords.11.desc: "We have gotten wind of the fact that [FROM.GetNameDef] has just bribed our officials to sign a Non-Aggression Pact with them. Of course this money is quite nice, however some question the fact that it comes at the expense of uniting our Country."
CHI_warlords.12.t: "[FROM.GetNameDefCap] Seeks to Change Alignment"
CHI_warlords.12.desc: "[FROM.GetNameDef] has sent us a delegation, asking if they would have a place in the Japanese sphere and they have announced that they will align with us and later become our subject, should we be willing to accept them."
CHI_warlords.13.t: "[FROM.GetNameDefCap] Requests Additional Guns"
CHI_warlords.13.desc: "[FROM.GetNameDefCap] has requested additional guns in order to help unite China under them. How much, if any, do we send them?"
CHI_warlords.14.t: "The National Unity Congress"
CHI_warlords.14.desc: "The National Unity Congress has convened and there has been great discussion. The Nationalist Revolutionaries have come and demanded a great Chinese State under the guard of the Warlord along with their National Regeneration league to purge the country of Corruption and foreign influence. On the other side the Nationalist Imperialists have demanded that the Warlord take up the mantle of the Mandate of Heaven and declare a new Chinese Empire!"
CHI_warlords.15.t: "The Regency Council Report"
CHI_warlords.15.desc: "We have had the Regency Council convene and they have pondered the fate of the monarchy in China. They have agreed to make the Warlord Emperor of all China!"
CHI_warlords.16.t: "A Request from [FROM.GetNameDef]"
CHI_warlords.16.desc: "An envoy from [FROM.GetNameDef] has just come over here with one request. He has requested that we remove our support for [CHI.GetNameDef] and instead support them. Do we oblige?"
CHI_warlords.17.t: "A Request from the Hui People"
CHI_warlords.17.desc: "An envoy from the Muslim Hui people in [FROM.GetNameDef] has approached us and offered a deal. They have requested that we support them in their unification of the Islamic areas of China and they have offered to be a protectorate of ours."
CHI_warlords.18.t: "The Coalition for National Survival"
CHI_warlords.18.desc: "[FROM.GetNameDefCap] has reached out to us to offer to submit to us and join us in a coalition government. Their reasoning for this is that it is necessary for the survival of China, as the Japanese are coming for us. According to some pessimists in our military, however, it is assumed that while they will be loyal so long as China is under direct threats from Japan or other invaders, they may well betray us..."
CHI_warlords.19.t: "[FROM.GetNameDefCap] Has Refused Our Offer"
CHI_warlords.19.desc: "Our envoy to [FROM.GetNameDef] has returned with terrible news. The government of [FROMGetNameDef] has refused our offer to them."
CHI_warlords.20.t: "[FROM.GetNameDefCap] Has Accepted Our Offer"
CHI_warlords.20.desc: "Our envoy to [FROM.GetNameDef] has returned with great news. The government of [FROMGetNameDef] has accepted our offer to them."
CHI_warlords.21.t: "[JAP.GetNameDefCap] has Responded to Our Request"
CHI_warlords.21.desc: "Our envoy to [JAP.GetNameDef] has returned with news from the Japanese army. They have come to a conclusion and have announced how many guns they have sent us!"
CHI_warlords.22.t: "Betrayal!"
CHI_warlords.22.desc: "With direct threat to us over, [FROM.GetNameDef] has betrayed us! They have in preparation for rekindling the Chinese civil war called out to our garrisons and a fourth of them have joined them, drastically boosting them in the now inevitable civil war."
CHI_warlords.23.t: "The Army Revolts!"
CHI_warlords.23.desc: "Our greatest nightmare has come about! Our plan to rely on the army has failed as one quarter of our troops too have defected to the enemy! It may soon be too late to save China!"
CHI_warlords.24.t: "[FROM.GetNameDefCap] Has Sent Us an Offer"
CHI_warlords.24.desc: "[FROM.GetNameDefCap] has sent us an offer. They claim that there are multiple great powers attempting to invade us. They offer that in exchange for us recognizing their authority as the National Government, they will embrace us as a federal state and give us all the rights associated with it. This will allow us to maintain all of our local internal policies, so long as we stay under their umbrella."
CHI_warlords.25.t: "[FROM.GetNameDefCap] Has Sent Us an Ultimatum"
CHI_warlords.25.desc: "[FROM.GetNameDefCap] Has Sent Us an Ultimatum. They Point at the, according to them, unjust occupation of Chinese Treaty Ports and demand that we pull out of China, effective immediately."
CHI_warlords.26.t: "[FROM.GetNameDefCap] Has Sent Us a Proposal"
CHI_warlords.26.desc: "[FROM.GetNameDefCap] has recognized something. Much can be done if the right people are given power. They have therefore offered [ROOT.GetLeader], should he submit to them, that he would gain a large sphere of influence around [ROOT.capital.GetCapitalVictoryPointName] and have full rights to his own internal policies."
CHI_warlords.27.t: "[FROM.GetNameDefCap] Demands Final Integration"
CHI_warlords.27.desc: "With China united, [FROM.GetNameDef] has decided it is time to fully unite China, as such, they have demanded that we, their governorate be integrated into them, what do we say to this?"
CHI_warlords.28.t: "[FROM.GetNameDefCap] Requests Peace"
CHI_warlords.28.desc: "Envoys from [FROM.GetNameDef] have reached out to our military officers on their border requesting peace and offering us full access through their lands. This would make it much easier to supply our army on one hand, however it would long term be disadvantageous for conquering all of China. What should we do?"
CHI_warlords.28.a:0 "Bit by bit the United Front crumbles!"
CHI_warlords.28.b:0 "We will show no mercy to cowards!"
CHI_warlords.29.t: "[FROM.GetNameDefCap] Requests the Removal of the Communists"
CHI_warlords.29.desc: "Envoys from [FROM.GetNameDef] have reached out to us and have pointed out the evils of communism. They therefore request the removal of [PRC.GetNameDef] from our alliance."
CHI_warlords.29.a:0 "They, are right, we must do this"
CHI_warlords.29.b:0 "The United Front must hold!"
CHI_warlords.30.t: "The Congress for the People's Survival"
CHI_warlords.30.desc: "Confucians, Christians and many other intellectuals have gathered together in response to our three purities and have come to the conclusion that we are evil and abusing them, they have therefore banded together to resist us and fight for their survival."
CHI_warlords.30.a:0 "They bring our wrath on themselves and have chosen their own fate..."
CHI_warlords.31.t: "The Fate of the Overrun Lands"
CHI_warlords.31.desc: "We have finally reclaimed certain lands which have long been overrun by foreign peoples, Russians, Manchus, Mongolians and so forth. This raises the question, what do we do with these disgusting subhumans?"
CHI_warlords.31.a:0 "We will establish separate states with special rights for the Chinese people!"
CHI_warlords.31.b:0 "These Chinese Lands must be purged from all foreign influence!"
CHI_warlords.32.t: "A Proposition from [FROM.GetNameDef]"
CHI_warlords.32.desc: "[FROM.GetNameDefCap] has in recent years become ever more divorced from the rest of China, therefore they have come to us with an offer, stating that they will offer to recognize our government if we recognize theirs, agreeing to a principle of 'One China, Two Systems'"
CHI_warlords.32.b:0 "That sounds reasonable, there is no reason to seek conflict here."
CHI_warlords.32.a:0 "We will unite China no matter what!"
CHI_warlords.33.t: "[FROM.GetNameDefCap] Seeks Guarantees"
CHI_warlords.33.desc: "[FROM.GetNameDefCap] has in recent years become a modern western state after our own ideals. They request our guarantees to protect their way of life, do we accept?"
CHI_warlords.33.a:0 "We have no reason to invest ourselves that way"
CHI_warlords.33.b:0 "Of course we will protect our friends!"
CHI_warlords.34.t: "[FROM.GetNameDefCap] Seeks Our Support"
CHI_warlords.34.desc: "[FROM.GetNameDefCap] has in recent years gone under a revolution under the Left Kuomintang and in their struggle for the national revolution, they have reached out to secure our support. What do we have to say about this?"
CHI_warlords.34.a:0 "We have no reason to invest ourselves that way"
CHI_warlords.34.b:0 "Cooperation with more Revolutionaries in China? Of course!"
CHI_warlords.35.t: "[FROM.GetNameDefCap] Seeks Recognition"
CHI_warlords.35.desc: "[FROM.GetNameDefCap] has, after gaining our support, now requested that we officially recognize them as the legitimate government of China and cease our support to [PRC.GetNameDef]"
CHI_warlords.35.a:0 "[PRC.GetNameDefCap] still has our trust!"
CHI_warlords.35.b:0 "[FROM.GetNameDefCap] is obviously the legitimate Government of China!"
CHI_warlords.36.t: "[FROM.GetNameDefCap] Proposes a Joint Ultimatum to [PRC.GetNameDef]"
CHI_warlords.36.desc: "[FROM.GetNameDefCap] proposed that we, as the PRC is dependent on us, send them an ultimatum, so as they may join [FROM.GetNameDef]. This will greatly boost our supported government in China, however it would invest us a bit more in the conflict."
CHI_warlords.36.a:0 "We have no reason to invest ourselves that way"
CHI_warlords.36.b:0 "Send the Papers"
CHI_warlords.37.t: "[FROM.GetNameDefCap] and [FROM.FROM.GetNameDef] Have Sent Us an Ultimatum..."
CHI_warlords.37.desc: "These two powers have joined together and demanded we fold into the Soviet backed government in [FROM.FROM.GetNameDef]. We are reliant on the Soviet Union and in no position to refuse, however some still want to fight against those nationalists."
CHI_warlords.37.a:0 "We will fight to the last breath!"
CHI_warlords.37.b:0 "We are doomed either way and may as well save our lives..."
CHI_warlords.38.t: "[FROM.GetNameDefCap] Requests Guns"
CHI_warlords.38.desc: "[FROM.GetNameDefCap] has requested guns in order to help unite China under them. How much, if any, do we send them?"
CHI_warlords.38.a:0 "We will send them 4000 guns"
CHI_warlords.38.b:0 "We will send them 1500 guns"
CHI_warlords.38.c:0 "We cannot send them anything"
CHI_warlords.39.t: "[SOV.GetNameDefCap] Has Responded to Our Request"
CHI_warlords.39.desc: "Our envoy to [SOV.GetNameDef] has returned with news from the Soviet army. They have come to a conclusion and have announced how many guns they have sent us!"
CHI_warlords.40.t: "[FROM.GetNameDefCap] Invites Us to the Second Anti-Chiang Coalition"
CHI_warlords.40.desc: "[FROM.GetNameDefCap] has reforged the Anti-Chiang Coalition! They now have invited us to join them and request our support in toppling the tinpot dictator! What do we say to this?"
CHI_warlords.40.a:0 "Why, Of Course!"
CHI_warlords.40.b:0 "This is merely a ploy to spread their own influence!"
CHI_warlords.41.t: "[FROM.GetNameDefCap] Has Declared National Governance"
CHI_warlords.41.desc: "[FROM.GetNameDefCap] has successfully led us in the anti Chiang Coalition as the KMT collapses in Nanjing. However, they have used this as an opportunity to declare National Governance and now demand our obedience and submission in their bid to consolidate their control over the country, yet they do promise us internal autonomy over all our domestic politics... What do we say to such an offer?"
CHI_warlords.42.t: "Our Place in the United Front"
CHI_warlords.42.desc: "With the Chinese United Front having fulfilled it's purpose and become obsolete, it is now time to determine our fate in it, as [CUG.GetNameDefCap] has now been increasingly dominating it, to the point that we are being increasingly drawn into their sphere."
CHI_warlords.42.a: "Our Role is with and under Chinese rule"
CHI_warlords.42.b: "We must forge our own fate!"
CHI_warlords.43.t: "[FROM.GetNameDefCap] Joins the Front"
CHI_warlords.43.desc: "[FROM.GetNameDefCap] shares our love for China and has joined the united front, a great step forward!"
CHI_warlords.43.a: "For Better Or Worse We Are Comrades Now."
CHI_warlords.44.t: "[FROM.GetNameDefCap] Drops Out of the Conflict"
CHI_warlords.44.desc: "As we have no troops in the region to keep the conflict ongoing, the armies of [FROM.GetNameDef] have simply dropped out of the war."
CHI_warlords.44.a: "One Down, Many More to Go!"

CHI_warlords.45.t: "Famine!"
CHI_warlords.45.desc: "As our second harvest has been botched, our rising grain prices have exploded. Many have already begun to die as famine takes hold of Sichuan Province! Furthermore bandits have begun to raid all over the clique, especially targeting food stores. \nNow all we can do is appeal to the central Government for help!"
CHI_warlords.45.a: "Shangdi has forsaken us!"

CHI_warlords.46.t: "Famine in Sichuan!"
CHI_warlords.46.desc: "With all the Chaos going on in the province, Sichuan has now been hit by a famine. Unable to do anything about it, [SIC.GetLeader] has appealed for help from our government! To accept would greatly stabilize the province at a price, however refusing will alienate the people. What do we do about this?"
CHI_warlords.46.a: "We must save these Chinese lives!"
CHI_warlords.46.b: "This is not our concern!"
CHI_warlords.46.c: "We will help, for a price..."

CHI_warlords.47.t: "The Central Government Sends Aid"
CHI_warlords.47.desc: "Seeing the plight of our people, the central government has sent massive aid to our province, saving us from total collapse and death!"
CHI_warlords.47.a: "Zhonghua Minguo Wansui!"

CHI_warlords.48.t: "The Famine Ends!"
CHI_warlords.48.desc: "After a Successful harvest this summer, the Famine has ended, allowing for the Clique to stabilize once more!"
CHI_warlords.48.a: "Full Plates? Hooray!"

CHI_warlords.49.t: "The Central Government Ignores Us!"
CHI_warlords.49.desc: "Despite seeing the plight of our people, the central government has sent no aid to our province, as the famine spirals out of control..."
CHI_warlords.49.a: "We are Truly forsaken by all!"

CHI_warlords.50.t: "The Famine Spirals out of Control"
CHI_warlords.50.desc: "Instead of improving, the famine has begun to spiral ever more out of control. Yet another botched harvest has caused our woes to grow as deal bodies begin to pile up!"
CHI_warlords.50.a: "We are Truly forsaken by all!"

CHI_warlords.51.t: "The Famine Lessens"
CHI_warlords.51.desc: "It seems the worst has been withstood, as the famine is slowly being solved, a successful harvest has fixed the largest of woes and the banditry has been reduced a fair bit!"
CHI_warlords.51.a: "A ray of hope?"

CHI_warlords.52.t: "The Famine Ends!"
CHI_warlords.52.desc: "After a Successful harvest this autumn, the Famine has ended, allowing for the Clique to stabilize once more!"
CHI_warlords.52.a: "Full Plates? Hooray!"

CHI_warlords.53.t: "The Central Government Offers Aid, At a Price..."
CHI_warlords.53.desc: "The central government has decided they will help us with our famine, however this will come at a price, they demand we submit to their authority as compensation."
CHI_warlords.53.a: "Full Plates? Sign me up!"
CHI_warlords.53.b: "It isn't worth it..."

CHI_warlords.55.t: "Hu Hanmu Passes Away"
CHI_warlords.55.desc: "Hu Hanmu has been a pillar of the Kuomintang and a strong supporter of Chen Jitang, granting him a lot of political legitimacy on the national scene. His loss will certainly weaken the national influence of Chen Jitang."
CHI_warlords.55.a: "What a loss..."

