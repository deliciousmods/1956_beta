 KMT_continue_land_reform3:0 "Continue the Land Reform"
 KMT_continue_land_reform2:0 "Continue the Land Reform"
 KMT_continue_land_reform:0 "Continue the Land Reform"
 KMT_democracy:0 "Democracy"
 KMT_democracy_desc:0 "One founding principle of the KMT is democracy, and we will bring about a glorious one in the future! Democracy will be brought to China, sooner or later..."
 KMT_nationalism:0 "Nationalism"
 KMT_nationalism_desc:0 "The core principle of our revolution is Nationalism! China will be reformed into a national state and all Chinese must be united!"
 KMT_socialism:0 "Socialism"
 KMT_nanjing_academy_of_the_sciences: "Nanjing Academy of the Sciences"
 KMT_nanjing_academy_of_the_sciences_desc: "We shall now go ahead and create our own academy of the sciences, ensuring the long term success of the revolution by providing ourselves with high quality research."
 KMT_deal_with_the_traitors: "Deal with the Traitors"
 KMT_deal_with_the_traitors_desc: "Some have not been all too keen on our takeover of China and even opposed us. These traitors deserve death and shall also receive it."
 KMT_purge_of_the_academies: "Purge of the Academies"
 KMT_purge_of_the_academies_desc: "Our academies are full of traitors to ourselves and the revolution. This must stop at once."
 KMT_ensure_party_purity: "Ensure Party Purity"
 KMT_ensure_party_purity_desc: "We must ensure purity in our party. All will toe the chairman's line!"
 KMT_crackdown_on_the_confucianists: "Crackdown on the Confucianists"
 KMT_crackdown_on_the_confucianists_desc: "These traitors and peddlers of the People's Opium must die and their dissent stopped."
 KMT_purge_of_the_generals: "Purge of the Generals"
 KMT_purge_of_the_generals_desc: "We have many generals who are opposed to us and have allegiances to the old Chinese regime. The old must go, the new must come."
 KMT_the_great_purge_successful: "The Cultural Revolution Successful"
 KMT_the_great_purge_successful_desc: "Our Cultural Revolution has been met with great success! The Revolution shall finally go on unhindered."
 KMT_deal_with_bluehirt_remnants: "Deal with Blueshirt Remnants"
 KMT_deal_With_bluehirt_remnants_desc: "The Blueshirts have done many a bad thing to our people and were a scourge. These will finally be dealt with."
 KMT_socialism_desc:0 "According to Sun Yat-Sen the final principle of the KMT revolution is Socialism. We will use this to care for our people and ensure justice for them."
KMT_the_peoples_tutelage: "The People's Tutelage"
KMT_the_peoples_tutelage_desc: "To bring about democracy in China, we will make use of the people's tutelage to teach our people the ways of democracy in China."
KMT_demand_return_of_the_concessions: "Demand Return of the Concessions"
KMT_demand_return_of_the_concessions_desc: "We must now demand the return of the concessions. China will be united and we will start with our ports!"
KMT_smite_corruption:0 "Smite Corruption"
 KMT_smite_corruption_desc:0 "The time has come to Smite Corruption in China, destroying all vestiges of it, so that China can be free from itself."
 KMT_crackdown_on_communist_organizations:0 "Crackdown on Communists"
 KMT_crackdown_on_communist_organizations_desc:0 "A Crackdown on Communists in our country will be launched, purging it of their disgusting influence!"
 KMT_chaing_reinvigored:0 "Chiang Reinvigorated"
 KMT_party_empowered:0 "Party Empowered"
 KMT_increase_collaboration_with_the_blueshirts:0 "Increase Collaboration with the Blueshirts"
 KMT_increase_collaboration_with_the_blueshirts_desc:0 "Chiang increases his collaboration with the Blueshirts, allowing their influence to help shape our country. This will bring us a great victory!"
 KMT_maintain_the_red_generals_supremacy:0 "Maintain Chiang's Supremacy"
 KMT_maintain_the_red_generals_supremacy_desc:0 "The government must maintain the Generalissimo's supremacy in China! Glory to Chiang and his leading of our great state!"
 KMT_create_the_cbis:0 "Create the CBIS"
 KMT_create_the_cbis_desc:0 "Chiang will create the CBIS, our great spy organization, in order to secure our power in the state and enforce the will of the KMT."
 KMT_crackdown_on_capitalist:0 "Crackdown on Crime"
 KMT_crackdown_on_capitalist_desc:0 "The CBIS cracks down on all the crime in our country, capturing and imprisoning the evildoers, their bribes to be damned!"
 KMT_push_the_fabi:0 "Increase Circulation of the Fabi"
 KMT_push_the_fabi_desc:0 "It is imperative to push our new currency, the Fabi, in China, we will use it to consolidate our power over the industry and give us great new financial reserves."
 KMT_a_new_court:0 "A New Court"
 KMT_a_new_court_desc:0 "The party will put in place a new Court in our country to help smooth the transition to democracy so that we can fulfill our will for the state."
 KMT_reinvigorate_the_white_terror:0 "Reinvigorate the White Terror"
 KMT_reinvigorate_the_white_terror_desc:0 "The CBIS will reinvigorate the White Terror in China. Opposition and communists will be purged and dealt with and the Blueshirts empowered. Long live the Dang!"
 KMT_declare_martial_law:0 "Declare Martial Law"
 KMT_declare_martial_law_desc:0 "With the White Terror in place, it is time to make good on our plans and officiate what we are already doing. We will declare martial law, allowing us to do what we already are and allowing us to act with impunity."
 KMT_prepare_for_new_elections:0 "Prepare for new elections"
 KMT_prepare_for_new_elections_desc:0 "The Party will now begin to prepare for new elections, moving forward the last stones to allow us to hold these."
 KMT_consolidate_party_supremacy:0 "Consolidate Party Supremacy"
 KMT_consolidate_party_supremacy_desc:0 "The government will consolidate the supremacy of the party, allowing us to act with impunity towards Chiang, allowing democracy to spring forth!"
 KMT_enforce_chaings_compliance:0 "Enforce Chiang's Compliance"
 KMT_enforce_chaings_compliance_desc:0 "The Party will Enforce Chiang's compliance to our cause. He must now announce his willingness to step down and cede control of the nation to us."
 KMT_a_new_constitution:0 "Finish the Constitutional Draft"
 KMT_a_new_constitution_desc:0 "Chiang and the party have worked hard to finally finish the constitutional draft and finally have a proper constitution for our state. All that remains is to decide who will profit from it..."
 KMT_seize_merchant_assets:0 "Seize Merchant Assets"
 KMT_seize_merchant_assets_desc:0 "In order to equalize the wealth of the Chinese people, the state must seize the assets of the wealthy merchants which do their business in China, taking for the people what is rightfully theirs. We shall no longer tolerate those who extort the working class!"
 KMT_legalize_the_party_left:0 "Legalize the Party Left"
 KMT_legalize_the_party_left_desc:0 "Chiang will legalize the left wing of the party again, in order to build a great united front against the japanese."
 KMT_nationalize_bourgeoise_industries:0 "Nationalize Capitalist Properties"
 KMT_nationalize_bourgeoise_industries_desc:0 "The state now finally Nationalizes the Industries of the Capitalists, who bereave the Chinese workers of what is theirs by right! China will be free from such evil men."
 KMT_legitimize_the_fabi:0 "Legitimize the Fabi"
 KMT_legitimize_the_fabi_desc:0 "With our new currency in place and pushed throughout China, we will work towards its legitimization, allowing for China to have a great economy in the near future!"
 KMT_seize_foreign_assets:0 "Seize Foreign Assets"
 KMT_seize_foreign_assets_desc:0 "China will seize assets of the foreign imperialists who are encroaching on our country."
 KMT_consolidate_government_control_of_industry:0 "Consolidate Government Control of Industry"
 KMT_consolidate_government_control_of_industry_desc:0 "We can now consolidate control of industry in this nation and insure our power over it to support our industrial overmight."
 KMT_push_for_full_control:0 "Push for Full Industrial Control"
 KMT_push_for_full_control_desc:0 "With us now in a dire state, we can use this to push for full control over Chinese Industries, allowing us to monopolize the Chinese industry against the capitalists."
 KMT_promise_multiparty_elections:0 "Promise Multiparty Elections"
 MAN_kwantung_veto_2: "Kwantung Veto"
 KMT_promise_multiparty_elections_desc:0 "The party will Promise Multiparty Elections in China, allowing for a great amount of Freedom in the future."
 KMT_uphold_the_concept_of_dang_guo:0 "Uphold the 'Dang Guo' Concept"
 KMT_uphold_the_concept_of_dang_guo_desc:0 "The party will make sure to maintain the Dang Guo (Party State) Principle, fusing the party and state, giving the KMT permanent power."
 KMT_empower_the_kmt_beurocracy:0 "Empower the KMT Bureaucracy"
 KMT_empower_the_kmt_beurocracy_desc:0 "The regime will empower the KMT bureaucracy, allowing it to do as it pleases, ensuring it's ability to do good things for the nation."
 KMT_fufill_the_promise_of_land_reform:0 "Fulfill the Promise of Land Reform"
 KMT_fufill_the_promise_of_land_reform_desc:0 "We have promised our people a land reform and will therefore have to make good on it. It is the demand of the people."
 KMT_sell_public_land:0 "Sell Public Land"
 KMT_sell_public_land_desc:0 "One key step to doing this will be to sell the public land owned by the state. This will help us to fulfill our promises and satisfy our people."
 KMT_arable_rent_reduction_act:0 "Arable Rent Reduction Act"
 KMT_arable_rent_reduction_act_desc:0 "The state now makes sure to reduce the maximum rent on arable land. This will help make the rent for the people a lot cheaper and boost their productivity."
 KMT_land_to_the_tiller:0 "Land to the Tiller"
 KMT_land_to_the_tiller_desc:0 "We will finally force the large scale landowners to give their tillers land, allowing for justice for these poor workers."
 KMT_revive_the_new_life_movement:0 "Revive the New Life Movement"
 KMT_revive_the_new_life_movement_desc:0 "If China is to be made great, we will have to make the Chinese people great as well. For this sake we will revive the new life movement to make it so that the Chinese people will be good, righteous citizens."
 KMT_disband_the_blueshirts:0 "Disband the Blueshirts"
 KMT_disband_the_blueshirts_desc:0 "For the Stability of our realm, we will disband the Blueshirts, allowing for us to rule without the great issues they keep causing."
 KMT_violence_is_the_ulimate_means_of_political_expression:0 "Violence is True Political expression"
 KMT_violence_is_the_ulimate_means_of_political_expression_desc:0 "We the Blueshirts believe that violence is the ultimate means of political expression. We will embrace this fact of life and use it to our benefit."
 KMT_elitism:0 "Elitism"
 KMT_elitism_desc:0 "The Elites must rule China if it is to succeed. The Plebians are in no position to rule China and we must make that clear."
 KMT_rural_reconstruction_movement:0 "Increase Support for Rural Reconstruction"
 KMT_rural_reconstruction_movement_desc:0 "The party will support the reconstruction movement in China and help build up the rural communities. This will make the Chinese people be swayed to our side."
 KMT_ensure_popular_support:0 "Ensure Popular Support"
 KMT_ensure_popular_support_desc:0 "Our propaganda will ensure the popular support of our regime so that a transition to democracy will be easy."
 KMT_help_establish_a_range_of_parties:0 "Help Establish a Range of Parties"
 KMT_help_establish_a_range_of_parties_desc:0 "The KMT must help small parties all across China to be established, so that democracy may be brought about."
 KMT_enforce_lenninist_standards:0 "Enforce Leninist Standards"
 KMT_enforce_lenninist_standards_desc:0 "We must make sure the KMT stays bolshevized and that Leninist standards are upheld, quelling dissidence in the party before it can form."
 KMT_prepare_national_liberation: "Prepare for National Liberation"
 KMT_prepare_national_liberation_desc: "With the Regime stabilized, it is time to prepare for the liberation of Manchuria and seek to free the people there from the Japanese! For this, we will send what they call 'bandits' there to undermine the Japanese rule and fight for freedom."
 KMT_the_power_of_confucious:0 "The Power of Confucius"
 KMT_the_power_of_confucious_desc:0 "Chiang begins indoctrination to make the Chinese people believe in the power of Confucius and his teachings. This will bring us back to our roots and to what truly made us great."
 KMT_confucian_fascism:0 "Confucian Fascism"
 KMT_confucian_fascism_desc:0 "Some Criticize Chiang for being a Confucian Fascist. We do not reject this, in fact perhaps a blend of these two will bring about great results."
 KMT_control_chinese_life:0 "Full Control over the New Chinese Life"
 KMT_control_chinese_life_desc:0 "We want full control over Chinese life and will ensure it. We will enforce the standards of the new Chinese life, no matter the consequences."
 KMT_li_proper_rite:0 "Li"
 KMT_li_proper_rite_desc:0 "We will put a focus on the virtue of proper rite for the Chinese people. We will do as is expected of us to make China great and victorious!"
 KMT_yi_righteousness_and_justice:0 "Yi"
 KMT_yi_righteousness_and_justice_desc:0 "We will make sure to impart a sense of righteousness and justice in the new Chinese life. This will help us build up an integrable workforce."
 KMT_lian_honesty_and_cleanliness:0 "Lian"
 KMT_lian_honesty_and_cleanliness_desc:0 "To have a truly great China, our people must be clean, both in the physical and metaphysical sense. We will impart these virtues into their life."
 KMT_chi_shame:0 "Chi"
 KMT_chi_shame_desc:0 "We will install a sense of shame in our people, a shame that drives them to avoid evil and do good."
 KMT_the_hundred_rules:0 "The Hundred Rules"
 KMT_the_hundred_rules_desc:0 "With the four virtues put into our people, we will set up the hundred rules, making sure that the virtues are followed in every aspect of Chinese life!"
 KMT_the_virtues:0 "The Virtues"
 KMT_the_virtues_desc:0 "If we should bring about a great new Chinese life, we must build up a virtuous people."
 KMT_purge_the_liberal_democrats:0 "Purge the Liberal Democrats"
 KMT_purge_the_liberal_democrats_desc:0 "The regime shall now purge the liberal democrats who fight against it. We will ensure their destruction and the victory of our great generalissimo."
 KMT_prepare_for_the_national_congress:0 "Prepare for the National Congress"
 KMT_prepare_for_the_national_congress_desc:0 "The situation is now ready to prepare for the next national congress and the consequences of it for China. It is time to bring about the future for China now that it is united!"
 KMT_the_nth_national_congress:0 "The Next National Congress"
 KMT_the_nth_national_congress_desc:0 "It is time! China is united and we will now determine its fate! The National Congress will now be held."
 KMT_the_true_enemy:0 "The True Enemy"
 KMT_the_foreign_imminent_threat:0 "The Foreign Imminent Threat"
 KMT_preparations_to_fight_the_soviet_imperialists:0 "Preparations to Fight the Soviet Imperialists"
 KMT_strike_PRC2:0 "Strike the Yannan Basin"
 KMT_SHX_offer2:0 "The Shanxi Offer"
 KMT_military_planning_corps:0 "The Military Planning Corps"
 KMT_military_planning_corps_desc:0 "The NRA creates a new planning Corps, allowing for the Military to be much more effective at contriving plans to deal with our rivals."
 KMT_coastal_fortifications:0 "Coastal Fortifications"
 KMT_ultimatum_to_the_warlords:0 "Ultimatum to the Warlords"
 KMT_national_defense_propaganda:0 "National Defense Propaganda"
 KMT_ultimatum_to_tibet:0 "Ultimatum to Tibet"
 KMT_befriend_tibet:0 "Befriend Tibet"
 KMT_sinkiang_issue:0 "The Sinkiang Issue"
 KMT_redraw_the_mcmahon_line:0 "Redraw the McMahon Line"
 KMT_the_state_in_one_man:0 "The State in One Man"
 KMT_the_state_in_one_man_desc:0 "Chiang embodies the Russian State and leads it to glory! He embodies China as a person and will lead it to greatness!"
 KMT_increased_nepotism:0 "Increase Nepotism"
 KMT_increased_nepotism_desc:0 "The CC clique increases Nepotism in our state, allowing Chiang to put his allies in key positions."
 KMT_the_eternal_dictator:0 "The Eternal Dictator"
 KMT_the_eternal_dictator_desc:0 "Chiang has finally done it! He has secured all power in China for himself! None can stop the great dictator!"
 KMT_no_enemy_in_any_position:0 "No Enemy in Any Position"
 KMT_no_enemy_in_any_position_desc:0 "Our Friends stacking the government is not enough! We will purge the state of all opposition."
 KMT_the_disappearing_opposition:0 "The 'Disappearing' Opposition"
 KMT_the_disappearing_opposition_desc:0 "It is time to make the Chinese opposition disappear. China will be freed from all such degeneracy!"
 KMT_sideline_the_democrats:0 "Sideline the Democrats"
 KMT_sideline_the_democrats_desc:0 "the democrats in our Country will be fully sidelined, their tentative last grasps for power will be denied."
 KMT_empower_the_cc_clique:0 "Empower the 'CC Clique'"
 KMT_empower_the_cc_clique_desc:0 "With Chiang fully taking power, he will empower his lapdogs in the CC clique to help do his bidding."
 KMT_the_sword_nephew:0 "The Sword Nephew"
 KMT_the_sword_nephew_desc:0 "Chiang will now support the Sword nephew, who has done so much for our nation and has led the clique for the last years."
 KMT_the_wife:0 "The Wife"
 KMT_the_wife_desc:0 "Chiang will strengthen Soong Mei Ling, Chiang's wife, in her duties in China and help them be successful in the nation!"
 KMT_a_friend_in_every_position:0 "A Friend in Every Position"
 KMT_a_friend_in_every_position_desc:0 "The CC clique has made sure that in the coming China, we will have a friend in every position, allowing us to reign with impunity!"

