 KMT_the_national_catastrophe: "The National Catastrophe"
 KMT_the_national_catastrophe_desc: "A horrid thing has occurred! China has been abused by foreigners and hurt greatly. We must overcome!"
 KMT_deal_with_unrest: "Deal with Unrest"
 KMT_deal_with_unrest_desc: "It is time to deal with the Chinese Unrest. They have caused much damage to us and we must deal with this great danger to our new regime."
 KMT_crush_the_radical_nationalists: "Crush the Radical Nationalists"
 KMT_crush_the_radical_nationalists_desc: "The military must crush the radicals who oppose our regime. They must be dealt with and China saved from these degenerates."
 KMT_crush_the_nra: "Crush the NRA"
 KMT_crush_the_nra_desc: "There are NRA remnants hiding all over the country fighting our forces. They will be lured out into battle and fought and vanquished, securing our forces from attack."
 KMT_find_chiang_kai_shek: "Find Chiang Kai-Shek"
 KMT_find_chiang_kai_shek_desc: "The Police will find Chiang Kai-Shek and look for him and ensure that he is killed, this will bring about a great decrease in resistance in China."
 KMT_ideological_education: "Ideological Education"
 KMT_ideological_education_desc: "The reorganized government will begin a program of ideological education in China, securing our rule for good and making our regime popular."
 KMT_strengthen_resource_extraction: "Increase Resource Extraction"
 KMT_strengthen_resource_extraction_desc: "Our overlords demand we increase resource extraction in our lands, securing great riches far beyond measure."
 KMT_improve_the_negotiating_position: "Improve the Negotiating Position"
 KMT_improve_the_negotiating_position_desc: "With us having made grounds in improving our economy, it is now time to improve our negotiating position with our overlords, beginning the steps towards reasserting sovereignty."
 KMT_china_at_the_mercy_of_our_overlord: "China at the Mercy of our Overlord"
 KMT_china_at_the_mercy_of_our_overlord_desc: "We are at the mercy of our overlords and will make the best of it. There is nothing we can do about changing it so we may as well be loyal."
 KMT_seek_industrial_investments: "Seek Industrial Investments"
 KMT_seek_industrial_investments_desc: "Seeing as though we are absolutely loyal to our overlords, we can ask them for investments to improve the dismal state of our economy."
 KMT_for_better_or_worse_the_fate_of_china: "The Fate of China, for Better or Worse"
 KMT_for_better_or_worse_the_fate_of_china_desc: "It seems it is the fate of China to be subservient, we must accept this to build up and move on."
 KMT_winning_the_hearts_and_minds_of_the_people: "Winning the Hearts and Minds"
 KMT_winning_the_hearts_and_minds_of_the_people_desc: "It is time to work on winning the hearts and minds of the people of China. We will make sure that we are their true first priority."
 KMT_chinese_industry_in_the_shadow_of_the_overlord: "Chinese Industry beyond our Overlord"
 KMT_chinese_industry_in_the_shadow_of_the_overlord_desc: "To rebuild, we must build a great industry for China, making ourselves a great power beyond our overlords to perhaps eclipse them one day."
 KMT_a_beacon_of_ideology_in_the_middle_kingdom: "A Great Ideological Beacon"
 KMT_a_beacon_of_ideology_in_the_middle_kingdom_desc: "We have made China a great ideological beacon in Asia, becoming a great new symbol for the ideology we have now taken up."
 KMT_declare_the_peoples_republic: "Declare the People's Republic"
 KMT_declare_the_peoples_repulbic_desc: "We shall now declare a People's Republic, ensuring the greatness of Communism for the Future."
 KMT_rise_of_the_blueshirts: "Rise of the Blueshirts"
 KMT_rise_of_the_bleushirts_desc: "We have made great progress in collaborating with the blueshirts, we shall now bind them into the government to secure our rule."
 KMT_align_pla_remnants: "Align PLA Remnants"
 KMT_kmt_remnants: "KMT remnants"
 KMT_align_pla_remnants_desc: "PLA remnants will be aligned, securing their collaboration with our regime in the future."
 KMT_align_kmt_remnants_desc: "KMT remnants will be aligned, securing their collaboration with our regime in the future."
 KMT_align_the_blueshirts_puppet: "Align the Blueshirts"
 KMT_align_the_blueshirts_puppet_desc: "the blueshirts will be aligned with our cause, bringing about great support from these fascist compatriots."
 KMT_victory_over_the_partisans: "Victory Over the Partisans"
 KMT_victory_over_the_partisans_desc: "We have done it, the partisans are mostly defeated, perhaps one day China will be safe..."
 KMT_the_armed_forces_of_the_chinese_state: "The Armed Forces of the Chinese State"
 KMT_the_armed_forces_of_the_chinese_state_desc: "We shall now reorganize our armed forces after the rout of the NRA, securing a new state for China."
 KMT_strengthen_the_high_command: "Rebuild the High Command"
 KMT_strengthen_the_high_command_desc: "The army rebuilds it's high command, so that we may defend ourselves."
 KMT_a_vast_army: "A Vast Army"
 KMT_a_vast_army_desc: "Our overlords demand we build up a vast army, capable of providing fodder for our overlords. China will soon be useful again."
 KMT_wjw_rule_secured: "The Collaborator Secured"
 KMT_wjw_rule_secured_desc: "Jing Wei has now made China nothing more than a puppet to China as he strengthens his grip on the country. Who knows what the future holds..."
 KMT_an_auxuliary_army: "An Auxiliary Army"
 KMT_an_auxuliary_army_desc: "Our overlords demand we form an auxiliary army, full of modern special forces and tanks to do specialized tasks."
 KMT_ycp_victory: "YCP Victory"
 KMT_ycp_victory_desc: "The YCP has won a great victory, defeating the KMT at the booth and ushering in a new age for China."
 KMT_strengthen_national_character: "Strengthen National Character"
 KMT_strengthen_national_character_desc: "The National Character of China has been damaged by the KMT and destroyed by foreign powers abusing our nation. We must undo this horrid development"
 KMT_make_china_young_again: "Make China Young Again"
 KMT_make_china_young_again_desc: "It is time to make China young again, so that it can outcompete the Europeans and become a truly modern developed nation."
 KMT_strengthen_the_constitution: "Strengthen the Constitution"
 KMT_strengthen_the_constitution_desc: "After having done much to democratize China, we will strengthen the constitution of China so we can truly become a modern liberal democracy."
 KMT_secularize_the_state: "Secularize the State"
 KMT_secularize_the_state_desc: "China must be secularized and freed from the unhealthy influence of the Confucianists who delay the development of China."
 KMT_secularization_of_the_state: "Secularize the State"
 KMT_secularization_of_the_state_desc: "China must be secularized and freed from the unhealthy influence of the Confucianists who delay the development of China."
 KMT_modernize_the_nation: "Modernize the Nation"
 KMT_modernize_the_nation_desc: "It is necessary to Modernize the Nation so that China can become a capitalist paradise, capable of outdoing all the European nations."
 KMT_a_china_capable_of_outdoing_europe: "As China Outdoes Europe"
 KMT_a_china_capable_of_outdoing_europe_desc: "We've done much to modernize China, and because of this, China will soon outdo the Europeans."
 KMT_make_china_one_again: "Make China One Again"
 KMT_make_china_one_again_desc: "China is divided due to its past with warlords, federalists, and other groups dividing the country."
 KMT_expand_reach_of_the_cental_government: "Expand Reach of the Central Government"
 KMT_full_centralization_of_the_state: "Full Centralization of the State"
 KMT_full_centralization_of_the_state_desc: "China will now be fully centralized, with all power transferred to the central government."
 KMT_a_unitary_han_state: "The Success of Nationalism"
 KMT_a_unitary_han_state_desc: "Our policy of centralizing China and making it one strong nation has been a great success!"
 KMT_vanquish_the_memory_of_the_seperatists: "Vanquish the Memory of the Separatists"
 KMT_vanquish_the_memory_of_the_seperatists_desc: "The Central Government will vanquish the memory of the separatists and warlords, having defeated them, their legacy will now be destroyed."
 KMT_extol_the_three_principles: "Extol the Three Principles"
 KMT_extol_the_three_principles_desc: "Our government still extols the Three Principles of the People and brings our people together around these key ideas that unite all of China!"
 KMT_the_success_of_democracy: "The Success of Democracy"
 KMT_the_success_of_democracy_desc: "Our implementation of democracy in China has been a great success, soon China will become the best democracy in the world."
 KMT_the_success_of_peoples_welfare: "The Success of People's Welfare"
 KMT_the_success_of_peoples_welfare_desc: "Our implementation of People's Welfare has brought about great prosperity to our nation. Let us relish this fact."
 KMT_a_strong_national_character: "A Strong National Character"
 KMT_a_strong_national_character_desc: "We have done it, we have built a strong national Character for China, uniting it in victory."
 KMT_expand_loyalist_support: "Expand Loyalist Support"
 KMT_expand_loyalist_support_desc: "To survive, we must expand on the support of our loyalists, the teachers and the businessmen and the bankers who are allied with our regime."
 KMT_delve_into_factionalism: "Delve Into Factionalism"
 KMT_delve_into_factionalism_desc: "Factionalism will secure the regime, working with our loyalists and strengthening our regime."
 KMT_an_educated_china: "An Educated China"
 KMT_an_educated_china_desc: "With the support of our loyalists gathered, the government will consolidate their power in the regime."
 KMT_china_open_for_buisness: "China Open for Business"
 KMT_china_open_for_buisness_desc: "With the support of our loyalists gathered, the government will consolidate their power in the regime."
 KMT_the_liberation_of_chinese_national_character: "Liberalize the National Character"
 KMT_the_liberation_of_chinese_national_character_desc: "The state has worked hard to undo the damage to the Chinese National Character done to us by the foreign oppressors. China will be truly liberated."
 KMT_expand_reach_of_the_cental_government_desc: "We have finished expanding the reach of the central government, securing our power over all the warlords and other regionalists."
 KMT_a_bigger_stronger_chiang: "A Bigger, Stronger Chiang"
 KMT_a_bigger_stronger_chiang_desc: "Dai is just a bigger and stronger version of Chiang, with all the strengths and none of the old man's weaknesses."
 KMT_build_a_cult_of_personality: "The Savior of China"
 KMT_build_a_cult_of_personality_desc: "Dai has saved China from the Chiangists, and as such he must be venerated in his new role. All Hail the Dictator!"
 KMT_showcase_lis_prowess: "Showcase Dai's Prowess"
 KMT_showcase_lis_prowess_desc: "Dai's prowess is to be secured, proving that he is better than Chiang in every way shape and form."
 KMT_showcase_chiangs_degeneracy: "Showcase Chiang's Degeneracy"
 KMT_showcase_chiangs_degeneracy_desc: "Chiang's crimes are to be showcased, in preparation to kill him, buying the loyalty of our people."
 KMT_the_fate_of_all_his_cronies: "The Fate of all his Cronies"
 KMT_the_fate_of_all_his_cronies_desc: "Chiang has been punished, but his cronies have not been yet, it is time to deal with this, by purging them as well."
 KMT_cosolidate_power_over_the_nation: "Consolidate Power Over the Nation"
 KMT_cosolidate_power_over_the_nation_desc: "We must consolidate power over China, breaking the bonds of the KMT."
 KMT_hang_chiang_kai_shek: "Hang Chiang Kai Shek"
 KMT_hang_chiang_kai_shek_desc: "We can finally hang Chiang Kai Shek, for all he has done to our blueshirts. This must be repaid."
 KMT_purge_the_chiangists: "Purge the Chiangists"
 KMT_purge_the_chiangists_desc: "the Chiangists will be purged, allowing us to secure the state from them permanently."
 KMT_strengthen_lis_power: "Strengthen Dai's Power"
 KMT_strengthen_lis_power_desc: "It is time to strengthen Dai's power in our nation, ensuring that there is none to oppose him."
 KMT_asian_bloc: "Asian Bloc"
 KMT_asian_bloc_desc: "China has set out to create a new bloc in Asia, to secure our interests and those of our fellow Asian countries."
 KMT_claims_for_peace: "Claims for Peace"
 KMT_claims_for_peace_desc: "We have certain claims from the Soviets, we demand them to give them to us, in exchange for a lasting peace between the two of us."
 KMT_shared_interests_in_indochina: "Shared Interests in Indochina"
 KMT_shared_interests_in_indochina_desc: "Our diplomats must reach out to the French to secure our interests in Indochina without forcing the French into a war over Vietnam and the resources there."
 KMT_realpolitik: "Realpolitik"
 KMT_realpolitik_desc: "Our statesman must adopt a policy of realpolitik for China, doing the most practical thing to ensure expansion without war."
 KMT_great_commander: "Builder of the Realm"
 KMT_great_commander_desc: "Dai has proven that his is more than capable of making China a great nation, building a realm and a new China far larger than the old one under the perfidious Chiang"
 KMT_manchuria_for_economic_rights: "Manchuria for Economic Rights"
 KMT_manchuria_for_economic_rights_desc: "To reach a compromise, we offer to let the Japanese keep economic rights in Manchuria, thus getting us the land without forcing a war."
 KMT_blueshirts_everywhere_always: "Blueshirts everywhere, always"
 KMT_blueshirts_everywhere_always_desc: "The shadow state shall make sure there are Blueshirts everywhere, always, ensuring that we have full control over China."
 KMT_enforce_membership_for_generals: "Enforce Membership for Generals"
 KMT_enforce_membership_for_generals_desc: "It is finally time to enforce membership in the Blueshirts for all generals. This will enforce their loyalty"
 KMT_harsh_quotas: "Harsh Quotas"
 KMT_harsh_quotas_desc: "Our agents shall put up harsh quotas for the Chinese people, ensuring the long term survival of China."
 KMT_promote_the_militarists: "Promote the Militarists"
 KMT_promote_the_militarists_desc: "It is time to promote the militarists in our army, ensuring that we have full control over the army."
 KMT_blueshirts_in_every_group: "Blueshirts in every Group"
 KMT_blueshirts_in_every_group_desc: "We must make sure there are Blueshirts in every group, so that they will secure the control of the government."
 KMT_ready_the_clases_for_war: "Ready the Classes for War"
 KMT_ready_the_clases_for_war_desc: "The Classes must be readied for war, ensuring that China will be ready when the time comes."
 KMT_work_targets: "Work Targets"
 KMT_work_targets_desc: "Our agents establish work quotas for the Chinese people, ensuring that they are fully committed to working their ass off for the regime."
 KMT_blueshirts_overseers: "Blueshirt Overseers"
 KMT_blueshirts_overseers_desc: "the shadow state now watches over the Chinese people, ensuring that they are fully committed to their jobs."
 KMT_the_great_flight: "The Great Flight"
 KMT_the_great_flight_desc: "A great tragedy has occurred... we have been forced to flee from the mainland, it seems the communists won a victory. Yet soon we will come back."
 KMT_finalize_asset_evacuation: "Finalize Asset Evacuation"
 KMT_finalize_asset_evacuation_desc: "We have brought back many industrial assets to Taiwan. We will take these out and build up our industry with them."
 KMT_secure_foreign_aid: "Secure foreign Aid"
 KMT_secure_foreign_aid_desc: "Our diplomats work to secure foreign aid from allied major powers who support us. This will fix our industry and allow us to overtake [CUG.GetNameDef]"
 KMT_save_national_treasure: "Save National Treasure"
 KMT_save_national_treasure_desc: "We have saved much national treasure and will now display it to the people and army, giving them the motivation to fight and defend this from the communist swine."
 KMT_the_last_bastion: "The Last Bastion"
 KMT_the_last_bastion_desc: "We have become the last bastion of the true Chinese Government. We will save China from the swine in the mainland!"
 KMT_fortify_the_coast: "Fortify the Coast"
 KMT_fortify_the_coast_desc: "It is only a matter of time until [CUG.GetNameDef] overtakes us navally, therefore we must fortify the coast, ensuring our islands will never fall."
 KMT_protect_the_streight: "Protect the Straight"
 KMT_protect_the_streight_desc: "Our holdings in Hainan are at risk from an attack by land. It is necessary to fortify the straight to ensure that modern Chinese weapons will not break us."
 KMT_prepare_to_retake_the_homeland: "Prepare to Retake the Homeland"
 KMT_prepare_to_retake_the_homeland_desc: "It is time to prepare to retake the homeland, the mainland will be freed from the oppressors and the KMT brought back!"
 KMT_plan_the_reconquest: "Plan the Reconquest"
 KMT_plan_the_reconquest_desc: "We now begin to plan the reconquest of the mainland. Soon our men will secure our final victory through these meticulous plans. Operation hope will be a grand success!"
 KMT_march_forth: "March Forth"
 KMT_march_forth_desc: "We now march forth and retake the Homeland! It is but a matter of days until Nanjing and Beiping are free again."
 KMT_a_glorious_return: "A Glorious Return"
 KMT_a_glorious_return_desc: "We have done it! We have made a glorious return! China is free again!"
 KMT_build_up_cells_in_the_mainland: "Build up Cells in the Mainland"
 KMT_build_up_cells_in_the_mainland_desc: "A great effort will be invested to build up cells in the mainland, making them vulnerable to an attack from us."
 KMT_rebolshevize_the_NRA: "Rebolshevize the NRA"
 KMT_rebolshevize_the_NRA_desc: "It is necessary to rebolshevize the NRA, securing its unity and loyalty to the KMT."
 KMT_reconsider_army_doctrine: "Reconsider Army Doctrine"
 KMT_reconsider_army_doctrine_desc: "The army must reconsider its doctrine. We now lack the hordes of the mainland and have much different needs to address."
 KMT_porcupine_strategy: "Porcupine Strategy"
 KMT_porcupine_strategy_desc: "We have to focus on defending our homeland, thus, our forces will adopt the porcupine strategy, ensuring the permanent defense of our island."
 KMT_modern_arms: "Modern Arms"
 KMT_modern_arms_desc: "It is time to adopt a policy of modern arms, using tanks and similar technology to outgun the main government of China, allowing for daring offensives and great kill death ratios."
 KMT_urban_guerilla_warfare: "Urban Guerilla Warfare"
 KMT_urban_guerilla_warfare_desc: "Our people will be trained in the art of guerilla warfare, allowing us to defend our cities, no matter what happens."
 KMT_modernize_technology: "Modernize Technology"
 KMT_modernize_technology_desc: "We must modernize our technology, allowing us to outcompete the main government long term, ensuring our final victory."
 KMT_tanks_good_both_here_and_there: "Tanks, Good both Here and There"
 KMT_tanks_good_both_here_and_there_desc: "Tanks are good both on our islands and on the mainland. Our troops must work to dig deeper into them and make the best tanks in Asia."
 KMT_well_trained_infantry: "Well Trained Infantry"
 KMT_an_untakeable_island: "An Untakeable Island"
 KMT_an_untakeable_island_desc: "The army ensures our islands are untakeable, that the state will live forever, regardless of the fate of the mainland."
 KMT_a_modern_tank_army: "A Modern Tank Army"
 KMT_a_modern_tank_army_desc: "The high command will make sure we have a modern tank army, and that it will one day cross the straight and bring about a grand victory for the KMT."
 KMT_skilled_offensive_generals: "Skilled Offensive Generals"
 KMT_skilled_offensive_generals_desc: "We must ensure that our generals are skilled and capable of winning battles for us."
 KMT_accept_the_inevitable: "Accept the Inevitable"
 KMT_accept_the_inevitable_desc: "It is time to accept the inevitable, that we will never be able to return to the mainland. Let us prepare to declare independence."
 KMT_declare_independence: "Declare Independence"
 KMT_declare_independence_desc: "It is time, let us declare independence, the mainlanders to be damned! All hail the new regime!"
 KMT_a_national_congress_through_the_despair: "A National Congress through the Despair"
 KMT_a_national_congress_through_the_despair_desc: "The KMT must hold a national congress through the despair, we will make sure the KMT will hold fast and be strong through this trying time."
 KMT_permanent_marshal_law: "Permanent Marshal Law"
 KMT_permanent_marshal_law_desc: "With our state secured, Chiang declares martial law, China will be put under the permanent control of the Generalissimo. Dissent will not be tolerated."
 KMT_lift_the_veil: "Lift the Veil"
 KMT_lift_the_veil_desc: "The time has come to lift the veil of the martial law in our country. We must bring about the final victory of the three principles!"
 KMT_educate_the_people: "Educate the People"
 KMT_educate_the_people_desc: "The Chinese people are to be educated, teaching them modern information, and helping them learn and do science."
 KMT_restart_the_white_terror: "Restart the White Terror"
 KMT_restart_the_white_terror_desc: "The time has come to restart the white terror, consolidating the Generalissimo's power. The Separatists and Communists will be crushed!"
 KMT_seek_revenge_for_the_feb28_incident: "Seek Revenge for February 28th"
 KMT_seek_revenge_for_the_feb28_incident_desc: "Chiang seeks revenge for our people, who were attacked by separatists and communists after we retook the island. Such insolence will not be tolerated."
 KMT_purge_communists: "Purge Communists"
 KMT_purge_communists_desc: "It is of highest priority to purge communists in our island, these are nothing but national traitors and must go."
 KMT_deal_with_the_locals: "Deal with the Locals"
 KMT_deal_with_the_locals_desc: "Our troops deal with the locals who seek our overthrow. Separatism will not be tolerated!"
 KMT_punish_anti_state_activities: "Punish Anti-State Activities"
 KMT_punish_anti_state_activities_desc: "All activities that go against the state are to be punished, allowing for our regime to be permanently secured."
 KMT_deal_with_taiwanese_seperatists: "Deal with Taiwanese Separatists"
 KMT_deal_with_taiwanese_seperatists_desc: "The separatists must be dealt with permanently if we wish to survive long term. We will end them..."
 KMT_consolidate_KMT_rule: "Consolidate KMT rule"
 KMT_consolidate_KMT_rule_desc: "Chiang must consolidate the rule of the KMT, allowing for us to be safe and under a stable regime."
 KMT_hail_the_national_savior: "Hail the National Savior"
 KMT_hail_the_national_savior_desc: "All hail the National Savior, the man who has brought us over here and saved us! All Hail Chiang Kai Shek!"
 KMT_form_the_TGC: "Form the TGC"
 KMT_form_the_TGC_desc: "The KMT forms the Taiwan Garrison Command, allowing us to find and sniff out traitors so that none will betray us into the hands of the communists."
 KMT_limited_opposition: "Limited Opposition"
 KMT_limited_opposition_desc: "For stability's sake, we allow for limited opposition for Parties like the CDSP, who will support us in exchange and become nothing but puppets for us, legitimizing our regime."
 KMT_executive_rule: "Executive Rule"
 KMT_executive_rule_desc: "We shall implement Executive Rule, allowing us to do and not do as we please."
 KMT_mass_pervasive_monitoring: "Mass Pervasive Monitoring"
 KMT_mass_pervasive_monitoring_desc: "The TGC will implement Mass monitoring, allowing for us to see all betrayal before it happens. China will be secure!"
 KMT_sham_criminal_trials: "Sham Criminal Trials"
 KMT_sham_criminal_trials_desc: "The TGC will hold 'trials' for the national traitors, giving ourselves legitimacy, as well as slaughtering the traitors."
 KMT_suspend_basic_human_rights: "Suspend Basic Human Rights"
 KMT_suspend_basic_human_rights_desc: "The TGC will suspend the rights of traitors, as they do not deserve them and these rights obstruct justice! The TGC will have a firm hand."
 KMT_imbue_them_in_the_people: "Imbue the Virtues in the People"
 KMT_imbue_them_in_the_people_desc: "The people must learn to devote their lives to the virtues, this Chiang has begun to start more intense state propaganda to bring this about in them."
 KMT_influencing_the_people: "Influencing the People"
 KMT_blue_coup_tt: "The §8Blueshirts§! will stage a coup and attempt bring about their own vision for China within a month of the triggers being fufilled..."
 KMT_prop_done_tt: "All of the §YInfluencing the People§! decisions have been completed"
 KMT_party_bop_tt: "This effect will only happen so long as §YConsolidate Party Supremacy§! has not been completed."
 KMT_CKS_bop_tt: "This effect will only happen so long as §YDeclare Martial Law§! has not been completed."
 KMT_starting_tt: "The §2Kuomintang§! has secured a victory in central China and become the internationally recognized government of China, yet only time will tell if they will succeed or if they will die to enemies within or without..."
 KMT_beijing_tt: "The §8Blueshirts§! have been disbanded by Chiang"
 KMT_beijing_2_tt: "The §8Blueshirts§! have 30 percent popularity"
 KMT_beijing_3_tt: "§YDai Li§! has not been appeased with a Job in the §YCBIS§!"
 KMT_consolidate_chiangs_control: "Consolidate Chiang's Control"
 KMT_consolidate_chiangs_control_desc: "Chiang will consolidate his control over China, bringing about a bright and loyal future for our nation."
 KMT_well_trained_infantry_desc: "We need to train our infantry in depth, ensuring that it is capable of fighting and holding superior enemies and ensuring our survival."
 KMT_secure_mongolia_and_tuva: "Secure Mongolia and Tuva"
 KMT_secure_mongolia_and_tuva_desc: "The time has come to secure Mongolia and Tuva from the Soviets, ensuring the integrity of our new empire."
 KMT_undo_the_armur_annextion: "Undo the Amur Annexation"
 KMT_undo_the_armur_annextion_desc: "The Russians have stolen large amounts of our lands, it is our duty to undo this and retake them."
 KMT_restore_the_tributary_system: "Restore the Tributary System"
 KMT_restore_the_tributary_system_desc: "It is our divine right to restore the tributary system and ensure our dominance over Asia."
 chinese_tributary_state: "Chinese Tributary System"
 KMT_the_empire_plan: "The Empire Plan"
 KMT_the_empire_plan_desc: "The time has come to embark on a new plan, one to build a great Chinese Empire."
 KMT_demand_manchuria: "Demand Manchuria"
 KMT_demand_manchuria_desc: "We now demand the return of Manchuria. We need to be allowed to take control over all of the Chinese State."
 KMT_expand_the_treaty: "Expand the Treaty"
 KMT_expand_the_treaty_desc: "We will expand our alliance beyond just our own country. This will greatly expand our alliance."
 KMT_declare_the_empire: "Declare the Empire"
 KMT_declare_the_empire_desc: "Our Plan has been a great success, the time has come to declare a new empire. All Hail China!"
 KMT_hegemony_over_indochina: "Hegemony over Indochina"
 KMT_hegemony_over_indochina_desc: "Dai Li demands the handing over of Indochina to us and secure our new imperial sphere." 
 KMT_the_tianmen_square_coup: "The Beijing Coup"
 KMT_the_tianmen_square_coup_desc: "We have staged a coup in Beijing, allowing for us to take over control of the Chinese Government. All hail the Blueshirts!"
 KMT_brilliant_genius: "Cunning Mastermind"
 KMT_brilliant_genius_desc: "With his Coup and taking over of China, Dai has truly shown that he is a cunning mastermind and that none will be able to stop his ascent to power."
 KMT_they_will_know_fear: "Our Enemies Vanquished"
 KMT_they_will_know_fear_desc: "Fear will be brought to our enemies, ensuring that no foreign power will ever be able to do anything about us. They will be vanquished by our tanks and be destroyed in the field"
 KMT_leader_of_the_nation_and_the_people: "A Man of the People"
 KMT_leader_of_the_nation_and_the_people_desc: "Dai has shown time and time again, that he is not like the old elites, he is a man of the people and they must love him."
 KMT_seize_landholder_assets: "Seize Landholder Assets"
 KMT_seize_landholder_assets_desc: "We now seize the assets of landholders and such traitors, further strengthening the plan."
 KMT_bind_the_army_into_the_state: "Bind the Army into the State"
 KMT_bind_the_army_into_the_state_desc: "It was the Army that brought about our glorious revolution! let us all hail it in it's great deeds for our country."
 KMT_choosing_a_new_chairman: "Choosing a Chairman"
 KMT_choosing_a_new_chairman_desc: "Our Provisional Government shall convene again, seeking to establish a leader for the new China. While Li Lisan seeks to maintain his lead over the Party, some question if this is actually going to be possible given the Soviet disapproval of him."
 KMT_li_lisan: "Chairman Li"
 KMT_li_lisan_desc: "Li Lisan has done it! He, the master of the Chinese Revolution, has successfully consolidated his power. All hail the new Chairman!"
 KMT_chinese_five_year_plan: "A Chinese Five Year Plan"
 KMT_chinese_five_year_plan_desc: "The Soviets have had great success with their five year plan. We shall make one for ourselves too so that we may prosper."
 KMT_consolidate_control_over_industry: "Consolidate Control Over Industry"
 KMT_consolidate_control_over_industry_desc: "We shall consolidate control over the Chinese Industry, nationalizing large chunks of it for the good of our people."
 KMT_support_trade_unions: "Support Trade Unions"
 KMT_support_trade_unions_desc: "Trade Unions have been highly useful in our revolution. We shall thank them for their support by maintaining their independence."
 KMT_enforce_trade_union_compliance: "Enforce Trade Union Compliance"
  KMT_enforce_trade_union_compliance_desc: "While Trade unions have been highly useful for our Revolution for now, we have to prevent them from threatening our rule. We must enforce their obedience to our rule."
 KMT_build_up_the_red_army: "Build up the Red Army"
 KMT_build_up_the_red_army_desc: "Our new red army is in disarray after our chaotic revolution. We must do something about this. The time has come to invest in our troops and ensure their survival."
 KMT_a_great_purge: "A Cultural Revolution"
 KMT_a_great_purge_desc: "Our Regime is full of enemies, both within and without. We must deal with them swiftly."
 KMT_deal_with_the_beurgeois: "Deal with the Bourgeoisie"
 KMT_deal_with_the_beurgeois_desc: "It is necessary to deal with the Bourgeoisie fascists and capitalists, who have opposed us for so long. These Traitors to the working class will perish!"
 KMT_consolidate_power_over_the_state: "Consolidate Power over the State"
 KMT_consolidate_power_over_the_state_desc: "The Chairman Consolidates his power over the State, ensuring the defeat of our opposition and entrenching the Chairman's Rule."
 KMT_prepare_to_drive_out_foreign_influence: "Prepare to drive out foreign influence"
 KMT_a_new_kmt_thinktank:0 "A New KMT Think Tank"
 KMT_a_new_kmt_thinktank_desc:0 "We shall create a new Thinktank for our great party to spread what we believe to be proper thought, so that those who follow our ways shall prosper!"
 KMT_increase_military_r_and_d:0 "Increase Military R&D"
 KMT_increase_military_r_and_d_desc:0 "The military demands we Increase Military R&D now that Wei-Kuo is here to lead us in doing so. this will greatly improve our shots at modernizing our armed forces!"
 KMT_invite_eurofacist_scientists:0 "Invite Eurofascist Scientists"
 KMT_invite_eurofacist_scientists_desc:0 "To improve our military, Li takes inspiration from those that inspired our ideology, allowing us to import a few of their scientists so that they may lead us in developing great new weapons!"
 KMT_counter_asian_imperialism:0 "Prioritize Asian Imperialism"
 KMT_counter_asian_imperialism_desc:0 "While Asia has historically been the victim of imperialism ever since the fall of the Qing, the Japanese have taken it upon themselves to do these misdeeds as well! They must be stopped!"
 KMT_korean_liberation:0 "Demand Korean Liberation"
 KMT_korean_liberation_desc:0 "We finally demand Korean liberation and finally free this people from it's oppressors! Korea will be free!"
 KMT_cdsp_victory:0 "CDSP Victory"
 KMT_cdsp_victory_desc:0 "The China Democratic Socialist Party has won a great victory and ousted the KMT from their position of power, with Carsun Chiang leading them to this great victory."
 KMT_the_foundations_of_chinese_fedralism:0 "The Foundations of Chinese Federalism"
 KMT_the_foundations_of_chinese_fedralism_desc:0 "We shall lay out the foundations of Chinese Federalism and begin turning the country in such a direction, allowing for a better and more just form of governance."
 KMT_analyze_the_1922_constitution_attempt:0 "Analyze the 1922 Constitution Attempt"
 KMT_utilize_our_riches: "Utilize our Riches"
 KMT_utilize_our_riches_desc: "We shall now use our riches for ourselves finally, sponsoring many educational facilities and brining about a prosperous future!"
 KMT_analyze_the_1922_constitution_attempt_desc:0 "Carsun had already tried to implement a federal constitution in 1922. Carsun will revisit his work back then and use it to augment the current one."
 KMT_prepare_changes_to_the_kmt_constitution:0 "Prepare Changes to the KMT Constitution"
 KMT_prepare_changes_to_the_kmt_constitution_desc:0 "Carsun will prepare changes to the constitution based on the 1922 constitution attempt and other sources. Once the paperwork is done, the parliament simply has to pass these changes."
 KMT_strengthen_larger_minorities:0 "Strengthen Larger Minorities"
 KMT_strengthen_larger_minorities_desc:0 "We now work to implement our federalist principles and strengthen them especially where minorities are a major part of the population, allowing for the treatment of people according to their needs."
 KMT_tweak_province_borders:0 "Tweak Province Borders"
 KMT_tweak_province_borders_desc:0 "The time has come to tweak the borders of our provinces to better follow ethnic lines, allowing for a much more effective form of federalism and consistency with our implementation of the law."
 KMT_pass_the_changes:0 "Pass the Changes"
 KMT_pass_the_changes_desc:0 "We shall pass our new changes to the constitution, now that they are ready. Federalism shall truly reign supreme in China!"
 KMT_break_the_kmt_stranglehold:0 "Break the KMT stranglehold"
 KMT_break_the_kmt_stranglehold_desc:0 "We must work to break the stranglehold the KMT has on China and free the Chinese people from their grasp."
 KMT_showcase_chiangs_noncompliance:0 "Showcase Chiang's Noncompliance"
 KMT_showcase_chiangs_noncompliance_desc:0 "Chiang has done many things that go against our own constitution. The new regime will showcase this to the people and use it to discredit the KMT in their eyes."
 KMT_wang_jingweis_rise:0 "Wang Jingwei's Rise"
 KMT_wang_jingweis_rise_desc:0 "With Chiang dead, it is time for Wang Jing Wei to take over the reins of the state! let us hope he leads us to prosperity!"
 KMT_consolidate_the_new_regime:0 "Consolidate the new Regime"
 KMT_consolidate_the_new_regime_desc:0 "In the Chaos of the wake of Chiang's death, we must act fast and decisively, securing China under our new state."
 KMT_preempt_the_inevitable: "Preempt the Inevitable"
 KMT_preempt_the_inevitable_desc:0 "Japan is coming for us and there is no way China could be able to win such a war. We must seek Rapprochement and a peaceful solution."
 KMT_the_taiwan_accords:0 "The Taiwan Accords"
 KMT_the_taiwan_accords_desc: "Since Japan has agreed to talk, we shall meet in Taiwan, where Wang will propose a deal allowing us to gain access to Japanese tech to copy it, and allow us to catch up technologically while giving up some of our economy to them."
 KMT_savior_of_all_china:0 "Savior of All China"
 KMT_savior_of_all_china_desc:0 "Wang Jing Wei has become the Savior of all China and united all its people. All hail Wang Jing Wei!"
 KMT_buy_and_sell_japanese: "Buy and Sell Japanese"
 KMT_buy_and_sell_japanese_desc: "We need to work to buy and sell Japanese goods, allowing us to copy them and gain access to their technology that way. We shall now send Japan a deal to strengthen our treaty to accomplish this."
 KMT_scientist_exchange_programmes: "Scientist Exchange Programs"
 KMT_scientist_exchange_programmes_desc: "We will start exchange programs between our scientists and the Japanese for a small sum of money. This will allow us to quickly copy their technology and gain better insight into the progress of our catchup game."
 KMT_resources_for_research: "Resources for Research"
 KMT_resources_for_research_desc: "Our companies will offer a lucrative trade deal to Japan in exchange for some of their research. This will allow us to catch up with and overtake them faster."
 KMT_labor_for_expertise: "Labor for Expertise"
 KMT_labor_for_expertise_desc: "Our job centers now offer the Japanese a deal, giving them our labor for their expertise, helping to boost our economy in the long run."
 KMT_invite_japanese_investors: "Invite Japanese Investors"
 KMT_invite_japanese_investors_desc: "We would greatly profit by inviting Japanese investors into China, gaining crucial advantages from them."
 KMT_the_dragon_swallows_the_sun: "The Dragon Swallows the Sun"
 KMT_the_dragon_swallows_the_sun_desc: "We have done it! We have overtaken Japan and put ourselves to the forefront of these partnerships and made ourselves the masters of Asia."
 KMT_the_path_of_war: "The Path of War"
 KMT_the_path_of_war_desc:0 "With our supremacy secured, China can go on a path of war, seeking to force the Japanese out by military force."
 KMT_lands_or_war: "Lands or War"
 KMT_lands_or_war_desc: "We now send Japan an ultimatum now that we are in a strong spot and demand they withdraw from our core lands."
 KMT_carte_blanche_in_manchuria: "Carte Blanche in Manchuria"
 KMT_carte_blanche_in_manchuria_desc: "We demand the Japanese uphold our claim in Manchuria and give us free reign there to pacify the regime and unite China."
 KMT_the_masters_of_asia: "The Masters of Asia"
 KMT_the_masters_of_asia_desc: "We and the Japanese are the masters of Asia. If we cooperate, and perhaps maybe in the future become allies, none can stop us."
 KMT_manchuria_for_continued_economic_influence: "Manchuria for continued economic influence"
 KMT_manchuria_for_continued_economic_influence_desc:0 "China requests the Japanese return Manchuria to us, in exchange for maintaining a part of the profits from that land. This will prevent war and ensure cooperation into the future."
 KMT_begin_reforming_the_nation: "Begin Reforming the Nation"
 KMT_begin_reforming_the_nation_desc: "We finally can begin reforming China and turning it into the social paradise that Jingwei seeks."
 KMT_align_the_blueshirts:0 "Align the Blueshirts"
 KMT_align_the_blueshirts_desc: "Jingwei has decided to align the Blueshirts in order to strengthen the regime and have a new force to help us should Japan betray."
 KMT_purge_suriviving_communists: "Purge Surviving Communists"
 KMT_purge_suriviving_communists_desc: "We are honor bound to purge the remaining communists and traitors and ensure their deaths. China must be freed from this scum!"
 KMT_the_true_enemies_of_china: "The True Enemies of China"
 KMT_the_true_enemies_of_china_desc: "China must work to deal with its true enemies. Not the Japanese or any foreigners, but the communists, who must be dealt with should China survive."
 KMT_china_above_all: "China above All"
 KMT_china_above_all_desc: "The time has come to make sure to put China first and ensure our supremacy over Japan! China is and will be number one!"
 KMT_the_path_of_peace: "The Path of Peace"
 KMT_the_path_of_peace_desc: "With our supremacy secured, we attempt to force the Japanese out of our lands sternly and peacefully, perhaps even opening up for future cooperation."
 KMT_lands_for_bases: "Lands for Bases"
 KMT_lands_for_bases_desc: "The state can offer a deal to the Japanese, they shall pull out of our lands in exchange for bases for their navy. We hope we may not have to use more persuasive means..."
 KMT_sun_yat_sens_true_heir: "Sun Yat-Sen's True Heir"
 KMT_sun_yat_sens_true_heir_desc:0 "While Chiang claimed to be Sun Yat-Sen's heir, this is false, he will prove to the people that it is none other than himself!"
 KMT_reshuffle_the_courts:0 "Reshuffle the Courts"
 KMT_reshuffle_the_courts_desc:0 "The regime will reshuffle the courts, putting many neutral and our own party members into them, breaking the control the KMT has over these institutions, to secure a future free from their hold."
 KMT_renew_the_beaurocracy:0 "Renew the Bureaucracy"
 KMT_renew_the_beaurocracy_desc:0 "The regime will work to renew the bureaucracy and it's bureaucrats and make sure to remove the KMT power in the institutions of the state. There will soon be no more KMT loyalists in these jobs."
 KMT_a_new_establishment:0 "A New Establishment"
 KMT_a_new_establishment_desc:0 "The regime can now work to build a new establishment in China, and become what the KMT once was and secure eternal power over all aspects of the Chinese State."
 KMT_true_free_democracy:0 "True Free Democracy"
 KMT_true_free_democracy_desc:0 "The regime will work to implement new measures to ensure that no party may ever take the same place in China as the KMT once was or ever debase our democratic system again."
 KMT_train_the_idealist_in_politics:0 "Train the Idealist in Politics"
 KMT_train_the_idealist_in_politics_desc:0 "Our professionals must work to train Carsun Chiang in the ways of politics, allowing him to become more and more competent and to deal with his unrealistic idealism."
 KMT_support_the_common_man:0 "Support the Common Man"
 KMT_support_the_common_man_desc:0 "It is of utmost priority that we support the Common man in China, ensuring that the everyday folk can indeed be supported and cared for."
 KMT_a_mixed_economy:0 "A Mixed Economy"
 KMT_a_mixed_economy_desc:0 "To support the common man, China begins to adopt a mixed economy, supporting business and prosperity and allowing the people to be cared for even if they lack the funds personally."
 KMT_social_welfare:0 "Social Welfare"
 KMT_social_welfare_desc:0 "As part of our mixed economy, the state will begin to implement a policy of Social Welfare. This will allow us to take care of our workers."
 KMT_public_health:0 "Public Health"
 KMT_public_health_desc:0 "The state will, as part of our welfare program, make sure to dole out public healthcare, allowing for the poor and our workers to be able to stay healthy, benefiting our economy in the long run."
 KMT_social_security:0 "Social Security"
 KMT_social_security_desc:0 "The state must work to implement more social security, allowing for workers who have lost their jobs in our rapid industrialization to still put bread on the table."
 KMT_reducing_income_equality:0 "Reducing Income Inequality"
 KMT_reducing_income_equality_desc:0 "We have done it! The people are now truly being cared for as the rich and poor are no longer so different. It seems income inequality may finally be reduced to a tolerable extent."
 KMT_socialize_the_railways:0 "Socialize the Railways"
 KMT_socialize_the_railways_desc:0 "It is time to socialize the Railways in all of China, allowing for people to come from one place to another cheaply and efficiently."
 KMT_socialize_the_mines:0 "Socialize the Mines"
 KMT_socialize_the_mines_desc:0 "It is time to socialize the Mines, allowing for us to profit off of them and ensure fair wages for those working them."
 KMT_equal_rights_for_all:0 "Equal Rights for All"
 KMT_equal_rights_for_all_desc:0 "We will ensure that all will have equal rights, man, woman or child. Only this will be truly just."
 KMT_a_victory_for_liberalism:0 "A Victory for Liberalism"
 KMT_a_victory_for_liberalism_desc:0 "Our victory in the elections has been a great success, allowing us to bring about liberalism to China! All hail this new change for our good."
 KMT_distribute_key_roles:0 "Distribute Key Roles"
 KMT_distribute_key_roles_desc:0 "As it seems Carsun is too incompetent to truly lead the nation, we must act decisively to ensure our party's survival and transfer his power over to the party as a whole."
 KMT_organizer_of_the_party:0 "Organizer of the Party"
 KMT_organizer_of_the_party_desc:0 "The work must be put in to help Carsun truly become the organizer of the party and become a great leader. Only a little is missing and he may be turned into a great leader."
 KMT_support_individual_liberties:0 "Support Individual Liberties"
 KMT_support_individual_liberties_desc:0 "Chang supports the liberty of the common individual man, ensuring that the rights of man be truly fulfilled."
 KMT_freedom_from_corruption:0 "Freedom from Corruption"
 KMT_freedom_from_corruption_desc:0 "If China is to be successful, we must purge the corruption from the KMT from this nation, so that we may all be free."
 KMT_a_state_for_the_people:0 "A State for the People"
 KMT_a_state_for_the_people_desc:0 "We have transformed China into a Country for the Common man, allowing for our people to truly become great men, capable of leading and shaping our democracy."
 KMT_the_duty_to_vote:0 "The Duty to Vote"
 KMT_the_duty_to_vote_desc:0 "It is clear that it is a duty of the people to vote, so that they may know that their rights have certain duties and that these must be fulfilled."
 KMT_fight_the_aristocracy:0 "Fight the Aristocracy"
 KMT_fight_the_aristocracy_desc:0 "The state fights the old aristocracy and upholds the peasant, showing who is more righteous and worthy of being called truly chinese."
 KMT_the_chinese_bill_of_rights:0 "The Chinese Bill of Rights"
 KMT_the_chinese_bill_of_rights_desc:0 "The time has come to implement a new Bill of Rights in China, after the American System. This will truly enshrine our freedoms and ensure what is good for the people."
 KMT_make_use_of_his_education:0 "Make Use of His Education"
 KMT_make_use_of_his_education_desc:0 "Carsun's Education is to be pushed and made use of, allowing him to hold a special place in the eyes of the people."
 KMT_the_return_of_taiwan:0 "The Return of Taiwan"
 KMT_the_return_of_taiwan_desc:0 "We must demand the return of Taiwan, reclaiming our people and taking back what Japanese imperialism has bereft us of."
 KMT_reassert_the_mongolian_claim:0 "Reassert the Mongolian Claim"
 KMT_reassert_the_mongolian_claim_desc:0 "The time has come to reassert our claim on Mongolia, finally taking back a rightful Chinese land from its communist oppressors!"
 KMT_anti_soviet_isolation_tactics:0 "Anti-Soviet Isolation Tactics"
 KMT_anti_soviet_isolation_tactics_desc:0 "We will do our best to isolate the Soviets from their allies in the east, making them vulnerable to any attack from us or Japan."
 KMT_indochinese_liberation:0 "Demand Indochinese Freedom"
 KMT_indochinese_liberation_desc:0 "We shall demand that the French withdraw from the lands of Indochina, allowing for a free Indochinese state to be born!"
 KMT_the_son:0 "The Son"
 KMT_the_son_desc:0 "It is time to call back Chiang Wei-Kuo, Chiang's second son, back from Europe! He will serve the fatherland now and help us use his knowledge to mold our army towards greatness!"
 KMT_the_diarchy:0 "The Diarchy"
 KMT_in_the_shadow_of_chiang_kai_shek:0 "In the Shadow of Chiang Kai Shek"
 KMT_the_true_enemy_desc:0 "While the Japanese are a disease of the skin, the Communist Bandits are a disease of the heart. To save China, we must first purge her of all traitors."
 KMT_SHX_offer2_desc:0 "Yan's fiefdom denies us military access. If we strong-arm him into submission, we can surround the communists and crush them once and for all."
 KMT_preparations_to_fight_the_soviet_imperialists_desc:0 "After their near-destruction during the Long March, the Communist Bandits hide in the Shaanxi region. We must attack before they can recover!"
 KMT_strike_PRC2_desc:0 "The bandits are still recovering from the Long March. We must strike when they are weak!"
 KMT_ultimatum_to_the_warlords_desc:0 "Now that we have destroyed the Communist Bandits, it is time for the warlords to meet the sword. They have been robbing the people for too long. We must complete the National Revolution!"
 KMT_sinkiang_issue_desc:0 "Sinkiang is an inalienable part of China; the local governor there has proven to be a separatist. We request their swift and immediate submission; if this ultimatum doesn't work, our military should be enough for them to surrender."
 KMT_the_foreign_imminent_threat_desc:0 "Although the communists are a dire threat, Japan can snuff out the entire Chinese nation. They will not be content with Manchuria. Someday they will try to take the rest of China as well. We must do everything possible to prepare for the storm."
 KMT_mass_fortifications:0 "Mass Fortification"
 KMT_mass_fortifications_desc:0 "With the Japanese probing the area around Beiping, their intentions become clear. We must fortify our borders. We will not give them an inch of sacred Chinese soil!"
 KMT_coastal_fortifications_desc:0 "Given Japanese control of the seas, they will undoubtedly launch coastal invasions in the case of war. We must prepare while we can. We will not give up the Paris of the Orient without a fight!"
 KMT_national_defense_propaganda_desc:0 "To defend ourselves from the Japanese threat, we must unify the Chinese people. While we hate both the Communist Bandits and the Warlords, every man, woman, and child must be willing to fight and die together in China's defense."
 KMT_ultimatum_to_tibet_desc:0 "Tibet is essential to China's defense and future expansion. However, the region has been independent of Chinese rule since the 1911 Revolution. We must fix this error."
 KMT_befriend_tibet_desc:0 "Tibet is essential for China's defense and future expansion. However, Tibet gained independence following the 1911 Revolution. We must ally with the Dalai Lama and secure our flanks."
 KMT_redraw_the_mcmahon_line_desc:0 "Tibet agreed to the shameful Simla Accord, which redrew their border with India. We must make sure that this line is redrawn in our favor."

 KMT_industrial_effort2:0 "Invest in Industry"
 KMT_industrial_effort2_desc:0 "Chinese industry has always been behind that of the West and Japan. To maintain our independence, we must increase our industrial output. We can also allow foreign firms to invest in our industry."

 KMT_refound_the_jiangman_aresenal:0 "Refound the Jiangnan Arsenal"
 KMT_refound_the_jiangman_aresenal_desc:0 "The Jiangnan Arsenal provided the Qing Dynasty with up-to-date equipment. We should borrow the name for a military-industrial complex that can serve as a nucleus for our growing arms industry."

 KMT_arms_purchases_in_the_us2:0 "Foreign Arms Purchases"

 KMT_expand_the_navy:0 "Expand the Navy"
 KMT_expand_the_navy_desc:0 "We have long lost our naval superiority, having been broken at the Battle of the Yalu River. With the Japanese navy menacing our trade, we must try to defend our merchantmen on the high seas."

 KMT_the_big_rear_plan:0 "Retreat to the Rear Area"
 KMT_the_big_rear_plan_desc:0 "With the war raging in China's east, our west remains comparatively safe. We must try to develop these backwater areas so that they can contribute to China's fight as well."
 KMT_finish_the_big_rear_plan:0 "Finish the Big Rear Plan"
 KMT_finish_the_big_rear_plan_desc:0 "With the more land we lose, the more we need to commit to and finish the big rear plan."
 KMT_nationalize_electronics_company:0 "Nationalize Electronics Company"
 KMT_nationalize_electronics_company_desc:0 "While electricity has yet to reach the countryside, our scientists are already busy at work producing indigenous electronic products for the Shanghai and Hong Kong markets. We should take control of Ch'eng-kung and use it for state research."

 KMT_adopt_gerrman_style_equipment:0 "Adopt German-Style Equipment"
 KMT_adopt_gerrman_style_equipment_desc:0 "Although we have support from German advisers such as Von Falkenhausen and some imported German equipment, our locally produced models are of horrible quality. Using German equipment as templates in our manufacturing process can increase our quality eightfold!"

 KMT_lure_them_in_strategy2:0 "Lure-Them-In Strategy"
 KMT_lure_them_in_strategy2_desc:0 "With our nation's vast territory and rough terrain, we can afford to retreat and lure invaders into our chosen battlefields. Let the imperialists try and chase us! They shall encounter an ambush at every corner and a booby-trap with every step!"

 KMT_airbase_expansion:0 "Airbase Expansion"
 KMT_airbase_expansion_desc:0 "We need airbases for our aircraft to take off and land; otherwise, they will just be a bunch of exhibits in the warehouse."

 KMT_national_resources_commission2:0 "National Resources Commission"
 KMT_national_resources_commission2_desc:0 "The National Resources Commission (NRC) is an institute responsible for prospecting and excavating resources in China. Establishing it will significantly enhance our effort in getting natural resources."

 KMT_national_defense_council2:0 "National Defense Council"
 KMT_national_defense_council2_desc:0 "With the Japanese and the communist bandits harming our nation, we must find a way to organize our defense against them. We should also try importing up-to-date equipment abroad."

 KMT_expand_the_jiangman_shipyard_group:0 "Expand the Jiangnan Shipyard Group"
 KMT_expand_the_jiangman_shipyard_group_desc:0 "We should expand Jiangnan Arsenal's capability of building ships; this will give us a better navy to face future threats."

 KMT_revive_the_hanyang_arsenal:0 "Revive the Hanyang Arsenal"
 KMT_revive_the_hanyang_arsenal_desc:0 "The Hanyang Arsenal was one of the most critical and successful armories during the Self-Strengthening Movement started by Qing officials. We can revitalize it to produce up-to-par equipment for our army."

 KMT_reorganize_the_ROCAF:0 "Reorganize the ROCAF"
 KMT_reorganize_the_ROCAF_desc:0 "We have always neglected our air force. If we want to be able to make an effort to fight in the air, the branch must receive serious reform."

 KMT_the_flying_tigers:0 "The Flying Tigers"
 KMT_the_flying_tigers_desc:0 "Realizing the justice of our cause, a group of American pilots has volunteered to join our air force en masse. We should use these well-trained men as the elite core of a new and revitalized air force."

 KMT_study_foreign_ship2:0 "Study Foreign Ship Design"
 KMT_study_foreign_ship2_desc:0 "We lag behind other nations in ship design. To build a first-rate navy someday, we must learn what makes their ships superior."

 KMT_demand_taiwan2:0 "Demand Taiwan"
 KMT_demand_taiwan2_desc:0 "The people of Taiwan must be liberated from their current ruler and returned to us. Long divided, the nation must unite."

 KMT_taiwan_fleet_hub2:0 "Taiwan Fleet Hub"
 KMT_taiwan_fleet_hub2_desc:0 "The foreigners left behind an extensive amount of infrastructure in Taiwan. We should expand on this base to turn the entire island into one naval base and manufacturing center."

 KMT_break_the_first_island_chain:0 "Break the First Island Chain"
 KMT_break_the_first_island_chain_desc:0 "If China is to achieve its full potential, we must not content ourselves to this side of the Pacific. We must build a fleet capable of sailing past Taiwan and Japan."

 KMT_draw_the_nine_dash_line:0 "Draw the Nine-Dash Line"
 KMT_draw_the_nine_dash_line_desc:0 "The South China Sea contains many essential trade routes. If we claim this passageway, then we can move towards dominating Southeast Asia. However, we must have a fleet capable of backing up our claims and bringing all hostile trade to a watery grave."

 KMT_naval_equipment2:0 "Naval Equipment"
 KMT_naval_equipment2_desc:0 "A modern navy needs modern equipment."

 KMT_industrial_evacuations:0 "Industrial Evacuations"
 KMT_industrial_evacuations_desc:0 "We shall evacuate our industry to the Chinese hinterland. This will both secure our industry and prevent it from falling into the hands of the foreigners."

 KMT_break_the_second_island_chain:0 "Break the Second Island Chain"
 KMT_break_the_second_island_chain_desc:0 "Now that we have a fleet capable of carrying the fight past Japan, we must now build a fleet that can make any nation in the Pacific feel China's wrath. We shall make Zheng He proud."

 KMT_mobilize_the_chinese_volk_in_the_face_of_death:0 "Mobilization in the Face of Death"
 KMT_mobilize_the_chinese_volk_in_the_face_of_death_desc:0 "With the Japanese winning and our people being slaughtered, we must mobilize in the face of this death! We will resist and fight to the last man!"

 KMT_enforce_the_nine_dash_line:0 "Enforce the Nine-Dash Line"
 KMT_enforce_the_nine_dash_line_desc:0 "It appears that stating our claims to the South China Sea was not enough. We must continue the expansion of our navy, so we can make the Imperialists see the justice of our cause by force!"

 KMT_modernize_army2:0 "Modernize Army"
 KMT_modernize_army2_desc:0 "Spirit and skill are not enough to win a war. We also need up-to-date equipment."
 KMT_retake_manchuria:0 "Retake Manchuria"
 KMT_retake_manchuria_desc:0 "Dongbei, called Manchuria by the Westerners, fell to the Japanese and their puppets only a few years ago. We must take it back!"

 KMT_fund_the_northeast_development_agency:0 "Found the Northeast Development Agency"
 KMT_fund_the_northeast_development_agency_desc:0 "Although the Japanese developed parts of Manchuria, vast tracts of land remain untouched. We should begin an extensive effort to bring these once barbaric lands into the modern world."

 KMT_academia_sinica:0 "Academia Sinica"
 KMT_academia_sinica_desc:0 "Founded in 1928, the Academia Sinica oversees and coordinates scientific, social science, and humanistic research in all Republic of China's state-sponsored research institutes and universities. Unlike other government-sponsored research institutes, the Academia Sinica is directly responsible to the president."

 KMT_expand_peking_university:0 "Expand Peking University"
 KMT_expand_peking_university_desc:0 "Peking University is a world-class institution. We should give it more funding and provide scholarships to talented youths to produce a generation of skilled scientists and leaders."

 KMT_asylum_for_jews:0 "Asylum for Jews"
 KMT_asylum_for_jews_desc:0 "Many Jews have begun to settle in Shanghai after persecution and death in Europe. We should open our borders to all Jewish refugees so we may, in turn, profit from their expertise. Already, Jewish engineers have brought us Polish and German arms designs. What else can they do for their new protectors?"

 KMT_military_science2:0 "Military Science"
 KMT_military_science_desc:0 "Civilian science and military science are both critical to a nation's strength. Reasonable funding to the sciences will make our army more formidable."

 KMT_the_guandi_rocket_system:0 "The Guandi Rocket System"
 KMT_the_guandi_rocket_system_desc:0 "The dawn of rockets in warfare has arrived. We must adopt this new weapon system if our armies are to survive on the modern battlefield. Let our enemies feel the rage of the god of war!"

 KMT_expand_peking_university2:0 "Education for the Nation"
 KMT_expand_peking_university2_desc:0 "It is not enough to only allow those wealthy enough to afford a university education to enter the halls of learning. We must nationalize all of China's universities and base entrance on merit and not wealth."

 KMT_brave_science:0 "Brave Science"
 KMT_brave_science_desc:0 "Our scientists have had an inferiority complex, believing that they will never surpass the West no matter what they do. We need to start a propaganda program to restore our scientists' morale."

 KMT_nuclear_physics2:0 "Nuclear Physics"
 KMT_nuclear_physics2_desc:0 "If the theories of Einstein are correct, then splitting the atom could produce a weapon of untold power. We should further research this possibility."

 KMT_the_tianlong_jet_engine:0 "The Tianlong Jet Engine"
 KMT_the_tianlong_jet_engine_desc:0 "The development of jet technology would lead to our supremacy in the skies. The days of the Chinese foot soldier being open to attack from above would finally be over. Our strength would rise like the dragon in flight."

 KMT_fighter_focus2:0 "Fighter Focus"
 KMT_fighter_focus2_desc:0 "Air superiority is our first concern in aerial combat, and fighters are the ones that do the job."

 KMT_bomber_focus2:0 "Bomber Focus"
 KMT_bomber_focus2_desc:0 "Destroying supply lines and factories of our enemy is the best option in aerial warfare. Hence we should stick to the bomber."

 KMT_cas_effort2:0 "CAS Effort"
 KMT_cas_effort2_desc:0 "Close air support is highly beneficial to our army's advance on the ground. These CAS fighters will win the war for us."

 KMT_nav_effort2:0 "NAV Effort"
 KMT_nav_effort2_desc:0 "Naval bombers excel in destroying enemy ships and ports; they are an inalienable part of naval warfare."

 KMT_saco:0 "SACO"
 KMT_saco_desc:0 "The Sino-American Cooperative Organization aims to provide intelligence support to our army and train special operations forces."

 KMT_improve_the_burma_road:0 "Improve the Burma Road"
 KMT_improve_the_burma_road_desc:0 "Although the British built the Burma Road to help the war against the Japanese, the road itself is not that efficient; we should improve it."
 KMT_industrialization_NW2:0 "Local Industrialization: North West"
 KMT_industrialization_NW2_desc:0 "The North West region might look like a barren land; for now. Soon it will become one of the most industrialized areas."

 KMT_excavation_NW2:0 "North West Excavation"
 KMT_excavation_NW2_desc:0 "We must prospect for more resources in our land to become independent from imported resources."

 KMT_industrialization_S2:0 "Local Industrialization: South"
 KMT_industrialization_S2_desc:0 "The South may be one of the most industrialized areas, but it can be much more improved."

 KMT_excavation_S2:0 "Rubber Plantation"
 KMT_excavation_S2_desc:0 "The climate in the south is very suitable for rubber plantations; we should make good use of this."

 KMT_excavation_NE2:0 "North East Prospection"
 KMT_excavation_NE2_desc:0 "The Japanese left numerous tools in the area; we can use them to discover new resources in the area."

 KMT_ledo_road2:0 "Ledo Road"
 KMT_ledo_road2_desc:0 "Invaders have cut off the Burma Road; we must construct another road from India for supplies."

 KMT_dare_to_die_corps2:0 "Dare-To-Die Corps"
 KMT_dare_to_die_corps2_desc:0 "If we are to win the war against the invaders, our people must be brave enough not to fear death, they must be willing to do whatever it takes to defend our nation."

 KMT_reuse_captured_weaponary2:0 "Reuse Captured Weaponry"
 KMT_reuse_captured_weaponary2_desc:0 "To maintain a long-term war of attrition it is vital we use the equipment we capture during battle to its fullest advantage in order to maintain our armies strength."
 KMT_prepare_for_the_civil_war:0 "Prepare for the Civil War"
 KMT_prepare_for_the_civil_war_desc:0 "The need to prepare for the communists arises, as they might also be preparing for us."

 KMT_ultimatum_to_the_warlords_after_civil_war:0 "Vanquish the Warlords"
 KMT_ultimatum_to_the_warlords_after_civil_war_desc:0 "Now that we have destroyed the Communist Bandits, it is time for the warlords to meet the sword."

 KMT_offer_the_yangtze_partition:0 "Offer the Yangtze Partition"
 KMT_offer_the_yangtze_partition_desc:0 "The war is not going in our favor, and we are losing it heavily. With the [PRC.getAdjective] inability to cross our defensive lines across the Yangtze river, we can appeal for a diplomatic solution for this troublesome Civil War if we are willing to survive and spare our exhausted troops."

 KMT_taiwan_bastion2:0 "Taiwan Bastion"
 KMT_taiwan_bastion2_desc:0 "There is a chance that we might lose this war. To prepare for the eventuality, we must turn Taiwan into a national bastion where we can wait and prepare to retake the Mainland."

 KMT_collaborate_with_collaborators:0 "Collaborate with Collaborators"
 KMT_collaborate_with_collaborators_desc:0 "The former Japanese puppets are all traitors, and everyone knows it. But, with the Japanese gone, they can serve new masters."

 KMT_harsh_takeover_foc:0 "Seize the Hanjian"
 KMT_harsh_takeover_foc_desc:0 "There is no need to be polite with traitors. We shall arrest them all and put their resources at our disposal."

 KMT_develop_taiwan:0 "Develop Taiwan"
 KMT_develop_taiwan_desc:0 "Taiwan received much attention from the Japanese. Given that the Taiwanese economic base is considerably higher than the rest of China, it would be wise to develop it further so that it can serve as a model for the competence of our governance."

 KMT_integrate_warlord_forces:0 "Integrate Warlord Forces"
 KMT_integrate_warlord_forces_desc:0 "Both the Central Army and the warlords' forces comprise our current military. However, the warlords' forces are not very obedient towards our command. We will have a more efficient army if we somehow gain their trust."

 KMT_focus_on_the_central_army:0 "Focus on the Central Army"
 KMT_focus_on_the_central_army_desc:0 "The undisciplined warlord forces do not deserve our attention. Their only use is as cannon fodder and bait while our Central Army delivers the blow to our enemies."

 KMT_increase_sino_german_cooperation2:0 "Increase Sino-German Cooperation"
 KMT_increase_sino_german_cooperation2_desc:0 "We should cooperate more with Germany. This way, we will have a better edge ahead of our enemies."
 KMT_indiscrimatory_conscription_tt: "Modify §YLacking Support for Conscription§! by: \n Recruitable Population Factor §G+10%§! \n Army Attack Factor §R-5%§! \n Recovery Rate §R-5%§!"
 KMT_unindiscrimatory_conscription_tt: "Modify §YLacking Support for Conscription§! by: \n Recruitable Population Factor §R-10%§! \n Army Attack Factor §G+5%§! \n Recovery Rate §G+5%§!"
 KMT_special_military_pay_tt: "Modify §YLacking Support for Conscription§! by: \n Recruitable Population Factor §G+7.5%§! \n Expected number of factories put on Consumer Goods §Y+5%§!"
 KMT_unspecial_military_pay_tt: "Modify §YLacking Support for Conscription§! by: \n Recruitable Population Factor §R-7.5%§! \n Expected number of factories put on Consumer Goods §Y-5%§!"
 KMT_reducing_stuff: "Is already cutting conscription methods"
