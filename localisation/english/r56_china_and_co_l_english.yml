 KMT_reach_out_to_moscow: "Reach out to Moscow"
 KMT_reach_out_to_moscow_desc: "Our diplomats have now been told to reach out to Moscow, as they are our socialist brothers and we can learn much from them, perhaps this will result in great future cooperation..."
 KMT_military_exchanges: "Military Exchanges"
 KMT_military_exchanges_desc: "With our tentative cooperation born, we will request a soviet military mission, greatly boosting the efficiency of our army and helping us become a dominant force in the future."
 KMT_full_military_alliance: "Full Military Alliance"
 KMT_full_military_alliance_desc: "We owe the Soviets so much. Therefore it would only be right to request a full military alliance with them, further strengthening the mission and forging a great Eurasian bloc!"
 KMT_moscow_nanjing: "Moscow and Nanjing are working together"
 KMT_scrifice_in_the_name_of_china: "Sacrifice in the Name of China"
 KMT_scrifice_in_the_name_of_china_desc: "Our People must learn to Sacrifice themselves for the greater good of China! China will be saved and our people will fight for it!"
 KMT_the_return_of_whampoa: "The Return of Whampoa"
 KMT_the_return_of_whampoa_desc: "Whampoa has finally consolidated full power over China! All Hail the NRA!"
 KMT_extol_china: "Extol China"
 KMT_full_military_politicization: "Full Military Politicization"
 KMT_full_military_politicization_desc: "The Whampoa army has now regained it's politicization, ensuring that it will dominate the future of China."
 KMT_help_generals_into_the_government: "Help Generals Into the Government"
 KMT_help_generals_into_the_government_desc: "Whampoa now begins to help its Generals into our Government, ensuring that the Whampoa clique will only be able to expand power."
 KMT_full_loyalty_to_the_generalissimo: "Full Loyalty to the Generalissimo"
 KMT_full_loyalty_to_the_generalissimo_desc: "The army has declared full loyalty to the generalissimo, securing the army under him."
 KMT_the_grand_goverment: "The Grand Government"
 KMT_the_grand_goverment_desc: "Whampoa will put a grand government of members of the entire Whampoa clique in power. Soon it will be able to dominate all of China."
 KMT_civilian_matters_in_civilian_hands: "Civilian Matters in Civilian hands"
 KMT_civilian_matters_in_civilian_hands_desc: "Even Whampoa recognizes that certain things are better left in civilian hands. Thus, a policy based on exactly that is to be enacted."
 KMT_arrest_key_oppositional_figures: "Arrest Key Oppositional Figures"
 KMT_arrest_key_oppositional_figures_desc: "The military police will arrest key oppositional figures, ending all opposition to the new military rule. Whampoa and the KMT must not be questioned."
 KMT_anti_conservative_censorship: "Anti Conservative Censorship"
 KMT_anti_conservative_censorship_desc: "The State will censor the democrats and conservatives in the KMT, all must bow to the Whampoa clique and its regime!"
 KMT_violence_when_necessarys: "Violence When Necessary"
 KMT_violence_when_necessarys_desc: "We deem that it can be necessary to use violence at times. This principle that the Blueshirts have given us will be used to great effect in securing the regime."
 KMT_disband_the_cc_clique_wham: "Disband the CC Clique"
 KMT_disband_the_cc_clique_wham_desc: "The time has come to disband the CC clique and its opposition to us, destroying their pathetic uppity attitude."
 KMT_decrease_blueshirt_autonomy: "Decrease Blueshirt Autonomy"
 KMT_decrease_blueshirt_autonomy_desc: "We finally will decrease the Autonomy the Blueshirts have in the NRA and the Whampoa Clique, centralizing it and dealing with these degenerates."
 KMT_consolidate_military_power: "Consolidate Military Power"
KMT_consolidate_military_power_desc: "We must consolidate military power in our nation, securing it for Whampoa and Whampoa alone."
KMT_increase_military_quality_of_life: "Increase Military Quality of Life"
KMT_increase_military_quality_of_life_desc: "The government has mandated to increase the quality of life for our soldiers to the point that it is most lucrative to fight for us, with soldiers loving us and willing to die for us."
KMT_national_defense_fund: "National Defense Fund"
KMT_national_defense_fund_desc: "Whampoa lacks sufficient funds... This will be fixed with our new project and fund to expand our army."
KMT_high_pensions: "High Pensions"
KMT_high_pensions_desc: "The Government mandates a high pension, so that our troops will be happy to fight for us and will be willing to live on even if hurt."
KMT_a_martial_china: "A Martial State"
KMT_a_martial_china_desc: "China has become a true military state, controlled by Whampoa and with no opposition."
 KMT_national_military_indoctrination: "National Military Indoctrination"
 KMT_national_military_indoctrination_desc: "The Nation will be indoctrinated in the lines of the military, securing full power over it for Whampoa."
 KMT_all_hail_the_nra: "All Hail the NRA"
 KMT_all_hail_the_nra_desc: "As all HAil the NRA, it secures its power over China and unites the control of it over the nation."
 KMT_a_military_to_be_proud_of_desc: "We will foster a sense of pride in our military, uniting the country around it. This will make it truly great."
 KMT_parade_on_tianmen_square: "Parade on Tiananmen Square"
 KMT_parade_on_tianmen_square_desc: "Soldiers parade on Tiananmen square, truly showing the prowess of our military."
 KMT_mandatory_work_quotas: "Mandatory Work Quotas"
 KMT_mandatory_work_quotas_desc: "The Blueshirts establish mandatory work quotas to ensure that we are producing more than our enemies."
 KMT_align_with_moscow: "Align with Moscow"
 KMT_align_with_moscow_desc: "We shall seek to align with Moscow, the sponsors of our ideology and the future of this world.
 KMT_economic_unity: "Economic Unity"
 KMT_economic_unity_desc: "We shall send the Russians and offer for closer economic cooperation, bringing about a strong future."
 KMT_military_unity_desc: "We shall send the Russians and offer for closer military cooperation, bringing about a mighty future."
 KMT_military_unity: "Military Unity"
 KMT_one_union_in_all_but_name: "One Union in All but Name"
 KMT_one_union_in_all_but_name_desc: "In recent times we have effectively become a part of the soviet union. Let us officialize this and get ourselves special legal status!"
