 # Ideas #
 NIC_guardia_nacional_assassinations:0 "Guardia Nacional Assassinations"
 NIC_guardia_nacional_assassinations_desc:0 "The Guardia Nacional, a paramilitary unit comprised of some 4000 men, trained and instructed by the US Marine Corps in order to combat bandits and guerrilas in the early 30s, has fallen under the thumb of Anastasio Somoza García just some years ago. Ever since, it has been an instrument of power within the country, and has provided Anastasio Somoza García with incredible power and sway over the inner works of the country, and has practically given him the keys to total control of the country... As the days pass, it is only a matter of time before he uses his opprotunity to make himself a president under law!"
 NIC_the_cleanup:0 "Opposition Crackdown"
 NIC_volunteer_corps:0 "Expanded Guardia Nacional Powers"
 NIC_social_reforms:0 "Social Reforms"
 NIC_controlled_immigration:0 "Controlled Immigration"
 NIC_dependency_on_the_us:0 "Dependency on the US"
 NIC_trade:0 "Somozas Trade Deals"
 NIC_social_reforms3:0 "Social Reforms"
 NIC_ssgn:0 "SSGN"
 
 # Events #
 nicaragua.1.t:0 "Somoza's Presidential Ultimatum!"
 nicaragua.1.d:0 "It came to no ones surprise when, earlier this morning, Anastasio Somoza García has asked [ROOT.GetLeader] to step down as president of [NIC.GetNonIdeologyName]. Somoza and the Guardia Nacional under his control have waged a campaign of assassinations and terror against Somoza's political opponents and adversaries since the 1933 power-sharing agreement. The country has been in a presidential crisis since the middle of 1935, a crisis that many thought would plunge the country into chaos. [ROOT.GetLeader] has decided to avoid a possible civil war and step down, rather than try to maintain his grip on power. The [USA.GetNonIdeologyName], which brokered the 1933 deal, have washed their hands off the situation, many believe they might even be involved in supporting Somoza in what is essentially the fall of democracy in [NIC.GetNonIdeologyName], for their own interests of course.\n\nAnastasio Somoza García has appointed a temporary president that is a mere puppet for him. New elections will be organized, though many speculate that the upcoming elections will cetrainly be in favor of Anastasio Somoza García..."
 nicaragua.1.a:0 "Power, at the end of a barrel, Sacasa!"

 nicaragua.2.t:0 "[NIC.GetAdjective] Agitation!"
 nicaragua.2.d:0 "Ever since the dissolution of the Federal Republic of Central America in 1841, the border between [NIC.GetNonIdeologyName] and [HON.GetNonIdeologyName] hasn't been demaracted. This has led to both sides claiming and disputing a piece of land north of the Rio Coco river. The government of [NIC.GetNonIdeologyName] has utilized this in stirring up public sentiment, printing out postal stamps with regions of [HON.GetNonIdeologyName] being labeled as 'Territory in Dispute'! This is no doubt a provocation which we must respond to, to defend our sovereignty and dignity!"
 nicaragua.2.a:0 "The [NIC.GetAdjective] embassy must answer for this!"
 nicaragua.2.b:0 "Mobilize the troops! March on the Rio Coco!"

 nicaragua.3.t:0 "[HON.GetAdjective] Diplomatic Protest!"
 nicaragua.3.d:0 "The government of [HON.GetNonIdeologyName] has launched a diplomatic protest against [NIC.GetNonIdeologyName], and the 'Rio Coco Dispute' has gained public attention in both countries, leading to many [HON.GetAdjective]s organizing a protest in front of the [NIC.GetAdjective] embassy in [HON.GetNonIdeologyName]. During this unstable time, we are presented with two choices, either back down and attempt to settle the situation, or prepare to seize the lands of the Rio Coco, mobilizing the army and the state!"
 nicaragua.3.a:0 "This has gone too far..."
 nicaragua.3.b:0 "We shall meet them on the Rio Coco!"

 nicaragua.4.t:0 "[HON.GetAdjective] Troops Mobilize!"
 nicaragua.4.d:0 "Reports of [HON.GetAdjective] troops spotted across the Rio Coco have been surfacing lately, and the 'Rio Coco Dispute' has gained public attention in both countries, leading to many [HON.GetAdjective]s organizing a protest in front of the [NIC.GetAdjective] embassy in [HON.GetNonIdeologyName]. During this unstable time, we are presented with two choices, either back down and attempt to settle the situation, or prepare to seize the lands of the Rio Coco, mobilizing the army and the state!"
 nicaragua.4.a:0 "This has gone too far..."
 nicaragua.4.b:0 "We shall meet them on the Rio Coco!"

 nicaragua.5.t:0 "The Assassination of Pedro Altamirano"
 nicaragua.5.d:0 "Pedro Altamirano, an enemy of the state and follower of Augusto César Sandino, long-time guerrila, bandit and anti-government revolutionary, was killed today in a shootout with an officer from the 'Guardia Nacional' by a shotgun. This has virtually put an end to the banditry era, and [NIC.GetNonIdeologyName] shall soon be able to embrace a new, much more stable time soon enough! A true victory for [ROOT.GetLeader] and the people of [NIC.GetNonIdeologyName]!"
 nicaragua.5.a:0 "A celebratory occasion!"

 r56.news_event.1100.t:0 "Somoza Seizes Power in [NIC.GetNonIdeologyName]"
 r56.news_event.1100.d:0 "It came to no ones surprise when, earlier this morning, Anastasio Somoza García has asked [NIC.GetLeader] to step down as president of [NIC.GetNonIdeologyName]. Somoza and the Guardia Nacional under his control have waged a campaign of assassinations and terror against Somoza's political opponents and adversaries since the 1933 power-sharing agreement. Luckily, [NIC.GetLeader] has decided to avoid a possible civil war and step down, rather than try to maintain his grip on power. The [USA.GetNonIdeologyName], which brokered the 1933 deal, have washed their hands off the situation, many believe they might even be involved in supporting Somoza in what is essentially the fall of democracy in [NIC.GetNonIdeologyName], for their own interests of course..."
 r56.news_event.1100.a:0 "Yet another domino falls..."

