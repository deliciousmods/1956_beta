l_english:
 nicaraguan_focus:0 "Nicaraguan National Focus"
 # Country Stuff #
 NIC_GATHERING_STORM_DESC:0 "The scars of Augusto Caesar Sandino's rebellion against the government and the American occupation troops are still visible on Nicaraguan society and politics, even more so since the collapse of the economy, mainly based on coffee exports, following the Great Depression.\n\nJuan Bautista Sacasa, who became president in 1933, saw and is partly responsible for the rise to power of the head of the national guard, Anastasio Somoza García, who had taken charge of Sandino's murder in 1934.\n\nIt seems that the fall of Sacasa is near...."

 # Focus #
 NIC_president_somoza_garcia:0 "Somoza's Consolidation"
 NIC_president_somoza_garcia_desc:0 "After years of consolidating power into his hands, Anastasio Somoza García has finally gathered enough support, both local and foreign, to practically overthrow the government. This he shall achieve by requesting the incumbent president to resign from his position, and placing a puppet president in place, through which Somoza will be able to govern the country, from the shadows..."
 NIC_reinstate_national_guard_control:0 "Reinstate Guardia Nacional Control"
 NIC_reinstate_national_guard_control_desc:0 "Now that the limits imposed on candidates are no longer on the agenda, Anastasio Somoza García can resume his role as the head of the Guardia Nacional, which, combined with the position of soon-to-be president, should finally provide him with full control over [NIC.GetNonIdeologyName]'s armed forces and economy."
 NIC_begin_a_political_crackdown:0 "Purge the Liberal Opposition"
 NIC_begin_a_political_crackdown_desc:0 "A few voices continue to doubt Jarquín's legitimacy, despite Sacasa's clear resignation. We can tolerate a small opposition, as long as it does not or only slightly affect the elites, while for the most radical, they will suffer the same fate as Sandino, they shall be forgotten by history..."
 NIC_rig_the_elections:0 "Rig the [GetYear] Elections"
 NIC_rig_the_elections_desc:0 "All that stands in the way of Anastasio Somoza García hunger for power and money is the title of 'President of [NIC.GetNameDef]', which, if God wills it, he shall achieve by rigging the upcoming elections in his favor, bridging the last gap between him and unlimited power!"
 NIC_supervise_large_enterprises:0 "Nationalize Large Enterprises"
 NIC_supervise_large_enterprises_desc:0 "Without interfering with their operations, we must ensure that [NIC.GetNonIdeologyName]'s leading companies are aligned with the government's interests and objectives. This is imperative for the future of [NIC.GetNonIdeologyName]'s economy and its statehood!"
 NIC_judicial_control:0 "Judicial Control"
 NIC_judicial_control_desc:0 "Many of Somoza's relatives have been assigned high-ranking judicial roles, ensuring that the PLN will always have full cooperation from the judiciary, making passing laws a much easier task, and less bureaucratic also!"
 NIC_take_over_the_national_radio:0 "Take Over the Radio Nacional"
 NIC_take_over_the_national_radio_desc:0 "The Radio Nacional can serve as a great tool for pro-PLN propaganda, ensuring support even in the lower classes of [NIC.GetAdjective] society! If the Somozas were to gain control of the Radio Nacional, it would surely prove to be a great stabilizing factor for the nation."
 NIC_the_somoza_family_fortune:0 "The Somoza Family Fortune"
 NIC_the_somoza_family_fortune_desc:0 "The Somozas, a family of many influential members, possess almost total control over [NIC.GetNonIdeologyName]'s economy and politics, which has allowed them to accumulate a substantial fortune and own a huge part of the land."
 NIC_control_immigration:0 "Control Immigration"
 NIC_control_immigration_desc:0 "While [NIC.GetNonIdeologyName] is in a period of unrest, immigration restrictions are necessary to allow us time to restore internal stability."
 NIC_expanded_national_guard_powers:0 "Expand Guardia Nacional Powers"
 NIC_expanded_national_guard_powers_desc:0 "The Guardia Nacional represents the backbone of Somoza's power, an extension of power, and therefore of Somoza's influence. Expanding its influence will in-turn tigthen Somoza's grip over Nicaragua and its military."
 NIC_uproot_banditry:0 "Uproot Banditry"
 NIC_uproot_banditry_desc:0 "Nicaragua's cruel terrain has allowed groups of bandits and guerrilas to form and prevail for years, as well as  easily attack the central government, using hit-and-run tactics. It is time to put an end to it, and finally stabilize the countryside!"
 NIC_regulate_the_national_railroads:0 "Regulate the National Railroads"
 NIC_regulate_the_national_railroads_desc:0 "Somoza, by appointing himself as the director of the Pacific Railroad, will be able to ensure the proper management of the latter as well as the other railroads in the country. Every train shall run on time!"
 NIC_health_services:0 "Health Services"
 NIC_health_services_desc:0 "Access to decent healthcare remains limited in some parts of Nicaragua, yet a sick population is a weak population. It is time to expand access to health care, for all!"
 NIC_nicaraguan_diplomacy:0 "Nicaraguan Diplomatic Security"
 NIC_nicaraguan_diplomacy_desc:0 "[NIC.GetNonIdeologyName]'s geopolitical and strategic position could be desireable for many major powers currently, we must choose wisely, friend or foe, as sometimes, a true enemy is better than a fake friend!"

 # Soviet Alliance #
 NIC_the_strength_of_moscow:0 "Contact the [SOV.GetAdjective]s"
 NIC_the_strength_of_moscow_desc:0 "An alliance with [USA.GetNameDef], as much as with [GER.GetNonIdeologyName], could end up threatening our sovereignty, and above all, Somoza's legitimacy as the leader of [NIC.GetNonIdeologyName]. However, an alliance with the [SOV.GetNameDef], however unlikely it may be, could well be the most benefitial."
 NIC_nkvd_assistance:0 "NKVD Assistance"
 NIC_nkvd_assistance_desc:0 "We can learn a lot from the NKVD, whose effectiveness is no longer in question. Now that our relations with the Soviet Union are at their best, we could ask them to send some high-ranking members of their secret services to train our own."
 NIC_support_of_the_psn:0 "Support of the PSN"
 NIC_support_of_the_psn_desc:0 "Paradoxically, the Partido Socialista Nicaragüense has, in the past, proclaimed its support for Anastasio Somoza García, seeing him as an anti-fascist ally. With their support, our regime will probably be better seen not only by the Nicaraguan left, but by the world."
 NIC_soviet_economic_assistance:0 "[SOV.GetAdjective] Economic Assistance"
 NIC_soviet_economic_assistance_desc:0 "The industrial success of the USSR is unquestionable. However, perhaps we too, as a small agrarian nation, could become a fully industrialized nation following the [SOV.GetAdjective] model? There's no mistake in trying!"
 NIC_combat_fruit_industries_influence:0 "Combat the Fruit Industry's Influence"
 NIC_combat_fruit_industries_influence_desc:0 "The influence of the United Fruit Company on Nicaragua and other Central American nations has reached an troublesome point, not only for the Somoza family but also for our [SOV.GetAdjective] allies. It is time to put an end to their influence!"

 # American Alliance #
 NIC_look_to_washington_once_again:0 "Look to [USA.Capital.GetCapitalVictoryPointName]"
 NIC_look_to_washington_once_again_desc:0 "In this global conflict, our place is with the [USA.GetAdjective]s, without whom Somoza would never have found himself in his current position. Thus, both serving the national interests of [NIC.GetNonIdeologyName], and as a sign of gratitude, we must approach the [USA.GetAdjective]s with full support!"
 NIC_lend_lease_for_docking_rights:0 "Lend Lease for Docking Rights"
 NIC_lend_lease_for_docking_rights_desc:0 "In exchange for support in terms of armaments, we could offer [USA.GetNameDef] the right to use [NIC.GetAdjective] ports and naval facilities to repair, dock or supply their ships, helping them maintain control the Caribbean."
 NIC_begin_forcibly_annexing_nicaraguan_german_land:0 "Seize [GER.GetAdjective] Land"
 NIC_begin_forcibly_annexing_nicaraguan_german_land_desc:0 "We can use the war with [GER.GetNonIdeologyName] to force the small, yet strangely influential, [GER.GetAdjective] community in [NIC.GetNonIdeologyName] to sell their possessions and land for practically nothing, so that it can, of course, be bought by Somoza's relatives and family!"
 NIC_foreign_concessions_on_gold_exploitation:0 "Foreign Concessions on Gold Exploitation"
 NIC_foreign_concessions_on_gold_exploitation_desc:0 "By making concessions to [USA.GetAdjective] companies for gold, rubber and wood, we could ensure strong economic support for [NIC.GetNonIdeologyName]."
 NIC_marine_national_guard_cooperation:0 "Marine-Guardia Nacional Cooperation"
 NIC_marine_national_guard_cooperation_desc:0 "The Guardia Nacional, which was created precisely by the US Marine Corps during the early 30s, is still unexperienced and cannot be called a modern unit, yet alone army. Ensuring they are trained by the best of the best, being the US Marines, [NIC.GetNonIdeologyName] will be able to ensure that it has the highest quality soldiers on the continent!"

 # German Alliance #
 NIC_ally_the_champion_of_europe:0 "Align with the New Order"
 NIC_ally_the_champion_of_europe_desc:0 "It is clear that the [GER.GetAdjective]s shall be Europe's new masters. By joining forces with them now, rather than later, we could ensure that Nicaragua receives a share in the new order of the world..."
 NIC_push_south:0 "Strike South"
 NIC_push_south_desc:0 "To the south of [NIC.GetNonIdeologyName] lies a country called [COS.GetNonIdeologyName], a weak nation led by a similarly weak government, and a laughable army. By invading them, we could prove the effectiveness of the [NIC.GetAdjective] army to our new allies, and liberate some of the [GER.GetAdjective]s who reside there, who might be willing to cooperate with us..."
 NIC_steel_trade:0 "Steel Trade"
 NIC_steel_trade_desc:0 "A commercial contract with [GER.GetNonIdeologyName] for iron and steel will allow us to operate our plants much more efficiently and at a lower cost, and will provide the [GER.GetAdjective]s with capital with which they can continue their war in Europe!"
 NIC_local_intelligence_cooperation:0 "Local Assistance with the SSGN"
 NIC_local_intelligence_cooperation_desc:0 "To better hold the region and to prepare for a push south we must empower and strengthen our intelligence agency; the Servicio de Seguridad de la Guardia Nacional. Many [GER.GetAdjective] agents across South and Central America may be able to help us in this endeavour..."

 # Rio Coco Dispute #
 NIC_resolve_the_rio_coco_dispute:0 "Resolve the Rio Coco Dispute"
 NIC_resolve_the_rio_coco_dispute_desc:0 "Ever since the dissolution of the Federal Republic of Central America in 1841, the border between [NIC.GetNonIdeologyName] and [HON.GetNonIdeologyName] hasn't been demaracted. This has led to both sides claiming and disputing a piece of land north of the Rio Coco river. If we can stir up public sentiment, we might be able to use it to our advantage and spark a war with [HON.GetNonIdeologyName]!"

 # Custom Tooltips #
 NIC_dock_access:0 "§YWe will give the USA docking rights§! \n"
 NIC_remove_ideatt:0 "§YIf the National Spirit is Present:§! \n"

 # Flags #
 NIC_no_somoza:0 "§YSomoza García was Stopped§!"
