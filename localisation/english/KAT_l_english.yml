 KAT_the_geological_scandal:0 "The Geological Scandal"
 KAT_the_geological_scandal_desc:0 "With its underground rich in vast quantities of a vast array of minerals, the Katanga is known as the 'Geological Scandal'. Any national economic plan should focus on the development of our extractive capabilities."
 KAT_gold_mining:0 "Expand Gold Extraction"
 KAT_gold_mining_desc:0 "The presence of gold, diamond and other ores of values would give us direct revenues to continue our development."
 KAT_rare_minerals:0 "Exploit the Other Elements"
 KAT_rare_minerals_desc:0 "The presence of cobalt, molibdenum and other element could help us or our clients to forge niche alloys."
 KAT_exploit_the_yellowcake:0 "Exploit the Yellowcake"
 KAT_exploit_the_yellowcake_desc:0 "The so called Yellowcake is more than a bright pastry for Americans, it's the ore with the highest amount of Uranium in the entire world."