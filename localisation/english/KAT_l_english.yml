l_english:
 #swapped neutrality and democratic party names because Moise Tshombe was moved to democratic to allow for monarchism.
 KAT_neutrality_party: "Convention Nationale Katangaise"
 KAT_neutrality_party_long: "Convention Nationale Katangaise"

 KAT_democratic_party: "CONAKAT"
 KAT_democratic_party_long: "Confédération des Associations Tribales du Katanga"
 
 KAT_the_geological_scandal:0 "The Geological Scandal"
 KAT_the_geological_scandal_desc:0 "With its underground rich in vast quantities of a vast array of minerals, the Katanga is known as the 'Geological Scandal'. Any national economic plan should focus on the development of our extractive capabilities."
 KAT_gold_mining:0 "Expand Gold Extraction"
 KAT_gold_mining_desc:0 "The presence of gold, diamond and other ores of values would give us direct revenues to continue our development."
 KAT_katangese_copper:0 "Katangese Copper"
 KAT_katangese_copper_desc:0 "Copper is the main ore available in Katanga. It is even collected by the natives to create the 'croisettes', the little crosses which became our national emblem and were put on our flag."
 KAT_rare_minerals:0 "Exploit the Other Elements"
 KAT_rare_minerals_desc:0 "The presence of cobalt, molibdenum and other element could help us or our clients to forge niche alloys. Even the rejects of some mines contain enough of rare materials to justify the extraction of those elements."
 KAT_exploit_the_yellowcake:0 "Exploit the Richest Uranium Ore"
 KAT_exploit_the_yellowcake_desc:0 "The Uranium ore from the mine of Tchinkolobwe is the richest in the entire world."
