l_english:

 ############### SEARCH FOR TAGS ###############

 # () - Language is specific but can be fit into this category, if needed make own category (e.g. AFG, Pashto)
 # [] - Language is similair to multiple languages, and fits into 2+ categories [e.g. CAT, Catalan]
 ##### - Language has dialects or sub-languages that fit into the whole branch, as well as their sub-branch
 ### - Language is important or large-spanning

 ##### GERMAN - GER
 # SAXON - PRE, HAN, MEK, SHL, DNZ
 # FRANCONIAN - LUX, RHI, HES, THU, SAX, SAR, [ALS], VGE
 # ALEMANNIC - LIE, WUR, BAD, SWI, [ALS]
 # AUSTRIAN - AUS, BAY

 ##### ITALIAN - ITA, (SAD), AOI
 # CISALPINE - VNZ, SAN
 # SCIILIAN - SCI, [TTS]
 # NEAPOLITAN - NAP, [TTS]
 # TUSCAN - TOS, PAP, COR

 ##### SLAVIC
 # RUSSIAN - SOV, FER, VLA, CCK, BLR
 # UKRANIAN - UKR, RUT, GUK
 # CZECHOSLOVAK - CZE, SLO
 # POLISH - POL, KSH, SIL
 # SERBOCROATIAN - YUG, SER, CRO, SLV, BOS, MNT, HRZ
 # BULGARIAN - BUL, MAC

 ##### FRENCH - FRA, QBC, FRI
 # FRANCIAN - WLL, BEL
 # OCCITAN - OCC, MNC, CAT, ADR

 ##### TURKIC
 # KIPCHAK - KAZ, BSK, TAT, KYR, KKP, CRI, KBK
 # OGHUZ - TUR, AZR, TMS
 # KARLUK - UZB, KHI, BUK, SIK

 ##### CELTIC
 # GOIDELIC - IRE, SCO, NIR
 # BRITTONIC - BRI, WLS

 ##### ARABIC - ALG, LBA, TUN, SUD, SSU, MRT, WES, MOR, MLT
 # LEVANTINE - EGY, JOR, LEB, PAL, SYR
 # GULF - SAU, IRQ, UAE, YEM, OMA, IMO, QAT, KUW, BHR

 ### MALAY - MAL, INS, BRN, SGP, EIS, MLK, SWK, PHI
 ### PACIFIC - SAM, TON, FIJ, TAH, CHT

 ### SPANISH - SPR, SPA, URG, ARG, CHL, PAR, BOL, PRU, ECU, COL, VEN, PAN, COS, NIC, HON, ELS, GUA, MEX, CUB, DOM, BLZ, PUE, CNR, EQG

 ### NORDIC - SWE, NOR, DEN, AHV, ICE, FAR

 ### PORTUGESE - POR, BRA, GLC
 ### ROMANIAN - ROM, TRA, MOL

 ### MONGOLIC - MON, MEN, BYA, KAL
 ### SIBERIAN - TAN, ALT, YAK, KHA

 ### PERMIC - KOM, UDM

 ### FINNIC - FIN, KAR, EST
 ### HUNGARIAN - HUN, SZK

 ### DUTCH - HOL, INS, FLA

 ### IRANIAN - PER, TAJ, KUR, NOA, AFG

 ### THAI - SIA, LAO

 ### BALTIC - LAT, LIT

 ### ALBANIAN - ALB, KOS

 ### GREEK - GRE, CYP

 ### TIBETAN - TIB, BHU, SKK

 ############### HOW TO USE ###############

 # To add victory points, you can do it the same way as before, by prefixing a TAG before a "STATE_XXXXX:0 "NAME""

 # If you want to add a regional dialect to a victory point, you can use one of the TAGs that are in that regional group:
 # Lets say AUS from AUSTRIAN, AUS_STATE_9:0 "Bohemia". You DONT need to manually add entries for each TAG, that is what the python script is for.

 # To add an exception/skip entry which will NOT be expanded to other tags within the group/subgroup, you must add either one of the below mentioned entries after the loc key:
 # MANUAL
 # EXCEPTION
 # FORCE

 # Example:0 AUS_STATE_9:0 "Bohemia" # MANUAL

 ######## HOW TO RUN ########

 # YOU MUST HAVE PYTHON INSTALLED AND ADDED TO PATH ON YOUR DEVICE IN ORDER FOR YOUR DEVICE TO BE ABLE TO RUN IT!

 # To run the python script open cmd (in the folder of the script, click on the above adress line and type "cmd") and run "python reprocess_states.py"

 ############### END ###############

