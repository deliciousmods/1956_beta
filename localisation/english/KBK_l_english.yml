 ### Kabardino-Balkaria/Circassia ###
 # Decisions
 is_circassia_tt:0 "Has formed §YCircassia§!"
 form_circassia_category:0 "The March for Circassia"
 form_circassia_category_desc:0 "With the Battle of Qbaada bringing an end to the 100-year-long Russo-Circassian War in 1864, the brutal and bloody death of Circassia was achieved. What followed was almost a century of oppression and tyranny, leading to the revitalization of the Circassian national idea. Disunited and divided, we've proven small prey for the Russians... no more, we exclaim, with honor firmly before life!"
 KBK_form_circassia:0 "Declare Circassia's Survival"
 KBK_form_circassia_desc:0 "With the ancient homelands of the tribes in our government's grasp, the restored sovereignty of all Circassia can be announced to the world."
 # News event localsiation
 r56_circassia.1.t:0 "The Restoration of Circassia"
 r56_circassia.1.desc:0 "Surprising news from the North Caucasus - the former [KBK.GetOldName], following its conquest of territories extending to the Black Sea, has proclaimed the revival of the fallen tribal country of Circassia. Today, [KBK.GetLeader] has announced the \"beginning of a glorious era\" as [KBK.GetNameDef] stands as a state once again.\nMany in the diaspora are already making plans to return to their ancestral homeland. The [KBK.GetAdjective] government has expected this and is fully dedicated to accommodating for it."
 r56_circassia.1.a:0 "The Circassians are alive! Adyge Xabze is alive!"
 r56_circassia.1.b:0 "Back from the brink."
 r56_circassia.1.c:0 "This must not be tolerated!"
 