 ### Kabardino-Balkaria/Circassia ###
 # Decisions
 is_circassia_tt:0 "Has formed §YCircassia§!"
 form_circassia_category:0 "The March for Circassia"
 form_circassia_category_desc:0 "Our country - not the false Kabardino-Balkaria but the great Adyge Kheku - was utterly and savagely obliterated in the nineteenth century by the hands of the Russians. Ever since that black chapter of our history known as the Tsitsekun, the remains of our nation have lived in exile. The yoke of the old, artificial binational regime has been done away with and now we can move to reclaim Circassia and repatriate that diaspora.\n\nThe Circassians are alive!\nAdyge Xabze is alive!"
 KBK_form_circassia:0 "Form Circassia"
 KBK_form_circassia_desc:0 "With the ancient homelands of the tribes in our government's grasp, the restored sovereignty of all Circassia can be announced to the world."
 # News event localsiation
 r56_circassia.1.t:0 "The Restoration of Circassia"
 r56_circassia.1.desc:0 "Surprising news from the North Caucasus - the former [KBK.GetOldName], following its conquest of territories extending to the Black Sea, has proclaimed the revival of the extinct tribal country of Circassia. Wiped out by the Russian Empire in the nineteenth century, its people were slaughtered and the remnants dispersed, mainly to the Middle East. But today, [KBK.GetLeader] has announced the 'beginning of a glorious era' as [KBK.GetNameDef] stands as a state once again.\nMany in the diaspora are already making plans to return to their ancestral homeland. The [KBK.GetAdjective] government has expected this and is fully dedicated to accommodating for it."
 r56_circassia.1.a:0 "Tremble, perfidious Russia; your occupation has ended!"
 r56_circassia.1.b:0 "Back from the brink."
 r56_circassia.1.c:0 "This must not be tolerated!"
 