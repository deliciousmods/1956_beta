 r56_SAM_tufele_revolt_category:0 "Tufele Revolt"
 r56_SAM_tufele_revolt_category_desc:0 "Tufele is a candidate for the Tui Manu'a title, the most sacred title in Samoa as a whole. With the recent appointment of [ROOT.GetLeader] as the Tui Manu'a, Tufele has begun mobilizing his supporters in what seems to be a full scale rebellion against the current government."

 r56_SAM_time_until_tufele_revolts:0 "Tufele's Revolt"
 r56_SAM_time_until_tufele_revolts_desc:0 "Following the bestowment of the Tui Manu'a title upon [ROOT.GetLeader], Tufele has begun gathering his forces in anticipation for a nation wide revolt. We cannot under any circumstance allow this to happen!"
 
