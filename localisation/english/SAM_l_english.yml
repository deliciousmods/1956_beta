 ## INDEPENDENCE PREPARATIONS
 SAM_independence_preparations:0 "Organizing the State"
 SAM_independence_preparations_desc:0 "Following the Goodwill Mission and the subsequent compromise, Samoa was in Mau hands, but with a catch: §YWe are still a subject.§! No better than the rest of the Pacific. \nWe will continue our fight for independence through diplomacy, and if need be, military action.\n\nCurrent Political Organization is: §Y[?SAM_political_independence]%§!\n\nCurrent Economic Independence is: §Y[?SAM_economic_independence]%§!\n\nCurrent Military Independence is: §Y[?SAM_military_independence]%§!\n\n§RWARNING: Submitting our petition without sufficent independence in all three factors will decrease the chances of the [NZL.GetAdjective] government accepting our petition, and us becoming independent."