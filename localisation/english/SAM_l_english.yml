 #GM Decisions
 r56_SAM_new_zealand_reminder_to_do_goodwill:0 "Sending a Delegation to Western Samoa"
 r56_SAM_new_zealand_reminder_to_do_goodwill_desc:0 "We are running short on time, and our other methods of subduing the Mau have proven to be inadequate. We should consider sending a delegation to [726.GetName] and potentially begin negotiations with the Mau, where the future of Samoa can be discussed and decided upon peacefully."

 r56_SAM_time_until_goodwill:0 "Further Samoan Unrest"
 r56_SAM_time_until_goodwill_final_straw:0 "Samoan Declaration of Independence"
 SAM_samoa_will_be_buffed_in_negotiations:0 "§RSamoa is likely to be favored more during negotiations.§!"
 
 #GM Focus
 SAM_aftermath_of_the_goodwill_mission:0 "Aftermath of the Goodwill Mission"
 SAM_aftermath_of_the_goodwill_mission_desc:0 "The Goodwill Mission has concluded, and with it, the negotiations which transpired with it. The outcome is certain and final, and Samoa's future is now clear."

 #GM Ideas
 r56_SAM_goodwill_mission:0 "Goodwill Mission"
 r56_SAM_goodwill_mission_compromise:0 "Goodwill Mission"

 # CountryFlags (DONT CONFUSE WITH TTS)
 r56_goodwill_compromise:0 "Compromise in the Goodwill Mission"
 r56_goodwill_samoa_favored:0 "Samoan Demands Met"
 r56_SAM_nelson_returns_flag:0 "Nelson has returned to Samoa"
 r56_SAM_we_appoint_our_own_advisors_now_flag:0 "Self-Government has been achieved"
 r56_SAM_this_is_historical_please_follow_if_you_want_to_survive:0 "§OThis is historical!§!"
 r56_SAM_samoa_will_go_independent_if_you_go_down_this_path:0 "§OSamoa will be set down the path of independence.§!"
 r56_SAM_malietoa_cant_provisional_tt:0 "Upon completion, §YMalietoa Tanumafili I§! will §RNot§! form a §YProvisional Government§!."
 r56_SAM_we_will_ask_fautua_tt:0 "We will seek mediation with the two Fautua, §YMalietoa Tanumafili I§! and §YTuimaleali'ifano§!, in order to §YSecure their Support§! regarding our independence."
 r56_SAM_we_will_ask_fautua_tanumafili_tt:0 "We will seek mediation with §YMalietoa Tanumafili I§! in order to §YSecure his Support§! regarding our independence."
 r56_SAM_pacific_war_flag:0 "The §YSecond Samoan Crisis§! has Accrued."
 r56_SAM_samoa_won_goodwill_flag:0 "The Goodwill Negotiations Have Ended in §Y[SAM.GetNameWithFlag]'s§! Favour."
 
 # Begin Negotiations - NZL
 new_zealand.11.t:0 "A Goodwill Mission Arrives in Samoa"
 new_zealand.11.d:0 "Recently, a 'Mission of Goodwill' has arrived in Apia to discuss with the Mau Movement about the future of the Samoan archipelago. After many failed attempts at restoring our authority over the islands throughout the years, we have been left with no choice other than to bring ourselves into the negotiating table with the Mau. \n\nTheir demands will not be light, and there is a very high likelyhood that we will lose more than what we gain. However, if we can negotiate on the right terms, the damage might be neglectful, and we will come out in a better position than before."
 new_zealand.11.a:0 "Let the negotiations begin."
 
 # Begin Negotiations - SAM
 r56_goodwill_negotiations.1.t:0 "A Goodwill Mission Arrives in Western Samoa"
 r56_goodwill_negotiations.1.d:0 "Recently, a 'Mission of Goodwill' has arrived in Apia to discuss with the Mau Movement about the future of the Samoan archipelago. After many years of fighting off the threat that [NZL.GetCapitalVictoryPointName] possed to us, they have put down their arms and have opened the room for negotiations between our two parties. \n\nToday, the [NZL.GetAdjective] delegation sets foot in Apia, and negotiations about our autonomy will begin."
 r56_goodwill_negotiations.1.a:0 "The day of independence will soon come."

 # Question of Fono - SAM
 r56_goodwill_negotiations.2.t:0 "The Question of the Fono"
 r56_goodwill_negotiations.2.d:0 ""
 r56_goodwill_negotiations.2.a:0 "We shall send our request and hope for the best."
 
 # Question of Fono - NZL
 r56_goodwill_negotiations.3.t:0 "Mau Demands Free Elections"
 r56_goodwill_negotiations.3.d:0 "The first set of demands have arrived. \nThe Fono is the traditional parliament of the Samoan government, where chiefs gather to discuss important political matters. Under the governance of the Conservative government a few years prior, the Fono's power was limited and the real power was in the hand's of the administrator. \n\nThe Mau wishes to change this. To give power back to the traditional parliament and to establish elections where the people can vote their representatives in the Fono."
 r56_goodwill_negotiations.3.a:0 "These demands seem reasonable."
 r56_goodwill_negotiations.3.b:0 "Giving this much power to the Mau is a foolish move."
 
 # NZL Accepts Fono
 r56_goodwill_negotiations.4.t:0 "[NZL.getNameDefCap] Accepts our Demands"
 r56_goodwill_negotiations.4.d:0 ""
 r56_goodwill_negotiations.4.a:0 "One step closer to independence!"
 
 # NZL Rejects Fono
 r56_goodwill_negotiations.5.t:0 "[NZL.getNameDefCap] Rejects our Demands"
 r56_goodwill_negotiations.5.d:0 ""
 r56_goodwill_negotiations.5.a:0 "If our demands fall on deaf ears, then whats the point?"
 
 #Question of Independence - SAM
 r56_goodwill_negotiations.6.t:0 "Question of independence"
 r56_goodwill_negotiations.6.d:0 ""
 r56_goodwill_negotiations.6.a:0 "A dream realised...?"
 
 #Question of Independence - NZL
 r56_goodwill_negotiations.7.t:0 "Samoa Brings up the Question of Independence"
 r56_goodwill_negotiations.7.d:0 ""
 r56_goodwill_negotiations.7.a:0 "Lets settle on a compromise."
 r56_goodwill_negotiations.7.b:0 "Maybe a dream will be realised."
 r56_goodwill_negotiations.7.c:0 "They come to the negotiation table just to try and humiliate us?"
 
 #NZL Accepts Protectorate
 r56_goodwill_negotiations.8.t:0 "[NZL.getNameDefCap] Recognizes the Mau"
 r56_goodwill_negotiations.8.d:0 ""
 r56_goodwill_negotiations.8.a:0 "Its the best we can get."
 
 #NZL Accepts Independence
 r56_goodwill_negotiations.9.t:0 "[NZL.getNameDefCap] Accepts Full Independence"
 r56_goodwill_negotiations.9.d:0 ""
 r56_goodwill_negotiations.9.a:0 "Independence at last!"
 
 #NZL Rejects any Independence
 r56_goodwill_negotiations.10.t:0 "New Zealand Leaves Us On Read"
 r56_goodwill_negotiations.10.d:0 "babe?"
 r56_goodwill_negotiations.10.a:0 "THATS IT!"
 
 #GM Compromise - SAM
 r56_goodwill_outcome.1.t:0 "Goodwill Mission: Compromise"
 r56_goodwill_outcome.1.d:0 "Many of our demands were met. But not all. \nThis resulted in a compromise being reached between our government and the [NZL.GetNameDef]. For now, we must be content with what we have, and continue our slow process towards independence."
 r56_goodwill_outcome.1.a:0 "It could have been worse."
 
 #GM Compromise - NZL
 r56_goodwill_outcome.2.t:0 "Goodwill Mission: Compromise"
 r56_goodwill_outcome.2.d:0 "Pennsylvania Ave NW, Washington, DC 20500 1600"
 r56_goodwill_outcome.2.a:0 "It is an affordable loss."
 
 #GM Samoa Win - SAM
 r56_goodwill_outcome.3.t:0 "Goodwill Mission: Samoan Demands Met"
 r56_goodwill_outcome.3.d:0 "Recently, [NZL.GetAdjective] diplomats have departed back to their homes as a result of negotiations ending. The result was that Samoa would begin the gradual process to independence, and would become a free nation in the coming future."
 r56_goodwill_outcome.3.a:0 "After much struggle, we are free."
 
 #GM Samoa Win - NZL
 r56_goodwill_outcome.4.t:0 "Goodwill Mission: Samoan Demands Met"
 r56_goodwill_outcome.4.d:0 "Recently, our diplomats have returned from Apia as a result of negotiations between us and the Mau ending. The result was that Samoa would begin their gradual process to full self governance, and eventually become an indepednent nation."
 r56_goodwill_outcome.4.a:0 "It was only a matter of time, really."
 
 #GM NZL Win - NZL
 r56_goodwill_outcome.5.t:0 "Goodwill Mission: Samoan Representatives Storm Out"
 r56_goodwill_outcome.5.d:0 "As a result of us rejecting a majority of the Mau's demands regarding the future of Samoa, they have decided to abruptly end negotiations and resume the current status quo until further notice."
 r56_goodwill_outcome.5.a:0 "Maybe this is still solvable...?"
 
 #GM NZL Win - SAM
 r56_goodwill_outcome.6.t:0 "Goodwill Mission: Failed Negotiations"
 r56_goodwill_outcome.6.d:0 "Our demands were rejected, and we were humiliated. Maybe this is a sign to start doubling down on our efforts?"
 r56_goodwill_outcome.6.a:0 "Accept our loss...?"
 
 #Samoa declares independence - NZL
 r56_goodwill_outcome.7.t:0 "Samoa Declares Independence"
 r56_goodwill_outcome.7.d:0 "After the failure of negotiations between our government and the Mau, Samoa has declared independence from us, claiming to be a legitimate and sovereign naiton."
 r56_goodwill_outcome.7.a:0 "Enough is enough! We have reached our limit!"
 r56_goodwill_outcome.7.b:0 "Leave the demon to his demons.."
 
 #Samoa declares independence - SAM
 r56_goodwill_outcome.8.t:0 "Our Declaration of independence"
 r56_goodwill_outcome.8.d:0 "With [NZL.GetNameDef] making almost no effort in solving the current conflict between it and us, we have decided to unilaterally declare independence from [NZL.GetName] and to progress down our own path, without the restrictions imposed by a colonial overlord."
 r56_goodwill_outcome.8.a:0 "We are left with no choice."
 
 #GM Decision Category
 r56_SAM_goodwill_mission_negotiations_tracker_category:0 "Goodwill Mission: Future of Samoa"
 r56_SAM_goodwill_mission_negotiations_tracker_category_desc:0 "--------------------------------------------------------------------------------------------\n§YThe nation with the most amount of influence in the negotiations will be favoured. If both sides have an equal amount of influence, a compromise will be reached. \nCurrent influence of each side:§! \n-------------------------------------------------------------------------------------------- \nAfter years of political stalemate between the [NZL.GetAdjective] government and the Mau, the two sides have begun negotiations regarding the future of the Samoan archipelago. \n\nIf the negotiations §GFavor§! the Mau, a path to §YIndependence§! will lie ahead of Samoa and its people, and Samoa will be more likely to follow the political ideology of New Zealand. \n\nAlthough, on the other end, if negotiations turn out favoring New Zealand, there is a §RHigh§! likelyhood of §YConflict§! breaking out between the two nations. \n\nOur best hope is to achieve a §YCompromise§! and to uphold peace. Even if it may leave both sides dissatisfied."
