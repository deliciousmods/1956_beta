 r56_samoa_focus: "Samoan National Focus"
 
 ## IDEAS
 r56_SAM_collapsed_colonial_authority:0 "Collapsed Colonial Authority"
 r56_SAM_collapsed_colonial_authority_desc:0 "After the Black Saturday incident of 1929, the colonial government has all but collapsed, and has lost control over most, if not, all of Western Samoa. \nThis has left the Mau Movement, a nationalist and pro-independence organization aiming for the restoration of Samoan independence, to take over the Western portion of Samoa and act as it's government until further notice."

 r56_SAM_palauli_rebelion:0 "Unrest in Palauli"
 r56_SAM_palauli_rebelion_desc:0 "The district of Palauli, which encompasses a giant chunk of the western island of Sava'i, has been in open revolt ever since the beginning of the Mau and [NZL.GetNameDef] conflict. Having barred [NZL.GetAdjective] authorities from entering it's boundaries, it acts as a self-governing district that can inspire other districts to rise up and follow a similar path to Palauli."

 r56_SAM_malietoa_opposition:0 "Malietoa Provisional Government"

 r56_SAM_a_divided_samoa:0 "Legacy of 1899"
 r56_SAM_a_divided_samoa_desc:0 "In 1899, the Tripartite Convention was held between the German Empire, the United Kingdom, and the United States. This marked the end of the Triple-Condominium that existed in Samoa prior to the convention, and established 2 separate colonial administrations: §YWestern Samoa§!, which belonged to the German Empire. And §YAmerican Samoa§!, governed by the United States Navy. \n\nEver since then, Samoa and it's people have remained divided by national bounadries, with no change in sight. \n\n§YTo remove this national spirit, we must own both Western and Eastern Samoa.§!"

 #r56_SAM_tumua_and_pule:0 "Tūmua and Pule"
 #r56_SAM_tumua_and_pule_desc:0 "Tūmua ma Pule is a collection of all chiefs and authority in Sava'i and Upolu."

 r56_SAM_cacao_industry:0 "Cash Crops"
 r56_SAM_cacao_industry_desc:0 "Samoa's economy largely conists of plantations and exports of copra, cacao, and other similar commodities. Many, if not all plantations are foreign-owned, mostly by Papālagi (White foreigners) capitalists. And whilst these plantations provide us with a fairly stable economy, the governments of the American, and especially European plant owners can choose to recall their citizens in a case of conflict or poor relations, which can have major implications for our economy."

 r56_SAM_cacao_industry_improved:0 "Cash Crops"
 r56_SAM_cacao_industry_improved_desc:0 "Samoa's economy largely conists of plantations and exports of copra, cacao, and other similar commodities. Many, if not all plantations are foreign-owned, mostly by Papālagi (White foreigners) capitalists. And whilst these plantations provide us with a fairly stable economy, the governments of the American, and especially European plant owners can choose to recall their citizens in a case of conflict or poor relations, which can have major implications for our economy."
 
 r56_SAM_cacao_trade_with_new_zealand:0 "Samoan Cash Crops"

 r56_SAM_sun_and_mercury_idea:0 "Pacific War"

 r56_SAM_donated_to_uk:0 "Raising Funds for the War Effort"

 r56_SAM_war_fleet_of_manono_idea:0 "War Fleet of Manono"
 r56_SAM_war_fleet_of_manono_idea_desc:0 "The district of Manono has a long history with naval combat, having been mostly undefeated all the way up to the partition of Samoa. If we are to utilize their experience in naval combat, Samoa may  have it's own fair share of naval victories which it can pride itself with."

 r56_SAM_foreign_plantations_idea:0 "Foreign Plantations Seized"

 r56_SAM_chris_young_spirit:0 "Tui Manu'a, Kilisi Young"
 r56_SAM_chris_young_spirit_desc:0 "Holding the holiest title in all of Samoa, the Tui Manu'a, whilst politically disengaged, is still regarded highly by "

