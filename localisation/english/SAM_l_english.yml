 r56_SAM_put_down_unrest_in_palauli:0 "Restore Control Over Palauli"
 r56_SAM_put_down_unrest_in_palauli_desc:0 "Palauli is a province in the western island of Sava'i that has resisted the central government and has barred the Colonial Police from entering it's district boundaries. This is unacceptable, and we must restore our control over the district to be able to govern the territory properly whilst not letting other districts gain similar ideas."

