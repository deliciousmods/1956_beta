 #Politics
 r56_SAM_aftermath_of_the_goodwill_mission:0 "Aftermath of the Goodwill Mission"
 r56_SAM_aftermath_of_the_goodwill_mission_desc:0 ""

 r56_SAM_colonial_elections:0 "Hold the [GetYear] Elections"
 r56_SAM_colonial_elections_desc:0 "Following the stipulations of the Goodwill Mission, we shall now hold national elections to see who will lead Samoa into the future, and hopefully to independence."
 
 r56_SAM_continue_the_fight_for_self_determination:0 "Continue the Fight for Self Determination"
 r56_SAM_continue_the_fight_for_self_determination_desc:0 "With self-government achieved, the fight for full independence continues. We will slowly assume full responsibility of all sectors of governance, and once we have a good amount of control over our nation, we will contact [NZL.Capital.GetCapitalVictoryPointName] and submit our petition."

 r56_SAM_expand_rights_of_village_chiefs:0 "Expand the Rights of Village Chiefs"
 r56_SAM_expand_rights_of_village_chiefs_desc:0 "Expanding the rights and autonomy of the village chiefs, which was previously suppressed by the [NZL.GetAdjective] colonial administration, will increase the trust and popularity of our government, whilst also keeping the traditional structure of Samoa intact."

 r56_SAM_propose_expanding_the_rights_of_alii_and_faipule:0 "Expand the Rights of the Fono"
 r56_SAM_propose_expanding_the_rights_of_alii_and_faipule_desc:0 ""

 r56_SAM_propose_making_nelson_faatonu:0 "Propose Appointing Nelson Fa'atonu"
 r56_SAM_propose_making_nelson_faatonu_desc:0 "Now that we are self-governing, we could consider appointing O.F Nelson as a advisor to the administration, alongside other pre-existing advisors. But with Nelson's troubled history with [NZL.GetAdjective] authorities, it may be seen as a threat by the [NZL.GetAdjective] government to their foothold in Samoa, and can result in them rejecting our eventual petition for independence."

 ##WIP POLITICS
 r56_SAM_pressure_the_legislative_council:0 "Pressure the Legislative Council"
 r56_SAM_pressure_the_legislative_council_desc:0 "We're fed up with colonial oppression. It is time for us to restore our independence after decades of foreign occupation!"
 r56_SAM_trigger_pressure_council:0 "§YGoodwill Negotiations§! have §RBroken down§!."
 r56_NZL_no_goodwill_in_time_flag:0 "§ONew Zealand§! has §RFailed§! to send a §YMission of Goodwill§! in time."

 r56_SAM_talks_with_fautua:0 "Talks with the Fautua's"
 r56_SAM_talks_with_fautua_desc:0 "Without support from the higher ups, our population will begin to question our legitimacy, and potentially abandon the cause. We should send an envoy to the Fautua's and secure their support."

 r56_SAM_gather_opposition:0 "Gather the Opposition"
 r56_SAM_gather_opposition_desc:0 ""

 r56_SAM_mobilize_the_mau:0 "Mobilize the Mau"
 r56_SAM_mobilize_the_mau_desc:0 "The future is unwritten. To ensure our victory in all outcomes, we must mobilize our men in preparation for a potential future conflict."

 r56_SAM_declaration_of_independence:0 "Reclaim Our Independence!"
 r56_SAM_declaration_of_independence_desc:0 "All of the pieces are in place. This move will change everything going forwards."
 r56_SAM_locks_all_previous_focuses_tt:0 "By §OCompleting§! this focus, we will be §RLocked§! out of §YAll Previous Focuses§! before this one."
 r56_SAM_taking_x_focuses_reduce_time_tt:0 "§OCompleting§! the focuses above will §GReduce§! the time this focus takes down to a minimum of §Y28 Days§!."

 r56_SAM_seek_international_recognition:0 "Seek International Recognition"
 r56_SAM_seek_international_recognition_desc:0 "Although we have secured our independence, we are not yet recognised as a legitimate political body by the international community. This must change. We will send our diplomats abroad to secure recognition from states who share our political ideology."
 r56_SAM_recognition:0 "Each time a country recognizes us, we will get §G+5§! §YPolitical Power§! and §G+1§! §YStability§!."

 r56_SAM_follow_1930_constitution:0 "Follow the 1930 Constitution"
 r56_SAM_follow_1930_constitution_desc:0 ""

 r56_SAM_slander_colonial_overlord:0 "Slander the Colonial Overlords"
 r56_SAM_slander_colonial_overlord_desc:0 ""

 r56_SAM_glorify_mataafa_iosefo:0 "Glorify Mata'afa Iosefo"
 r56_SAM_glorify_mataafa_iosefo_desc:0 "Mata'afa Iosefo was the main proponent of Samoan independence, and fought to upkeep it during Samoa's internal woes in the late 19th century. His legacy shall not be in forgrotten!"

