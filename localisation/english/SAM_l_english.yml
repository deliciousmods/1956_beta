 SAM_afakasi:0 "The 'Afakasi Split"
 SAM_afakasi_desc:0 "Having mixed European and Samoan heritage, the 'Afakasi form a distinct social group enjoying both the privileges and restrictions imposed by colonial rule. Many 'Afakasi claim European status to access better opportunities, from education and legal protections to the right to hold passports. Yet these gains come at a cost: they are alienated from traditional Samoan rights, stripped of their matai titles, and regarded with suspicion by both Samoans and Europeans. As tensions rise, the 'Afakasi, holding valuable knowledge of both cultures, must choose between aligning with the european system or retracing their Samoan roots, intensifying a divide that threatens to fracture Samoan unity."
 SAM_afakasi_2:0 "The 'Afakasi Split"
 SAM_cacao_industry:0 "Cacao Plantations"
 SAM_cacao_industry_desc:0 "Samoa's main export largely consists of Cacao and Copra. Whilst Samoa proves to be the perfect place for growing such things, many, if not all plantations are foreign-owned, mostly by major corporations or wealthy European capitalists... Nationalizing the plantations may also lead to some trouble with the people who own said plantations, and their country of origin."
