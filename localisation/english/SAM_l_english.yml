 #Army variables stuff
 r56_SAM_samoan_army_idea:0 "Army of Samoa"
 r56_SAM_samoan_army_idea_desc:0 "The Samoan nation can pride itself in the fact that it has been able to maintain its country's independence for over 3,000 years, and for being a particulary hard foe to defeat, having secured major victories over the lights of the United States and the United Kingdom. \n\nBut Samoa's army doesn't function like other nations do. Infact, the country's army is rather decentralised, with each village having its own armed forces, making Samoa's army more or less a collection of units spread out across the country serving their local chief and village. But recently, changes have been seen. \n\nWith the conflict with [NZL.GetNameDef] escalating to one of direct confrontation, the Mau has formed its own battalions which serve not a local village, but the organization. Something never seen before in the nation. These are known as the 'Mau Men' who often wage guerrilla warfare, and serve more as militias than actual divisions. \n\nBut times are changing. With technological advances in multiple sectors of warfare, and our lack of knowledge regarding these new advancements, our military risks becoming a fragile and ineffective force."

