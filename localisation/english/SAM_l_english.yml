 r56_SAM_mau_new_zealand_war_category:0 "Second Samoan Crisis"
 r56_SAM_mau_new_zealand_war_category_desc:0 "After Samoa's unilateral declaration of independence, and [NZL.GetNameDef]'s subsequent declaration of war, the region has been greatly destabilised and has caught the eye of [USA.GetNameDef], who want's to ensure the safety of it's plantations in [726.GetName], but to also keep it's relationship with [NZL.GetName] on good terms. \n\nIf the war does not come to a halt, it is likely that the Americans will intervene."

