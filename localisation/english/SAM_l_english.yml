l_english:
 r56_samoa_focus: "Samoan Focus Tree"
 SAM_GATHERING_STORM_DESC:0 "Over the past couple of years, the Mau and the New Zealand Colonial Administration have bled each other dry in a conflict that is starting to see it's conclusion. After tensions reached their peak in 1929, the Colonial administration had lost any ability to contain the Mau, leaving the Mau to quickly become the de-facto rulling government of Western Samoa. \n\nBut now that the Labour party has come to power in New Zealand, a rapprochement between the Mau and government has become a possibility that might end this conflict."
 
 ## IDEAS
 r56_SAM_mau_factionalism:0 "Factionalism Within the Mau"
 r56_SAM_mau_factionalism_desc:0 "Whilst the Mau stands united under one cause, factionalism within the organisation between the Progressive, Moderate, and Radical elements have led to early fragments and weakness in the organisation. If the organisation and its members are not united, then it may risk the entire organisation falling apart."

 r56_SAM_palauli_rebelion:0 "Unrest in Palauli"
 r56_SAM_palauli_rebelion_desc:0 "The district of Palauli, which encompasses a giant chunk of the western island of Sava'i, has been in open revolt ever since the beginning of the Mau and [NZL.GetNameDef] conflict. Having barred [NZL.GetAdjective] authorities from entering it's boundaries, it acts as a self-governing district that can inspire other districts to rise up and follow a similar path to Palauli."

 r56_SAM_malietoa_opposition:0 "Malietoa Provisional Government"
 r56_SAM_malietoa_cooperation:0 "Cooperation with the Malietoa"

 r56_SAM_a_divided_samoa:0 "Legacy of 1899"
 r56_SAM_a_divided_samoa_desc:0 "After centuries of native rule and division amongst their respective chiefdoms, the entire Samoan island archipelago, with the exception of the Manu'a islands, came under one sovereign entity known as the Kingdom of Samoa. Although, due to disputes over who shall bare the title as King between the native chiefs, civil unrest became prominent and would be the catalyst to the partition of the young Kingdom between the United States and the German Empire. \n\nAfter the Great War, the Western portion, formally held by the German Empire, fell into the hands of New Zealand and would be turned into a League of Nations Mandate. Whilst the eastern portion, including the Manu'a islands, remained under U.S sovereignty. Currently, a unified Samoan entity is a thing one can only dream of, but if we make a big enough effort, whether it be through diplomatic or martial means, we may be able to unify the archipelago once more."
 r56_SAM_a_divided_samoa_desc:0 "In 1899, the Tripartite Convention was held between the German Empire, the United Kingdom, and the United States. This marked the end of the Triple-Condominium that existed in Samoa prior to the convention, and established 2 separate colonial administrations, §YWestern Samoa§!, which belonged to the German Empire. And §YAmerican Samoa§!, governed by the United States Navy. \n\nEver since then, Samoa and it's people have remained divided by national bounadries, with no change in sight. \n\n§YTo remove this national spirit, we must own both Western and Eastern Samoa.§!"

 r56_SAM_tumua_and_pule_idea:0 "Tūmua and Pule"
 r56_SAM_tumua_and_pule_idea_desc:0 "Tūmua and Pule are a collection of all chiefs and authority in Sava'i and Upolu."

 r56_SAM_cacao_industry:0 "Cash Crops"
 r56_SAM_cacao_industry_desc:0 "Samoa's economy largely conists of plantations and exports of copra, cacao, and other similar commodities. Many, if not all plantations are foreign-owned, mostly by Papālagi (White foreigners) capitalists. And whilst these plantations provide us with a fairly stable economy, the governments of the American, and especially European plant owners can choose to recall their citizens in a case of conflict or poor relations, which can have major implications for our economy."

 r56_SAM_agrarian_society:0 "Agrarian Society"
 r56_SAM_agrarian_society_desc:0 "Samoa's industry revolves around the export of copra, cacao, and other similar commodities. Many within the conservative government seek to keep this as our primary industry and are actively against industrialization with the fear of it damaging the purity of our islands."

 r56_SAM_trade_agreements_with_nzl:0 "Agreements with New Zealand"
 r56_SAM_trade_agreements_with_nzl_desc:0 "Despite the conflict between our two nations, some districts have continued to conduct business with the New Zealander government and are exporting their own commodities to the nation. This, alongside our fragile economy, ties us economically to our overlord. \n§W--------------\n§!§WTo gain§! §GIndependence§! §Wfrom [NZL.GetNameDef], we must have significant support for a party that doesn't back the Wangchuck Dynasty.§! §WThis will unlock a§! §YDecision§! §Wto end our £autonomy_texticon  §RSubjugation§!."

 r56_SAM_cacao_industry_improved:0 "Cash Crops"
 r56_SAM_cacao_industry_improved_desc:0 "Samoa's economy largely conists of plantations and exports of copra, cacao, and other similar commodities. Many, if not all plantations are foreign-owned, mostly by Papālagi (White foreigners) capitalists. And whilst these plantations provide us with a fairly stable economy, the governments of the American, and especially European plant owners can choose to recall their citizens in a case of conflict or poor relations, which can have major implications for our economy."
 
 r56_SAM_cacao_trade_with_new_zealand:0 "Samoan Cash Crops"

 r56_SAM_sun_and_mercury_idea:0 "Pacific War"

 r56_SAM_conquering_the_oppressor:0 "Crushing the British Yoke"

 r56_SAM_donated_to_uk:0 "Raising Funds for the War Effort"

 r56_SAM_war_fleet_of_manono_idea:0 "War Fleet of Manono"
 r56_SAM_war_fleet_of_manono_idea_desc:0 "The district of Manono has a long history with naval combat, having been mostly undefeated all the way up to the partition of Samoa. If we are to utilize their experience in naval combat, Samoa may  have it's own fair share of naval victories which it can pride itself with."

 r56_SAM_foreign_plantations_idea:0 "Foreign Plantations Seized"

 r56_SAM_chris_young_spirit:0 "Tui Manu'a, Kilisi Young"
 r56_SAM_chris_young_spirit_desc:0 "Holding the holiest title in all of Samoa, the Tui Manu'a, whilst politically disengaged, is still regarded highly by "

 # COMPANIES
 r56_SAM_nzl_reparation_estates:0 "New Zealand Repartion Estates"
 r56_SAM_ford_samoa:0 "Ford"

 # CHARACTERS

