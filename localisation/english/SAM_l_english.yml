 ## EVENTS
 
 ## Tuimalealiʻifano Dies
 r56_samoa.1.t:0 "Tuimaleali'ifano Passes Away"
 r56_samoa.1.desc:0 "One of the leaders of the Mau Movement, Tuimaleali'ifano Fa'aoloi'i Si'ua'ana I, has recently passed away at the age of 82. His contributation to our struggle was immense and honorable. May he rest in peace."
 r56_samoa.1.a:0 "Rest in peace."
 
 ## Olaf Frederick Nelson Returns
 r56_samoa.2.t:0 "O.F Nelson Returns From Exile"
 r56_samoa.2.desc:0 "Olaf Frederick Nelson, the face of the Mau internationally, has recently stepped foot back onto Apia after his exile was revoked. Crowds in the capital celebrate his arrival. \n\nAlthough, Nelson expresses no desire to be involved in politics, and due to his worsening health, prefers to live his life quietly with his family. But he may still come along the Mau's missions if he is needed."
 r56_samoa.2.a:0 "Welcome back!"
 
 ## Mataafa Dies
 r56_samoa.3.t:0 "Matā'afa Muliufi Passes Away"
 r56_samoa.3.desc:0 "RIP"
 r56_samoa.3.a:0 "May his soul rest in peace."
 r56_SAM_mataafa_first_dies:0 "§RMatā'afa Muliufi Dies.§!"
 
 r56_samoa_fautasi_race.1.t:0 "Fautasi Race!"
 r56_samoa_fautasi_race.1.desc:0 ""
 r56_samoa_fautasi_race.1.a:0 "And the winner is.."

 ## Aided the British War Effort
 r56_samoa.4.t:0 "[SAM.GetNameDefCap] Aids Us"
 r56_samoa.4.desc:0 "Over the last couple of days, the [SAM.GetAdjective] government has raised enough funds to be able to construct an aircraft, intended to aid us in the recent conflict we find ourselves in. Today, the aircraft has arrived in [ROOT.Capital.GetCapitalVictoryPointName], and is ready to serve the empire!"
 r56_samoa.4.a:0 "What?"

 ## Mau Elections (Not rigged)
 r56_samoa.5.t:0 "Elections!"
 r56_samoa.5.desc:0 "Following the agreed terms of the Goodwill Mission, elections have been held all across in Western Samoa over which party or organisation will lead the nation and how much seats it will occupy in the Legislative Assembly. \nAlthough, the results should be obvious by now."
 r56_samoa.5.a:0 "Sāmoa mō Sāmoa!"

 ## Malietoa Opinion on Independent Samoa
 r56_samoa.6.t:0 "Malietoa Unopposed to Our Independence"
 r56_samoa.6.desc:0 "Tanumafili I, while a faithful and loyal subject of the colonial administraation, is still an important person in the politics of Samoa, as portions of Upolu are loyal to his dynasty. With this power, he can spark an armed rebellion whenever he sees fit, which posses a threat to our struggle. \n\nAlthough, after an envoy was sent to discuss the topic of Samoan independence with his highness, Malietoa said that he has no opposition to Samoan independence. But even with his reassurances, we must keep our eyes on him at all times incase he gets any ideas."
 r56_samoa.6.a:0 "Our eyes are on you, your highness."

 ## Tuimaleali'ifano Opinion on Independent Samoa
 r56_samoa.7.t:0 "Tuimaleali'ifano Infavour of Our Independence"
 r56_samoa.7.desc:0 "Tuimaleali'ifano has been a faithful follower and member of the Mau for as long as it has existed. But betrayal from within is always a possibility, and the worst part is: You never know who will betray you. \n\nAfter an envoy arrived at the home of Tuimaleali'ifano to ask for his support, Tuimaleali'ifano laughed at the envoy and reassured them of his full support for our cause."
 r56_samoa.7.a:0 "Maybe we were being a bit too sceptical.."
 
 r56_SAM_request_american_samoa:0 "Request American Samoa"
 r56_SAM_request_american_samoa_desc:0 "[USA.GetNameDef] and Samoa have a long history with one another. The Americans have been involved in Samoan affiars ever since the 19th century and have made their presence clear by signing treaties with the chiefs in Tutila and Manu'a. Which made the islands be under American control. \nBut even if they are under American Supervision, they are still Samoan. And belong to the Samoan Nation. If we are lucky, we can break a deal with the Americans to give us back the islands."
 
