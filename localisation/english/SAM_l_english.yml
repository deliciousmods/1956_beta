 # COUP
 samoa_coup.1.t:0 "Tumua ma Pule Launch a Coup!"
 samoa_coup.1.desc:0 "The Tumua ma Pule are the highest authorities in Samoa. Defying them would not turn out great for everyone involved. \n\nWhilst we may have not have had any intentions to overthrow or limit their authority, they see us as an enemy due to our policies against the monarchy, the traditional political system of Samoa, and have launched a coup to overthrow our regime. \n\nWhich, with the support of the people, was dealt with quickly. Now with the Tumua and Pule in control of the government, who should be the new leader?"
 samoa_coup.1.a:0 "Tupua Tamasese seems like a good pick."
 samoa_coup.1.b:0 "Mata'afa Faumina is a better candidate."
 
