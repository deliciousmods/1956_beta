 #Goodwill Mission
 SAM_goodwill_mission:0 "Goodwill Mission"
 SAM_goodwill_mission_compromise:0 "Goodwill Mission"
 goodwill_compromise:0 "Compromise in the Goodwill Mission"
 goodwill_samoa_favored:0 "Samoan Demands Met"
 
 new_zealand.11.t:0 "Goodwill Mission"
 new_zealand.11.d:0 "Recently, a 'Goodwill Mission' was sent to Apia to discuss with the Mau Movement about the future of the Samoan archipelago. After many failed attempts at restoring our authority over the islands throughout the years, we have been left with no choice other than to bring ourselves into the negotiating table with the Mau. \n\nTheir demands will not be light, and there is a very high likelyhood that we will lose more than what we gain. However, if we can negotiate on the right terms, the damage might be neglectful, and we will come out in a better position than before."
 new_zealand.11.a:0 "They will not get far!"
 
 goodwill_negotiations.1.t:0 "Goodwill Mission"
 goodwill_negotiations.1.d:0 "Recently, a 'Goodwill Mission' was sent to Apia to discuss with the Mau Movement about the future of the Samoan archipelago. We have been able to seize our islands and defend them from [NZL.GetAdjective] troops ever since 1929, and this time it won't be any different! \n\nThe [NZL.GetAdjective] delegation will soon arrive in Apia to discuss with us about the future of Samoa, in which we will demand our homeland to be independent and free from foreign rule. \n\nBut even if we do seccure our independence, internal issues will still plauge the nation, and our future will remain uncertain."
 goodwill_negotiations.1.a:0 "The Union Jack will raise on Samoan soil no more!"
 
 SAM_goodwill_mission_negotiations_tracker_category:0 "Goodwill Mission: Future of Samoa"
 SAM_goodwill_mission_negotiations_tracker_category_desc:0 "The political stalemate between the [NZL.GetAdjective] government and Mau has been in place for years. But with a recent change of mind in the [NZL.GetAdjective] government, negotiations have entered the talks phase."
