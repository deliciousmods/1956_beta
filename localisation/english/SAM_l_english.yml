 r56_SAM_request_foreign_industrial_aid_desc:0 "Our current industrial capabilities are inadequate. Before we can assist our allies, we must first be able to equip our soldiers with the necessary equipment to fight in the battlefied. To achieve this, we must seek foreign industrial finance, which will help us in constructing military infrastructure and fill in the gaps for our men."

