 r56_SAM_samoa_arise_desc:0 "The fate of the nation lies within our hands. We must not fail!"
 r56_SAM_mobilizing_the_mau:0 "Mobilizing the Mau"
 r56_NZL_mau_movement_idea:0 "Mau Movement" #Idea for NZL
 r56_NZL_mau_movement_idea_desc:0 "With our failure to administer and maintain control over Western Samoa, the Mau has §YSeized Control§! and has proclaimed a §YProvisional Government§! over the islands. \n\nWith previous attempts at asserting our control ending in §RTotal Disaster§!, we are left with no choice other than to come to the §YNegotiating Table, or Leave Western Samoa to it's Own Devices.§! \n\n§RIf the political stalemate between the Mau and New Zealand isn't broken by 1937, Samoa will declare Independence!§!"
