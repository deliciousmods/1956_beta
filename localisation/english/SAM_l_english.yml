 # Begin Negotiations - NZL
 new_zealand.11.t:0 "A "Goodwill Mission" Arrives in Western Samoa"
 new_zealand.11.d:0 "Recently, a 'Mission of Goodwill' has arrived in Apia, the nation's de-facto capital to discuss with the Mau Movement about the future of the Western Samoa. After many failed attempts at restoring our authority over the islands throughout the years, we have been left with no choice other than to bring ourselves onto the negotiating table with the Mau. \n\nTheir demands will not be light, and there is a very high likelyhood that we will lose more than what we will gain. However, if we can negotiate on the right terms, the damage to our administration might be negligible, and will secure a victory in the long term."
 new_zealand.11.a:0 "Let the negotiations begin."
 
 # Begin Negotiations - SAM
 r56_goodwill_negotiations.1.t:0 "A "Goodwill Mission" Arrives in Western Samoa"
 r56_goodwill_negotiations.1.d:0 "Recently, a 'Mission of Goodwill' has arrived in Apia, our nation's de-facto capital to discuss with the Mau Movement about the future of the Western Samoa. After many years of fighting off the threat that [NZL.GetCapitalVictoryPointName] possed to us, they have put down their arms and have opened the room for negotiations between our two nations. \n\nToday, the [NZL.GetAdjective] delegation sets foot in Apia, and negotiations regarding our autonomy will begin shortly after."
 r56_goodwill_negotiations.1.a:0 "Let the negotiations begin."

 # Question of Fono - SAM
 r56_goodwill_negotiations.2.t:0 "The Question of the Fono"
 r56_goodwill_negotiations.2.d:0 ""
 r56_goodwill_negotiations.2.a:0 "We shall send our request and hope for the best."
 
 # Question of Fono - NZL
 r56_goodwill_negotiations.3.t:0 "Mau Demands Free Elections"
 r56_goodwill_negotiations.3.d:0 "The first set of demands have arrived. \nThe Fono is the traditional parliament of the Samoan government, where chiefs gather to discuss important political matters. Under the governance of the Conservative government a few years prior, the Fono's power was limited and the real power was in the hand's of the administrator. \n\nThe Mau wishes to change this. To give power back to the traditional parliament and to establish elections where the people can vote their representatives in the Fono."
 r56_goodwill_negotiations.3.a:0 "These demands seem reasonable."
 r56_goodwill_negotiations.3.b:0 "Giving this much power to the Mau is a foolish move."
 
 # NZL Accepts Fono
 r56_goodwill_negotiations.4.t:0 "[NZL.getNameDefCap] Accepts our Demands"
 r56_goodwill_negotiations.4.d:0 ""
 r56_goodwill_negotiations.4.a:0 "One step closer to independence!"
 
 # NZL Rejects Fono
 r56_goodwill_negotiations.5.t:0 "[NZL.getNameDefCap] Rejects our Demands"
 r56_goodwill_negotiations.5.d:0 ""
 r56_goodwill_negotiations.5.a:0 "If our demands fall on deaf ears, then whats the point?"
 
 #Question of Independence - SAM
 r56_goodwill_negotiations.6.t:0 "Question of independence"
 r56_goodwill_negotiations.6.d:0 ""
 r56_goodwill_negotiations.6.a:0 "A dream realised...?"
 
 #Question of Independence - NZL
 r56_goodwill_negotiations.7.t:0 "Samoa Brings up the Question of Independence"
 r56_goodwill_negotiations.7.d:0 ""
 r56_goodwill_negotiations.7.a:0 "Lets settle on a compromise."
 r56_goodwill_negotiations.7.b:0 "Maybe a dream will be realised."
 r56_goodwill_negotiations.7.c:0 "They come to the negotiation table just to try and humiliate us?"
 
 #NZL Accepts Protectorate
 r56_goodwill_negotiations.8.t:0 "[NZL.getNameDefCap] Recognizes the Mau"
 r56_goodwill_negotiations.8.d:0 ""
 r56_goodwill_negotiations.8.a:0 "Its the best we can get."
 
 #NZL Accepts Independence
 r56_goodwill_negotiations.9.t:0 "[NZL.getNameDefCap] Accepts Full Independence"
 r56_goodwill_negotiations.9.d:0 ""
 r56_goodwill_negotiations.9.a:0 "Independence at last!"
 
