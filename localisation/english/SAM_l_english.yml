 #Illegal Smuggling
 r56_SAM_smuggle_operations:0 "Smuggling Operations"
 r56_SAM_smuggle_operations_desc:0 "Currently, Samoa lacks the industrial capacity to produce its own weapons. To compensate for this, we should attempt to acquire arms through smuggling operations from the east, where the American garrison may leave some of their equipment unguarded and vulnerable to retrieval. By securing these supplies, we can strengthen our forces in the short term." #\n\nHowever, once we have developed a domestic arms industry capable of producing our own equipment, we can cease these operations into §R[1088.GetName]§! and focus on self-sufficiency. <--- Cut this due to it making category look weird. thank you simpy for the description! (and other nerd grammer stuff...)
 r56_SAM_smuggle_operation_decision:0 "Launch a Smuggling Operation"
 
 r56_SAM_launch_operation_into_pago_pago:0 "We will launch a smuggling operation into [1088.GetName] and see if we can collect any equipment laying unguarded."
 r56_samoa_smuggle_stuffs.success:0 "Smuggle Operation: Success!"
 r56_samoa_smuggle_stuffs.failed:0 "Smuggle Operation: Failure!"
 
 r56_samoa_smuggle_stuffs.1.t:0 "Operational Success!"
 r56_samoa_smuggle_stuffs.1.desc:0 "Our recent operation to smuggle weapons from [1088.GetName] was a success! \nEven if we may not be able to conduct large scale smuggling operations, and not retrieve as much weapons as we would have hoped, operations conducted on a smaller scale will work just as fine and will give us the proper amount of equipment for the time being. even if it isn't a lot."
 r56_samoa_smuggle_stuffs.6.t:0 "Operational Failure!"
 r56_samoa_smuggle_stuffs.6.desc:0 "Even with our efforts, we have failed to capture any equipment and we our crew was arrested on the spot."
 r56_samoa_smuggle_stuffs.6.a:0 "Go home it is.."
 
