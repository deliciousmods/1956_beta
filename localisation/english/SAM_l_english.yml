 #GM Decisions
 r56_SAM_time_until_goodwill:0 "Sending a Delegation to Western Samoa"
 r56_SAM_time_until_goodwill_desc:0 "We are running short on time, and our other methods of subduing the Mau have proven to be inadequate. We should consider sending a delegation to [726.GetName] and potentially begin negotiations with the Mau, where the future of Western Samoa can be discussed and decided upon peacefully."

 r56_SAM_time_until_goodwill_final_straw:0 "Samoan Declaration of Independence"
 r56_SAM_time_until_goodwill_final_straw_desc:0 "We are now really running short on time. We need to send a delegation at this very moment if we want to keep Western Samoa under our rule."

 SAM_samoa_will_be_buffed_in_negotiations:0 "§RThe Mau is more likely to be favored during negotiations.§!"
 
