 samoa_focus:0 "[ROOT.GetAdjective] National Focus"
 
 ## IDEAS
 SAM_collapsed_colonial_authority:0 "Collapsed Colonial Authority"
 SAM_collapsed_colonial_authority_desc:0 "After the Black Saturday incident in 1929, the colonial government has practically collapsed and has lost control over most, if not all, of Samoa. \nThis has left the Mau, a nationalist and pro-independence organization aiming for the restoration of Samoan independence, taking over the entire colony. if we do not act fast, or negotiate with the Mau, then we may risk losing Samoa as a whole."

 SAM_samoan_army:0 "Army of Samoa"
 SAM_samoan_army_desc:0 "The Samoan nation can proud itself in the fact that it has been able to maintain its country's independence for over 3,000 years, and for being a particulary hard foe to defeat, having secured major victories over the lights of the United States and the United Kingdom. \n\nBut Samoa's army doesn't function like other nations do. Infact, the country's army is rather decentralised, with each village having its own armed forces, making Samoa's army more or less a collection of units spread out across the country serving their local chief and village. But recently, changes have been seen. \n\nWith the conflict with [NZL.GetNameDef] escalating to one of direct confrontation, the Mau has formed its own battalions which serve not a local village, but the organization. Something never seen before in the nation. These are known as the 'Mau Men' who often wage guerrilla warfare, and serve more as militias than actual divisions. \n\nBut times are changing. With technological advances in multiple sectors of warfare, and our lack of knowledge regarding these new advancements, our military risks becoming a fragile and ineffective force."

 SAM_palauli_rebelion:0 "Palauli Unrest"
 SAM_palauli_rebelion_desc:0 "The district of Palauli has been in open revolt for more than a decade by now, rejecting [NZL.GetAdjective] authorities and police from entering the district. \n\nOut of all of the districts and villages in Samoa, Palauli is one that will fight till the very end to achieve one thing: Samoan independence."

 SAM_unorganized_government_in_times_of_crisis:0 "Unorganized Government"

 SAM_a_divided_samoa:0 "A Divided Samoa"
 SAM_a_divided_samoa_desc:0 "In 1899 Samoa was partitioned by the German Empire and United States of America, which saw Sava'i and Upolu fall under German Colonial Administration, whilst Tutuila and the sacred Manu'a Islands fell under American administration. \nEver since then, the islands have been divided by national boundaries."
 SAM_divided_samoa_tt:0 "To §RRemove§! this national spirit, we must own both §YEastern§! and §YWestern§! Samoa."

 SAM_tumua_and_pule:0 "Tumua ma Pule"
 SAM_tumua_and_pule_desc:0 "The Tumua ma Pule are essential to electing a king and have been the core of Samoa's politics for as long as Samoa has been a monarchy. It is better to appease them rather than to challenge them."

 SAM_cacao_industry:0 "Cash Crops"
 SAM_cacao_industry_desc:0 "Samoa's main export largely consists of Cacao and Copra. Whilst Samoa proves to be the perfect place for growing such things, many, if not all plantations are foreign-owned, mostly by wealthy European capitalists... Nationalizing the plantations may also lead to some trouble with the people who own said plantations, and may prove more disastrous than profitable."

 SAM_cacao_industry_ii:0 "Cash Crops"
 SAM_cacao_industry_ii_desc:0 "Samoa's main export largely consists of Cacao and Copra. Whilst Samoa proves to be the perfect place for growing such things, many, if not all plantations are foreign-owned, mostly by wealthy European capitalists... Nationalizing the plantations may also lead to some trouble with the people who own said plantations, and may prove more disastrous than profitable."
 
