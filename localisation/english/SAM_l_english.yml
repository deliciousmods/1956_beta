 NZL_mau_movement_idea:0 "Mau Movement" #Idea for NZL
 NZL_mau_movement_idea_desc:0 "With our failure to administer and maintain control over the Samoan islands, the Mau has §YSeized Control§! and has §YProclaimed a Provisional Government§!. \n\nWith previous attempts at asserting our control ending in §RTotal Disaster§!, we are left with no choice other than to come to the §YNegotiating Table, or Leave Samoa to it's Own.§! \n\n§RIf the political stalemate between the Mau and New Zealand isn't broken, Samoa will declare Independence!§!"
