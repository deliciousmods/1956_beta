 SAM_goodwill_mission_negotiations_tracker_category:0 "Goodwill Mission: Future of Samoa"
 SAM_goodwill_mission_negotiations_tracker_category_desc:0 "--------------------------------------------------------------------------------------------\n§YThe nation with the most amount of influence in the negotiations will be favoured, and if both sides have an equal amount of influence, a compromise will be reached. \nCurrent influence of each side:§! \n-------------------------------------------------------------------------------------------- \nAfter years of political stalemate between the New Zealand government and the Mau, the two sides have begun negotiations regarding over the future of the Samoan archipelago. \n\nIf the negotiations §Gfavor§! the Mau, a path to independence will lie ahead of Samoa and its people, and Samoa will be more likely to follow the political ideology of New Zealand. \n\nAlthough, on the ohter end, if negotiations turn out favoring New Zealand, there is a §Rhigh likelyhood of conflict breaking out§! between the two nations. \n\nOur best hope is to achieve a compromise and to uphold peace. Even if it may not be entirely to our advantage."
 SAM_mission_duration:0 "Negotiations Duration"
 
