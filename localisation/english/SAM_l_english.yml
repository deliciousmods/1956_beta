 ## EVENTS
 
 ## Tuimalealiʻifano Dies
 r56_samoa.1.t:0 "Tuimaleali'ifano Passes Away"
 r56_samoa.1.desc:0 "One of the leaders of the Mau Movement, Tuimaleali'ifano Fa'aoloi'i Si'ua'ana I, has recently passed away at the age of 82. His contributation to our struggle was immense and honorable. May he rest in peace."
 r56_samoa.1.a:0 "Rest in peace."
 
 ## Olaf Frederick Nelson Returns
 r56_samoa.2.t:0 "O.F Nelson Returns From Exile"
 r56_samoa.2.desc:0 "Olaf Frederick Nelson, the face of the Mau internationally, has recently stepped foot back onto Apia after his exile was revoked by the colonial authorities. Thousands arrived to the shore side to welcome him."
 r56_samoa.2.a:0 "Welcome back!"
 
 ## Question of New Zealand
 r56_samoa.3.t:0 "Settling the Aotearoa Question"
 r56_samoa.3.desc:0 ""
 r56_samoa.3.a:0 "An alliance with the New Zealand Legion?"
 r56_samoa.3.b:0 "Avenge Black Saturday!"
 r56_samoa.3.c:0 "Partition [NZL.GetNonIdeologyName] with [AUS.GetNonIdeologyName]"

 ## Aided the British War Effort
 r56_samoa.4.t:0 "[SAM.GetNameDefCap] Aids Us"
 r56_samoa.4.desc:0 "Over the last couple of days, the [SAM.GetAdjective] government has raised enough funds to be able to construct an aircraft, intended to aid us in the recent conflict we find ourselves in. Today, the aircraft has arrived in [ROOT.Capital.GetCapitalVictoryPointName], and is ready to serve the empire!"
 r56_samoa.4.a:0 "What?"

 ## Mau Elections (Not rigged)
 r56_samoa.5.t:0 "Elections!"
 r56_samoa.5.desc:0 "Following the agreed terms of the Goodwill Mission, elections have been held all across in Western Samoa over which party or organisation will lead the nation and how much seats it will occupy in the Legislative Assembly. \nThe results have came in today, and unsurprisingly, the Mau won most of the seats in the Legislative Assembly, and will continue its administration of [726.GetName]."
 r56_samoa.5.a:0 "Sāmoa mō Sāmoa!"

 ## Malietoa Opinion on Independent Samoa
 r56_samoa.6.t:0 "[GetMalietoaTitleHolder] Unopposed to Our Independence"
 r56_samoa.6.desc:0 "[GetMalietoaTitleHolder], while a faithful and loyal subject of the colonial administraation, is still an important figure in the politics of Samoa, as portions of Upolu are loyal to him. With this power, he can spark an armed rebellion against our regime if he wishes, which posses a threat to our movement's legitimacy. \n\nAlthough, after an envoy was sent to discuss the topic of Samoan independence with his highness, [GetMalietoaTitleHolder] said that he has no opposition to Samoan independence. But even with his reassurances, we must keep our eyes on him at all times incase he gets any ideas."
 r56_samoa.6.a:0 "Our eyes are on you, your highness."

 r56_SAM_malietoa_unopposed_to_independence:0 "§YMalietoa§! is unopposed to our independence."

 ## Tuimaleali'ifano Opinion on Independent Samoa
 r56_samoa.7.t:0 "Tuimaleali'ifano Infavour of Our Independence"
 r56_samoa.7.desc:0 "Tuimaleali'ifano has been a faithful follower and member of the Mau for as long as it has existed as an organisation. But betrayal from within is always a plausibility, and the worst part is: You never know who will betray you. \n\nAfter an envoy arrived at the home of Tuimaleali'ifano to ask for his support, Tuimaleali'ifano laughed at the envoy and reassured them of his full support for our cause."
 r56_samoa.7.a:0 "Maybe we were being a bit too sceptical.."

 r56_SAM_tuimalealiifano_recognises_our_independence:0 "§YTuimaleali'ifano§! supports our independence."

 r56_samoa.9.t:0 "Fate of the Malietoa Dynasty?"
 r56_samoa.9.desc:0 "The Malietoa Dynasty and their illegitimate government, that is sponsored by the government of [NZL.GetNameDef], has presisted to be a thorn in our side. We must decide on how to approach the issue, by either dismantling the government by force, or seek reapproachment with [GetMalietoaTitleHolder]."
 r56_samoa.9.a:0 "Traitors have no place in our nation!"
 r56_samoa.9.b:0 "Co-existence isn't that hard, is it?"
 r56_SAM_unlock_malietoa_bad_decisions_tt:0 "Unlocks §YDecisions§! in which we will §OCombat the Remnants§! of the §YMalietoa's Provisional Government§! and bring an §REnd§! to their government."
 r56_SAM_unlock_malietoa_good_decisions_tt:0 "Unlocks §YDecisions§! in which we will be able to seek §GRapprochement§! with §YMalietoa's Provisional Government§!."

 r56_samoa.10.t:0 "[FROM.GetNameDefCap] Demands Withdrawal From [1088.GetName]"
 r56_samoa.10.desc:0 "Recently, our consul in [FROM.Capital.GetCapitalVictoryPointName] has received a letter by the [FROM.GetAdjective] government, in which [FROM.GetLeader] demands a total withdrawal of our forces from [1088.GetName] and the transfer of the islands to [FROM.GetNonIdeologyName]. \n\nWhilst this deal may seem ridiculous at first glance, the [FROM.GetAdjective] government has made it clear that it will stop at nothing to retake this piece of territory, and have threatened to involve [JAP.GetNameDef] if they do not get what they want."
 r56_samoa.10.a:0 "Empty threats!"
 r56_samoa.10.b:0 "We should not escalate the matter."

 r56_samoa.11.t:0 "[FROM.GetNameDefCap] Has Rejected Our Demands"
 r56_samoa.11.desc:0 "Our expectations were not met. The [FROM.GetAdjective]s have made it clear that they will not withdraw from the islands, even with our threats of military action. This leaves us with two options. \n\nEither to:"
 r56_samoa.11.a:0 "Abandon our pursuit of the islands..."
 r56_samoa.11.b:0 "... Or arm the east."

 r56_samoa.12.t:0 "[FROM.GetNameDefCap] Transfers [1088.GetName]"
 r56_samoa.12.desc:0 "Following our ultimatium to the [FROM.GetAdjective] government demanding the transfer of [1088.GetName] to our nation, the [FROM.GetAdjective] consul in [ROOT.Capital.GetCapitalVictoryPointName] has announced that [FROM.GetLeader] has given up the islands to our nation."
 r56_samoa.12.a:0 "Wise of them."

 r56_samoa.13.t:0 "Our Territorial Ambitions"
 r56_samoa.13.desc:0 ""
 r56_samoa.13.a:0 "Are we any better than our colonizers if we pursue expansionism?"
 r56_samoa.13.b:0 "Claim the former tributaries, Manu'a will rule all!"
 r56_samoa.13.c:0 "We shall be the unifiers of the Pacific people's!"

 r56_samoa.14.t:0 "[FROM.GetNameDef] Requests Military Aid"
 r56_samoa.14.desc:0 "As war ravages the Samoan islands, the Mau has decided to reach out to our government and request that we supply them with military aid amidst their war of independence. Many in the government think this will pay off in the long run, as we could potentially secure a strategically important military base in the South Pacific from which we can strike the European empires."
 r56_samoa.14.a:0 "For a free Asia-Pacific!"
 r56_samoa.14.b:0 "We don't owe them anything."
 r56_SAM_seek_help_from_japan_decision:0 "Seek Aid from [JAP.GetNameDef]"

 r56_samoa.15.t:0 "[FROM.GetNameDef] Sends Weapons"
 r56_samoa.15.desc:0 "Our petition for military aid from [FROM.GetNonIdeologyName] has been accepted by their government."
 r56_samoa.15.a:0 "Great."

 r56_samoa.16.t:0 "[FROM.GetNameDef] Refuses to Aid us"
 r56_samoa.16.desc:0 "Our petition for military aid from [FROM.GetNonIdeologyName] has been rejected by their government, leaving us without their much needed support."
 r56_samoa.16.a:0 "We tried."

 r56_samoa.17.t:0 "[FROM.GetNameDefCap] Requests Our Pacific Holdings"
 r56_samoa.17.desc:0 ""
 r56_samoa.17.a:0 "Lets reward them for their participation."
 r56_samoa.17.b:0 "Who do they think they are?"

 r56_samoa.18.t:0 "[FROM.GetNameDefCap] Grants us Our Claims"
 r56_samoa.18.desc:0 ""
 r56_samoa.18.a:0 "Good!"

 r56_samoa.19.t:0 "[FROM.GetNameDefCap] Refuses to Return Lands"
 r56_samoa.19.desc:0 ""
 r56_samoa.19.a:0 "Darn it."

 r56_samoa.20.t:0 "[FROM.GetNameDef] Seeks Our Recognition"
 r56_samoa.20_desc:0 "After their successful war of independence against [NZL.GetNameDef], the Mau now seeks international recognition as a legitimate political entity."
 r56_samoa.20.a:0 "Sure."
 r56_samoa.20.b:0 "Who?"
 
 r56_samoa.21.t:0 "[FROM.GetNameDefCap] Offers Rubber Trade"
 r56_samoa.21.desc:0 ""
 r56_samoa.21.a:0 "Why not?"
 r56_samoa.21.b:0 "The [JAP.GetAdjective] may be interested instead."
 SAM_offmap_civ_bcuz_germany_wants_rubber_r56:0 "Offmap Civilian Factory for 720 Days"
 SAM_offmap_civ_tt_negative:0 "Removes §R1§! offmap §YCivilian Factory§!"
 SAM_offmap_civ_tt:0 "Add §G1§! offmap §YCivilian Factory§! for §Y720 Days§!"

 r56_samoa.22.t:0 "[FROM.GetNameDefCap] Accepts Rubber Deal"
 r56_samoa.22.desc:0 ""
 r56_samoa.22.a:0 "Good."

 r56_samoa.23.t:0 "[FROM.GetNameDefCap] Rejects Rubber Deal"
 r56_samoa.23.desc:0 ""
 r56_samoa.23.a:0 "Their loss."

 r56_samoa.24.t:0 "[FROM.GetNameDefCap] Revokes Rubber Deal"
 r56_samoa.24.desc:0 ""
 r56_samoa.24.a:0 "Backstabbers!"

 r56_samoa.25.t:0 "[FROM.GetNameDefCap] Requests Naval Vessels"
 r56_samoa.25.desc:0 ""
 r56_samoa.25.a:0 "Sure."
 r56_samoa.25.b:0 "Absolutely not."
 SAM_we_will_transfer_the_following:0 "We will transfer the following ships: §YYubari§!, §YKuretake§!, §YWakatake§!, §YNadakaze§! and §YRo-29§! to §Y[FROM.GetNameDef]§!."
 SAM_allowed_to_use_japanese_companies:0 "[JAP.GetNameDefCap] has transferred us naval vessels."

 r56_samoa.26.t:0 "[FROM.GetNameDefCap] Transfers Naval Vessels"
 r56_samoa.26.desc:0 ""
 r56_samoa.26.a:0 ""

 r56_samoa.27.t:0 "[FROM.GetNameDefCap] Refuses to Transfer Naval Vessels"
 r56_samoa.27.desc:0 ""
 r56_samoa.27.a:0 ""

 r56_samoa.28.t:0 "[FROM.GetNameDefCap] Requests Weapons Shipments"
 r56_samoa.28.desc:0 ""

 r56_samoa.29.t:0 "[FROM.GetNameDefCap] Suggests Defense Pact"
 r56_samoa.29.desc:0 "Despite our complex history, [FROM.GetNameDef] has decided to welcome the new government in power and hopes to restore goodwill and good faith between our two nations, beginning with a mutual assistance pact that will ensure the independence of both our nations is secured from foreign powers."
 r56_samoa.29.a:0 "A sound idea."
 r56_samoa.29.b:0 "Absurd!"

 r56_samoa.30.t.a:0 "[FROM.GetNameDefCap] Formalizes Defense Pact"
 r56_samoa.30.t.r:0 "[FROM.GetNameDefCap] Rejects Closer Cooperation"
 r56_samoa.30.desc.a:0 "Despite our differences, the [FROM.GetAdjective] government has decided to accept our proposal in a gesture of goodwill and formalise an alliance between our two states. Some within the [FROM.GetAdjective] government have even suggested that we jointly seek closer ties with a major power, such as [JAP.GetNameDef], and have in addition expressed their willingness to negotiate our entry into their alliance."
 r56_samoa.30.desc.r:0 "Despite our willingness to cooperate with the [FROM.GetAdjective]s, they have yet to let go of their grudges over the 1920s and the events that transpired between our two nations during that time period. [FROM.GetLeader] has called our proposal "Outlandish" and "Foolish" citing how we are only trying to save our own heads, alongside other hostile remarks."
 r56_samoa.30.a:0 "Lovely."
 r56_samoa.30.b:0 "Could have just said no."
 r56_SAM_invite_new_zealand_to_faction:0 "Suggest [NZL.GetAdjective] Entry Into Our Alliance"
 r56_SAM_invite_samoa_to_faction:0 "Suggest [SAM.GetAdjective] Entry Into Our Alliance"
 r56_SAM_revoke_defense_pact_with_nzl:0 "Revoke the Defense Pact"
 r56_SAM_revoke_defense_pact_with_nzl_desc:0 "The defense pact between [SAM.GetNonIdeologyName] and [NZL.GetNonIdeologyName] has served it's purpose. It has reached it's end and serves no purpose. It only makes sense we nullify our agreement now."

 r56_samoa.31.t:0 "[FROM.GetNameDefCap] Suggests [NZL.GetAdjective] Entry Into Our Alliance"
 r56_samoa.31.desc:0 "After strengthening diplomatic ties and increased cooperation between [FROM.GetNameDef] and [NZL.GetNameDef], the [FROM.GetAdjective] embassy in [ROOT.Capital.GetCapitalVictoryPointName] has requested [ROOT.GetLeader] to invite [NZL.GetNameDef] into our alliance."
 r56_samoa.31.a:0 "If they insist."
 r56_samoa.31.b:0 "What made them think they have a say in this?"

 r56_samoa.32.t:0 "[FROM.GetNameDefCap] Rejects [NZL.GetAdjective] Entry Into Our Alliance"
 r56_samoa.32.desc:0 "Despite our best efforts, [FROM.GetLeader] has made it clear that [NZL.GetNameDef] will not be entering into our alliance any time soon, regardless of our current relationship with them."

 r56_samoa.33.t:0 "[FROM.GetNameDefCap] Suggests Partitioning [NZL.GetNonIdeologyName]"
 r56_samoa.33.desc:0 ""
 r56_samoa.33.a:0 "A pleasant idea."
 r56_samoa.33.b:0 "Are they crazy?!"
 r56_SAM_peace_out_nzl_partition:0 "Propose Peace to §Y[FROM.GetNameDef]§!"
 r56_SAM_if_we_control_other_pacific_islands_then_we_get_them:0 "If we control the rest of the §Y[ENG.GetAdjective] Possesions§! in the §OPacific§!, notably §Y[734.GetName]§!, §![636.GetName]§!, and the §![634.GetName]§!, then we will partition them as well."
 SAM_must_control_all_highlighted_states_to_peace_nzl:0 "We must control all of the §OHiglighted States§! (§Y[1136.GetName]§!, §Y[284.GetName]§!, §Y[1139.GetName]§!, §Y[723.GetName]§!, §Y[1140.GetName]§!, §Y[1087.GetName]§!, §Y[1089.GetName]§!)."

 r56_samoa.34.t:0 "[FROM.GetNameDefCap] Suggests Mediation"
 r56_samoa.34.desc:0 ""
 r56_samoa.34.a:0 "Screw them."
 
 r56_samoa.35.t:0 "[FROM.GetNameDefCap] Mobilizes their Armed Forces"
 r56_samoa.35.desc:0 ""
 r56_samoa.35.a:0 "Lovely."

 r56_samoa.36.t:0 "[FROM.GetNameDefCap] Proposes Peace Terms"
 r56_samoa.36.desc:0 ""
 r56_samoa.36.a:0 "We put up a good fight."
 r56_samoa.36.b:0 "We will not abandon our allies!"

 r56_samoa_manua.1.t:0 "Faletolu Gathers Once More"
 r56_samoa_manua.1.desc:0 ""
 r56_samoa_manua.1.a:0 "But a dark cloud still looms.."

 r56_samoa_manua.2.t:0 "Tufele Revolts!"
 r56_samoa_manua.2.desc:0 ""
 r56_samoa_manua.2.a:0 "This will not go unpunished!"
 r56_tufele_revolt_tt:0 "The §YTufele Revolt§! begins."

 r56_samoa_manua.3.t:0 "[FROM.GetNameDefCap] Requests Diplomatic Support"
 r56_samoa_manua.3.desc:0 "Not long ago the [FROM.GetAdjective] ambassador in [ROOT.Capital.GetCapitalVictoryPointName] has issued a plea to [ROOT.GetLeader], requesting their diplomatic support in [FROM.GetNameDef]'s demand on acquiring [1088.GetName] from [USA.GetNameDef]. This move has caused some tension in the [ROOT.GetAdjective] Diet, with many voicing their concerns over a potential escalation over the matter."
 r56_samoa_manua.3.a:0 "Anything to weaken our enemies!"
 r56_samoa_manua.3.b:0 "They are playing with fire."

 r56_samoa_manua.4.t:0 "Diplomatic Support From [FROM.GetNonIdeologyName] Secured"
 r56_samoa_manua.4.desc:0 "This evening, the [FROM.GetAdjective] ambassador in [ROOT.Capital.GetCapitalVictoryPointName] has informed us that [FROM.GetNameDef] is willing to support our claims on [108.GetName]."
 r56_samoa_manua.4.a:0 "Great!"

 r56_samoa_manua.5.t:0 "[FROM.GetNameDefCap] Denies Support"
 r56_samoa_manua.5.desc:0 "After our plea for diplomatic support from [FROM.GetLeader], we have received unfortunate news that [FROM.GetNameDef] will not provide us with diplomatic support against [USA.GetNameDef]."
 r56_samoa_manua.5.a:0 "What a shame."

