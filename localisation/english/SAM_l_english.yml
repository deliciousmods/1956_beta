 SAM_mau_council:0 "Mau Movement"
 SAM_mau_council_leader_desc:0 "After the Black Saturday incident of 1929, which saw Samoan blood being spilled by the colonial police, the League of Samoa, or referred to more often to by it's Samoan name, the §YMau§!, launched a series of violent attacks and boycotts on the colonial administration of New Zealand. Which, overtime has led to the Mau seizing de-facto administrative power over the islands. But at the cost of widespread anarchy and disorganization. \n\nThe movement is based in Lepea, not far from the nation's capital of Apia. The Mau has not been able to establish a united government or coalition to properly govern the country, which has led to widespread disorganization, chaos, and factionalism amongst the nation's citizens. But even with the odds being against the Mau, they have been able to hold their ground and keep Samoa free of imperialism and colonial exploitation. \n\nAlthough, times are changing. A new government in Wellington has shown interest in cooperating with the Mau to restore order in the islands, which leaves the entire movement with two options: \n\nNegoitate, and be able to establish peace between it and it's colonial overlord. Or continue the fight, and risk fighting for a hopeless cause."

