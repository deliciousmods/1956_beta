 r56_SAM_raise_the_war_fleet_of_manono:0 "Raise the War Fleet of Manono"
 r56_SAM_raise_the_war_fleet_of_manono_desc:0 "The district of Manono has a long history with naval combat, having been mostly undefeated all the way up to the partition of Samoa. If we are to utilize their experience in naval combat, Samoa may have it's own fair share of naval victories which it can pride itself with."

 #Army
 r56_SAM_no_army:0 "End the Fighting"
 r56_SAM_no_army_desc:0 "With the world being ever so closer to erupting into a second Great War, it may seem like a no-brainer to raise an army to defend our nation. But after what has transpired in the recent years in Samoa, our boys deserve a break form the horrors of war."

 r56_SAM_adopt_new_uniform:0 "Adopt New Uniforms"
 r56_SAM_adopt_new_uniform_desc:0 "Whilst traditional, our uniforms are becoming ever so outdated with the rapidly changing times. By making a combination of some sorts between a police uniform and our traditional clothing, we can maybe find a middle ground which will let us keep up with the times while also letting us keep our traditions alive."

 r56_SAM_promote_apia_defence_club:0 "Promote the Apia Defence Rifle Club"
 r56_SAM_promote_apia_defence_club_desc:0 "Initially established by Arthur Braisby to combat the Mau, the Apia Defence Rifle Club can be repurposed into a shooting club where our citizens can learn how to defend themselves against foreign threats. Although, Braisby might not be so keen on the idea."

 r56_SAM_bolster_the_police:0 "Bolster the Police Force"
 r56_SAM_bolster_the_police_desc:0 "Law and Order needs to be maintained by a police force which is able to enforce order in our country. Let us redirect the military funds to them in hopes of keeping the peace and stability of our nation."

 r56_SAM_no_army_no_nation:0 "No Army, No Nation"
 r56_SAM_no_army_no_nation_desc:0 "History has shown that nations without an army to protect themselves are bound to be swollen up by bigger nations. We have made that mistake once, and shall never do so again!"

 r56_SAM_establish_military_headquarters:0 "Establish Military Headquarters in [ROOT.Capital.GetCapitalVictoryPointName]"
 r56_SAM_establish_military_headquarters_desc:0 "By establishing a base of operations where we can coordinate with our fellow military strategists, we allow ourselves to prepare faster in case of any enemy attempts at landing on our shores."

 r56_SAM_found_a_military_academy:0 "Found a Military Academy"
 r56_SAM_found_a_military_academy_desc:0 ""

 r56_SAM_study_our_past_victories:0 "Study Our Past Victories"
 r56_SAM_study_our_past_victories_desc:0 "By examining what has led us to acheive so many victories in the past, we could gain insight on what we can adopt and improvise in the present to achieve victory in future confrontations."

 r56_SAM_improve_our_doctrine:0 "Improve Our Doctrine"
 r56_SAM_improve_our_doctrine_desc:0 ""

 r56_SAM_found_the_samoan_red_cross_society:0 "Found the Samoan Red Cross Society"
 r56_SAM_found_the_samoan_red_cross_society_desc:0 "Healthcare is an ongoing issue in our country. By inviting the Red Cross Society into our country, we can help improve the health of our citizens and give the necessary treatment to those who require it."

 r56_SAM_smuggle_weapons_from_as_focus:0 "Smuggle Weapons From [1088.GetName]"
 r56_SAM_smuggle_weapons_from_as_focus_desc:0 "Currently, Samoa lacks the industrial capacity to produce its own weapons. To compensate for this, we should attempt to acquire arms through smuggling operations from the east, where the American garrison may leave some of their equipment unguarded and vulnerable to retrieval. By securing these supplies, we can strengthen our forces in the short term."

 r56_SAM_mobilize_our_forces:0 "Mobilize Our Forces"
 r56_SAM_mobilize_our_forces_desc:0 "More and more conflicts around the world are arising, and we are a potential target of these conflicts. Let us mobilize our forces incase war reaches our shores."

 r56_SAM_fortify_the_shores:0 "Fortify the Shores"
 r56_SAM_fortify_the_shores_desc:0 "By building fortifications along our coastline, we decentivize the enemy from trying to invade us, while also giving us the upper hand in terms of defence."

 r56_SAM_establish_workshops:0 "Establish Workshops"
 r56_SAM_establish_workshops_desc:0 "Currently, we lack a permanent and stable income of weapons to supply our armed forces. If we encourage our population to establish workshops and produce a steady amount of weapons, then we could potentially solve this ongoing issue."

 r56_SAM_mass_produce_equipment:0 "Mass Produce Equipment"
 r56_SAM_mass_produce_equipment_desc:0 "History has shown that numbers are the main source of victory in battles. By producing a larger quantity of guns, we can arm more of our population and help reinforce our divisions better."

 r56_SAM_protect_the_skies:0 "Protect the Skies"
 r56_SAM_protect_the_skies_desc:0 "With the lack of an air force to protect us in the air, we are left vulnerable to attacks from above. If we can divert some of our funds to constructing anti-air systems, we may be able to minimalize the impact that the enemy can deal with their planes."

 r56_SAM_support_the_british_war_effort:0 "Support the British War Effort"
 r56_SAM_support_the_british_war_effort_desc:0 "Britain needs all of the help it can get. With most of our neighbours collecting funds to purchase a variety amount of equipment to arm the British army, we should do the same, and aid the Empire in it's war!"

 r56_SAM_enact_total_war:0 "Enact Total War"
 r56_SAM_enact_total_war_desc:0 ""

 r56_SAM_united_and_ready:0 "Samoa, United and Ready"
 r56_SAM_united_and_ready_desc:0 "We have prepared ourselves for this moment. We will come out victorious!"

 r56_SAM_form_the_self_defense_division:0 "Form the Self Defense Division"
 r56_SAM_form_the_self_defense_division_desc:0 "The English population in Samoa is willing to take up arms and defend the nation. We should let them form their own defence unit and protect our shores from any potential invasions."

 #Economy
 r56_SAM_enact_the_aliesa_scheme:0 "Enact the Aliesa Scheme"
 r56_SAM_enact_the_aliesa_scheme_desc:0 "Much of our 'Afakasi (Mixed European-Samoans) are currently out of a job due to the economic burden imposed on them by the recent world-wide economic crash. The Aliesa Scheme proposes to lease small amount of land to these unemployed 'Afakasi's, where with financial assistance, will hopefully incentivise them to establish their homes and plantations on the land."

