 r56_SAM_new_zealand_reminder_to_do_goodwill:0 "Sending a Delegation to Western Samoa"
 r56_SAM_new_zealand_reminder_to_do_goodwill_desc:0 "We are running short on time, and our other methods of subduing the Mau have proven to be inadequate. We should consider sending a delegation to [726.GetName] and potentially begin negotiations with the Mau, where the future of Samoa can be discussed and decided upon peacefully."

