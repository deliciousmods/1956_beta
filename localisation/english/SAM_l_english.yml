 #Begin Negotiations - NZL
 new_zealand.11.t:0 "A Goodwill Mission Arrives in Samoa"
 new_zealand.11.d:0 "Recently, a 'Goodwill Mission' was sent to Apia to discuss with the Mau Movement about the future of the Samoan archipelago. After many failed attempts at restoring our authority over the islands throughout the years, we have been left with no choice other than to bring ourselves into the negotiating table with the Mau. \n\nTheir demands will not be light, and there is a very high likelyhood that we will lose more than what we gain. However, if we can negotiate on the right terms, the damage might be neglectful, and we will come out in a better position than before."
 new_zealand.11.a:0 "They will not get far!"
 
 #Begin Negotiations - SAM
 r56_goodwill_negotiations.1.t:0 "A Goodwill Mission Arrives in Western Samoa"
 r56_goodwill_negotiations.1.d:0 "Recently, a 'Goodwill Mission' was sent to Apia to discuss with the Mau Movement about the future of the Samoan archipelago. We have been able to hold on our own ever since the events of 1929 and evade capitulation by [NZL.GetNameDef], and we will continue to remain independent from Wellington's thumb! \n\nThe [NZL.GetAdjective] delegation will soon arrive in Apia to discuss with us about the future of Samoa, in which we will present the delegation with our demands, amongst other things. \n\nAlthough, continuing to remain independent has its downsides, as the nation is still in anarchy and with no formal govenring entity, it might plunge Samoa into a civil war. Or worse."
 r56_goodwill_negotiations.1.a:0 "The Union Jack will rise on Samoan soil no more!"

 #Question of Fono - SAM
 r56_goodwill_negotiations.2.t:0 "The Question of the Fono"
 r56_goodwill_negotiations.2.d:0 ""
 r56_goodwill_negotiations.2.a:0 "We shall send our request and hope for the best.."
 
