 # Faumuina / Manu'a Path

 r56_SAM_dissolve_the_fono:0 "Dissolve the Fono"
 r56_SAM_dissolve_the_fono_desc:0 "The Fono, our parliament, has become a mere tool by foreigners to intervene and manipulate our politics and politicians. This colonial construct must be abolished to allow us to function independently and to give greater autonomy to local governments."
 r56_SAM_faumuina_will_seize_power_tt:0 "§YFaumuinā Fiamē Mulinu'u§! will be §GPromoted§! to a §YField Marshal§!."

 r56_SAM_confiscate_foreign_plantations:0 "Confiscate Western Plantations"
 r56_SAM_confiscate_foreign_plantations_desc:0 "Many plantations are currently within the hands of wealthy Westerners. If we are to confiscate them from their owners, we can achieve greater profit from said plantations and reduce our reliance on foreign planters."

 r56_SAM_establish_univeristy_at_capital:0 "Establish the University of [ROOT.Capital.GetCapitalVictoryPointName]"
 r56_SAM_establish_univeristy_at_capital_desc:0 "Whilst many within our nation are literate and have access to basic education, further education must be sought abroad in more developed countries. We can change this by providing a place to students where they can pursue higher education freely without having to leave our borders."
 r56_SAM_invite_japanese_scholars:0 "Invite [JAP.GetAdjective] Teaachers"
 SAM_if_in_a_faction_with_japan:0 "\nIf we are in a faction with §Y[JAP.GetNameDef]§!: \n"

 r56_SAM_acquire_obsolete_japanese_naval_vessels:0 "Acquire Obsolete [JAP.GetAdjective] Naval Vessels"
 r56_SAM_acquire_obsolete_japanese_naval_vessels_desc:0 "Currently, the [ROOT.GetAdjective] navy consists of old, primarily outdated warships, which are lacking the capabilities of modern warships. In order to provide our sailors a greater fighting chance against the far more technologically advanced fleets of our enemies, we must seek to acquire modern ships of our own. With both us and [JAP.GetNonIdeologyName] facing the same enemy, they may be willing to help us build a sizable fleet by providing vessels and naval support."
 r56_SAM_direct_funds_to_naval_production:0 "Direct Funds to Naval Production"
 r56_SAM_direct_funds_to_arms_production:0 "Direct Funds to Weapons Production"

 r56_SAM_purchase_australian_guns:0 "Purchase [AST.GetAdjective] Guns"
 r56_SAM_purchase_australian_guns_desc:0 "Maybe what we really need is guns. Our allies are more than capable of holding off the fleets of our enemies, granting us the opportunity to capture our desired lands."

 r56_SAM_prepare_for_an_island_hopping_campaign:0 "Prepare for an Island Hopping Campaign"
 r56_SAM_prepare_for_an_island_hopping_campaign_desc:0 "Considering our surroundings, an army that is prepared for an island hopping campaign may be the most suitable choice we have in the case of war."

