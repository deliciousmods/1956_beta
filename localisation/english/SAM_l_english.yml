 SAM_tanumafili_i_desc:0 ""

 SAM_tanumafili_ii:0 "Malietoa Tanumāfili II" # He takes charge after his fathers death so him being called malietoa is okay
 SAM_tanumafili_ii_desc:0 ""

 SAM_mataafa_faumuina_fiame:0 "Faumuinā Fiamē Mulinu'u"
 SAM_mataafa_faumuina_fiame_leader_desc:0 "Faumuina was born in 1889, when Samoa was still an independent kingdom. Before the Mau, he was politically active in his local communities, going on to obtain the titles of Faumuina and Fiame from their respective villages of Lepea and Lotofaga. Faumuina was initially a collaborator with the New Zealander colonial administration, but after attending a meeting with Mau leaders, he was alienated from the colonial administration, which led to Faumuina strengthening his ties with the Mau and made him rise through the ranks of the organisation. \n\nAlthough, Faumuina is not perfect, and most certainly not like his predecessor Tupua Tamasese Leolofi III. Without the same drive and charisma as his predecessor, Faumuina will have to prove himself worthy of holding such an important role in the organisation. With peace talks on the horizon, it may be his perfect opportunity to show his capabilities as a leader. \n\nWith all other Mau leaders either deceased or in exile, Faumuina and his close associates are now responsible for the Mau and will have to guide it into the uncertain future, for the better or worse."

 SAM_tupua_tamasese_meaole:0 "Tupuā Tamasese Mea'ole"
 SAM_tupua_tamasese_meaole_leader_desc:0 ""

 SAM_alfred_matthes:0 "Alfred Matthes"
 SAM_alfred_matthes_advisor_desc:0 "§LArriving to Western Samoa in 1906 at the age of 32 when the islands were under the sovereignty of the German Empire, Alfred Matthes quickly utilized his experience in planting cash crops and became a planter in the region. Following the New Zealander annexation of the western portion of Samoa, Alfred Matthes, alongside like-minded Germans and Samoans, yearned for the return of German rule to the islands. An opportunity presented itself in 1933 when the National Socialist party rose to power in Germany. \n\nThe rise of the ultranationalist party in Germany provided an opportunity to make Alfred's wishes come true. He would soon establish a branch of the National Socialist Party in Western Samoa in 1934, and has been the head of it ever since its establishment. Although many, including the regime back in Germany and Wellington view this as a silly and utterly idiotic idea, the party has attempted exploiting the pro-independence sentiment amongst Samoans in order to garner support for a return of the German regime in Samoa. And with many Germans within the islands having favorable views towards the German regime back in Berlin, the party may rise to prominence rapidly if not dealt with.§!"

