 #Ideas
 r56_SAM_samoa_arise:0 "§OSamoa, Arise!§!"
 r56_SAM_samoa_arise_desc:0 "The fate of the nation lies within our hands. We must not fail!"
 r56_NZL_mau_movement_idea:0 "Mau Movement" #Idea for NZL
 r56_NZL_mau_movement_idea_desc:0 "With our failure to administer and maintain control over Western Samoa, the Mau has §YSeized Control§! and has §YProclaimed a Provisional Government§! over the islands. \n\nWith previous attempts at asserting our control ending in §RTotal Disaster§!, we are left with no choice other than to come to the §YNegotiating Table, or Leave Samoa to it's Own.§! \n\n§RIf the political stalemate between the Mau and New Zealand isn't broken until 1937, Samoa will declare Independence!§!"
 r56_NZL_unsupported_war:0 "Unsupported War"
 r56_NZL_unsupported_war_desc:0 "Our allies have no interest in helping us in our current war against the Mau in [726.GetName]. This leaves us fighting the war §RAlone.§!"
 
