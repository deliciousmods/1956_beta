 r56_goodwill_negotiations.10.t:0 "New Zealand Leaves Us On Read"
 r56_goodwill_negotiations.10.d:0 "babe?"
 r56_goodwill_negotiations.10.a:0 "THATS IT!"
 
 #GM Compromise - SAM
 r56_goodwill_outcome.1.t:0 "Goodwill Mission: Compromise"
 r56_goodwill_outcome.1.d:0 "Many of our demands were met. But not all. \nThis resulted in a compromise being reached between our government and [NZL.GetNameDef]. For now, we must be content with what we have, and continue our slow process towards independence."
 r56_goodwill_outcome.1.a:0 "It most certainly could have been worse."
 
 #GM Compromise - NZL
 r56_goodwill_outcome.2.t:0 "Goodwill Mission: Compromise"
 r56_goodwill_outcome.2.d:0 "Pennsylvania Ave NW, Washington, DC 20500 1600"
 r56_goodwill_outcome.2.a:0 "It is an affordable loss."
 
 #GM Samoa Win - SAM
 r56_goodwill_outcome.3.t:0 "Goodwill Mission: Samoan Demands Met"
 r56_goodwill_outcome.3.d:0 "Recently, [NZL.GetAdjective] diplomats have departed back to New Zealand as a result of the negotiations concluding. The result was that we shall begin the gradual process to independence, and will become a free nation in the coming future."
 r56_goodwill_outcome.3.a:0 "After much struggle, we are finally free."
 
 #GM Samoa Win - NZL
 r56_goodwill_outcome.4.t:0 "Goodwill Mission: Samoan Demands Met"
 r56_goodwill_outcome.4.d:0 "Recently, our diplomats have returned from Apia as a result of the negotiations concluding. The result was that Western Samoa would begin their gradual process to self governance, and eventually become an indepednent nation."
 r56_goodwill_outcome.4.a:0 "It was only a matter of time, really."
 
 #GM NZL Win - NZL
 r56_goodwill_outcome.5.t:0 "Goodwill Mission: Samoan Representatives Storm Out"
 r56_goodwill_outcome.5.d:0 "As a result of us rejecting a majority of the Mau's demands regarding the future of Western Samoa, they have decided to abruptly end negotiations and resume the current status quo until further notice."
 r56_goodwill_outcome.5.a:0 "Maybe this is still solvable...?"
 
 #GM NZL Win - SAM
 r56_goodwill_outcome.6.t:0 "Goodwill Mission: Failed Negotiations"
 r56_goodwill_outcome.6.d:0 "Our demands fell on deaf ears. It is obvious that the [NZL.GetAdjective]s have no interest in granting us our rightful demands. If they aren't willing to cooperate, then we must take matters into our own hands."
 r56_goodwill_outcome.6.a:0 "We are left with only a few cards left."
 
 #Samoa declares independence - NZL
 r56_goodwill_outcome.7.t:0 "Samoa Declares Independence"
 r56_goodwill_outcome.7.d:0 "After both of our nations failed to reach a conclusion to the years long conflict in Western Samoa, the Mau has decided to abruptly declare the independence of Western Samoa, openly challenging our authority."
 r56_goodwill_outcome.7.a:0 "Enough is enough! We have reached our limit!"
 r56_goodwill_outcome.7.b:0 "Leave the demon to his demons.."
 
 #Samoa declares independence - SAM
 r56_goodwill_outcome.8.t:0 "Our Declaration of Independence"
 r56_goodwill_outcome.8.d:0 "After many years of oppression under the imperialist colonial administration of [NZL.GetNonIdeologyName], we can finally decide on our own path, free of any foreign meddling."
 r56_goodwill_outcome.8.a:0 "Free at last."
 
 #GM Decision Category
 r56_SAM_goodwill_mission_negotiations_tracker_category:0 "Goodwill Mission: Future of Western Samoa"
 r56_SAM_goodwill_mission_negotiations_tracker_category_desc:0 "--------------------------------------------------------------------------------------------\n§YThe nation with the most amount of influence in the negotiations will be favored. If both sides have equal influence, a compromise will be reached. \nCurrent influence of each side:§! \n-------------------------------------------------------------------------------------------- \nAfter years of political stalemate between the Mau and the [NZL.GetAdjective] government, the two sides have finally begun negotiations regarding the future of Western Samoa. \n\nIf the negotiations §GFavor§! the Mau, Samoa will go down a path towards independence and will be more likely to adopt the ideology of [NZL.GetNonIdeologyName]. \n\nAlthough if negotiations turn out favoring New Zealand, there is a high likelyhood of §RConflict§! breaking out between the two nations. \n\nOur best hope is to achieve a §YCompromise§! and to uphold peace. Even if it may leave both sides dissatisfied."
