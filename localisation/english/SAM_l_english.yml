 new_zealand.11.t:0 "A Goodwill Mission Arrives in Samoa"
 new_zealand.11.d:0 "Recently, a 'Goodwill Mission' was sent to Apia to discuss with the Mau Movement about the future of the Samoan archipelago. After many failed attempts at restoring our authority over the islands throughout the years, we have been left with no choice other than to bring ourselves into the negotiating table with the Mau. \n\nTheir demands will not be light, and there is a very high likelyhood that we will lose more than what we gain. However, if we can negotiate on the right terms, the damage might be neglectful, and we will come out in a better position than before."
 new_zealand.11.a:0 "They will not get far!"
 
 goodwill_negotiations.1.t:0 "A Goodwill Mission Arrives in Samoa"
 goodwill_negotiations.1.d:0 "Recently, a 'Goodwill Mission' was sent to Apia to discuss with the Mau Movement about the future of the Samoan archipelago. We have been able to seize our islands and defend them from [NZL.GetAdjective] troops ever since 1929, and this time it won't be any different! \n\nThe [NZL.GetAdjective] delegation will soon arrive in Apia to discuss with us about the future of Samoa, in which we will demand our homeland to be independent and free from foreign rule, amongst other things. \n\nBut even if we do seccure our independence, internal issues will still plauge the nation, and our future will remain uncertain and shaky."
 goodwill_negotiations.1.a:0 "The Union Jack will rise on Samoan soil no more!"
 
 goodwill_outcome.1.t:0 "Goodwill Mission: Compromise"
 goodwill_outcome.1.d:0 "Whilst all of our demands weren't met, most were.\n\nBut even with most of our demands being given to us, there is one thing that has yet to be given. What we fought for, and what we hope to achieve in the future with the guidance of our overlord. Independence. \n\nBut, for now we must be content with what we have, and hope for a brighter future, and a peaceful one. One which will not take the lives of innocents, and where all will be equal inside of the realm."
 goodwill_outcome.1.a:0 "Hope is not lost yet!"
 
 goodwill_outcome.2.t:0 "Goodwill Mission: Compromise"
