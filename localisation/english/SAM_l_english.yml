 SAM_mau_council:0 "Mau Movement"
 SAM_mau_council_leader_desc:0 "Having seized power after the 1929 Black Saturday incident, the Mau movement now holds almost full control over Western Samoa, but at the cost of widespread anarchy and disorganization. \n\nThe movement is based in Lepea, not far from the nation's capital of Apia. The movement has not been able to establish a united government or coalition to properly govern the country, which has led to widespread disorganization, chaos, and factionalism amongst the movement's members. But even with the odds not in the Mau's favor, they have been able to hold their ground and keep Samoa free of any foreign influence domination. \n\nAlthough, times are changing. A new government in Wellington has shown interest in cooperating with the Mau to restore order in the islands, which leaves the entire movement with two options: \n\nNegoitate, or continue fighting."
