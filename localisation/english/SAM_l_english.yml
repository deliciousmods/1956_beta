 ## EVENTS
 
 ## Tuimalealiʻifano dies :pensive:
 samoa.1.t:0 "Tuimaleali'ifano Passes Away"
 samoa.1.desc:0 "One of the leaders of the Mau Movement and an advocate for Samoan independence, Tuimaleali'ifano Fa'aoloi'i Si'ua'ana I, has recently passed away. \nHis contributation to our struggle for independence was huge, and his legacy will be one of a hero."
 samoa.1.a:0 "Rest in peace."
 
 ## Olaf Frederick Nelson Returns
 samoa.2.t:0 "Olaf Frederick Nelson Returns From Exile"
 samoa.2.desc:0 "Olaf Nelson, a famous advocate for Samoan independence, has returned back to Samoa after having been exiled and imprisoned in New Zealand. \nWith the recent Goodwill Negotiations taking place, he may prove to be useful in getting us in a better position and sway the neogtiations to our favor."
 samoa.2.a:0 "Welcome back!"
 
 ## Mata'afa dies
 samoa.3.t:0 "Mata'afa Muliufi Passes Away"
 samoa.3.desc:0 "RIP"
 samoa.3.a:0 "May his soul rest in peace."
 
