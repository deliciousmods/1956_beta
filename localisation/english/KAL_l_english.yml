l_english:
 KAL_khan_fascism_tt:0 "The Popularity of the §YFascist§! and §YNon-aligned§! parties combined is greater than §G50%§!"
 
 KAL_fascism_party: "KTT"
 KAL_fascism_party_long: "Khalmag Tanġčin Tug"

 KAL_im_badmayev:0 "I.M. Badmayev"
 KAL_basan_badminovich_gorodovikov: "Basan Badminovich Gorodovikov"
 KAL_nikolai_tundutov: "Khagan Nikolai Tundutov"
 KAL_ngawang_wangyal: "Ngawang Wangyal"
 KAL_xenia_tundutov: "Xenia Tundutov"
 KAL_chamba_balinov: "Chamba Balinov"
 KAL_basang_burunovich_ogdonov: "Basang Burunovich Ogdonov"
 KAL_oka_gorodovikov: "Oka Gorodovikov"
 KAL_stepanov: "A. Stepanov"

 KAL_organize_the_government:0 "Organize the Government"
 KAL_organize_the_government_desc: "We are now able govern ourselves, it is a key moment for our future."
 KAL_form_manufacturing_cooperatives:0 "Form Manufacturing Cooperatives"
 KAL_form_manufacturing_cooperatives_desc:0 "Factories and workshop organized by the people are the first step towards socialism."
 KAL_collectivist_propaganda: "Collectivist Propaganda"
 KAL_collectivist_propaganda_desc:0 "Work for the party, the revolution and the coming of communism comrades!"
 KAL_five_year_plan: "Five Year Plan"
 KAL_five_year_plan_desc: "The revolution of the economy away from nomadic feudalism must be the goal of our first five year plan."
 KAL_indoctrination_focus:0 "Indoctrination"
 KAL_indoctrination_focus_desc: "The tenets of Marxism-Leninism must be spread to ensure the success of the revolution."
 KAL_cult_of_personality:0 "[ROOT.GetCommunistLeader] Personality Cult"
 KAL_cult_of_personality_desc:0 "The revolution is protected by the wise leadership of the our beloved general-secretary [ROOT.GetCommunistLeader]."
 KAL_red_army:0 "The [KAL.getAdjective] Red Army"
 KAL_red_army_desc:0 "Long live the [KAL.getAdjective] Red Banner and its army!"
 KAL_war_communism:0 "War Communism"
 KAL_war_communism_desc:0 "The war requires unprecedented measures in order to save the revolution."
 KAL_reconcile_buddhism_and_socialism:0 "Reconcile Buddhism and Socialism"
 KAL_reconcile_buddhism_and_socialism_desc:0 "Buddhist compassion is an essential element for the accomplishment of socialism."
 KAL_state_atheism:0 "State Atheism"
 KAL_state_atheism_desc:0 "The elimination of feudalist religious exploiters is necessary for the progress of historical materialism and the advancement of the people."
 KAL_revolutionary_pioneer_organizations:0 "Revolutionary Pioneer Organizations"
 KAL_revolutionary_pioneer_organizations_desc:0 "The pioneers are essential in order to teach the youth about the tenets, virtue and benefits of socialism. Communism will not be reached in a generation and it is up to them to continue the irrestible march of history."
 KAL_prepare_the_youth_for_service: "Prepare the Youth for Service"
 KAL_prepare_the_youth_for_service_desc: "Properly educated pioneers can now follow basic military instructions in order to be prepared to defend the future of the revolution."

 KAL_bring_in_exiled_nationalists: "Bring in Exiled Nationalists"
 KAL_bring_in_exiled_nationalists_desc: "Kalmyks who took side with the White Russians often took refuge abroad after the victory of the communists. They have been making contacts and published texts in order to prepare their returns, most holding a strong grudge against the communists."
 KAL_reinforce_the_security_apparatus: "Reinforce the Security Apparatus"
 KAL_reinforce_the_security_apparatus_desc: "In order to ensure that no subversive activitites threathen the security of the state, necessary secretive insitutions must be established."
 KAL_the_kalmyk_flag_organization: "The Kalmyk Flag Organization"
 KAL_the_kalmyk_flag_organization_desc: "The Kalmyk Flag Organization is a creation of Chamba Nudelich Balinov as a way to promote Cossack and Kalmyk nationalism. It also gave him contacts in Berlin... The Organization should become the core of the new governement in order to guarantee national unity."
 KAL_solidify_the_military_government:0 "Solidify the Military Government"
 KAL_solidify_the_military_government_desc: "Military rule must be absolute, uncompromising and clear in its goal."
 KAL_rally_behind_the_khan:0 "Rally Behind the Khagan"
 KAL_rally_behind_the_khan_desc: "While the Khagan doesn't share all of our beliefs, he could serve as a useful rallying figure for the people."
 KAL_form_a_royal_guard: "Form a Royal Guard"
 KAL_form_a_royal_guard_desc: "A royal guard is a necessary step to show the control of the monarch over his army and enhance his prestige."
 KAL_royal_officer_corps: "Royal Officer Corps"
 KAL_royal_officer_corps_desc: "Officers loyal to the monarchs are necessary for the enlargement of the army."
 KAL_the_spirit_of_genghis: "Spirit of Genghis"
 KAL_the_spirit_of_genghis_desc: "All the Mongols, Kalmyks, Buryats and Tuvans still celebrate the memory of Djinghis Khan, singing "Chinggis khaanii Magtaal"."
 KAL_armament_production_plan: "Armament Production Plan"
 KAL_armament_production_plan_desc: "More guns for the sky god, bullets to defend the boddhisatvas."
 KAL_promote_nichiren_buddhism: "Promote Nichiren Buddhism"
 KAL_promote_nichiren_buddhism_desc: "Nichiren Buddhism is a form of Japanese Buddhism which gradually got fused into extreme form of Japanese nationalism. It wouldn't be difficult to use those principle for the advancement of our ethnic means." 
 KAL_examplary_battle_leadership: "Examplary Battle Leadership"
 KAL_examplary_battle_leadership_desc: "Only the example of our officers can inspire trust of our soldiers in their commanders."
 KAL_promote_militarism:0 "Promote Militarism"
 KAL_promote_militarism: "Our ambitions demand soldiers. The people must be mobilized for the fight to come."
 KAL_paramilitarism:0 "Paramilitarism"
 KAL_paramilitarism_desc: "In addition to the military, party and youth organization can prepare aspiring recruits for their coming soldiering role."
 KAL_dominate_the_pontic_caspian_steppe: "Dominate the Pontic-Caspian Steppe"
 KAL_dominate_the_pontic_caspian_steppe_desc: "The Caspian-Pontic Steppe is where we migrated to in the 18th century. Since them our domain of influence has been slowly eroded by other people. It's time to control the region and maybe try to reunite with our Mongol cousins."
 KAL_take_leadership:0 "Take Leadership"
 KAL_take_leadership_desc:0 "It is time to form and lead our own coalition and leave our mark on the world."
 KAL_organize_our_alliance:0 "Organize our Alliance"
 KAL_organize_our_alliance_desc:0 "Through the organization of a grand conference, we should be able to coordinate the efforts of our alliance."

 KAL_stimulate_mongol_traditions_in_mongolia: "Stimulate Traditions in Mongolia"
 KAL_stimulate_mongol_traditions_in_mongolia_desc: "The reestablishment of our common cultural traditions in lands under our countrol would allow us to gain the hearts and minds of the local population."
 KAL_stimulate_mongol_traditions_in_inner_mongolia: "Stimulate Traditions in Inner Mongolia"
 KAL_stimulate_mongol_traditions_in_inner_mongolia_desc: "The reestablishment of our common cultural traditions in lands under our countrol would allow us to gain the hearts and minds of the local population."
 KAL_stimulate_mongol_traditions_in_tuva: "Stimulate Mongol Traditions in Tuva"
 KAL_stimulate_mongol_traditions_in_tuva_desc: "The reestablishment of our common cultural traditions in lands under our countrol would allow us to gain the hearts and minds of the local population."
 KAL_stimulate_mongol_traditions_in_buryatia: "Stimulate Mongol Traditions in Buryatia"
 KAL_stimulate_mongol_traditions_in_buryatia_desc: "The reestablishment of our common cultural traditions in lands under our countrol would allow us to gain the hearts and minds of the local population."


 KAL_the_court_of_joinville_le_pont: "The Court of Joinville-le-Pont"
 KAL_the_court_of_joinville_le_pont_desc: "In Joinville-le-Pont near Paris, a group of proheminent Kalmyk exiles established themselves far away from the reach of the Bolsheviks. Among them was the son of a military aide to Nicholas II who was heir to one of the main Kalmyk clans, recognized as their Khagan."
 KAL_reinstate_monasteries: "Reinstate Monasteries"
 KAL_reinstate_monasteries_desc: "The Bolsheviks have tried to distance our people from buddhism and eradicate our culture. The restoration of monasteries will be the proof of their failure."
 KAL_finance_military_infrastructure:0 "Finance Military Infrastructure"
 KAL_finance_military_infrastructure_desc: "Helping financing the necessary means of the defense of the state is indispensable for our long term survival."
 KAL_building_a_kingdom: "Building a Kingdom"
 KAL_building_a_kingdom_desc: "Our people must be mobilized in order to make a proper kingdom out of Kalmykia."
 KAL_buddhist_society: "Buddhist Society"
 KAL_buddhist_society_desc: "Our efforts to undo the damage done by the previous persecutions are finally fruitfully restoring the influence of Buddhism in our society."
 KAL_propaganda_for_the_khagan_god: "Propaganda for the Khagan-God" 
 KAL_propaganda_for_the_khagan_god_desc: "During his exile the writer and journalist Nikolai Brechko-Brechkovsky described the Khagan as a "Prince-God". Back during those difficult years far away from the native land he was the rallying point of those beleiving in him and dynastic legitimacy. Now it is time to reignite this formula and with the agreement of the clergy see the rise of the Khagan-God." 

 KAL_trust_democratic_institutions: "Trust Democratic Institutions"
 KAL_trust_democratic_institutions_desc: "It is essential to not let the tenants of a one party state crush the populace once again."
 KAL_introduce_political_reforms: "Introduce Political Reforms"
 KAL_introduce_political_reforms_desc: "Constitutional reforms will allow to make the regime more efficient while guaranteeing the liberties of the people."
 KAL_anti_revolutionary_decree: "Anti-revolutionary Decree"
 KAL_anti_revolutionary_decree_desc: "Sanctions against dangerous ideologies are essential for the stability of the state."
 KAL_economic_optimization:0 "Economic Optimization"
 KAL_economic_optimization_desc: "Democratic insitutions are essential to allow long term economic growth."
 KAL_research_grants:0 "Research Grants"
 KAL_research_grants_desc: "Dedicated research finance funds would help us develop new equipments."
 KAL_deterrence:0 "Deterrence"
 KAL_deterrence_desc: "We must be prepared to defend the motherland."

 KAL_establishing_an_army: "Establishing an Army"
 KAL_establishing_an_army_desc: "We must quickly formed a professional military force in order to protect our people."
 KAL_our_equine_pride: "Our Equine Pride"
 KAL_our_equine_pride_desc: "Our steppe and its horses are our lifestyle and our pride.Even though some derided them as mere "ponypower", they can, should and will be our best military asset."
 KAL_moderate_cavalry_supremacy:0 "Moderate Cavalry Supremacy"
 KAL_moderate_cavalry_supremacy_desc:0 "There are other units to consider than overfocusing on ponies, horses and mares."
 
