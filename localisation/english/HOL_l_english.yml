 HOL_red_volunteers:0 "Red Volunteers"
 HOL_red_volunteers_desc:0 "To further the cause of the world revolution and proletarian internationalism, we must be willing to aid all communist movements around the globe. Setting up a dedicated volunteer force to deploy and fight for the working class in foreign lands would be a good step."
 HOL_suspicious_military_establishment:0 "Suspicious Military Establishment"

 HOL_heirs_of_ruyter:0 "Heirs of Ruyter"
 HOL_heirs_of_ruyter_desc:0 "Hou Zee!"
 HOL_air_industry_contacts:0 "Air Industry Contacts"

 HOL_join_belgo_luxembourgian_customs_union:0 "Join the Customs Union"
 HOL_join_belgo_luxembourgian_customs_union_desc:0 "To strengthen our economy, we should approach our southern neighbors and negotiate our admittance in the [BEL.GetAdjective]-[LUX.GetAdjective] customs union to form the Benelux Customs Union."
 HOL_foreign_guarantees:0 "Foreign Guarantees"
 HOL_foreign_guarantees_desc:0 "While diplomacy can try to prevent a war, we must still be ready for the possibility of a failure of our mediation. Therefore we must ask foreign powers to guarantee our independence."
 HOL_the_new_ideal:0 "The New Ideal"
 HOL_the_new_ideal_desc:0 "[GER.GetNameDefCap] has done too much damage to the world and us in particular. They must now pay the price by moving their borders eastward."

 HOL_benelux_scientific_commission:0 "Benelux Scientific Commission"
 HOL_benelux_scientific_commission_desc:0 "After setting up economic and defense cooperations, one logical step forward is coordinating our military research."
 HOL_bicycle_infantry:0 "Bicycle Infantry"
 HOL_bicycle_infantry_desc:0 "Bicycles are our favorite method of transportation that will enable our infantry to gain much-needed mobility."
 HOL_convert_werkspoor_train_factory:0 "Convert Werkspoor Train Factory"
 HOL_convert_werkspoor_train_factory_desc:0 "Through Europe, many train manufacturers have been converted into armor manufacturers. This shouldn't be a surprise as they already built complex steel vehicles before their reconversion. We must follow that path and convert the Werkspoor train factory into the vanguard of our tank production program."

 netherlands.1.t:0 "The Prime Minister Has an Affair with a German Woman!"
 netherlands.1.desc:0 "A journal alleged in today's edition that the Prime Minister himself is in a relationship with a German woman named Hella Schultz. According to the journal's source, he was seen with her dining in Nice, and they went to the same hotel in London a few months later. In addition, Dutch state security believes that even if she was officially expelled from Germany, she might be a German agent."
 netherlands.1.a:0 "It was a private matter I helped her to settle in Argentina."
 netherlands.1.b:0 "Deny everything!"

 netherlands.2.t:0 "The Prime Minister Refuses the Coalition with the Catholics"
 netherlands.2.desc:0 "In a surprising turn of events, Prime Minister Hendrikus Colijn has announced that he couldn't reach an agreement with the catholic party. The government is now in the minority, and unless negotiations are restarted in the following days, a resignation of the current executive is likely to happen."
 netherlands.2.a:0 "Continue to negotiate."
 netherlands.2.b:0 "We won't betray our electorate."

 netherlands.3.t:0 "The Prime Minister Expressed Defeatist Opinions"
 netherlands.3.desc:0 "Today, Dirk Jan de Geer confessed to the Queen that he thinks the country is lost. The government is in exile, and the chances of victory in this war are meager at best."
 netherlands.3.a:0 "The liberation of the Netherlands is our only goal."

 netherlands.16.t:0 "[HOL.GetNameDefCap] Demands Our Protection"
 netherlands.16.desc:0 "Representatives from [ENG.GetNameDef] have contacted our diplomatic service to see if we could meet them and publicly guarantee their borders. That way, we would clearly announce our intention to protect the right of smaller nations against foreign ideological threats."
 netherlands.16.a:0 "It will protect freedom and trade with a valuable partner."
 netherlands.16.b:0 "We must avoid empty promises."
 netherlands.17.t:0 "The [ENG.GetAdjective] Government Has Agreed to Our Proposal"
 netherlands.17.desc:0 "The negotiations between the [ENG.GetAdjective] and the [HOL.GetADjective] Foreign Ministers have successfully led to the signature of an official declaration that guarantees the borders of our country. This statement enshrined our current neutrality as a sacrosanct stance."
 netherlands.17.a:0 "[ENG.GetNameDefCap] stands with us."
 netherlands.18.t:0 "The [ENG.GetAdjective] Government Refused to Guarantee Us!"
 netherlands.18.desc:0 "Yesterday, a summit was held in London between [HOL.GetAdjective] and [ENG.GetAdjective] representatives to discuss the possibility of a [ENG.GetAdjective] guarantee on [HOL.GetNameDef]. The prospect of [ENG.GetAdjective] engagement towards the protection of the small nations of Europe and their commitment to protecting the freedom of its people was followed by disillusion as the summit ended with no clear stance on the [ENG.GetAdjective] side."
 netherlands.18.a:0 "An enormous disappointment."
 netherlands.19.t:0 "[HOL.GetNameDEfCap] Demand our Protection."
 netherlands.19.desc:0 "Representatives from [HOL.GetNameDef] have contacted our diplomatic service to see if we could meet them and publicly guarantee their borders. That way, we would clearly announce our intention to protect the right of smaller nations against foreign ideological threats."
 netherlands.19.a:0 "We must protect the right of small nations."
 netherlands.19.b:0 "We must avoid empty promises."
 netherlands.20.t:0 "[FRA.GetNameDefCap] is Guaranteeing Our Borders"
 netherlands.20.desc:0 "The negotiations between the [FRA.GetAdjective] and the [HOL.GetAdjective] representatives have successfully led to the signature of an official declaration that guarantees the borders of our country."
 netherlands.20.a:0 "[FRA.GetNameDefCap] stands by our side."
 netherlands.21.t:0 "The [FRA.GetAdjective] Government Refused to Guarantee us!"
 netherlands.21.desc:0 "Yesterday, a summit was held in Amsterdam between [HOL.GetAdjective] and [FRA.GetAdjective] representatives to discuss the possibility of guarantees. However, no agreement was concluded as the [FRA.GetAdjective] ambassador only made vague promises."
 netherlands.21.a:0 "An enormous disappointment."

 netherlands.22.t:0 "[HOL.GetNameDefCap] Wants to Join the Benelux Customs Union"
 netherlands.22.desc:0 "More strongly affected by the Great Depression than its neighbors, [HOL.GetNameDef] is considering the possibility of strengthening its ties with us and transforming the [BEL.GetAdjective]-[LUX.GetAdjective] customs union into a Benelux customs union."
 netherlands.22.a:0 "It would benefit everybody!"
 netherlands.22.b:0 "We don't need such a thing."

 netherlands.23.t:0 "The [BEL.GetAdjective] Government Approved Our Free Trade Proposal!"
 netherlands.23.desc:0 "Eager to improve the economic situation of our economies after years of financial difficulties, the [BEL.GetAdjective] government has approved the signing of an agreement changing the customs union between [BEL.GetNameDef] and [LUX.GetNameDef] established in 1921 into a tripartite trade alliance."
 netherlands.23.a:0 "This is a historical opportunity."
 BEL_HOL_benelux_customs_union: "Benelux Customs Union"

 netherlands.24.t:0 "[HOL.GetNameDefCap] Joins Our Customs Union with [BEL.GetNameDef]"
 netherlands.24.desc:0 "After negotiations with the [BEL.GetAdjective] government, the [HOL.GetADjective] have joined our customs union with [BEL.GetNameDef] and formed the Benelux Customs Union."
 netherlands.24.a:0 "It will benefit everybody!"

 netherlands.25.t:0 "The [BEL.GetAdjective] Government Refused Our Free Trade Proposal!"
 netherlands.25.desc:0 "Despite our best effort and the beneficial potential for all the participants, the [BEL.GetAdjective] government has refused to remove customs duties on the goods traded across our border."
 netherlands.25.a:0 "This is a disgrace."

 netherlands.26.t:0 "The [HOL.GetAdjective] Government Discusses a New Foreign Policy!"
 netherlands.26.desc:0 "After the failures of the negotiations with [BEL.GetNameDef] and [LUX.GetNameDef], it seems clear that the future of [HOL.GetNameDEf] isn't in the making of closer ties with [BEL.GetNameDef]. Stuck in a diplomatic impasse, the government must now explore new opportunities and reorient its diplomatic policy."
 netherlands.26.a:0 "We must rely on ourselves."
 netherlands.26.b:0 "We must try to ally with [ENG.GetNameDef]."

 netherlands.27.t:0 "The Queen Reacts to the Communist Takeover"
 netherlands.27.desc:0 "It is well known that the rise of communism in the country has deeply preoccupied the Queen. She is logically seeing communism as an ideology incompatible with the hereditary power of the house of Orange-Nassau. Therefore it is no surprise that the rumor is spreading that the Queen thinks more and more about leaving the country."
 netherlands.27.a:0 "We will see."
 netherlands.27.b:0 "Spy on her."

 netherlands.28.t:0 "The Queen Goes into Exile"
 netherlands.28.desc:0 "The Queen is not in her palace anymore. Fearing angry communist mobs, she discreetly fled the country with the help of reactionary accomplices."
 netherlands.28.a:0 "Monarchy is the last remnant of feudalism."

 netherlands.29.t:0 "Wilhelmina Arrested!"
 netherlands.29.desc:0 "While attempting to flee the country, Wilhelmina van Orange-Nassau was caught by agents loyal to the communist party. She was quickly arrested and put into jail as the main leader of the corrupt capitalist regime of the past."
 netherlands.29.a:0 "Long live the revolution!"

 netherlands.32.t:0 "The Fate of Wallonia"
 netherlands.32.desc:0 "We have finally secured the Lowlands, but this domination is only apparent. The Walloons fear for their right to practice their tongue. If their politicians refuse to support the unification of the Lowlands under our rule, it may recreate the conditions for a new Belgian Revolt, like in 1830."
 netherlands.32.a:0 "Let's play "Maria van Bourgondië" in the opera in Brussels."
 netherlands.32.b:0 "Grant some autonomy to the Walloons."

 netherlands.33.t:0 "[HOL.GetNameDef] Asks for Control of Flanders"
 netherlands.33.desc:0 "In his desire to realize the greater Dutch union, [HOL.GetLeader] has formally requested us to cede control of the former Belgian territory of Flanders, which he considers to be a formal part of his nation."
 netherlands.33.a:0 "If that's what they want."
 netherlands.33.b:0 "No! It's ours."

 netherlands.34.t:0 "Flanders Has Been Restituted!"
 netherlands.34.desc:0 "Our unmatched diplomatic skills have led to the liberation of Flanders, oppressed for centuries by Spaniards, Austrians, French, and Belgians."
 netherlands.34.a:0 "Hou Zee!"

 netherlands.35.t:0 "A Wasted Opportunity"
 netherlands.35.desc:0 "Despite our best efforts, our attempts to obtain the restitution of Flanders and finally unite the Dietschland diplomatically have been rejected."
 netherlands.35.a:0 "History will tell that we were right!"

 
 tdlra.1.t:0 "[From.GetNameDefCap] Wants Us to Join the Benelux"
 tdlra.1.d:0 "[From.GetNameDefCap] seeks to strengthen their alliance by making us join."
 tdlra.1.a:0 "Accept."
 tdlra.1.b:0 "Refuse."
 tdlra.2.t:0 "[From.GetNameDefCap] Refuses"
 tdlra.2.d:0 "[From.GetNameDefCap] has sadly refused our alliance offer."
 tdlra.2.a:0 "We need them in, one way or the other!"
 tdlra.3.t:0 "[From.GetNameDefCap] Accepts!"
 tdlra.3.d:0 "[From.GetNameDefCap] has accepted our alliance offer and is now part of the [Root.GetFactionName]."
 tdlra.3.a:0 "Great News"
 tdlra.4.t:0 "[From.GetNameDefCap] Offers a Pact"
 tdlra.4.d:0 "Realizing that our tank designs are superior to their own, [From.GetNameDef] has proposed that we share our designs so they can stand as a bastion of communism in Western Europe."
 tdlra.4.a:0 "Accept."
 tdlra.4.b:0 "Refuse."
 tdlra.5.t:0 "[From.GetNameDefCap] Accepts Our Proposed Pact"
 tdlra.5.d:0 "Realizing our strategic importance in the middle of Western Europe, [From.GetNameDef] has given us technologically superior tank designs to defend ourselves from outside influences."
 tdlra.5.a:0 "Get to work with the new designs."
 tdlra.6.t:0 "[From.GetNameDefCap] Refuses Our Proposed Pact!"
 tdlra.6.d:0 "[From.GetNameDefCap] has not signed our proposed pact, which would increase our armored capabilities. We will have to do it on our own!"
 tdlra.6.a:0 "So be it."
 tdlra.8.t:0 "The Netherlands Wants to Join [Root.GetFactionName]"
 tdlra.8.d:0 "Realizing that they could not contain [GER.GetAdjective] aggression, [From.GetNameDef] fears an invasion is imminent and asks for our protection."
 tdlra.8.a:0 "Accept."
 tdlra.8.b:0 "Refuse."
 tdlra.9.t:0 "[From.GetNameDefCap] Accepts"
 tdlra.9.d:0 "The [ENG.GetAdjective], realizing that the Benelux is strategically located for a war against [GER.GetNameDef], have decided to extend their protection over our nation."
 tdlra.9.a:0 "Great news!"
 tdlra.10.t:0 "[From.GetNameDefCap] Refuses"
 tdlra.10.d:0 "The [ENG.GetAdjective] do not recognize the Benelux as necessary, seeing as how they won't defend us from enemy incursions."
 tdlra.10.a:0 "Damned Brits!"
 tdlra.11.t:0 "Start Depillarization Process"
 tdlra.11.d:0 "We do not need a pillarized society in these tumultuous times; breaking down the pillars is essential in strengthening our state."
 tdlra.11.a:0 "Start the process."
 HOL_fietsinfanterie_tooltip:0 "Gain a small bicycle infantry unit \n"
 FLA_fascist_rebels_tooltip:0 "If successful, a decision will allow you to order to revolt of §YFlemish fascists§! after the §Ydeclaration of war§! at the cost of 30£command_power."

 HOL_infantry_equipment_0:0 "Geweer M.95"
 HOL_infantry_equipment_0_short:0 "Geweer M.95"

 HOL_gw_tank_equipment:0 "Carden Loyd Mk.VI"
 HOL_gw_tank_equipment_short:0 "V-CL Mk.VI"
 HOL_gw_tank_equipment_desc:0 "The Royal Dutch Army had only a handful of either obsolete or worn-out armored cars, twelve excellent DAF M39 six-wheeled armored trucks, and five Carden Loyd Mark VI tankettes named Lynx, Poema, Jaguar, Panter, and Luipaard."
 HOL_light_tank_equipment_1:0 "Vickers Light Tank Mk.IV"
 HOL_light_tank_equipment_1_short:0 "V-LT Mk.IV"
 HOL_light_tank_equipment_1_desc:0 "Only 22 Vickers Light Tank Mk.IVs were used by the KNIL (Royal Dutch East-Indies Army)."
 HOL_light_tank_destroyer_equipment_2:0 "DAF M39 Pantserwagen"
 HOL_light_tank_destroyer_equipment_2_short:0 "DAF M39"
 HOL_light_tank_destroyer_equipment_2_desc:0 "For its time, the DAF M39 was a modern design with an all-welded monocoque construction of the hull and extensive use of sloped armor. The turret, fitted with a relatively powerful 37 mm cannon, was produced in Sweden by Landsverk. The type was lightly armored and relatively fast, with a good cross-country capability."
 HOL_light_tank_equipment_2:0 "CTMS-1TB1"
 HOL_light_tank_equipment_2_short:0 "CTMS-1TB1"
 HOL_light_tank_equipment_2_desc:0 "Marmon-Herrington started the CTMS-1TB1 project to produce a three-man light tank for the Dutch Army. It was armed with a 37 mm automatic cannon and coaxial M1919 machine gun. They originally meant to send 600 of them to the Dutch East Indies. However, the campaign ended too early for prototypes to be sent."
 HOL_light_tank_aa_equipment_3:0 "Braat AA"
 HOL_light_tank_aa_equipment_3_short:0 "Braat AA"
 HOL_light_tank_aa_equipment_3_desc:0 "An anti-air cannon mounted on the chassis of a Braat Overvalwagen."
 HOL_medium_tank_equipment_1:0 "MTLS-1G14"
 HOL_medium_tank_equipment_1_short:0 "MTLS-1G14"
 HOL_medium_tank_equipment_1_desc:0 "The MTLS-1G14 project was started simultaneously as the CTMS-1TB1 to produce a four-man medium tank for the Dutch Army. It was armed with two 37 mm automatic cannons. It also was equipped with five M1919 machine guns, three of which were mounted on the hull, one mounted coaxially, and one mounted on the top of the turret. The armor was bolted and measured between 13–38 mm."

 HOL_CAS_equipment_1:0 "Fokker C.X"
 HOL_CAS_equipment_1_short:0 "Fokker C.X"
 HOL_CAS_equipment_1_desc:0 "The Fokker C.X was initially designed for the Royal Dutch East Indies Army to replace the Fokker C.V. Like all Fokker aircraft of that time, it was of mixed construction, with wooden wing structures and a welded steel tube frame covered with aluminium plates at the front of the aircraft and with fabric at the rear. The prototype was built in 1934 with a Rolls-Royce Kestrel V engine."
 HOL_CAS_equipment_2:0 "Douglas 8A-3N"
 HOL_CAS_equipment_2_short:0 "8A-3N"
 HOL_CAS_equipment_2_desc:0 "Due to the lack of ordnance, these were used as fighters during the German invasion. They suffered horrible losses and combined with the German air landing operations that included one of its bases (Ockenburg AFB), this resulted in a total loss of all 8A-3Ns."
 HOL_cv_CAS_equipment_1:0 "Fokker C.X-cv"
 HOL_cv_CAS_equipment_1_short:0 "Fokker C.X-cv"

 HOL_fighter_equipment_0:0 "Koolhoven F.K.51"
 HOL_fighter_equipment_0_short:0 "F.K.51"
 HOL_fighter_equipment_0_desc:0 "While the majority of F.K.51s were employed as elementary trainers within the Netherlands or in reconnaissance roles by the Royal Netherlands Air Force in the Dutch East Indies, twenty-eight were clandestinely sold to the Republican government during the Spanish Civil War, all despite a Dutch embargo on the sale of arms to either side of that conflict."
 HOL_fighter_equipment_1:0 "Fokker D.XXI"
 HOL_fighter_equipment_1_short:0 "Fokker D.XXI"
 HOL_fighter_equipment_1_desc:0 "Upon its entry into service, the D.XXI represented a significant leap forward for the Dutch Army Aviation Group, whose fighter force consisted of aging biplanes with open cockpits. The new Fokker quickly proved to be an extremely sturdy aircraft, capable of attaining a speed of 700 km/h in a dive. A handful of Finnish D-XXI fighters claimed almost two hundred air victories over the Soviet airforce during both Finnish-Soviet wars."
 HOL_fighter_equipment_2:0 "Koolhoven F.K.58"
 HOL_fighter_equipment_2_short:0 "F.K.58"
 HOL_fighter_equipment_2_desc:0 "The Koolhoven F.K.58 was a single-engine, interceptor-fighter aircraft designed and mainly manufactured by NV Koolhoven in the Netherlands under contract by France. Intended for Armée de l'Air use, the F.K.58 saw limited service in the Battle of France."
 HOL_fighter_equipment_3:0 "Koolhoven F.K.59"
 HOL_fighter_equipment_3_short:0 "F.K.59"
 HOL_fighter_equipment_3_desc:0 "The final Koolhoven design was a multi-purpose fighter bomber aimed to serve the naval aviation roles of states like Portugal, Sweden, and Norway. No orders followed, and development was cut short by Fall Gelb."
 HOL_cv_fighter_equipment_0:0 "Fokker D.XVII"
 HOL_cv_fighter_equipment_0_short:0 "Fokker D.XVII"
 HOL_cv_fighter_equipment_0_desc:0 "The D.XVII was a Dutch biplane created by Fokker. The prototype was powered by an unsupercharged 500+ hp Curtiss Conqueror. A later model was configured with a Rolls-Royce Kestrel of 600 hp, and plans were made for a Hispano-Suiza Xbre variant. On 18 January 1935, it set a Dutch high-altitude record."
 HOL_cv_fighter_equipment_1:0 "Fokker D.XXI-cv"
 HOL_cv_fighter_equipment_1_short:0 "Fokker D.XXI-cv"
 HOL_cv_fighter_equipment_2:0 "Koolhoven F.K.58C"
 HOL_cv_fighter_equipment_2_short:0 "F.K.58C"
 HOL_cv_fighter_equipment_3:0 "Buffalo 339-23"
 HOL_cv_fighter_equipment_3_short:0 "B-339-23"
 HOL_cv_fighter_equipment_3_desc:0 "As the Brewster B-339 aircraft used by the ML-KNIL were lighter than the modified B-339E Brewster Mark Is used by other allied air forces, they could successfully engage the Japanese. In a significant engagement, eight Dutch Brewster fighters intercepted a formation of about 35 Japanese bombers with an escort of about 20 Zeros. The Brewster pilots destroyed 11 Japanese aircraft and lost four Brewsters; two Dutch pilots died."
 HOL_jet_fighter_equipment_1:0 "Gloster Meteor F.4"
 HOL_jet_fighter_equipment_1_short:0 "Meteor F.4"
 HOL_jet_fighter_equipment_2:0 "Fokker S.14"
 HOL_jet_fighter_equipment_2_short:0 "Fokker S.14"
 HOL_jet_fighter_equipment_2_desc:0 "The S.14 external characteristics were short, broad, and its slightly tapered wings soon gave it its nickname 'the Plank'. However, all pilots flying the S.14 praised it for its excellent flight characteristics."

 HOL_nav_bomber_equipment_1:0 "Fokker T.IVa"
 HOL_nav_bomber_equipment_1_short:0 "Fokker T.IVa"
 HOL_nav_bomber_equipment_1_desc:0 "The Fokker T.IV was developed to meet the requirements of the Royal Netherlands Navy for a maritime patrol/torpedo bomber aircraft for use in the Dutch East Indies. The aircraft could carry either a torpedo or 800 kg of bombs, and had a defensive armament of three machine guns in nose, dorsal and ventral positions."
 HOL_nav_bomber_equipment_2:0 "Fokker C.XIw"
 HOL_nav_bomber_equipment_2_short:0 "Fokker C.XIw"
 HOL_nav_bomber_equipment_2_desc:0 "The Fokker C.XI was a reconnaissance seaplane designed to operate from warships. After successful catapult trials, an order was placed to equip the cruisers HNLMS Tromp and HNLMS De Ruyter while operating in European waters; but most were sent to the Netherlands East Indies to equip the Navy there."
 HOL_nav_bomber_equipment_3:0 "Fokker T.VIIIw"
 HOL_nav_bomber_equipment_3_short:0 "Fokker T.VIIIw"
 HOL_nav_bomber_equipment_3_desc:0 "The Fokker T.VIII was a Dutch twin-engined torpedo-bomber and reconnaissance floatplane, which served in the Dutch, British and German air forces. The aircraft was initially developed due to a request from the Dutch Naval Aviation Service for an aircraft for use in home waters and the Dutch East Indies."
 HOL_cv_nav_bomber_equipment_1:0 "Koolhoven F.K.52C"
 HOL_cv_nav_bomber_equipment_1_short:0 "F.K.52C"
 HOL_cv_nav_bomber_equipment_1_desc:0 "During the Winter War, two F.K.52s were purchased by the Swedish count Carl Gustav von Rosen and given to the Finnish Air Force. The aircraft were flown to Finland on January 18, 1940. Two months later, they bombed and strafed Soviet troops attacking over ice towards Virolahti. In London, the Dutch government ordered F.K.52s for their airforce in the Indies, and the planes were shipped to the US but never reached the Indies."
 HOL_cv_nav_bomber_equipment_2:0 "Fokker C.XI"
 HOL_cv_nav_bomber_equipment_2_short:0 "Fokker C.XI"
 HOL_cv_nav_bomber_equipment_3:0 "Fokker T.VIII"
 HOL_cv_nav_bomber_equipment_3_short:0 "Fokker T.VIII"

 HOL_heavy_fighter_equipment_1:0 "Fokker G.1"
 HOL_heavy_fighter_equipment_1_short:0 "Fokker G.1"
 HOL_heavy_fighter_equipment_1_desc:0 "The Fokker G.1 was a heavy twin-engined fighter aircraft with a revolutionary design: double boom fuselage and eight front-end machineguns in the nose. Besides the Dutch Airforce, several foreign air forces showed an interest in the G.1 as either a fighter or dive-bomber. The G.1 prototype was fitted with hydraulically operated dive brakes under the wings to test its potential as a dive-bomber. Flight tests revealed that the G.1 was capable of diving at over 644 km/h."
 HOL_heavy_fighter_equipment_2:0 "Fokker D.XXIII"
 HOL_heavy_fighter_equipment_2_short:0 "Fokker D.XXIII"
 HOL_heavy_fighter_equipment_2_desc:0 "The Fokker D.XXIII was designed as a twin-engined single-seat aircraft. To overcome the problems of asymmetric flight, it had a tractor engine at the front and a pusher engine at the rear. The D.XXIII was a cantilever monoplane with twin tail units on booms. The pilot had an enclosed cockpit in between the tractor and pusher engines, and it had a retractable tricycle landing gear."
 HOL_heavy_fighter_equipment_3:0 "Fokker G.3"
 HOL_heavy_fighter_equipment_3_short:0 "Fokker G.3"
 HOL_heavy_fighter_equipment_3_desc:0 "Little is known about this or the initial G.2 designs as development was interrupted by the invasion of the Netherlands."

 HOL_tac_bomber_equipment_0:0 "Fokker C.V D/E"
 HOL_tac_bomber_equipment_0_short:0 "Fokker C.V D/E"
 HOL_tac_bomber_equipment_0_desc:0 "The Fokker C.V was a Dutch light reconnaissance and bomber biplane aircraft manufactured by Fokker. It could be manufactured in various versions; the customer could choose from five different wing constructions (varied in wingspan). The radial engines could give between 336–723 kW (451–970 hp), and the landing gear could be changed from wheels to pontoons."
 HOL_tac_bomber_equipment_1:0 "Fokker T.V"
 HOL_tac_bomber_equipment_1_short:0 "Fokker T.V"
 HOL_tac_bomber_equipment_1_desc:0 "Designed to be a 'luchtkruiser' (aerial cruiser) concept multipurpose aircraft, which was to have a primary role of intercepting and destroying enemy bomber formations, with a secondary role as a long-range bomber. As the T.V lacked self-sealing fuel tanks, they gained a reputation for rapidly catching fire when hit by enemy fire."
 HOL_tac_bomber_equipment_2:0 "Fokker T.IX"
 HOL_tac_bomber_equipment_2_short:0 "Fokker T.IX"
 HOL_tac_bomber_equipment_2_desc:0 "The Fokker T.IX was a Dutch twin-engined bomber designed and built by Fokker for the Royal Netherlands East Indies Army Air Force as a replacement for their obsolescent Martin-built bombers. The German invasion of the Netherlands stopped further development."

 HOL_strat_bomber_equipment_1:0 "Fokker T.VI"
 HOL_strat_bomber_equipment_1_short:0 "Fokker T.VI"
 HOL_strat_bomber_equipment_1_desc:0 "Between August 1934 and February 1935, work was begun on the 'Ontwerp 115' (Design 115), a long-range heavy-bomber that got the name T.VI. It's not clear whom this aircraft was meant for. The Netherlands, which at the time declared itself neutral in the European conflict, would not want a plane like this. It was never built."

 HOL_transport_plane_equipment_1:0 "Fokker F.XX"
 HOL_transport_plane_equipment_1_short:0 "Fokker F.XX"

