 HOL_finish_the_twentekanaal:0 "Finish the Twente Canal"
 HOL_finish_the_twentekanaal_desc:0 "The finishing of the Twente Canal is necessary to connect parts of Gelderland to Overijssel. With this project, trade will grow between these vital sections of our nation."
 r56_HOL_daf_pantrado:0 "DAF Pantrado 3"
 r56_HOL_daf_pantrado_desc:0 "Based on the design of the Trado truck suspension system. The Pantrado 3 will a state of the art armored car that will replace our foreign built armored cars."
 r56_HOL_reorganize_the_engineer_regiment:0 "Reorganize the Engineer Regiment"
 r56_HOL_reorganize_the_engineer_regiment_desc:0 "By reorganizing the engineers regiment we can have them prepare better for future combat in the next war."
 r56_HOL_van_kinsbergen:0 "Order the Van Kinsbergen Design"
 r56_HOL_van_kinsbergen_desc:0 "The Van Kinsbergen is a unique sloop built to protect our convoys from our any hostile countries submarines."
 r56_HOL_mobile_tanks_for_the_colonies:0 "Mobile Tanks For the Colonies"

