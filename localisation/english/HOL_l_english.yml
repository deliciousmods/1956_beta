 mtg_netherlands.80.d:0 "[FROM.GetNameDefCap] has proposed an alliance between our nations; this arrangement would mean friendly control over the strategically important East Indies, almost guaranteeing our access to their oil and rubber resources without risking a significant conflict."
 mtg_netherlands.80.a:0 "That would be beneficial."
 mtg_netherlands.80.b:0 "We could manage those resources better."
 HOL_JAP_new_faction:0 "Renewed Dutch-Japanese Alliance"
 HOL_restore_naval_cooperation:0 "Restore Naval Cooperation"
 HOL_restore_naval_cooperation_desc:0 "The Dutch helped set up the Japanese navy; now, the situation has changed, and we trail behind in naval development. Cooperation with Japan in matters like these could help prop our naval forces."
 HOL_jap_research_name:0 "Dutch-Japanese Technology Exchange"
 HOL_jap_research_desc:0 "Reduced research time for technologies researched by other faction members"
