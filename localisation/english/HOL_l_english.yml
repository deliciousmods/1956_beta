 #Dutch Revanchism Decision Category
 HOL_dutch_revanchism:0 "Dutch Revanchism"
 HOL_dutch_revanchism_desc:0 "The Dutch over the centuries has held grip on many territories throughout the lowlands and overseas, too many of which having been lost to time. Now may be our chance to fix the mistakes of revolution, war, and other transfers that have, over the years, weakened our empire far too greatly."
 HOL_vlaanderen_opnieuw_van_ons:0 "Vlaanderen, Opnieuw van Ons!"
 HOL_vlaanderen_opnieuw_van_ons_desc:0 "The Belgian Revolt of 1830, cemented nine years later by the Treaty of London, shattered our hold on Dutch-speaking Flanders. With them once more under our control, perhaps they may be reintegrated, once more showing the world the will of a united Netherlands!"
 HOL_reintegrate_wallonia:0 "Reintegrate Wallonia"
 HOL_reintegrate_luxembourg:0 "Reintegrate Luxembourg"
 HOL_unshackle_the_boers:0 "Unshackle the Boers!"
 HOL_unshackle_the_boers_desc:0 "Many centuries ago, the Dutch East India Company established several colonies at the Cape of South Africa, expanding them over the years. While much of our control was indirect, many Dutch settlers now live under foreign rule, we shall free our brethren!"
 HOL_liberate_french_flanders:0 "Liberate French Flanders"
 HOL_disavow_the_anglo_dutch_treaty_of_1870_1871:0 "Disavow the Anglo-Dutch Treaty of 1870-1871"
 HOL_disavow_the_anglo_dutch_treaty_of_1870_1871_desc:0 "The Anglo-Dutch treaties of 1871 forced us, among other things, to cede the critical West-African trade outpost of the Golden Coast. We shall disavow this unequal blow to our empire!"
 HOL_claim_former_east_indies_possessions:0 "Claim Former East-Indies Possessions"
 HOL_claim_former_east_indies_possessions_desc:0 "The Dutch East India company once controlled several key trade outposts and islands throughout Asia, that have, over the centuries, come under foreign rule. We shall no longer accept this loss in our rightful territory!"
 hol_expand_the_guianas_possession:0 "Expand the Guianas' Possession"
 no_shell_shocked_spectator_tt:0 "Does not have §YShell-Shocked Spectator of the Great War§!"
 hol_unlocks_integration_decisions_tt:0 "§GUnlocks§! decisions to integrate or claim several historic §YDutch§! territories."
 walloon_partisans:0 "Walloon Partisans"

 HOL_mio_trait_van_trappen_suspension:0 "Van Trappen Suspension"

 HOL_reclaim_the_crown_jewel:0 "Reclaim the Crown Jewel"
 HOL_reclaim_the_crown_jewel_desc:0 "The crown jewel colony is far too important for us to allow it to fall out of our hands, even if that means putting down an open rebellion against it."
 HOL_sunda_islands_staging_area:0 "Sunda Islands Staging Area"
 HOL_sunda_islands_staging_area_desc:0 "To manage the deployment of forces in [INS.GetNameDef], we must build the necessary infrastructure to effectively fight in the region."
 HOL_jungle_rangers:0 "Jungle Rangers"
 HOL_jungle_rangers_desc:0 "A significant portion of the terrain in [INS.GetNameDef] is thick jungles. If we are to effectively fight in the region, then we must train specialized forces suited to navigating these harsh terrains."
 HOL_anti_partisan_effort:0 "Anti-Partisan Effort"
 HOL_anti_partisan_effort_desc:0 "Partisans in our colonies are disrupting our forces. We must make a larger effort in hunting them down."
 HOL_evacuate_colonial_assets:0 "Evacuate Colonial Assets"
 HOL_evacuate_colonial_assets_desc:0 "With our colonies lost or in open rebellion, it is now time that we return any investments we made on them for our own benefit."
