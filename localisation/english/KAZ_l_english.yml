 KAZ_elizaveta_alikhanovna:0 "Elizaveta Saduakasova"
 KAZ_elizaveta_alikhanovna_leader_desc:0 "As the daughter of Alikhan Bukeikhanov, the first and only prime minister of the Alash Autonomy, which existed within the borders of Kazakhstan from 1917 to 1920, Zeynep, better known as Elizaveta, grew up in the shadow of her father's political legacy. Her father's association with the Alash Orda made her a person of interest to both Tsarist and Soviet authorities throughout her life, leading to repeated oppression and relocation across Russia. \n\nBorn Elizaveta (Zeynep) Alikhanovna Saduakasova in 1903 to parents of Kazakh and Russian descent in the city of Omsk. Elizaveta spent much of her youth moving throughout Tsarist Russia due to her father's reputation among the Russian aristocracy and secret police. During the final years of the Russian civil war and Alash Orda, Elizaveta found herself working for the Kirgiz Revolutionary Committee as a result of increased Alash-Soviet cooperation. This was short-lived, however, and her involvement within the committee ended following the dissolution of the Alash Orda. \n\nFollowing the recent restoration of the Kazakh state, many within the government chose her as a successor to her father. Her youth, lineage, and ties to both the Töre aristocracy and the Alash movement made her an obvious choice to the reinstated government, and thus led to her rise to power. Now finding herself leading a reborn nation of millions, one question remains within the government: Will she match her father's legacy, or lead the nation down a path of no return, for better or worse? Only time will tell."
